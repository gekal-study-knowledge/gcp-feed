  "b6e5d7d2946e0c1d753b649430ee87ba":
    "id": "b6e5d7d2946e0c1d753b649430ee87ba"
    "title": "Mitigating prompt injection attacks with a layered defense strategy"
    "link": "http://security.googleblog.com/2025/06/mitigating-prompt-injection-attacks.html"
    "published": "2025-06-14 01:03:00"
    "fetched": "2026-08-27 21:31:32"
    "summary": "<span class=\"byline-author\">Posted by Adam Gavish, Google GenAI Security Team</span><div><br /></div><div><span id=\"docs-internal-guid-673cf5ee-7fff-42cb-83fa-7f963bac5563\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">With the rapid adoption of generative AI, a new wave of threats is emerging across the industry with the aim of manipulating the AI systems themselves. One such emerging attack vector is indirect prompt injections. Unlike direct prompt injections, where an attacker directly inputs malicious commands into a prompt, indirect prompt injections involve hidden malicious instructions within external data sources. These may include emails, documents, or calendar invites that instruct AI to exfiltrate user data or execute other rogue actions. As more governments, businesses, and individuals adopt generative AI to get more done, this subtle yet potentially potent attack becomes increasingly pertinent across the industry, demanding immediate attention and robust security measures.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">At Google, our teams have a longstanding precedent of investing in a defense-in-depth strategy, including robust evaluation, threat analysis, </span><a href=\"https://research.google/pubs/an-introduction-to-googles-approach-for-secure-ai-agents/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">AI security best practices</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">, </span><a href=\"https://blog.google/technology/safety-security/googles-ai-red-team-the-ethical-hackers-making-ai-safer/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">AI red-teaming</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">, adversarial training, and model hardening for generative AI tools. This approach enables safer adoption of </span><a href=\"https://workspace.google.com/solutions/ai/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Gemini in Google Workspace</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> and the </span><a href=\"https://blog.google/products/gemini/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Gemini app</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> (we refer to both in this blog as “Gemini” for simplicity). Below we describe our prompt injection mitigation product strategy based on extensive research, development, and deployment of improved security mitigations.</span></p><br /><h3 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 16pt;\"><span face=\"Arial, sans-serif\" style=\"color: #434343; font-size: 14pt; vertical-align: baseline;\">A layered security approach</span><span face=\"Arial, sans-serif\" style=\"color: #434343; font-size: 14pt; vertical-align: baseline;\"><br /><br /></span></h3><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Google has taken a layered security approach introducing security measures designed for each stage of the prompt lifecycle. From Gemini 2.5 model hardening, to purpose-built machine learning (ML) models detecting malicious instructions, to system-level safeguards, we are meaningfully elevating the difficulty, expense, and complexity faced by an attacker. This approach compels adversaries to resort to methods that are either more easily identified or demand greater resources.&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Our model training with adversarial data significantly enhanced our defenses against indirect prompt injection attacks in Gemini 2.5 models (</span><a href=\"https://storage.googleapis.com/deepmind-media/Security%20and%20Privacy/Gemini_Security_Paper.pdf\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">technical details</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">). This inherent model resilience is augmented with additional defenses that we built directly into Gemini, including:&nbsp;</span></p><br /><ol style=\"margin-bottom: 0px; margin-top: 0px; padding-inline-start: 48px;\"><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">Prompt injection content classifiers</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">Security thought reinforcement</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">Markdown sanitization and suspicious URL redaction</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">User confirmation framework</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">End-user security mitigation notifications</span></p></li></ol><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">This layered approach to our security strategy strengthens the overall security framework for Gemini – throughout the prompt lifecycle and across diverse attack techniques.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">1. Prompt injection content classifiers</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Through collaboration with leading AI security researchers via </span><a href=\"https://bughunters.google.com/about/rules/google-friends/5238081279623168/abuse-vulnerability-reward-program-rules\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Google's AI Vulnerability Reward Program (VRP)</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">, we've curated one of the world’s most advanced catalogs of generative AI vulnerabilities and adversarial data. Utilizing this resource, we built and are in the process of rolling out proprietary machine learning models that can detect malicious prompts and instructions within various formats, such as emails and files, drawing from real-world examples. Consequently, when users query Workspace data with Gemini, the content classifiers filter out harmful data containing malicious instructions, helping to ensure a secure end-to-end user experience by retaining only safe content. For example, if a user receives an email in Gmail that includes malicious instructions, our content classifiers help to detect and disregard malicious instructions, then generate a safe response for the user. This is in addition to built-in defenses in Gmail that automatically block more than 99.9% of spam, phishing attempts, and malware.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 393px; overflow: hidden; width: 624px;\"><img height=\"393\" src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXePgxMV37fyKPlpp54xFHVtYLigC9Tt32y2B8dOEjRDzvL2xiwN9vx0-oNwPO19CMMNGHovtXa4dLS97sZSJICODbOrCyvKIOivcR_oJzTwM2SFG8DdFIoZPzKOvrV05G7_0fMSQw?key=qBd-QKEP_GpIw65Q_IOEgQ\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"624\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"color: #434343; font-size: 11pt; font-style: italic; vertical-align: baseline;\">A diagram of Gemini’s actions based on the detection of the malicious instructions by content classifiers.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">2. Security thought reinforcement</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">This technique adds targeted security instructions surrounding the prompt content to remind the large language model (LLM) to perform the user-directed task and ignore any adversarial instructions that could be present in the content. With this approach, we steer the LLM to stay focused on the task and ignore harmful or malicious requests added by a threat actor to execute indirect prompt injection attacks.</span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 393px; overflow: hidden; width: 624px;\"><img height=\"393\" src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfSfilVHvpF2aOIIc5I2S0mobMGoRwXb85XXRdyCq_j2ylJ30oAaY7KrIYtpcHWs21MxkrOtT1_zpVy-R4CSk3owlx896fckltob_Fc7t7K2TYk7XZjVMWDCY-O8RE4l9QbXxKK5w?key=qBd-QKEP_GpIw65Q_IOEgQ\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"624\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"color: #434343; font-size: 11pt; font-style: italic; vertical-align: baseline;\">A diagram of Gemini’s actions based on additional protection provided by the security thought reinforcement technique.&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">3. Markdown sanitization and suspicious URL redaction&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Our markdown sanitizer identifies external image URLs and will not render them, making the “EchoLeak” 0-click image rendering exfiltration </span><a href=\"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2025-32711\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">vulnerability</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> not applicable to Gemini. From there, a key protection against prompt injection and data exfiltration attacks occurs at the URL level. With external data containing dynamic URLs, users may encounter unknown risks as these URLs may be designed for indirect prompt injections and data exfiltration attacks. Malicious instructions executed on a user's behalf may also generate harmful URLs. With Gemini, our defense system includes suspicious URL detection based on </span><a href=\"https://safebrowsing.google.com/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Google Safe Browsing</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> to differentiate between safe and unsafe links, providing a secure experience by helping to prevent URL-based attacks. For example, if a document contains malicious URLs and a user is summarizing the content with Gemini, the suspicious URLs will be redacted in Gemini’s response.&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 391px; overflow: hidden; width: 624px;\"><img height=\"391\" src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeOQ69HwjpDYi9jCb_8alM2rBNC09Kx124kotYR8xzNSXygaNI-2eMBVdMYiBJ_aH-9tGFuXXphLbCg_g74nzI9VsEuSxpLrBGuwkjH2vt2j-WAgJz0dyD1EJt6qGugfBMtTHjPnqU?key=qBd-QKEP_GpIw65Q_IOEgQ\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"624\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-style: italic; vertical-align: baseline;\">Gemini in Gmail provides a summary of an email thread. In the summary, there is an unsafe URL. That URL is redacted in the response and is replaced with the text “suspicious link removed”.</span><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">4. User confirmation framework</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Gemini also features a contextual user confirmation system. This framework enables Gemini to require user confirmation for certain actions, also known as “Human-In-The-Loop” (HITL), using these responses to bolster security and streamline the user experience. For example, potentially risky operations like deleting a calendar event may trigger an explicit user confirmation request, thereby helping to prevent undetected or immediate execution of the operation.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 399px; overflow: hidden; width: 429px;\"><img height=\"399\" src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXegtOKYti58PeD2EGB9-tpYShPjKYJdHcv7I5u4s9WL0ZkzZy2P95ETc-RkdU1YUZWtNat9-WhfF5aekjmUiKxLNlV5yUYXUsTiXXj_RjmPd2Z50u4cUuwhFndXU5GslBudLDkGspk?key=qBd-QKEP_GpIw65Q_IOEgQ\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"429\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-style: italic; vertical-align: baseline;\">The Gemini app with instructions to delete all events on Saturday. Gemini responds with the events found on Google Calendar and asks the user to confirm this action.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">5. End-user security mitigation notifications</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">A key aspect to keeping our users safe is sharing details on attacks that we’ve stopped so users can watch out for similar attacks in the future. To that end, when security issues are mitigated with our built-in defenses, end users are provided with contextual information allowing them to learn more via dedicated help center articles. For example, if Gemini summarizes a file containing malicious instructions and one of Google’s prompt injection defenses mitigates the situation, a security notification with a “Learn more” link will be displayed for the user. Users are encouraged to become more familiar with our prompt injection defenses by reading the </span><a href=\"https://support.google.com/docs/answer/16204578\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Help Center article</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">.&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 362px; overflow: hidden; width: 161px;\"><img height=\"362\" src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfW5ATEo44XQK2kcE3wjUkVhF719xvF-rNzKu_1rQNwWuToygqGObc1dlJGFHobh1-94FMUbpJKWeng3giTTfse17sZHnWnm0udVBafKOKmdzstST24BJnkALrWGyCz4qD08t-Q_w?key=qBd-QKEP_GpIw65Q_IOEgQ\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"161\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-style: italic; vertical-align: baseline;\">Gemini in Docs with instructions to provide a summary of a file. Suspicious content was detected and a response was not provided. There is a yellow security notification banner for the user and a statement that Gemini’s response has been removed, with a “Learn more” link to </span><a href=\"https://support.google.com/docs/answer/16204578\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; font-style: italic; vertical-align: baseline;\">a relevant Help Center article</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-style: italic; vertical-align: baseline;\">.</span></p><h3 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 16pt;\"><span face=\"Arial, sans-serif\" style=\"color: #434343; font-size: 14pt; vertical-align: baseline;\">Moving forward</span></h3><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Our comprehensive prompt injection security strategy strengthens the overall security framework for Gemini. Beyond the techniques described above, it also involves rigorous testing through manual and automated red teams, generative AI security BugSWAT events, strong security standards like our Secure AI Framework (SAIF), and partnerships with both external researchers via the Google AI Vulnerability Reward Program (VRP) and industry peers via the Coalition for Secure AI (CoSAI). Our commitment to trust includes collaboration with the security community to responsibly disclose AI security vulnerabilities, share our latest threat intelligence on ways we see bad actors trying to leverage AI, and offering insights into our work to build stronger prompt injection defenses.&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Working closely with industry partners is crucial to building stronger protections for all of our users. To that end, we’re fortunate to have strong collaborative partnerships with numerous researchers, such as Ben Nassi (Confidentiality), Stav Cohen (Technion), and Or Yair (SafeBreach), as well as other AI Security researchers participating in our BugSWAT events and AI VRP program. We appreciate the work of these researchers and others in the community to help us red team and refine our defenses.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">We continue working to make upcoming Gemini models inherently more resilient and add additional prompt injection defenses directly into Gemini later this year. To learn more about Google’s progress and research on generative AI threat actors, attack techniques, and vulnerabilities, take a look at the following resources:</span></p><br /><ul style=\"margin-bottom: 0px; margin-top: 0px; padding-inline-start: 48px;\"><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><a href=\"https://www.rsaconference.com/usa/google-cloud-security\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Beyond Speculation: Data-Driven Insights into AI and Cybersecurity</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\"> (RSAC 2025 conference keynote) from Google’s Threat Intelligence Group (GTIG)</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/adversarial-misuse-generative-ai?e=48754805\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Adversarial Misuse of Generative AI</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\"> (blog post) from Google’s Threat Intelligence Group (GTIG)</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><a href=\"https://research.google/pubs/an-introduction-to-googles-approach-for-secure-ai-agents/\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Google's Approach for Secure AI Agents</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\"> (white paper) from Google’s Secure AI Framework (SAIF) team</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><a href=\"https://deepmind.google/discover/blog/advancing-geminis-security-safeguards/\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Advancing Gemini's security safeguards</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\"> (blog post) from Google’s DeepMind team</span></p></li><li dir=\"ltr\" style=\"font-family: Arial, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><a href=\"https://storage.googleapis.com/deepmind-media/Security%20and%20Privacy/Gemini_Security_Paper.pdf\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Lessons from Defending Gemini Against Indirect Prompt Injections</span></a><span style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\"> </span><span style=\"font-size: 11pt; vertical-align: baseline;\">(white paper) from Google’s DeepMind team</span></p></li></ul></span></div>"
"last_updated": "2026-08-27 21:31:32 JST"
