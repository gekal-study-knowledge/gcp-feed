    "id": "2ac2c15d0fec7b223bd0c9c1357e3d81"
    "title": "How Android provides the most effective protection to keep you safe from mobile scams"
    "link": "http://security.googleblog.com/2025/10/how-android-protects-you-from-scams.html"
    "published": "2025-10-31 01:59:00"
    "fetched": "2026-08-27 21:31:32"
    "summary": "<span class=\"byline-author\">Posted by Lyubov Farafonova, Product Manager, Phone by Google; Alberto Pastor Nieto, Sr. Product Manager Google Messages and RCS Spam and Abuse; Vijay Pareek, Manager, Android Messaging Trust and Safety</span>\n\n<div class=\"separator\" style=\"clear: both;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj59HzOfBpyoazdPtNYMOTMBhp24wr0p_9Ure4iy0yf3iAwf4mBjkpazMwYBDSe-uoZbM8swKID7VX-mELsgBHGcuF_gAcguNnVC8IXToTsJT8cMUaCxtii13cDTj5j7HDwsvyaGEb3NTU1Ihg6qcK6b9jvE8jpRP_GaeJsIuFU_FW7xR81CHSxhinTrirL/s1600/Banner%20%282%29.png\" style=\"display: block; padding: 1em 0; text-align: center;\"><img alt=\"\" border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj59HzOfBpyoazdPtNYMOTMBhp24wr0p_9Ure4iy0yf3iAwf4mBjkpazMwYBDSe-uoZbM8swKID7VX-mELsgBHGcuF_gAcguNnVC8IXToTsJT8cMUaCxtii13cDTj5j7HDwsvyaGEb3NTU1Ihg6qcK6b9jvE8jpRP_GaeJsIuFU_FW7xR81CHSxhinTrirL/s1600/Banner%20%282%29.png\" /></a></div>\n\nAs Cybersecurity Awareness Month wraps up, we’re focusing on one of today's most pervasive digital threats: mobile scams. In the last 12 months, fraudsters have used advanced AI tools to create more convincing schemes, resulting in over $400 billion in stolen funds globally.<strong><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn1\" id=\"fnref1\">¹</a></strong>\n</p>\n<p>\nFor years, Android has been on the frontlines in the battle against scammers, using the best of Google AI to build proactive, multi-layered protections that can anticipate and block scams before they reach you. Android’s scam defenses protect users around the world from over 10 billion suspected malicious calls and messages every month<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn2\" id=\"fnref2\">2</a></sup></strong>. In addition, Google continuously performs safety checks to maintain the integrity of the RCS service. In the past month alone, this ongoing process blocked over 100 million suspicious numbers from using RCS, stopping potential scams before they could even be sent. \n</p>\n<p>\nTo show how our scam protections work in the real world, we asked users and independent security experts to compare how well Android and iOS protect you from these threats. We're also releasing a new <a href=\"https://services.google.com/fh/files/misc/android_2025_text_based_scams_report.pdf\">report</a> that explains how modern text scams are orchestrated, helping you understand the tactics fraudsters use and how to spot them. \n</p>\n<p>\n<strong>Survey shows Android users’ confidence in scam protections</strong>\n</p>\n<p>\nGoogle and YouGov<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn3\" id=\"fnref3\">3</a></sup></strong> surveyed 5,000 smartphone users across the U.S., India, and Brazil about their scam experiences. The findings were clear: Android users reported receiving fewer scam texts and felt more confident that their device was keeping them safe.\n</p>\n<ul>\n\n<li>Android users were 58% more likely than iOS users to say they had not received any scam texts in the week prior to the survey. The advantage was even stronger on Pixel, where users were 96% more likely than iPhone owners to report zero scam texts<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn4\" id=\"fnref4\">4</a></sup></strong>.</li>\n\n<li>At the other end of the spectrum, iOS users were 65% more likely than Android users to report receiving three or more scam texts in a week. The difference became even more pronounced when comparing iPhone to Pixel, with iPhone users 136% more likely to say they had received a heavy volume of scam messages<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn4\" id=\"fnref4\">4</a></sup></strong>.</li>\n\n<li>Android users were 20% more likely than iOS users to describe their device’s scam protections as “very effective” or “extremely effective.” When comparing Pixel to iPhone, iPhone users were 150% more likely to say their device was not effective at all in stopping mobile fraud.</li>\n</ul>\n<div class=\"separator\" style=\"clear: both;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgMj0EnJVSpae54mA_dVpSG-1Tqgi1ulY3n6S5btZwECwLr43cynKktoK2JHYUcWS1wh3WjFiLavHoASFDKEtwypx87fsAD4M_1Q6Sv0f2SdsemZgDsR2GpO7qu5Wh3aP4SEspnECA9TX40pay9_RRJL4uBLj2_MT4zL2svEXLNqHDaw7tEzQYuYUTPLu2W/s1600/image1.png\" style=\"display: block; padding: 1em 0; text-align: center;\"><img alt=\"\" border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgMj0EnJVSpae54mA_dVpSG-1Tqgi1ulY3n6S5btZwECwLr43cynKktoK2JHYUcWS1wh3WjFiLavHoASFDKEtwypx87fsAD4M_1Q6Sv0f2SdsemZgDsR2GpO7qu5Wh3aP4SEspnECA9TX40pay9_RRJL4uBLj2_MT4zL2svEXLNqHDaw7tEzQYuYUTPLu2W/s1600/image1.png\" /></a></div>\n<p style=\"text-align: center;\">\n<em>YouGov study findings on users’ experience with scams on Android and iOS</em>\n</p>\n\n<strong>Security researchers and analysts highlight Android’s AI-driven safeguards against sophisticated scams</strong>\n</p>\n<p>\nIn a recent <a href=\"https://counterpointresearch.com/en/insights/assessing-the-state-of-ai-powered-mobile-security-blog\">evaluation</a> by Counterpoint Research<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn5\" id=\"fnref5\">5</a></sup></strong>, a global technology market research firm, Android smartphones were found to have the most AI-powered protections. The independent study compared the latest Pixel, Samsung, Motorola, and iPhone devices, and found that Android provides comprehensive AI-driven safeguards across ten key protection areas, including email protections, browsing protections, and on-device behavioral protections. By contrast, iOS offered AI-powered protections in only two categories. You can see the full comparison in the visual below.\n</p>\n\n<div class=\"separator\" style=\"clear: both;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiv-HHEIHmk6gHPlVaDVVK09MrNMSdiEpjK0YD8B_xaWly_jhnUM0CU3k1zX1jhXGn_rlY6m2W9D8lqp2LwejXMTwucMRVFMe1AJfI0KGLFi8t9AyIv6Aj4M2xyA5d9iDDTKPsS7MmRAyeuMtTQvWpWNkYPPb5MkBq0ADYd5fSM3mlLD3KEzVhxpyVQpTZU/s1600/Evaluation%20of%20AI-Powered%20Protections_v3%20%282%29.png\" style=\"display: block; padding: 1em 0; text-align: center;\"><img alt=\"\" border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiv-HHEIHmk6gHPlVaDVVK09MrNMSdiEpjK0YD8B_xaWly_jhnUM0CU3k1zX1jhXGn_rlY6m2W9D8lqp2LwejXMTwucMRVFMe1AJfI0KGLFi8t9AyIv6Aj4M2xyA5d9iDDTKPsS7MmRAyeuMtTQvWpWNkYPPb5MkBq0ADYd5fSM3mlLD3KEzVhxpyVQpTZU/s1600/Evaluation%20of%20AI-Powered%20Protections_v3%20%282%29.png\" /></a></div>\n<em>Counterpoint Research comparison of Android and iOS AI-powered protections</em>\n</p>\n</p>\n<p>\nCybersecurity firm Leviathan Security Group conducted a funded <a href=\"https://www.leviathansecurity.com/blog/october-2025-mobile-platform-security-amp-fraud-prevention-assessment\">evaluation</a><strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn6\" id=\"fnref6a\">6</a></sup></strong> of scam and fraud protection on the iPhone 17, Moto Razr+ 2025, Pixel 10 Pro, and Samsung Galaxy Z Fold 7. Their analysis found that Android smartphones, led by the Pixel 10 Pro, provide the highest level of default scam and fraud protection.The report particularly noted Android's robust call screening, scam detection, and real-time scam warning authentication capabilities as key differentiators. Taken together, these independent expert assessments conclude that Android’s AI-driven safeguards provide more comprehensive and intelligent protection against mobile scams.\n</p>\n\n<div class=\"separator\" style=\"clear: both;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEixC_CCs8LbIjN0Rbj5us-GUluye7KEBc3EhhKpcfsDFQQ7i9Id64AcRRlgVQqJEc1TwzuFR82J3r4_RPfhZTQmKzLfxJDzIXjwST7v5m624EJM_lGFK8uib3p_OroTcEeRiGqVFNHtk8608LYyPN2Y4ui_uQv77sj3NVlQh3J6WKjdOV7tLVv8NwwWPPaV/s1600/Inline%20chart_Scam%20&amp;%20Fraud_v4%20%281%29%20%282%29.png\" style=\"display: block; padding: 1em 0; text-align: center;\"><img alt=\"\" border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEixC_CCs8LbIjN0Rbj5us-GUluye7KEBc3EhhKpcfsDFQQ7i9Id64AcRRlgVQqJEc1TwzuFR82J3r4_RPfhZTQmKzLfxJDzIXjwST7v5m624EJM_lGFK8uib3p_OroTcEeRiGqVFNHtk8608LYyPN2Y4ui_uQv77sj3NVlQh3J6WKjdOV7tLVv8NwwWPPaV/s1600/Inline%20chart_Scam%20&amp;%20Fraud_v4%20%281%29%20%282%29.png\" /></a></div>\n<em>Leviathan Security Group comparison of scam protections across various devices</em>\n</p>\n<p>\n<strong>Why Android users see fewer scams</strong>\n</p>\n<p>\nAndroid’s proactive protections work across the platform to help you stay ahead of threats with the best of Google AI. \n</p>\n<p>\nHere’s how they work:\n</p>\n<ul>\n\n<li><strong>Keeping your messages safe: </strong><a href=\"https://play.google.com/store/apps/details?id=com.google.android.apps.messaging\">Google Messages</a> automatically filters known spam by analyzing sender reputation and message content, moving suspicious texts directly to your \"spam & blocked\" folder to keep them out of sight. For more complex threats, Scam Detection uses on-device AI to analyze messages from unknown senders for patterns of conversational scams (like pig butchering) and provide real-time warnings<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn6\" id=\"fnref6a\">6</a></sup></strong>.  This helps secure your privacy while providing a robust shield against text scams. As an extra safeguard, Google Messages also helps block suspicious links in messages that are determined to be spam or scams.</li>\n\n<li><strong>Combatting phone call scams:</strong> <a href=\"https://play.google.com/store/apps/details?id=com.google.android.dialer\">Phone by Google</a> automatically blocks known spam calls so your phone never even rings, while Call Screen<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn5\" id=\"fnref5b\">5</a></sup></strong> can answer the call on your behalf to identify fraudsters. If you answer, the protection continues with Scam Detection, which uses on-device AI to provide real-time warnings for suspicious conversational patterns<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn6\" id=\"fnref6b\">6</a></sup></strong>. This processing is completely ephemeral, meaning no call content is ever saved or leaves your device. Android also helps stop social engineering during the call itself by blocking high-risk actions<strong><sup><a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fn7\" id=\"fnref7c\">7</a> </sup></strong>like installing untrusted apps or disabling security settings, and warns you if your screen is being shared unknowingly.</li>\n</ul>\n<p>\nThese safeguards are built directly into the core of Android, alongside other features like real-time app scanning in <a href=\"https://support.google.com/googleplay/answer/2812853?hl=en\">Google Play Protect</a> and enhanced <a href=\"https://support.google.com/chrome/answer/9890866?hl=en&amp;co=GENIE.Platform%3DAndroid\">Safe Browsing</a> in Chrome using LLMs. With Android, you can trust that you have intelligent, multi-layered protection against scams working for you.\n</p>\n<p>\n<strong>Android is always evolving to keep you one step ahead of scams</strong> \n</p>\n<p>\nIn a world of evolving digital threats, you deserve to feel confident that your phone is keeping you safe. That’s why we use the best of Google AI to build intelligent protections that are always improving and work for you around the clock, so you can connect, browse, and communicate with peace of mind. \n</p>\n<p>\n<em>See these protections in action in our new <a href=\"https://services.google.com/fh/files/misc/android_mobile_scam_infographic.pdf\">infographic</a> and learn more about phone call scams in our <a href=\"https://services.google.com/fh/files/misc/2025_phone_by_google_call_scam_report.pdf\">2025 Phone by Google Scam Report</a>.</em>\n</p>\n<hr />\n<p id=\"fn1\">\n<em>1: Data from <a href=\"https://www.gasa.org/research\">Global Anti-Scam Alliance</a>, October 2025 <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref1\">↩</a></em>\n</p>\n<p id=\"fn2\">\n<em>2: This total comprises all instances where a message or call was proactively blocked or where a user was alerted to potential spam or scam activity. <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref2\">↩</a></em>\n</p>\n<p id=\"fn3\">\n<em>3: Google/YouGov survey, July-August, n=5,100 (1,700 each in the US, Brazil and India), with adults who use their smartphones daily and who have been exposed to a scam or fraud attempt on their smartphone. Survey data have been weighted to smartphone population adults in each country. <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref3\">↩</a></em>\n</p>\n<p id=\"fn4\">\n<em>4: Among users who use the default texting app on their smartphone <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref4\">↩</a></em>\n</p>\n<p id=\"fn5\">\n<em>5: Google/Counterpoint Research, “Assessing the State of AI-Powered Mobile Security”, Oct. 2025; based on comparing the Pixel 10 Pro, iPhone 17 Pro, Samsung Galaxy S25 Ultra, OnePlus 13, Motorola Razr+ 2025. Evaluation based on no-cost smartphone features enabled by default. Some features may not be available in all countries. <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref5\">↩</a></em>\n</p>\n<p id=\"fn6\">\n<em>6: Google/Leviathan Security Group, “October 2025 Mobile Platform Security & Fraud Prevention Assessment”, Oct. 2025; based on comparing the Pixel 10 Pro, iPhone 17 Pro, Samsung Galaxy Z Fold 7 and Motorola Razr+ 2025. Evaluation based on no-cost smartphone features enabled by default. Some features may not be available in all countries. <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref6a\">↩</a> <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref6b\">↩</a></em>\n</p>\n<p id=\"fn7\">\n<em>7: Accuracy may vary. Availability varies. <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref7a\">↩</a> <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref7b\">↩</a> <a href=\"http://feeds.feedburner.com/GoogleOnlineSecurityBlog#fnref7c\">↩</a></em>\n</p>"
