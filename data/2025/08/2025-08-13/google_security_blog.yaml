    "title": "Android’s pKVM Becomes First Globally Certified Software to Achieve Prestigious SESIP Level 5 Security Certification"
    "link": "http://security.googleblog.com/2025/08/Android-pKVM-Certified-SESIP-Level-5.html"
    "published": "2025-08-13 01:00:00"
    "fetched": "2026-08-27 21:31:32"
    "summary": "<span class=\"byline-author\">Posted by Dave Kleidermacher, VP Engineering, Android Security & Privacy</span>\n\n<p>\nToday marks a watershed moment and new benchmark for open-source security and the future of consumer electronics. Google is proud to announce that protected KVM (pKVM), the hypervisor that powers the Android Virtualization Framework, has officially achieved <a href=\"https://trustcb.com/download/?wpdmdl=5353\">SESIP Level 5 certification</a>. This makes pKVM the first software security system designed for large-scale deployment in consumer electronics to meet this assurance bar. <br /><h3><strong>Supporting Next-Gen Android Features</strong></h3>\n</p>\n<p>\nThe implications for the future of secure mobile technology are profound. With this level of security assurance, Android is now positioned to securely support the next generation of high-criticality isolated workloads. This includes vital features, such as on-device AI workloads that can operate on ultra-personalized data, with the highest assurances of privacy and integrity.\n</p>\n<p>\nThis certification required a hands-on evaluation by <a href=\"https://www.dekra.com/en/product-testing-and-certification-programs/\">Dekra</a>, a globally recognized cybersecurity certification lab, which conducted an evaluation against the <a href=\"https://trustcb.com/iot/sesip/\">TrustCB SESIP scheme</a>, compliant to <a href=\"https://www.nen.nl/en/nen-en-17927-2023-en-317686\">EN-17927</a>. Achieving Security Evaluation Standard for IoT Platforms (SESIP) Level 5 is a landmark because it incorporates AVA_VAN.5, the highest level of vulnerability analysis and penetration testing under the ISO 15408 (Common Criteria) standard. A system certified to this level has been evaluated to be resistant to highly skilled, knowledgeable, well-motivated, and well-funded attackers who may have insider knowledge and access.\n</p>\n<p>\nThis certification is the cornerstone of the next-generation of Android’s multi-layered security strategy. Many of the TEEs (Trusted Execution Environments) used in the industry have not been formally certified or have only achieved lower levels of security assurance. This inconsistency creates a challenge for developers looking to build highly critical applications that require a robust and verifiable level of security. The certified pKVM changes this paradigm entirely. It provides a single, open-source, and exceptionally high-quality firmware base that all device manufacturers can build upon.\n</p>\n<p>\nLooking ahead, Android device manufacturers will be required to use isolation technology that meets this same level of security for various security operations that the device relies on. Protected KVM ensures that every user can benefit from a consistent, transparent, and verifiably secure foundation.<br /><h3>\n  \n<strong>A Collaborative Effort</strong></h3>\n</p>\n<p>\nThis achievement represents just one important aspect of the immense, multi-year dedication from the Linux and KVM developer communities and multiple engineering teams at Google developing pKVM and <a href=\"https://source.android.com/docs/core/virtualization\">AVF</a>. We look forward to seeing the open-source community and Android ecosystem continue to build on this foundation, delivering a new era of high-assurance mobile technology for users.\n</p>"
