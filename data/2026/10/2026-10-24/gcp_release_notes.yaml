    "summary": "<h2 class=\"release-note-product-title\">App Engine flexible environment .NET</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#net\">.NET 6 and later</a>: <code>6.0.428</code>, <code>8.0.415</code>, <code>10.0.100</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine flexible environment Go</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#go\">Go 1.24 and later</a>: <code>1.24.13</code>, <code>1.25.14</code>, <code>1.26.10</code>, <code>1.27.3</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine flexible environment Java</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#java\">Java 17 and later</a>: <code>17.0.20_101</code>, <code>21.0.12_101.0.LTS</code>, <code>25.0.5_8.0.LTS</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine flexible environment Node.js</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#nodejs\">Node.js 22 and later</a>: <code>22.23.4</code>, <code>24.22.1</code>, <code>26.12.1</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine flexible environment PHP</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#php\">PHP 8.2 and later</a>: <code>8.2.35</code>, <code>8.3.36</code>, <code>8.4.27</code>, <code>8.5.12</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine flexible environment Python</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#python\">Python 3.10 and later</a>: <code>3.10.22</code>, <code>3.11.17</code>, <code>3.12.15</code>, <code>3.13.15</code>, <code>3.14.6</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine flexible environment Ruby</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#ruby\">Ruby 3.3 and later</a>: <code>3.3.12</code>, <code>3.4.11</code>, <code>4.0.7</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Go</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#go\">Go 1.24 and later</a>: <code>1.24.13</code>, <code>1.25.14</code>, <code>1.26.10</code>, <code>1.27.3</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Java</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#java\">Java 17 and later</a>: <code>17.0.20_101</code>, <code>21.0.12_101.0.LTS</code>, <code>25.0.5_8.0.LTS</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Node.js</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#nodejs\">Node.js 22 and later</a>: <code>22.23.4</code>, <code>24.22.1</code>, <code>26.12.1</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment PHP</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#php\">PHP 8.2 and later</a>: <code>8.2.35</code>, <code>8.3.36</code>, <code>8.4.27</code>, <code>8.5.12</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Python</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#python\">Python 3.10 and later</a>: <code>3.10.22</code>, <code>3.11.17</code>, <code>3.12.15</code>, <code>3.13.15</code>, <code>3.14.6</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Ruby</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#ruby\">Ruby 3.3 and later</a>: <code>3.3.12</code>, <code>3.4.11</code>, <code>4.0.7</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">Buildpacks</h2>\n<h3>Security</h3>\n<p>The following runtime languages contain important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#go\">Go 1.24 and later</a>: <code>1.24.13</code>, <code>1.25.14</code>, <code>1.26.10</code>, <code>1.27.3</code></li>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#node.js\">Node.js 22 and later</a>: <code>22.23.4</code>, <code>24.22.1</code>, <code>26.12.1</code></li>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#java\">Java 17 and later</a>: <code>17.0.20_101</code>, <code>21.0.12_101.0.LTS</code>, <code>25.0.5_8.0.LTS</code></li>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#php\">PHP 8.2 and later</a>: <code>8.2.35</code>, <code>8.3.36</code>, <code>8.4.27</code>, <code>8.5.12</code></li>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#python\">Python 3.10 and later</a>: <code>3.10.22</code>, <code>3.11.17</code>, <code>3.12.15</code>, <code>3.13.15</code>, <code>3.14.6</code></li>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#ruby\">Ruby 3.3 and later</a>: <code>3.3.12</code>, <code>3.4.11</code>, <code>4.0.7</code></li>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#.net\">.NET 6 and later</a>: <code>6.0.428</code>, <code>8.0.415</code>, <code>10.0.100</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">Cloud Run</h2>\n<h3>Security</h3>\n<p>The following runtime languages contain important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#go\">Go 1.24 and later</a>: <code>1.24.13</code>, <code>1.25.14</code>, <code>1.26.10</code>, <code>1.27.3</code></li>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#node.js\">Node.js 22 and later</a>: <code>22.23.4</code>, <code>24.22.1</code>, <code>26.12.1</code></li>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#java\">Java 17 and later</a>: <code>17.0.20_101</code>, <code>21.0.12_101.0.LTS</code>, <code>25.0.5_8.0.LTS</code></li>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#php\">PHP 8.2 and later</a>: <code>8.2.35</code>, <code>8.3.36</code>, <code>8.4.27</code>, <code>8.5.12</code></li>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#python\">Python 3.10 and later</a>: <code>3.10.22</code>, <code>3.11.17</code>, <code>3.12.15</code>, <code>3.13.15</code>, <code>3.14.6</code></li>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#ruby\">Ruby 3.3 and later</a>: <code>3.3.12</code>, <code>3.4.11</code>, <code>4.0.7</code></li>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#.net\">.NET 6 and later</a>: <code>6.0.428</code>, <code>8.0.415</code>, <code>10.0.100</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>\n<h2 class=\"release-note-product-title\">Cloud Run functions</h2>\n<h3>Security</h3>\n<p>The following runtime languages contain important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#go\">Go 1.24 and later</a>: <code>1.24.13</code>, <code>1.25.14</code>, <code>1.26.10</code>, <code>1.27.3</code></li>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#node.js\">Node.js 22 and later</a>: <code>22.23.4</code>, <code>24.22.1</code>, <code>26.12.1</code></li>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#java\">Java 17 and later</a>: <code>17.0.20_101</code>, <code>21.0.12_101.0.LTS</code>, <code>25.0.5_8.0.LTS</code></li>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#php\">PHP 8.2 and later</a>: <code>8.2.35</code>, <code>8.3.36</code>, <code>8.4.27</code>, <code>8.5.12</code></li>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#python\">Python 3.10 and later</a>: <code>3.10.22</code>, <code>3.11.17</code>, <code>3.12.15</code>, <code>3.13.15</code>, <code>3.14.6</code></li>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#ruby\">Ruby 3.3 and later</a>: <code>3.3.12</code>, <code>3.4.11</code>, <code>4.0.7</code></li>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#.net\">.NET 6 and later</a>: <code>6.0.428</code>, <code>8.0.415</code>, <code>10.0.100</code></li>\n</ul>\n<p>The following stacks and their underlying operating system packages have also been updated:</p>\n<ul>\n<li><code>google-22</code>, <code>google-22-full</code></li>\n<li><code>google-24</code>, <code>google-24-full</code></li>\n</ul>\n<p>Take immediate protective action by rebuilding and redeploying your resources with updated dependencies.</p>\n<p>See <a href=\"https://docs.cloud.google.com/support/bulletins\">Security bulletins for Google Cloud</a> for more information.</p>"
