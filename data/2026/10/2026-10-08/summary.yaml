"overview": |
  この日は 9 件 (重複を除くと 7 件) で、Gemini at Work 2026 の発表群と、超低レイテンシー取引に向けた U4 コンピュートが中心でした。資本市場では予測可能な性能と低いレイテンシーの上に運用が成り立っており、パケットのタイミングのわずかな揺らぎがキューの優先順位と約定を変えてしまいます。一方で取引所とその参加者は、電力や物理的なラック容量の制約、長いハードウェア調達サイクルといった、従来のオンプレミスのデータセンターにおける制約に直面しています。そのため世界の資本市場は、物理的なコロケーションが持つ速度と決定性に、クラウドの動的なスケーラビリティと自動化を組み合わせることを求めるようになってきました。Google Cloud Next '26 で発表された Ultra Low Latency (ULL) ソリューションが一般提供となり、あわせて新しい U4 マシンファミリーも一般提供となりました。ULL ソリューションは 3 つのインフラの柱から成ります。1 つ目はハードウェアレベルのネットワーキングで、信頼できるマーケットデータのフィードのために、ハードウェアに基づくスケーラブルなマルチキャストのデータ配信を提供します。2 つ目は高度なネットワークの可観測性で、ハードウェアレベルの時刻精度で動的にネットワークトラフィックをキャプチャし、主たるトラフィックの性能に影響を与えずに、一貫した監査、マーケットのリプレイ、約定の厳密な検証を可能にします。3 つ目は決定的な高性能コンピュートで、レイテンシーが重要な実行階層の処理を、毎回きわめて予測可能で一定の時間で行います。これらを合わせることで、取引所と市場参加者はいくつもの技術的な能力を得られます。専用のベアメタルのコンピュートは物理ホストのリソースへ直接アクセスできるため、ジッターを最小限に抑え、マーケットデータのフィードと注文のルーティングに予測可能で低いレイテンシーの実行をもたらします。ストレージはホスト上でのリアルタイムの取引とティックのログ記録をローカルの Titanium SSD が担い、永続的なマーケットデータの保管にはスケーラブルな Google Cloud Hyperdisk を組み合わせられます。Gemini at Work 2026 では、Thomas Kurian の基調講演をもとに Gemini エージェントが発表されました。質問に答え、ナレッジワークを処理し、画像やメディアを作り、コードを書いて実行する、仕事のための単一の普遍的なエージェントという位置づけです。Workspace ではインラインで動作し、Gmail、Drive、Docs、Slides、Sheets、Chat、Calendar の中で直接、他の場所と同じメモリ・スキル・統制を保ったまま使えます。あわせて、技術チームも日常の業務ユーザーも平易な言葉の質問から数分で実用的な運用の知見を得られる新しいデータと分析のスキル、金融サービスと法務のチーム向けに専門のツール・スキル・コネクタ・知識を備える業界別の特化、ID とポリシーの管理・認可と権限の統制・安全なサンドボックス・ネットワークゲートウェイによるエージェントの保護とガバナンス、そしてマルチモデルのオーケストレーションや Smart Routing、リアルタイムの支出上限といったコスト統制が示されました。中小企業向けには、数百万の中小企業がすでに Gemini Enterprise・Google Ads・Google Workspace で Google の AI を使っており、Google Cloud の AI ツールの利用が前年比で 5 倍以上に伸びていることを踏まえ、Gemini がプロジェクトマネージャー・経理担当・在庫管理担当・マーケティングコンサルタントのような具体的な役割を担う柔軟なチームメンバーとして働けることが紹介されました。公共部門では、Google Public Sector がニューヨーク州立大学 (SUNY) と協力して SUNY AI Platform を立ち上げました。Google Cloud と Gemini Enterprise の上に作られた安全な AI と高性能計算の環境で、まず SUNY の研究集約型のキャンパス 9 校で利用できます。SUNY の研究者は気象予測の改善、水質問題の検出、がん治療のための DNA シーケンシング、診断を助ける高解像度の脳スキャンの処理といった課題に取り組んでおり、仮説から発見までを速め、学生と労働力を AI 主導の経済に備えさせることを狙いとしています。地域の事例としては、アイルランドの組織が Gemini Enterprise で初期のプロトタイプから本番運用へ進んでいることが紹介されました。Implement Consulting Group の報告では、公共・民間のリーダーが世界の AI 市場に 400 億〜450 億ユーロの経済的な可能性を見込んでおり、2026 年後半に 2 度目の EU 理事会議長国を務めるアイルランドは、生産性とイノベーションを高める国家デジタル・AI 戦略を掲げています。分析では、PayPal が分析ワークロードを従来の Hadoop のオンプレミス基盤から Google の Managed Service for Apache Spark へ移行した事例が公開されました。急成長と買収によって分析基盤が不均一になり、運用のオーバーヘッドと性能のボトルネックが増え、小売のピークイベントやグローバルなリリースに向けたスケールアップには数か月の計画と手作業のハードウェアプロビジョニングが必要で、速度とコストの妥協を迫られていました。移行の理由は、クラスタを数分でデプロイして処理ニーズに応じてスケールできること、Apache Spark へ標準化してチーム間の一貫性を得て運用の複雑さを減らせること、Google Cloud の他のサービスとシームレスに統合できることです。リリースノートでは、Cloud SQL for MySQL がブルーグリーンデプロイに対応しました (プレビュー)。MySQL 8.0 から 8.4 へのメジャーバージョンアップグレードや、ハードウェアや構成の変更の準備といった作業を、ダウンタイムを最小限に抑えて進められます。既存の本番環境 (ブルー) を写した別のステージング環境 (グリーン) を Cloud SQL が作り、ブルーからグリーンへ継続的な論理レプリケーションを維持するため、本番のトラフィックに影響を与えずにグリーンでアプリケーションの互換性と性能を検証したうえで、わずかなダウンタイムでグリーンへ切り替えられます。
