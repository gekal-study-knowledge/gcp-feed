"overview": |
  この日は 1 件で、超低レイテンシー取引に向けた U4 コンピュートの発表でした。資本市場では予測可能な性能と低いレイテンシーの上に運用が成り立っており、パケットのタイミングのわずかな揺らぎがキューの優先順位と約定を変えてしまいます。一方で取引所とその参加者は、電力や物理的なラック容量の制約、長いハードウェア調達サイクルといった、従来のオンプレミスのデータセンターにおける制約に直面しています。そのため世界の資本市場は、物理的なコロケーションが持つ速度と決定性に、クラウドの動的なスケーラビリティと自動化を組み合わせることを求めるようになってきました。Google Cloud Next '26 で発表された Ultra Low Latency (ULL) ソリューションが一般提供となり、あわせて新しい U4 マシンファミリーも一般提供となりました。ULL ソリューションは 3 つのインフラの柱から成ります。1 つ目はハードウェアレベルのネットワーキングで、信頼できるマーケットデータのフィードのために、ハードウェアに基づくスケーラブルなマルチキャストのデータ配信を提供します。2 つ目は高度なネットワークの可観測性で、ハードウェアレベルの時刻精度で動的にネットワークトラフィックをキャプチャし、主たるトラフィックの性能に影響を与えずに、一貫した監査、マーケットのリプレイ、約定の厳密な検証を可能にします。3 つ目は決定的な高性能コンピュートで、レイテンシーが重要な実行階層の処理を、毎回きわめて予測可能で一定の時間で行います。これらを合わせることで、取引所と市場参加者はいくつもの技術的な能力を得られます。専用のベアメタルのコンピュートは物理ホストのリソースへ直接アクセスできるため、ジッターを最小限に抑え、マーケットデータのフィードと注文のルーティングに予測可能で低いレイテンシーの実行をもたらします。ストレージはホスト上でのリアルタイムの取引とティックのログ記録をローカルの Titanium SSD が担い、永続的なマーケットデータの保管にはスケーラブルな Google Cloud Hyperdisk を組み合わせられます。
