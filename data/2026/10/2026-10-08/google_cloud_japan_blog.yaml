    "title": "分析の高速化: PayPal の Managed Service for Apache Spark 導入事例"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/paypals-journey-with-managed-service-for-apache-spark/"
    "published": "2026-10-08 11:00:00"
    "fetched": "2026-10-08 19:02:00"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 2 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/paypals-journey-with-managed-service-for-apache-spark?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データドリブンな世界において、PayPal が優位性を維持するためには、タイムリーで実用的な分析情報を提供できる機能が不可欠です。PayPal では、不正行為の検出からユーザー エクスペリエンスの向上まで、あらゆる場面でデータを活用しています。データは、エージェント ソリューションとエクスペリエンスの可能性を引き出すためにも中心的な役割を果たします。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、当社の分析環境は、増大し続ける需要に対応していくうちに、時間の経過とともに、さまざまなテクノロジーとソリューションをオンプレミスで組み合わせた複雑なエコシステムになっていました。このアプローチでその時点でのニーズに対応することはできましたが、スケーリングとメンテナンスの面で新たな課題が生じ始めました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">困難な分析環境を乗り切る</strong></h4>\n<p><span style=\"vertical-align: baseline;\">急激な成長と買収により、当社のデータ分析プラットフォームは徐々に不均一な状態になっていきました。新しいプラットフォームや統合の導入により特定のビジネスニーズには対応できましたが、それらが組み合わさることで、運用上のオーバーヘッドが増加し、パフォーマンスのボトルネックが生じていました。スケーリングがますます困難になり、プロセスが複雑になるにつれて分析情報を得るまでの時間が長くなりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">複雑さにより生じた停滞</strong></h4>\n<p><span style=\"vertical-align: baseline;\">PayPal</span><a href=\"https://cloud.google.com/blog/products/databases/paypals-historic-data-migration-is-the-foundation-for-its-gen-ai-innovation\"><span style=\"vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">の</span><a href=\"https://cloud.google.com/blog/ja/products/databases/paypals-historic-data-migration-is-the-foundation-for-its-gen-ai-innovation?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">従来のデータ分析プラットフォーム</span></a><span style=\"vertical-align: baseline;\">は、毎日ペタバイト規模のデータを処理する強力なものでしたが、急速な成長に伴い、柔軟性が失われていきました。小売業のピークイベントやグローバルなリリース時にスケールアップするには、数か月にわたる計画と時間のかかるハードウェアの手動プロビジョニングが必要であり、多くの場合、スピードとコストの間で妥協を余儀なくされていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">PayPal がグローバルに拡大を続けるなか、データの効率性を高め、イノベーションを加速させるために、合理化された統合インフラストラクチャが必要であると認識しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ソリューション: 統合されたクラウドネイティブな分析</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これらの問題を克服するために、分析ワークロードを従来の Hadoop オンプレミス プラットフォームから Google</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">の </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> に移行しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この選択の主な理由は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">迅速なプロビジョニングと柔軟なスケーリング: Managed Spark により、クラスタを数分でデプロイし、処理ニーズに応じてスケーリングできるようになったため、時間のかかる設定やアイドル状態のリソースのコストが排除されました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">統合されたインフラストラクチャ: Apache Spark に標準化することでチーム間に一貫性が生まれ、Managed Service for Apache Spark やその他のマネージド サービスを活用することで運用の複雑さが軽減されました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">シームレスな統合:</span><a href=\"https://cloud.google.com/storage\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Storage</span></a><span style=\"vertical-align: baseline;\">（GCS）、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">、その他の Google Cloud サービスへのネイティブ フックにより、エンドツーエンドのデータ移動が効率化されました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">PayPal は、この移行により、クラウドネイティブ ソリューションの柔軟性、スケーラビリティ、信頼性を活用して、データ処理機能をモダナイズできました。以前は複数のプラットフォームでばらばらに実行されていたワークフローとバッチジョブを、単一のクラウドベースの分析プラットフォームに統合することで、データサイロを削減し、より迅速で豊富な分析情報を提供する統合データ基盤を構築しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これにより、開発者とアプリケーション チームは、インフラストラクチャに制限されることなく、ビジネス価値を創出することに集中できるようになりました。重要なのは、この移行が単なるプラットフォームの再構築にとどまらなかったことです。新しい実験の文化を育成し、変化するビジネスニーズに応じて、チームが分析ワークロードを迅速にテスト、調整、デプロイできるようにしました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">結果: 分析情報の迅速な取得、オーバーヘッドの低減</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Managed Spark を活用した最新の Google Cloud ベースのエコシステムは、大きな効果をもたらしました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">コア分析ワークロードの処理時間が 25% 短縮され、主要なビジネス オペレーションに関する分析情報をほぼリアルタイムで取得できるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">季節限定のセールイベントなど、トラフィックが急増する期間でも、SLA の遵守率が 30% 向上しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ツールの統合と手動メンテナンスの削減により、運用コストが低下しました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">しかし、おそらく最も重要な改善点は、エンジニアが問題対応に費やす時間が減り、イノベーションに費やす時間が増えたことです。これにより、顧客やパートナーに価値をもたらす新しい分析機能を迅速にプロトタイピングできるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">断片化された環境から、一貫性のあるクラウドネイティブなプラットフォームに移行したことで、PayPal の分析機能は根本から強化されました。ビジネスニーズが進化するなか、スケーラブルで統合されたデータ基盤に投資することで、迅速かつ正確で、有益な分析情報を提供できるようになり、世界中のお客様に継続的なイノベーションをもたらすことができます。Managed Service for Apache Spark の導入は、最新の分析基盤を構築するうえで重要なステップでした。</span></p>\n<p><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> と</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> を使用して、</span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> を構築する方法を今すぐご確認ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">PayPal、分析信頼性エンジニアリング担当ディレクター</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Vinod Ganesan 氏</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">PayPal、ビッグデータ プラットフォーム エンジニアリング担当シニア マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Raghu Agani 氏</strong></p></div>"
