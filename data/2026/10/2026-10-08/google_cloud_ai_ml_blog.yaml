  "ca24d9ec3ce7ce2f5bb302d51dfbdbe6":
    "id": "ca24d9ec3ce7ce2f5bb302d51dfbdbe6"
    "title": "Innovation in Ireland: How Irish brands scale with Gemini Enterprise"
    "link": "https://cloud.google.com/blog/topics/customers/ireland-innovation-companies-startups-governments-scale-with-gemini/"
    "published": "2026-10-08 21:00:00"
    "fetched": "2026-10-09 02:43:22"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In recent decades, Ireland has grown into a vibrant hub for global technology. As modernization accelerates, Irish organizations — spanning government agencies, established enterprise brands, and growing startups in AI and other areas — are all advancing their technical foundations. Today, leaders across the country are injecting agentic AI into every layer of their business and operational workflows. </span></p>\n<p><span style=\"vertical-align: baseline;\">We are seeing organizations move from early prototypes to production-ready deployments using </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">. This progress supports Ireland's competitive position within the European market. According to a recent Implement Consulting Group report assessing </span><a href=\"https://services.google.com/fh/files/blogs/google_ireland_economic_impact_25_final.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google’s local contribution</span></a><span style=\"vertical-align: baseline;\">, public and private leaders estimate between 40 billion to 45 billion euros of economic potential in global AI markets.</span></p>\n<p><span style=\"vertical-align: baseline;\">This ambition aligns with broader government initiatives. Since assuming the presidency of the Council of the European Union for the second half of 2026, Ireland has steered higher-level technology and policy discussions, outlining a </span><a href=\"https://www.gov.ie/en/department-of-the-taoiseach/press-releases/government-publishes-new-digital-ai-strategy-90-actions-to-strengthen-irelands-position-as-a-digital-leader-and-ai-hub/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">National Digital and AI Strategy</span></a><span style=\"vertical-align: baseline;\"> to improve productivity and innovation across sectors.</span></p>\n<p><span style=\"vertical-align: baseline;\">To support this strategy, we are focused on making these capabilities more accessible. Our local teams are collaborating with industry leaders to implement Gemini Enterprise which offers capabilities that range from conversational AI agents and natural language data analysis, to optimizing operations with agentic ecosystems.</span></p>\n<p><span style=\"vertical-align: baseline;\">The economic impact is already taking shape. In 2025 alone, Google operations — including our AI and cloud services — added an estimated 10 billion euros to the Irish gross domestic product. And this momentum is shared: Organizations across Ireland are using Google Cloud to modernize infrastructure and put AI to work.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here are several ways Irish organizations are modernizing with Google Cloud and Gemini Enterprise:</span></p>\n<h4><span style=\"vertical-align: baseline;\">Ryanair supports millions of passengers through AI-backed operations</span></h4>\n<p><span style=\"vertical-align: baseline;\">Ryanair, Europe’s largest airline, </span><a href=\"https://www.googlecloudpresscorner.com/2026-08-12-Ryanair-and-Google-Cloud-Announce-Five-Year-Data-and-AI-Partnership\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">is modernizing</span></a><span style=\"vertical-align: baseline;\"> its collaborative operations and infrastructure by deploying Gemini Enterprise and Google Workspace for some 35,000 employees. Flight crews, operations planners, and corporate staff will benefit from streamlined decision-making, optimized crew logistics, and enhanced corporate productivity. At the same time, a dual-cloud strategy strengthens infrastructure resilience as the airline targets growth to 300 million passengers by 2034. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Smyths Toys rethinks the customer experience with agentic support</span></h4>\n<p><span style=\"vertical-align: baseline;\">As one the world’s largest specialty toy retailers, Smyths Toys is </span><a href=\"https://cloud.google.com/customers/smyths-toys-ge?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">reshaping its customer support</span></a><span style=\"vertical-align: baseline;\"> with Google Cloud and Gemini Enterprise. By introducing an AI agent named Codie, the retailer has resolved more than 60% of its web inquiries and reduced holiday email backlogs. Customer care teams that previously handled up to 1,000 peak-season emails a day can now focus on the roughly 50 cases that need more complex judgment.</span></p>\n<h4><span style=\"vertical-align: baseline;\">The Irish Revenue Commissioners: Advancing public sector data</span></h4>\n<p><span style=\"vertical-align: baseline;\">Public sector agencies are also making strides in Ireland. The </span><a href=\"https://www.revenue.ie/en/home.aspx\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Irish Revenue Commissioners</span></a><span style=\"vertical-align: baseline;\"> — responsible for taxes, customs, and keeping Ireland’s economy running smoothly — is </span><a href=\"https://blog.google/intl/en-ie/products/revenue-ireland/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">working with Google Cloud</span></a><span style=\"vertical-align: baseline;\"> to migrate from legacy on-premise systems to a unified AI-lakehouse architecture designed to break down data silos and establish a single source of truth. Strict data sovereignty controls safeguard taxpayer information while Gemini Enterprise powers agentic data analysis, helping Revenue deliver secure, responsive public services.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Virgin Media Ireland: Accelerating workflows</span></h4>\n<p><span style=\"vertical-align: baseline;\">Supported by </span><a href=\"https://www.libertyglobal.com/liberty-global-google-cloud/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Liberty Global's partnership</span></a><span style=\"vertical-align: baseline;\"> with Google Cloud, Virgin Media Ireland is moving AI from exploration to production. Through modern infrastructure and automation, the team now deploys workloads three times faster, is in the process of rolling out multiple AI agents, and is launching new customer services designed to drive business growth.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Irish startups scaling with enterprise tools</span></h3>\n<p><span style=\"vertical-align: baseline;\">While established enterprises are modernizing legacy systems, Irish startups are building on modern technology from day one. Backed by a strong local tech ecosystem, these agile teams are creating services that compete on an international stage. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Hexis: Scaling personalized sports nutrition</span></h4>\n<p><a href=\"https://hexis.live/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hexis</span></a><span style=\"vertical-align: baseline;\"> builds technology solutions that help athletes refine their performance and recovery. By storing and processing that real-time biometric and behavioral data in Google Cloud, Hexis uses Gemini Enterprise to power natural language conversations that explain fueling adjustments to users throughout the day. Today, the platform supports 40% of the</span><a href=\"https://www.letour.fr/en/landing-page\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Tour de France peloton </span></a><span style=\"vertical-align: baseline;\">and half of </span><a href=\"https://www.premierleague.com/en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Premier League</span></a><span style=\"vertical-align: baseline;\"> clubs during the 2026–2027 season.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Kitman Labs: Unifying performance analytics</span></h4>\n<p><span style=\"vertical-align: baseline;\">Founded in Dublin in 2012, </span><a href=\"https://www.kitmanlabs.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kitman Labs</span></a><span style=\"vertical-align: baseline;\"> provides sports science and performance intelligence to more than 4,000 sporting organizations across 26 countries. By combining its intelligence platform with advanced analytics and Gemini Enterprise, Kitman Labs helps teams make data-informed decisions that support athlete health, lower injury risk, and extend player career longevity. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Spryt: Automating healthcare coordination</span></h4>\n<p><a href=\"https://spryt.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spryt</span></a><span style=\"vertical-align: baseline;\"> streamlines healthcare coordination across the U.K. and U.S., </span><a href=\"https://cloud.google.com/customers/spryt?hl=en&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">using AI built on Google Cloud and Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> to optimize patients’ experiences, reduce missed appointments, and cut administrative burden. </span><span style=\"vertical-align: baseline;\">The company collaborates with the NHS, operates in more than 70 US clinics, and has analyzed 224 million appointment records as part of a multiyear initiative with Mayo Clinic.</span></p>\n<h4><span style=\"vertical-align: baseline;\">IMPT: Automating carbon offsetting</span></h4>\n<p><span style=\"vertical-align: baseline;\">By connecting AI, blockchain, and Google Cloud, </span><a href=\"https://impt.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IMPT</span></a><span style=\"vertical-align: baseline;\"> embeds verified carbon offsetting into everyday hotel bookings and online purchases. Following a 15-week migration to Google Cloud, IMPT supports 8 million listings across 195 countries. With Gemini Enterprise, the company’s lean team handles about 400 daily customer chats with a six-second median response time, allowing staff to focus on growing its business rather than managing systems.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Transform ideas from planning to production</span></h3>\n<p><span style=\"vertical-align: baseline;\">As Ireland continues to expand  as a global technology hub, local organizations are demonstrating how to translate AI potential into practical results. </span><span style=\"vertical-align: baseline;\">Explore our customer stories to see how other organizations are building with Google Cloud, or reach out to our team in Ireland to accelerate your journey.</span></p></div>"
  "dcab302460108a262ef05ffbb33d9433":
    "id": "dcab302460108a262ef05ffbb33d9433"
    "title": "Welcome to Gemini at Work 2026: Introducing the Gemini agent"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026/"
    "published": "2026-10-08 21:00:00"
    "fetched": "2026-10-09 02:43:22"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Editor’s note: This article is adapted from Thomas Kurian’s keynote address at Gemini at Work 2026. It includes a number of announcements:</span></p>\n<ul>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">Gemini</strong><span style=\"font-style: italic; vertical-align: baseline;\">, a single, universal agent for work that answers your questions, handles your knowledge work, creates your images and media, and writes and runs code. </span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><strong style=\"font-style: italic; vertical-align: baseline;\"><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026#:~:text=Gemini%20in%20Google%20Workspace\">Inline in Workspace</a>,</strong><span style=\"font-style: italic; vertical-align: baseline;\"> Gemini works directly inside Gmail, Drive, Docs, Slides, Sheets, Chat, and Calendar, carrying the same memory, skills, and controls it has everywhere else.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><strong style=\"font-style: italic; vertical-align: baseline;\"><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026#:~:text=Data%20analysis%2C%20data%20engineering%20and%20machine%20learning\">New data and analytics skills</a> </strong><span style=\"font-style: italic; vertical-align: baseline;\">that allow both technical teams and everyday business users to use plain-language questions to get to actionable operational insights in minutes. </span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><strong style=\"font-style: italic; vertical-align: baseline;\"><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805#:~:text=Industry%2Dspecific%20specializations\">Industry-specific specialization</a> </strong><span style=\"font-style: italic; vertical-align: baseline;\">with tools, skills, connectors and knowledge specific for financial services and legal teams.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026#:~:text=Securing%20and%20governing%20agents\"><strong style=\"font-style: italic; vertical-align: baseline;\">How we secure and govern agents</strong></a><span style=\"font-style: italic; vertical-align: baseline;\"> through i</span><span style=\"font-style: italic; vertical-align: baseline;\">dentity and policy management, </span><span style=\"font-style: italic; vertical-align: baseline;\">authorization and permission controls, secure sandboxing, network gateways, and more.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><strong style=\"font-style: italic; vertical-align: baseline;\"><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026/?e=48754805#:~:text=Leading%20cost%20controls%20and%20spending%20options\">Leading cost controls</a> </strong><span style=\"font-style: italic; vertical-align: baseline;\">through multi-model orchestration, Smart Routing, real-time spend caps, and more.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026#:~:text=Gemini%20Enterprise%20in%20action%3A%20global%20momentum\"><strong style=\"font-style: italic; vertical-align: baseline;\">Customer use cases</strong></a><span style=\"font-style: italic; vertical-align: baseline;\"> that showcase the breadth and depth of our customers around the world.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Bringing the best technology to all of you is what drives us at Google Cloud. In the last year, nearly 500 Google Cloud customers each processed more than one trillion tokens. Today, nearly 80% of all Google Cloud customers are using our AI products, and nearly 90% of the Fortune 100 use Gemini Enterprise. At that kind of scale, organizations have moved past experimentation and are running their business on it.</span></p>\n<p><span style=\"vertical-align: baseline;\">Work now starts in the prompt window. </span></p>\n<p><span style=\"vertical-align: baseline;\">To meet this moment, today we are excited to announce the Gemini agent: your new single, universal agent for work. It has all of your business context and can be used for everything from knowledge work to answering questions, and from content creation to coding, all from a single prompt box. It plans the work, uses skills and tools, connects to your systems, and brings back something finished — inside the documents, the inbox, and the developer environments you already work in. It chooses the best model for the job, has built-in cost controls, and most importantly, has the security, administration, and governance required by your company.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Gemini\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Gemini.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>The Gemini agent is your new single, universal agent for work.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Introducing the Gemini agent </span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini answers your questions, handles your knowledge work, creates your images and media, and writes and runs code — all in a single agent and a single API. You give it objectives, not instructions. You delegate an outcome and come back to finished work. For an agent to do that, it has to be connected to your personal workflows, your systems of record, and your enterprise controls. </span><span style=\"vertical-align: baseline;\">Gemini can function as your personal assistant or as a team member, where it works on behalf of a group of people, like a project manager within a team, or on behalf of a specific role in an organization, like an analyst in your finance department.</span></p>\n<p><span style=\"vertical-align: baseline;\">The agentic capabilities in Gemini are built around core architectural principles:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified agent: </strong><span style=\"vertical-align: baseline;\">Gemini is an agent that can answer your questions when you chat with it, work autonomously to complete objectives you assign it, and generate code — all from a single interface. You can assign it work, schedule tasks that need to be completed, or have it respond to events.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Omnipresent access:</strong><span style=\"vertical-align: baseline;\"> Gemini can be accessed from any device including web, iOS and Android mobile devices, Windows and Mac desktops, and any channel (command line, Google Workspace, Microsoft 365, or Slack). It can also be integrated into third-party applications and surfaces and operates as a headless agent, meaning it does not need a dedicated user interface.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Persistent execution:</strong><span style=\"vertical-align: baseline;\"> It runs in the cloud, meaning it maintains a single set of memories, context, and one personalization graph no matter what device or channel you access it on. You never have to re-brief it or wonder which machine you told it to do something on. Work that takes hours or days keeps running after you close your laptop, and it is still there when you come back. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-agent orchestration:</strong><span style=\"vertical-align: baseline;\"> Gemini doesn’t work alone. It can dynamically create a roster of sub-agents — temporary, job-specific agents, each with their own identity — to tackle multi-step tasks. Gemini can communicate with these sub-agents to coordinate workflows, including parallel and sequential steps that can run for hours or days. In addition, Gemini can act as a coworker agent — which is more like a team member, with a persistent, defined role and operational presence across days, sessions, and multiple changing responsibilities — and delegate and coordinate tasks. Coworker agents have dedicated identities including their own @agents.</span><span style=\"vertical-align: baseline;\">company.com</span><span style=\"vertical-align: baseline;\"> emails, their own persistent storage, and only have access to the context that you or your team members provide.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deeply contextual:</strong><span style=\"vertical-align: baseline;\"> Gemini arrives already knowing your tools, data, and work history. Whether you ask it a question, assign it an objective, or have it generate code, Gemini learns from every interaction with you. The longer you collaborate with it, the better it understands you and how you work. Teams can create dedicated projects to further optimize the context, skills, and tools Gemini uses when it works with you.  </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model choice flexibility:</strong><span style=\"vertical-align: baseline;\"> <span style=\"vertical-align: baseline;\">Gemini is the agent, and the model underneath it is a separate choice. It runs each job on the model that fits best — orchestrating across our Gemini family of models and Claude  </span><span style=\"vertical-align: baseline;\">models from Anthropic</span><span style=\"vertical-align: baseline;\"> today, and other leading private and open models in the future — to deliver optimal quality and lower your costs. The best model for the task is not always the largest one. Matching the model to the work raises accuracy on the difficult jobs and lowers cost on the simple ones. And the leading model changes every few months, so keeping that choice open means your context, your skills, and your data stay put when it does.</span></span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Top customers across industries were early testers and are already realizing its benefits: Premium sportswear brand </span><strong style=\"vertical-align: baseline;\">On</strong><span style=\"vertical-align: baseline;\"> tested this new dynamic selection capability to accelerate its speed-to-market. This builds on the proven, large-scale multi-model strategies already used by leaders: </span><strong style=\"vertical-align: baseline;\">Shopify</strong><span style=\"vertical-align: baseline;\"> blends frontier models for millions of merchants to unlock data and drive sales, and </span><strong style=\"vertical-align: baseline;\">PayPal</strong><span style=\"vertical-align: baseline;\"> routes 10 million multi-model requests every week.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Powering Gemini: Skills, tools, and context</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini understands your business — everything from pricing to product portfolios to departmental norms — and all the institutional knowledge that makes your company unique. Three capabilities make that possible: tools that connect it to your systems, skills that teach it how your work gets done, and context that lets it remember. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tools and tools registry: </strong><span style=\"vertical-align: baseline;\">Gemini can securely connect to the software your company already runs, including collaboration tools like Confluence, Microsoft Office, Teams, Slack, and Workspace; development tools like Git and Jira; enterprise platforms like Salesforce and ServiceNow; databases like BigQuery, Databricks, Postgres, and Snowflake; and files on your own desktop. It can also connect and work securely with any Model Context Protocol (MCP) server inside or outside your company network. It also offers an enterprise tools registry, so teams can build and publish tools for the rest of the company. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Skills and skills registry: </strong><span style=\"vertical-align: baseline;\">Skills are reusable sets of instructions, knowledge, or workflows stored as modular prompts that teach agents how to perform specific, multi-step tasks. Gemini ships with a robust global library of skills. Teams or departments can build and publish custom skills to a shared company registry, and you can build your own personal skills. Gemini chooses the right skills and tools to perform a task and continuously learns from each execution, improving its consistency, while saving token costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Context and memory: </strong><span style=\"vertical-align: baseline;\">Gemini learns from each question you ask it, each objective you assign it, the people you work with, and uses your personal context and your organization's context to personalize and improve the quality of its responses. It keeps four kinds of memory: session memory for the task in front of it, even when it runs for days; semantic memory, a structured knowledge base it builds as it reads documents, talks to people, and works with other agents; procedural memory for how a job gets done, including skills it writes for itself; and episodic memory of everything it has done before. Gemini onboards itself the way a new hire would, learning you, your tools, and your team before it starts.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Customers seeing significant benefits from Gemini Enterprise include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-09-24-BNP-Paribas-and-Google-Cloud-Announce-New-Partnership-on-Agentic-AI-and-Cloud-Innovation\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BNP Paribas</strong></a><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">a European leader in banking and financial services, is transforming Corporate &amp; Institutional Banking by deploying Gemini Enterprise into LLM@CIB, its internal generative AI assistant available to more than 65,000 employees, to streamline workflows like preparing credit memos and boosting the productivity of customer advisers while maintaining strict enterprise-grade security and data governance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Bradesco</strong><span style=\"vertical-align: baseline;\">, one of Brazil’s largest banking and financial services conglomerates, is streamlining heavy operational workflows by deploying Gemini Enterprise for automated fiscal, accounting, and contractual analysis. The finance team has accelerated proposal reviews, service classification, and budgetary workflows, cutting document review time from 1 hour to 5 minutes while reducing risk inconsistencies by 60% and achieving over 10% in financial efficiencies.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.youtube.com/watch?v=Ay5QtMsna8c\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Merck</strong></a><span style=\"vertical-align: baseline;\"> is exploring new frontiers in molecular research with the potential to significantly compress discovery timelines while maintaining complete data privacy and security.</span></p>\n</li>\n</ul></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Ay5QtMsna8c\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Merck + Google Cloud: Using Gemini Enterprise to Accelerate Drug Discovery</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Ay5QtMsna8c\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-08-Orange-Spain-Expands-Partnership-with-Google-Cloud-to-Industrialize-AI-Operations-with-Gemini-Enterprise\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Orange Spain</strong></a><span style=\"vertical-align: baseline;\">, a leading telecommunications operator in Spain, is speeding up its digital transformation by deploying more than 1,000 custom Gemini Enterprise agents. Employees across HR, IT, sales, and customer service have built custom agents to automate incident triage, analyze network issues, and retrieve corporate knowledge, boosting operational agility and response times while helping non-technical staff automate daily workflows with zero IT bottlenecks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-09-03-Santee-Cooper-Partners-with-Google-Cloud-to-Help-Improve-Grid-Reliability-Through-Better-Planning\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Santee Cooper</strong></a><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">South Carolina’s state-owned electric and water utility, is modernizing its financial planning and grid reliability by deploying a specialized AI model built on Gemini Enterprise. Financial planning teams and utility operators are automating complex financial scenario modeling and query execution using simple natural language and expect to boost modeling speed by up to 75% while mitigating market risk across a $10 billion grid expansion budget.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SOMPO</strong><span style=\"vertical-align: baseline;\">, a leading Japanese insurance provider, built over 10,000 custom AI agents across its 34,000 employees to automate tasks like document search and summarization for employee efficiency. Their engineering team used Gemini Enterprise to cut the development time for new models from one week to a single day, freeing up engineers for more important work.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ulta Beauty</strong><span style=\"vertical-align: baseline;\"> is helping guests shop 30,000 products by deploying the Ulta AI shopping assistant built with Gemini Enterprise. Online shoppers have translated conversational questions into personalized beauty recommendations, boosting digital sales conversion rates three-fold while skipping traditional search filters to buy the products they love instantly.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wesfarmers, </strong><span style=\"vertical-align: baseline;\">the</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">parent company of Australian retail giants </span><strong style=\"vertical-align: baseline;\">Bunnings</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Kmart</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Officeworks</strong><span style=\"vertical-align: baseline;\">, is deploying agents across its portfolio. An internal agent at Bunnings saved staff half a million hours of administrative work, while shopping agents — that help customers discover products and build their carts — have increased conversion rates up to three times higher for Kmart and Officeworks.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Geminin enterprise customers\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Geminin_enterprise_customers.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Organizations worldwide are driving measurable impact.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Gemini in Google Workspace</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini not only answers your questions, handles your knowledge work, and writes your code — it works directly inside Gmail, Drive, Docs, Slides, Sheets, Chat, and Calendar, carrying the same memory, skills, and controls it has everywhere else. It works inline: in the email thread, in the document, and in the chat space. </span></p>\n<p><span style=\"vertical-align: baseline;\">Inside Workspace, Gemini works three ways:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Personal assistance</strong><span style=\"vertical-align: baseline;\">: Gemini works as your personal agent and arrives already knowing your calendar, your team, your projects, and how your documents relate to one another. It is briefed before you start.  For example, you can ask Gemini to set up a meeting with the usual team of regional event leads next week, without supplying a single name or email address. Gemini determines who those people are from the membership of your chat space and the thread from your last event, checks their calendars, and starts an email thread to coordinate a time that works, even with external participants. It handles work that spans applications the same way: researching market trends, building a financial model in Sheets, then creating a deck that presents both, without you re-explaining the project at each step.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Proactive delegation</strong><span style=\"vertical-align: baseline;\">: Gemini uses this same intelligence to proactively suggest tasks you can delegate to it. For example, if your manager emails you asking for the latest project update as a slide deck, Workspace Intelligence recognizes that as a delegatable task and gives you a single-click option to pass it to Gemini. It applies the same reasoning to your inbox, surfacing the message that matters most rather than the one that arrived last, and explaining why. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A member of your team</strong><span style=\"vertical-align: baseline;\">: You can also use Gemini to create a coworker agent that works with your entire team. You simply describe the role you need, and Gemini creates it. The agent receives its own Workspace account, including an email address, calendar, Drive, and presence in your company directory. Your colleagues work with it the way they work with anyone else, by adding it to a Chat space or @mentioning it. For example, a marketing manager can ask an events coordinator agent in a chat group to draft a launch readiness document, which it posts back to the group when complete. The marketing manager could also tag the agent in a document comment, where it can suggest an edit in the Doc and reply in the comment thread, appearing under its own name in version history. A coworker agent acts under its own identity rather than yours, and it sees only what you share with it. Access follows the sharing and membership your team already uses, and no outside connector holds your data.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Data analysis, data engineering and machine learning </span></h3>\n<p><span style=\"vertical-align: baseline;\">We are also giving Gemini skills built for specific domains, starting with data.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data and analytics represent a foundational domain where Gemini transforms business workflows, enabling organizations to move from plain-language questions to actionable operational insights in minutes. We are introducing purpose-built capabilities tailored to both technical teams and everyday business users:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For Data and ML engineers: </strong><span style=\"vertical-align: baseline;\">We are extending Gemini with machine learning skills and tools that back every data scientist and data engineer with a team of agents. Engineers describe the outcome they want in plain language, and Gemini generates PySpark code, provides notebooks to edit and test it, trains models, and troubleshoots and fixes pipeline issues on its own.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For business users: </strong><span style=\"vertical-align: baseline;\">Anyone in your organization can generate reliable, real-time operational reports simply by asking. </span><span style=\"vertical-align: baseline;\">Gemini uses operational reporting skills integrated with BigQuery and the Knowledge Catalog to construct and save the query.</span><span style=\"vertical-align: baseline;\"> Once saved, teams can run reports on demand without incurring token costs, guaranteeing consistent, verified answers every time.</span></p>\n</li>\n</ul>\n<p><strong><span style=\"vertical-align: baseline;\">Three Google Cloud capabilities keep those answers grounded:</span></strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Knowledge Catalog:</strong><span style=\"vertical-align: baseline;\"> Gemini integrates directly with your Knowledge Catalog to map business definitions once so all agents use them. This deep </span><span style=\"vertical-align: baseline;\">understanding of your organization’s schemas and business rules for terms like “net margin” and “addressable market” dramatically improves accuracy. </span><span style=\"vertical-align: baseline;\">Whether your metrics live in Databricks, dbt, LookML, or SAP, Gemini reads them directly where they sit to ensure factual responses.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Smart Storage</strong><span style=\"vertical-align: baseline;\">: Ninety percent of enterprise data is unstructured — PDFs, images, scans, and audio recordings — which often remain \"dark\" and unreadable. Smart Storage changes this by enriching unstructured objects in place and writing context back directly onto the object itself. The intelligence stays where the bytes reside and inherits your existing security posture.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Borderless Lakehouse:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Organizations should not be forced to move or duplicate their data to use AI. Our borderless Lakehouse allows Gemini to query Amazon S3 and Azure Data Lake with no variable egress fees, read directly from Salesforce Data 360, SAP, ServiceNow, and Workday without copying data, and federate open Apache Iceberg tables across Databricks Unity, Snowflake Horizon, and AWS Glue.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">You can start by registering data sets that you discover in your lakehouse with the Knowledge Catalog, and then assign Gemini simple or complex analysis to perform. It identifies the necessary data sets from the Knowledge Catalog, generates the necessary SQL, Spark or Python code to calculate the results, and runs the code on our Managed Spark Service with Lightning Engine or in BigQuery. It can also generate charts and build dashboards in the tools your analysts already use.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">By grounding its data agents in the Knowledge Catalog, Bloomberg Media lifted its SQL query accuracy by </span><span style=\"vertical-align: baseline;\">63%</span><span style=\"vertical-align: baseline;\"> during initial development. <strong>As William Anderson, Bloomberg Media’s CTO, noted: “...by grounding our AI in a trusted institutional context, we ensure confidence in the accuracy and quality of every insight generated.”</strong></span></span></p>\n<p><span style=\"vertical-align: baseline;\">Additional customers are seeing tremendous value from our data solutions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deutsche Telekom</strong><span style=\"vertical-align: baseline;\"> used BigQuery, Cloud Storage, and Knowledge Catalog to build a unified data lakehouse to overcome a fragmented and slow data infrastructure spread across 40+ legacy on-premise systems, allowing their teams to now move ten times faster while addressing European data sovereignty and security requirements.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Etsy</strong><span style=\"vertical-align: baseline;\"> migrated three petabytes of data to a unified lakehouse. By using BigQuery and open-source Apache Iceberg, they can now perform critical data joins up to 60% faster, allowing them to train models on much larger datasets and better connect buyers with the perfect items.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Snap</strong><span style=\"vertical-align: baseline;\"> connected its Prism agent directly to its storage archives, cutting technical diagnostic troubleshooting times down from 30 minutes to just 30 seconds.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Industry-specific specializations</span></h3>\n<p><span style=\"vertical-align: baseline;\">Every industry runs on knowledge a general model does not have. We are specializing Gemini for individual industries, with the skills, tools, and knowledge specific to each one.</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">It is now in preview for Financial Services and Legal, and coming soon to Government, Healthcare, and Retail. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Financial Services:</strong><span style=\"vertical-align: baseline;\"> Gemini for Financial Services automates what is usually pieced together across many workstreams: investment research, credit analysis, and risk modeling. It draws on trusted financial data from FactSet, LSEG, S&amp;P Global, SEC filings, and your own proprietary repositories. Built with more than 50 foundational skills and designed to satisfy rigorous compliance, it shows its reasoning through confidence scores, explicit methodologies, full data lineage for easy auditing, and source citations you can check. Gemini for Financial Services is already being used by global financial institutions like </span><strong style=\"vertical-align: baseline;\">CME Group </strong><span style=\"vertical-align: baseline;\">and</span><strong style=\"vertical-align: baseline;\"> Deutsche Bank</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Legal:</strong><span style=\"vertical-align: baseline;\"> Gemini inherits matter-level permissions and ethical walls directly from document management platforms like NetDocuments and iManage. Partners like Harvey automate complex legal work while meeting the firm's confidentiality standards, while Onit streamlines contract lifecycle management without exposing privilege. Cooley </span><span style=\"vertical-align: baseline;\">is building a confidential information redaction agent on Gemini Enterprise for Legal that automates redactions, including personally identifiable information and confidential material, before legal filings go public. In high-stakes litigation, this can cut days of document review while maintaining the firm's rigorous standards for client confidentiality.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">In addition, we’ve seen our ecosystem and customers create new vertical applications as well. For example, </span><strong style=\"vertical-align: baseline;\">Deloitte</strong><span style=\"vertical-align: baseline;\"> has created a multi-agentic solution to help organizations identify the highest-value opportunities for AI applications for their business. Their Agentic AI blueprint develops operational heat maps to pinpoint areas ready for agentic redesign, accelerating the deployment of custom agentic workflows and achieving up to a 3x faster path to measurable business impact.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Securing and governing agents</span></h3>\n<p><span style=\"vertical-align: baseline;\">Two factors determine whether an enterprise agent program succeeds or stalls: whether you can govern it, and whether you can afford it.</span></p>\n<p><span style=\"vertical-align: baseline;\">When deploying autonomous agents across an organization, governance comes down to answering four fundamental questions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Who is the agent, and what identity does it have? </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">What is it allowed to do or what permissions is it granted? </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">What did it do and where can I see what it did? </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">What should it never touch?</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Identity, policy, and observability answer the first three. The fourth is Agent Gateway.  </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Identity: </strong><span style=\"vertical-align: baseline;\">Every agent gets its own identity, cryptographically attested and governed like an employee, with least-privilege permissions. That identity is stamped into the logs that capture its work, and into any virtual machine spun up to run code on its behalf.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Authorization and permissions: </strong><span style=\"vertical-align: baseline;\">You give each agent fine-grained, role-based access permissions, approved by your organization’s security administrators. When the Gemini agent connects to an external system, its identity is mapped and propagated through industry standards such as OAuth.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Auditing: </strong><span style=\"vertical-align: baseline;\">In addition, every action Gemini takes is written to an audit trail and attributed to the agent rather than to a person. Since the identity travels into any virtual machine the agent spins up to run code, you can monitor those logs with our observability tools in real time and catch anomalous behavior before it matters. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Policy management and control: </strong><span style=\"vertical-align: baseline;\">Gemini gives you identity, discovery, governance, and security by default. All Gemini agents execute tasks safely inside an Agent Sandbox with its own network boundary. All traffic — in, out, and between agents — passes through Agent Gateway, an AI network firewall enforcing your organization’s policies in real time. You write the policy once, such as: “agents may not open documents classified Need to Know.” Gemini applies it to every agent in your company instead of checking one agent at a time.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Leading cost controls and spending options</span></h3>\n<p><span style=\"vertical-align: baseline;\">While per-token prices have </span><a href=\"https://thenextweb.com/news/token-prices-fell-98-enterprise-ai-bills-tripled-now-the-industry-wants-a-standards-body-to-explain-why\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dropped 98%</span></a><span style=\"vertical-align: baseline;\"> since 2024, enterprise AI volume has exploded. Running every simple loop through a premium model quickly breaks corporate budgets. We </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> new flexible spending options recently and are adding to those today: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-model orchestration:</strong><span style=\"vertical-align: baseline;\"> As mentioned earlier, Gemini allows you to choose</span><span style=\"vertical-align: baseline;\"> the right model for the job, and even combine different models for specific tasks in larger projects </span><span style=\"vertical-align: baseline;\">to deliver optimal quality and lower your cost.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Smart routing: </strong><span style=\"vertical-align: baseline;\">Our routing tool automatically triages enterprise workloads so each one runs on the model that delivers maximum performance at the lowest possible cost.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Real-time spend caps:</strong><span style=\"vertical-align: baseline;\"> You can</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">set a hard limit on a project's AI spend in the Cloud Billing Console, and Gemini enforces it. Gemini monitors token usage and sandbox costs, and if a spend cap is triggered, that project's agent pauses, and you can choose to resume work with a single click in the console. Because the tracking is per project, companies can charge AI costs back to specific departments.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Infrastructure: 80% better price-performance</strong></h3>\n<p><span style=\"vertical-align: baseline;\">All of this innovation — the agent, the data, the identity, and everything else — runs on our AI Infrastructure and our models. They are the reason the economics work.</span></p>\n<p><span style=\"vertical-align: baseline;\">First, our AI infrastructure. We co-design the chips, the network, the data center, and the software that connects it all as one highly-optimized system — our AI Hypercomputer. This vertical integration delivers significantly better price-performance than the generic setups, and we are continuing to push the state of the art here. For example, our latest TPU 8i system delivers 80% better price-performance than the prior generation, </span><span style=\"vertical-align: baseline;\">making complex, high-value agent tasks both fast and highly affordable.</span></p>\n<p><span style=\"vertical-align: baseline;\">On top of this silicon sit our models: </span><strong style=\"vertical-align: baseline;\">Argon</strong><span style=\"vertical-align: baseline;\"> for frontier reasoning, </span><strong style=\"vertical-align: baseline;\">Flash</strong><span style=\"vertical-align: baseline;\"> for speed and volume, </span><strong style=\"vertical-align: baseline;\">Omni</strong><span style=\"vertical-align: baseline;\"> for generative media, and </span><strong style=\"vertical-align: baseline;\">Gemma</strong><span style=\"vertical-align: baseline;\"> for lightweight, open-weights edge workloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">The edge capabilities are already real. </span><strong style=\"vertical-align: baseline;\">NASA’s Jet Propulsion Laboratory</strong><span style=\"vertical-align: baseline;\"> is running Gemma directly on a satellite in orbit, a first for a vision-language model. JPL’s NAVI software analyzes Earth imagery on board the satellite and sends a summary with key information to ground operators.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Supercharged by our ecosystem</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We remain committed to choice at every layer of the stack, ensuring you have the freedom to choose the best tech stack for your unique needs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Inside Gemini, you have a broad choice of third-party agents from leading SaaS providers as well as connectors that are ready to use. They are even easier to discover</span><span style=\"vertical-align: baseline;\"> as collections in the new <a href=\"https://aisolutionfinder.withgoogle.com/\" rel=\"noopener\" target=\"_blank\">AI Solution Finder</a></span><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Around Gemini, our services ecosystem continues to rapidly scale to meet enterprise demand. Together, in the last month alone, our global consulting partners have put more than a hundred thousand of their developers and consultants through Gemini hackathons.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition, Accenture has made a significant investment by establishing a dedicated Gemini Enterprise Business Group to accelerate customer adoption and innovation. Several other partners have also expanded their commitments to support the growing demand for Gemini, including establishing specialized centers of excellence and training Gemini credentialed practitioners to help customers build and deploy production-grade agents faster. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Gemini Enterprise in action: Global momentum</span></h3>\n<p><span style=\"vertical-align: baseline;\">Organizations worldwide are driving measurable impact across every major region:</span></p>\n<h4><span style=\"vertical-align: baseline;\">Europe and Middle East</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-08-Arden-University-and-Google-Cloud-Form-Strategic-Partnership-to-Ensure-Development-of-Job-Ready,-AI-Native-Graduates\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Arden University</strong></a><span style=\"vertical-align: baseline;\">, a UK provider of flexible online and blended learning, is preparing students for the global job market by rolling out Gemini Enterprise. Over 30,000 students and staff will now have access to advanced Al tools to personalize their studies and gain essential skills for the workplace.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Commerzbank</strong><span style=\"vertical-align: baseline;\">, one of Germany’s largest private banks, is using Gemini Enterprise to automate document quality assurance, reducing manual work on document reviews from 20 hours to just one. They are expanding this with a multi-agent system for AI-driven QA.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.youtube.com/watch?v=ZoZlcmQG8SE\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Lloyds Banking Group</strong></a><span style=\"vertical-align: baseline;\"> is scaling agentic AI across the bank. Envoy, a secure, Gemini-powered pipeline, has already onboarded nearly a thousand engineers building production-ready AI use cases. From fraud detection to commercial client onboarding, Envoy gives teams a reusable agent marketplace, a \"golden path\" for building agents, and a CI/CD pipeline — all wrapped in the guardrails and security a highly regulated bank demands.</span></p>\n</li>\n</ul></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=ZoZlcmQG8SE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Lloyds Banking Group Built Envoy with Gemini Enterprise</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=ZoZlcmQG8SE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-06-22-Nokia-and-Google-Cloud-Partner-to-Embed-AI-Agents,-Built-with-Googles-Gemini-Models,-Into-Nokias-Autonomous-Network-Product-Suite\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Nokia</strong></a><span style=\"vertical-align: baseline;\"> is tackling the complexity of modern telecom networks with an ecosystem of specialized agents built on Gemini Enterprise. This allows operators to fix issues before subscribers are impacted by automating troubleshooting and cutting issue resolution time by up to 80%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-08-On-Establishes-Google-Cloud-as-Enterprise-AI-Backbone,-Beginning-with-Agent-Led-Cloud-Migration\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">On</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">a premium sportswear brand, is scaling workforce productivity and efficiencies by deploying Gemini Enterprise to every employee to drive personal productivity and foster an AI-ready culture. Team members have launched no code agents that help with efficient knowledge extraction, executive reporting, market research, scheduling, onboarding and more.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ooredoo Qatar, </strong><span style=\"vertical-align: baseline;\">the leading telecommunications provider in Qatar, is integrating Gemini Enterprise into their AI transformation strategy to drive advanced automation and intelligence. Its customer support, marketing, security, and field operations teams have deployed AI agents to optimize internal operations management, while accelerating rapid issue resolution and marketing campaigns to deliver around the clock, highly personalized, proactive customer experiences.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Qatar University, </strong><span style=\"vertical-align: baseline;\">the nation's premier institution of higher education, is transforming higher education operations and academic research by deploying Gemini Enterprise campus-wide. Thousands of faculty and staff are deploying more than 2,000 custom AI agents to modernize institutional workflows, automate complex administrative operations, and enhance academic productivity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-08-12-Ryanair-and-Google-Cloud-Announce-Five-Year-Data-and-AI-Partnership\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Ryanair</strong></a><span style=\"vertical-align: baseline;\">, Europe’s largest airline, is modernizing its collaborative operations and infrastructure by deploying Gemini Enterprise and Google Workspace to 35,000 employees. Flight crews, operations planners, and corporate staff will benefit from automated decision-making, optimized crew logistics, and enhanced corporate productivity, while a resilient dual-cloud strategy strengthens infrastructure resilience and supports the airline's target growth to 300 million passengers by 2034.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Starling</strong><span style=\"vertical-align: baseline;\">, one of the UK's top-rated digital banks, built its Scam Intelligence tool on Gemini Enterprise. It analyzes online marketplace ads for suspicious content and has quadrupled the rate at which customers cancel potentially fraudulent payments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Other major European customers include </span><strong style=\"vertical-align: baseline;\">Berenberg</strong><span style=\"vertical-align: baseline;\"> in banking, </span><strong style=\"vertical-align: baseline;\">Bouygues Telecom</strong><span style=\"vertical-align: baseline;\">, the application building platform </span><strong style=\"vertical-align: baseline;\">Lovable</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Siemens</strong><span style=\"vertical-align: baseline;\"> in automation.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Asia Pacific</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Airwallex, </strong><span style=\"vertical-align: baseline;\">the global financial platform processing over $200 billion annually, has deployed Gemini Enterprise across its infrastructure to resolve customer issues 10x faster, automate dispute handling to cut case time by 40%, and accelerate software time-to-market by over 95% while building specialized agentic finance workflows for automated treasury, payables, and payments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">DBS Bank</strong><span style=\"vertical-align: baseline;\">, Southeast Asia’s largest bank, is moving past pilots into enterprise production by deploying deterministic chains of 70 to 80 specialized agents on Google Cloud to synthesize complex financial, regulatory, and market intelligence for corporate credit memos, shifting relationship managers from manual research to high-value client advisory while keeping humans firmly in the loop.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hitachi </strong><span style=\"vertical-align: baseline;\">is transforming global power and utilities by deploying agents directly to frontline workers via HMAX, Hitachi’s portfolio of AI-powered solutions. Field technicians have built agents for over 200 use cases — such as using image-recognition agents to verify photos of every tool and wire before and after a job — boosting productivity by up to 30% while keeping workers safer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NTT DOCOMO</strong><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Japan’s leading mobile operator, built data agents that reduced time-to-insight from two weeks to instant, which gave four hundred fifty thousand hours a year back to the business. Building on this success, they are now deploying Gemini Enterprise to drive their next wave of productivity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tata Steel</strong><span style=\"vertical-align: baseline;\">, a global steel manufacturing leader, successfully deployed more than 300 specialized AI agents in nine months to enhance manufacturing safety, optimize predictive supply chains, and cut customer complaint turnaround times by 50%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-08-Zip-US-Collaborates-with-Google-Cloud-to-Build-AI-Native-Product-Factory-with-Gemini-Enterprise\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Zip</strong></a><span style=\"vertical-align: baseline;\">, an Australia-based digital financial services company, is transforming its product-development lifecycle in the U.S. by deploying Gemini Enterprise to build an AI-Native Product Factory. Cross-functional teams will use this unified agentic environment to connect customer research, design, engineering, and compliance, boosting product development velocity and parallel experimentation while lowering the cost and complexity of bringing new financial products and experiences to market.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Other APAC leaders include </span><strong style=\"vertical-align: baseline;\">LG</strong><span style=\"vertical-align: baseline;\"> in electronics, </span><strong style=\"vertical-align: baseline;\">Marubeni</strong><span style=\"vertical-align: baseline;\"> in trading, and </span><strong style=\"vertical-align: baseline;\">TCS</strong><span style=\"vertical-align: baseline;\"> in technology services.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Latin America</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Banco BV</strong><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">a leader in the Brazilian financial sector, is using Gemini Enterprise to create personalized scripts for its customer relationship managers, accelerating client communications by 80%. The new AI platform allows the bank to quickly engage customers with tailored financing and investment opportunities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CNA/SENAR</strong><span style=\"vertical-align: baseline;\">, Brazil’s national agriculture and livestock federation, is expanding access to critical agricultural information by deploying JoIA, a conversational AI assistant on WhatsApp built on Gemini Enterprise. 40,000 active users, with the potential to support 5 millions producers across the country, have accessed localized input pricing, weather forecasts, and financial health evaluations to facilitate in-field decision-making.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Farmacias del Ahorro</strong><span style=\"vertical-align: baseline;\">, one of Mexico’s leading drugstore and pharmacy retail chains, is accelerating corporate operational efficiency by deploying PotencIA, an internal program built on Gemini Enterprise. 1,000 corporate employees across IT, e-commerce, and marketing have adopted the tools for daily business workflows, boosting active user adoption to 95% while generating an estimated 140,000 hours in annual productivity gains.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Globo</strong><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Latin America’s largest media company, is optimizing early-stage software planning by deploying PlanejaAI, an AI agent solution built on Gemini Enterprise. Product Owners, managers, and analysts have accelerated epic refinement and quarterly planning, boosting pre-development plan accuracy by 33% and slashing validation time from 20 minutes to 6 seconds while saving 127 hours in a single quarter.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Grupo Bafar</strong><span style=\"vertical-align: baseline;\">, a prominent Mexican food producer and consumer retail group, is accelerating national retail expansion by deploying Gemini Enterprise for automated contract management. Legal and retail operations teams have streamlined the preparation of operational annexes for store openings, boosting processing capacity tenfold while slashing contract preparation time from 140 to 17 minutes per branch.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Laureate Education</strong><span style=\"vertical-align: baseline;\">, a major higher education network serving nearly 500,000 students across Mexico and Peru, is transforming academic and administrative operations by deploying Gemini Enterprise and Gemini for Education. Faculty and staff have personalized learning paths, enhanced teacher support resources, and modernised campus administration, boosting student engagement and operational readiness while driving long-term career employability for graduates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Other LATAM leaders include </span><strong style=\"vertical-align: baseline;\">iFood</strong><span style=\"vertical-align: baseline;\"> delivery services, </span><strong style=\"vertical-align: baseline;\">Livelo</strong><span style=\"vertical-align: baseline;\"> in customer loyalty, </span><strong style=\"vertical-align: baseline;\">SEBRAE</strong><span style=\"vertical-align: baseline;\"> in public services, and </span><strong style=\"vertical-align: baseline;\">Yduqs</strong><span style=\"vertical-align: baseline;\"> in education.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">North America</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-05-13-Albertsons-Companies-Announces-AI-Powered-Supply-Chain-Tool-to-Further-Enhance-Produce-Quality-Control-and-Consistency\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Albertsons</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">a leading U.S. food and drug retailer, is ensuring customers get the freshest produce with its patent-pending Intelligent Quality Control tool built with Gemini Enterprise. Distribution center inspectors are using computer vision and Gemini models to instantly evaluate fresh fruit and vegetable quality against company standards, boosting rating consistency across shifts and locations while speeding up inspections to get perishable food onto grocery shelves faster.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-09-11-Avid-and-Google-Cloud-Expand-Strategic-Partnership-to-Deliver-Browser-Based-Media-Composer-and-Agentic-Creative-Workflows\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Avid</strong></a><span style=\"vertical-align: baseline;\">, a leading provider of media technology for film and television, is streamlining video post-production through browser-based editorial experiences and agentic creative workflows built with Gemini Enterprise. Editors and directors can use conversational content discovery, AI-assisted transcription, and intelligent media organization within their creative workflows — including within a Google Chrome browser — helping teams spend less time on manual administrative tasks and more time focused on storytelling.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-06-Google-and-Constellation-Announce-Landmark-Agreement-to-Bring-890-MW-of-New-Nuclear-Capacity-to-PJM-Grid-as-Part-of-Long-Term-Power-Deal\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Constellation Energy Company</strong></a><span style=\"vertical-align: baseline;\">, a leading energy supplier, will build Gemini Enterprise agentic workflows directly into its core operations. Power generation teams will have access to advanced AI capabilities to accelerate capacity delivery, optimize asset dispatch, and protect critical infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.youtube.com/watch?v=9SK_FpcIbvE\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Honeywell</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Technologies</strong></a><span style=\"vertical-align: baseline;\"> <span style=\"vertical-align: baseline;\">Forge platform includes predictive maintenance capabilities built on Gemini Enterprise, such as contextualizing operational data at scale and providing proactive maintenance recommendations. This helps customers minimize costly, unplanned outages, protecting and extending the lifespan of their mission-critical equipment.</span></span></p>\n</li>\n</ul></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=9SK_FpcIbvE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Honeywell Technologies Helps Customers Prevent Unplanned Outages with Gemini Enterprise</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=9SK_FpcIbvE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">PayPal </strong><span style=\"vertical-align: baseline;\">built</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">its AI platform on the Gemini Enterprise to create new commerce tools, cutting the time it takes to deploy new models from weeks to just minutes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The Home Depot</strong><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">the</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">world’s largest home improvement retailer, is speeding up customer support and product discovery by deploying AI voice and digital assistants built on Gemini Enterprise. DIY shoppers and contractors calling stores or using Magic Apron have skipped rigid phone menus, searched local inventory with natural speech, and resolved inquiries in real time, boosting phone resolution speeds by four-fold (understanding customer needs in under 10 seconds) while allowing in-store associates more time to focus on face-to-face shoppers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-08-The-RealReal-Expands-Ask-TRR-AI-Shopping-Agent-With-Google-Clouds-Gemini-Enterprise\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">The RealReal</strong></a><span style=\"vertical-align: baseline;\">, the leading online marketplace for authenticated luxury resale, is transforming luxury consignment by deploying Ask TRR, a conversational shopping concierge built with Gemini Enterprise. Resale shoppers have navigated and searched a massive, shifting catalog using natural language instead of rigid filters, which will boost user engagement across all 45 million members while making it effortless to discover and secure rare, \"one-of-one\" luxury pieces before they sell out.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-08-24-Google-Cloud-Announces-Strategic-Partnership-with-Verizon-to-Scale-Enterprise-AI\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Verizon</strong></a><span style=\"vertical-align: baseline;\"> is modernizing its customer and enterprise operations with Gemini Enterprise and agentic Data Cloud. The technology has helped resolve inbound customer calls and chats automatically, helped predict and resolve network anomalies, and automated marketing campaign orchestration, boosting customer satisfaction and automated resolution rates while unifying legacy data lakes into a single source of truth.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/transform/whenere-dreamlands-gemini-jane-austen-fortnite-future-of-fan-fiction\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Whenere</strong></a><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">an immersive storytelling platform, is revolutionizing interactive 3D worldbuilding, starting with</span><span style=\"vertical-align: baseline;\"> bringing Pride and Prejudice to Fortnite. To build the Netherfield estate, the team used </span><strong style=\"vertical-align: baseline;\">Dreamlands</strong><span style=\"vertical-align: baseline;\">, an agentic 3D worldbuilding platform built on Gemini Enterprise. With Gemini generating each new texture in about seven seconds for under ten cents, one artist created nearly 250 custom assets in a single day and completed a historically accurate estate in under a week, all while keeping full creative control.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Leading hospital systems and healthcare services companies like </span><strong style=\"vertical-align: baseline;\">Highmark Health</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">Seattle Children's</strong><span style=\"vertical-align: baseline;\"> rely on Gemini Enterprise to run secure administrative and clinical support workflows.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">In public sector,</strong><span style=\"vertical-align: baseline;\"> Gemini Enterprise is being used across the states of Arizona and Missouri, the </span><strong style=\"vertical-align: baseline;\">State University of New York (SUNY),</strong><span style=\"vertical-align: baseline;\"> and the </span><strong style=\"vertical-align: baseline;\">Chief Digital and Artificial Intelligence Office,</strong><span style=\"vertical-align: baseline;\"> which has put Gemini Enterprise in the hands of 3 million uniformed and non-uniformed members of the US armed services. They have built more than a hundred thousand custom agents to streamline everyday tasks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/topics/startups/how-to-grow-your-small-business-using-google-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Small and midsize businesses</span></a><span style=\"vertical-align: baseline;\"> including </span><strong style=\"vertical-align: baseline;\">Aerotech</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">EDSpan Global</strong><span style=\"vertical-align: baseline;\">,, </span><strong style=\"vertical-align: baseline;\">Pinch</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Creative</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Quadrant</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Health</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Group</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Salt</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Productions</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Strategem, </strong><span style=\"vertical-align: baseline;\">and more are using Gemini Enterprise to empower their teams with AI agents that can streamline their operations, automate administrative workloads, help find information, and even support customer engagement. In fact, usage of Google Cloud’s AI tools by these customers has grown more than 5x year over year. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Other North American startups and innovators like </span><strong style=\"vertical-align: baseline;\">Every Cure, Harvey</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">OpenEvidence, Recursion</strong><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">and</span><strong style=\"vertical-align: baseline;\"> Replit</strong><span style=\"vertical-align: baseline;\"> are using Gemini Enterprise.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Our commitments to you</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As you build the future on Gemini, we make three firm commitments:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">We take the friction out: A future-proof platform that runs anywhere, executes any task, supports your choice of models, and applies enterprise controls.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">We eliminate complexity: Google builds and integrates the entire stack: silicon, models, skills, tools, and security.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">What you build stays yours: Your people and your data do not need to move, and your proprietary inputs and outputs remain entirely your own.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">The technology is ready, our global partner ecosystem is scaling, and Gemini is ready to work for you.</span></p></div>"
