    "id": "bb4d9f174616e9e5509ca9c4b105bb2d"
    "title": "Introducing Google Cloud’s U4 compute: Enabling ultra-low latency trading"
    "link": "https://cloud.google.com/blog/topics/financial-services/ultra-low-latency-solution-with-u4-enables-high-velocity-trading/"
    "published": "2026-10-08 01:00:00"
    "fetched": "2026-10-08 02:16:12"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In capital markets, operational success is built on predictable performance and low latency, where even tiny variations in packet timing alter queue priority and trade execution. At the same time, both exchange venues and their participants face mounting constraints in traditional on-premises data centers — from power and physical rack space limits to lengthy hardware procurement cycles. Increasingly, global capital markets seek the speed and determinism of physical co-location combined with the dynamic scalability and automation of the cloud.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google Cloud Next ‘26, we announced the </span><a href=\"https://cloud.google.com/blog/products/networking/whats-new-in-cloud-networking-at-next26#:~:text=Ultra%20Low%20Latency%20Solution%20for%20financial%20exchanges\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ultra Low Latency (ULL) Solution</span></a><span style=\"vertical-align: baseline;\">, now generally available, providing high-frequency trading workflows that run in the cloud with an ultra-low latency network and agility. The ULL Solution includes the new </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/u4-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">U4 machine family</span></a><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: sub;\">,</span></span><span style=\"vertical-align: baseline;\"> also generally available today. </span></p>\n<p><span style=\"vertical-align: baseline;\">The ULL Solution is based on three infrastructure pillars:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hardware-level networking:</strong><span style=\"vertical-align: baseline;\"> Scaleable, hardware-based multicast data distribution for reliable market-data feeds</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Advanced networking observability:</strong><span style=\"vertical-align: baseline;\"> Dynamic </span><span style=\"vertical-align: baseline;\">network traffic capture with hardware-level timing accuracy, facilitating consistent</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">auditing, market replays, and absolute trade validation without impacting primary traffic performance</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deterministic high-performance compute:</strong><span style=\"vertical-align: baseline;\"> Processing of latency-critical execution tiers in a highly predictable, consistent amount of time, every single time</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Taken together, the ULL Solution’s compute, storage, networking, and observability provide financial exchanges and market participants with a number of technical capabilities: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Bare metal performance:</strong><span style=\"vertical-align: baseline;\"> Dedicated bare metal compute provides direct access to physical host resources, minimizing jitter and delivering predictable, low-latency execution for market-data feeds and order routing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">High-performance storage options:</strong><span style=\"vertical-align: baseline;\"> Local Titanium SSDs handle real-time transaction and tick logging on the host, complemented by scalable </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> for persistent market data archives and analytics.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Physical traffic isolation</strong><span style=\"vertical-align: baseline;\">: The ULL trading fabric’s redundant A/B multicast market feeds are accessed through two independent and dedicated </span><a href=\"https://cloud.google.com/titanium?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium adapters</span></a><span style=\"vertical-align: baseline;\">, while an independent third Titanium adapter offloads telemetry, management, and provides access to Google Cloud services.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hardware-accelerated multicast distribution: </strong><span style=\"vertical-align: baseline;\">The ULL network architecture supports hardware-level multicast feed ingestion. This allows participants to stream high-throughput market data directly to low-latency trading applications, bypassing traditional hypervisor-level virtual switches.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Accelerated packet processing:</strong><span style=\"vertical-align: baseline;\"> Support for </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/use-onload\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenOnload</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/use-dpdk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DPDK</span></a><span style=\"vertical-align: baseline;\"> enables Linux user-space networking to deliver predictable unicast and multicast packet handling while minimizing application code changes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Precision timing and UTC synchronization: </strong><span style=\"vertical-align: baseline;\">Integration with Google Cloud’s</span><strong style=\"vertical-align: baseline;\"> </strong><a href=\"https://cloud.google.com/blog/products/networking/understanding-the-firefly-clock-synchronization-protocol\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Firefly</span></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">clock synchronization system allows the solution to consistently</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">achieve</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/networking/understanding-the-firefly-clock-synchronization-protocol?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sub-10 nanosecond network-level timestamping</span></a><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">and</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">better synchronization to UTC than the sub-100 microsecond regulatory requirement for financial exchanges.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Built-in telemetry</strong><span style=\"vertical-align: baseline;\">: </span><span style=\"vertical-align: baseline;\">24/7 low-latency packet capture and seamless out-of-band packet brokering for regulatory compliance and real-time analytics helps ensure deep visibility without impacting primary traffic performance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">24-7 market ready</strong><span style=\"vertical-align: baseline;\">: The solution is </span><span style=\"vertical-align: baseline;\">designed for continuous, round-the-clock trading readiness by isolating production workloads in a dedicated primary zone for live trading, while routine cloud maintenance and qualification testing occur in a secondary zone for updates and testing.</span><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Compute in the ULL Solution is delivered by the new </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/u4-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">U4 machine</span></a><span style=\"vertical-align: baseline;\"> family, which brings predictable performance and ultra-low latency compute in three specialized machine series: dual-socket bare metal instances with three physical NICs — </span><span style=\"vertical-align: baseline;\">U4P for exchange operators and U4C for market participants</span><span style=\"vertical-align: baseline;\"> — alongside U4S high-performance VMs for operators, participants, and service providers.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Machine Series</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/cpu-platforms\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CPU Platform</strong></a></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">CPU Cores</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Memory</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">NICs</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Storage Options</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">U4P</strong></p>\n<p><strong style=\"vertical-align: baseline;\">(Bare Metal)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Intel 5th Gen Xeon (Emerald Rapids)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">120 Physical Cores</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">512 GB or 768 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3 Physical (1 Standard + 2 ULL)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Local Titanium SSD (12 TiB), Hyperdisk</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">U4C</strong></p>\n<p><strong style=\"vertical-align: baseline;\">(Bare Metal)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Intel 5th Gen Xeon (Emerald Rapids)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">120 Physical Cores</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">512 GB or</span></p>\n<p><span style=\"vertical-align: baseline;\">768 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3 Physical (1 Standard + 2 ULL)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Local Titanium SSD (12 TiB), Hyperdisk</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">U4S</strong></p>\n<p><strong style=\"vertical-align: baseline;\">(VM)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Intel 6th Gen Xeon (Granite Rapids)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2 to 288 vCPUs</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Up to 2,232 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multi-vNIC (Up to 200 Gbps)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Local Titanium SSD (18 TiB), Hyperdisk</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">We developed the U4 machine family to enable the world’s most technically demanding markets to run within Google Cloud and benefit from cloud services and scale. An example of this is our ongoing collaboration with CME Group, through which we are migrating listed derivatives markets to Google Cloud. Here, the U4C and U4P bare metal instances deliver direct physical co-location latency parity, providing predictable low-latency clock precision, and native hardware-multicast feed ingestion. This architecture demonstrates that core exchange systems and trading strategies can run in the cloud with the speed, consistency, and control that financial markets require.</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"cme group\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/cme_group_g3mWTg1.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Migrating the world’s leading derivatives marketplace to the cloud requires uncompromising performance, latency, and reliability. Google Cloud’s Ultra Low Latency Solution and the U4 instance families represent a breakthrough for financial market infrastructure. By combining deterministic, ultra-low latency networking and dedicated bare metal compute with the benefits of the cloud, market participants can execute and ingest market data and execute with the speed of traditional co-location and the agility of the cloud.\" -</i> Pearce Peck-Walden, Managing Director Markets Engineering, CME Group</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Powered by Google Cloud-native infrastructure</span></h3>\n<p><span style=\"vertical-align: baseline;\">The ULL Solution is available in select </span><a href=\"https://docs.cloud.google.com/ull-solution/configuration-overview#locations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">private Google Cloud regions</span></a><span style=\"vertical-align: baseline;\">, where trading teams can leverage core cloud infrastructure benefits such as rapid automated resource provisioning, on-demand capacity scaling, and dynamic fleet management. Trading teams can execute ultra-low latency trades on a dedicated, isolated ULL network, and offload data streams over an independent network interface to Google Cloud services such as BigQuery and Gemini Enterprise. </span></p>\n<p><span style=\"vertical-align: baseline;\">For exchange participants managing tick-to-trade workflows or processing real-time market data, microsecond variations are critical. As bare metal instances, U4P and U4C machine series don’t add any virtualization overhead for latency-sensitive execution tiers. Leveraging Google Cloud's Titanium offload system architecture, these bare metal instances provide direct access to the host resources. Compute Engine instances enable users to provision dedicated hardware through standard Google Cloud APIs, orchestrate deployments with infrastructure as code, apply Cloud Next Generation Firewall (NGFW) policies, and collect rich telemetry.</span></p>\n<p><span style=\"vertical-align: baseline;\">The U4S VM series complements these bare metal offerings for applications such as pre-trade risk validation and real-time analytics. Deployed alongside U4P and U4C instances, these VMs shorten transit hops across the trading architecture while offering elastic scaling from 2 to 288 vCPUs and networking up to 100 Gbps.</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"prime trading\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/prime_trading.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>“Our testing of the U4 instances validated that Google Cloud delivers the low latency and determinism required for our demanding exchange trading workloads. Having both bare metal and VM options allows us to evaluate the value of that performance relative to its cost, helping us align the right infrastructure to each of our trading strategies.”</i> - Corbin Kidd, EVP/CTO, Prime Trading</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"28stone\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/28stone.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"In our tick-to-trade performance testing, the U4C bare metal instance demonstrated exceptional speed, showing that cloud compute and ultra-low latency networking can comfortably satisfy microsecond trading demands. But, what sets the U4 series apart isn't just raw processing speed, it’s structural determinism. When we stress-tested Google Cloud's U4 bare metal family, the performance curve remained virtually flat, which confirms that these cloud compute layouts can now offer the strict determinism institutional market participants require.\"</i> - Christopher Wilson, Global Head of Experience Modernization, 28Stone</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Looking to the future, this low-latency architecture serves as the foundation for algorithmic trading, allowing firms to feed real-time markets directly into AI-driven trading models. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Storage and placement for trading workloads </strong></h3>\n<p><span style=\"vertical-align: baseline;\">The U4 family supports Google Cloud storage options and placement policies, helping trading teams record trades at speed and minimize network latency between machines:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Local Titanium SSD for fast logging: </strong><span style=\"vertical-align: baseline;\">For real-time trade logging and data caching without slowing down execution, U4P and U4C provide up to 12 TiB of direct-attached NVMe SSDs, and U4S VMs scale up to 18 TiB.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hyperdisk for data archives: </strong><span style=\"vertical-align: baseline;\">For historical market data, backtesting models, and regulatory archives, you can attach Hyperdisk Balanced and Hyperdisk Extreme volumes across all U4 series, scaling up to 32 volumes and 512 TiB per instance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Placement policies:</strong><span style=\"vertical-align: baseline;\"> To reduce physical network hops, compact placement policies keep related machines close together in the data center. Alternatively, spread placement policies place machines on separate racks to improve resiliency.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Getting started with the ULL Solution</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With the ULL Solution, financial exchange operators, exchange participants, and trading service providers can execute trades with the speed and reliability they need today while positioning their businesses to leverage continuously evolving AI and infrastructure capabilities for the trading of tomorrow. The </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/release-notes?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ULL Solution</span></a><span style=\"vertical-align: baseline;\"> is available in select Google Cloud regions. To learn more, check out the </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/configuration-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">public documentation</span></a><span style=\"vertical-align: baseline;\">, and reach out to our team to </span><a href=\"mailto:exchanges@google.com\"><span style=\"text-decoration: underline; vertical-align: baseline;\">request access</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
