"overview": |
  この日は 10 件で、AI インフラのスケーラビリティ強化、Spanner Omni の一般提供、そしてエージェント向けの MCP サーバー追加が中心でした。AI インフラとオーケストレーションの 9 月のまとめでは、エージェントのフリートが大量に動く時代に備え、ワークロードの分離とセキュリティを保ちつつコストを抑えたまま需要に素早く応えるための強化が、コンピュート・ネットワーク・ストレージ・オーケストレーションの各領域で紹介されました。GKE では、エージェント型ワークロード向けに高密度な実行ランタイムを提供する新しいオープンソースの GKE Agent Substrate が公開され、標準的なコンテナランタイムの 10 倍の密度で数百万のサンドボックスを動かせます。ネイティブなゼロトラストのカーネルとネットワーク分離を備え、毎秒 500 回を超える一時停止・再開のアクティベーションで 500 ミリ秒未満の再開を実現します。あわせて GKE にスケールトゥゼロの機能が組み込まれ、Autoscaling Metric を使った HPA と KEP-2021 のサポートによって、複雑なコンポーネントを構成せずにワークロードを縮退させられるようになりました。データベースでは、どこにでもデプロイできる Spanner の形態である Spanner Omni が一般提供となりました。オンプレミスのデータセンターや他社クラウドでも要求の厳しい本番ワークロードを動かせます。Spanner は 10 年以上前に分散 SQL の市場を切り開き、NoSQL の水平スケーラビリティと従来のリレーショナルデータベースの ACID 準拠・強い整合性を組み合わせたもので、現在は SQL・グラフ・キーバリュー・全文検索・ベクトル検索に列指向エンジンによる分析処理までを 1 つのデータベースで扱う相互運用可能なマルチモデルデータベースへと発展しています。Spanner Omni はフルマネージドの Spanner と同じ中核機能を備えつつ、プライベートデータセンターの仮想マシンや Kubernetes、複数クラウドにまたがる構成、ノート PC でのローカル検証まで、必要な場所にデプロイできる自由を加えます。エージェント向けには、Google Cloud CLI のリモート MCP サーバーがプレビューで登場しました。gcloud と bq (BigQuery) のコマンドラインツールを基盤とし、数百のコマンドの汎用性を 1 つの MCP サーバーにまとめることで、AI エージェントが Google Cloud インフラの管理や高度な BigQuery ワークフローに安全に幅広くアクセスできます。CLI コマンドは複数段階のワークフローや検証チェック、高水準の操作を 1 つのコマンドにまとめた高い抽象度を提供し、LLM が公開されたコマンドラインのドキュメントや構文、使用例で十分に事前学習されているため呼び出しが直感的で正確になる、という 2 つの利点が挙げられています。エージェント実行環境に Google Cloud CLI のバイナリを入れて保守する必要もなくなります。セキュリティでは、ソフトウェアサプライチェーンの保護に関する記事が 2 本公開されました。Secure Source Manager (SSM) では 2 つの新機能が一般提供となり、1 つは企業ネットワークが侵害された場合でもバージョン管理システムからビルド・アーティファクトのシステム、デプロイツールに至る CI/CD システムへの不正アクセスをブロックするもの、もう 1 つはファイル単位・ブランチ単位で pull リクエストの承認者セットを管理する新しい Code Owners システムです。CODEOWNERS ファイルをリポジトリにチェックインし、glob スタイルのパス指定子でパスごとの承認者セットを指定でき、同じファイル内で main と dev に異なるオーナーを定義してマージコンフリクトを解消でき、巨大な 1 ファイルに縛られないネスト可能な複数ファイルのオーナー設定にも対応します。背景として、Wiz のクラウド脅威ハイライトレポートで 2026 年上半期のサプライチェーン攻撃が 2025 年下半期と比べて 2 倍以上に急増したことが挙げられています。もう 1 本は、Google の AI およびインフラストラクチャチームによるエージェント型のセキュリティ手法の紹介です。大規模な単発スキャンに頼る代わりに、AI エージェントがコードのチェックインをリアルタイムで評価する送信前スキャンに重点を置き、デベロッパーの使い慣れたツールに組み込むことでセキュリティを日常的な作業にしています。オープンソースのマルチエージェントレビューハーネス Mantis を発展させ、静的な文書ではなくリアルタイムのコードベースメタデータを使うローカライズされた脅威モデルと照合することで精度を高め、場合によっては偽陽性率を 3% まで抑えています。インフラにデプロイされる数億行のコードのあらゆる変更を継続的にスキャンし、毎月数百件の脆弱性が本番環境に入るのを防いでいるとされます。公共部門では、Google Public Sector がエージェントの時代のサービス提供を再定義する取り組みが紹介されました。全米州最高情報責任者協会 (NASCIO) の州 CIO 年次トップ 10 レポートで AI が初めて最優先事項に入ったことを背景に、レガシーデータのサイロ化・手作業のボトルネック・同じ証明書類を何度も求められる利用者の負担という課題に対し、ユタ州運輸省 (UDOT) が 52,000 以上の土地区画の特定と地図化を当初見積もりの 33.5 年から BigQuery 上の統合データプラットフォームで 1 年未満に短縮した事例、ハートフォード市が全ての公聴会で 80 言語のリアルタイム双方向翻訳を提供している事例が挙げられています。FinOps では、フランスの通信事業者 Orange がデリバリーを一時中断して全員でクラウド費用の整理に 1 日を充てる「FinOps Clean Days」を、ランキングや特典を使ったゲーム要素とハッカソンの形で運営し、100 人以上が参加する FinOps コミュニティで社内ネットプロモータースコア 70 超を得た取り組みが、FinOps リードの Camille Marini 氏へのインタビューとして紹介されました。クラウド FinOps を責任の共有と位置づけ、それを実現する道はコミュニケーションと意図的な変革の取り組みだけだという 2 つの原則が語られています。あわせて、Cloud CISO Perspectives の 2026 年 9 月第 2 回では、Office of the CISO のシニアディレクターである Alicja Cade 氏と Nick Godfrey 氏が、サイバーセキュリティのスタートアップが CISO を顧客・パートナーとして獲得するための指針を示しました。
