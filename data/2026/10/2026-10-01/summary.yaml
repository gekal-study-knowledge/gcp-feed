"overview": |
  この日は 6 件 (重複を除くと 4 件) で、Spanner の展開先の拡大と、エージェント向けのインターフェイスが中心でした。データベースでは、Spanner をどこにでも展開できる Spanner Omni が一般提供となりました。オンプレミスのデータセンターや他のクラウドでも、要求の厳しい本番ワークロードを動かせます。Google は 10 年以上前に Spanner で分散 SQL の市場を切り開き、NoSQL の水平スケーラビリティと従来のリレーショナルデータベースの ACID 準拠・強整合性を組み合わせました。その後 Spanner は、SQL・グラフ・キーバリュー・全文検索・ベクトル検索に列指向エンジンによる分析処理までを 1 つのデータベースで扱う相互運用的なマルチモデルデータベースへ進化し、複雑なワークロードを単純化してエージェント型 AI を支えています。Google Cloud Next ’26 で Spanner Omni を発表して分散データベースを Google Cloud から切り離し、利用者のインフラへ直接持ち込めるようにしたところ、エンタープライズの顧客から大きな関心が寄せられたとされています。エージェント向けでは、Google Cloud CLI のリモート MCP サーバーがプレビューで加わりました。よく使われる gcloud と bq (BigQuery) のコマンドラインツールを土台に、Google Cloud のインフラ管理や高度な BigQuery のワークフローに対するコマンドライン操作へ、AI エージェントが安全にすぐ広くアクセスできるようにするものです。エージェントは複雑なクラウド操作をこなすようになってきたものの、バックエンドとのやり取りの仕方を標準化するのが難しいという課題があり、数百の gcloud と bq のコマンドを 1 つの MCP サーバーにまとめることで、複雑な多段のワークフローや検証を 1 つの操作に包んだ高水準の抽象をエージェントに与えられるとしています。インフラの振り返りとして、9 月を「スケーラビリティの月」と位置づけた AI インフラとオーケストレーションの更新まとめも公開されました。エージェントの群れが押し寄せる時代に備えて、ワークロードの分離とセキュリティを保ちつつコストも抑えながら、需要に手際よく素早く応えられるよう基盤を固めているとして、コンピュート・ネットワーク・ストレージ・オーケストレーションにまたがる改善 (エージェント型ワークロードのためにより高い密度で動く新しいオープンソースの GKE Agent Sandbox など) と、利用者の新しい使い方、第三者による戦略の評価が取り上げられています。このほか Cloud CISO Perspectives の 2026 年 9 月 2 回目が公開され、Office of the CISO のシニアディレクターである Alicja Cade と Nick Godfrey が、サイバーセキュリティのスタートアップが重要な事業パートナーや顧客となる CISO の支持をどう得るかについて助言しています。
