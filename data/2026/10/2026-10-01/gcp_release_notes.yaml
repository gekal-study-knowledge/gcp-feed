    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Change</h3>\n<p>An updated version of the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/odbc-jdbc-drivers#current_jdbc_driver\">Simba JDBC driver for BigQuery</a>\nis now available.</p>\n<h3>Feature</h3>\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/graph-chat\">Chatting with graphs</a> in\n<a href=\"https://docs.cloud.google.com/bigquery/docs/conversational-analytics#graphs\">conversational analytics</a>\nis now\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>.\nYou can use a combination of multiple graphs, tables, views, and UDFs as data\nsources.</p>\n<h3>Feature</h3>\n<p>BigQuery pipelines provides support for automated metadata enrichment\nand Knowledge Catalog data quality scorecard integration. In addition, the\nData Engineering Agent can proactively generate semantic metadata for your\npipeline assets. For more information, see\n<a href=\"https://docs.cloud.google.com/bigquery/docs/manage-pipelines#metadata-scorecard\">Metadata enrichment and data quality scorecard integration</a>.\nThese features are\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>.</p>\n<h2 class=\"release-note-product-title\">Dataform</h2>\n<h3>Feature</h3>\n<p>Dataform provides support for automated metadata enrichment and Knowledge Catalog data quality scorecard integration for Dataform workflows and BigQuery pipelines. For more information, see\n<a href=\"https://docs.cloud.google.com/dataform/docs/create-tables#add-metadata\">Add metadata for Knowledge Catalog</a>.\nThis feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>.</p>\n<h2 class=\"release-note-product-title\">Google Cloud VMware Engine</h2>\n<h3>Feature</h3>\n<p><strong>Generally available</strong>: Bring Your Own License (BYOL) license management for\nGoogle Cloud VMware Engine is generally available (GA). BYOL license management lets you\nregister and manage portable VMware Cloud Foundation (VCF) license keys in the\nGoogle Cloud console across projects associated with your Cloud Billing account.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/vmware-engine/docs/license-management\">License management</a>.</p>"
