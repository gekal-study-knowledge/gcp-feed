  "22b0dfea86fb9c6c5276928aab44ab1c":
    "id": "22b0dfea86fb9c6c5276928aab44ab1c"
    "title": "Orange はどのように FinOps のアカウンタビリティを確立し、なぜ次にエージェントなのか"
    "link": "https://cloud.google.com/blog/ja/topics/telecommunications/how-orange-uses-agents-to-make-finops-everyones-responsibility/"
    "published": "2026-10-01 11:30:00"
    "fetched": "2026-10-01 15:50:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 17 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/telecommunications/how-orange-uses-agents-to-make-finops-everyones-responsibility?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">フランスを拠点とする大手多国籍通信プロバイダの </span><a href=\"https://cloud.google.com/customers/orange\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orange</span></a><span style=\"vertical-align: baseline;\"> では、エンジニアリング チームがデリバリー バックログを一時中断して、全員でクラウド費用のクリーンアップに 1 日を費やす日があります。ランキングが表示され、素敵な特典が用意されています。経験豊富な実務担当者が初心者を指導するため、初心者は実際に作業しながら仕事を覚えます。一日の終わりには、プロジェクトの支援者（スポンサー）も結果を確認できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Orange はこれを FinOps Clean Days と呼んでいます。ゲーム要素を取り入れたハッカソンと組み合わせることで、100 人以上の社員が参加する FinOps コミュニティは、社内におけるネット プロモーター スコアで 70 を超える評価を獲得しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの数字は、業界全体が苦戦しているある課題を示唆しています。最近の State of FinOps レポートでは、エンジニアに行動を起こさせることが、組織が直面する最大の課題の一つとして挙げられています。単なる認識から実際の行動へと移すには、FinOps のアカウンタビリティを醸成し、チームに真剣に取り組んでもらう方法を見つけなければなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">つまり、FinOps はビジネスにおける「変革」の課題と言えます。そして、ビジネスの変革に関する課題には、既知の解決策があります。Orange の FinOps リードである Camille Marini 氏に、同社がどのようにしてこれらの課題を克服し、AI の導入と ROI を加速させたのか、また、他の組織がどのようにして同じ道をたどることができるのかについて詳しくお話を伺いました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Clean Days が効果的な理由</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Orange は、FinOps チームの立ち上げ当初から、2 つの原則を掲げています。1 つ目は、Cloud FinOps は責任の共有であり、プロジェクトのすべての関係者がそれぞれの方法で関与する、という点です。そして 2 つ目は、その責任の共有を実現する唯一の道はコミュニケーションと、意図的な変革の取り組みである、という点です。</span></p>\n<p><span style=\"vertical-align: baseline;\">「FinOps の実践において、組織全体で責任の共有というコンセプトを重視しました」と Marini 氏は語ります。「これは、クラウド セキュリティに対する当社のアプローチと非常によく似ています。責任ある効果的な AI への支出と使用を実現するには、プロジェクトのすべての関係者が、それぞれの方法で FinOps に関与していることをチームに理解してもらう必要がありました。」</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの原則に基づき、Orange は Google Cloud コンサルティングのサポートを受けて FinOps 実践コミュニティを立ち上げました。このコミュニティは、標準化されたコミュニケーション チャネルで運営されたため、その手法は中心メンバーの枠を超えて広く浸透しました。また、会議では具体的な最適化案や請求の更新情報を共有し、常に「すぐに行動に移せる内容」に徹したことで、すべてのセッションが参加者にとって価値あるものとなりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Clean Days は、アジャイルなチームが実際にどのように機能しているかを見極めたうえで考案されました。デプロイが絶え間なく行われるアジャイル環境では、最適化作業がスプリントより優先されることはほとんどありません。デリバリーの優先事項、バックログ、日常業務で、利用できる時間は真っ先に埋まってしまいます。そこで Orange は、専用の時間を確保し、それを共同作業にして、楽しいイベントに仕立て上げました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このアプローチがなぜ効果的なのかは、McKinsey の「変革の 4 つの構成要素」によって説明がつきます。このフレームワークでは、大規模な組織変更には、次の 4 つの領域にわたるアクションが必要であるとしています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">納得と理解:「自分に何が期待されているかを理解し、それに同意している。」</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">公式なメカニズム:「構造、プロセス、システムによって変化が促されている。」</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ロール モデリング:「リーダーや同僚の行動が変化している。」</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">人材とスキル:「新しい方法で行動するためのスキルと機会が与えられている。」</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Orange の手法をこれらのブロックにマッピングすると、パターンが見えてきます。ゲーム要素と報酬により、エンジニアたちにお手本となる同僚が生まれます。ランキングによってさまざまな行動が可視化され、スポンサーはすぐに成果を確認できます。経験豊富な実務者が初心者を指導することで、コミュニティ自体を通じて人材とスキルが育成されます。定期的なセッションで最適化と請求に関する最新情報を共有することで、資金の使途を把握しているという確信が生まれます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_m5giQlH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>変化の 4 つの構成要素にマッピングされた FinOps アクティビティと、AI エージェントがそれらを強化できるポイント。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">100 人を超える場合</strong></h3>\n<p><span style=\"vertical-align: baseline;\">100 人の熱心なコミュニティを築くことは、それだけでも十分に大きな成果です。しかし、数千人のエンジニアを抱える組織では、中央の FinOps チームが全員に直接連絡することはできません。リーダーにとっての課題は、Orange のようなコミュニティがもたらすもの、つまり意識改革、当事者意識の共有、行動の習慣化を、FinOps チームが直接アプローチできない人々に、どのように浸透させていくかです。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここで、AI エージェントの出番です。AI エージェントは 2 つの主なメリットをもたらし、FinOps チームの能力を高めます。これまで人間が対応せざるを得なかった、複雑で時間のかかる作業をエージェントが引き受け、社内の誰もが摩擦なしに FinOps に取り組めるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントをチームに定着させるには、自社が抱える具体的な課題に焦点を当てた戦略が必要です。こうした課題は多くの場合、認知負荷の高さ、責任の所在のあいまいさ、あるいは優先事項の競合などから生じています。まずは、FinOps ライフサイクルにおいてエンゲージメントが低下するポイントを特定します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">認識のギャップ: チームが支出の影響を把握していない場合、分析情報エージェントが、日常的に使用するツールにリアルタイムの費用データを push できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">リソースのギャップ: エンジニアがバックログの消化に追われているなら、修復エージェントがすぐに効果の出る対策を特定し、そのままマージできる状態のコード変更として提示してくれます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">複雑さのギャップ: レポート作成が面倒なルーティン作業のように感じられる場合、オーケストレーション エージェントがデータを収集してプロセスを簡素化できます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">信頼から始め、自律性を追加する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">賢明な進め方は、段階を踏んで進めることです。Orange のように、コミュニティ プラクティスを確立します。次に、情報提供と提案を行う読み取り専用エージェントを導入します。コミュニティ全体でこれらが定着して初めて、システムに直接変更を加えるエージェントの構築へと進むべきです。直接的なアクションには運用上のリスクが伴うため、慎重に管理してください。しかし同時に、そこにこそ、最も大きな成果が眠っているのも事実です。</span></p>\n<p><span style=\"vertical-align: baseline;\">どのように構築するかは、誰が構築を担うかによって異なります。最小限のコードで迅速にデプロイしたいチームの場合は、</span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise app</span></a><span style=\"vertical-align: baseline;\"> がエージェントを作成するためのノーコード環境を提供します。きめ細かい制御を必要とするデベロッパー向の場合は、</span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\">（旧称 Vertex AI）が、Agent Development Kit（ADK）などのフレームワークで構築されたエージェントをリリースして管理するための高度なツールを提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud FinOps は、一元化されたレポートから、実際の開発現場で即座にアクションを起こすフェーズへと移行しつつあります。この変革に成功している組織は、まず「文化の醸成」から始め、次に AI エージェントを活用することで、一つのチームの限界を超えた組織全体への拡大を実現しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Orange の数値はコミュニティの取り組みから得られたものです。その基盤を構築することが、最初に真似るべき部分です。この取り組みをさらに拡大する準備ができたら、</span><a href=\"https://cloud.google.com/consulting\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud コンサルティング</span></a><span style=\"vertical-align: baseline;\">がコミュニティ プラクティスの形成を支援します。また、Gemini Enterprise アプリを活用すれば、最初の読み取り専用エージェントを手軽にチームへ導入することができます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google、AI Transformation および FinOps コンサルタント、<strong>Samuel Moss</strong></span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google、AI Transformation コンサルタント、<strong>Celine Devie</strong></span></p></div>"
  "cbfccaaba6f23f68277889f2571acd10":
    "id": "cbfccaaba6f23f68277889f2571acd10"
    "title": "Secure Source Manager の新機能で CI / CD パイプラインを強化"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/strengthen-your-cicd-pipeline-with-new-secure-source-manager-capabilities/"
    "published": "2026-10-01 11:00:00"
    "fetched": "2026-10-01 15:50:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 22 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/strengthen-your-cicd-pipeline-with-new-secure-source-manager-capabilities?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">レジリエンスを備えたソフトウェア サプライ チェーンは、最新のデリバリーの基盤であり、継続的インテグレーションと継続的デリバリー（CI / CD）パイプラインを保護することこそが、イノベーションを安全に推し進める原動力となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Wiz の最新の</span><a href=\"https://www.wiz.io/blog/cloud-threat-highlights-h1-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">クラウド脅威ハイライト レポート</span></a><span style=\"vertical-align: baseline;\">によると、2026 年上半期の注目すべきサプライ チェーン攻撃は、2025 年下半期と比較して 2 倍以上に急増しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">プライベート クラウドにおいて、ソースコードが最も脆弱な部分にならないようにすることが重要です。ソフトウェア サプライ チェーンの脅威に、より効果的に対処できるよう、Google Cloud Secure Source Manager（SSM）では、統一された認証と認可の仕組みを使用して、ソースコードと CI / CD システムを管理できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、開発と CI / CD ワークフローを簡素化し、セキュリティを高める 2 つの新機能の一般提供を開始しました。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CI / CD システムへの不正アクセス</strong><span style=\"vertical-align: baseline;\">: 攻撃者は、デプロイ スクリプトをたった 1 つ改ざんするだけで、CI / CD パイプラインをマルウェアの拡散ルートに変貌させてしまいます。このリスクを軽減するため、SSM は、バージョン管理システムからビルドやアーティファクトのシステム、デプロイツールに至るまで、たとえ企業ネットワークが侵害された場合でも、CI / CD システムへの不正アクセスをブロックできるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">権限を持つユーザーによるコードの不正な変更</strong><span style=\"vertical-align: baseline;\">: 新しい Code Owners システムは、ファイル単位、ブランチ単位で pull リクエストの承認者セットを管理し、よりきめ細かい Identity and Access Management（IAM）を提供します。Code Owners は、コードの記述、編集、レビューを行うエンジニアを支援します。リポジトリ内のファイルとディレクトリに、ファイル単位またはブランチ単位で追加の保護ルールを適用します。</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">主な機能</strong></h3>\n<p><span style=\"vertical-align: baseline;\">CI / CD パイプラインへのソースコード変更をはじめとして、新しい Code Owners 機能はきめ細かいマージガードを提供します。CODEOWNERS ファイルをリポジトリにチェックインすることで、必要な承認者を極めて詳細に指定できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パスごとの承認者セット</strong><span style=\"vertical-align: baseline;\">: 柔軟な glob スタイルのパス指定子を使用して、一致するファイルへの変更に対して、指定されたユーザーセットの 1 人以上による承認を必須にすることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ブランチ固有のガバナンス</strong><span style=\"vertical-align: baseline;\">: セキュリティ ルールとデプロイルールをブランチ間でスムーズに管理できます。同じファイル内で main や dev に異なるオーナーを定義できるため、既存の CODEOWNERS ソリューションで発生するマージ コンフリクトを解消できます。詳しくは、</span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/codeowners#branch-specific_ownership\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ネスト可能な複数ファイルのオーナー設定</strong><span style=\"vertical-align: baseline;\">: 5,000 行にも及ぶような巨大なルートファイル 1 つに縛られる必要はありません。CODEOWNERS ファイルはサブディレクトリにネストできます。SSM は「ローカル優先」ロジックを採用しているため、サブチームがそれぞれのフォルダのオーナー権限を持ちつつ、ルート管理者はリポジトリ全体に対する拒否権を維持できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">独立した承認セクション</strong><span style=\"vertical-align: baseline;\">: [SectionName][count]</span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/codeowners#sections-for-multiple-approval-sets\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">構文</span></a><span style=\"vertical-align: baseline;\">（例: [Security Team][2]）により、1 つの pull リクエスト（PR）において、複数の部門からの個別の承認を同時に義務付けることが可能になります。PR 自体はチームのメンバーによってレビューされても、セキュリティ チームのメンバー 2 人による承認が揃うまではマージできないようになっています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ソースコードの準備が整ったら、SSM の新しい </span><a href=\"https://docs.cloud.google.com/developer-connect/docs/connect-secure-source-manager\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Developer Connect</span></a><span style=\"vertical-align: baseline;\"> 連携により、CI / CD システムとランタイムが異なるプライベート ネットワークにある場合でも、セキュアかつ簡単に接続できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">プライベート CI / CD ブループリントの</span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/private-network-integrations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アーキテクチャ</span></a><span style=\"vertical-align: baseline;\">は、セキュアな接続経路を採用しています。Secure Source Manager が Private Service Connect に接続し、そこからさらに Cloud Build へと接続されます。リポジトリ、ビルドプール、アーティファクト ストレージはすべてプライベート ネットワーク内に配置され、</span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC Service Controls</span></a><span style=\"vertical-align: baseline;\">（VPC-SC）が多層防御を提供することで、プロキシ エンドポイントへのアクセスを制限します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">次のステップ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ネットワークを保護するには、新しい</span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/private-network-integrations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プライベート ネットワークの統合ガイド</span></a><span style=\"vertical-align: baseline;\">に沿って、Developer Connect を使用して SSM を Cloud Build に接続します。</span></p>\n<p><span style=\"vertical-align: baseline;\">pull リクエストの承認を保護するには、ルート CODEOWNERS ファイルを作成して、一律の IAM「承認者」ロールを、ファイル固有のオーナー権限に置き換えます。</span></p>\n<p> </p>\n<p><em><strong style=\"vertical-align: baseline;\">- Google Cloud、プロダクト マネージャー、Logan Henriquez</strong></em></p></div>"
  "d671f8305794275a2f1f722f89d18812":
    "id": "d671f8305794275a2f1f722f89d18812"
    "title": "ゲーム チェンジャー: エージェント型 AI を使用してインフラストラクチャ コードを保護する"
    "link": "https://cloud.google.com/blog/ja/topics/systems/using-ai-agents-to-secure-google-infrastructure/"
    "published": "2026-10-01 11:00:00"
    "fetched": "2026-10-01 15:50:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 19 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI は、かつてないペースでソフトウェア開発を加速させています。しかし、コード生成が拡大するにつれて、コードのセキュリティを確保する課題も増大しています。特に、AI を利用した新たな脆弱性の悪用が懸念されています。こうした課題に対処するため、Google AI およびインフラストラクチャ チームは、セキュリティへの取り組み方を変革しています。この記事では、Google が開発した新しい AI ネイティブなエージェント手法について説明します。この手法は、高精度で網羅的な脆弱性スキャンとパッチ適用を、Google のソフトウェア開発ライフサイクルに体系的かつ直接組み込むものです。Google は、インフラストラクチャにデプロイされる数億行に及ぶコードのあらゆる変更を継続的にスキャンすることで、毎月数百件もの脆弱性がコードベースや本番環境に混入するのを未然に防ぎ、グローバル ネットワーク、AI インフラストラクチャ、そしてユーザーを保護しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ソリューション アーキテクチャと実装</strong></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_DMfXM9r.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>送信前のエージェント型スキャンを徹底: 継続的なソフトウェア開発の一環としてのセキュリティ</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">従来、テクノロジー業界は、処理に時間がかかり、十分なコンテキストを把握できない単発の大規模なセキュリティ スキャンに頼ってきました。その結果、脆弱性の発見が遅れることがよくあります。Google のアプローチでは、これとは異なり送信前スキャンに焦点を当てています。AI エージェントを活用し、スタックのあらゆるレイヤにおいて、コードのチェックインをリアルタイムで評価します。デベロッパーの使い慣れたツールに送信前スキャンを統合することで、セキュリティは、ルール チェッカーや可読性レビューなどのソフトウェア開発ツールと同じように、開発プロセスにおける日常的なルーティン作業になります。また、AI の観点から見ると、個々のコード変更をスキャンする方が、大規模な 1 回限りのスキャンを実行するよりもはるかに少ないコンテキストで済むため、スキャンの効果が大幅に向上します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ローカライズされた脅威モデルの重要性</strong></h3>\n<p><span style=\"vertical-align: baseline;\">この取り組みのために、Google はオープンソースのマルチ エージェント レビュー ハーネスである </span><a href=\"https://github.com/google/mantis\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\"> を進化させ、ローカライズされた堅牢な脅威モデルのコホートと照合することで、セキュリティ エージェントの精度を高めました。脅威モデルは、コードから切り離された静的なドキュメントに依存するのではなく、リアルタイムのコードベース メタデータを使用します。スキャン エージェントは、パッケージやライブラリ間の依存関係コールグラフを使用し、脅威モデルのコンテキストを拡張および洗練させることで、精度をさらに向上させます。脅威モデルを継続的な脆弱性スキャンの一部に組み込むことで、開発者が脅威や依存関係を常に更新するようになり、モデルを最新の状態に保つことができます。ローカライズされた正確な脅威モデルデータを使用することは、精度の劇的な向上に直結しており、場合によっては偽陽性率をわずか 3% にまで抑えることができます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">専門のトリアージ エージェントが開発を加速</strong></h3>\n<p><span style=\"vertical-align: baseline;\">コード チェックインの一環として脆弱性スキャンを行う場合、エンジニアリングの生産性を妨げないよう、コードを生成する開発者やエージェントに迅速に対応する必要があります。低レイテンシで回答を得るために、2 段階の検証プロセスを実行しています。まず、迅速な軽量スキャンを実行し、その結果を専門のトリアージ エージェントで検証します。このエージェントは、コードの実際の構造をプログラムでチェックし（抽象構文ツリーの解析、コールグラフの走査、事前インデックス化されたドメイン安全ルールを使用）、脆弱なパスが実際に攻撃者によって到達可能であることを証明します。このエージェントは 92% 以上の精度を達成し、1 分以内に作業を完了します。次に、夜間の統合テストの一環として、送信後のスキャンが第 2 の防御層として機能し、オフピーク サイクルを使用して、複数の変更にわたって導入された可能性のある脆弱性をテストします。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">バグ修正エージェントがループを閉じる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">脆弱性を見つけることは、解決への道のりの半分にすぎません。Google のソリューションの最後のコンポーネントは、スキャン結果と生成された実証コード（脆弱性がどのように再現されるかを示すコード スニペット）を使用して、Google の社内コーディング標準に合致した正確な修正案を自律的に生成する自動バグ修正エージェントです。エージェントは、元の変更リクエストのレビューの一環として、人間によるレビューのために修正を送信します。これにより、検出から解決までの時間がさらに短縮されます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">学んだことと行動喚起</strong></h3>\n<p><span style=\"vertical-align: baseline;\">継続的なスキャンをソフトウェア開発ライフサイクルに直接組み込むことは、Google においてまさにゲーム チェンジャーとなりました。AI が提示する修正案は広く採用されており、数多くの脆弱性がコードベースに混入するのを未然に防いでいます。セキュリティ向上を目指す組織であれば、次の原則に従うことで、同様の AI ネイティブなアプローチを導入することが可能です。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">システムを分離する:</strong><span style=\"vertical-align: baseline;\"> バイアスを防ぐため、開発、スキャン、トリアージの各エージェントのハーネス、ルール、コンテキストを分離します。軽量な AI スキャンと決定的かつ構造的な検証を組み合わせることで、レイテンシを短縮し、精度を向上させます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンテキストを賢く使用する: </strong><span style=\"vertical-align: baseline;\">既存の脅威モデルをエージェントにフィードします。偽陽性を減らすには、正確なコンテキストが不可欠です。また、最新の脅威モデルを使用することで、送信前スキャンの真陽性率が向上し、チームのセキュリティ ポスチャーの最低基準が引き上げられます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">優れたハーネスを構築する:</strong><span style=\"vertical-align: baseline;\"> 基盤となるモデルの選択は重要ですが、マルチ エージェント ハーネスを使用すると、モデル選択のばらつきを補うことができるため、大きな効果が得られます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">修正を自動化する:</strong><span style=\"vertical-align: baseline;\"> エージェントを使用して、人間参加型の修正を提案し、解決までの時間をさらに短縮します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">独自の AI ネイティブなセキュリティ変革を始めたい場合は、</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\"> がオープンソースとして公開されていますので、ぜひ活用してそのメリットをお役立てください。また、</span><a href=\"https://cloud.google.com/learn/security/mandiant-academy-courses/fcs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サイバーセキュリティの基礎</span></a><span style=\"vertical-align: baseline;\">や、このエージェント型パイプラインを支える他のプラットフォーム（Google Cloud、Gemini Enterprise、Trillium および Ironwood TPU で実行される Gemini モデル）についても詳しく学ぶことができます。また、</span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud のセキュアなソフトウェア開発のライフサイクル（SDLC）の取り組み</span></a><span style=\"vertical-align: baseline;\">に不可欠な要素として、エージェント型の脆弱性スキャンと修復が Google Cloud のお客様をどのように保護しているかについても、ヒントを得ることができます。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">この成果の実現に多大な貢献をした主要メンバーである、Stella Voutsina（リード プログラム マネージャー）、Yulong Zhang（シニア スタッフ セキュリティ エンジニア、Mantis）、Nick Galloway（スタッフ セキュリティ エンジニア、Mantis）に心からの敬意を表します。</span></span></sup></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">- Google、上級エンジニア、<strong>Andrés Lagar-Cavilla</strong></span></span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">- バイス プレジデント兼エンジニアリング フェロー、<strong>Parthasarathy Ranganathan</strong></span></span></p></div>"
  "a74302e540e6226df8cb314d7eb0693a":
    "id": "a74302e540e6226df8cb314d7eb0693a"
    "title": "Google Public Sector でエージェントの時代におけるサービス提供の定義を一新"
    "link": "https://cloud.google.com/blog/ja/topics/public-sector/reimagining-service-delivery-in-the-agentic-era-with-google-public-sector/"
    "published": "2026-10-01 11:00:00"
    "fetched": "2026-10-01 15:50:50"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 9 月 19 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/topics/public-sector/reimagining-service-delivery-in-the-agentic-era-with-google-public-sector?e=0&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>州政府や地方自治体は、迅速かつ公平で、利用しやすいサービスを提供するという共通の使命を担っています。しかし、老朽化したシステムの技術的負債、分断されたデータ、そして重い事務負担が使命の遂行を遅らせ、この目標の達成を阻む要因となっています。</p><p>このようなシステム上の断片化は、公共部門全体で費用のかかる運用上のボトルネックを生み出します。</p><ul><li><b>レガシーデータのサイロ化:</b> ケースワーカーの重要な情報は、多くの場合、別々の部門が管理する独立したリポジトリに保存されています。</li><li><b>手作業によるボトルネック:</b> 行政機関の職員は、日常的なデータ入力や手作業での書類作成の処理に、多大な時間を費やしています。</li><li><b>関係者とエンドユーザーのストレス:</b> レガシー システム同士が連携していないため、ユーザーは異なるプラットフォームでまったく同じ証明書類を何度も提出させられることがよくあります。</li></ul><p>現在、エージェントはサイロを解消し、定型業務や手作業を自動化することで、行政機関の職員が価値の高い公共サービスや、本来の使命である「人間にしかできない温かみのある業務」に集中できるよう支援しています。</p><h3><b>AI は州の CIO にとって最優先事項</b></h3><p>公共部門全体で、AI は試験的なものから戦略の中核へと急速に進化しています。この変化を反映して、全米州最高情報責任者協会（NASCIO）の州 CIO <a href=\"https://www.nascio.org/resource/state-cio-top-ten-policy-and-technology-priorities-for-2026/\" target=\"_blank\">年次トップ 10</a> レポートでは、最近初めて AI が州 CIO の最優先事項にランクインしました。この優先順位の再定義は、州や地方自治体の未来にとって極めて重要な意味を持ちます。州の行政機関が山積する事務処理、インフラストラクチャの老朽化、そして変化する住民の期待に直面するなか、CIO は、インテリジェントな自動化こそが職員の対応力を高め、ケースワーカーのワークフローを合理化し、より迅速で公平なサービスを地域住民に提供するための中核的な手段であると認識しているからです。</p><p>行政機関が AI の試験運用や実証実験から本格的な導入へと移行するなか、多くの機関にとって中心的な課題となっているのは、「既存のレガシー投資と最新のサービス提供とのギャップを、AI を活用してどのように埋めるか」ということです。</p><h3><b>AI を活用して成果につなげる</b></h3><p>Google は、スピード、スケール、費用効率に重点を置き、手動によるシステム統合の煩わしさを解消するように設計された統合 AI スタックを提供しています。Google Public Sector と提携して AI を活用している公共部門の組織をいくつか詳しく見ていきましょう。</p><ul><li><a href=\"https://www.govexec.com/sponsors/2026/06/smarter-cities-safer-communities-how-state-and-local-government-leaders-are-advancing-public-services-ai/413852/?oref=featured-insights\" target=\"_blank\"><b>ユタ州運輸省（UDOT）</b></a><b>:</b> 52,000 以上の土地区画を特定して地図化するという膨大なタスクに直面していました。当初は膨大な手作業により完了まで 33.5 年を要すると見積もられていましたが、UDOT は BigQuery 上に統合データ プラットフォームを構築することで、<b>プロジェクト全体を 1 年未満で完了</b>し、エンジニアが<b>道路の安全性向上に専念</b>できる環境を整えました</li><li><a href=\"https://www.govtech.com/gov-experience/hartford-conn-integrates-ai-for-translation-services\" target=\"_blank\"><b>ハートフォード市</b></a><b>:</b> AI を使用して、すべての公聴会で <b>80 言語のリアルタイム双方向翻訳</b>を提供。参加の機会を広げつつ <b>130 万ドルの構造的コスト削減を達成</b>し、インクルーシブなガバナンスの全米ベンチマークを確立しました。</li><li><a href=\"https://cloud.google.com/customers/chattanooga\"><b>チャタヌーガ市</b></a><b>:</b> Google Cloud の AI と分析ツールを使用して市内の交通事故やインシデント データを一元化。都市計画担当者や公安チームが<b>危険な路線を特定し、信号機のタイミングを最適化し、インフラストラクチャ投資の優先順位を判断</b>できるようにすることで、<b>住民がより安全に通行できる街路を実現</b>しています。</li><li><a href=\"https://www.govtech.com/artificial-intelligence/indiana-government-integrates-more-ai-into-operations\" target=\"_blank\"><b>インディアナ州運輸局（INDOT）</b></a><b>:</b> Google Cloud の AI とドキュメント分析モデルを導入し、膨大な調達契約リポジトリ全体におけるコンプライアンス監査の自動化と、スマート道路インフラストラクチャの拡張を実現しました。有資格のエンジニアを進行中の現場プロジェクトから引き離すことなく、30 日という厳しいコンプライアンス要件を満たすことで、このソリューションはシニア エンジニアの<b>労働時間を 360 時間削減</b>。同時に<b>道路資産の検出を自動化</b>して、州全域の住民に向けて、より安全で適切に維持管理された高速道路を確保しました。</li><li><a href=\"https://www.youtube.com/watch?v=SHI_E1vMRws\" target=\"_blank\"><b>ロサンゼルス市</b></a><b>:</b> 2026 年のワールドカップ、2027 年のスーパーボウル、2028 年のオリンピック / パラリンピックといったグローバル イベントの開催を控え、膨大な運営負荷に直面している同市は、<b>45 の部門</b>と <b>27,500 人の職員</b>の日常のワークフローに Gemini を直接統合しています。市職員の能力を何倍にも高める原動力として機能するこのプラットフォームは、複雑な事務作業を自動化して組織の対応力を強化。サービス提供を迅速化するとともに、<b>1,500 万人を超える予想訪問者</b>と <b>400 万人の住民</b>が話す <b>224 以上の言語</b>に対応する多言語サポートを拡大します。</li><li><a href=\"https://www.youtube.com/watch?v=BKHxnvPav3w\" target=\"_blank\"><b>メリーランド州</b></a><b>:</b> Google Public Sector と提携し、プライバシーを重視したセキュアなクラウド基盤内で Gemini と Gemini Notebook を使用して、<b>4 万人にのぼる職員</b>を支援しています。認知負荷を軽減し、<b>反復的な管理タスクを自動化</b>することで、州政府の担当チームはわずか <b>5 週間</b>で水質管理アプリケーションを構築、デプロイしました。これにより、<b>数千時間におよぶ職員の労働時間を削減</b>し、<b>環境監督業務を迅速化</b>。メリーランド州全域の住民に向けて、より迅速で持続可能な公共サービスの提供を実現しました。</li></ul><h3><b>Google Public Sector で AI への取り組みを加速</b></h3><p>エージェントの時代とは、人間の能力を強化し、公共サービスを支えるリーダーや構築者を支援することにほかなりません。公共部門の組織は、Google Cloud の統合 AI スタックを活用して、ステークホルダーへのサービス提供、職員の能力向上、そしてミッション推進のあり方を再定義しています。Google Public Sector は、よりレジリエンスが高く、対応力に優れ、シームレスにつながる行政機関をともに構築していくため、先駆的な組織の皆様とパートナーとして協働できることを心から楽しみにしています。</p><p>10 月 20 日に開催される <a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\">Google Public Sector Summit</a> にぜひご参加ください。エージェントの時代に AI を活用してサービス提供のあり方を再定義している公共部門のリーダーたちの講演をお聞きいただけます。</p><p><b><i>- Google Public Sector、米国州政府、地方自治体、教育機関担当マネージング ディレクター、Matt Schneider</i></b></p></div>"
"last_updated": "2026-10-01 15:50:50 JST"
