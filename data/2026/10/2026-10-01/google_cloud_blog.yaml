    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For years, </span><a href=\"https://swift.org\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Swift</span></a><span style=\"vertical-align: baseline;\"> was perceived mainly as a UI language tied to Apple client devices. With the release of Swift 6 and strict concurrency checking, Swift has matured into a premier systems with cloud engineering language that matches </span><a href=\"https://go.dev\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Go</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://www.rust-lang.org\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Rust</span></a><span style=\"vertical-align: baseline;\"> in memory safety while running with predictable, reference-counted CPU performance.</span></p>\n<p><span style=\"vertical-align: baseline;\">To support this ecosystem, Google engineering has launched the official </span><a href=\"https://github.com/googleapis/google-cloud-swift\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud API Client Libraries for Swift</span></a><span style=\"vertical-align: baseline;\">. Built from the ground up for Swift 6.2+, this new SDK uses the latest non-blocking </span><a href=\"https://github.com/apple/swift-nio\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Swift NIO</span></a><span style=\"vertical-align: baseline;\"> event loops, HTTP/2 multiplexing, </span><a href=\"https://grpc.io\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gRPC</span></a><span style=\"vertical-align: baseline;\"> transport, and zero-cost compile-time data race safety.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this article, we'll walk you through all you need to know to get started, and to understand how the Server Side Cloud Swift SDK, or </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\">, works.</span></p>\n<h2><span style=\"vertical-align: baseline;\">The rise of server-side Swift and cloud-native concurrency</span></h2>\n<p><span style=\"vertical-align: baseline;\">Traditional backend languages often force a compromise between developer velocity and system resource usage. Managed runtimes rely on heavy garbage collectors that induce tail-latency spikes under heavy traffic, while systems languages can slow down feature iteration.</span></p>\n<p><span style=\"vertical-align: baseline;\">Server-side Swift balances both ends of the spectrum. Using Automatic Reference Counting (ARC), Swift reclaims memory deterministically without stop-the-world pauses. More importantly, Swift 6 introduces compile-time concurrency checking. When you share state between async tasks across a cloud microservice, the compiler enforces that types conform to </span><code style=\"vertical-align: baseline;\">Sendable</code><span style=\"vertical-align: baseline;\">. Data races are caught in your editor before a binary ever compiles or reaches production.</span></p>\n<p><span style=\"vertical-align: baseline;\">At the network layer, every request to </span><a href=\"https://cloud.google.com\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud</span></a><span style=\"vertical-align: baseline;\"> APIs runs over event-driven, non-blocking sockets that scale across multicore </span><a href=\"https://www.kernel.org\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Linux</span></a><span style=\"vertical-align: baseline;\"> server environments without spawning system threads per connection.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"sdk-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sdk-architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Where to use the Swift SDK</span></h2>\n<p><span style=\"vertical-align: baseline;\">The Server Side Cloud Swift SDK is engineered for server, container, and automated DevOps environments.</span></p>\n<p><span style=\"vertical-align: baseline;\">When you build high-throughput microservices with Swift web frameworks like </span><a href=\"https://hummingbird.codes\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hummingbird</span></a><span style=\"vertical-align: baseline;\"> or </span><a href=\"https://vapor.codes\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Vapor</span></a><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\"> provides native access to Cloud Storage, AI, Identity and Access Management (IAM), and over one hundred other Google Cloud services. You can containerize your executable on Linux and deploy directly to </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE)</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://cloud.google.com/compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine</span></a><span style=\"vertical-align: baseline;\"> VMs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because the SDK compiles on macOS, and Linux, you can develop the backend in your preferred development environment, and then seamlessly deploy to production. And using Swift on both the frontend and backend allows you to share application-specific types across both.</span></p>\n<p><span style=\"vertical-align: baseline;\">The SDK also excels at platform engineering and DevOps automation. You can author cross-platform CLI utilities and data rotation scripts that run on your developer laptop or inside CI/CD pipelines. These tools authenticate automatically against Google Cloud using </span><a href=\"https://cloud.google.com/docs/authentication/application-default-credentials\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Application Default Credentials (ADC)</span></a><span style=\"vertical-align: baseline;\"> or </span><a href=\"https://cloud.google.com/iam/docs/workload-identity-federation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Workload Identity Federation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">If you're building an </span><a href=\"https://developer.apple.com/ios/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iOS</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.apple.com/ipados/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iPadOS</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://www.apple.com/apple-vision-pro/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">visionOS</span></a><span style=\"vertical-align: baseline;\"> app for the </span><a href=\"https://www.apple.com/app-store/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apple App Store</span></a><span style=\"vertical-align: baseline;\">, you should not embed </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\"> directly into your client bundle. Shipping Google Cloud service account keys or administrative credentials inside a client binary creates security risks. For direct client-side features, use the </span><a href=\"https://github.com/firebase/firebase-ios-sdk\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Firebase SDK for Apple Platforms</span></a><span style=\"vertical-align: baseline;\"> to handle user authentication, real-time </span><a href=\"https://cloud.google.com/firestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Firestore</span></a><span style=\"vertical-align: baseline;\"> sync, and client-side security rules, or route requests through your own Cloud Run backend API.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Getting started with your IDE and packages</span></h2>\n<p><span style=\"vertical-align: baseline;\">Because </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\"> treats Linux and macOS as first-class citizens, you can develop on Apple hardware with </span><a href=\"https://developer.apple.com/xcode/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Xcode</span></a><span style=\"vertical-align: baseline;\"> or on Linux workstations with </span><a href=\"https://code.visualstudio.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visual Studio Code</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://swift.org/install/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">swiftly</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">To install the official Swift compiler on Linux workstations using the </span><code style=\"vertical-align: baseline;\">swiftly</code><span style=\"vertical-align: baseline;\"> CLI installer, run:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;curl -L https://swift-server.github.io/swiftly/swiftly-install.sh | bash -s -- -y&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd233a450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Alternatively, you can download prebuilt toolchain tarballs directly from official </span><a href=\"https://www.swift.org/download/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Swift Downloads</span></a><span style=\"vertical-align: baseline;\"> for Ubuntu, Debian, Fedora, or Amazon Linux. Note that </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\"> requires </span><strong style=\"vertical-align: baseline;\">Swift 6.2 or later</strong><span style=\"vertical-align: baseline;\">, so verify your compiler version with </span><code style=\"vertical-align: baseline;\">swift --version</code><span style=\"vertical-align: baseline;\"> after installation.</span></p>\n<p><span style=\"vertical-align: baseline;\">To resolve </span><a href=\"https://swift.org/package-manager/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Swift Package Manager</span></a><span style=\"vertical-align: baseline;\"> bare repository trust warnings when cloning across Linux filesystems, configure </span><a href=\"https://git-scm.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Git</span></a><span style=\"vertical-align: baseline;\"> before building with </span><code style=\"vertical-align: baseline;\">git config --global safe.bareRepository all</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Add the required packages to your </span><code style=\"vertical-align: baseline;\">Package.swift</code><span style=\"vertical-align: baseline;\"> manifest:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;swift package add-dependency https://github.com/googleapis/swift-google-cloud-language-v2.git --from 0.4.0\\r\\nswift package add-target-dependency GoogleCloudLanguageV2 CloudBackendService --package swift-google-cloud-language-v2&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd233b290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">On macOS you need to change the </span><code style=\"vertical-align: baseline;\">platforms</code><span style=\"vertical-align: baseline;\"> directive:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// swift-tools-version: 6.2\\r\\nimport PackageDescription\\r\\n\\r\\nlet package = Package(\\r\\n  name: &quot;CloudBackendService&quot;,\\r\\n  // Applied when compiling on Darwin/macOS; ignored by SPM on Linux targets\\r\\n  platforms: [.macOS(.v15)],\\r\\n ... ...&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1801410&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>In most environments a default-initialized client can make requests:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import Foundation\\r\\nimport GoogleCloudLanguageV2\\r\\n\\r\\nfunc analyzeTextSentiment(text: String) async throws {\\r\\n  // Initialize explicit API key credentials\\r\\n  let client = try LanguageServiceClient()\\r\\n\\r\\n  // Configure request using structured builder closure\\r\\n  let document = Document().with {\\r\\n    $0.type = .plainText\\r\\n    $0.source = .content(text)\\r\\n  }\\r\\n\\r\\n  let response = try await client.analyzeSentiment(\\r\\n    request: AnalyzeSentimentRequest().with { $0.document = document }\\r\\n  )\\r\\n\\r\\n  if let sentiment = response.documentSentiment {\\r\\n    print(&quot;Document sentiment score: \\\\(sentiment.score)&quot;)\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1800d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Notice how </span><code style=\"vertical-align: baseline;\">Document().with { ... }</code><span style=\"vertical-align: baseline;\"> avoids verbose temporary variables or mutating setters by providing a clean, thread-safe configuration closure.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Networking, transport, and authentication</span></h2>\n<p><span style=\"vertical-align: baseline;\">The repository splits infrastructure primitives into modular packages under </span><code style=\"vertical-align: baseline;\">packages/</code><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">swift-google-cloud-auth</code><span style=\"vertical-align: baseline;\">: Implements </span><a href=\"https://docs.cloud.google.com/docs/authentication/application-default-credentials\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Application Default Credentials</span></a><span style=\"vertical-align: baseline;\"> discovery, service account JWT signing, external account exchange for Workload Identity Federation, and API keys.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">swift-google-cloud-wkt</code><span style=\"vertical-align: baseline;\">: Provides idiomatic Swift types for Google Protocol Buffer well-known types, including nanosecond-precision </span><code style=\"vertical-align: baseline;\">Timestamp</code><span style=\"vertical-align: baseline;\"> representations that bridge cleanly to Swift's </span><code style=\"vertical-align: baseline;\">Date</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">swift-google-cloud-gax</code><span style=\"vertical-align: baseline;\">: Handles Google API Extensions such as automated retry loops, exponential backoff, and pagination state machines.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">When you initialize any client library without arguments, </span><code style=\"vertical-align: baseline;\">Credentials.default()</code><span style=\"vertical-align: baseline;\"> automatically scans your environment (</span><code style=\"vertical-align: baseline;\">GOOGLE_APPLICATION_CREDENTIALS</code><span style=\"vertical-align: baseline;\">, quota project variables, or the local Google Cloud CLI configuration) and authenticates connections over gRPC or HTTP/2.</span></p>\n<p><span style=\"vertical-align: baseline;\">If you need to programmatically override credentials with an API key or attach custom access headers, you can pass explicit configuration options. For example, you could modify the previous example to use the following:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import Foundation\\r\\nimport GoogleCloudAuth\\r\\nimport GoogleCloudGax\\r\\nimport GoogleCloudLanguageV2\\r\\n\\r\\nfunc analyzeTextSentiment(apiKey: String, text: String) async throws {\\r\\n  // Initialize explicit API key credentials\\r\\n  let credentials = try Credentials(configuration: .apiKey(apiKey))\\r\\n  let client = try LanguageServiceClient(\\r\\n    ClientOptions().with { $0.credentials = credentials }\\r\\n  )\\r\\n\\r\\n  // Configure request using structured builder closure\\r\\n  let document = Document().with {\\r\\n    $0.type = .plainText\\r\\n    $0.source = .content(text)\\r\\n  }\\r\\n\\r\\n  let response = try await client.analyzeSentiment(\\r\\n    request: AnalyzeSentimentRequest().with { $0.document = document }\\r\\n  )\\r\\n\\r\\n  if let sentiment = response.documentSentiment {\\r\\n    print(&quot;Document sentiment score: \\\\(sentiment.score)&quot;)\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1802bd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">The autogenerated client ecosystem</span></h2>\n<p><span style=\"vertical-align: baseline;\">Google Cloud operates a vast ecosystem of APIs whose schemas update regularly. The teams supporting </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\"> use code generators to automatically update the client libraries with the latest features and with new APIs. Using code generators produces stable APIs, without disruptive breaking changes. While the releases are on a fixed cadence, please contact Cloud Customer Care if you need a particular feature or API urgently.</span></p>\n<p><span style=\"vertical-align: baseline;\">Whether you need to rotate keys in </span><a href=\"https://cloud.google.com/secret-manager\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager</span></a><span style=\"vertical-align: baseline;\"> or invoke multimodal inference models via the </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/gemini-v1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini API</span></a><span style=\"vertical-align: baseline;\"> on </span><a href=\"https://cloud.google.com/vertex-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\">, the generated SDKs follow consistent naming and async/await signatures.</span></p>\n<p><span style=\"vertical-align: baseline;\">These generated clients offer more than plain unary RPC wrappers. They also offer wrappers that simplify application development. For example, iterating over long results involves fetching pages of results with one RPC, iterating over the page of results, and then preparing a new request to retrieve the following page. Using the generated clients this becomes an asynchronous iterator. This example shows how to query project secrets using </span><code style=\"vertical-align: baseline;\">GoogleCloudSecretManagerV1</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import Foundation\\r\\nimport GoogleCloudSecretManagerV1\\r\\n\\r\\n@main\\r\\nstruct SecretManagerQuickstart {\\r\\n  static func main() async throws {\\r\\n    guard let projectId = CommandLine.arguments.dropFirst().first else {\\r\\n      print(&quot;Usage: SecretManagerQuickstart &lt;projectId&gt;&quot;)\\r\\n      exit(1)\\r\\n    }\\r\\n\\r\\n    // Connects using Application Default Credentials automatically\\r\\n    let client = try SecretManagerServiceClient()\\r\\n\\r\\n    let request = ListSecretsRequest().with {\\r\\n      $0.parent = &quot;projects/\\\\(projectId)&quot;\\r\\n    }\\r\\n\\r\\n    // Async sequence streams pages of secrets automatically\\r\\n    print(&quot;Secrets in project \\\\(projectId):&quot;)\\r\\n    for try await item in try client.listSecretsByItem(request: request) {\\r\\n      print(&quot; - \\\\(item.name)&quot;)\\r\\n    }\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1b80b90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The pagination response returns an asynchronous sequence (</span><code style=\"vertical-align: baseline;\">AsyncSequence</code><span style=\"vertical-align: baseline;\">). You can iterate over items with </span><code style=\"vertical-align: baseline;\">for try await</code><span style=\"vertical-align: baseline;\"> while the client library fetches subsequent pages in the background over non-blocking NIO channels.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Where to go next</span></h2>\n<p><span style=\"vertical-align: baseline;\">With </span><code style=\"vertical-align: baseline;\">google-cloud-swift</code><span style=\"vertical-align: baseline;\">, server-side Swift developers can write end-to-end cloud infrastructure with compile-time race safety, native async/await ergonomic APIs, and zero OS thread congestion.</span></p>\n<p><span style=\"vertical-align: baseline;\">To inspect the source code, open issues, or contribute new veneers, visit the official repository at </span><a href=\"https://github.com/googleapis/google-cloud-swift\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">googleapis/google-cloud-swift</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Want to discuss server-side Swift architectures or Cloud Run containerization? Join the </span><a href=\"https://developers.google.com/program\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Developer Program</span></a><span style=\"vertical-align: baseline;\"> to continue the conversation.</span></p></div>"
  "4adfd7d996ed7eb4ff5c325457e4a73c":
    "id": "4adfd7d996ed7eb4ff5c325457e4a73c"
    "title": "Democratizing Managed Lustre with lower cost and frictionless development"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/democratizing-managed-lustre-with-lower-cost-and-frictionless-development/"
    "published": "2026-10-01 22:00:00"
    "fetched": "2026-10-01 23:11:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This is the first of a two-part series exploring how Google Cloud is bringing the foundational values of a high-performance parallel filesystem–TB/s throughput, sub-ms latency at high client scale, and POSIX support–to a broader set of use cases and users.</span></p>\n<p><span style=\"vertical-align: baseline;\">Historically, due to the cost and special purpose nature of parallel filesystems, colder data had to be stored outside of the filesystem and AI developers have had to maintain separate, slower environments for writing code, compiling libraries, and managing repositories. This fragmentation increases the toil of manual data staging, dataset copying, and managing disjointed namespaces.</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Managed Lustre is solving these problems through our </span><strong style=\"vertical-align: baseline;\">6 cents/GB*month Dynamic Tier</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">and by optimizing Managed Lustre performance for a range of development tasks and workloads – making Managed Lustre a “One-Stop Shop” for high-performance AI and HPC workloads.</strong></p>\n<h2><strong style=\"vertical-align: baseline;\">Lower Cost: More Lustre for Less with the Dynamic Tier</strong></h2>\n<p><span style=\"vertical-align: baseline;\">The Managed Lustre Dynamic Tier provides </span><strong style=\"vertical-align: baseline;\">sub-ms latency for hot data, which allows you to store all of your data in a single namespace, and costs only 6 cents/GB*month</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Throughput, capacity scale and client scale:</strong><span style=\"vertical-align: baseline;\"> Throughput scales linearly with capacity up to 80 PB, while sub-ms latency for hot data remains stable as you scale to tens of thousands of clients.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Single-flat fee:</strong><span style=\"vertical-align: baseline;\"> Predictable pricing. No independent charges for disk media types, data movement within the namespace, or metadata IOPS.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read Latencies:</strong><span style=\"vertical-align: baseline;\"> Sub-ms latencies for High-Performance Cache (SSD).  The Capacity Pool (“HDD”) is built on Google Cloud Hyperdisk throughput, which has an </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hd-types/hyperdisk-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">average read latency of 10 to 30 ms</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Recommended workloads for Dynamic Tier</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-Epoch Training and/or Training with Optimized Fetch Sizes: </strong><span style=\"vertical-align: baseline;\">Hot data is promoted to the High Performance Cache (SSD) after the first run. Larger data prefetch will allow you to take advantage of the Dynamic Tier cost structure and gain from low-latency SSD.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Write-Heavy Checkpointing:</strong><span style=\"vertical-align: baseline;\"> Bursty checkpoint writes land directly in the High Performance Cache. Older checkpoints are transparently demoted to the Capacity Pool (HDD).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rapid Checkpoint Restore:</strong><span style=\"vertical-align: baseline;\">  New checkpoints are written to the High Performance Cache, enabling low-latency checkpoint restores.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Interactive Snappiness for Developers:</strong><span style=\"vertical-align: baseline;\"> Low-latency tasks like git cloning, compiling libraries, or running notebooks benefit from a local-disk feel (~300µs average read latencies) on the same shared workspace hosting large training sets.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Frictionless development: Lustre as a one-stop shop for developer’s workloads</strong></h2>\n<p><span style=\"vertical-align: baseline;\">In addition to Managed Lustre’s scalability for large AI and HPC workloads (checkpoint/restart/data-loading), it also meets the demands for interactive work, meaning developers can start on Managed Lustre and stay on Managed Lustre throughout the entire workload lifecycle:</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Unified Foundation &amp; Interactive Performance</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Consolidates the AI and HPC lifecycle into a single namespace, providing a \"local disk\" feel for interactive work (Read more about the </span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"text-decoration: underline; vertical-align: baseline;\">latency benefits of Managed Lustre experienced by Salesforce and others</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Latency:</strong><span style=\"vertical-align: baseline;\"> ~300µs average read latency—delivering up to 4x better responsiveness than alternative distributed file systems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Accelerated Setup:</strong><span style=\"vertical-align: baseline;\"> Untar the Linux kernel in ~2 minutes (4.7x faster than alternative file solutions), run a 20-worker parallel git clone of Python in ~40 seconds, compile Python in ~200s.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"democratizing-lustre-with-lower-cost-and-frictionless-development-02-managed-lustre-performance-values\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/democratizing-lustre-with-lower-cost-and-f.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"democratizing-lustre-with-lower-cost-and-frictionless-development-01-performance-comparision\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/democratizing-lustre-with-lower-cost-and-f.max-1000x1000_xLOfL6w.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">High-Concurrency Broadcast &amp; Cluster Startup</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Managed Lustre maximizes GPU ROI by preventing storage bottlenecks during cluster initialization. </span></p>\n<p><span style=\"vertical-align: baseline;\">When thousands of worker nodes attempt to read the exact same file simultaneously (such as a shared model checkpoint, base weights, or container layer), traditional distributed file systems can choke on localized hotspotting, leaving high-cost GPU clusters idle for minutes.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Improves Aggregate Throughput for a large number of clients reading the same file:</strong><span style=\"vertical-align: baseline;\"> Demonstrates a 67% improvement over alternative file solutions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Parallel Loading:</strong><span style=\"vertical-align: baseline;\"> Imports libraries like PyTorch across 4,000+ processes in under 60 seconds.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"democratizing-lustre-with-lower-cost-and-frictionless-development-03-performance-advantage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/democratizing-lustre-with-lower-cost-and-f.max-1000x1000_9kShfM1.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">Run One-Stop Shop Workflows for Yourself</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Here is the code for the tests we’ve run, so that you can perform your own testing.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Low latency for interactive access</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We used </span><a href=\"https://github.com/axboe/fio\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">fio</span></a><span style=\"vertical-align: baseline;\"> to emulate small, low-concurrency reads and writes:</span></p>\n<p><sup><span style=\"vertical-align: baseline;\">1 </span></sup><span>Storage system specs: 500 MBps per TiB tier of Managed Lustre, 108,000 GiB capacity. Zonal Filestore at 102,400 GiB capacity. Average throughput of 36.7 GB/s to 2,048 client VMs reading the same 40 GiB file.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Read workload\\r\\nfio --ioengine=libaio --filesize=100M --ramp_time=2s \\\\\\r\\n    --runtime=2m --time_based --numjobs=1 --direct=1 --verify=0 --randrepeat=0 \\\\\\r\\n    --group_reporting --directory=~/LUSTRE_MOUNT \\\\\\r\\n    --name=randread --blocksize=4k --iodepth=1 --readwrite=randread \\\\\\r\\n    --buffer_compress_percentage=50\\r\\n\\r\\n# Write workload\\r\\nfio --ioengine=libaio --filesize=100M --ramp_time=2s \\\\\\r\\n    --runtime=2m --time_based --numjobs=1 --direct=1 --verify=0 --randrepeat=0 \\\\\\r\\n    --group_reporting --directory=~/LUSTRE_MOUNT \\\\\\r\\n    --name=randwrite --blocksize=4k --iodepth=1 --readwrite=randwrite \\\\\\r\\n    --buffer_compress_percentage=50&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1215810&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Accelerated setup</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">How to run Linux untar</strong></h4></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Download a kernel tarball\\r\\nwget -P /tmp https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.18.9.tar.xz\\r\\n\\r\\n# Extract the archive to the Lustre mount\\r\\nmkdir ~/LUSTRE_MOUNT/kernel\\r\\ntar -C ~/LUSTRE_MOUNT/kernel -xf /tmp/linux-5.18.9.tar.xz&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd2380e90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In the above use case, you will want to take care to avoid the metadata performance tax that can come from running as root (Namely, </span><code style=\"vertical-align: baseline;\">tar</code><span style=\"vertical-align: baseline;\"> issues</span><code style=\"vertical-align: baseline;\"> chown</code><span style=\"vertical-align: baseline;\"> and</span><code style=\"vertical-align: baseline;\"> chmod</code><span style=\"vertical-align: baseline;\"> calls to make extracted files’ owner+permissions match the ones recorded in the archive.).  If you still wish to run as root (and have verified that this approach is compatible with your setup), you may </span><span style=\"vertical-align: baseline;\">specify</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">`--no-same-owner --no-same-permissions`</code><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">in order to ensure that extracted files maintain</span><span style=\"vertical-align: baseline;\"> root</span><span style=\"vertical-align: baseline;\"> as owner and have root's default file permissions. In other words, it makes extraction as root behave like extraction as non-root (by ignoring the owner+permissions in the archive).</span></p>\n<h4><strong style=\"vertical-align: baseline;\">How to run Python gitclone</strong></h4></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;git config --global checkout.workers 20\\r\\nmkdir ~/LUSTRE_MOUNT/python\\r\\ngit clone https://github.com/python/cpython.git ~/LUSTRE_MOUNT/python&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1811c90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">How to run Python compile</strong></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;pushd ~/LUSTRE_MOUNT/python\\r\\n./configure &gt; /dev/null\\r\\nmake &gt; /dev/null\\r\\npopd&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd1810910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">High scale distribution</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">Aggregate throughput for distributing one large file to many nodes</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Run the below on each client VM:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Start fio in server mode\\r\\nfio --server&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd15dafd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>Run the below on a selected client VM:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;# Create a 40 GiB file\\r\\nfio --name=job1 \\\\\\r\\n    --ioengine=libaio \\\\\\r\\n    --direct=1 \\\\\\r\\n    --buffer_compress_percentage=50 \\\\\\r\\n    --blocksize=4m \\\\\\r\\n    --iodepth=32 \\\\\\r\\n    --filesize=40g \\\\\\r\\n    --readwrite=write \\\\\\r\\n    --filename ~/LUSTRE_MOUNT/40gb_test\\r\\n\\r\\n# Create an fio job file for the read workload\\r\\ncat &lt;&lt;&#x27;EOF&#x27; &gt; /tmp/read.fio\\r\\n[job1]\\r\\nfilename=${HOME}/LUSTRE_MOUNT/40gb_test\\r\\nrw=read\\r\\nbs=4m\\r\\nexitall_on_error=1\\r\\nEOF\\r\\n\\r\\n# Run the read workload using all client VMs in ~/hostfile\\r\\nfio --client ~/hostfile /tmp/read.fio&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd11486d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Parallel loading of libraries across many processes</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Run the below on a selected client VM:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Install PyTorch in a virtual env\\r\\npython3 -m venv ~/LUSTRE_MOUNT/env\\r\\nsource ~/LUSTRE_MOUNT/env/bin/activate\\r\\npip3 install --upgrade pip\\r\\npip3 install torch torchvision torchaudio \\r\\ndeactivate\\r\\n\\r\\n# Import PyTorch on all client VMs in ~/hostfile, 4 processes per host\\r\\nmpirun --allow-run-as-root --oversubscribe --hostfile ~/hostfile -N 4 \\\\\\r\\n  bash -c \\&#x27;source ~/LUSTRE_MOUNT/env/bin/activate &amp;&amp; python3 -c &quot;import torch&quot;\\&#x27;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fcbd170e590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h1><strong style=\"vertical-align: baseline;\">Looking ahead and next steps</strong></h1>\n<p><span style=\"vertical-align: baseline;\">By eliminating the manual data staging tax and lowering entry costs with the Dynamic Tier, Google Cloud Managed Lustre is evolving from an elite, single-purpose engine into a highly versatile, unified storage fabric for the entire AI lifecycle.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the second part of this series, we will focus on </span><strong style=\"vertical-align: baseline;\">upcoming object integration features</strong><span style=\"vertical-align: baseline;\">. Stay tuned!</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Next steps</strong></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Run the benchmarks yourself (if you haven’t already): Deploy a Google Cloud Managed Lustre instance using the </span><a href=\"https://console.cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a><span style=\"vertical-align: baseline;\"> and run tests provided above to benchmark your own workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore the Dynamic Tier: Read the </span><a href=\"https://docs.cloud.google.com/managed-lustre/docs/performance-tiers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre Documentation</span></a><span style=\"vertical-align: baseline;\"> to learn more.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Stay tuned for Part 2: In the next installment of this series, we will dive deep into upcoming object integration features and how they further simplify AI and HPC storage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Get started with centralizing your development-to-training lifecycle on Google Cloud Managed Lustre!</span></p>\n</li>\n</ul></div>"
  "a34148aa5434b3a05c230cd4ba6a6bcd":
    "id": "a34148aa5434b3a05c230cd4ba6a6bcd"
    "title": "The future of browser-based security: Leveraging browser data for proactive defense"
    "link": "https://cloud.google.com/blog/products/chrome-enterprise/the-future-of-browser-based-security-leveraging-browser-data-for-proactive-defense/"
    "published": "2026-10-01 18:02:00"
    "fetched": "2026-10-02 09:31:16"
    "summary": "<div class=\"block-paragraph\"><p>The browser has changed significantly. Rather than just a window to the web, it serves as an AI workspace and central operating environment for the modern enterprise. With knowledge workers spending over 56% of their workday in the browser, it is a key gateway for daily work, complex workflows, and direct interaction with autonomous AI agents (<a href=\"https://services.google.com/fh/files/misc/omdiareport.pdf\" target=\"_blank\">Omdia</a>, 2026). To keep pace with threat actors, organizations need a browser strategy that places browser telemetry at the center of their security architecture.</p><p><b>The rise of shadow AI and agentic risk</b></p><p>As enterprises adopt AI, new vulnerabilities have emerged. Shadow AI —the unauthorized use of public generative AI tools—can expose sensitive corporate IP through prompt sharing and autonomous agent actions. Ninety-two percent of organizations express concern around potential data leakage through these channels. Leaving this unmonitored creates significant risk (<a href=\"https://services.google.com/fh/files/misc/omdiareport.pdf\" target=\"_blank\">Omdia</a>, 2026).</p><p>Legacy security stacks, including traditional endpoint detection and response (EDR) and perimeter firewalls, are fundamentally blind to in-browser interactions. They completely miss high-risk threat vectors unique to AI-driven workflows, such as:</p><ul><li>Malicious extensions that \"read\" sensitive financial data or \"write\" keyloggers onto sign-in pages.</li><li>\"Living off the land\" (LOTL) tactics and session hijacking.</li><li>State-sponsored threat actors leveraging AI to accelerate the attack lifecycle.</li></ul><p><b>Chrome Enterprise Premium: Your high-fidelity telemetry engine</b></p><p>Chrome Enterprise Premium addresses this visibility gap by capturing browser telemetry. Rather than relying on external observation after the fact, Chrome Enterprise records signals directly at the point of user interaction.</p><p><b>Core Capabilities for Modern Defense</b></p><ul><li><b>Real-time signals:</b> Continuous telemetry for network events, high-risk user behaviors, and suspicious domain access.</li><li><b>Extension telemetry:</b> Granular visibility into side-loaded extensions and extension-to-domain communications that traditional EDR might miss.</li><li><b>GenAI and SaaS app reporting:</b> A dedicated capability to discover and govern sanctioned versus unsanctioned AI tools across the fleet.</li><li><b>Evidence locker:</b> The ability to capture files and content that violate DLP policies, providing a crucial trail for forensic analysis, root cause determination, and detection rule refinement.</li></ul><p><b>Transforming reactive review into proactive mitigation</b></p><p>Transitioning to proactive defense allows security teams to mitigate threats early. By streaming browser signals into security operations platforms such as Google Security Operations, teams can automate responses and reduce manual investigation time, lowering incident response costs.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Blog table_2000x1115 (1)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Blog_table_2000x1115_1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>Insights from the frontlines: Mandiant case studies</b></p><p>Mandiant observations reveal the practical impact of browser visibility. These cases show how browser telemetry helps detect attacks that bypass standard controls:</p><ol><li><b>RMM Software Download:</b> Chrome Enterprise Premium flagged a legitimate Remote Monitoring and Management (RMM) executable because it originated from a newly registered domain—a key indicator of social engineering that network tools often miss.</li><li><b>Credential Harvesting:</b> Chrome Enterprise Premium evaluated URL risks and navigation parameters at the precise moment of interaction, disrupting a phishing attempt before the user could submit credentials.</li><li><b>Malvertising:</b> Integration with Google Threat Intelligence allowed for immediate identification of a malicious ad click, containing the threat before the actor gained hands-on-keyboard access.</li></ol><p>Closing the security gap starts with recognizing that the browser is a key resource for enterprise security. With Google telemetry spanning billions of protected devices, organizations can maintain defensive visibility alongside emerging AI usage to drive a proactive security strategy (<a href=\"https://safebrowsing.google.com/\" target=\"_blank\">Google Safe Browsing</a>).</p><p><b>Ready to transform your security posture?</b></p><p>Avoid leaving a blind spot in your security strategy. Learn more about web defense options by reading our digital paper, <b>\"</b><a href=\"https://chromeenterprise.google/engage/strengthening-secops-with-browser-telemetry/\" target=\"_blank\">Securing the Browser: How telemetry brings web defense into the next frontier</a>.<b>\"</b></p><p>This resource outlines a framework for modern defense, detailing adversary tactics, infection vectors, and threat trends. Read the digital paper to evaluate your organization's browser security strategy.</p></div>"
"last_updated": "2026-10-02 09:31:16 JST"
