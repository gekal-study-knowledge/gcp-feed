  "c2254df51a0ffdabc6fd82071adbdf50":
    "id": "c2254df51a0ffdabc6fd82071adbdf50"
    "title": "What’s new in AI infrastructure and orchestration in September"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/whats-new-in-ai-infrastructure-this-month/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 05:33:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We hereby declare September to be scalability month! As the world prepares for a surge of agentic fleets, we are shoring up our AI infrastructure and orchestration offerings to gracefully — and quickly — respond to that demand, all while maintaining workload isolation and security, and keeping costs in check. Read on to learn how these enhancements manifest across Google Cloud’s compute, network, storage, and orchestration offerings, plus new ways customers are using Google Cloud AI infrastructure, and third-party industry validation of our strategy. </span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<p><strong style=\"vertical-align: baseline;\">Google Kubernetes Engine updates:</strong><span style=\"vertical-align: baseline;\"> The GKE team is all about improving the scalability of the platform, and in September, those improvements came in many shapes and sizes:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><span style=\"vertical-align: baseline;\">Need an execution runtime with higher density for your agentic workloads? We engineered the new open-source </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/agent-substrate-available-on-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> to run millions of sandboxes with 10x higher density than standard container runtimes. Agent Substrate also delivers sub-500ms resume operations at over 500 suspend/resume activations per second with a native zero-trust kernel and network isolation. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> GKE now has </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">scale-to-zero</span></a><span style=\"vertical-align: baseline;\"> capabilities built-in. No need to configure complex components to scale your workloads down, thanks to the HPA with the Autoscaling Metric and support for KEP-2021, which do the job for you, out of the box. </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the blog</span></a><span style=\"vertical-align: baseline;\"> to learn more. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Further, the GKE HPA (with the above-mentioned Autoscaling Metric) now lets you scale up and down based on custom PromQL metrics, in addition to standard metrics, allowing you to trigger workloads according to conditions that are meaningful and unique to your business. Read more </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/native-support-for-prometheus-metrics-in-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><span style=\"vertical-align: baseline;\">Yet another scalability feature is </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Pod snapshots</span></a><span style=\"vertical-align: baseline;\">, which lets you save the running state of your workload, including CPU and GPU memory, and restore it on demand. According to internal tests, GKE Pod snapshots can reduce AI inference start-up by as much as 89%. Learn more </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New migration tool: </strong><span style=\"vertical-align: baseline;\">Finally, if you’ve always wanted to migrate your container workloads from AWS EKS to GKE but feared a daunting, high-friction engineering endeavor, we’ve just launched </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-agentic-migration?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE agentic migration</span></a><span style=\"vertical-align: baseline;\">, a purpose-built agent plugin that replaces brittle, ad-hoc prompting with an AI-assisted migration pipeline protected by deterministic guardrails. Designed as a compilation of agent skills and a local Model Context Protocol (MCP) server, it uses AI to translate complex AWS EKS IaC and Kubernetes manifests directly into GKE landing zones. Get started with the </span><a href=\"https://github.com/gke-labs/gke-agentic-migration/blob/main/docs/onboarding-guide.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">onboarding guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Feature updates: </strong><span style=\"vertical-align: baseline;\">Reinforcement learning (RL) and evaluation workloads are a beast: In a standard agentic RL loop, an LLM policy generates actions like code snippets on GPUs and executes them inside isolated CPU sandboxes to observe a reward signal. However, when scaling up this loop to support tens of thousands of parallel rollouts, infrastructure bottlenecks emerge, for instance idle accelerators, image cardinality, and a saturated control plane. To help, we developed GKE Agent Sandbox optimized for RL, plus an Agent Sandbox RL orchestration SDK and native integrations for popular RL gyms and harnesses. All are now generally available, and you can learn more </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Storage updates: </strong><span style=\"vertical-align: baseline;\">AI trains and creates lots of data, and that data has to live somewhere — in block storage systems, file systems, object stores and databases. We announced enhancements to our storage portfolio to help this critical layer roll with the agentic punches:  </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore agent volumes</span></a><span style=\"vertical-align: baseline;\"> offer high-performance, elastic, persistent file storage for agentic workloads. Thanks to its tight integration with GKE Agent Substrate and GKE Agent Sandbox, Filestore agent volumes automatically allocates and attaches a dedicated, isolated file workspace to GKE agent sandboxes in milliseconds. Request access to the preview </span><a href=\"http://forms.gle/vYPkcFiZVoTjf7Ah7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product:</strong><span style=\"vertical-align: baseline;\"> If you run generative AI and RAG data layers  — think Milvus, Pinecone, Qdrant, Vespa, Redis, and in-memory context caching — you may want to take a look at the </span><a href=\"https://cloud.google.com/blog/products/compute/compute-engine-m4n-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">M4N family of VMs</span></a><span style=\"vertical-align: baseline;\">, now GA, which offers the highest per-core IOPS and throughput of leading hyperscalers. Paired with Google Cloud's custom </span><a href=\"https://cloud.google.com/titanium\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> offload architecture and paired with</span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Hyperdisk Extreme</span></a><span style=\"vertical-align: baseline;\">, M4N instances deliver up to 25,000 MiB/s (25 GiB/s) of aggregate host storage performance and up to 1 million IOPS. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product:</strong><span style=\"vertical-align: baseline;\"> Another new Compute Engine product, </span><a href=\"https://cloud.google.com/blog/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D, is GA</span></a><span style=\"vertical-align: baseline;\">, and a strong storage solution for AI/ML training and inference workloads. When configured as a bare metal instance, Z4D provides both the high local SSD (LSSD) capacity and low latency required by agentic microVMs, so you can run thousands of isolated sandboxes per host with native performance and efficiency. Learn about </span><a href=\"https://cloud.google.com/blog/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D machines here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Today’s AI training and inference pipelines create data faster than most storage management systems can keep up, creating challenges for teams trying to understand their storage estates. A new version of </span><a href=\"https://docs.cloud.google.com/storage/docs/storage-intelligence/advisor-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage Intelligence advisor</span></a><span style=\"vertical-align: baseline;\"> makes it easier to answer the question: \"What’s in my buckets?\" and quickly identify unexpected changes. Then, enhanced </span><a href=\"https://docs.cloud.google.com/storage/docs/batch-operations/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">batch operations</span></a><span style=\"vertical-align: baseline;\"> let you automate bulk changes across your buckets — say, move storage classes, mass-delete stale or temporary data, or apply metadata, tagging, retention, or encryption changes. Learn about the latest in Storage Intelligence advisor </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/storage-intelligence-advisor-and-batch-operations-updates/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product:</strong><span style=\"vertical-align: baseline;\"> Last but not least, a new version of </span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> brings together pioneering Google infrastructure — Colossus distributed file system, and Jupiter network — to power a </span><a href=\"https://cloud.google.com/blog/products/databases/alloydbs-agentic-database-architecture?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new, no-compromises database architecture for the agentic era</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to:</strong><span style=\"vertical-align: baseline;\"> Wish you could make GPUs and TPUs scattered around the globe behave as a single pool behind a single entry point? </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gpu-and-tpu-utilization-with-multi-cluster-gke-inference-gateway?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">In this blog</span></a><span style=\"vertical-align: baseline;\">, we show you how to do just that. At the edge, the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">multi-cluster GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> focuses on global, multi-region traffic distribution and high availability. Beneath that, the </span><a href=\"https://github.com/llm-d/llm-d-router\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLM-d router</span></a><span style=\"vertical-align: baseline;\"> handles complex, memory-aware scheduling algorithms to keep utilization high. This architecture is deliberately runtime-, model-, and accelerator-agnostic, and in tests, routing traffic through the multi-cluster GKE Inference Gateway added less than 1% overhead.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">Using or planning to use GKE on TPUs for AI model training or inference? Training massive Large Language Models (LLMs) or running high-throughput inference serving represents a significant investment in specialized AI hardware, such as Cloud TPUs and GPUs. To get the most out of every dollar spent, you need to </span><a href=\"https://discuss.google.dev/t/a-tale-of-tpu-observability-on-gke-part-1/397955\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">understand workload lifecycle metrics in GKE</span></a><span style=\"vertical-align: baseline;\">. This detailed guide explains how to turn opaque cluster behaviors into actionable telemetry.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE customer:</strong><span style=\"vertical-align: baseline;\"> Learn why gaming startup SeaVerse relies on </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/seaverse-chooses-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox for its multi-tenant workloads</span></a><span style=\"vertical-align: baseline;\">, and how the platform helped it decrease its infrastructure costs by 60%. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<p><span style=\"vertical-align: baseline;\">In case you missed it, we’re also thrilled to share that Google has been named a leader, including achieving the highest score on either product or strategy, in three key analyst reports from Gartner and Forrester. </span></p>\n<ul>\n<li><a href=\"https://cloud.google.com/blog/products/compute/forrester-wave-public-cloud-platforms-q3-2026-report?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google is a leader in The Forrester Wave™: Public Cloud Platforms, Q3 2026</span></a><span style=\"vertical-align: baseline;\">: Highest overall score of any cloud provider!</span></li>\n<li><a href=\"https://cloud.google.com/blog/products/compute/google-named-a-leader-in-2026-gartner-magic-quadrant-for-scps?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google named a Leader in 2026 Gartner® Magic Quadrant™ for Strategic Cloud Platform Services</span></a><span style=\"vertical-align: baseline;\">: Positioned furthest for “Completeness of Vision” of all vendors evaluated.</span></li>\n<li><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/2026-gartner-magic-quadrant-for-container-management?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google is a Leader in the 2026 Gartner Magic Quadrant for Container Management</span></a><span style=\"vertical-align: baseline;\">: Positioned highest in “Ability to Execute” of all vendors evaluated.</span></li>\n<li><span style=\"vertical-align: baseline;\">Google Cloud achieved a Gold rating in the latest SemiAnalysis ClusterMax 3.0 report, which evaluates the reliability, performance, support, pricing, and security of GPU providers globally. See the</span><a href=\"https://newsletter.semianalysis.com/p/clustermax-30-the-industry-standard\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">full report for more</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">August 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore</span></a><span style=\"vertical-align: baseline;\">, Google Cloud’s first-party, secure, scalable NFS file service, has emerged as a popular storage platform for AI and agentic workflows, and now, it’s even better suited to the task, with a new backend storage layer built directly on </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/how-colossus-optimizes-data-placement-for-performance?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Colossus</span></a><span style=\"vertical-align: baseline;\">, Google’s foundational distributed storage system. This new backend lets you provision IOPS independently from storage capacity, and is deeply integrated with GKE. In AI environments, this can help you service so-called agentic swarms — large groups of agents that need to read and write to a common dataset — without a drop off in performance. For more, check out the </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-file-service-runs-on-colossus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog post</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor sandboxes are now available in distributed Ray clusters on GKE</span></a><span style=\"vertical-align: baseline;\">. In partnership with Anyscale, we introduced an experimental library for Ray that brings gVisor, Google’s open-source application kernel, directly into distributed Ray clusters. gVisor provides lightweight environments with stronger isolation than ordinary containers, plus fast startup times and low memory overhead. To try out these sandboxing capabilities on GKE, head over to the </span><a href=\"https://docs.ray.io/en/master/cluster/kubernetes/examples/ray-sandboxing.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray sandboxing User Guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Looking for high-performance, easy-to-use infrastructure on which to run a personal AI agent, but don’t want to spend a lot of money? New </span><a href=\"https://cloud.google.com/blog/products/serverless/introducing-cloud-run-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run instances</span></a><span style=\"vertical-align: baseline;\"> are dedicated, singleton compute runtimes on Cloud Run that won’t shut down when the agent is idle. Better yet, the cost to run a Cloud Run instance with 1 vCPU and 1 GiB of memory continuously for 30 days is just $5.70.  </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides, documentation and how-tos</span></h4>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Big news in Model Context Protocol (MCP) land: As of the 2026-07-28 specification, the protocol core is “completely stateless. The handshake is gone. The initialize / initialized handshake (SEP-2575) and the logical Mcp-Session-Id header (SEP-2567) have been removed entirely. Instead, every request is now self-describing and independent.” Whoa. Learn more about the changes that the latest MCP specification brings, and more importantly, how to implement them, in </span><a href=\"https://developers.googleblog.com/scaling-ai-agent-infrastructure-with-the-mcp-stateless-updates/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this Google Developers blog</span></a><span style=\"vertical-align: baseline;\">.  </span></li>\n<li><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">Real-time AI systems make a mess of traditional network load balancing techniques.</span><span style=\"font-style: italic; vertical-align: baseline;\"> “Instead of handling isolated requests, the backend has to manage a continuous, live bidirectional stream. You’re dealing with a constant stream of audio chunks, transcripts, model outputs, and synthesized speech flowing back and forth simultaneously.”</span><span style=\"vertical-align: baseline;\"> Things only get worse when the user gets involved. </span><span style=\"font-style: italic; vertical-align: baseline;\">“The server has to immediately halt its current speech generation, pivot to update the context, maybe trigger a new tool, and start drafting a different response; this must be done without dropping the connection.”</span><span style=\"vertical-align: baseline;\"> For a new approach to managing load in the AI era, read </span><a href=\"https://developers.googleblog.com/scaling-real-time-ai-agents-with-session-aware-load-balancing/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scaling real-time AI agents with session-aware load balancing</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">How-to:</strong><span style=\"vertical-align: baseline;\"> Learn how to build an elastic, scalable LLM inference platform on GKE, even with a mix of different GPU accelerators. The proposed architecture combines Capacity Advisor and Compute Advisor, plus high-performance storage like RunAI:model streamer or GCPFuse with parallel downloads. Get all the details </span><a href=\"https://discuss.google.dev/t/how-to-build-an-elastic-scalable-llm-inference-platform-on-gke-using-fluid-compute/388108\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Documentation: </strong><span style=\"vertical-align: baseline;\">The thing about hosts with GPUs or TPUs is that you can’t use live migration to update them, setting up a maintenance challenge. In this new docs page, learn how to </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/perform-host-maintenance-accelerators\"><span style=\"text-decoration: underline; vertical-align: baseline;\">update accelerator-equipped hosts</span></a><span style=\"vertical-align: baseline;\"> according to your tolerance for downtime for your training and inference workloads.   </span><strong style=\"vertical-align: baseline;\"> </strong></li>\n<li><strong style=\"vertical-align: baseline;\">Documentation: </strong><span style=\"vertical-align: baseline;\">Advanced Compute Images, or ACIs, are standardized image stacks for AI/ML and HPC infrastructure, so you don’t need to manually build your own custom images. In this new docs page, learn how to </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/use-aci-images\"><span style=\"text-decoration: underline; vertical-align: baseline;\">create an ACI image</span></a><span style=\"vertical-align: baseline;\"> using the Google Cloud CLI, console, or SchedMD's Slurm workload manager</span><strong style=\"vertical-align: baseline;\">. </strong></li>\n<li><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">AI workloads are notoriously difficult to architect, resource-intensive, and bursty, which can also lead to scaling bottlenecks and large pools of underutilized — or misutilized — compute resources. A new blog outlines the </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">three main ways to achieve dynamic capacity management in Google Cloud</span></a><span style=\"vertical-align: baseline;\">: 1) scheduling capacity for planned downtime; 2) maintaining automated fallback capacity for unplanned downtime; and 3) relying on GKE’s core orchestration capabilities to automate resource allocation. </span></li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Business orchestration software provider </span><a href=\"https://www.uipath.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">UiPath</strong></a><span style=\"vertical-align: baseline;\"> was dealing with spiky workloads, and wanted more predictable costs. To get there, it re-architected its infrastructure, moving from isolated clusters to a shared Google Cloud GPU fleet that included both A3 VM instances (NVIDIA H100 GPUs) for training with G4 VM instances (NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs) for inference. You can read more about their architecture </span><a href=\"https://cloud.google.com/blog/topics/customers/how-uipath-built-its-high-performance-gpu-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://mirendil.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mirendil</strong></a><span style=\"vertical-align: baseline;\">, an frontier AI lab focused on accelerating AI development, announced that it is </span><a href=\"https://cloud.google.com/blog/topics/startups/mirendil-selects-ai-hypercomputer?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">using AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> with both TPUs and NVIDIA GPUs to support its model pre-training and post-training applications. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://replen.it/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Replenit</strong></a><span style=\"vertical-align: baseline;\">, a retail CRM provider, built its AI decision engine in Google Cloud, using BigQuery, Gemini Enterprise Agent Platform, and open-source Gemma models that it runs on Cloud TPUs. This latter combination provided Replenit with 90% lower pipeline costs than their previous cloud provider, the company reports. Read the </span><a href=\"https://cloud.google.com/customers/replenit?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">full case study</span></a><span style=\"vertical-align: baseline;\"> for more. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.malachyte.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Malachyte</strong></a><span style=\"vertical-align: baseline;\"> architected its AI-powered e-commerce recommendation platform on top of Bigtable, Managed Service for Apache Kafka, Pub/Sub, Compute Engine, and last but not least, GKE. See how it all comes together in </span><a href=\"https://cloud.google.com/blog/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this blog</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">July 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"vertical-align: baseline;\"> is now GA, and available in four distinct performance tiers that deliver throughput ranging from 125 MB/s, 250 MB/s, 500 MB/s, to 1000 MB/s per TiB of capacity — with the ability to scale up to 8 PB of storage capacity. The Managed Lustre solution is powered by DDN’s EXAScaler, combining DDN's decades of leadership in high-performance storage with Google Cloud's expertise in cloud infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/compute/c4n-network-and-storage-optimized-vms?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C4N network and storage optimized VMs are now GA</span></a><span style=\"vertical-align: baseline;\">. C4N is our first network- and block-storage-optimized VM series built to eliminate data-transfer bottlenecks. Powered by 5th Gen Intel Xeon Scalable processors and built on Google's </span><a href=\"https://cloud.google.com/titanium?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> offloading hardware, it achieves 400 Gbps network bandwidth, 95 million packets per second (MPPS), and up to 25 GiB/s of block storage throughput when paired with Hyperdisk Extreme.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/planning-large-clusters#clusters-5k-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Dataplane V2 up to 15K Nodes with Network Policies (GA)</span></a><span style=\"vertical-align: baseline;\">. This capability enables standard GKE clusters to scale up to 15,000 nodes while maintaining full active Network Policy enforcement, supporting the massive infrastructure needs of large enterprise and AI/ML customers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/introducing-co-operative-time-slicing-for-rl-in-llm-d?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Co-operative time-slicing in llm-d</span></a><span style=\"vertical-align: baseline;\">. If you’re running reinforcement learning (RL) workloads, you can now interleave independent RL jobs onto shared physical hardware, increasing aggregate accelerator duty cycles from a ~40% baseline up to 70% without impacting model convergence or accuracy. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New AI security tool:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-k8s-aibom-on-gke-for-automated-ai-bills-of-materials?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looking to secure your AI supply chain on GKE</span></a><span style=\"vertical-align: baseline;\">, deploy AI workloads safely, and cut down on shadow AI? We open-sourced k8s-aibom, a lightweight, unprivileged Kubernetes controller that continuously monitors container clusters to automatically detect running AI runtimes (like vLLM and Triton) and generate standard CycloneDX Machine Learning Bill of Materials (ML-BOMs). Check out the </span><a href=\"https://github.com/GoogleCloudPlatform/k8s-aibom\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">k8s-aibom project</span></a><span style=\"vertical-align: baseline;\"> and get involved.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide: </strong><span style=\"vertical-align: baseline;\">On July 27, Google announced </span><a href=\"https://discuss.google.dev/t/announcing-day-0-support-for-kimi-k3-on-google-cloud/385392\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Day 0 support for Moonshot AI’s Kimi K3</span></a><span style=\"vertical-align: baseline;\"> 2.8-trillion-parameter open-weight model, the day weights were released. Whichever your preferred deployment path — via Model Garden, custom orchestration, or GKE with llm-d recipes — this guide offers detailed step-by-step instructions to help you evaluate and pilot Kimi K3 in Google Cloud. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/autopilot-clusters-with-gke-managed-dranet-gpus-and-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE) managed DRANET supports both GPUs and TPUs</span></a><span style=\"vertical-align: baseline;\">. There are several configurations to use this implementation, including standard cluster (where you have full control) and autopilot cluster (where Google does the heavy configs for you). Take a deeper dive in the hands-on lab, </span><a href=\"https://codelabs.developers.google.com/codelabs/gke-autopilot-tpus-dranet-gemma#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Autopilot clusters with TPUs, GKE managed DRANET and Gemma 4</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Learn to run Ray on TPUs, not GPUs. In </span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-1-the-foundations/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Part 1</span></a><span style=\"vertical-align: baseline;\"> of this two-part series, we discuss TPU slices (hint: Ray thinks of them as just another accelerator on which to schedule), then walk through Ray’s various AI libraries (</span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-2-ray-ai-libraries/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Part 2</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide: </strong><span style=\"vertical-align: baseline;\">Evaluate TPUs for sample workloads using a new microbenchmark suite that helps you accurately assess whether a device is achieving its theoretical performance specifications, and to identify specific performance gaps or architecture-specific bottlenecks. Dive in </span><a href=\"https://developers.googleblog.com/how-to-use-google-microbenchmarks-for-evaluating-tpu-performance/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Scale your agents without killing your budget. </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/reduce-your-agents-costs-with-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn how GKE orchestration can help you safely pack more agents onto a fixed compute footprint</span></a><span style=\"vertical-align: baseline;\"> with GKE Agent Sandbox and Pod snapshots. Whether your goal is performance or cost optimization, we teach you how to turn the right dials for optimal agent efficiency. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Technical blueprint: </strong><span style=\"vertical-align: baseline;\">Inside the optimization of Mistral 3 large inference on Ironwood. This blog outlines how one Google team optimized Mistral 3 large MoE model inference on Google’s Ironwood (TPU v7x), achieving a 1.5x performance gain. They did so with hybrid sharding, replacing linear VPU summations with tree reductions, optimizing GMM/MLA kernels, and adopting asynchronous scheduling. As a result, they boosted throughput by up to 48% while maintaining benchmark accuracy neutrality. Read the full blog </span><a href=\"https://discuss.google.dev/t/inside-the-optimization-of-mistral-3-large-inference-on-ironwood/385847\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report: </strong><span style=\"vertical-align: baseline;\">Google was named a Leader in the inaugural </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/google-is-a-leader-in-gartner-magic-quadrant-for-ai-infra?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gartner</span><span style=\"text-decoration: underline; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Ⓡ</span></span><span style=\"text-decoration: underline; vertical-align: baseline;\"> Magic Quadrant™ for AI Infrastructure</span></a><span style=\"vertical-align: baseline;\">, positioned highest for ‘Ability to Execute’ and furthest for ‘Completeness of Vision’. Gartner called out Google’s proprietary scalable compute, integrated AI Hypercomputer architecture, and the scale of our AI compute capacity as key strengths. Download a copy </span><a href=\"https://cloud.google.com/resources/content/2026-gartner-mq-ai-infrastructure?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report:</strong><span style=\"vertical-align: baseline;\"> We recently surveyed more than 1,400 senior IT leaders for our </span><a href=\"https://cloud.google.com/resources/content/state-of-infrastructure-in-the-agentic-ai-era?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">State of AI Infrastructure report</span></a><span style=\"vertical-align: baseline;\">, and a resounding pattern emerged: The gap between AI ambition and infrastructure reality is widening. In fact, 83% of organizations say they require infrastructure upgrades to support production-grade agentic AI. </span><a href=\"https://cloud.google.com/blog/products/compute/state-of-ai-infrastructure-report-overview?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the accompanying blog</span></a><span style=\"vertical-align: baseline;\"> to understand how adapting your infrastructure to meet the demands that agentic applications place on your systems will help you move from pilot to production.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">June 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology and tool updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> Protecting sensitive data used with AI is a critical part of advanced and secure cloud infrastructure. </span><a href=\"https://cloud.google.com/security/products/confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> cryptographically protects data in use in hardware-based Trusted Execution Environments (TEEs) with verifiable data integrity, and is </span><a href=\"https://cloud.google.com/blog/products/identity-security/verifiable-trust-in-the-ai-era-whats-new-in-confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">now available</span></a><span style=\"vertical-align: baseline;\"> on the accelerator-optimized </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G4 machine series</span></a><span style=\"vertical-align: baseline;\">, featuring </span><a href=\"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs</span></a><span style=\"vertical-align: baseline;\">. Get started with </span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 VMs</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 GKE Nodes</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Developer resource: </strong><span style=\"vertical-align: baseline;\">The new </span><a href=\"https://cloud.google.com/products/tpu/tpu-developer?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Developer Hub</span></a><span style=\"vertical-align: baseline;\"> is the place to go for model builders, optimizers, and developers to learn to unlock the full performance of Google Cloud TPUs. Read more in this </span><a href=\"https://developers.googleblog.com/unlocking-the-power-of-the-tpu-stack-introducing-our-new-developer-hub/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product: </strong><span style=\"vertical-align: baseline;\">Scale your AI workloads with the new </span><a href=\"https://discuss.google.dev/t/stop-training-blind-scaling-ai-with-the-new-opentelemetry-based-tpu-ai-telemetry-collector-agent/375210\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenTelemetry-Based TPU AI Telemetry Collector Agent</span></a><span style=\"vertical-align: baseline;\">. For the first time, you can route high-fidelity TPU hardware telemetry to Google Cloud Monitoring, Google Managed Prometheus, or your own self-hosted Grafana stack.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Learn how to build high availability into an AI inference workload running on GKE Inference Gateway with TPUs, Cloud Storage FUSE and Dynamic Resource Allocation (DRA). This </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/experimenting-with-tpus-gke-managed-dranet-and-multi-cluster-inference-gateway?_gl=1*jj3plw*_ga*OTAxNzc0MzU1LjE3ODIyMjAxNDk.*_ga_4LYFWVHBEB*czE3ODI3NTc3NzAkbzkkZzEkdDE3ODI3NTg2MDEkajYwJGwwJGgw&amp;e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\"> provides an overview, or you can get all the technical details in the </span><a href=\"https://codelabs.developers.google.com/codelabs/gke-inference-gateway-multi-cluster-tpus-dranet#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">hands-on codelab</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Did you know you can connect your AI agents to unstructured data in </span><a href=\"https://cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> via Model Context Protocol (MCP)? In </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/build-ai-agents-faster-with-gcs-google-cloud-storage-mcp-server\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this blog</span></a><span style=\"vertical-align: baseline;\">, learn about why would want to do that from three customer examples, then how to do it, choosing either a fully managed service, or a self-managed local server for more customization and control. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report: </strong><span style=\"vertical-align: baseline;\">According to an independent benchmark report, </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> outperforms the next leading managed Kubernetes service with 15.7% higher throughput, 92.8% shorter wait times, and 62.6% lower inter-token latency. This performance can be attributed to its use of prefix caching, which optimizes LLM performance by storing the KV cache (activation states) of long, repetitive prompt prefixes. Learn more in the </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-inference-gateway-prefix-caching-accelerates-ai-inference?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">A closer look at </span><a href=\"https://discuss.google.dev/t/accelerate-tpu-model-loading-while-saving-ram-on-gke/374835\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the cold start problem, this time for TPUs and GKE</span></a><span style=\"vertical-align: baseline;\">, and how the Run:ai Model Streamer can help change the dynamic. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Leveraging GKE, BigQuery, Cloud SQL, and Gemini Enterprise Agent Platform, </span><a href=\"https://www.youtube.com/watch?v=x36QJ-QKRGg\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pager Health is eliminating operational fragmentation to deliver a simplified, personalized U.S. healthcare experience</span></a><span style=\"vertical-align: baseline;\"> that transforms lives.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Trustpilot, the customer review platform, built a high-volume streaming pipeline using fine-tuned Gemma models with Dataflow and Gemini Enterprise Agent Platform running on cost-optimized A2 VMs using A100 GPUs, as well as optimized version of vLLM maintained by Gemini Enterprise Agent Platform.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">May 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology and tool updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> is now generally available.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New open-source project:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> is a new open-source project aimed at continuing to push the limits of agentic infrastructure density</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://ai.google.dev/edge/ai-edge-portal\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Edge Portal</span></a><span style=\"vertical-align: baseline;\">, a solution for testing and benchmarking on-device machine learning (ML) at scale, now supports benchmarking and debugging on-device LLMs. Read more </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/benchmark-llms-on-device-with-ai-edge-portal?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product deep dive: </strong><span style=\"vertical-align: baseline;\">We went </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/cloud-storage-rapid-turbocharges-object-storage-for-ai-analytics?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">into depth about Cloud Storage Rapid</span></a><span style=\"vertical-align: baseline;\">, a new family of high-performance storage offerings for AI workloads. At launch, offerings include Rapid Bucket (formerly Rapid Storage), a high-performance zonal object storage offering, and Rapid Cache (formerly Anywhere Cache), which accelerates reads on-demand and colocates compute and data for workloads in existing buckets. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">Google Global Infrastructure VP Bikash Koley and Engineering Fellow Arjun Singh provide a high-level overview of </span><a href=\"https://cloud.google.com/blog/products/networking/data-center-and-global-networks-built-for-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the challenges that AI workloads pose to network infrastructure</span></a><span style=\"vertical-align: baseline;\">, and discuss the deep enhancements we’ve made to our data center fabrics, WAN, and global networks to better support them. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">We unveiled a </span><a href=\"https://cloud.google.com/blog/products/compute/cluster-reliability-for-trillion-parameter-models-on-tpus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new cluster-level reliability model</span></a><span style=\"vertical-align: baseline;\"> for developing frontier AI models on TPUs, ditching instance-level reliability </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Visual media provider </span><a href=\"https://cloud.google.com/blog/products/infrastructure/how-imgix-processes-8-billion-images-daily-with-g4-vms-powered-by-nvidia-blackwell?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Imgix serves more than 8 billion images and videos from AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> equipped with G4 VMs powered by NVIDIA RTX PRO 6000 Blackwell GPUs.</span></p>\n</li>\n</ul></div>"
  "c1e196df77c7eb0fe7201a23c6ff701e":
    "id": "c1e196df77c7eb0fe7201a23c6ff701e"
    "title": "Cloud CISO Perspectives: How cybersecurity startups can win CISOs"
    "link": "https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-cybersecurity-startups-can-win-cisos/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 05:33:08"
    "summary": "<div class=\"block-paragraph\"><p>Welcome to the second Cloud CISO Perspectives for September 2026. Today, Alicja Cade and Nick Godfrey, senior directors, Office of the CISO, share their guidance for cybersecurity startups on how to win over the CISOs who will become crucial business partners and customers.</p><p>As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the <a href=\"https://cloud.google.com/blog/products/identity-security/\">Google Cloud blog</a>. If you’re reading this on the website and you’d like to receive the email version, you can <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">subscribe here</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fb7992b8a10&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>How cybersecurity startups can win CISOs</b></h3><p><i>By Alicja Cade, Senior Director, Financial Services, Office of the CISO, and Nick Godfrey, Senior Director, Office of the CISO</i></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Alicja Cade headshot 2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Alicja_Cade_headshot_2.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Alicja Cade, Senior Director, Financial Services, Office of the CISO</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Cybersecurity startups play a crucial role in technology as they build to solve both legacy, existential challenges and the latest problems on the cutting edge. A key part of winning and transforming the cybersecurity field is becoming a strategic partner to CISOs and their security teams.</p><p>Google has supported more than 50 cybersecurity founders over the past four years through our <a href=\"https://startup.google.com/\">Google for Startups program</a>, including <a href=\"https://authologic.com/\">Authologic</a>, <a href=\"http://www.bfore.ai/\">BforeAI</a>, <a href=\"https://www.build38.com/\">Build38</a>, <a href=\"http://cerby.com/\">Cerby</a>, <a href=\"https://www.crowdsec.net/\">Crowdsec</a>, <a href=\"http://www.riskledger.com/\">Risk Ledger</a>, and <a href=\"https://www.mokn.io/\">Mokn</a>.</p><p>Christian Torres, co-founder and CEO, <a href=\"https://www.kriptos.io/\">Kriptos</a>, and a Google for Startups participant, said that building connections between startups and CISOs is crucial to solving critical security challenges.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"NickGodfrey8975-hi\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/NickGodfrey8975-hi_Tm5UVy8.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Nick Godfrey, Senior Director, Office of the CISO</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>\"The Google for Startups program has been the most impactful initiative we've joined as a cybersecurity company. Unlike other accelerator programs, this one speaks our language — the challenges, the ecosystem, and the conversations are 100% aligned with what we do every day at Kriptos. The access to CISOs and security leaders has been invaluable, and the connections we've built through the program are ones we now see regularly across industry events. It's put us exactly where we need to be,” he said.</p><p>Cybersecurity startup founders face many competing taskmasters as they fight for survival, from demanding capital funders to the relentless pressure of growing their market and networks. CISOs should be key stakeholders for cybersecurity startups so that founders focus on solving thorny challenges in a way that works in the real world.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Listening to CISOs and understanding the businesses that they serve takes time and effort, and if done right can help deliver better value and create a lasting enterprise foundation and network of allies.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Here are three top tips from September’s </span><a href=\"https://cloud.google.com/blog/products/identity-security/meet-the-33-cybersecurity-startups-joining-the-gemini-startup-forum\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Startup Forum for Cybersecurity</span></a><span style=\"vertical-align: baseline;\">, part of the Google for Startups program, where we offered vital guidance, addressed critical domains, and helped foster deep dialogue for the next generation of AI-native cybersecurity startups.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Tip 1: Listen then design and deliver for your customers</strong></p>\n<p><span style=\"vertical-align: baseline;\">Avoid becoming a round peg in a square hole by combining your problem-solving startup with listening to CISOs who have to protect real systems, networks, and people. Listening to CISOs and understanding the businesses that they serve takes time and effort, and if done right can help deliver better value and create a lasting enterprise foundation and network of allies.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here’s how to develop trusted CISO relationships:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Host diagnostics meetings</strong><span style=\"vertical-align: baseline;\">. Your meetings with CISOs should focus on mapping their operational bottlenecks and co-authoring collaborative solutions while studying their pain points.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Create \"unselling\" spaces to build peer trust</strong><span style=\"vertical-align: baseline;\">. Host intimate, pitch-free roundtable discussions on industry challenges or establish a critique-only advisory board to build genuine relationships with CISOs without the pressure of a sales environment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Use neutral networks that don’t include venture capitalists</strong><span style=\"vertical-align: baseline;\">. Engage with CISOs in low-friction environments by contributing to open-source security projects and participating in academic and geopolitical risk forums where security leaders gather to solve broad industry problems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Avoid the bait-and-switch pitch</strong><span style=\"vertical-align: baseline;\">. Never disguise a sales pitch as a research or feedback session, as tricking a CISO into a product demo will permanently destroy their trust.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Center their business context</strong><span style=\"vertical-align: baseline;\">. Don’t limit your listening to the technical security stack, because the CISO’s primary job is to enable and protect the broader business strategy.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Tip 2: Evaluate AI security to filter out noise</strong></p>\n<p><span style=\"vertical-align: baseline;\">Instead of just using AI to assemble the product, startups should critically evaluate what makes your approach unique and how you communicate that to potential customers.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Define your moat</strong><span style=\"vertical-align: baseline;\"> by investing in proprietary datasets, specialized fine-tuning, and unique orchestration layers that create a true technical moat. Don’t be a wrapper.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Secure the intelligence</strong><span style=\"vertical-align: baseline;\"> by proactively designing your models to resist adversarial attacks, prompt injection, and data poisoning. In cybersecurity, model robustness is your ultimate trust signal.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deliver high-fidelity outcomes</strong><span style=\"vertical-align: baseline;\"> by clearly communicating how your AI product reduces cognitive load for defenders, minimizes false positives, and integrates safely into existing operations.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Avoid using generic marketing buzzwords like \"cognitive,\" \"autonomous,\" or \"revolutionary\" without the technical documentation, case studies, and whitepapers to back them up. In a skeptical market, transparency is your best sales tool. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Tip 3: Enthusiastically embrace your sector</strong></p>\n<p><span style=\"vertical-align: baseline;\">Keep a sharp eye out for common due diligence pitfalls during investment and merger and acquisition cycles. These include ensuring that internal engineering and cybersecurity practices meet external claims, but also evaluating the regulatory context of your business sector as well as the security and reliability of your product and service. </span></p>\n<p><span style=\"vertical-align: baseline;\">You have to know whether you’re required to abide by data sovereignty, data residency, and other requirements. To avoid this pitfall, engage with broader stakeholders early who know the sector and its nuances well.</span></p>\n<p><strong style=\"vertical-align: baseline;\">How to keep the conversation going</strong></p>\n<p><span style=\"vertical-align: baseline;\">Even beyond the crowded field of aspiring cybersecurity companies, startups broadly can benefit immensely by making sure that they listen carefully, evaluate objectively, and take to their sector requirements enthusiastically. </span></p>\n<p><span style=\"vertical-align: baseline;\">\"Google's Office of the CISO has been a bridge between LetsData and the security leaders we need to reach. Sometimes that bridge is advice on how our offering maps to a CISO's real priorities. Sometimes it is a direct introduction to a CISO who is looking for exactly what we build. For a startup, a warm introduction at that level is priceless,” said Ksenia Iliuk, founder and COO, </span><a href=\"https://letsdata.net/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LetsData</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about how Google Cloud’s Office of the CISO can help support your organization, check out our </span><a href=\"https://cloud.google.com/solutions/security/leaders\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CISO Insights hub</span></a><span style=\"vertical-align: baseline;\">. </span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fb798c839d0&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://www.youtube.com/watch?v=Wpo-5ke9uvQ&#x27;), (&#x27;image&#x27;, &lt;GAEImage: Cloud-CISO-Perspectives-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>In case you missed it</b></h3><p>Here are the latest updates, products, services, and resources from our security teams so far this month:</p><ul><li><b>Agentic hacks, real proofs: Inside Google's PageBreak project</b>: Distinguishing a genuine, exploitable flaw from a convincing hallucination has become a major challenge, often increasing the burden on product teams. PageBreak is an internal AI agent of Google's Product Security team developed to test the security of our first-party web applications and address this challenge. <a href=\"https://blog.google/security/agentic-hacks-real-proofs-inside-googles-pagebreak-project/\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Investing together: Wiz Defend and Google Security Operations</b>: Continuing to deepen the integration between Wiz Defend and Google Security Operations, helping teams work faster wherever they choose to investigate. <a href=\"https://www.wiz.io/blog/wiz-defend-and-google-security-operations\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>A unified view of Android security updates for enterprises and OEMs</b>: We're introducing new libraries that give enterprise partners and OEMs a complete, real-time picture of a device’s security posture. <a href=\"https://blog.google/security/android-security-state-libraries/\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Delivering new partner security agents and AI defenses with Gemini Enterprise</b>: We're expanding our catalog of partner-built security offerings in the Gemini Enterprise ecosystem to help you leverage your full security context. <a href=\"https://cloud.google.com/blog/products/identity-security/google-cloud-partners-deliver-new-security-agents-and-ai-defenses-with-gemini-enterprise\"><b>Read more</b></a>.</li><li><b>Google named a Leader in the External Threat Intelligence Service Forrester Wave</b>: We are proud to announce that Forrester has named Google a Leader in The Forrester Wave™: External Threat Intelligence Service Providers, Q3 2026. <a href=\"https://cloud.google.com/blog/products/identity-security/google-named-a-leader-in-the-external-threat-intelligence-service-forrester-wave\"><b>Read more</b></a>.</li><li><b>Wiz named a Leader in the Proactive Security Platforms Forrester Wave</b>: Forrester’s Proactive Security Platforms evaluation for Q3 2026 rated Wiz with top scores across eight areas, reflecting our commitment to securing the AI era. <a href=\"https://www.wiz.io/blog/forrester-wave-for-proactive-security-2026\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Strengthen your CI/CD pipeline with new Secure Source Manager capabilities</b>: To help you better address software supply chain threats, our Secure Source Manager lets you manage your source and CI/CD systems with unified authentication and authorization mechanisms. <a href=\"https://cloud.google.com/blog/products/identity-security/strengthen-your-cicd-pipeline-with-new-secure-source-manager-capabilities\"><b>Read more</b></a>.</li><li><b>Building an AI detection engine that understands agent intent</b>: Analyzing model input and output logs in an AI-native detection pipeline to understand and uncover malicious AI agent behavior. <a href=\"https://www.wiz.io/blog/building-an-ai-detection-engine-for-agent-intent\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Using AI to discover and fix high-priority exposures across public services and critical infrastructure</b>: New initiative partners with under-resourced organizations to uncover, remediate exploitable risk at scale. <a href=\"https://www.wiz.io/blog/scan-for-good-critical-ai-exposures\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more security stories <a href=\"https://cloud.google.com/blog/products/identity-security\">published this month</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fb799749190&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Threat Intelligence news</b></h3><ul><li><b>ShinyHunters renewed mass exploitation campaign targeting Oracle PeopleSoft</b>: Mandiant and Google Threat Intelligence Group (GTIG) have identified renewed mass exploitation of CVE-2026-35273 by UNC6240 (ShinyHunters), along with expanded global targeting across multiple sectors. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft\"><b>Read more</b></a>.</li><li><b>Proactively defend by hardening code pipelines and CI/CD infrastructure</b>: Check out our actionable blueprint for software and platform architects designed to safeguard the software supply chain against threat vectors that are actively being exploited, third-party risks, and architectural vulnerabilities throughout the entire software development lifecycle. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure\"><b>Read more</b></a>.</li><li><b>Infostealer incursion: How stolen credentials breach cloud, code, and AI environments</b>: Wiz Research analyzes NordStellar data to map the credentials targeted by infostealer families and assess their potential impact across cloud, code, and AI environments. <a href=\"https://www.wiz.io/blog/infostealer-incursion-cloud-ai-credentials\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more threat intelligence stories <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\">published this month</a>.</p></div>\n<div class=\"block-paragraph\"><h3><b>Now hear this: Podcasts from Google Cloud</b></h3><ul><li><b>Cloud Security Podcast: Patching browsers with AI, agents, Rust, and your tabs</b>: Jasika Bawa and Doug Turner of Chrome Security explore how Google Chrome now uses AI agents to autonomously identify and patch security vulnerabilities at an unprecedented scale, significantly accelerating the browser's update cadence. <a href=\"https://www.youtube.com/watch?v=pCXT8lQqg_U\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: All about Project Atlas, Wiz's AI vulnerability research</b>: Nir Orfeld, head of vulnerability research, Wiz, discusses how his team uses multi-agent AI systems for discovering high-impact zero-day vulnerabilities in cloud infrastructure. <a href=\"https://www.youtube.com/watch?v=qRJJ9ekpuVg\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: How Google eliminates classes of vulnerabilities at scale</b>: How do you build the foundations for a secure Google-scale enterprise that stays secure even if an AI is writing the code and nobody has time to review it? Christoph Kern, principal security engineer, Google, explores what secure-by-design really means in the AI era. <a href=\"https://www.youtube.com/watch?v=43imRRfgLgc\" target=\"_blank\"><b>Listen here</b></a>.</li></ul><p>To have our Cloud CISO Perspectives post delivered twice a month to your inbox, <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">sign up for our newsletter</a>. We’ll be back in a few weeks with more security-related updates from Google Cloud.</p></div>"
  "75642d79457d8ada607026d27c045ef5":
    "id": "75642d79457d8ada607026d27c045ef5"
    "title": "Spanner Omni, now GA: A distributed, multi-model database that you can deploy anywhere"
    "link": "https://cloud.google.com/blog/products/databases/spanner-omni-deploy-anywhere-version-of-spanner-is-now-ga/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 05:33:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><a href=\"https://cloud.google.com/products/spanner/omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Omni</span></a><span style=\"vertical-align: baseline;\">, the </span><span style=\"vertical-align: baseline;\">deploy-anywhere version of Spanner, is now generally available, ready to power your most demanding production workloads in your on-premises data center or on other clouds. </span></p>\n<p><span style=\"vertical-align: baseline;\">With Spanner, Google pioneered the distributed SQL market over a decade ago, combining the horizontal scalability of NoSQL with the ACID compliance and strong consistency of a traditional relational database. Since then, Spanner has evolved into an interoperable multi-model database that simplifies complex workloads and powers agentic AI, combining SQL, graph, key-value, full-text search, vector search, and analytical processing with a columnar engine, all in a single database.</span></p>\n<p><span style=\"vertical-align: baseline;\">When we debuted </span><a href=\"https://cloud.google.com/blog/products/databases/introducing-spanner-omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Omni at Google Cloud Next ’26</span></a><span style=\"vertical-align: baseline;\">, we untethered our distributed database from Google Cloud and brought it directly to your infrastructure. This generated incredible interest from both the enterprise customers and developer community.</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Spanner Omni delivers the same core capabilities as the fully managed Spanner service, with the added freedom to deploy it wherever you need it. Whether you’re running virtual machines or Kubernetes in your private data centers, running a multi-cloud deployment that spans multiple clouds, or testing locally on a laptop, Spanner Omni brings Google-grade consistency, availability, scale, and interoperable multi-model capabilities directly to your next agentic AI applications. </span></span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"11lognm3l3908\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/11lognm3l3908.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Spanner Omni provides the freedom to deploy anywhere with the same core Spanner capabilities</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Attio accelerates agentic application velocity with Spanner Omni</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Spanner Omni enables teams to build once and deploy anywhere, providing application portability across Google Cloud, on-premises and other clouds. Attio, an AI-native CRM company based in London, has built its platform on Spanner. Attio migrated its agentic application environment to a full-featured and containerized Spanner Omni + managed Spanner.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"At Attio, we are building the world's most advanced agentic application environment on Spanner to deliver on our vision for an AI-native CRM platform. Spanner Omni has been a major win for us by delivering Spanner capabilities and performance across all our environments, allowing our agents to bring complex, mission-critical workflows such as the newly announced Spanner queues, to production. With Spanner Omni, we have been able to accelerate our production velocity at a truly enhanced level of scale and confidence that was not possible earlier.\"</span><span style=\"vertical-align: baseline;\"> - Alexander Christie, Co-Founder &amp; CTO, Attio</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Built-in AI capabilities for any environment</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Spanner Omni extends Spanner's converged multi-model foundation directly to your private infrastructure and third-party clouds, providing critical capabilities for AI workloads:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Vector search and Spanner Graph</strong><span style=\"vertical-align: baseline;\">: Natively store and index vector embeddings alongside your relational tables. With support for KNN and ANN search, you can combine semantic similarity with structured SQL filters. Spanner Graph integrates property graphs directly into the engine, allowing you to trace complex entity relationships and connect graph traversals with vector search.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model Context Protocol (MCP) support</strong><span style=\"vertical-align: baseline;\">: Integrate directly with agentic systems using <a href=\"https://github.com/googleapis/mcp-toolbox\" rel=\"noopener\" target=\"_blank\">MCP Toolbox</a>. This open standard allows autonomous agents to inspect schemas, retrieve relevant context, and use Spanner Omni as an operational memory layer across multi-cloud deployments.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">What’s new with Spanner Omni</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Since the preview, we’ve been working to expand Spanner Omni’s capabilities, and refine the pricing model for production-ready deployments.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Enterprise features for production deployments</span></h4>\n<p><span style=\"vertical-align: baseline;\">The GA release unblocks the full suite of enterprise-grade capabilities required for mission-critical production workloads, including:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Robust security and governance:</strong><span style=\"vertical-align: baseline;\"> Support for advanced enterprise security, including TLS encryption, authentication and authorization, and audit logging</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data protection:</strong><span style=\"vertical-align: baseline;\"> High-performance backup and restore capabilities to safeguard your data against “fat-finger” deletion or data corruption</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/spanner-omni/manage-workers\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Worker nodes</strong></a><span style=\"vertical-align: baseline;\">: Dedicated, stateless compute nodes unique to Spanner Omni that are designed to offload background and resource-intensive operations from primary Spanner Omni servers, so they can focus on handling core database workloads</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise-grade support:</strong><span style=\"vertical-align: baseline;\"> Direct access to </span><a href=\"https://cloud.google.com/support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Customer Care</span></a><span style=\"vertical-align: baseline;\"> to keep your critical workloads running smoothly </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Flexible licensing and industry-standard pricing</span></h4>\n<p><span style=\"vertical-align: baseline;\">To support you at every stage of development, Spanner Omni offers two distinct licensing tiers designed to fit your scale and budget:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Developer Edition (free)</strong><span style=\"vertical-align: baseline;\">: Tailored for development, testing, and prototyping in non-commercial, non-production environments, it includes all core Spanner features, allowing you to build and validate your applications before scaling to production. The Developer Edition has a default license. The default license lasts for 90-days and includes all features as the commercial edition, except backup features and worker nodes. When used in a single server deployment of 4 vCPUs or less, the default license does not expire and backup-restore is also supported. In case of more than 4vCPUs the default license can be extended beyond 90 days by filling out this </span><a href=\"https://forms.gle/Ex9NcszwJFuHbtnB9\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">form</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Commercial Edition (paid)</strong><span style=\"vertical-align: baseline;\">: Designed for commercial, production workloads, this edition provides the full suite of Spanner Omni capabilities backed by enterprise support. It follows a highly industry-standard, predictable vCPU-based annual subscription model. We also offer a proof-of-concept license for pre-production evaluation at a discounted price. </span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Spanner Omni vs. fully managed Spanner on Google Cloud</span></h3>\n<p><span style=\"vertical-align: baseline;\">Our goal with Spanner Omni is to provide parity with the fully managed Spanner service on Google Cloud. However, as self-managed software, deploying and operating Spanner Omni differs from fully managed Spanner on Google Cloud in several ways: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Self-managed operations:</strong><span style=\"vertical-align: baseline;\"> You are responsible for all day-to-day operations, including routine maintenance, version upgrades, and infrastructure monitoring.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Availability and SLAs:</strong><span style=\"vertical-align: baseline;\"> Because Spanner Omni runs on customer-managed infrastructure, Google does not provide availability SLAs. However, deploying according to our recommended reference architectures will help you achieve comparable high availability.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Integration with Google Cloud:</strong><span style=\"vertical-align: baseline;\"> To ensure it can run anywhere, Spanner Omni excludes capabilities available in managed Spanner that rely on Google Cloud-specific capabilities, such as native integrations with BigQuery, Knowledge Catalog, or Gemini Enterprise and other Google Cloud services.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Feature-parity roadmap:</strong><span style=\"vertical-align: baseline;\"> While some feature gaps exist today between Spanner Omni and fully managed Spanner, we are actively developing updates to close these gaps in future releases.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you’re modernizing on-prem legacy systems or building a resilient multi-cloud architecture, Spanner Omni is ready to help you scale.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">For more information, visit the </span><a href=\"https://cloud.google.com/products/spanner/omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Omni website</span></a><span style=\"vertical-align: baseline;\"> to explore documentation and use cases. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">To use the Spanner Omni commercial edition with full features, please contact your Google Cloud account team or reach out to us at </span><a href=\"https://cloud.google.com/consulting/spanner-omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://cloud.google.com/consulting/spanner-omni</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">For developing and testing for non-commercial, non-production purposes, </span><a href=\"https://docs.cloud.google.com/spanner-omni/download\"><span style=\"text-decoration: underline; vertical-align: baseline;\">download the Spanner Omni developer edition</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
  "2addd434c02f04167fba0b9839d6debe":
    "id": "2addd434c02f04167fba0b9839d6debe"
    "title": "Empower your agents with the Google Cloud CLI remote MCP server"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-cli-remote-mcp-server-in-preview/"
    "published": "2026-10-01 01:00:00"
    "fetched": "2026-10-01 05:33:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we’re expanding our ecosystem of managed remote MCP servers by introducing the </span><a href=\"https://docs.cloud.google.com/sdk/use-gcloud-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud CLI remote MCP server</span></a><span style=\"vertical-align: baseline;\"> in preview.</span></p>\n<p><span style=\"vertical-align: baseline;\">Powered by the popular </span><a href=\"https://docs.cloud.google.com/sdk/gcloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/bq-cli-reference\"><span style=\"text-decoration: underline; vertical-align: baseline;\">bq (BigQuery)</span></a><span style=\"vertical-align: baseline;\"> command-line tools, this new server gives AI agents immediate, broad access to command-line operations for managing Google Cloud infrastructure and working with advanced BigQuery workflows securely and seamlessly. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Why CLI matters for AI agents</span></h3>\n<p><span style=\"vertical-align: baseline;\">Agents are increasingly performing complex cloud operations, but standardizing how they interact with backend systems remains a challenge. The Google Cloud CLI remote MCP server bridges this gap by packaging the versatility of hundreds of gcloud and bq commands into one single MCP server. This results in two strong benefits for the agent:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Higher-level abstractions:</strong><span style=\"vertical-align: baseline;\"> CLI commands package complex multi-step workflows, validation checks, and high-level operations into unified commands rather than requiring multi-step API orchestration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Leverages model training:</strong><span style=\"vertical-align: baseline;\"> LLMs are heavily pre-trained on public command-line documentation, syntaxes, and usage examples, making CLI invocation intuitive and highly accurate for models.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">The benefits of putting CLI behind remote MCP</span></h3>\n<p><span style=\"vertical-align: baseline;\">Managing cloud infrastructure with AI agents traditionally requires installing and maintaining Google Cloud CLI binaries inside agent execution environments. The Cloud CLI remote MCP server bridges CLI capabilities with MCP benefits by providing an isolated execution sandbox on Google Cloud infrastructure. This solves key infrastructure challenges:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simplified dependency and runtime management:</strong><span style=\"vertical-align: baseline;\"> For teams building custom agents, maintaining local CLI versions and dependencies across dev, test, and production environments creates operational overhead. Remote MCP eliminates local installations and runtime maintenance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Access for web-based agent endpoints:</strong><span style=\"vertical-align: baseline;\"> Web-hosted agent platforms and web interfaces (such as Gemini Enterprise and other hosted enterprise agent platforms) run in environments where users cannot control or install local packages. Remote MCP enables secure, managed access to Google Cloud CLI operations directly from these surfaces.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Enterprise-grade security and governance</span></h3>\n<p><span style=\"vertical-align: baseline;\">Connecting an AI agent to your infrastructure requires strict, enterprise-ready safeguards. This remote server leverages Google Cloud's standard identity and governance frameworks to keep your environments secure:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero ambient credentials:</strong><span style=\"vertical-align: baseline;\"> The server isolates execution in a network-restricted proxy boundary with no ambient credentials. Authentication and authorization are handled through </span><a href=\"https://docs.cloud.google.com/iam/docs/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Identity</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://developers.google.com/identity/protocols/oauth2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OAuth 2.0</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://docs.cloud.google.com/iam/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Identity and Access Management (IAM)</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strict policy enforcement:</strong><span style=\"vertical-align: baseline;\"> Every command executed through the remote MCP server is run with the permissions of the authenticated caller identity. Both standard IAM permissions and organization policy service constraints are strictly enforced against downstream target resources.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Advanced protection with Model Armor:</strong><span style=\"vertical-align: baseline;\"> To minimize the risks associated with AI tool calling, the Cloud CLI remote MCP server integrates with </span><a href=\"https://docs.cloud.google.com/model-armor/model-armor-mcp-google-cloud-integration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</span></a><span style=\"vertical-align: baseline;\">. You can proactively screen LLM prompts and responses to protect against risks like prompt injection and malicious inputs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud audit logging:</strong><span style=\"vertical-align: baseline;\"> The Cloud CLI remote MCP server can be configured to log every tool invocation to Audit Logs (Data Access logs under cloudcli.googleapis.com/mcp). Security teams can gain full visibility into caller identities, OAuth clients, and IAM authorization decisions (mcp.googleapis.com/tools.call) without exposing sensitive command payloads or personally identifiable information (PII).</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Connecting to the Google Cloud CLI Remote MCP Server</span></h3>\n<p><span style=\"vertical-align: baseline;\">Integrating cloud management into your agents no longer requires packaging Google Cloud CLI binaries, managing local execution runtimes, or maintaining dependencies inside agent container images. Because the Google Cloud CLI remote MCP server implements the standard Model Context Protocol, any MCP-compatible agent platform or orchestration runtime can connect immediately via standard configuration:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;mcpServers&quot;: {\\r\\n    &quot;google-cloud-cli&quot;: {\\r\\n      &quot;uri&quot;: &quot;https://cloudcli.googleapis.com/mcp&quot;,\\r\\n      ...\\r\\n    }\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fb78fd934d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Your agent immediately gains access to execute gcloud and bq commands in a secure, network-isolated cloud sandbox.</span></p>\n<p><span style=\"vertical-align: baseline;\">Authentication is handled via keyless Agent Identity for hosted Google Cloud platforms, or standard OAuth 2.0 for external runtimes. For authentication options, see the </span><a href=\"https://docs.cloud.google.com/mcp/set-up-authentication-mcp-servers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Authentication Guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Bringing infrastructure management to agents</span></h3>\n<p><a href=\"https://docs.cloud.google.com/sdk/use-gcloud-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">The Cloud CLI remote MCP server</span></a><span style=\"vertical-align: baseline;\"> exposes two powerful tools, </span><code style=\"vertical-align: baseline;\">run_gcloud_command</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">run_bq_command</code><span style=\"vertical-align: baseline;\">, giving your AI agents broad, immediate access to Google Cloud operations through natural language.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Managing cloud infrastructure with </strong><code><strong style=\"vertical-align: baseline;\">run_gcloud_command</strong></code></p>\n<p><span style=\"vertical-align: baseline;\">With </span><code style=\"vertical-align: baseline;\">run_gcloud_command</code><span style=\"vertical-align: baseline;\">, agents can execute the full breadth of gcloud operations to manage, diagnose, and secure your Google Cloud environment. An example follows:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Observability and incident diagnostics</strong><span style=\"vertical-align: baseline;\">: An agent streamlines incident diagnostics by automating command execution and reducing context-switching across tools.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_IPA9ALa.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Extending BigQuery operations with the run_bq_command tool</span></h3>\n<p><span style=\"vertical-align: baseline;\">While the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/use-bigquery-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery MCP server</span></a><span style=\"vertical-align: baseline;\"> already helps organizations analyze and explore data using AI agents, with the introduction of </span><code style=\"vertical-align: baseline;\">run_bq_command</code><span style=\"vertical-align: baseline;\">, agents can now tackle advanced BigQuery tasks such as resource allocation, job monitoring, and task scheduling by unlocking the full scope of </span><a href=\"https://docs.cloud.google.com/sdk/reference/mcp#mcp-tools\"><span style=\"text-decoration: underline; vertical-align: baseline;\">bq CLI</span></a><span style=\"vertical-align: baseline;\"> functionality. Key capabilities include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automating scheduled queries</strong><span style=\"vertical-align: baseline;\">: An agent utilizes BigQuery Data Transfer Service configurations to schedule queries automatically. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Job and resource management</strong><span style=\"vertical-align: baseline;\">: Gain deep insight into query execution details, including processed data volume, slot usage, and execution plans, as well as managing reservations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Access and permissions control:</strong><span style=\"vertical-align: baseline;\"> Data administrators and owners can inspect and update table permissions directly through the agent.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_JA5HWbH.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Pricing and availability</span></h3>\n<p><span style=\"vertical-align: baseline;\">The Google Cloud CLI MCP server is available today in public preview. There is no additional charge to use the MCP server itself. You pay only for the GCP resources you create and any applicable data transfer costs.</span></p>\n<p><a href=\"https://docs.cloud.google.com/sdk/use-gcloud-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">To get started</span></a><span style=\"vertical-align: baseline;\">, enable the Cloud CLI Execution API (`</span><span style=\"font-style: italic; vertical-align: baseline;\">cloudcli.googleapis.com</span><span style=\"vertical-align: baseline;\">`) in your Google Cloud project, grant the required </span><strong style=\"vertical-align: baseline;\">MCP Tool User</strong><span style=\"vertical-align: baseline;\"> (`</span><span style=\"font-style: italic; vertical-align: baseline;\">roles/mcp.toolUser</span><span style=\"vertical-align: baseline;\">`) IAM role to your agent or user identity, and configure your MCP client to connect to `cloudcli.googleapis.com/mcp`.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/sdk/use-gcloud-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Use the Google Cloud CLI Remote MCP Server Guide</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/sdk/reference/mcp#mcp-tools\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud CLI MCP Reference</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mcp/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Remote MCP Servers Overview</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mcp/supported-products\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Full List of Google OneMCP Servers</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mcp/set-up-authentication-mcp-servers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Set up authentication to Google and Google Cloud MCP servers</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform &amp; Agent Identity Overview</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.youtube.com/watch?v=-fb0ycu4kiU\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Automate Google Cloud with Cloud CLI Remote MCP Server</span></a></p>\n</li>\n</ul></div>"
