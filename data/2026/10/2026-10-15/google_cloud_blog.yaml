n style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">Local\\963d3c60-d406-4ad6-aa1e-dc8e45061ccf</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scheduled Task:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">\\RadminComponentRuntime</code></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Google Security Operations (SecOps)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google Security Operations customers have access to these broad category rules and more under the \"Mandiant Frontline Threats\", “Mandiant Hunting Rules”, and \"Applied Threat Intelligence - Curated Prioritization\" rule packs. The activity discussed in the blog post is detected in Google Security Operations under the rule names:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explorer Launching Cmd With Powershell Start Process Command</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Process Invoking Dllhost Clsid Invocation</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ATI Active Breach Rule Match for File IoCs</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ATI High Priority Rule Match for Ip Address IoCs</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ATI Medium Priority Rule Match for Ip Address IoCs</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Copy System Binary</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">System32 Binary Copied to Non-Standard Directory</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Detections</span></h3>\n<h4><span style=\"vertical-align: baseline;\">YARA Rules</span></h4>\n<pre class=\"language-plain\"><code>rule G_APT_Downloader_CROSSROAD_1\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects obfuscated and masquerading UNC7017 CROSSROAD downloaders targeting AOMEI software update mechanisms\"\n\t\t\n\tstrings:\n\t\t// Masquerading &amp; Metadata\n\t\t$meta_typo = \"AOMEI Update Compent\" wide\n\t\t$meta_co = \"AOMEI International Network Limited\" wide\n\t\t$meta_ver = \"8.2.5.0\" wide\n\t\t$meta_orig = \"upgrade-now.exe\" wide\n\t\t$meta_name = \"upgrade-now\" wide\n\t\t// Embedded Decompression &amp; Downloader Artifacts\n\t\t$miniz1 = \"archive is too large\" ascii\n\t\t$miniz2 = \"failed finding central directory\" ascii\n\t\t$miniz3 = \"unexpected decompressed size\" ascii\n\t\t$whttp1 = \"WinHttpCrackUrl\" ascii\n\t\t$whttp2 = \"WinHttpSendRequest\" ascii\n\t\t// Obfuscation &amp; Scheduled Task Artifacts\n\t\t$task1 = \"RadminComponentRuntime\" wide\n\t\t$task2 = \"Radmin Component runtime checkable.\" wide\n\t\t$flag = \"--runtimechk\" wide\n\t\t$sob1 = \"IsCurrentIpWhitelisted._sob_enc\" ascii\n\t\t$sob2 = \"DownloadFileFromUrlA._sob_enc\" ascii\n\t\t$sob3 = \"WinMain._sob_enc.\" ascii\n\t\t$obf_key = \"_sob_key\" ascii\n\tcondition:\n\t\tuint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and filesize &lt; 5MB and (\n\t\t\t(($meta_typo or ($meta_co and ($meta_orig or $meta_name or $meta_ver))) and\n\t\t\t any of ($miniz*) and\n\t\t\t any of ($whttp*)) or\n\t\t\t(2 of ($sob*) and ($task1 or $flag)) or\n\t\t\t($obf_key and $task1 and $task2 and any of ($sob*))\n\t\t)\n}\n</code></pre>\n<pre class=\"language-plain\"><code>rule G_APT_Backdoor_SHINYROAD_1\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects the SHINYROAD BlkScrDl.dll COM-staging loader and RuntimeComponent.dll PocketPy engine\"\n\t\t\n\tstrings:\n\t\t// Shared SHINYROAD artifacts (shared memory section and mutex)\n\t\t$shm = \"Local\\\\963d3c60-d406-4ad6-aa1e-dc8e45061ccf\" ascii wide\n\t\t$mtx = \"Global\\\\{F9E6E3C0-E11A-4F85-9944-AF4AD6E05883}\" ascii wide\n\t\t// BlkScrDl.dll loader: config.zip staging and COM server registration\n\t\t$ld1 = \"%sconfig.zip\" ascii\n\t\t$ld2 = \"%scsvc\\\\RuntimeComponent.dll\" ascii\n\t\t$ld3 = \"libBlkScrDl.dll\" ascii\n\t\t$com1 = \"Software\\\\Classes\\\\CLSID\\\\%s\" ascii\n\t\t$com2 = \"Software\\\\Classes\\\\AppID\\\\%s\" ascii\n\t\t$com3 = \"%s\\\\InprocServer32\" ascii\n\t\t// RuntimeComponent.dll embedded PocketPy engine\n\t\t$rc1 = \"libRuntimeComponent.dll\" ascii\n\t\t$rc2 = \"metadata.dat\" ascii\n\t\t$rc3 = \"_pyio_compat\" ascii\n\t\t$rc4 = \"_pyio_struct\" ascii\n\t\t$rc5 = \"%sdemo_srv.log\" ascii\n\tcondition:\n\t\tuint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and filesize &lt; 5MB and (\n\t\t\t($shm and $mtx) or\n\t\t\t(($shm or $mtx) and (2 of ($ld*) or 2 of ($rc*))) or\n\t\t\t(2 of ($ld*) and 2 of ($com*)) or\n\t\t\t($rc1 and $rc2 and any of ($rc3, $rc4, $rc5))\n\t\t)\n}\n</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-plain\"><code>rule G_APT_Backdoor_SHINYROAD_2\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects compiled PocketPy bytecode payloads associated with SHINYROAD backdoors\"\n\n\tstrings:\n\t\t$pkpy_magic = { 4F 43 01 00 }\n\t\t$proto1 = \"mct3-handshake-v1\" ascii\n\t\t$script = \"bootstrap_tcp_slim_v2_call_min.py\" ascii\n\t\t$jam1 = \"JAM_BURST_PACKETS_MIN\" ascii\n\t\t$jam2 = \"JAM_MIN_MS\" ascii\n\t\t$jam3 = \"JAM_MAX_BYTES\" ascii\n\t\t$mod1 = \"_pyio_struct\" ascii\n\t\t$mod2 = \"_pyio_compat\" ascii\n\t\t$enc1 = \"nh_enc\" ascii\n\t\t$enc2 = \"encbody\" ascii\n\n\tcondition:\n\t\t$pkpy_magic at 0 and filesize &lt; 500KB and (\n\t\t\t$proto1 or\n\t\t\t$script or\n\t\t\tall of ($jam*) or\n\t\t\t(all of ($mod*) and any of ($enc*))\n\t\t)\n}</code></pre>\n<pre class=\"language-markup\"><code>rule G_APT_Launcher_ADAPTAGENT_1\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects UNC7017 ADAPTAGENT post-exploitation loader and sideloaded Adaptix payload (Nitro camouflage)\"\n\t\tref = \"https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering\"\n\t\tplatforms = \"Win\"\n\t\trs1 = \"14b31918075e6130b9123158743db0a81e2d7bfcf6d39731ee7d9200a98cd591\"\n\n\tstrings:\n\t\t// Sideloaded Masquerading &amp; Camouflage\n\t\t$camo_exe1 = \"NitroPromotion.exe\" ascii wide nocase\n\t\t$camo_exe2 = \"Nitro_Scan2PDFApp.exe\" ascii wide nocase\n\t\t$camo_dll1 = \"Eztwain4.dll\" ascii wide nocase\n\t\t$camo_dll2 = \"Nitro PDF Eztwain4\" ascii wide nocase\n\t\t$camo_ver = \"14.10.1.0\" ascii wide\n\t\t$camo_copy = \"Nitro Software, Inc.\" ascii wide\n\n\t\t// NitroPromotion Loader &amp; Staging Functionality\n\t\t$load1 = \"DownloadToLocalAppData\" ascii\n\t\t$load2 = \"ExtractZipToDirectoryA\" ascii\n\t\t$load3 = \"GetTempZipFileNameA\" ascii\n\t\t$load4 = \"CreateScheduledTask\" ascii\n\n\t\t// Adaptix C2 &amp; ADAPTAGENT Core Artifacts\n\t\t$adapt1 = \"Adaptix Crash Analyzer v1.0\" ascii\n\t\t$adapt2 = \"Global\\\\{8d00c640-48d8-4440-a8e1-660fd37f572a}\" ascii wide\n\t\t$adapt3 = \"\\\\\\\\.\\\\pipe\\\\%08lx\" ascii\n\t\t$adapt4 = \"13ConnectorHTTP\" ascii\n\t\t$adapt5 = \"9Connector\" ascii\n\n\tcondition:\n\t\tuint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and filesize &lt; 10MB and (\n\t\t\t// Branch 1: ADAPTAGENT Sideloaded Payload (Eztwain4.dll)\n\t\t\t(any of ($camo_dll*, $adapt1, $adapt2) and 2 of ($adapt*)) or\n\n\t\t\t// Branch 2: NitroPromotion Masquerading Loader (NitroPromotion.exe)\n\t\t\t(any of ($camo_exe*) and (2 of ($load*) or any of ($adapt1, $adapt2))) or\n\t\t\t(all of ($camo_ver, $camo_copy) and any of ($camo_exe*) and any of ($load*))\n\t\t)\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">MITRE ATT&amp;CK Techniques</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Tactic</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Technique ID</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Technique Name</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Observed Context</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Resource Development</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1583/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1583.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Acquire Infrastructure: Domains</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Registration of </span><code style=\"vertical-align: baseline;\">storage-data.com</code><span style=\"vertical-align: baseline;\"> and the </span><code style=\"vertical-align: baseline;\">promotion.</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">aomei.</code><span style=\"vertical-align: baseline;\"> subdomains used for payload staging and callbacks.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Resource Development</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1583/006/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1583.006</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Acquire Infrastructure: Web Services</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Abuse of Alibaba Cloud OSS (</span><code style=\"vertical-align: baseline;\">serv.oss-cn-hongkong.aliyuncs.com</code><span style=\"vertical-align: baseline;\">) and a public Cloud Storage bucket (</span><code style=\"vertical-align: baseline;\">aomeiupdate</code><span style=\"vertical-align: baseline;\">) as high-reputation staging infrastructure.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Resource Development</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1608/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1608.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Stage Capabilities: Upload Malware</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Staging of </span><code style=\"vertical-align: baseline;\">upgrade-now.zip</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">component.zip</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">en.zip</code><span style=\"vertical-align: baseline;\"> on actor-controlled domains and cloud storage prior to each tampering window.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Initial Access</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1195/002/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1195.002</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Supply Chain Compromise: Compromise Software Supply Chain</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Ephemeral modification of remote AOMEI </span><code style=\"vertical-align: baseline;\">.ini</code><span style=\"vertical-align: baseline;\"> update configuration files.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Execution</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1059/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1059.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Scripting Interpreter: PowerShell</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Hidden PowerShell execution (</span><code style=\"vertical-align: baseline;\">-WindowStyle Hidden</code><span style=\"vertical-align: baseline;\">) executing the Nitro PDF / Adaptix C2 payload.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Execution</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1059/006/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1059.006</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Scripting Interpreter: Python</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">In-memory execution of compiled bytecode via an embedded PocketPy interpreter (</span><code style=\"vertical-align: baseline;\">RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">WNTestDll.dll</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Execution</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1559/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1559.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Inter-Process Communication: Component Object Model</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> registers CLSID </span><code style=\"vertical-align: baseline;\">{21191641-0D7F-4CD9-9572-01AAE6E7851B}</code><span style=\"vertical-align: baseline;\"> as an in-process COM server, causing the Radmin process to load </span><code style=\"vertical-align: baseline;\">csvc\\RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Persistence</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1053/005/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1053.005</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Scheduled Task/Job: Scheduled Task</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Scheduled tasks </span><code style=\"vertical-align: baseline;\">\\RadminComponentRuntime</code><span style=\"vertical-align: baseline;\"> (running </span><code style=\"vertical-align: baseline;\">FamItrfc.exe --runtimechk</code><span style=\"vertical-align: baseline;\">) and </span><code style=\"vertical-align: baseline;\">\\NitroRuntime</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1574/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1574.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Hijack Execution Flow: DLL</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Search-order hijacking of </span><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> by the signed </span><code style=\"vertical-align: baseline;\">FamItrfc.exe</code><span style=\"vertical-align: baseline;\">, and side-loading of </span><code style=\"vertical-align: baseline;\">Eztwain4.dll</code><span style=\"vertical-align: baseline;\"> by the Nitro PDF masquerading loaders.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1480/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1480</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Execution Guardrails</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Validation of the </span><code style=\"vertical-align: baseline;\">AOMEI</code><span style=\"vertical-align: baseline;\"> directory substring and external IP reflection filtering before secondary payload retrieval.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1036/005/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1036.005</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Masquerading: Match Legitimate Resource Name or Location</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> masquerades as Radmin's legitimate \"blank screen\" driver library; ADAPTAGENT loaders masquerade as Nitro PDF tools (</span><code style=\"vertical-align: baseline;\">NitroPromotion.exe</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">Eztwain4.dll</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1027/013/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1027.013</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Obfuscated Files or Information: Encrypted/Encoded File</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD stage-2 Python bytecode stored as ChaCha20-encrypted </span><code style=\"vertical-align: baseline;\">metadata.dat</code><span style=\"vertical-align: baseline;\"> inside </span><code style=\"vertical-align: baseline;\">config.zip</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1140/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1140</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Deobfuscate/Decode Files or Information</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> decrypts </span><code style=\"vertical-align: baseline;\">metadata.dat</code><span style=\"vertical-align: baseline;\"> in memory using ChaCha20 with an HMAC-SHA256 derived key and IV.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1070/004/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1070.004</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Indicator Removal: File Deletion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Self-deletion of CROSSROAD (</span><code style=\"vertical-align: baseline;\">upgrade-now.exe</code><span style=\"vertical-align: baseline;\">) via a child process spawned with </span><code style=\"vertical-align: baseline;\">--nitrod</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Defense Evasion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1564/004/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1564.004</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Hide Artifacts: NTFS File Attributes</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD renames its primary </span><code style=\"vertical-align: baseline;\">:$DATA</code><span style=\"vertical-align: baseline;\"> stream to an alternate data stream named </span><code style=\"vertical-align: baseline;\">:wtfbbq</code><span style=\"vertical-align: baseline;\"> before flagging the file for deletion on handle close.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Credential Access</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1187/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1187</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Forced Authentication</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">WebDAV NTLM coercion via an invisible 1x1 popup rendering a UNC resource, configured inside </span><code style=\"vertical-align: baseline;\">Notifycfg.ini</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1016/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1016</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">System Network Configuration Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD resolves the host's external IP via </span><code style=\"vertical-align: baseline;\">myip.opendns.com</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">o-o.myaddr.l.google.com</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">checkip.amazonaws.com</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">api.ipify.org</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">ifconfig.me/ip</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">icanhazip.com</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1614/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1614</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">System Location Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD aborts its primary payload execution path when the IP-derived country code is </span><code style=\"vertical-align: baseline;\">\"CN\"</code><span style=\"vertical-align: baseline;\"> (China).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1082/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1082</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">System Information Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD fingerprints the victim hostname to derive a unique agent identifier.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1033/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1033</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">System Owner/User Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD incorporates the logged-on username into its unique agent identifier and C2 key derivation.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Control</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1105/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1105</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Ingress Tool Transfer</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD downloads </span><code style=\"vertical-align: baseline;\">component.zip</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">en.zip</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">%TEMP%\\svc&lt;random_hex&gt;.tmp</code><span style=\"vertical-align: baseline;\"> and unpacks it to </span><code style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Radmin\\</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Control</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1571/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1571</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Non-Standard Port</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD custom binary C2 over TCP </span><code style=\"vertical-align: baseline;\">41397</code><span style=\"vertical-align: baseline;\">; ADAPTAGENT beacons over TCP </span><code style=\"vertical-align: baseline;\">6800</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Control</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1573/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1573.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Encrypted Channel: Symmetric Cryptography</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Custom binary C2 stream encrypted with a hardcoded handshake key, rotating to a host-specific key derived from the agent ID.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Control</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1001/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1001.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Data Obfuscation: Junk Data</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD generates randomized junk packets (traffic chaffing) to disrupt network signature matching.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Command and Control</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1219/002/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1219.002</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Remote Access Tools: Remote Desktop Software</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Deployment of legitimate Famatech Radmin 3.x server components to victim hosts alongside the SHINYROAD backdoor.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Table 6: MITRE ATT&amp;CK techniques</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Acknowledgements</span></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG and Mandiant would like to thank the ManageEngine Threat Analysis Lab (</span><a href=\"https://www.manageengine.com/threat-analysis-lab\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">METAL</span></a><span style=\"vertical-align: baseline;\">) research team for their initial discovery of this activity, proactive telemetry sharing, and ongoing collaboration to help secure our mutual customer bases and the broader software ecosystem.</span></p></div>"
