  "288f901b1992f80cdfa6c486ac9a099c":
    "id": "288f901b1992f80cdfa6c486ac9a099c"
    "title": "Predictable AI spend in BigQuery: Introducing cost management for generative AI functions"
    "link": "https://cloud.google.com/blog/products/data-analytics/using-bigquerys-generative-ai-cost-management-features/"
    "published": "2026-10-15 01:00:00"
    "fetched": "2026-10-15 01:34:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://docs.cloud.google.com/bigquery/docs/generative-ai-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">generative AI functions in BigQuery</span></a><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">AI.GENERATE</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AI.IF</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AI.CLASSIFY</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AI.SCORE</code><span style=\"vertical-align: baseline;\">, and more) bring large language models (LLMs) directly into your SQL, so a single query can classify millions of support tickets or score each product review for sentiment. However, because these functions are billed by the token, scaling them across massive datasets highlights the importance of managing your budget proactively. </span></p>\n<p><span style=\"vertical-align: baseline;\">We recently announced the general availability (GA) of </span><strong style=\"vertical-align: baseline;\">token-based </strong><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">cost management</strong></a><strong style=\"vertical-align: baseline;\"> for BigQuery generative AI functions</strong><span style=\"vertical-align: baseline;\">: daily quotas that let administrators set self-serve guardrails on AI token consumption, so teams can innovate while staying within your budget. In this blog, we provide an overview of cost management for BigQuery generative AI functions, walk through a few practical examples, and share resources to help you get started. Let’s jump in.  </span></p>\n<h3><span style=\"vertical-align: baseline;\">Quotas for managing costs</span></h3>\n<p><span style=\"vertical-align: baseline;\">Four daily quotas, managed through the Google Cloud Identity and Access Management (IAM) quota system, provide controls at the </span><strong style=\"vertical-align: baseline;\">project</strong><span style=\"vertical-align: baseline;\"> level and the </span><strong style=\"vertical-align: baseline;\">per-user</strong><span style=\"vertical-align: baseline;\"> level. Per-user limits apply to each user within a project, not across your organization.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Quota name</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Metric</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Scope</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Default value</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI input tokens per day</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Input tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">200 billion</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI input tokens per day per user</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Input tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project, per user</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">150 billion</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI output tokens per day</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Output and thinking tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project, per project</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">20 billion</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI output tokens per day per user</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Output and thinking tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project, per user</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">15 billion</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Key details:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The quotas are global.</strong><span style=\"vertical-align: baseline;\"> Usage is summed across all regions, so costs can't pile up unnoticed in a region you weren't watching.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Output quotas include \"thinking\" tokens.</strong><span style=\"vertical-align: baseline;\"> Reasoning tokens count toward your output quota, just as they count toward your Gemini platform bill.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Which functions are covered?</span></h3>\n<p><span style=\"vertical-align: baseline;\">The quotas apply to these BigQuery functions that perform LLM-backed generation:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-generate\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-table\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE_TABLE</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-generate-text\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE_TEXT</code></a><span style=\"vertical-align: baseline;\"> (and its alias </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-text\"><code style=\"text-decoration: underline; vertical-align: baseline;\">ML.GENERATE_TEXT</code></a><span style=\"vertical-align: baseline;\">)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-classify\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.CLASSIFY</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-if\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.IF</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-score\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.SCORE</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-agg\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.AGG</code></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">What's not covered:</strong><span style=\"vertical-align: baseline;\"> Embedding functions such as </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-text\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE_EMBEDDING</code></a><span style=\"vertical-align: baseline;\"> (also available as </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-embedding\"><code style=\"text-decoration: underline; vertical-align: baseline;\">ML.GENERATE_EMBEDDING</code></a><span style=\"vertical-align: baseline;\">) and </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-embed\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.EMBED</code></a><span style=\"vertical-align: baseline;\"> are </span><span style=\"font-style: italic; vertical-align: baseline;\">not</span><span style=\"vertical-align: baseline;\"> subject to these quotas, because they run on different, substantially cheaper models.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Managing your quotas</span></h3>\n<p><span style=\"vertical-align: baseline;\">Administrators can view and adjust the quotas directly in the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a><span style=\"vertical-align: baseline;\"> as workloads change, with no support case required.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Navigate to </span><strong style=\"vertical-align: baseline;\">IAM &amp; Admin → </strong><a href=\"https://console.cloud.google.com/iam-admin/quotas/list\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quotas &amp; System Limits</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Filter by service and select </span><strong style=\"vertical-align: baseline;\">BigQuery API</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sort by the </span><strong style=\"vertical-align: baseline;\">Name</strong><span style=\"vertical-align: baseline;\"> column to bring the four AI quotas to the top.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_dxxy8WS.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Locating the gen AI token quotas in IAM &amp; Admin → Quotas &amp; System Limits.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">4. Find the quota, for example </span><strong style=\"vertical-align: baseline;\">AI input tokens per day</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">5. Open the three-dot menu and choose </span><strong style=\"vertical-align: baseline;\">Edit quota</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">From there:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">To tighten cost control,</strong><span style=\"vertical-align: baseline;\"> lower a quota. This takes effect immediately with no approval needed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">To support higher usage,</strong><span style=\"vertical-align: baseline;\"> request an increase from the same page. Many requests are auto-approved; larger increases may go through a quick review.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_7NmvWbT.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Editing a gen AI token quota in IAM &amp; Admin → Quotas &amp; System Limits.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">You'll need the right permissions.</strong><span style=\"vertical-align: baseline;\"> You need one of: </span><strong style=\"vertical-align: baseline;\">Owner</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Editor, </strong><a href=\"https://docs.cloud.google.com/iam/docs/roles-permissions/servicemanagement#servicemanagement.quotaAdmin\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quota Administrator</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">(</span><code style=\"vertical-align: baseline;\">roles/servicemanagement.quotaAdmin</code><span style=\"vertical-align: baseline;\">), or </span><a href=\"https://docs.cloud.google.com/iam/docs/roles-permissions/serviceusage#serviceusage.serviceUsageAdmin\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Service Usage Admin</strong></a><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">roles/serviceusage.serviceUsageAdmin</code><span style=\"vertical-align: baseline;\">).</span></p>\n<p><strong style=\"vertical-align: baseline;\">Prefer automation?</strong><span style=\"vertical-align: baseline;\"> You can also </span><a href=\"https://medium.com/google-cloud/bigquery-ai-cost-guardrails-how-to-set-daily-token-limits-programmatically-02d7a35f843a\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">manage these quotas programmatically</span></a><span style=\"vertical-align: baseline;\"> through the </span><a href=\"https://docs.cloud.google.com/docs/quotas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Quotas API</span></a><span style=\"vertical-align: baseline;\">, the </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> CLI, and Terraform to apply consistent guardrails across projects.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Monitoring usage</span></h3>\n<p><span style=\"vertical-align: baseline;\">Beyond setting limits, the </span><a href=\"https://console.cloud.google.com/iam-admin/quotas/list\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quotas &amp; System Limits</strong></a><span style=\"vertical-align: baseline;\"> page displays your historical token consumption so you can quickly detect spikes and right-size your budgets. Use these trends to see how new generative AI workloads and data pipelines affect your overall token usage.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_sSNHw57.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Daily project-level token usage for a gen AI token quota in IAM &amp; Admin → Quotas &amp; System Limits.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_iYgfR4l.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Longer-term usage graph with selectable 7-day, 14-day, 30-day, and custom ranges.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For a step-by-step walkthrough, see the BigQuery documentation on </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">controlling costs with token quotas</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Token quotas vs. billing spend caps</span></h3>\n<p><span style=\"vertical-align: baseline;\">Token quotas aren't the only cost guardrail in Google Cloud.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Token quotas (this feature)</strong></a><span style=\"vertical-align: baseline;\"> are </span><span style=\"font-style: italic; vertical-align: baseline;\">preventive</span><span style=\"vertical-align: baseline;\"> and </span><span style=\"font-style: italic; vertical-align: baseline;\">AI-specific</span><span style=\"vertical-align: baseline;\">. BigQuery tracks token usage during query execution and stops work close to the limit, with separate limits per project and per user.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Billing </strong><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#eligible-services\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">spend caps</strong></a><span style=\"vertical-align: baseline;\"> operate on </span><span style=\"font-style: italic; vertical-align: baseline;\">dollars</span><span style=\"vertical-align: baseline;\"> at the project and service level and can automatically block usage when a threshold is reached. They're a broad, financial backstop rather than a precise usage control, and because enforcement is not instant, some overages are incurred.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Use token quotas as your first line of defense for AI spend, and a spend cap as a project-wide safety net.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How enforcement works</span></h3>\n<p><span style=\"vertical-align: baseline;\">Quotas are enforced by stopping work rather than letting a query run past your limit. A query is rejected up front with a </span><code style=\"vertical-align: baseline;\">QuotaExceeded</code><span style=\"vertical-align: baseline;\"> error only if a quota it needs is already exhausted. Otherwise, it starts, and if a quota runs out mid-query, BigQuery stops sending new LLM calls:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Functions that support </strong><code><strong style=\"vertical-align: baseline;\">max_error_ratio</strong></code><span style=\"vertical-align: baseline;\"> (such as </span><code style=\"vertical-align: baseline;\">AI.IF</code><span style=\"vertical-align: baseline;\">) return partial results if unprocessed rows stay within the ratio, and otherwise fail.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">General-purpose functions</strong><span style=\"vertical-align: baseline;\"> (such as </span><code style=\"vertical-align: baseline;\">AI.GENERATE</code><span style=\"vertical-align: baseline;\">) still succeed. Skipped rows have no generated value, and their </span><code style=\"vertical-align: baseline;\">status</code><span style=\"vertical-align: baseline;\"> field contains the quota-exceeded error.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For details, see </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs#quota_enforcement_behavior\"><span style=\"text-decoration: underline; vertical-align: baseline;\">quota enforcement behavior</span></a><span style=\"vertical-align: baseline;\"> in the documentation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Sizing your input data: </span><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code></h3>\n<p><span style=\"vertical-align: baseline;\">To choose quota values, it helps to know how much text your workloads send to a model. The </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-count-tokens\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.COUNT_TOKENS</code></a><span style=\"vertical-align: baseline;\"> function helps with this.</span></p>\n<p><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code><span style=\"vertical-align: baseline;\"> returns the number of tokens a model's tokenizer produces for a text string, without making a billable generation call. Run it over a column to measure your input data:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Count the input text tokens for each product review\\r\\nSELECT\\r\\n  SUM(\\r\\n    AI.COUNT_TOKENS(\\r\\n      CONCAT(&#x27;Classify the sentiment of this review as positive, negative, or neutral: &#x27;, review_text),\\r\\n\\r\\n      endpoint =&gt; &#x27;gemini-3.1-flash-lite&#x27;).result) AS total_input_tokens\\r\\nFROM\\r\\n  `my_project.my_dataset.product_reviews`;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5eb4e965d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The count is a lower bound on input tokens. It doesn't include output or thinking tokens, the instructions each AI function adds around your input, or non-text inputs such as images. Use it to:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gauge the input side of a workload</strong><span style=\"vertical-align: baseline;\"> before you launch it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Right-size your quotas</strong><span style=\"vertical-align: baseline;\"> together with a small sample run that measures actual input and output usage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Translate tokens into dollars</strong><span style=\"vertical-align: baseline;\"> using the published </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini platform pricing</span></a><span style=\"vertical-align: baseline;\"> for your model.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">From tokens to budget: a worked example</span></h3>\n<p><span style=\"vertical-align: baseline;\">Suppose you want to keep a project's daily AI spend around </span><strong style=\"vertical-align: baseline;\">$100</strong><span style=\"vertical-align: baseline;\"> with the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-1-flash-lite\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.1 Flash-Lite</span></a><span style=\"vertical-align: baseline;\"> model. As of today's published pricing (BigQuery processes in batch which provides a 50% discount):</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Input tokens:</strong><span style=\"vertical-align: baseline;\"> $0.125 per 1 million tokens</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Output tokens (response + reasoning):</strong><span style=\"vertical-align: baseline;\"> $0.75 per 1 million tokens</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If a small sample run shows an average </span><strong style=\"vertical-align: baseline;\">100:1 input-to-output token ratio</strong><span style=\"vertical-align: baseline;\">, you can solve for a daily budget:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Cost:   0.125 × I + 0.75 × O = 100     (I, O in millions of tokens)\\r\\nRatio:  I = 100 × O&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5eb4ce8c10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Solving gives about </span><strong style=\"vertical-align: baseline;\">754 million input tokens</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">7.54 million output tokens</strong><span style=\"vertical-align: baseline;\"> per day. Set </span><strong style=\"vertical-align: baseline;\">AI input tokens per day</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">AI output tokens per day</strong><span style=\"vertical-align: baseline;\"> to these values to hold the project near $100/day. If a project uses models with different prices, budget per model or blend the rates.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Best practices for managing AI cost</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start with per-user quotas.</strong><span style=\"vertical-align: baseline;\"> They stop one user or runaway experiment from draining the project's budget.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Measure before you scale.</strong><span style=\"vertical-align: baseline;\"> Use </span><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code><span style=\"vertical-align: baseline;\"> to size your input, then check a small sample run in the usage chart before setting limits.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mind the output side.</strong><span style=\"vertical-align: baseline;\"> Output tokens cost more. Where a function accepts </span><code style=\"vertical-align: baseline;\">max_output_tokens</code><span style=\"vertical-align: baseline;\">, set it to bound generation length.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor and iterate.</strong><span style=\"vertical-align: baseline;\"> Adjust limits as real usage and budgets change.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Token-based cost management is available now. To begin:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Open </span><strong style=\"vertical-align: baseline;\">IAM &amp; Admin → </strong><a href=\"https://console.cloud.google.com/iam-admin/quotas/list\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quotas &amp; System Limits</strong></a><span style=\"vertical-align: baseline;\"> in the Google Cloud Console and filter by </span><strong style=\"vertical-align: baseline;\">BigQuery API</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the four </span><strong style=\"vertical-align: baseline;\">AI-related</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">token quotas</strong><span style=\"vertical-align: baseline;\"> and set limits that match your budget.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Use </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-count-tokens\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.COUNT_TOKENS</code></a><span style=\"vertical-align: baseline;\"> to size your input data.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">For the full details, see the documentation on </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">controlling generative AI costs</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">With token-based guardrails in place, your teams can use generative AI in BigQuery with the cost predictability your organization needs.</span></p></div>"
  "8f771a595952a82e5a807a742df1a95d":
    "id": "8f771a595952a82e5a807a742df1a95d"
    "title": "Cloud CISO Perspectives: New Gemini Notebook can help CISOs and policymakers prepare for PQC"
    "link": "https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-new-gemini-notebook-can-help-cisos-policymakers-prepare-for-pqc/"
    "published": "2026-10-15 01:00:00"
    "fetched": "2026-10-15 01:34:54"
    "summary": "<div class=\"block-paragraph\"><p>Welcome to the first Cloud CISO Perspectives for October 2026. Today, Stephanie Kiel explains the latest on our approach to post-quantum cryptography, and shares a new tool to help CISOs and executives prepare their organizations for PQC.</p><p>As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the <a href=\"https://cloud.google.com/blog/products/identity-security/\">Google Cloud blog</a>. If you’re reading this on the website and you’d like to receive the email version, you can <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">subscribe here</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5eb506bad0&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>New Gemini Notebook can help CISOs and policymakers prepare for PQC</b></h3><p><i>By Stephanie Kiel, Head of Cloud Security Policy, Government Affairs and Public Policy, Google Cloud</i></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Stephanie Kiel crop\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Stephanie_Kiel_crop.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Stephanie Kiel, Head of Cloud Security Policy, Government Affairs and Public Policy, Google Cloud</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Post-quantum cryptography (PQC) is one of the most urgent security shifts of the decade — and one of the easiest to tune out. For security leaders and policymakers, the research is dense, scattered across papers and engineering blogs, and can be challenging to turn into action.</p><p>To help, we're launching <a href=\"https://notebook.google.com/notebook/68849586-67c5-4165-8f72-64a61991f1dd\">Prepare for Post-Quantum Cryptography</a>, a public Gemini Notebook that brings Google's PQC research, engineering blogs, and migration guidance together in one place. Ask it questions, listen to an audio overview, or test yourself with flashcards, and quickly get up to speed on the quantum threat.</p><p><b>Why PQC matters now</b></p><p>Quantum computing is rapidly moving from theory to reality. Our <a href=\"https://blog.google/technology/research/google-willow-quantum-chip/\">Willow chip</a> and <a href=\"https://blog.google/innovation-and-ai/technology/research/quantum-echoes-willow-verifiable-quantum-advantage/\">Quantum Echoes algorithm</a> mark substantial progress, and Google research estimates that breaking <a href=\"https://arxiv.org/abs/2603.28846\">ECDLP-256</a> and <a href=\"https://arxiv.org/abs/2505.15917\">RSA-2048</a> encryption — the public-key cryptography schemes protecting much of our online data — would require around 500,000 and 1 million imperfect quantum computer components (noisy qubits), respectively.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">To help, we&#x27;re launching Prepare for Post-Quantum Cryptography, a public Gemini Notebook that brings Google&#x27;s PQC research, engineering blogs, and migration guidance together in one place.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This research has consequences now. It indicates that today’s online security is more vulnerable to future quantum computers than previously thought.</span></p>\n<p><span style=\"vertical-align: baseline;\">In </span><a href=\"https://www.ietf.org/archive/id/draft-reddy-uta-pqc-app-03.html#name-timeline-for-transition\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Store Now, Decrypt Later</span></a><span style=\"vertical-align: baseline;\"> attacks, adversaries may steal encrypted data now and wait to decrypt it once a sufficiently powerful quantum computer exists. Data that we’ve long considered sensitive — health records, financial data, intellectual property, and government secrets — is already at risk</span><span style=\"vertical-align: baseline;\">.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">With continued advances in architecture, quantum algorithms, and quantum error correction shrinking future quantum hardware requirements, waiting to upgrade our digital locks is not a viable option. To help organizations stay ahead of the curve, Google has published a </span><a href=\"https://blog.google/innovation-and-ai/technology/safety-security/cryptography-migration-timeline/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">migration timeline</span></a><span style=\"vertical-align: baseline;\"> noting our plans to transition to PQC by 2029, and we urge others to consider the same.</span></p>\n<p><span style=\"vertical-align: baseline;\">As the technology advances, policymakers should consider urging critical infrastructure owners and operators to recognize condensed timelines, and build PQC readiness into existing risk mitigation plans. We also recommend governments engage with global counterparts to promote a harmonized approach to standards development, and include technical and security experts in the building of policy and regulatory requirements focused on quantum safety. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Google's PQC expertise, in one notebook</strong></p>\n<p><span style=\"vertical-align: baseline;\">The Prepare for Post-Quantum Cryptography notebook turns years of Google expertise into an interactive primer that anyone can use. It's built on curated Google sources covering the quantum era, quantum computing breakthroughs like Willow, Quantum Echoes, and surface code error suppression, industry PQC standards, Google's own deployments, and the latest research.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the Gemini Notebook, you can:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Get answers grounded in Google's sources.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Listen to a podcast-style audio overview.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Test your PQC knowledge with flashcards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore an interactive visual diagram of the quantum threat.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Read a concise briefing document.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Try these prompts</strong></p>\n<p><span style=\"vertical-align: baseline;\">To get started, here are a few questions to ask the notebook:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For CISOs</strong><span style=\"vertical-align: baseline;\">: \"What should a CISO prioritize in the first 90 days of a PQC migration?\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For anyone new to PQC</strong><span style=\"vertical-align: baseline;\">: \"Explain store-now-decrypt-later in plain terms.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For developers</strong><span style=\"vertical-align: baseline;\">: \"How does hybrid ML-KEM key exchange work in Chrome?\"</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">As with all generative AI, the notebook can make mistakes, so check its responses against the linked sources.</span></p>\n<p><strong style=\"vertical-align: baseline;\">What's at stake</strong></p>\n<p><span style=\"vertical-align: baseline;\">Previous cryptographic migrations, such as moving from SHA-1 or upgrading TLS, have taken a decade or more. Waiting for the availability of a cryptographically-relevant quantum computer before beginning the migration journey represents a significant security risk given the importance of</span><span style=\"vertical-align: baseline;\"> public-key cryptography for securing digital essentials like web traffic, software updates, digital identities, and signatures.</span></p>\n<p><span style=\"vertical-align: baseline;\">For CISOs, we recommend that you start by:</span></p>\n<ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Understanding</strong><span style=\"vertical-align: baseline;\"> where vulnerable cryptography lives in your organization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Identifying and prioritizing </strong><span style=\"vertical-align: baseline;\">data and systems most at risk from quantum threats, and developing a plan for addressing these risks. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Anticipate system-wide effects </strong><span style=\"vertical-align: baseline;\">that PQC migration could have.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Building</strong><span style=\"vertical-align: baseline;\"> crypto-agility into your security plans, using learnings from past experiences like Heartbleed.</span></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Additional detail on these recommendations is available in our previous </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-prepare-early-for-PQC-resilient-cryptographic-threats?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog post</span></a><span style=\"vertical-align: baseline;\">.  </span></p>\n<p><span style=\"vertical-align: baseline;\">For the broader security community, the transition only succeeds if this knowledge is accessible to everyone — not just organizations with dedicated cryptography teams.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How Google is putting PQC into practice</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We’ve been deploying PQC for years. Highlights include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://blog.chromium.org/2023/08/protecting-chrome-traffic-with-hybrid.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hybrid Kyber/ML-KEM key exchange protecting Chrome traffic</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://blog.google/security/security-for-the-quantum-era-implementing-post-quantum-cryptography-in-android/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">PQC in Android</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/identity-security/announcing-quantum-safe-digital-signatures-in-cloud-kms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Quantum-safe digital signatures in Cloud KMS</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/identity-security/why-google-now-uses-post-quantum-cryptography-for-internal-comms?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">PQC for Google's internal communications</span></a></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">We also co-founded the </span><a href=\"https://pqca.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Post-Quantum Cryptography Alliance</span></a><span style=\"vertical-align: baseline;\"> at the Linux Foundation with industry leaders including Amazon Web Services, Cisco, IBM, and NVIDIA to support open-source tools like </span><a href=\"https://openquantumsafe.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Quantum Safe</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Build a PQC notebook for your own team</strong></p>\n<p><span style=\"vertical-align: baseline;\">Here’s how you can create a resource similar to our PQC Gemini Notebook, specific to your organization’s needs:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Curate trusted sources</strong><span style=\"vertical-align: baseline;\">. Start with a focused set of authoritative research, standards, and guidance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Write neutral prompts</strong><span style=\"vertical-align: baseline;\">. Keep instructions factual so outputs stay grounded in your sources.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Add AI disclaimers and a welcome note</strong><span style=\"vertical-align: baseline;\">. Tell readers what the notebook covers and remind them that AI can make mistakes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review all output with human oversight</strong><span style=\"vertical-align: baseline;\">. Have experts check every artifact before you share it.</span></p>\n</li>\n</ol>\n<p><strong style=\"vertical-align: baseline;\">Start preparing today</strong></p>\n<p><span style=\"vertical-align: baseline;\">The quantum transition has already started, but preparing your organization doesn't have to begin with a 100-page whitepaper. Start by understanding the threat, then assess your cryptographic inventory and build a migration roadmap.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can get started with the Prepare for Post-Quantum Cryptography Gemini Notebook and share it with your team today. To learn more about Google Cloud’s approach to PQC, check out our dedicated </span><a href=\"https://cloud.google.com/security/resources/post-quantum-cryptography\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud PQC Resource Hub</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5eb4f8df10&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://www.youtube.com/watch?v=Wpo-5ke9uvQ&#x27;), (&#x27;image&#x27;, &lt;GAEImage: Cloud-CISO-Perspectives-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>In case you missed it</b></h3><p>Here are the latest updates, products, services, and resources from our security teams so far this month:</p><ul><li><b>Securing enterprise agility in the machine-speed era</b>: Learn what executives need to know about today’s threat landscape, how security teams should respond, and why Google AI Threat Defense can help. <a href=\"https://cloud.google.com/transform/securing-enterprise-agility-in-the-machine-speed-era\"><b>Read more</b></a>.</li><li><b>Gemini 4 Argon available on Google Cloud</b>: We’re making our new frontier model, Gemini 4 Argon, available for everyone on Google Cloud. Here’s how it can help boost the defender’s advantage. <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud\"><b>Read more</b></a>.</li><li><b>Android's next-gen enclave for on-device AI</b>: Learn about Android’s enclave architecture for personalized on-device AI experiences. <a href=\"https://blog.google/security/enabling-the-next-gen-enclave-architecture-for-on-device-ai-on-android/\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>The Wiz Red Agent caught a Fortune 500 firm’s data exposure that other tools missed</b>: Using an attacker’s mindset, the Red Agent found a public page exposing sensitive data in minutes. <a href=\"https://www.wiz.io/blog/red-agent-financial-services-data-exposure\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Chrome's response to recent ccTLD registry hijacks</b>: Following recent .gh, .sl, and .as ccTLD domain hijacks, Chrome immediately blocked unauthorized HTTPS certificates via CRLSets to protect users automatically. <a href=\"https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Wiz Blue Agent POV: Investigating data theft across AWS and GitHub</b>: See how the Blue Agent investigated a multi-platform attack in minutes, following evidence across AWS and GitHub to uncover compromised credentials, stolen source code, and custom data exfiltration tooling. <a href=\"https://www.wiz.io/blog/blue-agent-data-exfiltration-investigation\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Introducing Wiz AI SAST: Application security that understands you</b>: Find, validate, and fix complex business logic flaws with an AI code scanner backed by Wiz Research, operationalized in your existing security program. <a href=\"https://www.wiz.io/blog/introducing-wiz-ai-sast\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Introducing WizOS Helm Charts to secure the Kubernetes supply chain</b>: WizOS Helm Charts can help eliminate hidden CI/CD risks and unmaintained dependencies with hardened, signed, and CVE-scanned charts for Kubernetes. <a href=\"https://www.wiz.io/blog/wizos-helm-charts\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>What’s new in Wiz Service Catalog</b>: Smarter discovery, governance, and service-level context can help build your service catalog faster, keep service context current, and give teams a clearer path from cloud risk to accountability. <a href=\"https://www.wiz.io/blog/wiz-service-catalog-updates\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more security stories <a href=\"https://cloud.google.com/blog/products/identity-security\">published this month</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5eb4f8c150&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Threat Intelligence news</b></h3><ul><li><b>Vulnerability discovery and exploitation trends in the AI era</b>: To counter the increased risk from rapid vulnerability discovery and exploitation, organizations should transition from unprioritized mass-patching to threat-intelligence-driven triage, combining targeted edge-defense with automated, agentic remediation. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era\"><b>Read more</b></a>.</li><li><b>Defending against active exploitation of Citrix NetScaler ADC and Gateway appliances</b>: Mandiant Consulting and Google Threat Intelligence Group (GTIG) identified active, in-the-wild exploitation of a zero-day vulnerability affecting Citrix NetScaler ADC and NetScaler Gateway appliances. Here’s our containment and remediation guidance. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era\"><b>Read more</b></a>.</li><li><b>ShinyHunters renewed mass exploitation campaign targeting Oracle PeopleSoft</b>: Mandiant and Google Threat Intelligence Group (GTIG) have identified renewed mass exploitation of CVE-2026-35273 by UNC6240 (ShinyHunters), along with expanded global targeting across multiple sectors. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft\"><b>Read more</b></a>.</li><li><b>Proactively defend by hardening code pipelines and CI/CD infrastructure</b>: Check out our actionable blueprint for software and platform architects designed to safeguard the software supply chain against threat vectors that are actively being exploited, third-party risks, and architectural vulnerabilities throughout the entire software development lifecycle. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more threat intelligence stories <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\">published this month</a>.</p></div>\n<div class=\"block-paragraph\"><h3><b>Now hear this: Podcasts from Google Cloud</b></h3><ul><li><b>Cloud Security Podcast: Patching browsers with AI, agents, Rust, and your tabs</b>: Jasika Bawa and Doug Turner of Chrome Security explore how Google Chrome now uses AI agents to autonomously identify and patch security vulnerabilities at an unprecedented scale, significantly accelerating the browser's update cadence. <a href=\"https://www.youtube.com/watch?v=pCXT8lQqg_U\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: All about Project Atlas, Wiz's AI vulnerability research</b>: Nir Orfeld, head of vulnerability research, Wiz, discusses how his team uses multi-agent AI systems for discovering high-impact zero-day vulnerabilities in cloud infrastructure. <a href=\"https://www.youtube.com/watch?v=qRJJ9ekpuVg\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: How Google eliminates classes of vulnerabilities at scale</b>: How do you build the foundations for a secure Google-scale enterprise that stays secure even if an AI is writing the code and nobody has time to review it? Christoph Kern, principal security engineer, Google, explores what secure-by-design really means in the AI era. <a href=\"https://www.youtube.com/watch?v=43imRRfgLgc\" target=\"_blank\"><b>Listen here</b></a>.</li></ul><p>To have our Cloud CISO Perspectives post delivered twice a month to your inbox, <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">sign up for our newsletter</a>. We’ll be back in a few weeks with more security-related updates from Google Cloud.</p></div>"
  "d2e2e47af3933f51d4d3c9010b7d706b":
    "id": "d2e2e47af3933f51d4d3c9010b7d706b"
    "title": "ARMORY CASTLE Exploits BeyondTrust"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust/"
    "published": "2026-10-15 23:00:00"
    "fetched": "2026-10-16 06:56:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Written by: Jayson Frost, Bryce Greathouse, <span style=\"vertical-align: baseline;\">Brian Meyer, </span>John Palmisano, Rajesh Rajeshirke, Steve Rasch, John Wolfram</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Introduction</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">On October 15, BeyondTrust disclosed a vulnerability, CVE-2026-102764, impacting BeyondTrust Remote Support (formerly Bomgar) appliances. BeyondTrust Remote Support is an enterprise secure remote access solution that enables IT teams to securely access and troubleshoot remote endpoints. The successful exploitation of this vulnerability results in the arbitrary upload of files. </span></p>\n<p><span style=\"vertical-align: baseline;\">During an incident response engagement, Mandiant identified evidence that ARMORY CASTLE, a suspected PRC-nexus espionage threat actor (formerly tracked as </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/brickstorm-espionage-campaign?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">UNC5221</span></a><span style=\"vertical-align: baseline;\">), exploited this vulnerability as a zero-day, in late August 2026. This blog describes how ARMORY CASTLE escalated privileges and established persistent access to compromised BeyondTrust Remote Support appliances following exploitation of CVE-2026-102764, and provides actionable guidance for defenders.</span></p>\n<p><span style=\"vertical-align: baseline;\">Organizations should prepare for potential widespread exploitation following this disclosure, as ARMORY CASTLE and other threat actors have historically conducted broad, opportunistic exploitation once the vulnerability becomes public. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Exploitation</span></h3>\n<p><span style=\"vertical-align: baseline;\">Mandiant identified evidence of CVE-2026-102764 exploitation within the access, syslog, messages, thin-scc, brain and SSL log files, which are only accessible via an LUKS-encrypted partition which contains the </span><code style=\"vertical-align: baseline;\">/home</code><span style=\"vertical-align: baseline;\"> directory. We strongly recommend that affected organizations immediately apply the security </span><a href=\"https://www.beyondtrust.com/trust-center/security-advisories/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">patches</span></a><span style=\"vertical-align: baseline;\"> provided by BeyondTrust to remediate the vulnerability, and review additional guidance in their </span><a href=\"https://www.beyondtrust.com/blog/entry/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Post-Exploitation</span></h3>\n<p><span style=\"vertical-align: baseline;\">Following the successful exploitation of CVE-2026-102764, Mandiant observed ARMORY CASTLE leverage multiple distinct TTPs to establish a foothold, escalate privileges, and enable lateral movement. Throughout the intrusion, ARMORY CASTLE leveraged a deep understanding of BeyondTrust appliance internals, as evidenced by their abuse of proprietary CLI utilities, startup configuration templates and local reverse-proxy routing. The threat actor used newly identified custom malware, the SAWFLY webshell and the BARECLAW tunneler to interact with the BeyondTrust device. Additionally, the actor routinely deleted appliance logs and endpoint artifacts to maintain access and evade detection.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ARMORY CASTLE BeyondTrust compromise sequence of events\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_ARMORY_CASTLE_BeyondTrust_comprom.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: ARMORY CASTLE BeyondTrust compromise sequence of events</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Staging Webshell</span></h4>\n<p><span style=\"vertical-align: baseline;\">After successful exploitation of CVE-2026-102764, ARMORY CASTLE initiated POST requests to </span><code style=\"vertical-align: baseline;\">/app_84304470%2Ephp</code><span style=\"vertical-align: baseline;\">. Mandiant was unable to recover the file associated with the POST requests. Approximately 11 minutes following the initial POST request, the file system recorded the creation of the SAWFLY webshell at the web root path </span><code style=\"vertical-align: baseline;\">/%SITE_SERVICE_ACCOUNT%/ingredi/app/laravel/public/</code><span style=\"vertical-align: baseline;\">. ARMORY CASTLE leveraged the SAWFLY webshell as one of their primary footholds within the environment over the course of the intrusion. </span></p>\n<h4><span style=\"vertical-align: baseline;\">SAWFLY Webshell</span></h4>\n<p><span style=\"vertical-align: baseline;\">SAWFLY </span><span style=\"vertical-align: baseline;\">(</span><code style=\"vertical-align: baseline;\">mangoapi.php</code><span style=\"vertical-align: baseline;\">)</span><span style=\"vertical-align: baseline;\"> is an obfuscated, lightweight PHP webshell that implements bidirectional encrypted C2 communication using a custom Base32 transport layer and a 256-bit RC4 stream cipher. The webshell inspects incoming HTTP POST requests for the obfuscated parameter </span><code style=\"vertical-align: baseline;\">_c94mfe</code><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">If the parameter is absent, the script immediately sets HTTP status 404 Not Found (</span><code style=\"vertical-align: baseline;\">http_response_code(404)</code><span style=\"vertical-align: baseline;\">) and exits to evade automated web crawlers and vulnerability scanners. When the </span><code style=\"vertical-align: baseline;\">_c94mfe</code><span style=\"vertical-align: baseline;\"> parameter is supplied, the webshell Base32-decodes the payload, decrypts it using RC4 with a hardcoded 32-byte key and executes the resulting PHP code via </span><code style=\"vertical-align: baseline;\">@eval()</code><span style=\"vertical-align: baseline;\">. Any non-null return value from the evaluated code is RC4-encrypted with the same key, Base32-encoded, and echoed back to the client. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Privilege Escalation via SUID Bit Permissions</span></h4>\n<p><span style=\"vertical-align: baseline;\">The SAWFLY webshell ran under the site's service account, an unprivileged local user. To escalate privileges, the threat actor copied the system shell executable (</span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\">) to the file </span><code style=\"vertical-align: baseline;\">/usr/bin/dbus-authd</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">The threat actor then modified the file's ownership to root and enabled Set User ID (SUID) permissions. When a binary has SUID permissions enabled, it executes with the privileges of the file's owner (root) rather than the user running the command, effectively granting the threat actor a persistent root-level backdoor on the host system.</span></p>\n<p><span style=\"vertical-align: baseline;\">After establishing a foothold through the web shell, the actor elevated from the web service account to root-level control of the appliance host. This gave them access to every credential the appliance stored or brokered and the ability to modify files that survive reboot and configuration reset.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Credential Harvesting: BeyondTrust Vault Extraction</span></h4>\n<p><span style=\"vertical-align: baseline;\">Mandiant observed the threat actor attempt to harvest credentials directly from the appliance's native secrets management database. To achieve this, the actor leveraged the </span><code style=\"vertical-align: baseline;\">/ns/sbin/bt-secrets</code><span style=\"vertical-align: baseline;\"> binary which is a proprietary, administrative Command Line Interface (CLI) utility native to BeyondTrust appliances used to manage, store, and retrieve passwords, API keys, and endpoint credentials.</span></p>\n<p><span style=\"vertical-align: baseline;\">The threat actor systematically iterated through several CLI syntax variations to locate and dump the appliance's credential vault:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/ns/sbin/bt-secrets get -p %SITE_SERVICE_ACCOUNT% vault\n/ns/sbin/bt-secrets get %SITE_SERVICE_ACCOUNT% vault\n/ns/sbin/bt-secrets get vault\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 2: Recovered Commands from message logs</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">First, the threat actor attempted to target the vault for a specific site service account in order to pull passwords and keys assigned exclusively to that profile.</span></p>\n<p><span style=\"vertical-align: baseline;\">Next, they issued a fallback command, targeting the global, appliance-level password safe to dump all stored administrative credentials.</span></p>\n<p><span style=\"vertical-align: baseline;\">The threat actor concluded their interaction with the bt-secrets binary by forcibly removing the records stored i</span><span style=\"vertical-align: baseline;\">n</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">/home/bomgar/log/bt-secrets.log</code><span style=\"vertical-align: baseline;\"> and any archived files.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/usr/sbin/sh -c 'rm -f /home/bomgar/log/bt-secrets.log /home/bomgar/log/bt-secrets.log.* 2&gt;/dev/null;'</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 3: Recovered Commands from message logs</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Persistence</span></h4>\n<p><span style=\"vertical-align: baseline;\">For long-term persistent access, Mandiant observed the threat actor target the BeyondTrust configuration templates to grant passwordless root privileges to the site service account.</span></p>\n<p><span style=\"vertical-align: baseline;\">First, the threat actor created the </span><code style=\"vertical-align: baseline;\">/home/bomgar/sbin/post_boot.d</code><span style=\"vertical-align: baseline;\"> directory, which is reserved for scripts executed automatically at system startup. Within this directory, they created a shell script named </span><code style=\"vertical-align: baseline;\">zz-root-persist</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">The contents of the </span><code style=\"vertical-align: baseline;\">zz-root-persist</code><span style=\"vertical-align: baseline;\"> script indicate that it first checks if the user account is already granted passwordless root privileges within the </span><code style=\"vertical-align: baseline;\">/ns/config/sudoers.template</code><span style=\"vertical-align: baseline;\"> file. If the entry is missing, the script appends</span><code style=\"vertical-align: baseline;\"> </code><code style=\"vertical-align: baseline;\">'%SITE_SERVICE_ACCOUNT% ALL=(ALL) NOPASSWD: ALL'</code><code style=\"vertical-align: baseline;\"> </code><span style=\"vertical-align: baseline;\">to the template. This entry added  to the sudoers template grants the site user account passwordless administrative privileges to execute any command on the host system.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, the script executes</span><code style=\"vertical-align: baseline;\"> </code><code style=\"vertical-align: baseline;\">'/ns/sbin/bt-sysconfig' --no-restart misc</code><span style=\"vertical-align: baseline;\">, which forces the appliance backend to immediately parse </span><code style=\"vertical-align: baseline;\">/ns/config/sudoers.template</code><span style=\"vertical-align: baseline;\"> and rebuild the active </span><code style=\"vertical-align: baseline;\">/etc/sudoers</code><span style=\"vertical-align: baseline;\"> file. This strategy ensures the threat actor's privilege escalation survives system reboots and configuration resets, which would normally overwrite manual changes made directly to </span><code style=\"vertical-align: baseline;\">/etc/sudoers</code><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>#!/bin/bash\ngrep -qF '%SITE_SERVICE_ACCOUNT% ALL=(ALL) NOPASSWD: ALL' '/ns/config/sudoers.template' || echo '%SITE_SERVICE_ACCOUNT% ALL=(ALL) NOPASSWD: ALL' &gt;&gt; '/ns/config/sudoers.template'\n'/ns/sbin/bt-sysconfig' --no-restart misc\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"> Figure 4: Contents of zz-root-persist</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Anti-Forensics</span></h4>\n<p><span style=\"vertical-align: baseline;\">Throughout their unauthorized access to the appliance, Mandiant observed multiple instances where the threat actor attempted to impair defenses and hinder detection by systematically deleting system, web server, and application-level logs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Originating from the SAWFLY webshell, the threat actor executed the following command using elevated sudo privileges to delete active logs across both host and site-specific directories:<br /></span></p>\n<p> </p>\n<pre class=\"language-markup\"><code>'rm -f \\'/ns/log/auth.log\\' \\'/ns/log/ssl.log\\' \\'/ns/log/proto-handler.log\\' \\'/ns/log/bt-docker.log\\' \\'/ns/log/http-access.log\\' \\'/ns/log/http-errors.log\\' \\'/ns/log/php-fpm.log\\' \\'/ns/log/php-fpm-access.log\\' \\'/ns/log/php_debug.log\\' \\'/ns/log/php_web_errors.log\\' \\'/var/log/messages\\' \\'/home/%SITE_SERVICE_ACCOUNT%/ingredi/log/httpd_access.log\\' \\'/home/%SITE_SERVICE_ACCOUNT%/ingredi/log/httpd_error.log\\' /tmp/sshauth.*'\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 5: Recovered Command</span></span></p>\n<p><span style=\"vertical-align: baseline;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Lateral Movement: BeyondTrust Admin Session Abuse</span></h4>\n<p><span style=\"vertical-align: baseline;\">After the compromise of the BeyondTrust device, the threat actor pivoted into the BeyondTrust Remote Support application to perform reconnaissance via compromised Administrator credentials. </span><span style=\"vertical-align: baseline;\">First, the threat actor leveraged the Administrator account to log into the web administrative portal.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>{\n  \"event\": \"login\",\n  \"status\": \"success\",\n  \"target\": \"web/login\",\n  \"who\": \"[REDACTED_USERNAME] using password\",\n  \"who_ip\": \"[REDACTED_IP]\"\n}\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 6: BeyondTrust Syslog Entry<br /><br /></span></span></p>\n<p><span style=\"vertical-align: baseline;\">After testing their initial access and verifying their ability to temporarily join the native Administrators group policy, the threat actor altered their strategy for long-term persistence. The actor directly modified the compromised account's permissions, upgrading both local Jump Items and Team permissions from </span><code style=\"vertical-align: baseline;\">No Access</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">Administrator</code><span style=\"vertical-align: baseline;\">. Jump Items are individual systems or devices that are made available for remote access within a Jump Group, enabling administrators to organize and control access to remote systems. This configuration change granted the threat actor permanent, unrestricted authorization to launch remote sessions to downstream systems populated within the appliance's Jump Item list.</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"> </span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>{\n  \"event\": \"user_changed\",\n  \"old_username\": \"[REDACTED]\",\n  \"old_permissions:jump_item_role:default:id\": 1,\n  \"new_permissions:jump_item_role:default:id\": 3,\n  \"old_permissions:jump_item_role:default:name\": \"No Access\",\n  \"new_permissions:jump_item_role:default:name\": \"Administrator\",\n  \"old_permissions:jump_item_role:teams:id\": 1,\n  \"new_permissions:jump_item_role:teams:id\": 3,\n  \"old_permissions:jump_item_role:teams:name\": \"No Access\",\n  \"new_permissions:jump_item_role:teams:name\": \"Administrator\"\n}\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Figure 7: BeyondTrust Syslog Entry</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Internal Reconnaissance</span></h4>\n<p><span style=\"vertical-align: baseline;\">Once the threat actor obtained elevated administrative privileges, Mandiant observed the threat actor establish a remote support session to target internal endpoints.</span></p>\n<p><span style=\"vertical-align: baseline;\">Once connected, the threat actor leveraged the appliance’s built-in support tools to request and obtain full file-system access. The threat actor utilized the native BeyondTrust Remote Support file transfer service to download and exfiltrate sensitive internal documents useful for network reconnaissance, such as software inventories, directly from the user's desktop environment. </span></p>\n<h4><span style=\"vertical-align: baseline;\">BARECLAW Tunneler</span></h4>\n<p><span style=\"vertical-align: baseline;\">Mandiant observed the threat actor tunnel traffic through the BeyondTrust device via a custom SOCKS5 proxy tunneler. BARECLAW is a tunneler written in C that provides a SOCKS5 proxy service carried over the WebSocket transport and relays TCP connections between a remote client and destinations. BARECLAW statically embeds a CivetWeb WebServer to supply its HTTP and WebSocket functionality and utilizes OpenSSL for TLS. BARECLAW is configurable and provides the option to require authentication, to encrypt data between the client and tunneler, to restrict reachable destinations to specific CIDR ranges, to chain traffic to an upstream proxy, and to modify its default WebSocket endpoint and listening ports. TLS is enabled by providing a PEM certificate while authentication, encryption, destination filtering, and TLS are disabled by default. </span></p>\n<p><span style=\"vertical-align: baseline;\">BARECLAW receives its configuration through CLI input and it provides a CLI option menu:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>Usage: %s [options]\n  --listen PORT            plain ws port (default 8080)\n  --listen-tls PORT        wss port (default 8443, needs --ssl-cert)\n  --ssl-cert FILE          PEM certificate (enables wss)\n  --token STRING           shared secret (?token= auth + obfs seed)\n  --obfs                   enable XOR stream obfuscation\n  --timeout SEC            idle timeout (default 300)\n  --connect-timeout SEC    target connect timeout (default 10)\n  --max-tunnels N          concurrent tunnel limit (default 100)\n  --allow-net CIDR         allowed target subnet (repeatable)\n  --upstream [socks5://]host:port   route via upstream SOCKS5\n  --threads N              civetweb worker threads (default 64)\n  --ws-path PATH           websocket endpoint path (default /wsproxy)\n  -q, --quiet              zero output (all logging suppressed)\n  -h                       this help\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 8: BARECLAW CLI Option Menu</span></span></p>\n<p><span style=\"color: #5f6368; display: block; font-size: 16px; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">The threat actor executed BARECLAW through the following command line arguments:</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/tmp/ingredi_ws --listen 19800 --token %REDACTED% --obfs -q --ws-path /uidchanarge\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 9: BARECLAW full Command-Line Arguments</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This command line configures BARECLAW to listen on TCP port 19800 and create the WebSocket endpoint </span><code style=\"vertical-align: baseline;\">/uidchanarge</code><span style=\"vertical-align: baseline;\"> on the victim system. Clients are required to authenticate using the token specified in the command line arguments while the -q argument suppresses the tunneler’s logging. Tunneled data is encrypted with an XOR-based routine derived from that token and an 8-byte value provided by the client at the start of the session. The lack of the --ssl-cert and --listen-tls arguments in the CLI options means TLS was not enabled in this specific instance.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Modifications to Haproxy.conf</span></h4>\n<p><span style=\"vertical-align: baseline;\">In addition to the creation of the BARECLAW tunneler, Mandiant observed the threat actor modify the </span><code style=\"vertical-align: baseline;\">/ns/config/haproxy.conf</code><span style=\"vertical-align: baseline;\"> file in order for BARECLAW to be accessible directly from the internet. The HAProxy service running on BeyondTrust devices acts a reverse proxy for the device that accepts incoming requests on behalf of the BeyondTrust server and forwards the request to the appropriate backend services running on the local system (such as web interfaces, administration portals, or application gateways) based on the request's port or URL path. </span></p>\n<p><span style=\"vertical-align: baseline;\">The <code style=\"vertical-align: baseline;\">haproxy.conf</code> </span><span style=\"vertical-align: baseline;\">file is the primary configuration script that dictates how the BeyondTrust appliance handles, routes, and secures incoming traffic. The threat actor modifications first established an Access Control List (ACL) named </span><code style=\"vertical-align: baseline;\">wswsws</code><span style=\"vertical-align: baseline;\"> to monitor incoming traffic for the specific URI path </span><code style=\"vertical-align: baseline;\">/uidchanarge</code><span style=\"vertical-align: baseline;\">. When a request matching this path is detected, HAProxy bypasses normal appliance web services and routes the traffic to a custom backend <span style=\"vertical-align: baseline;\">designated as </span><code style=\"vertical-align: baseline;\">webskd3</code><span style=\"vertical-align: baseline;\">.</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>    acl wswsws path /uidchanarge\n    use_backend webskd3 if wswsws\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Figure 10: ACL Modification to haproxy.conf</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, the </span><code style=\"vertical-align: baseline;\">webskd3</code><span style=\"vertical-align: baseline;\"> backend routes the incoming web stream locally (127.0.0.1 / localhost) to TCP port 19800, where the BARECLAW utility is actively listening. This local-only binding ensures that the backdoor listener remains completely hidden from external network scans, as it can only be reached internally via HAProxy's local redirection.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>backend webskd3\n    mode http\n    server websocks5srv 127.0.0.1:19800\n    option http-keep-alive\n    timeout server 28s\n    timeout tunnel 5h\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 11: Backend Route Modification to haproxy.conf</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Attribution</span></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG attributes the zero-day exploitation of CVE-2026-102764 and the subsequent deployment of SAWFLY and BARECLAW to the suspected PRC-nexus espionage actor ARMORY CASTLE (formerly tracked as UNC5221). The tooling and TTPs leveraged within this intrusion align with previously observed activity from ARMORY CASTLE.</span></p>\n<p><span style=\"vertical-align: baseline;\">GTIG has </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/china-nexus-exploiting-critical-ivanti-vulnerability?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">previously reported</span></a><span style=\"vertical-align: baseline;\"> ARMORY CASTLE exploiting multiple vulnerabilities in edge appliances and deploying an extensive suite of custom tooling to support their objectives, ranging from passive backdoors and webshells to trojanized components of edge devices. ARMORY CASTLE has been active as early as October 2023 and has targeted a wide range of countries and verticals during their operations. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Outlook and Implications</span></h3>\n<p><span style=\"vertical-align: baseline;\">In past campaigns, ARMORY CASTLE has conducted widespread and opportunistic exploitation following the public disclosure of vulnerabilities it had exploited selectively as zero-days, racing to infiltrate target organizations before patches are deployed. It is possible that we will observe similar widespread exploitation attempts associated with CVE-2026-102764. </span></p>\n<p><span style=\"vertical-align: baseline;\">GTIG assesses with high confidence that ARMORY CASTLE will continue to leverage zero-day vulnerabilities in edge devices to gain access to environments to support their espionage objective. Defenders should also prepare for the possibility that following disclosure of CVE-2026-102764, ARMORY CASTLE may conduct widespread exploitation similar to what GTIG </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ivanti-connect-secure-vpn-zero-day\"><span style=\"text-decoration: underline; vertical-align: baseline;\">observed</span></a><span style=\"vertical-align: baseline;\"> in 2024 following the disclosure of CVE-2023-46805 and CVE-2024-21887. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Remediation and Hardening</span></h3>\n<p><span style=\"vertical-align: baseline;\">Organizations that have not yet applied the </span><a href=\"https://www.beyondtrust.com/trust-center/security-advisories/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BT26-05 patch</span></a><span style=\"vertical-align: baseline;\"> should immediately assess their exposure and risk, and review additional guidance from BeyondTrust in their </span><a href=\"https://www.beyondtrust.com/blog/entry/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. CVE-2026-102764 affects all supported Remote Support versions up to 26.2.3 and allows an unauthenticated remote attacker to perform file operations on the appliance, which can lead to host-level control and access to every credential the appliance stores or brokers. Any appliance that was reachable from the internet on a vulnerable version during the exploitation window should be treated as potentially compromised until it has been reviewed. Mandiant recommends a phased, patch-first approach that balances containment against disruption to support operations.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Immediate Mitigation</span></h4>\n<p><span style=\"vertical-align: baseline;\">Organizations should choose among the following options based on their risk tolerance, evidence of compromise, and operational needs.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Option 1: Apply the BT26-05 Patch (Mandiant Recommended)</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Remote Support SaaS</strong><span style=\"vertical-align: baseline;\">: BeyondTrust applied the patch to all SaaS tenants on October 9, 2026. No customer action is required for the appliance itself. The credential and configuration steps in Option 3 still apply.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Self-hosted, version 24.3.1 or later</strong><span style=\"vertical-align: baseline;\">: Apply the BT26-05-RS patch from the </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> interface, or confirm it was applied automatically if the appliance is subscribed to automatic updates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Self-hosted, older than 24.3.1</strong><span style=\"vertical-align: baseline;\">: Upgrade to a supported version, then apply the patch. Upgrading closes the vulnerability but does not remediate prior exposure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">If the patch is not visible in </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\">, open a case with BeyondTrust Support referencing BT26-05.</span></p>\n</li>\n</ul>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Option 2: Isolate Compromised or Suspected Appliances</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Preserve before acting</strong><span style=\"vertical-align: baseline;\">: Snapshot virtual appliances with memory and export the disk before any change or reboot. For B Series hardware and SaaS tenants, request forensic preservation through BeyondTrust Support. Collect syslog, reverse-proxy or WAF, and perimeter firewall logs for the full exposure window, since an attacker with host access can delete on-appliance logs. Mandiant determined that the actor removed logs throughout the incident.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Isolate at the perimeter</strong><span style=\"vertical-align: baseline;\">: Block inbound traffic to the appliance's public address at the firewall rather than in </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\">, so the configuration remains intact for review.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Restrict egress</strong><span style=\"vertical-align: baseline;\">: Deny outbound traffic except to BeyondTrust update and licensing endpoints, and log every denied connection.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Terminate access paths</strong><span style=\"vertical-align: baseline;\">: End active support sessions and disable new sessions, Jump Clients, Jumpoints, and API accounts from </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\">. Disable rather than delete so the audit trail survives.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rebuild rather than clean</strong><span style=\"vertical-align: baseline;\">: Redeploy appliances with confirmed or unknown compromise status from a clean, fully patched image. Customers cannot audit the appliance host file system, and host-level persistence survives reboot and configuration reset. Restore only a configuration backup dated before the exposure window, or restore the newest backup while isolated and complete the review in Option 3, Part B, before reconnecting anything. Issue a new TLS certificate and redeploy Jump Clients, Jumpoints, and the representative console from the rebuilt appliance.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Note</strong><span style=\"vertical-align: baseline;\">: Isolation and session termination interrupt support operations. Organizations should coordinate with help desk and vendor-support stakeholders before proceeding.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Option 3: Apply Targeted Compensating Controls</span></h4>\n<p><span style=\"vertical-align: baseline;\">The following controls reduce exposure and limit post-exploitation impact. They do not substitute for the patch.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Part A: Network Restrictions</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Restrict access to the </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> administrative interfaces by IP or network segment at the appliance level. Only representative console, customer portal, and Jump Client traffic should be reachable from the internet.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Where operationally possible, place a reverse proxy or WAF with full URI logging in front of the appliance to keep a record of request paths that the appliance cannot alter.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Part B: Credential Rotation and Configuration Review</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Revoke sessions and enrollments</strong><span style=\"vertical-align: baseline;\">: End all active support sessions, then redeploy Jump Clients, Jumpoints, and the representative console from the patched or rebuilt appliance to invalidate existing tokens.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rotate credentials in dependency order</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> administrative credentials; /login administrators and local users; API client secrets; security provider bind accounts and SAML signing keys; Remote Support Vault and integrated Password Safe or Privileged Remote Access (PRA) credentials, rotated at the target system; integration credentials (SMTP, syslog, Information Technology Service Management (ITSM) connectors, outbound event secrets); and any credential typed into a support session during the window.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review the </strong><strong style=\"vertical-align: baseline;\">/login</strong><strong style=\"vertical-align: baseline;\"> configuration against a pre-window baseline</strong><span style=\"vertical-align: baseline;\">: user and role changes, particularly Jump Item roles raised to Administrator; group and session policies; API accounts; security providers; Jump Items and Jumpoints; and outbound event or syslog destinations. Remove anything without a change record or a named owner.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review support session reports</strong><span style=\"vertical-align: baseline;\"> for the window, including file transfers, to establish which endpoints were accessed and what left them. Every endpoint touched is in scope for downstream hunting.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Note</strong><span style=\"vertical-align: baseline;\">: Rotate credentials only after the appliance has been patched or rebuilt. Rotating earlier exposes the new credentials to an attacker who still controls the appliance.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Part C: Control Plane Restrictions</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Require SAML single sign-on with phishing-resistant MFA for all </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> users, and remove local accounts except one vaulted break-glass account with alerting on use.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Ensure the built-in Admin account is configured with Multi-Factor Authentication (MFA) in accordance with the official </span><a href=\"https://docs.beyondtrust.com/rs/docs/two-factor-authentication#activate-two-factor-authentication\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BeyondTrust Two-Factor Authentication Guidelines</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Set the default Jump Item role in every group policy to No Access, and grant roles through policy rather than per user.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Scope API accounts to the minimum permission set, with a named automation owner for any account holding user or Jump Item management rights, and rotate API secrets on a schedule.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Keep privileged credentials in Password Safe or an external vault with credential injection rather than in the Remote Support Vault, and store only non-interactive service account credentials on the appliance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Apply default-deny outbound filtering from the appliance, allowing only BeyondTrust endpoints and the organization's own syslog and directory servers.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Part D: Logging and Detection Engineering</span></h4>\n<h3><span style=\"vertical-align: baseline;\">Logging and Visibility</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Forward appliance syslog to a SIEM over TLS with retention that covers a multi-month exposure window, and collect reverse-proxy or WAF and perimeter firewall logs for the appliance's address.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Export </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> session, team activity, and user audit reports on a schedule.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Detection Engineering</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Account and policy changes</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">user_changed</code><span style=\"vertical-align: baseline;\"> events that raise a Jump Item or team role; </span><code style=\"vertical-align: baseline;\">user_added</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">api_account</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">security_provider</code><span style=\"vertical-align: baseline;\"> events with no change ticket; any change to outbound events or syslog destinations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Authentication</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> success from residential-broadband or commercial-VPN address space, and administrative logins outside business hours.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Session activity</strong><span style=\"vertical-align: baseline;\">: file-transfer events, and sessions started by accounts whose roles changed during the window.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Request paths</strong><span style=\"vertical-align: baseline;\">: at the reverse proxy or WAF, paths outside the known Remote Support path set, including unknown .php paths and WebSocket upgrades from outside support staff and endpoint address ranges.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Anti-forensics:</strong><span style=\"vertical-align: baseline;\"> gaps in syslog forwarding from the appliance; an interruption bounded by a single session is a strong indicator of log tampering.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Indicators of Compromise (IOCs)</span></h3>\n<p><span style=\"vertical-align: baseline;\">To assist the wider community in hunting and identifying activity outlined in this blog post, we have included indicators of compromise (IOCs) in a <a href=\"https://www.virustotal.com/gui/collection/194e0cb2a231aaf8e6b4bee93437c85b434dda7e327a5f483b79f7ff5bfcaa5e\" rel=\"noopener\" target=\"_blank\">GTI Collection</a> for registered users.</span></p>\n<h4><span style=\"vertical-align: baseline;\">File Indicators</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Filename</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Description</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">SHA-256</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">app_84304470%2Ephp</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Staging Webshell</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">N/A</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">mangoapi.php</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SAWFLY Webshell</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">dc14e215269a93fdbc4c1a80b984c23faf7af0911c6dbb85309796a6f2ae95fb</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ingredi_ws</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BARECLAW Tunneler</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1f19b9a27d79c11bda00a1e8faf74a7fdd683d38ccef1b60df2fd0307e3aa462</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Detections</span></h3>\n<h4><span style=\"vertical-align: baseline;\">YARA Rules</span></h4>\n<pre class=\"language-markup\"><code>rule G_Hunting_Webshell_SAWFLY_1 {\n  meta:\nauthor = \"Google Threat Intelligence Group\"    \n  strings:\n    $b32 = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ234567\" ascii wide\n    $rc4 = \"range(0,255)\" ascii wide\n    $pack = \"pack('H*',\" ascii wide\n    $eval = \"@eval(\" ascii wide\n    $code404 = \"http_response_code(404)\" ascii wide\n  condition:\n    filesize &lt; 20KB and\n    all of them\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Backdoor_BARECLAW_1 {\n  meta:\n    author = \"Google Threat Intelligence Group\"\n\n  strings:\n    $s1 = \"[%s ws_socks5d] \" ascii wide\n    $s2 = \"--obfs requires --token\" ascii wide\n    $s3 = \"mux: %s (frame[%lu]: %s)\" ascii wide\n    $s4 = \"cannot create stream pump/writer thread (stream %d)\" ascii wide\n    $s5 = \"reject: bad or missing token from %s\" ascii wide\n    $s6 = \"listening on %s path=%s (token=%s obfs=%s max_tunnels=%d threads=%d)\" ascii wide\n    $s7 = \"--ws-path must start with '/'\" ascii wide\n    $b_xorshift = { 48 c1 e0 17 48 31 c1 48 89 f0 48 c1 e8 1a 48 31 f0 48 31 c8 48 c1 e9 11 48 31 c8 }\n  condition:\n    uint32(0) == 0x464c457f and (5 of ($s*)) or ($b_xorshift and (3 of ($s*)))\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Google Security Operations (SecOps)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google SecOps customers have access to these broad category rules and more under the Mandiant Hunting, Mandiant Frontline Threats, and Mandiant Intel Emerging Threats rule packs. The activity discussed in the blog post is detected in Google SecOps under the rule names:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Echo Pipes Base64 To Shell</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Base64 Encoded Shell Command Execution</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Low Severity Endpoint Detection Cluster on Host</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Download to tmp</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Network Connection to Staging Directory</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Acknowledgements</span></h3>\n<p><span style=\"vertical-align: baseline;\">We appreciate BeyondTrust for their collaboration against this threat.</span></p></div>"
