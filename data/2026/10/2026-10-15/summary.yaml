"overview": |
  この日は 8 件で、BigQuery の生成 AI 関数のコスト管理、Spanner のトランザクションメッセージング、そして脆弱性と脅威の動向分析が中心でした。とくにゼロデイ悪用の調査結果が加わっています。BigQuery では、生成 AI 関数 (AI.GENERATE、AI.IF、AI.CLASSIFY、AI.SCORE など) に対するトークンベースのコスト管理が一般提供となりました。これらの関数は大規模言語モデルを SQL に直接持ち込むため、1 本のクエリで数百万件のサポートチケットを分類したり、各レビューの感情をスコアリングしたりできますが、トークン課金であるため大規模なデータセットに広げるときは予算を先回りして管理する必要があります。Google Cloud の IAM のクォータ機構で管理される 4 つの日次クォータが、プロジェクト単位とユーザー単位の制御を提供します (ユーザー単位の上限は組織横断ではなくプロジェクト内の各ユーザーに適用されます)。クォータはグローバルで、使用量は全リージョンにまたがって合算されるため、見ていないリージョンでコストが積み上がることがありません。また出力側のクォータには「思考」トークンが含まれ、推論トークンも出力クォータに算入されます。データベースでは、Spanner キューが一般提供となりました。Spanner に直接組み込まれたネイティブなトランザクションメッセージング機能です。AI エージェントは自律的に払い戻しを行ったり在庫を管理したり、複数ステップのハンドオフやサブエージェントのオーケストレーションを行ったりするため、運用データベースで内部状態を保ちながら別のメッセージング / イベントキューシステムで非同期アクションをディスパッチする必要が生じますが、commit ポイントの異なる 2 つのシステムを管理することはエージェントシステムのトランザクション一貫性を壊します。データベースの状態更新だけ成功してディスパッチが失敗すれば、エージェントは行動を決めたのに実行されない状態になり、逆にディスパッチが成功して状態トランザクションがロールバックすれば、無効な状態に基づいて行動してしまいます。非同期のマルチエージェント調整では再試行・投機的実行・競合状態がこれらの障害を増幅し、開発者は複雑なアウトボックスパターンやべき等性レイヤー、データ整合ワーカーを作らざるを得ませんでした。Spanner キューではメッセージの作成がトランザクション内の単なる書き込み操作となり、エージェントの状態変更と意図したダウンストリームアクションがアトミックにまとめて commit されるか完全に失敗します。単一の読み取り / 書き込みトランザクション内で内部メモリや状態テーブルの更新とピアエージェントへのタスクのエンキューを同時に行え、Spanner の厳格な直列化可能性とグローバルな外部整合性に支えられます。キューメッセージは commit 時に即座にディスパッチすることも将来の配信としてスケジュールすることもできるため、遅延再試行・スケジュールされたエージェントのチェックイン・SLA エスカレーションタイマーといったパターンを、外部の cron スケジューラやポーリング基盤なしに実装できます。セキュリティでは、Cloud CISO Perspectives の 2026 年 10 月第 1 回として、耐量子暗号 (PQC) への取り組みと、CISO や経営層・政策担当者が組織の PQC 対応を進めるのを助ける新しい Gemini Notebook が紹介されました。PQC はこの 10 年でもっとも急を要するセキュリティの転換の 1 つである一方、研究が論文やエンジニアリングブログに散在して密度が高く、もっとも意識から外れやすいものでもあるという問題意識が示されています。脅威動向では、Google Threat Intelligence Group (GTIG) が脆弱性の開示と悪用の統計から AI の影響を評価したレポートが公開されました。1 か月あたりの脆弱性開示件数は 2026 年 1 月の 5,045 件から 7 月には 10,477 件へ倍増し、8 月はさらに増えて 10,740 件とピークに達しました。悪用された脆弱性は 2025 年の月平均 10.5 件から、2026 年 1〜8 月は月平均 18 件へほぼ倍増し、ゼロデイの悪用は月平均 8 件から 11 件へわずかに増加しています。AI を活用して発見された脆弱性は、低リスクの割合が低く、中リスクおよびリモートコード実行 (RCE) につながるものの割合が高くなっており、AI は脆弱性の発見と悪用のペースだけでなく、見つかる脆弱性の種類やリスクプロファイルも変えていると分析されています。GTIG は短中期的に発見と悪用が増え続けると予測し、優先順位のないパッチの一括適用から脅威インテリジェンスに基づくトリアージへ移り、標的型のエッジ防御とエージェントによる自動修復を組み合わせる必要があると述べています (リスク評価には CVSS の重大度ではなく GTIG 独自の脆弱性リスク評価を使用、分析期間は 2025 年 1 月 1 日から 2026 年 8 月 31 日)。日本の調査では、Google Cloud Japan が Google Cloud のイベント参加経験のある企業ユーザーを対象に 2026 年 6 月 22 日から 7 月 22 日にオンラインアンケートを実施し、1,231 名 (約 1,000 社) の回答をまとめた「2026 年度版クラウド・インフラ最新動向」が公開されました。IT インフラの課題のトップはサイバー攻撃への対応で 32.3% (回答者の約 3 人に 1 人)、2 位以降はレガシーシステムの老朽化と EOS 対応 26.9%、運用管理の属人化 26.5%、AI など新技術への対応 24.7% と続きます。2024 年の調査では上位のほとんどが属人化・老朽化・コストでしたが、2026 年はサイバー攻撃への対応が 1 位となり、2024 年の上位 5 項目に入っていなかった AI など新技術への対応が 4 位に入りました。主要なインフラにパブリッククラウドを選んだ回答者は 65.8%、今後の戦略で最も多いのはマルチクラウドの 41.0% で、現在マルチクラウドを使っている回答者の 90.2% が今後も続けると答えています。オンプレミス中心の層では 43.3% がクラウドへ移る予定で、その 7 割以上はまずハイブリッドから始めます。VMware を利用している回答者は 33.7% で、そのうち利用を徐々に減らす 37.6% と別のインフラに移す 18.6% を合わせると 56.1% となり 2024 年の 48.8% から 7.3 ポイント増えました。一方で今の環境を使い続けるという回答も 28.7% あり、移行する層としない層に分かれています。できる限り早く別のインフラに移すという回答は 11.8% から 18.6% に増えました。なお回答者の 44.7% がすでに AI 駆動開発を取り入れていると回答しています。脅威インテリジェンスでは、BeyondTrust が 10 月 15 日に公開した BeyondTrust Remote Support (旧 Bomgar) アプライアンスの脆弱性 CVE-2026-102764 について、Mandiant の調査結果が公開されました。この脆弱性は悪用に成功すると任意のファイルをアップロードできるもので、インシデント対応の中で、中国と関係があると見られるスパイ活動の脅威アクター ARMORY CASTLE (旧称 UNC5221) が 2026 年 8 月下旬にこれをゼロデイとして悪用していた証拠が確認されました。記事では、悪用後に権限を昇格して侵害したアプライアンスへ永続的なアクセスを確立した手口と、防御側向けの具体的な指針が示されています。ARMORY CASTLE をはじめとする脅威アクターは脆弱性が公表されると広範で機会的な悪用を行ってきた経緯があるため、公開後の広範な悪用に備えるべきだと注意を促しています。悪用の痕跡は LUKS で暗号化された領域からしか参照できない access、syslog、messages、thin-scc、brain、SSL の各ログに残っていたとしています。リリースノートでは、Apigee Edge for Public Cloud と Apigee 統合ポータルのシングルサインオン (SSO) の修正が告知されました。ポータルの SSO エンドポイントが非推奨の TLS 1.1 接続を意図せず受け付けていた問題が修正され、TLS 1.2 以上を厳格に強制するようになりました (Bug ID 560310696)。また Compute Engine では、ゾーンのブートディスクをクローンして Hyperdisk Balanced High Availability ボリュームを含むリージョンディスクを作成できる機能がプレビューとなりました。
