    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">執筆者: Robin Grunewald、Supriya Mazumdar、Kelli Vanderlee</span></p>\n<hr />\n<h4><strong style=\"vertical-align: baseline;\">はじめに</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Threat Intelligence Group（GTIG）は、脆弱性の開示と悪用の統計情報を調査し、脆弱性の脅威ランドスケープに対する AI の影響を評価しています。AI によって、脆弱性の発見と悪用のペースだけでなく、発見される脆弱性の種類や典型的なリスク プロファイルも目に見えて変化していることがわかりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">主な調査結果: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">脆弱性の開示が倍増: </strong><span style=\"vertical-align: baseline;\">1 か月あたりに開示された脆弱性の数は、2026 年 1 月には 5,045 件でしたが、2026 年 7 月には 10,477 件と倍増し、2026 年 8 月にはさらに増加して 10,740 件となりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">脆弱性の悪用がほぼ倍増:</strong><span style=\"vertical-align: baseline;\"> 悪用された脆弱性の数は、2025 年には月平均 10.5 件でしたが、2026 年 1 月から 2026 年 8 月までの期間には月平均 18 件に増加しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ゼロデイ脆弱性の悪用がわずかに増加:</strong><span style=\"vertical-align: baseline;\"> ゼロデイ脆弱性の悪用は、2025 年には月平均 8 件でしたが、2026 年 1 月から 2026 年 8 月までの期間には月平均 11 件に増加しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI はより重大な脆弱性を検出: </strong><span style=\"vertical-align: baseline;\">AI を活用して発見した脆弱性については、低リスクの脆弱性の割合が低く、中リスクの脆弱性とリモートコード実行（RCE）につながる脆弱性の割合が高くなりました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">GTIG は、脆弱性の発見と悪用が短中期的に増加し続けると予測しています。脆弱性の迅速な発見と悪用によるリスクの増大に対抗するには、優先順位がないパッチの一括適用から、脅威インテリジェンスに基づくトリアージに移行し、標的型のエッジ防御とエージェントによる自動修復を組み合わせる必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">範囲と手法</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG のこの分析では、2025 年 1 月 1 日から 2026 年 8 月 31 日までに開示された脆弱性の傾向を調査しています。このデータセットは、脆弱性とともに、悪用の影響、</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/separating-signal-noise-how-mandiant-intelligence-rates-vulnerabilities-intelligence\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GTIG の脆弱性リスク評価</span></a><span style=\"vertical-align: baseline;\">、実際の悪用など、重要な運用上の側面も追跡しています。このブログ記事でリスク評価に言及する場合、</span><a href=\"https://nvd.nist.gov/vuln-metrics/cvss\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVSS の重大度</span></a><span style=\"vertical-align: baseline;\">ではなく、GTIG の脆弱性リスク評価を使用しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ベースラインのモニタリング対象期間は 20 か月間（2025 年 1 月～2026 年 8 月）ですが、このレポートでは特に、増加速度と新たな脅威ベクトルに焦点を当てています。</span></p>\n<p><span style=\"vertical-align: baseline;\">この調査では、共通脆弱性識別子（CVE）の開示率と悪用率の両面から、サイバーセキュリティ環境全体における AI の影響を評価することを目的としています。また、AI / 大規模言語モデル（LLM）の運用スタックを標的とする脆弱性についても検証しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">2026 年に CVE の開示が倍増</strong></h4>\n<p><span style=\"vertical-align: baseline;\">脆弱性の開示件数は、2026 年 1 月には 5,045 件でしたが、7 月には 10,477 件と倍増し、8 月には 10,740 件とピークに達しました（図 1）。</span></p>\n<p><strong style=\"vertical-align: baseline;\">脅威リスクと膨らんだ CVE 件数の区別</strong></p>\n<p><span style=\"vertical-align: baseline;\">ただし、脅威インテリジェンスのコンテキストがなければ、2026 年を通じた元の開示件数は誤解を招く可能性があります。オープンソース エコシステム全体で CVE Numbering Authority（CNA）の割り当てポリシーが自動化されているため、ベースラインの数値が膨らむ可能性があります。たとえば、説明に「Linux カーネル」のみが含まれる脆弱性により、2026 年 1 月から 2026 年 8 月までの間に約 5,000 件の CVE が生成されましたが、実際に悪用されたゼロデイは確認されていません。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities disclosed, January 2025 - August 2026 (Source: GTIG)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Count_of_vulnerabilities_disclose.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: 開示された脆弱性の数、2025 年 1 月～2026 年 8 月（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">リスク評価の観点から見ると、最も興味深い増加は高リスクの脆弱性で発生しています。高リスクの脆弱性の開示件数は、2026 年 1 月には 131 件でしたが、2026 年 8 月には 350 件へと急増し、167% の増加を記録しました（図 2）。高リスクの脆弱性は、開示されたすべての脆弱性のうち、依然としてわずかな割合（2026 年 8 月時点で 3%）を占めています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities disclosed by GTIG vulnerability risk rating, January 2025 - August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_Count_of_vulnerabilities_disclose.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 2: GTIG の脆弱性リスク評価で開示された脆弱性の数、2025 年 1 月～2026 年 8 月（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2026 年を通じた高リスクの脆弱性の増加は、影響を受けるベンダーの増加と、ベンダーの開示サイクルの集中という 2 つの複合的な要因によるものです。ソフトウェア エコシステム全体で、ベースラインの高リスクの開示件数は、2025 年半ばには月あたり約 65 件でしたが、2026 年半ばには月あたり約 135 件となり、過去 1 年間で 2 倍以上に増加しました（図 3）。このベースラインの上昇に加えて、図 3 では、特定のベンダーが例外的に多数の CVE を報告し、月間件数が過去最高を記録した 2 つの期間が際立っています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TOTOLINK:</strong><span style=\"vertical-align: baseline;\"> 4 月と 5 月に、一般消費者向けルーターのファームウェアに対する大規模な調査結果が開示され、75 件の高リスクの欠陥が追加されたことで、コマンド実行の脆弱性が年半ばに急増しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle と Linux: </strong><span style=\"vertical-align: baseline;\">6 月、7 月、8 月に、WebLogic や Coherence などのミドルウェア全体に適用される Oracle の四半期ごとの Critical Patch Update（CPU）と、Linux カーネル ネットワーク ドライバのアドバイザリが組み合わさったことで、8 月だけで 128 件の高リスクの脆弱性（高リスクの開示全体の約 37%）が発生し、リモートコード実行の脆弱性の増加に直接つながりました。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities High Risk disclosed by Vendor, January 2025 to August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3_Count_of_vulnerabilities_High_Ris.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 3: ベンダーが開示した高リスクの脆弱性の数、2025 年 1 月～2026 年 8 月（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">実際の悪用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG は、2026 年 1 月から 8 月までの期間に、開示され、悪用された 141 件の脆弱性を記録しました。これは、2025 年全体で悪用された脆弱性の総数（127 件）を上回っています。実際の悪用は、2025 年には月平均 10.5 件でしたが、2026 年には月平均 18 件に増加しました。ただし、開示された脆弱性のうち、実際に悪用されたものの割合は依然として極めて低いことに注意する必要があります。2026 年に開示されたすべての脆弱性のうち、実際に悪用が確認されたものはわずか 0.23%（約 431 件に 1 件）であり、月あたりに換算すると、開示された脆弱性が数千件であるのに対し、悪用されたものは数十件程度です。つまり、月ごとの悪用件数は、ベンダーの開示サイクルや脅威アクターのキャンペーンの急増など、他の要因の影響を受けやすくなります。2026 年 5 月以降、CVE の悪用の拡大（指数化された増加率 +127%）が、脆弱性開示の増加（指数化された増加率 +128%）とほぼ一致し、脆弱性全体の状況を上回るのではなく、それに合わせて拡大するという変化が見られます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of all vulnerabilities exploited, by n-days and zero-days, January 2025 to August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_5_Count_of_all_vulnerabilities_expl.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 4: N デイとゼロデイ別の、悪用されたすべての脆弱性の数、2025 年 1 月～2026 年 8 月（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">ゼロデイの悪用はほぼ横ばい</strong></h4>\n<p><span style=\"vertical-align: baseline;\">悪用されたゼロデイの数は、2025 年の月平均 8 件から 2026 年の月平均 11 件へとわずかに増加しました。1 か月あたりに特定されたゼロデイの数は、2026 年半ばまでベースライン レベル（8～12 件）付近でしたが、8 月には 22 件に急増しました（図 4）。ゼロデイの悪用は、依然として、開示されたすべての脆弱性のうち、ごく一部を占めるにすぎませんが、2026 年 1 月から 2026 年 8 月までに確認された、悪用されたすべての脆弱性の大部分（62%）を占めています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">脅威アクターは N デイの悪用でより多くの成功を収めているか？</strong></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターは、新しいゼロデイを発見するよりも、LLM や AI ツールを使用して、製品バージョン、パッチ、脆弱性開示の発表、概念実証（POC）コードの違いの分析を自動化し、N デイを迅速に武器化する方が、簡単または効率的であると考えている可能性があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">CVE の悪用はよりリスクの高い脆弱性に向かう傾向</strong></p>\n<p><span style=\"vertical-align: baseline;\">ゼロデイの悪用率はわずかに増加したのみであることから、2026 年 1 月から 2026 年 8 月にかけての脆弱性悪用の増加の主な要因は、N デイの迅速な武器化に集中していると考えられます。特に、高リスクの脆弱性の悪用は、2025 年には 28 件でしたが、2026 年 1 月～8 月には 75 件と 2 倍以上に増加しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities exploited in the wild by GTIG vulnerability risk rating, January 2025 - August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_6_Count_of_vulnerabilities_exploite.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 5: GTIG の脆弱性リスク評価別に見た、実際に悪用された脆弱性の数、2025 年 1 月～2026 年 8 月（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">攻撃対象領域別の悪用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">2026 年 1 月から 2026 年 8 月までに悪用された脆弱性のうち、エッジおよびセキュリティ アプライアンスに影響を及ぼした脆弱性は 14%、エンタープライズ ディレクトリおよびコラボレーション ハブに影響を及ぼした脆弱性は 11% でした。エッジ ゲートウェイは、初期アクセスの主要なベクトルとなっています。2026 年 1 月から 8 月までに悪用されたエッジの欠陥の 65% 以上が、高 / 重大の脅威リスク評価に該当しており、攻撃者は認証されていない公開管理インターフェースを積極的に標的にして、企業の EDR エージェントの盲点を突いています。</span></p>\n<p><span style=\"vertical-align: baseline;\">CVE の発見数は急増しているものの、攻撃者の悪用は依然として境界アプライアンスと公開された企業サービスに集中しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">特定のカテゴリの増加率を比較</strong></h4>\n<p><span style=\"vertical-align: baseline;\">月ごとの元の数をグラフにすると、たとえば 8 月に発見されたゼロデイが 1 桁であるのに対し、開示された脆弱性が 10,000 件を超えるなど、大きな差があるため、相対的な勢いがわかりません。脆弱性ティア間の増加率を直接比較できるように、図 7 では 4 つの指標を 2025 年 1 月のベースライン 0 に指数化し、3 か月の移動平均増加率のトレンドラインを示しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #1a73e8;\"><strong style=\"vertical-align: baseline;\">CVE 開示件数全体（128%）</strong></span><span style=\"vertical-align: baseline;\">: 前述のとおり、元の CVE 開示件数は 2026 年 1 月から 2026 年 8 月にかけて倍増しました。3 か月の移動平均増加率から、2026 年には CVE の開示が着実に加速していることがわかります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #f9ab00;\"><strong style=\"vertical-align: baseline;\">開示された高リスクの脆弱性（241%）</strong></span><span style=\"vertical-align: baseline;\">: データセット全体で最も急激な増加を示し、2026 年 8 月までに初期ベースラインの約 3.5 倍（241% 増加）に達しています。Linux、Oracle、Totolink を除くと、2025 年 1 月から 2026 年 8 月までの増加率はわずか 128% でした。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #1e8e3e;\"><strong style=\"vertical-align: baseline;\">CVE の実際の悪用（127%）</strong></span><span style=\"vertical-align: baseline;\">: 2026 年 1 月から 8 月にかけて、CVE の悪用は CVE の開示全体とほぼ同じ割合で増加していますが、3 か月の移動平均トレンドラインは、悪用の増加が 2026 年第 2 四半期まで本格化しなかったことを示しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #d93025;\"><strong style=\"vertical-align: baseline;\">ゼロデイの悪用（59%）</strong></span><span style=\"vertical-align: baseline;\">: 2026 年半ばまではベースライン レベル（月あたり 8～12 件のゼロデイ）付近でしたが、8 月には 22 件に達しました。この増加は 3 か月の移動平均増加率に反映されており、2026 年の夏に上昇傾向を示し始めました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">この視覚的に明確な違いでは、2026 年の脆弱性悪用の緩やかな増加が、新たなゼロデイの急増ではなく、実際の脆弱性における高リスクのエクスプロイトの迅速かつ標的を絞った武器化によって引き起こされていることが明確に示されています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 Month Rolling Average of % Growth, Indexed to 0% at January 2025 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_6_-3_Month_Rolling_Average_of__Grow.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 6: 2025 年 1 月の 0% に指数化した 3 か月間の移動平均増加率（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">ハンターとしての AI: AI を活用した脆弱性の発見</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">検出手法と帰属特定の現実</strong></p>\n<p><span style=\"vertical-align: baseline;\">現在の公開データでは、2 つの構造的な要因により、AI によって発見された脆弱性が大幅に過小評価されています。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">標準化されたメタデータの欠如</strong><span style=\"vertical-align: baseline;\">: 公開 CVE リポジトリには、AI への帰属を示す統一されたメタデータタグがまだないため、手動でヒューリスティックな追跡を行う必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ファーストパーティとクラウドのサイレント パッチ適用</strong><span style=\"vertical-align: baseline;\">: CVE の割り当ては通常、顧客によるパッチ適用の調整が必要なオンプレミス ソフトウェアやサードパーティ ソフトウェアのために予約されているため、大手のクラウド プロバイダや SaaS プロバイダは日常的に、正式な CVE ID をリクエストすることなく、AI が検出した脆弱性を本番環境で直接修正しています。また、多くの調査結果は、確立された協調的な脆弱性の開示（CVD）の期間中、公開が制限されます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">しかし、多層検証プロセスを使用することで、自律型エージェントによって表面化する可能性が高い脆弱性を特定できます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">検証済みのラボとベンダーの台帳</strong><span style=\"vertical-align: baseline;\">: フロンティア AI 研究プログラムから確認済みの開示情報を直接取り込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アドバイザリとリリースの解析: </strong><span style=\"vertical-align: baseline;\">サイバーセキュリティ インフラストラクチャ セキュリティ庁（CISA）のアドバイザリ、MITRE の記録、セキュリティに関するベンダーの公開情報をプログラムでモニタリングし、根本原因の発見や PoC の合成が自律型 AI エージェント（Hacktron AI、AISLE など）によるものであることを明示的に認めているものを特定します。</span></p>\n</li>\n</ol>\n<p><strong style=\"vertical-align: baseline;\">リスク プロファイルの違い: AI による発見と従来型の発見</strong></p>\n<p><span style=\"vertical-align: baseline;\">AI が発見した可能性が高いと特定できた、開示済みの脆弱性を分析すると、人間やスキャナによる従来型の発見とは構造的に異なることが示唆されます。AI エージェントは、低リスクの脆弱性を比較的少なく、中リスクと高リスクの脆弱性を比較的多く検出するために使用されています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">GTIG の CVE リスク評価</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI が発見していない CVE</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI が発見した CVE</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">低</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">69%</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">39%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">中</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">28%</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">58%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">高</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3%</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4%</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">表 1: リスク評価別の脆弱性の割合 - AI による発見と AI 以外による発見の比較 - 2026 年 1 月～8 月（出典: GTIG）</span></p>\n<p><span style=\"vertical-align: baseline;\">従来の CVE 開示は、重大度の低い検出結果が大部分を占めています（低脅威リスクが 69%、中脅威リスクが 28%）。対照的に、AI が発見した脆弱性ではこの分布が逆転します。58% が中脅威リスクに該当し（ベースラインの 2 倍以上）、低リスクの検出結果は 39% に減少します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この分布は、研究プログラムでこれらのシステムの対象範囲設定とデプロイがどのように行われているかを大きく反映していると考えられます。研究者は、外観上の欠陥やコンプライアンス警告を検出するための広範な自動スキャンを実行するのではなく、自律型エージェントに重要インフラと機密性の高い権限境界の監査を意図的に指示し、影響の大きい検出結果に焦点を当てています。Mandiant は、クライアントのコードベースのポイントインタイム評価で専門的な</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Vulnerability Discovery Harness</span></a><span style=\"vertical-align: baseline;\">（AVDH）を使用した場合にも、同様の結果が得られたことを報告しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Share of vulnerabilities per exploitation consequence - AI vs. Non AI discovery\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_8_Share_of_vulnerabilities_per_expl.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 7: 悪用の結果ごとの脆弱性の割合 - AI による発見と AI 以外による発見（出典: GTIG）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI が発見した脆弱性と AI が発見していない脆弱性の違いは、悪用の結果という点でも明らかです。リモートコード実行（RCE）につながる脆弱性は、AI が発見した脆弱性のうち、ちょうど 50% ですが、広範な CVE エコシステム全体ではわずか 26% です。逆に、AI エージェントは影響の小さいカテゴリでは脆弱性発見率が低く、情報開示（8% 対 18%）とデータ操作（5% 対 9%）の脆弱性発見率は、AI が発見したと特定されなかった脆弱性の半分以下でした。</span></p>\n<p><span style=\"vertical-align: baseline;\">コード実行に集中しているのは、フロンティア エージェントの動作方法に起因していると考えられます。自律システムは、コア C/C++ ライブラリ、ランタイム、ハイパーバイザにわたる複雑なマルチステップのセマンティック コードパスをナビゲートするように設計されています。AI モデルは、ファジング ハーネスの合成、メモリ状態のモデル化、不明瞭なエッジケース ロジックの連鎖により、従来の静的</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アナライザ</span></a><span style=\"vertical-align: baseline;\">では一貫して検出できなかったメモリ破損（バッファ オーバーフロー、解放後の使用）やロジック バイパスを特定することに優れています。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI が発見した脆弱性の悪用が確認されたことは、現時点では、確立された傾向というよりは初期の兆候ですが、AI が発見した欠陥によるリスクの増大が単なる理論上の話ではないことを示しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">注目すべき事例は、</span><a href=\"https://www.hacktron.ai/blog/cve-2026-1731-beyondtrust-remote-support-rce\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-1731</span></a><span style=\"vertical-align: baseline;\"> です。これは、サードパーティのリサーチ エージェント（Hacktron AI）が自律的に発見した、BeyondTrust Privileged Remote Access（PRA）および Remote Support の未認証 OS コマンド インジェクションの欠陥です。開示後、GTIG は、脅威アクターがこの脆弱性を標的型初期アクセス キャンペーンで武器化し、企業の境界をバイパスしていることを確認しました。具体的には、GTIG は、開示から 4 日以内にこの脆弱性を悪用する脅威クラスタを観察し、公開から 7 日以内にさらに 5 つの脅威クラスタを観察しました。GTIG は、これらの脅威アクターが、権限昇格、データの引き出し、二次ペイロード（SNOWLIGHT、SPARKRAT、クリプトマイナーなど）のドロップなど、悪用後にさまざまな活動を行っていることを確認しました。この運用上の衝突は、脅威アクターが積極的に悪用しようとしている影響の大きい脆弱性を、防御 AI エージェントが発見していることを浮き彫りにしています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AI を狙う: AI / LLM 運用スタックを標的とする脆弱性</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">AI スタックの脆弱性のアーキテクチャの内訳</strong></p>\n<p><span style=\"vertical-align: baseline;\">企業による生成 AI の導入が加速するなかで、セキュリティ研究者と攻撃者の関心は、基盤となる AI 運用スタックの脆弱性にも向けられています。2025 年 1 月から 2026 年 8 月までのモニタリング期間中、GTIG は AI 関連の CVE 開示を累計 2,076 件追跡しました。2026 年 1 月から 2026 年 8 月までの期間だけでも、8 つのコア アーキテクチャ レイヤで 1,500 件を超える脆弱性が特定されています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイヤ / アーキテクチャ カテゴリ</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">主なテクノロジーとフレームワーク</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">主な脆弱性ベクトル</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">2026 年</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AI オーケストレーションとエージェント フレームワーク</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Flowise、Langflow、LangChain、Dify、LlamaIndex、AutoGen、CrewAI、Semantic Kernel、Letta、MCP、Pydantic-AI</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">信頼できないワークフローのシリアル化、安全でない Python ツールの呼び出し、サーバーサイド テンプレート インジェクション（SSTI）による任意のコード実行（RCE）とコマンド インジェクション。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">782</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AI ウェブアプリおよびポータル</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Open-WebUI、AnythingLLM、FastGPT、LibreChat、RAGFlow、Gradio、Streamlit、LobeChat、Chainlit、GPT4All</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">チャット プロキシを介したサーバーサイド リクエスト フォージェリ（SSRF）、マークダウン レンダリングにおける保存型 XSS、ドキュメント アップロード ハンドラを介したローカル ファイル インクルード（LFI）。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">230</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">推論とサービングのインフラストラクチャ</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">vLLM、Ollama、LiteLLM、Llama.cpp、Triton（NVIDIA）、Ray、TGI、SGLang、TensorRT-LLM、BentoML、LocalAI</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">認証されていない管理 API、モデル チェックポイントのシリアル化解除、テンソル バックエンドでのメモリ破損、マルチテナント リソースの枯渇。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">212</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">モデル セキュリティ アドバイザリ</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">基盤モデルの重み、システム プロンプト、ガードレール、評価ツール（Garak、Lakera、Promptfoo）</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">直接および間接プロンプト インジェクション、システム プロンプトの引き出し、ガードレールのバイパス、トレーニング データ ポイズニング、エージェントの過剰な自律性。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">106</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ML フレームワークおよびハブ</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">PyTorch、Hugging Face（Hub / Datasets）、Transformers、ONNX Runtime、TensorFlow、Diffusers、DeepSpeed、Safetensors、Keras</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">メモリの安全性の違反（ヒープ オーバーフロー、C++ テンソル演算子での範囲外読み取り）や、悪意のあるモデル / データセット アーカイブの抽出による任意のファイルの上書き。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">99</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">フロンティア モデル</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Anthropic、Gemini、OpenAI</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">検証されていない CLI シェル補間と信頼できないワークスペース構成の暗黙的な実行による任意のコード実行（RCE）とコマンド インジェクション、Git ワークツリー ディレクトリの混乱とメモリツールのシンボリック リンク トラバーサルによるサンドボックス回避、間接プロンプト インジェクションによるマークダウン画像レンダリングと制限が緩いネットワーク取得許可リストによる密かなデータ引き出し。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">97</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">MLOps とテスト追跡</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">MLflow、ClearML、Weights &amp; Biases（W&amp;B）、Kubeflow、Langfuse、Langsmith、Arize、Phoenix、Helicone</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">任意のファイルの上書き（LFI / RFI）、認証されていないリモート トラッキング サーバーの乗っ取り、共有テストレジストリ内のアーティファクトの削除。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">39</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ベクトル データベースおよび検索</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Milvus、Qdrant、ChromaDB、Weaviate、Pinecone、FAISS、LanceDB、PGVector、Marqo、Vespa</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">認証されていないコレクションの操作、クラスタリング / インデックス作成プラグインを介したリモートコード実行、メタデータ SQL / JSON クエリ インジェクション。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">19</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">表 2: AI システムを標的とした脆弱性の内訳（出典: GTIG）</span></p>\n<h4><strong style=\"vertical-align: baseline;\">新たな戦場: オーケストレーションと推論</strong></h4>\n<p><span style=\"vertical-align: baseline;\">2026 年 1 月から 8 月にかけて、AI アプリケーションの脆弱性の開示は、エージェント オーケストレーション フレームワーク、バックエンド サービング インフラストラクチャ、エンタープライズ AI ゲートウェイの 3 つの主要領域に集中していました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェント オーケストレーションが主なチョークポイントに</strong><span style=\"vertical-align: baseline;\">: オーケストレーション ミドルウェアは、AI 関連のすべての欠陥の 50% を占め、2026 年には開示件数が 347% 急増しています。ビジュアル ワークフロー ビルダー（Flowise、Langflow など）や自律型フレームワークは、環境とのやり取りを容易にするために、動的なコード実行ノードをデプロイすることがよくあります。攻撃者は、プロンプト インジェクションや細工されたワークフロー JSON を介してこれらのノードを悪用し、実行ループをハイジャックして、自然言語プロンプトを認証されていないリモートコード実行に変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一元化された AI ゲートウェイとクラウドのラテラル ムーブメント</strong><span style=\"vertical-align: baseline;\">: 企業の AI ゲートウェイは、壊滅的な二重脅威ベクトルとなります。アプリケーション レイヤでは、侵害されたゲートウェイにより、サードパーティのアプリケーション プログラミング インターフェース（API）キーや、個人を特定できる情報（PII）または独自のソースコードを含むプライベート プロンプト ストリームが漏洩します。インフラストラクチャ レイヤでは、このようなゲートウェイが、攻撃者がデータベースの認証情報を収集し、内部のクラウド環境へのラテラル ムーブメントを行うための最初の足がかりとなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新たな境界としての推論ゲートウェイ</strong><span style=\"vertical-align: baseline;\">: バックエンド サービング インフラストラクチャ（vLLM、Triton、LiteLLM、Ollama など）全体で、2026 年に 212 件の脆弱性が開示されました。これらの欠陥の約 4 分の 1（24%）は、認証されていない API エンドポイントまたはサーバーサイド リクエスト フォージェリ（SSRF）に直接起因しています。これにより、リモートの攻撃者は、境界ファイアウォールをバイパスしたり、コストの高い GPU コンピューティング リソースを枯渇させたり、独自のモデル チェックポイントを抽出したりするための直接的なエントリ ポイントを得ることができます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">AI ミドルウェアの実際の脆弱性悪用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI インフラストラクチャのゼロデイ脆弱性の悪用はまだ確認されていませんが、脅威アクターは、公開されているミドルウェアで新たに開示された脆弱性を積極的に悪用しています。しかし、累積 2,076 件の開示のうち、実際に悪用されたことが確認されている脆弱性はごくわずかです。これらの事例の中で、脅威リスクが高いと評価され、認証されていない RCE、コマンド インジェクション、任意のファイル書き込みが行われるものをいくつか特定しました。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://labs.cloudsecurityalliance.org/research/csa-research-note-litellm-cve-2026-42271-ai-gateway-exploita/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-42271（BerriAI LiteLLM）</strong></a><span style=\"vertical-align: baseline;\">: Model Context Protocol（MCP）サーバーのプレビュー エンドポイント（</span><code style=\"vertical-align: baseline;\">POST /mcp-rest/test/connection</code><span style=\"vertical-align: baseline;\">）におけるコマンド インジェクションにより、ホストの乗っ取りや API 認証情報の盗難が行われます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://labs.cloudsecurityalliance.org/research/csa-research-note-langflow-cve-2026-5027-active-exploitation/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-5027（Langflow）</strong></a><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">POST /api/v2/files</code><span style=\"vertical-align: baseline;\"> アップロード ハンドラにおけるパストラバーサル ファイルの書き込みにより、リモートの脅威アクターが不正なファイル（cron ジョブ、Secure Shell（SSH）キーなど）をホストにドロップできるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.cisa.gov/news-events/alerts/2025/05/05/cisa-adds-one-known-exploited-vulnerability-catalog\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2025-3248（Langflow）</strong></a><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">/api/v1/validate/code</code><span style=\"vertical-align: baseline;\"> で </span><code style=\"vertical-align: baseline;\">exec()</code><span style=\"vertical-align: baseline;\"> を介して認証されていない Python コードが挿入され、即時の RCE が可能になります。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">今後の展望</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG は、脆弱性の発見と悪用の割合が短中期的に増加し続ける可能性が高いと予測しています。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access\"><span style=\"text-decoration: underline; vertical-align: baseline;\">5 月の AI 脅威トラッカー</span></a><span style=\"vertical-align: baseline;\">などの他の調査では、生成 AI で開発されたゼロデイ エクスプロイト スクリプトを所有する脅威アクターの最初の既知の事例を報告しました。実際の攻撃が実行される前の作戦計画段階で阻止されましたが、エクスプロイトの構造的アーティファクトを分析したところ、高い信頼度の LLM 生成マーカーが検出されました。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">9 月の AI 脅威トラッカー</span></a><span style=\"vertical-align: baseline;\">では、脅威アクターがリソースを共有し、エージェント型の脆弱性発見ツールのプロトタイプを作成していることを指摘しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI によって強化された脆弱性発見と、AI インフラストラクチャおよびテクノロジーを標的とした脆弱性の両方について、一般公開されているデータはまだ初期段階にあります。それでも、AI が脆弱性の発見に貢献していることを示す兆候は現れ始めています。自律型リサーチ エージェントは、重要な攻撃対象領域を対象とするように指示された場合、重大度の高い欠陥を検出する優れた能力を発揮します。エージェント ワークフローは、複雑なセマンティック コードパスについて推論し、動的な証明ハーネスを合成することで、コア ライブラリやランタイムにおけるメモリ破損やロジック バイパスを特定することに優れています。これにより、高度な攻撃者が積極的に悪用しようとする欠陥の正確な種類が明らかになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターが AI システムの脆弱性を実際に悪用し始めているため、組織は AI セキュリティを後回しにできません。この環境全体を保護するには、即時の封じ込め戦略、自律型エージェント ワークロードのサンドボックス化、リスクベースの脆弱性の管理の実装により、新たな境界を防御する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">現時点では、脅威アクターがゼロデイと N デイの悪用をスケールアップする前に、サイバーセキュリティ コミュニティが防御を強化できる側面は 2 つあります。第一に、組織は、開示された脆弱性の優先順位付けと修復の方法をモダナイズする必要があります。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ai-assisted-vulnerability-management\"><span style=\"text-decoration: underline; vertical-align: baseline;\">別のブログ投稿</span></a><span style=\"vertical-align: baseline;\">で、Mandiant は、防御者が攻撃者による攻撃までの時間の短縮に対抗できるよう、AI を活用した脆弱性管理を実装するためのブループリントを提示しました。第二に、他の企業や消費者にソフトウェアやサービスを提供する組織は、AI で強化されたコードレビューを社内で積極的に実施し、本番環境にリリースされて悪用可能な脆弱性になる前に欠陥を特定して修正する必要があります。</span><a href=\"https://cloud.google.com/security/ai-threat-defense\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Threat Defense</span></a><span style=\"vertical-align: baseline;\"> に統合した、</span><a href=\"https://cloud.google.com/security/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> などのエージェント型防御機能を活用して、デベロッパー ワークフロー全体でコードを継続的に監査してパッチを適用することが重要になります。プレリリース版の AI コードレビューが標準的なベスト プラクティスになれば、脆弱性の開示件数の増加率は最終的に鈍化する可能性があります。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Google Threat Intelligence Group</strong></p></div>"
