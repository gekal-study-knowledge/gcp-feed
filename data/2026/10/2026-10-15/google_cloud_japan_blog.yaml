  "e59d1d3572dcd5f148c2b2787f466588":
    "id": "e59d1d3572dcd5f148c2b2787f466588"
    "title": "2026 年度版クラウド・インフラ最新動向。最優先はサイバー攻撃、次いでレガシー・属人化対応と AI 対応"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/latest-trends-in-cloud-and-infrastructure-2026-edition/"
    "published": "2026-10-15 11:00:00"
    "fetched": "2026-10-15 12:18:31"
    "summary": "<div class=\"block-paragraph\"><p>こんにちは、Google Cloud Japan です。</p><p>2024 年の調査では、インフラ担当者の悩みの上位を運用管理の属人化や老朽化、コストが占めていました。2026 年の調査では、その顔ぶれが入れ替わっています。</p><p>Google Cloud Japan は、Google Cloud のイベントに参加したことがある企業ユーザーを対象にオンライン アンケートを実施し、1,231 名（約 1,000 社）の回答を「2026 年度版クラウド・インフラ最新動向」にまとめました。調査期間は 2026 年 6 月 22 日から 7 月 22 日です。2024 年の調査と比べながら、主な結果を紹介します。</p><p><a href=\"https://cloud.google.com/resources/content/intl/ja-jp/infra-trend-survey?e=48754805&amp;hl=ja\"><b>▶ 2026 年度版クラウド・インフラ最新動向をダウンロードする</b></a></p><h3><b>インフラ課題の顔ぶれが入れ替わった</b></h3><p>利用中の IT インフラの課題でトップになったのは、サイバー攻撃への対応で 32.3% でした。回答者のおよそ 3 人に 1 人が選んでいます。2 位以降は、レガシー システムの老朽化と EOS（サポート終了）対応（26.9%）、運用管理の属人化（26.5%）、AI など新技術への対応（24.7%）と続きます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"02-chart-infra-issues-2024-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/02-chart-infra-issues-2024-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>2024 年は上位のほとんどを運用管理の属人化や老朽化、コストが占めていましたが、2026 年はサイバー攻撃への対応が 1 位になりました。2024 年の上位 5 項目に入っていなかった AI など新技術への対応も、4 位に入っています。</p><p>2 位と 3 位の老朽化と属人化は、今あるシステムをどう引き継ぐかという課題です。4 位の AI への対応は、新しい技術をどう取り込むかという課題です。</p><p>生成 AI は、この両方に使えます。担当のエンジニアが減り、中身を知る人が限られてきた既存システムでは、AI がコードや構成を読み解いて保守や移行を手伝います。新しいシステムでは、少人数でも開発を速く進められるので、市場の変化にすばやく応えられます。後で紹介するとおり、回答者の 44.7% がすでに AI 駆動開発を取り入れています。</p><h3><b>マルチクラウドが定着、オンプレミスはクラウドへ</b></h3><p>主要なインフラにパブリック クラウドを選んだ回答者は 65.8% で、3 分の 2 近くがクラウドを中心にシステムを動かしています。</p><p>今後の戦略で最も多いのはマルチクラウドで、41.0% です。今マルチクラウドを使っている回答者の 90.2% は今後も続けると答えており、複数のクラウドを使い分ける運用が定着しています。</p><p>ハイブリッド クラウドの割合は、2024 年とほぼ同じです。動きが出ているのはオンプレミス中心の層で、43.3% がクラウドへ移る予定です。その 7 割以上は、まずハイブリッドから始めます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"03-chart-onprem-next-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/03-chart-onprem-next-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>脱 VMware は過半数に。ただし規模で進め方が違う</b></h3><p>VMware を利用している回答者は 33.7% でした。そのうち、利用を徐々に減らす（37.6%）、別のインフラに移す（18.6%）という回答を合わせると 56.1% で、2024 年の 48.8% から 7.3 ポイント増えています。一方で、今の環境を使い続けるという回答も 28.7% あり、移行する層としない層に分かれました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"04-chart-vmware-2024-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/04-chart-vmware-2024-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>できる限り早く別のインフラに移すという回答が 11.8% から 18.6% に増え、現状のまま使い続けるという回答は 35.0% から 28.7% に減っています。</p><h3><b>内製化と AI 駆動開発は一緒に進む</b></h3><p>開発体制を外部委託中心とする回答者は、現在の 20.2% から今後は 13.2% に減る見通しです。内製を重視する層と、内製と外部委託のバランスを取る層を合わせた割合は 61.4% から 65.2% に増えます。すでに内製中心の回答者のうち、外部委託に戻ると答えたのは 1.7% だけでした。</p><p>AI 駆動開発をすでに取り入れている回答者は、全面導入と一部導入を合わせて 44.7% です。検討中を含めると 69.1% になります。</p><p>開発体制ごとに見ると、差がはっきり出ます。内製重視の層と、内製と外部委託を組み合わせる層では、AI 駆動開発の導入率がどちらも 54.2% でした。外部委託重視の層では 22.6% で、半分以下にとどまります。自社で開発を進めているチームほど、AI を開発プロセスに取り込んでいます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"05-chart-aidev-by-structure-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/05-chart-aidev-by-structure-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>コンテナは本番で普及、データベースはクラウド化へ</b></h3><p>コンテナを本番環境で使っている回答者は 39.8% で、2024 年の 35.7% から 4.1 ポイント増えました。サーバーレスの本番利用は 34.1% です。</p><p>データベースは、利用規模の上位 4 製品（SQL Server、MySQL、Oracle、PostgreSQL のオンプレミス版）だけで 55.5% を占め、まだオンプレミスが中心です。ただ、オンプレミスのデータベースを主に使う回答者 606 名に今後を聞くと、オンプレミス中心を続けると答えたのは 21.1% でした。45.0% がクラウドとの併用へ、27.2% がクラウドのデータベース サービス中心へ移ると答えています。クラウド中心の回答者がオンプレミスに戻る割合は 4.6% です。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"06-chart-database-next-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/06-chart-database-next-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>半数近くが AI エージェントを導入、運用の仕組みづくりも始まる</b></h3><p>AI エージェントをすでに業務に組み込んでいる回答者は 47.4% です。一部の業務で使っているのが 29.1%、全社で使っているのが 18.3% でした。AI や機械学習を動かす環境には、35.3% がクラウドの GPU や TPU を挙げています。</p><p>使う段階に入ると、次に必要になるのが運用の仕組みです。生成 AI の運用管理を指す LLMOps は、16.7% が一部または全面的に導入し、21.2% が採用を検討しています。一方で、Site Reliability Engineering (SRE) や Platform Engineering を聞いたことがないという回答は 49.3% で、2024 年からあまり変わっていません。運用への関心は、AI の運用に集まっています。</p><h3><b>クラウド選びは、国内と環境性能も重視</b></h3><p>クラウドを選ぶときに国内のデータセンターを重視する回答者は 63.6% でした。AI でも同じ流れがあり、国内の規制やセキュリティ要件に沿ったソブリン AI には、導入済み、具体的に検討中、調査段階を合わせて 26.8% が動き出しています。今後の検討対象とした回答者を含めると、約 7 割が関心を持っています。</p><p>環境への配慮も、選ぶときの基準の 1 つです。電力使用効率（PUE）などの GX（グリーン トランスフォーメーション）性能を考慮する回答者は 62.8% でした。</p><h3><b>CCoE があると、何が変わる？</b></h3><p>クラウドのガバナンスが効いていないと答えた割合は、2024 年の 41.6% から 32.8% に下がりました。社内のクラウド利用ガイドラインを整備している組織は 49.1%、クラウド専門組織（CCoE）を置いてガバナンスを効かせている組織は 15.4% です。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"07-chart-governance-2024-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/07-chart-governance-2024-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>この体制の違いが、課題への対応状況にそのまま表れています。クラウド コストの最適化に対応できている割合は、ガバナンスが効いていない組織では 41.1% ですが、CCoE がある組織では 74.6% です。高度なセキュリティ対策である DevSecOps でも、47.8% と 83.6% で大きな差があります。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"08-chart-ccoe-effect\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/08-chart-ccoe-effect.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>人材育成で特に何もしていない組織は、2024 年の 39.8% から 19.4% に減りました。社内勉強会（42.3%）や認定資格の取得支援（32.7%）など、現場で工夫している様子がうかがえます。特に社内勉強会は、2024 年の 33.1% から大きく増えました。その一方、自由記述には「人材不足で取り組めていない」「完全に自己啓発にゆだねられている」といった声も寄せられました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"09-chart-training-2024-2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/09-chart-training-2024-2026.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>レポートでは Google Cloud での進め方も紹介</b></h3><p>レポートの後半では、今回の結果を踏まえて、Google Cloud でインフラの課題にどう取り組むかを 6 つのテーマで紹介しています。調査で見えた課題ごとに、対応する方法をまとめました。</p><ul><li><b>データのサイロ化（60.6% が課題）には、BigQuery と BigQuery Omni</b>。フルマネージドのデータ ウェアハウスで分析基盤をまとめ、複数のクラウドに散らばったデータも移動させずに分析できます。</li><li><b>コンテナの本番利用や脱 VMware には、Google Kubernetes Engine (GKE) と Cloud Run</b>。環境を選ばずにアプリケーションを動かせて、日々の運用の手間も減らせます。</li><li><b>1 位のサイバー攻撃への対応には、Wiz、Security Command Center、Mandiant の組み合わせ</b>。マルチクラウド全体のリスクを見える化したうえで、稼働中のシステムに対する脅威を継続的に検知し、インシデント対応の知見も生かせます。</li><li><b>国内データセンター（63.6% が重視）やソブリン AI には、東京と大阪のリージョンと Google Distributed Cloud (GDC)</b>。データを国内に置けるうえ、自社のデータセンターに Google の AI、Gemini を持ち込むこともできます。</li><li><b>半数近くが導入した AI エージェントには、Gemini Enterprise</b>。日々の業務での利用から自律型エージェントの構築までを支え、その下のハードウェアや基盤モデルまで Google Cloud が一貫して提供します。</li><li><b>属人化と人材不足には、Tech Acceleration Program (TAP)</b>。Google Antigravity などのコーディング エージェントが既存環境を解析し、移行先の設計や移行計画づくりを手伝います。移行の後の運用でも、エージェントを使って作業を効率化する例が出てきています。</li></ul><p>ここで紹介したのは一部です。レポートには、設問ごとのグラフや、回答者の層ごとに今後の意向を追った詳細な分析を全 33 ページに収録しています。</p><p><a href=\"https://cloud.google.com/resources/content/intl/ja-jp/infra-trend-survey?e=48754805&amp;hl=ja\">2026 年度版クラウド・インフラ最新動向のダウンロード ページ</a> から入手できます。自社のインフラ計画を見直すときの比較材料として、チームで共有してみてください。</p></div>"
  "56bc6825cadbae062f233a1ae67027e9":
    "id": "56bc6825cadbae062f233a1ae67027e9"
    "title": "Spanner キューの発表: エージェント ワークロードとその先を支えるトランザクション メッセージング"
    "link": "https://cloud.google.com/blog/ja/products/databases/spanner-queues-provide-native-transactional-messaging/"
    "published": "2026-10-15 11:30:00"
    "fetched": "2026-10-15 17:52:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 3 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/spanner-queues-provide-native-transactional-messaging?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントは、クエリに回答するだけでなく、自律的に払い戻しを行ったり、在庫を管理したり、複数ステップのハンドオフを実行したり、サブエージェントをオーケストレートしたりできます。これらは、複雑なエージェント型ワークフローのほんの一例です。そのため、多くの場合、エージェントは運用データベースで内部状態を維持しながら、別のメッセージング システムやイベントキュー システムを介して非同期アクションをディスパッチする必要があります。残念ながら、これらのアプリケーションを構築するチームにとって、commit ポイントが異なる 2 つのシステムを管理することは、エージェント システムにおけるトランザクションの一貫性を破壊することになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"https://docs.cloud.google.com/spanner/docs/queues/queues-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Spanner キュー</strong></a><span style=\"vertical-align: baseline;\">の一般提供が開始されました。これは、Spanner に直接組み込まれたネイティブなトランザクション メッセージング機能です。Spanner キューは、信頼性の高いエージェント実行に特化して設計されており、メッセージの作成はトランザクションにおける単なる書き込み操作にすぎません。エージェントの状態変更と、意図したダウンストリーム アクションは、アトミックにまとめて commit されるか、完全に失敗します。</span></p>\n<p><span style=\"vertical-align: baseline;\">これを従来のアプローチと比較してみましょう。データベースの状態の更新は成功したものの、アクションのディスパッチが失敗した場合、AI エージェントは行動を決定したにもかかわらず、実際には実行されないという状態になります。メッセージのディスパッチが成功しても、状態トランザクションがロールバックされると、エージェントは無効な状態に基づいてアクションを実行します。非同期のマルチエージェント調整では、再試行、投機的実行、競合状態によってこれらの障害が増幅され、開発者は複雑なアウトボックス パターン、べき等性レイヤ、データ整合ワーカーを構築せざるを得なくなります。これは、エージェント アーキテクチャにおける信頼性担保のための大きな負担となります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント アーキテクチャの主な機能</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Spanner キューは、インフラストラクチャのオーバーヘッドを発生させることなく、こうした複雑な非同期ワークフローをサポートするいくつかのコア機能を提供します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">アトミックな「意思決定とアクション」のエンキュー。</strong><span style=\"vertical-align: baseline;\">単一の Spanner 読み取り / 書き込みトランザクション内で、エージェントは内部メモリまたは状態テーブルを更新し、同時にピア エージェントへのタスクをエンキューできます。Spanner の厳格な直列化可能性とグローバルな外部整合性に支えられ、状態の変化と実行インテントは 1 つのアトミックな単位として commit されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">スケジュール実行と遅延実行。</strong><span style=\"vertical-align: baseline;\">キュー メッセージは、commit 時にすぐにディスパッチすることも、将来の配信をスケジュールすることもできます。遅延再試行、スケジュールされたエージェント チェックイン、SLA エスカレーション タイマーなどのエージェント型パターンは、外部の cron スケジューラやポーリング インフラストラクチャを必要とせずに、メモリの更新とともにトランザクション的にエンキューできます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">エージェント ワーカー向けのストリーミング SQL pull。</strong><span style=\"vertical-align: baseline;\">自律型エージェントは、ストリーミング SQL 読み取りを使用してタスクを動的に取り込んで処理します。エージェント ランタイムは、受信タスクをストリーミングしながら、処理能力に空きができ次第それらを処理し、トランザクション内でタスクの完了を確認応答（ACK）することで、エンドツーエンドのタスク実行状態の信頼性を保証します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">エピソード記憶の永続性とハンドオフ。</strong><span style=\"vertical-align: baseline;\">エージェント メモリの更新（長期的なエピソードの要約、内省的な状態遷移、サブエージェント間のコンテキストのハンドオフなど）は、キューを介して非同期かつトランザクション的に永続化できます。これにより、リアルタイムのインタラクティブなターンをブロックすることなく、エージェントの内部メモリが実行履歴と完全に同期された状態に保たれます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Spanner キューが自律型エージェントに不可欠な理由</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">トランザクションによる exactly-once のエージェント実行: </strong><span style=\"vertical-align: baseline;\">エージェントがツール呼び出しの結果を評価すると、状態の変更、推論の永続化、ダウンストリーム ツール呼び出しタスクが 1 つのトランザクションに保存されます。少なくとも 1 回の配信と、最大 1 回の ACK を保証することで、exactly-once の処理を実現できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">堅牢なマルチエージェント オーケストレーションとハンドオフ:</strong><span style=\"vertical-align: baseline;\"> マルチエージェント システム（A2A）では、プライマリ エージェントからスペシャリスト エージェントへの状態のハンドオフは、永続的でトランザクション的に commit されたメッセージとして処理されます。スペシャリスト エージェント ワーカーは、エージェント間のやり取りの完全に監査可能なリネージを維持しながら、配信されたメッセージを受信します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ファースト クラスのタイムアウトと人間参加型ワークフロー:</strong><span style=\"vertical-align: baseline;\"> エージェント ワークフローでは、人間の承認やスケジュールされたフォローアップのために一時停止が必要になることがよくあります。Spanner キューはタイムアウト管理をネイティブに処理します。単一のトランザクションが承認待ち状態を記録し、自動エスカレーション メッセージをスケジュールして、どちらか先にトリガーされた方の処理を確定させます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">エージェント キューの SQL ネイティブなオブザーバビリティ:</strong><span style=\"vertical-align: baseline;\"> 処理中のエージェント ワークロードの検査、タスク バックログのモニタリング、エージェント実行履歴の監査は、キューテーブルに対する標準 SQL クエリで実行できるため、中身の見えないメッセージストアのブラックボックス化を防ぐことができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント ワークフローの先</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI エージェント以外にも、Spanner キューは、さまざまな従来のイベント ドリブン アーキテクチャに対応する柔軟な多目的メッセージング プラットフォームとして機能します。ソーシャル アプリケーションでのリアルタイムのアクティビティ フィードの強化、ニュース配信でのライブ情報の提供、小売業での注文処理と在庫ワークフローのオーケストレーション、金融サービスでの高スループットの非同期タスク処理とトランザクション通知の処理など、Spanner キューは、プライマリ データベース内での非同期メッセージ配信とトランザクション イベント ドリブン ワークフローのための堅牢な基盤を提供します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">仕組み: Spanner キューのトランザクション メカニズム</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Spanner キューは Spanner のファースト クラスのリレーショナル構造として表されるため、使い慣れた GoogleSQL を使用してキューを定義、検査、管理できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. キューの定義とアトミックなエンキュー</strong></p>\n<p><span style=\"vertical-align: baseline;\">エージェントが顧客への払い戻しを承認すると、単一の ACID トランザクション内で Orders テーブルを更新し、OrderAgentTasks キューに実行タスクをディスパッチします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Assume parent table:\\r\\n-- CREATE TABLE Orders (\\r\\n--   OrderId STRING(64) NOT NULL, ...\\r\\n-- )\\r\\n-- PRIMARY KEY (OrderId);\\r\\n\\r\\n-- Define the transactional queue table\\r\\nCREATE QUEUE OrderAgentTasks (\\r\\n  OrderId STRING(64) NOT NULL,\\r\\n  TaskId STRING(64) NOT NULL,\\r\\n  TaskType STRING(64) NOT NULL,\\r\\n  Payload JSON NOT NULL\\r\\n) PRIMARY KEY (OrderId, TaskId, TaskType), INTERLEAVE IN Orders;\\r\\n\\r\\n-- Inside a Read-Write Transaction:\\r\\n-- 1. Update business state atomically\\r\\n\\r\\n-- BEGIN TRANSACTION;\\r\\n\\r\\nUPDATE Orders\\r\\nSET Status = \\&#x27;REFUND_APPROVED\\&#x27;,\\r\\n    UpdatedAt = PENDING_COMMIT_TIMESTAMP()\\r\\nWHERE OrderId = @orderId;\\r\\n\\r\\n-- 2. Enqueue the asynchronous agent action in the same transaction\\r\\nINSERT INTO OrderAgentTasks (OrderId, TaskId, TaskType, Payload)\\r\\nVALUES (\\r\\n  @orderId,\\r\\n  @taskId,\\r\\n  \\&#x27;EXECUTE_REFUND\\&#x27;,\\r\\n  JSON \\&#x27;{&quot;action&quot;: &quot;execute_refund&quot;, &quot;amount&quot;: 49.99}\\&#x27;\\r\\n);\\r\\n\\r\\n-- COMMIT;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd9e9acab10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これにより、注文ステータスが REFUND_APPROVED に正常に移行した場合に限り、EXECUTE_REFUND タスクが存在するようになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. 時間的スケジューリングとアトミックなキャンセル</strong></p>\n<p><span style=\"vertical-align: baseline;\">エスカレーション前にマネージャーの承認を最大 72 時間待つなど、時間に依存するワークフローの場合、エージェントはシステム DeliverTime 列に値を入力して、メッセージの可視性を遅らせます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Schedule an automated escalation check-in 72 hours in the future\\r\\nINSERT INTO OrderAgentTasks (OrderId, TaskId, TaskType, Payload, DeliverTime)\\r\\nVALUES (\\r\\n  @orderId,\\r\\n  @escalationTaskId,\\r\\n  \\&#x27;ESCALATE_UNAPPROVED_ORDER\\&#x27;,\\r\\n  JSON \\&#x27;{&quot;action&quot;: &quot;escalate_to_supervisor&quot;}\\&#x27;,\\r\\n  TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 72 HOUR)\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd9e9acbc90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">マネージャーが 4 時間後にリクエストを承認した場合、アプリケーションは数日後に発生するファントム エスカレーション アラートに対処する必要はありません。1 回のトランザクションで、標準 SQL DELETE を使用して注文ステータスを更新し、保留中のエスカレーション タスクをキャンセルします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- BEGIN TRANSACTION;\\r\\n\\r\\nUPDATE Orders\\r\\nSET Status = &#x27;MANAGER_APPROVED&#x27;,\\r\\n    ApprovedBy = @managerId\\r\\nWHERE OrderId = @orderId;\\r\\n\\r\\n-- Atomically cancel the pending delayed escalation task. `ASSERT_ROWS_MODIFIED 1` will\\r\\n-- act as a safeguard and cause a statement level error.\\r\\n\\r\\n-- A statement level error can be captured and the transaction can be\\r\\n-- user-aborted/cancelled in case the queue entry was already deleted.\\r\\n-- Otherwise the transaction will complete successfully regardless if the \\r\\n-- queue entry still exists and you&#x27;ll only know if a queue entry was deleted by\\r\\n-- checking the number of rows affected by the DELETE.\\r\\nDELETE FROM OrderAgentTasks\\r\\nWHERE OrderId = @orderId\\r\\n  AND TaskId = @escalationTaskId\\r\\n  AND TaskType = &#x27;ESCALATE_UNAPPROVED_ORDER&#x27;,\\r\\nASSERT_ROWS_MODIFIED 1;\\r\\n\\r\\n-- COMMIT;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd9e9ac9b90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. ストリーミング消費、リースの更新、アトミックな確認応答</strong></p>\n<p><span style=\"vertical-align: baseline;\">ダウンストリーム エージェント ワーカーは、ストリーミング SQL 接続（ExecuteStreamingSql）経由で RECEIVE_&lt;QueueName&gt; テーブル値関数（TVF）を使用してタスクを消費します。Spanner はメッセージ リースを自動的に管理し、リースされたタスクごとに一意の SpannerLeaseToken と有効期限のタイムスタンプを返します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Step 1: Consume tasks via a long-lived streaming SQL query\\r\\nSELECT\\r\\n  OrderId,\\r\\n  TaskId,\\r\\n  TaskType,\\r\\n  Payload,\\r\\n  SpannerLeaseToken,\\r\\n  SpannerLeaseExpirationTimestamp\\r\\nFROM RECEIVE_OrderAgentTasks(max_duration =&gt; &#x27;20m&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd9e9ac8090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI エージェントのタスクには、デフォルトのリース期間よりも長い時間を要するマルチターン LLM 推論や外部 API 呼び出しが含まれることが多いため、ワーカーは RENEWLEASE_&lt;QueueName&gt; 関数を使用してリースを積極的に延長できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Step 2: Extend lease ownership during long-running agent execution\\r\\nSELECT *\\r\\nFROM RENEWLEASE_OrderAgentTasks(lease_tokens =&gt; [@leaseToken]);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd9e9acb1d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェントは、外部ツールの実行を完了すると（このとき TaskId を外部 API のべき等キーとして渡します）、読み取り / 書き込みトランザクションを開いて最終状態を記録し、ASSERT_ROWS_MODIFIED 1 を使用してメッセージを削除することで確認応答（ACK）を行います。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Step 3: Atomically checkpoint agent results and ACK the message\\r\\n-- BEGIN TRANSACTION;\\r\\n\\r\\nUPDATE Orders\\r\\nSET RefundTransactionId = @externalRefundId,\\r\\n    Status = &#x27;REFUND_COMPLETED&#x27;\\r\\nWHERE OrderId = @orderId;\\r\\n\\r\\nDELETE FROM OrderAgentTasks\\r\\nWHERE OrderId = @orderId\\r\\n  AND TaskId = @taskId\\r\\n  AND TaskType = @taskType\\r\\nASSERT_ROWS_MODIFIED 1;\\r\\n\\r\\n-- COMMIT;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd9e9acb510&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ASSERT_ROWS_MODIFIED 1 を使用すると、リースの期限切れに伴う競合状態からシステムを保護できます。ネットワークの一時停止が原因でワーカーが停止し、リースが期限切れになった場合、別のワーカーがすでにタスクを処理して削除している可能性があります。停止したワーカーが再開してステートメントを実行しようとすると、ASSERT_ROWS_MODIFIED 1 は、キュー行がすでに存在しないことを検出し、ステートメント レベルのエラーをスローします。このエラーをキャッチしてトランザクションを中止することで、古いワーカーが新しいデータベースの状態を上書きするのを防ぎます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Spanner 変更ストリームと Spanner キューの比較</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Spanner の変更ストリームは、データベースのデータ変更（挿入、更新、削除）を準リアルタイムでキャプチャし、ダウンストリームの統合や監査に提供します。変更ストリームとキューはどちらも、アプリケーションがデータの変更を検知して処理できるようにするものですが、Spanner の変更ストリームは、継続的な変更データ キャプチャ（CDC）や、ダウンストリームの分析 / ストレージへのデータ ストリーミング向けに設計されています。一方、Spanner キューは、トランザクション タスクのオーケストレーション向けに明示的に設計されており、ネイティブ メッセージ リース、スケジュール配信、SQL ベースの pull、読み取り / 書き込みトランザクション内でのアトミックな確認応答をサポートしています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Spanner は、リレーショナル、ハイブリッド検索、グラフ、Key-Value の機能を厳格なグローバル整合性の下で組み合わせ、エージェント データのための統合された基盤を提供します。Spanner キューは、エージェントが単一の統合プラットフォーム内でデータの推論からトランザクション アクションの実行にシームレスに移行できるようにすることで、エージェント ループを完成させます。Spanner キューの一般提供が開始されました。</span></p>\n<p><a href=\"https://console.cloud.google.com/freetrial?redirectPath=%2Fspanner&amp;facet_utm_source=google&amp;facet_utm_campaign=%28organic%29&amp;facet_utm_medium=organic&amp;facet_url=https%3A%2F%2Fcloud.google.com%2Fblog%2Fproducts%2Fspanner%2Ftry-cloud-spanner-databases\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner の 90 日間無料トライアル</span></a><span style=\"vertical-align: baseline;\">に登録し、</span><a href=\"https://cloud.google.com/spanner/docs/queues/queues-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">公開ドキュメント</span></a><span style=\"vertical-align: baseline;\">をお読みください。Spanner データベースにキューテーブルを作成して、復元力のある exactly-once のエージェント ワークロードの構築を今すぐ開始できます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Nitin Sagar</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">エンジニアリング マネージャー兼 Cloud Spanner データ ストリーミング リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Matthew Mucklo</strong></p></div>"
