  "288f901b1992f80cdfa6c486ac9a099c":
    "id": "288f901b1992f80cdfa6c486ac9a099c"
    "title": "Predictable AI spend in BigQuery: Introducing cost management for generative AI functions"
    "link": "https://cloud.google.com/blog/products/data-analytics/using-bigquerys-generative-ai-cost-management-features/"
    "published": "2026-10-15 01:00:00"
    "fetched": "2026-10-15 01:34:57"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://docs.cloud.google.com/bigquery/docs/generative-ai-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">generative AI functions in BigQuery</span></a><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">AI.GENERATE</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AI.IF</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AI.CLASSIFY</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AI.SCORE</code><span style=\"vertical-align: baseline;\">, and more) bring large language models (LLMs) directly into your SQL, so a single query can classify millions of support tickets or score each product review for sentiment. However, because these functions are billed by the token, scaling them across massive datasets highlights the importance of managing your budget proactively. </span></p>\n<p><span style=\"vertical-align: baseline;\">We recently announced the general availability (GA) of </span><strong style=\"vertical-align: baseline;\">token-based </strong><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">cost management</strong></a><strong style=\"vertical-align: baseline;\"> for BigQuery generative AI functions</strong><span style=\"vertical-align: baseline;\">: daily quotas that let administrators set self-serve guardrails on AI token consumption, so teams can innovate while staying within your budget. In this blog, we provide an overview of cost management for BigQuery generative AI functions, walk through a few practical examples, and share resources to help you get started. Let’s jump in.  </span></p>\n<h3><span style=\"vertical-align: baseline;\">Quotas for managing costs</span></h3>\n<p><span style=\"vertical-align: baseline;\">Four daily quotas, managed through the Google Cloud Identity and Access Management (IAM) quota system, provide controls at the </span><strong style=\"vertical-align: baseline;\">project</strong><span style=\"vertical-align: baseline;\"> level and the </span><strong style=\"vertical-align: baseline;\">per-user</strong><span style=\"vertical-align: baseline;\"> level. Per-user limits apply to each user within a project, not across your organization.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Quota name</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Metric</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Scope</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Default value</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI input tokens per day</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Input tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">200 billion</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI input tokens per day per user</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Input tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project, per user</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">150 billion</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI output tokens per day</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Output and thinking tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project, per project</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">20 billion</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI output tokens per day per user</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Output and thinking tokens used by the LLM</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Per day, per project, per user</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">15 billion</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Key details:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The quotas are global.</strong><span style=\"vertical-align: baseline;\"> Usage is summed across all regions, so costs can't pile up unnoticed in a region you weren't watching.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Output quotas include \"thinking\" tokens.</strong><span style=\"vertical-align: baseline;\"> Reasoning tokens count toward your output quota, just as they count toward your Gemini platform bill.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Which functions are covered?</span></h3>\n<p><span style=\"vertical-align: baseline;\">The quotas apply to these BigQuery functions that perform LLM-backed generation:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-generate\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-table\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE_TABLE</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-generate-text\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE_TEXT</code></a><span style=\"vertical-align: baseline;\"> (and its alias </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-text\"><code style=\"text-decoration: underline; vertical-align: baseline;\">ML.GENERATE_TEXT</code></a><span style=\"vertical-align: baseline;\">)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-classify\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.CLASSIFY</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-if\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.IF</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-score\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.SCORE</code></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-agg\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.AGG</code></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">What's not covered:</strong><span style=\"vertical-align: baseline;\"> Embedding functions such as </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-text\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE_EMBEDDING</code></a><span style=\"vertical-align: baseline;\"> (also available as </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-generate-embedding\"><code style=\"text-decoration: underline; vertical-align: baseline;\">ML.GENERATE_EMBEDDING</code></a><span style=\"vertical-align: baseline;\">) and </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-embed\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.EMBED</code></a><span style=\"vertical-align: baseline;\"> are </span><span style=\"font-style: italic; vertical-align: baseline;\">not</span><span style=\"vertical-align: baseline;\"> subject to these quotas, because they run on different, substantially cheaper models.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Managing your quotas</span></h3>\n<p><span style=\"vertical-align: baseline;\">Administrators can view and adjust the quotas directly in the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a><span style=\"vertical-align: baseline;\"> as workloads change, with no support case required.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Navigate to </span><strong style=\"vertical-align: baseline;\">IAM &amp; Admin → </strong><a href=\"https://console.cloud.google.com/iam-admin/quotas/list\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quotas &amp; System Limits</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Filter by service and select </span><strong style=\"vertical-align: baseline;\">BigQuery API</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sort by the </span><strong style=\"vertical-align: baseline;\">Name</strong><span style=\"vertical-align: baseline;\"> column to bring the four AI quotas to the top.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_dxxy8WS.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Locating the gen AI token quotas in IAM &amp; Admin → Quotas &amp; System Limits.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">4. Find the quota, for example </span><strong style=\"vertical-align: baseline;\">AI input tokens per day</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">5. Open the three-dot menu and choose </span><strong style=\"vertical-align: baseline;\">Edit quota</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">From there:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">To tighten cost control,</strong><span style=\"vertical-align: baseline;\"> lower a quota. This takes effect immediately with no approval needed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">To support higher usage,</strong><span style=\"vertical-align: baseline;\"> request an increase from the same page. Many requests are auto-approved; larger increases may go through a quick review.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_7NmvWbT.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Editing a gen AI token quota in IAM &amp; Admin → Quotas &amp; System Limits.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">You'll need the right permissions.</strong><span style=\"vertical-align: baseline;\"> You need one of: </span><strong style=\"vertical-align: baseline;\">Owner</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Editor, </strong><a href=\"https://docs.cloud.google.com/iam/docs/roles-permissions/servicemanagement#servicemanagement.quotaAdmin\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quota Administrator</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">(</span><code style=\"vertical-align: baseline;\">roles/servicemanagement.quotaAdmin</code><span style=\"vertical-align: baseline;\">), or </span><a href=\"https://docs.cloud.google.com/iam/docs/roles-permissions/serviceusage#serviceusage.serviceUsageAdmin\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Service Usage Admin</strong></a><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">roles/serviceusage.serviceUsageAdmin</code><span style=\"vertical-align: baseline;\">).</span></p>\n<p><strong style=\"vertical-align: baseline;\">Prefer automation?</strong><span style=\"vertical-align: baseline;\"> You can also </span><a href=\"https://medium.com/google-cloud/bigquery-ai-cost-guardrails-how-to-set-daily-token-limits-programmatically-02d7a35f843a\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">manage these quotas programmatically</span></a><span style=\"vertical-align: baseline;\"> through the </span><a href=\"https://docs.cloud.google.com/docs/quotas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Quotas API</span></a><span style=\"vertical-align: baseline;\">, the </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> CLI, and Terraform to apply consistent guardrails across projects.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Monitoring usage</span></h3>\n<p><span style=\"vertical-align: baseline;\">Beyond setting limits, the </span><a href=\"https://console.cloud.google.com/iam-admin/quotas/list\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quotas &amp; System Limits</strong></a><span style=\"vertical-align: baseline;\"> page displays your historical token consumption so you can quickly detect spikes and right-size your budgets. Use these trends to see how new generative AI workloads and data pipelines affect your overall token usage.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_sSNHw57.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Daily project-level token usage for a gen AI token quota in IAM &amp; Admin → Quotas &amp; System Limits.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_iYgfR4l.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Longer-term usage graph with selectable 7-day, 14-day, 30-day, and custom ranges.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For a step-by-step walkthrough, see the BigQuery documentation on </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">controlling costs with token quotas</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Token quotas vs. billing spend caps</span></h3>\n<p><span style=\"vertical-align: baseline;\">Token quotas aren't the only cost guardrail in Google Cloud.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Token quotas (this feature)</strong></a><span style=\"vertical-align: baseline;\"> are </span><span style=\"font-style: italic; vertical-align: baseline;\">preventive</span><span style=\"vertical-align: baseline;\"> and </span><span style=\"font-style: italic; vertical-align: baseline;\">AI-specific</span><span style=\"vertical-align: baseline;\">. BigQuery tracks token usage during query execution and stops work close to the limit, with separate limits per project and per user.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Billing </strong><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#eligible-services\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">spend caps</strong></a><span style=\"vertical-align: baseline;\"> operate on </span><span style=\"font-style: italic; vertical-align: baseline;\">dollars</span><span style=\"vertical-align: baseline;\"> at the project and service level and can automatically block usage when a threshold is reached. They're a broad, financial backstop rather than a precise usage control, and because enforcement is not instant, some overages are incurred.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Use token quotas as your first line of defense for AI spend, and a spend cap as a project-wide safety net.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How enforcement works</span></h3>\n<p><span style=\"vertical-align: baseline;\">Quotas are enforced by stopping work rather than letting a query run past your limit. A query is rejected up front with a </span><code style=\"vertical-align: baseline;\">QuotaExceeded</code><span style=\"vertical-align: baseline;\"> error only if a quota it needs is already exhausted. Otherwise, it starts, and if a quota runs out mid-query, BigQuery stops sending new LLM calls:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Functions that support </strong><code><strong style=\"vertical-align: baseline;\">max_error_ratio</strong></code><span style=\"vertical-align: baseline;\"> (such as </span><code style=\"vertical-align: baseline;\">AI.IF</code><span style=\"vertical-align: baseline;\">) return partial results if unprocessed rows stay within the ratio, and otherwise fail.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">General-purpose functions</strong><span style=\"vertical-align: baseline;\"> (such as </span><code style=\"vertical-align: baseline;\">AI.GENERATE</code><span style=\"vertical-align: baseline;\">) still succeed. Skipped rows have no generated value, and their </span><code style=\"vertical-align: baseline;\">status</code><span style=\"vertical-align: baseline;\"> field contains the quota-exceeded error.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For details, see </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs#quota_enforcement_behavior\"><span style=\"text-decoration: underline; vertical-align: baseline;\">quota enforcement behavior</span></a><span style=\"vertical-align: baseline;\"> in the documentation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Sizing your input data: </span><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code></h3>\n<p><span style=\"vertical-align: baseline;\">To choose quota values, it helps to know how much text your workloads send to a model. The </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-count-tokens\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.COUNT_TOKENS</code></a><span style=\"vertical-align: baseline;\"> function helps with this.</span></p>\n<p><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code><span style=\"vertical-align: baseline;\"> returns the number of tokens a model's tokenizer produces for a text string, without making a billable generation call. Run it over a column to measure your input data:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Count the input text tokens for each product review\\r\\nSELECT\\r\\n  SUM(\\r\\n    AI.COUNT_TOKENS(\\r\\n      CONCAT(&#x27;Classify the sentiment of this review as positive, negative, or neutral: &#x27;, review_text),\\r\\n\\r\\n      endpoint =&gt; &#x27;gemini-3.1-flash-lite&#x27;).result) AS total_input_tokens\\r\\nFROM\\r\\n  `my_project.my_dataset.product_reviews`;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f445b622b10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The count is a lower bound on input tokens. It doesn't include output or thinking tokens, the instructions each AI function adds around your input, or non-text inputs such as images. Use it to:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gauge the input side of a workload</strong><span style=\"vertical-align: baseline;\"> before you launch it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Right-size your quotas</strong><span style=\"vertical-align: baseline;\"> together with a small sample run that measures actual input and output usage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Translate tokens into dollars</strong><span style=\"vertical-align: baseline;\"> using the published </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini platform pricing</span></a><span style=\"vertical-align: baseline;\"> for your model.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">From tokens to budget: a worked example</span></h3>\n<p><span style=\"vertical-align: baseline;\">Suppose you want to keep a project's daily AI spend around </span><strong style=\"vertical-align: baseline;\">$100</strong><span style=\"vertical-align: baseline;\"> with the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-1-flash-lite\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.1 Flash-Lite</span></a><span style=\"vertical-align: baseline;\"> model. As of today's published pricing (BigQuery processes in batch which provides a 50% discount):</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Input tokens:</strong><span style=\"vertical-align: baseline;\"> $0.125 per 1 million tokens</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Output tokens (response + reasoning):</strong><span style=\"vertical-align: baseline;\"> $0.75 per 1 million tokens</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If a small sample run shows an average </span><strong style=\"vertical-align: baseline;\">100:1 input-to-output token ratio</strong><span style=\"vertical-align: baseline;\">, you can solve for a daily budget:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Cost:   0.125 × I + 0.75 × O = 100     (I, O in millions of tokens)\\r\\nRatio:  I = 100 × O&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f445ae5cf10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Solving gives about </span><strong style=\"vertical-align: baseline;\">754 million input tokens</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">7.54 million output tokens</strong><span style=\"vertical-align: baseline;\"> per day. Set </span><strong style=\"vertical-align: baseline;\">AI input tokens per day</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">AI output tokens per day</strong><span style=\"vertical-align: baseline;\"> to these values to hold the project near $100/day. If a project uses models with different prices, budget per model or blend the rates.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Best practices for managing AI cost</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start with per-user quotas.</strong><span style=\"vertical-align: baseline;\"> They stop one user or runaway experiment from draining the project's budget.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Measure before you scale.</strong><span style=\"vertical-align: baseline;\"> Use </span><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code><span style=\"vertical-align: baseline;\"> to size your input, then check a small sample run in the usage chart before setting limits.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mind the output side.</strong><span style=\"vertical-align: baseline;\"> Output tokens cost more. Where a function accepts </span><code style=\"vertical-align: baseline;\">max_output_tokens</code><span style=\"vertical-align: baseline;\">, set it to bound generation length.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor and iterate.</strong><span style=\"vertical-align: baseline;\"> Adjust limits as real usage and budgets change.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Token-based cost management is available now. To begin:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Open </span><strong style=\"vertical-align: baseline;\">IAM &amp; Admin → </strong><a href=\"https://console.cloud.google.com/iam-admin/quotas/list\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quotas &amp; System Limits</strong></a><span style=\"vertical-align: baseline;\"> in the Google Cloud Console and filter by </span><strong style=\"vertical-align: baseline;\">BigQuery API</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the four </span><strong style=\"vertical-align: baseline;\">AI-related</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">token quotas</strong><span style=\"vertical-align: baseline;\"> and set limits that match your budget.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Use </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-count-tokens\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AI.COUNT_TOKENS</code></a><span style=\"vertical-align: baseline;\"> to size your input data.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">For the full details, see the documentation on </span><a href=\"https://docs.cloud.google.com/bigquery/docs/control-genai-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">controlling generative AI costs</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">With token-based guardrails in place, your teams can use generative AI in BigQuery with the cost predictability your organization needs.</span></p></div>"
