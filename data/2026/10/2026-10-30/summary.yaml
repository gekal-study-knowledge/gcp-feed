"overview": |
  この日はリリースノート、Google Cloud Blog、Google Cloud Japan Blog の 3 ソースから 12 本。borderless Lakehouse により、Databricks が管理する Apache Iceberg テーブルを BigQuery からデータをコピーせずに直接クエリできるようになった。BigQuery は Databricks が書いた GCS 上の同じファイルを読み、変更は Lakehouse の定期メタデータ更新 (最短 5 分ごと) の後に反映され、Amazon S3 や Azure Blob Storage 上のデータにもフェデレーションを広げられる。Cloud CISO Perspectives (10 月第 2 号) では、自動化された調査で本物の脆弱性の検証が難しくなるなか人手による高度な研究を後押しするため、Google Cloud VRP に新たに 25 万ドルの報奨金ティアを設けた背景を Q&A 形式で紹介した。Knowledge Catalog はセマンティックモデル対応の拡張が一般提供となり、Looker LookML、BigQuery Graph (BigQuery measures を含む)、dbt MetricFlow、Snowflake などのセマンティックモデルや指標定義を 1 つのコンテキストグラフに取り込み、ツール間で定義が食い違う場合は出所付きで両方を示してエージェントの回答を信頼できる定義に基づかせる。 Google Cloud Japan Blog では 6 本の抄訳・事例が公開された。BigQuery の ObjectRef とマルチモーダルデータ分析が一般提供となり、画像・動画・音声・ドキュメントなどの非構造化データを ObjectRef 列として構造化データと同じ行に持ち、単一の SQL や自然言語のクエリでマルチモーダル・複数列の入力を Gemini に渡せるようになった (BigQuery AI、会話型分析、Gemini Enterprise で利用可能)。Google Distributed Cloud (GDC) エアギャップ上の Gemini によるエンタープライズ検索がプレビューとなり、NVIDIA Blackwell Ultra で高速化されたフルマネージドの RAG 検索を、インターネットや Google Cloud のグローバルインフラに接続しない物理的なセキュリティ境界内で動かせる (PDF・Office・画像・WAV・MP4 などに対応、1 ファイル最大 100 MB・1 チャット最大 500 MB、回答には出典を明記)。事例では、カインズがプレビュー版の AlphaEvolve で需要予測モデルを自律的に改善し誤差を 19% 改善 (短期予測は繁忙期に最大 500 万 SKU・約 3,000 万行)、DHL Express が Google Maps Platform で約 4 万人の配達員にリアルタイムのナビゲーションを提供し住所データの課題に取り組んだ方法、南アフリカ発の緊急対応プラットフォーム AURA が Google Maps Platform で正確な ETA を実現し派遣コストを 50% 以上削減、モンゴルの UBCab が Routes API の Compute Routes で交通状況を考慮したマッチングに移行し平均迎車時間を 25% 短縮した例が紹介された。 遅れて取得した記事が 3 本。リリースノートでは、Backup and DR で Cloud SQL インスタンスの既存バックアップ計画を編集し、バックアップルールやカスタムオンデマンド保持期間の上限を更新できるようになった。Bigtable の承認済みビュー・論理ビュー・継続的マテリアライズドビューを Knowledge Catalog で検出できるようになり (GA)、Datastream と Knowledge Catalog の統合も GA となった。Google SecOps for SAP も GA となり、SAP RISE や、Google Cloud・オンプレミス・他クラウドで動く自己管理の SAP 環境からのログ取り込み、SAP 固有の YARA-L 脅威検出ルール、脅威への自動対応と封じ込めを提供する。Google Cloud Japan Blog では、VPC Service Controls の機能強化 (2026 年 10 月 16 日公開記事の抄訳) が紹介された。境界メンバーシップにフォルダを追加して配下のプロジェクトとサブフォルダへポリシーを継承でき、きめ細かな例外の管理やアクセス拒否時のガイド付き修復も可能で、一般提供かつ追加料金なしで使える。Google Cloud Blog では、Google Skills が金融サービス向けと法務向けの Gemini 動画学習バンドルを無償で公開した。
