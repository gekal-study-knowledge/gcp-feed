    "summary": "<h2 class=\"release-note-product-title\">Backup and DR</h2>\n<h3>Feature</h3>\n<p>You can now edit existing backup plans for Cloud SQL instances to update\nsettings such as backup rules and maximum custom on-demand retention periods.\nTo learn more, see\n<a href=\"https://docs.cloud.google.com/backup-disaster-recovery/docs/cloud-console/sql/csql-backup\">Back up Cloud SQL instances to a backup vault</a>.</p>\n<h2 class=\"release-note-product-title\">Bigtable</h2>\n<h3>Feature</h3>\n<p>You can use Knowledge Catalog to discover authorized views, logical views, and\ncontinuous materialized views. This integration lets you search for these\ngranular data assets alongside your Bigtable instances and tables. This\nfeature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/bigtable/docs/manage-data-assets-using-knowledge-catalog\">Manage data assets using Knowledge Catalog</a>.</p>\n<h2 class=\"release-note-product-title\">Datastream</h2>\n<h3>Feature</h3>\n<p>Datastream integration with Knowledge Catalog is now\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available\n(GA)</a>. For more\ninformation, see\n<a href=\"https://docs.cloud.google.com/datastream/docs/knowledge-catalog-integration\">the documentation</a>.</p>\n<h2 class=\"release-note-product-title\">SAP on Google Cloud</h2>\n<h3>Announcement</h3>\n<p><strong>Google SecOps for SAP is generally available (GA)</strong></p>\n<p>Google SecOps for SAP is generally available (GA). This solution\nhelps you protect your enterprise SAP applications by integrating\nbusiness-critical telemetry into Google SecOps to provide\nunified visibility, threat detection, and security response capabilities.</p>\n<p>This release includes:</p>\n<ul>\n<li>Log ingestion from SAP RISE and self-managed SAP environments that run on\nGoogle Cloud, on-premises, or other clouds.</li>\n<li>SAP-specific YARA-L threat detection rules available in the Google SecOps\nDetection Rules GitHub repository.</li>\n<li>Automated threat response and containment capabilities by using the SAP RFC\nGateway and SOAR playbooks\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>).</li>\n</ul>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/sap/docs/secops/overview\">Secure SAP applications with Google SecOps</a>.</p>"
