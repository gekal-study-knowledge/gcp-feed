  "e39c0b244a8259ba143ab244b607eaa6":
    "id": "e39c0b244a8259ba143ab244b607eaa6"
    "title": "UBCab: Google Maps Platform で平均迎車時間を 25% 短縮"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/ubcab-reducing-average-passenger-pickup-times-by-25-percent-with-google-maps-platform/"
    "published": "2026-10-30 10:20:00"
    "fetched": "2026-10-30 10:33:42"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 9 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/ubcab-reducing-average-passenger-pickup-times-by-25-percent-with-google-maps-platform/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回のブログ記事は、UBCab の CTO で共同創業者でもある Erdem Batsaikhan 氏によるものです。モンゴルの大手テクノロジー企業である UBCab が、Google Maps Platform を使用して、交通状況を考慮したリアルタイムのルート設定、配車効率の向上、乗客の待ち時間の大幅な短縮を実現した方法をご紹介いただきました。</span></p>\n<hr />\n<h3><strong style=\"vertical-align: baseline;\">交通状況を考慮したルート案内で極寒の冬の課題を克服</strong></h3>\n<p><span style=\"vertical-align: baseline;\">モンゴルのウランバートルは、世界で最も寒い首都です。冬には気温がマイナス 40 度に達することもよくあります。このような極寒の中で配車を依頼する場合、外に立って待つ余裕などありません。お客様が求めているのは、車が時間どおりに到着することです。これが、モンゴルの成人人口の 80% 以上が</span><a href=\"https://www.ubcab.mn/en\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">UBCab</span></a><span style=\"vertical-align: baseline;\"> を利用している理由です。</span><a href=\"https://mapsplatform.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform</span></a><span style=\"vertical-align: baseline;\"> のおかげで、180 万人のお客様を寒い中お待たせすることなく迎えに行くことができています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Maps Platform</span><a href=\"https://developers.google.com/maps/documentation/mobility?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">モビリティ サービス</span></a><span style=\"vertical-align: baseline;\">を導入する前は、直線距離の計算に基づいて近くのドライバーを見つける自動ドライバー マッチング システムでしたが、技術的な限界がありました。この計算では実際の道路網や交通渋滞が考慮されなかったため、地図上では近くにいても、実際には車で遠回りしなければならないドライバーが割り当てられることがありました。その結果、お客様の待ち時間が長くなったり、ドライバーが配車依頼を拒否したり、予定到着時刻（ETA）が大きく変動したりして、お客様からの苦情に発展することもありました。また、ドライバーが交通状況を確認してルートを計画するために、UBCab アプリと外部のナビゲーション アプリを切り替えなくてはなりませんでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうしたルート設定の課題を解決し、お客様に正確な ETA を提供するため、当社は Google Maps Platform のモビリティ サービスを採用しました。これにより、実際の運転時間に基づいてお客様の最も近くにいるドライバーをマッチングして、お客様には確実な到着時間を、ドライバーには大幅に改善されたルートを提供できるようになりました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"UBCab-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/unnamed7_XApVCmF.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>UBCab、CTO / 共同創業者 Erdem Batsaikhan 氏</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Google Maps Platform のモビリティ サービスでドライバーと乗客のエクスペリエンスを向上</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud パートナーの</span><a href=\"https://www.hkmci.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Master Concept</span></a><span style=\"vertical-align: baseline;\"> と協力することで、UBCab の中核となる配車エンジンにモビリティ サービスを直接組み込むことができました。</span><a href=\"https://developers.google.com/maps/documentation/routes?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Routes API</span></a><span style=\"vertical-align: baseline;\"> の Compute Routes を使用して、直線距離によるマッチングからリアルタイムの交通状況を考慮したルート選択に移行し、到着時間を予測できるようにしました。この API は、リアルタイムの交通データと道路網を考慮して、配車リクエストを割り当てる前に実際の運転時間を計算します。これにより、ドライバーには迅速に迎えに行ける配車リクエストを割り当て、お客様にはリアルタイムの道路状況に基づいた正確な ETA と適正な運賃見積もりを提示することができます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"UBCab-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/unnamed8.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ルート最適化の次は、ドライバーのエクスペリエンスをさらに改善したいと考えました。以前は、ルートを確認するにはドライバー専用アプリをいったん離れ、外部アプリに移動する必要がありました。</span><a href=\"https://mapsplatform.google.com/maps-products/navigation-sdk/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Navigation SDK</span></a><span style=\"vertical-align: baseline;\"> を使用してターンバイターンの経路案内を自社アプリに直接組み込んだことで、ドライバーが街を走行中に複数のアプリを切り替えなくてもよくなりました。また、この機能を最大限に活用できるよう、この SDK 用にモンゴル語の音声案内をカスタム開発しました。これにより、登録したばかりのドライバーでも、不慣れな都市部のルートを道路に集中して安全に走行できるようになりました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"UBCab-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/unnamed9.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ルートを最適化し、ターンバイターン方式ナビを導入しても、正確な目的地がわからなければドライバーは到着できません。ウランバートルには正式な住所や一貫した番地がない場所もあるため、従来の住所検索をナビゲーションに利用できないことがあります。ドライバーが迷わないようにするため、Google マップの基本地図に当社独自の住所システムを重ね合わせました。Google Maps Platform は、基礎となる道路データ、リアルタイムの交通情報、ルートを提供します。これを当社のローカルな知識と組み合わせることで、ドライバーがいつでも正確な乗車場所を特定できるようになります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"UBCab-4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/unnamed10.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Google Maps Platform でサービスを全国展開し、海外旅行者にも対応</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Maps Platform のモビリティ サービスを導入したことで、当社の業務は大幅に改善されました。ドライバーの配車リクエスト受諾率は 15% 向上し、平均迎車時間は 1 分短縮されました。この 25% 相当の短縮効果により、モンゴル全体でお客様の待ち時間を毎月合計 540 時間も削減できています。こうした改善により、料金や到着時間に関するお客様からの苦情が 30～40% 減少し、コールセンター チームが通話に費やす時間も短縮されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この成功を弾みにして、モビリティ サービスの適用範囲をフード デリバリーや荷物のエクスプレス配送の事業にも拡大していく予定です。また、カメラベースの位置情報特定、3D マッピング、視覚的な道路名認識を可能にする </span><a href=\"https://mapsplatform.google.com/maps-products/grounding\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Grounding with Google Maps</span></a><span style=\"vertical-align: baseline;\"> などの、Google Maps Platform の高度な機能の実装に向けた準備も進めています。これらのツールを活用することで、毎年モンゴルを訪れる 100 万人もの外国人観光客が、言語の壁に戸惑うことなく乗車場所をスムーズに特定し、街中を自在に移動できるようになります。UBCab は、地図機能以外でも Google との連携をさらに深めようとしています。今後は</span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> を導入し、生成 AI を活用することで、配車ワークフローの自動化や、拡大し続ける車両フリート全体における運行トラブル予測にも取り組んでいく計画です。</span></p>\n<p><span style=\"vertical-align: baseline;\">モビリティ サービスの統合は、当社の配車効率に変革をもたらしました。荷物配送サービスの拡充や、海外観光客向けの視覚的な位置情報特定サービスの導入を進めるなか、Google Maps Platform は、モンゴルのあらゆる都市や町へ迅速で先進的なサービスを届けるために欠かせないテクノロジーとなっています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- UBCab、CTO / 共同創業者 </span><strong style=\"font-style: italic; vertical-align: baseline;\">Erdem Batsaikhan 氏</strong></p></div>"
  "a07b7059f4ebd2ef5f62f355105add62":
    "id": "a07b7059f4ebd2ef5f62f355105add62"
    "title": "AURA、Google Maps Platform で緊急対応を迅速化し、派遣コストを 50% 削減"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/aura-speeds-up-emergency-response-and-reduces-dispatch-costs-by-50-percent-with-google-maps-platform/"
    "published": "2026-10-30 10:10:00"
    "fetched": "2026-10-30 10:33:42"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 2 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/aura-speeds-up-emergency-response-and-reduces-dispatch-costs-by-50-percent-with-google-maps-platform/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回のブログ記事は、AURA の CTO である Grant Macwilliam 氏と、Localyse のビジネス開発ディレクターである Jeffrey Benning 氏によるものです。AURA が Google Maps Platform を使用してセーフティ プラットフォームを強化することで、正確な到着予定時刻の計算と安定したグローバル展開を実現し、派遣コストを 50% 以上削減した方法を紹介します。</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">信頼性と拡張性に優れたグローバル規模の地図プロバイダでユーザーの信頼を構築</span></h3>\n<p><span style=\"vertical-align: baseline;\">緊急通報があった場合、一分一秒が重要になります。しかし、従来の緊急対応システムは、多くの場合、人手による電話対応、地域ごとの管制センター、無線による派遣に頼っています。通報者も、いつ救助が到着するかわからない不安のなかで待たされることもあります。</span></p>\n<p><a href=\"https://www.aurasos.com/en-us\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AURA</span></a><span style=\"vertical-align: baseline;\"> は、この問題の解決を目指しています。南アフリカで設立された当社の使命は、緊急対応を迅速かつ透明性の高いものにし、どこからでもアクセスできるようにすることで、より安全な世界を作ることです。当社のプラットフォームは、モバイルアプリ、インターネットに接続されたパニックボタン、ウェアラブル、配車サービスなどのソースから緊急信号を受信し、支援を必要とする人々を、最も近い検証済みの民間警備会社や医療従事者に直接つなげます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この迅速な対応を実現するためには、正確な地理空間データと地図データが必要です。以前は、さまざまな地域のさまざまな地図プロバイダを使用していましたが、これらのツールは、リアルタイム交通情報や通行止めを考慮した正確な予定到着時刻（ETA）を提供することが困難でした。そのため、困った状況にある利用者に不必要な不安を与え、プラットフォームに対する信頼を損なうリスクが生じていました。さらに、地域間の一貫性がなかったため、一部の現場対応者は他の地域よりも不便な思いをしていました。当社がその地域に導入した地図サービスを利用する代わりに、個人のスマートフォンで Google マップを利用する者さえいました。</span></p>\n<p><span style=\"vertical-align: baseline;\">英国や米国など、グローバル市場への急速な拡大をサポートするには、正確で一貫性のあるリアルタイムの交通データとグローバルな規模を備えた最高クラスのマッピング パートナーが必要でした。そこで、Google Maps Platform のパートナーである</span><a href=\"https://www.localyse.eu/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Localyse</span></a><span style=\"vertical-align: baseline;\"> との連携を通じて、サービスの基盤として</span><a href=\"https://mapsplatform.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform</span></a><span style=\"vertical-align: baseline;\"> を選択しました。Google マップは、当社が必要とするデータ品質、ユーザーの親しみやすさ、グローバルなリーチを提供してくれます。通報者が「救助が向かっている」と聞けば、その言葉を信じて待つことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">緊急対応は本質的に複雑でリスクが高いため、この移行を進めるには、コンプライアンスに関する特有の課題を克服する必要がありました。位置情報インテリジェンスにおけるパートナーである Localyse は、プロジェクトを推進するための重要なサポートとガイダンスを提供してくれました。Localyse は、Google のプロダクト チームおよびコンプライアンス チームと緊密に連携し、安全性と運用上の要件がすべて満たされていることを確認したうえで、契約への道を開いてくれました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"AURA -1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/unnamed7_fh9SB3m.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>銀行、保険会社、配車サービス会社などのクライアントは、平均対応時間とインシデントの傾向をリアルタイムで確認して、パフォーマンスを把握できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Navigation SDK と Places API で派遣と管制室の業務を効率化</span></h3>\n<p><span style=\"vertical-align: baseline;\">当社は、派遣プロセス全体に Google Maps Platform を活用しました。現場では、提携する対応者向けモバイルアプリに</span><a href=\"https://mapsplatform.google.com/maps-products/navigation-sdk/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Navigation SDK</span></a><span style=\"vertical-align: baseline;\"> を直接組み込みました。対応者は、アプリを離れることなく、ターンバイターンの運転ルート、車線案内、徒歩ルートを取得できるため、緊急事態に可能な限り迅速に対応できます。インターフェースは使い慣れた直感的なものであるため、習得が簡単で、ストレスの多い通話中でもスムーズに操作できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">当社の自動派遣エンジンは、Google Maps Platform のルートと到着予定時刻の計算機能を使用して、近くにいる適切な対応者（高度な救命処置の訓練を受けた救急隊員など）を追跡します。距離と運転時間を自動的に計算して、現場に最も近い対応者をマッチングします。緊急時には、この迅速なマッチングが不可欠です。これにより、物理的な派遣が迅速化されるとともに、正確な到着予定時刻がわかるため、救助を要請している人に即座に安心感を与えることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">当社はまた、</span><a href=\"https://developers.google.com/maps/documentation/places/web-service?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places API</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://developers.google.com/maps/documentation/places/web-service/place-autocomplete?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Autocomplete</span></a><span style=\"vertical-align: baseline;\"> を使用して、利用者がサービスに登録する際に任意の建物や場所を登録できるようにしています。これにより、以前の地図プロバイダよりも高い精度で住所をシステムに取り込めるようになりました。24 時間 365 日稼働する管制室では、オペレーターが静的地図と動的地図を使用して、派遣状況をリアルタイムで監視しています。担当者は、航空写真ビューで建物のレイアウトや敷地の入り口を確認し、リバース ジオコーダーを使用して緯度と経度の座標を人が読める形式の住所に変換することで、対応者を現場に直接誘導できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">銀行、保険会社、配車サービス会社などのビジネス クライアントに完全な運用の透明性を提供するために、派遣データは</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> に転送し、パフォーマンス指標を</span><a href=\"https://cloud.google.com/looker-studio\"><span style=\"text-decoration: underline; vertical-align: baseline;\">データポータル</span></a><span style=\"vertical-align: baseline;\">で可視化しています。クライアントは、平均対応時間とインシデントの傾向をリアルタイムで確認し、パフォーマンスを把握できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">一方で、当社のエンジニアは、Google Maps Platform の事前構築済みソフトウェア キットに切り替えたことで、さまざまなモバイル オペレーティング システム用のカスタム ネイティブ コードを維持する必要がなくなりました。これにより、技術的なメンテナンスが簡素化され、開発者は新しい安全機能の構築に集中できるようになりました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">Google Maps Platform で派遣コストを 50% 以上削減し、グローバルな保護を拡大</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google Maps Platform を利用したことで、運用面と財務面ですぐにメリットが得られました。地域ごとの複数のサービスを単一のプロバイダに置き換えたことで、派遣 1 回あたりのコストを 0.26 ドルから 0.11 ドルへ、50% 以上削減できました。これにより、年間約 56,000 ドルのコスト削減が見込まれ、パートナーやエンドユーザーが緊急対応を低コストで利用できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在、Google Maps Platform を利用して、45 秒ごとに緊急信号を処理しています。120 万件を超える過去のインシデントにおいて、1 か月あたりの派遣件数は約 45,000 件で、前月比で 13% の増加を見せています。このグローバル インフラストラクチャにより、世界中の 26 のパートナー ネットワークにわたり、シームレスな拡大が可能となっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ヨーロッパ、英国、米国への拡大を続けるなか、今後は </span><a href=\"https://developers.google.com/maps/documentation/isochrones/overview?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Isochrones API</span></a><span style=\"vertical-align: baseline;\"> を実装して、リアルタイム交通情報に基づいて、対応者がいつでも到達できるエリアをマッピングする予定です。これにより、サービスレベル契約を追跡し、対応者のカバレッジを増やす必要があるエリアを特定できるようになります。当社は今後も、Localyse をこの取り組みを通じた重要な位置情報インテリジェンスのパートナーとして、グローバル展開を進めるとともに、Destination API などの新機能を使って対応者を建物の入り口まで誘導する方法を探っていきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">当社は、スマート テクノロジーと信頼性の高いナビゲーション データを組み合わせることで、より安全で透明性の高い緊急対応ネットワークを構築しています。利用者がパニックボタンを押すとき、救助が必ず来ると確信できなければなりません。Google Maps Platform を使用することで、世界中の人々との間でその約束を果たすための精度と規模を確保できるのです。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- AURA 最高技術責任者 </span><strong style=\"font-style: italic; vertical-align: baseline;\">Grant Macwilliam 氏 </strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Localyse ビジネス開発ディレクター </span><strong style=\"font-style: italic; vertical-align: baseline;\">Jeffrey Benning 氏</strong></p></div>"
  "c45f3385cc26a831567a8d4a5e7d70f2":
    "id": "c45f3385cc26a831567a8d4a5e7d70f2"
    "title": "DHL Express が長年にわたる現場の知見をスマートなグローバル ネットワークへと進化させた方法"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/how-dhl-express-is-turning-decades-of-courier-knowledge-into-a-smarter-global-network/"
    "published": "2026-10-30 10:00:00"
    "fetched": "2026-10-30 10:33:42"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 16 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/how-dhl-express-is-turning-decades-of-courier-knowledge-into-a-smarter-global-network/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回のブログ記事は、DHL Express の EVP 兼 CTO である Dirk Olufs 氏によるものです。DHL Express が Google Maps Platform を活用して B2C オペレーションをグローバルに拡大し、配送の正確性を向上させるとともに、約 4 万人の配達員にリアルタイムのナビゲーションとインテリジェンスを提供している方法をご紹介いただきました。</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">DHL Express は、誰も不可能だと思う速さで荷物を届けるという、シンプルなアイデアから生まれました。創業当初は、創業者自らが手作業で荷物を運んでいました。それが数年後には、株式市場が開く前のニューヨークに届けるため、銀行書類を携えてコンコルドで大西洋を飛び越えるまでになりました。テクノロジーは常に、約束を果たすためのものでした。e コマースが普及し、1 日 150 万件の配送のほぼ半分が、日々異なる 220 か国にわたる住宅宛てになったときも、その約束は変わりませんでした。しかし、テクノロジーは進化させる必要がありました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ある世界向けに構築されたネットワークを、別の世界にサービスを提供するためにモダナイズする必要があった際、課題となったのは技術的なことではなく、「人」に関わることでした。DHL Express の最大の強みは、常に「人」にあります。何十年も現場を支えてきた配達員たちは、いかなるシステムでも再現し得ない貴重な知識を持っています。どの入口を使用するか、どこに駐車するか、受付が正午に閉まるのはどの建物か。私たちの仕事は、そうした知識を置き換えることではなく、それらにふさわしいテクノロジーを構築し、現場の人々と共に歩むことでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">人を第一に考える企業は、そう簡単に変われない一面も持ち合わせています。テクノロジーが配達員に対し、8 時間ずっと指示を出し続けるだけでは、配達員に大きなストレスがかかるでしょう。そのため、何かを拡大する際は、まず現場の理解と協力を得る必要がありました。トップダウンではなく、現場主導で進める必要があります。</span></p>\n<h3><span style=\"vertical-align: baseline;\">可視化されていなかったものから基盤を構築</span></h3>\n<p><span style=\"vertical-align: baseline;\">2009 年に、「配達員にナビゲーション機能を提供できないか」という声が上がったとき、答えは明白に思えました。</span><a href=\"https://mapsplatform.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform</span></a><span style=\"vertical-align: baseline;\"> がすでに解決策を提示していたからです。しかし、本当の問題はナビゲーションではなく、住所であることがわかってきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">住所の構造は地域によって実にさまざまです。中東では多くの場所に郵便番号、番地、建物名がなく、ランドマークでしか住所を特定できません。また、人口密度の高いアジアの都市では、配達員は個々の住所ではなく、指定の受け渡し場所に荷物を届けるのが一般的です。上海からドバイ宛てに発送するお客様が、中国の住所構造で宛先を記入することもあります。その住所データを、英語で処理するシステム、UAE 現地の配達員、アラビア語を使う受取人の全員が理解できなければなりません。配達が完了するまでのあらゆるステップで、適切な形式の適切な情報が必要になるのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">従来のシステムでは、その複雑さに対応することができませんでした。配送フォームに記入する顧客は、不適切なデータを提供しようとしているわけではありません。ただ、適切なデータがどのようなものかを知らないだけです。そこで、配達員に届いた時点で不適切な住所を修正するのではなく、情報の入力元に立ち返ることにしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">私たちは Google Maps Platform の実装パートナーである</span><a href=\"https://onigroupglobal.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">OniGroup</span></a><span style=\"vertical-align: baseline;\"> と協力して、</span><a href=\"https://developers.google.com/maps/documentation/address-validation/overview?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Address Validation</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://developers.google.com/maps/documentation/places/web-service?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places API</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://developers.google.com/maps/documentation/geocoding/overview?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Geocoding</span></a><span style=\"vertical-align: baseline;\"> を活用した DHL 独自の住所インテリジェンス エンジン「DAVE」を構築しました。DAVE は住所入力の時点で情報を検証して補強し、その場所が住宅か、事業所か、営業時間はいつか、配達員はどこから入ればよいかといった情報を教えてくれます。これにより、日中に不在の個人宅や、受付が閉まった後のオフィスビルへ配達員を向かわせずに済むようになりました。一つひとつは些細な労力削減ですが、当社の事業規模では大きな意味を持ちます。DAVE の導入を通じて、レガシー インフラストラクチャから最新のコンテナ化された環境へと移行し、年間運用コストを 75% 削減するとともに、デプロイ速度を 7 倍に向上させることもできました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"DHLexpress-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/unnamed7.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">配達員にリストだけでなく計画を提供</span></h3>\n<p><span style=\"vertical-align: baseline;\">長年にわたり、当社の配達員はハンドヘルド デバイスのリスト画面を頼りにしていました。表示されるのは配送先の一覧のみで、地図も、前後の状況把握も、1 日の配送ルートを可視化する手段もありませんでした。ルート計画に関する知識はすべて、彼らの頭の中にありました。ロンドンのウェンブリーにいた 20 年の経験を持つスーパーバイザーは、40 人のドライバーに 5,000 件の配送を割り当てる方法を知っていました。しかしその人が異動すると、知識も失われてしまいました。</span></p>\n<p><span style=\"vertical-align: baseline;\">私たちは、現場に一方的な指示を強制することなく、この状況を変えたいと考えました。</span><a href=\"https://mapsplatform.google.com/maps-products/navigation-sdk/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Navigation SDK</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://developers.google.com/maps/documentation/mobility/fleet-engine?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Fleet Engine</span></a><span style=\"vertical-align: baseline;\"> を統合することで、配達員に Android デバイスでターンバイターン方式のナビゲーションと、現地の状況を反映したリアルタイムの配送計画をを提供できるようになりました。しかし、最も重要だったのは、双方向のやりとりを可能にすることでした。配達員がデバイス上で直接住所を修正できるようになり、システムの位置情報が間違っていれば正しい場所にピンを立てるだけで、その修正がプラットフォームにフィードバックされます。配達員たちの暗黙知が、インフラストラクチャの一部になっていくのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">テクノロジーが単に指示を出すだけでなく、学習するようになったことを知ると、配達員たちの意識は変わっていきました。テクノロジーが自分たちの作業負担を減らしてくれることを、配達員たちは実感しています。20 年間この仕事をしてきた私にとって、これは大きなことです。1 つの国で試験運用を行い、フィードバックを収集し、改善を重ねるといった形で、機能を段階的にリリースしてきました。常に長期的なビジョンを見据えつつ、一度にすべてを受け入れるよう強いることは決してしませんでした。このアプローチこそが、現場からの抵抗感をなくし、スムーズな定着を実現したのです。</span></p>\n<h3><span style=\"vertical-align: baseline;\">これまでの成果</span></h3>\n<p><span style=\"vertical-align: baseline;\">2021 年にお届け時間帯の提供を開始したとき、その時間帯に配達できたのは約 50% でした。現在の達成率は 80% 台後半で、主要市場では 90% に近づいています。2023 年にリリースされた Follow My Parcel 機能では、受取人が配達員の直前の立ち寄り先を追跡できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在は、Google Maps Platform を活用した AI による </span><a href=\"https://developers.google.com/maps/documentation/route-optimization?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Route Optimization </span></a><span style=\"vertical-align: baseline;\">機能を試験運用しており、数十台の車両による数千件の配送データを分析して、移動時間と距離を短縮できる最適な配送計画を提案しています。私たちが提示するのは選択肢であり、命令ではありません。配達員は、確認、調整、フィードバックを行います。最良の結果は常に、テクノロジーが計算できるものと、人間が知っているものを組み合わせることで生まれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">私たちが描く長期的なビジョンは、住所インテリジェンス、ナビゲーション、リアルタイムの可視化、そしてルート計画を一つに融合させた、シームレスな配送オペレーションの実現です。これまで数年にわたり、テクノロジーに自分たちを合わせるのではなく、DHL Express の働き方にテクノロジーを合わせるという形で、その基盤を築いてきました。目標はずっと変わっていません。誰もが不可能だと思うスピードで荷物を届けること、そして、それを現場で支える人々に、彼らにふさわしい最高のツールを提供することです。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- DHL Express、EVP 兼 CIO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Dirk Olufs 氏</strong></p></div>"
  "467261283665b4d9bcb9c95dcdfa868f":
    "id": "467261283665b4d9bcb9c95dcdfa868f"
    "title": "AI が自らモデルを進化させる時代へ。カインズが AlphaEvolve で需要予測の誤差を 19% 改善"
    "link": "https://cloud.google.com/blog/ja/topics/customers/cainz-reduces-errors-in-demand-forecasting-with-alphaevolve/"
    "published": "2026-10-30 10:00:00"
    "fetched": "2026-10-30 10:33:42"
    "summary": "<div class=\"block-paragraph\"><p>全国に 281 店舗以上のホームセンターを展開し、独自のプライベート ブランド（PB）商品の開発やデジタル戦略に注力する株式会社カインズ（以下、カインズ）。同社では、膨大な商品の発注・在庫管理を最適化するため、Google Cloud を基盤とした需要予測プロジェクトを推進しています。本記事では、アルゴリズムを自律的に進化させる AlphaEvolve（プレビュー版）を導入し、3 年間のチューニングの壁を突破して需要予測の誤差を 19% 改善した取り組みについて、同社の矢口氏と神戸氏にお話を伺いました。</p><p><b>利用しているサービス:<br /></b>BigQuery、AlphaEvolve</p><h3><b>全店舗・最大 3,000 万行におよぶ需要予測の歩みと、属人化からの脱却</b></h3><p>カインズにおける需要予測プロジェクトは 2021 年 11 月に発足し、約半年間のプロトタイプ検証を経て、2022 年 6 月にミニマムでの本番運用をスタートしました。その後、段階的に対象を拡大し、2024 年 9 月には約 200 店舗、2025 年 10 月には全店舗へと展開を完了しています。</p><p>現在、同社では大きく分けて「長期予測」と「短期予測」の 2 つの軸で需要予測モデルを実行しています。</p><ul><li><b>長期予測（PB 商品の海外生産向け）：</b>カインズが注力する PB 商品は海外で生産されるケースが多く、長いリードタイムが求められます。そのため、食品から雑貨まで全カテゴリーにわたる約 1 万 SKU を対象に、単品別で 39 週先の需要予測を行っています。</li><li><b>短期予測（店舗の自動発注・在庫管理向け）：</b>店舗の在庫が一定水準を下回った際に自動で発注を行う「自動発注点管理」に用いられます。店舗の限られた在庫スペースを最適にコントロールするため、店舗別・単品別（SKU 別）に 6 週先の細かい予測を実施しています。通常時で約 190 万 SKU、繁忙期には最大 500 万 SKU（× 6 週間分で約 3,000 万行）という膨大な規模の予測を処理しています。</li></ul><p>この仕組みを導入する以前、長期予測においては各ディストリビューターの経験や個人のオペレーション マニュアルに依存しており、担当者のスキルによって発注精度にばらつきが生じることが課題でした。また、短期予測においても、従来は表計算ソフトで前年や直近の実績をもとに発注点を管理していましたが、直近実績だけでは季節性商品の立ち上がりを捉えきれず、欠品が発生するなどの課題を抱えていました。</p><p>Google Cloud の Vertex AI Forecasting を用いた需要予測モデルの導入により、新任の担当者であっても一定の精度を担保した発注が可能になり、店舗における欠品削減など着実な成果を上げてきました。</p><h3><b>3 年間の試行錯誤で見えてきた、人間による特徴量設計とモデル改善の限界</b></h3><p>全店展開によって一定の成果を上げていたカインズですが、運用を続ける中でさらなる精度向上に向けた「壁」に直面していました。当時の課題について、矢口氏は次のように振り返ります。</p><p>「一番の課題は、モデルの改善における試行錯誤の限界でした。私たちは週に 1 回、業務ユーザーと打ち合わせを行い、『ピークにもっと追従してほしい』『特定のイベントによる特需の影響は来年の予測から除外してほしい』といったドメイン知識や要望をヒアリングし、特徴量の出し入れやハイパーパラメーターの調整を行っていました。しかし、人間が自分で考えて調整し、検証を回すやり方では、試せる回数にも限界があり、本当にこのモデルが最適なのかを追求しきれないという実情がありました。」（矢口氏）</p><p>また、新商品が投入された際に既存商品の売上が分散する「カニバリゼーション（社内競合）」の予測も難題の一つでした。月 1 回のモデル再学習を行っていたものの、新商品の売れ行きトレンドが実績として現れるまでにはタイムラグが生じるため事前の予測が難しく、実績が出始めた後のトレンド変化やカテゴリー内の需要分散を素早く捉えるための特徴量設計も複雑を極めていました。3 年間にわたり PDCA を回し続けた結果、人間の手作業によるチューニングではこれ以上の改善は難しいという手詰まり感が生まれていたのです。</p><h3><b>自律的にアルゴリズムを進化させる「AlphaEvolve」との出会い</b></h3><p>この状況を打破するきっかけとなったのが、2026 年 4 月頃に矢口氏が目にした Google のブログ記事で紹介されていた「AlphaEvolve」でした。AlphaEvolve は、AI が自律的にアルゴリズムの最適化やモデルの進化を行うエージェント技術です。一般的なコーディング支援 AI との違いについて、矢口氏は次のように語ります。</p><p>「一般的な LLM やコーディング エージェントでも、対話を通じて『こういう特徴量やパラメーターが良いのではないか』という提案やサポートはしてくれます。しかし、それを実際に実行して結果を確認し、ダメなら次の手を考えるというプロセス自体は、結局人間がワンショットで 1 回ずつ回さなければなりません。これでは既存の作業が多少早くなるだけで、本質的な改善にはなりませんでした。私たちが求めていたのは、実行結果を踏まえて AI 自身が自己学習的に新しいパラメーターや特徴量を何百、何千と自動で試し、テストと検証を繰り返して最適解を導き出してくれる仕組みでした。AlphaEvolve を見たとき、『これならモデルの改善を自動でやってくれるのではないか』と強い可能性を感じました。」（矢口氏）</p><p>「需要予測の精度を高める」という明確な評価指標を持っていたカインズにとって、目標に向かって自律的にアルゴリズムを進化させる AlphaEvolve はまさに理想的なソリューションでした。さらに、実業務へ導入する上では、Antigravity などのコーディング エージェントと AlphaEvolve を組み合わせることで大きな相乗効果が得られたと矢口氏は続けます。</p><p>「AlphaEvolve は自律的にモデルを進化させてくれますが、その土台となる初期プログラムの作成や、データリークを防ぎつつ精度を正しく測る評価ロジックの設計、さらには生成されたモデルの本番パイプラインへの組み込みなどを AlphaEvolve 単体で行うのは正直なところ簡単ではありません。そうした周辺の実装や検証環境の構築をコーディング エージェントにサポートしてもらい、コアとなる何百・何千回のアルゴリズム探索を AlphaEvolve に任せるという組み合わせが非常に相性が良く、実践におけるハードルを大きく下げてくれました。」（矢口氏）</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_5YWkP6q.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">予測誤差を 19% 削減し、複数モデルの統合による運用効率化とコスト削減を実現</strong></h3>\n<p><span style=\"vertical-align: baseline;\">カインズは AlphaEvolve を長期予測モデルの本番環境に導入し、劇的な成果を上げています。長期予測モデルの改善を担当する神戸氏は、その定量的なインパクトについて次のように語ります。</span></p>\n<p><span style=\"vertical-align: baseline;\">「私がジョインしてから約 3 年間、長期モデルの改善を段階的に行ってきましたが、手詰まり感があった中で AlphaEvolve を使ったアルゴリズム改善に取り組んだ結果、予測の誤差を一気に 19% 改善することができました。3 年間かけて人間がチューニングしてきたものから、さらに 19% 跳ね上がったというのは非常に大きな成果です」（神戸氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、AlphaEvolve の導入は精度向上だけでなく、システム運用の効率化とコスト面でも大きなメリットをもたらしました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">複数モデルの統合による汎用性の向上：</strong><span style=\"vertical-align: baseline;\">従来は販売数量などの条件に応じて複数のモデルに分割して予測を行っていましたが、AlphaEvolve によって生成されたアルゴリズムは極めて汎用性が高く、すべてを「1 つのモデル」に統合した上で 19% の誤差改善を達成しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">運用負荷とコストの削減：</strong><span style=\"vertical-align: baseline;\">これまで Vertex AI Forecasting で複数のモデルを稼働させていた環境を、AlphaEvolve による単一の高精度モデルへと置き換えたことで、管理・運用の手間が大幅に軽減されるとともに、ランニング コストの削減も実現しました。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">今後の展望：人が特徴量を考える時代から、AI が自らモデルを進化させる時代へ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">新しい長期予測モデルが本番稼働を開始して約 4〜5 週間が経過し、現在は 13 週〜39 週先のリードタイムに向けた予測が進行しています。また、AI がカテゴリー内の需要変化を捉える特徴量を自律的に探索できるようになったことで、従来は人手での対応に限界があったカニバリゼーションに伴う需要変動に対しても、今後さらに改善していける可能性が見えてきています。今後は、予測精度が向上したカテゴリーにおいて、実際の店舗やサプライチェーンでの欠品削減や在庫水準の最適化にどれだけの経営インパクトが表れるか、効果測定を楽しみにしていると語ります。</span></p>\n<p><span style=\"vertical-align: baseline;\">最後に、今回の実績を踏まえ、これから需要予測や機械学習のビジネス活用を目指す企業へのメッセージとして、矢口氏は次のように締めくくりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「これまでもノーコードやローコードのツールを使えば、機械学習モデルを『作ること』自体はできました。しかし、実務で使えるレベルまでモデルの精度を高めるには、経験豊富な AI/ML エンジニアが試行錯誤して特徴量を考えたりチューニングしたりする必要があり、十分な精度が出せないことが壁となってビジネスへの機械学習の適用はなかなか進みませんでした。しかし、AlphaEvolve に目標を与えれば、パラメーターの調整だけでなくドメイン特有の特徴量まで AI が自ら生成し、モデルを進化させてくれます。専門の AI/ML エンジニアがいなくてもモデルの精度を高めることができるため、需要予測に限らず、ビジネスにおける機械学習の適用可能性が飛躍的に高まっていくと考えています。」（矢口氏）</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_kGXxIuc.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>株式会社カインズ</b><br />株式会社カインズは、全国に 289 店舗を展開するホームセンター チェーンです。「くらし DIY 」をブランド コンセプトに、くらしを豊かにする価値ある商品・サービスを開発し、お値打ち価格で毎日提供します。Kindness（親切心）と創意工夫のアイデアあふれる店舗づくりに努めることで、お客様一人ひとりの、ご家族の、そして地域の日常を楽しいものとし、お客様とのプロミスである「くらしに、ららら。」をお届けします。</p><p><b>インタビュイー</b><br />株式会社カインズ　<br />ビジネスソリューション部 需要予測グループ　グループマネジャー　矢口 未知彦 氏<br />ビジネスソリューション部 需要予測グループ　データサイエンティスト　神戸 佑太 氏</p><p><b>インタビュアー</b><br />グーグル・クラウド・ジャパン合同会社<br />シニア アカウント エグゼクティブ　西森 万晃<br />カスタマー エンジニア　遠山 雄二</p></div>"
  "d8ff1615593f9d2d45aa726ac48ee4ad":
    "id": "d8ff1615593f9d2d45aa726ac48ee4ad"
    "title": "BigQuery ObjectRef の一般提供を開始: 会話分析用のマルチモーダル データ プラットフォームをすべて SQL で構築"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/analyze-unstructured-data-in-bigquery-with-objectref/"
    "published": "2026-10-30 11:30:00"
    "fetched": "2026-10-30 17:05:07"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 22 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/data-analytics/analyze-unstructured-data-in-bigquery-with-objectref?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>データ サイエンス、データ エンジニアリング、ML を担当する各チームにとって、画像、動画、音声、ドキュメントなどの非構造化データの価値を引き出すということは、これまで、サイロ化されたデータ パイプラインを管理することを意味していました。構造化データと非構造化データを別々に、さらには、分析と AI / ML のユースケースを別々に扱う必要があると考えられてきました。たとえファイルが Cloud Storage 内にあっても、推論を実行するには外部の ML ワークロードをオーケストレートする必要があり、その後、構造化された推論出力を再度データ ウェアハウスに結合させるという、複雑で脆弱な課題に取り組まなければなりません。この事後的なデータ結合は、運用上のオーバーヘッドを増大させるばかりか、データベースの整合性も危うくします。</p><p>この問題を解決するために、このたび、BigQuery の <b>ObjectRef</b> とマルチモーダル データ分析が<b>一般提供（GA）</b>となり、BigQuery が包括的なマルチモーダル エージェント データ プラットフォームとして確立されました。</p><p>ObjectRef を使用すると、Cloud Storage と分析エンジンのギャップを BigQuery でネイティブに埋めることができます。非構造化データを ObjectRef 列としてネイティブに取り込み、従来のリレーショナル データベースの構造化データ列と並列で扱うことが可能になったのです。会話分析において、単一の SQL クエリまたは自然言語クエリで<b>マルチモーダル、複数列の入力</b>を Gemini モデルに直接受け渡せるので、スタンドアロン モデル API と比較しても大きなメリットが得られます。BigQuery AI、BigQuery の会話型分析、そして Gemini Enterprise で ObjectRef を使用できるようになったことで、Cloud Storage のファイルを、構造化データベースの豊富なコンテキストや、メタデータ、タイムスタンプ、カスタム エージェントへの指示などと簡単に組み合わせることができます。</p><p>これにより、完全なサーバーレス コンピューティング、低い総所有コスト、大規模な処理が可能な組み込みの推論といった、BigQuery ならではの強みを活用しながら、非構造化から構造化、非構造化から非構造化、そしてマルチモーダルからマルチモーダルへの高度なパイプラインをフルに構築、実行、管理できるようになりました。しかも、これらに個別のコンピューティング クラスタは必要ありません。重要なのは、ObjectRef を非構造化オブジェクトと同じ行に保存することで、抽出された特徴とアノテーションを非構造化オブジェクト自体と直接組み合わせることができる点です。この結合されたデータを会話分析と AI エージェントで直接使用することで、非構造化ファイルを純粋な構造化形式に変換する際に発生しがちな、データやコンテキストのニュアンスの喪失を回避できます。多くのお客様はすでにこのアプローチを使用して、<b>マルチモーダル ベクトル検索用のエンベディングを生成</b>し、<b>生成 AI を使用して大規模な分類</b>を実行し、膨大なドキュメントやメディアのアーカイブから正確な<b>データと特徴を抽出</b>しています。これらは、以下のように、すべて標準 SQL で実行できます。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT\\r\\nAI.AGG(image_ref, &quot;Summarize the major categories of pictures&quot;)\\r\\nFROM\\r\\n`bigquery-public-data.cymbal_pets.products`;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9047ce1d90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>ObjectRef で非構造化データも構造化データ同様に処理</b></p><p>ObjectRef は、BigQuery の外部オブジェクトを参照する（ポインタとなる）組み込みの事前定義された STRUCT データ型です。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- ObjectRef is a special STRUCT in BigQuery \\r\\nSTRUCT&lt;\\r\\n  uri STRING,\\r\\n  version STRING,\\r\\n  authorizer STRING,\\r\\n  details JSON&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9047ce1490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>これらのポインタを従来の構造化データの列とともに標準の BigQuery テーブルにネイティブに保存することで、BigQuery は非構造化ファイルを第一級オブジェクトのデータとして扱います。さらに、このアーキテクチャは独立したデータ ライフサイクルをサポートします。これは、GCS データと BigQuery テーブルが、他のシステムの基盤となるデータに影響を与えることなく、独立して変更できることを意味します。</p><p>このアプローチは、複数のデータペルソナに対し、大きなメリットをもたらします。</p><ul><li><b>ゼロコピー アーキテクチャ:</b> 大量のメディア ファイルを Cloud Storage に安全に保管し、BigQuery で即座にクエリを実行できます。データ グラビティを尊重し、コストのかかるデータ重複を回避できます。</li><li><b>SQL と Python の相互運用性:</b> 標準 SQL または BigQuery DataFrames を使用して非構造化データをクエリできます。重要なのは、ObjectRef を BigQuery Python UDF に受け渡すことができる点です。これにより、OpenCV などのオープンソース Python ライブラリをデータに直接適用し、データを移動することなくカスタム ロジックを実行できます。</li><li><b>独立したライフサイクルとバージョニング:</b> ObjectRef は、特定の GCS 世代番号を追跡することで、推論の再現性を確保します。基盤となる GCS ファイルが変更された場合でも、クエリは、行が書き込まれたときに存在していたファイルの正確なバージョンを参照できます。</li><li><b>ガバナンスの統一:</b> BigQuery の既存のセキュリティ ポリシーと IAM 制御を使用して、構造化された列とそれに関連する非構造化ファイルの両方へのアクセスを保護、監査、共有できます。</li></ul><p><b>SQL で完全な忠実度の ETL を構築</b></p><p>ObjectRef のプレビュー版をリリースして以来、ユーザーの間で、<b>SQL のみで完全な忠実度の ETL パイプラインを構築する</b>、盤石で非常に効果的なパターンが醸成されています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_4ahVBX3.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>データや ML の担当チームは BigQuery のサーバーレス アーキテクチャを活用して、AI / ML をデータ環境に直接統合できます。データの移動や推論の処理のために個別のコンピューティング クラスタを用意する必要はありません。GCS 内の非構造化データを標準の BigQuery 列として管理することで、べき等性のあるパイプラインの構築、再現性の確保、シームレスなバックフィルの実行といったデータ エンジニアリングの基本的なベスト プラクティスを、画像、動画、音声、ドキュメントに直接適用できます。</p><p>このようにデータを盤石の状態で準備できたら、いつでも BigQuery 内で Gemini を使用して、完全な忠実度の ETL を実行できます。元の ObjectRef を同じ行に固定したまま、特徴を抽出して非構造化データにアノテーションを付けることで、<b>2 層式の分析</b>が可能になります。つまり、構造化された出力が高速フィルタリング、レポート、BI ダッシュボードを可能にし、アタッチされた非構造化オブジェクトは、コンテキストを重視した詳細な推論に利用できます。たとえば、顧客との通話録音のアーカイブから感情スコアとトピックタグを抽出し、BI ダッシュボード（構造化レイヤ）でリスクのある顧客アカウントにすばやくフラグを立てることも可能です。同時に、エスカレーション プロセスを評価する会話分析エージェントは、元の音声ファイルにシームレスにフォールバックして、発信者とカスタマー サービス担当者のやり取りを分析できます。これにより、非構造化から構造化への ETL パイプラインで発生しがちな、重要なニュアンスの喪失を防ぐことができます。</p><p><b>業界リーダーの声（実証済みユースケース）</b></p><p>「Snap では、コミュニティの安全を最優先に考えており、コミュニティ ガイドラインに違反するコンテンツをユーザーから遮断できるよう取り組んでいます。そこで、公開投稿のサンプルを定期的に審査しているのですが、ObjectRef と BigQuery AI の活用により、単純なランダム サンプリングから事後層別サンプリングへの移行を実現しました。この移行により、人間による審査プロセスの効率が向上し、時間と労力が節約できて新しいワークフローや既存ワークフローの拡充に再投資できるようになったため、有害リスクのコンテンツを検出して対処する能力がさらに向上しました。」 - <b>Snap、データ サイエンティストCarlos Ortiz 氏</b></p><p>BigQuery ObjectRef は、すでにプレビュー段階において多岐にわたる重要なワークロードに導入されています。お客様は、これらの試験運用パイプラインを本番環境に移行し、非構造化データを実用的な構造化されたインサイトに変換することに成功しています。代表的な事例をいくつか挙げます。</p><ul><li><b>コンテンツの管理:</b> 各種オンライン プラットフォームが、BigQuery を活用してマルチメディア アセットを標準テレメトリー データとともに単一パイプラインに統合し、管理機能と安全性を抜本的に向上させています。</li><li><b>プロアクティブな脅威検出:</b> 多くの企業では、セキュリティ チームが BigQuery を使用して、ウェブの視覚的要素と構造的要素をネットワーク ログとともに分析し、脅威をプロアクティブに特定する仕組みを劇的に進化させています。</li><li><b>インベントリ コンプライアンス:</b> 各種オンライン小売業者が、膨大な画像リポジトリからテキストとコンテキストを直接抽出して、規制やブランド コンプライアンスに関わる問題の大規模な自動フラグ付けを実現しています。</li><li><b>カスタマー エクスペリエンスの向上:</b> サービス指向の企業は、BigQuery AI を使用してサポート エージェントと顧客の音声によるやり取りを分析し、顧客の感情評価をサービスの向上につなげています。</li></ul><p><b>一般提供で追加された新機能</b></p><p>一般提供リリースでは、お客様の幅広いユースケースのサポートに重点を置き、デベロッパー エクスペリエンスを効率化しました。</p><ul><li><b>柔軟な認証:</b><ul><li>一般提供（GA）では、<b>ObjectRefs のエンドユーザー認証情報（EUC）サポート</b>が導入されました。ユーザーが自分の IAM ID を使用して非構造化データを直接すばやくクエリ、探索できるアドホック分析が可能になりました。</li><li>プレビュー版では、非構造化ファイルに対してクエリを実行するには、ObjectRef 用に明示的な BigQuery 接続の設定が必要でした。この接続は、<b>サービス アカウント主導の堅牢な本番環境パイプラインの推奨ベスト プラクティス</b>として引き続き完全にサポートされますが、追加設定の手間を省くため、GA ではアドホック分析サポートが追加されました。</li></ul></li><li><b>Cloud Storage メタデータの統合サポート:</b> 非構造化データのメタデータは、Google Cloud のさまざまな場所に存在します。ObjectRef は、これらのデータソースをすべてネイティブにサポートするようになりました。メタデータが現在 <b>BigQuery オブジェクト テーブル</b>にあろうが、<b>Cloud Storage Insights データセット</b>、あるいは標準 BigQuery テーブル内の<b>生文字列 URI</b> として存在していようが、ObjectRef をシームレスに作成、管理でき、基となるデータを分析することができます。</li><li><b>比較分析のための配列サポート:</b> 配列に含まれる ObjectRef の処理をネイティブにサポートできるようになりました。これにより、複数ドキュメントを相互比較したり、一連の画像を分析したり、1 回のセマンティック呼び出しで複数アイテムをバッチ処理したりするなど、これまでできなかったタイプのワークロードを処理できます。</li></ul><p><b>実用例: エンドツーエンドのマルチモーダル分析</b></p><p>これらの GA アップデートの機能性を確認するために、簡素化された SQL 演算子を使用して実践的なマルチモーダル パイプラインを構築する方法を見てみましょう。</p><ol><li><b>完全な忠実度の ETL: コールセンターの音声分析</b></li></ol><p>カスタマー サービスの通話分析において、従来は、音声ファイルを文字起こしと自然言語処理のための専用クラスタに移動する必要がありました。しかし、ObjectRef を使用すると、音声ファイルを解析して構造化されたビジネス インテリジェンスを抽出し、標準的なリレーショナル データベースの列として直接追加できます。</p><p>GA で追加された OBJ.MAKE_REF() 関数を使用して、生文字列 URI から音声形式を自動的に検出し、一般的なユースケースに BigQuery の<a href=\"https://docs.cloud.google.com/bigquery/docs/generative-ai-overview#managed_ai_functions\">マネージド AI 関数</a>を適用できます。たとえば、AI.CLASSIFY() を使用して顧客の通話タイプを分類することができます。BigQuery は<a href=\"https://docs.cloud.google.com/bigquery/docs/optimize-ai-functions\"> AI 関数向けに最適化モード</a>をデフォルトで使用して、消費されるトークン数を削減します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE OR REPLACE TABLE call_center.annotated_call_logs AS\\r\\nSELECT \\r\\n  customer_id,\\r\\n  call_date,\\r\\n  OBJ.MAKE_REF(audio_uri) as ref,\\r\\n  AI.CLASSIFY(\\r\\n    OBJ.MAKE_REF(audio_uri), [\\r\\n      &quot;Lost or stolen card&quot;, \\r\\n      &quot;Declined card payment&quot;, \\r\\n      &quot;Activate my card&quot;,\\r\\n      &quot;Order physical card&quot;,\\r\\n      &quot;Cancel transfer&quot;,\\r\\n      &quot;Password or pin forgotten&quot;,\\r\\n      &quot;Virtual card not working&quot;,\\r\\n      &quot;Card swallowed by ATM&quot;,\\r\\n      &quot;Balance not updated after bank transfer&quot;,\\r\\n      &quot;Balance not updated after check or cash deposit&quot;,\\r\\n      &quot;Extra charge on statement&quot;,\\r\\n      &quot;Transfer fee charged&quot;\\r\\n    ]\\r\\n  ) AS customer_issue_type,\\r\\n  FROM \\r\\n  call_center.raw_call_logs;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9047ce2350&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>このテーブルは、BigQuery 会話型分析エージェントのマルチモーダル データソースとして機能します。エージェントは自然言語クエリを SQL に変換しますが、追加情報が必要な場合は BigQuery AI 関数を使用して音声ファイルを分析します。</p><p><b>2.大規模な生成 AI フィルタリング: プロダクト コンプライアンス</b></p><p>データ エンジニアは、画像やドキュメントの内容に基づいて大規模データセットのフィルタリングを頻繁に行う必要があります。そこで GA では、重い生成クエリを実行してテキスト出力を解析する代わりに、WHERE 句で標準 SQL とともに宣言型の AI.IF() 演算子をネイティブに使用できるようになりました。デフォルトの<a href=\"https://docs.cloud.google.com/bigquery/docs/optimize-ai-functions\">最適化モード</a>では、消費されるトークンの数が削減され、ワークロードもさらに最適化されます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_folidzi.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT \\r\\n  product_id,\\r\\n  seller_id,\\r\\nFROM \\r\\n  ecommerce.vendor_uploads\\r\\nWHERE \\r\\n  upload_date &gt;= CURRENT_DATE() - 1 AND\\r\\n  AI.IF((&quot;Does this product image contain a restricted item or policy violation?&quot;, OBJ.MAKE_REF(image_uri)))&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9047ce0f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. 複数オブジェクトの推論: プロアクティブな脅威検出</strong></p>\n<p><span style=\"vertical-align: baseline;\">GA で配列がネイティブにサポートされたことで、Gemini を 1 度だけ呼び出して ObjectRef の配列を受け渡し、複数のファイルを同時に分析できるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これにより、複雑な比較ロジックを SQL で直接実行することができます。たとえば、セキュリティ チームは、公式ログインページのスクリーンショットと、新たに発見された不審なウェブページのスクリーンショットを同時に Gemini に渡すことで、フィッシングの検出を大規模に実施できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT\\r\\n  uri,\\r\\n  size,\\r\\n  updated,\\r\\n  result.animal_type,\\r\\n  result.item_color\\r\\nFROM (\\r\\n  SELECT\\r\\n    uri,\\r\\n    size,\\r\\n    updated,\\r\\n    AI.GENERATE(\\r\\n      (&quot;What type of animal is this pet product for, and what is its primary color?&quot;, ref),\\r\\n      output_schema =&gt; \\&#x27;animal_type STRING, item_color STRING\\&#x27;\\r\\n    ) AS result\\r\\n  FROM\\r\\n    OBJ.LIST(\\&#x27;gs://cloud-samples-data/bigquery/tutorials/cymbal-pets/images/*.png\\&#x27;)\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9047ce30d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT \\r\\n  log_id,\\r\\n  suspect_domain,\\r\\n  assessment.is_phishing,\\r\\n  assessment.visual_discrepancies\\r\\nFROM (\\r\\n  SELECT \\r\\n    log_id,\\r\\n    suspect_domain,\\r\\n    AI.GENERATE(\\r\\n      (\\r\\n        &quot;Compare these two web UI screenshots. The first is our official, trusted login page. The second is a suspected spoofed page. Identify any visual discrepancies, missing logos, or fake elements, and determine if it is a phishing attempt.&quot;, \\r\\n        [OBJ.MAKE_REF(trusted_ui_uri),OBJ.MAKE_REF(suspect_ui_uri)]\\r\\n      ),\\r\\n      output_schema =&gt; \\&#x27;is_phishing BOOLEAN, visual_discrepancies STRING\\&#x27;\\r\\n    ) AS assessment\\r\\n  FROM \\r\\n    cybersecurity.network_ui_logs\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9047ce3cd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>ObjectRef を使用して今すぐ分析を開始する</b></p><p>BigQuery ObjectRef は、BigQuery のすべてのエディションとオンデマンド料金ティアで一般提供されています。</p><p>現在 Cloud Storage ファイルで ML 推論を実行するためだけに断片化された複雑なインフラストラクチャを管理されているのなら、ぜひ統合を検討することをおすすめします。AI はストレージに直接組み込めます。既存のデータ エンジニアリング手法を活用して、堅牢でスケーラブルかつ安全なマルチモーダル分析パイプラインを BigQuery 内に直接構築しましょう。</p><p>ObjectRef およびマルチモーダル分析のご利用を開始するには、以下のリソースをご覧ください。</p><ul><li><a href=\"https://docs.cloud.google.com/bigquery/docs/multimodal-data-sql-tutorial\">ハンズオン チュートリアル</a>で、合成データを使用して画像キャプションを生成し、商品カテゴリを割り当てる方法をご確認ください。</li><li>Cloud Next のライブデモで、<a href=\"https://www.youtube.com/watch?v=hBg8FB6vCQ8&amp;t=1s\" target=\"_blank\">非構造化データと構造化データの統合</a>と、<a href=\"https://www.youtube.com/watch?v=dPcta6Jvuvs&amp;t=2s\" target=\"_blank\">LLM を使用したテキストの生成とベクトル検索の実行</a>をご覧ください。</li><li>BigQuery ドキュメントで <a href=\"https://docs.cloud.google.com/bigquery/docs/work-with-objectref\">ObjectRef の操作方法</a>をご確認ください。</li></ul><p><b><i>-</i></b> <i>エンジニアリング マネージャー、</i><b><i>Guarav Soni</i></b></p><p><b><i>-</i></b> <i>プロダクト マネージャー、</i><b><i>Jamy Su</i></b></p></div>"
  "5c222b3b6820584229f892247a022a72":
    "id": "5c222b3b6820584229f892247a022a72"
    "title": "データ主権の境界内におけるマネージド RAG 検索: Gemini on GDC エンタープライズ検索"
    "link": "https://cloud.google.com/blog/ja/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search/"
    "published": "2026-10-30 11:00:00"
    "fetched": "2026-10-30 17:05:07"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 21 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>国家安全保障機関をはじめ、データ主権の保護を求められる厳しい規制下の組織では、機密報告書、現場のマニュアル、取り扱いに注意を要するマルチモーダル データセットなど、非常に機密性の高いデータを扱っています。パブリック クラウドで利用可能な検索とマルチモーダル インテリジェンスは、チームがそのデータを管理および分析するのに役立ちますが、厳格なデータ主権の規制により、データをお客様の施設内から持ち出すことはできません。</p><p>代替手段として、安全で切断された境界内にカスタム エージェント検索をデプロイする方法がありましたが、これまでは、モデルの統合、音声文字変換と光学式文字認識（OCR）パイプラインの構築、ベクトル データベースの構成、独自のユーザー インターフェースの管理など、カスタム インフラストラクチャの構築と維持に数か月を要していました。</p><p>このたび、上述の課題を解決するために、NVIDIA Blackwell Ultra で高速化された<a href=\"https://cloud.google.com/distributed-cloud\"> Google Distributed Cloud（GDC）</a>エアギャップ上の Gemini によるエンタープライズ検索機能が利用可能になったことをお知らせいたします。プレビュー版では、このフルマネージドの検索拡張生成（RAG）検索エクスペリエンスは、物理的なセキュリティ境界内で完全に実行され、公共のインターネットや Google Cloud のグローバル インフラストラクチャには接続されません。チームは、会話にファイルをアップロードして、Gemini にそのファイルに関する情報の検索、要約、比較、翻訳を依頼できるようになりました。すべての回答には出典が明記され、会話はセッション間で保持されます。</p><p>GDC のエンタープライズ検索機能により、チームはサイロ化されたデータを検索して、強力な分析情報を引き出すことができます。これらの機能によって、次のことができるようになりました。</p><ul><li><b>数百ページから引用された回答を取得:</b> 長いマニュアル、レポート、ポリシーを対象に質問し、各回答がどのファイルから取得されたかを正確に確認できます。</li><li><b>言語の壁を越えて作業:</b> ある言語で質問すると、別の言語で書かれたドキュメントに基づいて回答を得られます。Gemini に翻訳してもらうこともできます。</li><li><b>多様なフォーマットをまとめて質問:</b> 音声録音、動画クリップ、画像、スプレッドシートを組み合わせることができ、個別の文字起こしや OCR の手順は不要です。</li><li><b>中断したところから再開:</b> 会話とファイルはセッション間で保持されるため、長時間の作業でも最初からやり直す必要はありません。</li><li><b>アクセス権限を必要最小限に制限:</b> 各ユーザーのチャットとファイルはそのユーザーのみに限定され、アクセス権はすでに管理している ID プロバイダ グループに従います。</li></ul><p>ユーザーは、PDF、Microsoft Word、PowerPoint、Excel ファイルのほか、TXT、HTML、PNG、JPEG 画像、WAV 音声、MP4 動画を操作できます。各ファイルの最大サイズは 100 MB、各チャットの最大サイズは 500 MB です。</p><p><b>コア アーキテクチャ レイヤ: 仕組み</b></p><p>ユーザーのクエリが、ログイン、ファイルの取り込み、Gemini による回答の生成、セッションの保存というスタックの各レイヤを通過する流れを見ていきましょう。どのステップも、組織のエアギャップ環境のネットワーク上で行われます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_90BLzo5.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>ID とアクセス</b></p><p>ユーザーは組織の ID プロバイダを介してログインします。管理者がサービスのユーザーロールを ID プロバイダのグループにマッピングすると、そのグループのメンバーのみがアプリケーションにアクセスできるようになります。各ユーザーのチャットとアップロードされたファイルは、そのユーザーのみに限定されます。</p><p><b>ドキュメントの取り込みとエンベディング</b></p><p>ユーザーがファイルをアップロードすると、そのファイルはアプリのオブジェクト ストレージ バケットに直接保存されます。バックエンドは、検索用に最適化されたアプリのマネージド PostgreSQL データベースにファイルのメタデータを記録します。バックエンドは、ファイルをチャンク（PDF ページのグループや画像のタイルなど）に分割し、バケットに書き込みます。GDC デプロイ内でネイティブに実行される Gemini エンベディング モデルが各チャンクをベクトルに変換し、バックエンドがそれをアプリの PostgreSQL データベースに保存します。</p><p>ユーザーが質問すると、お客様のデータセンター内の GDC で完全に実行されている最先端（SOTA）の Gemini モデルが、まず会話のコンテキストを使用して質問を書き換えます。次に、バックエンドは同じモデルで書き換えられた質問をエンベディングし、ベクトル データベースを検索します。</p><p><b>モデル提供</b></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_4I3U8T4.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>次に、バックエンドは質問、会話履歴、最も一致するデータを 1 つのマルチモーダル プロンプトに結合し、同じ GDC デプロイの NVIDIA HGX B300 システムで実行されている Gemini エンドポイントに送信します。Gemini はネイティブにマルチモーダルです。テキスト、画像、音声、動画を入力として受け入れるため、単一のコンテキストでさまざまなファイル形式のデータにわたって推論でき、個別の音声文字変換モデルや OCR モデルは必要ありません。その後、回答がソースファイルへの引用とともにユーザーにストリーミングされます。</p><p><b>永続性</b></p><p>最後に、永続レイヤが各会話の状態を保持します。各質問と回答はシステムのデータベースに保存され、アップロードされたファイルはオブジェクト ストレージに保持されるため、ユーザーは以前のセッションを再度開いて、中断したところから再開できます。</p><p><b>機密環境およびソブリン環境向けに構築</b></p><p>GDC の Gemini とエンタープライズ検索では、プロンプト、回答、アップロードされたドキュメント、エンベディングが組織のエアギャップ環境のネットワークから外に出ることはなく、すべてのモデルがローカルで実行されます。データは、ローカルで管理される HSM 鍵を用いた AES-256 ディスク暗号化により保管時に暗号化され、FIPS 承認のアルゴリズムを用いた TLS により転送時に暗号化されます。きめ細かいロールベース アクセス制御（RBAC）を備えたローカル IAM 統合により、リソースへのアクセスを管理します。<a href=\"https://cloud.google.com/blog/ja/topics/public-sector/google-distributed-cloud-gdc-gdc-air-gapped-appliance-achieve-dod-impact-level-6-il6-authorization\">GDC エアギャップは米国国防総省の IL6 認定を取得</a>しており、FedRAMP High のセキュリティ管理に準拠した厳格な要件をサポートするように設計されています。</p><p><b>コード実行: コンプライアンスとセキュリティ</b></p><p>Gemini エンタープライズ検索は、Gemini 推論スタックのローカルコード実行エンジンを活用して、構造化されたスプレッドシート データ（CSV や XLSX ファイルなど）から正確で決定論的な回答を提供します。</p><p>部門全体の平均給与の計算などの分析クエリを処理する場合、Gemini は Python コードを動的に生成し、大規模なエージェント オーケストレーション用に構築されたオープンソースの実行ランタイムである<a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke\"> Agent Substrate</a> 内で安全に実行します。</p><p>LLM 生成コードの実行に固有のセキュリティ リスクを軽減するため、Agent Substrate は厳格なネットワーク分離を適用し、<a href=\"https://cloud.google.com/blog/products/identity-security/open-sourcing-gvisor-a-sandboxed-container-runtime\">gVisor サンドボックス</a>内でワークロードを実行します。これにより、推論パフォーマンスを犠牲にすることなく、強力な分離境界を確保できます。</p><p><b>フロンティア モデルをソブリン データセンターに導入</b></p><p>妥協のないセキュリティと最先端のマルチモーダル インテリジェンスのどちらかを選ぶ必要はもうありません。エンタープライズ検索、Gemini 3.5 Flash、検索用に最適化されたデータベースが、GDC エアギャップの境界内でインターネットに依存せずに連携して動作し、優れた自律型機能を Sovereign Cloud に提供します。</p><p><a href=\"https://docs.cloud.google.com/distributed-cloud/hosted/docs/latest/gdcag/gemini-app/gemini-app-overview\">GDC エアギャップのドキュメント</a>をご覧になり、GDC 担当者にお問い合わせのうえ、Sovereign Cloud でこれらの検索機能を最大限に活用する方法をご確認ください。</p><p><b><i>-</i></b> <i>Google Distributed Cloud、シニア ディレクター</i><b><i>、Rohan Grover</i></b></p></div>"
"last_updated": "2026-10-30 17:05:07 JST"
