  "0030dcdb4cb652472de3d1a3ec729c48":
    "id": "0030dcdb4cb652472de3d1a3ec729c48"
    "title": "Querying Databricks Apache Iceberg Tables with the borderless Lakehouse"
    "link": "https://cloud.google.com/blog/products/data-analytics/querying-databricks-iceberg-tables-with-google-clouds-lakehouse/"
    "published": "2026-10-30 01:00:00"
    "fetched": "2026-10-30 01:36:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Enterprise organizations often leverage multiple data platforms, including Databricks, to execute heavy Apache Spark jobs alongside BigQuery to power highly concurrent analytics workloads. Historically, bridging these systems often meant building complex pipelines to copy data between environments. This approach increases storage costs, introduces latency, and fragments security controls.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">With Google Cloud’s borderless Lakehouse, you can now query Databricks-managed Apache Iceberg tables straight from BigQuery. This zero-copy approach removes the need to duplicate data: BigQuery reads the same files Databricks writes, and new changes appear after Lakehouse's next scheduled metadata refresh (as often as every 5 minutes).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_9nWgq7s.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">How Lakehouse and Databricks work together</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Managed Iceberg tables automatically generates Iceberg-compatible metadata alongside native Delta logs. Data engineering teams can store Parquet files once in Google Cloud Storage (GCS) using Databricks. Rather than loading this information into BigQuery, Lakehouse reads the Iceberg metadata directly, applying BigQuery’s vectorized engine directly to open-format files in GCS.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Although Google Cloud Storage (GCS) serves as the primary storage layer in the above example, Lakehouse extends this borderless federation directly to external cloud environments like Amazon S3 and Azure Blob Storage. By pairing the open Apache Iceberg REST Catalog with cross-cloud connections, Lakehouse lets BigQuery query data across clouds without moving it. Each federated catalog lives in a Google Cloud location you choose, ideally the region closest to your data. This lets BigQuery read open-format Parquet files where they live, delivering multi-cloud analytics without replication pipelines. Remote-cloud egress charges still apply, but Cross-Cloud Interconnect (AWS) and Lakehouse caching can reduce them.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Beyond simply querying external data, Lakehouse framework establishes true read and write (R/W) interoperability across engines. Because the platform is built on an open Apache Iceberg foundation, data teams can effortlessly execute multi-statement SQL commands directly inside BigQuery.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Centralized security and governance</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Handling access controls across disparate systems can introduce vulnerabilities. Lakehouse addresses this through delegated access. Administrators can configure a BigQuery Cloud Resource Connection tied to a service account that manages IAM rights for GCS buckets. Granting users access to the Lakehouse table entity lets you enforce BigQuery controls including row-level, column-level security, and dynamic data masking on external Iceberg tables while Databricks handles ingestion.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Catalog federation and credential vending</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Previously, connecting these platforms meant manually configuring BigQuery queries to point at static metadata paths. Modern setups leverage the open Apache Iceberg REST Catalog API. Databricks Unity Catalog functions as the central metadata layer, allowing a BigQuery administrator to establish a Lakehouse runtime catalog with a federated connection. When running a query, Lakehouse contacts Unity Catalog for current table state, and short-lived tokens are issued through credential vending to grant BigQuery temporary read access to GCS.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Partition pruning</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">BigQuery uses each table's Iceberg metadata to plan the query, then reads only the relevant data files in place. Iceberg's hidden partitioning lets you filter on logical columns, such as timestamps, without knowing the directory layout. Note that Databricks managed Iceberg tables don't support partition transforms; Databricks recommends liquid clustering instead.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Filters in a standard WHERE clause let BigQuery use the Iceberg manifests to skip partitions that can't match. Compare partition columns with literal values so pruning can apply. These manifests maintain detailed column-level statistical bounds, enabling BigQuery to bypass irrelevant manifest records and unneeded Parquet files immediately. Consequently, queries scan only necessary byte ranges, accelerating query execution while significantly reducing on-demand slot consumption and storage scan costs.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Fast queries with Iceberg metadata and Lakehouse caching</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Iceberg manifests already identify which data files to read, so BigQuery doesn't need a metadata cache for Iceberg tables. For cross-cloud tables, such as those in Amazon S3, Lakehouse caching (Preview) keeps retrieved data blocks in Google Cloud so repeat queries read them locally. BigQuery reads the Iceberg manifest files directly when it plans each query; there's no metadata caching to enable. This dynamic partition pruning bypasses unneeded files, significantly reducing runtime and bytes scanned.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Maintenance and lifecycle management</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Modern lakehouses demand active upkeep; without routine care, performance degrades into an inefficient repository. Fortunately, both BigQuery and Databricks supply native capabilities to preserve table hygiene and accelerate analytical workloads.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Keeping your tables optimized</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To maintain optimal query performance, active maintenance of your lakehouse storage footprint remains necessary.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Trigger regular compaction pipelines via Databricks APIs to merge tiny Parquet files into larger, optimized layouts and use Predictive Optimization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Execute the Databricks VACUUM command to clear unreferenced files outside active snapshots, avoiding extra GCS storage costs.</span></p>\n</li>\n</ol>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Compaction and the small file problem</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Frequent write operations, continuous ingestion jobs, and streaming workloads continuously produce thousands of small Parquet files. This fragmentation creates a storage bottleneck that can limit BigQuery’s reading efficiency. Establishing thousands of network connections to GCS and processing metadata footers across numerous tiny files consumes significant compute time, diminishing the performance advantages of vectorized query execution.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Running routine compaction within Iceberg resolves these inefficiencies. Databricks manages this automatically using Liquid Clustering which dynamically adjusts file layouts based on access patterns or through native table management utilities.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To compact small files manually on Databricks, run OPTIMIZE:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Run on Databricks to compact small files\\r\\n-- On Databricks:\\r\\nOPTIMIZE customer_events;\\r\\n-- For Iceberg tables you manage outside Databricks:\\r\\nCALL my_catalog.system.rewrite_data_files(\\r\\ntable =&gt; &#x27;default.customer_events&#x27;,\\r\\nstrategy =&gt; &#x27;binpack&#x27;,\\r\\noptions =&gt; map(\\r\\n&#x27;target-file-size-bytes&#x27;,\\r\\n&#x27;268435456&#x27;,\\r\\n&#x27;min-file-size-bytes&#x27;,\\r\\n&#x27;67108864&#x27;\\r\\n)\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fbba8f72910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Executing this command aggregates scattered file segments into larger, structured blocks typically between 256MB and 512MB that can help improve BigQuery’s scan throughput. The binpack approach operates rapidly by prioritizing total file size balancing, though alternative sorting strategies can organize dataset ordering along specific column keys.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Managing orphan files and snapshot retention (VACUUM)</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Every transactional update, record modification, and table compaction creates fresh snapshots within Iceberg to preserve dataset integrity. Over time, historical Parquet objects detached from active table states become orphaned. Although these legacy files facilitate time-travel analytics, neglecting them can drive up GCS storage charges over time.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Data teams can use the Databricks VACUUM operation to scan and purge abandoned storage files.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;ALTER TABLE customer_events SET TBLPROPERTIES (&#x27;delta.deletedFileRetentionDuration&#x27; = &#x27;7 days&#x27;);\\r\\nVACUUM customer_events FULL;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fbba8b31710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Standard configurations apply a mandatory seven-day threshold (deletedFileRetentionDuration) before executing VACUUM routines. Preserving this delay prevents active analytical jobs from encountering missing file errors while keeping historical recovery options available. Scheduling routine VACUUM jobs, or letting predictive optimization run them, removes unreferenced data files and, for tables with Iceberg reads, old Iceberg metadata. That keeps storage costs low and performance high across your lakehouse.</span></p>\n<h4 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Conclusion</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Connecting Databricks Apache Iceberg datasets to Lakehouse can help you activate your data with BigQuery. By separating processing from underlying storage, embracing open formats, and using standard REST APIs with credential vending, you can run scalable engineering workloads and concurrent analytics without migrating data or sacrificing performance</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Pairing Databricks Iceberg reads (UniForm) with Lakehouse federation, Lakehouse caching, and regular OPTIMIZE and VACUUM maintenance helps you build an efficient, zero-copy lakehouse. This approach can help lower storage spend, avoids fragile pipeline maintenance, and prepares your data environment for modern analytics and emerging AI workloads.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Constructing a unified architecture no longer requires moving data files across platforms. You can begin querying Databricks Iceberg tables by registering them with the Lakehouse runtime catalog today for bi-directional federation. Learn more by reading our </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-databricks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> to get started.</span></p></div>"
  "8639931991664b6323d0b31397007f45":
    "id": "8639931991664b6323d0b31397007f45"
    "title": "Cloud CISO Perspectives: Introducing new $250,000 tier for Google Cloud VRP (Q&A)"
    "link": "https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-introducing-new-tier-for-google-cloud-vrp/"
    "published": "2026-10-30 01:00:00"
    "fetched": "2026-10-30 01:36:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Welcome to the second Cloud CISO Perspectives for October 2026. Today, Chris Betz talks with Michael Cote, our vulnerability rewards program lead, about the new tier of our Cloud VRP program and the current state of vulnerability rewards.</span></p>\n<p><span style=\"vertical-align: baseline;\">As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the </span><a href=\"https://cloud.google.com/blog/products/identity-security/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud blog</span></a><span style=\"vertical-align: baseline;\">. If you’re reading this on the website and you’d like to receive the email version, you can </span><a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">subscribe here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fbba9ab9610&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Why we've created a new $250,000 tier for Google Cloud VRP (Q&amp;A)</span></h3>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">By Chris Betz, CISO, Google Cloud</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_PYRwidS.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>The Google Cloud Vulnerability Reward Program (VRP) partners with the global security research community to help elevate cloud security for all by encouraging the discovery of critical software vulnerabilities. In an era when automated research has made it more challenging to verify authentic vulnerabilities, we have a critical need to boost high-level, human-led research that can transcend automated-only discovery.</p><p>Today, we are expanding our top reward tier with a <a href=\"https://bughunters.google.com/\">new $250,000 Root-in-Cloud reward</a>, specifically designed to recognize high-impact architectural research. Identifying tenant-isolation bypasses and complex cross-service logic flaws requires human creativity, intuition, and rigorous systems analysis combined with the power of agentic systems.</p><p>To earn this premier reward, you must demonstrate full administrative control, the equivalent of “roles/owner” or complete IAM control, over arbitrary Google Cloud organizations or projects with no prior access or special project setup.</p><p>The exploit path can not depend on:</p><ul><li>Pre-existing access or footholds in the victim project.</li><li>Leaked, phished, or stolen credentials.</li><li>User interaction or social engineering.</li></ul>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong><span style=\"vertical-align: baseline;\">Proof-of-root: Clear, cryptographic validation</span></strong></p>\n<p><span style=\"vertical-align: baseline;\">To make testing safe, clear, and reproducible, without impacting production environments, we have defined </span><a href=\"https://bughunters.google.com/about/rules/google-friends/cloud-vulnerability-reward-program-rules\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">technical criteria for validating root-in-cloud access</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Additionally, valid vulnerability reports demonstrating remote code execution (RCE) in underlying Google production infrastructure (Borg) or achieving root-in-prod will automatically be evaluated by the Google Cloud VRP panel for root-in-cloud eligibility.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because code execution in Borg has the potential to impact service availability or cross-tenant data, researchers must halt all probing immediately upon achieving any execution in Borg. Escalation, extracting production credentials, and lateral movement are not allowed and will result in researcher disqualification. </span></p>\n<p><span style=\"vertical-align: baseline;\">The Google Cloud VRP panel will analyze the initial entry point, execution context, and attack surface to determine whether full arbitrary tenant or project takeover is achievable from that position, and award the bounty accordingly. </span></p>\n<p><span style=\"vertical-align: baseline;\">This new bounty tier reflects how security research continues to evolve, and the importance of continuing to recognize the most innovative and valuable security research. As part of those efforts, Google Security held its annual Escal8 conference in Singapore last week, and I had the opportunity to discuss the changing landscape with Michael Cote, Google Cloud’s vulnerability reward program lead. </span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">The following transcript has been lightly edited.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Chris Betz</strong><span style=\"vertical-align: baseline;\">: You are at Escal8 in Singapore announcing the new $250,000 Root-in-Cloud tier for our VRP. Why introduce this tier now, and what kind of research are you hoping to spark?</span></p>\n<p><strong style=\"vertical-align: baseline;\">Michael Cote</strong><span style=\"vertical-align: baseline;\">: This is a recognition of how the field of security research has changed over the past year. We value quality submissions from anyone, and we’ve seen that the combination of human creativity and agentic power is much richer than either on its own.</span></p>\n<p><span style=\"vertical-align: baseline;\">While automated scanners generate a high volume of low-impact noise, first-time researchers who pair human intuition with agentic tools are finding, on average, more interesting bugs than novices did two years ago. With the new Root-in-Cloud tier, we want to challenge the community and increasingly reward the complex, high-impact findings — like tenant-isolation bypasses and cross-service logic flaws — that require deep architectural intuition alongside agentic tools, because getting that information is essential to protecting our customers.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Chris Betz</strong><span style=\"vertical-align: baseline;\">: Google Threat Intelligence Group (GTIG) recently shared research showing that </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">monthly CVE disclosures have doubled</span></a><span style=\"vertical-align: baseline;\"> as agentic tools mature. From your seat leading the Cloud VRP, how has automation technology impacted the reports we’ve received? </span></p>\n<p><strong style=\"vertical-align: baseline;\">Michael Cote</strong><span style=\"vertical-align: baseline;\">: It has transformed our intake volume, though not in the way many people assume. While the number of valid vulnerability reports submitted to the Google Cloud VRP has remained stable over the last 18 months, the total number of reports has grown tremendously. </span></p>\n<p><span style=\"vertical-align: baseline;\">Automation has helped democratize vulnerability discovery, and the barrier to entry has been rapidly flattening, something even our top researchers noted at Escal8. Because we’re seeing more researchers and more first-timers with interesting bugs, that creates pressure on more experienced researchers to move faster and bring more impactful findings — although their experience continues to be a key differentiator in success.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Chris Betz</strong><span style=\"vertical-align: baseline;\">: I’ve been working with the research community for more than 20 years. One of the things I appreciate most is how much the community values making the world more secure. Bounty programs let us recognize this valuable work. How do you see the community changing as we move further into the agentic era? </span></p>\n<p><strong style=\"vertical-align: baseline;\">Michael Cote</strong><span style=\"vertical-align: baseline;\">: That shared commitment to making the world more secure is still the heart of this community, which is why the pressure to move faster is something we have to watch closely. As our GTIG colleagues found, the sharpest rise in the number of exploited vulnerabilities comes from </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">n-days, not zero-days</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Open source accounts have suggested that threat actors are using LLMs to rapidly turn newly-public vulnerability details into working exploits. When triage teams are already working through a surge in report volume, disclosing an unmitigated vulnerability well ahead of the standard 90-day coordinated disclosure window gives attackers the exact knowledge and time window they need to target customers.</span></p>\n<p><span style=\"vertical-align: baseline;\">With the influx of new submissions, I worry about a growing pressure to rush to publish. Something that concerns me because we’re already seeing early indications of it. Because LLMs lower the barrier to finding bugs in source-available software, researchers worry that waiting to verify risks will allow someone else to be first to publish. Even more concerning, that same competitive pressure can tempt even established security companies to disclose unmitigated vulnerabilities without coordination, and that rush puts our users directly at risk.</span></p>\n<p><a href=\"https://projectzero.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Project Zero</span></a><span style=\"vertical-align: baseline;\"> helped establish the industry’s 90-plus-30-day responsible disclosure policy, and autonomous detection and exploitation capabilities make following coordinated disclosure more important than ever. In the long run, rushing to be first works against a security company's own self-interest. Novel discoveries may bring temporary visibility, but customers will ultimately choose not to work with organizations that put them and the broader ecosystem at risk. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Chris Betz</strong><span style=\"vertical-align: baseline;\">: When you offer a $250,000 bounty, how do you make sure researchers can validate their findings without putting customer environments or service availability at risk?</span></p>\n<p><strong style=\"vertical-align: baseline;\">Michael Cote</strong><span style=\"vertical-align: baseline;\">: High incentives require clear, safe rules of engagement. We never want researchers testing exploits against real customer projects. Instead, we created a deterministic proof-of-root mechanism using a designated service account. Researchers can cryptographically prove unauthorized access against that identity.</span></p>\n<p><span style=\"vertical-align: baseline;\">We’ve also updated our </span><a href=\"https://bughunters.google.com/about/rules/google-friends/cloud-vulnerability-reward-program-rules#root-in-cloud-technical-validation\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">program rules</span></a><span style=\"vertical-align: baseline;\"> to establish strict boundaries around underlying production infrastructure. If researchers think they are close to a breakthrough but are uncertain where the boundary lies, we encourage them to reach out. We are always more than happy to work with them to ensure they are recognized and rewarded for the value of their research without taking steps that would invalidate the bounty.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Chris Betz</strong><span style=\"vertical-align: baseline;\">: What should enterprise CISOs take away from these trends? Especially those who run their own vulnerability management pipelines and partner with external researchers, what advice would you offer for navigating this AI inflection point?</span></p>\n<p><strong style=\"vertical-align: baseline;\">Michael Cote</strong><span style=\"vertical-align: baseline;\">: First, prepare your vulnerability triage workflows for agent-generated submissions. To keep valid reports from getting stuck in a backlog, security teams need ways to separate plausible-sounding hallucinations from real security risks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Second, compress your remediation timelines once a vulnerability becomes public. Defensive patching and mitigations have to move faster because autonomous technology compresses the time from disclosure to working exploits.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, hold your security partners and vendors to high standards of coordinated disclosure. It’s important that our industry continues to </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-ai-vendors-should-share-vulnerability-research-heres-why/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">normalize agentic vulnerability research</span></a><span style=\"vertical-align: baseline;\">, but we must do so responsibly. Let’s continue to keep user safety at the center of everything we do.</span></p>\n<p><span style=\"vertical-align: baseline;\">For more information on the Google Cloud VRP, including detailed endpoint specifications, JSON payloads, and CLI examples, please check out our </span><a href=\"https://bughunters.google.com/about/rules/google-friends/cloud-vulnerability-reward-program-rules#root-in-cloud-technical-validation\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">rules page</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fbba9c34110&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">In case you missed it</span></h3>\n<p><span style=\"vertical-align: baseline;\">Here are the latest updates, products, services, and resources from our security teams so far this month: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How Google Does It: Using agents to help find, track, and fix vulnerabilities</strong><span style=\"vertical-align: baseline;\">: Threat actors can now find software flaws faster than ever. To maintain an agile, responsive defense, we now use agentic systems with existing foundations. </span><a href=\"https://cloud.google.com/transform/how-google-does-it-using-agents-help-find-track-and-fix-vulnerabilities\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How to use agents to stop insider threats</strong><span style=\"vertical-align: baseline;\">: As agents find their place across the enterprise, we want to be sure that they neither become an insider threat nor enable people to become one. </span><a href=\"https://cloud.google.com/transform/how-to-use-agents-to-stop-insider-threats\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Responding to core PHP vulnerabilities CVE-2026-109618 and CVE-2026-10961</strong><span style=\"vertical-align: baseline;\">: Follow these recommendations to minimize remote code execution risks in PHP from two critical vulnerabilities in the core PHP language runtime. </span><a href=\"https://cloud.google.com/blog/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz Sensor for GKE: Turnkey threat detection for Kubernetes</strong><span style=\"vertical-align: baseline;\">: Introducing the Wiz Runtime Sensor add-on for Google Kubernetes Engine in preview, helping to manage deployment, lifecycle, credential security, and governance. </span><a href=\"https://cloud.google.com/blog/products/identity-security/wiz-sensor-for-gke-turnkey-threat-detection-for-kubernetes\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale agents securely with IAM Helper Agent skills and MCP tools</strong><span style=\"vertical-align: baseline;\">: Today we’re introducing IAM Helper, a suite of intelligent, agent-facing building blocks that can automate complex, end-to-end IAM workflows. </span><a href=\"https://cloud.google.com/blog/products/identity-security/scale-agents-securely-with-iam-helper-agent-skills-and-mcp-tools\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Introducing new scalable perimeter options with VPC Service Controls</strong><span style=\"vertical-align: baseline;\">: Today, we're excited to announce key enhancements to VPC Service Controls that make perimeters easier to create, maintain, and scale. </span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-new-scalable-perimeter-options-with-vpc-service-controls\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Confidential G4 GPUs are now generally available</strong><span style=\"vertical-align: baseline;\">: Confidential Computing on G4 now provides hardware-based security in AI Hypercomputer to deliver dynamic performance without compromising privacy. </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/confidential-g4-gpus-are-ga\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Supply chain zero days: Closing the gap between publication and detection</strong><span style=\"vertical-align: baseline;\">: Learn how Wiz’s supply chain pipeline identifies compromised packages at publication, helping teams detect zero-day supply chain compromises in Wiz Defend before a CVE is published. </span><a href=\"https://www.wiz.io/blog/detect-supply-chain-zero-days-at-publication\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Please visit the Google Cloud blog for more security stories </span><a href=\"https://cloud.google.com/blog/products/identity-security\"><span style=\"text-decoration: underline; vertical-align: baseline;\">published this month</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fbba9c34090&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://www.youtube.com/watch?v=Wpo-5ke9uvQ&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Threat Intelligence news</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Investigating ephemeral supply chain tampering</strong><span style=\"vertical-align: baseline;\">: For the first time, Google Threat Intelligence Group (GTIG) and Mandiant have encountered a software supply chain compromise that was implemented with very short tampering windows that were active for only five to 10 minutes, and effectively evading traditional point-in-time triage and automated file scanning. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ARMORY CASTLE exploits BeyondTrust</strong><span style=\"vertical-align: baseline;\">: During an incident response engagement, Mandiant identified evidence that ARMORY CASTLE, a suspected PRC-nexus espionage threat actor, exploited a vulnerability impacting BeyondTrust Remote Support appliances. Organizations should prepare for potential widespread exploitation following this disclosure, as ARMORY CASTLE and other threat actors have historically conducted broad, opportunistic exploitation once the vulnerability becomes public. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Vulnerability discovery and exploitation trends in the AI era</strong><span style=\"vertical-align: baseline;\">: To counter the increased risk from rapid vulnerability discovery and exploitation, organizations should transition from unprioritized mass-patching to threat intelligence-driven triage, combining targeted edge-defense with automated, agentic remediation. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Defending against active exploitation of Citrix NetScaler ADC and Gateway appliances</strong><span style=\"vertical-align: baseline;\">: Mandiant Consulting and Google Threat Intelligence Group (GTIG) identified active, in-the-wild exploitation of a zero-day vulnerability affecting Citrix NetScaler ADC and NetScaler Gateway appliances. Here’s our containment and remediation guidance. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Please visit the Google Cloud blog for more threat intelligence stories </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">published this month</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Now hear this: Podcasts from Google Cloud </strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Security Podcast: Patching browsers with AI, agents, Rust, and your tabs</strong><span style=\"vertical-align: baseline;\">: </span><span style=\"vertical-align: baseline;\">Jasika Bawa and Doug Turner of Chrome Security explore how Google Chrome now uses AI agents to autonomously identify and patch security vulnerabilities at an unprecedented scale, significantly accelerating the browser's update cadence. </span><a href=\"https://www.youtube.com/watch?v=pCXT8lQqg_U\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Listen here</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Security Podcast: All about Project Atlas, Wiz's AI vulnerability research</strong><span style=\"vertical-align: baseline;\">: </span><span style=\"vertical-align: baseline;\">Nir Orfeld, head of vulnerability research, Wiz, discusses how his team uses multi-agent AI systems for discovering high-impact zero-day vulnerabilities in cloud infrastructure. </span><a href=\"https://www.youtube.com/watch?v=qRJJ9ekpuVg\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Listen here</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Security Podcast: How Google eliminates classes of vulnerabilities at scale</strong><span style=\"vertical-align: baseline;\">:</span><span style=\"vertical-align: baseline;\"> How do you build the foundations for a secure Google-scale enterprise that stays secure even if an AI is writing the code and nobody has time to review it? Christoph Kern, principal security engineer, Google, explores what secure-by-design really means in the AI era. </span><a href=\"https://www.youtube.com/watch?v=43imRRfgLgc\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Listen here</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">To have our Cloud CISO Perspectives post delivered twice a month to your inbox, </span><a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sign up for our newsletter</span></a><span style=\"vertical-align: baseline;\">. We’ll be back in a few weeks with more security-related updates from Google Cloud.</span></p></div>"
  "983c036be7672d26f465f9e92e29da62":
    "id": "983c036be7672d26f465f9e92e29da62"
    "title": "Grounding agents in one context graph connecting semantic models you already trust"
    "link": "https://cloud.google.com/blog/products/data-analytics/expanded-semantic-model-support-in-knowledge-catalog/"
    "published": "2026-10-30 01:00:00"
    "fetched": "2026-10-30 01:36:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Picture the scene: Before an executive business review, your VP of Sales asks an AI assistant, </span><span style=\"font-style: italic; vertical-align: baseline;\">\"What was net revenue for our top enterprise accounts last quarter?\"</span><span style=\"vertical-align: baseline;\"> In seconds, the agent returns a polished chart! Unfortunately, the numbers don't match the finance report. Why? Because the agent counted cancelled orders as revenue and pulled from an unvalidated staging table.</span></p>\n<p><span style=\"vertical-align: baseline;\">The agent didn't fail because of the model, or because it couldn't translate a user question into a query. It failed because </span><span style=\"font-style: italic; vertical-align: baseline;\">it didn't understand your business</span><span style=\"vertical-align: baseline;\">. The real kicker is that understanding usually already exists in the form of a semantic model in a Looker, dbt, Snowflake, Databricks, or SAP system. But because each definition stays locked inside its own tool, every agent guesses at it… and often gets it wrong. </span></p>\n<p><span style=\"vertical-align: baseline;\">This is where </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> comes in. It brings the semantic models from all of those tools into one context graph, so every agent works from the same trusted definitions. And when two tools define the same metric differently, both definitions appear with their provenance, so data stewards can reconcile the conflict before it reaches end users.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we're announcing the general availability of expanded semantic model support. Knowledge Catalog now natively ingests semantic models and metric definitions from Looker LookML, BigQuery Graph (including BigQuery measures), dbt MetricFlow, Snowflake Semantic Views, Databricks Metric Views, and SAP Core Schema Notation (CSN), and connects them with schema, lineage, data profiles, business glossary and other key metadata in a single context graph, without moving data or rewriting business logic in a new language. </span></p>\n<p><span style=\"vertical-align: baseline;\">By grounding your AI agents in those models, they get the same business definitions your analysts rely on, so their answers line up with the numbers your business trusts. In fact, based on internal benchmarks, grounding agents in Knowledge Catalog makes them nearly 4X more accurate, with up to 33% lower latency, and using up to 75% fewer tokens.</span></p>\n<p><span style=\"vertical-align: baseline;\">The unified context graph enables you to:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reuse the semantic models you already trust:</strong><span style=\"vertical-align: baseline;\"> Knowledge Catalog grounds </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-knowledge-catalog#configure-knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini </span></a><span style=\"vertical-align: baseline;\">agent, BigQuery Conversational Analytics, and your custom agents in the metrics, filters, and join paths your teams have already defined, wherever they live.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Go beyond hand-curated definitions with self-learned context: </strong><span style=\"vertical-align: baseline;\">Knowledge Catalog pairs the well-defined metrics and KPI definitions in your semantic models with relevant context it extracts from unstructured knowledge sources, such as operational playbooks, meeting notes, chat threads, code, and more. Powered by Gemini, </span><a href=\"https://cloud.google.com/blog/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">self-learning enrichment</span></a><span style=\"vertical-align: baseline;\"> continuously finds missing or outdated context and turns it into governed, reusable context sets, ensuring your agents' context stays current as definitions change, without relying only on manual curation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pair business logic with enterprise trust: </strong><span style=\"vertical-align: baseline;\">Even the right formula produces the wrong answer when it runs on stale or uncertified data. That's why Knowledge Catalog can connect semantic definition to data quality scores, freshness signals, and lineage, so an agent knows what it can trust before it writes a line of SQL.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1. Side-by-side comparison\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1._Side-by-side_comparison_z1p0n9c.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Side-by-side comparison of the same question in Gemini without Knowledge Catalog (left) and grounded in Knowledge Catalog (right). Highlights the grounded agent (right) giving an accurate response with less token and lower latency, compared to the agent without Knowledge Catalog (left) hallucinating and using more tokens with higher latency.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">One context graph across your data estate</span></h3>\n<p><span style=\"vertical-align: baseline;\">The context graph that Knowledge Catalog creates is a connected map of your data and semantic estate: tables, semantic models, glossary terms, and data products are nodes; lineage, associations, schema keys, joins mined from real query history, and the join paths declared in your semantic models are the edges. Ingested semantics land in that same graph, next to pre-existing governance and usage signals, so an agent moves from business concept to trusted formula and verified join paths in one traversal. Each source adds its own perspective on your business:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/looker/docs/looker-core-dataplex\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Looker LookML</strong></a><strong style=\"vertical-align: baseline;\"> (GA):</strong><span style=\"vertical-align: baseline;\"> Indexes models, explores, views, and dashboards using Live sync from Looker Core, capturing compiled metric SQL, fan-out-safe join conditions, mandatory filters, and lineage from source tables to executive dashboards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/metadata-overview#supported-sources\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</strong></a><strong style=\"vertical-align: baseline;\"> (GA):</strong><span style=\"vertical-align: baseline;\"> Indexes native property-graph definitions, node and edge tables, graph measures, and business synonyms, so agents reason over connected entities with Graph Query Language (GQL) traversals instead of brittle multi-table self-joins.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/dbt-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">dbt MetricFlow</strong></a><strong style=\"vertical-align: baseline;\"> (GA):</strong><span style=\"vertical-align: baseline;\"> Links source objects to dbt models and MetricFlow metrics, alongside dbt data quality test results, filters, saved queries, freshness SLAs, and downstream exposures.</span></p>\n</li>\n<li><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/snowflake-horizon-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Snowflake Semantic Views via Horizon Catalog</strong></a><strong style=\"vertical-align: baseline;\"> (GA):</strong><span style=\"vertical-align: baseline;\"> Pairs federated BigQuery or Google Cloud Lakehouse tables with Snowflake Horizon metadata, bringing in Semantic View dimensions, facts, metric formulas, relationships, and synonyms, plus Data Metric Function quality scorecards and PII masking tags.</span></li>\n<li><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/databricks-unity-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Databricks Metric Views via Unity Catalog</strong></a><strong style=\"vertical-align: baseline;\"> (GA):</strong><span style=\"vertical-align: baseline;\"> Ingests metric view definitions, measure formulas, scoping filters, and join cardinalities from Unity Catalog, alongside table certification badges and Lakehouse Monitoring profiling results.</span></li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/manage-sap-bdc-metadata\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">SAP Core Schema Notation (CSN) via SAP Business Data Cloud (BDC)</strong></a><strong style=\"vertical-align: baseline;\"> (GA):</strong><span style=\"vertical-align: baseline;\"> Captures business labels, dimension and cube modeling patterns, default aggregations, currency and unit bindings, key and composite join associations, and data sensitivity flags when SAP BDC Data Products are federated through Google Cloud Lakehouse.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Because every source lands as a node or an edge in the same graph, a LookML join, a dbt exposure, a Snowflake relationship, or an SAP association are traversable side by side, with links tying each one back to the physical tables it depends on. And nothing is silently overwritten: overlapping definitions stay side by side, each labeled with its source, giving data stewards the full picture they need to settle on a single version.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2. Context Graphs_compressed\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2._Context_Graphs_compressed.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Navigating semantic models, join paths, and lineage on the context graph in Knowledge Studio.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">You can explore and govern all of this in </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Studio</span></a><span style=\"vertical-align: baseline;\"> (preview), your command center to explore and manage your context. Explore your context graph, including your semantic definitions, using natural language prompts and traverse connection paths using the context graph canvas. Then, once you've validated the right assets and definitions, you can package them into reusable </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/context-sets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">context sets</span></a><span style=\"vertical-align: baseline;\"> that map to specific use cases and domains in your organization, which Gemini and custom agents can consume in production.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Let’s get back to that net revenue question. With Knowledge Catalog, the VP of Sales’ agent issues a single context query to discover the trusted asset, applying the exact metric formula and filters that your domain experts defined, all while respecting join keys across systems, and confirming that the underlying data passed its quality checks. Better yet, the numbers in the report are correct!</span></p>\n<p><span style=\"vertical-align: baseline;\">To get started, explore your context graph in </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Studio</span></a><span style=\"vertical-align: baseline;\"> and visit the </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog documentation</span></a><span style=\"vertical-align: baseline;\"> to connect to more sources.</span></p></div>"
