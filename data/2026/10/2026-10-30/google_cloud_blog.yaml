    "fetched": "2026-10-31 00:33:33"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today Google Skills is sharing new, industry-specific video learning bundles to get you into Gemini and using agents. One bundle is designed for </span><a href=\"https://www.skills.google/paths/4864\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">financial services</span></a><span style=\"vertical-align: baseline;\"> and one is built specifically for those in the </span><a href=\"https://www.skills.google/paths/4869\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">legal profession</span></a><span style=\"vertical-align: baseline;\">. You can access all of these videos at no cost on </span><a href=\"http://skills.google\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\"> today.</span></p>\n<p><span style=\"vertical-align: baseline;\">Whether you're managing complex market portfolios or navigating rigorous compliance reviews, these bite-sized video courses show you exactly how to work smarter with agentic AI. They start with use cases you’re probably familiar with, and share how you can jump into Gemini to get work done more efficiently. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Turn market complexity into clarity with Gemini for financial services</span></h3>\n<p><span style=\"vertical-align: baseline;\">Financial analysts and portfolio managers deal with massive volumes of real-time market data, fluctuating risk profiles, and tight turnarounds. Let’s say you’re a financial advisor preparing for your first session with a client. You’ve got a meeting with a new client in 20 minutes. Reading hundreds of SEC pages manually isn’t possible. But, doing it in two minutes with Gemini for financial services makes it easy. Get a sense of three ways you can start using Gemini in this video, or jump into learning with the full course list below below. </span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=FcmqIX0DSeU\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">3 ways to automate your financial workflows with Gemini</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=FcmqIX0DSeU\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We've launched four practical video courses to help your financial services team start transforming workflows immediately. You can see them all today on Google Skills:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1912\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Course 1: Elevate Financial Advisor Insights with Gemini</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1947\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Course 2: Use Gemini for Financial Portfolio Resilience</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1944\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Course 3: Accelerate Bond Issuance in Gemini</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1948\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Course 4: Uncover Credit Market Opportunities with Gemini</span></a></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Streamline compliance and drafting with Gemini for legal</span></h3>\n<p><span style=\"vertical-align: baseline;\">In legal operations, precision is everything. Let’s say you’re staring at a proverbial pile of documents that need review. Instead of having to check terms line by line, you can use Gemini to build compliance standards and review agreements against them. Gemini then flags violations, explains why they go against standards, and suggests a remedy. And that’s just one way you can jump into higher efficiency with Gemini for legal. See three more ways to start using it today: </span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Y4Nil53XZzI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">How Gemini for legal automates regulatory scans, contract reviews &amp; DSARs</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Y4Nil53XZzI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Get started with five new bite-size courses built to elevate your day-to-day legal workflows or explore all the Gemini for legal content on Google Skills:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1915\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Use Gemini for Legal Regulatory Horizon Scanning</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1946\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Use Gemini for Legal Data and DSAR Responses</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1945\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Contract Review and Playbook Creation with Gemini</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1907\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Use Gemini to Redact Legal Documents</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1949\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Draft NDA Documents with Gemini</span></a></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Take your skills further with Gemini Agent Ready (GEAR)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Is this all feeling a little too </span><span style=\"font-style: italic; vertical-align: baseline;\">introductory </span><span style=\"vertical-align: baseline;\">for you or your business? We get it. Maybe you’re ready to jump from introductory workflows to building production-grade agentic systems.</span></p>\n<p><span style=\"vertical-align: baseline;\">Through our no-cost Gemini Agent Ready program you can earn industry-recognized skill badges and validate your real-world expertise. When you register for GEAR today, you’ll receive 35 credits to explore interactive training environments on Google Skills — giving your team a risk-free space to build, test, and master agentic AI.</span></p>\n<p><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get started with GEAR today</span></a></p></div>"
  "3f9205b929db902b102f95d9fb0824d8":
    "id": "3f9205b929db902b102f95d9fb0824d8"
    "title": "ARTEX and Friends: Enter Agentic Offensive Frameworks"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks/"
    "published": "2026-10-30 23:00:00"
    "fetched": "2026-11-02 05:12:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Written by: Aurora Blum, David Mainor, Rohit Nambiar, Omar ElAhdan, Matthew McWhirt, Will Silverstone, Bhavesh Dhake, Chris Busse</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Introduction</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Recent intrusions in which threat actors have been observed weaponizing agentic frameworks to execute highly-automated intrusions has put a spotlight on evolving adversarial use of LLMs. In our </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">September 2026 report</span></a><span style=\"vertical-align: baseline;\">, Google Threat Intelligence Group (GTIG) noted that forward leaning adversaries were beginning to transition from basic prompting to agentic workflows and LLM-enabled automation. </span></p>\n<p><span style=\"vertical-align: baseline;\">Since this publication, GTIG and Mandiant have observed multiple threat actors abusing the open-source, agentic pentesting frameworks ARTEX, Hexstrike and CAIRN in incident response engagements to conduct a broad range of actions across multiple phases of the attack life cycle. This activity has been seen across the threat landscape, as noted in a recent Wiz </span><a href=\"https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">report</span></a><span style=\"vertical-align: baseline;\">. The emergence of Artex and similar agentic offensive intrusion frameworks underscores a broader shift toward threat actor adoption of open source multi-agent offensive frameworks, as well as potentially custom agentic harnesses.  </span></p>\n<p><span style=\"vertical-align: baseline;\">This represents a paradigm shift towards intrusions occurring at machine speed, with the automated chaining of complex attack paths scaling intrusions exponentially. While the mechanics of the intrusions remain the same, such as using compromised credentials and targeting unpatched systems, the speed and scale at which frameworks can exploit these known weaknesses introduces a new defensive challenge. Security teams, developers, and system administrators will need to fundamentally rethink defense strategies to counter scalable, autonomous software. </span><span style=\"vertical-align: baseline;\">We also provide defensive strategies from Mandiant Consulting. The defensive strategies suggested—control-plane isolation, short-lived credentials, least privilege, segmentation, and behavioral detection—are long-standing security best practices. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Observations in the Wild</span></h3>\n<p><span style=\"vertical-align: baseline;\">We are seeing tools used by adversaries evolving towards autonomous agentic attacks. One way this is occurring is through suites of tools or frameworks designed for penetration testing (“pentesting”). These tools and frameworks orchestrate various agents using open source and frontier LLMs to automate various stages of intrusions. Historically, cyber espionage and financially motivated threat actors have taken advantage of pentesting or red-teaming platforms built for security professionals to exploit systems, such as Cobalt Strike or Metasploit. Today, adversaries are pivoting toward offensive frameworks powered by LLMs. While these frameworks have existed in the wild, they are now yielding success in intrusions in the wild, representing a critical evolution that increases both the speed and scale of intrusion activity. </span></p>\n<p><span style=\"vertical-align: baseline;\">Since late August 2026, we have observed threat actors actively operating popular open-source multi-agent pentesting platforms like ARTEX, PentAGI, CAIRN and other potentially custom harnesses within Mandiant incident response engagements; use of these platforms has been further corroborated by our research telemetry. In these incidents</span><span style=\"vertical-align: baseline;\">, we have observed agentic activity conducting significant parts of the attack lifecycle (e.g., lateral movement, database exploitation, exfiltration preparation). Evidence of in the wild usage of these frameworks marks a critical inflection point for defenders, as agents now autonomously explore multiple attack paths, troubleshoot errors, and achieve objectives in seconds and minutes. Coupled with continual advancements in underlying LLM capabilities, the acceleration in attack velocity and scale signals a notable shift in the threat landscape that fundamentally alters traditional intrusion dynamics.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">ARTEX Framework</span></h4>\n<p><span style=\"vertical-align: baseline;\">ARTEX is an autonomous, multi-agent LLM-driven pentesting and offensive command-and-control (C2) platform written in Go with an embedded Next.js web console. The framework was originally developed by the user </span><a href=\"https://github.com/Autumn-27\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Autumn-27</span></a><span style=\"vertical-align: baseline;\"> and released on GitHub. Although the original repository was taken down by its creator in October 2026 due to widespread threat actor abuse, the framework continues to proliferate globally via community forks, including localized variations such as ScopeWeaver and a commercial version dubbed ARTEX PRO. ARTEX abstracts the attack lifecycle across six specialized sub-agents. By leveraging APIs from frontier and open source models, the framework translates high-level tactical goals into actionable machine commands. GTIG has observed capabilities including automated Active Directory reconnaissance, privilege escalation, target cloud-infrastructure profiling (such as harvesting Azure storage keys), to the synthesis and deployment of custom webshells.</span></p>\n<p><span style=\"vertical-align: baseline;\">Since late August 2026, ARTEX has been adopted by a diverse range of threat actors across the motivational spectrum, including both financially motivated extortion groups and suspected cyber espionage operators. For example, the Wiz Research team has been tracking a campaign associated with ARTEX, which GTIG tracks as UNC7228, that overlaps with activity tracked by </span><a href=\"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Microsoft as the PRC-nexus actor STORM-0940</span></a><span style=\"vertical-align: baseline;\">. The research has expanded Wiz’s understanding of this campaign beyond the </span><a href=\"https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">October IT focused activity</span></a><span style=\"vertical-align: baseline;\"> with activity now dating back to at least August 2026. Wiz identified the targeting, compromise, and data theft affecting multiple entities in the US and Europe across the enterprise software, industrial automation, semiconductor manufacturing and design, and telecommunications industry verticals. This actor has moved extremely quickly, typically moving from their first compromised account to deep system access in around four hours and in one case as rapidly as 15 minutes. They have also customized their tooling to take advantage of victim-specific setups and fallen back to open proxies if their initial infrastructure was blocked.</span></p>\n<p><span style=\"vertical-align: baseline;\">Demonstrating broader adoption of ARTEX, GTIG and Mandiant observed multiple other threat actors using ARTEX for post-compromise reconnaissance, lateral movement, and privilege escalation in incident response investigations. This includes financially motivated threat actors who used the framework to facilitate data theft extortion, and additional suspected PRC-nexus clusters. Their operations collectively impacted organizations across government, technology, chemicals and materials, and manufacturing sectors in the US, alongside </span><a href=\"https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">public reporting</span></a><span style=\"vertical-align: baseline;\"> of ARTEX targeting the financial sector in Asia. </span></p>\n<p><span style=\"vertical-align: baseline;\">In several cases, adversaries provided ARTEX with compromised credentials for the targeted organization, and instructed the framework to execute subsequent stages of the attack lifecycle. Analysis of these intrusions reveals key differences between activity conducted by the ARTEX framework and that of a human operator:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Based on log files and timestamps, we identified bursts of activity that would be highly irregular for a human operator. While each of the intrusions exhibited extended pauses during operational phases, individual ARTEX execution sequences ran in compressed bursts of roughly 2 to 25 seconds. In at least one operation, we observed 27 events in 23 seconds of active burst time, performing rapid probing of AWS permissions across different security groups. While preparing potential exfiltration scripts, ARTEX was capable of successfully adapting to errors quoting “script too large” by trimming the script and relaunching it to successfully deploy a 17-snapshot instance in approximately 10 seconds. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Compared to a competent human operator, ARTEX achieved code execution in a far more forensically noisy manner, relying on rapid, iterative trial-and-error. In one instance, supplied with valid credentials, ARTEX accessed an external-facing Linux Weaver OA web server to execute SQL commands via exposed API calls. Using legitimately-exposed application-specific API calls, ARTEX was able to achieve partial command-execution to conduct further reconnaissance despite hitting technical complexities. However, this process generated 240 log events and exhibited errors potentially caused by multiple sub-agents overwriting one another while pursuing the same objective. </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">In an attempt to pivot from a database-execution context to a system-execution context, ARTEX used an application-specific SQL API, accessible to the supplied-user credential, to modify the MySQL instance to write log files with a</span><code style=\"vertical-align: baseline;\"> .jsp</code><span style=\"vertical-align: baseline;\"> extension to publicly accessible locations. The SQL-commands executed were likely intended to poison MySQL logs into writing web-accessible JSP webshells.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Using the API, ARTEX ran </span><code style=\"vertical-align: baseline;\">SET GLOBAL general_log_file = '&lt;path to webshell&gt;’ </code><span style=\"vertical-align: baseline;\">followed by</span><code style=\"vertical-align: baseline;\"> SET GLOBAL general_log = 1</code><span style=\"vertical-align: baseline;\">; subsequent SQL commands were written to the filepath defined in </span><code style=\"vertical-align: baseline;\">general_log_file</code><span style=\"vertical-align: baseline;\">. ARTEX then ran SQL SELECT statements in the form</span><code style=\"vertical-align: baseline;\"> `SELECT '&lt;% [webshell content] %&gt;'`</code><span style=\"vertical-align: baseline;\">. Due to how the underlying Java web servlet handles JSP files, the Java code in the '&lt;% %&gt;' gets parsed and compiled into the process memory space, providing means of execution.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Log activity shows multiple iterations of the above sequence, with ephemeral, somewhat-incremental file names (</span><code style=\"vertical-align: baseline;\">cl1217.jsp, f1219a.jsp, z1219.jsp</code><span style=\"vertical-align: baseline;\">) for each webshell candidate, each one executing a different command. Errors when trying to run the webshell (e.g.</span><code style=\"vertical-align: baseline;\"> variable ‘t is already defined</code><span style=\"vertical-align: baseline;\">’) caused the webshell to fail and likely had ARTEX refactor its approach, writing several unique webshells, each with a different goal, some correcting previous errors until the</span><code style=\"vertical-align: baseline;\"> .jsp</code><span style=\"vertical-align: baseline;\"> webshells executed cleanly and returned valid command output to ARTEX.</span></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">In another case, during access-probing efforts, ARTEX generated files of various extension types with the filename </span><code style=\"vertical-align: baseline;\">artex-probe-*</code><span style=\"vertical-align: baseline;\">, where</span><code style=\"vertical-align: baseline;\"> * </code><span style=\"vertical-align: baseline;\">carried five digit somewhat-incremental numbers. Based on our visibility, it’s difficult to comment on the exact significance of these numbers or how they increment. However, ARTEX was seen using similar incremental numeric markers within dropped file names, created account names, their passwords and within email subjects. </span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Observed ARTEX Activity Mapped along the phases of a targeted attack lifecycle </span></h4></div>\n<div class=\"block-paragraph_advanced\"><div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://cloud.google.com/security/resources/insights/targeted-attack-lifecycle?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Phase of the attack lifecycle</strong></a></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Observed ARTEX Capabilities &amp; Tradecraft</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Initial Recon</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Automatically mapped the effective permissions of obtained Azure credentials (SAS tokens, Service Principals, Kudu credentials, and Storage Account keys) using sub-second capability checks, test blob writes/deletes, and ARM deployment validation dry-run sweeps. This activity included bursts of rapid activity, with ARTEX writing and immediately deleting a tiny test blob in ~330–400 ms and running an 8-second ARM </span><code style=\"vertical-align: baseline;\">deployments/validate</code><span style=\"vertical-align: baseline;\"> dry-run sweep across 11 Azure resource types. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Tested compromised IAM user permissions using</span><code style=\"vertical-align: baseline;\"> DryRun</code><span style=\"vertical-align: baseline;\"> flags and placeholder IDs to evaluate EC2 compute, EBS volume, and snapshot capabilities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Over a span of over 500 web requests, ARTEX probes various file names and extensions across various web directories, in a potential attempt to fuzz which URL endpoints the web-server would allow it to access based on HTTP response code (</span><code style=\"vertical-align: baseline;\">200</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">403</code><span style=\"vertical-align: baseline;\">). </span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Establish Foothold</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Abused Kudu administrative APIs to execute arbitrary commands and stage custom Python, C#, and malicious PowerShell scripts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Established command and control (C2) and execution on the victim's internal Windows database server by using native curl to pull down dynamically generated PowerShell and batch scripts and post back command results across 491 rotating </span><code style=\"vertical-align: baseline;\">webhook.site</code><span style=\"vertical-align: baseline;\"> URLs.</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Escalate Privileges</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Attempted to escalate privileges by launching cloud compute instances with potentially high-value IAM roles with the intention of fetching the role’s temporary credentials and thereby escalating privileges in doing so. These attempts however seemed to have failed due to invalid instance profile ARNs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Escalated privileges by running Kerberoasting scripts to harvest service tickets across compromised domains; using SQL injection to dump database credentials; and, following an offline cracking pause, executing DCSync scripts to steal the domain krbtgt key, cloud AD-sync credentials, and domain Controller machine hashes. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Created accounts with </span><code style=\"vertical-align: baseline;\">is_admin=true</code><span style=\"vertical-align: baseline;\"> within minutes, identifying and utilizing a writable admin flag.</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Internal Recon</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Performed reconnaissance across the internal network by running several iterative generated PowerShell enumeration scripts against a Domain Controller and federation server. The scripts validated domain usernames without pre-authentication, listed Group Managed Service Accounts, audited Active Directory Certificate Services templates (SmartcardUser, ClientAuth), mapped thousands of cross-forest security principals, and swept internal Exchange, PasswordState credential vault, and SSRF/SCM targets. </span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Move Laterally</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Attempted Lateral Movement onto domain controllers using Pass-the-Ticket, WinRM, Kerberos relay, and Pass-the-Hash scripts, hitting local Windows service token privilege restrictions right before endpoint protection blocked execution and defenders severed access to the server.</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Maintain Presence</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Generated a new SSH key pair, allocated a dedicated public Elastic IP, attempted to create a custom security group but failed due to permission issues, and launched persistent</span><code style=\"vertical-align: baseline;\"> t3.micro</code><span style=\"vertical-align: baseline;\"> instances bound to existing security groups to establish an externally addressable jump host and internal foothold.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gained persistence through account takeover (e.g., resetting passwords for identified users), creating multiple accounts with plaintext passwords (which included </span><code style=\"vertical-align: baseline;\">ArtexProbe</code><span style=\"vertical-align: baseline;\"> in the naming convention), and creating administrator accounts. </span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Complete Mission</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Interrogating backend SQL databases (extracting ~400 KB of query results across ~20 queries) and performing mass blob reads. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Deployed custom boot scripts via ephemeral, keyless EC2 instances to potentially harvest data from multiple mounted EBS snapshots and volumes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enumerated over 110,000 Active Directory objects from a domain controller and retrieved the Domain Admins group. It then sent command output to rotating webhook.site endpoints via curl.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Ran queries to decrypt stored notes and attempted to read other users' note attachments. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Created a new 100GB volume and expanded the root disk of launched instances to 60GB, performing preparatory steps likely intended for exfiltration via their automated collection scripts. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Edited an employee's record in a legacy database, created and deleted notes and status rows, pointed checklist responses at its own probe file. In this case we observed an interesting abuse of legitimate features. Rather than executing complex malware, ARTEX weaponized built-in application features. It forced an application's notification system to broadcast test emails to over 1,300 internal users, turning a trusted notification channel into a mass-internal messaging tool. It then dropped to single-recipient test emails rather than the mass emailing.</span></p>\n</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">PentAGI Offensive Framework</span></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG also observed in the wild abuse of PentAGI (Penetration Testing Artificial General Intelligence), an autonomous offensive framework designed to automate the pentesting process within an isolated environment. Developed by VXControl, the framework is offered in an open source and commercial edition. It is designed so that the user only needs to describe a target and a goal, which enables entry-level users to run complex cyber security campaigns. Once the target and the goal have been selected, the framework uses a team of specialized agents, each with their own functionalities to break tasks (called “Flows”) into various sub-tasks, execute each step, and report on it. The tools and commands are all run in isolated sandboxes running Kali Linux instead of in the host environment. All the tools used by PentAGI are open-source pentesting tools available by default in Kali Linux (e.g., metasploit, nmap, SQLmap). The framework supports over a dozen cloud and local LLM backends, including frontier and open weight models.</span></p>\n<p><span style=\"vertical-align: baseline;\">The majority of observed PentAGI activity remained at the stage of WHOIS asset mapping or active vulnerability scanning. However, analysis of operational artifacts indicates that some operations progressed to active intrusions and persistence across multiple organizations. Operators are also adapting and integrating the framework in different ways. In one case, we identified a customized attack orchestration platform built on the open-source version of PentAGI likely used between at least late August and early October 2026 to conduct systematic reconnaissance and vulnerability scanning against a wide range of organizations in Asia, including system integrators and major telecommunications firms. In another instance, we observed PentAGI chained with proxy services to target the Aerospace sector. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Evolution of Autonomous Offensive Frameworks</span></h3>\n<p><span style=\"vertical-align: baseline;\">We are seeing a significant maturation in the application of LLM capabilities across the threat landscape in a short period of time; this includes the incorporation of LLM-written malicious code, development of dynamic LLM-enabled malware, poisoning of agent-harness files, and the building of multi-agent offensive frameworks. Notably, between late 2025 and October 2026, autonomous and semi-autonomous offensive frameworks crossed a decisive operational threshold to multi-agent frameworks actively weaponized by threat actors to perform in the wild intrusions. </span></p>\n<p><span style=\"vertical-align: baseline;\">GTIG has been tracking the evolution of this experimentation over time, from simple prompting of LLMs to help with coding, through the use of frameworks in the wild towards a potential future with fully autonomous frameworks running intrusions. In a fully autonomous attack, a human’s role would consist of telling the agent what to target, and then simply benefiting from the operational objective. </span></p>\n<p><span style=\"vertical-align: baseline;\">At the time of reporting, we assess that the current adversary use of autonomous offensive frameworks is still in early stages characterized by open source tools currently being used in low-sophisticated ways, resulting in broad and noisy, but still successful campaigns. As the sophistication of these frameworks, the underlying LLMs and the orchestrating human-operator increase, we expect to see not only less human interaction, but also increased stealth and sophistication.</span></p>\n<p><span style=\"vertical-align: baseline;\">The following stages represent our observations of how LLM-augmentation in cyber operations have evolved over the last year and how we expect this development to continue:</span></p>\n<p><strong style=\"vertical-align: baseline;\">Stage 1: Prompt-based use of LLMs</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: Adversaries interact with LLMs in a prompt based chatbot fashion, using LLMs to write and debug code for malware, draft phishing emails, create personas, and conduct light reconnaissance on targets. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: Adversaries outsource low-failure, easy-to-rectify, tasks to an LLM to increase speed of simple discrete tasks. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/adversarial-misuse-generative-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">End of 2025 to early 2026</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Stage 2: Embedding LLM capabilities into malware </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: Adversaries trust an LLM to take certain low-failure, easy to execute actions, particularly writing code, such as in malware families like HONESTCUE or PROMPTSPY using LLMs dynamically during execution to, for example, obfuscate payloads in different ways in attempts to evade defenses. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: Adversaries begin use incorporating LLMs into post-intrusion attack phases.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Early 2026</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Stage 3: Incorporating LLM-enabled automation into operations </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: As agentic capabilities develop, adversaries begin using them for discrete tasks (e.g., standing up or debugging malware development environments). Agents begin being used alongside human-operators to develop novel exploits and to assist with high-stake vulnerability research. Adversaries begin being more cognizant of OPSEC and visibility into their LLM-usage operations and start using LLM-proxy services to obscure activities. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: LLMs being used for more high-stake tasks but with human operators in the loop. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe</strong><span style=\"vertical-align: baseline;\">: Early 2026 - </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">September 2026 </span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Stage 4: Developing and experimenting with autonomous frameworks</strong><strong style=\"vertical-align: baseline;\">  </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: Adversaries begin developing and experimenting with autonomous frameworks. Campaigns begin offloading more stages of the lifecycle to LLM-augmented tooling, and integrating model APIs into their tools and telegram bots to take autonomous action. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: Experimentation with LLMs running more stages of the attack lifecycle.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mid 2026 - September 2026 </span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Stage 5: Multiple attack lifecycle stages being conducted by LLM-driven tooling in the wild</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: In the wild evidence of multiple attack lifecycle stages being conducted by LLM-driven tooling, with fewer humans in the loop during operations. Observations surrounding mass-exploitation campaigns where a substantial portion of the lifecycle is being carried out by an agent, requiring only minimal human intervention, as well as activity accompanied by malware possessing more autonomous capabilities. Additionally, continued experimentation by threat actors with better obfuscation—including LLM mixers, inference services, local models. Overall TTPs of these attacks remain messy, noisy but yet successful.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: Adversaries have actively integrated LLMs into their operations to conduct successful intrusions, while simultaneously exploring ways to obscure/reduce reliance on frontier-lab LLMs. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe</strong><span style=\"vertical-align: baseline;\">: Current stage of development </span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Stage 6: Multi-agent-driven, unsophisticated attacks with little to no human interaction</strong><strong style=\"vertical-align: baseline;\"> </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: Highly-autonomous, but unsophisticated, forensically noisy operations with human operators no longer in the loop. Adversaries define the target and objective, while multi-agent frameworks execute the entire attack chain and return operational objectives.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: Adversaries diversifying infrastructure and tooling, further inhibiting defenders’ visibility.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe</strong><span style=\"vertical-align: baseline;\">: Near-term (1 - 3 months)</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Stage 7:  Sophisticated, fully autonomous/agentic attacks</strong><strong style=\"vertical-align: baseline;\"> </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Activity</strong><span style=\"vertical-align: baseline;\">: This stage represents peak maturity on the offensive LLMs capability curve, characterized not only by fully autonomous intrusions requiring little to no human interaction, but also by increased stealth and sophistication of the activity, with operators interacting with LLMs through either obscurely designed infrastructure or self-hosted LLMs altogether.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evolution</strong><span style=\"vertical-align: baseline;\">: This stage would grant autonomous and stealthier operations while limiting defender’s visibility into the activity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timeframe</strong><span style=\"vertical-align: baseline;\">: Medium-term (3 - 6 months)</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">We believe malicious actors will continue to experiment with these offensive agentic frameworks, moving towards future autonomous usage. GTIG has observed evidence of threat-actor experimentation with tools like the </span><span style=\"vertical-align: baseline;\">ZeroHollow</span><span style=\"vertical-align: baseline;\"> inference service and the fully agentic framework </span><a href=\"https://github.com/agent0ai/agent-zero\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AgentZero</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Outlook</span></h3>\n<p><span style=\"vertical-align: baseline;\">Over the past 12 months, GTIG has observed a decisive evolution in adversarial tradecraft leveraging LLMs, progressing from ad hoc operational productivity support toward the deployment of coordinated, multi-agent, autonomous offensive frameworks. While earlier milestones documented in our quarterly </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">research</span></a><span style=\"vertical-align: baseline;\"> highlighted early agentic interest, recent observations across frontline incident response engagements and proactive intelligence collection reveals adversary adoption of these frameworks to automate discrete phases and specific operational tasks during intrusions. Threat actors are increasingly leveraging generative models to achieve unprecedented speed and scale, actively developing more complex attack infrastructure powered by agentic AI capabilities and AI-enabled automation.</span></p>\n<p><span style=\"vertical-align: baseline;\">Frameworks such as ARTEX compress attack timelines to machine speed; however, they currently trade stealth for velocity. Unrestricted autonomous execution generates forensic traffic, relies on recognizable identifiers, and leaves behind distinct code-level traces, increasing the likelihood of detection and mitigation. These tools are therefore best suited to scenarios in which the cost of detection is low. Additionally, detection and disruption/response are two different functions–simply detecting the attack in time does little to hinder objective completion. </span></p>\n<p><span style=\"vertical-align: baseline;\">Consequently, GTIG assesses with high confidence that cyber crime threat actors will continue incorporating autonomous offensive tools into their operations, given that the increased reach of their campaigns will likely compensate for any decreases in success rates. We anticipate that actors, who specialize in stealthy operations designed to maintain long-term access, are less likely to use the publicly available versions of these tools, though they may employ them for purposes of scale and speed, depending on operational priorities. Regardless of motivation, the low barrier to entry, ease of integrating new exploits, and massive scaling potential make autonomous frameworks an attractive, low-cost force multiplier for a wide range of threat actors, making it highly likely that we will continue to see increasing threat actor adoption of these types of frameworks in the near term.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Defending Against AI-Enabled Attacks: Five Layers of Defense</span></h3>\n<p><span style=\"vertical-align: baseline;\">LLM-enabled offensive tooling does not fundamentally change the techniques attackers use. It reduces the time required to combine them. Credential discovery, permission testing, lateral movement, and data access that previously required hours of operator effort can now occur in minutes, frequently through valid identities and supported functionality that static indicators will not detect. Organizations are best positioned to withstand this when compromise of a single identity, credential, or workload provides only limited access. Restricting control-plane exposure, replacing long-lived secrets with short-lived and tightly scoped credentials, segmenting application tiers, and placing guardrails on high-impact business functions all reduce the speed advantage automation provides. Behavioral detection addresses the activity that these controls do not prevent, but it depends on having sufficient identity, control-plane, data-plane, and network telemetry to establish what normal activity looks like. Many of these controls are already familiar to defenders. The difference is that automated tooling can now identify and exploit the gaps between them far more quickly.</span></p>\n<p><span style=\"vertical-align: baseline;\">As illustrated above, LLM-enabled offensive tooling is increasing the speed and scale of cyber attacks. LLM-enabled and autonomous tools can identify weaknesses, test access, interpret errors, adjust their approach, and continue through an attack path with limited human interaction. Work that might previously have required an operator to investigate an environment, write or modify code, troubleshoot failures, and execute the next step over several hours can increasingly happen in minutes.</span></p>\n<p><span style=\"vertical-align: baseline;\">This creates a detection challenge as well. Much of the activity may use valid credentials and supported functionality (living-off-the-land, LotL). An attacker may authenticate with a legitimate service principal, call a normal management API, access cloud storage through a supported protocol, or execute commands through an existing administrative interface. Tool names, hashes, IP addresses, and other static indicators provide useful signals when available, but they will not cover much of this activity.</span></p>\n<p><span style=\"vertical-align: baseline;\">Effective defenses combine two capabilities:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Controls that limit what an attacker can do after gaining valid access.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Telemetry that shows when an identity, application, or workload begins operating outside its normal pattern.</span></p>\n</li>\n</ol></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">How Adversarial Use of LLMs Changes the Attacker Timeline</span></h4>\n<p><span style=\"vertical-align: baseline;\">Several themes repeatedly appear during investigations involving LLM-enabled or highly automated attacker activity:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Speed and scale</strong><span style=\"vertical-align: baseline;\">: Automated tooling can perform broad reconnaissance, test several attack paths at once, react to failures, and immediately continue into follow-on activity. The time between initial access, privilege discovery, lateral movement, and data access can become very short.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Interconnected environments</strong><span style=\"vertical-align: baseline;\">: Attackers rarely remain inside one technology stack. An internet-facing application may expose credentials in a configuration file. Those credentials may provide access to cloud storage, source repositories, identity systems, or internal infrastructure. Automation makes it easier to discover and test those relationships quickly.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Legitimate-looking identity activity</strong><span style=\"vertical-align: baseline;\">: Many actions look normal when viewed independently. A service principal authenticates, an API is called, a storage object is downloaded. The stronger signal often comes from context: where the request originated, how much activity occurred, what happened immediately before and after it, and whether the behavior is expected for that identity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Control-plane and data-plane blind spots</strong><span style=\"vertical-align: baseline;\">: Many organizations have mature endpoint monitoring but considerably less visibility into management APIs, programmatic identities, and cloud storage activity. Permission testing, retrieval of storage keys, bulk downloads, firewall changes, and management API calls may all be logged without generating useful alerts.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Mandiant recommends structuring enterprise defenses across five foundational layers designed to restrict lateral movement and limit the speed advantage of autonomous tooling:</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Description</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 1: Protect Control Planes</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Restrict all admin APIs, consoles &amp; CI/CD to trusted networks</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 2: Restrict Identities &amp; Keys</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Migrate to short-lived workload credentials; eliminate secrets</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 3: Harden Configurations</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Continuous vulnerability scanning across apps &amp; infrastructure</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 4: Application Protections</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Harden applications to prevent abuse of legitimate features and capabilities</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 5: Detect Behavioral Changes</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Monitor identity velocity, API bursts, and volumetric anomalies</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Table 1: Foundational layers for restricting adversarial LLM speed advantage and lateral movement</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Layer 1: Protect the Control Plane</span></h3>\n<p><span style=\"vertical-align: baseline;\">Restrict access to the systems attackers can use to administer, deploy, or reconfigure the environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">The control plane extends well beyond Active Directory or a cloud console. It includes identity providers, cloud management APIs, network and firewall management platforms, virtualization infrastructure, code repositories, CI/CD systems, privileged access management platforms, backup infrastructure, certificate authorities, SaaS administration consoles, and application administration interfaces.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Why It Is Important</span></h4>\n<p><span style=\"vertical-align: baseline;\">Internet-accessible management interfaces can quickly become part of an attack path after credentials are obtained. For example, Azure App Service includes an administrative interface through Kudu Site Control Manager, or SCM, which supports application deployment and management functionality. If an attacker obtains publishing credentials or another identity capable of accessing that interface, automation can quickly test authentication, enumerate functionality, interact with application files, execute commands, retrieve output, and remove staged artifacts.</span></p>\n<p><span style=\"vertical-align: baseline;\">Similar exposure exists across firewall administration, virtualization consoles, cloud management APIs, backup platforms, CI/CD interfaces, and other management services. Any reachable administrative path gives an automated attacker another capability to test.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Mitigations</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduce Administrative Internet Exposure</strong><span style=\"vertical-align: baseline;\">: Restrict cloud administration, network device management, application publishing interfaces, hypervisors, backup platforms, and other sensitive services to trusted networks, private connectivity, or dedicated administrative paths wherever possible.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Require Trusted Administrative Paths</strong><span style=\"vertical-align: baseline;\">: Require privileged users to administer sensitive infrastructure from managed devices, privileged access workstations, or approved jump hosts. Pair these controls with phishing-resistant authentication such as FIDO2 or passkeys where supported.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Harden Application Management Interfaces</strong><span style=\"vertical-align: baseline;\">: Treat application administration and publishing endpoints as privileged infrastructure rather than extensions of the public application.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Configure access restrictions for Kudu/SCM endpoints separately where appropriate.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Limit SCM access to approved management networks or deployment infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Disable basic publishing authentication where it is not required.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Restrict access to deployment and publishing credentials.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Consider deployment models such as run-from-package that reduce direct modification of deployed application files.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Control Public Exposure by Design</strong><span style=\"vertical-align: baseline;\">: Establish governance around public IP allocation and require architecture review before workloads or management interfaces are exposed directly to the internet.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Apply Similar Controls to Programmatic Administration</strong><span style=\"vertical-align: baseline;\">: Where supported, restrict administrative service principals and automation identities to expected networks, workloads, or private connectivity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor the Control Plane as a Distinct Security Surface</strong><span style=\"vertical-align: baseline;\">: Centralize authentication, configuration change, deployment, and administrative telemetry from cloud platforms, application administration interfaces, network infrastructure, backup platforms, and other management systems. Alert on administrative access from previously unseen networks, hosting providers, or geographies.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Layer 2: Restrict Identities and Keys</span></h3>\n<p><span style=\"vertical-align: baseline;\">Reduce the value of stolen credentials by limiting their lifetime, permissions, and where they can be used.</span></p>\n<p><span style=\"vertical-align: baseline;\">Security programs have traditionally placed more emphasis on human identities. Service principals, service accounts, API keys, storage keys, cloud access keys, deployment tokens, personal access tokens, and application secrets can receive less scrutiny despite providing significant access.</span></p>\n<p><span style=\"vertical-align: baseline;\">Programmatic identities are especially useful to an automated attacker when they combine long-lived credentials, broad permissions, limited conditional controls, and limited monitoring.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Why It Is Important</span></h4>\n<p><span style=\"vertical-align: baseline;\">Consider an exposed cloud storage credential. Once automated tooling discovers the credential in source code, an environment variable, application configuration, a database, or another compromised system, it can immediately test the credential and begin enumerating available data.</span></p>\n<p><span style=\"vertical-align: baseline;\">A long-lived credential that works from anywhere on the internet and provides broad storage access can turn a single credential exposure into large-scale data access very quickly.</span></p>\n<p><span style=\"vertical-align: baseline;\">The same pattern applies to service principals and other programmatic identities. A credential intended for an internal CI/CD runner carries considerably more risk when the identity can also authenticate from an arbitrary network  and access production resources.</span></p>\n<p><span style=\"vertical-align: baseline;\">Credential security therefore needs to address both what an identity can access and the conditions under which that access is valid.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Mitigations</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Prioritize Workload and Programmatic Identities</strong><span style=\"vertical-align: baseline;\">: Apply the same rigor used for privileged human identities to service principals, service accounts, API keys, cloud access keys, application credentials, deployment tokens, and Personal Access Tokens. These identities should have defined owners, lifecycle controls, least privilege, monitoring, and incident response procedures.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Move From Long-Lived to Short-Lived Credentials</strong><span style=\"vertical-align: baseline;\">: Remove persistent secrets and use temporary or workload-bound credentials wherever possible. </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Transition from static AWS IAM access keys to temporary credentials through IAM roles.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Replace Azure Service Principal client secrets with Managed Identities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Disallow Azure Storage Account Shared Key Authentication in favor of Entra ID authorization with Conditional Access Policies.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Use Google Cloud Workload Identity Federation instead of long-lived service-account keys.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Move from GitHub classic PATs to fine-grained PATs or workload-based authentication such as GitHub Actions OIDC where supported.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Constrain Both the Where and the What</strong><span style=\"vertical-align: baseline;\">: Limit non-human identities to the APIs, subscriptions, projects, repositories, storage resources, and systems that they actually require. Where supported, restrict the locations and workloads from which those identities can authenticate. A service principal used by an internal CI/CD runner should not also be usable from arbitrary external infrastructure.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Hardening multi-cloud service principals requires replacing long-lived, static credentials with short-lived tokens and strictly enforcing access controls. Essential approaches across major providers include:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud</strong><span style=\"vertical-align: baseline;\">: Using Workload Identity Federation and targeted IAM constraints.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AWS</strong><span style=\"vertical-align: baseline;\">: Leveraging OIDC federation combined with Service Control Policies (SCPs).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Azure</strong><span style=\"vertical-align: baseline;\">: Applying Conditional Access policies to restrict access contextually.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Okta</strong><span style=\"vertical-align: baseline;\">: Implementing Private Key JWT authentication along with network-restricted Authentication Policies.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Use private connectivity, expected source ranges, workload federation, resource policies, and IAM conditions where appropriate across cloud platforms.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Restrict AWS IAM Role Delegation</strong><span style=\"vertical-align: baseline;\">: Tightly control permissions that allow one identity to assign or pass another identity’s privileges. In AWS, restrict iam:PassRole to specific roles and intended services and apply conditions such as iam:PassedToService where appropriate.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Isolate Credential and Secret Stores</strong><span style=\"vertical-align: baseline;\">: Place enterprise password vaults and secret management systems behind tightly controlled administrative and network paths. Require strong authentication for privileged access, restrict programmatic access to expected workloads and networks where supported, and alert on unusual bulk secret queries, enumeration, or export activity. These detections overlap with legitimate automation; the signal is in the identity, origin, volume, and sequence, not the action. Baseline known-good automation first and alert on deviation, or expect false positives on routine activity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Harden Password Reset and Account Lifecycle Processes</strong><span style=\"vertical-align: baseline;\">: Require strong re-authentication or additional identity verification for high-risk password resets and account recovery. Monitor unusual bursts of password resets, account creation, credential additions, permission changes, or other lifecycle activity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automate Secret Hygiene</strong><span style=\"vertical-align: baseline;\">: Implement continuous scanning of repositories, container images, build artifacts, and pipelines for exposed secrets and credentials. Remove credentials from application code, configuration files, deployment scripts, and databases and move them into dedicated secret-management platforms. Rotate exposed credentials promptly rather than relying on removal from source-control history.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Layer 3: Harden Configurations and Reduce Attack Paths</span></h3>\n<p><span style=\"vertical-align: baseline;\">Remove weaknesses that provide an initial foothold and limit how far a compromised workload can reach.</span></p>\n<p><span style=\"vertical-align: baseline;\">Automated tooling is particularly effective in environments where several smaller weaknesses can be combined into a larger attack path. An exposed application, an overly privileged workload identity, a credential in an environment variable, and unrestricted network access may each appear manageable in isolation. Together, they can provide a direct path into sensitive systems.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Why It Is Important</span></h4>\n<p><span style=\"vertical-align: baseline;\">A vulnerability in an internet-facing application may initially appear isolated. In practice, that application may have access to a backend database. The database may contain credentials. Application environment variables may contain cloud tokens. The underlying host may have an attached cloud identity with access to storage, secrets, or management APIs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Automation can test those paths in rapid succession. Failures can also become useful feedback. An application error, stack trace, database response, compiler output, or API error may give the tooling enough information to modify its next request within seconds. Detailed diagnostic information exposed externally therefore provides more than troubleshooting value; it can accelerate experimentation during an attack.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Mitigations</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Continuously Reduce the External Attack Surface</strong><span style=\"vertical-align: baseline;\">: Scan internet-facing applications and infrastructure for vulnerabilities, exposed administrative services, default configurations, and unnecessary services. Vulnerability programs should include custom applications, frameworks, libraries, and dependencies in addition to operating systems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Assume the Workload Can Be Compromised</strong><span style=\"vertical-align: baseline;\">: Design applications so compromise of the front end provides access only to the systems required for that application’s function. Reduce application permissions and limit access to required databases, APIs, queues, storage accounts, and backend services.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enforce Application-Tier Segmentation</strong><span style=\"vertical-align: baseline;\">: Segment internet-facing applications from identity infrastructure, management systems, and unrelated internal services. Restrict DMZ workloads from initiating unnecessary Kerberos, NTLM, LDAP, SMB, RDP, SSH, database, and administrative connections into internal networks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Harden Database Runtime Privileges</strong><span style=\"vertical-align: baseline;\">: Application database accounts should not have broad administrative privileges. Restrict capabilities that allow a database engine or application identity to execute operating-system commands, write arbitrary files, modify server-wide settings, or cross the database-to-OS boundary unless the application requires them.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduce Credential Exposure in Workloads</strong><span style=\"vertical-align: baseline;\">: Review application configurations, environment variables, infrastructure-as-code, deployment scripts, CI/CD pipelines, and databases for embedded secrets. Compromise of one workload should not expose credentials for unrelated systems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Limit Error Feedback to External Users</strong><span style=\"vertical-align: baseline;\">: Avoid returning detailed stack traces, compiler messages, SQL errors, internal paths, framework details, or other diagnostic information to unauthenticated users. Keep detailed troubleshooting information in internal logs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Harden Network and Security Appliances</strong><span style=\"vertical-align: baseline;\">: Remove unnecessary management services from routers, firewalls, VPN appliances, and other infrastructure. Review configurations for unexpected accounts, scheduled jobs, startup scripts, configuration changes, and persistence mechanisms. Validate firmware integrity and vendor signatures where supported.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Harden Active Directory Certificate Services</strong><span style=\"vertical-align: baseline;\">: Review AD CS for certificate templates and enrollment paths that could allow an attacker to obtain authentication certificates or escalate privileges.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Remove ENROLLEE_SUPPLIES_SUBJECT where it is not required, particularly on templates supporting client authentication.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Restrict enrollment permissions to the identities that require them.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Require certificate manager or CA approval for higher-risk enrollment scenarios where appropriate.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enable Extended Protection for Authentication on applicable CA web interfaces where supported.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Monitor unusual certificate enrollment involving privileged users or unexpected requesting systems.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduce Credential Replay and Relay Opportunities</strong><span style=\"vertical-align: baseline;\">: Enable Windows Credential Guard where appropriate, use Protected Users for suitable privileged accounts, enforce SMB signing, and enforce LDAP signing and channel binding. Reduce or disable NTLM where operationally feasible and continue hardening against credential relay, Pass-the-Hash, Pass-the-Ticket, and related techniques.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Restrict Unnecessary Authentication From Exposed Workloads</strong><span style=\"vertical-align: baseline;\">: Internet-facing servers should only initiate Kerberos, NTLM, LDAP, SMB, WinRM, or RDP traffic to systems where those protocols are explicitly required.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Layer 4: Harden Application Development</span></h3>\n<p><span style=\"vertical-align: baseline;\">Harden legitimate enterprise functionality that attackers can reuse after gaining access.</span></p>\n<p><span style=\"vertical-align: baseline;\">A large portion of attacker activity relies on capabilities already present in the environment. Applications, authentication protocols, administrative services, scripting environments, messaging systems, deployment platforms, and business workflows may provide everything needed to continue an intrusion without introducing new malware. Automation makes these capabilities easier to discover and use quickly.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Why It Is Important</span></h4>\n<p><span style=\"vertical-align: baseline;\">Internal business applications, scripts, and APIs are often customized to each organization without public documentation, and require a level of insider knowledge to understand exploitation opportunities. Automated LLM-powered offensive tooling has enabled attackers to enumerate and rapidly understand these internal applications and use them to their advantage. </span></p>\n<p><span style=\"vertical-align: baseline;\">Internal communication functionality is one example. A compromised application account may legitimately have access to a notification, messaging, or email API. Sending messages is expected behavior for that application. That same capability can be abused to send hundreds or thousands of phishing messages. Without recipient limits, rate limits, or behavioral monitoring, a standard business function can become a high-speed distribution mechanism.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Mitigations</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Put Guardrails Around High-Impact Business APIs</strong><span style=\"vertical-align: baseline;\">: Applications capable of accessing sensitive data, retrieving credentials, sending email, notifications, creating users, modifying access, or performing other high-impact actions should have rate limits, recipient limits, transaction thresholds, and abuse controls appropriate to their function. Alert when an application operates materially outside its normal volume.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inventory Legitimate Administrative Capabilities Before an Incident:</strong><span style=\"vertical-align: baseline;\"> Security teams should know which platforms provide remote command execution, deployment, scripting, certificate issuance, identity synchronization, bulk messaging, and other high-impact functions. Those capabilities should have appropriate restrictions and monitoring in place before they are used during an intrusion.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Conduct Automated Application Testing and Threat Modelling</strong><span style=\"vertical-align: baseline;\">: All internal applications should have SAST and DAST scans conducted and findings resolved prior to deployment. Organizations can also leverage LLM-enabled tooling to automate the discovery, triage, reproduction, and patching of software vulnerabilities and potential attack paths. Organizations can also apply agentic source-code review and continuous AI-assisted vulnerability testing—whether a bespoke LLM harness or a managed capability such as </span><a href=\"https://cloud.google.com/security/ai-threat-defense\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Threat Defense</span></a><span style=\"vertical-align: baseline;\">—to find, triage, and reproduce these attack paths before an attacker does.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Layer 5: Detect Behavioral and Volumetric Change</span></h3>\n<p><span style=\"vertical-align: baseline;\">Detect when identities, applications, workloads, and infrastructure begin operating outside their established patterns.</span></p>\n<p><span style=\"vertical-align: baseline;\">Many actions performed during an automated attack are legitimate operations when viewed individually. Detection therefore depends heavily on context: identity, source network, volume, timing, sequence, target resource, and historical activity.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Why It Is Important</span></h4>\n<p><span style=\"vertical-align: baseline;\">A service principal accessing cloud storage is not necessarily suspicious. A service principal that normally accesses ten objects from one internal network and suddenly downloads thousands of objects from an unfamiliar hosting provider is a different situation.</span></p>\n<p><span style=\"vertical-align: baseline;\">Outbound activity provides similar context. Automated tooling on a compromised server may contact external webhook services to confirm execution or transfer results. It may also communicate with LLM platforms, temporary file-sharing infrastructure, tunneling services, or attacker-controlled systems.</span></p>\n<p><span style=\"vertical-align: baseline;\">A single HTTPS connection may be routine. A production server that historically communicates with a small set of known destinations and suddenly begins reaching several new external services deserves closer attention.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Mitigations and Detection Priorities</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Baseline Behavior at the Identity and Workload Level</strong><span style=\"vertical-align: baseline;\">: Establish expected authentication sources, APIs, resources, activity volumes, and communication patterns for sensitive service principals, applications, workloads, and administrative identities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Detect Changes in Authentication Origin</strong><span style=\"vertical-align: baseline;\">: Track the networks, ASNs, cloud regions, hosting providers, and other infrastructure used by privileged users and workload identities. Investigate successful authentication from infrastructure that falls outside the identity’s normal pattern.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor Control-Plane Velocity</strong><span style=\"vertical-align: baseline;\">: Alert on unusual bursts of management API calls, permission testing, configuration changes, resource enumeration, credential retrieval, and other administrative activity. The timing and sequence of legitimate API calls can provide important context.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Baseline Data-Plane Activity</strong><span style=\"vertical-align: baseline;\">: Establish normal read, write, and object-access patterns for sensitive storage and data platforms. Detect sudden enumeration, unusual write-read-delete sequences, large increases in object access, or material changes in bytes transferred.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build Detections Around Sequences</strong><span style=\"vertical-align: baseline;\">: Correlate related events across identity, control-plane, data-plane, endpoint, and network telemetry. A new authentication source followed by permission probing, storage enumeration, bulk downloads, and a connection to a previously unseen external service should be analyzed as one sequence.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor East-West Behavior From Exposed Workloads</strong><span style=\"vertical-align: baseline;\">: Detect unexpected LDAP, Kerberos, NTLM, SMB, database, remote administration, and port-scanning activity originating from DMZ or internet-facing systems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Control and Monitor Server Egress</strong><span style=\"vertical-align: baseline;\">: Restrict unnecessary outbound internet connectivity from production servers and route sensitive workloads through controlled egress paths where practical. Monitor previously unseen destinations, particularly webhook services, OAST infrastructure, tunneling platforms, public file-transfer services, and external AI platforms that are not required by the workload.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Preserve the Telemetry Needed to See the Behavior</strong><span style=\"vertical-align: baseline;\">: Collect and centralize interactive and non-interactive identity logs, service-principal authentication, cloud control-plane activity, sensitive storage data-plane logs, application administration logs, network flow, DNS, proxy telemetry, and endpoint activity. Establishing normal behavior depends on having enough historical data to compare against current activity.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Google Security Operations (SecOps)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google SecOps customers have access to these broad category rules and more under the Mandiant Frontline Threats and Mandiant Hunting Rules rule pack. The activity discussed in the blog post is detected in Google SecOps under the rule names:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Webhook.Site Interaction</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Invocation</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Cmd Launching Curl</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS Cloud Accounts Getcalleridentity</span></p>\n</li>\n</ul></div>"
