    "summary": "<h2 class=\"release-note-product-title\">Cloud Load Balancing</h2>\n<h3>Feature</h3>\n<p>External IPv6 addresses are now supported for\n<a href=\"https://docs.cloud.google.com/network-tiers/docs/overview#standard_tier\">Standard Tier</a>. For more\ninformation,\nsee <a href=\"https://docs.cloud.google.com/vpc/docs/subnets#ipv6-ranges\">IPv6 subnet ranges</a>.</p>\n<p>This feature is in <strong>Preview.</strong></p>\n<h2 class=\"release-note-product-title\">Compute Engine</h2>\n<h3>Feature</h3>\n<p><strong>Preview</strong>: External IPv6 addresses are now supported for\n<a href=\"https://docs.cloud.google.com/network-tiers/docs/overview#standard_tier\">Standard Tier</a>. For more\ninformation,\nsee <a href=\"https://docs.cloud.google.com/vpc/docs/subnets#ipv6-ranges\">IPv6 subnet ranges</a>.</p>\n<h2 class=\"release-note-product-title\">Google SecOps SIEM</h2>\n<h3>Feature</h3>\n<p><strong>[Spotlight Feature] Terraform and client libraries for multiple features using Chronicle API</strong></p>\n<p>Terraform providers and Google Cloud client libraries are now available for several Google SecOps features using Chronicle API including <strong>Feeds, Parsers, Rules, Findings Refinements, Retrohunts, Dashboards, Data Tables, Watchlists, Custom Lists, Environments, Environment Groups, Data Export, SOAR Domains, and SOAR Networks</strong>. For more information, see <a href=\"https://docs.cloud.google.com/chronicle/docs/terraform\">Terraform reference</a> and <a href=\"https://docs.cloud.google.com/chronicle/docs/libraries\">Client libraries</a>. </p>\n<p>Terraform providers enable programmatic provisioning and management of Google SecOps resources as code, while Client Libraries enable developers to build custom integrations and automate Google SecOps workflows in their preferred programming languages.</p>\n<h2 class=\"release-note-product-title\">Network Service Tiers</h2>\n<h3>Feature</h3>\n<p>External IPv6 addresses are now supported for\n<a href=\"https://docs.cloud.google.com/network-tiers/docs/overview#standard_tier\">Standard Tier</a> in <strong>Preview</strong>.\nFor more information, see <a href=\"https://docs.cloud.google.com/vpc/docs/subnets#ipv6-ranges\">IPv6 subnet ranges</a>.</p>"
"last_updated": "2026-10-06 02:54:54 JST"
