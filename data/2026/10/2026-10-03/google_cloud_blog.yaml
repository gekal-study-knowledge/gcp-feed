"entries":
  "4efff54c6ca973119818d0e6cb7e2476":
    "id": "4efff54c6ca973119818d0e6cb7e2476"
    "title": "Announcing Spanner queues: Transactional messaging for agentic workloads and beyond"
    "link": "https://cloud.google.com/blog/products/databases/spanner-queues-provide-native-transactional-messaging/"
    "published": "2026-10-03 01:00:00"
    "fetched": "2026-10-03 03:58:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI agents don't just answer queries — they can autonomously issue refunds, manage inventory, execute multi-step handoffs, and orchestrate sub-agents, to name but a few complex agentic workflows. That frequently requires the agents to maintain internal state in an operational database while dispatching asynchronous actions through a separate messaging or event queue system. And unfortunately for the teams building these applications, managing two systems with disjointed commit points destroys transactional consistency in agentic systems.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are excited to announce the general availability of </span><a href=\"https://docs.cloud.google.com/spanner/docs/queues/queues-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Spanner queues</strong></a><span style=\"vertical-align: baseline;\">: native transactional messaging embedded directly within Spanner. Designed specifically for reliable agentic execution, with Spanner queues, creating a message is simply another write in your transaction. An agent's state change and intended downstream actions commit together atomically or fail completely.</span></p>\n<p><span style=\"vertical-align: baseline;\">Compare this to traditional approaches: When a database state update succeeds, but the action dispatch fails, your AI agent decides to act but doesn’t execute. If the message dispatch succeeds but the state transaction rolls back, your agent executes an action based on an invalid state. In asynchronous multi-agent coordination, retries, speculation, and race conditions amplify these failures, forcing developers to build complex outbox patterns, idempotency layers, and reconciliation workers — a heavy reliability tax on agentic architecture.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key capabilities for agentic architectures</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Spanner queues introduces several core capabilities to support these complex asynchronous workflows without introducing infrastructure overhead.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Atomic decide-and-act enqueue.</strong><span style=\"vertical-align: baseline;\"> Within a single Spanner read-write transaction, agents can update internal memory or state tables and enqueue tasks to peer agents simultaneously. Backed by Spanner's strict serializability and global external consistency, state changes and execution intent commit as a single atomic unit.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Scheduled execution and delays.</strong><span style=\"vertical-align: baseline;\"> Queue messages can be dispatched immediately upon commit or scheduled for future delivery. Agentic patterns such as delayed retries, scheduled agent check-ins, or SLA escalation timers can be enqueued transactionally alongside memory updates without requiring external cron schedulers or polling infrastructure.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Streaming SQL pull for agent workers.</strong><span style=\"vertical-align: baseline;\"> Autonomous agents consume tasks dynamically using streaming SQL reads. Agent runtimes stream incoming tasks, process them as capacity becomes available, and acknowledge task completion within a transaction to guarantee end-to-end task execution state reliability.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Episodic memory persistence and handoffs.</strong><span style=\"vertical-align: baseline;\"> Agent memory updates — including long-term episodic summaries, reflective state transitions, and context handoffs across sub-agents — can be persisted asynchronously and transactionally via queues. This guarantees that an agent's internal memory remains fully synchronized with its execution history without blocking real-time interactive turns.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why Spanner queues are essential for autonomous agents</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">Transactional exactly-once agent execution: </strong><span style=\"vertical-align: baseline;\">When an agent evaluates tool call results, state modification, reasoning persistence, and downstream tool invocation tasks are saved in one transaction. We guarantee at-least-once delivery and at-most-once ACK, enabling you to achieve exactly-once processing.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Robust multi-agent orchestration and handoffs:</strong><span style=\"vertical-align: baseline;\"> In multi-agent systems (A2A), handing off state from a primary agent to a specialist agent is represented as a durable, transactionally committed message. Specialist agent workers receive deliverable messages while maintaining a fully auditable lineage of agent interactions.</span></p>\n<p><strong style=\"vertical-align: baseline;\">First-class timeouts and human-in-the-loop workflows:</strong><span style=\"vertical-align: baseline;\"> Agent workflows frequently require pausing for human approvals or scheduled follow-ups. Spanner queues handles timeout management natively: A single transaction records the pending approval state and schedules an automated escalation message, resolving whichever triggers first.</span></p>\n<p><strong style=\"vertical-align: baseline;\">SQL-native observability for agent queues:</strong><span style=\"vertical-align: baseline;\"> Inspecting in-flight agent workloads, monitoring task backlogs, or auditing agent execution history can be accomplished with standard SQL queries over queue tables, avoiding opaque message-store black boxes.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Beyond agentic workflows</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Beyond AI agents, Spanner queues serves as a flexible, multi-purpose messaging platform across a variety of traditional event-driven architectures. Whether powering real-time activity feeds in social applications, delivering live updates in news publishing, orchestrating order processing and inventory workflows in retail, or handling high-throughput asynchronous task processing and transaction notifications in financial services, Spanner queues provides a robust foundation for asynchronous message delivery and transactional event-driven workflows within your primary database.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Under the hood: Transactional mechanics of Spanner queues</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Because Spanner queues are represented as first-class relational structures in Spanner, you define, inspect, and manage queues using familiar GoogleSQL.</span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Defining a queue and enqueuing atomically</span></h4>\n<p><span style=\"vertical-align: baseline;\">When an agent decides to approve a customer refund, it updates the </span><span style=\"vertical-align: baseline;\">Orders</span><span style=\"vertical-align: baseline;\"> table and dispatches an execution task to the </span><span style=\"vertical-align: baseline;\">OrderAgentTasks</span><span style=\"vertical-align: baseline;\"> queue within a single ACID transaction:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Assume parent table:\\r\\n-- CREATE TABLE Orders (\\r\\n--   OrderId STRING(64) NOT NULL, ...\\r\\n-- )\\r\\n-- PRIMARY KEY (OrderId);\\r\\n\\r\\n-- Define the transactional queue table\\r\\nCREATE QUEUE OrderAgentTasks (\\r\\n  OrderId STRING(64) NOT NULL,\\r\\n  TaskId STRING(64) NOT NULL,\\r\\n  TaskType STRING(64) NOT NULL,\\r\\n  Payload JSON NOT NULL\\r\\n) PRIMARY KEY (OrderId, TaskId, TaskType), INTERLEAVE IN Orders;\\r\\n\\r\\n-- Inside a Read-Write Transaction:\\r\\n-- 1. Update business state atomically\\r\\n\\r\\n-- BEGIN TRANSACTION;\\r\\n\\r\\nUPDATE Orders\\r\\nSET Status = \\&#x27;REFUND_APPROVED\\&#x27;,\\r\\n    UpdatedAt = PENDING_COMMIT_TIMESTAMP()\\r\\nWHERE OrderId = @orderId;\\r\\n\\r\\n-- 2. Enqueue the asynchronous agent action in the same transaction\\r\\nINSERT INTO OrderAgentTasks (OrderId, TaskId, TaskType, Payload)\\r\\nVALUES (\\r\\n  @orderId,\\r\\n  @taskId,\\r\\n  \\&#x27;EXECUTE_REFUND\\&#x27;,\\r\\n  JSON \\&#x27;{&quot;action&quot;: &quot;execute_refund&quot;, &quot;amount&quot;: 49.99}\\&#x27;\\r\\n);\\r\\n\\r\\n-- COMMIT;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b7cf090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This ensures that the </span><span style=\"vertical-align: baseline;\">EXECUTE_REFUND</span><span style=\"vertical-align: baseline;\"> task exists if and only if the order status successfully transitioned to </span><span style=\"vertical-align: baseline;\">REFUND_APPROVED</span><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><span style=\"vertical-align: baseline;\">2. Temporal scheduling and atomic cancellation</span></h4>\n<p><span style=\"vertical-align: baseline;\">For workflows that depend on time — such as waiting up to 72 hours for a manager's approval before escalating — agents populate the system </span><span style=\"vertical-align: baseline;\">DeliverTime</span><span style=\"vertical-align: baseline;\"> column to defer message visibility:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Schedule an automated escalation check-in 72 hours in the future\\r\\nINSERT INTO OrderAgentTasks (OrderId, TaskId, TaskType, Payload, DeliverTime)\\r\\nVALUES (\\r\\n  @orderId,\\r\\n  @escalationTaskId,\\r\\n  \\&#x27;ESCALATE_UNAPPROVED_ORDER\\&#x27;,\\r\\n  JSON \\&#x27;{&quot;action&quot;: &quot;escalate_to_supervisor&quot;}\\&#x27;,\\r\\n  TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 72 HOUR)\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b7ce410&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If the manager approves the request after four hours, your application doesn't have to deal with phantom escalation alerts firing  days later. In a single transaction, you update the order status and cancel the pending escalation task using a standard SQL </span><span style=\"vertical-align: baseline;\">DELETE</span><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- BEGIN TRANSACTION;\\r\\n\\r\\nUPDATE Orders\\r\\nSET Status = &#x27;MANAGER_APPROVED&#x27;,\\r\\n    ApprovedBy = @managerId\\r\\nWHERE OrderId = @orderId;\\r\\n\\r\\n-- Atomically cancel the pending delayed escalation task. `ASSERT_ROWS_MODIFIED 1` will\\r\\n-- act as a safeguard and cause a statement level error.\\r\\n\\r\\n-- A statement level error can be captured and the transaction can be\\r\\n-- user-aborted/cancelled in case the queue entry was already deleted.\\r\\n-- Otherwise the transaction will complete successfully regardless if the \\r\\n-- queue entry still exists and you&#x27;ll only know if a queue entry was deleted by\\r\\n-- checking the number of rows affected by the DELETE.\\r\\nDELETE FROM OrderAgentTasks\\r\\nWHERE OrderId = @orderId\\r\\n  AND TaskId = @escalationTaskId\\r\\n  AND TaskType = &#x27;ESCALATE_UNAPPROVED_ORDER&#x27;,\\r\\nASSERT_ROWS_MODIFIED 1;\\r\\n\\r\\n-- COMMIT;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b7cf210&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">3. Streaming consumption, lease renewal, and atomic acknowledgment</span></h4>\n<p><span style=\"vertical-align: baseline;\">Downstream agent workers consume tasks using the </span><span style=\"vertical-align: baseline;\">RECEIVE_&lt;QueueName&gt;</span><span style=\"vertical-align: baseline;\"> table-valued function (TVF) over a streaming SQL connection (</span><span style=\"vertical-align: baseline;\">ExecuteStreamingSql</span><span style=\"vertical-align: baseline;\">). Spanner automatically manages message leases, returning a unique </span><span style=\"vertical-align: baseline;\">SpannerLeaseToken</span><span style=\"vertical-align: baseline;\"> and expiration timestamp with each leased task:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Step 1: Consume tasks via a long-lived streaming SQL query\\r\\nSELECT\\r\\n  OrderId,\\r\\n  TaskId,\\r\\n  TaskType,\\r\\n  Payload,\\r\\n  SpannerLeaseToken,\\r\\n  SpannerLeaseExpirationTimestamp\\r\\nFROM RECEIVE_OrderAgentTasks(max_duration =&gt; &#x27;20m&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b7cfed0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Because AI agent tasks often involve multi-turn LLM reasoning or external API calls that take longer than default lease windows, workers can actively extend their lease using the </span><span style=\"vertical-align: baseline;\">RENEWLEASE_&lt;QueueName&gt;</span><span style=\"vertical-align: baseline;\"> function:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Step 2: Extend lease ownership during long-running agent execution\\r\\nSELECT *\\r\\nFROM RENEWLEASE_OrderAgentTasks(lease_tokens =&gt; [@leaseToken]);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b7cdd90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When the agent finishes executing its external tool (passing </span><span style=\"vertical-align: baseline;\">TaskId</span><span style=\"vertical-align: baseline;\"> as the external API's idempotency key), it opens a read-write transaction to record the final state and acknowledge the message by deleting it with </span><span style=\"vertical-align: baseline;\">ASSERT_ROWS_MODIFIED 1</span><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Step 3: Atomically checkpoint agent results and ACK the message\\r\\n-- BEGIN TRANSACTION;\\r\\n\\r\\nUPDATE Orders\\r\\nSET RefundTransactionId = @externalRefundId,\\r\\n    Status = &#x27;REFUND_COMPLETED&#x27;\\r\\nWHERE OrderId = @orderId;\\r\\n\\r\\nDELETE FROM OrderAgentTasks\\r\\nWHERE OrderId = @orderId\\r\\n  AND TaskId = @taskId\\r\\n  AND TaskType = @taskType\\r\\nASSERT_ROWS_MODIFIED 1;\\r\\n\\r\\n-- COMMIT;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b7ccc10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Using </span><span style=\"vertical-align: baseline;\">ASSERT_ROWS_MODIFIED 1</span><span style=\"vertical-align: baseline;\"> protects your system against lease-expiration races. If a worker stalled due to a network pause and its lease expired, another worker may have already processed and deleted the task. When the stalled worker resumes and attempts to execute the statement, </span><span style=\"vertical-align: baseline;\">ASSERT_ROWS_MODIFIED 1</span><span style=\"vertical-align: baseline;\">  detects that the queue row is already gone and throws a statement-level error. Catching that error and aborting that transaction prevents stale workers from overwriting newer database state.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Spanner change streams vs. Spanner queues</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Spanner change streams capture database data changes (inserts, updates, and deletes) in near real-time for downstream integration and auditing.</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">While both change streams and queues allow applications to react to data changes, Spanner change streams are designed for continuous change data capture (CDC) and data streaming to downstream analytics or storage. In contrast, Spanner queues are explicitly designed for transactional task orchestration, supporting native message leases, scheduled deliveries, SQL-based pulling, and atomic acknowledgments within read-write transactions.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Spanner provides a unified foundation for agentic data, combining relational, hybrid search, graph, and key-value capabilities under strict global consistency. Spanner queues completes the agentic loop by enabling agents to transition seamlessly from reasoning over data to executing transactional actions within a single unified platform. Spanner queues are now generally available. </span></p>\n<p><span style=\"vertical-align: baseline;\">Sign up for the </span><a href=\"https://console.cloud.google.com/freetrial?redirectPath=%2Fspanner&amp;facet_utm_source=google&amp;facet_utm_campaign=%28organic%29&amp;facet_utm_medium=organic&amp;facet_url=https%3A%2F%2Fcloud.google.com%2Fblog%2Fproducts%2Fspanner%2Ftry-cloud-spanner-databases\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner 90-day free trial</span></a><span style=\"vertical-align: baseline;\"> and read up our </span><a href=\"https://cloud.google.com/spanner/docs/queues/queues-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">public documentation</span></a><span style=\"vertical-align: baseline;\"> to start building resilient, exactly-once agentic workloads by creating a queue table in your Spanner database today.</span></p></div>"
  "95101762f1391f8d3991ecc4c8b56631":
    "id": "95101762f1391f8d3991ecc4c8b56631"
    "title": "GKE CPU startup boost: Accelerate app starts without over-provisioning"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gke-cpu-startup-boost-faster-pod-starts-lower-costs/"
    "published": "2026-10-03 01:00:00"
    "fetched": "2026-10-03 03:58:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Whether you’re launching microservices in response to sudden traffic spikes, deploying new software releases, or scaling up application replicas, </span><strong style=\"vertical-align: baseline;\">pod startup time</strong><span style=\"vertical-align: baseline;\"> is critical to maintaining a fast, responsive user experience for applications running on Google Kubernetes Engine (GKE).</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_mhC0eeP.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Yet, platform engineers and developers face a persistent dilemma: Applications often demand significantly more CPU power during startup than they do during steady-state operations. Sizing CPU requests for normal, steady-state usage leads to CPU throttling during launch, which can result in sluggish cold starts and readiness probe timeouts. On the flip side, over-provisioning baseline CPU requests to satisfy short-lived startup bursts wastes valuable compute resources, inflating infrastructure bills.</p><p>Today, we are excited to announce <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/boost-application-startup\"><b>CPU startup boost</b></a> for GKE in preview. Integrated directly into GKE's Vertical Pod Autoscaler (VPA), CPU startup boost dynamically elevates a container's CPU allocation during initialization and seamlessly scales it back to baseline steady-state levels once the application is ready - <b>all without restarting your containers.</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Why modern applications need extra CPU at boot time</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When a new container launches, it may perform intensive initialization tasks before it begins serving user requests. Depending on your tech stack, the following startup workloads require substantial CPU cycles:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Java JVM applications</strong><span style=\"vertical-align: baseline;\">: Frameworks like Spring Boot require high CPU burst capacity for class loading, classpath scanning, instantiating dependency injection containers, and running Just-in-Time (JIT) compilation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Node.js servers</strong><span style=\"vertical-align: baseline;\">: Apps parse JavaScript files, build complex module dependency trees (</span><code style=\"vertical-align: baseline;\">require</code><span style=\"vertical-align: baseline;\">/</span><code style=\"vertical-align: baseline;\">import</code><span style=\"vertical-align: baseline;\">), and execute V8 engine optimization and JIT compilation passes during initial execution.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Python and AI/ML microservices</strong><span style=\"vertical-align: baseline;\">: These services spend initial cycles importing heavy libraries (such as PyTorch, NumPy, or LangChain), compiling </span><code style=\"vertical-align: baseline;\">.pyc</code><span style=\"vertical-align: baseline;\"> bytecode, establishing ORM database schemas, and pre-loading cache structures.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If you size CPU requests strictly for steady-state performance, these initialization workloads experience CPU throttling on launch, delaying readiness probes. To prevent slow cold starts, teams frequently overprovision CPU requests. However, once the application stabilizes, those extra CPU resources sit idle, increasing your cloud spend without adding value.</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_zZExLw4.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <h3><b>How CPU startup boost can help</b></h3><p>CPU Startup Boost solves this by giving your workloads temporary vCPU \"boosts\" during launch, and automatically returning them to baseline once initialization completes.</p><p>Key benefits:</p><ul><li><b>Faster cold starts</b>: Reduce application initialization times by up to <b>2x</b>, accelerating auto-scaling responsiveness during unexpected traffic surges.</li><li><b>Optimized cloud spend</b>: Right-size steady-state CPU requests to fit actual runtime needs rather than paying for idle startup headroom.</li><li><b>Zero pod restarts</b>: Dynamic resource resizing happens live inside the running container.</li><li><b>Flexible policy controls</b>: Apply simple pod-level multiplier factors (e.g., 2x CPU during startup) or define granular, container-specific rules for complex multi-container pods.</li></ul>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Under the hood: Kubernetes In-place Pod Resize</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Historically, changing a pod's resource requests or limits required deleting and recreating the pod. This disruptive process triggered container restarts, cache invalidation, and node rescheduling overhead.</span></p>\n<p><span style=\"vertical-align: baseline;\">To fix that, CPU startup boost builds on Kubernetes </span><a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/resize-container-resources/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">In-place Pod Resize (IPPR)</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Tracked under </span><a href=\"https://github.com/kubernetes/enhancements/tree/master/keps/sig-node/1287-in-place-pod-resize\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">KEP-1287</span></a><span style=\"vertical-align: baseline;\">, IPPR introduced dynamic, in-place resource mutation. Introduced as Alpha in Kubernetes 1.27, promoted to Beta in v1.33, and graduating to General Availability (GA) in v1.35, IPPR allows the Kubernetes control plane and </span><code style=\"vertical-align: baseline;\">kubelet</code><span style=\"vertical-align: baseline;\"> to update container CPU and memory requests on running pods </span><strong style=\"vertical-align: baseline;\">without restarting the container process</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">GKE leverages IPPR within the VPA  to apply startup CPU boosts at pod admission and smoothly step them down post-readiness.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How CPU startup boost works (pod lifecycle overview)</strong></h3>\n<p><span style=\"vertical-align: baseline;\">CPU startup boost operates across three distinct phases:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Admission phase</strong><span style=\"vertical-align: baseline;\">: When you deploy a pod, the VPA admission webhook intercepts the creation request. It calculates the elevated CPU request based on your policy (e.g., 2x multiplier or +2 vCPUs) and injects the boosted CPU request along with tracking annotations into the pod spec.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Startup phase</strong><span style=\"vertical-align: baseline;\">: The pod is scheduled and initialized with the boosted CPU allocation. Your application completes class loading, JIT compilation, or module parsing at top speed without experiencing CPU throttling.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unboosting phase</strong><span style=\"vertical-align: baseline;\">: As soon as the pod's </span><code style=\"vertical-align: baseline;\">readinessProbe</code><span style=\"vertical-align: baseline;\"> passes (plus any configured </span><code style=\"vertical-align: baseline;\">durationSeconds</code><span style=\"vertical-align: baseline;\"> cooldown delay), the VPA updater issues an in-place resize request. The CPU request steps back down to your baseline level while the container continues running uninterrupted.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Prerequisites and availability</strong></h3>\n<p><span style=\"vertical-align: baseline;\">CPU startup boost is available today in preview on GKE:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE version</strong><span style=\"vertical-align: baseline;\">: Version </span><code style=\"vertical-align: baseline;\">1.36.0-gke.4447000</code><span style=\"vertical-align: baseline;\"> or later on Standard and Autopilot clusters.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cluster Modes</strong><span style=\"vertical-align: baseline;\">: Enabled natively on GKE Autopilot (VPA is active by default). On GKE Standard, simply ensure Vertical Pod Autoscaling (VPA) is enabled.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Workload Support</strong><span style=\"vertical-align: baseline;\">: Works with standard Kubernetes controllers, including Deployments and StatefulSets.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Getting started: Configuring CPU startup boost</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Configuring CPU startup boost is as simple as adding a </span><code style=\"vertical-align: baseline;\">startupBoost</code><span style=\"vertical-align: baseline;\"> section to your </span><code style=\"vertical-align: baseline;\">VerticalPodAutoscaler</code><span style=\"vertical-align: baseline;\"> manifest.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Example 1: Pod-level boost with fixed steady-state (</span><code style=\"vertical-align: baseline;\">updateMode: \"Off\"</code><span style=\"vertical-align: baseline;\">)</span></h4>\n<p><span style=\"vertical-align: baseline;\">If you want to use VPA purely for startup boost while keeping steady-state CPU requests locked to your manifest definitions, set </span><code style=\"vertical-align: baseline;\">updateMode</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">\"Off\"</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: &quot;autoscaling.k8s.io/v1&quot;\\r\\nkind: VerticalPodAutoscaler\\r\\nmetadata:\\r\\n  name: java-app-startup-boost\\r\\n  namespace: default\\r\\nspec:\\r\\n  targetRef:\\r\\n    apiVersion: &quot;apps/v1&quot;\\r\\n    kind: Deployment\\r\\n    name: java-app\\r\\n  updatePolicy:\\r\\n    updateMode: &quot;Off&quot;\\r\\n  startupBoost:\\r\\n    cpu:\\r\\n      type: &quot;Factor&quot;\\r\\n      factor: 2\\r\\n      durationSeconds: 10&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b166e50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">In this example, GKE doubles the container's CPU request during launch and holds the boosted allocation for 10 seconds after readiness probes pass before scaling back to baseline.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Example 2: Combining startup boost with continuous VPA auto-scaling</strong></h3>\n<p><span style=\"vertical-align: baseline;\">If you want GKE to boost CPU during launch </span><strong style=\"vertical-align: baseline;\">and</strong><span style=\"vertical-align: baseline;\"> continuously optimize steady-state resources post-startup, set </span><code style=\"vertical-align: baseline;\">updateMode</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">\"InPlaceOrRecreate\"</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: &quot;autoscaling.k8s.io/v1&quot;\\r\\nkind: VerticalPodAutoscaler\\r\\nmetadata:\\r\\n  name: nodejs-app-vpa\\r\\n  namespace: default\\r\\nspec:\\r\\n  targetRef:\\r\\n    apiVersion: &quot;apps/v1&quot;\\r\\n    kind: Deployment\\r\\n    name: nodejs-service\\r\\n  updatePolicy:\\r\\n    updateMode: &quot;InPlaceOrRecreate&quot;\\r\\n  startupBoost:\\r\\n    cpu:\\r\\n      type: &quot;Factor&quot;\\r\\n      factor: 3\\r\\n      durationSeconds: 15&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b503c90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Example 3: Granular container-level boost</span></h4>\n<p><span style=\"vertical-align: baseline;\">For pods running sidecars (such as logging agents or service mesh proxies) that do not require extra CPU on boot, target specific app containers:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: &quot;autoscaling.k8s.io/v1&quot;\\r\\nkind: VerticalPodAutoscaler\\r\\nmetadata:\\r\\n  name: app-container-boost\\r\\nspec:\\r\\n  targetRef:\\r\\n    apiVersion: &quot;apps/v1&quot;\\r\\n    kind: Deployment\\r\\n    name: API-gateway\\r\\n  updatePolicy:\\r\\n    updateMode: &quot;Off&quot;\\r\\n  resourcePolicy:\\r\\n    containerPolicies:\\r\\n    - containerName: &quot;web-app&quot;\\r\\n      mode: &quot;Off&quot;\\r\\n      startupBoost:\\r\\n        cpu:\\r\\n          type: &quot;Quantity&quot;\\r\\n          quantity: &quot;2&quot;\\r\\n          durationSeconds: 5&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569a3ef710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">Verifying startup boost in your cluster</strong></h2>\n<p><span style=\"vertical-align: baseline;\">You can verify that GKE applied and downscaled the startup boost using </span><code style=\"vertical-align: baseline;\">kubectl</code><span style=\"vertical-align: baseline;\">:</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Inspect pod annotations</strong><span style=\"vertical-align: baseline;\">: Check for the </span><code style=\"vertical-align: baseline;\">vpaCpuStartupBoost</code><span style=\"vertical-align: baseline;\"> tracking annotation:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl get pod &lt;POD_NAME&gt; -o yaml&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569a3ece10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Look for annotations indicating the original baseline and boosted CPU requests.</span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">Monitor in-place resize events</strong><span style=\"vertical-align: baseline;\">: Confirm that GKE downscaled the CPU request back to baseline after readiness:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl get events --field-selector reason=InPlaceResizedByVPA&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569a3ec610&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">An event with </span><code style=\"vertical-align: baseline;\">reason=InPlaceResizedByVPA</code><span style=\"vertical-align: baseline;\"> confirms successful in-place downscaling post-startup.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Best practices for production workloads</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pairing with Horizontal Pod Autoscaler (HPA)</strong><span style=\"vertical-align: baseline;\">: When using HPA alongside CPU startup boost, ensure a robust </span><code style=\"vertical-align: baseline;\">readinessProbe</code><span style=\"vertical-align: baseline;\"> is defined and keep </span><code style=\"vertical-align: baseline;\">durationSeconds</code><span style=\"vertical-align: baseline;\"> short (e.g., </span><code style=\"vertical-align: baseline;\">0s</code><span style=\"vertical-align: baseline;\">–</span><code style=\"vertical-align: baseline;\">10s</code><span style=\"vertical-align: baseline;\">). This prevents HPA from falsely interpreting initialization CPU spikes as high steady-state load.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Handle traffic spikes with </strong><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/configure-capacity-buffer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE capacity buffers API</strong></a><span style=\"vertical-align: baseline;\">: By reducing the startup tax at scale, you can achieve higher workload density on fewer nodes to improve overall utilization. Consider adopting the GKE capacity buffers API to absorb sudden traffic surges with minimal operational overhead while maintaining strict SLOs. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Autopilot resource ratios</strong><span style=\"vertical-align: baseline;\">: On GKE Autopilot, remember that pods must maintain valid CPU-to-memory ratios. Ensure baseline memory allocations accommodate the boosted CPU ratio during startup.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">CPU startup boost gives GKE users the best of both worlds: lightning-fast cold starts for CPU-intensive workloads like Java, Node.js, and Python, paired with maximum resource efficiency and lower cloud costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Ready to accelerate your GKE workloads?</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore the </span><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/cpu-startup-boost\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE CPU startup boost documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn more about </span><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/vertical-pod-autoscaling\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Vertical Pod Autoscaling on GKE</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Try CPU startup boost on your GKE Standard or Autopilot clusters running GKE </span><code style=\"vertical-align: baseline;\">1.36.0-gke.4447000</code><span style=\"vertical-align: baseline;\"> or later!</span></p>\n</li>\n</ul></div>"
