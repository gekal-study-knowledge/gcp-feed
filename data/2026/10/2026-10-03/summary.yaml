"overview": |
  この日は 3 件で、Spanner のトランザクショナルなメッセージングと、GKE の起動高速化、そして AI 基盤の事例でした。データベースでは、Spanner queues が一般提供となりました。Spanner の中に直接埋め込まれたネイティブなトランザクショナルメッセージングで、信頼できるエージェントの実行のために設計されています。AI エージェントは問い合わせに答えるだけでなく、返金の実行、在庫の管理、多段の引き継ぎ、サブエージェントのオーケストレーションといった複雑な処理を自律的に行いますが、そのためには運用データベースで内部状態を保ちながら、別のメッセージングやイベントキューの仕組みで非同期の処理を送り出す必要がありました。コミットの地点が揃っていない 2 つのシステムを管理することが、エージェント型のシステムのトランザクション整合性を壊してしまうという問題に対し、Spanner queues ではメッセージの作成がトランザクション内のもう 1 つの書き込みにすぎず、エージェントの状態変更と、その先で行うつもりの処理が一緒にアトミックにコミットされます。コンテナでは、GKE の CPU startup boost が紹介されました。トラフィックの急増に応じてマイクロサービスを立ち上げるときも、新しいリリースを配るときも、レプリカを増やすときも、Pod の起動時間は応答性に直結します。ところが、アプリケーションは定常状態よりも起動時にずっと多くの CPU を必要とすることが多く、定常状態に合わせて CPU リクエストを決めると起動時に CPU スロットリングが起きてコールドスタートが鈍くなり readiness プローブがタイムアウトし、逆に短時間の起動バーストに合わせてベースラインを過剰に確保すると貴重な計算資源を無駄にしてインフラの請求を膨らませる、という板挟みがありました。事例では、AI21 Labs が Google Cloud AI Hypercomputer を採用して AI ワークロードの開始までの時間を 83% 短縮した取り組みが紹介されました。優先度の高いジョブの待ち時間が 72 時間から 12 時間になり、手作業でのスケジューリングの介入は週 20 回からゼロになっています。AI21 は Jamba ファミリーをはじめとする基盤モデルの開発で長い実績を持つ AI ラボで、現在は特化型の LLM とエージェント最適化の技術に注力しており、モデルの学習を高い稼働率で回し続けるために、インフラ・オーケストレーション・消費モデルを一体で設計した、性能が出てスケールする環境が必要だったと述べています。
