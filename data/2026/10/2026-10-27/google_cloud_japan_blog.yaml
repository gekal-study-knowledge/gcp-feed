    "title": "最新生成 AI 活用事例 121 社を一挙公開！ AI エージェントの本格活用が広がる（2026 年 10 月更新）"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/latest-examples-of-generative-ai-applications-from-121-companies-released/"
    "published": "2026-10-27 10:00:00"
    "fetched": "2026-10-27 10:09:15"
    "summary": "<div class=\"block-paragraph\"><p>2026 年に入り、AI エージェントの活用・開発環境は大きく変わりました。<b>Gemini 4 Argon</b> や <b>Gemini agent</b> が発表され、<b>Google Antigravity</b> をはじめとするエージェント開発の環境も充実してきました。AI によるコーディングが身近になり、業務で AI エージェントを開発・活用する企業が急増しています。</p><p>作る手段が広がるほど、課題は全社で安全に使い、運用する段階へと移ります。それを支えるのが <b>Google Cloud</b> です。社内データや外部サービスを横断する検索と AI アシスタントに加え、<b>Gemini platform</b> でエージェントの開発から運用、ガバナンスまでをひとつの基盤で管理できます。</p><p>こうした中で、生成 AI は企業の課題解決にどう役立っているのか。Google Cloud では、国内 121 社の最新事例と解決策をまとめた<b>「生成 AI 活用事例集」を 10 月版</b>に更新し、新たに 11 社の事例を加えました。今回追加した事例には、全従業員約 5,000 名への Gemini 導入や、LLM ゲートウェイによる AI の利用状況とコストの管理など、作ったエージェントを全社で使い、運用する段階の取り組みが並びます。ぜひご覧ください。</p><p>▶︎<a href=\"https://cloud.google.com/learn/intl/ja-jp/genai-case-study\">生成 AI 活用事例集（2026 年 10 月版）を無料でダウンロード</a></p><p><b>Gemini Notebook</b> をご活用の方は、<a href=\"https://goo.gle/customer-notebook-jp\" target=\"_blank\">こちらの専用 Notebook</a> もぜひ併せてご覧ください。生成 AI やデータ分析の活用事例を、より深くインタラクティブに探索いただけます。</p><h3><b>10 月版で新しく追加された事例</b></h3><p>メディアから製造業、情報通信まで、生成 AI を実際の業務に取り入れた 11 社の事例を新たに追加しました。</p><ul><li><b>株式会社AbemaTV</b>: 広告代理店からの問い合わせに答える「QA エージェント」と、配信したい内容をもとに最適な広告メニューを選定する「提案エージェント」の 2 つを備えた AI チャットガイドを構築し、Agent Development Kit (ADK) の活用で想定約 3 か月の実装を約 2 か月で実現しました。</li><li><b>株式会社HRBrain</b>: Google Cloud を基盤に、セキュリティ チェックシートへの回答を生成する AI エージェントを開発し、AI が回答の根拠・出典・信頼度を自動で示すことで、専門部署の確認工数を 70% 以上削減しました。</li><li><b>エイベックス株式会社</b>: API を持たないレガシー システムをウェブブラウザ越しに操作する AI エージェントを構築し、ピーク時 1 日約 1,200 件の支払申請を AI が全件一次チェックしたうえで、人間による最終確認との二重体制で安全性と業務効率化を両立しました。</li><li><b>株式会社NTTデータ</b>: Apigee と Google Cloud を組み合わせた LLM ゲートウェイを構築し、クォータ制御や流量制限、Model Armor を用いた入出力のリアルタイム検査によって、組織のガバナンスに準拠した AI 活用を可能にしました。※株式会社NTTデータの見解および実績ではなく、社員個人の技術検証に基づく事例です。</li><li><b>株式会社NTTドコモ</b>: 基幹システムの設計書 1.6 万ファイルを対象とした QA エージェントを、非エンジニア社員が Gemini を活用して約 3 か月で完全内製し、独自のデータ加工で表・図を構造化して正答率 85% を達成しました。</li><li><b>株式会社荏原製作所</b>: 国内従業員のアクティブ ユーザー約 8,000 名が使う社内 AI「EBARA AI Chat」の利用ログを Gemini ベースの AI エージェントが自動分析し、改善レポートを各ナレッジ担当者に配信する仕組みを構築して、AI が適切な回答を提供できているケースを 50% から 72% に増やしました。</li><li><b>GMOペパボ株式会社</b>: Gemini platform を活用し、「直近 3 か月で新規契約が伸びたプランと要因を分析して」と指示するだけで AI が BigQuery 上のデータを自律的に探索・分析する仕組みを構築し、作業時間を平均約 8 時間から約 40 分へ、約 92% 削減しました。</li><li><b>株式会社SUPERNOVA</b>: Google Cloud 上で稼働する生成 AI サービス「Stella AI for Biz」を開発し、議事録作成や AI OCR、スライド生成など、やりたいことを選ぶだけで誰もが AI を使いこなせる仕組みで、中小法人の生成 AI 活用を促進しています。</li><li><b>Ｓｋｙ株式会社</b>: 2026 年 1 月より全従業員約 5,000 名を対象に Gemini Enterprise を導入し、Gemini Notebook を用いた新メンバーの自律学習や Deep Research による社内外情報の横断調査などで活用が進み、定着率 98% を維持しています。</li><li><b>東京システムハウス株式会社</b>: これまで培ってきた COBOL の知見とノウハウを Gemini に組み込んだ「AI ベテランエンジニア」を開発し、仕様書の自動生成や新任エンジニアの質問への回答を通じて、新任エンジニアの開発・運用工数を 30% 削減しました。</li><li><b>Lazuli株式会社</b>: Gemini のマルチモーダル機能を『Lazuli PDP』の商品情報抽出プロセスに導入し、商品画像やカタログ内のテキスト・表から必要な商品属性を構造化データとして自動抽出することで、作業の属人化を解消し、データ精度の均一化を実現しました。</li></ul><h3><b>第 6 回 生成 AI 事例アワード ピッチコンテスト</b></h3><p><a href=\"https://cloudonair.withgoogle.com/events/agentic-ai-summit-26-fall\" target=\"_blank\">AI Agent Summit ’26 Fall</a> では、第 6 回 生成 AI 事例アワードのファイナリストによるピッチ コンテストが行われます。こちらもぜひご参加ください。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_a21Dh4n.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>"
