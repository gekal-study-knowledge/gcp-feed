"overview": |
  この日は 6 件 (重複を除くと 4 件) で、エージェント向けの IAM の自動化、Knowledge Catalog の LookML 対応、そして Google Cloud Universal Ledger へのスイスフランの導入が中心でした。IAM では IAM Helper が発表されました。自律エージェントがクラウドリソースをプロビジョニングし、Terraform を書き、マイクロサービスを機械の速度でデプロイするようになると、セキュリティの摩擦もその分だけ速く膨らんで CI/CD パイプラインが止まるという問題に対し、込み入った end-to-end の IAM ワークフローを自動化するエージェント向けの構成要素をまとめたものです。Google Cloud IAM に対するエージェントネイティブなオーケストレーションとインターフェースの層として、Policy Intelligence や Privileged Access Manager (PAM) といった中核のエンジンを補い、IAM のスキルをコードアシスタント・デプロイパイプライン・独自のエージェントから直接呼び出せるようにします。権限の詰まりを人が手で切り分ける手間や、近道をして権限を広く与えてしまうことで最小権限が崩れるリスクを避ける狙いで、ポリシーの評価を人の管理者や LLM から Google Cloud のバックエンドへ移し、トークンの効率を上げて運用のボトルネックを防ぎます。IAM Helper Agent Skills は単独のユーティリティではなく、クラウドのアクセスのライフサイクル全体をエージェントに案内するもので、end-to-end のワークフロー、補助スクリプト、ガードレールがオープンな Agent Skills 標準で packaging されています。データ基盤では、Looker Core on Google Cloud 向けに Knowledge Catalog の LookML セマンティック言語インデックスが一般提供となりました。エージェントが試作から本番に移るにつれて、データにアクセスできることとデータを理解していることは別だと気づく、という前提に立った発表です。複雑な業務上の問いに正確に答えるには、テーブルのスキーマ、データリネージ、ガバナンスのポリシー、業務上の定義といったコンテキストが必要ですが、コンテキストは一枚岩ではなく、データがどこにあるかを知ることと、それを使って指標をどう計算するかを知ることは大きく違います。企業では、構造化・非構造化のドキュメントのメタデータから来る広い組織的コンテキストと、純収益や解約率といった指標を定義する正確な SQL の式・結合経路・フィルタのルールという決定的な業務セマンティクスが混同されがちで、1 つのデータカタログや BI ツールが資産の発見と厳密な指標計算の両方を担えるという前提になりやすいと指摘されています。実際にはどちらか一方では足りず、Google Cloud では Knowledge Catalog が構造化テーブルと非構造化ドキュメントのメタデータを集約した統合コンテキストグラフ (資産の発見、データ品質の確認、end-to-end のリネージ、列レベルのプライバシータグの尊重、社内ポリシー文書の提示) を、LookML が決定的な数式のセマンティクスを提供するという役割分担になります。金融では、Google Cloud Universal Ledger (GCUL) にスイスフランを載せる取り組みが紹介されました。従来の決済システムが遅く、高く、柔軟性に欠けることから Tether・USDC・PayPal USD といった公開の商用ステーブルコインが広がった一方、規制下の大手銀行は厳しい資本・流動性の要件や規制・運用の不確実性を理由にそうした取引を距離を置いて扱ってきました。銀行が求めているのは既存のステーブルコインの採用ではなく、長年築いた信頼できる経済的基盤の上に作られたトークン化通貨の速度と効率だという整理のもと、GCUL は公開ステーブルコインを流すのではなく、銀行がトークン化預金を発行・決済するための安全なインフラを提供します。これにより、規制当局の求めを満たし、コアバンキングの業務を壊さないまま、リアルタイムで 24 時間 365 日のプログラム可能な決済を商業銀行の通貨に持ち込めるとしています。新しい決済技術の導入とコアバンキングシステムとの統合は銀行の CTO にとって重い仕事に見えがちで、事業を支えるエンジニアリング資源の需要と新しい規制への対応が同時に迫るなかで、金融サービスのために作られたブロックチェーンであることが要点に挙げられています。日本のブログでは、Google Cloud の「生成 AI 活用事例集」が 2026 年 10 月版に更新され、新たに 11 社を加えて国内 121 社の事例をまとめたことが紹介されました。追加された事例には、全従業員約 5,000 名への Gemini 導入や、LLM ゲートウェイによる AI の利用状況とコストの管理など、作ったエージェントを全社で使い運用する段階の取り組みが並びます。
