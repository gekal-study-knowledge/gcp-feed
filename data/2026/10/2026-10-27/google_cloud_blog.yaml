    "title": "Easy to integrate, compliant by design: Bringing the Swiss Franc to Google Cloud Universal Ledger"
    "link": "https://cloud.google.com/blog/topics/financial-services/easy-to-integrate-compliant-by-design-bringing-the-swiss-franc-to-google-cloud-universal-ledger/"
    "published": "2026-10-27 05:00:00"
    "fetched": "2026-10-27 06:22:00"
    "summary": "<div class=\"block-paragraph\"><p>Every day, countless financial transactions are interrupted by slow, expensive, and inflexible conventional payment systems. As a result, public commercial stablecoins like Tether, USDC, and PayPal USD have become increasingly popular by making it easy to move money efficiently with instant, 24/7 blockchain settlement.</p><p>Yet major regulated banks have largely kept such transactions at arm’s length; for these financial institutions, reserve-backed public stablecoins present numerous risks, including strict capital and liquidity requirements and unmanageable regulatory and operational uncertainty.</p><p>Indeed, banks don't want to adopt existing stablecoins. Instead, they need the speed and efficiency of tokenized currency built on the trusted economic foundations they’ve nurtured over years or even decades in business. That’s why many are now turning to <a href=\"https://cloud.google.com/application/web3/universal-ledger\">Google Cloud Universal Ledger</a> (GCUL). Rather than channeling public stablecoins, GCUL provides the secure infrastructure banks need to issue and settle tokenized deposits. That brings real-time, 24/7 programmable payments into commercial bank money while satisfying regulators and without disrupting core banking operations.</p><p>For many banks, this is a compelling vision, but adopting new payment technology and integrating it with core banking systems can seem to bank CTOs like a daunting undertaking. That’s particularly true as they face mounting demands for the engineering resources that keep their businesses running while also striving to stay compliant with new regulations. But with a blockchain purpose-built for financial services like GCUL, this is anything but a herculean task.</p><p>Looking to expand its offerings for an increasingly global clientele, Switzerland’s <a href=\"https://www.crypto-finance.com/\" target=\"_blank\">Crypto Finance Group</a> wanted to show it could deploy payment innovations like this in just weeks. That was its inspiration for launching a <a href=\"https://www.crypto-finance.com/crypto-finance-amina-and-incore-bank-complete-second-phase-payment-infrastructure-pilot-on-google-cloud-universal-ledger-for-instant-account-to-account-transfers/\" target=\"_blank\">digital payments infrastructure pilot</a> that enabled instant account-to-account transfers between customers of two Swiss banks on the GCUL network. The pilot, which was designed to operate within one of the world's most demanding financial security frameworks, provided a blueprint for how any commercial bank can build on Google Cloud technology to fundamentally modernize its payment operations.</p><h3><b>Pain points in today's payments landscape</b></h3><p>In recent years, there’s been a marked proliferation of tokenized payment methods. But stablecoins have transformed this previously niche technology, by effectively resolving some of traditional finance’s most enduring pain points, such as weekend transfer blackouts, direct transfers without correspondent banks, and fast settlement rails. Stablecoins also limit the frustrations caused by opaque cross-border transactions, where fragmented compliance checks can leave legitimate payments in extended and unexplained limbo and without a path to clear or timely resolution.</p><p>Still, commercial banks have been reluctant to offer popular reserve-backed stablecoins from permissionless blockchains to their customers despite their retail popularity. That’s because they come with numerous challenges to smooth and secure operations: an uncertain regulatory status, compliance issues around anonymous accounts, <a href=\"https://ethereum.org/gas/\" target=\"_blank\">gas fees</a>, and the scalability limitations of layer 1 blockchain technology. But perhaps banks’ biggest concerns about stablecoins is that they create a problematic economic disconnect — giving customers access to reserve-backed stablecoins reduces reserves and, as <a href=\"https://www.mckinsey.com/industries/financial-services/our-insights/beyond-stablecoins-the-emerging-architecture-of-on-chain-money\" target=\"_blank\">a recent McKinsey study</a> found, banks’ ability to lend.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"swiss-franc-stablecoin-gcul-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/swiss-franc-stablecoin-gcul-1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>As a result, many banks are trying to figure out how to offer their customers the benefits of stablecoins — high speed, low cost, 24/7 availability, and programmability — without introducing problems often associated with existing reserve-backed stablecoins, such as regulatory issues, poor throughput performance, negative influence on bank reserves, and potentially no yield participation.</p><h3><b>Solution proposal</b></h3><p>Realizing this vision means modernized payments architectures must seamlessly and instantly enable individuals and institutions to transfer bank-held assets to accounts at any target bank. Orchestrating this shared ecosystem requires central entities to establish the governing rulebook, enforce issuance limits, and manage network-wide settlement parameters. During its pilot, Crypto Finance assumed this role, which within GCUL is known as the “currency operator.”</p><p>In this position, Crypto Finance can configure the network for either instant or deferred settlement. This choice is analogous to traditional banking: instant settlement acts like real-time gross settlement, where transactions settle individually and immediately and require high liquid reserves. In contrast, deferred settlement operates like netting, where payments are accumulated and offset and only periodically settle the net difference. For the pilot, Crypto Finance chose to adopt deferred settlement, in which GCUL manifests capital efficiency. In this way, clients enjoy instant transfers while banks conserve liquidity through periodic settlement.</p><h3><b>Concept validation</b></h3><p>To demonstrate instant, bi-directional account-to-account transfers on GCUL, Crypto Finance orchestrated a pilot with two digital token issuers, a Swiss digital asset bank, and a Swiss B2B transaction bank. Crypto Finance established the rulebook for interactions between the participant banks, such as interbank settlement, integration with traditional SIC payment rails, and AML/compliance protocols. Although some backend steps still needed manual intervention, Crypto Finance’s pilot proved that fully automated, cross-institution integration is feasible and established a generalized architecture that can scale to virtually any asset class.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"swiss-franc-stablecoin-gcul-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/swiss-franc-stablecoin-gcul-2.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Robustness and performance</b></h3><p>A temporary pilot is one thing; moving into live client transactions carrying legal liability brings a whole new set of operational challenges. Live payment rails are considered critical infrastructure that demands security and availability. GCUL addresses these needs through redundancy between geographically distributed nodes operating on an enterprise-grade consensus model, ensuring reliability. Deploying client workloads on Google Cloud provides that enterprise-grade foundation and allows financial institutions to pair the highly resilient GCUL network with secure-by-design infrastructure, encryption at rest and in transit, and robust access controls that satisfy many of banks’ common regulatory, privacy, and data sovereignty mandates. While some banks may consider integrating their systems with fully public and permissionless blockchains, this approach introduces severe regulatory hurdles, anonymity risks, unpredictable gas fees, and low throughput. These are all roadblocks that in the past would have significantly delayed the pilot or rendered it a non-starter.</p><h3><b>Ease of integration</b></h3><p>The pilot's implementation, with systems integration completed in under three months, was compartmentalized across dedicated Google Cloud projects per participant. The currency operator, Crypto Finance, connected specialized components to a dedicated GCUL API. The first was a role admin service that controls account managers and token managers on the network. Next, it implemented a settlement registry to record when periodic off-ledger settlement between participant banks has occurred once a predefined threshold is reached. Finally, a cloud key management service (KMS) stored the currency operator keys to sign transactions.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"swiss-franc-stablecoin-gcul-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/swiss-franc-stablecoin-gcul-3.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>At the same time, participant banks connected their core banking systems to their own GCUL API instances. But these participant banks don’t need a large Google Cloud footprint. Instead, they can connect to GCUL nodes via Remote Procedure Call from their existing on-premise deployments and manage private key material through solutions other than KMS. Regardless of the setup, transactions are seamlessly routed to the shared global GCUL nodes.</p><p>Whether GCUL is exposed to a bank’s client or used merely as a bank backend is entirely at the integrating institution’s discretion. The banks participating in the pilot chose the latter, utilizing the ledger to upgrade their backend infrastructure. With GCUL under the hood, they improved intra-day transaction performance and provided customers with the user experience they were already accustomed to.</p><h3><b>Regulatory compliance and governance by design</b></h3><p>To join the Swiss Franc currency network on GCUL, participants must have regulatory licenses that let them perform third-party transfers and issue commercial bank money. Crucially, features like token and account management are not rigid network-wide limitations. Instead, they rely entirely on the currency operator and its specific rulebook. This standardizes fees, limits, settlement times, and technical configurations.</p><p>Managing counterparty risk is central to this governance. Rather than relying on unscalable bilateral agreements or complex clearinghouse default waterfalls, GCUL mitigates risk through these currency operator-enforced issuance limits.</p><p>It’s important to distinguish GCUL’s broader feature set from the concrete pilot setup. In the pilot, both participating banks operated with conservative initial limits based on their credit ratings in order to safely prove the architecture. But beyond the pilot, the network frees up capital by periodically netting outstanding obligations, which frees banks from having to fund and settle every transaction.</p><p>Looking ahead, risk management can be further innovated. One clever future enhancement would be to allow participants to dynamically increase their issuance limits by committing digital assets as collateral in segregated accounts, using solutions like Crypto Finance’s <a href=\"https://www.crypto-finance.com/anchornote/\" target=\"_blank\">AnchorNote</a> pledging solution. These assets could then be used to instantly settle outstanding street-side obligations, virtually eliminating counterparty risk without tying up traditional liquidity reserves.</p><h3><b>The future</b></h3><p>While Crypto Finance’s pilot was designed to focus on domestic commercial bank money transfers in Switzerland, GCUL's programmable architecture and high-performance smart contract language, GCULpy, are paving the way for deeper innovation. As institutions like Crypto Finance scale their use of GCUL, the network can expand to support real-time cross-currency settlement, automated foreign exchange, and dynamic collateral management involving tokenized digital assets. And looking further ahead, this infrastructure has laid the groundwork for next-generation financial services that range from point-of-sale payments to autonomous, AI-driven agentic payments.</p><p>The pilot proved that deploying high-performance, blockchain-based payment rails doesn’t mean compromising on strict regulatory compliance or core banking stability. By combining the high-throughput of GCUL with a secure, API-driven integration architecture, commercial banks can offer stablecoin-like speed to their customers while seamlessly preserving their capital efficiency. Ultimately, this compliant-by-design approach targets the operational bottlenecks of traditional finance while mitigating the inherent risks and complexities of public blockchains.</p><p>To learn how your institution can build on this blueprint to fundamentally upgrade your operational payments infrastructure, contact Google Cloud Sales to explore the Google Cloud Universal Ledger.</p><p><i>The team would also like to thank Phil Dettwiler, Andras Miklos, Ignazio Pollina, and Ozan Kizildogan at Crypto Finance and Googlers Chris Esch, Ishan Singh, Olena Clayton, and Stathis Onasoglou for their contributions.</i></p></div>"
  "c5086128bf925c5037ddcf05efbd6866":
    "id": "c5086128bf925c5037ddcf05efbd6866"
    "title": "Google Cloud and NASA: Testing robotic systems for deep space missions"
    "link": "https://cloud.google.com/blog/topics/public-sector/google-cloud-and-nasa-testing-robotic-systems-for-deep-space-missions/"
    "published": "2026-10-27 13:00:00"
    "fetched": "2026-10-27 22:59:09"
    "summary": "<div class=\"block-paragraph\"><p>As NASA advances its <a href=\"https://www.nasa.gov/humans-in-space/artemis/\" target=\"_blank\">Artemis program</a> to send astronauts on increasingly difficult missions to explore more of the Moon, build a sustained human presence there with a Moon Base, and build on their foundation for the first crewed missions to Mars, crew safety and Earth-independent autonomy are paramount. An astronaut on a future deep space mission to Mars could face severe operational challenges—including round-trip communication latencies of up to 44 minutes, making real-time medical guidance for crew nearly impossible.</p><p>Last year, Google Public Sector shared progress on the development of the <a href=\"https://cloud.google.com/blog/topics/public-sector/how-google-and-nasa-are-testing-ai-for-medical-care-in-space?e=48754805\">Crew Medical Officer Digital Assistant (CMO-DA)</a> - an automated Clinical Decision Support System (CDSS) designed to assist astronauts with real-time medical guidance in remote and isolated environments. Today, we are building on this innovation with the development of a proof-of-concept physical, robotic system that aims to support deep space missions and could assist astronauts during NASA missions.</p><h3><b>Optimizing crew time and safety</b></h3><p>The future Moon Base in the lunar South Pole region of the Moon is planned to support sustained human presence. Because every minute in space is a strictly limited resource, reducing the physical burden on astronauts to maximize their time for science and discovery is a top priority. To potentially address this challenge, NASA’s <a href=\"https://www.nasa.gov/hrp/\" target=\"_blank\">Human Research Program</a>, Johnson Space Center Robotics Team, and the Jet Propulsion Laboratory (JPL) collaborated with Google Public Sector to develop a robotic system. By handling routine logistics, this system could free up astronauts to focus on what humans do best: complex science and discovery.</p><p>To maximize its utility for a lean crew, the robotic system is designed as a versatile \"payload\" handler capable of managing cargo, logistics, and equipment. When not needed for routine maintenance like organizing tools or securing compartments, it can pivot to medical support. For example, if an astronaut experiences severe back pain—a potential symptom of kidney stones—the robot could retrieve and prepare an ultrasound machine. This enables the human crew medical officer to focus entirely on analyzing the scan and treating the patient.</p><h3><b>Adapting spatial awareness and vision-language-action models for robotic systems</b></h3><p>Operating safely alongside humans in confined spacecraft is a complex challenge. Unlike factory robots in fixed, human-free environments, space systems utilizing Super Intelligence (SI) require flexible, human-directed tools to safely adapt to close quarters. Because they must also rely on limited sensory input like cameras, JPL is adapting satellite situational awareness intelligence tools—originally designed to track objects in orbit—to help the robotic system navigate and understand its 3D surroundings.</p><p>To test this safely at Johnson Space Center’s iMETRO facility, Google DeepMind’s <a href=\"https://mujoco.org/\" target=\"_blank\">MuJoCo simulator</a> was used, which is an advanced physics engine that allows the SI to practice complex movements in a highly accurate virtual environment before touching real hardware. In a recent proof-of-concept technology demonstration, the robotic system was tasked with a complex \"pick-and-place\" maneuver to locate and move a medical bag. By implementing an \"eye-to-hand\" camera configuration for enhanced spatial awareness, the open-source <a href=\"https://huggingface.co/gimarchetti/clr-experiment-pi0\" target=\"_blank\">Pi0 model</a>—developed by <a href=\"https://cloud.google.com/blog/topics/startups/why-global-startups-are-gathering-at-google-cloud-next25?e=48754805#:~:text=Physical%20Intelligence\">Physical Intelligence on Google Cloud</a> infrastructure— achieved an initial 85% baseline success rate in these early lab environments, providing a strong foundation for the next phase of rigorous training and safety refinement. Because vision-language-action (VLA) models connect language directly to physical movement, astronauts could direct the robotic system flexibly via standard English text prompts.</p><h3><b>Space: the ultimate edge-computing environment</b></h3><p>Processing these complex tasks requires significant computing power, which presents another hurdle: space is the ultimate edge computing environment. Spacecraft cannot rely on continuous connections to Earth-based data centers. To solve this, the Google team harnessed Google Cloud <a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\">G4 instances</a> to rapidly train the underlying models, fine-tuning the 4-billion parameter Pi0 model in just 2.5 hours. Crucially, they demonstrated that the fine-tuned models can then operate locally on compact, energy-efficient edge devices. Over the last two years, the team tested approximately 15 different edge computing devices to find ones that run efficiently on lightweight, low-power hardware required for future Mars missions.</p><h3><b>Pioneering the future of crew safety and space exploration</b></h3><p>Looking ahead, the ultimate goal is to build a robotic system that can execute a variety of tasks via simple voice instructions, under the astronauts’ direct supervision and command. For instance, the robot might be directed to assist with routine health monitoring—such as capturing basic vitals or simple ultrasounds—under the strict guidance of a human crew medical officer. This ensures astronauts receive the physical assistance they might not be able to perform by themselves, without ever replacing human decision-making.</p><p>This collaboration between Google Public Sector and NASA can help pave the way for increasingly difficult missions that push the bounds of scientific discovery.</p><p>Want to learn more about the value of Gemini to your mission? <a href=\"https://cloudonair.withgoogle.com/events/google-public-sector-summit-2026?utm_source=linkedin&amp;utm_medium=paidsocial&amp;utm_campaign=FY26-Q4-northam-PUB10000039-onlineevent-er-ps-summit-on-demand-2026&amp;utm_content=-&amp;utm_term=-\" target=\"_blank\">Register</a> to watch our Google Public Sector Summit on demand or reach out to geminiforgov@google.com for more information.</p></div>\n<div class=\"block-paragraph\"><p><sub>Photo: (Oct. 9, 2026) --- Northrop Grumman’s Cygnus XL cargo spacecraft is pictured in the grip of the Canadarm2 robotic arm moments before its release into Earth orbit after a nearly six‑month stay attached to the International Space Station’s Unity module. The orbital outpost was soaring 263 miles above the Indian Ocean, off the coast of Madagascar, at the time of this photograph. Credit: NASA. Date Created:2026-10-09</sub></p></div>"
  "0d129746255ea724c7a8cd5bf8f318e7":
    "id": "0d129746255ea724c7a8cd5bf8f318e7"
    "title": "Bringing Google TPUs to Oracle Cloud Infrastructure"
    "link": "https://cloud.google.com/blog/products/infrastructure/bringing-google-tpus-to-oracle-cloud-infrastructure/"
    "published": "2026-10-27 23:00:00"
    "fetched": "2026-10-28 04:20:33"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As AI workloads scale across every industry, organizations need compute options that optimize throughput, latency, and unit economics across the AI lifecycle. To meet this demand, Oracle and Google Cloud are partnering to bring Google Tensor Processing Units (TPUs) to Oracle Cloud Infrastructure (OCI), making OCI the first hyperscaler outside Google to offer TPUs. Together, we will deploy TPU capacity on OCI starting in the calendar year 2027.</span></p>\n<h2><span style=\"vertical-align: baseline;\">TPUs: Co-designed from silicon to software</span></h2>\n<p><span style=\"vertical-align: baseline;\">Google built its first TPU more than ten years ago on a clear product thesis: co-designing custom silicon alongside optical networking, power delivery, liquid cooling, and compiler software yields gains in performance per watt and total cost of ownership that isolated components cannot match.</span></p>\n<p><span style=\"vertical-align: baseline;\">TPU v1 delivered 30x the throughput per watt of contemporary processors. Today, TPUs train and serve Gemini across Google's billion-user products, and the eighth-generation TPUs deliver up to 12.6 PFLOPS of native FP4 compute per chip, over 100x TPU v1's 92 TFLOPS at up to 2x the performance per watt of the previous generation. However, raw FLOPS alone do not determine customer economics across training and inference. For training, the governing metric is goodput; the percentage of time a cluster spends doing productive computation. For inference, the governing metrics are latency and cost per token. TPUs address both through system-level co-design.</span></p>\n<p><span style=\"vertical-align: baseline;\">By pairing on-die Inter-Chip Interconnect (ICI) routing with Optical Circuit Switching (OCS), the control plane detects hardware or link degradations and dynamically routes optical paths around faults in real time without job restarts, sustaining over 97% goodput across thousands of chips  on large-scale training runs and high availability for production serving. Increased on-chip SRAM, more HBM capacity, and a new low-diameter interconnect topology that cuts network hops by more than 50% allow the latest generation TPUs to deliver up to 80% better performance per dollar for low-latency serving. </span></p>\n<p><span style=\"vertical-align: baseline;\">This hardware efficiency translates into product velocity when developers can adopt it without friction. Our </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">recent announcements at the PyTorch Conference</span></a><span style=\"vertical-align: baseline;\"> reinforce our commitment to making the Google TPU software ecosystem an open, developer-friendly environment for the PyTorch community. Notably, TorchTPU, our native PyTorch stack for Google TPUs, is now available as open source on GitHub. You can now train, serve, and deploy models on TPUs using the tools you already rely on, including vLLM, SGLang, llm-d, TorchTitan, Ray, TorchRec, Hugging Face, LiteRT.  </span></p>\n<p><span style=\"vertical-align: baseline;\">This portability lets teams assign each workload to the accelerator that delivers the lowest cost per token or fastest time to train, without rewriting model code. And with today’s announcement, they will soon be able to assign those workloads to TPUs on Google Cloud or Oracle infrastructure. </span></p>\n<h2><span style=\"vertical-align: baseline;\">Expanding the AI infrastructure ecosystem with OCI</span></h2>\n<p><span style=\"vertical-align: baseline;\">Even as TPU adoption on Google Cloud grows, the global demand for AI compute exceeds any single cloud provider's footprint.Bringing TPUs to OCI gives customers four distinct benefits:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data centers engineered for AI density:</strong><span style=\"vertical-align: baseline;\"> Google's TPU systems are designed for direct liquid cooling at rack scale, and OCI's next-generation data centers are built for exactly that profile. Oracle delivers flexible, durable capacity that can shift between frontier model training and production inference as customer demand changes. Pairing TPU efficiency with Oracle’s innovative power and cooling approaches, helps bring energy-efficient AI-compute capacity online rapidly, and at global scale.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Secure, high-performance networking with Oracle Acceleron:</strong><span style=\"vertical-align: baseline;\"> While TPUs move chip-to-chip traffic over ICI and OCS, Oracle Acceleron provides the networking foundation that connects TPU capacity to the rest of OCI. Acceleron’s  SmartNIC with hardware-level tenant isolation, High Performance Fabric, and Zero Trust Packet Routing moves data between Oracle databases, storage, and TPU clusters with high throughput and low latency, without taxing host compute and without weakening security boundaries.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Proximity to enterprise data:</strong><span style=\"vertical-align: baseline;\"> Oracle databases are often the system-of-record for enterprise organizations. Offering TPUs directly within OCI lets organizations run fine-tuning and inference next to their existing enterprise data without costly cross-cloud transfers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-architecture choice:</strong><span style=\"vertical-align: baseline;\"> Providing TPUs alongside GPUs inside OCI gives teams the flexibility to assign each AI workload stage to the optimal accelerator for cost and performance.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By bringing Google TPUs to Oracle Cloud Infrastructure, Google Cloud and Oracle are opening up over a decade of purpose-built AI systems engineering to a broader ecosystem of builders. When customers have more choices of purpose-built compute across more clouds, the entire industry builds faster and operates more efficiently. We can’t wait to see what you build.</span></p></div>"
  "379fe88bdd41f09fd0f2bb6f7a730951":
    "id": "379fe88bdd41f09fd0f2bb6f7a730951"
    "title": "Gemini Robotics Embodied Reasoning 2 is now available on Google Cloud"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-robotics-embodied-reasoning-2-is-now-available-on-google-cloud/"
    "published": "2026-10-27 22:00:00"
    "fetched": "2026-10-28 04:20:33"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Earlier this year, we introduced</span><a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Robotics 2</span></a> <span style=\"vertical-align: baseline;\">— our next-generation intelligence layer enabling robots to think, act, and adapt in the physical world. At the core of this breakthrough is </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-2/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Robotics Embodied Reasoning 2</strong></a><strong style=\"vertical-align: baseline;\"> (ER 2)</strong><span style=\"vertical-align: baseline;\">, a specialized Gemini model that serves as a robot’s high-level brain. Working across any robot embodiment — from stationary arms to full humanoids — Gemini Robotics ER 2 combines advanced spatial and temporal video understanding with long-horizon planning and built-in safety guardrails. This enables robots to converse naturally with humans, orchestrate low-level action models and hardware APIs, execute multi-minute tasks involving hundreds of decisions, and collaborate across multi-robot teams.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are bringing this same frontier embodied reasoning model to enterprise production environments: </span><strong style=\"vertical-align: baseline;\">Gemini Robotics ER 2 is now available in public preview on the Gemini platform.</strong><span style=\"vertical-align: baseline;\"> For the first time, organizations can pair Google DeepMind’s latest </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-2/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">embodied reasoning model</span></a><span style=\"vertical-align: baseline;\"> for robotics with the enterprise-grade security, multi-agent orchestration, and end-to-end lifecycle management of Google Cloud — making it easier to simulate, evaluate, and deploy safe, adaptive physical AI at scale.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Powering physical agents for enterprise robotics</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Gemini Robotics ER 2 transforms a robot into a physical agent. The model combines deep spatio-temporal reasoning and long-horizon planning, enabling robots to orchestrate steps to complete a task, self-correct, and generalize to novel situations. To build an agentic setup, developers can declare low-level control interfaces — like Vision-Language-Action (VLA) models or navigation APIs — as tools, and stream multimodal video, audio, or text directly into the model</span><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here is what the model delivers for businesses building and operating robotics:</span></p>\n<h3><strong style=\"vertical-align: baseline;\">1. Physical task verification, understanding, and self-correction</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In physical operations, a robot needs to know whether a step actually succeeded before moving on to the next one. Gemini Robotics ER 2 adapts to new and unfamiliar situations on the fly by reasoning over continuous video feeds. The model:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Classifies task progress into binary status, discrete categories, or continuous scores to improve real-time situational awareness and enable real-time adjustment or iteration on failed steps, without restarting an entire workflow.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Pinpoints the exact video frame where a critical event occurs (such as when to stop pouring a liquid) with 91.3% accuracy and a 0.96-second mean absolute frame distance, running at 4x the execution speed and a fraction of the compute cost of many larger model categories.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">It advances our core spatial reasoning capability, including visual question answering and instrument reading. For example, it can read and interpret values across 10+ instrument categories including circular dials, sight glasses, digital displays, linear scales, rulers, and liquid thermometers directly from visual input.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">2. One intelligence layer across any embodiments</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini Robotics ER 2 orchestrates robots of many shapes and sizes, scaling its intelligence from stationary arms and wheeled rovers to quadrupeds and complex forms. It also unlocks multi-robot collaboration, allowing different types of robots to share a semantic understanding of their workspace, divide labor, and hand off tasks to complete workflows a single machine could not do alone.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">3. Agentic tool orchestration and natural language interaction</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini Robotics ER 2 thinks about what comes next while simultaneously orchestrating  actions. Developers can declare low-level control interfaces — such as VLA models, navigation APIs, or custom functions — as tools across simulation, real-world robot control, or human tele-operation. Gemini Robotics ER 2 can orchestrate navigation and manipulator movement APIs from natural language commands, allowing the robot to explain its approach while performing an action, and letting operators redirect it without using technical language.</span></p>\n<h3><span style=\"vertical-align: baseline;\">4. </span><strong style=\"vertical-align: baseline;\">Build safe, adaptive physical agents in Google Cloud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Developers and enterprise teams use the Gemini platform to simulate, orchestrate, and manage physical agents, which are then deployed to run directly on physical robots at the edge using Google Cloud's scalable infrastructure:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simulate fast: </strong><span style=\"vertical-align: baseline;\"> Test robot behaviors before touching hardware by running simulations in familiar environments like MuJoCo-Warp and NVIDIA Isaac Sim. Then generate synthetic scenarios with multimodal models and auto-label workcell imagery on the Gemini platform.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Train smart</strong><span style=\"vertical-align: baseline;\">: Use Gemini Robotics ER 2's spatial pointing, moment finding, and progress classification to curate and label demonstration videos in Cloud Storage and BigQuery. Then train custom Vision-Language-Action (VLA) models through the Gemini platform, GKE, or Cluster Director.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Operate easily: </strong><span style=\"vertical-align: baseline;\">Deploy Gemini Robotics ER 2 workflows on the Gemini platform with enterprise IAM, security controls, and built-in function calling. Offload latency-sensitive local workloads like SLAM and path planning to factory floors with Google Distributed Cloud, and stream fleet telemetry into BigQuery. Explore the full architecture in </span><a href=\"https://cloud.google.com/solutions/physical-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Physical AI solutions</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">How customers are building with Gemini Robotics ER 2 in Gemini platform</strong></h2>\n<p><em><span style=\"vertical-align: baseline;\">“We’ve seen exponential growth in customers using AIVI-Learning every month, and Gemini Robotics ER 2 brings them even more value. Video changes what an inspection can be. Spot isn’t just checking whether something looks right in a moment in time, the ability to apply AI models to video opens a whole new world of possibilities.” </span></em></p>\n<p><span style=\"vertical-align: baseline;\">Marco da Silva, VP and General Manager of Spot at </span><strong style=\"vertical-align: baseline;\">Boston Dynamics</strong></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">“DeepReach AI is the real-world skills engine for physical AI. Our hardware and AI platform capture how skilled people work all over the world, and turn it into data flywheel for model training. Gemini Robotics ER 2 gives us accurate task understanding of every recording, to help us find data that matters most — faster and at a far greater scale.”  </span></span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Chris Liu, Co-founder and CTO at <strong>DeepReach</strong></span></span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“Advanced reasoning models have the potential to help robots interpret complex environments, plan actions and adapt to changing conditions, opening new possibilities for physical AI. Google’s Gemini Robotics ER 2 model represents an important step in this direction, and we’re excited to be working with Google on exploring how these emerging capabilities can shape the next generation of robotics compute platforms.” </span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Barrie Mullins, Senior Director of Arm Total Design for Physical AI, at <strong>Arm</strong></span></span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“We aim to accelerate materials R&amp;D workflows so our scientists can test more ideas, faster. Most lab automation today relies on rigid scripts for single, isolated tasks. By using Gemini Robotics ER 2, we are giving our robots the visual and physical flexibility to work with our existing infrastructure - whether that’s reading a touchscreen on a legacy microwave reactor that has no API, balancing and loading a centrifuge, or moving samples safely through a busy lab. This is the next level that we aspire to reach. This brings us much closer to self-driving labs that can run full experimental campaigns from synthesis to separation, freeing our researchers to focus on thinking up new ideas for discovering new materials.”</span></p>\n<p><span style=\"vertical-align: baseline;\">Prof. Loh Xian Jun, Executive Director at <strong>ASTAR Institute of Materials Research and Engineering (ASTAR IMRE)</strong> and Executive Director of MARVEL-AI”</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Get started with Gemini Robotics ER 2 in Gemini platform</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Developers and enterprise teams can start building with Gemini Robotics ER 2 today in preview via Model Garden in Gemini platform.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build in Gemini platform:</strong><span style=\"vertical-align: baseline;\"> Visit the</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Robotics ER 2 documentation</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing?e=48754805#gemini-robotics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pricing</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the Developer Guides:</strong><span style=\"vertical-align: baseline;\"> Check out sample code and bidirectional streaming guides in the</span><a href=\"https://ai.google.dev/gemini-api/docs/robotics-overview\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini API Robotics documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read the Research:</strong><span style=\"vertical-align: baseline;\"> Dive into the benchmarks and safety technical report in the</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-2/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google DeepMind Gemini Robotics ER 2 announcement</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore Physical AI on Google Cloud:</strong><span style=\"vertical-align: baseline;\"> Visit</span><a href=\"https://cloud.google.com/solutions/physical-ai\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">cloud.google.com/solutions/physical-ai</span></a><span style=\"vertical-align: baseline;\"> and</span><a href=\"http://cloud.google.com/ai\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">cloud.google.com/ai</span></a><span style=\"vertical-align: baseline;\"> to learn how Google Cloud infrastructure supports simulation, training, and deployment.</span></p>\n</li>\n</ul></div>"
