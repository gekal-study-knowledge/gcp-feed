  "ad6256ba0fa4429c0d6dce9692c9bdb9":
    "id": "ad6256ba0fa4429c0d6dce9692c9bdb9"
    "title": "Scale agents securely with IAM Helper Agent Skills and MCP Tools"
    "link": "https://cloud.google.com/blog/products/identity-security/scale-agents-securely-with-iam-helper-agent-skills-and-mcp-tools/"
    "published": "2026-10-27 01:00:00"
    "fetched": "2026-10-27 01:30:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As organizations adopt autonomous agents to build applications, securing identities and access has become more challenging. Developers relying on agents to provision cloud resources, write Terraform, and deploy microservices at machine-speed only find their CI/CD pipelines blo</span><span style=\"vertical-align: baseline;\">cked even faster as security friction scales. </span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">To help you get ahead of agentic-era Identity and Access Management, today we’re introducing IAM Helper. This suite of intelligent, agent-facing building blocks can automate complex, end-to-end IAM workflows. </span></p>\n<p><span style=\"vertical-align: baseline;\">As an agent-native orchestration and interface layer for Google Cloud IAM, it augments Google Cloud’s core IAM engines — including Policy Intelligence and Privileged Access Manager (PAM) — making IAM skills callable directly by autonomous code assistants, deployment pipelines, and custom agents. Using this functionality reduces the administrative overhead of maintaining least-privilege security and agent governance, while maximizing utility, and accelerating deployment.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">IAM Helper Agent Skills: Fast, secure deployment with automated governance</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Manual troubleshooting of permission blockers creates friction for engineering and administrators, while shortcuts can lead to broad agent over-permissioning that puts least privilege at risk. </span></p>\n<p><span style=\"vertical-align: baseline;\">IAM Helper empowers agents to handle access management dynamically. It shifts the burden of policy evaluation away from human administrators and LLMs, offloading complex orchestration directly to the Google Cloud backend, to maximize token efficiency and prevent costly operational bottlenecks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Rather than operating as isolated utilities, IAM Helper Agent Skills guide agents through the cloud access lifecycle. These end-to-end workflows, helper scripts, and guardrails packaged using the open </span><a href=\"https://agentskills.io/home\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Skills standard</span></a><span style=\"vertical-align: baseline;\"> can orchestrate multiple underlying functions and APIs to resolve complex IAM tasks. They work across common agents (Gemini CLI, Gemini Cloud Assist, ADK, Claude Code, and Cursor). </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Built-in guardrails and real-world impact</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Every IAM Helper agent skill separates read-only discovery from policy changes: Diagnostics and simulations run automatically, while any change to access policies pauses for human-in-the-loop (HITL) confirmation based on customizable risk tiers. To see the value of IAM Helper in practice, consider how it transforms two everyday scenarios:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scaled user-assisted remediation</strong><span style=\"vertical-align: baseline;\">: Suppose a developer's coding agent hits a 403 error while deploying a new application. Rather than filing a support ticket and idling, the agent uses iam-helper-for-troubleshooting to identify the missing Pub/Sub permission in seconds, then uses iam-helper-for-privileged-access-management to request a one-hour JIT grant, eliminating hours of debugging friction.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Autonomous pipeline self-healing</strong><span style=\"vertical-align: baseline;\">: An infrastructure agent encounters a permission block during a routine deployment pipeline. Rather than failing the build, the pipeline uses IAM Helper Agent skills to generate a revised, least-privilege policy, verifies against 90 days of logs via iam-helper-for-policy-simulator that active services won't break, and routes the change to an admin for quick approval.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">IAM Helper Agent Skills are designed for maximum token and cost efficiency, allowing agents to execute multi-step administrative operations autonomously.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Authoring compliant, least-privilege policies</strong><span style=\"vertical-align: baseline;\">: As DevOps engineers translate access requirements into JSON, YAML, or Terraform HCL, iam-helper-for-policy-management generates and validates IAM v1 allow bindings and IAM v2 deny rules. It automatically catches and blocks risky configs before they are applied, including public access (allUsers) and broad basic roles (roles/owner, roles/editor).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unblocking 403 errors in seconds</strong><span style=\"vertical-align: baseline;\">: When an on-call engineer or deployment agent hits a cryptic 403 PERMISSION_DENIED error, iam-helper-for-troubleshooting identifies the exact missing permission or blocking rule in seconds. It adapts to the user’s role: Developers can check if they can unblock themselves locally or generate a structured ticket for their administrator (Requester flow), while security administrators can trace inherited allow and v2 deny rules across organization, folder, and project hierarchies to resolve the issue (Resolver flow).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simulating blast radius before rolling out changes</strong><span style=\"vertical-align: baseline;\">: Before a platform engineer updates a policy or applies IAM Recommender role reductions, they need confidence that active workloads won't break. iam-helper-for-policy-simulator walks the agent through a structured plan, simulate, analyze, and apply flow, testing proposed changes against 90 days of historical access logs to confirm existing traffic won't be disrupted before any update takes effect.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Elevating access just-in-time instead of granting standing privileges</strong><span style=\"vertical-align: baseline;\">: When responders or maintenance agents need temporary production access, iam-helper-for-privileged-access-management manages the lifecycle of on-demand credentials through Privileged Access Manager (PAM). It supports requester, administrator, and approver workflows so elevated access is audited, time-bound, and automatically revoked once the task is done.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">While IAM Helper Agent Skills supply the high-level workflow logic, they are all based on a common set of foundational MCP Tools. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Powered by Google Cloud IAM MCP tools</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud IAM Helper MCP tools provide the backend connection through atomic, read-only functions exposed via Google-managed MCP servers across core IAM endpoints (Policy Troubleshooter, Policy Analyzer, Policy Simulator, and IAM v1/v2 APIs). </span></p>\n<p><span style=\"vertical-align: baseline;\">Rather than requiring teams to write custom API wrappers, MCP tools give agents a standard way to query the cloud backend and get exact answers without parsing verbose policy documents in the prompt, maximizing token efficiency. Agents can dynamically discover and invoke these tools to execute basic operations like checking permissions or listing roles when custom logic is required.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because operations like hierarchy traversal, group expansion, and policy evaluation happen on dedicated IAM endpoints (spanning IAM v1 allow roles, IAM v2 deny, Policy Troubleshooter, and Policy Analyzer), skills run quickly and accurately with minimal token usage. Teams can also use these atomic MCP tools directly when writing their own custom Agent Skills, making it straightforward to combine Google Cloud's IAM capabilities with internal ticketing systems, custom compliance checks, and existing deployment pipelines.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Accelerate your agentic workflows, reduce operational overhead, and bring intelligent, scalable security to your deployment pipelines. Start building with IAM Helper Agent skills today by exploring our </span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Agent Skills Catalog</span></a><span style=\"vertical-align: baseline;\"> and dive deeper with the official </span><a href=\"https://docs.cloud.google.com/iam/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IAM documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "276a82c987054f4429bd102318dcc2e9":
    "id": "276a82c987054f4429bd102318dcc2e9"
    "title": "Unifying enterprise context and semantics: LookML in Knowledge Catalog is now GA"
    "link": "https://cloud.google.com/blog/products/business-intelligence/lookml-metadata-indexing-in-knowledge-catalog-is-now-ga/"
    "published": "2026-10-27 01:00:00"
    "fetched": "2026-10-27 01:30:29"
    "summary": "<div class=\"block-paragraph\"><p>As enterprises go from experimental AI agent prototypes to using them in production, data teams are realizing that <i>access</i> to data is not the same as <i>understanding</i> that data. To help bridge that gap, today, we are announcing the general availability (GA) of LookML semantic language indexing in Knowledge Catalog for <a href=\"https://cloud.google.com/looker\">Looker Core on Google Cloud</a>.</p><p>To answer a complex business question accurately, an AI agent needs context — table schemas, data lineage, governance policies, business definitions, etc.. However, context is not a monolith; knowing where data lives is very different from knowing how to calculate metrics with it. In the enterprise, teams often conflate broad organizational context (usually in the form of metadata from structured and unstructured documents) with deterministic business semantics (the exact SQL formulas, join paths, and filtering rules that define metrics like net revenue or churn), assuming that a single data catalog or a business intelligence (BI) tool handling both enterprise-wide asset discovery and precise metric calculation.</p><p>In reality, no one tool can carry the entire load for agentic AI, as enterprise agents require both organizational context and deterministic business semantics. In Google Cloud environments, those are provided by Knowledge Catalog and LookML:</p><ul><li><b>Broad enterprise context with Knowledge Catalog:</b> Agents need a unified context graph that aggregates metadata across structured tables and unstructured documents. Through Knowledge Catalog, agents discover assets, inspect data quality, trace end-to-end lineage, respect column-level privacy tags, and surface corporate policy documents. The context graph tells an agent what data exists, how it is governed, and how it is connected.</li><li><b>Deterministic mathematical semantics with LookML:</b> What a catalog does not author on its own is how the numbers are computed. Describing a table is not the same as defining how tables join or how metrics are calculated. Looker's modeling language, LookML, encodes production-tested semantic logic — multi-grain join protections, conditional filters, and exact KPI formulas — so agents don't guess SQL math at runtime.</li></ul><p>With this native integration, the LookML business logic that powers your trusted BI reporting is automatically indexed into Knowledge Catalog — giving Gemini Enterprise and custom AI agents both enterprise-wide discovery and deterministic BI semantics.</p><h3><b>Why a context graph needs deterministic semantics</b></h3><p>When an LLM agent connects directly to raw database tables — even when armed with basic table descriptions or a business glossary — it still has to infer mathematical relationships on the fly. Without explicit semantic rules, agents routinely fall into two traps:</p><ol><li><b>Metric definition drift:</b> Standard text-to-SQL agents can invent conflicting formulas for foundational KPIs like net revenue or customer acquisition cost, failing to apply domain-specific accounting rules (such as recognizing revenue only when <i>order_status = 'Complete'</i> or prorating annual contracts across active service days).</li><li><b>Naive join fan-outs:</b> Complex schemas often contain one-to-many (1:N) and zero-to-many (0:N) relationships across invoices, line items, and refunds. Without pre-modeled join relationships and symmetric aggregation rules, agent-generated SQL can multiply rows and inflate financial totals.</li></ol><p>Knowledge Catalog and Looker solve this together, enabling you to model once in LookML and access those semantics everywhere across Google Cloud's AI ecosystem. Knowledge Catalog enforces semantic math when that logic is defined in a semantic modeling tool; LookML provides a mature, production-proven language for defining those exact mathematical relationships.</p><h3><b>What's new: LookML in Knowledge Catalog</b></h3><p>Previously, catalog integrations only captured shallow, file-level pointers and basic dashboard inventories. With this release, LookML's deterministic semantics become a first-class layer in the Knowledge Catalog context graph. An agent that finds a metric in the graph now also finds its exact definition, its join path, and its lineage back to source tables — in the same place, under the same governance. Synchronization is always on by default with no action required from end users, and with live sync, any update pushed to production LookML is reflected in Knowledge Catalog in near-real-time so agents operate on the freshest business logic.</p><p>Because this metadata is indexed directly into Knowledge Catalog by default, it is <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-knowledge-catalog#configure-knowledge-catalog\">immediately available to Gemini Enterprise</a>, without custom agent code or separate catalog data stores. When connected to Knowledge Catalog, Gemini Enterprise uses built-in read-only skills and hybrid search to look up technical schemas, business glossaries, and indexed LookML logic in a single step, passing that rich context directly to your federated BigQuery connector to generate accurate SQL. (For developers building custom agents, the same context bundles are also accessible via the LookupContext API.)</p><p>Knowledge Catalog now captures and links the following entity levels across Looker Core on Google Cloud:</p><ul><li><b>LookML models (looker-model):</b> Captures descriptive metadata, database connection routing, include hierarchies, data validation tests (assert), and parent-child EntryLinks mapping models to their associated Explores, Views, and LookML dashboards.</li><li><b>LookML Explores (looker-explore):</b> Indexes full relational join logic (type, sql_on, relationship cardinality such as many_to_one fan-out protection, foreign_key, required_joins, and sql_where) as Schema-Join relationships. It also captures mandatory filter guardrails (always_filter, access_filter), inherited dimensions and measures, and predefined <b>starter queries</b> that help agents and analysts overcome the cold-start problem.</li><li><b>LookML Views and fields (looker-view):</b> Extracts column-level compiled LookML SQL expressions (for example, ${total_revenue} / NULLIF(${count}, 0)), primary keys, dimension group timeframes, field synonyms, and derived table transformation logic (including SQL and native derived tables, partition keys, and cluster keys).</li><li><b>Dashboards, Looks, and tiles (looker-dashboard, looker-dashboard-element, looker-look):</b> Catalogs both UI-created and LookML-defined dashboards and visualization tiles, complete with dashboard filters, chart types, ownership, and usage statistics. Users in Knowledge Catalog are able to see table- and column-level lineage from underlying BigQuery tables all the way to individual dashboard tiles, allowing data engineers to evaluate schema changes proactively, before disruptions occur.</li></ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - LookML Indexing in Knowledge Catalog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_-_LookML_Indexing_in_Knowledge_Catalog.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Looker Core on Google Cloud automatically indexes resolved LookML models, Explores, Views, lineage, and dashboards directly into Knowledge Catalog.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Three patterns for data agents</b></h3><p>Bringing LookML into Knowledge Catalog gives Gemini Enterprise (and your broader agent ecosystem) a single place to retrieve both broad organizational context and governance from Knowledge Catalog and explicit mathematical relationships and SQL definitions authored in LookML.</p><p>To see the impact of combining these two layers in Gemini Enterprise, compare how three architectures handle a complex cross-domain prompt: <i>\"What was our total revenue last fiscal quarter by product category, and which regional promotional policy limits apply?\"</i></p></div>\n<div class=\"block-paragraph_advanced\"><div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table border=\"1\" style=\"border-collapse: collapse; width: 100%; height: 1104px;\">\n<tbody>\n<tr style=\"height: 86.766px;\">\n<td style=\"width: 15.4264%; height: 86.766px;\"><strong style=\"vertical-align: baseline;\">Agent architecture</strong></td>\n<td style=\"width: 27.9723%; height: 86.766px;\"><strong style=\"vertical-align: baseline;\">System mechanics</strong></td>\n<td style=\"width: 27.5817%; height: 86.766px;\"><strong style=\"vertical-align: baseline;\">Data logic and governance resolution</strong></td>\n<td style=\"width: 28.8889%; height: 86.766px;\"><strong style=\"vertical-align: baseline;\">User experience and token efficiency</strong></td>\n</tr>\n<tr style=\"height: 316.688px;\">\n<td style=\"width: 15.4264%; height: 316.688px;\">\n<p><strong style=\"vertical-align: baseline;\">Pattern 1: Baseline database agent</strong></p>\n<p><strong style=\"vertical-align: baseline;\">Data warehouse only</strong></p>\n</td>\n<td style=\"width: 27.9723%; height: 316.688px;\"><span style=\"vertical-align: baseline;\">Direct LLM writing raw SQL against warehouse tables with no semantic or catalog context.</span></td>\n<td style=\"width: 27.5817%; height: 316.688px;\">\n<p><span style=\"vertical-align: baseline;\">Ungoverned and non-deterministic</span></p>\n<p><span style=\"vertical-align: baseline;\">Has no visibility into data quality, PII tags, or corporate documents, and guesses SQL metric logic blindly — assuming a standard January fiscal calendar, summing uncompleted orders, and exposing restricted customer PII.</span></p>\n</td>\n<td style=\"width: 28.8889%; height: 316.688px;\">\n<p><span style=\"vertical-align: baseline;\">Fragile and high-risk</span></p>\n<p><span style=\"vertical-align: baseline;\">Prone to schema hallucinations, fails on questions requiring unstructured policy context, and burns tokens in multi-turn SQL debugging loops.</span></p>\n</td>\n</tr>\n<tr style=\"height: 361.469px;\">\n<td style=\"width: 15.4264%; height: 361.469px;\">\n<p><strong style=\"vertical-align: baseline;\">Pattern 2: Context-grounded agent</strong></p>\n<p><strong style=\"vertical-align: baseline;\">Knowledge Catalog without indexed semantics</strong></p>\n</td>\n<td style=\"width: 27.9723%; height: 361.469px;\"><span style=\"vertical-align: baseline;\">Gemini Enterprise or another agent platform uses Knowledge Catalog to look up table descriptions, glossary terms, PII governance aspects, and unstructured policy PDFs, then writes SQL via the warehouse connector.</span></td>\n<td style=\"width: 27.5817%; height: 361.469px;\">\n<p><span style=\"vertical-align: baseline;\">Context-grounded, but lacks semantic SQL logic </span></p>\n<p><span style=\"vertical-align: baseline;\">Enforces Knowledge Catalog governance and retrieves unstructured promotional policy rules, but lacks semantic definitions for SQL metrics and table relationships. This approach can miss conditional accounting rules (like order_status = 'Complete') or cause join fan-outs across multi-grain tables.</span></p>\n</td>\n<td style=\"width: 28.8889%; height: 361.469px;\">\n<p><span style=\"vertical-align: baseline;\">Governed discovery, inconsistent math</span></p>\n<p><span style=\"vertical-align: baseline;\">Solves asset discovery, compliance, and unstructured context, but still suffers from text-to-SQL calculation drift and multi-turn SQL retries.</span></p>\n</td>\n</tr>\n<tr style=\"height: 339.078px;\">\n<td style=\"width: 15.4264%; height: 339.078px;\">\n<p><strong style=\"vertical-align: baseline;\">Pattern 3: Context + semantic-grounded agent</strong></p>\n<p><strong style=\"vertical-align: baseline;\">Knowledge Catalog + Looker Core on Google Cloud with indexed LookML</strong></p>\n</td>\n<td style=\"width: 27.9723%; height: 339.078px;\"><span style=\"vertical-align: baseline;\">Gemini Enterprise or another agent platform connects to Knowledge Catalog enriched with indexed LookML metadata, automatically retrieving both broad catalog context and LookML join paths and field formulas to ground its SQL generation.</span></td>\n<td style=\"width: 27.5817%; height: 339.078px;\">\n<p><span style=\"vertical-align: baseline;\">Governed context plus semantic SQL definitions</span></p>\n<p><span style=\"vertical-align: baseline;\">Enforces Knowledge Catalog PII aspects, retrieves unstructured policy PDFs, and grounds its SQL in LookML's exact mathematical definitions indexed in Knowledge Catalog, applying status = 'Complete', the May–July fiscal calendar, and predefined join conditions across warehouse tables.</span></p>\n</td>\n<td style=\"width: 28.8889%; height: 339.078px;\">\n<p><span style=\"vertical-align: baseline;\">Accurate and token-efficient: </span></p>\n<p><span style=\"vertical-align: baseline;\">Pre-mapped LookML join blueprints and compiled SQL expressions replace guessing, prevent join fan-outs, reduce SQL retry loops, and let the agent point users to relevant Looker dashboards and Explores.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph\"><p>When you follow pattern 3 and pair Knowledge Catalog with Looker's semantic layer in an enterprise agent workflow, the agent moves from guessing at raw SQL to a governed, two-stage execution flow:</p><ol><li><b>Context and governance discovery in Knowledge Catalog:</b> Before touching any data, the agent searches Knowledge Catalog, verifies that the thelook_ecommerce LookML model is gold-certified, checks column-level governance tags, and maps the prompt to exact LookML dimensions and measures, converting natural language into structured business intent.</li><li><b>Deterministic semantic execution:</b> Rather than having the LLM invent SQL on the fly, the agent grounds its SQL in LookML's exact mathematical definitions indexed in Knowledge Catalog and returns trusted, repeatable figures.</li></ol><p>Alongside the answer, the agent returns an interactive <i>Open in Looker Explore</i> link with the exact measures and filters pre-populated, letting users slice, dice, and inspect row-level line items in a single click.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Updated Image with Side By Side\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_-_Updated_Image_with_Side_By_Side.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Side-by-side comparison of a baseline agent querying BigQuery directly (left), which guesses at raw SQL and fiscal dates, versus an agent governed by Knowledge Catalog and Looker (right), which applies indexed LookML definitions and returns an interactive \"Open in Looker Explore\" link.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Scaling agents for BI and the enterprise</b></h3><p>A common question from data leaders is: <i>\"If we use Looker Conversational Analytics, when do we use an enterprise agent grounded in Knowledge Catalog?\"</i></p><p>The two experiences are designed for complementary jobs across your organization:</p><ul><li><b>Looker Conversational Analytics is your dedicated BI assistant:</b> When business users are working inside BI workflows and asking questions scoped to a focused set of curated Looker Explores, Conversational Analytics delivers immediate, self-service data exploration and visualization directly within Looker.</li><li><b>Knowledge Catalog + Looker powers your enterprise-wide agents:</b> When users ask questions in Gemini Enterprise across federated Data Cloud sources like BigQuery, they often span structured tables, BI metrics, and unstructured documents. Enabling Knowledge Catalog in Gemini Enterprise gives the assistant built-in skills to dynamically discover relevant semantics across hundreds of LookML models, pass indexed LookML join definitions, metric SQL formulas, and starter queries to the BigQuery connector to prevent join hallucinations, and enforce centralized governance aspects and IAM.</li></ul><h3><b>Getting started</b></h3><p>Because Looker Core on Google Cloud, Knowledge Catalog, and Gemini Enterprise are natively integrated, you can connect your existing LookML business logic to your enterprise AI assistant in just a few clicks, with no custom agent code required.</p><p>To start discovering Looker semantics and grounding your agents:</p><ol><li><b>Confirm first-party metadata indexing is enabled for Looker Core on Google Cloud.</b> This is enabled by default for new instances, with no additional charge for storing Looker technical metadata. Once enabled, metadata synchronization into Knowledge Catalog is always on by default (across both initial indexing and ongoing live updates). Enable the Cloud Dataplex API and Data Lineage API in your project and grant users the required view roles (roles/dataplex.viewer, roles/looker.schemaViewer, and roles/datalineage.viewer) to have your resolved LookML models, Explores, Views, join paths, and dashboards automatically sync into Knowledge Catalog.</li><li><b>Enable Knowledge Catalog in Gemini Enterprise</b>. When you attach a BigQuery (or Spanner, Cloud SQL, or AlloyDB) data store in federated query mode to your Gemini Enterprise app, the Knowledge Catalog integration is enabled automatically. You can also turn it on or off at any time in the Google Cloud console by opening your Gemini Enterprise app, navigating to Configurations &gt; Assistant, toggling on Enable Knowledge Catalog, and clicking Save and publish.</li><li><b>Ask questions</b>. Gemini Enterprise connects to Knowledge Catalog using end-user credentials, meaning users only discover and query data assets they have IAM permission to view (such as roles/bigquery.dataViewer). Behind the scenes, the assistant automatically looks up your indexed LookML definitions, join logic, and starter queries in Knowledge Catalog and passes them to your federated connector to deliver accurate, governed answers.</li></ol><p>To dive deeper, read the <a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/manage-looker-core-metadata\">Manage Looker Core on Google Cloud with Knowledge Catalog documentation</a> and learn how to <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-knowledge-catalog#configure-knowledge-catalog\">Connect to Knowledge Catalog in Gemini Enterprise</a>. To build a more customized experience, explore our <a href=\"https://github.com/haengeunc/kc-looker-codelab\" target=\"_blank\">hands-on ADK agent codelab on GitHub</a>.</p></div>"
