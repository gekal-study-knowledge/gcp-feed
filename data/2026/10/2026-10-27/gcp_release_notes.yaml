    "title": "October 27, 2026"
    "link": "https://docs.cloud.google.com/release-notes#October_27_2026"
    "published": "2026-10-27 16:00:00"
    "fetched": "2026-10-28 04:20:30"
    "summary": "<h2 class=\"release-note-product-title\">AlloyDB for PostgreSQL</h2>\n<h3>Announcement</h3>\n<p>The following AlloyDB AI functions and improvements are available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>:</p>\n<ul>\n<li><p>The <code>ai.extract</code> function lets you extract structured data from\nunstructured text directly within your database queries without needing\nexternal extraction pipelines. For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/extract-structured-data\">Extract structured data</a>.</p></li>\n<li><p>The <code>ai.classify</code> function lets you categorize unstructured text into\npredefined labels directly within your database queries. For more\ninformation, see <a href=\"https://docs.cloud.google.com/alloydb/docs/ai/classify-text\">Classify text</a>.</p></li>\n<li><p>Parameter names and signatures for AI query engine functions\n(<code>ai.analyze_sentiment</code>, <code>ai.summarize</code>, and <code>ai.agg_summarize</code>) are\nupdated. For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/reference/model-endpoint\">Model endpoint reference</a>.</p>\n<ul>\n<li><p>The <code>prompt</code> and <code>prompts</code> parameters are renamed to <code>input</code> and\n<code>inputs</code> in scalar and batch functions respectively.</p></li>\n<li><p>An optional <code>additional_instructions</code> parameter is added to\n<code>ai.summarize</code> and <code>ai.agg_summarize</code> to provide custom instructions to\nguide summary formatting, length, and tone.</p></li>\n<li><p>In cursor-based versions of <code>ai.analyze_sentiment</code> and <code>ai.summarize</code>,\nthe <code>prompt</code> parameter is removed.</p></li>\n<li><p><code>ai.agg_summarize</code> supports multiple positional signatures, including\npassing optional additional instructions and specifying model IDs.</p></li>\n</ul></li>\n</ul>\n<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>The <a href=\"https://docs.cloud.google.com/gemini/data-agents/data-engineering-agent/agent-overview#google-drive-integration\">Data Engineering Agent now integrates with Google\nDrive</a>,\nletting you provide Google Sheets files, CSV, or JSONL files as input for\nyour data engineering pipelines.</p>\n<p>This feature is <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a> (GA).</p>\n<h2 class=\"release-note-product-title\">Cloud DNS</h2>\n<h3>Announcement</h3>\n<p>Starting January 5, 2027, CNAME chasing behavior will change so that Cloud DNS\nfollows CNAME chains between public and private zones. If your private zones or\nresponse policies have overlapping domain names with public CNAME targets,\nqueries might resolve to unintended internal IP addresses or return resolution\nerrors.</p>\n<p>The following table outlines the current and updated behaviors.</p>\n<table>\n<thead>\n<tr>\n<th>Source of CNAME answer</th>\n<th>Current behavior (until January 5, 2027)</th>\n<th>New behavior (starting January 5, 2027)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cloud DNS public zone</td>\n<td>Subsequent queries search only public DNS zones and internal DNS. Private\nzones, forwarding zones, and response policies are ignored.</td>\n<td>Subsequent queries follow the complete VPC name resolution\norder: response policies, private zones, forwarding or peering zones, internal\nDNS, and public zones.</td>\n</tr>\n<tr>\n<td>Cloud DNS private zone</td>\n<td>Subsequent queries search only authorized private zones. Public DNS zones are ignored.</td>\n<td>Subsequent queries follow the complete VPC name resolution\norder. If the target isn't found in authorized private zones, Cloud DNS\nqueries public DNS zones.</td>\n</tr>\n<tr>\n<td>Cloud DNS response policy zone</td>\n<td>Cloud DNS systems don't perform queries for CNAME answers received\nfrom response policy local data rules.</td>\n<td>Subsequent queries follow the complete VPC name resolution\norder. If the target isn't found in response policies or private zones,\nCloud DNS queries public DNS zones.</td>\n</tr>\n</tbody>\n</table>\n<p>Review your CNAME chasing needs before January 5, 2027. Test your DNS query paths\nusing <code>dig</code> or <code>nslookup</code> to identify CNAME chasing scenarios.</p>\n<ul>\n<li><strong>Look for private-to-public CNAME chasing scenarios</strong>: Look for CNAME answers\nfrom response policies or private zones that don't match any response policy\nor record in a private zone. Previously, these queries resulted in a <code>NXDOMAIN</code>\nanswer but after January 5, 2027, these scenarios might match a record in a\npublic zone or continue to be <code>NXDOMAIN</code> responses.</li>\n<li><strong>Look for public-to-private CNAME chasing scenarios</strong>: Look for CNAME answers\nfrom public zones that don't match any record in a public zone. Previously,\nthese CNAME chasing scenarios would have resulted in a <code>NXDOMAIN</code> response.\nAfter January 5, 2027, these scenarios might match a response policy or record\nin a private zone or continue to be <code>NXDOMAIN</code> responses if the private zone\ndoesn't have the record.</li>\n<li><strong>For CNAME chasing scenarios under your control</strong>: As best practice, configure\nmatching time-to-live (TTL) values for all records in the CNAME chain.</li>\n</ul>\n<h3>Announcement</h3>\n<p>Starting January 5, 2027, Cloud DNS will disable full responses to DNS queries of\ntype <code>ANY</code> (<code>QTYPE=ANY</code>) in <a href=\"https://docs.cloud.google.com/dns/docs/zones/zones-overview\">public authoritative zones</a>.\nInstead, a single resource record will return for <code>ANY</code> queries, chosen from the\nexisting resource record sets that match the query.</p>\n<p>Standard traffic from web browsers, applications, and API traffic query specific\nrecord types directly and are therefore unaffected with no action required.</p>\n<p>However, certain legacy scripts, automated health checkers, debugging commands\n(for example, <code>dig example.com ANY</code>), or custom third-party monitoring systems\nthat explicitly query <code>ANY</code> records will receive the first available record\ninstead of a full zone inventory. You must complete the following configuration\nupdates before January 5, 2027:</p>\n<ul>\n<li><strong>Identify legacy queries</strong>: Review internal tools, deployment scripts, or\nthird-party DNS monitoring configurations for commands or API calls that\nrequest the <code>ANY</code> record type. Cloud DNS logs in Cloud Logging can be helpful\nwith this.</li>\n<li><strong>Transition to specific queries</strong>: Update the tools to query the specific,\nindividual record types they require (for example, querying for <code>A</code>,\n<code>AAAA</code>, <code>MX</code>, or <code>TXT</code> records separately).</li>\n<li><strong>Retrieve full zone records</strong>: If you use <code>ANY</code> queries to retrieve all records\nin a zone, use the Cloud DNS REST API (<code>resourceRecordSets.list</code>), the gcloud\nCLI (<code>gcloud dns record-sets list</code>), or the Google Cloud Console instead.</li>\n</ul>\n<p>Risks associated with not making these changes include the following:</p>\n<ul>\n<li><strong>False monitoring alarms</strong>: Automated uptime or DNS monitoring tools checking\n<code>ANY</code> responses may misinterpret the new response as a system failure and\ntrigger false alerts.</li>\n<li><strong>Broken automation pipelines</strong>: Internal deployment or CI/CD scripts that\nrely on parsing a full zone dump with an <code>ANY</code> query will fail to retrieve the\nexpected data payload and may crash.</li>\n<li><strong>Disrupted IT diagnostics</strong>: Network administrators running manual legacy\ntroubleshooting commands will no longer see a quick summary of all domain\nrecords, which could delay active network incident diagnostics.</li>\n</ul>\n<h2 class=\"release-note-product-title\">Cloud SDK</h2>\n<h3>Breaking</h3>\n<h2 id=\"59100_2026-10-27\">591.0.0 (2026-10-27)</h2>\n<h3 id=\"breaking_changes\">Breaking Changes</h3>\n<ul>\n<li><strong>(Google Cloud CLI)</strong> Fixed issue where <code>gcloud components update</code> on macOS was stuck and would exit\nimmediately after printing \"WARNING: Known issue encountered updating Python\nmodules\", preventing updates to the latest release.\n<ul>\n<li>However, because this issue is present in the 590.0.0 and 590.0.1 releases,\nexisting installations currently at those versions still contain the bug,\nand affected users will need to perform a one-time workaround to become\nunstuck.</li>\n<li>This can be achieved by running:\n<code>gcloud components --flags-file=&lt;(echo 'update:')</code></li>\n<li>Users updating from version &lt;=589.0.0 or &gt;=591.0.0 are unaffected and can\nrun <code>gcloud components update</code> as normal; the workaround is only needed for\ninstallations currently stuck at version 590.0.0 or 590.0.1.</li>\n<li>This issue can be tracked at\n<a href=\"https://issuetracker.google.com/issues/578071727\">https://issuetracker.google.com/issues/578071727</a>.</li>\n</ul></li>\n</ul>\n<h3 id=\"google_cloud_cli\">Google Cloud CLI</h3>\n<ul>\n<li>Updated bundled Python to 3.14.9.</li>\n</ul>\n<h3 id=\"agent_registry\">Agent Registry</h3>\n<ul>\n<li>Promoted <code>gcloud agent-registry skills</code>, <code>gcloud agent-registry skills revisions</code>, <code>gcloud agent-registry publishers</code>, and <code>gcloud agent-registry findings</code> command groups to GA.</li>\n</ul>\n<h3 id=\"app_engine\">App Engine</h3>\n<ul>\n<li>Updated <code>gcloud beta app migrate-to-run</code> to mask environment variable\nvalues in the printed <code>service.yaml</code>. The saved <code>service.yaml</code> file keeps\nthe original values.</li>\n</ul>\n<h3 id=\"audit_manager\">Audit Manager</h3>\n<ul>\n<li>Added <code>gcloud audit-manager audit-schedules describe</code> command to describe an audit schedule.</li>\n</ul>\n<h3 id=\"beyondcorp\">Beyondcorp</h3>\n<ul>\n<li>Added <code>--dispatch-info-output-type</code> flag to\n<code>gcloud beyondcorp security-gateways create</code> and\n<code>gcloud beyondcorp security-gateways update</code>, and upstream\n<code>dispatchInfo</code> configuration to\n<code>gcloud beyondcorp security-gateways applications create</code> and\n<code>gcloud beyondcorp security-gateways applications update</code>\nto configure delegated dispatch info headers.</li>\n</ul>\n<h3 id=\"bigquery\">BigQuery</h3>\n<ul>\n<li>Updated the bundled <code>certifi</code> package to version <code>2026.10.19</code> and removed\nthe distrusted <code>AAA Certificate Services</code> root certificate from bundled\n<code>httplib2</code>.</li>\n</ul>\n<h3 id=\"cloud_bigtable\">Cloud Bigtable</h3>\n<ul>\n<li>Added <code>--timestamp-granularity</code> flag to <code>gcloud bigtable instances tables\ncreate</code> and <code>gcloud bigtable tables create</code> to configure table timestamp\ngranularity (<code>millis</code> or <code>micros</code>). Microsecond granularity is supported\nonly on Enterprise Plus instances.</li>\n<li>Rebuild with 1.26.9 for CVE-2026-94439.</li>\n</ul>\n<h3 id=\"cloud_dns\">Cloud DNS</h3>\n<ul>\n<li>Updated <code>gcloud beta dns outbound-endpoints create</code> to make <code>--endpoint-ip</code> flag optional.</li>\n</ul>\n<h3 id=\"cloud_dataproc\">Cloud Dataproc</h3>\n<ul>\n<li>Promoted <code>--master-flexible-config</code>, <code>--worker-flexible-config</code>, and\n<code>--secondary-worker-flexible-config</code> flags to GA for <code>gcloud dataproc\nclusters create</code> and <code>gcloud dataproc workflow-templates\nset-managed-cluster</code>.</li>\n<li>Promoted <code>--worker-flexible-config</code> and <code>--secondary-worker-flexible-config</code>\nflags to GA for <code>gcloud dataproc clusters update</code>.</li>\n</ul>\n<h3 id=\"cloud_iam\">Cloud IAM</h3>\n<ul>\n<li>Added <code>--discovery-uri</code> flag to <code>gcloud iam workload-identity-pools\nproviders create-oidc</code> and <code>gcloud iam workload-identity-pools providers\nupdate-oidc</code> to specify a custom OIDC discovery URI when the identity\nprovider does not use the default well-known path.</li>\n<li>Added <code>--actor-providers</code> flag to <code>gcloud iam workload-identity-pools\nproviders create-oidc</code> and <code>gcloud iam workload-identity-pools providers\nupdate-oidc</code> to authorize providers in the same pool to issue actor tokens\nfor identity delegation.</li>\n</ul>\n<h3 id=\"cloud_memorystore\">Cloud Memorystore</h3>\n<ul>\n<li>Promote <code>gcloud redis clusters</code> basic auth feature related commands to GA track.</li>\n</ul>\n<h3 id=\"cloud_spanner_emulator\">Cloud Spanner Emulator</h3>\n<ul>\n<li>Updated cloud spanner emulator to v1.5.59.</li>\n</ul>\n<h3 id=\"cloud_storage\">Cloud Storage</h3>\n<ul>\n<li>Added <code>--labels</code> and <code>--labels-file</code> flags to <code>gcloud storage buckets\ncreate</code>.</li>\n</ul>\n<h3 id=\"compute_engine\">Compute Engine</h3>\n<ul>\n<li>Promoted <code>--identity-type</code> flag to the beta and GA tracks for <code>gcloud compute instances create</code>, <code>gcloud compute instances update</code>, and <code>gcloud compute instance-templates create</code>.</li>\n<li>Added circuit breakers flags (<code>--circuit-breakers-max-connections</code>,\n<code>--circuit-breakers-max-pending-requests</code>,\n<code>--circuit-breakers-max-requests</code>,\n<code>--circuit-breakers-max-requests-per-connection</code>,\n<code>--circuit-breakers-max-retries</code>) to <code>gcloud compute backend-services\ncreate</code> and <code>update</code> commands, and <code>--no-circuit-breakers</code> to the <code>update</code>\ncommand.</li>\n<li>Added colorization for <code>ACTION</code>, <code>HEALTH_STATE</code>, and <code>STATUS</code> columns to\n<code>gcloud compute instance-groups managed list-instances</code> in beta and GA.</li>\n<li>Added <code>--circuit-breakers-connect-timeout</code> flag to <code>gcloud compute\nbackend-services create</code> and <code>update</code> commands in beta.</li>\n<li>Added <code>--allowed-actions</code> flag to <code>gcloud beta compute instance-groups\nmanaged update-instances</code> to specify allowed actions (including\n<code>restart-in-place</code>) when updating instances in a managed instance group.</li>\n<li>Added <code>--update-policy-allowed-actions</code> flag to <code>gcloud beta compute\ninstance-groups managed create</code> and <code>gcloud beta compute instance-groups\nmanaged update</code> to specify allowed actions (including <code>restart-in-place</code>) in\na managed instance group's update policy.</li>\n</ul>\n<h3 id=\"database_migration\">Database Migration</h3>\n<ul>\n<li>Added <code>--ai-processing-location</code> flag to\n<code>gcloud database-migration conversion-workspaces create|update</code> to set\nthe location where Gemini features process conversion workspace data. Pass an\nempty value to remove a previously set location.</li>\n</ul>\n<h3 id=\"gke_hub\">GKE Hub</h3>\n<ul>\n<li>Promoted <code>--prioritized</code> flag on\n<code>gcloud container fleet|hub rolloutsequences upgrade</code> command to <code>GA</code>.</li>\n<li>Promoted <code>gcloud container fleet|hub config-management update</code> command to\n<code>GA</code>.</li>\n</ul>\n<h3 id=\"kubernetes_engine\">Kubernetes Engine</h3>\n<ul>\n<li>Added flag <code>--node-config-update-mode</code> to\n<code>gcloud container node-pools update</code> to trigger live update on nodes.\nSupported values are <code>LIVE_UPDATE_WITHOUT_DRAIN</code>.</li>\n</ul>\n<h3 id=\"network_connectivity\">Network Connectivity</h3>\n<ul>\n<li>Added <code>--group</code> flag to <code>gcloud beta network-connectivity transports create</code>\nto specify the group of the Network Connectivity Center hub that the spokes\ncreated for this transport should be attached to.</li>\n</ul>\n<h3 id=\"network_security\">Network Security</h3>\n<ul>\n<li>Promoted <code>add-override</code>, <code>update-override</code>, <code>delete-override</code>,\n<code>add-inline-ml-exception</code> and <code>delete-inline-ml-exception</code> commands of\n<code>gcloud network-security security-profiles wildfire-analysis</code> to GA.</li>\n<li>Promoted WildFire-related flags in\n<code>gcloud network-security firewall-endpoints create</code> and\n<code>gcloud network-security firewall-endpoints update</code> commands to GA.</li>\n<li>Promoted <code>gcloud network-security server-tls-policies create</code> to GA.</li>\n<li>Promoted <code>gcloud network-security server-tls-policies update</code> to GA.</li>\n<li>Added <code>--wildfire-analysis-profile-project</code> flag to\n<code>gcloud network-security security-profile-groups update</code> to support\nproject-scoped WildFire Analysis profiles.</li>\n<li>Fixed an issue where\n<code>gcloud network-security security-profiles wildfire-analysis</code> modification\ncommands failed when specifying a full resource URI without\n<code>--location=global</code>.</li>\n<li>Removed <code>--async</code> flag from <code>gcloud beta network-security firewall-endpoints\nwildfire-verdict-change-requests create</code>. The command now returns the created\nverdict change request directly because the API does not return a\nlong-running operation.</li>\n<li>Promoted\n<code>gcloud network-security firewall-endpoints wildfire-verdict-change-requests</code>\ncommand group and its <code>create</code>, <code>get</code> and <code>list</code> commands to GA.</li>\n</ul>\n<h3 id=\"secure_source_manager\">Secure Source Manager</h3>\n<ul>\n<li>Promoted the following command groups to beta:\n<ul>\n<li><code>gcloud beta source-manager branch-rules</code></li>\n<li><code>gcloud beta source-manager hooks</code></li>\n<li><code>gcloud beta source-manager issues</code></li>\n<li><code>gcloud beta source-manager issues comments</code></li>\n<li><code>gcloud beta source-manager pull-requests</code></li>\n<li><code>gcloud beta source-manager pull-requests comments</code></li>\n</ul></li>\n</ul>\n<h3 id=\"workspace_key_access\">Workspace Key Access</h3>\n<ul>\n<li>Added <code>gcloud beta workspace-key-access</code> command group to manage Workspace\nKey Access endpoints, configs, and operations.</li>\n</ul>\n<p>Subscribe to these release notes at <a href=\"https://groups.google.com/forum/#!forum/google-cloud-sdk-announce\">https://groups.google.com/forum/#!forum/google-cloud-sdk-announce</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Robotics ER 2 (Preview)</strong></p>\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er\">Gemini Robotics ER 2</a>\n(<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/robotics-er-2\"><code>gemini-robotics-er-2-preview</code></a>) is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>. Gemini\nRobotics ER 2 is an embodied reasoning vision-language model built on Gemini 3.5\nFlash for robotics applications, including <a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er/spatial\">spatial reasoning</a>,\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er/agentic\">agentic code execution</a>,\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er/orchestration\">task orchestration</a>,\nand <a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er/video-understanding\">video understanding</a>.</p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>You can test Model Armor templates in the Google Cloud console by using\ncustom sample prompts to verify which safety and security filters the prompts\ntrigger and how Sensitive Data Protection redacts sensitive data. Testing\ntemplates helps you evaluate template behavior and fine-tune filter\nconfigurations. This feature is generally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>).</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/manage-templates#test-ma-template\">Test a Model Armor\ntemplate</a>.</p>"
