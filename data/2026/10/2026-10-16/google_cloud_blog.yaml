  "242db0b62b9da8748cef2e60216ccaa6":
    "id": "242db0b62b9da8748cef2e60216ccaa6"
    "title": "How Visko streams real-time world models on Google Cloud TPUs"
    "link": "https://cloud.google.com/blog/products/media-entertainment/how-visko-streams-real-time-world-models-on-google-cloud-tpus/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 03:07:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Editor's note: Generative AI startups are moving rapidly beyond static clip generation to build interactive, real-time worlds. In this technical deep dive, we explore how AI startup </span><strong style=\"font-style: italic; vertical-align: baseline;\">Visko</strong><span style=\"font-style: italic; vertical-align: baseline;\"> collaborated with Google Cloud TPU engineers to deploy Orbis — its continuously streaming Live World Model—on Cloud TPUs, going from initial kickoff to production handover in just 30 days.</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">What makes a live video world model so challenging to serve in production? The bottleneck isn't average throughput — it's beating a relentless real-time clock. Unlike offline video generators where a user submits a prompt and waits in a queue, a live world model streams continuously. Every new chunk of video and synchronized audio must finish rendering before the viewer finishes watching the previous one, or the world freezes.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we're excited to share how </span><a href=\"https://visko.ai\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Visko</strong></a><span style=\"vertical-align: baseline;\">, an AI startup pioneering interactive world models, teamed up with Google Cloud to solve this exact challenge. Working side by side, Visko and Google Cloud engineers deployed Visko's end-to-end live inference pipeline — combining video generation, super-resolution upscaling, and synchronized audio—onto a single </span><a href=\"https://cloud.google.com/tpu?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud TPU slice</strong></a><span style=\"vertical-align: baseline;\">. Together, the teams brought end-to-end generation down, rendering at 1.07x playback speed.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here is an inside look at how we engineered the pipeline to hit that milestone in a single month, the architectural optimizations that moved the needle, and practical lessons for other startups building ultra-low-latency generative AI on Google Cloud.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Redefining interactive media with Live World Models</span></h3>\n<p><span style=\"vertical-align: baseline;\">While most generative video platforms focus on rendering fixed, pre-baked clips, Visko is building what it calls </span><strong style=\"vertical-align: baseline;\">Live Models</strong><span style=\"vertical-align: baseline;\">: video world models that generate continuously and respond on the fly.</span></p>\n<p><span style=\"vertical-align: baseline;\">Visko's flagship model, </span><a href=\"https://www.visko.ai/models\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Orbis</strong></a><span style=\"vertical-align: baseline;\">, streams live video starting from a single text or image prompt. As the stream plays, viewers can enter new steering prompts in real time, dynamically evolving the scene without restarting or breaking continuity. For instance, in one test session, the livestream opens on a cat napping beside a crackling fireplace; when the viewer steers the scene to introduce a bowl of food, the bowl materializes seamlessly, and the cat stretches, stands up, and meows.</span></p>\n<p><span style=\"vertical-align: baseline;\">Since launching its public demo on September 1, 2026, Orbis has unlocked new possibilities across interactive entertainment, live commerce, AI companions, immersive education, and robotics simulation. To scale these interactive sessions reliably, Visko partnered with Google Cloud TPU engineers in August 2026 to port the Orbis live pipeline to Google's Tensor Processing Unit (TPU). Within 30 days, the full multimodal pipeline was running in real time on TPUs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Visko’s ambition is to power a new generation of interactive worlds that people can step into and shape in real time. Streaming continuous video and audio under a strict clock is a fundamentally different system challenge than offline clip generation. Working side by side with Google Cloud's TPU engineers, we brought the full Orbis pipeline to TPUs in just 30 days — giving us the low-latency compute and memory bandwidth required to bring Live Models to creators and developers at scale.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"Visko is bringing an exciting new class of real-time, steerable workloads to the Cloud TPU ecosystem. By co-engineering their live multimodal pipeline on a singleTPU slice using JAX, torchax, and custom Pallas kernels, we proved how quickly a lean startup team can go from PyTorch prototype to render at 1.07x playback speed on Google Cloud's AI Hypercomputer.\"<br /></span><span style=\"vertical-align: baseline;\">– </span><strong style=\"vertical-align: baseline;\">Dave Elliott, Head of Developer Advocacy for AI, Google Cloud</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><span style=\"vertical-align: baseline;\">Live video is a hard-deadline problem</span></h3>\n<p><span style=\"vertical-align: baseline;\">When you serve an offline clip generator, latency is forgiving — the user waits once while the backend processes frames. A live world model has no waiting room.</span></p>\n<p><span style=\"vertical-align: baseline;\">Every single chunk must be denoised, decoded from latents, upscaled to 1664x936 (at 18 fps), and paired with generated audio faster than realtime playback speed, for as long as the session runs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Two structural constraints make live world models far more demanding than standard batch inference:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Batch size of one:</strong><span style=\"vertical-align: baseline;\"> Each live stream represents an individual viewer's interactive session. You cannot mask latency by grouping dozens of concurrent requests into a massive batch — the standard playbook for keeping AI accelerators saturated.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strict sequential dependency:</strong><span style=\"vertical-align: baseline;\"> Every chunk depends directly on the one before it. Because the video model maintains a rolling memory of recent video latents so that chunk N+1 smoothly continues the action from chunk N, you cannot pre-render chunks out of order or parallelize across future timestamps.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For startup infrastructure engineers coming from LLM serving, it helps to think of live world modeling not as a tokens-per-second throughput benchmark, but as an </span><strong style=\"vertical-align: baseline;\">unforgiving per-step latency SLO</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Architecting the multimodal pipeline on a single TPU slice</span></h3>\n<p><span style=\"vertical-align: baseline;\">To keep infrastructure lean and cost-effective as Visko scales, the team designed the live pipeline to chain three distinct generative models on a single </span><a href=\"https://docs.cloud.google.com/tpu/docs/multislice-introduction\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud TPU slice</strong></a><span style=\"vertical-align: baseline;\"> running in BF16 precision.</span></p>\n<p><span style=\"vertical-align: baseline;\">When a viewer submits an initial prompt or a live steering update, all three generative models — the core video diffusion model, the super-resolution upscaler, and the audio generator — share the same chips, taking turns on the hardware for each chunk.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure1_\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure1_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Visko's end-to-end Orbis live pipeline chains video diffusion, latent decoding, super-resolution upscaling, and pure-JAX audio generation sequentially on a single Cloud TPU slice, completing each chunk faster than the playback speed.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To combine rapid startup iteration with bare-metal accelerator speed, the software stack is built on three open-source pillars:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/jax-ml/jax\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">JAX</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Google's high-performance Python array library for accelerators, compiled into optimized machine code by the </span><strong style=\"vertical-align: baseline;\">XLA</strong><span style=\"vertical-align: baseline;\"> compiler.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/torchax\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">torchax</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> An interoperability layer that runs PyTorch models directly on Cloud TPUs via JAX, enabling startup teams to bring existing PyTorch components over without an upfront, ground-up rewrite.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://jax.readthedocs.io/en/latest/pallas/index.html\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Pallas</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> The custom kernel programming language for TPUs in JAX — the TPU counterpart to writing custom Triton or CUDA kernels on GPUs.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Real-time performance breakdown: Hitting the clock </span></h3>\n<p><span style=\"vertical-align: baseline;\">By profiling and optimizing each stage on a single slice in BF16, the engineering team achieved a total per-chunk latency of under the target while — maintaining roughly </span><strong style=\"vertical-align: baseline;\">7% headroom </strong><span style=\"vertical-align: baseline;\">to absorb variance during live streaming:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure_2_orbis_latency_breakdown\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure_2_orbis_latency_breakdown.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: Chart of per-chunk latency budget on one TPU slice.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Because video denoising accounts for nearly two-thirds of the total compute budget, that stage became the primary focus of our kernel and parallelism optimizations.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Inside the stack: Three optimizations that unlocked real-time streaming</span></h3>\n<h4><span style=\"vertical-align: baseline;\">1. Ulysses context parallelism across all TPU chips</span></h4>\n<p><span style=\"vertical-align: baseline;\">A video chunk expands into a massive sequence of spatiotemporal tokens inside the video transformer. To distribute that workload across the TPU chips at batch size 1, the team implemented </span><strong style=\"vertical-align: baseline;\">Ulysses context parallelism</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Instead of splitting model weights, Ulysses splits the token sequence across chips. Immediately before the attention layer, a high-speed all-to-all interconnect exchange regroups the tensors so that each chip holds the </span><span style=\"font-style: italic; vertical-align: baseline;\">entire</span><span style=\"vertical-align: baseline;\"> video sequence, but only for one-quarter of the attention heads. After each chip computes attention over the full sequence for its assigned heads, a second all-to-all exchange restores the sequence-split layout for the feed-forward layers.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure3_ulysses_context\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure3_ulysses_context.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Ulysses context parallelism across TPU chips at batch size 1. High-speed all-to-all Inter-Chip Interconnect (ICI) exchanges transition tensors between a sequence-split layout for feed-forward layers and a head-split layout for Pallas splash attention.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">2. Custom Pallas splash attention from MaxDiffusion</span></h4>\n<p><span style=\"vertical-align: baseline;\">To accelerate the attention computation itself, the team integrated a custom Pallas </span><strong style=\"vertical-align: baseline;\">splash attention</strong><span style=\"vertical-align: baseline;\"> kernel from </span><a href=\"https://github.com/AI-Hypercomputer/maxdiffusion\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">MaxDiffusion</strong></a><span style=\"vertical-align: baseline;\">, Google Cloud's open-source reference library for diffusion models on Cloud TPU.</span></p>\n<p><span style=\"vertical-align: baseline;\">Splash attention brings FlashAttention-style tiling to TPU architecture: rather than materializing the full quadratic attention matrix in High Bandwidth Memory (HBM), it computes attention in compact tiles that remain inside ultra-fast on-chip VMEM. Startup teams can drop the exact kernel used in this port straight into their own pipelines via </span><a href=\"https://github.com/AI-Hypercomputer/maxdiffusion/blob/main/src/maxdiffusion/kernels/custom_splash_attention.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">custom_splash_attention.py</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><span style=\"vertical-align: baseline;\">3. A 5.8x audio speedup by moving from torchax to pure JAX</span></h4>\n<p><span style=\"vertical-align: baseline;\">We first brought all three Orbis models onto Cloud TPU with *torchax*, which runs PyTorch code on TPU through JAX and XLA without a rewrite. For the video and upscaling models, `torchax` paired with Pallas attention kernels met our latency target directly, and both stay in `torchax` in the final pipeline.</span></p>\n<p><span style=\"vertical-align: baseline;\">Only the audio model needed a rewrite. Moving the audio stage from `torchax` to *native JAX* made it *5.8x faster* and brought the full pipeline under the playback deadline.</span></p>\n<p style=\"padding-left: 40px;\"><strong style=\"vertical-align: baseline;\">Startup Builder Tip: Port strategically.<br /></strong><span style=\"vertical-align: baseline;\">The takeaway isn't \"skip torchax\" — it's to use it as a fast bring-up bridge. torchax got our PyTorch models running on TPU in days rather than weeks, giving us the end-to-end telemetry needed to pinpoint true bottlenecks. Measure the full pipeline first, and invest engineering cycles rewriting only the components that dominate your latency budget.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Field notes for AI builders: Cloud TPU lessons</span></h3>\n<p><span style=\"vertical-align: baseline;\">Takeaways from tuning live multimodal inference on Cloud TPU:</span></p>\n<p><span style=\"vertical-align: baseline;\">- *</span><strong style=\"vertical-align: baseline;\">Ulysses context parallelism for single stream video</strong><span style=\"vertical-align: baseline;\">:* At batch size 1, splitting the token sequence across chips with `all-to-all` interconnect exchanges was faster than both tensor parallelism and ring attention.</span></p>\n<p><span style=\"vertical-align: baseline;\">- *</span><strong style=\"vertical-align: baseline;\">Native BF16 for continuous streams</strong><span style=\"vertical-align: baseline;\">:* FP8 quantization cuts memory bandwidth pressure, but small quantization errors build up across chunks in a continuous stream. Native BF16 kept visual quality intact within the latency budget.</span></p>\n<p><span style=\"vertical-align: baseline;\">- *</span><strong style=\"vertical-align: baseline;\">Selective JAX ports</strong><span style=\"vertical-align: baseline;\">:* `torchax` kept the video and upscaling models in PyTorch, so the team only rewrote the audio bottleneck in native JAX.</span></p>\n<p><span style=\"vertical-align: baseline;\">- </span><strong style=\"vertical-align: baseline;\">*XLA compilation caching:*</strong><span style=\"vertical-align: baseline;\"> The first boot spends a few minutes compiling XLA graphs. Caching compiled artifacts brings worker restarts under a minute.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Building real-time generative models on Cloud TPU? Start here</span></h3>\n<p><span style=\"vertical-align: baseline;\">If your startup is pushing the boundaries of live video, world models, or ultra-low-latency multimodal inference, you can build with the same toolkit that powered Visko's port:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Accelerate diffusion attention out of the box:</strong><span style=\"vertical-align: baseline;\"> Grab the open-source splash attention kernel used in this collaboration from </span><a href=\"https://github.com/AI-Hypercomputer/maxdiffusion\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">MaxDiffusion</strong></a><span style=\"vertical-align: baseline;\">, and explore the </span><a href=\"https://jax.readthedocs.io/en/latest/pallas/index.html\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Pallas documentation</strong></a><span style=\"vertical-align: baseline;\"> to write custom TPU kernels.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Migrate PyTorch fast, then optimize selectively:</strong><span style=\"vertical-align: baseline;\"> Bring your existing PyTorch models onto TPU quickly with </span><a href=\"https://github.com/google/torchax\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">torchax</strong></a><span style=\"vertical-align: baseline;\">, pinpoint bottlenecks with the </span><a href=\"https://cloud.google.com/tpu/docs/cloud-tpu-tools\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud TPU Profiler</strong></a><span style=\"vertical-align: baseline;\">, and port latency-critical stages to native </span><a href=\"https://github.com/jax-ml/jax\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">JAX</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Spin up TPUs on demand:</strong><span style=\"vertical-align: baseline;\"> Use </span><a href=\"https://docs.cloud.google.com/tpu/docs/request-using-flex-start\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">TPU Flex-start VMs</strong></a><span style=\"vertical-align: baseline;\"> to provision TPU capacity for short development and benchmarking runs without a long-term reservation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale with Google for Startups:</strong><span style=\"vertical-align: baseline;\"> Early-stage AI startups looking for cloud credits, technical mentorship, and access to Google Cloud's AI Hypercomputer stack can apply to the </span><a href=\"https://cloud.google.com/startup\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Cloud Program</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">Special thanks to the Visko.ai team for the close technical partnership, and to the Google Cloud TPU engineers who lead the project including: Yixin Shi, James Huang, and Elisa Tsai.</span></sup></p></div>"
  "3f63276247198bf9701b6044a8e394ac":
    "id": "3f63276247198bf9701b6044a8e394ac"
    "title": "Bringing the borderless Lakehouse into the agentic era with innovations for Gemini"
    "link": "https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-integrates-with-gemini/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 03:07:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As enterprises shift their AI usage from experimental chatbots to autonomous agents, teams are hitting a critical bottleneck: accessing and reasoning over data scattered across multiple clouds, SaaS platforms, and on-premises systems. To turn AI agents into true systems of action, organizations need a foundation that can handle petabyte-scale reasoning without the security risks of data movement. Last week at our </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini at Work</span></a><span style=\"vertical-align: baseline;\"> event, we announced how Gemini can help you transform business workflows. To help power your agents with your enterprise data, we will dive deeper into the new Gemini integration with borderless Lakehouse to help you build, secure, and scale agents that work across your data estate.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Access data that lives outside of Google Cloud through Gemini </span></h3>\n<p><span style=\"vertical-align: baseline;\">The ultimate value of the borderless Lakehouse is realized through the agents you build to transform your organization, with Gemini as the front door. With the new Gemini integration, data that’s either preconfigured or stored in your borderless Lakehouse is now directly integrated into Gemini. Currently in preview, this means you can set up access to new data sources, such as Databricks Unity Catalog or Snowflake Horizon, through Lakehouse catalog federation directly from Gemini. </span></p>\n<p><span style=\"vertical-align: baseline;\">Now your business users can use natural language to query records that live across clouds while your AI agents can ground their reasoning and generate code from the same data — all without moving it. By directly contextualizing AI agents across your borderless Lakehouse, you can help accelerate your organization’s AI adoption while simplifying access to critical information.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/image1_HJqokGb.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Gemini agents invoked by business users can access data that lives in BigQuery and Databricks Unity Catalog to provide comprehensive reporting and get insights using natural language.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Borderless Lakehouse advancements</span></h3>\n<p><span style=\"vertical-align: baseline;\">In addition to this new, native integration with Gemini, we’re sharing  that several features we introduced earlier this year to power your data foundation with the borderless Lakehouse are now generally available, including:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Support for Cross-Cloud Interconnect and cross-cloud caching for AWS and Azure</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery support for Apache Iceberg V3 specifications</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Read-write interoperability on Apache Iceberg tables for both BigQuery and Managed Service for Apache Spark</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Support for AlloyDB lakehouse federation </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Bi-directional caching with AWS Glue, Databricks Unity Catalog, and Snowflake Horizon Catalog using Lakehouse runtime federation </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Integration with Knowledge Catalog</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Zero-copy data integration with Salesforce, SAP and Workday, and now, Confluent Tableflow</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Synchronization of Databricks Delta Lake assets through the Lakehouse console using Dataflow</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Let’s explore.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Performance and reasoning at petabyte scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">While agent context windows are typically limited to ingesting hundreds of kilobytes at a time, enterprise workflows sometimes join petabytes of data across clouds. An agent-native data platform that needs to combine data across sources, like product and customer data, to your CRM cloud and warehouse telemetry needs to be able to process data at scale. When you do this over MCP, you are limited to megabyte scale because of context windows and payload size. By integrating at every layer of the data and AI stack, the borderless Lakehouse provides enterprise-grade scalability, enabling agents to reason over petabytes of data with similar performance to it being stored locally. </span></p>\n<p><span style=\"vertical-align: baseline;\">At the networking layer, Cross-Cloud Interconnect and </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-cross-cloud-data-access\"><span style=\"text-decoration: underline; vertical-align: baseline;\">cross-cloud caching</span></a><span style=\"vertical-align: baseline;\"> provide high-throughput, low-latency paths to AWS and Azure, eliminating variable egress fees. When an agent joins Iceberg tables in Amazon Azure Data Lake Storage with data in BigQuery, every uncached byte it scans crosses a cloud boundary, so the network sets the pace. Cross-Cloud Interconnect gives the Lakehouse a dedicated, private connection between Google Cloud and AWS or Azure, at 10 Gbps or 100 Gbps per connection. Lakehouse queries travel over that connection rather than the public internet, so latency stays low and predictable. Cross-cloud caching serves repeat reads from inside Google Cloud, so agents can query data in other clouds without migrating it.</span></p>\n<p><span style=\"vertical-align: baseline;\">The borderless Lakehouse includes several key optimizations to integrate Iceberg metadata within the query engine. BigQuery now supports </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/use-iceberg-v3-binary-deletion-vectors\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Iceberg V3 specifications,</span></a><span style=\"vertical-align: baseline;\"> including binary deletion vectors and sort orders. These features allow the engine to handle row-level updates and deletes more efficiently by eliminating the need to rewrite entire data files. We also upgraded BigQuery’s execution engine with a new FlatBuffers-based Parquet reader and parallelized I/O to help reduce CPU overhead and serialization bottlenecks and narrow the performance gap between open formats and native storage.</span></p>\n<p><span style=\"vertical-align: baseline;\">This builds upon recent performance innovations to the query engine designed to support agent workloads, which often come in herds and need to process small queries quickly and cost effectively. With </span><a href=\"https://cloud.google.com/blog/products/data-analytics/bigquery-performance-optimizations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery fluid scaling and history based optimizations</span></a><span style=\"vertical-align: baseline;\">, you can run scalable and efficient agent workloads while maintaining openness with Apache Iceberg. </span></p>\n<p><span style=\"vertical-align: baseline;\">Meanwhile, read-write interoperability on Apache Iceberg tables for both </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> makes it easy for all of your data teams to work off the same Iceberg tables in Google Cloud Storage. This vertically optimized stack helps make your agents faster and more cost-effective, leveraging the power of BigQuery and </span><a href=\"https://cloud.google.com/blog/products/data-analytics/introducing-lightning-engine-for-apache-spark?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lightning Engine</span></a><span style=\"vertical-align: baseline;\"> to activate data without moving it. To expand the analytical depth of the lakehouse, graph support for Iceberg in BigQuery lets you analyze relationship networks, such as supply chains, directly on open table datasets.</span></p>\n<p><span style=\"vertical-align: baseline;\">Then, for operational data, </span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-real-time-data-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB lakehouse federation</span></a><span style=\"vertical-align: baseline;\"> lets you query live database records and historical warehouse data together from a single connection without copying any information. This simplifies your system and lowers costs while giving agents instant access to both real-time updates and deep background history with the borderless Lakehouse.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Comprehensive context and data access for your agents</span></h3>\n<p><span style=\"vertical-align: baseline;\">An AI agent is only as smart as the context it can access. To help prevent hallucinations and improve accuracy at the metadata layer, the borderless Lakehouse unifies your enterprise data using the </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse runtime catalog</span></a><span style=\"vertical-align: baseline;\">. Based on the Apache Iceberg REST Catalog, it provides bi-directional catalog federation with AWS Glue, Databricks Unity Catalog, and Snowflake Horizon Catalog. The Lakehouse runtime catalog also includes a new standard Hive Metastore-compatible endpoint, allowing engines like Apache Spark, Trino, and Presto to discover metadata without architectural changes. </span></p>\n<p><span style=\"vertical-align: baseline;\">The borderless Lakehouse also integrates directly with </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\">, which automatically indexes your distributed data assets, to provide the precise business metadata and semantic definitions agents need to reason over your entire enterprise corpus — including unstructured data in Cloud Storage. This gives agents just enough context to be accurate while controlling token costs, helping you develop an intelligent and sustainable agentic strategy. </span></p>\n<p><span style=\"vertical-align: baseline;\">The borderless Lakehouse provides zero-copy data integration with your SaaS applications like Salesforce, SAP and Workday and integrates with a larger partner ecosystem, capturing enterprise data in Knowledge Catalog and acting as a single context engine for your agents. Today, we’re expanding the partner ecosystem with new integrations for Confluent Tableflow, now generally available, which syncs to Lakehouse runtime catalog so the Iceberg tables it produces show up directly in BigQuery, with no copying and no extra ETL. </span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, organizations with Databricks-centric repositories can now easily import, transform and synchronize their Delta Lake assets into Lakehouse through the </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/import-delta-lake-tables\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse console</span></a><span style=\"vertical-align: baseline;\"> using Dataflow.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Modernize with ease</span></h3>\n<p><span style=\"vertical-align: baseline;\">Customer use of Apache Iceberg has more than tripled since the beginning of 2025, and enterprises building with Google Cloud’s borderless Lakehouse are seeing significant impact from it: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/customers/etsy-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Etsy</span></a><span style=\"vertical-align: baseline;\"> unified three petabytes with borderless Lakehouse, joining data in place to accelerate pipeline queries by 60%. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.youtube.com/watch?v=Er6iwuxcC-8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Commerzbank</span></a><span style=\"vertical-align: baseline;\"> transforms raw distributed data into governed, agent-ready access.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://hightouch.com/blog/introducing-hightouch-for-google-cloud-cross-cloud-lakehouse\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hightouch</span></a><span style=\"vertical-align: baseline;\"> integrates directly with borderless Lakehouse so teams can power their marketing directly on an open Iceberg lakehouse and activate that data across the Google Cloud ecosystem.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/customers/target\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Roundel</span></a><span style=\"vertical-align: baseline;\"> modernized its Target Product Ads technology stack from the ground up with borderless Lakehouse, completely rebuilding its data ingestion, processing, and measurement pipelines. </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If you are ready to get started with the transition to borderless Lakehouse for your organization, it doesn’t need to be difficult. For organizations currently using legacy Dataproc Metastore, we now offer an automated, zero-downtime migration path to the serverless Lakehouse runtime catalog. This preserves your existing schemas and lineage while unlocking the AI-ready features of the borderless Lakehouse, so you can stop managing infrastructure and start activating agents.</span></p>\n<p><span style=\"vertical-align: baseline;\">Get started today with the </span><a href=\"https://codelabs.developers.google.com/next26/multicloud-lakehouse#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Build a borderless Lakehouse codelab</span></a><span style=\"vertical-align: baseline;\"> or visit </span><a href=\"https://cloud.google.com/solutions/data-lakehouse/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our website</span></a><span style=\"vertical-align: baseline;\"> to learn more.</span></p></div>"
  "aabcc38e4f290c14b09760b60e353b06":
    "id": "aabcc38e4f290c14b09760b60e353b06"
    "title": "Temporal Serverless Workers on Cloud Run: Scale workers ahead of demand"
    "link": "https://cloud.google.com/blog/products/serverless/temporal-serverless-workers-on-cloud-run-worker-pools/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 03:07:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The open-source </span><a href=\"https://temporal.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal</span></a><span style=\"vertical-align: baseline;\"> execution platform is rapidly becoming a foundational layer of modern software infrastructure — especially for orchestration in distributed systems and AI agent workloads. However, deploying and scaling workers in Temporal comes with unique challenges. Workers poll for tasks instead of serving requests, so request-driven serverless platforms can be an awkward fit. This often results in running worker fleets on Kubernetes or VMs, which you have to manage and pay for continuously. You build a metrics pipeline and tune autoscaling triggers, and scaling still trails bursts because of metrics lag. Every deployment means juggling upgrades and versions, and you pay for that compute whether or not there's work in the queue.</span></p>\n<p><span style=\"vertical-align: baseline;\">We built </span><a href=\"https://docs.cloud.google.com/run/docs/deploy-worker-pools\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run worker pools</span></a><span style=\"vertical-align: baseline;\"> for exactly this kind of pull-based work: Your instances connect to a queue or stream, take the next item, and process it. Starting today, </span><a href=\"https://temporal.io/cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal Cloud</span></a><span style=\"vertical-align: baseline;\">, which is the fully managed version of Temporal’s open-source platform, can scale them for you. Currently in preview, </span><a href=\"https://docs.temporal.io/serverless-workers\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal Serverless Workers</span></a><span style=\"vertical-align: baseline;\"> on Cloud Run let you deploy your workers as a worker pool, and Temporal sizes the pool to match the work on your task queues. When there's no work, it can scale the pool to zero. There's no cluster or autoscaler to run, and your worker code stays the same.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How Cloud Run worker pools fit with Temporal</strong></h3>\n<p><span style=\"vertical-align: baseline;\">A worker pool is Cloud Run's resource for continuous background work. It has no public endpoint, and each instance is allocated CPU for its whole lifetime, which matches how a Temporal worker runs. Temporal manages your Cloud Run worker pools as follows:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Your Temporal workers run as Cloud Run worker pool instances in your project and poll Temporal Cloud for tasks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Temporal Cloud tracks your task queues and sets the worker pool's instance count through the Cloud Run Admin API, using the IAM permissions you grant. Temporal never opens a connection to your instances, so you don't need to open ports or add firewall rules for it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You run each build version as its own Cloud Run worker pool. An older build's worker pool can sit at zero instances until a workflow that started on it needs it again.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Your Temporal workers run in your project, under your service account, and on your network. Temporal decides how many of them run.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What you can build with Temporal Serverless Workers</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The combination of Cloud Run worker pools with Temporal Serverless Workers opens up a variety of interesting use cases:</span></p>\n<p><strong style=\"vertical-align: baseline;\">Autoscaled agentic workers:</strong><span style=\"vertical-align: baseline;\"> AI agents run multi-step chains of LLM reasoning and tool calls. Temporal's durable execution and Cloud Run worker pools work together here. Temporal workers spin up instantly to handle bursts of LLM steps, embeddings or API calls, then scale to zero when the queue empties. Workers get keyless access to Google Cloud AI APIs. You can also attach a GPU for inference, and the workers attached to the GPUs will still scale to zero. Temporal runs each model and tool call as a durable activity; if a worker disappears mid-step, the activity retries on another worker and the workflow continues.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Long-running </strong><strong style=\"vertical-align: baseline;\">Workflows</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.temporal.io/workflows\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal Workflows</span></a><span style=\"vertical-align: baseline;\"> can run indefinitely, allowing for building applications that track the state of real-world resources over long periods of time. This pattern is typically known as the “</span><a href=\"https://docs.temporal.io/design-patterns/entity-workflow%5C\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Entity Pattern</span></a><span style=\"vertical-align: baseline;\">,” because the Workflow represents the state of some entity. However, these long-running Workflows don’t usually have consistent compute requirements: Some individual steps are short, some are long, and other times, the Workflow is sleeping, waiting for external input, such as from a human or another system. Cloud Run worker pools provide flexible compute to support this pattern: Individual steps can run for as long as is required, and Temporal will automatically scale down the worker pool when there is no work to be done.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><strong style=\"vertical-align: baseline;\">Bursty batch work:</strong><span style=\"vertical-align: baseline;\"> Worker pools bill only while instances run, so a worker pool that sits idle between batch runs costs nothing while it's at zero instances. For jobs like billing runs or media transcoding, Temporal scales the pool out as batches arrive and back in once the queue drains. Your maximum instance count caps how many instances you pay for. Tasks beyond that capacity wait in the queue rather than being dropped.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why Cloud Run worker pools for Temporal workers</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Before, running Temporal workers on Cloud Run services took some workarounds:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">an HTTP listener, because services expect containers to listen on a port</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">instance-based billing, so workers kept their CPU between requests</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">minimum instances, so the service didn't scale to zero</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By running Temporal workers on Cloud Run worker pools, you don’t need those workarounds anymore, and you have:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No endpoint to manage.</strong><span style=\"vertical-align: baseline;\"> There's no public URL or load balancer to lock down, and no health-check port to implement.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Steady CPU at a lower price.</strong><span style=\"vertical-align: baseline;\"> Instances don't idle or throttle. Cloud Run doesn't remove instances because they look idle, so Temporal alone decides when the pool shrinks. Worker pools list at almost 40% less per vCPU-hour and GB-hour than instance-billed Cloud Run services.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scaling without revision churn.</strong><span style=\"vertical-align: baseline;\"> Changing the instance count doesn't create a new revision, so Temporal can resize the pool as often as the load changes.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">How Temporal manages scaling and versioning of worker pools</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Temporal </span><span style=\"vertical-align: baseline;\">decides when to add capacity using one main signal: the delay between a task landing in the task queue backlog and a worker picking it up. If that delay grows, the available workers are saturated. Scaling occurs as follows:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Server-side detection:</strong><span style=\"vertical-align: baseline;\"> The Temporal server tracks this backlog-to-worker latency for each task queue.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Push notification:</strong><span style=\"vertical-align: baseline;\"> When the latency crosses its trigger conditions, the server sends a push notification to the worker controller instance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Provisioning:</strong><span style=\"vertical-align: baseline;\"> The worker controller then adds capacity to the worker pool. New instances take time to start and connect before they can poll for tasks, so capacity lags behind the signal.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Because Temporal keeps spare capacity, the pool grows ahead of demand instead of after tasks pile up. Scale-in is more conservative. Temporal waits for a stabilization period after the last time a task found no available worker (90 seconds by default), and it pauses between successive reductions. Cloud Run’s configurable graceful shutdown extends shutdown from 10 seconds to 10 minutes. That gives SIGTERM-aware workers time to finish or checkpoint. The instance count stays between a minimum and a maximum that you set. If the first task after an idle period can't wait for an instance to start, set the minimum above zero.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_Tu66Q25.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Deploying new workflow code without breaking running executions is hard. Temporal workflows are stateful and deterministic, so if you swap their code mid-run, you get non-determinism errors. Serverless Workers on Cloud Run solve this by requiring Temporal Worker Versioning. You don't patch code with conditional branches. Instead, you deploy each Worker Deployment Version as its own worker pool deployment, identified by a </span><code style=\"vertical-align: baseline;\">deploymentName</code><span style=\"vertical-align: baseline;\"> and a </span><code style=\"vertical-align: baseline;\">buildId</code><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">Using distinct worker pools solves two problems:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Workflows that started on a particular Worker Deployment Version continue to run and complete on that version.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Each Worker Deployment Version is scaled and drained individually, matching compute spend and utilization to the requirements of your application. As existing workflows complete and drain on a previous Worker Deployment Version, the underlying Worker Pool is eventually scaled down to zero automatically.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">You set a versioning behavior for each Workflow type, or set a Worker-level default:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">PINNED:</strong><span style=\"vertical-align: baseline;\"> A workflow stays on the Worker version (Build ID) it started on and finishes there. Best for short-running workflows, order processing and multi-step APIs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AUTO_UPGRADE:</strong><span style=\"vertical-align: baseline;\"> A workflow moves to the new \"Current\" or \"Target\" Worker Deployment Version as you roll it out. Best for long-running workflows, such as subscription billing or tasks that run for weeks.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Learn more about configuring worker versioning</span> <a href=\"https://docs.temporal.io/worker-versioning\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Setup takes three steps:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Containerize your Temporal Worker and deploy the container as a Cloud Run worker pool, with the Build ID in the pool name. Keep credentials such as your Temporal API key in Secret Manager.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Connect Temporal to your worker pool by granting Temporal Cloud permission to manage the worker pool so it can scale it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Create a Worker Deployment Version in Temporal that points at the pool's project, region, and name.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_GCHxzit.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Temporal Serverless Workers on Cloud Run is in preview, so APIs and configuration may change before the stable release. To get started,</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn how</span> <a href=\"https://docs.temporal.io/serverless-workers/cloud-run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Serverless Workers on Cloud Run</span></a><span style=\"vertical-align: baseline;\"> scale and handle versions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Deploy your first worker with the</span> <a href=\"https://docs.temporal.io/production-deployment/worker-deployments/serverless-workers/cloud-run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">setup guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">See</span> <a href=\"https://cloud.google.com/run/docs/deploy-worker-pools\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run worker pools</span></a><span style=\"vertical-align: baseline;\"> for CPU, memory, GPU and networking options.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sign up for the configurable graceful shutdown </span><a href=\"https://forms.gle/ctAU6WDUVwJajx1D7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">preview</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
  "71cd9af6585c2cbf6ab0f9c6c85662a9":
    "id": "71cd9af6585c2cbf6ab0f9c6c85662a9"
    "title": "What the Gemini agent means for startups"
    "link": "https://cloud.google.com/blog/topics/startups/what-the-gemini-agent-means-for-startups/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 03:07:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Small teams, short runway, and constant pressure to ship faster — it’s the reality we see every day among the founders we work with at Google for Startups. When you are building a company from the ground up, every hour spent on operational overhead or infrastructure plumbing is an hour taken away from your core product.</span></p>\n<p><span style=\"vertical-align: baseline;\">Last week at Gemini at Work 2026, </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">we introduced the Gemini agent</span></a><span style=\"vertical-align: baseline;\">: a single, universal agent designed to work both as your personal assistant and as a dedicated member of your team. And this week, we made our new frontier model,</span><strong style=\"vertical-align: baseline;\"> </strong><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\">, widely available — trained to maintain context across long, multi-step tasks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here is a look at how the Gemini agent works, five practical takeaways for founders, and how startups are already using it to punch above their weight.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What is the Gemini agent?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Instead of prompting separate chatbots for writing, coding, and data analysis, the Gemini agent is a single agent that takes high-level objectives and returns finished work. Three principles define it:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified:</strong><span style=\"vertical-align: baseline;\"> A single agent can now handle knowledge work, data analysis, creative asset generation, and writing and running code. For complex jobs, it dynamically spins up temporary, job-specific sub-agents and coordinates their work in parallel or in sequence.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Omnipresent access:</strong><span style=\"vertical-align: baseline;\"> It works across the surfaces you use every day — on the web, command line, desktop, and mobile, as well as natively inside Gmail, Docs, Sheets, Slides, Drive, Chat, and Calendar.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Persistent:</strong><span style=\"vertical-align: baseline;\"> It runs in the cloud with continuous memory across four dimensions (session, semantic, procedural, and episodic). It onboards itself like a new hire — learning your team, tools, and business context so you don't have to re-explain your startup with every prompt, and keeping multi-day tasks moving even after you close your laptop.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For founders wearing five hats at once, Gemini works like a digital chief of staff that's already briefed on your calendar, projects and documents. Ask it to research market trends, build a financial model in Sheets and turn both into a pitch deck, without repeating what the project or goals are at each step. It also works ahead of you. When an investor emails asking for your latest product update as a deck, Gemini spots the request and offers to handle it; one click and it comes back with completed work, ready for sharing or review.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Five takeaways for startups</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">1. Coworker agents and skills help you scale your output</strong></p>\n<p><span style=\"vertical-align: baseline;\">Beyond personal assistance, you can create persistent </span><strong style=\"vertical-align: baseline;\">coworker agents</strong><span style=\"vertical-align: baseline;\"> that work with your entire team. Each agent comes with its own Workspace account, email address, Drive storage, and directory presence. You can define a specific role — such as a launch coordinator, QA triager, or financial analyst — and your teammates can add agents to a Chat space or </span><code style=\"vertical-align: baseline;\">@mention</code><span style=\"vertical-align: baseline;\"> it in a Google Doc comment to delegate work.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can also equip agents with reusable </span><strong style=\"vertical-align: baseline;\">skills</strong><span style=\"vertical-align: baseline;\"> — or let Gemini write skills for itself as it learns your processes. For example, with operational reporting skills connected to BigQuery and the Knowledge Catalog, anyone on your team can ask a plain-language question to build and save a live report. Once saved, those reports run on demand without incurring additional token costs. Gemini also offers pre-built specializations, starting with legal and financial services.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What it means for startups:</strong><span style=\"vertical-align: baseline;\"> Coworker agents can immediately increase the capacity of your teams, and skills can standardize repeatable processes like investor and operational reporting without burning tokens on every run.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">2. Open and third-party model choice</strong></p>\n<p><span style=\"vertical-align: baseline;\">Gemini is the agent, and the model underneath is your choice. As startup architectures mature, sending every task to a single frontier model quickly eats into gross margins. With the Gemini agent, you can dynamically route workloads across Gemini models, third-party models like Anthropic’s Claude, and lightweight open models like</span> <a href=\"https://cloud.google.com/blog/topics/startups/why-your-startup-needs-open-models-alongside-frontier-apis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemma</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What it means for startups:</strong><span style=\"vertical-align: baseline;\"> You get flexibility without lock-in. You can optimize your cost per task — using compact models for high-volume, deterministic jobs and frontier models for complex reasoning — and swap models as your product evolves without rebuilding your workflows.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">3. Connected to your services and tools </strong></p>\n<p><span style=\"vertical-align: baseline;\">An agent is only as useful as the systems it can reach. In addition to Google Workspace, the Gemini agent connects directly to your engineering, data, and business stack, including partner solutions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Development and collaboration:</strong><span style=\"vertical-align: baseline;\"> Git, Slack, Jira and more </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data and local files:</strong><span style=\"vertical-align: baseline;\"> BigQuery, Postgres, Snowflake, Databricks, and more alongside files on your desktop</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Custom tools via MCP:</strong><span style=\"vertical-align: baseline;\"> Any Model Context Protocol (MCP) server inside or outside your network so your engineers can build and share internal tools.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">What it means for startups:</strong><span style=\"vertical-align: baseline;\"> Instead of spending engineering cycles maintaining custom connectors, your team can plug the agent straight into your existing codebase, databases, and MCP tools so it can act on live data wherever it lives.</span></p>\n<p><strong style=\"vertical-align: baseline;\">4. Built-in security and governance</strong></p>\n<p><span style=\"vertical-align: baseline;\">For B2B startups, the enterprise security audit is often where deals stall. Under the hood, every agent is assigned a cryptographic </span><strong style=\"vertical-align: baseline;\">Agent Identity</strong><span style=\"vertical-align: baseline;\"> for clear audit trails, runs inside an isolated sandbox, and protected with built-in prompt injection defenses. External traffic is routed through </span><strong style=\"vertical-align: baseline;\">Agent Gateway</strong><span style=\"vertical-align: baseline;\">, allowing you to enforce governance policies. And managing coworker agents is as straightforward as managing users today, since they all have a Workspace account.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What it means for startups:</strong><span style=\"vertical-align: baseline;\"> When an enterprise buyer’s CISO asks how your AI workflows handle data privacy, prompt injection, and access control, you have an enterprise-grade architecture ready — helping you clear procurement hurdles.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">5. Protect your runway with real-time cost controls</strong></p>\n<p><span style=\"vertical-align: baseline;\">Autonomous agents that run sub-agents for hours or days can quickly run up a bill if a loop goes unchecked. You can now set hard, real-time spend caps directly in the Cloud Billing Console; if a cap is reached, the project's agent automatically pauses so a bug never turns into a billing surprise. Underneath, Gemini runs on </span><a href=\"https://cloud.google.com/ai-infrastructure?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google’s specialized AI infrastructure,</span></a><span style=\"vertical-align: baseline;\"> including our inference-optimized TPU 8i, which delivers 80% better performance-per-dollar than the prior generation.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What it means for startups:</strong><span style=\"vertical-align: baseline;\"> You and your developers can experiment with long-running, parallel agentic loops with a built-in financial safety net that protects your cash reserves and builds confidence with your backers.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Founders already building</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Startups and AI-native innovators are already putting Gemini to work. Immersive storytelling platform</span><a href=\"https://cloud.google.com/transform/whenere-dreamlands-gemini-jane-austen-fortnite-future-of-fan-fiction\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Whenere</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> used Dreamlands</span></a><span style=\"vertical-align: baseline;\">, an agentic 3D worldbuilding platform built on Gemini platform, to bring </span><span style=\"font-style: italic; vertical-align: baseline;\">Pride and Prejudice</span><span style=\"vertical-align: baseline;\"> to Fortnite — with Gemini generating textures for each new object in about 7 seconds for under 10 cents; one artist created nearly 250 custom assets in a single day and completed a historically accurate estate in under a week. They join application-building platform </span><strong style=\"vertical-align: baseline;\">Lovable</strong><span style=\"vertical-align: baseline;\"> and fellow startups and innovators including </span><strong style=\"vertical-align: baseline;\"> OpenEvidence</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Recursion</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Replit</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">and more</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Build with Google for Startups</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The agentic era gives lean teams the leverage to punch far above their weight — whether you’re deploying coworker agents to cover internal operations or building agentic workflows directly into your product.</span></p>\n<p><span style=\"vertical-align: baseline;\">While these new Gemini agent capabilities are not publicly available yet, startups can</span><a href=\"https://cloud.google.com/contact\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">contact our sales team</span></a><span style=\"vertical-align: baseline;\"> to learn more and discuss how to get ready. In the meantime, you can explore the</span><a href=\"https://startup.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups program</strong></a><span style=\"vertical-align: baseline;\"> to access credits, hands-on technical guidance, mentorship, global founder community programs and more. </span></p></div>"
  "6eacbffc3352fff88c2635ebc95f5c39":
    "id": "6eacbffc3352fff88c2635ebc95f5c39"
    "title": "Modernizing perimeter security: Scalable perimeters with VPC Service Controls"
    "link": "https://cloud.google.com/blog/products/identity-security/introducing-new-scalable-perimeter-options-with-vpc-service-controls/"
    "published": "2026-10-16 01:00:00"
    "fetched": "2026-10-16 03:07:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Agents represent a fundamental shift in cloud operations. They can act on behalf of users or autonomously, make non-deterministic decisions, and request data across projects at unprecedented speed and scale. Because agents are a distinct category of non-human identity (NHI), they require unique secure-by-default guardrails.</span></p>\n<p><span style=\"vertical-align: baseline;\">Traditional, manually-operated network perimeters are vulnerable to today’s machine-speed attacks. Overly permissive perimeters, built to avoid blocked connections, increase the risk of unauthorized data theft, but overly strict perimeters stall development under a flood of access denials.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we're excited to announce key enhancements to </span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC Service Controls</span></a><span style=\"vertical-align: baseline;\"> (VPC-SC) that make perimeters easier to create, maintain, and scale. You can now add folders to perimeter membership, so that projects contained in them inherit policy. You can also manage granular exceptions and resolve denials with guided, scoped remediation. </span></p>\n<p><span style=\"vertical-align: baseline;\">The result is data protected by default, so you can scale autonomous agents across your enterprise without letting data leave your perimeter. This update is generally available, and at no additional cost.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Perimeters aligned to your architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">VPC-SC provides a context-aware network security perimeter around your Google Cloud deployment, designed to secure your organization against data theft, even in the event of compromised credentials, identity and access management (IAM) misconfigurations, and insider threats. By extending network-layer protection across service-to-service interactions in Google Cloud's infrastructure, VPC-SC goes beyond traditional firewalls and creates an additional layer of defense that prevents access outside your corporate network — and is now easier for your organization to manage.</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud administrators configuring VPC-SC can now include </span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/folder-membership\"><span style=\"text-decoration: underline; vertical-align: baseline;\">folders in perimeter membership</span></a><span style=\"vertical-align: baseline;\">, automatically extending the folder’s access policy to every project and nested subfolder it contains. New workloads can inherit protection by default, with no further modification.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_3FNaYFP.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Simplified perimeter authoring in VPC-SC.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Perimeter membership updates when a project is moved, simplifying lifecycle maintenance. Security coverage follows the resource hierarchy that your organization already governs, and compliance verification requires only confirming that the resource is located in the correct part of the hierarchy. </span></p>\n<p><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/dry-run-mode\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dry-run mode</span></a><span style=\"vertical-align: baseline;\"> also supports folder membership, helping administrators evaluate the effect of a hierarchy-wide perimeter against live traffic before enforcement.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Folder and organization support in ingress and egress rules</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Well-defined </span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/ingress-egress-rules\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ingress and egress rules</span></a><span style=\"vertical-align: baseline;\"> establish granular, context-aware perimeters without sacrificing operational flexibility across complex multi-project environments. Security administrators can now specify Google Cloud folders and organizations directly within those rules. A single hierarchy reference stands in for the set of projects beneath it, which keeps rules concise, keeps attribute counts well within quota limits, and extends access automatically to projects created later in the hierarchy.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_0mJoqDI.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2 : Simplified authoring of ingress/egress rules.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Using Private Service Connect endpoints in ingress and egress rules</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Enterprises increasingly use private paths to reach desired endpoints in their deployment instead of exposing the traffic to the internet. </span><a href=\"https://docs.cloud.google.com/vpc/docs/configure-private-service-connect-apis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Private Service Connect endpoints for Google APIs</span></a><span style=\"vertical-align: baseline;\"> are now supported as an attribute in ingress and egress rules. Administrators can author a rule that authorizes access specifically over a designated private endpoint, producing a policy that corresponds directly to the connectivity architecture it is intended to govern. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_CbtErt8.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Supporting Private Service Connect endpoints with ingress and egress rules.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For organizations that have standardized on Private Service Connect, including endpoints propagated across the estate through </span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Network Connectivity Center</span></a><span style=\"vertical-align: baseline;\">, this provides both a more precise and a more concise means of expressing source for the request.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Service patterns in VPC accessible services</strong></h3>\n<p><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/manage-service-perimeters#accessible-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Service patterns in VPC accessible services</span></a><span style=\"vertical-align: baseline;\"> provide granular control over Google APIs accessed with private Virtual IP addresses (VIP), permitting interoperability beyond just VPC-SC integrated services. If the workload requires controlled access to validated API endpoints over a private path, administrators can now allow only the specific API URL patterns required. </span></p>\n<p><span style=\"vertical-align: baseline;\">Additionally, the capability supports appending org-restriction-headers with egress requests to facilitate access to only authorized domains and resources. Because you don’t need to manage egress-proxy, you can accommodate legitimate operational requirements while maintaining a tightly-bounded private path, instead of choosing between a broad allowance and no access at all.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_axZIku2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 4: Granular control over Google APIs with service patterns in VPC accessible services.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Guided violation remediation</strong></h3>\n<p><span style=\"vertical-align: baseline;\">VPC-SC perimeter policies evolve continuously alongside the workloads they protect, and administrators periodically need to authorize a legitimate access request not yet covered. New </span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/remediation-suggestions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Guided Violation Remediation</span></a><span style=\"vertical-align: baseline;\"> in VPC-SC Violation Analyzer cuts resolution time for blocked requests from days to minutes by generating a policy fix with remediation recommendations, which you can validate in Dry-Run mode first. </span></p>\n<p><span style=\"vertical-align: baseline;\">Rather than just diagnosing why the violation occurred for a given denial, Violation Analyzer evaluates the blocked request against the applicable perimeter configuration, and proposes a specific configuration change, narrowly scoped by least-privilege design principles, to authorize the traffic: an ingress rule, an egress rule, an access level, or an update to VPC accessible services. This relieves pressure on administrators to broadly open up a perimeter just to resolve a violation and get an application working quickly. </span></p>\n<p><span style=\"vertical-align: baseline;\">Read more about how BlackLine uses Violation Analyzer to </span><a href=\"https://cloud.google.com/blog/topics/customers/how-blackline-prevents-data-exfiltration-with-vpc-service-controls?e=13802955\"><span style=\"text-decoration: underline; vertical-align: baseline;\">streamline investigations</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/fig5.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 5 : VPC-SC Violation Remediation for faster turn-around.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">VPC-SC makes it simple and automated to deploy and refine granular network perimeter protection, even for autonomous agents. To get started:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Establish your folder baseline</strong><span style=\"vertical-align: baseline;\">: Identify the folders in your resource hierarchy that correspond to the boundaries you intend to enforce, and define perimeters around them so that new workloads inherit policy on creation. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Run risk-free in Dry-Run mode</strong><span style=\"vertical-align: baseline;\">: Observe production traffic safely without blocking active developers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unblock traffic with Violation Analyzer and Violation Dashboard</strong><span style=\"vertical-align: baseline;\">: Use automated least-privilege remediation recommendations to resolve any  denials that surface. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enforce with confidence</strong><span style=\"vertical-align: baseline;\">: Secure your full data estate by transitioning to enforcement once your dry-run logs show your intended access with clean, authorized traffic.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">To learn more about how VPC-SC can help simplify your data security posture and confidently secure your autonomous agent fleets, check out the </span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC-SC documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
