  "c7ef1db7e2f87c6604fa87d8581fd3ae":
    "id": "c7ef1db7e2f87c6604fa87d8581fd3ae"
    "title": "AlloyDB と Memorystore for Valkey で AI エージェントの長期記憶を実装する方法"
    "link": "https://cloud.google.com/blog/ja/products/databases/implementing-long-term-ai-agent-memory-in-alloydb-and-memorystore/"
    "published": "2026-10-16 11:00:00"
    "fetched": "2026-10-16 14:28:05"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 2 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/implementing-long-term-ai-agent-memory-in-alloydb-and-memorystore?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">エンタープライズ AI エージェントが、複数日にわたる複雑なワークフローや長期にわたるタスクを実行するには、永続メモリが必要です。このブログ投稿では、短期バッファメモリに </span><a href=\"https://docs.cloud.google.com/memorystore/docs/valkey\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Memorystore for Valkey</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> を、長期永続メモリに </span><a href=\"https://cloud.google.com/alloydb/ai\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">AlloyDB AI</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> を使用する 2 層メモリ アーキテクチャによって、重要なデータとエンタープライズ ガードレールを維持しながら、トークン消費量を最大 70% 削減する仕組みを見ていきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">たとえば、ユーザーの休暇の予約を支援する、パーソナライズされた旅行エージェントを構築するとします。ユーザーは数日間にわたってエージェントと何度もやり取りし、旅行プランのアイデア出しから具体的な購入・予約の検討に至るまで、さまざまな質問をします。真にシームレスなエクスペリエンスを提供するには、このエージェントは、以前のセッションで設定されたフライトの好み（例: 「直行便のみ」）、ホテルの予算、食事の要望（例: 「グルテンフリーのメニューが必要」）を記憶しておく必要があります。さらに重要なのは、会話が観光のおすすめや旅行プランの計画といった細かい内容に深入りしても、これらの重要情報を保持する必要がある点です。エージェントは、追加の質問や訪問先に関する魅力的な詳細情報によって、ユーザーの基本的な要件や決定事項を忘れたり上書きしたりすることがないようにしなければなりません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ステートフルなワークフローは、LLM のステートレスな性質と本質的に矛盾する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI エージェントは、マルチターンの会話や長期にわたるワークフローに活用されていますが、大規模言語モデル（LLM）はセッション間でステートレスのままとなっています。ユーザーが数日後にエージェントを再び利用する際、モデルはコンテキスト ウィンドウが空の状態で処理を開始します。アプリケーションがエージェントの長期メモリを使用して過去のコンテキストを再構築するように設計されていない限り、ユーザーは目標とコンテキストを最初から説明し直す必要があるため、ストレスのたまる断片的なユーザー体験になってしまいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">100 万トークンのコンテキスト ウィンドウが標準となった現在、この問題に対する手っ取り早い解決策としてよく使われるのは「コンテキスト スタッフィング」です。これは、未加工のチャット履歴からツールの実行ログまで、プロンプトに収まるあらゆるものを会話のターンごとに詰め込むというものです。実際、これは AI モデルが使用され始めた初期によく見られたパターンです。しかし、この手っ取り早い解決策では、規模が大きくなるとすぐに問題が発生します。メッセージごとのトークン消費量が倍増し、単純なプロンプトでも応答時間が 30 秒を超えるようになり、モデルでは「</span><a href=\"https://arxiv.org/abs/2307.03172\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">lost in the middle（情報の埋もれ）</span></a><span style=\"vertical-align: baseline;\">」と呼ばれる精度低下が生じ、大量のプロンプト テキストに埋もれた重要な指示を見落とすようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">もう一つの一般的な回避策は、ローリング サマリーを使用することです。これは LLM に古いメッセージを定期的に要約して、短い文章に圧縮するよう指示する手法です。これによりプロンプトのサイズは削減されますが、LLM ベースの要約は本質的に情報の欠落を伴います。数回の圧縮を繰り返すうちに、些細ながらも重要な詳細がバックグラウンド ノイズとして除去されてしまうからです。数ターンも経つと、エージェントはユーザーが最初に設定した制約を、いつの間にか無視するようになります。以前の会話やマルチターン タスクの記憶を保持するには、ユーザー体験の低下や、新たなボトルネックの発生を回避したうえでの、よりスケーラブルなアプローチが必要であることは明らかです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">2 層メモリ アーキテクチャの実装</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ガードレールと制約を遵守し、信頼性と費用対効果に優れたエンタープライズ エージェントを構築するには、</span><strong style=\"vertical-align: baseline;\">2 層メモリ アーキテクチャ</strong><span style=\"vertical-align: baseline;\">の採用をおすすめします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">短期セッション バッファ</strong><span style=\"vertical-align: baseline;\">: トークン数で制限されたスライディング ウィンドウを使用して、アクティブな会話ターンをメモリにキャッシュします。これにより、デバイスをまたいだ複数回のやり取りでもコンテキスト ウィンドウのデータ量を一定に保ち、直近のメッセージを常に最新の状態に保つことができます。この階層では、ターンごとに 1 ミリ秒未満の高速かつ高スループットなルックアップが必要となるため、</span><a href=\"https://docs.cloud.google.com/memorystore/docs/valkey\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Memorystore for Valkey</span></a><span style=\"vertical-align: baseline;\"> がアクティブなセッション状態の維持に最適です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">長期永続メモリ</strong><span style=\"vertical-align: baseline;\">: 重要な事実、ユーザーの好み、エピソード的事実をセッションをまたいで保存します。この階層では、トランザクションの整合性、データ ガバナンス、リレーショナル データとベクトルにわたるハイブリッド検索が必要となります。これらは、</span><a href=\"https://cloud.google.com/alloydb/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI</span></a><span style=\"vertical-align: baseline;\"> がネイティブに提供する機能です。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">長期記憶とアクティブ セッション バッファの両方をリレーショナル データベースに直接保存することも可能ですが、インメモリ キャッシュを備えた 2 層アーキテクチャの方がパフォーマンスとスケーラビリティが向上します。アクティブ セッション バッファは非常に一時的なもので、会話のターンごとに 1 ミリ秒未満の高スループットな更新が必要です。これらの高頻度で発生する書き込みをインメモリ Key-Value キャッシュで処理することで、リレーショナル データベースでの書き込みの増大とテーブルの肥大化を防ぎます。これを行わないと、頻繁な行の削除や負荷の高いバキューム処理が必要になってしまいます。これは、データベースの前段にキャッシュ階層を追加して、アクセスが集中している行への高頻度なルックアップをオフロードするのと同様の仕組みです。この分業により、プライマリ データベースは負荷を抑えて応答性の高い状態を維持し、トランザクションの整合性、複雑なハイブリッド ベクトル検索、長期的な分析クエリの実行など、本来の目的にリソースを集中させることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Memorystore for Valkey の短期キャッシュと AlloyDB AI のネイティブ機能を組み合わせることで、エンティティ抽出、メモリ圧縮、セッションをまたいだメモリ、ハイブリッド検索をデータベース層内で直接実行し、アクティブなプロンプトを軽量かつ高速に維持し、優れた費用対効果を実現できます。</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;AlloyDB の 30 日間の無料トライアル インスタンスを使ってみる&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c99f50&gt;), (&#x27;btn_text&#x27;, &#x27;&#x27;), (&#x27;href&#x27;, &#x27;&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">4 種類のメモリについて</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントの長期的なステートを効果的に整理するために、エージェントのメモリを、前述の短期ストレージ レイヤと長期ストレージ レイヤにわたる、互いに補完し合う 4 つのタイプにさらに分割します。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">メモリのタイプ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">保存される内容</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ストレージ レイヤ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">存続期間</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">バッファ（短期）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">直近の未加工の会話履歴</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Memorystore for Valkey</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">アクティブなセッション</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">要約メモリ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">古いターンの履歴を圧縮する（一般に「コンパクション」と呼ばれる）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Memorystore for Valkey</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">マルチターン ウィンドウ</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">エピソード記憶</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">過去のアクション、イベント、ツールの出力</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB for PostgreSQL（構造化 SQL + 全文検索 + ベクトルによるハイブリッド検索）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">永続的</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">エンティティとルールの記憶</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーの好み、制約、禁止事項</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB for PostgreSQL（構造化 SQL + 全文検索 + ベクトルによるハイブリッド検索）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">永続的</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">短期的な会話コンテキストを構造化された長期的なルールから分離することで、エージェントは、トークン ウィンドウを未加工のインタラクション ログで埋め尽くすことなく、関連するコンテキストをオンデマンドで取得できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">階層型メモリ アーキテクチャのブループリント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">以下の図は、アプリケーション オーケストレーション レイヤ、</span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\"> の短期バッファ、</span><strong style=\"vertical-align: baseline;\">AlloyDB AI</strong><span style=\"vertical-align: baseline;\"> の長期リポジトリを接続する読み取りパスと書き込みパスの概要を示しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_dkY04WA.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このシステムは、以下の 2 つの連携した実行パスで動作します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">読み取りパス</strong><span style=\"vertical-align: baseline;\">: ユーザーが質問すると、アプリケーションは </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\"> からアクティブなスライディング ウィンドウを取得し、</span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\"> を使用してデータベース内クエリの正規化を実行します。そして </span><code style=\"vertical-align: baseline;\">ai.hybrid_search</code><span style=\"vertical-align: baseline;\"> を使用して </span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\"> にクエリを送信し、スコープ設定されたエンティティ ルールと関連するエピソード的事実を取得します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">書き込みパス</strong><span style=\"vertical-align: baseline;\">: 回答が生成されると、会話のターンはすぐに </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\"> にキャッシュされます。非同期のバックグラウンド キュー ワーカーが、会話のやり取りから構造化エンティティを抽出し、</span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\"> に直接書き込みます。AlloyDB では、トランザクション自動エンベディングによってベクトル表現が即座に計算され、データベースに保存されます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ビジネスへの影響と費用対効果</strong></h4>\n<p><span style=\"vertical-align: baseline;\">開発におけるマルチターンの対話（45 ターン以上、大量のツール実行）を対象としたベンチマーク テストでは、短期キャッシュを長期永続化から分離することで、単純なコンテキスト スタッフィングと比較して、費用削減とパフォーマンス向上を実現しました。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">指標 / ディメンション</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">単純なコンテキスト スタッフィング</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">階層型メモリ（AlloyDB + Valkey）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ビジネスへの最終的な影響</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">アクティブなプロンプトのサイズ（45 ターン目）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">747,033 トークン</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">83,262 トークン</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">プロンプトが 88.9% 縮小</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">45 ターン目のレスポンス レイテンシ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">33.5 秒</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">6.7 秒</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">80.0% 高速なレスポンス</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ターンごとのレスポンスまでの待ち時間</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">33.5 秒</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4.2～6.7 秒</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">36%～80% 削減</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">累積セッション トークン</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1,790 万トークン</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">409 万トークン</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">トークンと費用を 72.0% 削減</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ルールと制約の再現率</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ターンごとに低下</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">低下しない</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ACID を維持した再現率</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">注: 上記の指標は、実際のエンタープライズ AI ペア プログラミング アシスタントが、複数のセッション、プロジェクト、コンテキストの切り替えにわたって開発者とやり取りする様子を再現した、シミュレートされた開発ワークロードに基づく内部ベンチマーク結果を反映したものです。実際の費用削減とレイテンシは、プロンプトの構造、クエリの頻度、データ量によって異なります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの結果は、階層型メモリがエージェントのユニット エコノミクスをどのように変化させるかを示しています。ターンが追加されるたびに費用曲線が上昇するのではなく、プロンプト サイズが一定の範囲内に収まるため、高速の応答時間を維持しながら、継続的な LLM API 費用を削減できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AlloyDB AI の核となる技術的メリット</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">AlloyDB AI</strong><span style=\"vertical-align: baseline;\"> は、コア AI 機能をデータベース エンジンに直接組み込むことで、永続的なエージェント メモリの実装に伴う運用上のオーバーヘッドを削減します。その主な特長は以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データベース内トランザクション自動エンベディング（</strong><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/generate-manage-auto-embeddings-for-tables\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ai.initialize_embeddings</strong></a><strong style=\"vertical-align: baseline;\">）</strong><span style=\"vertical-align: baseline;\">: AlloyDB は、</span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform</strong></a><span style=\"vertical-align: baseline;\">（旧称 Vertex AI）とのネイティブ統合を使用して、テキスト列のベクトル エンベディングを自動的に生成し、1 秒あたり最大 3,000 個のエンベディングを処理できます。</span><code style=\"vertical-align: baseline;\">incremental_refresh_mode =&gt; 'transactional'</code><span style=\"vertical-align: baseline;\"> を使用すると、AlloyDB は同じトランザクション内でソースデータが変更されるとエンベディングを最新の状態に保つため、カスタム エンベディング パイプライン、外部スケジューラ、複雑な再試行ロジックが不要になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データベース内生成 AI 関数（</strong><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/evaluate-semantic-queries-ai-operators\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ai.generate</strong></a><strong style=\"vertical-align: baseline;\">）</strong><span style=\"vertical-align: baseline;\">: AlloyDB では、Gemini などの基盤モデルを SQL クエリから直接実行できます。これを使用すると、データベース内でクエリを分解できます。つまり、ユーザーの複合的な質問を単一の要素からなるサブクエリに分割し、相対的な時間表現（「前回のセッション」など）を明示的な識別子に解決できます。アプリケーション側で個別にラウンドトリップを行う必要もありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">組み込みの Reciprocal Rank Fusion（</strong><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ai.hybrid_search</strong></a><strong style=\"vertical-align: baseline;\">）によるネイティブ ハイブリッド検索</strong><span style=\"vertical-align: baseline;\">: AlloyDB は、エンジン内で直接 Reciprocal Rank Fusion（RRF）を実行する組み込み SQL 関数を提供します。ベクトル コサイン類似度（HNSW または ScaNN インデックスに対する </span><code style=\"vertical-align: baseline;\">&lt;=&gt;</code><span style=\"vertical-align: baseline;\">）と PostgreSQL 全文検索（BM25、RUM、または GIN を使用）を 1 回のデータベース呼び出しで組み合わせ、セマンティック マッチングと正確なキーワード検索を融合させます。同時に、メタデータ フィルタ プッシュダウン（</span><code style=\"vertical-align: baseline;\">filter_condition</code><span style=\"vertical-align: baseline;\">）をサポートすることで、パフォーマンスの向上と確定的なスコープ分離を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">IAM 認証情報を使用した Agent Platform との直接統合</strong><span style=\"vertical-align: baseline;\">: AlloyDB は、</span><a href=\"https://cloud.google.com/products/iam\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud IAM</span></a><span style=\"vertical-align: baseline;\"> サービス アカウントのロールとデータベース認証を使用して、Google Cloud のプライベート ネットワーク経由で </span><strong style=\"vertical-align: baseline;\">Agent Platform</strong><span style=\"vertical-align: baseline;\"> 基盤モデルに直接接続します。これにより、アプリケーション コードで API キーを保存、ローテーション、受け渡す必要がなくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">運用、ベクトル、ガバナンスの統合エンジン</strong><span style=\"vertical-align: baseline;\">: AlloyDB は、リレーショナル ビジネスデータ、ベクトル エンベディング、全文インデックス、エンタープライズ権限を、ACID 準拠の単一の PostgreSQL データベースに統合します。これにより、個別の運用データベースとベクトル データベース間で発生するデータのドリフトや統合の複雑さを回避できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">主な実装パターン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">以下は、2 層メモリ アーキテクチャの構成に使用されるコア データベース パターンです。実行可能な完全な Python スクリプトと SQL スクリプトについては、対応する </span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB エージェント メモリ Codelab</span></a><span style=\"vertical-align: baseline;\"> をご覧ください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. スキーマと自動エンベディングの設定</strong></p>\n<p><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\"> で、必要な拡張機能をインストールし、構造化メタデータ、全文検索用に生成された </span><code style=\"vertical-align: baseline;\">tsvector</code><span style=\"vertical-align: baseline;\"> 列、ベクトル エンベディング列を含む </span><code style=\"vertical-align: baseline;\">agent_entities</code><span style=\"vertical-align: baseline;\"> テーブルを定義します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 1. Enable AI extensions\\r\\nCREATE EXTENSION IF NOT EXISTS google_ml_integration CASCADE;\\r\\nCREATE EXTENSION IF NOT EXISTS vector CASCADE;\\r\\nCREATE EXTENSION IF NOT EXISTS rum CASCADE;\\r\\n\\r\\n-- 2. Create structured entity &amp; preference table\\r\\nCREATE TABLE IF NOT EXISTS agent_entities (\\r\\n    entity_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\\r\\n    user_id TEXT NOT NULL,\\r\\n    entity_name TEXT NOT NULL,\\r\\n    project_id TEXT DEFAULT &#x27;global&#x27;,\\r\\n    session_id TEXT,\\r\\n    scope TEXT NOT NULL DEFAULT &#x27;session&#x27;,\\r\\n    summary TEXT NOT NULL,\\r\\n    summary_embedding VECTOR(768),\\r\\n    summary_tsv TSVECTOR GENERATED ALWAYS AS (\\r\\n        to_tsvector(&#x27;english&#x27;, entity_name || &#x27; &#x27; || summary)\\r\\n    ) STORED,\\r\\n    updated_at TIMESTAMPTZ DEFAULT NOW(),\\r\\n    UNIQUE (user_id, entity_name)\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c98d10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">次に、</span><code style=\"vertical-align: baseline;\">ai.initialize_embeddings</code><span style=\"vertical-align: baseline;\"> を使用してエンベディングを生成します。</span><code style=\"vertical-align: baseline;\">トランザクション</code><span style=\"vertical-align: baseline;\"> モードを使用すると、ソースデータの変更に応じてエンベディングが最新の状態に保たれます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Register transactional in-database auto-embedding\\r\\nCALL ai.initialize_embeddings(\\r\\n    model_id =&gt; &#x27;text-embedding-005&#x27;,\\r\\n    table_name =&gt; &#x27;agent_entities&#x27;,\\r\\n    content_column =&gt; &#x27;summary&#x27;,\\r\\n    embedding_column =&gt; &#x27;summary_embedding&#x27;,\\r\\n    incremental_refresh_mode =&gt; &#x27;transactional&#x27;,\\r\\n    batch_size =&gt; 10\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c98450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">最後に、HNSW ベクトル インデックスと RUM 全文検索インデックスを作成して、ハイブリッド検索を高速かつ効率的に行えるようにします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Create vector and full-text indexes\\r\\nCREATE INDEX IF NOT EXISTS agent_entities_embedding_idx\\r\\n    ON agent_entities USING hnsw (summary_embedding vector_cosine_ops);\\r\\n\\r\\nCREATE INDEX IF NOT EXISTS agent_entities_tsv_idx\\r\\n    ON agent_entities USING rum (summary_tsv rum_tsvector_ops);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c9a650&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">2. ネイティブ ハイブリッド検索による長期記憶のクエリ</strong></p>\n<p><span style=\"vertical-align: baseline;\">読み取りパスで、</span><code style=\"vertical-align: baseline;\">ai.hybrid_search</code><span style=\"vertical-align: baseline;\"> を使用して関連する長期エンティティを取得します。このネイティブ SQL 関数は、AlloyDB で直接 Reciprocal Rank Fusion（RRF）を実行し、ベクトル類似性検索と全文キーワード検索の結果をシームレスに再ランキングして、単一のデータベース クエリに結合します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;def retrieve_hybrid_entities(\\r\\n    conn,\\r\\n    user_id: str,\\r\\n    project_id: str,\\r\\n    query_text: str,\\r\\n    query_vector_literal: str,\\r\\n    limit: int = 3\\r\\n) -&gt; dict[str, Any]:\\r\\n    &quot;&quot;&quot;Queries long-term memory using AlloyDB native hybrid_search (RRF).&quot;&quot;&quot;\\r\\n    filter_cond = f&quot;user_id = \\&#x27;{user_id}\\&#x27; AND (project_id = \\&#x27;{project_id}\\&#x27; OR scope = \\&#x27;global\\&#x27;)&quot;\\r\\n    \\r\\n    search_inputs = [\\r\\n        json.dumps({\\r\\n            &quot;data_type&quot;: &quot;vector&quot;,\\r\\n            &quot;weight&quot;: 0.4,\\r\\n            &quot;table_name&quot;: &quot;agent_entities&quot;,\\r\\n            &quot;key_column&quot;: &quot;entity_name&quot;,\\r\\n            &quot;vec_column&quot;: &quot;summary_embedding&quot;,\\r\\n            &quot;distance_operator&quot;: &quot;&lt;=&gt;&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;query_vector&quot;: query_vector_literal,\\r\\n            &quot;filter_condition&quot;: filter_cond\\r\\n        }),\\r\\n        json.dumps({\\r\\n            &quot;data_type&quot;: &quot;text&quot;,\\r\\n            &quot;weight&quot;: 0.6,\\r\\n            &quot;table_name&quot;: &quot;agent_entities&quot;,\\r\\n            &quot;key_column&quot;: &quot;entity_name&quot;,\\r\\n            &quot;text_column&quot;: &quot;summary_tsv&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;ranking_function&quot;: &quot;ts_rank&quot;,\\r\\n            &quot;query_text_input&quot;: query_text,\\r\\n            &quot;filter_condition&quot;: filter_cond\\r\\n        })\\r\\n    ]\\r\\n\\r\\n    query_sql = &quot;&quot;&quot;\\r\\n        SELECT e.entity_name, e.summary, e.project_id, e.scope, e.updated_at\\r\\n        FROM ai.hybrid_search(\\r\\n          search_inputs =&gt; %s::JSONB[],\\r\\n          include_json_output =&gt; false\\r\\n        ) h\\r\\n        JOIN agent_entities e ON e.entity_name = h.id\\r\\n        WHERE e.user_id = %s\\r\\n        LIMIT %s;\\r\\n    &quot;&quot;&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c98990&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. AI 関数を使用したデータベース内メモリ圧縮</strong></p>\n<p><span style=\"vertical-align: baseline;\">カスタムのプルーニング スクリプトを記述せずに長期的なストレージの増加を管理するには、</span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\"> で自動抽出および圧縮クエリを直接実行して、保存しておくべき重要な部分を特定します。このパターンでは、SQL 共通テーブル式（CTE）と </span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\"> を使用して、古いエピソード的事実の履歴を高密度の要約に統合します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Consolidate older episodic logs into a permanent summary\\r\\nWITH old_events AS (\\r\\n    SELECT document AS content\\r\\n    FROM langchain_pg_embedding\\r\\n    WHERE cmetadata-&gt;&gt;&#x27;user_id&#x27; = &#x27;user_dev_42&#x27;\\r\\n      AND created_at &lt; NOW() - INTERVAL &#x27;30 days&#x27;\\r\\n    ORDER BY created_at ASC\\r\\n    LIMIT 50\\r\\n),\\r\\nconsolidated AS (\\r\\n    SELECT ai.generate(\\r\\n        &#x27;Summarize these historical events into a dense memory paragraph:\\\\n&#x27; || string_agg(content, E&#x27;\\\\n&#x27;),\\r\\n        model_id =&gt; &#x27;gemini-3.5-flash&#x27;\\r\\n    ) AS summary_text\\r\\n    FROM old_events\\r\\n)\\r\\nINSERT INTO agent_entities (user_id, entity_name, summary, updated_at)\\r\\nSELECT &#x27;user_dev_42&#x27;, &#x27;longterm_session_summary&#x27;, summary_text, NOW()\\r\\nFROM consolidated\\r\\nWHERE summary_text IS NOT NULL\\r\\nON CONFLICT (user_id, entity_name)\\r\\nDO UPDATE SET summary = EXCLUDED.summary, updated_at = NOW();&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c022d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">たとえば、子どもを連れて飛行機を乗り継ぐことの複雑さに関する長いやり取りを、「直行便を希望」という要約にまとめることができます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">4. 2 層メモリ アーキテクチャの ADK エージェントへの接続</strong></p>\n<p><span style=\"vertical-align: baseline;\">コアの 2 層メモリ アーキテクチャを構成したら、</span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory#14\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">対応する Codelab</span></a><span style=\"vertical-align: baseline;\"> で示されるように、デフォルトの ADK Memory プロバイダを拡張して、この 2 層メモリ アーキテクチャを使用できます（例: </span><code style=\"vertical-align: baseline;\">ADKTieredMemoryProvider</code><span style=\"vertical-align: baseline;\">）。長期記憶を ADK エージェントにアタッチするには、次のようにツール（例: </span><code style=\"vertical-align: baseline;\">longterm_memory_tool</code><span style=\"vertical-align: baseline;\">）として提供するだけです。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from adk_memory_provider import ADKTieredMemoryProvider\\r\\n\\r\\nagent = Agent(\\r\\n    name=&quot;adk_memory_agent&quot;, model=GEMINI_MODEL, instruction=&quot;Initial instruction&quot;,\\r\\n    tools=[long_term_memory_tool, run_command_tool],\\r\\n    before_tool_callback=guardrail.create_before_tool_callback(USER_ID, &quot;CloudRetail&quot;)\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff497c014d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">エンタープライズ ガバナンスとマルチテナント セキュリティ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エンタープライズの本番環境でエージェント メモリを実行するには、厳格なセキュリティ境界とアクセス制御が必要です。まず、</span><strong style=\"vertical-align: baseline;\">スコープとマルチテナントの分離</strong><span style=\"vertical-align: baseline;\">を維持する必要があります。</span><code style=\"vertical-align: baseline;\">agent_entities</code><span style=\"vertical-align: baseline;\"> の </span><code style=\"vertical-align: baseline;\">user_id</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">project_id</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">scope</code><span style=\"vertical-align: baseline;\"> 列にインデックスを付け、PostgreSQL の行レベル セキュリティ（RLS）を適用することで、同じデータベース クラスタ内の部門、チーム、個々のユーザー間でメモリストアを分離できます。</span><a href=\"https://docs.cloud.google.com/alloydb/docs/parameterized-secure-views-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パラメータ化されたセキュアビュー</span></a><span style=\"vertical-align: baseline;\">（PSV）は、もう一つの確定的なアプリケーション レベルのセキュリティ レイヤを提供し、悪意のあるプロンプトや過度に広範な SQL クエリから保護するのに役立ちます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、上記の実装パターンに示すように、</span><strong style=\"vertical-align: baseline;\">メモリ ライフサイクルの自動管理</strong><span style=\"vertical-align: baseline;\">を提供する必要があります。スケジュールされた SQL コンパクション クエリと時間ベースのパーティション プルーニングを組み合わせることで、データベースのフットプリントとクエリのレイテンシを長期にわたって予測可能な状態に維持できます。このアプローチの詳細については、</span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">対応する Codelab</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">まとめと次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">アクティブなコンテキスト ウィンドウを永続ストレージから分離することは、プロダクション レディな AI エージェントを構築するための実用的なアプローチです。1 ミリ秒未満のセッション キャッシュを実現する </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\"> と、トランザクション対応の長期ストレージである </span><strong style=\"vertical-align: baseline;\">AlloyDB AI</strong><span style=\"vertical-align: baseline;\"> を組み合わせることで、長期にわたるタスクや複数ターンのエージェント エクスペリエンス全体で厳格なビジネスルールを維持しながら、トークン費用を大幅に削減し、応答時間を短縮できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">利用方法は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">対応する </span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB エージェント メモリ Codelab</span></a><span style=\"vertical-align: baseline;\"> の実践的なチュートリアルを最後まで進め、実際に動作する 2 層メモリ アーキテクチャをデプロイします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データベース側の ML 機能の詳細については、</span><a href=\"https://cloud.google.com/alloydb/docs/ai/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI のドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/generate-manage-auto-embeddings-for-tables\"><span style=\"text-decoration: underline; vertical-align: baseline;\">自動ベクトル エンベディングの生成</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ハイブリッド ベクトル検索の実行</span></a><span style=\"vertical-align: baseline;\">に関するガイドをご覧ください。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、AlloyDB AI シニア エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Itai Rosenblatt</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、AlloyDB AI / Cloud SQL 担当プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Paul Ramsey</strong></p></div>"
  "86836115cd7bafb5d8533d9a39a74c6b":
    "id": "86836115cd7bafb5d8533d9a39a74c6b"
    "title": "GKE CPU 起動ブースト: オーバープロビジョニングなしでアプリの起動を高速化"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-cpu-startup-boost-faster-pod-starts-lower-costs/"
    "published": "2026-10-16 10:00:00"
    "fetched": "2026-10-16 19:45:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 3 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-cpu-startup-boost-faster-pod-starts-lower-costs?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">トラフィックの急増に対応してマイクロサービスを起動する場合でも、新しいソフトウェア リリースをデプロイする場合でも、アプリケーション レプリカをスケールアップする場合でも、Google Kubernetes Engine（GKE）で実行されるアプリケーションの高速で応答性の高いユーザー エクスペリエンスを維持するには、</span><strong style=\"vertical-align: baseline;\">Pod の起動時間</strong><span style=\"vertical-align: baseline;\">が重要です</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_mhC0eeP.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>しかし、プラットフォーム エンジニアと開発者は、アプリケーションが起動時に定常状態の運用時よりも大幅に多くの CPU パワーを必要とすることが多いという、根強いジレンマに直面しています。通常の定常状態の使用量に合わせて CPU リクエストをサイジングすると、起動時に CPU スロットリングが発生し、コールド スタートの遅延や、readiness プローブのタイムアウトにつながる可能性があります。逆に、短時間の起動バーストに対応するためにベースライン CPU リクエストをオーバープロビジョニングすると、貴重なコンピューティング リソースが無駄になり、インフラストラクチャの費用が膨らみます。</p><p>このたび、GKE 向け<a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/boost-application-startup\"> <b>CPU 起動ブースト</b></a>のプレビュー版をリリースいたしました。GKE の VerticalPodAutoscaler（VPA）に直接統合された CPU 起動ブーストは、初期化中にコンテナの CPU 割り当てを動的に引き上げ、アプリケーションの準備が整うとシームレスにベースラインの定常状態レベルにスケールバックします。<b>コンテナを再起動する必要はありません。</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">最新のアプリケーションが起動時に追加の CPU を必要とする理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">新しいコンテナが起動すると、ユーザー リクエストの処理を開始する前に、負荷の高い初期化タスクが実行されることがあります。技術スタックによっては、起動時のワークロードで膨大な CPU サイクルが必要となります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Java JVM アプリケーション</strong><span style=\"vertical-align: baseline;\">: Spring Boot などのフレームワークでは、クラスの読み込み、クラスパスのスキャン、依存関係インジェクション コンテナのインスタンス化、ジャストインタイム（JIT）コンパイルの実行に、高い CPU バースト性能が必要です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Node.js サーバー</strong><span style=\"vertical-align: baseline;\">: アプリは JavaScript ファイルを解析し、複雑なモジュール依存関係ツリー（</span><code style=\"vertical-align: baseline;\">require</code><span style=\"vertical-align: baseline;\">/</span><code style=\"vertical-align: baseline;\">import</code><span style=\"vertical-align: baseline;\">）を構築し、初期実行時に V8 エンジンの最適化と JIT コンパイルパスを実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Python と AI / ML マイクロサービス</strong><span style=\"vertical-align: baseline;\">: これらのサービスは、初期サイクルで、重いライブラリ（PyTorch、NumPy、LangChain など）のインポート、</span><code style=\"vertical-align: baseline;\">.pyc</code><span style=\"vertical-align: baseline;\"> バイトコードのコンパイル、ORM データベース スキーマの確立、キャッシュ構造のプリロードを行います。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">定常状態のパフォーマンスに合わせて CPU リクエストを厳密にサイジングすると、これらの初期化ワークロードでは起動時に CPU スロットリングが発生し、readiness プローブが遅延します。コールド スタートの遅延を防ぐために、CPU リクエストをオーバープロビジョニングするケースがよく見られます。しかし、アプリケーションが安定すると、それらの余分な CPU リソースはアイドル状態になり、何のメリットもないままクラウド費用を増加させることになります。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_zZExLw4.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><b>CPU 起動ブーストが役立つ仕組み</b></p><p>CPU 起動ブーストは、起動時にワークロードに一時的な vCPU「ブースト」を与え、初期化が完了すると自動的にベースラインに戻すことで、この問題を解決します。</p><p>主な利点:</p><ul><li><b>コールド スタートの高速化</b>: アプリケーションの初期化時間を最大 <b>2 倍</b>短縮し、予期しないトラフィックの急増時に自動スケーリングの応答性を向上させます。</li><li><b>クラウド支出の最適化</b>: アイドル状態の起動ヘッドルームに費用をかけるのではなく、実際のランタイムのニーズに合わせて定常状態の CPU リクエストを適切にサイジングします。</li><li><b>Pod の再起動が不要</b>: 動的なリソースのサイズ変更は、実行中のコンテナ内で直接行われます。</li><li><b>柔軟なポリシー制御</b>: Pod レベルのシンプルな乗数係数（起動時に CPU を 2 倍にするなど）を適用したり、複雑なマルチコンテナ Pod に対してコンテナ固有のきめ細かいルールを定義したりできます。</li></ul>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">仕組み: Kubernetes のインプレース Pod サイズ変更</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これまで、Pod のリソース リクエストや上限を変更するには、Pod を削除して再作成する必要がありました。このように影響の大きいプロセスは、コンテナの再起動、キャッシュの無効化、そしてノードの再スケジューリングによるオーバーヘッドを引き起こしていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これを解決するために、CPU 起動ブーストは Kubernetes の</span><a href=\"https://kubernetes.io/docs/tasks/configure-pod-container/resize-container-resources/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">インプレース Pod サイズ変更（IPPR）</span></a><span style=\"vertical-align: baseline;\">を基盤としています。</span></p>\n<p><a href=\"https://github.com/kubernetes/enhancements/tree/master/keps/sig-node/1287-in-place-pod-resize\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">KEP-1287</span></a><span style=\"vertical-align: baseline;\"> として管理されている IPPR は、動的なインプレース リソース ミューテーションを導入しました。Kubernetes 1.27 でアルファ版として導入され、v1.33 でベータ版に昇格、v1.35 で一般提供（GA）となった IPPR を使用すると、Kubernetes コントロール プレーンと </span><code style=\"vertical-align: baseline;\">kubelet</code><span style=\"vertical-align: baseline;\"> が、</span><strong style=\"vertical-align: baseline;\">コンテナ プロセスを再起動することなく</strong><span style=\"vertical-align: baseline;\">、実行中の Pod のコンテナ CPU とメモリのリクエストを更新できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">GKE は、VPA 内の IPPR を活用して、Pod のアドミッション時に起動時の CPU ブーストを適用し、準備完了後にスムーズに引き下げます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">CPU 起動ブーストの仕組み（Pod ライフサイクルの概要）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CPU 起動ブーストは、次の 3 つのフェーズで動作します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アドミッション フェーズ</strong><span style=\"vertical-align: baseline;\">: Pod をデプロイすると、VPA アドミッション Webhook が作成リクエストをインターセプトします。ポリシー（2 倍の乗数や +2 vCPU など）に基づいて引き上げられた CPU リクエストを計算し、追跡アノテーションとともに Pod 仕様に挿入します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">起動フェーズ</strong><span style=\"vertical-align: baseline;\">: Pod がスケジュールされ、ブーストされた CPU 割り当てで初期化されます。アプリケーションは、CPU スロットリングを発生させることなく、クラスの読み込み、JIT コンパイル、モジュールの解析を最高速度で完了します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ブースト解除フェーズ</strong><span style=\"vertical-align: baseline;\">: Pod の </span><code style=\"vertical-align: baseline;\">readinessProbe</code><span style=\"vertical-align: baseline;\"> が成功すると（さらに、構成された </span><code style=\"vertical-align: baseline;\">durationSeconds</code><span style=\"vertical-align: baseline;\"> のクールダウン遅延が経過すると）、VPA アップデータはインプレース サイズ変更リクエストを発行します。コンテナは中断されることなく実行を続け、CPU リクエストはベースライン レベルに戻ります。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">前提条件と提供状況</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CPU 起動ブーストは、GKE でプレビュー版として提供されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE バージョン</strong><span style=\"vertical-align: baseline;\">: Standard クラスタと Autopilot クラスタのバージョン </span><code style=\"vertical-align: baseline;\">1.36.0-gke.4447000</code><span style=\"vertical-align: baseline;\"> 以降。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クラスタモード</strong><span style=\"vertical-align: baseline;\">: GKE Autopilot でネイティブに有効（VPA はデフォルトで有効）。GKE Standard では、垂直 Pod 自動スケーリング（VPA）が有効になっていることを確認するだけです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードのサポート</strong><span style=\"vertical-align: baseline;\">: Deployment や StatefulSet などの標準の Kubernetes コントローラと連携します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">スタートガイド: CPU 起動ブーストを構成する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CPU 起動ブーストの構成は、</span><code style=\"vertical-align: baseline;\">VerticalPodAutoscaler</code><span style=\"vertical-align: baseline;\"> マニフェストに </span><code style=\"vertical-align: baseline;\">startupBoost</code><span style=\"vertical-align: baseline;\"> セクションを追加するだけです。</span></p>\n<h4><span style=\"vertical-align: baseline;\">例 1: 固定定常状態での Pod レベルのブースト（</span><code style=\"vertical-align: baseline;\">updateMode: \"Off\"</code><span style=\"vertical-align: baseline;\">）</span></h4>\n<p><span style=\"vertical-align: baseline;\">定常状態の CPU リクエストをマニフェスト定義にロックしたまま、起動ブーストのみに VPA を使用する場合は、</span><code style=\"vertical-align: baseline;\">updateMode</code><span style=\"vertical-align: baseline;\"> を </span><code style=\"vertical-align: baseline;\">\"Off\"</code><span style=\"vertical-align: baseline;\"> に設定します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: &quot;autoscaling.k8s.io/v1&quot;\\r\\nkind: VerticalPodAutoscaler\\r\\nmetadata:\\r\\n  name: java-app-startup-boost\\r\\n  namespace: default\\r\\nspec:\\r\\n  targetRef:\\r\\n    apiVersion: &quot;apps/v1&quot;\\r\\n    kind: Deployment\\r\\n    name: java-app\\r\\n  updatePolicy:\\r\\n    updateMode: &quot;Off&quot;\\r\\n  startupBoost:\\r\\n    cpu:\\r\\n      type: &quot;Factor&quot;\\r\\n      factor: 2\\r\\n      durationSeconds: 10&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f24459c6dd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">この例では、GKE は起動時にコンテナの CPU リクエストを 2 倍にし、readiness プローブに合格してから 10 秒間、ブーストされた割り当てを維持した後、ベースラインにスケールバックします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">例 2: 起動ブーストと継続的な VPA 自動スケーリングの組み合わせ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GKE で起動時に CPU をブースト</span><strong style=\"vertical-align: baseline;\">し</strong><span style=\"vertical-align: baseline;\">、起動後に定常状態のリソースを継続的に最適化する場合は、</span><code style=\"vertical-align: baseline;\">updateMode</code><span style=\"vertical-align: baseline;\"> を </span><code style=\"vertical-align: baseline;\">\"InPlaceOrRecreate\"</code><span style=\"vertical-align: baseline;\"> に設定します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: &quot;autoscaling.k8s.io/v1&quot;\\r\\nkind: VerticalPodAutoscaler\\r\\nmetadata:\\r\\n  name: nodejs-app-vpa\\r\\n  namespace: default\\r\\nspec:\\r\\n  targetRef:\\r\\n    apiVersion: &quot;apps/v1&quot;\\r\\n    kind: Deployment\\r\\n    name: nodejs-service\\r\\n  updatePolicy:\\r\\n    updateMode: &quot;InPlaceOrRecreate&quot;\\r\\n  startupBoost:\\r\\n    cpu:\\r\\n      type: &quot;Factor&quot;\\r\\n      factor: 3\\r\\n      durationSeconds: 15&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f24459c4c10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong><span style=\"vertical-align: baseline;\">例 3: コンテナレベルでのきめ細かいブースト</span></strong></p>\n<p><span style=\"vertical-align: baseline;\">起動時に追加の CPU を必要としないサイドカー（ロギング エージェントやサービス メッシュ プロキシなど）を実行する Pod の場合は、特定のアプリコンテナをターゲットにします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: &quot;autoscaling.k8s.io/v1&quot;\\r\\nkind: VerticalPodAutoscaler\\r\\nmetadata:\\r\\n  name: app-container-boost\\r\\nspec:\\r\\n  targetRef:\\r\\n    apiVersion: &quot;apps/v1&quot;\\r\\n    kind: Deployment\\r\\n    name: API-gateway\\r\\n  updatePolicy:\\r\\n    updateMode: &quot;Off&quot;\\r\\n  resourcePolicy:\\r\\n    containerPolicies:\\r\\n    - containerName: &quot;web-app&quot;\\r\\n      mode: &quot;Off&quot;\\r\\n      startupBoost:\\r\\n        cpu:\\r\\n          type: &quot;Quantity&quot;\\r\\n          quantity: &quot;2&quot;\\r\\n          durationSeconds: 5&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f24459c4710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">クラスタでの起動ブーストの確認</strong></h4>\n<p><code style=\"vertical-align: baseline;\">kubectl</code><span style=\"vertical-align: baseline;\"> を使用して、GKE が起動ブーストを適用してダウンスケールしたことを確認できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Pod アノテーションを検査する</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">vpaCpuStartupBoost</code><span style=\"vertical-align: baseline;\"> トラッキング アノテーションを確認します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl get pod &lt;POD_NAME&gt; -o yaml&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f24459c4750&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">元のベースラインとブーストされた CPU リクエストを示すアノテーションを探します。</span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">インプレース サイズ変更イベントをモニタリングする</strong><span style=\"vertical-align: baseline;\">: readiness の後、GKE が CPU リクエストをベースラインにスケールダウンしたことを確認します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl get events --field-selector reason=InPlaceResizedByVPA&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f24459c5610&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">reason=InPlaceResizedByVPA</code><span style=\"vertical-align: baseline;\"> のイベントは、起動後のインプレース ダウンスケーリングが成功したことを示しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">本番環境ワークロードのベスト プラクティス</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">HorizontalPodAutoscaler（HPA）との組み合わせ</strong><span style=\"vertical-align: baseline;\">: CPU 起動ブーストと HPA を併用する場合は、堅牢な </span><code style=\"vertical-align: baseline;\">readinessProbe</code><span style=\"vertical-align: baseline;\"> を定義し、</span><code style=\"vertical-align: baseline;\">durationSeconds</code><span style=\"vertical-align: baseline;\"> を短く（例: </span><code style=\"vertical-align: baseline;\">0 秒</code><span style=\"vertical-align: baseline;\">～</span><code style=\"vertical-align: baseline;\">10 秒</code><span style=\"vertical-align: baseline;\">）設定します。これにより、HPA が初期化時の CPU スパイクを定常状態の高負荷と誤って解釈するのを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/configure-capacity-buffer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE Capacity Buffers API</strong></a><strong style=\"vertical-align: baseline;\"> でトラフィックの急増に対応</strong><span style=\"vertical-align: baseline;\">: 大規模な起動オーバーヘッドを削減することで、より少ないノードでワークロードの密度を高め、全体的な使用率を向上させることができます。厳格な SLO を維持しながら、最小限の運用オーバーヘッドでトラフィックの急増を吸収するために、GKE Capacity Buffers API の導入を検討してください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Autopilot のリソース比率</strong><span style=\"vertical-align: baseline;\">: GKE Autopilot では、Pod が有効な CPU とメモリの比率を維持する必要があります。起動時にブーストされた CPU 比率に対応できるよう、ベースラインのメモリ割り当てを確保します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CPU 起動ブーストは、GKE ユーザーに両方のメリットをもたらします。Java、Node.js、Python などの CPU 負荷の高いワークロードのコールド スタートを高速化すると同時に、リソース効率を最大化してクラウド費用を削減します。</span></p>\n<p><span style=\"vertical-align: baseline;\">GKE ワークロードを高速化させるには、以下のリソースをご活用ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/cpu-startup-boost\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE CPU 起動ブーストのドキュメント</span></a><span style=\"vertical-align: baseline;\">を確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/vertical-pod-autoscaling\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE での垂直 Pod 自動スケーリング</span></a><span style=\"vertical-align: baseline;\">の詳細を確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GKE </span><code style=\"vertical-align: baseline;\">1.36.0-gke.4447000</code><span style=\"vertical-align: baseline;\"> 以降を実行している GKE Standard クラスタまたは Autopilot クラスタで、CPU 起動ブーストをお試しください。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Cloud デベロッパー アドボケイト</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Abdel Sghiouar</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">クラウド プロダクト マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Jakub Pawełczak</strong></p></div>"
