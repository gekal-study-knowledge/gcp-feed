"overview": |
  この日は 10 件で、リアルタイムのワールドモデルを TPU で配信する事例、Gemini とデータ基盤の統合、そしてエージェント時代に向けた境界セキュリティと GKE の起動高速化が中心でした。AI インフラでは、AI スタートアップの Visko が Google Cloud TPU のエンジニアと協業し、継続的にストリーミングする Live World Model「Orbis」を Cloud TPU にデプロイした事例が公開されました。キックオフから本番引き渡しまで 30 日です。ライブのワールドモデルを本番で配信するうえでのボトルネックは平均スループットではなく、止まらないリアルタイムの時計に勝つことです。プロンプトを投げてキューで待つオフラインの動画生成とは違い、映像と同期した音声の新しいチャンクは、視聴者が前のチャンクを見終わる前に描画し終えなければならず、間に合わなければ世界が止まります。両社のエンジニアは、動画生成・超解像アップスケーリング・同期音声を組み合わせたエンドツーエンドのライブ推論パイプラインを 1 つの Cloud TPU スライス上に載せ、再生速度の 1.07 倍で描画できるところまで持ち込みました。データ基盤では、ボーダーレスな Lakehouse を Gemini と統合する機能がプレビューで発表されました。企業が実験的なチャットボットから自律的なエージェントへと AI の使い方を移すと、複数クラウド・SaaS・オンプレミスに散らばったデータへアクセスして推論することがボトルネックになります。エージェントを本当の「行動するシステム」にするには、データを動かすことによるセキュリティリスクなしにペタバイト規模の推論を扱える基盤が必要だという位置づけで、Gemini を入口として、あらかじめ設定された、あるいはボーダーレスな Lakehouse に格納されたデータを Gemini に直接統合します。Gemini から Lakehouse のカタログフェデレーションを通じて Databricks Unity Catalog や Snowflake Horizon のような新しいデータソースへのアクセスを設定でき、業務部門の利用者は自然言語でクラウドをまたぐレコードを問い合わせ、AI エージェントはその上で根拠づけを行えます。セキュリティでは、VPC Service Controls (VPC-SC) の強化が一般提供となりました (追加費用なし)。エージェントはユーザーの代理として、あるいは自律的に動作し、非決定的な判断を行い、前例のない速度と規模でプロジェクトを横断してデータを要求するため、非人間 ID (NHI) という別のカテゴリとして固有のセキュアバイデフォルトのガードレールが必要になります。手で運用する従来のネットワーク境界はマシンスピードの攻撃に弱く、接続がブロックされるのを避けるために緩すぎる境界にすると不正なデータ窃取のリスクが増え、厳しすぎる境界にするとアクセス拒否の洪水で開発が止まります。今回の更新では、境界のメンバーシップにフォルダを追加して配下のプロジェクトにポリシーを継承させられるようになり、きめ細かな例外の管理と、ガイド付きでスコープを絞った修復による拒否の解消ができるようになりました。コンテナでは、GKE 向けの CPU 起動ブーストがプレビューで公開されました。定常状態の使用量に合わせて CPU リクエストをサイジングすると起動時に CPU スロットリングが発生してコールドスタートの遅延や readiness プローブのタイムアウトにつながり、逆に短時間の起動バーストに合わせてベースラインをオーバープロビジョニングすると計算リソースが無駄になりコストが膨らむというジレンマに対するもので、GKE の VerticalPodAutoscaler (VPA) に直接統合され、初期化中はコンテナの CPU 割り当てを動的に引き上げ、アプリケーションの準備が整うとシームレスにベースラインへ戻します。コンテナの再起動は不要です。オーケストレーションでは、Temporal Serverless Workers on Cloud Run がプレビューで登場しました。Temporal のワーカーはリクエストを受けるのではなくタスクをポーリングするため、リクエスト駆動のサーバーレス基盤とは噛み合わず、Kubernetes や VM でワーカーのフリートを常時動かして管理・課金し、メトリクスパイプラインを組んでオートスケールのトリガーを調整しても、メトリクスの遅れでバーストに追いつけないという課題がありました。プル型の処理のために作られた Cloud Run の worker pools を使い、フルマネージド版の Temporal Cloud がタスクキューの量に合わせてプールのサイズを決め、処理がないときはゼロまで縮小できます。クラスタもオートスケーラーも運用せず、ワーカーのコードはそのままです。データベースでは、AlloyDB と Memorystore for Valkey による AI エージェントの長期記憶の実装方法が紹介されました。短期のバッファメモリに Memorystore for Valkey、長期の永続メモリに AlloyDB AI を使う 2 層のメモリアーキテクチャで、重要なデータとエンタープライズのガードレールを保ちながらトークン消費量を最大 70% 削減します。LLM はセッション間でステートレスなままであるため、数日にわたってやり取りする旅行エージェントの例では、以前のセッションで設定されたフライトの好み (直行便のみ)・ホテルの予算・食事の要望 (グルテンフリー) を、会話が観光のおすすめなど細部に入り込んでも忘れたり上書きしたりしないようにする必要があるという課題が示されています。スタートアップ向けには、Gemini at Work 2026 で発表された Gemini agent の意味が解説されました。書くこと・コーディング・データ分析で別々のチャットボットに指示するのではなく、高レベルの目的を受け取って完成した成果物を返す単一のエージェントで、知識労働・データ分析・クリエイティブ資産の生成・コードの記述と実行を 1 つで扱い、複雑な仕事ではジョブ専用の一時的なサブエージェントを動的に立ち上げて並列または順次に調整します。Web・コマンドライン・デスクトップ・モバイルといった日常的に使う面をまたいで動作し、今週広く提供が始まった新しいフロンティアモデル Gemini 4 Argon がその基盤になります。
