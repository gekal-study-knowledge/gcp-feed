  "01d32119b8411954a412641796b615d9":
    "id": "01d32119b8411954a412641796b615d9"
    "title": "What’s new in AI infrastructure and orchestration in October"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/whats-new-in-ai-infrastructure-this-month/"
    "published": "2026-10-31 01:00:00"
    "fetched": "2026-10-31 05:24:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The Google Cloud AI Infrastructure team had another busy month in October, filled with new product launches and updates to power today’s AI and agentic workloads scalably and efficiently. We were also honored to share our progress with customers, partners, and the broader community at leading industry events, including NVIDIA GTC, PyTorch Conference, and AGNTCon + MCPCon. Let’s dive in!</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Product, technology, and tools updates</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New compute service:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/introducing-agent-compute-engine-and-expanded-agent-governance?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Compute Engine</span></a><span style=\"vertical-align: baseline;\"> is a purpose-built compute service providing high-performance, hardware-isolated microVM sandboxes alongside expanded agent governance capabilities like Agent Gateway and Agent Registry, all in the service of securing and scaling autonomous AI agents. Its primary benefits include rapid sub-second activation, extreme workload density through copy-on-write memory sharing, enterprise-grade security and identity management, and cross-cloud observability.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI Hypercomputer updates: </strong><span style=\"vertical-align: baseline;\">At </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/google-cloud-infrastructure-at-nvidia-gtc-berlin-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA GTC Berlin 2026</span></a><span style=\"vertical-align: baseline;\"> we announced updates to our agentic infrastructure, including to A5X instances powered by the NVIDIA Vera Rubin NVL72 platform, Virgo Network scale-out fabric, and Managed Lustre storage. These co-engineered advancements provide enterprises with accelerated performance, enhanced sovereign AI controls, while advanced Confidential Computing capabilities help you train and deploy complex multi-step models securely and efficiently.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-cpu-startup-boost-faster-pod-starts-lower-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CPU startup boost for GKE</span></a><span style=\"vertical-align: baseline;\">, in preview, uses Kubernetes In-place Pod Resize to dynamically elevate container CPU resources during initialization and scale them back down to steady-state levels without having to restart the containers. This feature removes startup throttling and accelerates cold starts by up to 2x for demanding workloads, helping to lower cloud infrastructure costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE product update: </strong><span style=\"vertical-align: baseline;\">The preview of the </span><a href=\"https://cloud.google.com/blog/products/identity-security/wiz-sensor-for-gke-turnkey-threat-detection-for-kubernetes?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Runtime Sensor add-on for Google Kubernetes Engine (GKE)</span></a><span style=\"vertical-align: baseline;\"> brings low-touch deployment, automated lifecycle management, enterprise credential security, and fleet-wide governance to Wiz's eBPF runtime threat detection for both Standard and Autopilot GKE clusters.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Modernization tools:</strong><span style=\"vertical-align: baseline;\"> Together at last. </span><a href=\"https://cloud.google.com/blog/products/infrastructure-modernization/google-cloud-modernize-accelerate-transformation-with-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Modernize</span></a><span style=\"vertical-align: baseline;\"> brings Google Cloud’s migration and modernization tools, including Migration Center, Google Cloud VMware Engine, </span><a href=\"https://cloud.google.com/solutions/mainframe-modernization?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Mainframe Modernization</span></a><span style=\"vertical-align: baseline;\"> and our new EKS-to-GKE Migration Agent, into a single portfolio. Enterprise teams now have purpose-built agentic capabilities across infrastructure assessment, platform modernization, and application modernization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/serverless/temporal-serverless-workers-on-cloud-run-worker-pools?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal Serverless Workers on Cloud Run</span></a><span style=\"vertical-align: baseline;\"> automatically scale worker pools based on </span><a href=\"https://temporal.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Temporal</span></a><span style=\"vertical-align: baseline;\"> task queue demands and scale down to zero when idle. This integration eliminates cluster management, lowers costs, using Temporal Worker Versioning to safely handle stateful, long-running workflows and AI agent workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New open-source product:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/llm-d-1-0-an-open-source-stack-for-distributed-inference?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d 1.0</span></a><span style=\"vertical-align: baseline;\"> is an open-source, Kubernetes-native serving stack that turns a cluster of model servers into a coordinated serving pool, unifying distributed LLM inference across mixed Google Cloud TPU and GPU fleets. Co-founded by Google and partners, it provides production-ready benefits such as cache-aware routing, tiered KV cache offloading, and priority-based flow control to dramatically improve context reuse, reduce time-to-first-token latency, and efficiently scale multi-tenant agent workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New open-source product:</strong><span style=\"vertical-align: baseline;\"> Working with Meta, we open-sourced </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TorchTPU</span></a><span style=\"vertical-align: baseline;\">, a native PyTorch stack that integrates Google TPUs directly into the PyTorch ecosystem alongside GPUs and CPUs. Now developers can train, serve, and deploy models natively on TPUs using familiar frameworks like Hugging Face, vLLM, and TorchTitan.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Distributed Cloud updates:</strong><span style=\"vertical-align: baseline;\"> Organizations that operate under strict sovereignty mandates would love to use AI to help them process data, but can’t send it to the cloud. </span><a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/new-innovations-in-google-distributed-cloud?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">The latest version of Google Distributed Cloud (GDC) air-gapped</span></a><span style=\"vertical-align: baseline;\"> brings frontier AI models and </span><a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">multimodal enterprise search with Gemini</span></a><span style=\"vertical-align: baseline;\"> into these isolated environments. In addition, GDC air-gapped supports NVIDIA HGX B300 systems based on the NVIDIA Blackwell Ultra architecture, and features enhanced networking and security capabilities. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Edge inference product:</strong><span style=\"vertical-align: baseline;\"> Google open-sourced </span><a href=\"https://developers.googleblog.com/ml-drift-next-gen-gpu-aiml-inference-at-the-edge/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ML Drift</span></a><span style=\"vertical-align: baseline;\">, a cross-platform on-device GPU compute engine built for LiteRT that abstracts hardware complexities across OpenGL ES, OpenCL, Metal, and WebGPU. The framework delivers peak performance, enhanced 5D tensor support, and memory efficiency for both classical machine learning workloads and advanced generative AI models at the edge.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Open-weight model support:</strong><span style=\"vertical-align: baseline;\"> Reflection's Beam is an open-weight, 501-parameter model released under an Apache 2.0 license designed specifically for frontier software engineering and long-horizon agentic tasks. </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/day-0-support-with-5x-perf-for-reflection-beam-on-google-cloud?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">We announced day 0 support and ready-to-run deployment recipes</span></a><span style=\"vertical-align: baseline;\"> for service Beam on AI Hypercomputer and NVIDIA AI Infrastructure.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Practitioner guides and how-tos</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI network reference architectures:</strong><span style=\"vertical-align: baseline;\"> In </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/networking-for-ai-inference-model-serving-gke-only-and-for-all-other-backends?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Networking for AI inference model serving - GKE only and for all other backends</span></a><span style=\"vertical-align: baseline;\">, learn about reference architectures for AI inference model serving that provide centralized governance and private IP routing using Private Service Connect, Apigee API Management, and Model Armor. These architectures simplify multi-model scaling and prompt security across GKE, Cloud Run, and hybrid clouds. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://discuss.google.dev/t/a-tale-of-tpu-observability-on-gke-part-2-dynamic-slicing-enhancements/406815\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A Tale of TPU Observability on GKE: Part 2 - Dynamic Slicing Enhancements</span></a><span style=\"vertical-align: baseline;\"> breaks down GKE's new Dynamic Slicing observability tools and metrics for next-generation v7 TPUs through an engaging, story-driven observability guide featuring Alex, a lead AI platform engineer. Explore the step-by-step diagnostic workflows with real-world examples and handy command-line snippets. </span><a href=\"https://discuss.google.dev/t/a-tale-of-tpu-observability-on-gke-part-1/397955\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Check out Part 1 here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Customer and partner updates</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/ai21-trains-its-models-on-ai-hypercomputer?_gl=1*161z6lh*_ga*NTIxMzA0MjUwLjE3OTA5Njg2MDE.*_ga_4LYFWVHBEB*czE3OTA5NzAxNzYkbzgkZzEkdDE3OTA5NzAzNTAkajE4JGwwJGgw&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI21 achieves an 83% reduction in time-to-start for AI workloads with AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\">: Frontier lab AI21 needed a new stack on which to train its Jamba family, and chose AI Hypercomputer configured with GKE on A3 and A3 Ultra instances. By doing so, AI21 says it cut high-priority job wait times from 72 hours to 12, and manual scheduling interventions from 20 per week to zero.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/media-entertainment/how-visko-streams-real-time-world-models-on-google-cloud-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visko streams real-time world models on Google Cloud TPUs</span></a><span style=\"vertical-align: baseline;\">: Visko, an AI startup developing interactive world models, deployed an end-to-end live inference pipeline that combines video generation, super-resolution upscaling, and synchronized audio onto a single </span><a href=\"https://cloud.google.com/tpu?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud TPU slice</span></a><span style=\"vertical-align: baseline;\">. In this blog, the team discusses how it engineered the pipeline, the architectural optimizations it made, and practical lessons for other startups building ultra-low-latency generative AI.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/zenteiq-scales-physical-ai-inference-4x-with-gke-and-llm-d\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ZenteiQ scales physical AI inference 4x with GKE and llm-d</span></a><span style=\"vertical-align: baseline;\">: In order to pre-train models that understand physical laws, governing equations, and numerical solvers, Indian AI startup ZenteiQ designed and built a large-scale batch synthetic data-generation pipeline that runs across multiple model families and feeds verified datasets into training runs. GKE and GKE Inference Gateway gave ZenteiQ the inference-routing layer within its pipeline to scale aggregate inference throughput 4.07x and grow daily output from 1.47 billion to 5.97 billion generated tokens for every 1,000 accelerators.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/customers/paloaltonetworks?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Palo Alto Networks modernizes cloud-delivered security service</span></a><span style=\"vertical-align: baseline;\">: Palo Alto has worked with Google Cloud since 2018 to deliver its Prisma Access security service, and it was time to update it. In order not to compromise its security guarantees, Palo Alto separated the platform into two independently scalable layers: an ingress layer that handles traffic routing and forwarding running on GKE, with Axion C4A instances; and a security layer that handles threat inspection, running on dedicated single-tenant VMs fronted by an Internal Load Balancer. Each layer can now scale, update, and operate independently. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.googlecloudpresscorner.com/2026-10-27-Oracle-Brings-Google-TPUs-to-Oracle-Cloud-Infrastructure\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle is the first hyperscaler to provide TPUs outside Google Cloud</span></a><span style=\"vertical-align: baseline;\">: By deploying Google TPUs, Oracle is broadening the range of AI chips available through its Oracle Cloud Infrastructure (OCI), and giving customers more options for running AI workloads. Google TPUs on OCI will be available in 2027.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Research, reports and deep-dives</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New resource:</strong><span style=\"vertical-align: baseline;\"> As enterprise organizations shift from isolated AI experiments to production-scale systems, different departments — from engineering and finance to executive leadership — often speak different technical dialects; </span><a href=\"https://cloud.google.com/resources/report/content/an-it-leaders-encyclopedia-for-ai-infrastructure?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">The Encyclopedia of AI Infrastructure</span></a><span style=\"vertical-align: baseline;\"> bridges that communication gap by demystifying complex infrastructure jargon.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Analyst report: </strong><span style=\"vertical-align: baseline;\">We are thrilled to announce that </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/google-named-leader-in-2026-idc-marketscape-for-agentic-ai-platforms?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google was named a Leader in the inaugural 2026 IDC MarketScape for Agentic AI Platforms</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deep dive: </strong><span style=\"vertical-align: baseline;\">A companion technical guide </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/agent-compute-engine-deep-dive?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">describing the architecture of Agent Compute Engine </span></a><span style=\"vertical-align: baseline;\">and how Google’s Gemini team needed both the isolation of a VM and the speed and density of a container to deliver personal agents for every Gemini user.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">September 2026</span></span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<p><strong style=\"vertical-align: baseline;\">Google Kubernetes Engine updates:</strong><span style=\"vertical-align: baseline;\"> The GKE team is all about improving the scalability of the platform, and in September, those improvements came in many shapes and sizes:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><span style=\"vertical-align: baseline;\">Need an execution runtime with higher density for your agentic workloads? We engineered the new open-source </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/agent-substrate-available-on-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> to run millions of sandboxes with 10x higher density than standard container runtimes. Agent Substrate also delivers sub-500ms resume operations at over 500 suspend/resume activations per second with a native zero-trust kernel and network isolation. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> GKE now has </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">scale-to-zero</span></a><span style=\"vertical-align: baseline;\"> capabilities built-in. No need to configure complex components to scale your workloads down, thanks to the HPA with the Autoscaling Metric and support for KEP-2021, which do the job for you, out of the box. </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the blog</span></a><span style=\"vertical-align: baseline;\"> to learn more. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Further, the GKE HPA (with the above-mentioned Autoscaling Metric) now lets you scale up and down based on custom PromQL metrics, in addition to standard metrics, allowing you to trigger workloads according to conditions that are meaningful and unique to your business. Read more </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/native-support-for-prometheus-metrics-in-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><span style=\"vertical-align: baseline;\">Yet another scalability feature is </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Pod snapshots</span></a><span style=\"vertical-align: baseline;\">, which lets you save the running state of your workload, including CPU and GPU memory, and restore it on demand. According to internal tests, GKE Pod snapshots can reduce AI inference start-up by as much as 89%. Learn more </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New migration tool: </strong><span style=\"vertical-align: baseline;\">Finally, if you’ve always wanted to migrate your container workloads from AWS EKS to GKE but feared a daunting, high-friction engineering endeavor, we’ve just launched </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-agentic-migration?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE agentic migration</span></a><span style=\"vertical-align: baseline;\">, a purpose-built agent plugin that replaces brittle, ad-hoc prompting with an AI-assisted migration pipeline protected by deterministic guardrails. Designed as a compilation of agent skills and a local Model Context Protocol (MCP) server, it uses AI to translate complex AWS EKS IaC and Kubernetes manifests directly into GKE landing zones. Get started with the </span><a href=\"https://github.com/gke-labs/gke-agentic-migration/blob/main/docs/onboarding-guide.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">onboarding guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Feature updates: </strong><span style=\"vertical-align: baseline;\">Reinforcement learning (RL) and evaluation workloads are a beast: In a standard agentic RL loop, an LLM policy generates actions like code snippets on GPUs and executes them inside isolated CPU sandboxes to observe a reward signal. However, when scaling up this loop to support tens of thousands of parallel rollouts, infrastructure bottlenecks emerge, for instance idle accelerators, image cardinality, and a saturated control plane. To help, we developed GKE Agent Sandbox optimized for RL, plus an Agent Sandbox RL orchestration SDK and native integrations for popular RL gyms and harnesses. All are now generally available, and you can learn more </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Storage updates: </strong><span style=\"vertical-align: baseline;\">AI trains and creates lots of data, and that data has to live somewhere — in block storage systems, file systems, object stores and databases. We announced enhancements to our storage portfolio to help this critical layer roll with the agentic punches:  </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore agent volumes</span></a><span style=\"vertical-align: baseline;\"> offer high-performance, elastic, persistent file storage for agentic workloads. Thanks to its tight integration with GKE Agent Substrate and GKE Agent Sandbox, Filestore agent volumes automatically allocates and attaches a dedicated, isolated file workspace to GKE agent sandboxes in milliseconds. Request access to the preview </span><a href=\"http://forms.gle/vYPkcFiZVoTjf7Ah7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product:</strong><span style=\"vertical-align: baseline;\"> If you run generative AI and RAG data layers  — think Milvus, Pinecone, Qdrant, Vespa, Redis, and in-memory context caching — you may want to take a look at the </span><a href=\"https://cloud.google.com/blog/products/compute/compute-engine-m4n-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">M4N family of VMs</span></a><span style=\"vertical-align: baseline;\">, now GA, which offers the highest per-core IOPS and throughput of leading hyperscalers. Paired with Google Cloud's custom </span><a href=\"https://cloud.google.com/titanium\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> offload architecture and paired with</span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Hyperdisk Extreme</span></a><span style=\"vertical-align: baseline;\">, M4N instances deliver up to 25,000 MiB/s (25 GiB/s) of aggregate host storage performance and up to 1 million IOPS. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product:</strong><span style=\"vertical-align: baseline;\"> Another new Compute Engine product, </span><a href=\"https://cloud.google.com/blog/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D, is GA</span></a><span style=\"vertical-align: baseline;\">, and a strong storage solution for AI/ML training and inference workloads. When configured as a bare metal instance, Z4D provides both the high local SSD (LSSD) capacity and low latency required by agentic microVMs, so you can run thousands of isolated sandboxes per host with native performance and efficiency. Learn about </span><a href=\"https://cloud.google.com/blog/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D machines here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Today’s AI training and inference pipelines create data faster than most storage management systems can keep up, creating challenges for teams trying to understand their storage estates. A new version of </span><a href=\"https://docs.cloud.google.com/storage/docs/storage-intelligence/advisor-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage Intelligence advisor</span></a><span style=\"vertical-align: baseline;\"> makes it easier to answer the question: \"What’s in my buckets?\" and quickly identify unexpected changes. Then, enhanced </span><a href=\"https://docs.cloud.google.com/storage/docs/batch-operations/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">batch operations</span></a><span style=\"vertical-align: baseline;\"> let you automate bulk changes across your buckets — say, move storage classes, mass-delete stale or temporary data, or apply metadata, tagging, retention, or encryption changes. Learn about the latest in Storage Intelligence advisor </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/storage-intelligence-advisor-and-batch-operations-updates/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product:</strong><span style=\"vertical-align: baseline;\"> Last but not least, a new version of </span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> brings together pioneering Google infrastructure — Colossus distributed file system, and Jupiter network — to power a </span><a href=\"https://cloud.google.com/blog/products/databases/alloydbs-agentic-database-architecture?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new, no-compromises database architecture for the agentic era</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to:</strong><span style=\"vertical-align: baseline;\"> Wish you could make GPUs and TPUs scattered around the globe behave as a single pool behind a single entry point? </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gpu-and-tpu-utilization-with-multi-cluster-gke-inference-gateway?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">In this blog</span></a><span style=\"vertical-align: baseline;\">, we show you how to do just that. At the edge, the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">multi-cluster GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> focuses on global, multi-region traffic distribution and high availability. Beneath that, the </span><a href=\"https://github.com/llm-d/llm-d-router\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLM-d router</span></a><span style=\"vertical-align: baseline;\"> handles complex, memory-aware scheduling algorithms to keep utilization high. This architecture is deliberately runtime-, model-, and accelerator-agnostic, and in tests, routing traffic through the multi-cluster GKE Inference Gateway added less than 1% overhead.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">Using or planning to use GKE on TPUs for AI model training or inference? Training massive Large Language Models (LLMs) or running high-throughput inference serving represents a significant investment in specialized AI hardware, such as Cloud TPUs and GPUs. To get the most out of every dollar spent, you need to </span><a href=\"https://discuss.google.dev/t/a-tale-of-tpu-observability-on-gke-part-1/397955\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">understand workload lifecycle metrics in GKE</span></a><span style=\"vertical-align: baseline;\">. This detailed guide explains how to turn opaque cluster behaviors into actionable telemetry.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE customer:</strong><span style=\"vertical-align: baseline;\"> Learn why gaming startup SeaVerse relies on </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/seaverse-chooses-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox for its multi-tenant workloads</span></a><span style=\"vertical-align: baseline;\">, and how the platform helped it decrease its infrastructure costs by 60%. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<p><span style=\"vertical-align: baseline;\">In case you missed it, we’re also thrilled to share that Google has been named a leader, including achieving the highest score on either product or strategy, in three key analyst reports from Gartner and Forrester. </span></p>\n<ul>\n<li><a href=\"https://cloud.google.com/blog/products/compute/forrester-wave-public-cloud-platforms-q3-2026-report?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google is a leader in The Forrester Wave™: Public Cloud Platforms, Q3 2026</span></a><span style=\"vertical-align: baseline;\">: Highest overall score of any cloud provider!</span></li>\n<li><a href=\"https://cloud.google.com/blog/products/compute/google-named-a-leader-in-2026-gartner-magic-quadrant-for-scps?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google named a Leader in 2026 Gartner® Magic Quadrant™ for Strategic Cloud Platform Services</span></a><span style=\"vertical-align: baseline;\">: Positioned furthest for “Completeness of Vision” of all vendors evaluated.</span></li>\n<li><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/2026-gartner-magic-quadrant-for-container-management?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google is a Leader in the 2026 Gartner Magic Quadrant for Container Management</span></a><span style=\"vertical-align: baseline;\">: Positioned highest in “Ability to Execute” of all vendors evaluated.</span></li>\n<li><span style=\"vertical-align: baseline;\">Google Cloud achieved a Gold rating in the latest SemiAnalysis ClusterMax 3.0 report, which evaluates the reliability, performance, support, pricing, and security of GPU providers globally. See the</span><a href=\"https://newsletter.semianalysis.com/p/clustermax-30-the-industry-standard\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">full report for more</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">August 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore</span></a><span style=\"vertical-align: baseline;\">, Google Cloud’s first-party, secure, scalable NFS file service, has emerged as a popular storage platform for AI and agentic workflows, and now, it’s even better suited to the task, with a new backend storage layer built directly on </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/how-colossus-optimizes-data-placement-for-performance?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Colossus</span></a><span style=\"vertical-align: baseline;\">, Google’s foundational distributed storage system. This new backend lets you provision IOPS independently from storage capacity, and is deeply integrated with GKE. In AI environments, this can help you service so-called agentic swarms — large groups of agents that need to read and write to a common dataset — without a drop off in performance. For more, check out the </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-file-service-runs-on-colossus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog post</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor sandboxes are now available in distributed Ray clusters on GKE</span></a><span style=\"vertical-align: baseline;\">. In partnership with Anyscale, we introduced an experimental library for Ray that brings gVisor, Google’s open-source application kernel, directly into distributed Ray clusters. gVisor provides lightweight environments with stronger isolation than ordinary containers, plus fast startup times and low memory overhead. To try out these sandboxing capabilities on GKE, head over to the </span><a href=\"https://docs.ray.io/en/master/cluster/kubernetes/examples/ray-sandboxing.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray sandboxing User Guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Looking for high-performance, easy-to-use infrastructure on which to run a personal AI agent, but don’t want to spend a lot of money? New </span><a href=\"https://cloud.google.com/blog/products/serverless/introducing-cloud-run-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run instances</span></a><span style=\"vertical-align: baseline;\"> are dedicated, singleton compute runtimes on Cloud Run that won’t shut down when the agent is idle. Better yet, the cost to run a Cloud Run instance with 1 vCPU and 1 GiB of memory continuously for 30 days is just $5.70.  </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides, documentation and how-tos</span></h4>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Big news in Model Context Protocol (MCP) land: As of the 2026-07-28 specification, the protocol core is “completely stateless. The handshake is gone. The initialize / initialized handshake (SEP-2575) and the logical Mcp-Session-Id header (SEP-2567) have been removed entirely. Instead, every request is now self-describing and independent.” Whoa. Learn more about the changes that the latest MCP specification brings, and more importantly, how to implement them, in </span><a href=\"https://developers.googleblog.com/scaling-ai-agent-infrastructure-with-the-mcp-stateless-updates/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this Google Developers blog</span></a><span style=\"vertical-align: baseline;\">.  </span></li>\n<li><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">Real-time AI systems make a mess of traditional network load balancing techniques.</span><span style=\"font-style: italic; vertical-align: baseline;\"> “Instead of handling isolated requests, the backend has to manage a continuous, live bidirectional stream. You’re dealing with a constant stream of audio chunks, transcripts, model outputs, and synthesized speech flowing back and forth simultaneously.”</span><span style=\"vertical-align: baseline;\"> Things only get worse when the user gets involved. </span><span style=\"font-style: italic; vertical-align: baseline;\">“The server has to immediately halt its current speech generation, pivot to update the context, maybe trigger a new tool, and start drafting a different response; this must be done without dropping the connection.”</span><span style=\"vertical-align: baseline;\"> For a new approach to managing load in the AI era, read </span><a href=\"https://developers.googleblog.com/scaling-real-time-ai-agents-with-session-aware-load-balancing/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scaling real-time AI agents with session-aware load balancing</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">How-to:</strong><span style=\"vertical-align: baseline;\"> Learn how to build an elastic, scalable LLM inference platform on GKE, even with a mix of different GPU accelerators. The proposed architecture combines Capacity Advisor and Compute Advisor, plus high-performance storage like RunAI:model streamer or GCPFuse with parallel downloads. Get all the details </span><a href=\"https://discuss.google.dev/t/how-to-build-an-elastic-scalable-llm-inference-platform-on-gke-using-fluid-compute/388108\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Documentation: </strong><span style=\"vertical-align: baseline;\">The thing about hosts with GPUs or TPUs is that you can’t use live migration to update them, setting up a maintenance challenge. In this new docs page, learn how to </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/perform-host-maintenance-accelerators\"><span style=\"text-decoration: underline; vertical-align: baseline;\">update accelerator-equipped hosts</span></a><span style=\"vertical-align: baseline;\"> according to your tolerance for downtime for your training and inference workloads.   </span><strong style=\"vertical-align: baseline;\"> </strong></li>\n<li><strong style=\"vertical-align: baseline;\">Documentation: </strong><span style=\"vertical-align: baseline;\">Advanced Compute Images, or ACIs, are standardized image stacks for AI/ML and HPC infrastructure, so you don’t need to manually build your own custom images. In this new docs page, learn how to </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/use-aci-images\"><span style=\"text-decoration: underline; vertical-align: baseline;\">create an ACI image</span></a><span style=\"vertical-align: baseline;\"> using the Google Cloud CLI, console, or SchedMD's Slurm workload manager</span><strong style=\"vertical-align: baseline;\">. </strong></li>\n<li><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">AI workloads are notoriously difficult to architect, resource-intensive, and bursty, which can also lead to scaling bottlenecks and large pools of underutilized — or misutilized — compute resources. A new blog outlines the </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">three main ways to achieve dynamic capacity management in Google Cloud</span></a><span style=\"vertical-align: baseline;\">: 1) scheduling capacity for planned downtime; 2) maintaining automated fallback capacity for unplanned downtime; and 3) relying on GKE’s core orchestration capabilities to automate resource allocation. </span></li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Business orchestration software provider </span><a href=\"https://www.uipath.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">UiPath</strong></a><span style=\"vertical-align: baseline;\"> was dealing with spiky workloads, and wanted more predictable costs. To get there, it re-architected its infrastructure, moving from isolated clusters to a shared Google Cloud GPU fleet that included both A3 VM instances (NVIDIA H100 GPUs) for training with G4 VM instances (NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs) for inference. You can read more about their architecture </span><a href=\"https://cloud.google.com/blog/topics/customers/how-uipath-built-its-high-performance-gpu-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://mirendil.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mirendil</strong></a><span style=\"vertical-align: baseline;\">, an frontier AI lab focused on accelerating AI development, announced that it is </span><a href=\"https://cloud.google.com/blog/topics/startups/mirendil-selects-ai-hypercomputer?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">using AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> with both TPUs and NVIDIA GPUs to support its model pre-training and post-training applications. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://replen.it/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Replenit</strong></a><span style=\"vertical-align: baseline;\">, a retail CRM provider, built its AI decision engine in Google Cloud, using BigQuery, Gemini Enterprise Agent Platform, and open-source Gemma models that it runs on Cloud TPUs. This latter combination provided Replenit with 90% lower pipeline costs than their previous cloud provider, the company reports. Read the </span><a href=\"https://cloud.google.com/customers/replenit?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">full case study</span></a><span style=\"vertical-align: baseline;\"> for more. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.malachyte.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Malachyte</strong></a><span style=\"vertical-align: baseline;\"> architected its AI-powered e-commerce recommendation platform on top of Bigtable, Managed Service for Apache Kafka, Pub/Sub, Compute Engine, and last but not least, GKE. See how it all comes together in </span><a href=\"https://cloud.google.com/blog/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this blog</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">July 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"vertical-align: baseline;\"> is now GA, and available in four distinct performance tiers that deliver throughput ranging from 125 MB/s, 250 MB/s, 500 MB/s, to 1000 MB/s per TiB of capacity — with the ability to scale up to 8 PB of storage capacity. The Managed Lustre solution is powered by DDN’s EXAScaler, combining DDN's decades of leadership in high-performance storage with Google Cloud's expertise in cloud infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/compute/c4n-network-and-storage-optimized-vms?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C4N network and storage optimized VMs are now GA</span></a><span style=\"vertical-align: baseline;\">. C4N is our first network- and block-storage-optimized VM series built to eliminate data-transfer bottlenecks. Powered by 5th Gen Intel Xeon Scalable processors and built on Google's </span><a href=\"https://cloud.google.com/titanium?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> offloading hardware, it achieves 400 Gbps network bandwidth, 95 million packets per second (MPPS), and up to 25 GiB/s of block storage throughput when paired with Hyperdisk Extreme.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/planning-large-clusters#clusters-5k-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Dataplane V2 up to 15K Nodes with Network Policies (GA)</span></a><span style=\"vertical-align: baseline;\">. This capability enables standard GKE clusters to scale up to 15,000 nodes while maintaining full active Network Policy enforcement, supporting the massive infrastructure needs of large enterprise and AI/ML customers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/introducing-co-operative-time-slicing-for-rl-in-llm-d?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Co-operative time-slicing in llm-d</span></a><span style=\"vertical-align: baseline;\">. If you’re running reinforcement learning (RL) workloads, you can now interleave independent RL jobs onto shared physical hardware, increasing aggregate accelerator duty cycles from a ~40% baseline up to 70% without impacting model convergence or accuracy. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New AI security tool:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-k8s-aibom-on-gke-for-automated-ai-bills-of-materials?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looking to secure your AI supply chain on GKE</span></a><span style=\"vertical-align: baseline;\">, deploy AI workloads safely, and cut down on shadow AI? We open-sourced k8s-aibom, a lightweight, unprivileged Kubernetes controller that continuously monitors container clusters to automatically detect running AI runtimes (like vLLM and Triton) and generate standard CycloneDX Machine Learning Bill of Materials (ML-BOMs). Check out the </span><a href=\"https://github.com/GoogleCloudPlatform/k8s-aibom\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">k8s-aibom project</span></a><span style=\"vertical-align: baseline;\"> and get involved.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide: </strong><span style=\"vertical-align: baseline;\">On July 27, Google announced </span><a href=\"https://discuss.google.dev/t/announcing-day-0-support-for-kimi-k3-on-google-cloud/385392\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Day 0 support for Moonshot AI’s Kimi K3</span></a><span style=\"vertical-align: baseline;\"> 2.8-trillion-parameter open-weight model, the day weights were released. Whichever your preferred deployment path — via Model Garden, custom orchestration, or GKE with llm-d recipes — this guide offers detailed step-by-step instructions to help you evaluate and pilot Kimi K3 in Google Cloud. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/autopilot-clusters-with-gke-managed-dranet-gpus-and-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE) managed DRANET supports both GPUs and TPUs</span></a><span style=\"vertical-align: baseline;\">. There are several configurations to use this implementation, including standard cluster (where you have full control) and autopilot cluster (where Google does the heavy configs for you). Take a deeper dive in the hands-on lab, </span><a href=\"https://codelabs.developers.google.com/codelabs/gke-autopilot-tpus-dranet-gemma#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Autopilot clusters with TPUs, GKE managed DRANET and Gemma 4</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Learn to run Ray on TPUs, not GPUs. In </span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-1-the-foundations/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Part 1</span></a><span style=\"vertical-align: baseline;\"> of this two-part series, we discuss TPU slices (hint: Ray thinks of them as just another accelerator on which to schedule), then walk through Ray’s various AI libraries (</span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-2-ray-ai-libraries/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Part 2</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide: </strong><span style=\"vertical-align: baseline;\">Evaluate TPUs for sample workloads using a new microbenchmark suite that helps you accurately assess whether a device is achieving its theoretical performance specifications, and to identify specific performance gaps or architecture-specific bottlenecks. Dive in </span><a href=\"https://developers.googleblog.com/how-to-use-google-microbenchmarks-for-evaluating-tpu-performance/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Scale your agents without killing your budget. </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/reduce-your-agents-costs-with-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn how GKE orchestration can help you safely pack more agents onto a fixed compute footprint</span></a><span style=\"vertical-align: baseline;\"> with GKE Agent Sandbox and Pod snapshots. Whether your goal is performance or cost optimization, we teach you how to turn the right dials for optimal agent efficiency. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Technical blueprint: </strong><span style=\"vertical-align: baseline;\">Inside the optimization of Mistral 3 large inference on Ironwood. This blog outlines how one Google team optimized Mistral 3 large MoE model inference on Google’s Ironwood (TPU v7x), achieving a 1.5x performance gain. They did so with hybrid sharding, replacing linear VPU summations with tree reductions, optimizing GMM/MLA kernels, and adopting asynchronous scheduling. As a result, they boosted throughput by up to 48% while maintaining benchmark accuracy neutrality. Read the full blog </span><a href=\"https://discuss.google.dev/t/inside-the-optimization-of-mistral-3-large-inference-on-ironwood/385847\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report: </strong><span style=\"vertical-align: baseline;\">Google was named a Leader in the inaugural </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/google-is-a-leader-in-gartner-magic-quadrant-for-ai-infra?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gartner</span><span style=\"text-decoration: underline; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Ⓡ</span></span><span style=\"text-decoration: underline; vertical-align: baseline;\"> Magic Quadrant™ for AI Infrastructure</span></a><span style=\"vertical-align: baseline;\">, positioned highest for ‘Ability to Execute’ and furthest for ‘Completeness of Vision’. Gartner called out Google’s proprietary scalable compute, integrated AI Hypercomputer architecture, and the scale of our AI compute capacity as key strengths. Download a copy </span><a href=\"https://cloud.google.com/resources/content/2026-gartner-mq-ai-infrastructure?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report:</strong><span style=\"vertical-align: baseline;\"> We recently surveyed more than 1,400 senior IT leaders for our </span><a href=\"https://cloud.google.com/resources/content/state-of-infrastructure-in-the-agentic-ai-era?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">State of AI Infrastructure report</span></a><span style=\"vertical-align: baseline;\">, and a resounding pattern emerged: The gap between AI ambition and infrastructure reality is widening. In fact, 83% of organizations say they require infrastructure upgrades to support production-grade agentic AI. </span><a href=\"https://cloud.google.com/blog/products/compute/state-of-ai-infrastructure-report-overview?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the accompanying blog</span></a><span style=\"vertical-align: baseline;\"> to understand how adapting your infrastructure to meet the demands that agentic applications place on your systems will help you move from pilot to production.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">June 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology and tool updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> Protecting sensitive data used with AI is a critical part of advanced and secure cloud infrastructure. </span><a href=\"https://cloud.google.com/security/products/confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> cryptographically protects data in use in hardware-based Trusted Execution Environments (TEEs) with verifiable data integrity, and is </span><a href=\"https://cloud.google.com/blog/products/identity-security/verifiable-trust-in-the-ai-era-whats-new-in-confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">now available</span></a><span style=\"vertical-align: baseline;\"> on the accelerator-optimized </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G4 machine series</span></a><span style=\"vertical-align: baseline;\">, featuring </span><a href=\"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs</span></a><span style=\"vertical-align: baseline;\">. Get started with </span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 VMs</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 GKE Nodes</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Developer resource: </strong><span style=\"vertical-align: baseline;\">The new </span><a href=\"https://cloud.google.com/products/tpu/tpu-developer?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Developer Hub</span></a><span style=\"vertical-align: baseline;\"> is the place to go for model builders, optimizers, and developers to learn to unlock the full performance of Google Cloud TPUs. Read more in this </span><a href=\"https://developers.googleblog.com/unlocking-the-power-of-the-tpu-stack-introducing-our-new-developer-hub/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product: </strong><span style=\"vertical-align: baseline;\">Scale your AI workloads with the new </span><a href=\"https://discuss.google.dev/t/stop-training-blind-scaling-ai-with-the-new-opentelemetry-based-tpu-ai-telemetry-collector-agent/375210\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenTelemetry-Based TPU AI Telemetry Collector Agent</span></a><span style=\"vertical-align: baseline;\">. For the first time, you can route high-fidelity TPU hardware telemetry to Google Cloud Monitoring, Google Managed Prometheus, or your own self-hosted Grafana stack.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Learn how to build high availability into an AI inference workload running on GKE Inference Gateway with TPUs, Cloud Storage FUSE and Dynamic Resource Allocation (DRA). This </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/experimenting-with-tpus-gke-managed-dranet-and-multi-cluster-inference-gateway?_gl=1*jj3plw*_ga*OTAxNzc0MzU1LjE3ODIyMjAxNDk.*_ga_4LYFWVHBEB*czE3ODI3NTc3NzAkbzkkZzEkdDE3ODI3NTg2MDEkajYwJGwwJGgw&amp;e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\"> provides an overview, or you can get all the technical details in the </span><a href=\"https://codelabs.developers.google.com/codelabs/gke-inference-gateway-multi-cluster-tpus-dranet#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">hands-on codelab</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Did you know you can connect your AI agents to unstructured data in </span><a href=\"https://cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> via Model Context Protocol (MCP)? In </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/build-ai-agents-faster-with-gcs-google-cloud-storage-mcp-server\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this blog</span></a><span style=\"vertical-align: baseline;\">, learn about why would want to do that from three customer examples, then how to do it, choosing either a fully managed service, or a self-managed local server for more customization and control. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report: </strong><span style=\"vertical-align: baseline;\">According to an independent benchmark report, </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> outperforms the next leading managed Kubernetes service with 15.7% higher throughput, 92.8% shorter wait times, and 62.6% lower inter-token latency. This performance can be attributed to its use of prefix caching, which optimizes LLM performance by storing the KV cache (activation states) of long, repetitive prompt prefixes. Learn more in the </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-inference-gateway-prefix-caching-accelerates-ai-inference?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">A closer look at </span><a href=\"https://discuss.google.dev/t/accelerate-tpu-model-loading-while-saving-ram-on-gke/374835\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the cold start problem, this time for TPUs and GKE</span></a><span style=\"vertical-align: baseline;\">, and how the Run:ai Model Streamer can help change the dynamic. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Leveraging GKE, BigQuery, Cloud SQL, and Gemini Enterprise Agent Platform, </span><a href=\"https://www.youtube.com/watch?v=x36QJ-QKRGg\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pager Health is eliminating operational fragmentation to deliver a simplified, personalized U.S. healthcare experience</span></a><span style=\"vertical-align: baseline;\"> that transforms lives.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Trustpilot, the customer review platform, built a high-volume streaming pipeline using fine-tuned Gemma models with Dataflow and Gemini Enterprise Agent Platform running on cost-optimized A2 VMs using A100 GPUs, as well as optimized version of vLLM maintained by Gemini Enterprise Agent Platform.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">May 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology and tool updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> is now generally available.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New open-source project:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> is a new open-source project aimed at continuing to push the limits of agentic infrastructure density</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://ai.google.dev/edge/ai-edge-portal\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Edge Portal</span></a><span style=\"vertical-align: baseline;\">, a solution for testing and benchmarking on-device machine learning (ML) at scale, now supports benchmarking and debugging on-device LLMs. Read more </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/benchmark-llms-on-device-with-ai-edge-portal?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product deep dive: </strong><span style=\"vertical-align: baseline;\">We went </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/cloud-storage-rapid-turbocharges-object-storage-for-ai-analytics?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">into depth about Cloud Storage Rapid</span></a><span style=\"vertical-align: baseline;\">, a new family of high-performance storage offerings for AI workloads. At launch, offerings include Rapid Bucket (formerly Rapid Storage), a high-performance zonal object storage offering, and Rapid Cache (formerly Anywhere Cache), which accelerates reads on-demand and colocates compute and data for workloads in existing buckets. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">Google Global Infrastructure VP Bikash Koley and Engineering Fellow Arjun Singh provide a high-level overview of </span><a href=\"https://cloud.google.com/blog/products/networking/data-center-and-global-networks-built-for-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the challenges that AI workloads pose to network infrastructure</span></a><span style=\"vertical-align: baseline;\">, and discuss the deep enhancements we’ve made to our data center fabrics, WAN, and global networks to better support them. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">We unveiled a </span><a href=\"https://cloud.google.com/blog/products/compute/cluster-reliability-for-trillion-parameter-models-on-tpus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new cluster-level reliability model</span></a><span style=\"vertical-align: baseline;\"> for developing frontier AI models on TPUs, ditching instance-level reliability </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Visual media provider </span><a href=\"https://cloud.google.com/blog/products/infrastructure/how-imgix-processes-8-billion-images-daily-with-g4-vms-powered-by-nvidia-blackwell?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Imgix serves more than 8 billion images and videos from AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> equipped with G4 VMs powered by NVIDIA RTX PRO 6000 Blackwell GPUs.</span></p>\n</li>\n</ul></div>"
  "0e96cd04f678481e04156df23961b24c":
    "id": "0e96cd04f678481e04156df23961b24c"
    "title": "Innovate on your own business terms: Google Cloud spend caps now generally available"
    "link": "https://cloud.google.com/blog/topics/cost-management/google-cloud-spend-caps-now-generally-available/"
    "published": "2026-10-31 01:00:00"
    "fetched": "2026-10-31 05:24:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we’re announcing that spend caps on Google Cloud Budgets are generally available. </span></p>\n<p><span style=\"vertical-align: baseline;\">With this release, we’re delivering ways to protect your workloads from runaway costs without risking resource deletion. </span><strong style=\"vertical-align: baseline;\">More importantly, we’re introducing three major updates, directly inspired by your feedback since the initial preview, </strong><span style=\"vertical-align: baseline;\">to bring programmability, real-time visibility, and automated guardrails to your cost-control playbook.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How the new spend caps can help your business </span></h3>\n<p><span style=\"vertical-align: baseline;\">We have significantly enhanced the usability and power of spend caps in three ways: </span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Automation through spend caps API</strong><span style=\"vertical-align: baseline;\">: Managing guardrails manually across hundreds of projects is a major operational challenge. To address this, we have launched the spend caps API, which can be accessed from the existing Cloud Billing Budgets API. You can now programmatically enforce your financial boundaries for eligible services within each project, without additional overhead. You can automatically lift, update, or delete caps on the fly and instantly apply a spend cap whenever a developer spins up a new sandbox project.</span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">Real-time visibility with live cost reports: </strong><span style=\"vertical-align: baseline;\">Spend caps for AI services trigger within minutes of usage using estimated, live costs. When a cap triggers, you need to know exactly why and when the limit was breached. You can now view these faster, estimated costs directly inside your Cost Reports. Instead of waiting hours for standard billing pipelines to settle net costs, you get the exact financial snapshots that triggered the enforcement, giving you the immediate context needed to run a precise root-cause analysis.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Live Costs - Hi Res Mock\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Live_Costs_-_Hi_Res_Mock.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. Automated guardrails for your monthly resets: </strong><span style=\"vertical-align: baseline;\">Before, once a spend cap was triggered, the usage block remained locked until you manually lifted it in the UI. Today, we are introducing automated monthly resets. You no longer need to worry about manually lifting caps every month. Enforced spend caps will automatically reset, and blocked services will seamlessly resume at the beginning of the next month. However, if your governance policies require a strict manual audit before resuming operations, the manual override option continues to exist exactly as before. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Best practices for deploying spend caps</span></h3>\n<p><span style=\"vertical-align: baseline;\">As you roll out spend caps across your organization, keep these operational tips in mind:</span></p>\n<ol>\n<li><strong style=\"vertical-align: baseline;\">Target non-production environments first</strong><span style=\"vertical-align: baseline;\">: Start by applying strict, low-dollar spend caps to your developer sandboxes, testing clusters, and experimental AI agent playgrounds.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Configure alerts wisely</strong><span style=\"vertical-align: baseline;\">: Default alerts are automatically sent to billing administrators and project owners at 50%, 80%, and 100% of the cap. Make sure the right folks are set up in these roles. This ensures your team is never caught off guard when a budget is nearing depletion. Spend caps permissions can also be added to custom roles, if needed.  </span></li>\n<li><strong style=\"vertical-align: baseline;\">Understand fixed vs on-demand costs</strong><span style=\"vertical-align: baseline;\">: Spend caps halt pay-as-you-go and CUD-covered requests once the budget threshold is hit. However, Provisioned Throughput is never halted; requests using reserved capacity will continue to run, and serve traffic normally.</span></li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Refresher on GCP’s dual-pronged defense playbook</span></h3>\n<p><span style=\"vertical-align: baseline;\">Spend Caps work seamlessly alongside our native Early Anomalies Detection to provide a closed-loop defense for your cloud spend. Read our previous </span><a href=\"https://cloud.google.com/blog/topics/cost-management/new-early-anomalies-and-spend-caps-on-google-cloud-budgets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\"> for a detailed explanation on how to use these tools to effortlessly set up a GCP defense playbook. <br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Playbook step</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Feature</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Focus</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Core action</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Key benefit</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Step 1</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Early anomalies</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Predictive monitoring</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Analyzes early cost signals daily to alert you of directional spend variances</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Spot anomalous cost spikes early and pinpoint the exact SKU driving the trend</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Step 2</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Spend caps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Financial enforcement</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Programmatically pauses usage for a specific project/service once a budget is breached</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Absolute protection against runaway spend without deleting resources</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Spend caps are now ready to support your workloads at scale. Read our </span><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> for more details and navigate to the </span><a href=\"https://pantheon.corp.google.com/billing/budgets?e=13802955&amp;mods=prod_coliseum\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Budgets and Alerts</span></a><span style=\"vertical-align: baseline;\"> page in your Google Cloud Billing Console, to set your first spend cap. </span></p>\n<p><span style=\"vertical-align: baseline;\">To integrate programmatic guardrails into your deployment workflows, check out our newly published spend caps API </span><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
