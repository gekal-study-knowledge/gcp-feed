    "summary": "<h2 class=\"release-note-product-title\">Google SecOps</h2>\n<h3>Feature</h3>\n<p><strong>Basic Mode search</strong></p>\n<p>This feature is in public preview. The <strong>SIEM Search</strong> page now provides two search-execution modes: <strong>Basic Mode</strong> and <strong>Advanced Mode</strong>. <strong>Basic Mode</strong> (the default option) uses a streamlined, fast-path execution pipeline that bypasses secondary enrichment steps during search execution. This approach reduces end-to-end search wait times while preserving full data fidelity and query syntax parity. <strong>Advanced Mode</strong> is equivalent to the previous search experience.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/chronicle/docs/investigation/udm-search.md#choose-search-execution-mode\">Choose the search-execution mode</a> and <a href=\"https://docs.cloud.google.com/chronicle/docs/investigation/udm-search#search-execution-modes\">Understand the search-execution modes</a>.</p>"
