    "title": "Google Public Sector と SUNY、大学の研究を加速する AI 対応プラットフォームを開設"
    "link": "https://cloud.google.com/blog/ja/topics/public-sector/gps-suny-launch-ai-enabled-platform-to-accelerate-university-research/"
    "published": "2026-10-26 10:00:00"
    "fetched": "2026-10-26 18:44:08"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 9 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/topics/public-sector/gps-suny-launch-ai-enabled-platform-to-accelerate-university-research?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>公立研究大学は、社会が直面する最も差し迫った課題の解決に取り組んでいますが、アイデアを画期的な成果へと結び付けるには、最先端テクノロジーへの迅速かつセキュアなアクセスが欠かせません。エージェント型 AI の時代において、研究機関にはかつてない機会が訪れています。膨大なデータセットの処理、複雑なワークフローの実行、そして科学的発見の劇的な加速を実現するインテリジェント システムを活用できるようになるからです。</p><p>このたび、<a href=\"https://www.googlecloudevents.com/GeminiatWork2026\" target=\"_blank\">Gemini at Work</a> で、ニューヨーク州立大学（SUNY）との協業による SUNY AI Platform の開設を発表しました。本プラットフォームは、Gemini Enterprise を搭載し、Google Cloud 上に構築されたセキュアな AI およびハイ パフォーマンス コンピューティング環境です。</p><p>当初は SUNY の中で最も研究に重点を置く 9 つのキャンパスで展開されるこのプラットフォームは、研究者が仮説から発見へとよりスピーディに移行できるよう支援するとともに、ニューヨークの学生や人材が AI 主導の経済環境に適応できるよう設計されています。</p><p><b>実社会に寄与する研究</b></p><p>SUNY の研究者は、ニューヨーク州内外の地域社会に直結する課題の解決に取り組んでいます。具体的な取り組みとしては、気象予測の精度向上、水質問題の早期発見、がん治療に向けた DNA シーケンシング、診断精度を高める高解像度脳画像データの解析などが挙げられます。</p><p>このような取り組みをサポートするため、SUNY AI Platform では、あらゆる技術的背景を持つ研究者が Google Cloud の高度な機能を簡単に活用し、その恩恵を受けられるようにしています。本プラットフォームは、ストレージ、ハイ パフォーマンス コンピューティング、Gemini Enterprise、200 以上の信頼できる AI モデルを、シームレスかつ一元化された 1 つのエコシステムに統合しています。個々のチームやキャンパスがこれらの機能を独自に準備する必要はなく、すべての研究者が共通の基盤上で研究を進められます。これにより、データ分析の簡素化、研究機関を跨ぐコラボレーションの促進、そして一貫したガバナンスや「責任ある AI への取り組み」の適用が可能になります。</p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=jPHyVk2zZ1U\">\n\n      \n        <img alt=\"New Way Now: SUNY、Google Cloud の活用により社会と科学にもたらす公益を推進\" src=\"https://img.youtube.com/vi/jPHyVk2zZ1U/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n        \n          <p>New Way Now: SUNY、Google Cloud の活用により社会と科学にもたらす公益を推進</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=jPHyVk2zZ1U\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p><b>SUNY コミュニティへの AI 対応スキルの展開</b></p><p>インパクトを生み出すのは、テクノロジーそのものではなく「人」です。</p><p>この協業の一環として、SUNY は業界で高く評価されている Google のセルフペース型 AI 認定資格を大学システム全体で導入し、学生や教職員が無料で受講できるようにしています。各コースは 5〜10 時間程度で修了でき、事前知識や経験は一切不要です。効果的なプロンプトの作成、複雑な課題の解決、AI ツールの責任ある活用など、実務に役立つ実践的なスキルを習得できます。さらに SUNY は、<a href=\"https://grow.google/certificates/\" target=\"_blank\">Google Career Certificates</a> を学術プログラムに組み込む取り組みも進めています。これにより、学生は学位の取得と同時に、社会で即戦力となる技術スキルを身につけて卒業できるようになります。</p><p>SUNY AI Platform とこれらの学習機会は、AI 導入に対するより包括的なアプローチを示すものです。つまり、高度なテクノロジーへのアクセスと、それを責任を持って現場で活用するために必要なスキルや組織体制を組み合わせて提供するというアプローチです。</p><p>SUNY が提供する無料の AI 学習ツールとリソースについては、<a href=\"https://www.suny.edu/google/\" target=\"_blank\">suny.edu/google</a> をご覧ください。あわせて、SUNY の研究データ戦略担当ディレクター、Catherine Stollar Peters 氏が出演する<a href=\"https://www.youtube.com/watch?v=jPHyVk2zZ1U\" target=\"_blank\">パートナーシップ動画</a>もぜひご覧ください。学術界のリーダーたちが AI を活用して教育や公共部門をどのように変革しているかを紹介しています。</p><p>また、10 月 20 日に開催される <a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\">Google Public Sector Summit</a> にご参加いただくと、公共部門のリーダーたちが AI を活用して組織を変革している事例を直接聞くことができます。</p><p><b><i>-</i></b> <i>Google Public Sector、米国教育機関、州政府、地方自治体担当マネージング ディレクター、</i><b><i>Matt Schneider</i></b></p></div>"
