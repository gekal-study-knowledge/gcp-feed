    "summary": "<h2 class=\"release-note-product-title\">Cloud Database Migration Service</h2>\n<h3>Feature</h3>\n<p>You can now create heterogeneous conversion workspaces by importing database\nschema metadata files from a Cloud Storage bucket without requiring direct\nnetwork connectivity between Database Migration Service and your source database during\nthe schema conversion phase. For more information, see the following pages:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/database-migration/docs/oracle-to-postgresql/create-conversion-workspace#use-cloud-storage\">\nCreate a conversion workspace for Oracle to Cloud SQL for PostgreSQL</a></li>\n<li><a href=\"https://docs.cloud.google.com/database-migration/docs/oracle-to-alloydb/create-conversion-workspace#use-cloud-storage\">\nCreatea a conversion workspace for Oracle to AlloyDB for PostgreSQL</a></li>\n<li><a href=\"https://docs.cloud.google.com/database-migration/docs/sqlserver-to-csql-pgsql/create-conversion-workspace#use-cloud-storage\">\nCreatea a conversion workspace for SQL Server to Cloud SQL for PostgreSQL</a></li>\n<li><a href=\"https://docs.cloud.google.com/database-migration/docs/sqlserver-to-alloydb/create-conversion-workspace#use-cloud-storage\">\nCreatea a conversion workspace for SQL Server to AlloyDB for PostgreSQL</a></li>\n</ul>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Model Armor enforces the\n<code>constraints/modelarmor.managed.requireTemplateDataResidencyCompliance</code> managed\nOrganization Policy Service constraint by default. When you create or update a template,\nthis constraint prevents you from setting <code>data_residency_compliant</code> to <code>false</code>\nor clearing the <strong>Enforce data residency</strong> option unless an Organization Policy\nAdministrator disables the constraint. This feature is generally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>). For more\ninformation, see\n<a href=\"https://docs.cloud.google.com/model-armor/manage-templates#disable-data-residency-constraint\">Disable the organization policy constraint for data\nresidency</a>.</p>\n<h2 class=\"release-note-product-title\">Oracle Database@Google Cloud</h2>\n<h3>Feature</h3>\n<p>The Oracle Database@Google Cloud remote MCP server is <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a> and adds tools to create and manage Database Connections and run SQL statements with <code>database_connection_executesql</code>. It lets you interact easily with Oracle Database@Google Cloud resources from LLMs, AI applications, and AI-enabled development platforms.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/oracle/database/docs/use-oracledatabase-mcp\">Use the Oracle Database@Google Cloud remote MCP server</a>.</p>"
