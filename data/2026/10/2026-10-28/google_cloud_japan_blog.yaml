  "a99b8209267afc15a25fa13b08cb5e54":
    "id": "a99b8209267afc15a25fa13b08cb5e54"
    "title": "Gemini エージェントがスタートアップにもたらすメリット"
    "link": "https://cloud.google.com/blog/ja/topics/startups/what-the-gemini-agent-means-for-startups/"
    "published": "2026-10-28 10:20:00"
    "fetched": "2026-10-28 19:58:58"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/startups/what-the-gemini-agent-means-for-startups?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">小規模なチーム、限られたランウェイ、そして常に迅速なプロダクト提供を求められるプレッシャー。これは、Google for Startups が日々ともに働く起業家たちが直面している現実です。会社をゼロから立ち上げる際、運用上のオーバーヘッドやインフラストラクチャ構築に費やす時間は、コアプロダクトの開発に割くべき時間を削ることになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">先週開催された Gemini at Work 2026 で、Google は </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェントを発表</span></a><span style=\"vertical-align: baseline;\">しました。これは、パーソナル アシスタントとしても、チームの専任メンバーとしても機能する汎用エージェントです。そして今週、新しいフロンティア モデルである </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\"> の一般提供を開始しました。このモデルは、長時間のマルチステップ タスク全体を通してコンテキストを維持するようにトレーニングされています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、Gemini エージェントの仕組み、創業者に役立つ 5 つのポイント、そしてスタートアップが実力以上の成果を上げるためにこれをどう活用しているかをご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini エージェントとは</strong></h4>\n<p><span style=\"vertical-align: baseline;\">文書作成、コーディング、データ分析ごとに、別々の chatbot にプロンプトを入力する必要はもうありません。Gemini エージェントなら、1 つのエージェントが大まかな目標を理解し、完成した成果物まで仕上げて提供します。これは、次の 3 つの原則によって定義されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">統合型:</strong><span style=\"vertical-align: baseline;\"> 1 つのエージェントで、ナレッジワーク、データ分析、クリエイティブ アセットの生成、コードの記述と実行を処理できるようになりました。複雑なジョブの場合、専用の一時的なサブエージェントを動的にスピンアップし、それらの作業を並列または順次連携させます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">どこからでもアクセス可能:</strong><span style=\"vertical-align: baseline;\"> ウェブ、コマンドライン、デスクトップ、モバイルなど、日常的に使うあらゆる環境で動作します。さらに、Gmail、ドキュメント、スプレッドシート、スライド、ドライブ、Chat、カレンダーにもネイティブに対応しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">永続性:</strong><span style=\"vertical-align: baseline;\"> クラウド上で動作し、4 つの領域（セッション、セマンティック、手続き、エピソード）にわたって連続的なメモリーを保持します。新規採用者のように自ら業務に慣れ、チーム、ツール、ビジネス コンテキストを学習するため、プロンプトごとに自社について説明し直す必要はありません。また、ノートパソコンを閉じた後も、数日間にわたるタスクを進め続けることができます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">5 つの役割を同時にこなす創業者にとって、Gemini は、カレンダー、プロジェクト、ドキュメントの状況をすでに把握している「デジタル参謀」のように機能します。マーケット トレンドの調査、スプレッドシートでの財務モデル作成、そしてその両方を網羅した提案資料の作成まで、各ステップでプロジェクト概要や目標を繰り返し説明することなく、Gemini にまとめて依頼できます。また、先回りして自発的に機能します。投資家から最新のプロダクト アップデートを資料として求めるメールが届くと、Gemini がそのリクエストを検知して処理を提案します。ワンクリックで作業が完了し、すぐに共有やレビューが可能な状態で手元に戻ってきます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">スタートアップ向けの 5 つの重要ポイント</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">1. コワーカー エージェントとスキルでアウトプットを拡大</strong></p>\n<p><span style=\"vertical-align: baseline;\">個人のアシスタント機能にとどまらず、チーム全体と連携する持続的な</span><strong style=\"vertical-align: baseline;\">コワーカー エージェント</strong><span style=\"vertical-align: baseline;\">を作成することもできます。各エージェントには、それぞれ専用の Workspace アカウント、メールアドレス、ドライブ ストレージ、ディレクトリ情報が付与されます。リリース コーディネーター、QA トリアージ担当者、財務アナリストといった特定の役割を設定すれば、チームメンバーは Chat スペースにエージェントを追加したり、Google ドキュメントのコメントで </span><code style=\"vertical-align: baseline;\">@名前リンクを追加</code><span style=\"vertical-align: baseline;\">したりして作業を委任できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、エージェントに再利用可能な</span><strong style=\"vertical-align: baseline;\">スキル</strong><span style=\"vertical-align: baseline;\">を持たせるだけでなく、Gemini が業務プロセスを学習しながら自らスキルを作成することも可能です。たとえば、BigQuery や Knowledge Catalog と連携した運用レポートスキルを使えば、チームの誰もが平易な言葉で質問するだけで、リアルタイムのレポートを作成して保存できます。一度保存すれば、追加のトークンコストをかけることなく、必要なときにいつでもレポートを実行できます。さらに Gemini では、法務や金融サービスをはじめとする、特定の領域に特化した事前構築済みの機能も提供しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スタートアップにとっての意味:</strong><span style=\"vertical-align: baseline;\"> コワーカー エージェントによってチームの対応力を即座に引き上げることができます。また、スキルを活用することで、投資家向けレポートや運用レポートなどの定期的なプロセスを標準化し、実行のたびにトークンを消費することもなくなります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">2. オープンモデルとサードパーティ モデルを自由に選択</strong></p>\n<p><span style=\"vertical-align: baseline;\">Gemini はエージェントであり、その基盤となるモデルは自由に選択できます。スタートアップのアーキテクチャが成熟するにつれて、すべてのタスクを単一のフロンティア モデルに処理させると、粗利益が急速に圧迫されます。Gemini エージェントを使用すると、Gemini モデル、Anthropic の Claude などのサードパーティ モデル、</span><a href=\"https://cloud.google.com/blog/topics/startups/why-your-startup-needs-open-models-alongside-frontier-apis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemma</span></a><span style=\"vertical-align: baseline;\"> などの軽量なオープンモデルの間で、ワークロードを動的にルーティングできます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スタートアップにとっての意味:</strong><span style=\"vertical-align: baseline;\"> ロックインされることなく、柔軟性を確保できます。大量の決定的ジョブにはコンパクト モデルを、複雑な推論にはフロンティア モデルを使用することで、タスクあたりのコストを最適化できます。また、プロダクトの進化に合わせて、ワークフローを再構築することなくモデルを入れ替えることができます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">3. サービスやツールに接続</strong></p>\n<p><span style=\"vertical-align: baseline;\">エージェントの有用性は、アクセスできるシステムによって決まります。Gemini エージェントは、Google Workspace に加え、パートナー ソリューションを含むエンジニアリング、データ、ビジネスの各種スタックに直接接続できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">開発とコラボレーション:</strong><span style=\"vertical-align: baseline;\"> Git、Slack、Jira など。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データとローカル ファイル:</strong><span style=\"vertical-align: baseline;\"> BigQuery、Postgres、Snowflake、Databricks などに加え、デスクトップ上のファイルにも対応。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">MCP を介したカスタムツール:</strong><span style=\"vertical-align: baseline;\"> ネットワーク内外の Model Context Protocol（MCP）サーバー。エンジニアが社内ツールを構築して共有できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">スタートアップにとっての意味:</strong><span style=\"vertical-align: baseline;\"> カスタム コネクタの保守にエンジニアのリソースを割く代わりに、エージェントを既存のコードベース、データベース、MCP ツールに直接接続して、データの所在を問わずリアルタイムに操作できるようになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">4. 組み込みのセキュリティとガバナンス</strong></p>\n<p><span style=\"vertical-align: baseline;\">B2B スタートアップにとって、大企業によるセキュリティ監査は、商談が失速しやすい大きな関門です。バックグラウンドでは、各エージェントに暗号化された</span><strong style=\"vertical-align: baseline;\">エージェント ID</strong><span style=\"vertical-align: baseline;\"> が割り当てられ、明確な監査証跡が確保されます。また、エージェントは分離されたサンドボックス内で実行され、組み込みのプロンプト インジェクション防御機能によって保護されます。外部トラフィックは </span><strong style=\"vertical-align: baseline;\">Agent Gateway</strong><span style=\"vertical-align: baseline;\"> を経由してルーティングされるため、ガバナンス ポリシーを確実に適用できます。さらに、コワーカー エージェントもそれぞれ Workspace アカウントを持つため、管理の手間はこれまでのユーザー管理とまったく変わりません。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スタートアップにとっての意味:</strong><span style=\"vertical-align: baseline;\"> 大企業の最高情報セキュリティ責任者から、AI ワークフローにおけるデータ プライバシー、プロンプト インジェクション、アクセス制御への対策を問われても、すでにエンタープライズ グレードのアーキテクチャが整っているため、調達プロセスのハードルをスムーズにクリアできます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">5. リアルタイムのコスト管理でランウェイを保護</strong></p>\n<p><span style=\"vertical-align: baseline;\">サブエージェントを数時間から数日間にわたって実行する自律型エージェントは、ループ処理をチェックしないままでいると、すぐに請求額が膨れ上がってしまいます。こうした事態を防ぐため、Cloud Billing コンソールでリアルタイムの費用上限を直接設定できるようになりました。上限に達するとプロジェクトのエージェントが自動的に一時停止するため、バグによる予期せぬ高額請求を確実に回避できます。その基盤として、Gemini は推論に最適化された TPU 8i を含む </span><a href=\"https://cloud.google.com/ai-infrastructure?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google による特化型 AI インフラストラクチャ</span></a><span style=\"vertical-align: baseline;\">上で動作し、前世代比で 80% 優れたコスト パフォーマンスを実現します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スタートアップにとっての意味:</strong><span style=\"vertical-align: baseline;\"> 創業者や開発者は、長時間動く並列エージェント ループの試行錯誤に安心して取り組めます。標準で備わった財務セーフティ ネットが手元資金を守り、投資家からの信頼確保にもつながります。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">すでに実践している創業者</strong></h4>\n<p><span style=\"vertical-align: baseline;\">スタートアップや AI ネイティブなイノベーターは、すでに Gemini を活用しています。没入型ストーリーテリング プラットフォームを提供する</span><a href=\"https://cloud.google.com/transform/whenere-dreamlands-gemini-jane-austen-fortnite-future-of-fan-fiction\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Whenere</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> は Dreamlands を活用</span></a><span style=\"vertical-align: baseline;\">して、名作小説『高慢と偏見』の世界を Fortnite 上に再現しました。Dreamlands は Gemini 基盤のエージェント型 3D ワールド構築プラットフォームであり、Gemini は新しいオブジェクトごとにテクスチャを約 7 秒、10 セント未満のコストで生成しました。あるアーティストは、1 日で約 250 個のカスタム アセットを作成し、歴史的に忠実な邸宅を 1 週間足らずで完成させました。アプリケーション構築プラットフォームの </span><strong style=\"vertical-align: baseline;\">Lovable</strong><span style=\"vertical-align: baseline;\"> をはじめ、</span><strong style=\"vertical-align: baseline;\">OpenEvidence</strong><span style=\"vertical-align: baseline;\">、</span><strong style=\"vertical-align: baseline;\">Recursion</strong><span style=\"vertical-align: baseline;\">、</span><strong style=\"vertical-align: baseline;\">Replit</strong><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">など</span></a><span style=\"vertical-align: baseline;\">のスタートアップやイノベーターも、この動きに加わっています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Google for Startups で構築</strong></p>\n<p><span style=\"vertical-align: baseline;\">エージェント時代の到来により、社内業務を担うコワーカー エージェントのデプロイから、プロダクトへのエージェント型ワークフローの直接組み込みまで、少数精鋭のチームであっても実力以上の大きな成果を生み出せるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの新しい Gemini エージェント機能はまだ一般公開されていませんが、スタートアップのお客様は </span><a href=\"https://cloud.google.com/contact\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google のセールスチームにお問い合わせ</span></a><span style=\"vertical-align: baseline;\">いただくことで、詳細の確認や今後の準備についてご相談が可能です。また、</span><a href=\"https://startup.google.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups プログラム</strong></a><span style=\"vertical-align: baseline;\">で、クレジット、実践的な技術ガイダンス、メンターシップ、グローバルな創業者コミュニティ プログラムなどもご利用いただけます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、グローバル スタートアップおよび投資家エコシステム担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Darren Mowry</strong></p></div>"
  "10a81d0dc3a4d1188e52e8da3e515be9":
    "id": "10a81d0dc3a4d1188e52e8da3e515be9"
    "title": "Google Antigravity で Claude Opus 5.5 と Claude Sonnet 5.5 が利用可能に"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/claude-opus-55-and-claude-sonnet-55-available-in-antigravity/"
    "published": "2026-10-28 10:00:00"
    "fetched": "2026-10-28 19:58:58"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 21 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/ai-machine-learning/claude-opus-55-and-claude-sonnet-55-available-in-antigravity?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>手早いバグの修正の繰り返しから複雑な移行の計画まで、タスクごとに適したモデルは異なります。</p><p>オープンなエコシステムへの取り組み、そしてあらゆるタスクに最適なモデルを開発者に提供するという Google Cloud のコミットメントに基づき、<b>Google Cloud をご利用のお客様は Google Antigravity で Claude Opus 5.5 と Claude Sonnet 5.5 をお使いいただけるようになりました。</b>Claude Opus 5.5 は複雑なタスク向けに設計されているのに対し、Claude Sonnet 5.5 はより高速かつ低コストな補完モデルです。</p><p>管理者によって有効化されると、開発者はモデル選択ツールから Claude Opus 5.5 と Sonnet 5.5 を直接選択できるようになります。管理者は、Gemini 3.8 Flash や Gemini 4 Argon を含む Google の Gemini モデルを選択することもできます。これらのモデルは、Antigravity 2.0、Antigravity CLI のほか、VS Code、JetBrains IntelliJ、Visual Studio 向けに最近リリースされた <a href=\"https://antigravity.google/docs/ide/extensions/\" target=\"_blank\">Antigravity IDE 拡張機能</a>に適用されます。これにより、エンタープライズ共通の請求枠組みとセキュリティ境界のもとで、タスクに最適なモデルを選択できるようになります。</p><p>この投稿では、これらのモデルを使用して Antigravity で開発を行うための 2 つのエンジニアリング パターンをご紹介します。全サブスクリプション プランにおいて Antigravity でサポートされているモデルの一覧については、<a href=\"https://antigravity.google/docs/models/\" target=\"_blank\">こちらのドキュメント</a>をご覧ください。</p><h3><b>Antigravity のマルチモデル エンジニアリング パターン</b></h3><p>同じエージェント ハーネス内で複数のモデル ファミリーを利用可能にすることで、レイテンシとコストを管理しながらコードの品質を高める、実践的なマルチモデル ワークフローが実現します。</p><p><b>パターン 1: ループ ワークフローとグラフ ワークフローでのクロスモデル検証（「LLM-as-a-Judge」）</b></p><p>エージェント ループや複数ステップのグラフ ワークフローを構築する際、コードの記述と自身の出力のレビューに同じモデルを使用すると、そのモデル固有の盲点を補強してしまう恐れがあります。2 つの異なるモデル ファミリーを組み合わせ、一方を実装者、他方を検証者（判定者）とすることで、ワークフローの次のステージに進む前に第三者的な検証が可能になります。</p><p>Antigravity では、このパターンをインタラクティブに実行することも、自動化されたサブエージェントを介して実行することもできます。</p><ol><li><b>モデル A で計画と実装を行う:</b> Claude Opus 5.5 または Gemini 4 Argon を使用してプランニング モードで開始し、複数ファイルにわたる変更の設計と実装を行います。</li><li><b>モデル B で検証する:</b> ループの変更を commit するか、次のステップへ進める前に、モデルを切り替えるか、CLI で単発の /model チェックを呼び出して、別のモデル ファミリーにテストスイートや要件に照らして実装を評価させます。</li></ol><p><b>パターン 2: 推論モデルと Flash サブエージェントの組み合わせ</b></p><p>複雑なエンジニアリング タスクでは、高度な推論を要する少数の意思決定と、大量の機械的なルックアップ（ファイルの検索、ログの grep、lint 出力の確認、テスト失敗の分類など）が組み合わされることがよくあります。すべてのルックアップをフロンティア モデルで実行すると、レイテンシとコストの両方が増加する可能性があります。</p><p>Antigravity のサブエージェント カスタマイズ システム（.agents/agents/*.md）を使用すると、特定のモデルティア（inherit、flash、pro）を専門のサブエージェントに割り当てることができます。プライマリ セッションでより強力なモデルを稼働させている場合、以下のように動作します。</p><p>model: inherit が設定されたサブエージェントは、高度な推論を要するサブタスクに対してアクティブなセッション モデルを使用します。</p><p>model: flash が設定されたサブエージェントは、高速な検索、分類、トリアージ作業を Gemini Flash モデルにオフロードします。</p><p>たとえば、.agents/agents/test-triager.md で高速なログ トリアージ サブエージェントを以下のように定義できます。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;---\\r\\nname: test-triager\\r\\ndescription: Runs unit tests, classifies failures, and returns a concise summary of failing assertions.\\r\\nmodel: flash\\r\\ntools:\\r\\n  - read\\r\\n  - edit\\r\\n---\\r\\n\\r\\nRun the requested test targets, classify any failures by root cause (compilation error, assertion failure, or timeout), and return a structured summary to the parent agent.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6c655314d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>また、.agents/agents/gemini-judge.md では、クロスモデルのコードレビュー担当者サブエージェントを以下のように定義できます。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;---\\r\\nname:cross-model-judge\\r\\ndescription: Independent LLM-as-a-judge verifier that audits diffs and edge cases using Gemini Pro.\\r\\nmodel: pro\\r\\ntools:\\r\\n  - read\\r\\n---\\r\\n\\r\\nReview the current workspace diff against the user&#x27;s requirements. Check for regressions, missing edge-case tests, and security issues. Output a pass/fail verdict with specific line references.&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6c6550ee50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>この設定により、高速な「テストと分類」のループを test-triager に委任し、cross-model-judge をトリガーして最終的なコード差分を検証できます。これにより、各モデルの強みを単一のワークフロー内で活かすことが可能になります。</p><h3><b>ご利用にあたって</b></h3><p>Claude Opus 5.5 と Claude Sonnet 5.5 は、Antigravity を使用している Google Cloud のお客様にご利用いただけます。</p><ol><li><b>管理者（Gemini for Business）:</b> サードパーティのパートナー モデルは、プールされている Gemini Enterprise Standard および Plus エディションの月間トークン割り当てから消費されることはありません。代わりに、既存の Google Cloud 請求先アカウントを通じて従量課金制で請求されるため、超過料金の設定を有効にする必要があります。Google Cloud コンソールで [Gemini Enterprise] &gt; [設定] &gt; [AI デベロッパー ツール] に移動して、超過料金の請求、費用の上限、組織のパートナー モデルの承認を構成します。詳しい手順については、<a href=\"https://cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings\">AI デベロッパー ツールの設定方法</a>をご覧ください。</li><li><b>管理者（Gemini プラットフォーム）:</b> Gemini プラットフォームの API 経由で Antigravity をご利用の場合も、パートナー モデルを有効化できます。Model Garden で Claude モデルを有効化し、Anthropic の標準利用規約に同意してください。</li><li><b>開発者:</b> Antigravity 2.0、Antigravity CLI、または Antigravity IDE 拡張機能を最新バージョンに更新し、モデル選択ツールを開いて（または /model を実行して）、タスクに適したモデルを選択します。エンタープライズ ガバナンスやマルチエージェント構成の詳細については、<a href=\"https://antigravity.google/docs/enterprise/\" target=\"_blank\">Google Antigravity Enterprise のドキュメント</a>をご覧ください。ワークスペースの状態、開いているアーティファクト、ターミナルのコンテキストを保持したまま、同じ会話スレッド内のターン間でアクティブなモデルを切り替えることが可能です。</li></ol><p><sup>注: コンテキスト管理や要約といった高頻度で発生するクライアントサイドの調整処理のために、軽量なファースト パーティの Gemini モデルがバックグラウンドで引き続き稼働します。これらのモデルはファースト パーティ トークンを消費するため、料金が発生する場合があります。</sup></p><p><b><i>-</i></b> <i>Google Cloud、プロダクト マーケティング マネージャー、</i><b><i>Marialaura Garcia</i></b></p><p><b><i>-</i></b> <i>Google Antigravity、デベロッパーリレーションズ、</i><b><i>Rich Hyndman</i></b></p></div>"
  "f108f13ccaf83d55c3115605d664505f":
    "id": "f108f13ccaf83d55c3115605d664505f"
    "title": "グローバル規模のハードウェア格納型セキュリティ: NVIDIA Blackwell を搭載した Confidential G4 の一般提供を開始"
    "link": "https://cloud.google.com/blog/ja/topics/ai-infrastructure/confidential-g4-gpus-are-ga/"
    "published": "2026-10-28 01:00:00"
    "fetched": "2026-10-28 19:58:58"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 22 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/confidential-g4-gpus-are-ga?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">自律型エージェントを本番環境に導入するには、機密データや貴重な知的財産をリアルタイムで処理する必要があります。独自のモデルの重み、ユーザー プロンプト、生成された出力を守るには、計算処理を実行している最中のデータを保護するセキュリティが必要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業のセキュリティを確保するための取り組みの一環として、このたび、NVIDIA RTX PRO 6000 Blackwell Server Edition GPU を搭載した Google Cloud の G4 インスタンスで Confidential Computing の一般提供を開始したことをお知らせいたします。このリリースにより、NVIDIA Confidential Computing が </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud の AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> に直接統合され、プライバシーを損なうことなくスケーリングに必要な動的パフォーマンスを実現します。</span></p>\n<p><span style=\"vertical-align: baseline;\">今年に入って </span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/verifiable-trust-in-the-ai-era-whats-new-in-confidential-computing?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 のプレビュー版</span></a><span style=\"vertical-align: baseline;\">を発表した際、そのグローバルな展開規模についてお話ししました。このたび、</span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/supported-configurations#g4-machine-type\"><span style=\"text-decoration: underline; vertical-align: baseline;\">36 のゾーン</span></a><span style=\"vertical-align: baseline;\">にまたがり、</span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#consumption_option_availability_by_machine_type\"><span style=\"text-decoration: underline; vertical-align: baseline;\">複数の利用モデル</span></a><span style=\"vertical-align: baseline;\">に対応したこれらのインスタンスを、</span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine VM</span></a><span style=\"vertical-align: baseline;\"> と </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE ノード</span></a><span style=\"vertical-align: baseline;\">にて、一般提供を開始いたしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、安全なマルチパーティ データ共有を可能にする </span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-space/docs/confidential-space-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Space</span></a><span style=\"vertical-align: baseline;\"> のサポートも、今後数週間かけて順次一般提供される予定です。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">機密データとモデルを低レイテンシで保護</strong></h3>\n<p><span style=\"vertical-align: baseline;\">使用中のデータを保護するために、GPU スループットや運用のアジリティを犠牲にする必要はありません。エクスポート不可のハードウェア キー、検証可能なリモート認証、透過的なメモリ暗号化を統合した Confidential G4 は、エージェント型ワークロードや推論ワークロードへの投資効果を最大化します。企業は、厳格な規制要件やコンプライアンス要件を満たしながら、コストを低く抑えることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">「組織がクラウド、オンプレミス、エージェント環境など、ますます複雑化する環境に AI をデプロイするなかで、機密データの保護は極めて重要となっています。また、AI システムがセキュリティを確保したうえで、自社のポリシーに準拠して一貫して動作することを担保しなければなりません。NVIDIA RTX PRO 6000 Blackwell GPU を搭載した Google Cloud Confidential G4 VM は、プライバシー保護型の AI および AI 運用に向けた強力な基盤を提供します。Confidential Core AI は Google Cloud 上で動作し、企業の原則、ポリシー、運用要件を、AI エージェント、モデル、データ、ツールをモニタリングおよび統制するリアルタイムの安全保護対策へと落とし込みます。これらの機能を組み合わせることで、組織は管理、機密性、説明責任を維持しながら、Google Cloud 上で信頼性の高い AI を大規模に展開できます。」</span><strong style=\"vertical-align: baseline;\">- Confidential Core AI、創業者 / CEO、Taher Behbehani 氏</strong></p>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ AI ワークロードにおけるその他のメリットは以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンドツーエンドの機密性と分離: </strong><span style=\"vertical-align: baseline;\">ハードウェアによって保護された実行環境でデータとモデル パラメータを暗号化し、知的財産やお客様の入力をホストシステム管理者、ハイパーバイザ、さらにはクラウド プロバイダによるアクセスから保護します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">検証可能な暗号化による信頼: </strong><span style=\"vertical-align: baseline;\">ハードウェアをルートとするリモート認証を活用し、機密データセットの解放やワークロードの実行前に、コード、プラットフォーム構成、環境の整合性を検証します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コードのリファクタリングが不要: </strong><span style=\"vertical-align: baseline;\">標準の Ubuntu OS イメージ、NVIDIA ドライバ、NVIDIA CUDA-X ライブラリを使用し、アプリケーションの変更やカスタムビルドを行うことなく、そのままモデルをデプロイできます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Polaris Cloud にとって、このデプロイの容易さはまさに画期的なものでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Polaris は AI エージェント用のワークスペースを開発しています。お客様は、エージェントの処理が実際にどこで実行されたのか、そしてその過程で暗号技術によって確実に分離されていたかを知る必要があります。Google Cloud Confidential G4 の登場によって、その課題は一気に解決しました。NVIDIA RTX PRO 6000 Blackwell GPU からハードウェア格納型の来歴を取得し、お客様が結果とともに受け取るレシートにバインドしています。それ以外は実質的に何も変わっていません。同じ G4 イメージ、同じ NVIDIA ドライバ、同じコンテナ ランタイムを使い、起動時にフラグを 1 つ指定するだけで、パフォーマンスもそのままです。これにより、お客様に対する当社の約束は、『お客様のエージェントを実行します』というものから『当社で実行するすべてのワークロードは検証可能です』というレベルへと、一夜にして引き上げられたのです。」</span><strong style=\"vertical-align: baseline;\">- Polaris Cloud、創業者 / CEO、Fred Esere 氏</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチパーティ データ コラボレーション: </strong><span style=\"vertical-align: baseline;\">Confidential Space を使用して、共同分析やモデルの共同トレーニングを安全に行うことができます。複数の関係者が、元となるプライベート データを互いに開示することなく、機密性の高いデータセットを組み合わせることができます。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「企業は、最も価値のあるデータを AI で活用しながら、その処理中の保護も両立させる必要があります。NVIDIA Confidential Computing は、GPU アクセラレーション ワークロードにハードウェア格納型の保護を提供し、使用中の機密データや独自モデルを守ります。Google Cloud と連携し、NVIDIA Blackwell のパフォーマンスとこれらのセキュリティ機能を Confidential G4 VM に導入することで、組織は高いパフォーマンスと検証可能な保護機能を備えた本番環境の AI を大規模に展開できるようになります。」</span><strong style=\"vertical-align: baseline;\">- NVIDIA、アクセラレーテッド コンピューティング プロダクト担当ディレクター、Dave Salvator 氏</strong></p>\n<h3><strong style=\"vertical-align: baseline;\">パフォーマンスのテスト</strong></h3>\n<p><span style=\"vertical-align: baseline;\">メモリ暗号化が運用に与える影響を把握するため、g4-standard-48 マシンシェイプを使用して、Confidential G4 インスタンスと標準の非 Confidential G4 インスタンスの比較分析を行いました。今回のテストでは、広く採用されているオープン ウェイト モデルに焦点を当てました。これらのモデルは、お客様が自社の推論パイプラインにおいて、単一の GPU インスタンスによくデプロイしているものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Llama 3、Llama 3.3、Resnet-50、SDXL などの主要なモデルを対象としたベンチマークでは、</span><strong style=\"vertical-align: baseline;\">Confidential G4 は AI 推論ワークロードにおいて標準の G4 インスタンスと同等のパフォーマンスを発揮し、スループットの低下は 3.5% 未満</strong><span style=\"vertical-align: baseline;\">（1 秒あたりのトークン数または画像数で測定）であることが示されています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">注:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">パフォーマンス測定結果は、特定のテスト条件および構成に基づくものです。実際のワークロードのパフォーマンスは、システムのセットアップ、選択するハードウェア、ソフトウェア環境によって異なる場合があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の分析結果は、機密データを保護し、コンプライアンス要件を満たしながら、スピーディーな展開を可能にします。この両立は、実際の導入現場ですでに実証されています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「当社のワークロードにおいて、Google Cloud の Confidential G4 と、まったく同じソフトウェアを稼働させた標準の G4 との比較ベンチマークを実施しました</span><span style=\"vertical-align: baseline;\">。エンドツーエンドのレイテンシ増加はわずか 5.2% にとどまり、その一方で、認証された環境外にいる権限のないユーザーによる会話の盗聴を防ぐ、ハードウェア レベルの保証が得られることがわかりました。このトレードオフなら、何度でも選ぶ価値があります。ユーザーはオンプレミス同等のプライバシーを確保しながら、クラウドの利便性を享受できるからです。」</span><strong style=\"vertical-align: baseline;\">- </strong><a href=\"https://vertebrae.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Vertebrae</strong></a><strong style=\"vertical-align: baseline;\">、CEO、Andy Qin 氏</strong></p>\n<h3><strong style=\"vertical-align: baseline;\">Confidential G4 を使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Confidential G4 を活用すれば、モデルの実行やエージェント ワークロードにおけるセキュリティを強化するにあたって、パフォーマンス、柔軟性、運用の容易さを犠牲にする必要はありません。スループットの低下をほぼゼロに抑えつつ、検証可能な信頼性と堅牢なハードウェア分離を提供することで、組織は価値の高いモデルを安全にデプロイし、重要なデータアセットをクラウド規模で保護できます。</span></p>\n<p><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GPU を使用した Confidential VMs のドキュメント</span></a><span style=\"vertical-align: baseline;\">に沿って、今すぐご利用を開始してください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Confidential Computing 担当プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Meghna Sreenivasan</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Confidential Computing 担当プロダクト リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sam Lugani</strong></p></div>"
