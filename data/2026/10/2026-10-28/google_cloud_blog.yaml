  "5aac114b4c26afc8063a8b3ed4d56ee9":
    "id": "5aac114b4c26afc8063a8b3ed4d56ee9"
    "title": "Securely connecting Gemini Enterprise to Snowflake data"
    "link": "https://cloud.google.com/blog/products/data-analytics/bridge-gemini-enterprise-and-snowflake-with-google-adk/"
    "published": "2026-10-28 01:00:00"
    "fetched": "2026-10-28 04:20:33"
    "summary": "<div class=\"block-paragraph\"><p>Enterprise AI needs to go beyond simple chat interfaces. To provide real value, AI agents must access your data warehouses to generate actionable insights, all while maintaining strict security and data governance.</p><p>This guide explores how to build a secure bridge between Google Cloud’s Gemini Enterprise and Snowflake. By using the Model Context Protocol (MCP) and the Google Agent Development Kit (ADK), you can empower your agent to act as an assistant that understands natural language, generates precise SQL via Snowflake Cortex and executes queries with user-level permissions.</p><h3><b>Choosing the right integration pattern</b></h3><p><b>Direct Connection vs. custom orchestration</b></p><p>The Google ADK architecture demonstrated in this post represents the advanced / custom orchestration pattern. It is designed for developers building complex, multi-agent systems on Google Cloud, such as workflows that combine Snowflake insights with external enterprise tools, custom reasoning loops, or cross-platform state management in Gemini Agent Engine.</p><p>For standard enterprise basic use cases where you want to connect Gemini Enterprise directly to Snowflake use the joint solutions mentioned in <a href=\"https://www.snowflake.com/en/developers/guides/quickstart-iceberg-cortex-gemini/\" target=\"_blank\">this link</a>.</p><h3><b>The architectural approach</b></h3><p>This architecture allows a business user to ask questions like, <i>\"What were our top 5 selling items in Texas last quarter?\"</i></p><p>Rather than exposing raw SQL execution to the client, the agent delegates both query generation and execution to a governed Snowflake Cortex Agent exposed through the Snowflake MCP server:</p><ol><li><b>Governed translation</b>: The ADK agent passes the user's natural language question to the Snowflake MCP server, which invokes the Cortex Agent (CORTEX_AGENT_RUN) backed by Cortex Analyst semantic view.</li><li><b>Direct execution within the governed boundary</b>: The Cortex Agent translates the question into SQL and executes it directly inside Snowflake using the authenticated user's OAuth session and role privileges, returning the structured results to the ADK agent.</li></ol><p>This approach provides deterministic text-to-SQL translation mapped to your corporate semantic definitions, keeps query execution inside Snowflake's governed boundary, and reduces the risk of schema hallucinations or unvalidated SQL execution.</p><h3><b>System architecture flow</b></h3><p>The diagram below illustrates the trust boundaries and the numbered flow of execution between the Gemini Enterprise app and Snowflake ecosystems.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_rLGaLNc.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Detailed execution sequence</b></h3><p>To highlight how the agent delegates natural language query translation and governed execution to the Snowflake Cortex Agent over MCP, see the sequence diagram below:</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_l1dz0na.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Step 1: Setting up the Snowflake security integration</b></h3><p>A major risk in enterprise AI is granting the model broad access via a generic service account, which could allow users to bypass security restrictions. We solve this by using OAuth 2.0 to perform user impersonation.</p><p>First, establish a confidential OAuth client in Snowflake to protect the client secret. The snippet below configures the security integration inside Snowflake:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;USE ROLE ACCOUNTADMIN;  \\r\\nCREATE OR REPLACE SECURITY INTEGRATION &lt;SECURITY_INTEGRATION_NAME&gt; \\r\\nTYPE = OAUTH \\r\\nENABLED = TRUE \\r\\nOAUTH_CLIENT = CUSTOM \\r\\nOAUTH_CLIENT_TYPE = &#x27;CONFIDENTIAL&#x27; \\r\\n-- Google Cloud&#x27;s official handshake receiver address: \\r\\nOAUTH_REDIRECT_URI = &#x27;https://vertexaisearch.cloud.google.com/oauth-redirect&#x27; \\r\\nOAUTH_ISSUE_REFRESH_TOKENS = TRUE \\r\\n-- Let the connection stay alive for 90 days (max Snowflake allowed limit) \\r\\nOAUTH_REFRESH_TOKEN_VALIDITY = 7776000;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac37062510&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>To retrieve the generated client credentials needed for the Google Cloud configuration, run the following command in Snowflake:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Retrieve OAuth Client ID and Client Secret\\r\\nSELECT SYSTEM$SHOW_OAUTH_CLIENT_SECRETS(&#x27;&lt;SECURITY_INTEGRATION_NAME&gt;&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac37c04d10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Step 2: Data governance and access control</b></h3><p>Apply the principle of least privilege by creating a dedicated role for your agent inside Snowflake.</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;USE ROLE SECURITYADMIN;\\r\\n-- 1. Create a dedicated role\\r\\nCREATE ROLE IF NOT EXISTS &lt;GENAI_ROLE_NAME&gt;;\\r\\nGRANT ROLE &lt;GENAI_ROLE_NAME&gt; TO USER &lt;BUSINESS_USER_NAME&gt;;  \\r\\nUSE ROLE SYSADMIN;\\r\\n-- 2. Grant structural access\\r\\nGRANT USAGE ON DATABASE &lt;DATABASE_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\nGRANT USAGE ON SCHEMA &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 3. Grant compute access\\r\\nGRANT USAGE ON WAREHOUSE &lt;WAREHOUSE_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 4 .Grant access to the semantic layer\\r\\nGRANT SELECT, REFERENCES ON SEMANTIC VIEW &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SEMANTIC_VIEW_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 5. Grant select privileges on underlying raw data tables\\r\\nGRANT SELECT ON ALL TABLES IN SCHEMA &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac441a4b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>IMPORTANT</b></p><ul><li>The user context must have SELECT privileges on the physical tables backing the semantic view. Granting access only to the semantic view will cause runtime errors during query execution.</li><li>If granting direct access to base tables is not permitted by your security policy, place a <a href=\"https://docs.snowflake.com/en/user-guide/views-secure\" target=\"_blank\"><b>Snowflake Secure View</b></a> over the physical tables and build the Semantic View on top of it. Because Snowflake views execute with <b>Owner's Rights</b>, the user's GenAI role only needs SELECT privileges on the Secure View and Semantic View rather than the raw tables.</li><li><b>Snowflake OAuth tokens</b> capture and bind to the user's DEFAULT_ROLE and DEFAULT_WAREHOUSE at the exact moment of authorization. If a user authorizes the connection before these defaults are configured, the session will be locked to the wrong role(role available at that time) and query execution will fail if the intended role will not have required privileges.<ul><li><b>Set defaults(as shown below)</b> prior to authorizing in Gemini Enterprise.</li><li><b>Authorize connection:</b> Have the user perform the one-time OAuth authorization in Gemini Enterprise.</li><li><b>(Optional) Revert defaults:</b> Once authorized, the user can safely revert their default role and warehouse in Snowflake back to their standard operational preferences.</li></ul></li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;ALTER USER &lt;BUSINESS_USER_NAME&gt; SET DEFAULT_ROLE = &#x27;&lt;GENAI_ROLE_NAME&gt;&#x27;;\\r\\nALTER USER &lt;BUSINESS_USER_NAME&gt; SET DEFAULT_WAREHOUSE = &#x27;&lt;WAREHOUSE_NAME&gt;&#x27;;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac37b453d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Step 3: Provisioning the Cortex Agent and MCP server inside Snowflake</b></h3><p>Next, create a governed Cortex Agent in Snowflake using your semantic view, then provision an MCP server that exposes the agent via the CORTEX_AGENT_RUN tool type. This approach delegates both SQL generation and query execution to Snowflake while enforcing the caller's OAuth identity and role permissions.</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;USE DATABASE &lt;DATABASE_NAME&gt;;\\r\\nUSE SCHEMA &lt;SCHEMA_NAME&gt;;\\r\\nUSE ROLE SYSADMIN;\\r\\n\\r\\n-- 1. Create the Cortex Agent over your semantic view\\r\\nCREATE OR REPLACE AGENT &lt;AGENT_NAME&gt;\\r\\n  COMMENT = \\&#x27;Governed data assistant for business queries\\&#x27;\\r\\n  PROFILE = \\&#x27;{&quot;cortex_analyst&quot;: {&quot;semantic_models&quot;: [&quot;&lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SEMANTIC_VIEW_NAME&gt;&quot;]}}\\&#x27;;\\r\\n\\r\\n-- 2. Provision the MCP Server exposing the Cortex Agent\\r\\nCREATE OR REPLACE MCP SERVER &lt;SERVER_NAME&gt;\\r\\nFROM SPECIFICATION $$\\r\\ntools:\\r\\n  - name: &quot;run_cortex_agent&quot;\\r\\n    type: &quot;CORTEX_AGENT_RUN&quot;\\r\\n    identifier: &quot;&lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;AGENT_NAME&gt;&quot;\\r\\n    title: &quot;Cortex Agent Assistant&quot;\\r\\n    description: &quot;Converts natural language questions into SQL and executes them directly within Snowflake using the caller\\&#x27;s OAuth session permissions.&quot;\\r\\n$$;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac37b465d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>ISOLATION &amp; GOVERNANCE NOTE:</b> By using CORTEX_AGENT_RUN, query generation and execution remain fully contained within Snowflake's governed security boundary. Avoid exposing raw execution tools like SYSTEM_EXECUTE_SQL to external clients, as doing so introduces unnecessary security surface area and bypasses centralized Cortex Agent governance.</p><h3><b>Step 4: Locating and constructing the MCP server URL</b></h3><p>The ADK code requires the endpoint URL of your Snowflake-managed MCP server. Now that the server is provisioned, you must first grant access to the server, and then you can retrieve its exact endpoint URL using the following query in a Snowflake worksheet:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- 1. Grant access to the Cortex Agent and the MCP server\\r\\nUSE ROLE SECURITYADMIN;\\r\\nGRANT USAGE ON AGENT &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;AGENT_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\nGRANT USAGE ON MCP SERVER &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SERVER_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 2. View the MCP URL\\r\\nDESCRIBE MCP SERVER &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SERVER_NAME&gt;;\\r\\n-- Or:\\r\\nDESC MCP SERVER &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SERVER_NAME&gt;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783de90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>In the command output, inspect the metadata properties to locate the endpoint link. The URL is structured as follows:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;https://&lt;org_name&gt;-&lt;account_name&gt;.snowflakecomputing.com/api/v2/databases/&lt;database_name&gt;/schemas/&lt;schema_name&gt;/mcp-servers/&lt;server_name&gt;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783f750&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Step 5: Connecting via Google ADK</b></h3><p>With the MCP Server created and its URL resolved, write your agent code using the Google Agent Development Kit (ADK). In your Python code, define the unique identifier AUTH_ID (e.g. snowflake_oauth_conn) that the agent will use to extract user credentials.</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import os\\r\\nimport re\\r\\nfrom typing import Optional\\r\\nfrom google.adk.agents.llm_agent import LlmAgent\\r\\nfrom google.adk.tools.mcp_tool.mcp_toolset import McpToolset\\r\\nfrom google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPConnectionParams\\r\\nfrom google.adk.tools.tool_context import ToolContext\\r\\n\\r\\n# Define the Auth ID first in your code. \\r\\n# You will use this exact name when registering the agent in the Google Cloud Console.\\r\\n# Gemini Enterprise maps the authorization token to this identifier in the ToolContext.\\r\\nAUTH_ID = &quot;snowflake_oauth_conn&quot;  \\r\\n\\r\\n# 1. OAuth Header Extraction:\\r\\n# Define a callback to dynamically extract the user\\&#x27;s OAuth token injected by Gemini Enterprise \\r\\n# and generate the Authorization headers required to authenticate with the Snowflake MCP.\\r\\ndef get_auth_headers(tool_context: Optional[ToolContext] = None) -&gt; dict: \\r\\n    &quot;&quot;&quot; \\r\\n    OAuth Handling Callback: Dynamically extracts the user\\&#x27;s OAuth token injected by Gemini Enterprise and generates the headers required to authenticate with the Snowflake MCP. \\r\\n    &quot;&quot;&quot; \\r\\n    token = None \\r\\n    if tool_context and hasattr(tool_context, &quot;state&quot;): \\r\\n        try: \\r\\n            # Parse the state dictionary injected by Gemini Enterprise containing authorization states \\r\\n            state_dict = tool_context.state.to_dict() if hasattr(tool_context.state, \\&#x27;to_dict\\&#x27;) else tool_context.state \\r\\n            pattern = re.compile(fr&quot;.*{re.escape(AUTH_ID)}.*&quot;, re.IGNORECASE)  \\r\\n            # Find the active token matching our Auth ID (snowflake_oauth_conn)\\r\\n            matching_keys = [k for k in state_dict.keys() if pattern.match(k)] \\r\\n            if matching_keys: \\r\\n                token = state_dict.get(matching_keys[0]) \\r\\n        except Exception as e: \\r\\n            print(f&quot;Warning: Failed to read ToolContext OAuth state: {e}&quot;)  \\r\\n    # Return authorization headers. If token is None, requests to MCP will fail.\\r\\n    return { \\r\\n        &quot;Authorization&quot;: f&quot;Bearer {token}&quot;, \\r\\n        &quot;Content-Type&quot;: &quot;application/json&quot;, \\r\\n        &quot;Accept&quot;: &quot;application/json, text/event-stream&quot;, \\r\\n    }  \\r\\n\\r\\n# 2. MCP Initialization:\\r\\n# Define the Snowflake MCP URL retrieved from \\&#x27;DESCRIBE MCP SERVER\\&#x27; directly in the code:\\r\\nMCP_SERVER_URL = &quot;&lt;YOUR_MCP_SERVER_URL&gt;&quot; # Replace with the URL retrieved from \\&#x27;DESCRIBE MCP SERVER\\&#x27; \\r\\n\\r\\n# Initialize the Snowflake MCP Toolset using this URL.\\r\\nsnowflake_mcp = McpToolset( \\r\\n    connection_params=StreamableHTTPConnectionParams( \\r\\n        url=MCP_SERVER_URL \\r\\n    ), \\r\\n    header_provider=get_auth_headers\\r\\n)  \\r\\n\\r\\n# 3. Build the Agent:\\r\\n# Construct the LlmAgent using the Gemini 2.5 Flash model and attach the Snowflake MCP Toolset.\\r\\nroot_agent = LlmAgent( \\r\\n    model=&quot;gemini-2.5-flash&quot;, \\r\\n    name=&quot;enterprise_data_analyst&quot;, \\r\\n    instruction=( \\r\\n        &quot;You are an enterprise data analyst. Use the `enterprise_data_agent` tool &quot; \\r\\n        &quot;on the Snowflake MCP server to answer business questions. Pass the user\\&#x27;s &quot; \\r\\n        &quot;natural language question to the tool, which translates it into SQL and &quot; \\r\\n        &quot;executes it directly within Snowflake\\&#x27;s governed boundary, then present &quot; \\r\\n        &quot;the results clearly to the user.&quot; \\r\\n    ), \\r\\n    tools=[snowflake_mcp]\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783de10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>NOTE:</b> The Python snippet above represents a <b>plain/vanilla version</b> of the agent setup. Depending on your organization's specific requirements, you should add robustness on top of this template (e.g., custom error handling, structured schemas, custom prompts, configurations, and additional tool wrappers).</p><h3><b>Step 6: Project structure and deployment</b></h3><p>To deploy your ADK agent to Agent Runtime in Agent Platform, organize your files in the following directory layout:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;snowflake_agent/\\r\\n├── agent.py # The agent definition and MCP connection code (from Step 5)\\r\\n├── __init__.py # Package initializer exposing the agent\\r\\n├── .env # Environment configurations (Google Cloud Project, etc.)\\r\\n└── requirements.txt # List of project dependencies (google-adk, etc.)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783ea10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><ol><li><b>File details</b></li></ol><ul><li><b>__init__.py:</b> Exposes the root_agent object to the deployment CLI:</li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Snowflake ADK Agent package\\r\\nfrom .agent import root_agent&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783d9d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><ul><li><b>.env:</b> Declares environment configuration:</li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;GOOGLE_CLOUD_PROJECT=&quot;&lt;YOUR_GCP_PROJECT_ID&gt;&quot;\\r\\nGOOGLE_CLOUD_LOCATION=&quot;&lt;LOCATION&gt;&quot;\\r\\nGOOGLE_GENAI_USE_VERTEXAI=&quot;TRUE&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783f110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><ul><li><b>requirements.txt:</b> Specifies dependencies:</li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;google-adk[mcp]==2.3.0\\r\\ngoogle-genai==2.10.0\\r\\npydantic-settings==2.14.2\\r\\ngoogle-cloud-aiplatform[agent_engines]&gt;=1.50.0&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783d990&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>2. Deploying via the CLI</b></p><p>Rather than running complex custom Python scripts or manual container builds, you can deploy using the official <b>Google Agents CLI</b> (agents-cli). The CLI packages your code, sets up the server, and handles the deployment pipeline:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Deploy the agent to the Google Cloud Agent Runtime\\r\\nagents-cli deploy --deployment-target agent_runtime&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac3783dfd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>The CLI automatically handles the deployment lifecycle. Once complete, it outputs the unique project resource path (e.g., projects/PROJECT_ID/locations/LOCATION/reasoningEngines/RESOURCE_ID) which you will use to register the agent in the next step.</p><p><b>TIP:</b> For more information and advanced configuration options for ADK agent deployment, refer to:</p><ul><li><a href=\"https://adk.dev/deploy/agent-runtime/deploy/\" target=\"_blank\">ADK Agent Runtime Deployment Guide</a></li><li><a href=\"https://adk.dev/deploy/agent-runtime/index.md\" target=\"_blank\">ADK Deployment Reference Documentation</a></li></ul><h3><b>Step 7: Registering the custom agent in Gemini Enterprise</b></h3><p>Once the agent code is ready and deployed, register the agent in the Google Cloud Console. Here, you will link the agent configuration and map the OAuth parameters retrieved from your Snowflake Security Integration.</p><ol><li><b>Extracting the OAuth Endpoints from Snowflake</b></li></ol><p>Run this query in Snowflake to extract the precise Token and Authorization endpoints:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;DESCRIBE SECURITY INTEGRATION &lt;SECURITY_INTEGRATION_NAME&gt;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac37fcead0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>In the results, locate the values for the following properties:</p><ul><li><b>OAUTH_AUTHORIZATION_ENDPOINT</b>: Your Snowflake Authorization URI.</li><li><b>OAUTH_TOKEN_ENDPOINT</b>: Your Snowflake Token URI.</li></ul><p><b>2. Registration steps in Google Cloud console</b></p><ol><li>Go to the <b>Gemini Enterprise</b> page in the console.</li><li>Select the application you want to register the agent with.</li><li>In the left navigation, click <b>Agents</b>, then click <b>+ Add agent</b>.</li><li>Select <b>Add</b> for <b>Custom agent via Agent Platform</b>. The Authorizations setup displays.</li><li>Set up the Snowflake OAuth connection:<ul><li>Click <b>Add authorization</b>.</li><li><b>Authorization name</b>: Enter the exact ID you defined in your ADK code (e.g., snowflake_oauth_conn). This ensures the credentials map correctly to the code's AUTH_ID.</li><li><b>Client ID</b> &amp; <b>Client secret</b>: Input the credentials you retrieved from Snowflake using the SYSTEM$SHOW_OAUTH_CLIENT_SECRETS query.</li><li><b>Token URI</b>: Input the exact token endpoint value extracted from DESCRIBE SECURITY INTEGRATION.</li><li><b>Authorization URI</b>: Take the authorization endpoint value extracted from DESCRIBE SECURITY INTEGRATION and append ?response_type=code at the end (along with your client ID and scope query parameters, for example):</li></ul></li></ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;https://&lt;org_name&gt;-&lt;account_name&gt;.snowflakecomputing.com/oauth/authorize?client_id=YOUR_CLIENT_ID&amp;redirect_uri=https%3A%2F%2Fvertexaisearch.cloud.google.com%2Foauth-redirect&amp;scope=session%3Arole-any&amp;response_type=code&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fac36a44dd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>IMPORTANT</b><br />Ensure the Authorization URI ends with &amp;response_type=code (or ?response_type=code if there are no other parameters). This parameter is required by Google Cloud to trigger the OAuth 2.0 authorization code flow.</p><ul><li>Click <b>Done</b>, then click <b>Next</b>.</li></ul><p>6. Configure the agent properties:</p><p>7. Click <b>Create</b> to complete registration.</p><p><b>Understanding identifier alignment</b></p><ul><li><b>ADK Code AUTH_ID &lt;==&gt; Google Cloud Authorization Name</b>: The AUTH_ID in your Python script must exactly match the Authorization Name/ID you input during console registration. Because we write code first, we reuse the code-defined identifier during registration.</li><li><b>Snowflake Security Integration Name (e.g. &lt;SECURITY_INTEGRATION_NAME&gt;)</b>: This is purely a Snowflake-side database object name. It does not need to match the Google Cloud Authorization Name or the AUTH_ID in your ADK Python code.</li></ul><h3><b>Get started</b></h3><p>By uniting the Gemini model’s reasoning capabilities, ADK's orchestration, and Snowflake's governed data layer, you can safely bring AI to your data. This architecture provides an agentic assistant that respects your security perimeters while delivering business value.</p></div>"
  "afda1a05ea1e373b7b114c22d5f73058":
    "id": "afda1a05ea1e373b7b114c22d5f73058"
    "title": "Introducing VMware solution on Google Cloud"
    "link": "https://cloud.google.com/blog/products/infrastructure-modernization/vmware-solution-on-google-cloud/"
    "published": "2026-10-28 05:00:00"
    "fetched": "2026-10-28 08:29:55"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Many organizations with workloads on VMware are looking for ways to expedite their data center exits, migrate and modernize their mission-critical workloads, or simply leverage the cloud as a secondary disaster recovery site. But they want to do so without altering existing operational playbooks. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are announcing the general availability of the </span><a href=\"https://cloud.google.com/solutions/vmware\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VMware solution</span></a> <span style=\"vertical-align: baseline;\">on Google Cloud, part of the </span><a href=\"http://cloud.google.com/solutions/modernize\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Modernize</span></a><span style=\"vertical-align: baseline;\"> portfolio, giving you full administrative authority for VMware Cloud Foundation (VCF) on dedicated Google Cloud bare metal.</span></p>\n<p><span style=\"vertical-align: baseline;\">This new deployment model complements our existing Google-managed service, offering you greater flexibility and architectural choice for running VMware workloads in Google Cloud. With this new self managed offering, organizations with dedicated operational practices maintain direct control over their virtualization stack, specific maintenance windows, and custom integration with third-party monitoring and management tools.</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">The launch of VMware Cloud Foundation 9.x by Broadcom is a key driver behind this self-managed deployment option. Featuring a unified VCF control plane for end-to-end stack deployment and lifecycle management, this solution enables Google Cloud customers to directly leverage Broadcom's latest innovations and fully maximize their licensing investments in VMware Cloud Foundation.</span></span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Customers want the agility of Google Cloud without rearchitecting their VMware environments or abandoning the operational practices they have invested in. With the new VMware solution on Google Cloud, VCF license portability allows customers to bring their existing subscriptions and run their VMware workloads unchanged, with complete administrative control on dedicated Z3 bare metal and the ability to apply Google Cloud commitments and discounts to optimize their costs.”</span><span style=\"vertical-align: baseline;\"> <strong>- Abhay Kumar, Global Head of Hyperscalers, VMware Cloud Foundation Division, Broadcom</strong></span></p>\n<h3><strong style=\"vertical-align: baseline;\">Expanding deployment choices for VMware workloads</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When it comes to VMware workloads, Google Cloud now offers two distinct choices tailored to your priorities, letting you choose the operational model that matches your workloads’ characteristics and the levels of control you need: Google Cloud VMware Engine, and the VMware solution on Google Cloud.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_InGuzEO.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><div align=\"center\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Capability</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud </strong><strong style=\"vertical-align: baseline;\">VMware Engine</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VMware solution on Google Cloud</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Target workloads</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Turnkey operations prioritizing operational simplicity and offloaded maintenance</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Architectural flexibility for teams requiring full stack customization and direct ownership</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Underlying software</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">VMware Cloud Foundation 5.2</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VMware Cloud Foundation 9.x</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Administrative access</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Role-based vCenter administrative privileges</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Full root administrative access across ESXi, vCenter, NSX Manager, and rest of the VCF components </strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Lifecycle management</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Automated patching, updates, and monitoring managed by Google</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Customer-or partner-driven updates via VCF Operations Management tools</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Licensing model</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Bring Your Own License (BYOL) portable VCF subscriptions</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Bring Your Own License (BYOL) portable VCF subscriptions</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Hardware platform</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">VMware Engine ve1 and ve2 node families</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Dedicated Compute Engine (GCE) bare metal instances (e.g Z3)</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">High-performance architecture on bare metal</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The self-managed VMware solution is deployed on dedicated GCE Z3 bare metal instances (z3-highmem-192-highlssd-metal). Powered by 2.2 GHz - 4th Generation Intel Xeon Processors (Sapphire Rapids) processors, each node delivers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">96 physical cores (192 hyper-threads) </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">1.5 TB RAM</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">72 TB all-flash NVMe storage</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">200 Gbps networking</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Operating natively within Google Cloud alongside GCE and Google Kubernetes Engine (GKE), this architecture provides high bandwidth and low-latency networking for transactional databases and direct access to native Google Cloud services, including BigQuery, the Gemini platform, Cloud Run, and more. </span></p>\n<p><span style=\"vertical-align: baseline;\">The solution's storage architecture is built on VMware vSAN hyperconverged infrastructure using high-performance, all-flash NVMe storage from Z3 nodes. Beyond standard storage, these drives can also be utilized for NVMe memory tiering. In addition to vSAN, the solution also supports NetApp volumes.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"VMware solution on Google Cloud gives enterprises greater control, choice, and architectural freedom as they move to the cloud. We are excited to expand our partnership with Google Cloud by offering NetApp Volumes as an external datastore. Together, we’re helping customers confidently migrate their VMware workloads and data to Google Cloud while retaining the flexibility, performance and data management capabilities they rely on</span><span style=\"vertical-align: baseline;\">.” <strong>- Pravjit Tiwana, SVP/GM, Cloud Storage, NetApp</strong></span></p>\n<h3><strong style=\"vertical-align: baseline;\">Realizing clear customer value and TCO optimization</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Pairing VMware Cloud Foundation 9.1 with Google Cloud’s Z3 bare metal infrastructure delivers </span><span style=\"vertical-align: baseline;\">significant economic and operational efficiency</span><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Commercial flexibility and BYOL: </strong><span style=\"vertical-align: baseline;\">Bring portable Broadcom VCF subscriptions while allocating Google Cloud commitments and Flexible Committed Use Discounts (Flex CUDs) toward Z3 bare metal shapes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NVMe memory tiering: </strong><span style=\"vertical-align: baseline;\">Tiering between DDR memory (Tier 0) and high-speed local NVMe (Tier 1) can reduce server TCO by up to 40%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">vSAN Express Storage Architecture (ESA): </strong><span style=\"vertical-align: baseline;\">Utilizing high-throughput local NVMe storage reduces storage TCO by up to 39% compared to traditional external arrays.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Active live patching: </strong><span style=\"vertical-align: baseline;\">Up to 80% live patching coverage for critical security updates reduces planned maintenance downtime.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Architectural and commercial differentiation</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In addition to the above-mentioned benefits, Google Cloud provides distinct operational and technical advantages that go beyond standard cloud hosting:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Triple-governance operational choices: </strong><span style=\"vertical-align: baseline;\">Select from Google-, customer-, or partner- frameworks to align precisely with your operating model.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Granular capacity sizing: </strong><span style=\"vertical-align: baseline;\">Access bare metal shapes across GCE hardware families to optimize utilization resulting in a lower TCO.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Global virtual networking: </strong><span style=\"vertical-align: baseline;\">Peer complex multi-edge and multi-VPC topologies natively via Andromeda and Network Connectivity Center (NCC).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI Acceleration: </strong><span style=\"vertical-align: baseline;\">Seamlessly connect systems of record directly to BigQuery and Gemini platform to enable AI capabilities.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">What our customers are saying</strong></h3>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Our early assessment shows significant potential. Separating the hardware lifecycle from the virtualization layer gives us the ability to scale bare-metal capacity in minutes, while still retaining full administrative control. This provides the flexibility of the cloud with the level of control we require from our infrastructure platforms.”<strong> - </strong></span><span style=\"vertical-align: baseline;\"><strong>Scott Ronan, Senior Director of Platforms, Databases &amp; Cloud, </strong></span><strong><span style=\"vertical-align: baseline;\">GXO Logistics</span></strong></p>\n<h3><strong style=\"vertical-align: baseline;\">Partner-managed ecosystem</strong></h3>\n<p><span style=\"vertical-align: baseline;\">For organizations that prefer managed services, Google Cloud partners with organizations with expertise across both Google Cloud and VMware Cloud Foundation (VCF) to provide end-to-end support for self-managed VMware solution including:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Day 0:</strong><span style=\"vertical-align: baseline;\"> Architecture planning and solution design</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Day 1:</strong><span style=\"vertical-align: baseline;\"> Deployment and migration execution</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Day 2 and beyond:</strong><span style=\"vertical-align: baseline;\"> Ongoing lifecycle management and operations</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Delivered via professional or managed services contracts, you can collaborate with your preferred providers or tap into our featured partner offerings on the self-managed VMware solution: </span><a href=\"https://www.accenture.com/en/services/ecosystem-partners/google-cloud\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Accenture</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://abc.com.qa/contact-us/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Advanced Business Computing</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.cognizant.com/us/en\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cognizant</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.devoteam.com/google-cloud/it-infrastructure-modernisation/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Devoteam</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.hcltech.com/google-cloud\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">HCL</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.ibm.com/consulting/google-cloud\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">IBM</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.infosys.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Infosys</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.insight.com/en_US/shop/partner/google/google-cloud.html\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Insight</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.liverx.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">LiverX</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://modernz.ai/google-cloud\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ModernZ</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://pellera.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Pellera</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://quantiphi.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Quantiphi</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.tcs.com/what-we-do/services/cloud/google\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Tata Consultancy Services</strong></a><strong style=\"vertical-align: baseline;\">, </strong><a href=\"https://www.wipro.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Wipro</strong></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://xtravirt.com/partners/google-cloud/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Xtravirt</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">VMware solution on Google Cloud is generally available across 22 Google Cloud regions, with planned expansion to more regions in upcoming quarters.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get started:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Visit the </span><a href=\"https://cloud.google.com/solutions/vmware\">VMware solution on Google Cloud webpage</a><span style=\"vertical-align: baseline;\"> for more details.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the</span> <a href=\"https://docs.cloud.google.com/vmware-engine/docs/self-managed/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">solution overview and core concepts</span></a><span style=\"vertical-align: baseline;\"> on the documentation page.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Reach out to your Google Cloud account team or an authorized partner to evaluate this offering.</span></p>\n</li>\n</ol></div>"
  "1d32be434884d361257b09abab69b713":
    "id": "1d32be434884d361257b09abab69b713"
    "title": "Powering the agentic enterprise with latest innovations in Oracle AI Database@Google Cloud"
    "link": "https://cloud.google.com/blog/products/databases/oracle-ai-databasegoogle-cloud-whats-new-at-oracle-ai-world/"
    "published": "2026-10-28 04:30:00"
    "fetched": "2026-10-28 08:29:55"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For decades, core enterprise operations — from global supply chains and financial ledgers to billing engines — have relied on the performance and transactional integrity of Oracle databases. Today at </span><a href=\"https://www.oracle.com/ai-world/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle AI World</span></a><span style=\"vertical-align: baseline;\"> in Las Vegas, Google Cloud and Oracle are expanding our partnership across the AI stack — spanning AI compute and infrastructure (including making Google TPUs available through Oracle Cloud Infrastructure), enterprise data, and agentic AI — by deepening the integration between Oracle AI Database@Google Cloud, </span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google’s Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\">, and Gemini Enterprise.</span></p>\n<p><span style=\"vertical-align: baseline;\">By unifying Oracle’s mission-critical operational data and applications with Google Cloud’s data and AI ecosystem — including BigQuery, Gemini Enterprise, and Gemini models — enterprises can move beyond static analytics and build autonomous, agentic workflows. This architecture breaks down traditional data silos, giving agents direct, secure, and real-time access to the foundational enterprise data required to drive real-world action.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Foundational building blocks for agentic AI</span></h3>\n<p><span style=\"vertical-align: baseline;\">To unlock production-grade agentic AI, enterprises need more than raw model capability — they need strong database connectivity, unified data governance, and rich semantic context working together as a cohesive foundation. First announced at Google Cloud Next '26, the following core capabilities serve as the building blocks for building conversational intelligence, end-to-end governance, and autonomous agent environments on Oracle AI Database@Google Cloud:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/oracle/database/docs/use-oracledatabase-mcp\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Remote MCP Server with Data API</strong></a><span style=\"vertical-align: baseline;\">: The Remote Model Context Protocol (MCP) Server for Oracle workloads — powered by the IAM-governed </span><span style=\"vertical-align: baseline;\">ExecuteSQL Data</span><span style=\"vertical-align: baseline;\"> API — is now generally available. Together, they provide a unified, standardized interface that enables AI agents, Google Cloud services, and enterprise applications to securely run SQL and interact directly with Oracle databases. By resolving database credentials automatically through Secret Manager and enforcing Google Cloud IAM policies, this capability eliminates the need for custom natural-language-to-SQL middleware, bastion VMs, or plaintext passwords.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/introduction\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog integration</strong></a><span style=\"vertical-align: baseline;\">: Google Cloud’s Knowledge Catalog integration, currently in preview, unifies enterprise metadata discovery and governance across Oracle databases and the broader Google Agentic Data Cloud. By automatically cataloging schemas and business metadata, organizations can enforce consistent access controls, track data provenance, and supply the rich semantic context that agents require to reason accurately over complex operational data. </span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf3gSDItjmOSsusMr-3opC8Yzfq8cc1mo8onkNTnyuDVAiIJA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Click here</span></a><span style=\"vertical-align: baseline;\"> to sign-up for this feature.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Gemini connector for Oracle AI Database@Google Cloud</span></h3>\n<p><span style=\"vertical-align: baseline;\">Building directly on the foundational capabilities discussed above, we’re also announcing the preview of </span><strong style=\"vertical-align: baseline;\">Gemini connector for Oracle AI Database@Google Cloud</strong><span style=\"vertical-align: baseline;\">. With this native integration, business users and developers can interact directly with their Oracle databases on Oracle AI Database@Google Cloud using natural language queries right inside the Gemini app. Behind the scenes, Gemini automatically leverages Knowledge Catalog to discover, search, and ground responses strictly in the governed Oracle data each user is authorized to access — turning complex operational databases into an intuitive, conversational experience without compromising enterprise security. </span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf3gSDItjmOSsusMr-3opC8Yzfq8cc1mo8onkNTnyuDVAiIJA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Click here</span></a><span style=\"vertical-align: baseline;\"> to sign-up for this feature.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><span style=\"vertical-align: baseline;\">Oracle in Gemini and Gemini in Oracle</span></h3>\n<p><span style=\"vertical-align: baseline;\">Beyond direct database queries, Google Cloud and Oracle are connecting agentic workflows across the broader application layer — bringing Oracle data into Gemini Enterprise and embedding Gemini models natively inside Oracle applications:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle in Gemini Enterprise:</strong><span style=\"vertical-align: baseline;\"> Available today, Oracle in Gemini Enterprise introduces conversational analytics, cross-cloud database connectors, and domain-aware agents — including the new Oracle AI Database Agent in Gemini Enterprise. Anchored by over 135 pre-built operational and developer skills and standardized MCP connectivity with zero plaintext credentials, enterprises can orchestrate multi-agent workflows across JD Edwards, E-Business Suite, NetSuite, and Oracle Fusion without custom SQL or brittle middleware.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini models in Oracle applications</strong><span style=\"vertical-align: baseline;\">: Concurrently, Gemini frontier reasoning is embedded directly into </span><a href=\"https://www.oracle.com/news/announcement/oracle-to-make-gemini-models-available-2026-07-30/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle Fusion AI Agent Studio</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.oracle.com/news/announcement/oracle-extends-fusion-agentic-applications-with-introduction-of-fusion-claw-2026-09-29/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fusion Claw</span></a><span style=\"vertical-align: baseline;\">, Oracle Fusion Applications, and NetSuite — combining Oracle database intelligence with Gemini’s agentic capabilities to automate execution across transactional systems of record.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Partner-ready agentic blueprints:</strong><span style=\"vertical-align: baseline;\"> To help organizations rapidly deploy these governed workflows, Google Cloud and Oracle are collaborating with leading partners and global systems integrators — including </span><a href=\"https://digitalfoundations.argano.com/jde-resolution-studio-on-google-cloud-marketplace#gemini-agents\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Argano</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.prnewswire.com/news-releases/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Automus</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.calfus.com/resources/category/press-release/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Calfus</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.hcltech.com/press-release\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">HCL</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://newsroom.ibm.com/announcements\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IBM</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.infosys.com/newsroom/press-releases.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Infosys</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.ltm.com/insights/povs/from-legacy-infrastructure-constraint-to-an-intelligent-erp-platform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LTM</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.pythian.com/news/pythian-announces-integration-with-gemini-to-help-accelerate-cloud-migration-for-oracle-applications?hs_preview=tpYkZgFR-225190305614\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pythian</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.tcs.com/who-we-are/newsroom\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TCS</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://www.tessell.com/blog/tessell-agentic-database-lifecycle-management-gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Tessell</span></a><span style=\"vertical-align: baseline;\"> — who provide pre-built operational skills, custom MCP connectors, and industry blueprints for production-grade agentic architectures.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Empowering choice with lakehouse, streaming, and federation</span></h3>\n<p><span style=\"vertical-align: baseline;\">Every enterprise has distinct architectural priorities, latency thresholds, and governance requirements when connecting operational Oracle data to BigQuery and AI workloads. Rather than prescribing a one-size-fits-all integration pattern, Google Cloud and Oracle offer a complete spectrum of data unification choices so customers can select — or combine — the exact approach that best fits their workload and use case:</span></p>\n<h4><span style=\"vertical-align: baseline;\">Bi-directional Google Cloud borderless Lakehouse and Oracle AI Lakehouse</span></h4>\n<p><span style=\"vertical-align: baseline;\">Modern enterprise data architectures are increasingly multi-cloud and grounded in open standards. Building on our strategic partnership, Google Cloud and Oracle delivered a key innovation earlier this year to support cross-cloud data interoperability powered by open Apache Iceberg standard: integrating </span><strong style=\"vertical-align: baseline;\">Google’s borderless Lakehouse with </strong><a href=\"https://www.oracle.com/autonomous-database/autonomous-ai-lakehouse/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Oracle AI Lakehouse</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">This work enabled the borderless Lakehouse to read Apache Iceberg tables created by Oracle AI Lakehouse across any public cloud or on-premises environment, leveraging catalogs and storage supported by both platforms.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are advancing it further by making it fully bi-directional with </span><strong style=\"vertical-align: baseline;\">Oracle Access to Google Cloud borderless Lakehouse (preview)</strong><span style=\"vertical-align: baseline;\">. Now, Oracle Autonomous AI Database and Google’s borderless Lakehouse (powered by BigQuery and Managed Spark) can directly query and execute write/DML operations on shared Apache Iceberg tables in Google Cloud Storage, completely eliminating the need for ETL or data replication.</span></p>\n<p><span style=\"vertical-align: baseline;\">By utilizing a Lakehouse runtime REST catalog integrated into Oracle via </span><span style=\"vertical-align: baseline;\">DBMS_CATALOG</span><span style=\"vertical-align: baseline;\">, this bi-directional integration delivers an open-standards storage framework while empowering analytical teams (using BigQuery and Gemini) and operational teams (using Oracle SQL) to collaborate over a single, unified source of truth. You can </span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf3gSDItjmOSsusMr-3opC8Yzfq8cc1mo8onkNTnyuDVAiIJA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">click here</span></a><span style=\"vertical-align: baseline;\"> to sign-up for this feature.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Sub-second CDC streaming with OCI GoldenGate</span></h4>\n<p><span style=\"vertical-align: baseline;\">For organizations that prefer to continuously reflect mission-critical operational data inside BigQuery for high-scale analytics and AI, real-time change data capture (CDC) provides an immediate competitive edge. Through </span><a href=\"https://docs.cloud.google.com/oracle/database/docs/deploy-and-connect\"><span style=\"text-decoration: underline; vertical-align: baseline;\">native OCI GoldenGate integration</span></a><span style=\"vertical-align: baseline;\">, CDC events are extracted directly from Oracle redo logs without touching table blocks or adding overhead to transactional workloads. Transactions stream securely across Google Cloud private networks straight into BigQuery managed tables, delivering sub-second analytical freshness to power Gemini, feature stores, and live business intelligence dashboards, while also streamlining migrations from on-premises environments to Oracle AI Database@Google Cloud.</span></p>\n<h4><span style=\"vertical-align: baseline;\">BigQuery query federation with Oracle</span></h4>\n<p><span style=\"vertical-align: baseline;\">When workloads call for on-demand operational visibility or infrequent cross-estate joins without moving data, BigQuery query federation with Oracle, in preview, enables real-time, in-place analytics directly against live Oracle databases. Using the </span><span style=\"vertical-align: baseline;\">EXTERNAL_QUERY</span><span style=\"vertical-align: baseline;\"> function, data teams can execute native Oracle SQL directly from BigQuery queries, dashboards, and pipelines to retrieve live transactional records and join them easily with petabyte-scale BigQuery datasets. This zero-copy approach simplifies operations and lowers Total Cost of Ownership (TCO) by eliminating duplicate storage and ETL maintenance for ad-hoc lookups, intraday risk reporting, and live fraud detection. Please reach out to your Google Cloud account team if you want to sign-up for this feature. </span></p></div>\n<div class=\"block-paragraph_advanced\"><div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table border=\"1\" style=\"border-collapse: collapse; width: 100%;\">\n<tbody>\n<tr>\n<td style=\"width: 18.1748%;\"><strong>Architectural option</strong></td>\n<td style=\"width: 18.1748%;\"><strong>Mechanism</strong></td>\n<td style=\"width: 18.1748%;\"><strong>Data Freshness and Latency</strong></td>\n<td style=\"width: 18.1748%;\"><strong>Impact on Oracle OLTP</strong></td>\n<td style=\"width: 18.1748%;\"><strong>Primary Use Vase</strong></td>\n</tr>\n<tr>\n<td style=\"width: 18.1748%;\"><strong style=\"vertical-align: baseline;\">Bi-Directional Borderless Lakehouse</strong></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Shared Apache Iceberg tables via Lakehouse runtime REST catalog (</span><span style=\"vertical-align: baseline;\">DBMS_CATALOG</span><span style=\"vertical-align: baseline;\">) and Glue Federation</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Real-time shared storage (zero copy)</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Zero (shared analytical storage layer)</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Multi-cloud open interoperability, unified BigQuery/Spark/Oracle SQL access without vendor lock-in</span></td>\n</tr>\n<tr>\n<td style=\"width: 18.1748%;\"><strong style=\"vertical-align: baseline;\">Real-Time CDC via OCI GoldenGate</strong></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Continuous log-based streaming into BigQuery via Storage Write API</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Near real-time / Sub-second (&lt; 1s)</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Zero (non-invasive extraction from redo logs)</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Mission-critical operational reflection in BigQuery, live AI feature stores, continuous ML and BI pipelines</span></td>\n</tr>\n<tr>\n<td style=\"width: 18.1748%;\"><strong style=\"vertical-align: baseline;\">BigQuery Query Federation (Preview)</strong></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">In-place query execution using </span><span style=\"vertical-align: baseline;\">EXTERNAL_QUERY</span><span style=\"vertical-align: baseline;\"> via BigQuery Connection API</span></td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">On-demand / Live in-place</span></td>\n<td style=\"width: 18.1748%;\">\n<p><span style=\"vertical-align: baseline;\">Variable (query-dependent)</span></p>\n</td>\n<td style=\"width: 18.1748%;\"><span style=\"vertical-align: baseline;\">Infrequent ad-hoc querying, zero-copy lookups, cross-estate joins, regulatory reporting</span></td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p> </p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Global expansion and public sector compliance</span></h3>\n<p><span style=\"vertical-align: baseline;\">We continue to expand the global physical footprint and compliance boundaries of Oracle AI Database@Google Cloud to meet customers wherever they operate, with new regions and certifications.</span></p>\n<p><a href=\"https://docs.cloud.google.com/oracle/database/docs/regions-and-zones#exadata\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">New regions launched</strong></a><span style=\"vertical-align: baseline;\"> </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">europe-west12-a(</code><span style=\"vertical-align: baseline;\">Turin, Italy) and </span><code style=\"vertical-align: baseline;\">northamerica-south1-b </code><span style=\"vertical-align: baseline;\">(Queretaro, Mexico) regions are </span><strong style=\"vertical-align: baseline;\">now live</strong><span style=\"vertical-align: baseline;\">, joining global hubs including Milan, Iowa, São Paulo, Tokyo, Sydney, and Mumbai to deliver ultra-low-latency access and local data residency.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">FedRAMP High certification</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">At Oracle AI World, Oracle announced plans to pursue FedRAMP High certification for Oracle AI Database@Google Cloud. This initiative will allow US government and public sector entities to run regulated workloads using Oracle Exadata Database Service on dedicated infrastructure within Google Cloud Assured Workloads. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Operating inside a FedRAMP High-authorized environment enables federal agencies to safeguard sensitive, unclassified data while co-locating Oracle workloads with existing applications and Gemini. Agencies can access live Oracle data with minimal latency, streamlined billing, and simplified procurement via Google Cloud Marketplace or certified partners — all within their compliance boundaries.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Building the agentic future</span></h3>\n<p><span style=\"vertical-align: baseline;\">By combining Oracle’s proven transactional engine with Google’s Agentic Data Cloud, enterprise data transitions from passive systems of record into an active, intelligent operational engine. Whether unifying data through open Apache Iceberg lakehouses, streaming sub-second changes via GoldenGate, federating live queries from BigQuery, or conversing directly with governed Oracle data through Gemini, organizations now have the complete flexibility and security required to deploy autonomous AI agents at scale — driving predictive insights and automated actions across their most critical business processes.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Oracle AI Database@Google Cloud is available directly through the </span><a href=\"https://console.cloud.google.com/marketplace/product/oracle/oracle-database-at-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Marketplace</span></a><span style=\"vertical-align: baseline;\">, allowing you to deploy using your existing Google Cloud commitments, unified billing, and Oracle Support Rewards.</span></p>\n<p><span style=\"vertical-align: baseline;\">To explore further, visit the </span><a href=\"https://www.oracle.com/cloud/google/oracle-database-at-google-cloud/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle AI Database@Google Cloud overview</span></a><span style=\"vertical-align: baseline;\">, dive into the official </span><a href=\"https://docs.oracle.com/en-us/iaas/Content/database-at-gcp/home.htm\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle Database@Google Cloud Documentation</span></a><span style=\"vertical-align: baseline;\">, or reach out to your Google Cloud account team to schedule an architecture briefing.</span></p></div>"
"last_updated": "2026-10-28 08:29:55 JST"
