"overview": |
  この日は 3 ソースから 8 本。リリースノートでは、AlloyDB for PostgreSQL で AlloyDB AI とベクトル検索の機能群が一般提供になった: PostgreSQL 17 以降での 4 レベルツリー (4LT) ScaNN インデックス (最大 100 億ベクトル行、自動メンテナンス対応)、scann.satisfy_limit = relaxed_order によるストリーミング検索 (並列スキャンは scann.enable_parallel_satisfy_limit)、Vector assist、num_leaves 上限の 30,000,000 から 104,857,600 への引き上げ、external_search_fdw による Elasticsearch・Solr・OpenSearch への接続、rum 拡張 (PostgreSQL 17 以前)。セキュリティでは GCP-2026-071 を受けて AlloyDB のマネージドコンポーネントの証明書ストアを修正 (定期メンテナンスで適用、AlloyDB Auth Proxy は v1.17.2 以降へ、Language Connectors は言語ランタイムと OS の CA 証明書を更新、例: Go 1.26.10 または 1.27.3 以降)、Application Integration の SubWorkflow タスクに 2026 年 9 月 11 日より前のバージョンで信頼できないデータのデシリアライズの脆弱性 (GCP-2026-074)。Google SecOps は非 Enterprise+ 顧客向けのレガシー マネージド BigQuery エクスポート (chronicle-tla) の最終停止で、2026 年 10 月 28 日に廃止作業を開始した (2025 年 3 月 26 日に非推奨告知済み、BYOBQ への移行か Enterprise+ へのアップグレードが必要)。ほかに Bigtable のマイクロ秒タイムスタンプ粒度 (Enterprise Plus で GA)、Memorystore for Redis Cluster の基本トークン認証の GA、Application Integration のエージェントスキル公開。Google Cloud Blog では、VMware solution on Google Cloud の一般提供が発表された。Google Cloud Modernize ポートフォリオの一部で、専用のベアメタル上の VMware Cloud Foundation (VCF) に対して顧客が完全な管理権限を持つセルフマネージド型であり、既存の Google マネージドサービスを補完する。Broadcom の VCF 9.x の登場が背景にある。Oracle AI World では Google Cloud と Oracle が AI スタック全体での提携拡大を発表し、OCI 経由での Google TPU の提供や、Oracle AI Database@Google Cloud と Agentic Data Cloud・Gemini Enterprise の統合深化が示された。ほかに Gemini Enterprise を MCP と ADK で Snowflake に安全に接続するガイド。Google Cloud Japan Blog では抄訳 3 本で、NVIDIA RTX PRO 6000 Blackwell Server Edition GPU を搭載した G4 インスタンスでの Confidential Computing (Confidential G4) の一般提供 (36 ゾーン、Compute Engine VM と GKE ノード、Confidential Space のサポートは今後数週間で順次一般提供)、Google Antigravity での Claude Opus 5.5 と Claude Sonnet 5.5 の提供とマルチモデルのエンジニアリングパターン、スタートアップ向けの Gemini エージェントの活用が紹介された。あわせて Google Cloud Blog では、Android XR 上に構築された初の有線 XR グラス XREAL AURA の発売が発表された。新たに導入されたスプリットコンピュートのアーキテクチャによって有線グラスで空間コンピューティングを実現し、70 度の視野を持つ光学シースルーのディスプレイが現実の世界に情報を重ねる。フレーム重量は 95g 未満で、長時間の作業に耐えることを狙う。Google Play ストアにある業務アプリを初期状態で利用できるほか、DisplayPort 入力 (DP-in) によってプラットフォームを問わずノート PC をつなぎ、その画面を Android アプリと並べて空間上に置ける。管理面では、今年すでに導入された Android XR 向けの Android Enterprise 管理の枠組みがそのまま使え、Managed Google Play による安全なアプリの配布と管理などが利用できる。
