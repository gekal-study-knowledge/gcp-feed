    "fetched": "2026-10-29 02:05:35"
    "summary": "<h2 class=\"release-note-product-title\">AlloyDB for PostgreSQL</h2>\n<h3>Announcement</h3>\n<p>The following AlloyDB AI and vector search features and improvements are\ngenerally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>):</p>\n<ul>\n<li><p>The <code>alloydb_scann</code> extension supports four-level tree (4LT) ScaNN vector\nindexes on PostgreSQL 17 and later, providing support for tables with up to\n10 billion vector rows. For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#create-scann-index-manual\">Four-level ScaNN tree indexes</a>.</p></li>\n<li><p>4LT ScaNN vector indexes support automatic index maintenance. For more\ninformation, see <a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index\">Create a ScaNN index</a>\nand\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/maintain-vector-indexes#maintain-index-automatically\">Maintain vector indexes automatically</a>.</p></li>\n<li><p>You can enable streaming functionality for ScaNN vector indexes by setting\nthe <code>scann.satisfy_limit</code> parameter to <code>relaxed_order</code>. When enabled, the\nvector scan continues searching through additional leaf partitions until it\nfinds enough results to satisfy the <code>LIMIT</code> clause of your query, improving\nrecall on filtered searches. Additionally, you can enable this feature for\nparallel process scans by setting the <code>scann.enable_parallel_satisfy_limit</code>\ndatabase flag to <code>on</code>. For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/reference/ai/scann-index-reference#scann-satisfy-limit\">ScaNN index reference</a>\nand\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/best-practices-tuning-scann#improve-recall-for-filtered-searches\">Best practices for tuning ScaNN indexes</a>.</p></li>\n<li><p>Vector assist simplifies the deployment and management of your AlloyDB\nvector workloads by helping you set up production-ready vector search\ncapabilities, including embedding generation, query optimization, and index\ncreation for vector types such as Hierarchical Navigable Small World (HNSW).\nFor more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/vector-assist-overview\">Vector assist overview</a>.</p></li>\n<li><p>For AlloyDB for PostgreSQL instances running PostgreSQL 17 and later, the\nmaximum supported value for <code>num_leaves</code> when building ScaNN vector indexes\nis increased from 30,000,000 to 104,857,600. For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index\">Create a ScaNN index</a> and\n<a href=\"https://docs.cloud.google.com/alloydb/docs/reference/ai/scann-index-reference\">ScaNN index reference</a>.</p></li>\n<li><p>You can use the\n<a href=\"https://docs.cloud.google.com/alloydb/docs/reference/extensions#external_search_fdw\"><code>external_search_fdw</code></a>\nextension to connect to external search clusters and query their data\ndirectly from your database using the following search sources:</p>\n<ul>\n<li><p><a href=\"https://docs.cloud.google.com/alloydb/docs/elastic-search\">Elasticsearch</a></p></li>\n<li><p><a href=\"https://docs.cloud.google.com/alloydb/docs/solr-search\">Solr</a></p></li>\n<li><p><a href=\"https://docs.cloud.google.com/alloydb/docs/opensearch\">OpenSearch</a></p></li>\n</ul></li>\n<li><p>AlloyDB supports the <code>rum</code> extension for high-performance full-text search\noperations on PostgreSQL 17 and earlier. The <code>rum</code> extension extends\nstandard GIN indexes by storing positional information directly in the\nindex, letting you perform faster phrase searches and relevance ranking\nwithout accessing the table data. For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-rum-index\">Create and manage a RUM index</a>.</p></li>\n</ul>\n<h3>Fixed</h3>\n<p>AlloyDB provides more accurate memory usage estimation and prevents\nout-of-memory (OOM) errors when you build a ScaNN\n<a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#create-scann-index-manual\">four-level tree index</a>.\nThis feature is in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>. This update\nimproves the stability of index builds by enforcing memory limits and\nimproving memory estimation under constrained conditions.</p>\n<h3>Security</h3>\n<p>In response to <a href=\"https://docs.cloud.google.com/support/bulletins#gcp-2026-071\">GCP-2026-071</a>, Google is\nupdating AlloyDB managed components. The fix to the certificate store is shipped\nin a new maintenance version that AlloyDB applies during\n<a href=\"https://docs.cloud.google.com/alloydb/docs/maintenance#timing\">scheduled maintenance</a>, so you don't need to\nmanually update AlloyDB managed instances. You can also apply the fix by\n<a href=\"https://docs.cloud.google.com/alloydb/docs/self-service-maintenance\">performing self-service maintenance</a>.</p>\n<p>Depending on how you connect to AlloyDB, take the following actions:</p>\n<ul>\n<li><p>If you use the AlloyDB Auth Proxy, then upgrade it to\n<a href=\"https://docs.cloud.google.com/alloydb/docs/auth-proxy/connect#install\">v1.17.2 or later</a>. If you run the\nstandalone proxy binary, then also update the host's certificate authority\n(CA) certificates.</p></li>\n<li><p>If you use the\n<a href=\"https://docs.cloud.google.com/alloydb/docs/connect-language-connectors\">AlloyDB Language Connectors</a>, then\nupdate the language runtime and operating system CA certificates (for example,\nGo 1.26.10 or 1.27.3 or later).</p></li>\n</ul>\n<h2 class=\"release-note-product-title\">Application Integration</h2>\n<h3>Security</h3>\n<p>A Deserialization of Untrusted Data vulnerability was discovered\nin the <code>SubWorkflow</code> task in Application Integration\nversions prior to September 11, 2026.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/application-integration/docs/security-bulletins#gcp-2026-074\">GCP-2026-074</a>\nsecurity bulletin.</p>\n<h3>Feature</h3>\n<p><strong>Application Integration agent skills</strong></p>\n<p>Application Integration agent skills are available in the public\n<a href=\"https://github.com/google/skills\"><code>google/skills</code></a> repository:\n<code>application-integration-basics</code>, <code>application-integration-authoring</code>, and\n<code>application-integration-troubleshooting</code>. AI coding agents that use these\nskills can help you set up Application Integration; build, publish, and run\nintegrations through the REST API; and troubleshoot failed runs. For more\ninformation, see\n<a href=\"https://docs.cloud.google.com/application-integration/docs/agent-skills-overview\">Application Integration agent skills</a>\nand <a href=\"https://docs.cloud.google.com/application-integration/docs/build-integration-ai-agent\">Build an integration with an AI agent</a>.</p>\n<h2 class=\"release-note-product-title\">Bigtable</h2>\n<h3>Feature</h3>\n<p>You can configure Bigtable tables with microsecond timestamp granularity to\ncapture and store high-frequency data. By supporting microsecond precision for\ncell timestamps, Bigtable helps you prevent data loss from write collisions in\nworkloads with high event rates. This feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>\nfor instances in the Enterprise Plus edition. For more information, see\n<a href=\"https://docs.cloud.google.com/bigtable/docs/data-types\">Data type enforcement in Bigtable</a>.</p>\n<h2 class=\"release-note-product-title\">Google SecOps</h2>\n<h3>Announcement</h3>\n<p><strong>Final shutdown of legacy managed BigQuery export datasets (chronicle-tla) for non-Enterprise+ customers</strong></p>\n<p>Following the <a href=\"https://docs.cloud.google.com/chronicle/docs/release-notes#March_26_2025\">March 26, 2025 deprecation announcement</a>, Google SecOps is completing the final shutdown of legacy Google-managed BigQuery datasets and API keys associated with the <code>chronicle-tla</code> Google Cloud project:</p>\n<ul>\n<li><strong>What is changing:</strong> Data exports to legacy Google-managed BigQuery datasets under the <code>chronicle-tla</code> project are being permanently turned off, and the associated managed datasets and API keys are being decommissioned.</li>\n<li><strong>Who is impacted:</strong> This shutdown applies only to non-Enterprise+ customers still provisioned on legacy <code>chronicle-tla</code> Google-managed BigQuery datasets (including tenants whose temporary transition exceptions expired in September 2025). Enterprise+ customers and customers using Bring Your Own BigQuery (BYOBQ) exports to customer-managed Google Cloud projects are not impacted.</li>\n<li><strong>When:</strong> Decommissioning begins on October 28, 2026.</li>\n<li><strong>Action required:</strong> To retain BigQuery access to Google SecOps data, configure <a href=\"https://docs.cloud.google.com/chronicle/docs/reports/export-to-customer-managed-project\">export to a customer-managed BigQuery project (BYOBQ)</a> or contact your account team to upgrade to Enterprise+.</li>\n</ul>\n<h2 class=\"release-note-product-title\">Memorystore for Redis Cluster</h2>\n<h3>Feature</h3>\n<p>The <a href=\"https://docs.cloud.google.com/memorystore/docs/cluster/manage-basic-auth\">basic token-based authentication</a> feature is <a href=\"https://docs.cloud.google.com/products#product-launch-stages\">Generally Available</a>.</p>"
