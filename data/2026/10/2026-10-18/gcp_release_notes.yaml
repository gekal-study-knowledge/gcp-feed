    "summary": "<h2 class=\"release-note-product-title\">Google SecOps</h2>\n<h3>Feature</h3>\n<p><strong>Specify whether to reopen closed cases when the grouping is by Source Grouping Identifier</strong></p>\n<p>You can now specify whether Google SecOps reopens closed cases when grouping SOAR alerts by <strong>Source Grouping Identifier</strong>. When the option is enabled and a new alert is received with a source grouping identifier of a case that was previously closed in Google SecOps, then  Google SecOps reopens the case. For more information, see <a href=\"https://docs.cloud.google.com/chronicle/docs/soar/investigate/working-with-alerts/alert-grouping-mechanism-admin\">Configure alert grouping</a>.</p>"
