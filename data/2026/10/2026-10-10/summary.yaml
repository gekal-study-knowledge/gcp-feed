"overview": |
  この日は 1 件で、Alteryx One Live Query と BigQuery の連携でした。非構造データを扱うワークフローの近代化として、つながっていないツールへの依存を減らし、データの移動を最小化して、ウェアハウスの中で実行することを狙うものです。Live Query はブラウザで使える直感的な環境で、業務ユーザーがコードを 1 行も書かずに高度なデータパイプラインを組めます。BigQuery の規模と性能と組み合わせると、安全な SQL プッシュダウンによってデータ変換のロジックがネットワーク越しにデータを動かさずにウェアハウスの中で直接実行されます。この組み合わせは文書が中心のワークフローでとくに効果があり、BigQuery の厳格なデータガバナンスとセキュリティを保ったまま、Live Query が Gemini のような Google の AI と機械学習のモデルをオーケストレーションして PDF や画像からインテリジェンスを抽出できます。例として、経理や業務のチームがベンダーの請求書の山に埋もれがちで、PDF のデータは不揃い、請求書番号の形式もばらばらで手作業のミスのリスクが高く、従来は手作業の抽出や断片的なツールの連なりでデータをウェアハウスへ運ぶ必要があり、時間がかかって重複や金額の不一致も起きやすかった、という状況が挙げられています。Live Query と BigQuery の連携により、請求書の PDF から BigQuery での例外レポートまでのライフサイクル全体を自動化できます。
