  "874389ca9f8c3061d7b47d5b2d2bf834":
    "id": "874389ca9f8c3061d7b47d5b2d2bf834"
    "title": "GKE の弾力性がさらに向上: ゼロへのスケーリング、費用削減、ワークロードの応答性維持"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities/"
    "published": "2026-10-17 11:00:00"
    "fetched": "2026-10-09 19:04:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 24 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">真の弾力性は、クラウドネイティブ エンジニアリングの究極の目標として長年追求されてきました。Kubernetes はリソース管理に革命をもたらしましたが、散発的に実行されるワークロード（バッチ プロセッサ、イベント ドリブン ワーカー、開発環境など）は、処理を待機している間もコンピューティング リソースを消費するため、費用の増加を招きます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Kubernetes Engine（GKE）1.37 では、</span><strong style=\"vertical-align: baseline;\">ゼロへのスケールダウンとゼロからのスケールアップ</strong><span style=\"vertical-align: baseline;\">をネイティブに実現することで、この問題に正面から取り組んでいます。新しい一連の機能を使用すると、ワークロードを完全にゼロレプリカにスケールダウンして、リソースの消費を停止できます。同時に、需要が戻ったときには、GKE のキャパシティ バッファでこれらのワークロードを迅速かつ簡単に再起動できるため、インフラストラクチャの無駄を減らすことができます。これは単に費用を削減するだけでなく、常時稼働のインフラストラクチャの費用をワークロードの準備状況から切り離すことにもつながります。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=t4g6l4s1L1s\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Scale To &amp; From Zero on GKE using HPA</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=t4g6l4s1L1s\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">進化: HPA ベースのゼロへのスケーリングと KEDA</strong></h3>\n<p><span style=\"vertical-align: baseline;\">長年にわたり、</span><a href=\"https://keda.sh/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kubernetes Event-Driven Autoscaling（KEDA）</span></a><span style=\"vertical-align: baseline;\">というオプションの Kubernetes コンポーネントが、ゼロへのスケーリングの定番ソリューションでした。KEDA は強力ですが、環境が複雑になります。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">機能</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">GKE のゼロへのスケーリング</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">KEDA ベースの設定</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">運用上のトイル</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">マネージド サービス。追加のコンポーネントは不要。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">ScaledObject</code><span style=\"vertical-align: baseline;\"> CRD とオペレーターの管理が必要。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">構成</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ネイティブ なHPA と CRD（最小限の YAML）。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">大規模なフリートでは、YAML が 10,000 行を超えることもあります。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイテンシ</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">内部化された信号経路により、反応時間を短縮します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ポーリング間隔とホップ数により、コールド スタートの遅延が増加します。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">ゼロへのスケーリングを GKE コントロール プレーンに直接組み込むことで、アドオン オペレーターや数千行の構成が不要になります。ロジックは「サイドカー管理」からワークロードのネイティブ属性に移行します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">仕組み: AutoscalingMetric と KEP-2021 を使用した HPA</strong></h3>\n<p><span style=\"vertical-align: baseline;\">GKE 内でゼロにスケールする鍵は、2 つの重要なコンポーネントの統合にあります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AutoscalingMetric を使用した HPA:</strong><span style=\"vertical-align: baseline;\"> これは、Google Cloud Managed Service for Prometheus からの外部シグナルの直接読み取りをサポートするマネージド指標シグナル パイプラインです。AutoscalingMetric を使用した HorizontalPodAutoscaler（HPA）は、Pub/Sub、Cloud Monitoring、ロードバランサのシグナルからオートスケーラーに指標を送信するための、統合された高パフォーマンスのパスを提供します。アダプターの煩雑さを伴わずに済みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KEP-2021:</strong><span style=\"vertical-align: baseline;\"> HPA で </span><code style=\"vertical-align: baseline;\">minReplicas: 0 を可能にする</code><a href=\"https://kubernetes.io/blog/2026/09/02/kubernetes-v1-37-hpa-scale-to-zero-beta/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Kubernetes Enhancement Proposal</span></a> </p>\n<p class=\"p1\">に基づいて構築されたこのメカニズムにより、指標がしきい値を下回ると、<span class=\"s1\">HPA </span>はすべての<span class=\"s1\"> Pod </span>を停止できます。また、指標が保留中の作業を示したらすぐに、<span class=\"s1\">HPA </span>が<span class=\"s1\"> Deployment </span>を「起動」できるようにします。</p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">最初の「ゼロへのスケーリング」ワークロードの構成</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ネイティブなゼロへのスケーリングを実装するには、指標定義と HPA という 2 つの主要なオブジェクトが必要です。次の例では、Pub/Sub サブスクリプションの未配信メッセージ数に基づいてワーカーをスケーリングします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">指標のソースを定義する</strong></p>\n<p><code style=\"vertical-align: baseline;\">AutoscalingMetric</code><span style=\"vertical-align: baseline;\"> CRD を使用して、外部の Cloud Monitoring 指標をクラスタにマッピングします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling.gke.io/v1beta1\\r\\nkind: AutoscalingMetric\\r\\nmetadata:\\r\\n  name: my-autoscalingmetric\\r\\nspec:\\r\\n  metrics:\\r\\n  - promql:\\r\\n      name: pubsub-undelivered\\r\\n       query: &gt;\\r\\n          {\\r\\n            &quot;pubsub.googleapis.com/subscription/num_undelivered_messages&quot;,\\r\\n            subscription_id=&quot;my-subscription&quot;\\r\\n          }&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3fe2120e90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">minReplicas: 0 を使用して HPA を構成する</strong></p>\n<p><span style=\"vertical-align: baseline;\">HPA で指標を参照し、最小レプリカ数を明示的にゼロに設定します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling/v2\\r\\nkind: HorizontalPodAutoscaler\\r\\nmetadata:\\r\\n  name: worker-hpa\\r\\nspec:\\r\\n  scaleTargetRef:\\r\\n    apiVersion: apps/v1\\r\\n    kind: Deployment\\r\\n    name: worker-deployment\\r\\n  minReplicas: 0\\r\\n  maxReplicas: 50\\r\\n  metrics:\\r\\n  - type: External\\r\\n    pods:\\r\\n      metric:\\r\\n        name: autoscaling.gke.io|my-autoscalingmetric|pubsub-undelivered\\r\\n      target:\\r\\n        type: AverageValue\\r\\n        averageValue: 10&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3fe2943b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これで、外部指標に基づいてワークロードをゼロにスケールダウンしたり、ゼロからスケールアップしたりできるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ゼロへのスケーリング機能は、Cloud Monitoring からの外部指標を GKE でサポートすることで実現しています。</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/autoscale-using-metrics#define-custom-metrics-promql\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AutoscalingMetric</code></a><span style=\"vertical-align: baseline;\"> カスタム リソースを拡張することで、複雑なサードパーティ アダプタを使用せずに、Google Managed Service for Prometheus から指標をクエリできるようになりました。これにより、レイテンシが短縮され、セキュリティが簡素化されます。また、ネイティブな「ゼロへのスケーリング」ワークロードを構成するための重要な基盤となります。このインテグレーションについて詳しくは、</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/native-support-for-prometheus-metrics-in-gke\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE での外部指標のネイティブ サポート</span></a><span style=\"vertical-align: baseline;\">に関するブログ投稿をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">キャパシティ バッファによる起動レイテンシの管理</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ゼロからのスケーリングにおける最大の課題は、いわゆるコールド スタートです。これは、GKE がノードをプロビジョニングし、コンテナがそれを pull して起動するまでにかかる時間です。そこで役立つのが</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-standby-buffers-speed-up-autoscaling-for-less-spend?e=0&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE キャパシティ バッファ</span></a><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">キャパシティ バッファは、プールされたウォーム状態のキャパシティとして機能します。GKE は、ゼロにスケールできる複数のワークロードで共有できる少量のウォーム コンピューティング リソースを維持することで、HPA が 0 から 1 にジャンプしたときに、Pod がすぐに要求できるリソースを確保します。これにより、新しい GKE ノードがスピンアップするまでの 60～90 秒の待ち時間がなくなり、起動レイテンシが数分から瞬時に短縮されます。その間、ワークロードの費用はゼロに抑えられます。</span></p>\n<p><span style=\"vertical-align: baseline;\">キャパシティ バッファには、アクティブとスタンバイの 2 種類があります。小さなアクティブ バッファは、ゼロにスケールされた数百のワークロードに対応できます。各ワークロードがレプリカを維持するのではなく、アクティブ バッファがクラスタ全体にサービスを提供するワイルドカード キャパシティとして機能します。スタンバイ バッファはアクティブ バッファに比べて大幅に低コストで、サイズが大きくなるため、クラスタで持続的な負荷が発生した場合にアクティブ バッファを迅速に補充できます。これらを併用することで、即時のスケーリングを実現しながら、低コストも維持できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">今後について</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、GKE の弾力性に関するロードマップを継続的に拡大しています。たとえば、開発環境を午後 8 時にゼロにスケールダウンし、午前 7 時にスケールアップするとします。繰り返し発生するスケーリングをより細かく制御する方法に注目し、ゼロへのスケーリングの時間枠を事前に定義できるようにしましょう。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ゼロへのスケーリングを今すぐ始めましょう</strong></h4>\n<p><span style=\"vertical-align: baseline;\">アイドル状態のリソースに料金を支払う時代は終わりを迎えようとしています。イベント ドリブンなワークロードや散発的なワークロードに対して GKE のネイティブなゼロへのスケール機能を有効にすることで、起動パフォーマンスを犠牲にすることなく費用を削減できます。ゼロへのスケールを開始するには、次の手順を行います。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アイドル期間を伴う、需要が変動する</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/optimize-workload-resource-utilization\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ワークロードを特定</span></a><span style=\"vertical-align: baseline;\">します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/autoscale-using-metrics#define-custom-metrics-promql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AutoscalingMetric</span></a><span style=\"vertical-align: baseline;\"> を構成し、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/scale-to-from-zero-hpa\"><span style=\"text-decoration: underline; vertical-align: baseline;\">minReplicas をゼロに設定</span></a><span style=\"vertical-align: baseline;\">します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">クラスタまたはワークロードに</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/capacity-buffer\"><span style=\"text-decoration: underline; vertical-align: baseline;\">キャパシティ バッファ</span></a><span style=\"vertical-align: baseline;\">を追加して、応答時間を短縮します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">詳細は、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/scale-to-from-zero-hpa\"><span style=\"text-decoration: underline; vertical-align: baseline;\">HPA を使用した GKE ワークロードのゼロへのスケールダウンとゼロからのスケールアップ</span></a><span style=\"vertical-align: baseline;\">に関するドキュメントをご覧ください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Kubernetes Engine、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Eyal Yablonka</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Kubernetes Engine、シニア ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Scott Funkenhauser</strong></p></div>"
"last_updated": "2026-10-09 19:04:50 JST"
