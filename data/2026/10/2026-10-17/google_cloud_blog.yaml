  "d808a80cb152f68fa0921febab89f018":
    "id": "d808a80cb152f68fa0921febab89f018"
    "title": "Day 0 support for Reflection’s Beam on Google Cloud: 5x faster perf with llm-d and NVIDIA Dynamo"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/day-0-support-with-5x-perf-for-reflection-beam-on-google-cloud/"
    "published": "2026-10-17 02:00:00"
    "fetched": "2026-10-17 04:19:28"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, Reflection released </span><a href=\"https://huggingface.co/reflection\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Beam</span></a><span style=\"vertical-align: baseline;\">, its first open-weight model built to give developers, researchers, and enterprises open control and customization for frontier software engineering and long-horizon agentic tasks. Released under a permissive Apache 2.0 license with </span><span style=\"vertical-align: baseline;\">BF16</span><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">FP8</span><span style=\"vertical-align: baseline;\">, and </span><span style=\"vertical-align: baseline;\">NVFP4</span><span style=\"vertical-align: baseline;\"> checkpoints available at launch, Beam sets a new standard for inference efficiency in the 500B-parameter class by solving complex reasoning and coding problems with </span><a href=\"https://reflection.ai/blog/introducing-beam\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">3x to 4x higher reasoning</span></a><span style=\"vertical-align: baseline;\"> compute efficiency than comparable open models.</span></p>\n<p><span style=\"vertical-align: baseline;\">Alongside today’s release, Google Cloud is announcing day 0 support and ready-to-run deployment recipes for serving Beam on Google Cloud AI Hypercomputer and NVIDIA AI Infrastructure.</span></p>\n<p><span style=\"vertical-align: baseline;\">To help developers get the full benefit of Beam’s token efficiency in production, we worked with Reflection to optimize performance of the underlying serving stack using</span><a href=\"https://llm-d.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d</span></a><span style=\"vertical-align: baseline;\"> (with vLLM) and NVIDIA </span><a href=\"https://github.com/ai-dynamo/dynamo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dynamo</span></a><span style=\"vertical-align: baseline;\"> (with SGLang) on Google Cloud:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"By deploying our Beam model on Google Cloud, we achieved up to 5x higher performance and 8x lower latency to optimize serving of agentic workloads.\"</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Joe Spisak, VP of Product &amp; Head of Open Source, Reflection</strong></p>\n<p><span style=\"vertical-align: baseline;\">With today’s day 0 release on Google Cloud, developers get:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Compounding model and system efficiency: </strong><span style=\"vertical-align: baseline;\">Combining Beam’s 3x to 4x reasoning compute efficiency with system-level optimizations on A4X Max instances (NVIDIA GB300 NVL72) for up to 5x higher throughput and 8x lower latency,* and G4 VMs (NVIDIA RTX PRO 6000) for up to 2x higher throughput and 8x lower latency.*</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">High-efficiency multi-turn serving:</strong><span style=\"vertical-align: baseline;\"> KV-cache-aware routing, prefill/decode disaggregation, speculative decoding and hierarchical KV cache offloading to Host DRAM and Local SSD reduce redundant prompt recomputation across long coding sessions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Turnkey optimized deployment:</strong><span style=\"vertical-align: baseline;\"> Our recommended performance optimized recipes for agentic workloads with llm-d and NVIDIA Dynamo are available in </span><a href=\"https://github.com/AI-Hypercomputer/gpu-recipes\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI-Hypercomputer/gpu-recipes</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/llm-d/llm-d/tree/main/guides\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d repo</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/reflection/model-garden/beam\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Garden</span></a><span style=\"vertical-align: baseline;\"> in Gemini platform</span><a href=\"https://console.cloud.google.com/agent-platform/publishers/reflection/model-garden/beam\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">with a few clicks. </span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">*Based on customer benchmarking</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Scaling inference requires system-level optimization</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When evaluating models for agentic coding and tool use, inference efficiency happens at two distinct layers: </span><strong style=\"vertical-align: baseline;\">how efficiently the model reasons</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">how efficiently the serving system executes multi-turn loops</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Model-level efficiency: Reflection’s Beam</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Reflection designed Beam (</span><span style=\"vertical-align: baseline;\">~501B</span><span style=\"vertical-align: baseline;\"> total parameters with </span><span style=\"vertical-align: baseline;\">~23B</span><span style=\"vertical-align: baseline;\"> active parameters per token, and an approximately </span><span style=\"vertical-align: baseline;\">1M</span><span style=\"vertical-align: baseline;\">-token context window) specifically for text-native software engineering and multi-step tool use. It plugs directly into the coding harnesses developers already use, including Reflection’s Mirror CLI, Claude Code, Hermes, OpenCode, and , to resolve GitHub issues, run CLI and DevOps workflows, and complete long-horizon tasks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because Beam activates only 23B parameters per token and reaches solutions using </span><a href=\"https://reflection.ai/blog/introducing-beam\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">3x to 4x fewer reasoning tokens</strong></a><span style=\"vertical-align: baseline;\"> than other comparable open weight models, it dramatically reduces the inference-time compute required for each reasoning step.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">System-level efficiency: AI Hypercomputer optimized serving</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Once developers deploy an agent into production, a second set of bottlenecks could appear at the serving layer. In an agentic coding loop, the model is called dozens of times in a single session. With every turn, the coding harness appends new file reads, code diffs, compiler logs, and tool outputs to a shared conversation history that quickly grows to tens or hundreds of thousands of tokens.</span></p>\n<p><span style=\"vertical-align: baseline;\">Even when the model itself generates 3x to 4x fewer reasoning tokens on each turn, the </span><strong style=\"vertical-align: baseline;\">accumulated context window across turns</strong><span style=\"vertical-align: baseline;\"> creates two major infrastructure challenges:</span></p>\n<p><span style=\"vertical-align: baseline;\">First, </span><strong style=\"vertical-align: baseline;\">prefill compute becomes a bottleneck</strong><span style=\"vertical-align: baseline;\">. Standard Kubernetes load balancers distribute requests using stateless round-robin routing. When a coding harness sends Turn 15 of a session, it often lands on a different replica than Turn 14. That replica is forced to recompute the entire historical prompt from scratch, wasting GPU compute and creating long prefill queues that delay other users.</span></p>\n<p><span style=\"vertical-align: baseline;\">Second, </span><strong style=\"vertical-align: baseline;\">decode becomes bottlenecked by KV cache capacity</strong><span style=\"vertical-align: baseline;\">. Holding long-context KV caches for dozens of concurrent agent sessions quickly fills up GPU High-Bandwidth Memory (HBM). Once HBM fills up, the serving engine has to evict older KV blocks. As soon as those blocks are evicted, cache hit rates drop and GPU throughput stalls.</span></p>\n<p><span style=\"vertical-align: baseline;\">To preserve Beam’s model-level efficiency at cluster scale, the serving stack has to be optimized as a distributed system. That is why our recipes pair Beam with</span> <a href=\"https://llm-d.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">llm-d</strong></a><span style=\"vertical-align: baseline;\"> (with vLLM) and</span> <a href=\"https://github.com/ai-dynamo/dynamo\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA Dynamo</strong></a><span style=\"vertical-align: baseline;\"> (with SGLang).</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Inside the AI Hypercomputer inference architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To run Beam’s </span><span style=\"vertical-align: baseline;\">BF16</span><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">FP8</span><span style=\"vertical-align: baseline;\">, and </span><span style=\"vertical-align: baseline;\">NVFP4</span><span style=\"vertical-align: baseline;\"> checkpoints at peak efficiency on Day 0, we designed a vertically integrated architecture on AI Hypercomputer where each layer handles a specific part of the agentic serving lifecycle.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>System optimized architecture for serving agentic traffic</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Rather than treating inference pods as stateless endpoints, each layer of the stack is co-designed around the multi-turn agent lifecycle:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Prefix- and load-aware routing (GKE + llm-d EPP / Dynamo router):</strong><span style=\"vertical-align: baseline;\"> Tracks cached prefixes and queue depth across worker pods, steering each follow-up turn from a coding harness to the replica holding its warm KV prefix while preventing queue saturation via turn-priority flow control.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Disaggregated compute and speculative decoding (A4X Max &amp; G4 instance)</strong><span style=\"vertical-align: baseline;\">: Runs vLLM and SGLang with native Blackwell NVFP4, Expert Parallelism (EP) for Beam’s 23B active experts, Data-Parallel Attention, and DFlash2 speculative decoding. Separating </span><strong style=\"vertical-align: baseline;\">Prefill and Decode (P/D) pools</strong><span style=\"vertical-align: baseline;\"> ensures heavy prompt bursts never stall active token generation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tiered KV cache (GPU Memory -&gt; DRAM &amp; Local SSD)</strong><span style=\"vertical-align: baseline;\"> Active KV blocks stay in high-bandwidth GPU memory (</span><strong style=\"vertical-align: baseline;\">Tier 1</strong><span style=\"vertical-align: baseline;\">), while warm KV blocks evicted during long-horizon sessions overflow into host CPU DRAM and local NVMe SSDs (</span><strong style=\"vertical-align: baseline;\">Tier 2</strong><span style=\"vertical-align: baseline;\">) via vLLM’s OffloadingConnector or SGLang's HiCache, allowing historical context to be fetched in milliseconds instead of recomputed from scratch.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">System optimizations for multi-turn agentic workloads</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When serving multi-turn coding and tool-use workloads like the </span><a href=\"https://inferencex.semianalysis.com/agentx\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AgentX trajectory dataset </strong></a><span style=\"vertical-align: baseline;\">across rising concurrency levels, each layer in the serving stack contributes to the performance and latency improvements for multi-turn, long context traffic patterns of agentic workloads:</span></p>\n<p><span style=\"vertical-align: baseline;\"><strong style=\"font-style: italic; vertical-align: baseline;\">A note on reading these charts. </strong><span style=\"font-style: italic; vertical-align: baseline;\">The two configurations are not comparable to each other. NVIDIA Dynamo ran on A4X Max instances with 32 x NVIDIA GB300 NVL72GPUs; llm-d ran on G4 VMs with 8 x NVIDIA RTX PRO 6000 GPUs. Each chart shows the gain over a baseline on the same hardware. More replicas give the router more warm KV caches to hit and more room to split prefill from decode, so the uplift grows with the deployment. Both llm-d and NVIDIA Dynamo scale up and down to match the underlying infrastructure.</span></span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - gb300 results\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_gb300_results.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>NVIDIA Dynamo optimized perf vs baseline deployment of Reflection's Beam</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - G4 results\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_-_G4_results.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>llm-d optimized perf vs baseline deployment of Reflection's Beam</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Across both platforms, layering these optimizations shifts the Pareto frontier to deliver higher output throughput and faster per-user interactivity simultaneously:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Baseline deployment (Stateless round-robin routing).</strong><span style=\"vertical-align: baseline;\"> In a standard Kubernetes deployment without prefix awareness, consecutive turns from the same coding session land on different replicas, forcing constant prefill recomputation on historical context and causing throughput to plateau as concurrency scales.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KV-cache-aware &amp; flow control routing.</strong><span style=\"vertical-align: baseline;\"> Enabling prefix-aware routing in NVIDIA Dynamo or llm-d’s Sticky EPP with turn-priority flow control keeps multi-turn agent trajectories pinned to the replica holding their warm KV cache, immediately cutting Time-to-First-Token (TTFT) latency and freeing up GPU compute, resulting in a significant increase in token throughput.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Host DRAM and Local SSD (LSSD) KV offloading.</strong><span style=\"vertical-align: baseline;\"> Offloading evicted KV blocks from GPU memory into host DRAM and local NVMe SSDs prevents cache thrashing when dozens of long-context coding sessions exceed on-device GPU memory capacity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Disaggregated serving, speculative decoding, and KV pool tuning.</strong><span style=\"vertical-align: baseline;\"> Tuning hybrid KV cache memory allocation, enabling speculative decoding, and disaggregating prefill and decode workers isolates token generation from heavy prompt bursts while the draft model multiplies output throughput to keep per-agent token interactivity fast.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started and meet us at PyTorchCon and GTC Berlin </strong></h3>\n<p><span style=\"vertical-align: baseline;\">This blog explored how you can leverage system level optimizations to scale performance to serve Reflection's Beam family of models for agentic workloads. All of the Kubernetes manifests, router configurations, and benchmarking scripts from this post are open-source and ready to run on your own GKE cluster.</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Deploy the optimized stack</strong><span style=\"vertical-align: baseline;\">: Explore the day 0 guides for running Reflection’s Beam with llm-d and NVIDIA Dynamo in the</span><a href=\"https://github.com/ai-hypercomputer/gpu-recipes\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AI-Hypercomputer/gpu-recipes repository</span></a><span style=\"vertical-align: baseline;\"> on </span><a href=\"https://github.com/AI-Hypercomputer/gpu-recipes/tree/main/inference/a4xmax/disaggregated-serving/dynamo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A4X Max</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://github.com/AI-Hypercomputer/gpu-recipes/tree/main/inference/g4/aggregated-serving/llm-d\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G4</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/reflection/model-garden/beam\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Garden</span></a><span style=\"vertical-align: baseline;\"> in Gemini platform.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Download the weights</strong><span style=\"vertical-align: baseline;\">: Grab the Apache 2.0 </span><span style=\"vertical-align: baseline;\">BF16</span><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">FP8</span><span style=\"vertical-align: baseline;\">, and </span><span style=\"vertical-align: baseline;\">NVFP4</span><span style=\"vertical-align: baseline;\"> checkpoints on</span><a href=\"https://huggingface.co/reflection\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Reflection’s Hugging Face page</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Visit us at the llm-d and PyTorch Conference in San Jose</strong><span style=\"vertical-align: baseline;\">: If you are attending PyTorch Conference North America in San Jose this October, stop by the </span><strong style=\"vertical-align: baseline;\">llm-d community sessions</strong><span style=\"vertical-align: baseline;\"> and the Google Cloud booth #. We will be walking through live demos of KV-cache-aware routing, P/D disaggregation, and KV cache tiering for agentic workloads.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Come see us at NVIDIA GTC Berlin: </strong><span style=\"vertical-align: baseline;\">If you are attending NVIDIA GTC Berlin, come connect with us at our booth #3026, or our Google Cloud Hub at w3.hub: just a short 5 minute walk from the venue. </span><a href=\"https://cloud.google.com/nvidia#join-us-at-gtc-berlin\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn more about our sessions</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n</ul>\n<p> </p></div>"
  "1ec03e1349b1bad2e50fc7f5003e6ee7":
    "id": "1ec03e1349b1bad2e50fc7f5003e6ee7"
    "title": "Architecting autonomy: A design pattern for high-compute, governed agents in biotech"
    "link": "https://cloud.google.com/blog/topics/healthcare-life-sciences/architecting-scalable-agentic-biotech-workloads/"
    "published": "2026-10-17 01:00:00"
    "fetched": "2026-10-17 04:19:28"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In production systems today, most AI agents operate as lightweight dispatchers. They parse a prompt, make an API call, retrieve a record, and hand back control. Their execution is fast, stateless and cheap. Biotechnology does not work this way. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Folding a protein target, screening a 50,000 compound ligand library, or evaluating structure-activity relationships (SAR) are not quick API lookups. They are sustained, stateful, GPU-bound simulations that run for minutes or even hours across specialized silicon. When you ask a general-purpose large language model (LLM) endpoint to coordinate a complex drug discovery workflow, the standard paradigm breaks: Timeouts occur, context windows overflow with atomic coordinates, and proprietary chemical Intellectual Property (IP) risks exposure to external networks. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Building enterprise grade research and development (R&amp;D) agents requires moving past the monolithic assistant model. In this blog post, we will discuss how to use a three-layer architecture: separating cognitive orchestration (the brain) from computational execution (the muscle), and anchoring both inside an enterprise governance plane to build scalable agents for drug discovery use cases in biotech. </span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=TZTDqtSpzv8\">\n\n      \n        <img alt=\"AI Agent Infrastructure Decoded\" src=\"https://img.youtube.com/vi/TZTDqtSpzv8/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=TZTDqtSpzv8\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">A three-layer pattern</span></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The reference architecture below shows how to architect, optimize, and govern high-compute autonomous agents in biotechnology, specifically Drug Discovery. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_TukBnfH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1 — The three-layer pattern: a cognitive orchestrator (brain), a scalable GPU execution layer (muscle), and an enterprise governance plane.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">The execution layer: scaling the muscle - high-compute execution</span><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The execution layer is responsible for the heavy scientific computations. The first architectural decision is determining where workloads should run:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Strategic, proprietary pipelines require dedicated GPU infrastructure within your security perimeter</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Routine or standardized workloads can safely be delegated to managed cloud endpoints</span></p>\n</li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In this architecture, protein folding is driven by </span><a href=\"https://catalog.ngc.nvidia.com/orgs/nvidia/teams/nim/collections/bionemo-esmfold\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ESMFold</span></a><span style=\"vertical-align: baseline;\"> and generative design by </span><a href=\"https://docs.nvidia.com/nim/bionemo/genmol/latest/overview.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GenMol</span></a><span style=\"vertical-align: baseline;\">. Both run as </span><a href=\"https://www.nvidia.com/en-us/ai-data-science/products/nim-microservices/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA Inference Microservices</span></a><span style=\"vertical-align: baseline;\"> or NIMs deployed on </span><a href=\"https://cloud.google.com/kubernetes-engine?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE) using G4 VMs backed by </span><a href=\"https://cloud.google.com/blog/products/compute/introducing-g4-vm-with-nvidia-rtx-pro-6000\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell</span></a><span style=\"vertical-align: baseline;\"> GPUs.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">A critical hurdle in containerized GPU workloads is the cold-start penalty, the latency delay required to pull multi-gigabyte model weights from an image registry and stage them into GPU memory (VRAM).</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To ensure low latency responsiveness, we build the following as a recommendation into the reference architecture:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Maintain warm pools:</strong><span style=\"vertical-align: baseline;\"> Pin the GKE node pool to a minimum of one active node.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Preload weights:</strong><span style=\"vertical-align: baseline;\"> Model weights are loaded directly into VRAM at pod initialization, ensuring containers are immediately ready for inference.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Resilient scheduling:</strong><span style=\"vertical-align: baseline;\"> GKE manages pod lifecycles and restarts failed instances without tearing down the underlying VM infrastructure. </span></p>\n</li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">This approach trades custom, manual CUDA kernel tuning for NVIDIA's pre-compiled, containerized runtimes, dramatically reducing infrastructure engineering overhead while ensuring deterministic throughput.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In biotech, chemical structures represent millions of dollars in proprietary IP. A docking request transmits SMILE strings or 3D coordinate matrices that must never leave company custody.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Containerized NIMs eliminate the friction between rapid prototyping and rigorous data isolation. During early exploration, researchers can query NVIDIA hosted endpoints. When transitioning to proprietary lead candidates, the exact same container is deployed to GKE inside a private </span><a href=\"https://cloud.google.com/vpc?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC</span></a><span style=\"vertical-align: baseline;\">. The agent’s orchestration logic remains identical; only the target URI updates from an external proxy to an internal VPC endpoint. No structural data leaves the enterprise perimeter.</span></p>\n<h4><span style=\"vertical-align: baseline;\">The cognitive layer: Multi-agent reasoning</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">With compute execution isolated, the cognitive layer manages agentic workflow sequencing. Built on </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Runtime</span></a><span style=\"vertical-align: baseline;\">, within the Gemini platform, this reference architecture shows a system that deploys a hierarchical multi-agent structure, one lead orchestrator, and two specialized domain sub-agents (Lead Optimization and Safety Screening) . The multi-agent design can be modified to suit the use case at hand. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Based on this design, when an end-user submits a high-level task such as </span><strong style=\"font-style: italic; vertical-align: baseline;\">“ Analyze Candidate 4b against Target X and produce a SAR report”</strong><span style=\"vertical-align: baseline;\">, the system applies four core orchestration patterns discussed below; </span></p>\n<ul>\n<li style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">In-process native agent handoffs: </strong><span style=\"vertical-align: baseline;\">The lead orchestrator delegates tasks to specialist sub-agents using Agent Runtime’s native SDK rather than network-serialized agent-to-agent HTTP protocols. This eliminates intermediate network hops and keeps internal handoffs instantaneous. Only the outermost boundary communicates outward to user-facing surfaces like the </span><a href=\"https://cloud.google.com/gemini-enterprise?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=1713762-Gemini_Enterprise-DR-NA-US-en-Google-BKWS-EXA-GEnterprise&amp;utm_content=c-Hybrid+%7C+BKWS+-+MIX+%7C+Txt_Gemini+Enterprise-189528400785&amp;utm_term=gemini+enterprise&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=23370621055&amp;gclid=CjwKCAjwl97RBhBWEiwAa9rbXeetAjZcIRGcaAR57VWVWk7ik5DJ9ESqHiDav-2ervoiyzzRZ1ZWyRoCj6sQAvD_BwE&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini</span></a><span style=\"vertical-align: baseline;\"> agent.</span></li>\n<li style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Passing bulky payloads by reference: </strong><span style=\"vertical-align: baseline;\">LLMs degrade quickly when forced to ingest massive arrays of 3D spatial coordinates. In this architecture, raw structural data (PDB files, docking poses, trajectory logs) is written directly to </span><a href=\"https://cloud.google.com/storage?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=Cloud-SS-DR-GCP-1713658-GCP-DR-NA-US-en-Google-SKWS-BRO-storage&amp;utm_content=c-Hybrid+%7C+SKWS+-+BRO+%7C+Txt-Infrastructure-Storage-Cloud+Storage-4642545472&amp;utm_term=cloud+storage&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=23767162264&amp;gclid=CjwKCAjwl97RBhBWEiwAa9rbXYcqs8qBJehBeWaezdgKd4am7QbV7uo3__CJIZqoa8lqgP8ErM0LkBoCJ3cQAvD_BwE&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\">. Agents pass lightweight, signed object URIs and high-level structural summaries, keeping context windows compact and inference costs down.</span></li>\n<li style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Decoupling workflow logic from biochemical reasoning: </strong><span style=\"vertical-align: baseline;\">General-purpose LLMs excel at task planning and synthesis, but are prone to hallucinating biochemical nuances. To control this behavior, this architecture maintains strong separation of concerns, namely, workflow and tasks decomposition are handled by Gemini. Domain chemistry and pharmacological reasoning are handled by specialized </span><a href=\"https://www.nvidia.com/en-us/ai-data-science/foundation-models/nemotron/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Nemotron</span></a><span style=\"vertical-align: baseline;\"> models hosted on dedicated GPU nodes. </span></li>\n<li style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Context-driven evaluation over rigid cutoffs: </strong><span style=\"vertical-align: baseline;\">Traditional computational screening enforces arbitrary numerical cutoffs (e.g., discard if binding affinity ,-7.5 kcal/mol) However, therapeutic context fundamentally alters risk tolerance. Preventive cardiovascular therapy taken daily by healthy patients requires extremely strict safety margins, or a novel oncology candidate targeting an intractable cancer may accept higher toxicity if efficacy is demonstrated.</span></li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">By passing disease context directly into the specialized reasoning models, drug candidates are evaluated against dynamic, target-specific profiles rather than static thresholds, preventing the premature culling of viable drug leads.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Performance best practices for high-compute pipelines</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Optimizing an agentic system that interfaces with heavy GPU compute requires challenging common engineering instincts:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">Common Assumption</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">Architectural Reality</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">Recommended Best Practice</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">\"Swap in a faster driver model to cut latency.\"</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">The primary orchestrator's token generation is rarely the bottleneck in multi-step R&amp;D pipelines.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Optimize I/O, not token speed: Focus on reducing payload sizes and intermediate network hops rather than compromising orchestrator reasoning depth.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">\"Parallelize tool calls across workers.\"</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">External scientific services and containerized models often serialize requests internally on dedicated hardware.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Respect execution topology: Align client-side concurrency with backend queue mechanics to prevent pipeline lockouts and connection timeouts.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">\"Pass full simulation states between tools.\"</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Large JSON bodies cause schema validation failures, prompt truncation, and token bloat.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Pass heavy payloads by reference: Store raw coordinates in object storage and pass lightweight URIs between agent boundaries.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">\"Return outputs only when the pipeline finishes.\"</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Long multi-minute runs leave scientists blind to whether jobs are proceeding or stalled.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Stream intermediate stage completions: Emit progress updates at each completed milestone (e.g., </span><span style=\"font-style: italic; vertical-align: baseline;\">folding complete</span><span style=\"vertical-align: baseline;\">, </span><span style=\"font-style: italic; vertical-align: baseline;\">docking running</span><span style=\"vertical-align: baseline;\">) for real-time visibility.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">\"Chain multiple granular micro-tools.\"</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Deep tool-chains increase the probability of hallucinated arguments and schema mismatches.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Collapse compute pipelines: Wrap end-to-end simulation pipelines behind a single, clean tool interface that takes clear parameters and returns a consolidated object.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h4><span style=\"vertical-align: baseline;\">The enterprise governance and asymmetric autonomy</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Deploying high-compute agents in enterprise environments requires robust data sovereignty, audit trails, and process control. The </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini platform</span></a><span style=\"vertical-align: baseline;\"> establishes these safeguards natively with the following components: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><a href=\"https://docs.cloud.google.com/iam/docs/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Identity</span></a><span style=\"vertical-align: baseline;\">: Every autonomous agent operates with a cryptographically verifiable identity. Thus, for a biotech use case, when a candidate molecule is advanced or rejected, the event is permanently logged to that specific agent principal. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Gateway</span></a><span style=\"vertical-align: baseline;\">: This serves the single ingress/egress point for every interaction within the perimeter. Centralized IAM and regional residency rules help ensure sensitive molecular data remains within designated cloud regions. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-registry\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Registry</span></a><span style=\"vertical-align: baseline;\">: This feature maintains a curated catalog of approved agents, validated tool schemas, and authorized Model Context Protocol (MCP) servers, preventing rogue tools from executing in production. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><a href=\"https://cloud.google.com/security/products/model-armor?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</span></a><span style=\"vertical-align: baseline;\">: This functionality inspects incoming prompts and outgoing payloads in real time to prevent prompt injection and data exfiltration. </span></p>\n</li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The payoff is clear. Identity, RBAC, auditing, residency, and data protection are native properties of the Gemini platform; this allows enterprise customers to focus on science rather than having to build a compliance stack for every project. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In high-stakes research and development, full autonomy introduces unacceptable liability, while requiring approval for trivial steps can create frictions. The solution addressing this to use asymmetric gating in the following ways;</span></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Automate reversible operations:</strong><span style=\"vertical-align: baseline;\"> For example, allow the agent to resolve chemical naming synonyms, pull structural PDBs, and run preliminary Lipinski screens autonomously without interrupting the researcher.</span></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Gate irreversible operations:</strong><span style=\"vertical-align: baseline;\"> For instance, initiating multi-GPU docking run, advancing a lead compound to wet-lab synthesis, or archiving a therapeutic program must require explicit human sign-off.</span></p>\n<h3 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">The pattern, and the path forward</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">High-compute autonomous agents succeed when the boundaries between cognitive planning, numerical computation, and system governance are clean in the following ways:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Keep the orchestrator focused on decomposition and synthesis, leaving intensive biophysical simulation to specialized, containerized microservices and models.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Eliminate context bloat by passing complex chemical data by reference through cloud storage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Anchor the workflow in enterprise governance, pairing cryptographic agent identity with asymmetric human oversight.</span></p>\n</li>\n</ol>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">As generative and structural biology models expand toward whole-cell modeling and complex dynamic simulations, this decoupled architecture ensures research systems scale efficiently while keeping proprietary IP secure and auditable.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Reach out to your Google sales representative if you have any requirements to build a use case like this and we will be happy to talk and support you in your agent development journey on Google Cloud.</span></p></div>"
  "600f8afc9dd892055098916f8314b652":
    "id": "600f8afc9dd892055098916f8314b652"
    "title": "Announcing Wiz Runtime Sensor add-on for GKE: Turnkey threat detection for Kubernetes"
    "link": "https://cloud.google.com/blog/products/identity-security/wiz-sensor-for-gke-turnkey-threat-detection-for-kubernetes/"
    "published": "2026-10-17 01:00:00"
    "fetched": "2026-10-17 04:19:28"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Everything is moving faster in the age of AI, and that includes security threats. What used to take attackers weeks to exploit can now happen in just a few minutes.</span></p>\n<p><span style=\"vertical-align: baseline;\">Standard vulnerability scans that run on artifacts at rest can catch basic setup issues, but to detect an attack that's actively happening you need real-time runtime protection.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we’re introducing the</span><strong style=\"vertical-align: baseline;\"> </strong><a href=\"https://docs.cloud.google.com/kubernetes-engine/security/install-wiz-sensor-addon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Runtime Sensor add-on for Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE), in preview. This built-in integration brings low-touch deployment, automated lifecycle management, enterprise credential security, and fleet-wide governance to Wiz's industry-leading eBPF runtime threat detection for both Standard and Autopilot GKE clusters.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The operational friction of runtime security</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Security and platform engineering teams share common dilemmas when deploying in-cluster runtime defenses:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deployment and lifecycle friction</strong><span style=\"vertical-align: baseline;\">: Deploying runtime agents often requires managing installations from third-party sources across dozens or hundreds of clusters.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Credential sprawl and security risks</strong><span style=\"vertical-align: baseline;\">: Passing and rotating API keys as Kubernetes Secrets introduces administrative overhead and security risk.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fleet-wide enforcement gaps</strong><span style=\"vertical-align: baseline;\">: Platform teams lack built-in policy controls to enforce that every new cluster has runtime sensors enabled before workloads are deployed and start receiving traffic.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Performance and operational overhead</strong><span style=\"vertical-align: baseline;\">: Without explicit and strategic resource limits, runtime agents can impact how much CPU and memory is available for your workloads and system functionality.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">With the </span><strong style=\"vertical-align: baseline;\">Wiz Runtime Sensor for GKE</strong><span style=\"vertical-align: baseline;\">, Google Cloud and Wiz have minimized these operational barriers. The Runtime Sensor is now available in GKE as a first-party, managed platform add-on.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Bridging the gap with Wiz Runtime Sensor for GKE</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Wiz Runtime Sensor for GKE connects central security and platform engineering workflows by simplifying and automating the sensor lifecycle.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"gke_wiz_sensor_architecture_final_google_sans\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/gke_wiz_sensor_architecture_final_google_s.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: High-level architecture showing credential sync, sensor deployment, and threat telemetry.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">With the add-on, GKE manages the sensor deployment, credential injection, and lifecycle updates. Building runtime protection directly into the platform reduces administrative overhead and provides the following benefits for your Kubernetes fleet:</span></p>\n<p><strong style=\"vertical-align: baseline;\">Native Secret Manager integration: </strong><span style=\"vertical-align: baseline;\">Security teams no longer need to distribute Wiz API keys across cluster namespaces. The add-on uses GKE's </span><a href=\"https://docs.cloud.google.com/secret-manager/docs/sync-k8-secrets\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager secret sync integration</strong></a><span style=\"vertical-align: baseline;\"> to store your Wiz credentials in an off-cluster, centralized credential vault that only a dedicated service account can access. </span></p>\n<p><span style=\"vertical-align: baseline;\">GKE automatically retrieves the credentials and injects them directly into the Runtime Sensor pods. Updating a key in Secret Manager automatically syncs to the sensor without requiring cluster restarts or manual intervention.</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Simplified enablement: </strong><span style=\"vertical-align: baseline;\">After you add your Wiz credentials to Secret Manager, platform operators can enable the Runtime Sensor add-on by using the gcloud CLI or the GKE API. The GKE control plane handles deploying the sensor components, managing the lifecycle of pods, and configuring the nodes.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Secure egress and proxy support</strong><span style=\"vertical-align: baseline;\">: For environments that restrict public internet access, the managed sensor supports standard HTTP and mTLS proxy configurations. Telemetry is routed back to Wiz without violating your egress firewall policies.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Fleet-wide governance with organization policy</strong><span style=\"vertical-align: baseline;\">: Platform security leads can enforce compliance across their entire organization using </span><a href=\"https://docs.cloud.google.com/organization-policy/create-custom-constraints\"><span style=\"text-decoration: underline; vertical-align: baseline;\">custom organization policy constraints</span></a><span style=\"vertical-align: baseline;\">. You can use a constraint to reject any attempts to create a cluster that doesn't enable the Runtime Sensor add-on, which can prevent malicious actors from spinning up rogue infrastructure to evade runtime detection.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Kernel-level observability with minimal overhead</strong><span style=\"vertical-align: baseline;\">: The Wiz Runtime Sensor continuously monitors system calls, running processes, network connections, and file access. It catches suspicious activity, including reverse shells, unauthorized privilege escalations, container escapes, and unsafe outbound connections while keeping CPU usage low even under heavy workload activity. <br /><br /></span><span style=\"vertical-align: baseline;\">The sensor uses a fixed memory limit on each node to ensure consistent performance as workload density changes. This is especially valuable for AI workloads and web services where application activity might fluctuate quickly.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Independent auto-updates</strong><span style=\"vertical-align: baseline;\">: Security threats and zero-day vulnerabilities don’t wait for scheduled infrastructure maintenance windows. The lifecycle of the Wiz sensor add-on for GKE is independent of your GKE cluster and node lifecycle. <br /><br /></span><span style=\"vertical-align: baseline;\">The sensor periodically rolls out updates of new sensor versions published by Wiz, to help ensure that your clusters always have the latest detection rules without requiring GKE version bumps, node pool recreations, or workload disruption.</span></li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">How it works: Deploying and enforcing the sensor</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Enabling the Wiz sensor add-on follows the same process that platform administrators are already familiar with on GKE. Using standard gcloud commands, you can activate runtime protection during cluster creation, turn it on for existing clusters, and enforce it across your fleet while keeping credentials securely managed in Secret Manager. </span></p>\n<p><span style=\"vertical-align: baseline;\">Check the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/security/install-wiz-sensor-addon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">setup documentation</span></a><span style=\"vertical-align: baseline;\"> for prerequisites, such as granting GKE access to Secret Manager.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Provisioning a cluster with the Wiz Sensor add-on</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To provision a new GKE cluster with the managed Wiz sensor enabled using credentials stored in Secret Manager:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud container clusters create production-ai-cluster \\\\\\r\\n    --zone=us-central1-a \\\\\\r\\n    --release-channel=regular \\\\\\r\\n    --workload-pool=${PROJECT_ID}.svc.id.goog \\\\\\r\\n    --enable-secret-sync \\\\\\r\\n    --enable-secret-sync-rotation \\\\\\r\\n    --addons=WizSensor=ENABLED \\\\\\r\\n    --wiz-sensor-registry-secret-uri=projects/${PROJECT_ID}/secrets/wiz-registry-secret/versions/latest \\\\\\r\\n    --wiz-sensor-api-key-secret-uri=projects/${PROJECT_ID}/secrets/wiz-api-key-secret/versions/latest&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dc81af450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To enable the sensor on an existing running cluster with Workload Identity Federation for GKE and Secret Manager secret sync enabled, run the following:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud container clusters update production-ai-cluster \\\\\\r\\n    --zone=us-central1-a \\\\\\r\\n    --update-addons=WizSensor=ENABLED \\\\\\r\\n    --wiz-sensor-registry-secret-uri=projects/${PROJECT_ID}/secrets/wiz-registry-secret/versions/latest \\\\\\r\\n    --wiz-sensor-api-key-secret-uri=projects/${PROJECT_ID}/secrets/wiz-api-key-secret/versions/latest&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dc3109790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Enforcing fleet-wide protection with organization policy</strong></h3>\n<p><span style=\"vertical-align: baseline;\">You can require all new GKE clusters across your organization to install the runtime sensor by deploying a </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/multi-cloud/docs/attached/generic/how-to/setup-custom-constraints\"><span style=\"text-decoration: underline; vertical-align: baseline;\">custom constraint</span></a><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;name: organizations/123456789012/customConstraints/custom.GKEWizSensorEnforced\\r\\nresource_types:\\r\\n  - container.googleapis.com/Cluster\\r\\nmethod_types:\\r\\n  - CREATE\\r\\n  - UPDATE\\r\\ncondition: resource.addonsConfig.wizSensorConfig.enabled == true\\r\\naction_type: ALLOW\\r\\ndisplay_name: Enforce Wiz Sensor on All GKE Clusters\\r\\ndescription: Mandates that all GKE clusters enable the managed Wiz Runtime Sensor backed by the corporate Secret Manager vault.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dc8557a90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Intelligent threat correlation for AI security</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The true power of this integration emerges when the managed sensor connects to the broader Wiz AI Application Protection Platform (AI-APP). By feeding GKE runtime telemetry into the Wiz Security Graph, you unlock a security toolkit that goes beyond static alerting, with:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Real-time risk assessment and threat verification</strong><span style=\"vertical-align: baseline;\">: By pairing background security scans with live activity monitoring, you get a clear view of real risks. The sensor checks whether vulnerable code is actually running in memory, so you can focus on active security threats and ignore inactive ones.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Real-time threat detection and response</strong><span style=\"vertical-align: baseline;\">: Identify suspicious activity like malware, unauthorized access attempts, and software vulnerabilities in real time. Security teams can set rules to automatically block or stop threats before they can spread.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Network activity and detailed security insights</strong><span style=\"vertical-align: baseline;\">: Track system activity, network connections, and data flows to uncover hidden risks and unauthorized software usage. If a threat is detected, the sensor automatically gathers diagnostic data to help teams quickly investigate what happened.</span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Together, these capabilities ensure that mission-critical applications and AI agents deployed on GKE are monitored for attacks and data exfiltration without compromising developer velocity.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Wiz Runtime Sensor add-on for GKE delivers a standard for container security: deep, kernel-level eBPF protection without operational complexity or deployment friction.</span></p>\n<p><span style=\"vertical-align: baseline;\">By combining GKE's managed platform automation with Wiz's comprehensive security intelligence, platform and security teams can innovate at cloud speed while maintaining strong runtime defense. Check out the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/security/install-wiz-sensor-addon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Sensor for GKE documentation</span></a><span style=\"vertical-align: baseline;\"> to learn more.</span></p></div>"
  "f729a15d92d04271ce46d3e18d459e9d":
    "id": "f729a15d92d04271ce46d3e18d459e9d"
    "title": "Four evaluation engineering lessons learned from building agent plugins"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/four-eval-engineering-lessons/"
    "published": "2026-10-17 01:00:00"
    "fetched": "2026-10-17 04:19:28"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The real challenge of building an agentic system isn't the construction, it's the measurement.</span><strong style=\"vertical-align: baseline;\"> </strong></p>\n<p><span style=\"vertical-align: baseline;\">Evaluation engineering is a critical foundation for building reliable AI systems. Setting up systematic, repeatable tests to measure your agent’s true behavior can be the difference between shipping a tool you can trust and one that silently breaks, fails to call APIs, or makes mistakes. </span></p>\n<p><span style=\"vertical-align: baseline;\">I’ve run evaluation engineering initiatives for years at Google and d</span><span style=\"vertical-align: baseline;\">eveloping the newly released</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/introducing-the-google-cloud-developer-plugin-for-ai-coding-agents?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Google Cloud Developer plugin</span></a><span style=\"vertical-align: baseline;\"> served as a live testbed to stress-test these key principles across real-world developer workflows.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here are four eval lessons we learned from building the new plugin that you can apply to your own builds.</span></p>\n<h3><span style=\"vertical-align: baseline;\">1. Grade the execution steps instead of the summary</span></h3>\n<p><span style=\"vertical-align: baseline;\">When we first evaluated agents, we set up an LLM-as-judge to inspect the agent’s final text reply and scored it against a checklist. However, we quickly realized it’s fundamentally flawed because the grader only sees what the agent wrote, not what it actually did. </span><span style=\"vertical-align: baseline;\">When we ran our initial 11-prompt evaluation suite for the Google Cloud Developer plugin, the automated grader marked it as failing three prompts. But when we opened the raw tool-call logs and read the transcripts, the plugin had actually passed all three. On a Cloud Run cleanup prompt, for instance, our rubric required checking command syntax before running anything. </span><span style=\"vertical-align: baseline;\">The agent ran </span><span style=\"vertical-align: baseline;\">gcloud help run services list</span><span style=\"vertical-align: baseline;\"> as its very first step. It did the work, but its final message was focused on warning the user about permanent data loss rather than reciting that it had checked the help docs.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Image 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Image_1_XmJ1pt2.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The grader penalized the agent for doing the right thing simply because it didn’t brag about it in the summary. If your rubric line says \"did it run X?\", a LLM judge is guessing unless you evaluate the actual tool-call trajectory.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Don't grade an agent on its closing pitch. Score the raw execution trajectory to verify what commands were actually executed, validated, and scoped.</span></p>\n<h3><span style=\"vertical-align: baseline;\">2. Design evals for asynchronous operations</span></h3>\n<p><span style=\"vertical-align: baseline;\">When you start reading tool-call trajectories, how you extract that telemetry matters just as much as what you're reading. Extracting agent telemetry into a flattened, sequential list of events obscures concurrent tool dispatch, which is one of the critical causes of behavioral failure. Modern agent harnesses often batch multiple tool invocations into a single assistant turn using an array of calls.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our evaluations, when an agent was asked to inspect an environment and look up documentation, the harness dispatched the skill-loading call and two documentation searches simultaneously within a single tool_calls payload. Because activating a skill is a multi-stage process, where the initial call returns a short launch stub and the subsequent turn injects the full instruction body, the instructions meant to govern the search arrived in the prompt context after the system had already executed the searches.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image 2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_2_CHyk3qC.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The system never gave the skill a dedicated turn to let its guidance influence the agent's actions. If telemetry pipelines strip out turn structures and merge calls into a flat timeline, engineers will waste days wondering why an agent disregarded unambiguous instructions that a developer embedded in a skill.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Preserve turn structure in telemetry extractors so you can identify when client-side parallel dispatch issues tool calls before injected guidance enters the context window. </span></p>\n<h3><span style=\"vertical-align: baseline;\">3. Test live runs and \"dry runs\" side-by-side</span></h3>\n<p><span style=\"vertical-align: baseline;\">You need to inspect real API calls to catch harness quirks, like parallel dispatch. But if you only test your agent in one environment condition, you're flying half-blind. From day one, you need to run two conditions side-by-side: a live run and a plan-only run. </span><span style=\"vertical-align: baseline;\">In the live condition, the agent has real, sandboxed credentials and actually executes commands. This is how you see if syntax works, parameters serialize cleanly, and the agent exercises restraint before doing something destructive. </span></p>\n<p><span style=\"vertical-align: baseline;\">Live runs frequently hit an unexpected permission error on step two and abort before you ever reach the behavior you’re trying to test. That's why you need the plan-only condition, where you strip credentials and tell the agent to explain what it would do without running anything. This strips out permission roadblocks and shows you the model’s pure reasoning and routing intent. Roughly half our most important findings came from the delta between the two.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image 3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_3_OixTmu5.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For example, on one of our onboarding prompts, a live run was blocked immediately on a project list call. The plan-only run sailed right through and produced an 8,000-character plan that completely ignored organization policies, admin approvals, and governance. The live run masked a major cognitive flaw that the plan-only run exposed in seconds.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Run live and plan-only evaluations side by side. Live runs test actual execution and safety restraint; plan-only runs expose the model's raw reasoning and routing without getting tripped up by permission errors.</span></p>\n<h3><span style=\"vertical-align: baseline;\">4. Use “golden sets” as durable baselines</span></h3>\n<p><span style=\"vertical-align: baseline;\">Frontier model architectures change every few months, agent harnesses improve, and plugin manifest standards will inevitably evolve. When building the Google Cloud Developer plugin, we treated evaluations as continuous integration testing for these non-deterministic environments. That means we stress-tested the composite stack, including the harness, the live model, and the tools running together on realistic tasks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Instead of guessing from the final text output, this approach captures the whole trajectory: what the agent thought, what commands it actually ran, and whether it solved the problem without breaking anything. Then you score that run against golden sets curated by real human experts who know what the ideal path looks like.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Build golden sets based on what the entire system should actually do in the wild, including your harness, model, and plugins. Models change, but those baseline runs are your safety net.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Reminder: Use evaluation suites over “one-shot” demos</strong></p>\n<p><span style=\"vertical-align: baseline;\">A common mistake I see among engineers is what I like to call the one-shot demo. This is when someone feeds a prompt into a LLM, watches it build a complete 3D game or solves a Rubik’s cube in a single pass and calls it an eval. But in reality, this is just a vanity metric. </span></p>\n<p><span style=\"vertical-align: baseline;\">To do quality work with AI, I truly believe that you need evaluation suites. Without evaluations, teams are like literally running into a dark cave blind. Engineering an enterprise-grade agent means testing the system's ability to handle multi-step interactions, manage permissions, and avoid destructive outcomes like accidentally deleting a project because you asked it to \"find opportunities to save costs.\"</span></p>\n<h3><span style=\"vertical-align: baseline;\">Where to go from here</span></h3>\n<p><span style=\"vertical-align: baseline;\">Building an agent plugin or MCP server is the beginning. Shipping something you can actually trust with real cloud infrastructure requires significantly more work in evaluations to ensure it’s doing what you expect it to do. At the end of the day, the only thing that outlasts model churn is a stress-tested eval suite. </span><span style=\"vertical-align: baseline;\">Check out the Google Cloud Developer plugin </span><a href=\"https://g.dev/cloud/dev-setup\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> or explore this </span><a href=\"https://g.dev/cloud/agent-plugins-codelab-agy\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">codelab</span></a><span style=\"vertical-align: baseline;\"> to get started with the plugin in Antigravity.</span><span style=\"vertical-align: baseline;\"> </span></p></div>"
  "4e912752acc61254348749e2ff0d46c8":
    "id": "4e912752acc61254348749e2ff0d46c8"
    "title": "The SAVE method: Learn the fundamentals to engineer trustworthy generative media"
    "link": "https://cloud.google.com/blog/topics/consulting/fundamentals-to-engineer-trustworthy-gen-media/"
    "published": "2026-10-17 01:00:00"
    "fetched": "2026-10-17 04:19:28"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Cloud Consulting works with organizations every day to build generative media that’s trustworthy, brand-aligned, and stands out. Instead of relying on clever or complicated prompting, we’ve identified four recurring basics to generate consistent results, what we call the “SAVE” method. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this blog, we’ll share more about this method and how you can apply it to your own work. </span></p>\n<h3><span style=\"vertical-align: baseline;\">S</span><span style=\"vertical-align: baseline;\"> - Separate the researcher from the storyteller</span></h3>\n<p><span style=\"vertical-align: baseline;\">If in a single prompt, if you’re requesting a technical summary, key product features, and an engaging video script all at once, you’re setting the model up to fail. Creative tasks require fluid language and pacing, while factual output requires constraint. Forcing both jobs into one context window will likely end with the model fabricating details to make the narrative flow better.</span></p>\n<p><span style=\"vertical-align: baseline;\">Instead of one prompt, consider splitting the work into specialized steps, like a researcher and a storyteller. Here’s how they might work together: </span></p>\n<p><strong style=\"vertical-align: baseline;\">The researcher</strong><span style=\"vertical-align: baseline;\"> reads the source documents, extracts core claims, aligns with approved messaging, and outputs a structured brief (like a clean checklist or bulleted factsheet).</span></p>\n<p><strong style=\"vertical-align: baseline;\">The storyteller</strong><span style=\"vertical-align: baseline;\"> then takes that verified brief and focuses purely on style, pacing, visual metaphors, and tone.</span></p>\n<p><span style=\"vertical-align: baseline;\">By decoupling research from your creative generation, your agent is never tasked with deciding what’s true, but how to make the truth more engaging and effective.</span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">A</span><span style=\"vertical-align: baseline;\"> - Approve verified facts only</span></h3>\n<p><span style=\"vertical-align: baseline;\">If you hand a creative generative model documents that are unedited, it might mix up speculative ideas with business facts. The media generator should never have direct access to raw source files. It should only use verified, structured inputs. To avoid this: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lock down core claims</strong><span style=\"vertical-align: baseline;\">: Approved statements, product names, and concrete business outcomes should be fixed upstream rather than left for the model to extract on the spot.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Champion contextual packaging</strong><span style=\"vertical-align: baseline;\">: Pass each fact along with its explicit constraints included. Examples may include things like \"use this point in the opening statement\" or \"do not extrapolate beyond this approved bullet point.\"</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">This way, you ground the generation in verified facts and reduce the risk of unsupported claims entering the creative generation stage.</span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">V</span><span style=\"vertical-align: baseline;\"> - Verify before you render</span></h3>\n<p><span style=\"vertical-align: baseline;\">Discovering a factual error in an animated video or rendered asset after the final export wastes both compute budget and turnaround time. The most effective human-in-the-loop checkpoint is right before generation begins.</span></p>\n<p><span style=\"vertical-align: baseline;\">To fix this, review the script and storyboard. Have product leads or legal teams sign off on the extracted facts, narrative outline, and voiceover text while it’s still simple, editable text. This way, you can catch errors early. Swapping an outdated feature name or fixing a typo takes two seconds in a text file. </span></p>\n<p><span style=\"vertical-align: baseline;\">Treat text as your testing ground. Once approved, generating the final media becomes a low-risk, predictable step.</span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">E</span><span style=\"vertical-align: baseline;\"> - Engineer guardrails into the system</span></h3>\n<p><span style=\"vertical-align: baseline;\">Telling a model to “keep voiceover word count short, never reference unapproved topics, and format links correctly\" in a prompt works until it doesn’t, and an edge case slips through. Relying on prompt obedience for brand safety is a gamble and can damage trust.</span></p>\n<p><span style=\"vertical-align: baseline;\">Where requirements can be checked deterministically, enforce them in the system rather than relying only on prompt instructions. For example, try these three actions first: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Programmatic boundary checks</strong><span style=\"vertical-align: baseline;\">: Use standard code to validate word counts, verify that URLs are live and authorized, check colors against your brand palette, and format text strings.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Independent safety gates</strong><span style=\"vertical-align: baseline;\">: Run automated filters outside the generation pipeline to catch policy violations or out-of-bounds claims before an asset is ever delivered.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model modularity</strong><span style=\"vertical-align: baseline;\">: When your safety and brand rules are set, you don't have to rewrite your entire governance playbook every time a newer, faster generative model is launched. You simply plug the new model into your existing, verified pipeline.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Generating studio-quality media shouldn't mean constantly worrying about what the model might fabricate next. The SAVE method shifts the burden of accuracy away from prompt phrasing and into the architecture where it belongs. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Apply the SAVE method yourself</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://discuss.google.dev/t/designing-composable-generative-media-workflows-on-google-cloud-a-blueprint-for-document-to-video-generation-deterministic-controls-and-media-processing/393767\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Check out our generative media deep dive</span></a><span style=\"vertical-align: baseline;\"> and learn how to architect trust across your generative media using Google Cloud tools and technologies.  </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/ai/generative-media\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Explore Google Cloud’s generative media suite</span></a><span style=\"vertical-align: baseline;\">, featuring cutting-edge models for studio-grade image, video, and sound generation.</span></p>\n</li>\n</ul></div>"
