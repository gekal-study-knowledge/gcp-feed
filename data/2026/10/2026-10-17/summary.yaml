"overview": |
  この日は 1 件で、GKE のゼロへのスケーリングでした。Kubernetes はリソース管理に革命をもたらしましたが、バッチプロセッサ、イベントドリブンのワーカー、開発環境のように散発的に実行されるワークロードは、処理を待っている間もコンピュートリソースを消費して費用を押し上げます。Google Kubernetes Engine (GKE) 1.37 では、ゼロへのスケールダウンとゼロからのスケールアップをネイティブに実現することでこの問題に取り組みます。ワークロードを完全にゼロレプリカまで落としてリソースの消費を止め、需要が戻ったときには GKE のキャパシティバッファで素早く再起動できるため、インフラの無駄を減らせます。単に費用を削るだけでなく、常時稼働のインフラの費用をワークロードの準備状況から切り離すことにもつながります。これまでゼロへのスケーリングの定番は Kubernetes Event-Driven Autoscaling (KEDA) でしたが、KEDA は強力な一方で ScaledObject の CRD とオペレーターの管理が必要で環境が複雑になり、大規模なフリートでは YAML が 1 万行を超えることもあり、ポーリング間隔とホップ数のためにコールドスタートの遅延も増えます。ゼロへのスケーリングを GKE のコントロールプレーンへ直接組み込むことで、アドオンのオペレーターも数千行の構成も不要になり、ロジックがサイドカーの管理からワークロードのネイティブな属性へ移ります。鍵となるのは AutoscalingMetric を使う HPA で、Google Cloud Managed Service for Prometheus からの外部シグナルを直接読めるマネージドな指標シグナルのパイプラインです。
