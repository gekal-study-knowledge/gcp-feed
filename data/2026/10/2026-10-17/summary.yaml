"overview": |
  この日は 8 件 (重複を除くと 6 件) で、オープンウェイトモデル Beam の初日対応、エージェントの設計と評価、GKE のランタイム脅威検出とゼロへのスケーリングが中心でした。まず GKE のゼロへのスケーリングです。Kubernetes はリソース管理に革命をもたらしましたが、バッチプロセッサ、イベントドリブンのワーカー、開発環境のように散発的に実行されるワークロードは、処理を待っている間もコンピュートリソースを消費して費用を押し上げます。Google Kubernetes Engine (GKE) 1.37 では、ゼロへのスケールダウンとゼロからのスケールアップをネイティブに実現することでこの問題に取り組みます。ワークロードを完全にゼロレプリカまで落としてリソースの消費を止め、需要が戻ったときには GKE のキャパシティバッファで素早く再起動できるため、インフラの無駄を減らせます。単に費用を削るだけでなく、常時稼働のインフラの費用をワークロードの準備状況から切り離すことにもつながります。これまでゼロへのスケーリングの定番は Kubernetes Event-Driven Autoscaling (KEDA) でしたが、KEDA は強力な一方で ScaledObject の CRD とオペレーターの管理が必要で環境が複雑になり、大規模なフリートでは YAML が 1 万行を超えることもあり、ポーリング間隔とホップ数のためにコールドスタートの遅延も増えます。ゼロへのスケーリングを GKE のコントロールプレーンへ直接組み込むことで、アドオンのオペレーターも数千行の構成も不要になり、ロジックがサイドカーの管理からワークロードのネイティブな属性へ移ります。鍵となるのは AutoscalingMetric を使う HPA で、Google Cloud Managed Service for Prometheus からの外部シグナルを直接読めるマネージドな指標シグナルのパイプラインです。モデルでは、Reflection が初のオープンウェイトモデル Beam を公開し、Google Cloud が初日から対応して、Google Cloud AI Hypercomputer と NVIDIA AI Infrastructure 上で Beam を提供するためのすぐ実行できるデプロイレシピを用意したことが発表されました。Beam は Apache 2.0 の寛容なライセンスで公開され、提供開始時点で BF16、FP8、NVFP4 のチェックポイントが揃っています。500B パラメータークラスでの推論効率の新しい基準として、同等のオープンモデルに対して 3〜4 倍の推論計算効率で複雑な推論とコーディングの問題を解くとされています。Google Cloud は Reflection と協力して llm-d (vLLM と併用) と NVIDIA Dynamo で配信スタックを最適化し、5 倍の性能向上を示しています。エージェント関連では 2 本が公開されました。1 本はバイオテクノロジー向けの設計パターンで、現在の本番システムの AI エージェントはプロンプトを解釈して API を呼び、レコードを取得して制御を返す軽量なディスパッチャーとして動くことが多い一方、タンパク質の折りたたみ、5 万化合物のリガンドライブラリのスクリーニング、構造活性相関 (SAR) の評価は数分から数時間に及ぶステートフルで GPU に縛られたシミュレーションであり、汎用の LLM エンドポイントに創薬ワークフローを調整させるとタイムアウト、原子座標によるコンテキストウィンドウの溢れ、独自の化学的知財が外部ネットワークへ露出するリスクが生じると指摘しています。もう 1 本は Google Cloud Developer プラグインの開発を題材にした評価エンジニアリングの 4 つの教訓で、エージェント型システムの本当の難所は構築ではなく測定であるという立場から、最終的な応答文ではなく実行ステップを採点する、といった原則を示しています。セキュリティでは、GKE 向けの Wiz Runtime Sensor アドオンがプレビューで公開されました。停止状態のアーティファクトに対する通常の脆弱性スキャンでは基本的な設定の問題しか捉えられず、進行中の攻撃を検知するにはリアルタイムのランタイム保護が必要だという文脈で、Wiz の eBPF によるランタイム脅威検出を Standard と Autopilot の両方の GKE クラスターに、低手間のデプロイ、ライフサイクルの自動管理、エンタープライズの資格情報管理、フリート全体のガバナンス付きで組み込みます。最後に、生成メディアを信頼できる形で作るための基本を整理した「SAVE メソッド」が紹介されました。Google Cloud Consulting が繰り返し有効だと見てきた 4 つの基本で、たとえば 1 つのプロンプトに技術的な要約と製品の特徴と魅力的な動画脚本をまとめて求めるとモデルが失敗しやすい (創造的な作業には流れのある言葉づかいが要り、事実の出力には制約が要る) ため、研究者役と語り手役を分けて段階に切り分けることを勧めています。
