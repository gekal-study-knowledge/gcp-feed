"overview": |
  この日は 2 件で、BigQuery の ObjectRef が一般提供になったことと、GKE Inference Gateway によるバッチ推論のスケールの事例でした。ObjectRef とマルチモーダルデータ分析が BigQuery で一般提供となりました。画像・動画・音声・ドキュメントといった非構造化データを活用するには、これまで構造化データと非構造化データ、分析と AI / ML で別々のパイプラインを管理する必要がありました。ファイルを Cloud Storage に置いたままでも推論には外部の機械学習ワークロードをオーケストレーションしなければならず、その構造化された推論結果をデータウェアハウスに貼り合わせて分析する作業が脆く複雑で、運用の負荷とデータの不整合を生んでいました。ObjectRef は Cloud Storage と分析のギャップを BigQuery がネイティブに埋めるもので、SQL だけで対話的な分析に使えるマルチモーダルなデータプラットフォームを構築でき、BigQuery をマルチモーダルでエージェント型のデータプラットフォームとして位置づける位置づけです。事例としては、インド理科大学院 (IISc) からスピンアウトし IndiaAI Mission に選ばれた AI スタートアップの ZenteiQ が紹介されました。物理法則・支配方程式・数値ソルバーを理解するモデルを事前学習するため、複数のモデルファミリーにまたがる大規模なバッチ合成データ生成パイプラインを構築して検証済みデータセットを学習に流しており、Google Kubernetes Engine (GKE) と GKE Inference Gateway が推論のルーティング層を担うことで、集計した推論スループットを 4.07 倍に、アクセラレーター 1,000 基あたりの 1 日の生成量を 14.7 億トークンから 59.7 億トークンへ伸ばしました。あわせて、Google Cloud の Model Garden で OpenAI モデルの提供が始まったことが発表されました。コスト・能力・パフォーマンスの最適なバランスを取るため、顧客が選んだモデルやインフラを横断してエージェント型のワークロードを柔軟に実行できるようにする、という開かれた柔軟な基盤の考え方を広げるものです。これにより Google Cloud は、統合されたエンタープライズ AI プラットフォーム上で 200 を超えるファーストパーティ・サードパーティ・オープンモデルに加えて、3 つの主要なクローズドソース LLM へのアクセスを提供するハイパースケールのクラウドプロバイダーになります。すべてのタスクを単一のモデルに任せるのではなく、ワークロードごとに適したモデルを組み合わせることが現代のエンタープライズ AI では不可欠だという位置づけで、コーディングやコンピュータ操作に向けた GPT-6 Astra などが Model Garden に加わります。
