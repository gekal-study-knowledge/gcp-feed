"overview": |
  この日は 10 件で、Agent Compute Engine の発表、BigQuery の ObjectRef と予測・コスト管理の更新、そして europe-west2 の障害の続報が中心でした。ObjectRef とマルチモーダルデータ分析が BigQuery で一般提供となりました。画像・動画・音声・ドキュメントといった非構造化データを活用するには、これまで構造化データと非構造化データ、分析と AI / ML で別々のパイプラインを管理する必要がありました。ファイルを Cloud Storage に置いたままでも推論には外部の機械学習ワークロードをオーケストレーションしなければならず、その構造化された推論結果をデータウェアハウスに貼り合わせて分析する作業が脆く複雑で、運用の負荷とデータの不整合を生んでいました。ObjectRef は Cloud Storage と分析のギャップを BigQuery がネイティブに埋めるもので、SQL だけで対話的な分析に使えるマルチモーダルなデータプラットフォームを構築でき、BigQuery をマルチモーダルでエージェント型のデータプラットフォームとして位置づける位置づけです。事例としては、インド理科大学院 (IISc) からスピンアウトし IndiaAI Mission に選ばれた AI スタートアップの ZenteiQ が紹介されました。物理法則・支配方程式・数値ソルバーを理解するモデルを事前学習するため、複数のモデルファミリーにまたがる大規模なバッチ合成データ生成パイプラインを構築して検証済みデータセットを学習に流しており、Google Kubernetes Engine (GKE) と GKE Inference Gateway が推論のルーティング層を担うことで、集計した推論スループットを 4.07 倍に、アクセラレーター 1,000 基あたりの 1 日の生成量を 14.7 億トークンから 59.7 億トークンへ伸ばしました。あわせて、Google Cloud の Model Garden で OpenAI モデルの提供が始まったことが発表されました。コスト・能力・パフォーマンスの最適なバランスを取るため、顧客が選んだモデルやインフラを横断してエージェント型のワークロードを柔軟に実行できるようにする、という開かれた柔軟な基盤の考え方を広げるものです。これにより Google Cloud は、統合されたエンタープライズ AI プラットフォーム上で 200 を超えるファーストパーティ・サードパーティ・オープンモデルに加えて、3 つの主要なクローズドソース LLM へのアクセスを提供するハイパースケールのクラウドプロバイダーになります。すべてのタスクを単一のモデルに任せるのではなく、ワークロードごとに適したモデルを組み合わせることが現代のエンタープライズ AI では不可欠だという位置づけで、コーディングやコンピュータ操作に向けた GPT-6 Astra などが Model Garden に加わります。エージェント基盤では、AGNTCon + MCPCon で Agent Compute Engine が発表されました。すでに業務タスク向けのエージェントとしての Gemini を支えている専用のコンピュートサービスで、ハードウェアで分離されたランタイムのサンドボックスによるセキュリティを提供し、今後数か月のうちにプレビューで利用できるようになる予定です。あわせて Gemini for business のエージェントガバナンスの機能が、エージェントがどこで動いていても使えるように拡張されます。Gemini を惑星規模に広げる過程で、自律エージェントを安全に動かすことは本質的にインフラの課題であり、単発のプロンプトから対話的なエージェントへの移行には実行と制御の新しい枠組みが必要だったという経緯が背景に挙げられています。技術的な詳細を扱う記事では、web スケールのトラフィックに対して Borg 上の倉庫規模コンピューティングと Linux コンテナを生み出し、深層学習のモデルが計算と電力の要求を超えたときに TPU を作り、クラウドのセキュリティがハードウェアに根ざした保証を求めたときに I/O 仮想化・ストレージ・暗号学的な信頼をホスト CPU から切り離す Titanium を作った、という流れの次の転換点としてエージェント型 AI が位置づけられています。データ分析では、BigQuery に TimesFM 3.0 のプレビューが登場しました。Google Research が開発した 3 億 3,000 万パラメータの基盤モデルで、BigQuery の SQL から直接、多変量の時系列予測ができます。TimesFM 2.5 までは単変量に限られ、1 本の系列の履歴だけから将来を予測していましたが、現実の予測は天気・プロモーション・休日といった外部要因と組み合わさる多変量が大半だという前提に立ったものです。GIFT-Eval・FEV-Bench・TIME の 3 つの公開リーダーボードすべてで 1 位を獲得し、AI.FORECAST の単変量予測と AI.DETECT_ANOMALIES の異常検出についてはドロップインの更新としても使えるため、model に TimesFM 3.0 を指定するだけで精度の向上を得られます。あわせて BigQuery の生成 AI 関数のトークンベースの費用管理が一般提供となりました。AI.GENERATE・AI.IF・AI.CLASSIFY・AI.SCORE などは LLM を SQL に組み込めるぶんトークン単位で課金されるため、IAM の割り当てシステムで管理する 1 日あたりの割り当て 4 種類 (AI 入力トークン、ユーザーごとの AI 入力トークン、AI 出力トークン、ユーザーごとの AI 出力トークン) をプロジェクトレベルとユーザーレベルで設定し、予算のガードレールを引けます。割り当てはグローバルで、使用量は全リージョンで合計されます。セキュリティでは、Cloud CISO の視点としてポスト量子暗号 (PQC) への Google のアプローチの最新情報と、CISO や政策立案者が組織の PQC 準備を進めるのに役立つ Gemini Notebook の新しいノートブックが紹介されました。障害情報では、10 月 19 日から 20 日にかけての europe-west2 (ロンドン) リージョンの障害について続報が出ています。europe-west2-b ゾーンでサービスが利用できず、リージョン内の一部サービスでエラー率の上昇と断続的なネットワークの問題が起きたもので、ほとんどの顧客では緩和済みです。リリースノートでは、マネージドインスタンスグループ (MIG) がインスタンスをゾーンとマシンタイプにどう分散しているかを、コンソールの MIG のモニタリングタブから直接確認できるようになりました。
