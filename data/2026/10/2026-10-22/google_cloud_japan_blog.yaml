    "title": "Google Cloud がモデルの選択肢と柔軟性を拡充、OpenAI モデルを提供開始"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/google-cloud-brings-openai-models-to-customers/"
    "published": "2026-10-22 10:00:00"
    "fetched": "2026-10-22 10:14:03"
    "summary": "<div class=\"block-paragraph\"><p>※ この投稿は米国時間 2026 年 10 月 22 日に Google Cloud Blog に<a href=\"https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-brings-openai-models-to-customers?hl=en\">投稿</a>されたものの抄訳です。</p><p>Google Cloud は、選択肢の豊富さ、エンタープライズ レベルのガバナンス、そして業界トップクラスのコスト パフォーマンスで高く評価されてきました。このオープンで柔軟な基盤において重要となるのが、コスト、能力、パフォーマンスの最適なバランスを実現するために、お客様が選択したモデルやインフラストラクチャを横断して、エージェントティックなワークロードを柔軟に実行できるようにすることです。本日、 Google はこの基盤を拡張するために、Google Cloud のモデル ガーデンにおいて OpenAI モデルの提供を開始したことを発表しました。</p><p>Google Cloud は、統合されたエンタープライズ AI プラットフォーム上で、200 以上のファーストパーティ、サードパーティ、およびオープンモデルに加え、3 つの主要クローズド ソース LLM へのアクセスを提供するハイパースケール クラウド プロバイダーとなります。</p><h3><b>あらゆるワークロードに最適なモデルを</b></h3><p>現代のエンタープライズ AI において、すべてのタスクを単一のモデルに依存するのではなく、それぞれのワークロードに適したモデルを組み合わせることが不可欠です。OpenAI の最新モデルをモデル ガーデンに組み込むことで、エンタープライズにおけるあらゆるワークロードに対応する幅広い選択肢を提供します。OpenAI モデルについて：</p><ul><li><b>GPT-6 Astra:</b> コーディング、コンピュータの操作、専門的なタスク、および科学研究にわたる、高度な要求を伴う業務向けに設計</li><li><b>GPT-6.1 Sol:</b> エージェンティック コーディング、コンピュータ操作、専門的業務において、より低いコストで Astra に近いレベルの知能を実現</li><li><b>GPT-6 Luna:</b> 大規模な日常業務に最適な高速かつ低コストモデル</li></ul><p>お客様はこのプラットフォームを活用することで、アーキテクチャの制約や個別のベンダー契約に縛られることなく、パフォーマンス、レイテンシ、費用対効果に応じた最適なモデルを、あらゆるユースケースに合わせて動的に選択し、切り替えることができます。開発者は、 モデル ガーデン上の数百もの選択肢を活用して自由に開発を進められます。また、OpenAI モデルは Google Cloud Marketplace を通じて直接取引されるため、すべての利用実績が単一の Google Cloud の請求書にまとまり、既存のクラウド コミットメントの消化に充てられるほか、モデル プロバイダーを横断した<a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud?hl=ja\"> Flexible Savings Plans（FSP）</a>の対象としてもカウントされます。</p><h3><b>組み込みのデータ ガバナンスとエンタープライズ セキュリティ</b></h3><p>生成 AI の規模を拡大するにあたり、コンプライアンスやセキュリティを犠牲にする必要はありません。<a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026\">Gemini プラットフォーム</a>はエンタープライズ ガバナンスを念頭に構築されており、現在、世界をリードする多くの組織から信頼を得ています。サードパーティや OpenAI のワークロードを実行する際にも、厳格なエンタープライズ基準を確実に満たすよう徹底しています。</p><ul><li><b>厳格なデータ境界:</b> お客様のプロンプト、コンテキスト、出力結果は、指定されたデータ境界内に完全に保持され、基盤モデルのトレーニングに使用されることは決してありません。また、データを保持しないゼロ リテンション オプションも近日中に選択可能になる予定です。</li><li><b>分離されたアクセス境界:</b> OpenAI モデルは、 近日中に Confidential Compute 上に構築された専用の Google Cloud インフラストラクチャ上で動作するようになる予定です。すべてのクエリは堅牢化された独立ゲートウェイを経由してルーティングされるため、データ転送は Google Cloud の安全な環境内のみに留まり、サードパーティのモデル プロバイダーがお客様のクラウド環境に不正アクセスすることはありません。</li><li><b>統合された監査とアイデンティティ:</b> エージェントおよびモデルとのすべてのやり取りは認証済みのアイデンティティの下で動作し、IT 管理者に対してエンドツーエンドの可視性、 VPC Service Controls による保護、およびエンタープライズ環境全体にわたる統合された監査ログを提供します。</li></ul><h3><b>今すぐはじめるには</b></h3><p>Google Cloud のモデル ガーデンでは、一部のエンタープライズ顧客を対象に、OpenAI の GPT-6 Astra、GPT-6.1 Sol、GPT-6 Luna モデルのプライベート プレビューの提供を開始しており、今後さらに提供範囲を拡大する予定です。本日より、お客様は Google の API を通じてこれらのモデルを活用した構築を行えるほか、ローカルの Codex CLI やデスクトップ ワークフローを Gemini プラットフォームに直接接続して推論を実行できます。ご関心のある方は、<a href=\"https://cloud.google.com/resources/interest/openai-models\">こちらのフォーム</a>（英語）よりお申し込みください。</p><p>さらに近日中に、OpenAI モデルが、Google Cloud の Gemini for business および Google Antigravity に登場します。これにより、エンタープライズのお客様や開発者の皆様にモデルの選択肢、柔軟性、そして各タスクに最適なモデルを提供します。</p><p></p><p><i>-</i><b><i>Michael Gerstenhaber</i></b><i>, VP, Product Management, Gemini, Google Cloud</i></p></div>"
