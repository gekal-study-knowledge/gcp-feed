    "summary": "<h2 class=\"release-note-product-title\">Compute Engine</h2>\n<h3>Feature</h3>\n<p><strong>Generally available</strong>: To prevent data loss or corruption when you stop or\ndelete a Compute Engine instance, you can enable graceful shutdown. This\nsetting gives the guest OS up to six hours to finish running tasks. For more\ninformation, see\n<a href=\"https://docs.cloud.google.com/compute/docs/instances/graceful-shutdown-overview\">About graceful shutdown</a>.</p>\n<h2 class=\"release-note-product-title\">Dialogflow</h2>\n<h3>Feature</h3>\n<p><strong>Dialogflow CX</strong>: You can set the <code>telephony_disable_voice_processing</code> session parameter to <code>true</code> to turn off speech recognition and accept only DTMF input for the rest of the session. This helps in noisy environments, where speech recognition can transcribe background noise as end-user input. See <a href=\"https://docs.cloud.google.com/dialogflow/cx/docs/concept/parameter#session-disable-voice\">Turn off speech recognition for telephony</a>.</p>\n<h2 class=\"release-note-product-title\">Google Cloud Armor</h2>\n<h3>Security</h3>\n<p>Security fixes and enhancements to Cloud Armor preconfigured WAF <code>v33-stable</code>\nrulesets. For more information, see <a href=\"https://docs.cloud.google.com/armor/docs/rule-tuning\">Tuning Google Cloud Armor WAF\nrules</a>.</p>\n<p>The following rulesets have been updated:</p>\n<ul>\n<li><code>sqli-v33-stable</code></li>\n<li><code>xss-v33-stable</code></li>\n<li><code>lfi-v33-stable</code></li>\n<li><code>rfi-v33-stable</code></li>\n<li><code>rce-v33-stable</code></li>\n<li><code>methodenforcement-v33-stable</code></li>\n<li><code>scannerdetection-v33-stable</code></li>\n<li><code>protocolattack-v33-stable</code></li>\n<li><code>php-v33-stable</code></li>\n<li><code>sessionfixation-v33-stable</code></li>\n<li><code>java-v33-stable</code></li>\n<li><code>nodejs-v33-stable</code></li>\n</ul>\n<h3>Security</h3>\n<p>Security fixes and enhancements to Cloud Armor preconfigured WAF <code>stable</code>\nrulesets for v3.0. For more information, see <a href=\"https://docs.cloud.google.com/armor/docs/rule-tuning\">Tuning Google Cloud Armor WAF\nrules</a>.</p>\n<p>The following rulesets have been updated:</p>\n<ul>\n<li><code>sqli-stable</code></li>\n<li><code>xss-stable</code></li>\n<li><code>lfi-stable</code></li>\n<li><code>rfi-stable</code></li>\n<li><code>rce-stable</code></li>\n<li><code>methodenforcement-stable</code></li>\n<li><code>scannerdetection-stable</code></li>\n<li><code>protocolattack-stable</code></li>\n<li><code>php-stable</code></li>\n<li><code>sessionfixation-stable</code></li>\n</ul>\n<h2 class=\"release-note-product-title\">Security Command Center</h2>\n<h3>Feature</h3>\n<p>You can view issues created by Correlated Threats and security\ngraph rules at the folder or project level. On the <strong>Issues</strong> page, you can\nfilter all issues by service type, project number, and folder ID.\nFor more information, see <a href=\"https://docs.cloud.google.com/security-command-center/docs/issues-overview\">Issues overview</a>.</p>\n<p>This feature is in <a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>.</p>"
