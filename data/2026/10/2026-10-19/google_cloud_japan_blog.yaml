    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 8 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/financial-services/ultra-low-latency-solution-with-u4-enables-high-velocity-trading?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">資本市場における運用の成功は、安定したパフォーマンスと低レイテンシにかかっています。パケットのタイミングがわずかに変動するだけで、キューの優先順位や取引の実行順序が左右されるためです。同時に、取引所と市場参加者の双方が、従来のオンプレミス データセンターにおいて厳しさを増す制約に直面しています。その内容は、電力や物理的なラックスペースの制限から、ハードウェア調達サイクルの長期化まで多岐にわたります。グローバルな資本市場では、物理的なコロケーションが持つ「スピードと、動作の確実性」に、クラウドの「動的なスケーラビリティと自動化」を融合させたソリューションがますます求められています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Next ‘26 では、</span><a href=\"https://cloud.google.com/blog/products/networking/whats-new-in-cloud-networking-at-next26#:~:text=Ultra%20Low%20Latency%20Solution%20for%20financial%20exchanges\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ultra Low Latency（ULL）Solution</span></a><span style=\"vertical-align: baseline;\"> の一般提供を発表しました。このソリューションは、クラウドで実行される高頻度取引ワークフローにて、超低レイテンシのネットワークと優れたアジリティを実現します。ULL Solution には、新しい </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/u4-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">U4 マシン ファミリー</span></a><span style=\"vertical-align: baseline;\">も含まれており、こちらも一般提供が開始されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ULL Solution は、次の 3 つのインフラストラクチャ基盤で構成されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハードウェア レベルのネットワーキング:</strong><span style=\"vertical-align: baseline;\"> スケーラブルなハードウェア ベースのマルチキャスト データ配信によって、信頼性の高いマーケット データ フィードを実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高度なネットワーキング オブザーバビリティ:</strong><span style=\"vertical-align: baseline;\"> ハードウェア レベルのタイミング精度で動的なネットワーク トラフィックをキャプチャします。プライマリ トラフィックのパフォーマンスに影響を与えることなく、確実な監査、マーケット リプレイ、そして厳密な取引検証を可能にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">確実な動作を実現するハイ パフォーマンス コンピューティング:</strong><span style=\"vertical-align: baseline;\"> 極めて低いレイテンシが要求される実行レイヤを、常に予測可能かつ一貫した時間で処理します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ULL Solution のコンピューティング、ストレージ、ネットワーキング、オブザーバビリティを組み合わせることで、金融取引所や市場参加者は、以下のような数多くの技術的メリットを享受できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ベアメタル パフォーマンス:</strong><span style=\"vertical-align: baseline;\"> 専用のベアメタル コンピューティングにより、物理ホストリソースに直接アクセスできるため、ジッターを最小限に抑え、マーケット データ フィードや注文ルーティングにおいて、ブレのない低レイテンシでの実行を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高パフォーマンスのストレージ オプション:</strong><span style=\"vertical-align: baseline;\"> ローカル Titanium SSD がホスト上でリアルタイムのトランザクションとティック ロギングを処理し、スケーラブルな </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> が永続的なマーケット データのアーカイブと分析を補完します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">物理的なトラフィックの分離</strong><span style=\"vertical-align: baseline;\">: ULL トレーディング ファブリックの冗長 A/B マルチキャスト マーケット フィードには、2 つの独立した専用 </span><a href=\"https://cloud.google.com/titanium?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium アダプター</span></a><span style=\"vertical-align: baseline;\">を介してアクセスします。一方、3 つ目の独立した Titanium アダプターは、テレメトリーと管理をオフロードし、Google Cloud サービスへのアクセスを提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハードウェア アクセラレーションによるマルチキャスト配信: </strong><span style=\"vertical-align: baseline;\">ULL ネットワーク アーキテクチャは、ハードウェア レベルのマルチキャスト フィード取り込みをサポートしています。これにより、市場参加者は従来のハイパーバイザー レベルの仮想スイッチをバイパスし、高スループットのマーケット データを低レイテンシの取引アプリケーションに直接ストリーミングできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パケット処理の高速化:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/use-onload\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenOnload</span></a><span style=\"vertical-align: baseline;\"> と </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/use-dpdk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DPDK</span></a><span style=\"vertical-align: baseline;\"> のサポートにより、アプリケーション コードの変更を最小限に抑えながら、Linux ユーザー空間ネットワーキングによる予測可能なユニキャストおよびマルチキャスト パケット処理を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高精度なタイミングと UTC 同期: </strong><span style=\"vertical-align: baseline;\">Google Cloud の </span><a href=\"https://cloud.google.com/blog/products/networking/understanding-the-firefly-clock-synchronization-protocol\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Firefly</span></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">クロック同期システムとの統合により、</span><a href=\"https://cloud.google.com/blog/ja/products/networking/understanding-the-firefly-clock-synchronization-protocol?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">10 ナノ秒未満のネットワーク レベルのタイムスタンプ</span></a><span style=\"vertical-align: baseline;\">を常に実現し、金融取引所の規制要件である「100 マイクロ秒未満」を大きく上回る精度での UTC 同期を可能にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">組み込みのテレメトリー</strong><span style=\"vertical-align: baseline;\">: 24 時間 365 日の低レイテンシ パケット キャプチャと、規制遵守やリアルタイム解析に向けたシームレスなアウトオブバンド パケット ブローカリングにより、主要トラフィックのパフォーマンスに影響を与えることなく、高度な可視性を確保します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">24 時間 365 日市場に対応</strong><span style=\"vertical-align: baseline;\">: 本番環境ワークロードをライブ取引専用のプライマリ ゾーンに分離し、日常的なメンテナンスや認定テストは更新およびテスト用のセカンダリ ゾーンで行うことで、24 時間体制で継続的に取引に対応できる設計となっています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ULL Solution のコンピューティングは、新しい </span><a href=\"https://docs.cloud.google.com/ull-solution/participants/u4-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">U4 マシン</span></a><span style=\"vertical-align: baseline;\"> ファミリーによって提供されます。このファミリーは、3 つの特化型マシンシリーズを通じて、ブレのないパフォーマンスと超低レイテンシのコンピューティングを実現します。具体的には、3 つの物理 NIC を備えたデュアル ソケットのベアメタル インスタンス（取引所運営者向けの U4P、市場参加者向けの U4C）と、運営者、参加者、サービス提供者向けの U4S 高パフォーマンス VM がラインナップされています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">マシンシリーズ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/cpu-platforms\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CPU プラットフォーム</strong></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">CPU コア</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">メモリ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">NIC</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ストレージ オプション</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">U4P</strong></p>\n<p><strong style=\"vertical-align: baseline;\">（ベアメタル）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Intel 第 5 世代 Xeon（Emerald Rapids）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">物理コア: 120</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">512 GB / 768 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">物理 NIC: 3（標準 1 + ULL 2）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ローカル Titanium SSD（12 TiB）、Hyperdisk</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">U4C</strong></p>\n<p><strong style=\"vertical-align: baseline;\">（ベアメタル）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Intel 第 5 世代 Xeon（Emerald Rapids）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">物理コア: 120</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">512 GB または</span></p>\n<p><span style=\"vertical-align: baseline;\">768 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">物理 NIC: 3（標準 1 + ULL 2）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ローカル Titanium SSD（12 TiB）、Hyperdisk</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">U4S</strong></p>\n<p><strong style=\"vertical-align: baseline;\">（VM）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Intel 第 6 世代 Xeon（Granite Rapids）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">vCPU: 2～288</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">最大 2,232 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">マルチ vNIC（最大 200 Gbps）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ローカル Titanium SSD（18 TiB）、Hyperdisk</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Google が U4 マシン ファミリーを開発したのは、世界で最も厳しい技術要件が求められる市場が Google Cloud 上でシステムを稼働させ、クラウド サービスとスケーラビリティのメリットを享受できるようにするためです。その一例が、CME Group との継続的なパートナーシップです。これを通じて、上場デリバティブ市場を Google Cloud に移行しています。同プロジェクトにおいて、U4C と U4P のベアメタル インスタンスは、物理コロケーションに直接接続する場合と同等のレイテンシを達成し、予測可能な低レイテンシのクロック精度と、ネイティブなハードウェア マルチキャスト フィードの取り込みを実現します。このアーキテクチャは、取引所の基幹システムや取引戦略を、金融市場が求めるスピード、一貫性、そして制御性を備えたクラウド環境で十分に稼働できることを実証しています。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"cme group\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/cme_group_g3mWTg1.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「世界をリードするデリバティブ取引所をクラウドへ移行するには、パフォーマンス、レイテンシ、そして信頼性のすべてにおいて一切の妥協が許されません。Google Cloud の Ultra Low Latency Solution と U4 インスタンス ファミリーは、金融市場インフラストラクチャの歴史におけるブレークスルーを象徴するものです。動作の確実性に優れた超低レイテンシのネットワーキングと、専用のベアメタル コンピューティングをクラウドのメリットと組み合わせることで、市場参加者は、従来のコロケーションと同等のスピードとクラウドのアジリティを活かして、マーケット データの取り込みから取引の執行までを迅速に行うことが可能になります。」- CME Group、マーケット エンジニアリング担当マネージング ディレクター、Pearce Peck-Walden 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Google Cloud クラウドネイティブなインフラストラクチャを活用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ULL Solution は、一部の</span><a href=\"https://docs.cloud.google.com/ull-solution/configuration-overview#locations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プライベート Google Cloud リージョン</span></a><span style=\"vertical-align: baseline;\">で提供されており、トレーディング チームは、迅速な自動リソース プロビジョニング、オンデマンドの容量スケーリング、動的なフリート管理といった、クラウド インフラストラクチャならではのメリットを最大限に活用できます。トレーディング チームは、隔離された専用の ULL ネットワーク上で超低レイテンシの取引を実行できるだけでなく、独立したネットワーク インターフェースを介して、データ ストリームを BigQuery や Gemini Enterprise などの Google Cloud サービスにオフロードできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ティックツートレードのワークフローの管理や、リアルタイムの市場データを処理する取引所参加者にとって、マイクロ秒単位のわずかな変動も死活問題となります。ベアメタル インスタンスである U4P および U4C マシンシリーズは、レイテンシに極めて敏感な実行レイヤにおいて、仮想化によるオーバーヘッドを一切発生させません。これらのベアメタル インスタンスは、Google Cloud の Titanium オフロード システム アーキテクチャを活用することで、ホストリソースへの直接アクセスを可能にします。Compute Engine インスタンスでは、標準の Google Cloud API を介した専用ハードウェアのプロビジョニング、Infrastructure as Code によるデプロイのオーケストレーション、Cloud Next Generation Firewall（NGFW）ポリシーの適用、豊富なテレメトリーの収集を行うことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">U4S VM シリーズは、取引前のリスク検証やリアルタイム解析といった用途において、これらのベアメタル サービスを補完する役割を果たします。U4P インスタンスや U4C インスタンスと並行してデプロイされるこれらの VM は、取引アーキテクチャ全体のトランジット ホップを短縮すると同時に、2〜288 vCPU の弾力的なスケーリングと、最大 100 Gbps のネットワーク帯域幅を提供します。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"prime trading\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/prime_trading.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「U4 インスタンスのテストを通じて、Google Cloud が、極めて高い処理能力が求められる当社の取引所取引ワークロードに必要な低レイテンシと動作の確実性を備えていることが実証されました。ベアメタルと VM の両方のオプションが用意されていることで、費用対効果を評価し、それぞれの取引戦略に最適なインフラストラクチャを柔軟に選択できるようになります。」 - Prime Trading、EVP / CTO、Corbin Kidd 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"28stone\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/28stone.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「ティックツートレードのパフォーマンス検証において、U4C ベアメタル インスタンスは卓越した処理速度を示し、クラウド コンピューティングと超低レイテンシ ネットワーキングの組み合わせが、マイクロ秒単位の過酷な取引需要にも余裕を持って対応できることを実証しました。しかし、U4 シリーズの真の強みは、単なる処理スピードではなく、構造的な「動作の確実性」にあります。Google Cloud の U4 ベアメタル ファミリーのストレステストを行ったところ、パフォーマンス曲線はほぼ完全に平坦なままでした。これは、これらのクラウド コンピューティング設計が、市場参加者が求める極めて厳格な「動作の確実性」を十分に提供できるレベルに達したことを裏付けています。」- 28Stone、エクスペリエンス モダナイゼーション担当グローバル責任者、Christopher Wilson 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">将来を見据えると、この低レイテンシ アーキテクチャはアルゴリズム取引の強固な基盤となり、企業はリアルタイムの市場データを AI 駆動の取引モデルに直接取り込めるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">取引ワークロードのストレージと配置</strong></h4>\n<p><span style=\"vertical-align: baseline;\">U4 ファミリーは、Google Cloud のストレージ オプションとプレースメント ポリシーをサポートしており、トレーディング チームが取引データを高速に記録し、マシン間におけるネットワーク レイテンシの極小化できるようにします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高速ロギング用のローカル Titanium SSD:</strong><span style=\"vertical-align: baseline;\"> 取引の実行パフォーマンスを損なうことなく、リアルタイムの取引ロギングやデータのキャッシュ保存を行うために、U4P と U4C は最大 12 TiB の直接接続された NVMe SSD を提供し、U4S VM は最大 18 TiB までスケールアップできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データ アーカイブ用の Hyperdisk:</strong><span style=\"vertical-align: baseline;\"> 過去の市場データ、バックテスト モデル、コンプライアンス監査用アーカイブの保管に対応するため、すべての U4 シリーズで Hyperdisk Balanced および Hyperdisk Extreme ボリュームをアタッチでき、インスタンスあたり最大 32 ボリューム、512 TiB までスケールアップできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プレースメント ポリシー:</strong><span style=\"vertical-align: baseline;\"> 物理的なネットワーク ホップを削減するために、コンパクト プレースメント ポリシーでは、関連するマシンをデータセンター内の近接した場所に配置します。一方、スプレッド プレースメント ポリシーでは、レジリエンスを高めるために、マシンを別々のラックに配置します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ULL Solution を使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ULL Solution により、金融取引所の運営者、取引所参加者、取引サービス提供者は、現在求められるスピードと信頼性で取引を行えるだけでなく、進化し続ける AI やインフラストラクチャの機能を活用し、未来の取引を見据えて自社のビジネスを優位に位置付けることができます。</span><a href=\"https://docs.cloud.google.com/ull-solution/participants/release-notes?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ULL Solution</span></a><span style=\"vertical-align: baseline;\"> は、一部の Google Cloud リージョンでご利用いただけます。詳細については、</span><a href=\"https://docs.cloud.google.com/ull-solution/participants/configuration-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一般公開ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧いただき、Google のチームに</span><span style=\"text-decoration: underline; vertical-align: baseline;\">アクセスをリクエスト</span><span style=\"vertical-align: baseline;\">してください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Disha Chopra</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Yarden Halperin</strong></p></div>"
  "c573657bc09da62ba20ee5ecf342cb7f":
    "id": "c573657bc09da62ba20ee5ecf342cb7f"
    "title": "Looker を活用した Agentic Data Cloud 向けの信頼できるデータアプリ"
    "link": "https://cloud.google.com/blog/ja/products/business-intelligence/introducing-looker-data-apps/"
    "published": "2026-10-19 11:00:00"
    "fetched": "2026-10-19 21:11:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 13 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/business-intelligence/introducing-looker-data-apps?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">ビジネス インテリジェンス ユーザーの皆様なら、このような状況に心当たりがあるのではないでしょうか。ほとんどのダッシュボードは標準化されたキャンバスと決められたグラフ ライブラリしか提供しておらず、「分析」といえば CSV をエクスポートして別のシステムへ持っていく作業に過ぎない、というケースです。あるいは、ダッシュボードのデザイン自体が課題となる場合もあります。エグゼクティブ ブリーフィング、顧客向けポータル、インタラクティブな説明コンテンツなどの理想像は頭にあっても、用意されているグリッドタイルだけではそれを具現化できない、というケースです。</span></p>\n<p><span style=\"vertical-align: baseline;\">いずれにしても、これまでの解決策はカスタム アプリケーションを構築することでした。AI の登場によりこのプロセスは加速し、今や動作するプロトタイプなら半日で作れるようになりました。しかし、最初のデモで味わう興奮はすぐに冷めてしまいます。ガバナンスの効いたデータ、行レベルのセキュリティ、インフラストラクチャの責任者、そして明確なセキュリティ レビューのプロセスがなければ、LLM によって生成されたツールは、本番環境に移行できない単なるプロトタイプに過ぎません。</span></p>\n<p><span style=\"vertical-align: baseline;\">このギャップを埋めるため、このたび </span><strong style=\"vertical-align: baseline;\">Looker Data Apps（プレビュー版）</strong><span style=\"vertical-align: baseline;\">を発表いたしました。これは、エージェント生成アプリケーションのスピード感と、既存の Looker フレームワークが持つガバナンス、セキュリティ、信頼性を兼ね備えたソリューションです。必要なものを平易な言葉で説明するだけで、エージェントが Looker 内でネイティブにホストされる、本番環境グレードの本格的なアプリケーションを構築します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">データアプリとは</strong></h4>\n<p><span style=\"vertical-align: baseline;\">データアプリとは、AI エージェントによって生成され、Looker 内でネイティブにホストされる、カスタムメイドのインタラクティブなウェブ アプリケーションです。ダッシュボードがトップダウンでの可視性を提供するのに対し、データアプリは特定の業務ワークフローに沿って設計された、直接アクションを起こせるシステムとして機能します。データアプリには、次のような特長があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">標準的なグリッドタイルの枠を超え、特定の業務役割や具体的なジョブに合わせて構成された、ピクセル パーフェクトなカスタム レイアウトを実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ビジネス ユーザーがパラメータの入力、シナリオのテスト、ライブ シミュレーションの実行、さらには基盤データの更新までを行えるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データ分析を、ソースレコードの更新や ツール（Salesforce や Jira など）へのイベント送信といった業務実行タスクと直接連動させ、エンドツーエンドのビジネス プロセスを統合します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_SS6pcLF.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Looker のセマンティック レイヤに直接グラウンディングされた Claude Code や Antigravity CLI などの AI デベロッパー ツールを活用し、ピクセル パーフェクトなインターフェースを構築できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">セマンティック レイヤをアプリケーション プラットフォームへ拡張</strong></h4>\n<p><span style=\"vertical-align: baseline;\">データアプリはダッシュボードを置き換えるものではなく、既存のダッシュボードやセマンティック レイヤの上に構築できる「可能性」をさらに広げるものです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ダッシュボードが得意とするのは、集計データの可視化や受動的なレポート作成です。データアプリは能動的な業務実行に対応しており、ユーザーがパラメータを変更して後続のビジネスタスクを実行できるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ダッシュボードは、標準化されたグラフ ライブラリによって一貫性をもたらします。一方、データアプリは高い柔軟性を備えており、カスタム ウェブ コンポーネントや特有のインタラクションを実現できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データアプリは正確性を担保するため、ガバナンスの効いたデータに基づいています。ユーザーが KPI ダッシュボードで数値を確認するときも、データアプリで予算を調整するときも、すべてのロジックは LookML セマンティック レイヤで一元管理されます。そのため、指標の不一致やハルシネーションを排除できます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_dLheVUo.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>カスタマイズ可能なマルチページのウェブアプリ エクスペリエンスと組み込みの運用ワークフローにより、分析をアクションに変換します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">エンタープライズ規模に対応</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Looker Data Apps は、高度な要件と厳格なガバナンスが求められる企業向けに設計されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">すべてのメジャーがセマンティック レイヤに基づく設計。</strong><span style=\"vertical-align: baseline;\">構築したすべてのアプリは、既存のセマンティック モデルや行レベルのセキュリティ、アクセス制御をそのまま継承します。社内全体で計算の一貫性が維持されるほか、組み込みのクエリ検査機能により、チームは生成された SQL を 1 行ずつ監査して指標のハルシネーションを排除できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デフォルトでノーコード。</strong><span style=\"vertical-align: baseline;\">エージェントが生成した React アプリケーションを、コードを書くことなく Looker 内に直接デプロイできます。また、Claude Code や Antigravity CLI などの LLM ツールを活用してインタラクティブなアプリを構築し、わずか数分でデータアプリとしてデプロイすることも可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ランタイム トークンの費用は不要。</strong><span style=\"vertical-align: baseline;\">LLM トークンが消費されるのは、アプリの設計や生成のときだけです。一度作成すれば、エンドユーザー操作はすべて、ネイティブな Looker API とモデルで実行されます。データアプリを利用するユーザーが 50 人でも 5,000 人でも、追加コストは発生しません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ダッシュボードの埋め込みと同じくらい簡単。</strong><span style=\"vertical-align: baseline;\">ダッシュボードを埋め込む際と同じワークフローで、データアプリを外部ポータルにデプロイできます。新しいパイプラインも、カスタム アプリケーション コードも、2 つ目の権限モデルも必要ありません。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">プロトタイプから本番環境までわずか数分</strong></h4>\n<p><span style=\"vertical-align: baseline;\">基本的なダッシュボードで我慢するか、貴重なエンジニアリング時間を費やしてカスタム システムを構築するか、どちらかを選ぶ必要はもうありません。コンプライアンスやセキュリティの障壁によってプロトタイプがサンドボックス内でとん挫することはありません。Looker Data Apps を使えば、ガバナンスの効いた本番環境グレードのツールをわずか数分でデプロイできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Looker Data Apps は現在プレビュー版でご利用いただけます。</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"vertical-align: baseline;\">ぜひ</span><span style=\"text-decoration: underline; vertical-align: baseline;\">実際にお試しください</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ani Jain</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sharon Zhang</strong></p></div>"
