  "2d30c4892b2a51b849c63db854d9c043":
    "id": "2d30c4892b2a51b849c63db854d9c043"
    "title": "SRE ブックの 10 年間:『Site Reliability Engineering』第 2 版のご紹介"
    "link": "https://cloud.google.com/blog/ja/products/devops-sre/sre-book-second-edition/"
    "published": "2026-10-19 11:00:00"
    "fetched": "2026-10-19 14:44:40"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 13 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/devops-sre/sre-book-second-edition?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">10 年前、Google は O'Reilly Media から『Site Reliability Engineering: How Google Runs Production Systems』を出版しました。大規模なインフラストラクチャを管理する Google の手法を集めたものとして始まった本書はベストセラーとなり、多くの組織がそこに示された信頼性プラクティス（スケーラブルで信頼性が高く、持続可能なシステムを構築するためにソフトウェア エンジニアリングを運用に適用すること）を採用するきっかけとなりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">過去 10 年間で、コンピューティング環境は大きく変化しました。AI、マイクロサービス、マルチクラウド デプロイ、サーバーレス パラダイム、プラットフォーム エンジニアリングはすべて、ソフトウェアの構築と運用方法を再構築しました。このたび、本書の出版 10 周年を記念して、全面的に改訂された Google SRE ブック第 2 版を発表できることを嬉しく思います。Google 社内および業界全体で得た 10 年間の教訓を反映し、今日の運用上の課題に合わせた最新のガイダンスを提供します。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"SRE Book 2e Front Cover\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/SRE_Book_2e_Front_Cover.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><b>改訂する理由</b></p><p>初版を出版した当時、多くの組織はクラウドへの初期移行に注力しており、モノリシック アーキテクチャからの脱却を始めたばかりでした。昨今、組織が高速かつグローバル規模でソフトウェアを提供する中で、課題はもはやクラウド インフラストラクチャの導入ではなく、極めて複雑な状況に直面しながらも高い信頼性を維持することです。</p><p>最新の本番環境は、常に変化する状況下で運用されています。システムの境界はより複雑になり、依存関係は深まり、障害モードはこれまで以上に複雑化して深刻な被害をもたらすようになっています。生成 AI のようなリソースを大量に消費するワークロードの急増により、インフラストラクチャ管理における経済性と運用要件が変化しています。</p><p>この第 2 版を執筆するにあたり、私たちは一度立ち止まって、現代の環境で SRE を適切に実装するために何が必要かを評価する必要がありました。</p><p><b>10 年間の進化: SRE 手法の進歩</b></p><p>第 2 版では、サイト信頼性エンジニアリングの基礎的なプラクティスが過去 10 年間でどのように成熟し、タスク固有の手動作業から、プラットフォーム全体の自動化機能へとシフトしたのかを深く掘り下げて解説しています。以下はその例です。</p><p><b>SLO とエラー バジェット:</b> 2016 年、チームは基本的な可用性指標と手動のエラー バジェット ポリシーに依存していました。現在は、動的なバーンレート アラートと自動化されたポリシー適用を組み込んだ、ユーザー中心の多層 SLO へと成熟しています。</p><p><b>モニタリングとオブザーバビリティ:</b> 初期のセットアップは、静的なダッシュボード、基本的なログ、手動のアラート トリアージが中心でした。最新のオブザーバビリティは、OpenTelemetry、分散トレース、自動化された異常相関を活用して、根本原因を迅速に特定します。</p><p><b>自動化とプラットフォーム:</b> 運用は、個別のタスク用にカスタム スクリプトを作成することから、宣言型の Infrastructure as Code、社内開発者プラットフォーム、復元力のある自己修復システムを使用することへと移行しています。</p><p><b>信頼性テスト:</b> 定期的なゲームデーや合成負荷テストのみに頼るのではなく、最新のエンジニアリングでは、継続的なレジリエンス チェック、自動化されたパイプライン テスト、本番環境でのライブカナリア検証を組み込んでいます。</p><p><b>容量とリソースの管理:</b> 手動でのプロビジョニングや静的な予測は、動的な自動スケーリング、クラウド FinOps との連携、GPU および TPU ワークロードに特化したコストとクラスタの最適化に置き換えられました。</p><p><b>組織モデル:</b> SRE は、特定のアプリケーションに割り当てられた専任チームの枠を超えて拡大しています。昨今の組織は、ハイブリッド モデル、プラットフォーム エンジニアリングとの統合、各プロダクト チームに配置された信頼性チャンピオンを取り入れています。</p><p><b>AI 時代の SRE</b></p><p>さらに、SRE と AI には相互に影響し合う 2 つの関係があります。それは、SRE が AI インフラストラクチャをいかに支えるか、そして SRE チームが AI を活用していかに運用の信頼性を高めるか、という点です。</p><p>大規模言語モデル（LLM）や基盤モデルを実行すると、信頼性に関する新たな課題が生じます。本書では、AI インフラストラクチャを大規模に運用するための次の手法を概説しています。</p><ul><li>大規模な GPU および TPU ハードウェア クラスタの信頼性とネットワーク トポロジの管理</li><li>AI 固有の非決定論的な出力とレイテンシ特性のモニタリング</li><li>継続的なモデル トレーニング、ファインチューニング、データ処理のためのパイプライン信頼性の確保</li></ul><p>AI は、信頼性エンジニアの能力を何倍にも引き上げる存在として急速に浸透しています。第 2 版では、人間の業務効率を向上させるための次の実践的なフレームワークを紹介しています。</p><ul><li>生成 AI ツールを使用して、リアルタイムのインシデント トリアージと事後分析の生成を支援</li><li>自然言語クエリを使用して複雑なシステム テレメトリーを調査</li><li>予測 ML モデルを使用して、サービス停止が発生する前にリソースのボトルネックを特定</li></ul><p><b>変わらない点: 文化の重要性</b></p><p>テクノロジーとアーキテクチャは進化し続けていますが、SRE の基本原則は変わらず、信頼性を重視する文化を確立するための鍵となっています。そのため、第 2 版では、システム エンジニアリングの人的要素と、それを実現する方法を改めて強調し、詳しく解説しています。</p><p>この分野の初心者、実務担当者、エンジニアリング マネージャー、テクノロジー エグゼクティブのどなたであっても、改訂された『Site Reliability Engineering』第 2 版は、次世代の本番環境システムの決定版ロードマップとして役立ちます。</p><p>書籍版（<a href=\"https://www.google.com/books/edition/_/iXnw0QEACAAJ?kptab=getbook\">Google ブックス</a>を参照）またはデジタル版を<a href=\"https://www.oreilly.com/library/view/site-reliability-engineering/9798341607675/\"> O'Reilly</a> から今すぐご注文いただけます。</p><p><i>- SRE プログラム マネージャー、</i><b><i>Betsy Beyer</i></b></p><p><b><i>-</i></b> <i>ソフトウェア エンジニア、サイト信頼性エンジニア、</i><b><i>David Huska</i></b></p>\n    </div>\n  </div>\n</div>\n\n</div>"
  "4538be7c751b97fac6f5cc97a631a87f":
    "id": "4538be7c751b97fac6f5cc97a631a87f"
    "title": "中小企業で Gemini をさらに活用可能に"
    "link": "https://cloud.google.com/blog/ja/topics/startups/how-to-grow-your-small-business-using-google-gemini/"
    "published": "2026-10-19 10:20:00"
    "fetched": "2026-10-19 14:44:40"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 9 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/startups/how-to-grow-your-small-business-using-google-gemini?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび Google は、1 つであらゆる用途に応えるビジネス向けの新しい Gemini エージェントを</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">発表</span></a><span style=\"vertical-align: baseline;\">しました。少数精鋭のチームと限られた利益率で運営される中小企業にとって、Gemini は業務効率の向上、優れたカスタマー エクスペリエンスの提供、そして成長を実現するために不可欠なツールとなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">すでに数百万もの中小企業（SMB）が Google AI に信頼を寄せ、Gemini Enterprise、Google 広告、Google Workspace などの複数のサービスで AI を活用しています。また、こうした SMB による利用は急速に拡大しており、これらの企業での Google Cloud AI ツール使用量は前年比で 5 倍以上に増加しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、SMB のお客様も、Gemini のあらゆるエージェント機能をご利用いただけるようになりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">SMB にエージェントの時代が到来</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini は、パーソナル アシスタントやチームメンバーのように機能します。既存のシステムやデータに接続でき、使い慣れたインターフェース上で動作するほか、Google Cloud ならではのモデルの選択肢、セキュリティ、費用管理を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">質問への回答、ナレッジワークの処理、画像やメディアの作成から、コードの記述と実行まで、すべてをプロンプト ボックス 1 つで行えます。求める結果を指示すれば、エージェントが作業を完了してくれます。プロジェクト マネージャー、経理担当者、在庫管理者、マーケティング コンサルタントなど、特定の役割を担う柔軟なメンバーとして Gemini をチームに加えることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、Gemini はすぐに使えるように設計されており、次のようなメリットがあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一般的な SMB ツールに接続可能: </strong><a href=\"https://cloud.google.com/gemini-enterprise/connectors?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Asana、Box、Clay、Docusign、Dropbox、GitHub、LegalZoom、Notion、Salesforce、Shopify、Slack、Wix など</span></a><span style=\"vertical-align: baseline;\">の、日常的に使用するシステムに接続できます。Gemini はこれらのツール、ビジネスデータ、作業履歴からコンテキストを抽出して、使えば使うほどスマートで便利になっていきます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">モデルの選択肢を提供: </strong><span style=\"vertical-align: baseline;\">Gemini はエージェントであり、その基盤となるモデルは別途選択することができます。Gemini は、各ジョブに最適なモデルを選択して実行します。現在は Gemini モデル ファミリーと Claude モデルを組み合わせて使用していますが、将来的には他の主要なプライベート モデルやオープンモデルにも対応する予定です。作業に合ったモデルを使用すれば、難しいジョブの精度を向上させ、シンプルなジョブの費用を削減することができます。また、主要なモデルは数か月ごとに変わります。選択肢をオープンにしておけば、モデルが変わってもコンテキスト、スキル、データはそのまま維持することができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">どこからでもアクセス可能: </strong><span style=\"vertical-align: baseline;\">Gemini は、ウェブ、Android および iOS モバイル デバイス、Mac および Windows パソコン、Google Workspace、Microsoft 365、Slack などのアプリケーションといった、日常的に使用するさまざまな環境で動作します。クラウドで実行されるため、デバイスから離れているときでも動作し続けます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">費用を適切に管理: </strong><span style=\"vertical-align: baseline;\">Gemini には先進的な費用管理機能も備わっているため、お客様も従業員の方々も安心して Gemini を業務に活用できます。管理機能には、ジョブに最適なモデルを選択するマルチモデル オーケストレーション、ワークロードを自動的に振り分けて最小限のコストで最大のパフォーマンスを発揮するモデルで実行するスマート ルーティング、Cloud Billing コンソールでのリアルタイムのプロジェクト レベル費用上限設定などがあります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Gemini は現在、SMB のお客様向けに早期アクセス版を提供中です。まもなく、すべてのお客様にご利用いただけるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Google Cloud AI を活用して成果を上げている SMB の事例</strong></h4>\n<p><span style=\"vertical-align: baseline;\">世界中で、すでにさまざまな SMB が Gemini Enterprise を活用してビジネスを推進しています。その例をいくつかご紹介します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">米国の産業オートメーション企業の </span><strong style=\"vertical-align: baseline;\">Aerotech</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を活用して、社内用の問題解決 AI プラットフォームを全従業員に展開し、トラブルシューティング時間を短縮することで生産能力を向上させています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ブラジルの歯科および医療機器メーカーである </span><strong style=\"vertical-align: baseline;\">Angelus</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して研究開発部門全体のプロジェクト管理を効率化しています。これにより、各チームはプロジェクトの技術データを、会社のブランド アイデンティティや規制要件に沿った事前承認済みのテンプレートに自動的に取り込めるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">国際的な教育プラットフォームの </span><strong style=\"vertical-align: baseline;\">EdSpan Global</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して数千ものデジタル学習オブジェクトの標準化を自動化し、反復的な編集に費やす時間を短縮してコースのリリースを加速しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">フィンランドでソフトウェア開発および DevOps を手がける </span><strong style=\"vertical-align: baseline;\">Eficode</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を活用して、複雑な社内 Wiki を迅速にインデックス化するマルチプラットフォーム対応のサポート エンジンを構築し、従業員が顧客に対してより迅速な技術サポートを提供できるようにしています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ラテンアメリカ全域で貨物輸送のデジタル化を推進するチリの物流テクノロジー企業 </span><strong style=\"vertical-align: baseline;\">KLog.co</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を活用して貨物追跡と出荷書類作成を自動化し、手動によるデータ入力エラーを 90% 以上削減するとともに、書類処理能力を 10 倍に向上させています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">シンガポール最大級の飲食企業の一つである </span><strong style=\"vertical-align: baseline;\">Koufu</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を活用して売上レポート作成とデータ分析を自動化しています。これにより、スプレッドシートがボトルネックになる状況を解消し、店舗マネージャーが店頭サービスの品質向上に集中できるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">フランス国内外で蒸留酒や飲料を専門に扱う小売事業者 </span><strong style=\"vertical-align: baseline;\">La Maison du Whisky（whisky.fr）</strong><span style=\"vertical-align: baseline;\">は、技術的な商品データを数秒で上質なストーリーテリングやマーケティング コピーへと変換する「デジタル ソムリエ」の構築に Gemini Enterprise を採用しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ブラジルを代表する屋外広告コミュニケーション プラットフォームの </span><strong style=\"vertical-align: baseline;\">NEEOH</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して組織全体でセキュアな AI の使用を標準化し、顧客企業のデータのセキュリティを確保しながら、社内チームがより迅速にキャンペーン コピーの生成や提案書の作成を行えるようにしています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">米国を拠点とする医療および臨床業務プロバイダの </span><strong style=\"vertical-align: baseline;\">Quadrant Health Group</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して、断片化されたテクノロジー システムを統合し、反復的なバックオフィス タスクを自動化しています。また、患者データを保護するセキュアな AI ツールを臨床医に提供しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">米国を拠点とするイベント制作およびクリエイティブ パートナー エージェンシーの </span><strong style=\"vertical-align: baseline;\">Salt Productions と Pinch Creative</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して、断片化されたファイルを検索可能な信頼できる唯一の情報源に変換しています。これにより、管理作業とプレゼンテーションにおけるボトルネックが軽減され、スタッフがイベント制作とデザインに集中できるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">デジタル セキュリティ プロバイダの </span><strong style=\"vertical-align: baseline;\">Sep 2</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して、24 時間 365 日体制で脅威をモニタリングする自律型 AI エージェントをデプロイしています。このエージェントは、インシデントの検出を迅速化し、セキュリティ上の脅威を無効化できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">米国を拠点とするテクノロジー コンサルティング会社の </span><strong style=\"vertical-align: baseline;\">Stratagem</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して管理ワークフローを自動化し、小売カスタマー サービス エージェントを開発しました。これにより、コンサルタントがクライアントと向き合える時間を増やし、サービス提供を加速しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">戦略的ブランドデザイン エージェンシーの </span><strong style=\"vertical-align: baseline;\">Sunhouse</strong><span style=\"vertical-align: baseline;\"> は、Gemini Enterprise を使用して、Google ドライブに保存されたアーカイブ済みのデザイン制作物を簡単に見つけられるようにしています。これにより、チームがファイル検索に費やす時間を減らして、グローバル ブランドとのビジネス成長のためにより多くの時間を使えるようになりました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Google Cloud AI のトレーニングを利用する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">SMB チームが AI を最大限に活用できるよう、Google では</span><a href=\"https://www.skills.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\"> プラットフォームを通して簡単な無料学習プログラムを提供しています。今すぐご利用ください。このプラットフォームは、以下の 2 つの方法で無料で利用可能です。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/subscriptions\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">35 クレジットを無料で取得</span></a><span style=\"vertical-align: baseline;\">してハンズオンラボにアクセスし、すべてのレベルでスキルバッジを獲得する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/resources/offers/skills-for-organizations?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">組織向け Google Skills にチームを登録する</span></a></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">現在、Google Skills では 3,000 以上のコース、ラボ、修了証を提供しています。Google AI や Google Workspace、Gemini Enterprise などのプロダクトに関する実践的なスキルを身につけ、スキルバッジを獲得して、価値ある Google Cloud 認定資格を取得できます。新しい Gemini エージェントに関するコースは近日中に公開予定です。それまでの間、以下のようなおすすめのコースもぜひご利用ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/267?catalog_rank=%7B%22rank%22%3A1%2C%22num_filters%22%3A0%2C%22has_search%22%3Atrue%7D&amp;search_id=101588555\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud によるデータ トランスフォーメーションの探求</span></a><span style=\"vertical-align: baseline;\">: シンプルなツールから脱却し、より広範な業務での Google Cloud 活用を実際に始めたいと考えている SMB 向けのコースです。インフラストラクチャとセキュリティ ポスチャーのモダナイズを検討しているビジネス リーダーが最初に学ぶコースとして最適です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/paths/249?catalog_rank=%7B%22rank%22%3A2%2C%22num_filters%22%3A0%2C%22has_search%22%3Atrue%7D&amp;search_id=101591124\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Workspace with Gemini:</span></a><span style=\"vertical-align: baseline;\"> 日常業務の効率を迅速に向上させたい SMB 向けのコースです。Gmail、ドキュメント、ドライブ内で直接メールの下書きを作成したり、簡単なワークフローを自動化したりするなど、AI を日々のビジネス オペレーションにシームレスに統合するための実用的なガイドとなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/paths/4020\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SMB 向け学習プログラム</span></a><span style=\"vertical-align: baseline;\">: 事業運営を拡大する実用的な方法を模索している SMB 向けに、生成 AI の初歩的な技術基盤を Gemini による自動化、カスタム エージェント開発のための</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/gear-program-now-available?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GEAR フレームワーク</span></a><span style=\"vertical-align: baseline;\">と組み合わせることに重点を置いたコース集です。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">パートナーの活用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google のパートナー エコシステムは、企業が Gemini をはじめとする Google Cloud AI を導入する際に重要な役割を担います。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在、数多くのパートナーの Google Cloud AI 認定エキスパートが、ユースケース特定、プロトタイピング、カスタム エージェント構築など、AI 導入のあらゆる面で SMB を支援しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">今すぐ</span><a href=\"https://cloud.google.com/find-a-partner/\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud パートナー ネットワーク</span></a><span style=\"vertical-align: baseline;\">を確認して、パートナーとの連携を始めましょう。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、SMB および Scaled 担当バイス プレジデント</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Sharon Prosser</strong></p></div>"
  "d4b7b08ec41a7d726c07e2c0fd3b2f35":
    "id": "d4b7b08ec41a7d726c07e2c0fd3b2f35"
    "title": "低コストでスムーズな開発を実現する Managed Lustre を誰でも利用可能に"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/democratizing-managed-lustre-with-lower-cost-and-frictionless-development/"
    "published": "2026-10-19 01:35:00"
    "fetched": "2026-10-19 14:44:40"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 1 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/democratizing-managed-lustre-with-lower-cost-and-frictionless-development?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">本記事は、Google Cloud が TB/秒のスループット、大規模クライアント環境下でのミリ秒未満のレイテンシ、POSIX 対応といった高性能並列ファイル システムの基本価値を、より幅広いユースケースとユーザーに提供している方法を紹介する 2 部シリーズの第 1 回です。</span></p>\n<p><span style=\"vertical-align: baseline;\">これまで、並列ファイル システムはコストがかかり、特殊な向けであったため、コールドデータはファイル システムの外部に保存する必要がありました。また、AI 開発者は、コードの記述、ライブラリのコンパイル、リポジトリの管理のために、低速な環境を別途維持しなければなりませんでした。このような境の分断は、手動でのデータ ステージング、データセットのコピー、ばらばらな名前空間の管理といったトイルを増大させていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Managed Lustre は、</span><strong style=\"vertical-align: baseline;\">1 GB あたり月額 6 セントのダイナミック ティアと、さまざまな開発タスクやワークロード向けに Managed Lustre のパフォーマンスを最適化することで、これらの問題を解決します。これにより、Managed Lustre は、高パフォーマンスの AI および HPC ワークロードのための「ワンストップ ショップ」となります。</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">低コスト: ダイナミック ティアで Lustre をより低コストで利用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Managed Lustre のダイナミック ティアは、</span><strong style=\"vertical-align: baseline;\">ホットデータに対してミリ秒未満のレイテンシを実現し、すべてのデータを単一の名前空間に保存できます。費用は月額わずか 6 セント/GB*です</strong><span style=\"vertical-align: baseline;\">。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スループット、容量スケール、クライアント スケール:</strong><span style=\"vertical-align: baseline;\"> スループットは最大 80 PB の容量まで直線的にスケールされます。また、ホットデータのミリ秒未満のレイテンシは、数万のクライアントにスケールしても安定して維持されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">単一の定額料金:</strong><span style=\"vertical-align: baseline;\"> 予測可能な料金体系です。ディスク メディアタイプ、名前空間内のデータ移動、メタデータ IOPS に対する個別の料金は発生しません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">読み取りレイテンシ:</strong><span style=\"vertical-align: baseline;\"> 高パフォーマンス キャッシュ（SSD）ではミリ秒未満のレイテンシを実現します。容量プール（「HDD」）は Google Cloud Hyperdisk Throughput を基盤に構築されており、</span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hd-types/hyperdisk-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">平均読み取りレイテンシは 10～30 ミリ秒</span></a><span style=\"vertical-align: baseline;\">です。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ダイナミック ティアに推奨されるワークロード</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチエポック トレーニングや最適化されたフェッチサイズでのトレーニング: </strong><span style=\"vertical-align: baseline;\">ホットデータは、最初の実行後に高パフォーマンス キャッシュ（SSD）に昇格されます。データ プリフェッチを大きくすると、ダイナミック ティアの費用構造を活かしつつ、低レイテンシの SSD のメリットを享受できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">書き込み負荷の高いチェックポイント処理:</strong><span style=\"vertical-align: baseline;\"> バースト的なチェックポイントの書き込みは、高パフォーマンス キャッシュに直接保存されます。古いチェックポイントは、透過的に容量プール（HDD）に降格されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">迅速なチェックポイント復元:</strong><span style=\"vertical-align: baseline;\"> 新しいチェックポイントは高パフォーマンス キャッシュに書き込まれるため、低レイテンシでのチェックポイント復元が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">開発者向けの快適な操作性:</strong><span style=\"vertical-align: baseline;\"> git クローン、ライブラリのコンパイル、ノートブックの実行などの低レイテンシ タスクは、大規模なトレーニング セットをホストする同じ共有ワークスペースで、ローカルディスクと同等の操作感（平均読み取りレイテンシ約 300µs）が得られます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">スムーズな開発: 開発者のワークロードをワンストップで処理する Lustre</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Managed Lustre は、大規模な AI および HPC ワークロード（チェックポイント / 再起動 / データ読み込み）に対応するスケーラビリティに加えて、インタラクティブな作業ニーズも満たします。つまり、開発者は Managed Lustre で作業を開始し、ワークロードのライフサイクル全体でもそのまま Managed Lustre を使用し続けることができます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">統合された基盤とインタラクティブなパフォーマンス</strong></p>\n<p><span style=\"vertical-align: baseline;\">AI と HPC のライフサイクルを単一の名前空間に統合し、インタラクティブな作業に「ローカル ディスク」のような使用感を提供します（</span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Salesforce などが経験した Managed Lustre による低レイテンシのメリット</span></a><span style=\"vertical-align: baseline;\">について詳しくは、こちらをご覧ください）。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レイテンシ:</strong><span style=\"vertical-align: baseline;\"> 平均読み取りレイテンシは約 300µs で、他の分散ファイル システムと比較して最大 4 倍の応答性を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セットアップの高速化:</strong><span style=\"vertical-align: baseline;\"> Linux カーネルの展開は約 2 分（他のファイル ソリューションより 4.7 倍高速）、Python の 20 ワーカー並列 git クローンは約 40 秒、Python のコンパイルは約 200 秒で完了します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"democratizing-lustre-with-lower-cost-and-frictionless-development-02-managed-lustre-performance-values\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/democratizing-lustre-with-lower-cost-and-f.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"democratizing-lustre-with-lower-cost-and-frictionless-development-01-performance-comparision\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/democratizing-lustre-with-lower-cost-and-f.max-1000x1000_xLOfL6w.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">高同時実行ブロードキャストとクラスタ起動</strong></p>\n<p><span style=\"vertical-align: baseline;\">Managed Lustre は、クラスタの初期化中にストレージのボトルネックを解消することで、GPU の費用対効果を最大化します。</span></p>\n<p><span style=\"vertical-align: baseline;\">共有モデルのチェックポイント、ベースの重み、コンテナレイヤなど、数千のワーカーノードがまったく同じファイルを同時に読み取ろうとすると、従来の分散ファイル システムでは局所的なホットスポットが発生して処理が滞り、高価な GPU クラスタが数分間アイドル状態になることがあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">同じファイルを読み取る多数のクライアントの総スループットを向上:</strong><span style=\"vertical-align: baseline;\"> 代替ファイル ソリューションと比較して 67% の向上が実証されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">並列読み込み:</strong><span style=\"vertical-align: baseline;\"> PyTorch などのライブラリを 4,000 以上のプロセスに 60 秒未満でインポートします。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"democratizing-lustre-with-lower-cost-and-frictionless-development-03-performance-advantage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/democratizing-lustre-with-lower-cost-and-f.max-1000x1000_9kShfM1.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">ワンストップ ショップ ワークフローを自分で実行</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ご自身でもテストを実施できるよう、今回実行したテストのコードを以下に示します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">インタラクティブなアクセスでの低レイテンシ</strong></p>\n<p><a href=\"https://github.com/axboe/fio\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">fio</span></a><span style=\"vertical-align: baseline;\"> を使用して、小規模で同時実行性の低い読み取りと書き込みをエミュレートしました。</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">1 ストレージ システムの仕様: Managed Lustre の 500 MBps/TiB ティア、108,000 GiB の容量。Filestore Zonal の容量は 102,400 GiB。同じ 40 GiB ファイルを読み取る 2,048 台のクライアント VM の平均スループットは 36.7 GB/秒。</span></span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Read workload\\r\\nfio --ioengine=libaio --filesize=100M --ramp_time=2s \\\\\\r\\n    --runtime=2m --time_based --numjobs=1 --direct=1 --verify=0 --randrepeat=0 \\\\\\r\\n    --group_reporting --directory=~/LUSTRE_MOUNT \\\\\\r\\n    --name=randread --blocksize=4k --iodepth=1 --readwrite=randread \\\\\\r\\n    --buffer_compress_percentage=50\\r\\n\\r\\n# Write workload\\r\\nfio --ioengine=libaio --filesize=100M --ramp_time=2s \\\\\\r\\n    --runtime=2m --time_based --numjobs=1 --direct=1 --verify=0 --randrepeat=0 \\\\\\r\\n    --group_reporting --directory=~/LUSTRE_MOUNT \\\\\\r\\n    --name=randwrite --blocksize=4k --iodepth=1 --readwrite=randwrite \\\\\\r\\n    --buffer_compress_percentage=50&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f20746cb0d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">迅速な設定</strong></p>\n<p><strong style=\"vertical-align: baseline;\">Linux の展開方法</strong></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Download a kernel tarball\\r\\nwget -P /tmp https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.18.9.tar.xz\\r\\n\\r\\n# Extract the archive to the Lustre mount\\r\\nmkdir ~/LUSTRE_MOUNT/kernel\\r\\ntar -C ~/LUSTRE_MOUNT/kernel -xf /tmp/linux-5.18.9.tar.xz&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f20746c8810&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">上記のユースケースでは、root として実行する際に発生する可能性のあるメタデータ パフォーマンスの負荷を回避するように注意する必要があります（つまり、</span><code style=\"vertical-align: baseline;\">tar</code><span style=\"vertical-align: baseline;\"> が抽出されたファイルの所有者と権限をアーカイブに記録されているものと一致させようとして、</span><code style=\"vertical-align: baseline;\">chown</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">chmod</code><span style=\"vertical-align: baseline;\"> を呼び出しを発行します）。それでも root として実行したい場合（かつ、このアプローチが設定に適していることを確認している場合）は、</span><code style=\"vertical-align: baseline;\">`--no-same-owner --no-same-permissions`</code><span style=\"vertical-align: baseline;\"> を指定することで、抽出されたファイルの所有者が root のままで、root のデフォルトのファイル権限を維持できます。つまり、root としての抽出が、root 以外としての抽出のように動作します（アーカイブ内の所有者と権限が無視されます）。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Python gitclone の実行方法</strong></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;git config --global checkout.workers 20\\r\\nmkdir ~/LUSTRE_MOUNT/python\\r\\ngit clone https://github.com/python/cpython.git ~/LUSTRE_MOUNT/python&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f2075409850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Python コンパイルの実行方法</strong></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;pushd ~/LUSTRE_MOUNT/python\\r\\n./configure &gt; /dev/null\\r\\nmake &gt; /dev/null\\r\\npopd&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f207540ba90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">大規模なディストリビューション</strong></p>\n<p><strong style=\"vertical-align: baseline;\">1 つの大きなファイルを多数のノードに分散する場合の集約スループット</strong></p>\n<p><span style=\"vertical-align: baseline;\">各クライアント VM で以下を実行します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Start fio in server mode\\r\\nfio --server&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f207540b450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>選択したクライアント VM で以下を実行します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;# Create a 40 GiB file\\r\\nfio --name=job1 \\\\\\r\\n    --ioengine=libaio \\\\\\r\\n    --direct=1 \\\\\\r\\n    --buffer_compress_percentage=50 \\\\\\r\\n    --blocksize=4m \\\\\\r\\n    --iodepth=32 \\\\\\r\\n    --filesize=40g \\\\\\r\\n    --readwrite=write \\\\\\r\\n    --filename ~/LUSTRE_MOUNT/40gb_test\\r\\n\\r\\n# Create an fio job file for the read workload\\r\\ncat &lt;&lt;&#x27;EOF&#x27; &gt; /tmp/read.fio\\r\\n[job1]\\r\\nfilename=${HOME}/LUSTRE_MOUNT/40gb_test\\r\\nrw=read\\r\\nbs=4m\\r\\nexitall_on_error=1\\r\\nEOF\\r\\n\\r\\n# Run the read workload using all client VMs in ~/hostfile\\r\\nfio --client ~/hostfile /tmp/read.fio&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f207540b590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">多数のプロセスにわたるライブラリの並列読み込み</strong></p>\n<p><span style=\"vertical-align: baseline;\">選択したクライアント VM で以下を実行します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Install PyTorch in a virtual env\\r\\npython3 -m venv ~/LUSTRE_MOUNT/env\\r\\nsource ~/LUSTRE_MOUNT/env/bin/activate\\r\\npip3 install --upgrade pip\\r\\npip3 install torch torchvision torchaudio \\r\\ndeactivate\\r\\n\\r\\n# Import PyTorch on all client VMs in ~/hostfile, 4 processes per host\\r\\nmpirun --allow-run-as-root --oversubscribe --hostfile ~/hostfile -N 4 \\\\\\r\\n  bash -c \\&#x27;source ~/LUSTRE_MOUNT/env/bin/activate &amp;&amp; python3 -c &quot;import torch&quot;\\&#x27;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f2075408910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">未来と次のステップを見据えて</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Managed Lustre は、手動のデータ ステージングの負担を排除し、ダイナミック ティアで導入コストを削減することで、単一目的に特化したエンジンから、AI ライフサイクル全体に対応する汎用性の高い統合ストレージ ファブリックへと進化しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このシリーズの第 2 回では、</span><strong style=\"vertical-align: baseline;\">今後提供予定のオブジェクト統合機能</strong><span style=\"vertical-align: baseline;\">に焦点を当てます。今後の情報にご注目ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ご自身でベンチマークを実行してみましょう（まだの場合）: </span><a href=\"https://console.cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud コンソール</span></a><span style=\"vertical-align: baseline;\">を使用して Google Cloud Managed Lustre インスタンスをデプロイし、上記で提供されているテストを実行して、自身のワークロードのベンチマークを実施してください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ダイナミック ティアについて: </span><a href=\"https://docs.cloud.google.com/managed-lustre/docs/performance-tiers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre のドキュメント</span></a><span style=\"vertical-align: baseline;\">で詳細をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">パート 2 をお楽しみに: このシリーズの次回では、今後リリースされるオブジェクト統合機能と、それによって AI と HPC のストレージ運用がさらに簡素化される仕組みについて詳しく説明します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud Managed Lustre を活用して、開発からトレーニングまでのライフサイクルを一元化しましょう。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud Managed Lustre、シニア プロダクト マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Barak Epstein</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud Managed Lustre、ソフトウェア エンジニア</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Yuval Ehrental</strong></p></div>"
