    "fetched": "2026-10-07 07:53:05"
    "summary": "<h2 class=\"release-note-product-title\">Cloud Monitoring</h2>\n<h3>Feature</h3>\n<p>Bulk registration of discovered services and workloads to an App Hub\napplication is <a href=\"https://docs.cloud.google.com/products#product-launch-stages\">generally available (GA)</a>.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/monitoring/docs/application-monitoring#register\">Register one or more discovered services or workloads</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud SDK</h2>\n<h3>Breaking</h3>\n<h2 id=\"58800_2026-10-06\">588.0.0 (2026-10-06)</h2>\n<h3 id=\"breaking_changes\">Breaking Changes</h3>\n<ul>\n<li><strong>(Cloud Managed Flink)</strong> Removed the Managed Flink Client component (<code>managed-flink-client</code>) from the Google Cloud CLI.</li>\n</ul>\n<h3 id=\"agent_identity\">Agent Identity</h3>\n<ul>\n<li>Added <code>gcloud alpha|beta agent-identity auth-providers authorizations get-iam-policy|set-iam-policy|add-iam-policy-binding|remove-iam-policy-binding|test-iam-permissions</code> commands.</li>\n</ul>\n<h3 id=\"anthos\">Anthos</h3>\n<ul>\n<li>Updated anthos-cli with newer go version and library dependencies.</li>\n</ul>\n<h3 id=\"apigee\">Apigee</h3>\n<ul>\n<li>Promoted <code>gcloud apigee apis import</code> to GA. The command imports an API proxy\nfrom a YAML template (<code>--from-template</code>) or from a proxy bundle ZIP\n(<code>--from-bundle</code>).</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> emitted an\n<code>EventFlow</code> inside the generic <code>&lt;Flows&gt;</code> container, where Apigee treats it as\nan ordinary conditional flow instead of running it on each streamed event.\n<code>EventFlow</code> is now emitted as a top-level element carrying a <code>content-type</code>\nattribute, which defaults to <code>text/event-stream</code>, and is preserved when\nimporting a bundle.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> applied only\npart of a feature's <code>defaultEndpoint</code>. Its <code>routes</code> and <code>faultRules</code> were\ndropped, and a flow step contributed by two features was emitted twice, which\nmade Apigee run the policy twice. Contributions are now merged, so a repeated\nstep overrides instead of duplicating.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> ignored a\nfeature's <code>defaultTarget</code>, so generated target endpoints were missing the\n<code>PostFlow</code>, <code>EventFlow</code> and <code>DefaultFaultRule</code> it declared. Features that\nattach to the outbound side of a proxy, such as analytics and failover, now\napply to every target. This can make the generated API proxy an Extensible\nAPI proxy, which can't be deployed to a Base environment.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> prefixed a\nfeature's policy and resource names even when the feature declared no <code>uid</code>.\nA feature with no <code>name</code> produced an empty prefix and names that collided\nwith every other unnamed feature. Names are now prefixed only for features\nthat declare a <code>uid</code>, and policies or resources contributed by more than one\nfeature are merged instead of listed twice. This changes the policy names\ngenerated for features without a <code>uid</code>.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> combined a\ntemplate's own <code>endpoints</code> and <code>targets</code> with the ones its features supply,\nwhich could leave some targets unreachable because no route referenced them.\nA template's <code>endpoints</code> and <code>targets</code> are now used only when it supplies no\nfeatures, and a warning is logged when they are ignored.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> did not\ngenerate <code>apiproxy/resources/jsc/metadata.js</code>, so feature JavaScript that\nread the proxy's name, description or parameter defaults failed at runtime.\nThe resource is now generated into the bundle and listed in <code>&lt;Resources&gt;</code>.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> emitted the\nchildren of a policy in alphabetical order rather than the order the template\ndeclared them, which is not valid for policies whose schema is\nsequence-typed. <code>&lt;HTTPTargetConnection&gt;</code> is now also emitted before the\nflows, regardless of how the target was declared.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> would\nincorrectly reject templates that populate the <code>displayName</code> field.</li>\n<li>Added <code>--service-account</code> flag to <code>gcloud beta apigee apis deploy</code> to give a\ndeployed proxy permission to act as a service account.</li>\n</ul>\n<h3 id=\"apihub\">Apihub</h3>\n<ul>\n<li>Added <code>--service-type-enum-values</code> and related flags to <code>gcloud apihub apis update</code>, allowing the service type of an API to be set. Valid values are <code>code</code>, <code>model</code>, <code>agent</code> and <code>skill</code>.</li>\n</ul>\n<h3 id=\"biglake\">BigLake</h3>\n<ul>\n<li>Promoted <code>gcloud biglake hive catalogs</code> to GA.</li>\n<li>Promoted <code>gcloud biglake hive databases</code> to GA.</li>\n<li>Promoted <code>gcloud biglake hive tables</code> to GA.</li>\n</ul>\n<h3 id=\"certificate_authority_service\">Certificate Authority Service</h3>\n<ul>\n<li>Added <code>--key-algorithm</code> flag to <code>gcloud privateca certificates create</code> to\nallow specifying a custom public key algorithm when creating certificates\nwith <code>--generate-key</code>.</li>\n</ul>\n<h3 id=\"cloud_bigtable\">Cloud Bigtable</h3>\n<ul>\n<li>Update go version and rebuild for CVE-2026-33818.</li>\n</ul>\n<h3 id=\"cloud_bigtable_emulator\">Cloud Bigtable Emulator</h3>\n<ul>\n<li>Update go version and rebuild for CVE-2026-33818.</li>\n<li>Micro-precision timestamp support.</li>\n</ul>\n<h3 id=\"cloud_dataplex\">Cloud Dataplex</h3>\n<ul>\n<li>Promoted <code>gcloud dataplex data-products</code> to GA.</li>\n</ul>\n<h3 id=\"cloud_iam\">Cloud IAM</h3>\n<ul>\n<li>Added <code>gcloud iam workforce-pools subjects revoke-sessions</code> command to\nrevoke all sessions for a workforce pool subject.</li>\n</ul>\n<h3 id=\"cloud_on_demand_scanning\">Cloud On Demand Scanning</h3>\n<ul>\n<li>Migrate extraction library to osv-scalibr and enable dynamic linking support\n(2026-09).</li>\n</ul>\n<h3 id=\"cloud_resource_manager\">Cloud Resource Manager</h3>\n<ul>\n<li>The <code>--recommend</code> flag of <code>gcloud beta projects delete</code> and\n<code>gcloud beta projects remove-iam-policy-binding</code> no longer has any effect; the\nchange-risk recommendations it showed have been retired.</li>\n</ul>\n<h3 id=\"cloud_sql\">Cloud SQL</h3>\n<ul>\n<li>Added routing parameters to instance creation requests in Cloud SQL.</li>\n<li>Updated 'cloud-sql-proxy' packaged component to use 2.26.0 of the Cloud SQL Proxy.</li>\n</ul>\n<h3 id=\"cluster_director\">Cluster Director</h3>\n<ul>\n<li>Added <code>networkTags</code> property to <code>--slurm-login-node</code> flag in <code>gcloud beta cluster-director clusters create</code>.</li>\n</ul>\n<h3 id=\"compute_engine\">Compute Engine</h3>\n<ul>\n<li>Added support for reading a metadata value from standard input by\nspecifying <code>-</code> as the file path in <code>--metadata-from-file</code> flag of\n<code>gcloud compute instances create</code>, <code>gcloud compute instances\nadd-metadata</code>, <code>gcloud compute instance-templates create</code>, and <code>gcloud\ncompute project-info add-metadata</code>.</li>\n<li>Froze development of the <code>alpha</code> and <code>beta</code> Compute Engine release tracks.\nExisting commands in these release tracks remain supported and functional.\nMost previous alpha and beta features have graduated to general availability\nin <code>gcloud compute</code>, and new Compute Engine preview features will launch in\n<code>gcloud preview compute</code> going forward.</li>\n</ul>\n<h3 id=\"compute_os_config\">Compute OS Config</h3>\n<ul>\n<li>Added <code>--description</code> flag to <code>gcloud compute os-config policy-orchestrators\ncreate</code> and <code>gcloud compute os-config policy-orchestrators update</code>.</li>\n</ul>\n<h3 id=\"database_migration\">Database Migration</h3>\n<ul>\n<li>Added <code>--ssl-flags</code> flag to <code>gcloud database-migration connection-profiles\ncreate postgresql</code> and <code>update</code> commands to configure SSL connection flags.</li>\n<li>Added <code>--asm-host</code>, <code>--asm-port</code>, <code>--asm-user</code>, <code>--asm-password</code>, and\n<code>--asm-service-name</code> flags to <code>gcloud database-migration connection-profiles\ncreate oracle</code> command to configure Oracle Automatic Storage Management\n(ASM).</li>\n<li>Added <code>--machine-type</code> flag to\n<code>gcloud database-migration connection-profiles create alloydb</code> command to\nconfigure the primary instance machine type.</li>\n</ul>\n<h3 id=\"identity_and_access_management\">Identity and Access Management</h3>\n<ul>\n<li>The <code>--recommend</code> flag of <code>gcloud beta iam service-accounts delete</code> no longer\nhas any effect; the change-risk recommendations it showed have been retired.</li>\n</ul>\n<h3 id=\"kubernetes_engine\">Kubernetes Engine</h3>\n<ul>\n<li>Updated default kubectl from 1.35.8 to 1.35.9.</li>\n<li>Additional kubectl versions:\n<ul>\n<li>1.31.14</li>\n<li>1.32.13</li>\n<li>1.33.13</li>\n<li>1.34.12</li>\n<li>1.35.9</li>\n<li>1.36.5</li>\n<li>1.37.1</li>\n</ul></li>\n</ul>\n<h3 id=\"looker\">Looker</h3>\n<ul>\n<li>Added regional endpoint support for <code>gcloud looker</code>.</li>\n</ul>\n<h3 id=\"network_management\">Network Management</h3>\n<ul>\n<li>Updated examples of <code>gcloud network-management connectivity-tests</code>.</li>\n</ul>\n<h3 id=\"network_security\">Network Security</h3>\n<ul>\n<li>Added command <code>gcloud beta network-security server-tls-policies create</code>.</li>\n<li>Added command <code>gcloud beta network-security server-tls-policies update</code>.</li>\n</ul>\n<p>Subscribe to these release notes at <a href=\"https://groups.google.com/forum/#!forum/google-cloud-sdk-announce\">https://groups.google.com/forum/#!forum/google-cloud-sdk-announce</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Enterprise: Control access to Antigravity features</strong></p>\n<p>Administrators can control whether users in their organization have access to\nthe following Google Antigravity features:</p>\n<ul>\n<li><strong>Boost</strong>: Uses a tiered multi-agent hierarchy to solve complex algorithmic\nchallenges and deep debugging tasks with the <code>/boost</code> command. This feature\nis generally available (GA) in Antigravity.</li>\n<li><strong>Teamwork</strong>: Deploys a coordinated framework of autonomous subagents to\nexecute large-scale, long-horizon projects using the <code>/teamwork-preview</code>\ncommand. This feature is in Preview in Antigravity.</li>\n</ul>\n<p>These settings are generally available (GA) for administrators in\nGemini Enterprise.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings#configure-feature-settings\">Configure feature settings</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Nano Banana 2.1</strong></p>\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/nano-banana-2-1\">Gemini Nano Banana 2.1</a>\n(<code>gemini-nano-banana-2.1</code>) is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">General Availability (GA)</a>.\nGemini Nano Banana 2.1 is optimized for high-speed multimodal image generation\nand editing, offering improved visual quality, prompt adherence, and text\nrendering across <code>1K</code>, <code>2K</code>, and <code>4K</code> output resolutions.</p>\n<h2 class=\"release-note-product-title\">Security Command Center</h2>\n<h3>Deprecated</h3>\n<p>Artifact guard with CI/CD integration is deprecated. It will be shut\ndown on October 30, 2026.</p>"
