  "b917a31ea2baca2ae70462903132f54d":
    "id": "b917a31ea2baca2ae70462903132f54d"
    "title": "Introducing Google Cloud Modernize, transforming for (and with) AI"
    "link": "https://cloud.google.com/blog/products/infrastructure-modernization/google-cloud-modernize-accelerate-transformation-with-ai/"
    "published": "2026-10-06 01:00:00"
    "fetched": "2026-10-06 02:54:57"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we’re announcing</span> <a href=\"https://cloud.google.com/solutions/modernize\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Modernize</span></a><span style=\"vertical-align: baseline;\">, an end-to-end transformation portfolio to help enterprises collapse multi-year roadmaps with the power of AI.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Google Cloud Modernize</strong><span style=\"vertical-align: baseline;\"> brings together Google Cloud’s proven migration and modernization tools, including Migration Center, Google Cloud VMware Engine, </span><a href=\"https://cloud.google.com/solutions/mainframe-modernization?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Mainframe Modernization</span></a><span style=\"vertical-align: baseline;\"> and our new </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-agentic-migration?_gl=1*gf0ap9*_ga*MzIwOTk1MDYuMTc5MDI2ODQyMQ..*_ga_4LYFWVHBEB*czE3OTAzNDY4NzEkbzQkZzEkdDE3OTAzNDY4NzMkajU4JGwwJGgw&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">EKS-to-GKE Migration Agent</span></a><span style=\"vertical-align: baseline;\">, into a single portfolio. With it, enterprise teams now have purpose-built agentic capabilities across infrastructure assessment, platform modernization, and application modernization. </span></p>\n<p><span style=\"vertical-align: baseline;\">Central to this portfolio is </span><a href=\"https://console.cloud.google.com/modernization-hub\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Modernization Hub</strong></a><span style=\"vertical-align: baseline;\">, a newly launched in-console experience where developers and architects can analyze source code, map dependencies, and accelerate modernization for Java, .NET, and mainframe applications. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Agentic infrastructure assessment</span></h3>\n<p><span style=\"vertical-align: baseline;\">Every transformation begins with an accurate assessment. With new Gemini capabilities in</span> <a href=\"https://console.cloud.google.com/migration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Migration Center</span></a><span style=\"vertical-align: baseline;\">, the </span><strong style=\"vertical-align: baseline;\">Agentic Quick Estimator (GA)</strong><span style=\"vertical-align: baseline;\"> converts VMware inventory exports (such as RVTools) and infrastructure inputs into total cost of ownership (TCO) projections for your Compute Engine environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">Using an interactive chat interface, teams can test real-time modeling assumptions, such as evaluating multi-region footprints or comparing BYOL licensing against pay-as-you-go, to discover contextual cost optimizations. This condenses weeks of spreadsheet modeling into a defensible business case in minutes.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_7EZHDX9.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Migration Center’s Quick TCO Estimator and agentic chat interface</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For specialized support, we also provide a comprehensive modernization assessment at no cost through our</span> <a href=\"https://cloud.google.com/solutions/cloud-migration-program\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Rapid Migration &amp; Modernization Program (RaMP)</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Platform modernization</span></h3>\n<p><span style=\"vertical-align: baseline;\">With the rise of real-time AI agents querying backend systems, workloads increasingly require high-throughput infrastructure that removes I/O bottlenecks. Once you’ve defined your target environment using our assessments, there are several new purpose-built compute options for mission-critical workloads:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SAP S/4HANA at scale (X5 Series, GA):</strong><span style=\"vertical-align: baseline;\"> Delivers single-node 43 TiB memory configurations that remove the previous 29 TiB ceiling, allowing enterprise ERP estates to run without distributed partitioning overhead.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Core-optimized database performance (</strong><a href=\"https://cloud.google.com/blog/products/compute/compute-engine-m4n-vms?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">M4N Series, GA</strong></a><strong style=\"vertical-align: baseline;\">):</strong><span style=\"vertical-align: baseline;\"> Delivers 26.57 GiB RAM per vCPU paired with Hyperdisk Extreme. This prevents organizations from overprovisioning compute cores to meet memory requirements, reducing software licensing costs by more than 20% for Oracle and other core-licensed databases.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ultra-low latency data engines (</strong><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines#z4d_series\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Z4D, GA</strong></a><strong style=\"vertical-align: baseline;\"> and Z4M, Preview):</strong><span style=\"vertical-align: baseline;\"> Deliver up to 84,000 GiB and 168,000 GiB of high-speed local NVMe SSD respectively, 400 Gbps networking for both Z4D and Z4M, and RDMA support for Z4M. This throughput reduces I/O wait times and prevents query timeouts when real-time AI agents query vector stores, operational databases, and large-scale data pipelines.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Cloud elasticity for VMware environments</span></h4>\n<p><span style=\"vertical-align: baseline;\">For organizations operating VMware estates that need the elasticity of the cloud but aren’t ready to re-architect their environment, the </span><strong style=\"vertical-align: baseline;\">Google Cloud self-managed VMware solution </strong><span style=\"vertical-align: baseline;\">provides administrative control on Bare Metal Z3 shapes with VMware Cloud Foundation (VCF) 9.1. Native global VPC links connect VMware estates directly to Compute Engine, </span><a href=\"https://cloud.google.com/kubernetes-engine?utm_source=gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE), BigQuery, and Gemini Enterprise, allowing teams to ground autonomous agents in operational data without code changes.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Automated container transitions to GKE</span></h4>\n<p><span style=\"vertical-align: baseline;\">The new </span><strong style=\"vertical-align: baseline;\">EKS-to-GKE Agentic Migration</strong><span style=\"vertical-align: baseline;\"> (Public Preview) automates transitions from AWS Elastic Kubernetes Service to</span> <a href=\"https://cloud.google.com/kubernetes-engine?utm_source=gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE</span></a><span style=\"vertical-align: baseline;\"> thanks to: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">An automated pipeline:</strong><span style=\"vertical-align: baseline;\"> Manages discovery, Kubernetes manifest translations, storage and network mappings across clouds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise-grade security:</strong><span style=\"vertical-align: baseline;\"> Built-in Human-in-the-Loop (HITL) approval gates and in-memory credential security maintain strict GitOps compliance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A fast-track to modern runtimes:</strong><span style=\"vertical-align: baseline;\"> Quickly moves workloads to GKE to take advantage of low-latency model serving, autoscaling, and multi-agent orchestration.</span></p>\n</li>\n</ul>\n<p><a href=\"https://cloud.google.com/customers/netease-games\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NetEase Games</span></a><span style=\"vertical-align: baseline;\"> demonstrated the value of this platform approach by containerizing services on GKE, reducing infrastructure scaling times from hours to five minutes during peak launches while cutting server costs by 40%:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"By integrating diverse computing instances and powerful orchestration, we have transformed our infrastructure into a competitive advantage, ensuring NetEase remains a leader in the global gaming market.\"</span><span style=\"vertical-align: baseline;\">  - </span><strong style=\"vertical-align: baseline;\">Deng Ding</strong><span style=\"vertical-align: baseline;\">, Director of Site Reliability Engineering, NetEase Games</span></p>\n<h3><span style=\"vertical-align: baseline;\">Application modernization with Modernization Hub</span></h3>\n<p><span style=\"vertical-align: baseline;\">Landing on modern infrastructure enables teams to unlock legacy business logic and modernize their core applications. </span><a href=\"https://console.cloud.google.com/modernization-hub\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Modernization Hub</strong></a><span style=\"vertical-align: baseline;\"> centralizes several modernization tools directly inside the Google Cloud console. </span></p>\n<h4><span style=\"vertical-align: baseline;\">.NET and Java modernization</span></h4>\n<p><span style=\"vertical-align: baseline;\">Modernization Hub integrates the </span><strong style=\"vertical-align: baseline;\">Google Cloud</strong> <a href=\"https://docs.cloud.google.com/migration-center/docs/app-modernization-assessment?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">App Modernization CLI</strong></a><strong style=\"vertical-align: baseline;\"> (CodMod)</strong><span style=\"vertical-align: baseline;\">, which uses Gemini to analyze large source code repositories, understand legacy application architectures,maps hidden dependencies, identifies modernization challenges and generates modernization recommendations. This enables customers to migrate legacy .NET Framework applications to modern .NET Core  running on Linux containers, reducing OS licensing overhead, while also making these applications and data accessible to modern AI agent workflows.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Modernization_Hub_Take3.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Modernization Hub’s in-console interface</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Mainframe modernization</span></h4>\n<p><span style=\"vertical-align: baseline;\">For customers running mainframes, we provide specialized solutions to help accelerate and de-risk end-to-end application transformation to Google Cloud:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mainframe-assessment-tool/docs/overview?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mainframe Assessment Tool</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Parses legacy mainframe codebases, extracts business rules, maps application and data dependencies to generate cloud-ready target application specifications and power agentic modernization workflows.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mainframe-dual-run/docs/dual-run-overview?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Dual Run</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Substantially reduces cutover risk by replaying live production transaction streams simultaneously across the mainframe and the new cloud applications, verifying functional equivalence before going live. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mainframe-connector/docs/overview?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mainframe Connector</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Copies mainframe data directly into Google Cloud services (BigQuery, AlloyDB, GCS and others), , unlocking legacy data and supports hybrid architectures.</span></p>\n</li>\n</ul>\n<p><a href=\"https://www.youtube.com/watch?v=KxCIByjwVJg&amp;utm_source=gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intesa Sanpaolo</span></a><span style=\"vertical-align: baseline;\"> used Google Cloud mainframe modernization solutions to accelerate their core banking transformation off the mainframe and onto Google Cloud:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“To confidently move forward with Mainframe Modernization, we will need to provide confidence and assure the bank's leadership and internal control units as well as get approval from the regulators. One of the enablers for this is Google Cloud Dual Run, which is gradually providing the evidences to build such confidence to all three groups.”</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Claudio Balbo</strong><span style=\"vertical-align: baseline;\">, Head of IT Architecture, Intesa Sanpaolo</span></p>\n<h3><span style=\"vertical-align: baseline;\">A proven track record and partner ecosystem</span></h3>\n<p><a href=\"https://cloud.google.com/customers/deutsche-boerse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deutsche Börse Group</span></a><span style=\"vertical-align: baseline;\"> transitioned its mission-critical SAP S/4HANA environment and DAX® index calculations to Google Cloud, cutting disaster recovery times from hours to minutes, reducing aggregation latency by over 50%, and shortening development cycles from months to days.</span></p>\n<p><span style=\"vertical-align: baseline;\">To deliver these capabilities at enterprise scale, we are also collaborating with our global partner ecosystem to integrate Google Cloud Modernize with enterprise delivery frameworks, including </span><a href=\"https://www.cognizant.com/us/en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cognizant</span></a><span style=\"vertical-align: baseline;\">:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Google’s modernization offering heralds the next frontier of AI-native modernization — enabling enterprises to autonomously decode legacy complexity and accelerate into cloud-first, intelligent architectures. Coupled with Cognizant's AI-led, governed delivery engine, we amplify this shift through agentic business processing, unlocking faster, outcome-driven value at scale.” </span><span style=\"vertical-align: baseline;\">- </span><strong style=\"vertical-align: baseline;\">Nishant Upadhyaya</strong><span style=\"vertical-align: baseline;\">, Global Practice Head – Digital Engineering, Cognizant</span></p>\n<h3><span style=\"vertical-align: baseline;\">Accelerate your transformation now</span></h3>\n<p><span style=\"vertical-align: baseline;\">Modernizing your infrastructure and applications is the baseline requirement for enterprise AI agility. Google Cloud Modernize equips teams to navigate each phase safely and efficiently as they pursue AI readiness and adoption.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Get started:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Join the webinar:</strong><span style=\"vertical-align: baseline;\"> Register for our </span><a href=\"https://cloudonair.withgoogle.com/events/adaptive-enterprise-accelerating-app-mod-infra\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">upcoming session on November 17</span></a><span style=\"vertical-align: baseline;\"> to see live demos of Modernization Hub and our agentic migration tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the console:</strong><span style=\"vertical-align: baseline;\"> Log into the Google Cloud Modernize console to access </span><a href=\"https://console.cloud.google.com/modernization-hub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Modernization Hub</span></a><span style=\"vertical-align: baseline;\">.   </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start planning:</strong><span style=\"vertical-align: baseline;\"> Visit the Google Cloud Modernize</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/solutions/modernize\"><span style=\"text-decoration: underline; vertical-align: baseline;\">webpage</span></a><span style=\"vertical-align: baseline;\">, or request a </span><a href=\"https://cloud.google.com/resources/migration-assessment-offer\"><span style=\"text-decoration: underline; vertical-align: baseline;\">modernization assessment</span></a><span style=\"vertical-align: baseline;\"> at no cost today.</span></p>\n</li>\n</ul></div>"
  "651f2df8cb05e2a9f38433b176714884":
    "id": "651f2df8cb05e2a9f38433b176714884"
    "title": "Where mission meets moonshot: Join us at the Google Public Sector Summit 2026"
    "link": "https://cloud.google.com/blog/topics/public-sector/where-mission-meets-moonshot-join-us-at-the-google-public-sector-summit-2026/"
    "published": "2026-10-06 16:00:00"
    "fetched": "2026-10-07 03:00:24"
    "summary": "<div class=\"block-paragraph\"><p>Across the public sector, the question has shifted from “what’s possible?” to “how can we drive mission impact?” We’ll be answering this question at the <a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\">Google Public Sector Summit</a> on October 20th at the Ronald Reagan Building in Washington, D.C.</p><p>This year’s summit brings together public sector leaders, creators, and builders to architect what’s next and bridge the gap between ambitious innovation and secure, scaled execution. Together, we’ll explore how public sector organizations are harnessing Google’s secure, integrated AI stack—encompassing everything from planet-scale infrastructure to leading models and agentic platforms—to turn ambitious moonshot aspirations into real-world outcomes that drive mission impact.</p><p>The Google Public Sector Summit is a celebration of what’s possible when human ambition and powerful technology come together in support of mission. Keep reading for a preview of the event, and how to make the most of your onsite experience.</p><h3><b>Opening Keynote: Where Mission Meets Moonshot</b></h3><p>Get inspired during our opening keynote which will feature <b>Karen Dahut</b>, CEO of Google Public Sector,<b> Thomas Kurian</b>, CEO of Google Cloud, and <b>Chris Hein</b>, Field CTO of Google Public Sector. They will share real-world customer examples and live product demonstrations that showcase Google’s technology in action across the public sector. Attendees will also get the opportunity to hear from public sector leaders who are collaborating with Google and applying technology to transform missions and power moonshots.</p><h3><b>General Session: Cloud Talks</b></h3><p>Join <b>Elizabeth Moon</b>, Managing Director of Customer Engineering for Google Public Sector, as she hosts a series of talks that dive deeper into the critical pillars of public sector transformation including infrastructure, AI, and security. Hear from <b>Rich Sanzi,</b> VP of Engineering for Google Cloud, <b>Michael Gerstenhaber</b>, VP of Product Management for Gemini, and <b>Sandra Joyce</b>, VP of Google Threat Intelligence, as they share strategies for establishing an infrastructure foundation for the agentic era, building safely with Google’s platforms, and implementing proactive defense at planet scale.</p><h3><b>Breakouts: Panel Discussions and Birds of a Feather</b></h3><p>Hear from Google Public Sector executives, industry partners, and leaders across defense, federal civilian, higher education, and state and local government through a series of panels and birds of a feather discussions.</p><ul><li><b>From fragmented to fluid: Connecting data to build the agentic future.</b> Moderated by <b>Tony Orlando,</b> Managing Director of Partner and Specialty Sales, this session will explore how agencies can break down legacy data silos and build a unified, AI-ready data foundation. Speakers include <b>Andrew Mapes</b>, CDAO Principal Deputy Chief Digital and AI Officer, <b>Dr. Neil Jacobs</b>, NOAA Administrator and Undersecretary of Commerce for Oceans and Atmosphere, and <b>Scott Alfieri</b>, Accenture Global Lead for the Google Business Group. An additional speaker, <b>Adarryl Roberts</b>, DLA CIO, has been invited.</li><li><b>Automating defense: Securing the agentic era against complex threats.</b> Moderated by <b>Ron Bushar</b>, Managing Director and Chief Security Officer, panelists will discuss how they’re applying autonomous AI and threat intelligence to protect dynamic environments at machine speed. Speakers include <b>Justin Fanelli</b>, U.S. Navy CTO, <b>Jamie Wolff</b>, DOE-NNSA CIO, Vice Admiral (Ret.) <b>TJ White</b>, Texas Cyber Command Chief, and <b>Thomas Browning</b>, Rhombus Power Senior Vice President of Strategic Capabilities.</li><li><b>The agentic era: Advancing missions and transforming the way we work.</b> Moderated by <b>Elizabeth Moon</b>, this session will highlight how secure, cost-efficient agentic capabilities can scale impact and advance missions. Featured speakers include <b>Barry J. Schindler</b>, USPTO Acting Commissioner for Patents, <b>Miro Humer</b>, Case Western Reserve University CIO, and <b>Todd Johnston</b>, Deloitte Managing Director, AI &amp; Engineering and Defense, Security &amp; Justice AI/Analytics Leader.</li><li><b>Interactive Birds of a Feather discussions.</b> Connect directly with a small group of peers and Google experts to address critical mission blockers, share best practices, and accelerate your agency's journey beyond the pilot stage. Join discussions across a range of topics including tokenomics, migration, and compliance.</li></ul><h3><b>Demos, Lightning Talks and Labs</b></h3><p>Experience Google’s innovations through hands-on labs, Lightning Talks, and demos taking place in the Mission Exchange on the showfloor. Topics will include agentic threat defense, multimodal AI citizen services, and legacy database modernization with AI.</p><p>Attendees can also join two expert-led labs:</p><ul><li><b>Getting Started with Gemini:</b> This introductory lab will guide participants through the fundamentals of Gemini and Gemini Notebook to summarize documents, search data and streamline daily tasks. No technical background required.</li><li><b>Build Gemini Agents: From Prompt to Prototype:</b> This lab will help you bring your real-world agency use cases to life by building an AI agent with Gemini, with support from Google Cloud specialists.</li></ul><p>Throughout the day, we will host Lightning Talks, which are dynamic 20-minute presentations featuring live demos and interactive Q&amp;A that take place on the showfloor. These talks feature partner and customer speakers and showcase the \"art of the practical\" through live, real-world solutions.</p><h3><b>Closing Session: What’s Your Moonshot?</b></h3><p>Join us for an inspirational closing session that I’ll moderate with a special guest: NASA Administrator <b>Jared Isaacman</b>. Together, we’ll define what a moonshot means for the public sector in the agentic era and share strategies for fostering a culture of courageous problem-solving and applying technology to supercharge human ambition and ingenuity.</p><h3><b>Register for the Google Public Sector Summit</b></h3><p>Beyond the personalized programming and practical hands-on experiences, attendees will leave the event with a customized action plan for driving impact in their organization. <a href=\"https://events.govexec.com/google-public-sector-summit/register/\" target=\"_blank\">Register today</a> for the Google Public Sector Summit to gain the strategies, skills, and inspiration to turn your moonshot aspirations into a reality. Join us as we build what’s next for the public sector, together.</p></div>"
  "f6404b607e06962ca5cbc04427568f25":
    "id": "f6404b607e06962ca5cbc04427568f25"
    "title": "AlloyDB: A unified database engine for hybrid search"
    "link": "https://cloud.google.com/blog/products/databases/simplify-ai-search-with-alloydb-hybrid-search-and-rrf/"
    "published": "2026-10-06 16:00:00"
    "fetched": "2026-10-07 03:00:24"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For modern AI and RAG applications, achieving high search relevance requires that you combine at least two techniques: vector search for semantic context, and full-text search (FTS) for keyword precision. While AlloyDB for PostgreSQL supports both of these capabilities, managing them has traditionally required a more hands-on operational approach to ensure peak performance.</span></p>\n<p><span style=\"vertical-align: baseline;\">The challenge is not executing the searches, but the subsequent fusion of result sets. Merging results from the vector query (distance scores) and the FTS query (relevance scores) requires complex SQL queries or custom code in the application layer. This often means maintaining a separate system for fusion, score normalization, and re-ranking.</span></p>\n<p><span style=\"vertical-align: baseline;\">This article details how AlloyDB AI's hybrid search eliminates this complexity. We will explore how recent updates allow you to:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simplify hybrid search:</strong><span style=\"vertical-align: baseline;\"> Consolidate complex SQL queries, or multi-step application workflows into a single, high-performance SQL function powered by Reciprocal Rank Fusion (</span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search#rank-fusion\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RRF</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optimize FTS performance:</strong><span style=\"vertical-align: baseline;\"> Use the new RUM extension to achieve low-latency relevance ranking and efficient phrase matching by storing word positions directly in the index.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Leverage industry-standard ranking:</strong><span style=\"vertical-align: baseline;\"> Utilize the </span><a href=\"https://cloud.google.com/blog/products/databases/native-bm25-search-in-alloydb-and-cloud-sql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new natively supported BM25 index</span></a><span style=\"vertical-align: baseline;\"> for superior keyword-based scoring directly out of the box.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Expand search versatility:</strong><span style=\"vertical-align: baseline;\"> Execute queries against specialized external clusters, including Elasticsearch, OpenSearch, and Solr, using the new external search Foreign Data Wrapper (FDW) without leaving the AlloyDB environment.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">The problem of the multi-step workflow</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Before AlloyDB AI's native solution, achieving robust hybrid search was very demanding, especially for developers trying to keep this logic within the database using standard SQL. This approach required multi-step orchestration that was not only difficult to manage and maintain for two sources, but became virtually impossible to scale as additional sources were added. These steps included:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Executing vector search:</strong><span style=\"vertical-align: baseline;\"> Run a query using a vector column or vector index (for AlloyDB this can be a ScaNN index) to find top k results, generating vector scores.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Executing the FTS query:</strong><span style=\"vertical-align: baseline;\"> Run FTS query e.g. by using a generalized inverted index, or GIN, to find top k results.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Normalizing scores (the brittle step):</strong><span style=\"vertical-align: baseline;\"> Write complex SQL logic or custom application code to map both result sets onto a common scale. This logic is prone to breaking when data distributions change.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Performing cross-service joins and re-rankings:</strong><span style=\"vertical-align: baseline;\"> Use application memory to perform a complex </span><span style=\"vertical-align: baseline;\">FULL OUTER JOIN</span><span style=\"vertical-align: baseline;\"> on document IDs, apply a weighted summation of the normalized scores, and finally sort the combined results in cases where the FTS search was done in a separate system than the one used for vector search.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">This decentralized approach led to fragile score logic, increased latency, high operational load, and a dependency on application expertise for maintaining search quality.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_XqX6b2x.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Simplifying hybrid search architectures with AlloyDB</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The key to simplifying this is to adopt RRF, which, because it is inherently rank-based, cleverly bypasses the brittle step of score normalization entirely. RRF consists of two parts:</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. The single source of truth</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Instead of a multi-step fetch and join process, you simply call one SQL function, providing your search components as a declarative JSON array:</span></p>\n<p><span style=\"vertical-align: baseline;\">SQL</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT id, score \\r\\nFROM ai.hybrid_search(\\r\\n    search_inputs =&gt; ARRAY[\\r\\n        -- Vector Component (Semantic) with dynamic embedding generation from natural language\\r\\n        $json${\\r\\n            &quot;data_type&quot;: &quot;vector&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;table_name&quot;: &quot;documents&quot;,\\r\\n            &quot;key_column&quot;: &quot;doc_id&quot;,\\r\\n            &quot;vec_column&quot;: &quot;embedding&quot;,\\r\\n            &quot;distance_operator&quot;: &quot;&lt;=&gt;&quot;,\\r\\n            &quot;query_vector&quot;: &quot;ai.embedding(\\&#x27;text-embedding-005\\&#x27;, \\&#x27;alloydb search\\&#x27;)::vector&quot;\\r\\n        }$json$::jsonb,\\r\\n        \\r\\n        -- Text Component (Keyword)\\r\\n        $json${\\r\\n            &quot;data_type&quot;: &quot;text&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;table_name&quot;: &quot;documents&quot;,\\r\\n            &quot;key_column&quot;: &quot;doc_id&quot;,\\r\\n            &quot;text_column&quot;: &quot;content&quot;,\\r\\n            &quot;query_text_input&quot;: &quot;alloydb search&quot;\\r\\n        }$json$::jsonb\\r\\n    ]\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3522fe7a50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">(Note: The unified </span><code style=\"vertical-align: baseline;\">ai.hybrid_search</code><span style=\"vertical-align: baseline;\"> API isn't limited to just two components. It also natively supports external search sources via the new FDW).</span></p>\n<h4><strong style=\"vertical-align: baseline;\">2. Database-native orchestration</strong></h4>\n<p><span style=\"vertical-align: baseline;\">The </span><span style=\"vertical-align: baseline;\">hybrid_search()</span><span style=\"vertical-align: baseline;\"> function executes the entire workflow in a single query plan, minimizing overhead and helping ensure transaction consistency. It uses:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dynamic CTE generation:</strong><span style=\"vertical-align: baseline;\"> The function constructs dynamic SQL, creating Common Table Expressions (CTEs) for each component. Each CTE is responsible for calculating the positional rank (</span><span style=\"vertical-align: baseline;\">ROW_NUMBER()</span><span style=\"vertical-align: baseline;\">) of its results.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Kernel-level fusion:</strong><span style=\"vertical-align: baseline;\"> All ranked component results are immediately combined using a </span><span style=\"vertical-align: baseline;\">FULL OUTER JOIN</span><span style=\"vertical-align: baseline;\"> based on the document ID.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Final RRF score:</strong><span style=\"vertical-align: baseline;\"> The combined ranks are used to calculate the final, unified score using the RRF formula:</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_bAjNPuH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">By taking this approach, brittle score calculations and application-side joins become unnecessary. While Reciprocal Rank Fusion (RRF) is our current ranking algorithm, we intend to introduce additional merging and ranking options down the road.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_534j9B2.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">The result: Performance and operational simplicity</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Moving from complex external workflows to native SQL functions provides immediate, measurable benefits:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Metric</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-step application workflow (simulated by manual SQL)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB AI-native hybrid_search() UDF</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Code complexity</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Complex score normalization functions, service calls, and application joins.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Zero external logic; a single, declarative SQL call.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Maintenance</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Constant tuning of normalization formulas.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">No tuning required; RRF is rank-based and distribution-agnostic.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">Enhancing FTS performance: The RUM extension</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB AI's </span><span style=\"vertical-align: baseline;\">hybrid_search()</span><span style=\"vertical-align: baseline;\"> function is designed to deliver comprehensive search relevance by combining high-performance vector search with FTS. While AlloyDB's native FTS capabilities are powerful, reliance on the standard PostgreSQL GIN index for the text component can present a bottleneck for advanced operations.</span></p>\n<p><span style=\"vertical-align: baseline;\">The challenge with GIN indexes is that they do not store the positional information of words. This limitation forces costly table scans to re-analyze content for:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Relevance ranking:</strong><span style=\"vertical-align: baseline;\"> Calculating search result scores based on word proximity and frequency</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Phrase searching:</strong><span style=\"vertical-align: baseline;\"> Finding exact word order, which requires positional information.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Introducing the RUM extension for low-latency FTS</span></h4>\n<p><span style=\"vertical-align: baseline;\">The </span><strong style=\"vertical-align: baseline;\">RUM extension</strong><span style=\"vertical-align: baseline;\"> is a powerful index access method based on GIN that directly resolves these performance issues.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">RUM's core advantage:</strong><span style=\"vertical-align: baseline;\"> Unlike the GIN index (which maps </span><span style=\"vertical-align: baseline;\">word -&gt; [docID]</span><span style=\"vertical-align: baseline;\">), the RUM index stores the positional information of each word directly within the index (e.g., </span><span style=\"vertical-align: baseline;\">word -&gt; [(docID1, [pos])], ...</span><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Performance benefits:</strong><span style=\"vertical-align: baseline;\"> This allows RUM to perform complex operations like ranking and phrase matching predominantly within the index itself, avoiding expensive heap scans. RUM provides significantly faster relevance ranking and efficient phrase and proximity searches.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Great for hybrid search:</strong><span style=\"vertical-align: baseline;\"> RUM is a critical complement to vector search (like ScaNN) within a hybrid search framework, as GIN’s potential latency makes it less suitable for a real-time hybrid approach.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The RUM extension is an excellent choice for ranking-heavy or high-concurrency search applications. By storing word positions directly in the index, RUM cuts out the need to re-scan table pages during ranking, giving you fast and sorted results. However, it comes with some trade-offs: slower index builds and a larger disk footprint. If your workload prioritizes quick queries and precise ranking over write speeds and storage density, RUM is an investment that's well worth it.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Measurable gains and integration</span></h4>\n<p><span style=\"vertical-align: baseline;\">Adopting RUM directly bolsters the performance of FTS in AlloyDB, showing considerable gains for raw FTS queries, as well as gains on hybrid search that includes FTS queries. Below are performance statistics showing the speedup between using RUM compared to GIN on various </span><a href=\"https://github.com/beir-cellar/beir\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BEIR</span></a><span style=\"vertical-align: baseline;\"> datasets.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_rFbNdqQ.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>(Performance based on tests using the <a href=\"https://github.com/beir-cellar/beir\">BEIR Natural Questions benchmark</a>.)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">RUM integrates with the specialized </span><span style=\"vertical-align: baseline;\">&lt;=&gt;</span><span style=\"vertical-align: baseline;\"> distance operator for search and ranking, which is supported for use in hybrid search SQL calls, delivering the best of both worlds. The following </span><a href=\"https://codelabs.developers.google.com/next26/alloydb-ai-hybrid-search\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">codelab </span></a><span style=\"vertical-align: baseline;\">shows how to configure and use the RUM index with the Hybrid Search UDF. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Introducing BM25 Index: The modern ranking standard</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We recently introduced the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-bm25-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BM25 index</span></a><span style=\"vertical-align: baseline;\"> to CloudSQL and  AlloyDB in preview, bringing the industry-standard relevance ranking via the </span><span style=\"vertical-align: baseline;\">pg_textsearch </span><span style=\"vertical-align: baseline;\">extension</span><span style=\"vertical-align: baseline;\">. BM25 uses </span><a href=\"https://en.wikipedia.org/wiki/Tf%E2%80%93idf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TF-IDF</span></a><span style=\"vertical-align: baseline;\">, which accounts for term frequency saturation and document length normalization, delivering significantly higher precision and quality for keyword-based search queries. By leveraging native BM25 indexes within AlloyDB AI, you can achieve superior ranking accuracy out of the box, so that exact-term matches and critical keywords score well without having to implement external search engines or complex custom scoring logic.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Install pg_textsearch extension\\r\\nCREATE EXTENSION pg_textsearch;\\r\\n\\r\\n-- Create the native BM25 index on the content column\\r\\nCREATE INDEX idx_docs_bm25 \\r\\nON cymbal_products \\r\\nUSING bm25 (product_description) \\r\\nWITH (text_config=&#x27;english&#x27;);\\r\\n\\r\\n-- Full text search query\\r\\nSELECT product_name, product_description &lt;@&gt; &#x27;cherry tree&#x27; AS bm25_score \\r\\nFROM cymbal_products\\r\\nORDER BY bm25_score \\r\\nLIMIT 5;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3522b19b10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">External search: Extending versatility with foreign data wrappers</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To further extend search capabilities, we also introduced the external search Foreign Data Wrapper (</span><a href=\"https://docs.cloud.google.com/alloydb/docs/reference/extensions#fdw-extensions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">FDW</span></a><span style=\"vertical-align: baseline;\">) in AlloyDB AI. This lets you execute full-text searches against specialized external clusters, starting with Elasticsearch, OpenSearch, and Solr, and provides several key architectural advantages:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optimized retrieval:</strong><span style=\"vertical-align: baseline;\"> Leverage ranking algorithms and a richer feature set from dedicated search backends without leaving the AlloyDB environment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified SQL interface:</strong><span style=\"vertical-align: baseline;\"> Interact with external data, perform joins, and meld results using standard PostgreSQL SQL without losing the expressiveness of advanced FTS queries.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strong portability:</strong><span style=\"vertical-align: baseline;\"> Maintain existing search infrastructure while benefiting from the simplified hybrid architecture offered by AlloyDB AI.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">The following codelabs are e</span><span style=\"vertical-align: baseline;\">nd-to-end code guides walking through hybrid search with </span><a href=\"https://codelabs.developers.google.com/next26/alloydb-elastic?hl=en#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Elasticsearch</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://codelabs.developers.google.com/alloydb-solr-fdw?hl=en#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Solr</span></a><span style=\"vertical-align: baseline;\"> integrations.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">A unified architecture for AI-powered search</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The true challenge of modern search is not technical in nature, but in achieving architectural simplicity and sustained operational stability. AlloyDB AI addresses this with a unified platform built on three core innovations:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simplifying hybrid search:</strong><span style=\"vertical-align: baseline;\"> AlloyDB AI’s hybrid search function, powered by RRF, transforms a fragile, multi-step application workflow into a single, high-performance SQL call. This native implementation eliminates the need for complex score normalization and application-side joins, drastically lowering the operational and engineering cost while delivering consistently accurate and fast hybrid relevant results.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optimizing FTS performance:</strong><span style=\"vertical-align: baseline;\"> To ensure the FTS component of Hybrid Search meets diverse application demands, AlloyDB AI offers distinct full-text search options. The RUM extension optimizes for low-latency performance by storing positional data directly in the index to enable faster relevance ranking and efficient phrase searches</span><strong style=\"vertical-align: baseline;\"> — </strong><span style=\"vertical-align: baseline;\">important when you need fast query speeds. Alternatively, the BM25 index provides industry-standard relevance ranking, and is the preferred choice when prioritizing keyword scoring precision. You can select between these options depending on whether your focus is search latency or ranking precision.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enhancing versatility through external search:</strong><span style=\"vertical-align: baseline;\"> The addition of the external search through FDW extends AlloyDB’s reach to specialized search backends like Elasticsearch. This lets you leverage the superior scale and advanced retrieval features of dedicated search clusters while maintaining a familiar PostgreSQL interface. By integrating these external results directly into the hybrid search framework, AlloyDB AI ensures that you can combine even the most massive text repositories with vector-based semantic insights.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">By consolidating the complexity of scoring, joining, and re-ranking within the database kernel, and offering a dual-path approach to FTS — leveraging RUM for optimized, low-latency, internal FTS or external search for specialized, scalable backends — AlloyDB AI delivers a robust and self-contained search foundation. This coexistence is essential to the overall hybrid search story, providing the flexibility to choose the optimal path based on workload, data volume, and existing infrastructure. Now, you can focus on building intelligent application features, confident that your search architecture is both highly performant and easy to maintain.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Watch it in action</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Watch how AlloyDB is the </span><a href=\"https://www.youtube.com/watch?v=vYB0P9rPXt8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ultimate hybrid search engine</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Learn about </span><a href=\"https://www.youtube.com/watch?v=-JxQb-kjFHk\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BM25 support in AlloyDB</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ready to bring more speed and cost-efficiency to your AI workloads?</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New to AlloyDB?</strong><span style=\"vertical-align: baseline;\"> Discover AlloyDB with a </span><a href=\"https://docs.cloud.google.com/alloydb/docs/free-trial-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">30-day free trial</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Getting started with hybrid search</strong><span style=\"vertical-align: baseline;\">: Set up a </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/full-text-search-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">text-search index</span></a><span style=\"vertical-align: baseline;\"> and select a </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/choose-index-strategy\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vector search index</span></a><span style=\"vertical-align: baseline;\">. Once these are created, you can find some </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">examples</span></a><span style=\"vertical-align: baseline;\"> to perform various hybrid search queries.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">External search</strong><span style=\"vertical-align: baseline;\">: Create a foreign data wrapper and foreign table in AlloyDB to query external data from </span><a href=\"https://docs.cloud.google.com/alloydb/docs/elastic-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Elasticsearch</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/alloydb/docs/solr-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Solr</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://docs.cloud.google.com/alloydb/docs/opensearch\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenSearch</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
  "ff29ee82394736157e32d0710d190062":
    "id": "ff29ee82394736157e32d0710d190062"
    "title": "Networking for AI inference model serving - GKE only and for all other backends"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/networking-for-ai-inference-model-serving-gke-only-and-for-all-other-backends/"
    "published": "2026-10-06 21:00:00"
    "fetched": "2026-10-07 07:53:17"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Enterprises and individual developers frequently run multiple AI inference models. The right architecture can simplify how the models are called while also providing centralized governance. </span><span style=\"vertical-align: baseline;\">In this post, we'll look at two reference architectures focused on networking AI inference model serving: one for </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE)</span></a><span style=\"vertical-align: baseline;\"> and one all other backend types. First, we'll explore the commonalities between the reference architectures that you'll see later. Then we'll explore unique components of the architecture for GKE backends and finally, we'll go over the elements of the architecture for all backend types.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">The entry point</strong></h2>\n<p><span style=\"vertical-align: baseline;\">You can expose your model deployment behind a stable, secure, and reliable entry point that acts as the front end for inference calls. This entry point also acts as a control zone where policy, security, and logic can be enforced. </span><span style=\"vertical-align: baseline;\">Both the Cloud Load balancer and the Inference Gateway provide entry point capability. These types of endpoints can terminate secure connections with TLS, integrate with API management components, extend functionally with service extensions, and capitalize on capabilities of Model Armor for added security.  </span></p>\n<h2><span style=\"vertical-align: baseline;\">Common services in the designs </span></h2>\n<p><span style=\"vertical-align: baseline;\">Both reference designs use these services:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/vpc/docs/private-service-connect#endpoints\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Private Service Connect inference endpoint</strong></a><span style=\"vertical-align: baseline;\">: Anchors the entry point inside your consumer Virtual Private Cloud (VPC) network. Traffic hits a private internal </span><a href=\"https://docs.cloud.google.com/vpc/docs/subnets#valid-ranges\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IP address</span></a><span style=\"vertical-align: baseline;\">, keeping inference calls in your private network.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/get-started/what-apigee\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Apigee API Management</strong></a><strong style=\"vertical-align: baseline;\"> (Optional)</strong><span style=\"vertical-align: baseline;\">: Integrates via an Apigee Extension Processor callout to handle client identity verification, rate limits, and quota enforcement before requests ever reach compute resources.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/model-armor/overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</strong></a><span style=\"vertical-align: baseline;\">: Serves as an inline AI safety checkpoint, screening prompts and output completions against prompt injection and sensitive data leakage.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Design pattern serving on GKE only</strong></h2>\n<p><span style=\"vertical-align: baseline;\">This section focuses on a GKE-only backend design.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">To understand the full end-to-end concept, please read the entire architecture document </span><a href=\"https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Networking for AI inference model serving on GKE</strong></a><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">The design pattern is based on this diagram:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"networking-ai-inference-model-serving-gke-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/networking-ai-inference-model-serving-gke-.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In addition to the common services identified in the previous section, the design for GKE uses these components:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</strong></a><span style=\"vertical-align: baseline;\">: Deployed as an internal Application Load Balancer (</span><code style=\"vertical-align: baseline;\">gke-l7-rilb</code><span style=\"vertical-align: baseline;\">). It acts as a specialized ingress engine that parses incoming request payloads, evaluates HTTPRoute rules, and steers queries to appropriate model-serving targets.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inference pools</strong><span style=\"vertical-align: baseline;\">: A logical group containing replicas of the same model. When the Gateway receives a prompt, it evaluates HTTPRoute rules to select the appropriate inference pool based on the model identifier. Pools have an initial size and can be configured to autoscale dynamically.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model replica sets</strong><span style=\"vertical-align: baseline;\">: Individual model replicas (inference server instances) deployed across single-node or multi-node GPU or TPU node pools. A replica set represents a uniform group of these model replicas.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">The traffic flow GKE example</strong></h3>\n<p><span style=\"vertical-align: baseline;\">A client application that uses this GKE-based architecture to call a backend model would go through a flow like this:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ingress</strong><span style=\"vertical-align: baseline;\">: A client application in the consumer VPC issues an OpenAI-compatible API call to the local Private Service Connect endpoint, routing directly to the GKE Inference gateway using a regional internal Application Load Balancer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Payload inspection</strong><span style=\"vertical-align: baseline;\">: The Gateway reads the target model parameter specified in the request body and adds it to the HTTP headers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Control plane validation</strong><span style=\"vertical-align: baseline;\">: If Apigee is used, it checks client credentials and quotas. Model Armor screens the prompt for policy violations or data leakage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Backend selection</strong><span style=\"vertical-align: baseline;\">: The Gateway evaluates HTTPRoute mappings to identify the target pool, matches shared prefix cache context, and routes to the lowest-load GPU or TPU replica based on real-time Prometheus data.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Egress</strong><span style=\"vertical-align: baseline;\">: The replica runs the inference workload. Output tokens pass through Model Armor for final response verification before streaming back over the private connection.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Design pattern serving on all backends</strong></h2>\n<p><span style=\"vertical-align: baseline;\">This section focuses on multiple backend types which can be used for inference, and it provides an overview of the architecture in the following diagram.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">To understand the full end-to-end concept, please read the entire architecture document </span><a href=\"https://docs.cloud.google.com/architecture/networking-for-ai-inference\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Networking for AI inference model serving on all backends</strong></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"networking-ai-inference-model-serving-all-backends\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/networking-ai-inference-model-serving-all-.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For architectures spanning mixed environments such as GKE, Cloud Run, Agent Platform, on-premises data centers, or external clouds, these additional components are used:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/load-balancing/docs/l7-internal#load-balancer-mode\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Regional internal Application Load Balancer</strong></a><span style=\"vertical-align: baseline;\">: Serves as the central Layer 7 routing proxy that manages routing logic, SSL termination, and Service Extensions callouts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/llm-d/llm-d-inference-payload-processor\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Inference Payload Processor</strong></a><strong style=\"vertical-align: baseline;\"> (Service Extensions)</strong><span style=\"vertical-align: baseline;\">: This is similar to body-based routing as used in the GKE Inference Gateway, but to enable the functionality on an Application Load Balancer a service extension is needed.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">A lightweight Cloud Run callout inspects the JSON body of incoming OpenAI API requests, extracts the target model identifier, and writes an X-Gateway-Model-Name header to drive URL map routing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/load-balancing/docs/negs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Network Endpoint Group (NEG)</strong></a><span style=\"vertical-align: baseline;\">: Delivers flexible routing to heterogeneous backends based on the injected model header.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">All-backends traffic flow example</strong></h3>\n<p><span style=\"vertical-align: baseline;\">A client application that uses this architecture to call a backend model would go through a flow like this:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Private ingress</strong><span style=\"vertical-align: baseline;\">: The client application targets the Private Service Connect endpoint over private IP address space. The regional internal Application Load Balancer receives the request.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model name extraction</strong><span style=\"vertical-align: baseline;\">: The load balancer sends the payload to the Cloud Run body-based router callout, which inspects the JSON payload and injects the X-Gateway-Model-Name header.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Policy and safety enforcement</strong><span style=\"vertical-align: baseline;\">: The request passes to Apigee for identity and quota validation, then to Model Armor to scrub sensitive data and block malicious prompts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NEG routing</strong><span style=\"vertical-align: baseline;\">: The load balancer URL map inspects the model header and forwards the request to the matching backend NEG (Agent Platform, GKE, Cloud Run, Hybrid, or Internet).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Private delivery</strong><span style=\"vertical-align: baseline;\">: The target backend executes the model prompt, Model Armor screens the completion, and the result returns privately along the ingress path.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"networking-ai-inference-model-serving-flow\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/networking-ai-inference-model-serving-flow.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">What's next</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Take a deeper dive into building AI workloads on Google Cloud:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Document set: </span><a href=\"https://docs.cloud.google.com/architecture/agentic-ai-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic AI architecture guides</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Architecture Center: </span><a href=\"https://docs.cloud.google.com/architecture/multi-agent-private-networking-patterns\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Multi-agent private networking patterns in Google Cloud</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Document: </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/netsec-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform networking access overview</span></a></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Want to ask a question, find out more, or share a thought? Please connect with me on </span><a href=\"https://www.linkedin.com/in/ammett/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Linkedin</span></a><span style=\"vertical-align: baseline;\">. </span></p></div>"
