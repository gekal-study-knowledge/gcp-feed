  "b917a31ea2baca2ae70462903132f54d":
    "id": "b917a31ea2baca2ae70462903132f54d"
    "title": "Introducing Google Cloud Modernize, transforming for (and with) AI"
    "link": "https://cloud.google.com/blog/products/infrastructure-modernization/google-cloud-modernize-accelerate-transformation-with-ai/"
    "published": "2026-10-06 01:00:00"
    "fetched": "2026-10-06 02:54:57"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we’re announcing</span> <a href=\"https://cloud.google.com/solutions/modernize\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Modernize</span></a><span style=\"vertical-align: baseline;\">, an end-to-end transformation portfolio to help enterprises collapse multi-year roadmaps with the power of AI.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Google Cloud Modernize</strong><span style=\"vertical-align: baseline;\"> brings together Google Cloud’s proven migration and modernization tools, including Migration Center, Google Cloud VMware Engine, </span><a href=\"https://cloud.google.com/solutions/mainframe-modernization?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Mainframe Modernization</span></a><span style=\"vertical-align: baseline;\"> and our new </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-agentic-migration?_gl=1*gf0ap9*_ga*MzIwOTk1MDYuMTc5MDI2ODQyMQ..*_ga_4LYFWVHBEB*czE3OTAzNDY4NzEkbzQkZzEkdDE3OTAzNDY4NzMkajU4JGwwJGgw&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">EKS-to-GKE Migration Agent</span></a><span style=\"vertical-align: baseline;\">, into a single portfolio. With it, enterprise teams now have purpose-built agentic capabilities across infrastructure assessment, platform modernization, and application modernization. </span></p>\n<p><span style=\"vertical-align: baseline;\">Central to this portfolio is </span><a href=\"https://console.cloud.google.com/modernization-hub\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Modernization Hub</strong></a><span style=\"vertical-align: baseline;\">, a newly launched in-console experience where developers and architects can analyze source code, map dependencies, and accelerate modernization for Java, .NET, and mainframe applications. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Agentic infrastructure assessment</span></h3>\n<p><span style=\"vertical-align: baseline;\">Every transformation begins with an accurate assessment. With new Gemini capabilities in</span> <a href=\"https://console.cloud.google.com/migration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Migration Center</span></a><span style=\"vertical-align: baseline;\">, the </span><strong style=\"vertical-align: baseline;\">Agentic Quick Estimator (GA)</strong><span style=\"vertical-align: baseline;\"> converts VMware inventory exports (such as RVTools) and infrastructure inputs into total cost of ownership (TCO) projections for your Compute Engine environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">Using an interactive chat interface, teams can test real-time modeling assumptions, such as evaluating multi-region footprints or comparing BYOL licensing against pay-as-you-go, to discover contextual cost optimizations. This condenses weeks of spreadsheet modeling into a defensible business case in minutes.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_7EZHDX9.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Migration Center’s Quick TCO Estimator and agentic chat interface</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For specialized support, we also provide a comprehensive modernization assessment at no cost through our</span> <a href=\"https://cloud.google.com/solutions/cloud-migration-program\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Rapid Migration &amp; Modernization Program (RaMP)</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Platform modernization</span></h3>\n<p><span style=\"vertical-align: baseline;\">With the rise of real-time AI agents querying backend systems, workloads increasingly require high-throughput infrastructure that removes I/O bottlenecks. Once you’ve defined your target environment using our assessments, there are several new purpose-built compute options for mission-critical workloads:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SAP S/4HANA at scale (X5 Series, GA):</strong><span style=\"vertical-align: baseline;\"> Delivers single-node 43 TiB memory configurations that remove the previous 29 TiB ceiling, allowing enterprise ERP estates to run without distributed partitioning overhead.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Core-optimized database performance (</strong><a href=\"https://cloud.google.com/blog/products/compute/compute-engine-m4n-vms?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">M4N Series, GA</strong></a><strong style=\"vertical-align: baseline;\">):</strong><span style=\"vertical-align: baseline;\"> Delivers 26.57 GiB RAM per vCPU paired with Hyperdisk Extreme. This prevents organizations from overprovisioning compute cores to meet memory requirements, reducing software licensing costs by more than 20% for Oracle and other core-licensed databases.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ultra-low latency data engines (</strong><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines#z4d_series\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Z4D, GA</strong></a><strong style=\"vertical-align: baseline;\"> and Z4M, Preview):</strong><span style=\"vertical-align: baseline;\"> Deliver up to 84,000 GiB and 168,000 GiB of high-speed local NVMe SSD respectively, 400 Gbps networking for both Z4D and Z4M, and RDMA support for Z4M. This throughput reduces I/O wait times and prevents query timeouts when real-time AI agents query vector stores, operational databases, and large-scale data pipelines.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Cloud elasticity for VMware environments</span></h4>\n<p><span style=\"vertical-align: baseline;\">For organizations operating VMware estates that need the elasticity of the cloud but aren’t ready to re-architect their environment, the </span><strong style=\"vertical-align: baseline;\">Google Cloud self-managed VMware solution </strong><span style=\"vertical-align: baseline;\">provides administrative control on Bare Metal Z3 shapes with VMware Cloud Foundation (VCF) 9.1. Native global VPC links connect VMware estates directly to Compute Engine, </span><a href=\"https://cloud.google.com/kubernetes-engine?utm_source=gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE), BigQuery, and Gemini Enterprise, allowing teams to ground autonomous agents in operational data without code changes.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Automated container transitions to GKE</span></h4>\n<p><span style=\"vertical-align: baseline;\">The new </span><strong style=\"vertical-align: baseline;\">EKS-to-GKE Agentic Migration</strong><span style=\"vertical-align: baseline;\"> (Public Preview) automates transitions from AWS Elastic Kubernetes Service to</span> <a href=\"https://cloud.google.com/kubernetes-engine?utm_source=gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE</span></a><span style=\"vertical-align: baseline;\"> thanks to: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">An automated pipeline:</strong><span style=\"vertical-align: baseline;\"> Manages discovery, Kubernetes manifest translations, storage and network mappings across clouds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise-grade security:</strong><span style=\"vertical-align: baseline;\"> Built-in Human-in-the-Loop (HITL) approval gates and in-memory credential security maintain strict GitOps compliance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A fast-track to modern runtimes:</strong><span style=\"vertical-align: baseline;\"> Quickly moves workloads to GKE to take advantage of low-latency model serving, autoscaling, and multi-agent orchestration.</span></p>\n</li>\n</ul>\n<p><a href=\"https://cloud.google.com/customers/netease-games\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NetEase Games</span></a><span style=\"vertical-align: baseline;\"> demonstrated the value of this platform approach by containerizing services on GKE, reducing infrastructure scaling times from hours to five minutes during peak launches while cutting server costs by 40%:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"By integrating diverse computing instances and powerful orchestration, we have transformed our infrastructure into a competitive advantage, ensuring NetEase remains a leader in the global gaming market.\"</span><span style=\"vertical-align: baseline;\">  - </span><strong style=\"vertical-align: baseline;\">Deng Ding</strong><span style=\"vertical-align: baseline;\">, Director of Site Reliability Engineering, NetEase Games</span></p>\n<h3><span style=\"vertical-align: baseline;\">Application modernization with Modernization Hub</span></h3>\n<p><span style=\"vertical-align: baseline;\">Landing on modern infrastructure enables teams to unlock legacy business logic and modernize their core applications. </span><a href=\"https://console.cloud.google.com/modernization-hub\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Modernization Hub</strong></a><span style=\"vertical-align: baseline;\"> centralizes several modernization tools directly inside the Google Cloud console. </span></p>\n<h4><span style=\"vertical-align: baseline;\">.NET and Java modernization</span></h4>\n<p><span style=\"vertical-align: baseline;\">Modernization Hub integrates the </span><strong style=\"vertical-align: baseline;\">Google Cloud</strong> <a href=\"https://docs.cloud.google.com/migration-center/docs/app-modernization-assessment?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">App Modernization CLI</strong></a><strong style=\"vertical-align: baseline;\"> (CodMod)</strong><span style=\"vertical-align: baseline;\">, which uses Gemini to analyze large source code repositories, understand legacy application architectures,maps hidden dependencies, identifies modernization challenges and generates modernization recommendations. This enables customers to migrate legacy .NET Framework applications to modern .NET Core  running on Linux containers, reducing OS licensing overhead, while also making these applications and data accessible to modern AI agent workflows.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Modernization_Hub_Take3.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Modernization Hub’s in-console interface</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Mainframe modernization</span></h4>\n<p><span style=\"vertical-align: baseline;\">For customers running mainframes, we provide specialized solutions to help accelerate and de-risk end-to-end application transformation to Google Cloud:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mainframe-assessment-tool/docs/overview?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mainframe Assessment Tool</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Parses legacy mainframe codebases, extracts business rules, maps application and data dependencies to generate cloud-ready target application specifications and power agentic modernization workflows.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mainframe-dual-run/docs/dual-run-overview?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Dual Run</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Substantially reduces cutover risk by replaying live production transaction streams simultaneously across the mainframe and the new cloud applications, verifying functional equivalence before going live. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/mainframe-connector/docs/overview?utm_source=gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mainframe Connector</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Copies mainframe data directly into Google Cloud services (BigQuery, AlloyDB, GCS and others), , unlocking legacy data and supports hybrid architectures.</span></p>\n</li>\n</ul>\n<p><a href=\"https://www.youtube.com/watch?v=KxCIByjwVJg&amp;utm_source=gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intesa Sanpaolo</span></a><span style=\"vertical-align: baseline;\"> used Google Cloud mainframe modernization solutions to accelerate their core banking transformation off the mainframe and onto Google Cloud:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“To confidently move forward with Mainframe Modernization, we will need to provide confidence and assure the bank's leadership and internal control units as well as get approval from the regulators. One of the enablers for this is Google Cloud Dual Run, which is gradually providing the evidences to build such confidence to all three groups.”</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Claudio Balbo</strong><span style=\"vertical-align: baseline;\">, Head of IT Architecture, Intesa Sanpaolo</span></p>\n<h3><span style=\"vertical-align: baseline;\">A proven track record and partner ecosystem</span></h3>\n<p><a href=\"https://cloud.google.com/customers/deutsche-boerse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deutsche Börse Group</span></a><span style=\"vertical-align: baseline;\"> transitioned its mission-critical SAP S/4HANA environment and DAX® index calculations to Google Cloud, cutting disaster recovery times from hours to minutes, reducing aggregation latency by over 50%, and shortening development cycles from months to days.</span></p>\n<p><span style=\"vertical-align: baseline;\">To deliver these capabilities at enterprise scale, we are also collaborating with our global partner ecosystem to integrate Google Cloud Modernize with enterprise delivery frameworks, including </span><a href=\"https://www.cognizant.com/us/en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cognizant</span></a><span style=\"vertical-align: baseline;\">:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Google’s modernization offering heralds the next frontier of AI-native modernization — enabling enterprises to autonomously decode legacy complexity and accelerate into cloud-first, intelligent architectures. Coupled with Cognizant's AI-led, governed delivery engine, we amplify this shift through agentic business processing, unlocking faster, outcome-driven value at scale.” </span><span style=\"vertical-align: baseline;\">- </span><strong style=\"vertical-align: baseline;\">Nishant Upadhyaya</strong><span style=\"vertical-align: baseline;\">, Global Practice Head – Digital Engineering, Cognizant</span></p>\n<h3><span style=\"vertical-align: baseline;\">Accelerate your transformation now</span></h3>\n<p><span style=\"vertical-align: baseline;\">Modernizing your infrastructure and applications is the baseline requirement for enterprise AI agility. Google Cloud Modernize equips teams to navigate each phase safely and efficiently as they pursue AI readiness and adoption.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Get started:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Join the webinar:</strong><span style=\"vertical-align: baseline;\"> Register for our </span><a href=\"https://cloudonair.withgoogle.com/events/adaptive-enterprise-accelerating-app-mod-infra\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">upcoming session on November 17</span></a><span style=\"vertical-align: baseline;\"> to see live demos of Modernization Hub and our agentic migration tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the console:</strong><span style=\"vertical-align: baseline;\"> Log into the Google Cloud Modernize console to access </span><a href=\"https://console.cloud.google.com/modernization-hub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Modernization Hub</span></a><span style=\"vertical-align: baseline;\">.   </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start planning:</strong><span style=\"vertical-align: baseline;\"> Visit the Google Cloud Modernize</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/solutions/modernize\"><span style=\"text-decoration: underline; vertical-align: baseline;\">webpage</span></a><span style=\"vertical-align: baseline;\">, or request a </span><a href=\"https://cloud.google.com/resources/migration-assessment-offer\"><span style=\"text-decoration: underline; vertical-align: baseline;\">modernization assessment</span></a><span style=\"vertical-align: baseline;\"> at no cost today.</span></p>\n</li>\n</ul></div>"
