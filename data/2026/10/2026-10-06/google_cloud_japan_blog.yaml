"entries":
  "c860950a951687a7055e6d615b0f6de6":
    "id": "c860950a951687a7055e6d615b0f6de6"
    "title": "IO 負荷の高いワークロードに適した、ストレージ最適化 Z4D マシン ファミリーの一般提供が開始"
    "link": "https://cloud.google.com/blog/ja/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances/"
    "published": "2026-10-06 11:00:00"
    "fetched": "2026-10-06 13:59:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 28 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Google Compute Engine の次世代 </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D ストレージ最適化マシン</span></a><span style=\"vertical-align: baseline;\">シリーズの一般提供が始まりました。仮想マシン（VM）インスタンスとベアメタル インスタンスの両方でご利用いただけます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Z4D は、I/O 負荷の高い、ビジネス クリティカルなワークロードを想定して構築されたマシンシリーズであり、SQL、NoSQL、KVrocks、ベクトル データベース、データ分析、データ検索といった用途で大容量のローカル ストレージおよび高いストレージ パフォーマンスが必要な場合に適しています。AMD の第 5 世代の EPYC プロセッサ（Turin）を搭載し、</span><a href=\"https://cloud.google.com/titanium?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> の最新機能を組み合わせることで、最大 84,000 GiB のローカル SSD（LSSD）ストレージをサポートしています。前世代の Z3 インスタンスと比較して、パフォーマンスが最大 40% 向上しているため、特に要求の厳しいワークロードにおいて高い効果を発揮し、アプリケーションのスループット向上およびクラウド費用の最適化をもたらします。さらに、Z4D は大容量 LSSD を提供しているという点が大きな特徴であり、AI / ML のトレーニングおよび推論や、大規模な分散並列ファイル システムの実行といった用途に最適なストレージ ソリューションとなっています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Z4D の VM インスタンスとベアメタル インスタンス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Z4D の VM ポートフォリオでは、大容量のローカル SSD および高密度の SSD（vCPU ごと）が提供されており、これらを使って、ワークロード要件に適したインフラストラクチャをサイジングし、クラスタをスケールできます。Z4D には 2 種類の VM タイプがあります。</span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Z4D-highmem-standardlssd</strong></a><span style=\"vertical-align: baseline;\"> タイプは、7 種類の VM シェイプがあり、vCPU あたり 219 GiB の LSSD を提供します。これらの VM は、データ分析（OLAP）や SQL データベース（MySQL や Postgres など）向けに最適化されています。一方、</span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Z4D-highmem-highlssd</strong></a><span style=\"vertical-align: baseline;\"> タイプは、</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">7 種類の VM シェイプがあり、vCPU あたり 438 GiB の LSSD を提供します。このタイプは、分散データベース、データ ストリーミング、大規模な並列ファイル システム、データ検索といった用途向けに最適化されています。さらに、Z3 ベースの既存のワークロードがある場合は、Z4D を含むクラスタに拡張することによって、簡単にスケールできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Z4D ベアメタル インスタンスでは、仮想化レイヤを介さずに物理ハードウェアに直接アクセスできます。これによりレイテンシが短縮されるため、レイテンシの影響を受けやすいワークロードや、カスタム ハイパーバイザ、一定のライセンス要件があるワークロードに適しています。さらに、Z4D ベアメタルは、AMD ベースのインスタンスとして初めて、複数のクラウド プロバイダにまたがるハイブリッド マルチクラウド プラットフォームである Nutanix Cloud Clusters（NC2）をサポートしています。また、Z4D ベアメタル インスタンスの大容量 LSSD および低レイテンシという特徴は、エージェント型 AI アーキテクチャにおいてマイクロ VM を使用するような場合にも最適です。たとえば、単一ホスト内で数千単位の分離サンドボックスを実行するような場合でも、ネイティブのパフォーマンスと効率を維持できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Z4D の VM インスタンスとベアメタル インスタンスは、84,000 GiB のローカル SSD ストレージに加え、最大 384 個の vCPU、最大 3,072 GiB のメモリを提供しています。Z4D インスタンスは </span><a href=\"https://cloud.google.com/compute/docs/disks/local-ssd\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium SSD</span></a><span style=\"vertical-align: baseline;\"> を基盤としており、ローカル ストレージの処理を CPU リソースからオフロードすることによって、リアルタイムのデータ処理、低レイテンシ、高スループットのストレージ パフォーマンスを実現してます。それと同時に、ストレージ セキュリティも強化されています。また、Z4D は最大 15,600K のランダム読み取り IOPS と、最大 75,600 MiB/秒のシーケンシャル読み取りスループットを提供しており、LSSD ストレージのパフォーマンスが Z3 と比べて最大 70% 向上します。さらに、書き込みレイテンシが Z3 と比較して最大 25% 短縮され、読み取り / 書き込み混在の IOPS が最大 30% 向上していますが、Z3 に比べて IO レイテンシは増加していません。また、ネットワーク スループットは Z3 と比べて 2 倍、標準ネットワーク帯域幅は最大 400 Gbps となっており、エンタープライズ ワークロードや AI / ML ワークロードに求められる接続性とストレージ パフォーマンスを提供します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">お客様とパートナー様の声</strong></h4></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"elastic\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/elastic.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「Elastic では、当社の提供する Elasticsearch プラットフォームにおいて、最高水準のパフォーマンスを提供すべく取り組んでいます。このプラットフォームは、オブザーバビリティ、セキュリティ、検索、AI ソリューションの基盤となるものであり、こうしたワークロードを大規模に実行するお客様にとって、パフォーマンスと費用効率は非常に重要です。新しい Z4D 仮想マシンの初期テストでは、前世代の Z3 VM と比較して、インデックス作成のスループットが最大 50% 向上しました。Google Cloud 上で Elasticsearch をデプロイしているユーザーに、こうしたメリットを提供できることを嬉しく思っております。」- Elastic、プリンシパル プロダクト マネージャー、Yuvraj Gupta 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"immunai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/immunai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「Z4D インスタンスに移行したことで、処理の実行時間が約 70% 短縮され、全体的な費用の削減につながりました。これにより、大量の免疫データ処理を高速処理し、生物学的分析情報へと変換できるようになります。製薬会社は、研究開発の全過程を通じてより多くの情報に基づいた意思決定を行うことが可能になります。」- immunai、ソフトウェア エンジニアリング担当シニア ディレクター、Guy Yachdav 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"nutanix\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/nutanix.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「このたび Google Cloud との技術提携ならびに AMD との戦略的パートナーシップを拡充し、新しい Z4D ベアメタル インスタンスに Nutanix Cloud Clusters（NC2）を導入できる運びとなったことを、大変嬉しく思っています。この「NC2 オン Z4D」によって、NC2 対応の初の AMD メタル インスタンスが提供されることになり、これは、お客様にとって重要なマイルストーンとなります。AMD の最先端のコンピューティング パフォーマンスと、Google Cloud の堅牢なインフラストラクチャ、Nutanix のハイブリッド クラウド プラットフォームを組み合わせることで、これまでにない柔軟性、スケール、選択肢を提供することが可能となり、企業のワークロードに貢献できます。」- Nutanix、プロダクト管理担当バイス プレジデント、Saveen Pakala 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"redis\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/redis.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「Redis は、世界中の数千の組織のリアルタイム データ インフラストラクチャと AI ワークロードを支えています。当社の Flex は、特に大規模なデータセットに対応していますが、これらのデータをすべて RAM で処理した場合の経済的負担を解消するため、ローカル SSD でスケールを処理し、メモリでスピードを出しています。Flex ベンチマーク スイートで、フラッシュを多用する同一ワークロードを対象に、Google Cloud の新しい Z4D ストレージ最適化 VM と現行世代の C3D インスタンスを比較したところ、比較的低スペックの VM シェイプでスループットが最大 4.3 倍、レイテンシは最大 77% 低減するという、驚異的結果が得られました。また、RAM ヒット率が 100% という条件のもとで、Z4D は 1 秒あたり約 180 万回のオペレーションを維持しました。フラッシュから読み出すデータの割合が増えるほど、Z4D のメリットが大きくなり、これは、Flex の開発思想とぴったり合致しています。Z4D のおかげで、小さなフットプリントで一定のパフォーマンス レベルを提供できる見通しがはっきりと立ちました。Z4D の一般提供を受け、テストを大規模に実行できるのが楽しみです。」 - Redis、CTO、Benjamin Renaud 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"shopify\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/shopify_QpwhKbh.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「Shopify は、当社のフリートにとって最適なマシンを追求しています。Z4D は、高速なローカル接続ストレージ、高速ネットワーキングに加え、高い CPU 密度を提供してくれます。Shopify のユーザー エクスペリエンスはデータの提供速度に依存しますし、AI ショッピング エージェントはストアフロントに対して人間よりもはるかに高頻度でクエリを実行します。Z4D のシェイプは、こうした状況に対応できるようなスループットを提供してくれます。Z4D では、Z3 と比較してスループットが約 20% 向上しました。」 - Shopify、上級エンジニア、Brad Dietrich 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"silk\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/silk_RM9R0Ve.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「Google は Z4D VM で大きな飛躍を遂げました。当社のテストでは、前世代の Gen 2 VM と比較して最大 60%、Z3 VM と比較して最大 36% のパフォーマンス向上が確認されました。Z4D は、高いローカル SSD 密度、優れた費用対効果、システムの信頼性向上を実現しています。これにより、Silk のお客様に対して、特に要求の厳しいワークロードにおいても高速で予測可能なパフォーマンスを提供することが可能となります。」- Silk、チーフ R&amp;D オフィサー、Adik Sokolovski 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"turbopuffer\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/turbopuffer.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>「ペタバイト規模の最新データと AI の組み合わせにより、当社システムの検索対象はかつてなく膨大になっています。新しい Z4D インスタンス タイプは、目を見張るものがあります。Z3 と比較して、本番環境のクエリおよびインデックス作成のワークロードにおいてスループットが 40% 向上しました。これは、お客様にとって、ウェブスケールの検索がより高速かつ低コストで行えるようになることを意味します。」 - turbopuffer、エンジニア、Ben Linsay 氏</i></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">メンテナンスの利便性の向上</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Z4D の VM インスタンスとベアメタル インスタンスでは、必要なメンテナンスの数日前にシステムから通知が届くため、事前に計画を立てて、任意のタイミングでメンテナンス作業をスケジュールすることができます。Z4D VM では、ローカル SSD ストレージが 42,000 GiB 以下の VM のメンテナンス イベント中に、インスタンスをライブ マイグレーションできるなど、メンテナンス時の利便性が向上しています。ローカル SSD が 84,000 GiB の Z4D VM および Z4D ベアメタル インスタンスでは、計画的なメンテナンス イベントでのシャットダウン / 再起動時に、データがそのまま保持されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Hyperdisk のサポート</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Z4D の VM とベアメタルは、Google Cloud のワークロード最適化ブロック ストレージである </span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</strong></a><span style=\"vertical-align: baseline;\"> をサポートしています。Hyperdisk は、インスタンスごとにストレージのパフォーマンスと容量を調整できるのが特徴で、ワークロードごとにパフォーマンスを最適化できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">特筆すべきは、</span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-balanced\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Balanced</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Throughput</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-extreme\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Extreme</span></a><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> ストレージに対応しているという点であり、これらのスケーラブルかつ高パフォーマンスのネットワーク接続ストレージを通じて、インスタンスあたり最大 512 TiB の容量を利用できます。Hyperdisk Balanced は、インスタンスあたり最大 32万の IOPS をサポートしており、汎用ワークロードにおいてパフォーマンスと費用対効果を両立したい場合に適しています。一方、Hyperdisk Extreme は超低レイテンシが特徴で、Z4D の VM およびベアメタルでインスタンスあたり最大 50 万の IOPS と 12,500 MiB/秒のスループットをサポートしており、要求の厳しいデータベース ワークロードに最適です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Z4D を今すぐ使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Z4D VM は現在、世界の一部リージョンでご利用いただけます。Z4D ベアメタル インスタンスはプレビュー版が提供されています。利用方法など詳細については、Google のアカウント担当者までお問い合わせください。Z4D インスタンスの使用を開始するには、Google Cloud コンソールで新しい VM または GKE ノードプールを作成するときに、ストレージ最適化マシン ファミリーに属する Z4D を選択します。詳しくは、</span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D マシンシリーズ</span></a><span style=\"vertical-align: baseline;\">のページをご覧ください。ご利用いただけるリージョンについて詳しくは、</span><a href=\"https://cloud.google.com/contact/form?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud の営業担当者</span></a><span style=\"vertical-align: baseline;\">までお問い合わせください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネジメント担当、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Bob Napaa</strong></p></div>"
  "abe7330b3c492895e927ae47b1127596":
    "id": "abe7330b3c492895e927ae47b1127596"
    "title": "強化学習（RL）による Gemini モデルのカスタマイズに関するベスト プラクティス ガイド"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/best-practices-guide-for-customizing-gemini-models/"
    "published": "2026-10-06 11:00:00"
    "fetched": "2026-10-06 20:55:57"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 26 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/best-practices-guide-for-customizing-gemini-models?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">強化学習（RL）は、最新の LLM の事後学習の重要な要素となっていますが、大規模なトレーニング クラスタと、Gemini のような独自モデルでは外部の顧客がアクセスできないモデル内部へのアクセスを必要とします。そこで、Google Cloud は、これを</span><strong style=\"vertical-align: baseline;\">マネージド RL ファインチューニング サービス（RLFT サービス） </strong><span style=\"vertical-align: baseline;\">としてパッケージ化しました。お客様はプロンプトと報酬関数を用意するだけで、インフラストラクチャと独自モデルの内部は Google が処理します。</span></p>\n<p><span style=\"vertical-align: baseline;\">このサービスを使用すると、固定されたラベル付き回答セットではなく、定義した報酬シグナルに基づいてモデルに学習させることで、Gemini をサービスに適応させることができます。これにより、教師ありファインチューニング（SFT）では対応が難しい問題、つまり、実証は難しいものの、スコア付けは容易なタスクを解決できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このガイドでは、RL ファインチューニング サービスを使用するための実践的なベスト プラクティスについて説明します。まず、RL トレーニング ループの概要、RL を使用するかどうか、いつ使用するかを判断する方法、このアプローチから最大限の価値を引き出す方法について説明します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">RLFT とは</strong></h4>\n<p><span style=\"vertical-align: baseline;\">RLFT は、ラベル付きの回答ではなく、</span><strong style=\"vertical-align: baseline;\">定義した報酬シグナル</strong><span style=\"vertical-align: baseline;\">に基づいて Gemini を調整します。大量のゴールド サンプルを作成する代わりに、回答をスコア付けするプログラムを 1 つ作成し、サービスがそれに基づいてモデルを改善します。これにより、実証は難しいが検証は容易なタスクを解決できるようになります。たとえば、すべてのスキーマに対して理想的な SQL を手動で記述することはできませんが、クエリを実行して結果を確認することはできます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Single-Step RL Training Loop\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Single-Step_RL_Training_Loop.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">各トレーニング ステップで、サービスはプロンプトに対して複数の回答候補を生成し、報酬でスコアを付け、元の Gemini に近い状態を維持しながら、スコアの高い回答が生成される可能性が高くなるようにモデルを改善します。これを可能にする強化学習はフルマネージドであるため、構成する必要はありません。あなたがコントロールし、結果を最も左右するものは、報酬です。</span></p>\n<p><span style=\"vertical-align: baseline;\">RLFT でできることとできないことは、次の 3 つの特性で定義されます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">モデル自体の出力から学習する:</strong><span style=\"vertical-align: baseline;\"> 外部のターゲットをコピーするのではなく、モデルがすでに生成したものを改良するため、SFT よりも無関係な機能を損なう可能性が低くなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">経路ではなく結果に報酬を与える:</strong><span style=\"vertical-align: baseline;\"> 良い結果に到達した回答には報酬が与えられます。これは、有効な解決策が多数ある自由回答形式のタスクに適しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">既存の能力を増幅する: </strong><span style=\"vertical-align: baseline;\">たまにしか起きない成功を確実に再現できるようにしますが、モデルが一度も実証したことのないスキルを教えることはできません。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">RLFT を使用する状況</strong></h4></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - RLFT Approaches - Direct RL or SFT Warmup to Continuous RLFT\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_RLFT_Approaches_-_Direct_RL_or_SFT_War.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">プロンプトと SFT でほとんどの適応に対処できるため、まずはこれらを試してください。RLFT がその価値を発揮するのは、</span><strong style=\"vertical-align: baseline;\">回答を評価できるが、安価に作成できない</strong><span style=\"vertical-align: baseline;\">場合、重要な指標（忠実性、スキーマの有効性、トーン）で </span><strong style=\"vertical-align: baseline;\">SFT が頭打ち</strong><span style=\"vertical-align: baseline;\">になった場合、またはタスクに</span><strong style=\"vertical-align: baseline;\">等しく有効な回答が多数</strong><span style=\"vertical-align: baseline;\">あり、単一の参照ターゲットでは誤ってペナルティが課される場合です。</span></p>\n<p><span style=\"vertical-align: baseline;\">SFT と RLFT は競合するものではなく、補完的なものです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">直接 RLFT</strong><span style=\"vertical-align: baseline;\">: ベースモデルがすでに時々成功している場合（報酬によってより良い回答とより悪い回答が区別される程度）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SFT → RLFT の 2 段階</strong><span style=\"vertical-align: baseline;\">: SFT データがある場合、またはベースの成功率が低すぎて RL が軌道に乗らない場合。SFT を短時間の安価なウォーム スタートとして使用します。デモンストレーションを過学習させると RL による改善の余地が少なくなるため、SFT は軽めにとどめておきます。その後、SFT チェックポイントから RL を初期化する</span><strong style=\"vertical-align: baseline;\">継続的チューニング</strong><span style=\"vertical-align: baseline;\">を介して RL に移行します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">先行ユーザーの間では、これらのパターンは RLFT が最も価値を発揮する領域であることが示されています。いずれのパターンでも、企業が重視するものの、安価に実証できなかった成果を RLFT でスコア付けしています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">RLFT のユースケース</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">ゲーム内の AI を活用した NPC</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">内容:</strong><span style=\"vertical-align: baseline;\"> 多言語対応でマルチターンの長い会話で、キャラクターやブランドにふさわしい対話が展開される。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">問題:</strong><span style=\"vertical-align: baseline;\"> 既製のモデルでは、言語の誤り、ハルシネーションにより生じたアイテム、プレーヤーの無視、繰り返しのループなどにより、没入感が損なわれる。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">目標と報酬:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Gemini 自動評価ツール（LLM-as-a-judge）</strong><span style=\"vertical-align: baseline;\">が、ペルソナ、フロー、ゲーム状態のシンタックスに基づいて各ターンをスコア付けし、形式や言語のエラーにペナルティを課す。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">結果:</strong><span style=\"vertical-align: baseline;\"> ループと言語のドリフトが解消され、状態のシンタックスが維持されたことで、ゲーム内のキャラクターを大規模にリリースすることが現実的なものになりました。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">構造化されたエンティティの抽出</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">内容:</strong><span style=\"vertical-align: baseline;\"> サプライヤーの請求書や出荷明細書などの非構造化ドキュメントから一連の項目を抽出し、構造化レコードに自動的に変換する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">問題:</strong><span style=\"vertical-align: baseline;\"> SFT が頭打ちになるロングテール。必要なフィールドが見落とされている（再現率）か、存在しないフィールドが捏造されている（適合率）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">目標と報酬:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">ルールベースの適合率 / 再現率の報酬</strong><span style=\"vertical-align: baseline;\">を使用して、各フィールドがソーステキストにグラウンディングされるようにして、1 つの正解から模倣されないようにする。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">結果:</strong><span style=\"vertical-align: baseline;\"> チューニングが停滞していたノイズの多い実社会のドキュメントに対して、フィールド レベルの精度が向上し、手動によるレビュー手順を自動化できました。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">コンテンツ管理</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">内容:</strong><span style=\"vertical-align: baseline;\"> 複雑なポリシーとディシジョン ツリーを大規模に適用する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">問題:</strong><span style=\"vertical-align: baseline;\"> モデルのハルシネーションによる偽陽性や、無効な形式で評価を避けようとする報酬ハッキング。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">目標と報酬:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Cloud Run の報酬</strong><span style=\"vertical-align: baseline;\">を使用して、形式の検証と決定論的な採点ツールを組み合わせて、複数ステップのポリシー遵守を強制する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">結果:</strong><span style=\"vertical-align: baseline;\"> モデルが複雑な免除措置を処理し、偽陽性を大幅に削減し、報酬ハッキングを阻止したことで、管理費用を増加させる人間へのエスカレーションの量が減少しました。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">実行によって測定されるコード</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">内容:</strong><span style=\"vertical-align: baseline;\"> 顧客データに対して実際に実行されるかどうかに基づいて評価される SQL または API 呼び出し。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">問題:</strong><span style=\"vertical-align: baseline;\"> SFT が 1 つの参照クエリを模倣し、未知の独自スキーマに対して機能しない。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">目的と報酬:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">コード実行の報酬</strong><span style=\"vertical-align: baseline;\">を使用して、安全なサンドボックスでコードを実行し、コンパイル、実行を経て、正しい結果が返された場合にのみ報酬を与える。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">結果:</strong><span style=\"vertical-align: baseline;\"> モデルは、クローズド フロンティア品質の実行可能なクエリを最初の試行で生成し、推論コストを削減しました。これにより、技術者以外のユーザーも自然言語で独自のデータをクエリできるようになりました。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">HTML によるプレゼンテーション スライドの生成</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">内容:</strong><span style=\"vertical-align: baseline;\"> HTML / CSS で作成された複数スライドの資料。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">問題:</strong><span style=\"vertical-align: baseline;\"> テキストのみでトレーニングすると、視覚的な品質が無視されるため、オーバーフロー、要素のクリッピング、一貫性のないスタイル設定などが見過ごされる。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">目標と報酬:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">コード実行の報酬</strong><span style=\"vertical-align: baseline;\">を使用して、スライドをレンダリングし、ビジュアル デザイン、レイアウトの整合性、構造の完全性、評価基準の遵守をスコア付けする。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">結果:</strong><span style=\"vertical-align: baseline;\"> モデルは、テーマに一貫性があり、レイアウトのオーバーフローがない、モジュール化された、適切なスタイルのスライドを出力しました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">どこから始めるべきか</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データセット。</strong><span style=\"vertical-align: baseline;\">最初の実行には、検証用として取り分けたデータを含む、多様なプロンプトのセットで十分です。ループが収束し、報酬が期待どおりに推移していることを確認してから、スケールします。トレーニングと評価は厳密に分けるようにしてください。評価が汚染されると、過学習が見落とされてしまいます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">報酬関数。</strong><span style=\"vertical-align: baseline;\">コードまたは構成としてのタスク仕様であり、品質を左右する重要な要因。優れた報酬は、人間の好みに相関し、不正な出力に対して堅牢であり（解析の失敗をキャッチし、クラッシュすることなく、明確に否定的なスコアを返します）、報酬ハッキングに耐性があります。具体的には、複数の評価を組み合わせ、長さへのペナルティを課し、異常な出力への下限を設定し、モデルの意見よりも検証可能なチェックを優先します。リリース前にオフラインで検証してください。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">残りはサービスが処理します。デフォルト設定から開始し、コンソールで報酬と評価の曲線を確認して、最後の段階ではなく、検証報酬が頭打ちになった時点のチェックポイントを使用します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - rlft_tutorial\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_-_rlft_tutorial.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">あなたは何を構築しますか？そのために必要なツールがここにあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/reinforcement-tuning\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント: 強化学習ファインチューニング</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、シニア ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jiaqi Pan</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Kunal Jha</strong></p></div>"
