"overview": |
  この日は 7 件で、モダナイゼーション向けの新しいポートフォリオ、ストレージ最適化マシンの一般提供、そして強化学習によるモデルカスタマイズの指針が中心でした。Google Cloud Modernize が発表されました。数年規模のロードマップを AI の力で圧縮することを狙ったエンドツーエンドの変革ポートフォリオで、Migration Center、Google Cloud VMware Engine、Google Cloud Mainframe Modernization、そして新しい EKS-to-GKE Migration Agent といった既存の移行・モダナイゼーションツールを 1 つにまとめ、インフラの評価・プラットフォームのモダナイゼーション・アプリケーションのモダナイゼーションにまたがる専用のエージェント機能を提供します。中心となるのは新しくコンソール内に用意された Modernization Hub で、開発者とアーキテクトがソースコードを分析し依存関係をマッピングして、Java・.NET・メインフレームのアプリケーションのモダナイゼーションを加速できます。インフラ評価では、Migration Center の新しい Gemini 機能として Agentic Quick Estimator が一般提供となり、RVTools のような VMware のインベントリエクスポートやインフラの入力値を Compute Engine 環境向けの総所有コスト (TCO) の見積もりに変換します。対話型のチャットインターフェースから、マルチリージョン構成の評価や BYOL ライセンスと従量課金の比較といったモデリングの前提をリアルタイムに試せるため、スプレッドシートで数週間かかっていた作業が短縮されます。コンピュートでは、Google Compute Engine の次世代ストレージ最適化マシンシリーズ Z4D が、仮想マシンとベアメタルの両方で一般提供となりました。SQL・NoSQL・KVrocks・ベクトルデータベース・データ分析・データ検索のように大容量のローカルストレージと高いストレージ性能を要する、I/O 負荷の高いビジネスクリティカルなワークロード向けです。AMD の第 5 世代 EPYC プロセッサ (Turin) を搭載し Titanium の最新機能と組み合わせることで、最大 84,000 GiB のローカル SSD (LSSD) をサポートし、前世代の Z3 と比べて性能が最大 40% 向上します。VM タイプは 2 種類で、vCPU あたり 219 GiB の LSSD を提供する Z4D-highmem-standardlssd (7 シェイプ、OLAP や MySQL・Postgres のような SQL データベース向け) と、vCPU あたり 438 GiB の LSSD を提供する Z4D-highmem-highlssd (7 シェイプ、分散データベース・データストリーミング・大規模並列ファイルシステム・データ検索向け) があり、既存の Z3 ベースのワークロードは Z4D を含むクラスタへ拡張して容易にスケールできます。ベアメタルインスタンスは仮想化レイヤを介さず物理ハードウェアに直接アクセスできるためレイテンシーに敏感なワークロードやカスタムハイパーバイザ、特定のライセンス要件に適しており、AMD ベースのインスタンスとして初めて Nutanix Cloud Clusters にも対応します。モデルカスタマイズでは、強化学習 (RL) による Gemini のカスタマイズについてのベストプラクティスガイドが公開されました。RL は最新の LLM の事後学習で重要な要素ですが、大規模な学習クラスタと、Gemini のような独自モデルでは外部の顧客がアクセスできないモデル内部へのアクセスを必要とします。Google Cloud はこれをマネージドな RL ファインチューニングサービス (RLFT サービス) としてパッケージ化しており、利用者はプロンプトと報酬関数を用意するだけで、インフラと独自モデルの内部は Google が扱います。固定されたラベル付き回答の集合ではなく自分で定義した報酬シグナルに基づいて学習させるため、教師ありファインチューニング (SFT) では扱いにくい「実証は難しいがスコア付けは容易なタスク」に対応できます。各学習ステップでは、プロンプトに対して複数の回答候補を生成し報酬で採点して、元の Gemini に近い状態を保ちながら高スコアの回答が出やすくなるようモデルを改善します。RLFT の性質は、外部のターゲットを写すのではなくモデル自身の出力を洗練させるため SFT より無関係な機能を損ないにくいこと、経路ではなく結果に報酬を与えるため有効な解が多数ある自由回答形式のタスクに向くこと、既存の能力を増幅するものでありモデルが一度も実証していないスキルは教えられないこと、の 3 点で定義されます。まずはプロンプトと SFT を試し、回答を評価できるが安価には作れない場合に RLFT が価値を発揮する、という使い分けが示されています。データベースでは、AlloyDB AI のハイブリッド検索が取り上げられました。最近の AI や RAG のアプリケーションで高い検索の関連性を得るには、意味的な文脈のためのベクトル検索と、キーワードの精度のための全文検索 (FTS) を組み合わせる必要があります。AlloyDB for PostgreSQL は双方に対応していますが、難しいのは検索の実行ではなく結果セットの融合で、ベクトルクエリの距離スコアと FTS の関連度スコアを混ぜるには複雑な SQL かアプリケーション層のコードが必要で、融合・スコアの正規化・再ランキングのための別のシステムを抱えがちでした。今回の更新では、Reciprocal Rank Fusion (RRF) を使う単一の高性能な SQL 関数にまとめられるようになり、新しい RUM 拡張で語の位置をインデックスに直接持たせて低レイテンシーの関連度ランキングと効率的なフレーズ一致を実現し、ネイティブ対応の BM25 インデックスで標準的なキーワードスコアリングをそのまま使えます。さらに新しい external search Foreign Data Wrapper (FDW) により、Elasticsearch・OpenSearch・Solr といった外部のクラスタに対するクエリを AlloyDB から離れずに実行できます。ネットワークでは、AI 推論のモデルサービングに向けたネットワーキングのリファレンスアーキテクチャが 2 つ示されました。GKE 向けと、それ以外のすべてのバックエンド向けです。いずれもモデルのデプロイを安定して安全な単一の入口の背後に置き、その入口がポリシー・セキュリティ・ロジックを適用する制御ゾーンとして機能します。入口には Cloud Load Balancer と Inference Gateway のいずれも使え、TLS での接続終端、API 管理コンポーネントとの統合、service extensions による機能拡張、セキュリティを高める Model Armor の活用ができます。共通して使うのは、入口を利用者側の VPC 内に固定して推論の呼び出しをプライベートな内部 IP に留める Private Service Connect の推論エンドポイント、Apigee Extension Processor のコールアウト経由でクライアントの ID 検証・レート制限・クォータの適用をコンピュートに届く前に行う Apigee API Management (任意)、そしてプロンプトと出力をプロンプトインジェクションや機微データの漏洩に対して検査するインラインの安全性チェックポイントである Model Armor です。リリースノートでは、検出されたサービスやワークロードを App Hub のアプリケーションへ一括登録する機能が Cloud Monitoring で GA となりました。Cloud SDK 588.0.0 には破壊的変更があり、Google Cloud CLI から Cloud Managed Flink のクライアントコンポーネント (managed-flink-client) が削除されました。Apigee では gcloud apigee apis import が GA に昇格し、YAML テンプレート (--from-template) かプロキシバンドルの ZIP (--from-bundle) から API プロキシをインポートできるようになり、テンプレートからのインポートで EventFlow が汎用の <Flows> コンテナ内に出力されて通常の条件付きフローとして扱われていた問題など、複数の不具合が修正されています。イベントでは、2026 年 10 月 20 日にワシントン D.C. のロナルド・レーガン・ビルで開催される Google Public Sector Summit 2026 の案内が公開されました。
