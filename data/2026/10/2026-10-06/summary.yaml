"overview": |
  この日は 3 件で、モダナイゼーション向けの新しいポートフォリオ、ストレージ最適化マシンの一般提供、そして強化学習によるモデルカスタマイズの指針が中心でした。Google Cloud Modernize が発表されました。数年規模のロードマップを AI の力で圧縮することを狙ったエンドツーエンドの変革ポートフォリオで、Migration Center、Google Cloud VMware Engine、Google Cloud Mainframe Modernization、そして新しい EKS-to-GKE Migration Agent といった既存の移行・モダナイゼーションツールを 1 つにまとめ、インフラの評価・プラットフォームのモダナイゼーション・アプリケーションのモダナイゼーションにまたがる専用のエージェント機能を提供します。中心となるのは新しくコンソール内に用意された Modernization Hub で、開発者とアーキテクトがソースコードを分析し依存関係をマッピングして、Java・.NET・メインフレームのアプリケーションのモダナイゼーションを加速できます。インフラ評価では、Migration Center の新しい Gemini 機能として Agentic Quick Estimator が一般提供となり、RVTools のような VMware のインベントリエクスポートやインフラの入力値を Compute Engine 環境向けの総所有コスト (TCO) の見積もりに変換します。対話型のチャットインターフェースから、マルチリージョン構成の評価や BYOL ライセンスと従量課金の比較といったモデリングの前提をリアルタイムに試せるため、スプレッドシートで数週間かかっていた作業が短縮されます。コンピュートでは、Google Compute Engine の次世代ストレージ最適化マシンシリーズ Z4D が、仮想マシンとベアメタルの両方で一般提供となりました。SQL・NoSQL・KVrocks・ベクトルデータベース・データ分析・データ検索のように大容量のローカルストレージと高いストレージ性能を要する、I/O 負荷の高いビジネスクリティカルなワークロード向けです。AMD の第 5 世代 EPYC プロセッサ (Turin) を搭載し Titanium の最新機能と組み合わせることで、最大 84,000 GiB のローカル SSD (LSSD) をサポートし、前世代の Z3 と比べて性能が最大 40% 向上します。VM タイプは 2 種類で、vCPU あたり 219 GiB の LSSD を提供する Z4D-highmem-standardlssd (7 シェイプ、OLAP や MySQL・Postgres のような SQL データベース向け) と、vCPU あたり 438 GiB の LSSD を提供する Z4D-highmem-highlssd (7 シェイプ、分散データベース・データストリーミング・大規模並列ファイルシステム・データ検索向け) があり、既存の Z3 ベースのワークロードは Z4D を含むクラスタへ拡張して容易にスケールできます。ベアメタルインスタンスは仮想化レイヤを介さず物理ハードウェアに直接アクセスできるためレイテンシーに敏感なワークロードやカスタムハイパーバイザ、特定のライセンス要件に適しており、AMD ベースのインスタンスとして初めて Nutanix Cloud Clusters にも対応します。モデルカスタマイズでは、強化学習 (RL) による Gemini のカスタマイズについてのベストプラクティスガイドが公開されました。RL は最新の LLM の事後学習で重要な要素ですが、大規模な学習クラスタと、Gemini のような独自モデルでは外部の顧客がアクセスできないモデル内部へのアクセスを必要とします。Google Cloud はこれをマネージドな RL ファインチューニングサービス (RLFT サービス) としてパッケージ化しており、利用者はプロンプトと報酬関数を用意するだけで、インフラと独自モデルの内部は Google が扱います。固定されたラベル付き回答の集合ではなく自分で定義した報酬シグナルに基づいて学習させるため、教師ありファインチューニング (SFT) では扱いにくい「実証は難しいがスコア付けは容易なタスク」に対応できます。各学習ステップでは、プロンプトに対して複数の回答候補を生成し報酬で採点して、元の Gemini に近い状態を保ちながら高スコアの回答が出やすくなるようモデルを改善します。RLFT の性質は、外部のターゲットを写すのではなくモデル自身の出力を洗練させるため SFT より無関係な機能を損ないにくいこと、経路ではなく結果に報酬を与えるため有効な解が多数ある自由回答形式のタスクに向くこと、既存の能力を増幅するものでありモデルが一度も実証していないスキルは教えられないこと、の 3 点で定義されます。まずはプロンプトと SFT を試し、回答を評価できるが安価には作れない場合に RLFT が価値を発揮する、という使い分けが示されています。
