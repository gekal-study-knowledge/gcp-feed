    "summary": "<h2 class=\"release-note-product-title\">Anti Money Laundering AI</h2>\n<h3>Announcement</h3>\n<p>New minor engine version released for the retail line of business within the <code>v004.011</code> version line (<code>aml-retail.default.v004.011.202610-000</code>). This version extends support for the major engine version and includes no significant changes compared to the previous minor version.</p>\n<h2 class=\"release-note-product-title\">Dataflow</h2>\n<h3>Feature</h3>\n<p>Dataflow has added the following features to tune horizontal\nautoscaling for Streaming Engine jobs:</p>\n<ul>\n<li>Latency tiers: You can configure the backlog threshold by choosing a latency\ntier (<code>low_latency</code>, <code>medium_latency</code>, or <code>high_latency</code>), allowing you to\nconfigure the autoscaler's sensitivity to backlog duration and balance latency\nrequirements with resource costs. For more information, see\n<a href=\"https://docs.cloud.google.com/dataflow/docs/guides/tune-horizontal-autoscaling#latency-tier\">Set the latency tier</a>.</li>\n<li>Autoscaling schedules: You can configure recurring autoscaling schedules\nto automatically apply parameter overrides—such as minimum and maximum\nworkers, worker utilization hints, or latency tiers—during specific time\nwindows. For more information, see\n<a href=\"https://docs.cloud.google.com/dataflow/docs/guides/tune-horizontal-autoscaling#scheduled-autoscaling\">Schedule autoscaling changes</a>.</li>\n</ul>\n<p>You can configure these features when you create a job or update them while the\njob is running.</p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Model Armor is available in Brazil (<code>southamerica-east1</code>). This region\nprovides data residency compliance for at-rest, in-use, and in-transit data with\n<a href=\"https://docs.cloud.google.com/model-armor/feature-availability-by-region#limited-support\">limited feature support</a>.</p>\n<p>The <code>southamerica-east1</code> region supports the following filters:</p>\n<ul>\n<li>Prompt injection and jailbreak detection</li>\n<li>Responsible AI</li>\n<li>Sensitive Data Protection</li>\n</ul>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/locations\">Locations</a>,\n<a href=\"https://docs.cloud.google.com/model-armor/data-residency\">Data residency and endpoints</a>, and\n<a href=\"https://docs.cloud.google.com/model-armor/feature-availability-by-region#supported-by-region\">Supported features by region</a>.</p>\n<h2 class=\"release-note-product-title\">SAP on Google Cloud</h2>\n<h3>Announcement</h3>\n<p><strong>ABAP SDK for Google Cloud version 1.15 (On-premises or any cloud edition)</strong></p>\n<p>Version 1.15 of the on-premises or any cloud edition of the ABAP SDK for Google\nCloud is generally available (GA). This version enhances binary data handling to\nlet you download archived <code>.msg</code> files and other binary formats without applying\ncharacter decoding when you use Cloud Storage as a content repository for SAP.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/sap/docs/abap-sdk/on-premises-or-any-cloud/whats-new#version-1-15\">What's new with the on-premises or any cloud edition of the ABAP SDK for Google Cloud</a>.</p>"
