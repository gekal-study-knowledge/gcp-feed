    "id": "043c8033565238e776efab94f36b93d1"
    "title": "Sky: Gemini を全社で一斉に導入し、98% の利用定着率と 2,000 個近いエージェントの共有を実現"
    "link": "https://cloud.google.com/blog/ja/topics/customers/sky-implements-gemini-company-wide/"
    "published": "2026-10-29 10:00:00"
    "fetched": "2026-10-29 11:06:44"
    "summary": "<div class=\"block-paragraph\"><p>「AI に強く、AI を使いこなす会社」を目指す Sky株式会社（以下、Sky）は、内製の AI ツールで活用の土台を構築。さらに後継のツールとして Gemini を全従業員約 5,000 名へ一斉配布し、大きな成果を上げています。単なる「業務効率化」ではなく「業務プロセスそのものの変革」を目指すアプローチ、そして具体的な成果について、改革を牽引する AI Innovation Lab の 2 名に伺いました。</p><p><b>利用しているサービス:</b><br /> <a href=\"https://cloud.google.com/gemini-enterprise?hl=ja\">Gemini</a>, <a href=\"https://notebook.google/?hl=ja\" target=\"_blank\">Gemini Notebook</a> など</p><p><b>利用しているソリューション:</b><br /><a href=\"https://cloud.google.com/ai/generative-ai?hl=ja\">生成 AI</a></p><h3><b>「SKYAI」の内製開発で定着した AI 活用文化を、いかに発展させるか</b></h3><p>クライアント運用管理ソフトウェア「SKYSEA Client View」や営業名刺管理サービス「SKYPCE」などで知られる Sky は、自社商品を開発・提供する ICT ソリューション事業と、顧客のシステム開発を担うクライアント・システム開発事業を両輪としています。そんな同社の特長の 1 つは、現場のニーズに応じてソリューションを独自に開発する企業文化です。社内システムも大部分を内製しており、その数は約 200 にのぼります。<br /></p><p>事実、生成 AI が登場すると、同社は対話型の生成 AI サービス「SKYAI」を独自開発して全社に提供。自律型リサーチ機能「Deep Research」が普及したときにも、「SKYAI Deep Research」を自力で開発しています。こうしたプロジェクトを牽引してきたメンバーが集まって誕生したのが、社内の AI 専門チームである AI Innovation Lab です。同 Lab 課長の須藤 康正氏は、一連の開発プロジェクトの狙いを次のように説明します。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A0294_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A0294_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「AI Innovation Lab は、会社のスタイルを構築しつつ、代表が掲げる理念をサービスや機能という形で体現していく、Skyスタイル部に所属しています。『SKYAI』と『SKYAI Deep Research』には、皆の業務を便利にするという目的以上に重要な役割がありました。AI を使うということを従業員のスタイルとして根付かせていくことです。」（須藤氏）</p><p>ウェブ検索機能やプロンプト評価機能の実装、全従業員向けの研修といった取り組みもあり、SKYAI の月間利用率は最終的に 90% に達しました。しかしここで須藤氏は、大きな決断を迫られます。SKYAI の継続に注力すれば、新たな AI システムの開発ができなくなるからです。保守部門に運用を引き継ぐ選択肢もありましたが、須藤氏は「攻めの決断」を下しました。</p><p>「SKYAI は役割を果たしたと判断し、サービスを終了することにしました。ただし従業員には、代わりとなる AI ツールが必要になりますので、検討に入りました。そこで念頭に置いたのは『どのツールを選ぶか』ではなく、『我々は AI を会社の中でどう使いたいのか』『我々が目指している AI の活用スタイルを育むためには、ツールはいかにあるべきか』というものでした。」（須藤氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>横断検索の精度、データ連携、ガバナンスを評価して Gemini を選定</b><br /></h3><p>このような問題意識に基づき、最終的に選ばれたのは Gemini でした。その際にまず検証されたのは、横断検索の精度だったといいます。同社では高機能な AI を使うことがすでに当たり前となっており、検索精度が低いとユーザーがすぐに離れていくことが懸念されたからです。</p><p>「社内で Deep Research を内製していたときには、ナレッジグラフを作っていかなければなりませんでした。また、ベクトル化やチューニング、チャンクサイズの調整など、多くの試行錯誤を繰り返していましたが、企業向け Gemini を採用してみると、我々が作ったシステムと同等以上の精度がすぐに得られました。これはまさに驚きでした。」（須藤氏）</p><p>次に検証されたのはデータ連携です。同社は Google Workspace を導入していませんが、企業向け Gemini には、サードパーティ SaaS 向けのコネクタが数多く用意されているため、多様なプラットフォームとのデータ連携は容易に実現できました。そして 3 つ目が、ガバナンスとセキュリティです。同社は顧客のシステム開発も担っているため、エンタープライズ利用を想定したアクセス コントロール、法務部門との調整に必要な情報の確保、知的財産の侵害リスクに備える IP 補償、EnterpriseWebSearch との統合などが不可欠になります。これらの機能が揃っていたことも、採用の後押しとなりました。</p><p>「セキュリティについては、条件が『保証されている』『明文化されている』ことを重視しています。Google Cloud は AI 活用におけるセキュリティの担保にも非常に慎重かつ真摯に取り組んでおり、我々が目指しているのと同じ方向で、安全性を追求できるのではないかと感じました。」（須藤氏）</p><p>これらの検証を踏まえて、2026 年 1 月、Sky は Gemini の利用を開始。「スタイルは従業員全員で作る」という指針のもと、約 5,000 名の全従業員に一斉に展開しました。これはかなり思い切った決断でしたが、現場ではさまざまな成果が生まれ始めています。AI Innovation Lab 課長代理の帯野 幸司氏は、最初の例として、新メンバーのオンボーディングを挙げました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A0368_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A0368_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「従来は新しいメンバーに大量の資料を渡して読んでもらう形になっており、どこまで理解しているかが、なかなか正確に把握できませんでした。しかし、社内の業務情報を部署ごとに整理して Gemini Notebook に読み込ませるようにしたところ、AI との対話を通じて新メンバーが自律的に学習し、疑問点を自己解決できるようになりました。これによりオンボーディング期間が大幅に短縮されています。また、従業員が自律的に部署のノウハウを蓄積し、データを共有する際の形式まで意識してくれるようになりました。これも思わぬ効果です。」（帯野氏）</p><p>次の好例は、上長の簡易クローン構築によるコミュニケーションの効率化です。</p><p>「上長に案件のレビューや相談を依頼したくても、時間を確保してもらうのが難しいのが実情です。幸い、Sky には従業員が日頃感じていることや考えていることを社内ブログにアウトプットする文化があるので、そこから上長の思考スタイルを Markdown にまとめ、Gemini でエージェント化しました。メンバーだけでなく上長も含め、双方の時間が短縮できています。」（帯野氏）</p><p>さらに帯野氏は、Deep Research を使った検索の充実にも触れました。<br /><br />「以前は AI 活用研修を企画する際にも、ウェブ上の他社事例と社内の過去の研修内容を別々に調べる必要があり、手間がかかっていました。しかし、社内情報とウェブの情報を横断的に検索することにより、自社の実情や過去の文脈に合った精度の高いリサーチができるようになりました。」（帯野氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Sky株式会社様_挿入用スライド\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/SkyZhuShiHuiSheYang_ChaRuYongsuraito.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">「従業員が AI と一緒に働く」環境を構築し、独自のスタイルを追求</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini のアクティブ ユーザー数は、展開後約 2 か月で急増した後に高止まりしており、定着率は 98% というきわめて高い水準を維持しています。帯野氏は「Gemini が物珍しさだけで使われているのではなく、日々の業務に不可欠なツールとしてほぼすべての従業員に受け入れられ、継続的に利用されていることを示していると考えられます」と解説します。</span></p>\n<p><span style=\"vertical-align: baseline;\">事実、現場主導で Gemini の活用が広がったことにより、Sky では 2,000 個近くのエージェントが従業員によって開発され、広く共有されるようになりました。その結果、エージェントの検索が困難になるという嬉しい悩みも発生しましたが、この問題は Google Cloud のサポートによって解決されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「検索機能の問題もそうですが、エンタープライズ ユースで『こういう機能が欲しい』と相談すると、いつもすごく真摯に解決案を提案してもらえます。製品の機能とは別に、これも Google Cloud と仕事をしていくうえですごく良いと感じている点です。」（須藤氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">Sky における AI 活用は、既存業務の強化を目的としたものから、「業務プロセスを変える」ものへ、そして「従業員が AI と一緒に働くようなスタイル」を実現させるものへと進化してきました。導入成果の測定に関しては KPI を設定せず、各部署に独自の基準作りを委ねる一方、活用度そのものを全社共通で評価できる「PAM」というシステムも新たに構築されています。また最近では、自社を「ゼロカスタマー（最初の顧客）」に設定した商品開発でも、AI を活用する方法が模索され始めています。最後に須藤氏は、Gemini に寄せる信頼の大きさを改めて語りました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「2026 年 7 月には、AI Innovation Lab に『AI 社員』が参加しました。AI は業務のチャットログを常にチェックしており、自分ができる業務をどんどん代行していきます。私たちはこうして生まれた時間を、新たな創発的な業務に 100% 投下していく予定です。生成 AI の活用は、単なるツールの導入に終わらせるのではなく、企業が目指す『スタイル』を明確に思い描き、AI ネイティブな業務改革を進めていくことが重要です。その点、Gemini は私たちにとって、最も使いやすいツールになっています。」（須藤氏）</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"_53A0538_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A0538_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><a href=\"https://www.skygroup.jp/\" target=\"_blank\"><b>Sky株式会社</b></a><br />1985 年 3 月 2 日設立。クライアント運用管理ソフトウェア「SKYSEA Client View」や営業名刺管理サービス「SKYPCE」などの自社商品を開発・提供する ICT ソリューション事業と、顧客のシステム開発を担うクライアント・システム開発事業を両輪に事業を展開している。「AI に強く、AI を使いこなす会社」を掲げ、AI 活用による DX やサービス開発などに取り組む。従業員数は 4,655 名（2026 年 10 月 1 日現在）。</p><p><b>インタビュイー（写真右から）</b><br />・Skyスタイル部 AI Innovation Lab 課長 須藤 康正 氏<br />・Skyスタイル部 AI Innovation Lab 課長代理 帯野 幸司 氏</p></div>\n<div class=\"block-paragraph_advanced\"><hr />\n<p> </p></div>\n<div class=\"block-paragraph\"><p><b>▼ セッション動画を観る</b><br />本事例のインタビュイーによるセッション動画が公開中です。あわせてご覧ください。<br /><a href=\"https://www.googlecloudevents.com/next-tokyo/v/s-4393292\" target=\"_blank\">【Next Tokyo 26 セッション】ツール導入ではない、企業のスタイルを創る「AI 戦略」としての Gemini Enterprise</a></p><p><b>▼他の導入事例記事を読む</b><br />その他の Google Cloud 導入事例は<a href=\"https://cloud.google.com/customers?hl=ja&amp;e=48754805\">こちら</a>をご覧ください。</p></div>"
  "fd71dfff9469f33b33c690417cdbf4a7":
    "id": "fd71dfff9469f33b33c690417cdbf4a7"
    "title": "Google Cloud で Claude の利用機会とデプロイの選択肢を拡大"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/expanding-claude-availability-on-google-cloud/"
    "published": "2026-10-29 10:00:00"
    "fetched": "2026-10-29 18:22:36"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 23 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-claude-availability-on-google-cloud?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">生成 AI の構築やスケーリングにおける要件は、組織によってさまざまです。Google Cloud は、デベロッパーの皆様がニーズに合わせて自由な環境でワークロードを実行できるよう、モデルの選択肢とアーキテクチャの柔軟性の提供に取り組んでいます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">このたび、Google Cloud における Claude モデルの Anthropic マネージド デプロイ オプションの一般提供を開始いたしました。これにより、チームはモデルの実行方法の選択肢が広がり、既存の Google マネージド デプロイ オプションとあわせて、Google Cloud 上で AI ワークロードを統合できるようになります。</strong></p>\n<p><span style=\"vertical-align: baseline;\">どちらのオプションを選択しても、同じフロンティア モデルをリリース初日から利用でき、料金や Google Cloud の請求体系も同じです。主な違いは、「データ処理者が誰であるか」と「新しい Claude プラットフォーム機能のリリース直後のアクセスが必要かどうか」の 2 点です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">[新規] Google Cloud 上の Claude モデル（Anthropic マネージド）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Claude モデルをはじめ、Claude Managed Agents（ベータ版）、スキル、コード実行といった Claude プラットフォーム機能に、リリース初日からアクセスできます。Anthropic は Anthropic の利用規約に基づき、データ処理者として Google Cloud インフラストラクチャ上でスタックを運用します。一方、利用組織は Google Cloud IAM による認証、Cloud Audit Logging によるログ保持を行いつつ、既存の Google Cloud 請求や対象となる確約利用に費用を統合できます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">詳細:</span><a href=\"https://console.cloud.google.com/marketplace\"><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Google Cloud 上の Claude モデル（Anthropic マネージド）</span></a><span style=\"font-style: italic; vertical-align: baseline;\">。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Google Cloud 上の Claude モデル（Google マネージド）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">厳格なガバナンス、コンプライアンス、データ主権に関する要件を満たしながら、最新の Claude モデルをリリース初日から継続して提供します。Google Cloud は、既存のお客様との契約に基づきデータ処理者として機能し、VPC Service Controls、顧客管理の暗号鍵（CMEK）、ならびに米国、EU、APAC でのデータ所在地を提供します。Claude プラットフォームの新機能は、Google マネージドのインフラストラクチャに統合され次第、順次展開されます。また、BigQuery や Model Armor などの Google Cloud サービスとのネイティブ統合のほか、標準の課金や対象となる確約利用の充当といったメリットも得られます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">詳細:</span><a href=\"https://cloud.google.com/products/model-garden/claude\"><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Google Cloud 上の Claude モデル（Google マネージド）</span></a></p>\n<h4><strong style=\"vertical-align: baseline;\">デプロイ オプションの比較</strong></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">機能</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Anthropic マネージド</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google マネージド</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">モデルの提供</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">初日から利用可能</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">初日から利用可能</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ファースト パーティ ツールとベータ版</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">初日から利用可能</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Google マネージド インフラストラクチャに統合されると利用可能</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">データ処理者と利用規約</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Anthropic（Anthropic の商用利用規約に基づく）</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud（既存の Google Cloud 顧客契約に基づく）</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">料金と確約利用</strong></p>\n</td>\n<td colspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">標準料金（対象となる Google Cloud の確約利用に充当）</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">どのデプロイ方法を選択しても、</span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-fable-5-1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Claude Fable 5.1</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-sonnet-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sonnet 5.5</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-haiku-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Haiku 5.5</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-opus-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Opus 5.5</span></a><span style=\"vertical-align: baseline;\"> など、Anthropic の最新のフロンティア モデルを Google Cloud で利用できます。新しいプラットフォーム機能は、Anthropic マネージド オプションではすぐに利用可能になり、Google マネージド オプションでは統合後にロールアウトされます。これにより、デベロッパーは Google Cloud IAM と Marketplace の課金機能を通じて、推論、コーディング、マルチモーダルの多彩な機能を活用できるようになります。</span><a href=\"https://console.cloud.google.com/agent-platform/claude-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今すぐ利用を開始しましょう</span></a><strong style=\"vertical-align: baseline;\">。</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、Gemini、プロダクト マネジメント担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Michael Gerstenhaber</strong></p></div>"
  "5ad03b9d371323527c60331c420a96bd":
    "id": "5ad03b9d371323527c60331c420a96bd"
    "title": "ZenteiQ、llm-d を搭載した GKE Inference Gateway でバッチ推論のスループットを 4 倍に拡大"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/zenteiq-scales-physical-ai-inference-4x-with-gke-and-llm-d/"
    "published": "2026-10-29 10:00:00"
    "fetched": "2026-10-29 18:22:36"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 22 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/containers-kubernetes/zenteiq-scales-physical-ai-inference-4x-with-gke-and-llm-d?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p><i>今回は、Indian Institute of Science（IISc）からスピンアウトした AI スタートアップである</i> <a href=\"https://zenteiq.ai/\" target=\"_blank\"><i>ZenteiQ</i></a><i> についてご紹介します。</i><a href=\"https://indiaai.gov.in/\" target=\"_blank\"><i>IndiaAI Mission</i></a><i> の対象企業として選出された同社は、自国主導の科学基盤モデルをゼロから構築することを目指しています。物理法則、支配方程式、数値ソルバーを理解するモデルを事前トレーニングするため、ZenteiQ は、複数のモデル ファミリーにわたって動作し、検証済みのデータセットをトレーニング実行にフィードする、大規模なバッチ合成データ生成パイプラインを設計、構築しました。</i><a href=\"https://cloud.google.com/kubernetes-engine\"><i>Google Kubernetes Engine（GKE）</i></a><i>と</i> <a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><i>GKE Inference Gateway</i></a><i> を活用して、ZenteiQ はパイプライン内に推論ルーティング レイヤを構築し、推論の総スループットを 4.07 倍に拡大するとともに、1 日あたりの出力をアクセラレータ 1,000 個あたり 14 億 7,000 万トークンから 59 億 7,000 万トークンに増加させました。</i><b> - Google Cloud、プロダクト マネージャー、Fisayo Feyisetan</b></p><p>主にウェブ上のテキストやコードを使用してトレーニングされた汎用言語モデルとは異なり、科学基盤モデルは、熱力学、計算流体力学、電磁気学などの分野にわたる複雑な物理システム、数学的支配方程式、数値ソルバーを理解する必要があります。ZenteiQ では、シミュレーション出力を解釈し、方程式の定式化を評価し、物理法則に従って段階的に数学的導出を行う、自国主導の科学基盤モデルをゼロから構築しています。</p><p>支配方程式の大規模なデータセットを使用してモデルを事前トレーニングするには、数千億もの推論トークンが必要です。ZenteiQ では、キュレートされた科学文献やシミュレーション データセットに加え、独自に設計、実装したバッチ型合成データ生成パイプラインも利用しています。このパイプラインは、候補となる導出やソルバー検証問題を生成、評価、フィルタしてから、<a href=\"https://github.com/AI-Hypercomputer/maxtext\" target=\"_blank\">MaxText</a> の事前トレーニング ジョブにフィードします。</p><p>ZenteiQ は演算リソースの割り当てを固定して運用しているため、アクセラレータがトレーニング データの生成と検証に 1 時間費やすごとに、事前トレーニングに使える時間が 1 時間減少します。データ生成に遅れが生じると、事前トレーニング用に予約されたマルチホスト アクセラレータ クラスタは、データセット待ちのアイドル状態になります。</p><p><b>データ生成が事前トレーニングの遅れにつながるケース</b></p><p>データの生成速度を最大化するため、パイプラインでは、ワーカー Pod でのプロンプトの準備と、マルチノード アクセラレータ プールにおける vLLM でのモデル サービングを分離しています。各バッチは 4 つの段階を経て処理されます。科学的なシード コンセプトのプロンプト バッチへの拡張、生成モデルによる推論トレース候補の生成、評価モデルによる回答のスコアリング、別のモデル ファミリーによるガードレール チェックを実行した後、検証済みのデータセットを事前トレーニング用にパッケージ化します。</p><p>当初、これらのモデルプールは Kubernetes 上で運用され、推論エンドポイント間で標準的な ClusterIP によるラウンドロビン方式のロード バランシングが行われていました。90 億パラメータおよび 350 億パラメータというモデル スケジュールに対応できるようパイプラインをスケールアップしたところ、2 つのルーティング ボトルネックが発生し、データセットの作成が遅れ始めました。</p><ul><li><b>不均一なエンジンキュー:</b> アップストリームのワーカー Pod は、シード コンセプトを複雑さやレスポンス長が大きく異なるプロンプトへと展開します。標準的なラウンドロビン方式のロード バランシングでは、vLLM のエンジンキュー状況を可視化できないため、近くのノードに余力があるにもかかわらず、長い推論トレースの処理ですでにビジー状態になっているサービング Pod に新たなリクエストを送り続けていました。</li><li><b>冗長なプレフィックス計算:</b> 生成バッチ内のプロンプトでは、指示コンテキストやタスク仕様の約 70～80% が共通しています。ラウンドロビン方式のルーティングでは、同じ指示を含むリクエストが異なるサービング インスタンスに分散されるため、各 Pod はアクセラレータ メモリ内のウォーム キャッシュを再利用できず、同じ共有プロンプト プレフィックスをゼロから再計算しなければなりませんでした。</li></ul><p>不均一なキューと冗長なプレフィル作業が重なることで、1 回の実行における生成スループットが最大半分まで変動し、データセットの作成が長引き、スケジュールされていた事前トレーニングの開始が遅れてしまいました。そのため、研究者にモデル開発を中断させてカスタム推論スケジューラを構築、保守させることなく、vLLM キューの深さやプロンプト キャッシュをリアルタイムで把握できるルーティングが必要でした。</p><p><b>llm-d を搭載した GKE Inference Gateway による基盤構築</b></p><p>ZenteiQ ではすでにデータの準備と MaxText の事前トレーニング ジョブを GKE で実行しているため、チームは同じ Kubernetes プラットフォーム上でデータ生成とモデル トレーニングを管理できます。Google Cloud からの推奨事項に従い、基盤となる科学的手法やパイプライン設計を変更することなくルーティングのボトルネックを解消できるよう、オープンソースの <a href=\"https://llm-d.ai/\" target=\"_blank\">llm-d</a> 分散推論フレームワークを搭載した <a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\">GKE Inference Gateway</a> を、vLLM アクセラレータ プールの前にデプロイしました。</p><p>このパイプラインでは、ワーカー Pod が Cloud Storage から科学的なシード ドキュメントやドメイン分類体系を取得し、それらをマルチステップ プロンプトのバッチへと展開します。これらのバッチは、すべてのモデル ファミリーおよびサービング ノード間のトラフィックを管理する、単一の GKE Inference Gateway デプロイを経由して処理されます。</p><p>モデル階層ごとに独立したルーティングを維持するのではなく、生成リクエスト、評価クエリ、ガードレール チェックを、同じゲートウェイ経由でそれぞれのモデルプールにルーティングします。候補となる回答が評価とガードレール チェックに合格すると、ワーカー Pod が検証済みデータセットの重複排除とパッケージ化を行い、GKE 上のダウンストリームの MaxText 事前トレーニング ジョブで直接使用できるようにします。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_YjgtWZi.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>GKE Inference Gateway は、検証済みデータセットを MaxText の事前トレーニングにフィードする前に、vLLM を実行しているマルチノード アクセラレータ プール全体に、バッチ生成、評価、ガードレールの各リクエストをルーティングします。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>ラウンドロビン方式から負荷とキャッシュを考慮したルーティングへ</b></p><p>GKE Inference Gateway と llm-d を導入すると、ルーティングの決定には、静的なラウンドロビン方式のローテーションではなく、vLLM インスタンスからのリアルタイムのサービング シグナルが使用されます。GKE Inference Gateway は、vLLM エンドポイント全体のリアルタイムのキュー深度や Key-Value（KV）キャッシュの使用率を継続的にモニタリングします。サービング ノードが長い方程式の導出のデコード処理でビジー状態になっている場合、ゲートウェイは受信リクエストを処理能力に余力のあるノードにルーティングします。そのため、近くのノードがアイドル状態であるにもかかわらず、ビジー状態のワーカーの後ろに負荷の高いプロンプトが溜まることはなくなります。</p><p>同時に、ゲートウェイは、科学的指示が一致するリクエストを、そのプレフィックスの KV キャッシュがアクセラレータ メモリ内ですでにウォーム状態にあるサービング ノードにルーティングします。各プロンプトの 70～80% は指示コンテキストが共通していますが、生成される推論の軌跡はリクエストごとに異なります。プレフィックス キャッシュの局所性とキューのリアルタイム バランシングを組み合わせることで、Pod は単一のレプリカに過負荷をかけることなく、繰り返しのプレフィル作業をスキップできるようになります。</p><p><b>スループットの向上とトレーニング実行の予測可能性</b></p><p>llm-d を搭載した GKE Inference Gateway を導入したことで、データ生成パイプラインの処理速度と予測可能性が向上しました。本番環境クラスタ全体で、インテリジェント ルーティングにより以下が実現しました。</p><ul><li><b>フリートのスループットが 4 倍に向上:</b> アクセラレータ 1,000 個あたりの総スループットが毎秒 16,964 トークンから 69,114 トークンに急増し、1 日あたりの出力が <b>14 億 7,000 万トークンから約 60 億トークン</b>に増加しました。</li><li><b>個々のモデルプール全体で 3.5～5.5 倍のパフォーマンス向上:</b> リアルタイムのキュー バランシングにより、各実行を通じてサービング ノードの負荷が均等に保たれ、時間のかかる推論導出に起因する実行中の速度低下が防止されました。</li><li><b>プレフィックス キャッシュ ヒット率が 14 パーセント ポイント向上:</b> 科学的指示が一致するプロンプトをウォーム キャッシュにルーティングすることで、各リクエストが独自の導出に分岐する前に、冗長なプレフィル作業を回避しました。</li></ul><p>研究チームとインフラストラクチャ チームにとって、最も重要な成果はスケジュールの予測可能性でした。1 日の出力が 4 倍になったことで、検証済みデータセットが時間どおりに準備され、データ生成を待つことなく、マルチホストの事前トレーニングがスケジュールどおりに開始されるようになりました。</p><p><b>ZenteiQ における物理 AI の今後の展開</b></p><p>科学基盤モデルを 90 億パラメータから 350 億パラメータ以上へとスケールアップするにあたり、トレーニング後の強化学習（RL）と自動数値ソルバー評価ループにも、これと同じ GKE Inference Gateway と llm-d ルーティング設定を使用する予定です。マルチターン ロールアウトでは、各ターンが前のターンのコンテキストに基づいて構築されるため、キューのリアルタイム バランシングとウォーム プレフィックス キャッシュへの依存度がさらに高くなります。</p><p>これらの機能を独自のワークロードで試すには、<a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\">GKE Inference Gateway のドキュメント</a>と、オープンソースの <a href=\"https://llm-d.ai/\" target=\"_blank\">llm-d プロジェクト</a>をご覧ください。また、Gemini プラットフォーム チームが <a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/how-gke-inference-gateway-improved-latency-for-vertex-ai\">GKE Inference Gateway を使用してレイテンシを 35% 抑えた方法</a>もご確認ください。</p><p><b><i>-</i></b> <i>ZenteiQ、創業者、</i><b><i>Sashikumaar Ganesan 教授</i></b></p><p><b><i>-</i></b> <i>Google Kubernetes Engine、プロダクト マネージャー、</i><b><i>Fisayo Feyisetan</i></b></p></div>"
  "f31986e7baab888f0b0b3846a1da360f":
    "id": "f31986e7baab888f0b0b3846a1da360f"
    "title": "PHP コアの脆弱性 CVE-2026-109618 および CVE-2026-109619 への対応"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619/"
    "published": "2026-10-29 09:00:00"
    "fetched": "2026-10-29 18:22:36"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 22 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">編集者注</strong><span style=\"font-style: italic; vertical-align: baseline;\">: このブログ投稿は 2026 年 10 月 21 日に更新され、太平洋夏時間午後 3 時 30 分に Cloud Armor に関するガイダンス、午後 4 時 25 分にモニタリング、パッチ適用、修復に関するガイダンスが追加されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">PHP と Wiz Research はこのたび、PHP コア言語ランタイムにおける 2 つの重大な脆弱性を公表しました。これらの脆弱性により、アプリケーションが認証なしでのリモートコード実行やメモリ漏洩のリスクにさらされる可能性があります。Wiz は複数のモデルを組み合わせて活用し、これらの脆弱性の特定と修復支援を行いました。</span></p>\n<p><span style=\"vertical-align: baseline;\">特に Gemini 4 Argon は、脆弱性の発見、エクスプロイト開発、攻撃の検知、パッチの検証において計り知れない貢献を果たしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud 自体はこの脆弱性の影響を受けませんが、Google Cloud 上で PHP を実行しているユーザーの皆様は影響を受ける可能性があります。Google Cloud は、これらの脆弱性の深刻度を重く受け止めており、お客様が迅速にアプリケーションの安全を確保できるよう、対策ガイダンスを公開しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">脆弱性の背景</strong></h3>\n<p><span style=\"vertical-align: baseline;\">PHP は、数多くのウェブサイト、コンテンツ マネジメント システム、ウェブ アプリケーションの基盤として広く使われているサーバーサイド スクリプト言語です。2026 年 10 月 21 日、CVE.org はこれらの脆弱性に対して CVE-2026-109618 および CVE-2026-109619 を割り当てました。</span></p>\n<p><span style=\"vertical-align: baseline;\">各 PHP の脆弱性に対する公式の共通脆弱性評価システム（CVSS）のベーススコアは、9.2 の「緊急」と判定されています。一般的に、この判定は、脅威アクターが対象システムをクラッシュさせて乗っ取ったり、データの窃取、改ざん、消去を容易に行ったりできることを意味します。ただし、緩和要因によって脆弱性の悪用が困難になる場合もあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CVE-2026-109618</strong><span style=\"vertical-align: baseline;\">: メモリ不足処理の際、内部リクエスト データが不完全に初期化された状態で PHP の処理が中断される可能性があります。その結果、リクエストのクリーンアップ処理において、この無効なデータが有効なものとして扱われてしまう場合があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CVE-2026-109619</strong><span style=\"vertical-align: baseline;\">: リクエストに紐づく内部状態が、バッキング メモリの解放後も残存してしまう可能性があります。同じワーカーが後続のリクエストを処理する際、通常の初期化によってリセットされる前の古い状態を使用してしまう可能性があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">脆弱性の影響を受けるバージョン</strong><span style=\"vertical-align: baseline;\">: PHP のすべてのバージョン（5.4～8.5.11）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パッチ適用済み</strong><span style=\"vertical-align: baseline;\">: PHP 8.5.12、8.4.27、8.3.36、8.2.35。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パッチ未適用</strong><span style=\"vertical-align: baseline;\">: PHP プロジェクトは、</span><a href=\"https://www.php.net/supported-versions.php\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サポート終了</span></a><span style=\"vertical-align: baseline;\">となった PHP 8.1 以前の修正をリリースしていません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">修正</strong><span style=\"vertical-align: baseline;\">: CVE-2026-109618（</span><a href=\"https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GHSA-w8hw-w9fx-j79w</span></a><span style=\"vertical-align: baseline;\">）と CVE-2026-109619（</span><a href=\"https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GHSA-6wmf-4rv5-p3rp</span></a><span style=\"vertical-align: baseline;\">）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お知らせ</strong><span style=\"vertical-align: baseline;\">: PHP は、これら 2 つの脆弱性に関する</span><a href=\"https://www.php.net/archive/2026.php#2026-10-21-5\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">セキュリティ アドバイザリ</span></a><span style=\"vertical-align: baseline;\">を公開しました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Wiz Research は、この調査と協調的な開示プロセスに関する</span><a href=\"http://wiz.io/blog/php2shell-php-rce\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">詳細な説明を公開</span></a><span style=\"vertical-align: baseline;\">しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">PHP の更新とアプリケーションの再デプロイ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud で PHP アプリケーションを運用されているすべてのお客様は、直ちに PHP 8.2 以降に更新し、パッチ適用済みのバージョンを使用してサービスを再デプロイしてください。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは特に、以下にデプロイされたアプリケーションに適用されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">App Engine スタンダード環境</strong><span style=\"vertical-align: baseline;\">: サポート対象のランタイムには、自動的にパッチが適用されます。PHP 8.1 以前をご利用の場合は、PHP 8.2 以降にアップグレードのうえ、再デプロイしてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">App Engine フレキシブル環境</strong><span style=\"vertical-align: baseline;\">: サポート対象のランタイムを使用して、PHP ランタイムを再デプロイしてください。カスタム ランタイムをご利用の場合は、PHP の依存関係をパッチ適用済みのバージョンに更新し、アプリケーションを再デプロイしてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run</strong><span style=\"vertical-align: baseline;\">: ベースイメージの自動更新を有効にしていない場合、または独自のコンテナ イメージをデプロイしている場合は、パッチ適用済みの PHP バージョンで再構築し、再デプロイしてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Kubernetes Engine（GKE）</strong><span style=\"vertical-align: baseline;\">: パッチ適用済みの PHP バージョンでコンテナ イメージを更新し、Pod を再デプロイしてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud Marketplace</strong><span style=\"vertical-align: baseline;\">: コンテンツ マネジメント システムや LAMP スタックなど、PHP を含む Marketplace ソリューションを運用している場合は、ソリューション プロバイダからのアップデートを適用するか、PHP を直接更新してください。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">サーバーレス プラットフォームにおける自動パッチ適用</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、App Engine スタンダード、App Engine フレキシブル、Cloud Run、Cloud Run functions、Cloud Functions for Firebase のすべてのサポート対象 PHP バージョンに向けて、更新されたサーバーレス ベースイメージのロールアウトを進めています。</span></p>\n<p><span style=\"vertical-align: baseline;\">お客様への影響:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">App Engine スタンダード環境</strong><span style=\"vertical-align: baseline;\">（PHP 8.2 以降）: アプリケーションは自動的に更新されます。ご対応は必要ありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">App Engine フレキシブル環境</strong><span style=\"vertical-align: baseline;\">（すべての PHP バージョン）: アプリケーションは自動的に更新されません。できるだけ早く、アプリケーションを PHP 8.2 以降に再デプロイしてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run functions</strong><span style=\"vertical-align: baseline;\">（PHP 8.2 以降）: ベースイメージの自動更新が有効になっている関数は、自動的に更新されます。ベースイメージの自動更新が有効になっていない関数は、再デプロイする必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run </strong><span style=\"vertical-align: baseline;\">（PHP 8.2 以降）: ベースイメージの自動更新が有効になっているサービスは自動的に更新されます。ベースイメージの自動更新を有効にせず構築されたサービスは、パッチ適用済みのランタイムを反映するために再構築と再デプロイを行う必要があります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">重要な考慮事項:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サポート対象外のランタイムにはパッチが適用されません</strong><span style=\"vertical-align: baseline;\">。アップストリームの PHP プロジェクトは、PHP 8.1 以前のバージョンに対してこれらの修正をバックポートしていません。PHP 5.5、PHP 7.2、PHP 7.3、PHP 7.4、PHP 8.1 で動作しているアプリケーションは脆弱性の影響を受けたままとなるため、PHP 8.2 以降へのアップグレードが必須となります。サーバーレス ライフサイクルの日付については、以下のランタイム サポート スケジュールをご覧ください。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google App Engine スタンダード</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google App Engine フレキシブル</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/run/docs/runtime-support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run functions</span></a></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ご自身で構築したコンテナ イメージは、お客様ご自身の責任となります</strong><span style=\"vertical-align: baseline;\">。独自のコンテナ イメージを Cloud Run や App Engine フレキシブル環境にデプロイしている場合（カスタム ランタイムを使用している場合など）、パッチ適用済みの PHP バージョンで再構築し、再デプロイしてください。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Cloud Armor による CVE-2026-109618 と CVE-2026-109619 のリスク緩和</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">Cloud Armor</strong><span style=\"vertical-align: baseline;\"> では、</span><a href=\"https://docs.cloud.google.com/armor/docs/managed-rules-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Armor マネージド ルール</strong></a><span style=\"vertical-align: baseline;\">を使用した推奨の緩和策を公開しています。マネージド ルールを有効にしているお客様は、追加のご対応は不要です。これらの脆弱性に対する保護機能は自動的に適用されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Armor マネージド ルールをまだデプロイしていない場合でも、今からデプロイすることで、これらの脆弱性のリスクを緩和できます。Cloud Armor マネージド ルールによる保護機能は、自動更新される脅威インテリジェンス ルールセットを通じて</span><strong style=\"vertical-align: baseline;\">現在利用可能</strong><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらのルールは、グローバルまたはリージョン アプリケーション ロードバランサを使用し、インターネットに公開されている PHP アプリケーションやサービスの保護を目的としています。ご利用環境内のすべての脆弱な PHP インスタンスが脆弱性管理プログラムによって更新および検証されるまでの間、最前線の多層防御の緩和策として、以下の手順に沿ってルールを速やかにデプロイしてください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 自動更新用にカナリア版と安定版のマネージド ルールをデプロイします（プレビュー モードと自動適用モード）。</strong></p>\n<p><span style=\"vertical-align: baseline;\">これらの CVE からワークロードを保護するには、少なくとも</span><span style=\"font-style: italic; vertical-align: baseline;\">ファイル アップロード</span><span style=\"vertical-align: baseline;\"> カテゴリと </span><span style=\"font-style: italic; vertical-align: baseline;\">RFI</span><a href=\"https://docs.cloud.google.com/armor/docs/managed-rules-overview#categories\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> カテゴリ</span></a><span style=\"vertical-align: baseline;\">を有効にする必要があります。カナリア版のすべてのルールセット カテゴリをプレビュー モードで構成し、安定版のルールセット カテゴリを自動適用モードで構成することをおすすめします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. 構成済みの検査上限を超えるリクエスト本文のリスクを軽減します。</strong></p>\n<p><span style=\"vertical-align: baseline;\">セキュリティ ポリシーに</span><a href=\"https://docs.cloud.google.com/armor/docs/configure-waf#request-body\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ルールを作成</span></a><span style=\"vertical-align: baseline;\">し、検査されていないコンテンツや不要にサイズの大きなコンテンツがバックエンドに到達しないよう対策を講じてください。これらの CVE では、大きなペイロードを使用してメモリ不足状態を引き起こす可能性があるため、この対策は特に重要となります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">アプリケーションにおける WAF ルールの安全性の検証とテレメトリーの使用</strong></h3>\n<p><span style=\"vertical-align: baseline;\">PHP アプリケーションやコンテンツ管理プラットフォーム（WordPress や Drupal など）によって、クエリ パラメータ、フォーム送信、カスタム エラー ハンドラの構造は大きく異なります。そのため、上述のルールをまず</span><a href=\"https://cloud.google.com/armor/docs/security-policy-overview#preview_mode\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プレビュー モード</span></a><span style=\"vertical-align: baseline;\">でデプロイし、トラフィックを即座にブロックすることなく、予想される影響をテストおよびモニタリングすることを強くおすすめします。</span></p>\n<p><span style=\"vertical-align: baseline;\">新しいルールがアプリケーション トラフィックに対して期待どおりに動作していることを確認したら、プレビュー モードを無効にして、Cloud Armor が </span><code style=\"vertical-align: baseline;\">deny(403)</code><span style=\"vertical-align: baseline;\"> アクションを実際に強制適用できるようにします。Cloud Armor のリクエストごとのウェブ アプリケーション ファイアウォール（WAF）テレメトリーは、Cloud Logging のアプリケーション ロードバランサ ログの一部として出力されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">各リクエストに対する Cloud Armor の決定を検査するには、まずロードバランサのリクエスト ロギングを</span><a href=\"https://cloud.google.com/load-balancing/docs/https/https-logging-monitoring\"><span style=\"text-decoration: underline; vertical-align: baseline;\">バックエンド サービスごとに</span></a><span style=\"vertical-align: baseline;\">有効にする必要があります。有効化すると、それ以降の Cloud Armor の適用およびプレビュー判定はすべて、</span><a href=\"https://cloud.google.com/armor/docs/request-logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらの手順</span></a><span style=\"vertical-align: baseline;\">により Cloud Logging でクエリできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">リスクを最小限に抑え、パフォーマンスを最適化するために、</span><a href=\"https://cloud.google.com/armor/docs/best-practices\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Armor のベスト プラクティス ガイド</span></a><span style=\"vertical-align: baseline;\">を参照し、</span><a href=\"https://cloud.google.com/armor/docs/security-policy-overview#limitations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サービスの制限事項</span></a><span style=\"vertical-align: baseline;\">（前述の検査対象リクエスト本文の最大サイズなど）を考慮することをおすすめします。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">モニタリングと監査</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud および Wiz は、ネイティブのセキュリティ サービス全体で継続的なモニタリング、監査、ランタイム検出を提供し、お客様をサポートしています。お客様は以下を使用できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/artifact-analysis/docs/scan-os-on-demand\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">On-Demand Scanning API</strong></a><span style=\"vertical-align: baseline;\">: ローカル コンピュータ上のイメージや Artifact Registry 内のリモート コンテナ イメージを手動でスキャンできます。</span><a href=\"https://docs.cloud.google.com/artifact-analysis/docs/artifact-analysis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Artifact Analysis</span></a><span style=\"vertical-align: baseline;\"> をご利用のお客様には、新規および既存のアーティファクト双方についてこれらの脆弱性が通知されるため、リスクのあるワークロードを特定できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/security/products/security-command-center\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</strong></a><span style=\"vertical-align: baseline;\">: GKE の Container Threat Detection と Cloud Run の脅威検出を有効化し、ワークロードへの侵入をモニタリングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/security/products/security-operations?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=Cloud-SS-DR-GCP-1713658-GCP-DR-NA-US-en-Google-BKWS-BRO-aiml&amp;utm_content=c-Hybrid+%7C+BKWS+-+BRO+%7C+Txt-AIML-Generative+AI-Gemini+Enterprise-330169309398&amp;utm_term=google+cloud+ai&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=23749696287&amp;gclid=CjwKCAjwxeHWBhBPEiwAiqtQ-XLjde79DC3QIQ_Um-wrxEVpYkGE-vhtuJ3b0SOju8qklgOccgWY3BoCCCUQAvD_BwE&amp;e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Security Operations</strong></a><span style=\"vertical-align: baseline;\">: Mandiant Frontline Threats ルールパックに、23 件のキュレーテッド検出が新たに追加されました。このルールパックが有効になっていることを確認し、検出結果をレビューして、環境への潜在的な影響を評価することをおすすめします。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enterprise Plus をご利用のお客様は、Emerging Threat Center で「GLOBAL.26.015」を検索して詳細を確認することもできます。公開プレビュー版で Threat Hunt Agent を有効化している Enterprise Plus のお客様は、Emerging Threat Center から「GLOBAL.26.015」に対するスレット ハンティングを実行することも可能です。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz</strong><span style=\"vertical-align: baseline;\"> をご利用のお客様は、PHP2Shell に関する Wiz Threat Intel Center のアドバイザリをご参照いただけます。同アドバイザリには、エージェントレスおよびランタイムでの脆弱性検知、Wiz Defend と Sensor による悪用検知、自動対応ポリシーに加え、修復や脅威ハンティングのガイダンスが含まれています。Wiz を使用した対応手順について詳しくは、</span><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">さらに Mandiant Threat Defense は、Google Security Operations におけるキュレーテッド検出のモニタリングや、このキャンペーンに関連する侵入痕跡のハンティングを通じて、お客様を強力にサポートしています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">パッチ適用と修復</strong></h3>\n<p><span style=\"vertical-align: baseline;\">PHP のセキュリティ リリースが公開されました。すべてのサーバー環境、コンテナ イメージ、デプロイ パイプラインで PHP を更新する必要があります。加えて、以下の情報もご確認ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Wiz のゼロデイ対応コミットメントの一環として、</span><strong style=\"vertical-align: baseline;\">WizOS PHP イメージ </strong><span style=\"vertical-align: baseline;\">は、今後 60 日間、すべてのお客様に課金対象外でご利用いただけます。WizOS PHP ベースイメージ（標準の Alpine 堅牢化ビルドおよび FIPS 準拠ビルドの両方）はソースから構築されており、CVE-2026-109618 および CVE-2026-109619 に対するパッチがすでに適用されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Wiz をご利用のお客様は、Green Agent を活用して PHP2Shell Threat Intel アドバイザリを、個々のリソースに最適化された修復ガイダンスに変換できます。このガイダンスには、適切な PHP パッチ バージョンの指定、最適な WAF 緩和策の特定、堅牢化された WizOS PHP イメージへの差し替えの提案、防御にギャップがある場合のランタイム ブロックの有効化の推奨などが含まれます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google は引き続き状況を注視し、必要に応じて最新情報やガイダンスを提供します。最新の情報と詳細な手順については、</span><a href=\"https://docs.cloud.google.com/support/bulletins?hl=ja#gcp-2026-070\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud のセキュリティに関する公開情報</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、CISO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Chris Betz</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google DeepMind、Gemini セキュリティ責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Raluca Ada Popa</strong></p></div>"
"last_updated": "2026-10-29 18:22:36 JST"
