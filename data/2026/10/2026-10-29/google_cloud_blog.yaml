  "836bd21409aabac75f63995b9d28be7a":
    "id": "836bd21409aabac75f63995b9d28be7a"
    "title": "How to troubleshoot GKE workloads faster with VPC Flow Logs"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/using-vpc-flow-logs-to-troubleshoot-gke-workloads/"
    "published": "2026-10-29 01:00:00"
    "fetched": "2026-10-29 02:05:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Having visibility into your network traffic is essential to operating Kubernetes environments effectively. When a service slows down or loses connectivity, knowing who is talking to whom lets you narrow the problem down quickly. In a standard cloud network, flow logs provide that view by recording connections between IP addresses, ports, and protocols. In Kubernetes, however, pods are temporary. Their IP addresses change constantly as pods scale, crash, or move between nodes, so a raw log entry showing 10.4.2.18 talking to 10.4.8.44 tells you little about which workload (and pod) owned that address, what namespace it was in, or what application it was trying to reach. By the time you search your cluster, the pod may already be gone!</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In a Google Cloud environment, </span><a href=\"https://docs.cloud.google.com/vpc/docs/using-flow-logs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC Flow Logs</span></a><span style=\"vertical-align: baseline;\"> closes this gap at the network layer. Google Cloud's virtual network already sees every connection a pod makes, so each sampled flow is recorded with the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE) metadata behind the IP address: pod, workload, namespace, and service. You get workload-level attribution for L3/L4 traffic without deploying extra agents or sidecars, and it complements in-cluster Container Network Interface (CNI) and dataplane observability tools you may already run when you need deeper detail. Let’s take a deeper look at how VPC Flow Logs and GKE work together, and how to get started with it.</span></p>\n<h3 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">How GKE metadata enriches VPC Flow Logs</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">VPC Flow Logs samples traffic directly inside Google Cloud's virtual network. When flow logs are enabled for a subnet that hosts a GKE cluster, every record of pod traffic that passes through the VPC network is annotated with the Kubernetes context that owned the IP address at the time of sampling. This helps ensure the context is preserved even after the pod is gone:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Cluster: </strong><span style=\"vertical-align: baseline;\">The cluster name and location.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Workload: </strong><span style=\"vertical-align: baseline;\">The pod name and namespace, along with the controller that owns the pod, such as a deployment, StatefulSet, or DaemonSet.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Service name: </strong><span style=\"vertical-align: baseline;\">The Kubernetes service that received the traffic.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Node and zone:</strong><span style=\"vertical-align: baseline;\"> The standard VPC fields, including the node VM and its zone on both ends of the flow.</span></p>\n</li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">If you register your GKE workloads in </span><a href=\"https://docs.cloud.google.com/app-hub/docs/overview?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">App Hub</span></a><span style=\"vertical-align: baseline;\">, each record also carries application-level labels (</span><code style=\"vertical-align: baseline;\">apphubSource</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">apphubDestination</code><span style=\"vertical-align: baseline;\">) that identify the business application, environment, and criticality of each endpoint. This is especially useful when GKE microservices talk to App Hub-registered resources outside the cluster, such as Cloud Run services.</span></p>\n<h3 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Before you start</strong></h3>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Upgrade your log bucket to </strong><a href=\"https://cloud.google.com/network-intelligence-center/docs/flow-analyzer/enable-log-analytics\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Observability Analytics</strong></a><strong style=\"vertical-align: baseline;\"> (formerly Log Analytics): </strong><span style=\"vertical-align: baseline;\">Flow Analyzer reads only from an upgraded bucket, typically </span><code style=\"vertical-align: baseline;\">_Default</code><span style=\"vertical-align: baseline;\">. </span><strong style=\"vertical-align: baseline;\">Note:</strong><span style=\"vertical-align: baseline;\"> This upgrade is permanent.<br /></span><code style=\"vertical-align: baseline;\">gcloud logging buckets update _Default \\<br /></code><code style=\"vertical-align: baseline;\">    --location=global \\<br /></code><code style=\"vertical-align: baseline;\">    --enable-analytics</code></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Enable VPC Flow Logs organization-wide:</strong><span style=\"vertical-align: baseline;\"> One organization-level configuration covers every subnet in every VPC network, including future clusters (requires Network Management Admin role). Keep </span><code style=\"vertical-align: baseline;\">include-all-metadata</code><span style=\"vertical-align: baseline;\"> on so every record carries namespace and pod details. To balance visibility against cost, you can add a secondary sampling rate (</span><code style=\"vertical-align: baseline;\">--flow-sampling</code><span style=\"vertical-align: baseline;\">), an aggregation interval (</span><code style=\"vertical-align: baseline;\">--aggregation-interval</code><span style=\"vertical-align: baseline;\">), or a filter expression (</span><code style=\"vertical-align: baseline;\">--filter-expr</code><span style=\"vertical-align: baseline;\">) to view only the traffic of interest.<br /></span><code style=\"vertical-align: baseline;\">gcloud network-management vpc-flow-logs-configs create CONFIG_NAME \\<br /></code><code style=\"vertical-align: baseline;\">    --location=global \\<br /></code><code style=\"vertical-align: baseline;\">    --organization=ORGANIZATION_ID \\<br /></code><code style=\"vertical-align: baseline;\">    --metadata=include-all-metadata</code></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Turn on </strong><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/intranode-visibility\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">intranode visibility</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Autopilot clusters already have it, but you need to enable it on Standard clusters. </span><strong style=\"vertical-align: baseline;\">Note: </strong><span style=\"vertical-align: baseline;\">Enabling it restarts control plane and node components and adds some per-node overhead, so test it on a non-production cluster first.<br /></span><code style=\"vertical-align: baseline;\">gcloud container clusters update CLUSTER_NAME \\<br /></code><code style=\"vertical-align: baseline;\">    --location=LOCATION \\<br /></code><code style=\"vertical-align: baseline;\">    --enable-intra-node-visibility</code></p>\n<p><span style=\"vertical-align: baseline;\">Now you’re ready to get started.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Analyze traffic visually in Flow Analyzer</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">VPC Flow Logs write every record to Cloud Logging, you can search and query it in Logs Explorer or Log Analytics. For day-to-day work, </span><a href=\"https://docs.cloud.google.com/network-intelligence-center/docs/flow-analyzer/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Flow Analyzer</span></a><span style=\"vertical-align: baseline;\">, part of Network Intelligence Center, turns the same records into an interactive chart and table, so you can group and filter traffic by cluster, namespace, workload, pod, or service in a few clicks. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The walkthroughs below use </span><a href=\"https://github.com/GoogleCloudPlatform/microservices-demo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Online Boutique</span></a><span style=\"vertical-align: baseline;\">, an open-source microservices demo, on a GKE Autopilot cluster in us-central1. A </span><code style=\"vertical-align: baseline;\">loadgenerator</code><span style=\"vertical-align: baseline;\"> deployment sends synthetic shopper traffic to the </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\">, which calls </span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">cartservice</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">currencyservice</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">recommendationservice</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">shippingservice</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">adservice</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">checkoutservice</code><span style=\"vertical-align: baseline;\">. </span></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Case 1: Turn IP addresses into workload names</strong></p>\n<p><span style=\"vertical-align: baseline;\">Whether you’re investigating an incident or assessing an architecture change, the first question is always the same: Which endpoints are communicating, and at what volume? </span></p>\n<p><span style=\"vertical-align: baseline;\">Rather than presenting ephemeral IP address pairs, GKE metadata allows Flow Analyzer to answer this question directly using Kubernetes workload names.</span></p>\n<p><span style=\"vertical-align: baseline;\">Steps in Flow Analyzer:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Open </span><strong style=\"vertical-align: baseline;\">Network Intelligence Center</strong><span style=\"vertical-align: baseline;\"> &gt; </span><strong style=\"vertical-align: baseline;\">Flow Analyzer</strong><span style=\"vertical-align: baseline;\"> and set the time range to </span><strong style=\"vertical-align: baseline;\">last 1 hour</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Under </span><strong style=\"vertical-align: baseline;\">Source</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">Destination</strong><span style=\"vertical-align: baseline;\">, set </span><strong style=\"vertical-align: baseline;\">Organize flows</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">by</strong><span style=\"vertical-align: baseline;\"> to GKE workload.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">In the filter bar, add the </span><strong style=\"vertical-align: baseline;\">GKE workload is known</strong><span style=\"vertical-align: baseline;\"> filter so only pod-to-pod traffic is shown.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Click </span><strong style=\"vertical-align: baseline;\">Run new query</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_HzpvhDD.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Grouping traffic by Source GKE workload and Destination GKE workload in Flow Analyzer to map microservice dependencies without raw IP lookups.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Key insights: </strong><span style=\"vertical-align: baseline;\">Sorted by volume, the table is a ready-made application dependency map: </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\"> handles incoming requests from </span><code style=\"vertical-align: baseline;\">loadgenerator</code><span style=\"vertical-align: baseline;\"> (representing user traffic), while </span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\"> answers calls from both </span><code style=\"vertical-align: baseline;\">recommendationservice</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\">. Because each row shows workload names instead of raw IP addresses, any unauthorized or unexpected workload-to-workload communication immediately becomes apparent.</span></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Case 2: Drill into a single service<br /></strong><span style=\"vertical-align: baseline;\">When a service is slow or about to change, you need to know who depends on it and how heavily.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Steps in Flow Analyzer:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Change </span><strong style=\"vertical-align: baseline;\">Traffic aggregation</strong><span style=\"vertical-align: baseline;\"> to </span><strong style=\"vertical-align: baseline;\">Client</strong><span style=\"vertical-align: baseline;\"> ↔</span><strong style=\"vertical-align: baseline;\"> server (bidirectional)</strong><span style=\"vertical-align: baseline;\">, so requests and responses between a pair are counted together.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Under </span><strong style=\"vertical-align: baseline;\">Server</strong><span style=\"vertical-align: baseline;\">, add the filter </span><strong style=\"vertical-align: baseline;\">GKE workload</strong><span style=\"vertical-align: baseline;\"> = </span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Click</span><strong style=\"vertical-align: baseline;\"> Run new query</strong><span style=\"vertical-align: baseline;\">, then click </span><strong style=\"vertical-align: baseline;\">Details</strong><span style=\"vertical-align: baseline;\"> on the top row.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_H9re5kG.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Filtering on Server GKE workload (productcatalogservice) with Client ↔ server (bidirectional) aggregation to view caller share and the Details timeline.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Key insights:</strong><span style=\"vertical-align: baseline;\"> You get every caller of the catalog service, each caller's share of its traffic, and a timeline for every pair, so if one caller's line climbs while the others stay flat, you know where to look first. When the question is latency rather than volume, switch the display mode to latency to rank the same callers by round-trip time. </span></p>\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Case 3: Find the pods that talk across zones<br /></strong><span style=\"vertical-align: baseline;\">In a regional GKE cluster, chatty services that land in different zones send every request across a zone boundary, adding inter-zone data transfer charges. Because VPC Flow Logs record the zone at both ends of every flow, the pod pairs driving that traffic are easy to spot.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Steps in Flow Analyzer:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Switch from </span><strong style=\"vertical-align: baseline;\">Basic filters</strong><span style=\"vertical-align: baseline;\"> to </span><strong style=\"vertical-align: baseline;\">SQL filters</strong><span style=\"vertical-align: baseline;\">, which let you compare two fields of the same flow.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In the </span><strong style=\"vertical-align: baseline;\">WHERE</strong><span style=\"vertical-align: baseline;\"> box, enter </span><code style=\"vertical-align: baseline;\">src_gcp_zone &lt;&gt; dest_gcp_zone</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Set </span><strong style=\"vertical-align: baseline;\">Organize flows</strong><span style=\"vertical-align: baseline;\"> by to </span><strong style=\"vertical-align: baseline;\">Source GCP zone, Source GKE pod, Destination GCP zone</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Destination GKE pod</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Click </span><strong style=\"vertical-align: baseline;\">Run new query</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_3n9hbpu.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Using SQL filters with src_gcp_zone &lt;&gt; dest_gcp_zone and multi-attribute grouping to identify pod pairs driving cross-zone network traffic.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Key insights:</strong><span style=\"vertical-align: baseline;\"> The table displays cross-zone traffic ranked by volume, identifying the exact pods and zones on each end. In our cluster, the top flows occur between a </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\"> pod in us-central1-b and a </span><code style=\"vertical-align: baseline;\">currencyservice</code><span style=\"vertical-align: baseline;\"> pod in us-central1-c, followed by </span><code style=\"vertical-align: baseline;\">checkoutservice</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">shippingservice</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\"> pairs. To investigate further, click Explore in Log Analytics to open the underlying SQL query for additional customization, such as adding joins or time buckets.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">GKE has a built-in answer: set </span><code style=\"vertical-align: baseline;\">trafficDistribution: PreferSameZone</code><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">PreferClose</code><span style=\"vertical-align: baseline;\"> on older versions) on the Service to prefer healthy endpoints in the caller's zone, and make sure each zone has enough replicas to serve its own traffic.</span></p>\n<h3 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">What to keep in mind</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Pod-to-internet traffic:</strong><span style=\"vertical-align: baseline;\"> VPC Flow Logs carry no pod annotations, because the masquerade agent replaces the pod IP with the node IP before the flow is sampled. Keeping internal destinations in the non-masquerade list preserves pod names for those flows, and if you run </span><code style=\"vertical-align: baseline;\">ip-masq-agent</code><span style=\"vertical-align: baseline;\"> with intranode visibility, that list must also include the cluster's node and pod IP ranges to avoid connectivity problems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Blocked traffic:</strong><span style=\"vertical-align: baseline;\"> Traffic blocked by a network policy never reaches the VPC network, so use </span><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/network-policy-logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NetworkPolicy logging</span></a><span style=\"vertical-align: baseline;\"> to investigate it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Sampling:</strong><span style=\"vertical-align: baseline;\"> Flow logs are sampled, which makes </span><a href=\"https://services.google.com/fh/files/misc/vpc_flow_logs_understanding_byte_and_packet_counts.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">byte and packet counts</span></a><span style=\"vertical-align: baseline;\"> well suited for ranking and trending rather than per-connection accounting.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Next steps</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">If your clusters already have VPC Flow Logs turned on, upgrading the </span><code style=\"vertical-align: baseline;\">_Default</code><span style=\"vertical-align: baseline;\"> bucket and opening Flow Analyzer is all it takes to reproduce the three walkthroughs above. To learn more, see the documentation:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/vpc/docs/using-flow-logs#gke\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Using VPC Flow Logs</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/vpc/docs/about-flow-logs-records#gke-annotations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC Flow Logs record format for GKE</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/network-intelligence-center/docs/flow-analyzer/analyze-traffic-flows\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Analyzing network traffic with Flow Analyzer</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/best-practices/network-observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Best practices for GKE network observability</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/troubleshooting/network-observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Troubleshooting GKE network observability</span></a></p>\n</li>\n</ul></div>"
  "9d2e253a1947ed20e5d1561a8929e5e0":
    "id": "9d2e253a1947ed20e5d1561a8929e5e0"
    "title": "How GKE networking scales to support high densities of concurrent AI agents"
    "link": "https://cloud.google.com/blog/products/networking/gke-networking-dataplane-for-large-agentic-ai-workloads/"
    "published": "2026-10-29 01:00:00"
    "fetched": "2026-10-29 02:05:37"
    "summary": "<div class=\"block-paragraph\"><p>What do you need to orchestrate high-density concurrent AI agents? As we transition from static requests toward autonomous agentic workflows, the need for secure, high-density sandboxes is pushing conventional infrastructure far beyond its architectural breaking point. This transition is driving top-tier research labs to demand infrastructure at unprecedented scale — often up to one million concurrent code-execution sandboxes!</p><p>At this scale, the efficiency of your Kubernetes networking infrastructure directly impacts the economic viability of an agentic initiative. In advanced workflows like reinforcement learning (RL), extreme pod churn can mean thousands of isolated sandboxes spinning up and down every minute. To make sure that valuable GPUs and TPUs are spending their time executing models rather than waiting on sandboxes to initialize, you need sub-second provisioning and extreme compute density.</p><p>By providing secure, lightweight isolation, <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><b>Agent Sandbox</b></a> on GKE is uniquely positioned to power these highly dynamic execution environments. Furthermore, for next-generation workloads with millions of concurrent idle sessions, Agent Substrate on GKE builds on these primitives to deliver even greater density and sub-second state rehydration.</p><p>In this post, you will learn how <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dataplane-v2\">GKE Dataplane V2</a> optimizes network identity management, solves identity scaling limits, and enables sub-second provisioning to power high-density, large-scale AI agent workloads.</p><h3>A common scale challenge: network identity management</h3><p>Operating with massive concurrency introduces fascinating new engineering challenges, particularly in how you manage network identities. Traditionally, custom controllers and workload orchestrators often assign unique, dynamic labels to each pod (such as agent-id, timestamps, or claim-uid). <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dataplane-v2\"><b>GKE Dataplane V2</b></a>, powered by <a href=\"https://ebpf.io/\" target=\"_blank\">eBPF</a> technology, helps enforce robust network security policies by mapping pod labels to a numeric identity. Because agentic workflows generate highly unique labels for every pod, the system proactively provisions a distinct identity for each sandbox. In a rapidly changing environment, this serial allocation process can briefly pause pod creation as the system securely updates eBPF maps, occasionally leading to slower-than-desired initialization. Additionally, sophisticated workloads can approach the cluster-wide limit of 65,536 network identities, either through this rapid generation or overall scale of the workload itself.</p><h3>GKE network dataplane innovations for an agentic world</h3><p>Providing a reliable and highly secure platform is fundamental to everything we do. As such, we needed to find a way to provide the same underlying identity and security controls while providing higher scalability and performance. That's where the architectural innovations in GKE Dataplane V2 come in. <a href=\"https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox?e=48754805#:~:text=%E2%80%9CTo%20push%20the,Engineer%2C%20Mistral%20AI\">A customer has testified to the success of Agent Substrate on GKE</a> to orchestrate hundreds of thousands of secure environments across clusters and handle spikes of over 30,000 sandboxes on a single cluster.</p><p>To achieve this, GKE relies on a two-pronged networking approach:</p><p><b>Migrating high-cardinality data</b></p><p>Google's GKE Dataplane V2 separates \"identifying\" data from \"functional\" metadata. Ensure your fields that do not actively participate in <a href=\"https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/\" target=\"_blank\">service selector</a> matching or core resource grouping are migrated from the Pod's Labels set to the Annotations set. GKE Dataplane V2 intelligently calculates network identities based on labels rather than annotations, moving this high-cardinality metadata out of the labels completely bypasses the need for per-Pod identity generation. This elegant shift natively resolves identity scaling limits without sacrificing visibility.</p><p><b>Advanced Cilium label filtering</b></p><p>In addition, applying precise label exclusion filters (e.g., using the cilium-config-emergency-override ConfigMap in kube-system) by configuring rules like !agents.x-k8s.io/sandbox-name-hash or !timestamp, these explicitly instruct GKE Dataplane V2 to gracefully ignore these <a href=\"https://docs.cilium.io/en/stable/operations/performance/scalability/identity-relevant-labels/\" target=\"_blank\">dynamic labels</a> during security identity calculation.</p><p>This means that even if a developer framework inadvertently introduces high-cardinality labels, configuring appropriate exclusion filters allows Google’s network dataplane to drop them automatically.</p><p>As a result, identical agent types continue sharing a single Cilium pod identity, maintaining the ultra-low-latency startup times critical for dynamic AI workloads. By preventing linear identity growth and avoiding Cilium’s 65,536 identity limit, GKE provides leading speed and efficiency for fully isolated agents with 300 sandboxes per second at sub-second latency.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_qePrOOs.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Looking ahead</b></h3><p>For workloads that require extreme performance, scale, and density, <a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate\">Agent Substrate</a> natively integrates these GKE Dataplane V2 recommendations while bypassing Kubernetes scheduling limits, pushing GKE’s performance and scale even further. In benchmark validation running 200,000 agents, Agent Substrate sustained 500 activations per second at less than 500 ms suspend and resume latency. You can deploy it on your existing GKE clusters today to minimize idle compute costs for your most demanding AI workflows.<br /></p><p>By optimizing network identity calculation and filtering high-cardinality metadata, GKE Dataplane V2 addresses critical infrastructure bottlenecks in large-scale AI workloads. These architectural improvements reduce sandbox provisioning latency to sub-second levels, minimize expensive GPU idle times, and help maintain high compute density. Ultimately, these efficiencies let you scale your agentic AI operations reliably while controlling operational costs.</p><p>To learn more, explore <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\">Agent Sandbox</a> and <a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/install-overview-substrate\">Agent Substrate</a> on GKE.</p></div>"
  "2c0b8366b4392b990aab77d7a881496b":
    "id": "2c0b8366b4392b990aab77d7a881496b"
    "title": "Introducing the AlloyDB Omni web UI for easier cluster observability"
    "link": "https://cloud.google.com/blog/products/databases/alloydb-omni-delivers-a-web-ui-for-cluster-observability/"
    "published": "2026-10-29 01:00:00"
    "fetched": "2026-10-29 02:05:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Managing PostgreSQL databases across on-premises, edge, and multi-cloud environments often forces administrators to rely on command-line tools, making it hard to see cluster health and quickly diagnose issues. To solve this, we are announcing the General Availability (GA) of the AlloyDB Omni Web UI for </span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/install-web-ui\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Red Hat</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/alloydb/omni/kubernetes/current/docs/install-web-ui\"><span style=\"text-decoration: underline; vertical-align: baseline;\">containers</span></a><span style=\"vertical-align: baseline;\">. This production-ready, read-only console gives you direct visibility into hardware telemetry, query performance, and configuration flags for </span><a href=\"https://cloud.google.com/alloydb/omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni</span></a><span style=\"vertical-align: baseline;\"> so you can troubleshoot workloads quickly and safely without leaving your local or enterprise environment.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What is AlloyDB Omni?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Omni is a downloadable, self-managed edition of AlloyDB that brings enterprise capabilities and full PostgreSQL compatibility to your own infrastructure. Built to run anywhere — across on-premises data centers, edge environments, and multi-cloud deployments — it includes built-in columnar acceleration and integrated AI tooling. With AlloyDB Omni, you can modernize demanding transactional and analytical workloads while retaining complete control over your operating environment.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key Web UI capabilities at a glance</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cluster overview and profiles:</strong><span style=\"vertical-align: baseline;\"> Switch between target connection profiles quickly without using the command line.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">System monitoring:</strong><span style=\"vertical-align: baseline;\"> View real-time performance telemetry for CPU, memory, and disk I/O to plan capacity and triage infrastructure issues.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Query performance:</strong><span style=\"vertical-align: baseline;\"> Identify resource-heavy SQL statements through a visual breakdown of database load, latency bottlenecks, and slow queries.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Columnar Engine diagnostics:</strong><span style=\"vertical-align: baseline;\"> Track the in-memory columnar store, caching, and coverage to verify analytical query acceleration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Parameter and flag auditing:</strong><span style=\"vertical-align: baseline;\"> Inspect runtime database parameters centrally to identify configuration drift against your organizational baselines.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB AI and ecosystem shortcuts:</strong><span style=\"vertical-align: baseline;\"> Inspect vector search and AI workflows, and access quick launchpad shortcuts for ecosystem tools like pgBackRest.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Production-safe diagnostics and profile management</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When you triage complex database workloads across bare-metal VMs, containers, or Kubernetes, you need a clear, isolated view of instance health. The Web UI provides a dedicated visual environment for this.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Profile management:</strong><span style=\"vertical-align: baseline;\"> Store and toggle between saved connection profiles for local development, staging, or production environments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read-only operations:</strong><span style=\"vertical-align: baseline;\"> The interface operates strictly in read-only mode, ensuring that diagnostic sessions cannot execute write commands or modify your underlying database configurations.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Dual-layer observability: System and query monitoring</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To isolate production performance spikes, you need immediate visibility into both hardware health and SQL statement execution.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">System monitoring:</strong><span style=\"vertical-align: baseline;\"> The Web UI integrates with standard Prometheus telemetry to show you real-time CPU use, memory allocation, storage I/O, and active connection trends.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Query monitoring:</strong><span style=\"vertical-align: baseline;\"> The dashboard automatically ranks execution-heavy SQL statements by total latency and call frequency. You can instantly isolate unindexed or resource-intensive queries to resolve issues faster.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 System Insights and Query Insights in AlloyDB Omni Web UI\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_System_Insights_and_Query_Insights_in_AlloyDB_Omni_Web_UI.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>System Insights and Query Insights in AlloyDB Omni Web UI</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Real-time Columnar Engine diagnostics</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Omni includes an advanced Columnar Engine that organizes frequently accessed data in memory, accelerating analytical queries significantly compared to standard PostgreSQL. The Web UI helps you monitor this feature directly:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Memory footprint tracking:</strong><span style=\"vertical-align: baseline;\"> Check real-time columnar memory consumption against your hardware limits.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Columnarization and cache coverage:</strong><span style=\"vertical-align: baseline;\"> See exactly which tables and columns are actively cached in memory to confirm your workloads are running as fast as possible.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 AlloyDB AI and Columnar Engine Insights in AlloyDB Omni Web UI\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_AlloyDB_AI_and_Columnar_Engine_Insights_in_AlloyDB_Omni_Web_UI.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AlloyDB AI and Columnar Engine Insights in AlloyDB Omni Web UI</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Database flag and parameter auditing</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Keeping database parameters uniform across distributed environments keeps your operations stable. The Web UI gives you a central catalog to inspect active database flags and runtime settings. You can verify node settings against your organizational policies without connecting to servers via SSH or parsing configuration files manually. If configuration drift is detected, changes should be applied via the authoritative provisioning workflow (e.g., updating Kubernetes CRDs/GitOps manifests, running Ansible playbooks, or using alloydbctl).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 Database flags in AlloyDB Omni Web UI\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_Database_flags_in_AlloyDB_Omni_Web_UI.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Database flags in AlloyDB Omni Web UI</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Built-in AlloyDB AI and tooling hub</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As you build generative AI applications on top of PostgreSQL, the Web UI gives you direct visibility into vector search workflows and AI model integrations. You can also quickly navigate to documentation and external ecosystem resources, including backup tools like pgBackRest, directly from the console's tooling hub.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Operational scope and prerequisites</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We designed the AlloyDB Omni Web UI with clear operational boundaries so you can deploy it easily within enterprise security boundaries and air-gapped environments.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Non-Intrusive Monitoring:</strong><span style=\"vertical-align: baseline;\"> The interface operates with minimal permissions out of the box, preserving your existing command-line tools and CI/CD pipelines as the authoritative controls for cluster provisioning and administrative workflows.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Standard monitoring prerequisites:</strong><span style=\"vertical-align: baseline;\"> To see complete system hardware metrics, you need standard Prometheus monitoring configured within your host environment.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ready to modernize your PostgreSQL workloads and get dedicated observability for your AlloyDB Omni cluster ?</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sign up for enterprise access: </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">To request access to RPM-based enterprise distributions, advanced tooling, and the Web UI, complete the </span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdBfJeIDN_cG7IgCCOs8zlyJeXhueTaGZV4lUjSzgteQ2k9LA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sign-up form for RPM based deployment</span></a><span style=\"vertical-align: baseline;\"> of AlloyDB Omni.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">To request access to container-based enterprise distributions, advanced tooling, and the Web UI, complete the </span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSep1HzCiseWXq_0oTPs9wOTVWQuH2yAK225SbggvvuqWzMPjQ/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sign-up form for container-based deployment</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Install the Web UI: Follow the step-by-step installation instructions in the AlloyDB Omni documentation to deploy the AlloyDB Omni Web UI</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">For deployment using Red Hat RPM: </span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/install-web-ui\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deploy via native RPM Package</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">For deployment using Docker or Podman: </span><a href=\"https://docs.cloud.google.com/alloydb/omni/kubernetes/current/docs/install-web-ui\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deploy via container image</span></a></p>\n</li>\n</ul>\n</ul></div>"
  "655da88d807504fad81afff8b707fc03":
    "id": "655da88d807504fad81afff8b707fc03"
    "title": "Near-zero downtime upgrades: Announcing Cloud SQL for MySQL blue-green deployments"
    "link": "https://cloud.google.com/blog/products/databases/cloud-sql-blue-green-deployments/"
    "published": "2026-10-29 01:00:00"
    "fetched": "2026-10-29 02:05:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Keeping production databases on supported versions shouldn’t require giving up your weekend. To stay secure, compliant, and with the best performance and newest AI capabilities, organizations need to run on the latest database engine versions. Yet for many teams, major version upgrades mean weeks of cross-team coordination, negotiating narrow maintenance windows, and hours of application downtime. In an era where mission-critical applications and AI agents operate as 24/7 systems of action, even a brief maintenance outage can mean disrupted customer experiences and lost revenue.</span></p>\n<p><span style=\"vertical-align: baseline;\">To help, we are excited to announce the </span><a href=\"https://docs.cloud.google.com/sql/docs/mysql/about-blue-green-deployments\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">preview of fully managed blue-green deployments in Cloud SQL</strong></a><span style=\"vertical-align: baseline;\">, starting with Cloud SQL for MySQL. You can now execute major version upgrades and configuration updates with minimal downtime via the Google Cloud console or automated CLI scripts. By continuously synchronizing a parallel environment, teams can safely test with production data before a seamless cutover — all while keeping the original database as a reliable safety net after the switchover.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why the upgrade dilemma matters to your business</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Putting off major version upgrades (like moving from MySQL 8.0 to 8.4) exposes you to security vulnerabilities and causes you to miss out on performance improvements and latest AI capabilities. To test changes and avoid in-place upgrade downtime, teams often turn to a blue-green deployment — testing changes on a separate, upgraded staging copy (green) alongside the live database (blue) and switching traffic over once it’s ready. However, manual blue-green setups are incredibly complex to build, synchronize, and safely cut over.</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud SQL’s fully managed blue-green deployments can turn your database upgrades from a high-risk weekend project into a predictable, low-downtime operation.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">                 The traditional upgrade</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">The managed blue-green way</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Late-night maintenance:</strong><span style=\"vertical-align: baseline;\"> Scheduling hours of offline downtime at 2:00 AM on a Saturday.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Business-hour upgrades: </strong><span style=\"vertical-align: baseline;\">Staging, sync, and testing happen in the background during normal work hours.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Limited testing options</strong><span style=\"vertical-align: baseline;\">: </span><span style=\"vertical-align: baseline;\">Tests are limited to non-production environments, adding operational risks.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Pre-cutover verification:</strong><span style=\"vertical-align: baseline;\"> Safely testing actual applications against real-time production data copy </span><span style=\"font-style: italic; vertical-align: baseline;\">before</span><span style=\"vertical-align: baseline;\"> any traffic shifts.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">High-stress rollbacks:</strong><span style=\"vertical-align: baseline;\"> If an issue is found, rebuilding or restoring from backups takes hours.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Built-in fallback: </strong><span style=\"vertical-align: baseline;\">Cancel the upgrade and leave your blue instance as is if issues come up, or keep your “old blue” as a manual fallback after cutover.</span></p>\n<p> </p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">The technical differentiators</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With Cloud SQL, managed blue-green deployments automate the entire lifecycle across three stages:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Blue environment (production):</strong><span style=\"vertical-align: baseline;\"> Your current primary Cloud SQL instance, which continues serving live application traffic without interruption.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Green environment (staging):</strong><span style=\"vertical-align: baseline;\"> A temporary clone of your blue instance that Cloud SQL upgrades to your target database version and keeps in sync via continuous replication.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Switchover:</strong><span style=\"vertical-align: baseline;\"> When you're ready to cut over, Cloud SQL briefly sets the blue instance to read-only, finishes the final data synchronization, and promotes the green instance to your new primary database.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Diagram.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Three notable capabilities make this release a game-changer for enterprise workloads:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Near-zero downtime cutover:</strong><span style=\"vertical-align: baseline;\"> The transition from the old version to the new version is incredibly fast. Organizations using Cloud SQL Enterprise Plus experience </span><strong style=\"vertical-align: baseline;\">sub-second downtime for maintenance</strong><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No application changes:</strong><span style=\"vertical-align: baseline;\"> When you trigger the switchover, Cloud SQL automatically transfers your existing database IP address, instance name, and backups to the new database. Your developers do not need to rewrite connection strings, modify configuration files, or update client applications.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Safe, real-data testing: </strong><span style=\"vertical-align: baseline;\">You can run real application traffic and queries against the upgraded green environment to verify performance before going live. If you spot an issue, simply delete the deployment before switchover without touching your live database.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Simple to orchestrate, built to scale</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Upgrading your database environment can now be initiated in just a few clicks within the console, or via a simple CLI script.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;# Create the synchronized, upgraded green deployment environment\\r\\ngcloud sql blue-green-deployments create my-upgrade \\\\\\r\\n    --source-instance=prod-mysql-db \\\\\\r\\n    --target-database-version=MYSQL_8_4\\r\\n\\r\\n# Check the status and get the test endpoint\\r\\ngcloud sql blue-green-deployments describe my-upgrade \\\\\\r\\n--region=us-central1\\r\\n\\r\\n# Connect and test the upgraded copy\\r\\ngcloud sql connect TARGET_INSTANCE_NAME --user=admin\\r\\n\\r\\n# Switch your live traffic to the upgraded database in seconds\\r\\ngcloud sql blue-green-deployments switchover my-upgrade\\r\\n\\r\\n# Clean up the old database when you&#x27;re ready\\r\\ngcloud sql blue-green-deployments delete my-upgrade \\\\\\r\\n    --region=us-central1 \\\\\\r\\n    --delete-old-source&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe1f3d81250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">With near-zero downtime switchovers, this feature takes the risk out of database upgrades. By shifting maintenance from a weekend chore to a routine daytime task, your team can stay ahead of security lifecycles, unlock the latest AI-ready engine features, and focus on building features that drive business growth, not managing infrastructure risk.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Try it today</span></h3>\n<p><a href=\"https://docs.cloud.google.com/sql/docs/mysql/about-blue-green-deployments\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Near-zero downtime database upgrades</span></a><span style=\"vertical-align: baseline;\"> are available in preview for Cloud SQL for MySQL standalone primary instances, including High Availability configurations, with support for PostgreSQL coming soon.</span></p>\n<p><span style=\"vertical-align: baseline;\">Get started today by visiting the</span> <a href=\"https://console.cloud.google.com/sql\"><span style=\"vertical-align: baseline;\">Cloud SQL console</span></a><span style=\"vertical-align: baseline;\"> or reviewing the</span> <a href=\"https://cloud.google.com/sql/docs\"><span style=\"vertical-align: baseline;\">step-by-step documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "0ec179252dba70e5d09298540c2ed87c":
    "id": "0ec179252dba70e5d09298540c2ed87c"
    "title": "Behind the scenes, two months later: How we ship Google Agent Skills like products"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/behind-the-scenes-two-months-later-how-we-ship-google-agent-skills-like-products/"
    "published": "2026-10-29 01:00:00"
    "fetched": "2026-10-29 02:05:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In my previous post, I took you </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/behind-the-scenes-how-we-build-test-and-scale-google-agent-skills\"><span style=\"text-decoration: underline; vertical-align: baseline;\">behind the scenes of Google Agent Skills</span></a><span style=\"vertical-align: baseline;\">, covering how the project started, how we maintain quality at scale, and how we handle governance. In this post, I'll share what we've built since then: the automated quality gates that every change must pass, the AI review agent that inspects skill quality, and the lessons that we learned along the way. You can adopt similar gates and review rules in your own skill repository.</span></p>\n<p><span style=\"vertical-align: baseline;\">Since my last post, the </span><a href=\"https://g.dev/ai/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Skills repository</span></a><span style=\"vertical-align: baseline;\"> has passed 21,000 GitHub stars, up from 15,000. It now hosts over 170 skills from teams across Google, and we distribute them across multiple AI platforms.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ship-agent-skills-like-products-star-history\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/google_skills_star_history_CVeg34U.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Building agent skills for a single developer or a small project is straightforward. You write a </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> file, define a few instructions, test it manually, and it works. At our scale, manual workflows stop being effective. Unvetted edits can introduce subtle bugs, and it becomes difficult to catch issues before they reach users.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">The core philosophy: Ship skills like products</strong></h2>\n<p><span style=\"vertical-align: baseline;\">One key lesson from my previous post: a skill is a living product, not a one-off document. In practice, that means we ship every skill update like a product release.</span></p>\n<p><span style=\"vertical-align: baseline;\">It's tempting to treat a skill as documentation. But documentation explains concepts to a human reader, while a skill steers an AI agent's reasoning loop, tool selection, and execution path. A misplaced phrase in a skill can cause an agent to invoke invalid command flags, enter an infinite loop, or waste tokens.</span></p>\n<p><span style=\"vertical-align: baseline;\">That makes every instruction edit a behavioral change. You wouldn't ship a product update without testing it, and the same goes for a skill. This principle drives three core requirements:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strict semantic versioning</strong><span style=\"vertical-align: baseline;\">: Every behavioral change requires an explicit version bump.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deterministic automated validation</strong><span style=\"vertical-align: baseline;\">: Linters and validators check every proposed change before a human or AI reviewer sees it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mandatory evaluation evidence</strong><span style=\"vertical-align: baseline;\">: Every change includes an evaluation report. It compares the skill against its previous version, or—if the skill is new—against an agent without the skill.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Automated conformance gates: The pull request pipeline</strong></h2>\n<p><span style=\"vertical-align: baseline;\">In my previous post, I briefly listed the checks that every skill passes on check-in: linters, link checkers, and AI-assisted checklists. Here's what's inside them, plus two gates that I haven't covered before: semantic versioning and evaluation suite validation.</span></p>\n<p><span style=\"vertical-align: baseline;\">When an author submits a change to our internal skills repository, an automated continuous integration and continuous delivery (CI/CD) pipeline triggers immediately. Before a skill is exported to GitHub, it must pass <span style=\"vertical-align: baseline;\">these</span> six automated gates and receive human approval:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Structural conformance</strong><span style=\"vertical-align: baseline;\">: Directory layout, allowed files, and taxonomy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Skill linters</strong><span style=\"vertical-align: baseline;\">: Frontmatter, folder naming, and Markdown rules.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Semantic versioning</strong><span style=\"vertical-align: baseline;\">: Version bump for every behavioral change.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evaluation suite</strong><span style=\"vertical-align: baseline;\">: Valid eval suite and a fresh eval report.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Link validation</strong><span style=\"vertical-align: baseline;\">: Links are valid.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI review agent</strong><span style=\"vertical-align: baseline;\">: Skill quality and design standards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Human approval</strong><span style=\"vertical-align: baseline;\">: Final approval from a human reviewer (a subject matter expert)</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Structural conformance and skill linters</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Our automated validation suite inspects every pull request for structural and syntactical correctness. Some of the rules include these requirements:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Folder name and metadata name must match.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> and description length limits are enforced.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">All required fields in the frontmatter </span><code style=\"vertical-align: baseline;\">metadata</code><span style=\"vertical-align: baseline;\"> are present.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Only a curated list of files and directories is allowed within a skill directory.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">All Markdown files follow formatting rules.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The main </span><code style=\"vertical-align: baseline;\">README.md</code><span style=\"vertical-align: baseline;\"> file and the machine-readable </span><code style=\"vertical-align: baseline;\">index.json</code><span style=\"vertical-align: baseline;\"> registry are up to date.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Semantic versioning</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Every skill declares a semantic version in its </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> frontmatter metadata:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;---\\r\\nname: spanner-basics\\r\\nmetadata:\\r\\n  version: &quot;1.1.1&quot;\\r\\n  category: Databases\\r\\ndescription: ...\\r\\n---&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe1f3c75d10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">First, our automated checks verify that the version is a quoted string. YAML parses unquoted values like </span><code style=\"vertical-align: baseline;\">2.0</code><span style=\"vertical-align: baseline;\"> as numbers, which causes unexpected parsing errors in tools that expect a string.</span></p>\n<p><span style=\"vertical-align: baseline;\">Second, the validator checks the version transition itself. New skills must start at </span><code style=\"vertical-align: baseline;\">1.0.0</code><span style=\"vertical-align: baseline;\">, and any change to an existing skill's instructions, scripts, or references requires a version bump or the pull request is blocked. Standard reset rules apply: bumping </span><code style=\"vertical-align: baseline;\">MAJOR</code><span style=\"vertical-align: baseline;\"> (for example, </span><code style=\"vertical-align: baseline;\">1.4.2</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">2.0.0</code><span style=\"vertical-align: baseline;\">) resets </span><code style=\"vertical-align: baseline;\">MINOR</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">PATCH</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">0</code><span style=\"vertical-align: baseline;\">, and bumping </span><code style=\"vertical-align: baseline;\">MINOR</code><span style=\"vertical-align: baseline;\"> (for example, </span><code style=\"vertical-align: baseline;\">1.4.2</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">1.5.0</code><span style=\"vertical-align: baseline;\">) resets </span><code style=\"vertical-align: baseline;\">PATCH</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">0</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Why enforce strict versioning if the agent only reads the Markdown instructions? The version number is for the developer and their package tooling, not for the model at runtime. Skills don't auto-update in the background, which means there's no network check or latency overhead each time an agent invokes a skill. Instead, explicit versions let developers compare their locally installed skills against the upstream catalog and decide when to pull changes—for example, by running the </span><code style=\"vertical-align: baseline;\">npx skills update</code><span style=\"vertical-align: baseline;\"> command. This versioning also supports workflows where teams want to lock a critical skill to a known-good version to guarantee reproducible agent behavior across their projects.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Evaluation suite validation</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Our continuous evaluations (evals) compare agent performance with and without each skill. Those results are only as reliable as the evaluation suites behind them. If a suite contains broken file references or compound expectations, test results become noisy and untrustworthy.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our validator parses each evaluation suite and the pull request description. Then it checks several strict invariants:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resolution of file-based prompts</strong><span style=\"vertical-align: baseline;\">: When a test prompt references a file (such as </span><code style=\"vertical-align: baseline;\">@file:test_prompt.txt</code><span style=\"vertical-align: baseline;\">), the validator confirms that the target file exists and that it isn't empty.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Atomic expectations</strong><span style=\"vertical-align: baseline;\">: Each expectation must check exactly one criterion. The validator blocks compound expectations until authors split them. Lesson 2 later in this post shows why.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Duplicate detection</strong><span style=\"vertical-align: baseline;\">: The validator flags duplicate test prompts and conflicting expectations within the same evaluation suite.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mandatory evaluation report</strong><span style=\"vertical-align: baseline;\">: Every pull request that modifies a skill must link to an evaluation report in its description.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Eval staleness check</strong><span style=\"vertical-align: baseline;\">: Authors usually iterate on a pull request as reviewers leave feedback. The validator confirms that the linked report ran against the latest commit.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ship-agent-skills-like-products-eval-staleness-check\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/eval_staleness_check_whiteboard.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Link validation</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Over 170 skills link to documentation for fast-evolving Google products, and those pages can move long after a skill passes review. Rather than waiting for users to report broken links, we validate links at two stages. Before merge, pull request checks verify all relative links, such as files in </span><code style=\"vertical-align: baseline;\">references/</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Then, every Monday, a </span><a href=\"https://github.com/google/skills/blob/main/.github/workflows/link-checker.yml\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub Actions workflow</span></a><span style=\"vertical-align: baseline;\"> runs </span><a href=\"https://github.com/lycheeverse/lychee\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">lychee</span></a><span style=\"vertical-align: baseline;\"> across all external links in the public repository and it reports any broken links to skill owners for remediation.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AI review agent</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Linters and schema validators catch syntactic errors, but they can't evaluate overall quality. They can't tell you if an instruction is confusing, if a reference guide is too verbose, or if a task should have been a bash script instead of a large language model (LLM) instruction.</span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this, we integrated an AI review agent into our review pipeline. When a change affects a skill, the AI reviewer inspects it using a dedicated review skill. Yes, we use a skill to review skills.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here are the core rules the AI reviewer evaluates. You can adopt these rules in your own skill development workflows.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. Skill suitability and the deterministic trap</strong></h4>\n<p><span style=\"vertical-align: baseline;\">The first question our AI reviewer asks is simple: </span><strong style=\"vertical-align: baseline;\">Does this task belong in an instruction?</strong></p>\n<p><span style=\"vertical-align: baseline;\">We often see authors fall into the </span><span style=\"font-style: italic; vertical-align: baseline;\">deterministic trap</span><span style=\"vertical-align: baseline;\">. They write rigid, numbered sequences of command-line interface (CLI) commands directly into Markdown text.</span></p>\n<p><span style=\"vertical-align: baseline;\">LLMs are probabilistic engines. If an operation requires a strict sequence of commands where a variation can cause an error, embedding those commands in the instruction text invites hallucinations.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our AI reviewer enforces a clear boundary between deterministic and probabilistic logic. Rigid CLI sequences, JSON parsers, and deployment steps must live in executable scripts under </span><code style=\"vertical-align: baseline;\">scripts/</code><span style=\"vertical-align: baseline;\">. Markdown instructions are reserved for tasks that require judgment, such as choosing an architecture, diagnosing error logs, or synthesizing code.</span></p>\n<p><span style=\"vertical-align: baseline;\">This rule complements the Model Context Protocol (MCP) guidance that I shared last time: prefer remote MCP tools whenever possible. When you must fall back to CLI or API calls, wrap them in a script instead of spelling them out in the instructions.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ship-agent-skills-like-products-deterministic-trap\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/deterministic_trap_decision_tree_whiteboar.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">2. The L1/L2/L3 modular architecture</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Context windows are valuable. Loading a 2,000-line skill into an agent consumes context and degrades reasoning.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our AI reviewer enforces a three-tier information hierarchy that follows the progressive disclosure model of Agent Skills:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Level 1 (Metadata)</strong><span style=\"vertical-align: baseline;\">: The YAML frontmatter (</span><code style=\"vertical-align: baseline;\">name</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">description</code><span style=\"vertical-align: baseline;\">). The agent uses this concise summary for discovery and routing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Level 2 (Core instructions)</strong><span style=\"vertical-align: baseline;\">: The main </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> file. The body must stay compact (under 500 lines). It provides workflow overviews, decision trees, and guardrails.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Level 3 (Reference docs)</strong><span style=\"vertical-align: baseline;\">: Detailed API references, schemas, and other reference tables live in a </span><code style=\"vertical-align: baseline;\">references/</code><span style=\"vertical-align: baseline;\"> directory.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Our AI reviewer enforces two distinct rules for Level 3: </span><strong style=\"vertical-align: baseline;\">flat directory structure</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">single-hop indirection</strong><span style=\"vertical-align: baseline;\">. Keeping </span><code style=\"vertical-align: baseline;\">references/</code><span style=\"vertical-align: baseline;\"> flat (no subdirectories) is a repository convention that discourages sprawling documentation trees and makes file discovery simpler. More importantly for runtime performance, the reviewer blocks </span><strong style=\"vertical-align: baseline;\">chained references</strong><span style=\"vertical-align: baseline;\">, where </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> links to a reference file that links to yet another file. Each hop requires an extra tool call, adding latency and cost, and our evaluations showed that agents frequently stop before following a second level of chained references.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ship-agent-skills-like-products-progressive-disclosure\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/skills_progressive_disclosure_whiteboard.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">3. Non-interactive script design</strong></h4>\n<p><span style=\"vertical-align: baseline;\">When skills bundle helper scripts in </span><code style=\"vertical-align: baseline;\">scripts/</code><span style=\"vertical-align: baseline;\">, we expect agents to execute them directly in terminal sandboxes.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our AI reviewer flags any script that blocks on interactive prompts. Every script must accept inputs through command-line flags or environment variables, provide </span><code style=\"vertical-align: baseline;\">--help</code><span style=\"vertical-align: baseline;\"> documentation, and include a </span><code style=\"vertical-align: baseline;\">--dry-run</code><span style=\"vertical-align: baseline;\"> or confirmation flag for destructive operations. Scripts also need to separate output cleanly, writing structured data (usually JSON) to standard output and writing actionable error messages to standard error.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Example AI review checklist snippet</strong></h4>\n<p><span style=\"vertical-align: baseline;\">The review skill also checks frontmatter for spec compliance and discovery, and it turns the L1/L2/L3 architecture into concrete structure rules. Here's an excerpt from those criteria:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;### Front Matter &amp; Discovery\\r\\n\\r\\n-   **Spec Compliance**: YAML front matter MUST strictly follow the Agent Skills\\r\\n    Reference Specification (https://agentskills.io/specification). Use `&gt;-`\\r\\n    (folded strip-chomping) format for multi-line descriptions.\\r\\n-   **Description Quality**: The `description` field must follow the\\r\\n    [Description Guide](references/description_guide.md).\\r\\n\\r\\n### Content Structure &amp; Authoring Quality\\r\\n\\r\\n-   **L1/L2/L3 Architecture**: Enforce modular structure. The main `SKILL.md`\\r\\n    body must stay under 500 lines. Move deep domain reference material to\\r\\n    `references/` (see [Skill Structure](references/skill_structure.md)).\\r\\n-   **Flat References Directory**: `references/` must be a flat directory (one\\r\\n    level deep, no nested subdirectories). References &gt; 100 lines must include a\\r\\n    Table of Contents with line hints (see\\r\\n    [Skill Structure](references/skill_structure.md)).\\r\\n-   **Avoid Deeply-Nested References**: Avoid deeply-nested references (e.g.,\\r\\n    `SKILL.md` -&gt; `references/guides.md` -&gt; `assets/output.tmpl`). Keep\\r\\n    reference structures shallow (one level of indirection from `SKILL.md`)\\r\\n    because agents might not load such link targets fully.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe1f3d43410&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Human approval</strong></h3>\n<p><span style=\"vertical-align: baseline;\">After it passes all automated checks, every pull request must receive approval from a human reviewer. The reviewer is typically the skill's subject matter expert and, for new skills, a member of the Central Skills team.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Lessons learned from repository history</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Six months of commit history and pull request discussions reveal several practical takeaways.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">1. Scope CI checks carefully</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Early in the project, we configured automated pull request checks with broad directory patterns.</span></p>\n<p><span style=\"vertical-align: baseline;\">One check required an approved bug tracking ticket on every change. Because the pattern matched too broadly, engineers making a one-line typo fix were blocked for missing a tracking ticket. Meanwhile, newly added skills in deeper subdirectories went uninspected.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><span style=\"vertical-align: baseline;\">: Match automated check rules to specific file operations, such as added versus modified files, and verify exact path depths. Treat minor edits to existing skills differently from new skills.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">2. Atomic expectations</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When we started writing evaluation suites, we saw authors write compound expectations like this:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Bad: Compound expectation\\r\\n- &quot;The agent must create a Cloud Storage bucket in us-central1, enable\\r\\n  uniform bucket-level access, and apply lifecycle rules.&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe1f3ecba10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If the agent configured the region and lifecycle rules but missed the uniform access flag, the LLM-as-a-judge scorer returned inconsistent ratings.</span></p>\n<p><span style=\"vertical-align: baseline;\">Migrating to atomic expectations resolved the inconsistent ratings:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Good: Atomic expectations\\r\\n- &quot;The agent specifies us-central1 for the bucket location.&quot;\\r\\n- &quot;The agent enables uniform bucket-level access on the created bucket.&quot;\\r\\n- &quot;The agent defines a lifecycle configuration rule deleting objects\\r\\n  older than 30 days.&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe1f3d69690&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Takeaway</strong><span style=\"vertical-align: baseline;\">: Check exactly one criterion per expectation. Atomic expectations make evaluation results clear, reliable, and debuggable.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">3. Documentation drift happens fast</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In a multi-contributor repository, documentation tables drift within days if maintained manually.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><span style=\"vertical-align: baseline;\">: If you publish an index or catalog, never rely on contributors to update it manually. Instead, write a generator script and enforce it with a CI unit test. That's the origin of the </span><code style=\"vertical-align: baseline;\">README.md</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">index.json</code><span style=\"vertical-align: baseline;\"> checks in our linters. Our </span><code style=\"vertical-align: baseline;\">index.json</code><span style=\"vertical-align: baseline;\"> even opens with a warning: \"This file is generated. Do not edit it by hand.\"</span></p>\n<h3><strong style=\"vertical-align: baseline;\">4. Gate expensive LLM checks behind fast deterministic ones</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Running full evaluation suites and an AI review agent on every change can get expensive fast, both in token usage and CI runtime—especially when authors push frequent small commits during review.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our pipeline, fast deterministic checks run first. Structural conformance, skill linters, and semantic versioning act as blocking gates: if any of them fail, the pipeline stops immediately and it won't trigger the AI reviewer or evaluation checks until those issues are fixed.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Takeaway</strong><span style=\"vertical-align: baseline;\">: Stage your pipeline so cheap, deterministic checks block broken changes before LLM-powered gates run. When you build a similar system, consider adding further cost guardrails, such as manual triggers for heavy checks (for example, a </span><code style=\"vertical-align: baseline;\">/run-evals</code><span style=\"vertical-align: baseline;\"> pull request comment) or only triggering automatic re-runs when the diff exceeds a specific threshold.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Conclusion</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Building a scalable Agent Skills repository requires more than good prompt engineering. It requires solid developer infrastructure:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Ship skills like products: version, validate, and evaluate every change.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enforce semantic versioning and atomic expectations with automated CI gates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Use an AI reviewer to catch design anti-patterns, such as the deterministic trap.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Check links before merge and on a schedule.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Links and further reading</strong></h2>\n<p><span style=\"vertical-align: baseline;\">To get started with Google Agent Skills, check out these resources:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Agent Skills repo</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://g.dev/ai/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">github.com/google/skills</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Previous post</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/behind-the-scenes-how-we-build-test-and-scale-google-agent-skills\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Behind the scenes: How we build, test, and scale Google Agent Skills</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Launch announcement</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/level-up-your-agents-announcing-googles-official-skills-repository\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Level Up Your Agents: Announcing Google's Official Skills Repository</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Skills tutorial</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://medium.com/google-cloud/google-cloud-skills-tutorial-the-complete-guide-to-ai-powered-cloud-operations-7838fcc9541a\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Introduction: What Are Google Cloud Agent Skills?</span></a></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">What's next?</strong></h2>\n<p><span style=\"vertical-align: baseline;\">If you found this post helpful, share it with your friends on social media and connect with me on </span><a href=\"https://www.linkedin.com/in/remigiusz-samborski/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://x.com/RemikSamborski\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://bsky.app/profile/rsamborski.bsky.social\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bluesky</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Thanks for reading!</span></p></div>"
  "a62953969358a751167a42d7fc625c2d":
    "id": "a62953969358a751167a42d7fc625c2d"
    "title": "How to upgrade embedding models in AlloyDB AI with zero downtime"
    "link": "https://cloud.google.com/blog/products/databases/upgrade-embedding-models-in-alloydb-ai-with-zero-downtime/"
    "published": "2026-10-29 01:00:00"
    "fetched": "2026-11-02 05:12:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Imagine you've just launched a new semantic search feature for product reviews to help customers quickly research products on your site. Users love it. But the next day, you see an announcement for a new vector embedding model promising higher accuracy, better nuance, and multilingual search out of the box. After testing it in your dev environment, you confirm it's a perfect fit. But now you're left with a common dilemma: How do you upgrade the model without disrupting your users?</span></p>\n<p><span style=\"vertical-align: baseline;\">Upgrading embedding models in production requires re-embedding your entire dataset, rebuilding indexes, and coordinating schema migrations without interrupting user queries. You may encounter several potential problems:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Embedding generation: </strong><span style=\"vertical-align: baseline;\">All existing data must be re-embedded using the new embedding model, which typically requires updating complex pipelines and using dual write strategies while the new and old models run side-by-side for a period of time. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mathematical incompatibility:</strong><span style=\"vertical-align: baseline;\"> Embeddings generated by different models inhabit distinct vector spaces and cannot be compared directly. Application query vectors and stored column vectors must switch models in unison to prevent severe search degradation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Index rebuild overhead:</strong><span style=\"vertical-align: baseline;\"> Vector indexes must be built on the new vectors before similarity search can perform efficiently at scale.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Degraded user experience: </strong><span style=\"vertical-align: baseline;\">Switching embedding models requires multiple DDL changes and other operations that acquire exclusive locks and can stall incoming read and write transactions if not carefully managed.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">How AlloyDB AI simplifies vector lifecycle management</span></h2>\n<p><span style=\"vertical-align: baseline;\">In this blog, we’ll highlight how the rich feature set in </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/what-is-alloydb-ai\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI</strong></a><span style=\"vertical-align: baseline;\"> combines to enable</span><span style=\"vertical-align: baseline;\"> zero-downtime embedding model upgrades, so that your users can benefit from the latest model advances without scheduled downtime maintenance. </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/model-endpoint-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Model endpoint management</strong></a><span style=\"vertical-align: baseline;\"> gives you native in-database access to any embedding model (first party, third party, or even self-hosted), while </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/generate-manage-auto-embeddings-for-tables\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">auto embeddings</strong></a><span style=\"vertical-align: baseline;\"> rapidly generates new embeddings in the background (up to 3000/second) and keeps them up to date as source data changes. Using AlloyDB’s </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ScaNN index</strong></a><span style=\"vertical-align: baseline;\"> can also significantly reduce the wall clock time of your upgrade with index builds that are 10x faster than open source HNSW, and native PostgreSQL functionality like concurrent index creation, set-returning functions (SRF), and atomic column renames allow transparent blue/green and canary-style rollouts.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Step-by-step migration walkthrough</span></h2>\n<p><span style=\"vertical-align: baseline;\">In this example, we demonstrate migrating a production table </span><code style=\"vertical-align: baseline;\">ecomm.product_reviews</code><span style=\"vertical-align: baseline;\"> from </span><code style=\"vertical-align: baseline;\">text-embedding-005</code><span style=\"vertical-align: baseline;\"> (768-d) to</span><code style=\"vertical-align: baseline;\"> gemini-embedding-001</code><span style=\"vertical-align: baseline;\"> (3072-d) while serving live traffic.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 0: Prerequisites and preflight checks</span></h3>\n<p><span style=\"vertical-align: baseline;\">Verify that the</span><code style=\"vertical-align: baseline;\"> google_ml_integration</code><span style=\"vertical-align: baseline;\"> extension is updated to version 1.5.6 or later (tested on 1.6.1) and confirm model connectivity:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Check extension version\\r\\nSELECT extversion \\r\\nFROM pg_extension \\r\\nWHERE extname = &#x27;google_ml_integration&#x27;;\\r\\n\\r\\n-- Create extensions\\r\\nCREATE EXTENSION IF NOT EXISTS vector;\\r\\nCREATE EXTENSION IF NOT EXISTS alloydb_scann;\\r\\n\\r\\n-- Verify remote endpoint and output dimension (3072-d)\\r\\nSELECT vector_dims(ai.embedding(&#x27;gemini-embedding-001&#x27;, &#x27;hello world&#x27;)::vector);\\r\\n\\r\\n-- Inspect existing auto-embedding settings\\r\\nSELECT * FROM ai.embedding_settings_view;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd38210&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 1: Add the new vector column</span></h3>\n<p><span style=\"vertical-align: baseline;\">Adding a nullable column without default values updates catalog metadata without creating new versions of each row. This makes the operation nearly instant. Note that the size of your vector column (3072 in this example) must match the number of dimensions output by your embedding model. We also set the </span><code style=\"vertical-align: baseline;\">lock_timeout</code><span style=\"vertical-align: baseline;\"> to 2 seconds to prevent the operation from blocking critical production traffic while it waits to acquire an exclusive lock. If the operation fails due to a longer wait for an exclusive lock, simply retry.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SET lock_timeout = &#x27;2s&#x27;;\\r\\n\\r\\nALTER TABLE ecomm.product_reviews \\r\\nADD COLUMN new_embedding_col vector(3072);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd39b10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 2: Initialize auto-embeddings and run backfill</span></h3>\n<p><span style=\"vertical-align: baseline;\">Next, we initialize embeddings on our new embedding column using </span><code style=\"vertical-align: baseline;\">gemini-embedding-001</code><span style=\"vertical-align: baseline;\">. </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CALL ai.initialize_embeddings(\\r\\n    model_id =&gt; &#x27;gemini-embedding-001&#x27;,\\r\\n    table_name =&gt; &#x27;ecomm.product_reviews&#x27;,\\r\\n    content_column =&gt; &#x27;review_text&#x27;,\\r\\n    embedding_column =&gt; &#x27;new_embedding_col&#x27;,\\r\\n    batch_size =&gt; 50,\\r\\n    incremental_refresh_mode =&gt; &#x27;manual&#x27;\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3b510&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Note that there are two modes available in auto embeddings to keep embeddings up to date as source data changes:  </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Transactional: </strong><span style=\"vertical-align: baseline;\">When you set </span><code style=\"vertical-align: baseline;\">incremental_refresh_mode</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">transactional</code><span style=\"vertical-align: baseline;\">, embeddings are updated immediately when data changes. This keeps your embeddings transactionally consistent with your source data, but it also introduces additional write latency with an inline embedding model inference required for every INSERT/UPDATE operation. Use transactional mode when you want to keep your embedding data transactionally consistent with the source data and your rate of change is low.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Manual:</strong><span style=\"vertical-align: baseline;\"> When you set </span><code style=\"vertical-align: baseline;\">incremental_refresh_mode</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">manual</code><span style=\"vertical-align: baseline;\">, AlloyDB tracks which rows have changed but does not immediately update the embedding. This allows you to quickly regenerate embeddings for only the changed rows (not the full dataset) on a schedule that you define using </span><code style=\"vertical-align: baseline;\">ai.refresh_embeddings()</code><span style=\"vertical-align: baseline;\">, which uses efficient batching techniques just like the initial backfill operation. Use manual mode when you have a high rate of change on your source data and you can tolerate embedding drift for the period of time defined by your scheduled refresh interval.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">We use manual mode in this example to keep writes on the base table performant, while still having full control of how quickly changes are reflected in the embeddings by periodically running </span><code style=\"vertical-align: baseline;\">ai.refresh_embeddings()</code><span style=\"vertical-align: baseline;\">. </span></p>\n<p><strong><span style=\"vertical-align: baseline;\">Managing concurrent writer wait times<br /></span></strong><span style=\"vertical-align: baseline;\">During backfill, AlloyDB Auto Embeddings processes rows in parallel groups (</span><code style=\"vertical-align: baseline;\">batch_size</code><span style=\"vertical-align: baseline;\"> × </span><code style=\"vertical-align: baseline;\">max_parallel_requests</code><span style=\"vertical-align: baseline;\">). While the process for each micro batch is usually fast, concurrent updates or deletes have to wait for the batch to commit.</span></p>\n<p><span style=\"vertical-align: baseline;\">To cap the maximum wait times for writers on busy transactional tables, you can lower </span><code style=\"vertical-align: baseline;\">max_parallel_requests</code><span style=\"vertical-align: baseline;\"> during the backfill session:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SET google_ml_integration.max_parallel_requests = 20;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3acd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This change generally improves the commit time for each micro batch, while increasing the total wall clock time for the backfill operation. Our benchmark results on a 10,000-row table demonstrate the trade-off:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 99.7389%;\"><colgroup><col style=\"width: 30.6519%;\" /><col style=\"width: 40.0832%;\" /><col style=\"width: 29.2649%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">max_parallel_requests</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Longest Concurrent Writer Wait</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Total Backfill Duration</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">400 (Default)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">5.1 seconds</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">5.2 seconds</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">20</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">0.39 seconds</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">7.6 seconds (+46%)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">Monitoring auto embeddings progress</span></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB provides a view to track progress for auto embedding jobs, including state, rows processed, and estimated time remaining. To see how things are progressing, run the query below from a separate session:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT status, percent_progress, rows_processed, error_count, estimated_time_remaining\\r\\nFROM ai.embedding_progress_view \\r\\nWHERE embedding_column = &#x27;new_embedding_col&#x27;;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3ab50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 3: Catch up updated rows</span></h3>\n<p><span style=\"vertical-align: baseline;\">Once the initial backfill operation completes, we can optionally regenerate embeddings for rows that were modified while it was running. When using manual mode, Auto Embeddings automatically tracks which rows were changed so that they can be quickly updated without re-embedding data that is already current. To catch those rows up, simply execute a quick refresh using </span><code style=\"vertical-align: baseline;\">ai.refresh_embeddings()</code><span style=\"vertical-align: baseline;\">. You should also run this refresh command on a schedule using pg_cron or an external scheduler to ensure the latest changes continue to be reflected in your embeddings .</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CALL ai.refresh_embeddings(\\r\\n    table_name =&gt; &#x27;ecomm.product_reviews&#x27;, \\r\\n    embedding_column =&gt; &#x27;new_embedding_col&#x27;, \\r\\n    batch_size =&gt; 50\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd38350&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 4: Validate vector completeness and retrieval quality</span></h3>\n<p><span style=\"vertical-align: baseline;\">Now that the embeddings are generated and caught up, we’ll ensure completeness and correctness prior to traffic cutover. Note that in a live product environment, you will likely have active INSERT / UPDATE / DELETE traffic that modifies rows between steps 3 and 4. To prevent the results below from being skewed, we added a filter on </span><code style=\"vertical-align: baseline;\">google_ml_track_stale_embedding = </code><code style=\"vertical-align: baseline;\">'</code><code style=\"vertical-align: baseline;\">false</code><code style=\"vertical-align: baseline;\">'</code><span style=\"vertical-align: baseline;\"> to include only rows that haven’t been changed since the last invocation of</span><code style=\"vertical-align: baseline;\"> ai.refresh_embeddings()</code><span style=\"vertical-align: baseline;\">. Note that your table may use a different name for this column, such as </span><code style=\"vertical-align: baseline;\">google_ml_track_stale_embedding_2</code><span style=\"vertical-align: baseline;\">, so be sure to update the query accordingly.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 1. Ensure near-zero missing embeddings\\r\\nSELECT count(*) AS missing_count \\r\\nFROM ecomm.product_reviews\\r\\nWHERE new_embedding_col IS NULL\\r\\nAND google_ml_track_stale_embedding = &#x27;false&#x27;;\\r\\n\\r\\n-- 2. Spot-check distance against a fresh model invocation (should approach 0)\\r\\nSELECT max(new_embedding_col &lt;=&gt; ai.embedding(&#x27;gemini-embedding-001&#x27;, review_text)::vector) AS max_distance\\r\\nFROM (SELECT review_text, new_embedding_col FROM ecomm.product_reviews WHERE google_ml_track_stale_embedding = &#x27;false&#x27; ORDER BY random() LIMIT 20) sample;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3a250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At this point, you should also validate your application logic using the new embedding model. In internal benchmarks comparing </span><code style=\"vertical-align: baseline;\">text-embedding-005</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">gemini-embedding-001</code><span style=\"vertical-align: baseline;\">, the top-10 nearest neighbor results overlapped by only 31%. This is a good thing because the shift reflects the higher semantic fidelity of the 3072-d model. However, the new results for recall@10  may impact assumptions in your application, so be sure to conduct offline testing against a set of sample golden queries before routing production traffic to the new embeddings.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 5: Build a new ScaNN vector index </span></h3>\n<p><span style=\"vertical-align: baseline;\">Searching across a large number of vectors without an index is a computationally expensive and slow process. To avoid this, we’ll build a ScaNN index to enable industry leading filtered vector search performance, which is 10x faster than HNSW on open source PostgreSQL.</span></p>\n<p><span style=\"vertical-align: baseline;\">High dimensional models like </span><code style=\"vertical-align: baseline;\">gemini-embedding-001</code><span style=\"vertical-align: baseline;\"> require additional memory during index construction compared to lower dimensional models, so in this step we increase </span><code style=\"vertical-align: baseline;\">maintenance_work_mem</code><span style=\"vertical-align: baseline;\"> to accommodate the additional overhead. We also build the ScaNN index using </span><code style=\"vertical-align: baseline;\">CONCURRENTLY</code><span style=\"vertical-align: baseline;\"> to avoid blocking concurrent writes:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SET maintenance_work_mem = &#x27;1GB&#x27;;\\r\\n\\r\\nCREATE INDEX CONCURRENTLY product_reviews_new_embedding_col_scann \\r\\nON ecomm.product_reviews\\r\\nUSING scann (new_embedding_col cosine);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3bad0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Building a ScaNN index is also up to 10x faster than HNSW on open source PostgreSQL. In our tests on 100,000 rows, a 3072-d ScaNN index built in approximately 50 seconds, whereas an HNSW index using halfvec took 7 to 13 minutes.</span></p>\n<p><span style=\"vertical-align: baseline;\">Be sure to also tune </span><code style=\"vertical-align: baseline;\">scann.num_leaves_to_search</code><span style=\"vertical-align: baseline;\"> to balance recall and latency. In our tests, increasing </span><code style=\"vertical-align: baseline;\">num_leaves_to_search</code><span style=\"vertical-align: baseline;\"> from the default value to 25 improved Recall@10 from 0.35 to 0.95 at a search latency of 8.8 ms:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SET scann.num_leaves_to_search = 25;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3ab10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 6: Cut over search traffic with zero downtime</span></h3>\n<p><span style=\"vertical-align: baseline;\">At this stage, you have two primary options for your application cutover strategy:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pattern A: Atomic column rename swap </strong><span style=\"vertical-align: baseline;\">—</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">This is a simple approach that supports blue/green deployments with zero application code changes. It does not, however, support canary-style releases or auto embeddings in transactional mode (supports manual mode only).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pattern B: Custom GUC session variables + unified</strong><code style=\"vertical-align: baseline;\"> UNION ALL</code><strong style=\"vertical-align: baseline;\"> set-returning function (SRF) </strong><span style=\"vertical-align: baseline;\">— This more advanced approach enables transparent query embedding model selection, live incremental traffic splitting, blue/green deployments, and canary A/B testing, while requiring only one application config change. This technique also supports auto embeddings in both transactional and manual modes.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Pattern A: Atomic column rename</span></h4>\n<p><span style=\"vertical-align: baseline;\">First, we route application query embedding generation through a custom database function to abstract the model from the application. Application queries will use this function instead of directly using</span><code style=\"vertical-align: baseline;\"> ai.embedding()</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Define the query embedding function\\r\\nCREATE OR REPLACE FUNCTION ecomm.product_reviews_query_embedding(q text)\\r\\nRETURNS vector\\r\\nLANGUAGE sql\\r\\nSTABLE\\r\\nPARALLEL SAFE\\r\\nAS $$\\r\\n    SELECT ai.embedding(&#x27;text-embedding-005&#x27;, q)::vector;\\r\\n$$;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd39690&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Then, when we’re ready to cut over, we simply execute a stored procedure like the example below to swap the column names and update the function to use the new model. </span></p>\n<p><span style=\"vertical-align: baseline;\">Create the procedure:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE OR REPLACE PROCEDURE swap_embedding_columns(\\r\\n    p_table regclass,\\r\\n    p_live_column name,\\r\\n    p_new_column name,\\r\\n    p_retired_column name,\\r\\n    p_query_schema name,\\r\\n    p_query_function name,\\r\\n    p_new_model_id text\\r\\n)\\r\\nLANGUAGE plpgsql AS $$\\r\\nBEGIN\\r\\n    EXECUTE format(&#x27;ALTER TABLE %s RENAME COLUMN %I TO %I&#x27;, p_table, p_live_column, p_retired_column);\\r\\n    EXECUTE format(&#x27;ALTER TABLE %s RENAME COLUMN %I TO %I&#x27;, p_table, p_new_column, p_live_column);\\r\\n    EXECUTE format(\\r\\n        &#x27;CREATE OR REPLACE FUNCTION %I.%I(q text) RETURNS vector LANGUAGE sql STABLE AS $f$ SELECT ai.embedding(%L, q)::vector $f$&#x27;,\\r\\n        p_query_schema, p_query_function, p_new_model_id\\r\\n    );\\r\\nEND;\\r\\n$$;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3b390&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Then execute the swap:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SET lock_timeout = &#x27;2s&#x27;;\\r\\n\\r\\nCALL swap_embedding_columns(\\r\\n    p_table =&gt; &#x27;ecomm.product_reviews&#x27;, \\r\\n    p_live_column =&gt; &#x27;embedding_col&#x27;, \\r\\n    p_new_column =&gt; &#x27;new_embedding_col&#x27;, \\r\\n    p_retired_column =&gt; &#x27;embedding_col_old&#x27;, \\r\\n    p_query_schema =&gt; &#x27;ecomm&#x27;,\\r\\n    p_query_function =&gt; &#x27;product_reviews_query_embedding&#x27;, \\r\\n    p_new_model_id =&gt; &#x27;gemini-embedding-001&#x27;\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd39d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Because the column rename and model switch execute in the same transaction, queries never encounter a model mismatch. If you need to roll back, simply call the procedure with the column arguments reversed.</span></p>\n<p><span style=\"vertical-align: baseline;\">One advantage to this approach is that there are zero changes required on the application side. Your application code consistently uses the </span><code style=\"vertical-align: baseline;\">ecomm.product_reviews_query_embedding</code><span style=\"vertical-align: baseline;\"> function to generate an embedding, and the column name used by the application query does not change. </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;WITH query_embedding AS (\\r\\n  SELECT ecomm.product_reviews_query_embedding(&#x27;product was defective&#x27;) AS vec\\r\\n)\\r\\nSELECT id, review_text\\r\\nFROM ecomm.product_reviews\\r\\nORDER BY embedding_col &lt;=&gt; (SELECT vec FROM query_embedding)\\r\\nLIMIT 10;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3ad10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">While this column rename technique is simple, it has two limitations: First, it applies exclusively to manual mode for auto embeddings. In transactional mode, AlloyDB-managed triggers reference columns by hardcoded names, so renaming a column causes write operations to fail. Second, this pattern only supports blue/green style releases. You don’t have per-query control over which model you use, so you’re unable to use canary-style releases with, for example, 5% of traffic using the new model for testing while 95% of the traffic continues to use the existing model. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Pattern B: Custom GUC + set-returning function for canary A/B testing</span></h4>\n<p><span style=\"vertical-align: baseline;\">To execute canary rollouts, traffic splitting, or instant rollbacks, you can use custom PostgreSQL Custom Grand Unified Configuration (GUC) variables paired with a set-returning function abstraction.</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">1. Define the table-valued function abstraction layer<br /></span></strong><span style=\"vertical-align: baseline;\">Create a database SRF that inspects a session-level GUC variable (</span><code style=\"vertical-align: baseline;\">app.embedding_model</code><span style=\"vertical-align: baseline;\">) to dynamically evaluate search queries against either the legacy or the new embedding column.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE OR REPLACE FUNCTION ecomm.search_product_reviews(\\r\\n    p_query_vector vector,\\r\\n    p_limit int DEFAULT 10\\r\\n)\\r\\nRETURNS TABLE (id bigint, review_text text)\\r\\nLANGUAGE sql\\r\\nSTABLE AS $$\\r\\n    (\\r\\n        SELECT id, review_text\\r\\n        FROM ecomm.product_reviews\\r\\n        WHERE current_setting(&#x27;app.embedding_model&#x27;, true) = &#x27;text-embedding-005&#x27;\\r\\n        ORDER BY embedding_col &lt;=&gt; p_query_vector\\r\\n        LIMIT p_limit\\r\\n    )\\r\\n    UNION ALL\\r\\n    (\\r\\n        SELECT id, review_text\\r\\n        FROM ecomm.product_reviews\\r\\n        WHERE current_setting(&#x27;app.embedding_model&#x27;, true) = &#x27;gemini-embedding-001&#x27;\\r\\n        ORDER BY new_embedding_col &lt;=&gt; p_query_vector\\r\\n        LIMIT p_limit\\r\\n    );\\r\\n$$;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3a790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong><span style=\"vertical-align: baseline;\">2. Standardized application queries<br /></span></strong><span style=\"vertical-align: baseline;\">The application queries the unified SRF while generating query vectors via </span><code style=\"vertical-align: baseline;\">ai.embedding()</code><span style=\"vertical-align: baseline;\"> using the active model parameter:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Application sets session model (for canary / A/B routing):\\r\\nSET app.embedding_model = &#x27;gemini-embedding-001&#x27;;\\r\\n\\r\\n-- The rest of the query remains the same:\\r\\nWITH query_embedding AS (\\r\\n  SELECT ai.embedding(current_setting(&#x27;app.embedding_model&#x27;, true), &#x27;product was defective&#x27;)::vector AS vec\\r\\n)\\r\\nSELECT id, review_text \\r\\nFROM ecomm.search_product_reviews(\\r\\n  p_query_vector =&gt; (SELECT vec FROM query_embedding), \\r\\n  p_limit =&gt; 10);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3bdd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong><span style=\"vertical-align: baseline;\">3. Execute canary traffic splitting and A/B testing<br /></span></strong><span style=\"vertical-align: baseline;\">Application connections or middleware can dynamically control which model processes a query by setting the session variable:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Route session to legacy model \\r\\nSET app.embedding_model = &#x27;text-embedding-005&#x27;;\\r\\n\\r\\n-- Route session to new model (Canary / A/B Test)\\r\\nSET app.embedding_model = &#x27;gemini-embedding-001&#x27;;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3b290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Using this pattern, engineering teams can route a small percentage of application sessions to the new embedding model, validate accuracy and latency metrics, then gradually increase traffic to 100%. Or, they can revert instantly to the prior model by simply altering the session parameter.</span></p>\n<p><span style=\"vertical-align: baseline;\">A note on connection pooling: When using connection poolers such as PgBouncer in transaction-mode, a plain</span><code style=\"vertical-align: baseline;\"> SET</code><span style=\"vertical-align: baseline;\"> stays on the pooled server connection. This means it can leak to other clients, and it may not always apply to your own subsequent transactions. To mitigate this, you can use </span><code style=\"vertical-align: baseline;\">SET LOCAL</code><span style=\"vertical-align: baseline;\"> inside an explicit transaction so the setting is cleared at </span><code style=\"vertical-align: baseline;\">COMMIT</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">ROLLBACK</code><span style=\"vertical-align: baseline;\">. You can also prevent this condition entirely by using PgBouncer in session mode, which clears session parameters when a connection is returned to the pool.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 7: Retire the legacy model and reclaim storage</span></h3>\n<p><span style=\"vertical-align: baseline;\">Once you have completed the cutover to the new model and you are happy with its functionality and stability, you can decommission the legacy embedding column, index, and auto embedding configs to reclaim disk space.</span></p>\n<p><span style=\"vertical-align: baseline;\">Drop the auto embedding config and the old index:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 1. Drop auto embedding configuration on old column \\r\\n-- NOTE: &#x27;embedding_col_old&#x27; assumes Pattern A was followed above. Use &#x27;embedding_col&#x27; if you following Pattern B.\\r\\nCALL ai.drop_embedding_config(table_name =&gt; &#x27;ecomm.product_reviews&#x27;, embedding_column =&gt; &#x27;embedding_col_old&#x27;);\\r\\n\\r\\n-- 2. Drop old vector index concurrently (update to match the name of your previous index)\\r\\nDROP INDEX CONCURRENTLY ecomm.product_reviews_embedding_col_scann_old;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3a450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Reclaiming disk space</span></h4>\n<p><span style=\"vertical-align: baseline;\">Executing </span><code style=\"vertical-align: baseline;\">ALTER TABLE DROP COLUMN</code><span style=\"vertical-align: baseline;\"> removes the column from PostgreSQL catalog tables, but the underlying TOAST space remains allocated on disk until data pages are rewritten. To make this disk space reusable for future operations, you can set the old vector column to </span><code style=\"vertical-align: baseline;\">NULL</code><span style=\"vertical-align: baseline;\"> in batches before dropping it. </span></p>\n<p><span style=\"vertical-align: baseline;\">Note that this operation is a trade-off: It creates new row versions for every row in the table in order to make disk space reusable, which requires a VACUUM to clean up the old row versions. You should determine whether it is a priority for you to immediately free up disk space for reuse on the same table versus allowing the old row versions to naturally age out through the course of normal operations. </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Helper procedure to nullify old vectors in small committed batches\\r\\nCREATE OR REPLACE PROCEDURE retire_embedding_column(\\r\\n    p_table regclass, \\r\\n    p_column name, \\r\\n    p_batch_rows integer DEFAULT 1000\\r\\n)\\r\\nLANGUAGE plpgsql AS $$\\r\\nDECLARE\\r\\n    n bigint;\\r\\nBEGIN\\r\\n    LOOP\\r\\n        EXECUTE format(\\r\\n            &#x27;UPDATE %1$s SET %2$I = NULL \\r\\n             WHERE ctid = ANY (ARRAY(SELECT ctid FROM %1$s WHERE %2$I IS NOT NULL LIMIT %3$s))&#x27;,\\r\\n            p_table, p_column, p_batch_rows\\r\\n        );\\r\\n        GET DIAGNOSTICS n = ROW_COUNT;\\r\\n        EXIT WHEN n = 0;\\r\\n        COMMIT;\\r\\n    END LOOP;\\r\\nEND;\\r\\n$$;\\r\\n\\r\\n-- Run the batched cleanup outside an explicit transaction block\\r\\nCALL retire_embedding_column(&#x27;ecomm.product_reviews&#x27;, &#x27;embedding_col_old&#x27;, 1000);\\r\\n\\r\\n-- Run VACUUM to place the freed TOAST pages on the table free space map (FSM)\\r\\nVACUUM (PROCESS_MAIN false) ecomm.product_reviews;\\r\\n\\r\\n-- Drop the column definition\\r\\nSET lock_timeout = &#x27;2s&#x27;;\\r\\nALTER TABLE ecomm.product_reviews DROP COLUMN embedding_col_old;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f8b1fd3a910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In our tests on 100,000 rows, zeroing out the vectors and vacuuming before dropping the column reclaimed 381 MB of TOAST space for reuse by subsequent model upgrades.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Transactional mode considerations for auto embeddings</span></h3>\n<p><span style=\"vertical-align: baseline;\">If your application uses auto embeddings with </span><code style=\"vertical-align: baseline;\">incremental_refresh_mode =&gt; 'transactional'</code><span style=\"vertical-align: baseline;\">, vectors are generated synchronously inside each write transaction. Upgrading in transactional mode follows the same sequence shown above, with three key differences:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 3 is skipped:</strong><span style=\"vertical-align: baseline;\"> You don’t need to run </span><code style=\"vertical-align: baseline;\">ai.refresh_embeddings()</code><span style=\"vertical-align: baseline;\">, because new writes update both columns automatically.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Column swap technique is not supported: </strong><span style=\"vertical-align: baseline;\">You must use the GUC + SRF abstraction method, which does not impact the triggers managed by auto embeddings.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Write latency increases during migration:</strong><span style=\"vertical-align: baseline;\"> While both models are configured, each row write executes two remote embedding calls.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Because </span><code style=\"vertical-align: baseline;\">gemini-embedding-001</code><span style=\"vertical-align: baseline;\"> generates a more expressive 3072-dimensional embedding, its remote inference call takes longer. </span><span style=\"vertical-align: baseline;\">In our tests, we observed the following latency profiles for single-row </span><code style=\"vertical-align: baseline;\">UPDATE</code><span style=\"vertical-align: baseline;\"> operations with transactional mode enabled for auto embeddings:</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 98.8251%;\"><colgroup><col style=\"width: 31.4726%;\" /><col style=\"width: 22.7602%;\" /><col style=\"width: 45.7672%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Migration Phase</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Active Models</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Median Single-Row Write Latency</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Baseline</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">text-embedding-005</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~37.5 ms</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Active Migration</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Both Models Active</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~191.0 ms</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Post-Cutover</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">gemini-embedding-001</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~172.0 ms</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Be sure to review your application's write latency budget before choosing transactional mode for auto embeddings, especially with higher-dimension models.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Disk space and memory resource planning</span></h3>\n<p><span style=\"vertical-align: baseline;\">Because old and new vector columns coexist during migration, your table storage will grow based on peak usage. Based on our testing, we observed the following average storage per row for each embedding type:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 97.5196%;\"><colgroup><col style=\"width: 36.8552%;\" /><col style=\"width: 23.6006%;\" /><col style=\"width: 39.6783%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Embedding Model</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Output Dimensions</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Estimated Storage Per Row</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">text-embedding-005</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">768</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~4.5 KB / row</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">gemini-embedding-001</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3072</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~13.3 KB / row</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Based on these estimates, you can use the formula below to estimate your storage space:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New vector column:</strong><span style=\"vertical-align: baseline;\"> Total Rows × ~13.3 KB (approx. 3x legacy storage).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New ScaNN index:</strong><span style=\"vertical-align: baseline;\"> Total Rows × ~0.6 KB.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Headroom Allocation:</strong><span style=\"vertical-align: baseline;\"> Add ~25% overhead for WAL generation and page updates during backfill and vacuum operations.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Example:</span><span style=\"vertical-align: baseline;\"> A table with 10 million rows requires approximately 133 GB of disk space for the new vector column, 6 GB for the ScaNN index, plus headroom.</span></p>\n<h1><span style=\"vertical-align: baseline;\">Summary</span></h1>\n<p><span style=\"vertical-align: baseline;\">AlloyDB combines native PostgreSQL primitives with built-in AI capabilities to make upgrading vector embedding models in production faster and earlier, with no maintenance downtime or complex application-side changes. By combining AlloyDB AI auto embeddings and Model Endpoint Management with standard PostgreSQL operational controls, database administrators and developers can keep their semantic search models up to date with the latest embedding model capabilities as soon as they are released.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get started, launch an </span><a href=\"https://console.cloud.google.com/alloydb/create-trial-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB trial cluster</span></a><span style=\"vertical-align: baseline;\"> and consult the official </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/what-is-alloydb-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
"last_updated": "2026-11-02 05:12:17 JST"
