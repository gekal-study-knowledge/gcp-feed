  この日は Google Cloud Blog の 1 ソースから 5 本。データベースでは、Cloud SQL for MySQL でフルマネージドのブルーグリーンデプロイがプレビューになり、並行環境を継続同期して本番データで検証したうえで切り替えることで、MySQL 8.0 から 8.4 のようなメジャーバージョンアップグレードや設定変更を最小限のダウンタイムで実施でき、切り替え後も元のデータベースを安全策として残せる。AlloyDB Omni の Web UI が Red Hat とコンテナ向けに一般提供となり、読み取り専用のコンソールで CPU・メモリー・ディスク I/O のテレメトリー、クエリ性能、構成フラグを確認できる。GKE では、VPC Flow Logs がサンプリングしたフローにポッド・ワークロード・名前空間・サービスの GKE メタデータを付与し、追加のエージェントやサイドカーなしで L3/L4 トラフィックをワークロード単位で追えるトラブルシューティング手法と、最大 100 万の同時コード実行サンドボックスを求められるエージェント型 AI 向けに GKE Dataplane V2 がネットワーク ID 管理を最適化し、Agent Sandbox と Agent Substrate で 1 秒未満のプロビジョニングを支える仕組みが解説された。ほかに Google Agent Skills の運用の舞台裏の続編で、GitHub スターが 15,000 から 21,000 超に増え 170 以上のスキルを抱えるリポジトリでの自動品質ゲートと AI レビューエージェントが紹介された。
