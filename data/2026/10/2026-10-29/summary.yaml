"overview": |
  この日は Google Cloud Blog、Google Cloud Japan Blog、リリースノートの 3 ソースから 10 本。セキュリティでは、PHP コア言語ランタイムの 2 件の重大な脆弱性 CVE-2026-109618 (メモリ不足処理の中断で不完全に初期化されたリクエストデータが有効扱いされる) と CVE-2026-109619 (解放後も残ったリクエスト状態を後続リクエストが使ってしまう) への対応ガイダンスの抄訳が公開された。CVSS ベーススコアはいずれも 9.2 (緊急) で、認証なしのリモートコード実行やメモリ漏洩のおそれがある。影響は PHP 5.4〜8.5.11 の全バージョンで、修正版は 8.5.12、8.4.27、8.3.36、8.2.35。サポート終了の PHP 8.1 以前には修正が出ないため 8.2 以降への更新が必須となる。Google Cloud 自体は影響を受けないが、App Engine スタンダード (PHP 8.2 以降は自動更新)、App Engine フレキシブル (自動更新されず再デプロイが必要)、Cloud Run / Cloud Run functions (ベースイメージ自動更新が無効なら再構築・再デプロイ)、GKE、Marketplace の各利用者に対応を求めている。生成 AI では、Google Cloud 上の Claude モデルに Anthropic マネージドのデプロイオプションが一般提供となり、Claude Managed Agents (ベータ)・スキル・コード実行などのプラットフォーム機能に初日からアクセスできる (データ処理者は Anthropic)。既存の Google マネージドでは Google Cloud がデータ処理者となり VPC Service Controls、CMEK、米国・EU・APAC のデータ所在地を提供し、どちらも同じ料金と確約利用の充当が可能。ほかに ZenteiQ が llm-d を搭載した GKE Inference Gateway でバッチ推論の総スループットを 4.07 倍にした事例、Sky が Gemini を全従業員約 5,000 名に一斉配布し 98% の利用定着率と 2,000 個近いエージェントの共有を実現した事例が紹介された。英語ブログでは、Cloud SQL for MySQL のフルマネージドなブルーグリーンデプロイがプレビューとなり MySQL 8.0 から 8.4 のようなメジャーバージョンアップグレードを最小限のダウンタイムで実施可能に、AlloyDB Omni の Web UI が Red Hat とコンテナ向けに一般提供、VPC Flow Logs への GKE メタデータ付与によるワークロード単位のトラブルシューティング、最大 100 万の同時コード実行サンドボックスに向けた GKE Dataplane V2 のネットワーク ID 管理の最適化、GitHub スター 21,000 超となった Google Agent Skills の運用の舞台裏の続編が公開された。リリースノートでは、Dataflow が Streaming Engine ジョブの水平オートスケーリングの調整機能として、バックログしきい値を low_latency / medium_latency / high_latency から選ぶレイテンシ階層と、ワーカー数の最小・最大や使用率ヒント、レイテンシ階層を時間帯ごとに上書きする定期的なオートスケーリングスケジュールを追加 (ジョブ作成時にも実行中にも設定可能)。Model Armor がブラジル (southamerica-east1) で利用可能になり、保存時・使用時・転送時のデータ所在地要件に対応する (機能は一部限定)。Anti Money Laundering AI はリテール向けに v004.011 系の新しいマイナーエンジンバージョン aml-retail.default.v004.011.202610-000 を公開した (メジャーエンジンバージョンのサポート延長で大きな変更なし)。
