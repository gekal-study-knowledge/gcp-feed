    "summary": "<p> Incident began at <strong>2026-10-08 05:19</strong> <span>(all times are <strong>US/Pacific</strong>).</span></p><div class=\"cBIRi14aVDP__status-update-text\"><p><strong>Summary</strong></p>\n<p>Google Cloud Storage customers are experiencing elevated latencies and error rates when performing upload or write operations</p>\n<p><strong>Description</strong></p>\n<p>We are experiencing an issue with Google Cloud Storage beginning on Thursday, 2026-10-08 05:19 PDT.</p>\n<p>Our engineering team continues to investigate the issue.</p>\n<p>We will provide an update by Thursday, 2026-10-08 11:50 PDT with current details.</p>\n<p><strong>Customer Symptoms</strong></p>\n<ul>\n<li>Customers are experiencing elevated latencies and error rates when performing upload or write operations.</li>\n<li>A smaller subset of read operations may also experience increased latency and errors</li>\n</ul>\n<p><strong>Workaround</strong></p>\n<p>None at this time.</p>\n</div><hr /><p>Affected products: Google Cloud Storage</p><p>Affected locations: Iowa (us-central1)</p>"
