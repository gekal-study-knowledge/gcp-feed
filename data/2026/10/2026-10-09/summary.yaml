"overview": |
  この日は 9 件で、Gemini エージェントの日本語での発表と、エージェント向けの基盤強化、そして Google Cloud Storage の障害情報が中心でした。2026 年 10 月 8 日の 05:19 (米国太平洋時間) に始まった事象で、Google Cloud Storage へのアップロードや書き込みの操作で遅延とエラー率の上昇が発生しています。読み取りの操作も、一部でレイテンシーとエラーの増加が起こる可能性があります。影響を受けるプロダクトは Google Cloud Storage、影響を受けるロケーションはアイオワ (us-central1) です。エンジニアリングチームが調査を続けており、現時点で回避策はありません。次の更新は米国太平洋時間の 2026 年 10 月 8 日 11:50 に予定されています。その後に公開された RESOLVED の報告によると、この事象は 2026 年 10 月 8 日の 16:30 (米国太平洋時間) に終息しました。最初に適用した緩和策で継続的にエラー率の改善が見られ、エンジニアリングチームが環境を監視しながらさらに緩和策を展開してサービスを完全に安定させています。生成 AI では、Gemini at Work 2026 での Gemini エージェントの発表が日本語でも公開されました。業務のための単一の汎用的なエージェントとして質問への回答、ナレッジワークの処理、画像やメディアの作成、コードの記述と実行を行い、Google Workspace のインライン機能によって Gmail・ドライブ・ドキュメント・スライド・スプレッドシート・Chat・カレンダーの中で直接、どこで使っても同じメモリ・スキル・ガバナンス制御を保ったまま機能します。過去 1 年で 500 近い Google Cloud の顧客がそれぞれ 1 兆個を超えるトークンを処理し、全顧客の約 80% が AI 製品を使い、Fortune 100 企業の約 90% が Gemini Enterprise を採用しているという規模が示されました。開発では、Data Agent Kit が一般提供となりました。Model Context Protocol (MCP) のツールとエージェントスキルの無料のセットで、Antigravity・Claude Code・Codex などすでに使っているコーディングエージェントを Google Cloud のデータ製品と直接つなげます。コーディングエージェントは SQL や PySpark、パイプラインのコードを書くのは得意でも、どのテーブルがあるか、どうパーティション分割されているか、チームがどれを信頼しているか、昨夜のジョブがなぜ失敗したかといった開発環境の文脈が既定では欠けているため、推測で作業してスキーマやエラーログをチャットに貼ることになる、という課題を埋めるものです。15 を超える Google のデータクラウドのサービスに接続する MCP ツールと、BigQuery SQL の最適化や Bigtable の行キーの設計、dbt のパイプライン構築といったベストプラクティスを教える Google 製のオープンソースのスキルから成り、一般提供ではオープンレイクハウスに対する BigQuery Graph、Bigtable、Managed Service for Apache Spark からのアクセスもサポートされます。エージェント基盤では、RL 向けに最適化された GKE Agent Sandbox と Agent Sandbox RL オーケストレーション SDK が一般提供となりました。大規模な並列ロールアウトでエージェント型の強化学習と評価をスケールさせようとすると、高価な GPU クラスタがアイドルになり、CPU サンドボックスのコールドスタートに数分かかり、数千件の数ギガバイト規模の SWE-bench 風のイメージの pull とスケジューリングのバックログが生じる、というインフラのボトルネックに対するものです。最初のコマンド実行までの時間が 10〜45 倍速くなり (45〜85 秒から 1〜9 秒へ)、サンドボックスの最悪の待ち時間は 7.5 分から 10 秒未満に、コントロールプレーンのチャーンは 3 分の 1 に減りました。推論のルーティングでは、マルチクラスタ GKE Inference Gateway による階層型のアーキテクチャが紹介されました。世界的なアクセラレータ不足で 1 つのデータセンターに必要な容量が収まらず、長時間動くエージェントのワークロードは 10 万〜80 万を超えるコンテキストウィンドウを持つためアクセラレータのメモリを速く消費する、という状況を踏まえ、分散した容量を単一のエントリポイントの背後にある単一のプールのように扱います。エッジでマルチクラスタ GKE Inference Gateway がグローバルなマルチリージョンのトラフィック分配と高可用性を担い、その下で LLM-d ルーターがメモリ認識型のスケジューリングを処理します。米国と欧州に分散した 17,000 のコンピュートノードで SGLang により主要な MoE 基盤モデルをサービングしたベンチマークでは、3 クラスタへのスケールで 99.9% の成功率を保ちながらほぼ線形のスループット向上を達成し、ゲートウェイ経由のルーティングのオーバーヘッドは 1% 未満 (ローカルクラスタへの直接呼び出しのスループットの 99.5%) に収まりました。地理空間では、Google Earth Engine のコードエディタに Gemini を統合した新機能 「Ask」が導入されました。作業中のスクリプト全文、インポートしたアセットとジオメトリ、セッションのチャット履歴といったワークスペースの文脈を自動で把握するため、質問にコードを貼ったりデータセットを説明したりする必要がなく、提示されたスクリプトとの差分を自動表示して自分のスクリプトへマージできます。リリースノートでは、Datastream が SQL Server の GEOMETRY と GEOGRAPHY の空間データ型のレプリケーションに対応し、Managed Service for Apache Kafka では新規クラスタのブートストラップアドレスとブローカー URL の形式が変わり、Model Armor では Workspace のデータに対するプロンプトインジェクションとジェイルブレイクの保護が強化されて、メールや文書、ファイルといった Workspace のコンテンツを検査するときの検出精度が上がり誤検知が減りました。国内では、2026 年 9 月 8 日に電通ホールで開催された Google Cloud と dentsu Japan の共催イベント「Gemini Day」の開催報告が公開されました。電通のクライアント企業 50 社以上が参加し、両社トップによる基調対談、日本郵便における Gemini を用いた戦略設計プロセス改革の事例、Google Cloud 自身を「カスタマーゼロ」とした自己変革の知見、データと顧客体験を融合する次世代ソリューションが扱われました。
