    "summary": "<h2 class=\"release-note-product-title\">Datastream</h2>\n<h3>Feature</h3>\n<p>Datastream now supports replicating SQL Server <code>GEOMETRY</code> and\n<code>GEOGRAPHY</code> spatial data types.</p>\n<p>For more information, see the following:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/datastream/docs/unified-types#map-sqlserver\">Map SQL Server data types to Datastream unified\ntypes</a></li>\n<li><a href=\"https://docs.cloud.google.com/datastream/docs/bq-map-data-types\">Data type mappings in BigQuery</a></li>\n</ul>\n<h2 class=\"release-note-product-title\">Google Cloud Managed Service for Apache Kafka</h2>\n<h3>Change</h3>\n<p>The format for bootstrap addresses and broker URLs has changed for new\nManaged Service for Apache Kafka clusters. To learn how to get a cluster's\nbootstrap address, see\n<a href=\"https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/view-cluster#view-bootstrap-address\">View a Managed Service for Apache Kafka cluster</a>.</p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Model Armor includes enhanced prompt injection and jailbreak\nprotection for Workspace data. This capability improves detection accuracy and\nminimizes false positives when screening Workspace content, such\nas emails, documents, and files.</p>\n<p>This capability is available on multi-region endpoints in the US (<code>us</code>) and EU\n(<code>eu</code>) for templates and floor setting configured with\n<a href=\"https://docs.cloud.google.com/model-armor/set-filter-version\">filter version</a> <code>v3</code> or later, including the\n<code>Stable</code> and <code>Latest</code> aliases.</p>"
