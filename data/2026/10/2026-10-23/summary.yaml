"overview": |
  この日は 8 件 (重複を除くと 7 件) で、Google Cloud 上の Claude のデプロイ方式が増えたこと、Knowledge Catalog のコンテキスト拡充、そしてエージェントからのデータアクセスが中心でした。Google Cloud 上の Claude モデルについて、Anthropic が管理するデプロイの選択肢が一般提供となりました。従来の Google が管理するデプロイとあわせて、AI のワークロードを Google Cloud に集約しながら運用方法を選べるようにするものです。どちらの選択肢でも同じフロンティアモデルが初日から使え、価格も同じで、課金は Google Cloud にまとまります。違いはデータ処理者が誰になるか、そして新しい Claude プラットフォームの機能が公開された時点で使えるかどうかの 2 点です。Anthropic が管理する方式では Claude モデルとプラットフォーム機能に初日からアクセスできます。データ基盤では、エージェント向けのコンテキストエンジンである Knowledge Catalog に、自己学習型のコンテキスト拡充と刷新された Knowledge Studio がプレビューで追加されました。既存の Gemini による拡充の上に、エージェントと利用者のやり取りを分析して不足を見つけ、業務上のコンテキストを正確かつ最新に保ちます。Knowledge Studio はコンテキストエンジニアやデータスチュワードのための新しい司令塔で、自社のデータ資産を対話的に探索し、視覚的なコンテキストグラフをたどり、グラフへの変更案を利用者やエージェントに公開する前にレビューできます。エージェントの能力は、組織全体の定義・ルール・関係といったコンテキストの質で決まるため、コンテキストの整備がエンタープライズのエージェント活用で最も重要な分野のひとつになったという位置づけです。日本のブログでは 4 本が公開されました。1 本目はサイバーエージェントの事例です。広告領域での活用を想定した社内向けクリエイティブ生成 AI プラットフォーム「AI SCREAM」を Google Cloud 上に約 3 年運用しており、Veo・Imagen・Nano Banana (Gemini Flash Image / Pro Image など) といった社内審査を通った複数のモデルを統一された UI から横断して使えます。2023 年 10 月に仮想マシン 1 台で小さく始め、2025 年には Agent Development Kit を使ったエージェント基盤を足して、画像を作る「道具」から制作ワークフローを支援する「仕組み」へ進めたという経緯で、Cloud Run や Pub/Sub を使っています。出発点は、生成 AI を使いたくても高度な専門知識が要るためエンジニア以外のクリエイターや営業担当者が手を出せなかったことだったとされています。2 本目は MCP ツールボックスの Java SDK v1.0 です。N 個のモデルと M 個のデータソースがあると N × M 本のカスタム接続を作って守って維持しなければならないという統合のボトルネックに対し、MCP を AI オーケストレーションの USB Type-C のような共通インターフェースとしてモデルとデータソースを切り離す位置づけで、Java の成熟したアーキテクチャによって高い同時実行性、厳格なトランザクション整合性、堅牢な状態管理を備えた型安全なエージェントオーケストレーションを実現します。3 本目は Gemini とボーダーレス Lakehouse の連携です。複数のクラウド・SaaS・オンプレミスに分散したデータへのアクセスと推論がボトルネックになるという前提で、Lakehouse カタログ連携を通じて Databricks Unity Catalog や Snowflake Horizon といったデータソースへのアクセスを Gemini から直接設定できるようになりました (プレビュー)。業務利用者は自然言語でクラウドをまたいだレコードをクエリでき、AI エージェントは同じデータを根拠に推論しコードを生成でき、いずれもデータを移動せずに行えます。4 本目は Alteryx One Live Query と BigQuery の連携です。ブラウザベースの環境でコードを書かずに高度なデータパイプラインを組み、安全な SQL プッシュダウンによって変換のロジックをネットワーク越しにデータを動かさずウェアハウス内で実行します。請求書 PDF の処理のようにドキュメントを多用するワークフローで効果が大きく、BigQuery のガバナンスとセキュリティを保ったまま Gemini などのモデルをオーケストレーションして PDF や画像から情報を抽出できます。リリースノートでは、Cloud Monitoring の Ops Agent 2.73.0 が、システムのルート証明書に関わる Go の脆弱性 CVE-2026-111943 の修正を含めて公開されました。セキュリティ速報では GCP-2026-071 が公開されました (2026 年 10 月 23 日公開、CVE-2026-111943)。eMudhra (emSign) の複数の中間認証局 (CA) の秘密鍵が侵害されたもので、これらの認証局を信頼している未修正の TLS クライアントとコンテナランタイムは、外部との TLS 接続において能動的なネットワークの中間者 (MitM) 攻撃による傍受とトラフィックのなりすましを受けるおそれがあります。
