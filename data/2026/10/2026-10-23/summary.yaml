"overview": |
  この日は 3 件 (重複を除くと 2 件) で、Google Cloud 上の Claude のデプロイ方式が増えたことと、Knowledge Catalog のコンテキスト拡充が中心でした。Google Cloud 上の Claude モデルについて、Anthropic が管理するデプロイの選択肢が一般提供となりました。従来の Google が管理するデプロイとあわせて、AI のワークロードを Google Cloud に集約しながら運用方法を選べるようにするものです。どちらの選択肢でも同じフロンティアモデルが初日から使え、価格も同じで、課金は Google Cloud にまとまります。違いはデータ処理者が誰になるか、そして新しい Claude プラットフォームの機能が公開された時点で使えるかどうかの 2 点です。Anthropic が管理する方式では Claude モデルとプラットフォーム機能に初日からアクセスできます。データ基盤では、エージェント向けのコンテキストエンジンである Knowledge Catalog に、自己学習型のコンテキスト拡充と刷新された Knowledge Studio がプレビューで追加されました。既存の Gemini による拡充の上に、エージェントと利用者のやり取りを分析して不足を見つけ、業務上のコンテキストを正確かつ最新に保ちます。Knowledge Studio はコンテキストエンジニアやデータスチュワードのための新しい司令塔で、自社のデータ資産を対話的に探索し、視覚的なコンテキストグラフをたどり、グラフへの変更案を利用者やエージェントに公開する前にレビューできます。エージェントの能力は、組織全体の定義・ルール・関係といったコンテキストの質で決まるため、コンテキストの整備がエンタープライズのエージェント活用で最も重要な分野のひとつになったという位置づけです。
