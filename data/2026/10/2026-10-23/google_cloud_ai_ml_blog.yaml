    "title": "Expanding Claude availability and deployment choice on Google Cloud"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/expanding-claude-availability-on-google-cloud/"
    "published": "2026-10-23 06:00:00"
    "fetched": "2026-10-23 07:06:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Every organization has unique requirements for building and scaling generative AI. At Google Cloud, we are committed to giving developers model choice and architectural flexibility to run workloads however they need.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Today, we’re announcing the general availability of an Anthropic-managed deployment option for Claude Models on Google Cloud. This gives teams more choice in how they run their models, helping them consolidate AI workloads on Google Cloud alongside our existingGoogle-managed deployment option. </strong></p>\n<p><span style=\"vertical-align: baseline;\">Both options deliver the same frontier models on day zero, the same pricing, and the same Google Cloud billing. The difference comes down to who acts as your data processor and whether you need access to the new Claude platform features when they launch:</span></p>\n<h3><strong style=\"vertical-align: baseline;\">[NEW] Claude Models on Google Cloud (Anthropic managed)</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Delivers day-zero access to Claude models and Claude Platform features such as Claude Managed Agents (beta), skills, and code execution. Anthropic operates the stack as the data processor on Google Cloud infrastructure under Anthropic’s terms of service, while organizations authenticate with Google Cloud IAM, maintain Cloud Audit Logging, and consolidate spend under their existing Google Cloud billing and eligible commitments.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Learn more: </span><a href=\"https://console.cloud.google.com/marketplace\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Claude Models on Google Cloud (Anthropic-managed)</span></a><span style=\"font-style: italic; vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Claude Models on Google Cloud (Google managed)</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Continues to deliver day-zero access to the latest Claude models with strict governance, compliance, and sovereignty requirements. Google Cloud operates as the data processor under existing customer agreements, providing VPC Service Controls, Customer-Managed Encryption Keys (CMEK), and data residency in the U.S., EU, and APAC. New Claude Platform features roll out over time as they are integrated into the Google-managed infrastructure. Teams also benefit from native integrations with Google Cloud services like BigQuery and Model Armor, along with standard billing and eligible commitment drawdown. </span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Learn more: </span><a href=\"https://cloud.google.com/products/model-garden/claude\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Claude Models on Google Cloud (Google managed)</span></a></p>\n<h3><span style=\"vertical-align: baseline;\">Comparing deployment options</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\"> </div>\n</div>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Feature</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Anthropic-managed</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google-managed</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Model availability</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available on Day 0</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available on Day 0</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">First-party tools and betas </strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available on Day 0</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available once integrated into the Google-managed infrastructure</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Data processor and terms</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Anthropic (under Anthropic’s Commercial Terms)</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud (under existing Google Cloud customer agreements)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Pricing &amp; commitments</strong></p>\n</td>\n<td colspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Standard pricing (draws down eligible Google Cloud commitments)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">No matter how you choose to deploy, you can access Anthropic's latest frontier models on Google Cloud, including </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-fable-5-1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Claude Fable 5.1</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-sonnet-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sonnet 5.5</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-haiku-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Haiku 5.5</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-opus-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Opus 5.5</span></a><span style=\"vertical-align: baseline;\">, with new platform features available immediately on the Anthropic-managed option and rolling out on the Google-managed option once integrated. This gives developers the full spectrum of reasoning, coding, and multi-modal capabilities with Google Cloud IAM and Marketplace billing.</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://console.cloud.google.com/agent-platform/claude-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get started</span></a><strong style=\"vertical-align: baseline;\">.</strong></p></div>"
