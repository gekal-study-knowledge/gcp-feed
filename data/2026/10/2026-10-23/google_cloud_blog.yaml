    "title": "Introducing new self-learning context enrichment in Knowledge Catalog"
    "link": "https://cloud.google.com/blog/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents/"
    "published": "2026-10-23 01:00:00"
    "fetched": "2026-10-23 03:18:12"
    "summary": "<div class=\"block-paragraph\"><p>Today, we’re launching self-learning context enrichment (preview) and a reimagined Knowledge Studio experience (preview) in <a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/introduction\">Knowledge Catalog</a>, Google Cloud’s context engine for agents. Building on Knowledge Catalog's existing Gemini-powered enrichment, self-learning enrichment analyzes agent and user interactions to find gaps and keep your business context accurate and current. <a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\">Knowledge Studio</a> is the new command center for context engineers and data stewards to explore their data estate conversationally, navigate a visual context graph, and review proposed changes to the context graph before they are published to their users and agents.</p><p>An agent is only as good as the organization-wide definitions, rules, and relationships it reasons over — the context, as it were. That’s why curating context has become one of the most important disciplines in enterprise agentic capabilities. Today, most of that work happens by hand. Context engineers write prompts and mappings agent by agent, while data stewards try to manually keep definitions current across thousands of assets. But this breaks down as organizations move from a handful of agents to thousands, and eventually millions.</p><p>Knowledge Catalog’s Gemini-powered self-learning enrichment turns that manual upkeep into a continuous feedback loop. By analyzing agent and user interactions, it pinpoints missing or outdated context and pulls verified definitions from playbooks, code repositories, and business documents into governed, reusable context sets. Then, with optimized search, every agent gets precisely the right context it needs instead of reasoning over bloated prompts and raw schemas, and benefits from shared learning across your organization. Knowledge Catalog makes AI agents nearly 4X more accurate, with up to 33% lower latency, and using up to 75% fewer tokens, based on internal benchmarks.</p><h3><b>Keep context current with Gemini-powered self-learning enrichment</b></h3><p>Consider a simple question to a Gemini agent: \"What was the net revenue in EMEA last quarter?\" Answering it correctly requires knowing how your company defines net revenue, which tables hold the bookings, and how they join, yet that knowledge is typically scattered across a finance playbook in Google Docs, a data model in GitHub, and a Confluence page. Static catalogs expect subject matter experts to manually capture and update business definitions, metrics, and other context upfront so that an agent can effectively query the right data. However, in reality, experts rarely have the time to document every asset, and the moment the finance team revises how partner credits are treated next quarter, static definitions fall behind and every agent with a hardcoded formula starts giving the wrong answer.</p><p>Knowledge Catalog’s enrichment capability acts where you already keep your business knowledge: across your team’s every doc, repo, and table. It connects to your structured data across first-party and third-party sources and unstructured data in Cloud Storage, Google Workspace, GitHub, Confluence, and SharePoint. It finds, extracts, assembles, and maintains that business knowledge for you, linking those unstructured sources like playbooks and wikis and their context to your structured metadata in Knowledge Catalog like tables and schemas to make your structured data far more discoverable and actionable. On demand or on a schedule, it proposes business definitions, table and column descriptions, join relationships, golden queries, and task-specific agent instructions, each with source citations and a confidence score. On every run, it detects what changed at the source, retires obsolete definitions, and flags conflicts for review.</p><p>It learns from both your user and agent interactions. You can configure enrichment to analyze interaction traces from Gemini agents, Conversational Analytics in BigQuery, or your custom agents while redacting PII, and it pinpoints where agents struggled, such as ambiguous column lookups, ungrounded metrics, missing definitions, or users rephrasing the same question. It then finds the authoritative answer and stages a fix, so the same mistake doesn't happen twice. That's how context engineering keeps pace with millions of agent interactions, freeing experts to review changes instead of writing them from scratch.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-explore-search\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1-explore-search.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Configuring an enrichment task with connected sources, evaluation, and self-learning</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>Automation doesn't mean giving up control. You can choose to enable or disable auto-publishing at any time, and set the exact confidence score (for example, 85%) at which proposed changes are automatically approved. Anything below your threshold, along with sensitive updates such as deletions, become a Change Request for a steward to approve, edit, or reject. You can also provide your own evaluation set to test proposed updates end to end. Every change is logged with full provenance and can be reverted. And of course, Google never uses your data to train its models.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-enrichment-task\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2-enrichment-task.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Reviewing enrichment proposals, confidence scores, and change diffs before publishing</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Set the right context for each audience with context sets</b></h3><p>By design, an enterprise context graph is quite broad, but for a given task, both agents and users often only need the right, trusted segment of it. Knowledge Catalog achieves that with context sets — curated, governed subsets of the context graph that contains the definitions, metrics, join logic, and golden queries for a specific domain, team, agent, or group of end users. For instance, a sales agent can be bound to the Sales context set, while a finance analyst's assistant can be bound to the Finance context set. Because \"net revenue\" can legitimately mean different things to each group, every domain maintains its own definitions in the same catalog. However, agents don't have to be bound to a single set; with search in Knowledge Catalog, an agent can also dynamically search and find the right context set for any given task.</p><p>Context sets also provide built-in data governance and fine-grained access control. Access to each context set is managed with IAM, so stewards decide which agents and users can read, use, or edit it. Agents only retrieve context from the sets they're authorized to use, and access to the underlying data continues to follow your existing permissions. Every update is traceable, and reversible, and because context sets build on the <a href=\"https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing\">Open Knowledge Format</a> (OKF), you can import an OKF bundle to become a context set and export it back out as OKF so your context stays portable.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3-review-changes\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3-review-changes.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Approved enrichments published to a governed context set</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Explore and govern it all in Knowledge Studio</b></h3><p>All of these capabilities come together in the reimagined Knowledge Catalog experience, built for context engineers and data stewards who curate and govern context for agents.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4-context-set\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4-context-set.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Navigating the context graph visually in Knowledge Studio</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>The new Knowledge Studio turns Knowledge Catalog from a repository of static inventory into an interactive command center, allowing you to:</p><ul><li><b>See context coverage at a glance:</b> Navigate a visual map of your cross-cloud data estate, from operational databases and warehouses to semantic models, context sets, and documentation.</li><li><b>Explore context conversationally:</b> Ask business questions in natural language, traverse relationships across your enterprise context graph, and see exactly how agents reason over your metadata.</li><li><b>Review and validate enrichments in one place:</b> Inspect each proposed change, source citations, and confidence score. Test context sets against real questions, and approve, edit, or roll back change requests with software-style version control.</li><li><b>Monitor enrichment runs:</b> Track each enrichment task's schedule, results, token usage, and run duration, and get notified by email when a run completes.</li></ul><h3><b>Get started</b></h3></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=qeWzgLGSkls\">\n\n      \n        <img alt=\"How Knowledge Catalog’s self-learning enrichment grounds enterprise AI agents\" src=\"https://img.youtube.com/vi/qeWzgLGSkls/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Watch the demo: How Knowledge Catalog’s self-learning enrichment grounds agents</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=qeWzgLGSkls\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p>These features will be rolled out to customers in the next few weeks. <a href=\"https://docs.google.com/forms/d/1Xsxc1j9XqHupqnvfn7hC1bHtAB90ro4GqkCZboAPW_M/edit\" target=\"_blank\">Sign up</a> to request immediate access and visit the <a href=\"https://docs.cloud.google.com/knowledge-catalog/docs\">documentation</a> for step-by-step guidance.</p></div>"
  "2f716138c85af652a82b0d349a0b48f1":
    "id": "2f716138c85af652a82b0d349a0b48f1"
    "title": "Expanding Claude availability and deployment choice on Google Cloud"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/expanding-claude-availability-on-google-cloud/"
    "published": "2026-10-23 06:00:00"
    "fetched": "2026-10-23 07:06:33"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Every organization has unique requirements for building and scaling generative AI. At Google Cloud, we are committed to giving developers model choice and architectural flexibility to run workloads however they need.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Today, we’re announcing the general availability of an Anthropic-managed deployment option for Claude Models on Google Cloud. This gives teams more choice in how they run their models, helping them consolidate AI workloads on Google Cloud alongside our existingGoogle-managed deployment option. </strong></p>\n<p><span style=\"vertical-align: baseline;\">Both options deliver the same frontier models on day zero, the same pricing, and the same Google Cloud billing. The difference comes down to who acts as your data processor and whether you need access to the new Claude platform features when they launch:</span></p>\n<h3><strong style=\"vertical-align: baseline;\">[NEW] Claude Models on Google Cloud (Anthropic managed)</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Delivers day-zero access to Claude models and Claude Platform features such as Claude Managed Agents (beta), skills, and code execution. Anthropic operates the stack as the data processor on Google Cloud infrastructure under Anthropic’s terms of service, while organizations authenticate with Google Cloud IAM, maintain Cloud Audit Logging, and consolidate spend under their existing Google Cloud billing and eligible commitments.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Learn more: </span><a href=\"https://console.cloud.google.com/marketplace\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Claude Models on Google Cloud (Anthropic-managed)</span></a><span style=\"font-style: italic; vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Claude Models on Google Cloud (Google managed)</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Continues to deliver day-zero access to the latest Claude models with strict governance, compliance, and sovereignty requirements. Google Cloud operates as the data processor under existing customer agreements, providing VPC Service Controls, Customer-Managed Encryption Keys (CMEK), and data residency in the U.S., EU, and APAC. New Claude Platform features roll out over time as they are integrated into the Google-managed infrastructure. Teams also benefit from native integrations with Google Cloud services like BigQuery and Model Armor, along with standard billing and eligible commitment drawdown. </span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Learn more: </span><a href=\"https://cloud.google.com/products/model-garden/claude\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Claude Models on Google Cloud (Google managed)</span></a></p>\n<h3><span style=\"vertical-align: baseline;\">Comparing deployment options</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\"> </div>\n</div>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Feature</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Anthropic-managed</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google-managed</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Model availability</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available on Day 0</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available on Day 0</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">First-party tools and betas </strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available on Day 0</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Available once integrated into the Google-managed infrastructure</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Data processor and terms</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Anthropic (under Anthropic’s Commercial Terms)</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud (under existing Google Cloud customer agreements)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Pricing &amp; commitments</strong></p>\n</td>\n<td colspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Standard pricing (draws down eligible Google Cloud commitments)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">No matter how you choose to deploy, you can access Anthropic's latest frontier models on Google Cloud, including </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-fable-5-1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Claude Fable 5.1</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-sonnet-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sonnet 5.5</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-haiku-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Haiku 5.5</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-opus-5-5\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Opus 5.5</span></a><span style=\"vertical-align: baseline;\">, with new platform features available immediately on the Anthropic-managed option and rolling out on the Google-managed option once integrated. This gives developers the full spectrum of reasoning, coding, and multi-modal capabilities with Google Cloud IAM and Marketplace billing.</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://console.cloud.google.com/agent-platform/claude-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get started</span></a><strong style=\"vertical-align: baseline;\">.</strong></p></div>"
