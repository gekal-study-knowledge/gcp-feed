    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 9 月 24 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/chrome-enterprise/secure-intelligent-experiences-across-every-endpoint?e=0&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>オフィスワーカーの働き方は長年にわたり、驚くほどに変わらないままでした。従業員はデバイスにログインし、ブラウザを開いて、相互に連携していない 10 種類以上ものアプリケーションを切り替えつつ作業を行います。この働き方においてユーザーは、タブ間で情報をコピー＆ペーストする、いわばアプリの橋渡しの役割を担ってきました。しかし現在では、より迅速で、従業員の生産性をさらに高めるエージェント ワークフローが登場し、存在感を高めつつあります。このワークフローでは、得られる成果を従業員が主体的に設定し、自律型 AI エージェントが複数ステップのビジネス プロセスをエンドツーエンドで実行します。これによって冗長なタスクを手動で行う必要がなくなり、従業員はより複雑で戦略的な作業に集中することが可能になります。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GIE Animation\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/GIE_Animation.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>したがって、従業員が使用するエンドポイントは、セキュリティを確保しつつ、この新しい働き方で生産性を向上させる最新のアプローチとアーキテクチャに対応できるものである必要があります。Google の企業向けブラウザ、オペレーティング システム、ハードウェアはすべて、組み込みのコンテキスト インテリジェンス、強力な AI モデル、ポリシーを適用するための柔軟な管理オプションによって統合されています。Google インテリジェント エンドポイントのコレクションはその全体にわたってセキュアなエンドユーザー コンピューティング ソリューションを提供して、この進化した働き方をサポートします。インテリジェント エンドポイント戦略を実践することで、企業は従業員の生産性を変革し、セキュリティ リスクを軽減し、エージェント型 AI の時代とその先に来るものに備えることができます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"[WIP] Enterprise Summit 2026 Breakout - Securing the Intelligent Endpoint_ Defending against shadow AI and increasing vulnerabilities (1)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/WIP_Enterprise_Summit_2026_Breakout_-_Secu.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>日々のワークフローをスケールして時間を節約</b></h3><p>Google のエンドユーザー コンピューティング戦略は、作業で通常使用されるプラットフォームやアプリにインテリジェンスを直接組み込んで生産性を大幅に向上させることを中核としており、そのため、ブラウザを重要なインテリジェント エンドポイントと考えています。</p><p>今年の初めに、Google は Chrome でブラウザにエージェント機能を直接組み込み、複数のタブにまたがる複雑なマルチステップのタスクをネイティブに自動化できるようにしました。CRM ツールでの見込み顧客の追跡から、Asana などのツールでのワークフローのオーケストレーションまで、ウェブ上のさまざまな場所で発生する繰り返しタスクをブラウザに組み込みのタスク自動化で処理できるため、従業員はその分の時間を取り戻すことができます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"102_Auto Browse_Asana_GIF_V2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/102_Auto_Browse_Asana_GIF_V2.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>ビジネス ユーザーが繰り返しタスクの処理に Gemini in Chrome をさらに活用できるよう、企業向けスキル ライブラリも新しく提供されています。また、IT チームは<a href=\"https://chromeenterprise.google/engage/trusted-testers/sign-up/?sjid=7079412301119223966-NA\" target=\"_blank\"> Trusted Tester プログラム</a>を利用して、IT チームが検証した事前構成済みの AI スキルを専用ライブラリに直接公開できます。管理対象ユーザーはこのライブラリを、標準化された会社承認済みのワークフローを見つけてデプロイするための一元的なハブとして利用できます。これにより、従業員はプロンプトをゼロから作成しなくても、日常業務のサポートを簡単に得ることができます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Google CE_Next Demo_Skills\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Google_CE_Next_Demo_Skills.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Gemini in Chrome の機能が、さらに多くの地域の企業や Google Workspace のお客様にご利用いただけるようになりました。全言語の一覧は<a href=\"https://support.google.com/gemini/answer/17140089?sjid=15190547771275699054-NC#supported_regions\"> こちら</a>をご覧ください。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>最新のセキュアなエンドポイントに移行しても、中核的なビジネス ツールや既存のシステムが使えなくなることはありません。Chrome Enterprise Premium は、従来のアプリケーションにもシームレスでセキュリティの高い基盤を提供します。Google の Cameyo を使用すると、Chrome タブ内で従来のアプリケーションを直接ストリーミングして使用できます。</p><p>この強力な組み合わせにより、Chrome Enterprise Premium のブラウザベースのセキュリティ保護が従来のアプリに継承されるほか、Gemini in Chrome による生産性向上のための AI 機能やエージェント機能も利用可能になります。これにより古いツールに新しい命が吹き込まれ、従業員はブラウザを離れることなくそれらを活用できるようになります。</p><h3><b>プロアクティブなセキュリティと可視性の強化</b></h3><p>最近になって、新たな脅威ベクトルが出現しています。それは、従業員が業務を効率的に進めようとする中で、誤って機密データを一般公開 AI ツールに流出させてしまうことです。実際、労働者の約 80% が個人用の AI ツールを業務に利用しており、その半数以上が機密性の高い知的財産や企業データを一般公開システムに直接貼り付けたことがあるというレポートがあります*。Google インテリジェント エンドポイントは、オペレーティング システム、ブラウザ、ユーザーの各レベルでデータを保護し、最新の脅威に対するスケーラビリティの高い防御を提供します。これにより、従業員の生産性を損なうことなく、組織のセキュリティをより強固に維持できます。</p><p>IT チームとセキュリティ チームは、<a href=\"https://chromeenterprise.google/products/chrome-enterprise-premium/\" target=\"_blank\">Chrome Enterprise Premium</a> を使用して厳格できめ細かいデータ損失防止（DLP）ルールを適用し、ブラウザ内で扱われる企業データを保護できます。サードパーティのネイティブ LLM アプリケーションは、基本的なデータ プライバシー設定はあっても、データの引き出しの防止に欠かせないアクティブな DLP 制御は備えていません。Chrome Enterprise Premium を使用しない場合、企業は複雑なセキュリティ ソリューションを導入せざるを得ず、しかも、そうしたソリューションでも管理対象外のデバイスや個人用デバイスをカバーできないことは珍しくありません。</p><p>まもなく、IT 部門はブラウザでのコピー操作をトリガーとして機密レコードのコピーを積極的に検出してブロックする DLP ルールをデプロイできるようになります。これにより、機密データをシステムのクリップボードにコピーすることさえ防止できます。さまざまな AI サービス全体で企業の知的財産を保護する必要性を考慮すると、この機能の重要性はさらに高まります。ファイルのダウンロード、貼り付けたコンテンツやスクリーンショットのブロックと共有など、ブラウザベースの DLP 機能の多くはモバイル デバイスでも使用できるようになっており、デバイス間のセキュリティ ギャップがさらに縮小されました。</p><p>また、Chrome Enterprise の生成 AI レポート機能も改善されました。IT チームとセキュリティ チームは、ウェブ全体での AI と SaaS の使用状況を包括的にリアルタイムで確認できるのに加え、レポートから直接是正措置を講じることも可能です。IT チームは、高リスクなアプリへのアクセスのブロック、セキュリティ ポリシーの更新、会社が承認した別の AI へのリダイレクトなどを、数回クリックするだけで実施できます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2bek7ogrsnae0\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2bek7ogrsnae0_7ZXport.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>次世代デバイスで従業員を支援</b></h3><p>Google インテリジェント エンドポイントは、従業員が次世代のワークロード向けに設計されたさまざまな最新デバイスを使って途切れることなく業務を進められるようにします。従業員が 1 日を通じてさまざまなデバイスで業務を行う中で、それらのエンドポイント デバイスはプロアクティブで一貫したエクスペリエンスのメリットを提供します。</p><p>Chromebook Plus は、管理対象デバイスで優れたパフォーマンスと統合された Gemini 機能をすでに提供しており、既存のワークフロー内でユーザーを支援します。これにより、従業員は作業中のアプリやファイル、タブから直接、手厚いサポートを受けることが可能です。また、Google は今週初め、最前線で開発や作業を行う方に最適なコンパニオンである<a href=\"https://blog.google/products-and-platforms/devices/googlebook/pre-order-googlebook/\" target=\"_blank\"> Googlebook を発表</a>しました。Googlebook は 10 月にリリースされ、2027 年後半にはエンタープライズ機能が追加される予定です。</p><p>Googlebook は、モバイル デバイスを含む Android エコシステム全体に、相互運用性によるさらに多くのメリットをもたらします。生産性を高め、シームレスな作業を可能にするデバイスには、最新の Google Pixel 11、Google Pixel 11 Pro、Google Pixel 11 Pro XL、Google Pixel 11 Pro Fold、Samsung Galaxy S26 Ultra、Samsung Galaxy Z Fold 8、Samsung Galaxy Z Fold 8 Ultra、Samsung Galaxy XCover7 Pro があります。Android Enterprise を使用すると、IT チームはこれらすべてのデバイスの AI 機能を管理して、会社を前進させつつ、データの安全性と保護を維持できます。</p><p>Android は、従業員が簡単にさまざまなタイプのデバイスで作業を行えるよう、マルチ フォーム ファクタのラインナップを拡大させ続けています。Android XR プラットフォームを使えば、軽量な<a href=\"https://www.android.com/xr/\" target=\"_blank\">エンタープライズ グレードのスマート ヘッドセットや有線グラス</a>は、従業員がどこにいても利用できるプライベートなマルチモニター ワークステーションになります。IT 部門は、会社のスマートフォンやタブレットの管理に使用しているのと同じモバイル エンタープライズ管理機能を使用して、これらの空間コンピューティング デバイスを<a href=\"https://blog.google/products-and-platforms/platforms/android/android-xr-immersive-features-update-april-2026/\" target=\"_blank\">シームレスにプロビジョニング、保護、デプロイ</a>できます。Android Enterprise に関するその他のニュースについては、<a href=\"https://blog.google/products-and-platforms/products/android-enterprise/whats-new-android-enterprise-2026\" target=\"_blank\">ブログ</a>をご覧ください。</p><p>インテリジェント エンドポイントは、人と人とのつながりもさらに深めます。<a href=\"https://beam.google/\" target=\"_blank\">Google Beam</a> は Google AI を活用したリアルな 3D ビデオ コミュニケーション プラットフォームです。従業員が同じ部屋にいるかのような没入感のある会議体験を提供し、地理的に分散したチームが距離を意識することなく話し合えるようにします。より多くの組織で仮想会議のエクスペリエンスを向上できるよう、幅広いパートナー ネットワークを通じて、これらのデバイスが<a href=\"https://blog.google/innovation-and-ai/models-and-research/google-research/google-beam-expansion/\" target=\"_blank\">提供される国や地域は拡大を続けています</a>。</p><h3><b>Google インテリジェント エンドポイントの使用を開始する方法</b></h3><p>Google インテリジェント エンドポイントの詳細は、複数の方法でご確認いただけます。</p><ul><li>Google インテリジェント エンドポイントを形成する Google のプラットフォームとデバイスの連携について詳しくは、<a href=\"http://chromeenterprise.google/products/intelligent-endpoints\" target=\"_blank\">こちら</a>をご覧ください。</li><li>今すぐの導入をお考えの場合は、<a href=\"https://support.google.com/chrome/a/answer/15832585?hl=en\" target=\"_blank\">Chrome Enterprise Premium の試用</a>を開始して、ブラウザ内の高度な保護機能をご利用ください。</li><li><a href=\"https://www.lenovo.com/us/en/solutions/digital-workplace\" target=\"_blank\">Lenovo Digital Workplace Solutions with Google</a> は、職場全体を 1 つのセキュアなモジュール型ソリューションとして統合します。信頼できるパートナーに面倒な作業を任せることができるため、IT を簡素化し、自信を持って AI を管理しながら、自社のペースで拡張できます。</li></ul><p>* <a href=\"https://www.forbes.com/sites/bryanrobinson/2026/06/28/the-rise-of-bring-your-own-ai-to-work-as-leaders-fall-behind/\" target=\"_blank\">Forbes</a> の 2026 年の職場における「BYO AI」に関するレポート、および<a href=\"https://airia.com/blog/shadow-ai-statistics-key-data-points-every-ciso-needs-in-2026/\" target=\"_blank\"> Airia</a> のシャドー AI に関する統計レポート</p><p><i>- Android Enterprise、プロダクト＆エンジニアリング担当バイス プレジデント、</i><b><i>David Still</i></b></p><p><i>- Chrome Enterprise およびセキュリティ、プロダクト管理ディレクター、</i><b><i>Mark Berschadski</i></b></p></div>"
