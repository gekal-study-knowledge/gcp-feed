    "title": "サイバーエージェント: Cloud Run や Agent Development Kit を活用し、クリエイティブ生成 AI プラットフォーム「AI SCREAM」のエージェント化を推進"
    "link": "https://cloud.google.com/blog/ja/topics/customers/cyberagent-is-promoting-the-adoption-of-its-creative-ai-platform/"
    "published": "2026-10-23 11:00:00"
    "fetched": "2026-10-23 15:59:16"
    "summary": "<div class=\"block-paragraph\"><p>株式会社サイバーエージェントは、広告領域での活用を想定した社内向けクリエイティブ生成 AI プラットフォーム「AI SCREAM（アイスクリーム）」を、Google Cloud 上に構築し、約 3 年にわたって運用してきました。2025 年には Agent Development Kit（ADK）を活用したエージェント基盤を追加し、画像を作るための「道具」から、制作ワークフローを支援する「仕組み」へと進化させることに成功しています。その開発キーマンに、3 年間の総括と今後の展望を伺いました。</p><p><b>利用しているサービス:</b><br /> <a href=\"https://cloud.google.com/run?hl=ja\">Cloud Run</a>、<a href=\"https://docs.cloud.google.com/pubsub/docs/overview?hl=ja\">Pub/Sub</a>、<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/veo/3-1-generate?hl=ja\">Veo</a>、<a href=\"https://cloud.google.com/resources/content/intl/ja-jp/imagenpromptguide?hl=ja\">Imagen</a>、<a href=\"https://gemini.google/jp/overview/image-generation/?hl=ja-JP\" target=\"_blank\">Nano Banana</a> など</p><p><b>利用しているソリューション:</b><br /><a href=\"https://cloud.google.com/ai/generative-ai?hl=ja\">生成 AI</a></p><h3><b>独自プラットフォーム「AI SCREAM」で全社員に生成 AI を届ける</b></h3><p>AI SCREAM は、動画生成 AI の Veo や、画像生成 AI の Imagen、Nano Banana（Gemini Flash Image / Pro Image 等） など、社内審査を経て商用利用可能な複数の生成 AI モデルを統一された UI 上で横断的に活用できる、サイバーエージェント独自のクリエイティブ生成AIプラットフォームです。広告制作などで必要となる静止画や動画、音声といった素材の作成から、それらを組み合わせた最終アウトプットまでを、誰もが手軽に行える仕組みを提供しています。</p><p>AI SCREAM 開発責任者の瓜生 和也氏は、その出発点は「生成 AI を使いたくても使えない人が社内に大勢いたこと」だったと振り返ります。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image6\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image6_BCheNRw.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「2023 年当時、画像生成 AI 活用の機運は高まり始めていましたが、導入と利用には高度な専門知識が求められており、エンジニア以外のクリエイターや営業担当者は、到底手の出せない状況でした。そうした『壁』を取り払い、全社員に生成 AI を届けることが、このプロジェクトの目的となっています。」（瓜生氏）</p><p>2023 年 10 月、VM 1 台でスモール スタートした AI SCREAM は、2024 年 1 月に全社展開を見据えたリアーキテクチャを実施します。Cloud Run で動くフロントエンド／バックエンドと、推論ワーカーの VM 群の間に Pub/Sub を挟み、非同期の境界で疎結合にする構成に作り替えることで、より多くの社員が快適に使えるようになりました。</p><p>「インフラ層においては、社員約 8,000 人のうち 3 割、約 2,400 人が日常的に使うところまでスケールさせたいという事業要求に応えることが求められていました。一方、当時の GPU モデルは容量が大きく、1 つの VM に複数モデルを載せるのは現実的ではないという物理制約もありました。そこで、この両方の要件を満たすために、モデルごとに VM を分け、Pub/Sub のメッセージ流量で水平にスケールさせる構成にしています。事業要求と物理制約を先に見込んで Pub/Sub の境界を作り込んだおかげで、その後モデルが増え続けても、基本的にこの境界は触らずに済みました。」（瓜生氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"CA_1_全社展開に向けたリアーキテクチャ\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/CA_1_QuanSheZhanKainiXiangketariakitekuchi.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>（2024 年 1 月 全社展開に向けたリアーキテクチャ ）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>アプリケーション層では、異なるアプローチが採られています。2024 年 6 月には「2 週間に 1 つ、新しいモデルを提供する」という目標を設定。常に新しい生成 AI を試せること自体を価値と捉えて過度な共通化を避け、推論ワーカーのテンプレート化やコピーも意図的に許容しました。これにより、次々に登場する新たなモデルに迅速に対応することが可能になりました。瓜生氏は、わずか 3 年で 30 を超えるモデルを導入できたのも、この判断があったからだと言います。</p><p>「ただし緩めたのは実装の部分だけで、アーキテクチャ設計とデータ設計は守りました。何でも緩めたのではなく、緩める粒度を選んだというのが正確な表現だと思います。」（瓜生氏）</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"CA_2_API 連携でもアーキテクチャを変えずに吸収\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/CA_2_API_LianXietemoakitekuchiyaoBianesuni.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>（2024 年 7 月〜 Stable Image Core / Ultra で初の API 連携での生成 AI モデル導入）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>エージェント化によって営業メンバーもクリエイティブ制作の担い手に</b></h3><p>次の転機となったのが AI エージェント機能の追加です。もともと社内では 2024 年 6 月頃から、クリエイティブ制作をエージェンティックにできないかという要望がありました。これを受けて 2025 年 3 月に検証が開始され、翌 4 月には、Google がリリースしたオープンソースのエージェント開発フレームワーク「Agent Development Kit（ADK）」の採用を決定。そのわずか 3 か月後の 2025 年 7 月に、エージェント基盤をリリースしています。</p><p>「ADK を選んだ理由は 3 つあります。オープンソースかつ Google の長期サポートが見込めること、Agent2Agent（A2A）プロトコルというエージェント間連携の仕組みが設計に組み込まれていること、そして Google Cloud のマネージド サービスと親和性が高いことです。」（瓜生氏）</p><p>短期間でのリリースを可能にしたのは、新規構築と既存資産の見極めでした。エージェント基盤そのものは ADK、Cloud Run、PostgreSQL で別アプリケーションとしてゼロから設計したのに対し、画像生成については既存基盤をそのまま呼び出す形にしたのです。現在稼働する主なエージェントは、プロンプトから画像を生成する「画像生成」、画像内のテキストを差し替える「ブラッシュアップ」、LP（ランディング ページ）や参考画像をもとに広告バナーを作る「バナー生成」、アスペクト比に合わせてレイアウトを組み替える「リサイズ」の 4 種類。これらはすでに現場での活用が進んでいます。</p><p>「2026 年 4 月にはエージェント機能を用いて約 1 万枚の広告クリエイティブが生成され、そのうち約 20% にあたる約 2,000 枚が実用候補としてダウンロードされました。従来、生成機能のダウンロード率は 7～8% 程度だったので、予想以上の数字だったと言えるでしょう。利用の拡大は、用途が明確なリサイズ機能に牽引されている面もありますが、バナー生成単体でもダウンロード率は 10% 弱となっています。素材生成が中心だった従来の生成機能より、バナー生成やリサイズなど制作工程をより先まで進められるエージェント機能の方が、ダウンロードにつながりやすい傾向が見られます。」（瓜生氏）</p><p>エージェント機能の提供開始により、営業担当者が自らバナーを制作し、それを叩き台に広告主企業とすり合わせたりするといった事例も生まれ始めました。まだ制作・外注コストの削減効果までは確認できていないものの、生成 AI の利用者をクリエイター以外の職種にも広げられたことは、エージェント化がもたらした大きな成果と言えます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"CA_3_アーキテクチャ全体像\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/CA_3_akitekuchiyaQuanTiXiang.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>（アーキテクチャ全体像）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">より対話的な体験を追求、そして社外への展開も開始</strong></h3>\n<p><span style=\"vertical-align: baseline;\">2 度の大きなアップデートで実用性を高め、サイバーエージェント社内に根付いた AI SCREAM。2025 年 2 月から 2026 年 6 月までの間に生成された成果物は累計 160 万点を超え、制作時間は従来比で約 3 割も短縮されています。瓜生氏はその実績を踏まえたうえで、これから AI SCREAM が目指すのは、エージェントをむやみに増やすことではなく、さらに品質を高め、実際の制作業務のニーズに応えていくことだと説明します。</span></p>\n<p><span style=\"vertical-align: baseline;\">「たとえばクライアント様のロゴや商品画像は原則として改変してはならない要素です。守るべきところはしっかりと守った上で、それ以外の部分を生成 AI で加工し、バナーとして成立させていく取り組みを進めています。」（瓜生氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">そしてもう 1 つ、今後の AI SCREAM の進化の軸として検討されているのが、より対話的な制作体験の実現です。現在のバナー生成は、制作に必要な情報をフォームに入力すると生成結果が返ってくる仕組みで、その後も AI と継続的に対話しながら、制作を進める仕組みにはなっていません。しかし実際の制作現場では、関係者とのやり取りのなかでバナーの方向性を固め、フィードバックを受けて修正を重ねながら仕上げていくプロセスです。瓜生氏は、AI とやり取りを重ねながら仕上げていく体験に近づけることで、AI SCREAM の「次」が見えてくるのではないかと語ります。</span></p>\n<p><span style=\"vertical-align: baseline;\">「エージェントのランタイムやセッション サービスなど、今後実現したい制作体験に必要となる機能は、Google Cloud にすでに揃っていると考えています。今後はこれらを上手に活用しながら、AI SCREAM をより良いものにアップデートしていきたいですね。Google Cloud には今後も、より高精度な画像生成・動画生成モデルの提供を期待しています。」（瓜生氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">サイバーエージェントは、こうして社内で磨き上げてきた AI SCREAM の企業向け提供を、2026 年 8 月に開始しました。AI クリエイティブ BPO 事業の専門チームが、導入から運用定着、制作体制の構築まで一貫して伴走するなど、大規模な SaaS として一気に利用拡大を図るのではなく、顧客とコミュニケーションを取りながら丁寧に展開していく方針を打ち出しています。</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image3_JOQY6Ef.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><a href=\"https://www.cyberagent.co.jp/\"><b>株式会社サイバーエージェント</b></a><br />「21 世紀を代表する会社を創る」をビジョンに掲げ、1998 年に設立。国内最大級のインターネット広告代理事業をはじめ、メディア &amp; IP 事業、ゲーム事業を主軸とした多岐にわたる事業を展開している。従業員数は 8,878 名（連結子会社含む。2026 年 6 月時点）。</p><p><b>インタビュイー<br /></b>AI クリエイティブカンパニー<br />AI SCREAM 開発責任者<br />瓜生 和也 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><hr />\n<p> </p></div>\n<div class=\"block-paragraph\"><p><b>▼ セッション動画を観る<br /></b>本事例のインタビュイーによるセッション動画が公開中です。あわせてご覧ください。<br /><a href=\"https://www.googlecloudevents.com/next-tokyo/v/s-4393289\" target=\"_blank\">【Next Tokyo 26 セッション】SDXL から AI エージェントへ: クリエイティブ AI プラットフォーム 3 年間の設計判断</a></p><p><b>▼他の導入事例記事を読む</b></p><p>その他の Google Cloud 導入事例は<a href=\"https://cloud.google.com/customers?hl=ja&amp;e=48754805\">こちら</a>をご覧ください。</p></div>"
  "4078450df5ce571230127f2987658e7c":
    "id": "4078450df5ce571230127f2987658e7c"
    "title": "「MCP ツールボックス」Java SDK v1.0 のご紹介: 企業向けのエージェント型データアクセス"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/announcing-mcp-toolbox-java-sdk-v10-agentic-data-access-for-the-enterprise/"
    "published": "2026-10-23 11:00:00"
    "fetched": "2026-10-23 15:59:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/announcing-mcp-toolbox-java-sdk-v10-agentic-data-access-for-the-enterprise?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">MCP ツールボックス v1.0 の</span><a href=\"https://medium.com/google-cloud/mcp-toolbox-v1-0-the-open-source-framework-for-secure-agentic-data-access-3c2199546ba8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">画期的な発表</span></a><span style=\"vertical-align: baseline;\">に続き、</span><a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">「MCP ツールボックス」Java SDK </span></a><span style=\"vertical-align: baseline;\">バージョン 1.0 が正式にリリースされたことをお知らせいたします。</span></p>\n<p><span style=\"vertical-align: baseline;\">このリリースにより、世界で最も広く採用されているエンタープライズ向けエコシステムの一つで、最高水準の型安全なエージェント オーケストレーションが実現します。Java の成熟したアーキテクチャは、厳しい要求に対応できるよう構築されており、本番環境でミッションクリティカルな AI エージェントを安全にスケールするために必要な高い同時実行性、厳格なトランザクション整合性、堅牢な状態管理を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、Java SDK v1.0 の新機能について説明し、実際の例を示しながら、独自の実装を始めるためのステップを解説します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">MCP: ユニバーサル インターフェース</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現在、デベロッパーは複雑化する統合のボトルネックに直面しています。</span><span style=\"font-style: italic; vertical-align: baseline;\">N</span><span style=\"vertical-align: baseline;\"> 個の異なる AI モデルと </span><span style=\"font-style: italic; vertical-align: baseline;\">M</span><span style=\"vertical-align: baseline;\"> 個のエンタープライズ データソースがある場合、</span><span style=\"font-style: italic; vertical-align: baseline;\">N × M</span><span style=\"vertical-align: baseline;\"> 個のカスタム接続を構築、保護、維持する必要があります。このように統一されたインテグレーション レイヤがないため、エンジニアリング チームは、断片化されたアドホックなパイプラインが複雑に入り組んだ状態に頼らざるを得ません。その結果、エージェント アーキテクチャのスケーリングはすぐに持続不可能になり、機密性の高いエンタープライズ データベースが深刻なセキュリティ脆弱性、断片化されたアクセス制御、膨大なメンテナンス オーバーヘッドにさらされることになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Model Context Protocol（MCP）が解決する根本的な課題は、複雑に絡み合った独自のインテグレーションを解消することです。MCP は、AI オーケストレーションの「USB Type-C」のようなユニバーサル インターフェースとして機能し、モデルをデータソースから分離します。デベロッパーは、新しいモデルやデータベースごとにカスタムまたはマネージド API 統合コードを記述する代わりに、単一の標準化されたプロトコルに準拠してコードを記述します。このアプローチにより、MCP 準拠のエージェントは、MCP 対応のシステムとセキュアかつ即座にやり取りできます。MCP 接続により、デベロッパーは新しいモデルごとに個別のインテグレーションを構築することなく、エージェントを実世界のシステムに接続できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Java SDK v1.0 の新機能: 本番環境ワークロードに対応</strong></h4>\n<p><span style=\"vertical-align: baseline;\">「MCP ツールボックス」Java SDK の</span><a href=\"https://medium.com/google-cloud/announcing-the-mcp-toolbox-java-sdk-2ed3171bbaa0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">公開ベータ版</span></a><span style=\"vertical-align: baseline;\">を発表した際、Google の目標は、最高水準の型安全なエージェント オーケストレーションをエンタープライズ Java 環境に提供することでした。それ以来、Google はデベロッパーやオープンソースのコントリビューターと協力して API の堅牢化に努めてきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">v1.0 リリースは、エンタープライズ ワークロードに適した、安定した後方互換性を備えた基盤となります。v0.2 リリース以降の新機能と堅牢化された機能は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">トランスポート層の抽象化と </strong><strong style=\"vertical-align: baseline;\">HttpMcpTransport</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">HttpMcpTransport</code><span style=\"vertical-align: baseline;\"> とともに、クリーンなトランスポート層の抽象化を導入しました。この機能により、コア プロトコル ロジックが基盤となる HTTP クライアントから分離されるため、ネットワーク実装の入れ替えや接続プールのカスタマイズが容易になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クライアント認証の疎結合化</strong><span style=\"vertical-align: baseline;\">: 企業のセキュリティ コンプライアンスを簡素化するため、</span><code style=\"vertical-align: baseline;\">CredentialsProvider</code><span style=\"vertical-align: baseline;\"> クラスと </span><code style=\"vertical-align: baseline;\">AuthMethods</code><span style=\"vertical-align: baseline;\"> クラスを使用してクライアント認証を切り離しました。認証情報はリクエストごとに非同期で解決されるため、チームはトークンを動的に更新したり、独自のトークンソースをプラグインしたりできます（ADC 経由の Google OIDC は標準で組み込まれており、それ以外は 1 つのメソッドを実装するだけのインターフェースです）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デフォルト パラメータのサポート</strong><span style=\"vertical-align: baseline;\">: ツール パラメータのデフォルト値をネイティブにサポートすることで、プロンプトのペイロード サイズを削減し、エージェントの信頼性を高めます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">バインドされたパラメータのプルーニング</strong><span style=\"vertical-align: baseline;\">: サーバーサイドでバインドされた機密性の高いパラメータ（</span><code style=\"vertical-align: baseline;\">tenant_id</code><span style=\"vertical-align: baseline;\"> など）が、公開されたツール定義から自動的に削除されるようになり、LLM による操作を防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">バージョン選択とセッション トラッキング</strong><span style=\"vertical-align: baseline;\">: 標準化された MCP バージョン選択と堅牢なセッション トラッキングにより、一貫したプロトコル ネゴシエーションと会話状態のライフサイクルを実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">HTTP 認証情報の漏洩に関する警告</strong><span style=\"vertical-align: baseline;\">: 認証情報が平文の HTTP 接続で送信されようとしているときに、実行時に警告を発する組み込みの検出機能を追加しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">汎用クライアント ヘッダーのマップ</strong><span style=\"vertical-align: baseline;\">: カスタムの企業プロキシ ヘッダー、トランザクション トレース ID、相関メタデータを、すべての送信リクエストに簡単に追加できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Java SDK v1.0 を使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">「MCP ツールボックス」Java SDK は、企業チームがスムーズに利用できるように設計されています。</span><code style=\"vertical-align: baseline;\">pom.xml</code><span style=\"vertical-align: baseline;\"> に次の依存関係を追加するだけで利用を開始できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;&lt;dependency&gt;\\r\\n    &lt;groupId&gt;com.google.cloud.mcp&lt;/groupId&gt;\\r\\n    &lt;artifactId&gt;mcp-toolbox-sdk-java&lt;/artifactId&gt;\\r\\n    &lt;version&gt;1.0.0&lt;/version&gt;\\r\\n&lt;/dependency&gt;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c31d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">実際の例: 自律型交通コンシェルジュ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Java SDK を AlloyDB と組み合わせて活用する例として、企業のユースケースを見てみましょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">架空の都市間バス交通ネットワークである </span><strong style=\"vertical-align: baseline;\">Cymbal Transit</strong><span style=\"vertical-align: baseline;\"> をご紹介します。利用者は、旅行を計画するのに、ネストされたプルダウン メニューを何度もクリックするような操作は望んでいません。次のように質問したいと考えています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「明日の朝、ニューヨークからボストンまで移動する必要がある。ゴールデン レトリバーを連れて行くことはできる？連れて行ける場合は、最も早い便を予約して。」</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントがこの質問に答えるには、非構造化データ（ペットに関するポリシー）と構造化データ（運行スケジュール、座席の空き状況）を相互参照し、会話のコンテキストを維持しながらトランザクションを実行（予約）する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">基盤: ネイティブ エンベディングを備えた AlloyDB スキーマ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この実装には、リレーショナル データと高次元ベクトルをネイティブに処理できる AlloyDB を使用しました。そして、次のステートメントを使用してデータベース テーブルを作成しました。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Enable necessary extensions for semantic search and embeddings\\r\\nCREATE EXTENSION IF NOT EXISTS vector;\\r\\nCREATE EXTENSION IF NOT EXISTS google_ml_integration;\\r\\n\\r\\n-- Table 1: Transit Policies (Unstructured Data for RAG)\\r\\nCREATE TABLE transit_policies (\\r\\n    policy_id SERIAL PRIMARY KEY,\\r\\n    category VARCHAR(50),\\r\\n    policy_text TEXT,\\r\\n    policy_embedding vector(768)\\r\\n);\\r\\n\\r\\n-- Table 2: Intercity Bus Schedules (Structured Data)\\r\\nCREATE TABLE bus_schedules (\\r\\n    trip_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\\r\\n    origin_city VARCHAR(100),\\r\\n    destination_city VARCHAR(100),\\r\\n    departure_time TIMESTAMP,\\r\\n    arrival_time TIMESTAMP,\\r\\n    available_seats INT DEFAULT 50,\\r\\n    ticket_price DECIMAL(6,2)\\r\\n);\\r\\n\\r\\n-- Table 3: Booking Ledger (Transactional Action Data)\\r\\nCREATE TABLE bookings (\\r\\n    booking_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\\r\\n    trip_id UUID REFERENCES bus_schedules(trip_id),\\r\\n    passenger_id VARCHAR(100),\\r\\n    status VARCHAR(20) DEFAULT &#x27;CONFIRMED&#x27;,\\r\\n    booking_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;lang-sql&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c0c50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">インテントと SQL のマッピング: </strong><code style=\"vertical-align: baseline;\">tools.yaml</code></h4>\n<p><span style=\"vertical-align: baseline;\">MCP ツールボックスを使用すると、カスタムツールをセキュアに定義できます。LLM にデータベースへの直接アクセスを許可するのではなく、</span><code style=\"vertical-align: baseline;\">tools.yaml</code><span style=\"vertical-align: baseline;\"> の設定によって、自然言語のインテントをパラメータ化された安全なクエリに直接マッピングします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kind: source\\r\\nname: alloydb\\r\\ntype: alloydb-postgres\\r\\nproject: my-project\\r\\nregion: us-central1\\r\\ncluster: my-cluster\\r\\ninstance: my-instance\\r\\ndatabase: postgres\\r\\n---\\r\\nkind: tool\\r\\nname: query-schedules\\r\\ntype: postgres-sql\\r\\nsource: alloydb\\r\\ndescription: Find available bus schedules between cities.\\r\\nparameters:\\r\\n  - name: origin\\r\\n    type: string\\r\\n    description: The departure city name.\\r\\n  - name: destination\\r\\n    type: string\\r\\n    description: The arrival city name.\\r\\n  - name: limit\\r\\n    type: integer\\r\\n    description: Maximum number of schedules to return.\\r\\n    default: 5\\r\\nstatement: |\\r\\n  SELECT CAST(trip_id AS TEXT) AS trip_id, departure_time, ticket_price\\r\\n  FROM bus_schedules\\r\\n  WHERE lower(origin_city) = lower($1) AND lower(destination_city) = lower($2)\\r\\n  ORDER BY departure_time ASC\\r\\n  LIMIT $3&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c3390&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">完全な YAML ファイルについては、</span><code style=\"vertical-align: baseline;\">mcp-toolbox-sdk-java</code><span style=\"vertical-align: baseline;\"> リポジトリの</span><a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java/blob/main/demo-applications/cymbal-transit/tools.yaml\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><code style=\"text-decoration: underline; vertical-align: baseline;\">tools.yaml</code></a><span style=\"vertical-align: baseline;\"> ファイルをご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Spring Boot のステートフル エージェント アーキテクチャ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ アプリケーションで会話型 AI を構築するうえで最も難しいのは、状態の管理です。ユーザーが「空席がある便の出発時間は？」と尋ねた後、「午前 8 時の便を予約して」と言った場合、エージェントはターンをまたいで前のコンテキストを覚えておく必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">「MCP ツールボックス」Java SDK を Spring Boot および LangChain4j と併せて使用すると、HTTP セッションで会話のメモリを適切に維持し、エージェントを次の 2 つの宣言型コンポーネントに明確に分離できます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">HTTP セッションを介してプロンプト、ツール、会話のメモリを管理する宣言型エージェント インターフェース。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェントのリクエストを MCP ツールボックス サーバーに直接ルーティングするツール実行サービス。</span></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;interface TransitAgent {\\r\\n    @SystemMessage({\\r\\n        &quot;You are the Cymbal Transit Concierge.&quot;,\\r\\n        &quot;Use the \\&#x27;querySchedules\\&#x27; tool for finding schedules.&quot;,\\r\\n        &quot;Use \\&#x27;bookTicket\\&#x27; to execute transactions.&quot;,\\r\\n        &quot;Use \\&#x27;searchPolicies\\&#x27; to look up luggage and pet rules.&quot;\\r\\n    })\\r\\n    String chat(@MemoryId String sessionId, @UserMessage String userMessage);\\r\\n}\\r\\n\\r\\n@Service\\r\\nclass TransitAgentTools {\\r\\n    // These methods automatically invoke our MCP Toolbox server!\\r\\n    @Tool(&quot;Query specific schedules between an origin and destination city.&quot;)\\r\\n    public String querySchedules(String origin, String destination) { ... }\\r\\n\\r\\n    @Tool(&quot;Book a ticket for a passenger.&quot;)\\r\\n    public String bookTicket(String tripId, String passengerName) { ... }\\r\\n\\r\\n    @Tool(&quot;Search transit policies for luggage and pet rules.&quot;)\\r\\n    public String searchPolicies(String query) { ... }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c3f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">@MemoryId</code><span style=\"vertical-align: baseline;\"> アノテーションがセッション トラッキングを抽象化している点に注目してください。これにより、Spring Boot は会話のコンテキストをユーザーの HTTP セッションに自動的に関連付けることができます。その一方で、LangChain4j と MCP ツールボックスが舞台裏でスキーマ変換とツール ルーティングを処理するため、手動で if/else 文によるインテント解析を書く必要はありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">「MCP ツールボックス」Java SDK と LangChain4j を組み合わせることで、関心の分離を明確にし、手間をかけずに状態を管理できるようになります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ボイラープレート不要のセッション管理</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">@MemoryId String sessionId</code><span style=\"vertical-align: baseline;\"> パラメータにより、会話履歴がユーザーの HTTP セッションに直接バインドされます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">宣言型エージェント コントラクト</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">TransitAgent</code><span style=\"vertical-align: baseline;\"> インターフェースは、複雑なプロンプト テンプレートを使用せずに、モデルのペルソナとシステム指示を定義します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">型安全なツールの実行</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">TransitAgentTools</code><span style=\"vertical-align: baseline;\"> Spring サービスが、リモート MCP データベース ツールをネイティブ Java メソッドとしてラップします。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">このアーキテクチャにより、エージェントのモジュール性を保つことができます。インターフェースでプロンプト ガイダンスを改良し、ユーザー セッションを自動的に管理しながら、密結合させることなく MCP ツールボックスを介して安セキュアなデータベース クエリを実行できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">すべてをつなぎ合わせる: Java v1.0 におけるツールのリスト表示、呼び出し、実行</strong></h4>\n<p><span style=\"vertical-align: baseline;\">次に、</span><code style=\"vertical-align: baseline;\">TransitAgentTools</code><span style=\"vertical-align: baseline;\"> インターフェースの内部を見てみましょう。Spring </span><code style=\"vertical-align: baseline;\">@Service</code><span style=\"vertical-align: baseline;\"> の LangChain4j </span><code style=\"vertical-align: baseline;\">@Tool</code><span style=\"vertical-align: baseline;\"> メソッド内では、MCP ツールボックス Java SDK が、Java サービス メソッドを </span><code style=\"vertical-align: baseline;\">tools.yaml</code><span style=\"vertical-align: baseline;\"> ファイルで定義された MCP ツールに橋渡しするという複雑な処理を肩代わりします。型安全なコードを数行記述するだけで、新しい v1.0 の疎結合な認証情報とヘッダーの抽象化を使用してクライアントを初期化できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// 1. Initialize the Client with Decoupled Auth and Custom Headers (v1.0)\\r\\nString serviceUrl = &quot;https://toolbox-my-project-uc.a.run.app/mcp&quot;;\\r\\nMcpToolboxClient mcpClient = McpToolboxClient.builder()\\r\\n    .baseUrl(serviceUrl)\\r\\n    .credentialsProvider(new GoogleCredentialsProvider(serviceUrl)) // Decoupled OIDC credentials\\r\\n    .headers(Map.of( // Generic client headers\\r\\n        &quot;X-Correlation-ID&quot;, &quot;enterprise-session-abc123&quot;,\\r\\n        &quot;X-Client-Platform&quot;, &quot;Spring-Boot&quot;\\r\\n    ))\\r\\n    .build();\\r\\n\\r\\n// 2. Listing Discoverable Tools\\r\\nmcpClient.listTools().thenAccept(tools -&gt; {\\r\\n    System.out.println(&quot;Successfully discovered &quot; + tools.size() + &quot; tools.&quot;);\\r\\n});\\r\\n\\r\\n// 3. Invoking a Tool (Read-Only Data with Default Parameter Support)\\r\\n// &quot;limit&quot; is omitted: the SDK fills it from the default in the tool definition\\r\\nString schedules = mcpClient.loadTool(&quot;query-schedules&quot;)\\r\\n    .thenCompose(tool -&gt; tool.execute(Map.of(\\r\\n        &quot;origin&quot;, &quot;New York&quot;,\\r\\n        &quot;destination&quot;, &quot;Boston&quot;)))\\r\\n    .join().text();\\r\\n\\r\\n// 4. Executing a Transactional Tool (Using Bound Parameters)\\r\\nAuthTokenGetter toolAuthGetter = () -&gt; CompletableFuture.completedFuture(myIdToken);\\r\\n\\r\\nString bookingConfirmation = mcpClient.loadTool(&quot;book-ticket&quot;, Map.of(&quot;google_auth&quot;, toolAuthGetter))\\r\\n    // Bind the authenticated user context securely. bindParam returns a new immutable\\r\\n    // Tool, and the bound parameter is pruned from the definition exposed to the LLM!\\r\\n    .thenCompose(tool -&gt; tool.bindParam(&quot;passenger_name&quot;, &quot;Jane Doe&quot;)\\r\\n        // Execute the mutable transaction\\r\\n        .execute(Map.of(&quot;trip_id&quot;, &quot;123e4567-e89b-12d3-a456-426614174000&quot;)))\\r\\n    .join().text();&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c1d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">セキュア バイ デフォルト: 認証とデプロイ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI エージェントを本番環境に移行するには、堅牢な認証情報処理と、需要に応じてスケールするインフラストラクチャが必要です。さまざまな環境で認証情報の安全性を確保し、Cloud Run に独立してデプロイする方法を見ていきましょう。</span></p>\n<p><strong style=\"vertical-align: baseline;\">アプリケーションのデフォルト認証情報（ADC）と安全性</strong></p>\n<p><code style=\"vertical-align: baseline;\">GoogleCredentialsProvider</code><span style=\"vertical-align: baseline;\"> サービスを使用すると、Java アプリはアプリケーションのデフォルト認証情報（ADC）を介して、実行環境（ローカルまたは Google Cloud）から安全な ID を継承します。ハードコードされた鍵は不要で、OIDC トークンがオーディエンスごとにバックグラウンドで生成され、キャッシュに保存されます。さらに、v1.0 では HTTP 認証情報の漏洩警告が提供されます。これは、認証情報が平文の HTTP 接続で送信されようとしていることを自動的に検出し、HTTPS に切り替えるよう指示するランタイム警告を発します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">フリートを Cloud Run にデプロイ</strong></p>\n<p><span style=\"vertical-align: baseline;\">MCP ツールボックスと Spring Boot エージェントは完全に疎結合化されているため、Google Cloud Run で独立してスケールし、高い同時実行性とステートフルな会話の要件に対応できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Run でツールボックスをセットアップして構成するには、オープンソースのデータベース向け MCP ツールボックスをダウンロードしてから、</span><a href=\"https://mcp-toolbox.dev/documentation/deploy-to/cloud-run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">デプロイガイド</span></a><span style=\"vertical-align: baseline;\">に沿って操作します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">「MCP ツールボックス」Java SDK v1.0 を使用すると、企業の Java チームは Spring Boot と LangChain4j エージェントをツールボックス サーバーに接続し、そこから AlloyDB やその他のサポートされているデータソースに接続できます。ツールボックスを使用すると、引数は JVM から送信される前にツール定義に照らして検証され、認証は疎結合化され、カスタム ヘッダーがすべての送信リクエストに添付されます。</span><strong style=\"vertical-align: baseline;\">導入手順</strong><span style=\"vertical-align: baseline;\">は次のとおりです。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ステップ 1: 依存関係を追加する</strong></p>\n<p><span style=\"vertical-align: baseline;\">SDK を使用して開発を始めるには、Maven プロジェクトの </span><code style=\"vertical-align: baseline;\">pom.xml</code><span style=\"vertical-align: baseline;\"> ファイルに次の依存関係を追加します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;&lt;dependency&gt;\\r\\n        &lt;groupId&gt;com.google.cloud.mcp&lt;/groupId&gt;\\r\\n        &lt;artifactId&gt;mcp-toolbox-sdk-java&lt;/artifactId&gt;\\r\\n        &lt;version&gt;1.0.0&lt;/version&gt;\\r\\n &lt;!-- {x-version-update:mcp-toolbox-sdk-java:current} --&gt;\\r\\n    &lt;/dependency&gt;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c03d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">ステップ 2: リソースとデモを確認する</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GitHub リポジトリ</strong><span style=\"vertical-align: baseline;\">:</span><a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">データベース向け MCP ツールボックスを操作するための Java SDK</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">公式ドキュメント</strong><span style=\"vertical-align: baseline;\">:</span><a href=\"https://mcp-toolbox.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases（データベース向け MCP ツールボックス）</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">デモ アプリケーション</strong><span style=\"vertical-align: baseline;\">:「MCP ツールボックス」Java SDK V1.0 の最新版を体験するには、サンプル アプリケーションである </span><a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java/tree/main/demo-applications/cymbal-transit\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cymbal Transit プロジェクト</span></a><span style=\"vertical-align: baseline;\">をお試しください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Gradle の実装</strong></p>\n<p><span style=\"vertical-align: baseline;\">チームが Maven ではなく Gradle を使用している場合は、この依存関係を書き換える必要がある点にご注意ください。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;implementation &#x27;com.google.cloud.mcp:mcp-toolbox-sdk-java:1.0.0&#x27;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1c412c2b90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">バージョンの自動追跡</strong></p>\n<p><span style=\"vertical-align: baseline;\">この設定を自動化された内部リポジトリにコピーする場合は、XML コメント &lt;!-- {x-version-update...} --&gt; はそのままにします。これは、リリース マネージャーのデプロイ スクリプトがバージョンを自動的に更新するために必要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">最新のエージェント ツールとサーバーを、安定した「MCP ツールボックス」Java SDK を使用してエンタープライズ Java アプリケーションに統合できるようになりました。今すぐお試しください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、スタッフ デベロッパー アドボケイト</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Abirami Sukumaran</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">共同執筆者:</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google、戦略的クラウド エンジニア </span><strong style=\"font-style: italic; vertical-align: baseline;\">Stenal Jolly</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google、ソフトウェア エンジニア </span><strong style=\"font-style: italic; vertical-align: baseline;\">Anubhav Dhawan</strong></p></div>"
  "7af27756827a8406866230d5ef043d2d":
    "id": "7af27756827a8406866230d5ef043d2d"
    "title": "Gemini のイノベーションで、ボーダーレス Lakehouse をエージェントの時代へ導く"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/borderless-lakehouse-integrates-with-gemini/"
    "published": "2026-10-23 10:00:00"
    "fetched": "2026-10-23 15:59:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-integrates-with-gemini?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業が AI の利用を試験運用的な chatbot から自律型エージェントへと移行するにつれ、チームは重大なボトルネックに直面しています。それは、複数のクラウド、SaaS プラットフォーム、オンプレミス システムに分散したデータへのアクセスと、そのデータに基づく推論です。AI エージェントを真の「アクション システム」に変えるには、データ移動に伴うセキュリティ リスクを負うことなく、ペタバイト規模の推論を処理できる基盤が必要です。先週開催された </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini at Work</span></a><span style=\"vertical-align: baseline;\"> イベントでは、Gemini がビジネス ワークフローの変革にどのように役立つかをご紹介しました。皆様がエンタープライズ データを活用してエージェントを強化できるよう、Gemini とボーダーレス Lakehouse の新たな連携について詳しく解説し、データ資産全体にわたって機能するエージェントの構築、保護、スケーリングを支援します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini を通じて Google Cloud の外部にあるデータにアクセスする</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ボーダーレス Lakehouse の真価は、Gemini をフロントドアとして組織を変革するために構築するエージェントを通じて発揮されます。Gemini との新たな連携により、事前構成されたデータやボーダーレス Lakehouse に保存されたデータを、Gemini に直接取り込んで活用できるようになりました。現在プレビュー版として提供されているこの機能により、Gemini から直接、Lakehouse カタログ連携を通じて Databricks Unity Catalog や Snowflake Horizon などの新しいデータソースへのアクセスを設定できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これで、ビジネス ユーザーは自然言語を使ってクラウド全体に分散して存在するレコードをクエリできるようになり、AI エージェントは同じデータを根拠として推論を行い、コードを生成できるようになりました。これらはすべて、データを移動することなく実行できます。ボーダーレス Lakehouse 全体にわたり AI エージェントに直接コンテキストを提供することで、重要な情報へのアクセスを簡素化しながら、組織の AI 導入を加速させることができます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/image1_HJqokGb.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>ビジネス ユーザーが呼び出した Gemini エージェントは、BigQuery と Databricks Unity Catalog に格納されているデータにアクセスし、包括的なレポートを提供するとともに、自然言語を使用して分析情報を取得できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">ボーダーレス Lakehouse の進化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このたび、Gemini との新しいネイティブ連携に加えて、ボーダーレス Lakehouse でデータ基盤を強化するために今年初めに導入したいくつかの機能の一般提供が開始されたことをお知らせします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS および Azure 向けの Cross-Cloud Interconnect とクロスクラウド キャッシュのサポート</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery での Apache Iceberg V3 仕様のサポート</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery と Managed Service for Apache Spark の両方における Apache Iceberg テーブルの読み取り / 書き込みの相互運用性</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Lakehouse ランタイム連携を使用した、AWS Glue、Databricks Unity Catalog、Snowflake Horizon カタログとの双方向キャッシュ</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Knowledge Catalog とのインテグレーション</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Salesforce、SAP、Workday、そして新たに Confluent Tableflow とのゼロコピー データ統合</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Dataflow を使用した Lakehouse コンソール経由での Databricks Delta Lake アセットの同期</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">では、詳しく見ていきましょう。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ペタバイト規模のパフォーマンスと推論</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントのコンテキスト ウィンドウは通常、一度に取り込めるデータ量が数百キロバイトに制限されていますが、エンタープライズ ワークフローでは、複数のクラウドにわたりペタバイト規模のデータを結合することがあります。製品データや顧客データといったさまざまなソースのデータを、CRM クラウドやウェアハウスのテレメトリーと結合する必要があるエージェント ネイティブなデータ プラットフォームは、大規模なデータ処理が可能でなければなりません。MCP を使用してこれを行う場合、コンテキスト ウィンドウとペイロード サイズの制約により、処理の規模がメガバイト単位に制限されます。ボーダーレス Lakehouse は、データと AI スタックをあらゆるレイヤで連携させることで、エンタープライズ グレードのスケーラビリティを提供します。これにより、エージェントはペタバイト規模のデータをローカルに保存されている場合と同様のパフォーマンスで推論できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ネットワーキング レイヤでは、</span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/cci-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cross-Cloud Interconnect</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-cross-cloud-data-access\"><span style=\"text-decoration: underline; vertical-align: baseline;\">クロスクラウド キャッシュ</span></a><span style=\"vertical-align: baseline;\">により、AWS と Azure への高スループット、低レイテンシのパスが提供され、変動する外向きデータ送信料金が不要になります。エージェントが Amazon や Azure Data Lake Storage の Iceberg テーブルを BigQuery のデータと結合すると、スキャンするキャッシュ保存されていないバイトがすべてクラウドの境界を越えるため、ネットワークにより処理速度が決まります。Cross-Cloud Interconnect は、Google Cloud と AWS または Azure の間に、1 接続あたり 10 Gbps または 100 Gbps の専用プライベート接続を Lakehouse に提供します。Lakehouse のクエリは、パブリック インターネットではなく、この接続を介して送信されるため、低レイテンシの予測可能な状態が維持されます。また、クロスクラウド キャッシュは、Google Cloud 内から繰り返し行われる読み取り処理に対応するため、エージェントは他のクラウドのデータを移行することなく直接クエリできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ボーダーレス Lakehouse には、Iceberg メタデータをクエリエンジンに統合するための重要な最適化がいくつか盛り込まれています。BigQuery で、バイナリ削除ベクトルや並べ替え順など、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/use-iceberg-v3-binary-deletion-vectors\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Iceberg V3 仕様</span></a><span style=\"vertical-align: baseline;\">がサポートされるようになりました。これらの機能により、データファイル全体を書き換える必要がなくなるため、エンジンは行レベルの更新や削除をより効率的に処理できるようになります。また、BigQuery の実行エンジンをアップグレードし、新しい FlatBuffers ベースの Parquet リーダーと並列化された I/O を導入しました。これにより、CPU オーバーヘッドやシリアル化によるボトルネックを軽減し、オープン フォーマットとネイティブ ストレージのパフォーマンスの差を縮めました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは、エージェントのワークロードをサポートするように設計されたクエリ エンジンの最近のパフォーマンス イノベーションに基づいています。エージェントのワークロードは一斉に大量発生することが多く、小規模なクエリを迅速かつ費用対効果の高い方法で処理することが求められます。</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/bigquery-performance-optimizations?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery の流動的なスケーリングと履歴ベースの最適化</span></a><span style=\"vertical-align: baseline;\">により、Apache Iceberg とのオープン性を維持しながら、スケーラブルかつ効率的なエージェント ワークロードを実行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">一方、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> と </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> の両方で Apache Iceberg テーブルの読み取り / 書き込みの相互運用性が確保されているため、すべてのデータチームが Google Cloud Storage 内の同じ Iceberg テーブルを簡単に利用できます。この垂直方向に最適化されたスタックは、BigQuery と </span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/introducing-lightning-engine-for-apache-spark?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lightning Engine</span></a><span style=\"vertical-align: baseline;\"> の力を活用してデータを移動することなく有効化し、エージェントの高速化と費用対効果の向上を実現します。Lakehouse の分析能力をさらに拡張するため、BigQuery の Iceberg 向けグラフ機能のサポートにより、サプライ チェーンなどの関係ネットワークをオープン テーブル データセットで直接分析できるようになりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント向けの包括的なコンテキストとデータアクセス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI エージェントの能力は、アクセスできるコンテキストに左右されます。ハルシネーションを防止し、メタデータ レイヤの精度を向上させるために、ボーダーレス Lakehouse は </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse ランタイム カタログ</span></a><span style=\"vertical-align: baseline;\">を使用してエンタープライズ データを統合します。Apache Iceberg REST カタログをベースに、AWS Glue、Databricks Unity Catalog、Snowflake Horizon Catalog との双方向のカタログ連携を実現します。Lakehouse ランタイム カタログには、新たな標準の Hive Metastore 互換エンドポイントも含まれており、Apache Spark、Trino、Presto などのエンジンがアーキテクチャを変更することなくメタデータを参照できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ボーダーレス Lakehouse は、分散したデータアセットを自動的にインデックス化する </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> とも直接連携しており、エージェントがエンタープライズ コーパス全体（Cloud Storage 内の非構造化データを含む）を推論するために必要な、正確なビジネス メタデータとセマンティック定義を提供します。これにより、エージェントはトークン費用を抑えながら、正確性を確保するのに十分なコンテキストを得られるため、インテリジェントで持続可能なエージェント活用戦略を策定できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ボーダーレス Lakehouse は、Salesforce、SAP、Workday などの SaaS アプリケーションとのゼロコピー データ統合を実現し、より広範なパートナー エコシステムと連携することにより、Knowledge Catalog を通じてエンタープライズ データをキャプチャし、エージェントのための単一のコンテキスト エンジンとして機能します。このたび Google は、パートナー エコシステムを拡大し、Confluent Tableflow との新たな連携機能の一般提供を開始しました。これにより、Lakehouse ランタイム カタログと同期され、生成された Iceberg テーブルが BigQuery に直接表示されるようになります。コピーや追加の ETL は不要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">最後に、Databricks 中心のリポジトリを持つ組織は、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/import-delta-lake-tables\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse コンソール</span></a><span style=\"vertical-align: baseline;\">経由で Dataflow を使用して、Delta Lake アセットを Lakehouse に簡単にインポート、変換、同期できるようになりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">モダナイゼーションを容易に</strong></h4>\n<p><span style=\"vertical-align: baseline;\">2025 年初頭以降、Apache Iceberg の利用は 3 倍以上に増加しており、Google Cloud のボーダーレス Lakehouse を使用してデータ基盤を構築している企業は、大きな成果を上げています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/customers/etsy-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Etsy:</span></a><span style=\"vertical-align: baseline;\"> ボーダーレス Lakehouse を活用して、3 ペタバイトのデータを統合し、データを移動させずに結合することで、パイプライン クエリを 60% 高速化しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.youtube.com/watch?v=Er6iwuxcC-8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Commerzbank:</span></a><span style=\"vertical-align: baseline;\"> 分散している生データを、ガバナンス管理されたエージェントがすぐにアクセスできるデータへと変換しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://hightouch.com/blog/introducing-hightouch-for-google-cloud-cross-cloud-lakehouse\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hightouch:</span></a><span style=\"vertical-align: baseline;\"> ボーダーレス Lakehouse と直接連携しているため、チームはオープンな Iceberg Lakehouse 上で直接マーケティング活動を強化し、Google Cloud エコシステム全体でそのデータを活用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/customers/target\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Roundel:</span></a><span style=\"vertical-align: baseline;\"> ボーダーレス Lakehouse を活用して Target Product Ads の技術スタックを徹底的にモダナイズし、データの取り込み、処理、測定のパイプラインを完全に再構築しました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">組織でボーダーレス Lakehouse に移行する準備ができているなら、そのプロセスは難しくありません。現在、従来の Dataproc Metastore をご利用中の組織向けに、サーバーレス Lakehouse ランタイム カタログへの自動化されたダウンタイム ゼロの移行パスが用意されています。これにより、既存のスキーマやリネージを維持したまま、ボーダーレス Lakehouse の AI 対応機能を活用できるようになります。その結果、インフラストラクチャの管理から解放され、エージェントの活用に注力できるようになります。</span></p>\n<p><a href=\"https://codelabs.developers.google.com/next26/multicloud-lakehouse#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレス Lakehouse 構築の Codelab</span></a><span style=\"vertical-align: baseline;\"> を今すぐお試しください。詳細については、</span><a href=\"https://cloud.google.com/solutions/data-lakehouse/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google のウェブサイト</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネジメント担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Gaurav Saxena</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">エンジニアリング担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ahmet Altay</strong></p></div>"
