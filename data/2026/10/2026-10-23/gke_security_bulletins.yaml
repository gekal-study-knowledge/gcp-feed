    "id": "9721f1e5c1a9e13c7ed1fb28d7638ba8"
    "title": "GCP-2026-071"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-071"
    "published": "2026-10-23 09:00:00"
    "fetched": "2026-10-24 09:16:12"
    "summary": "<p><strong>Published: </strong>2026-10-23<br /> <strong>Reference:</strong> <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-111943\">CVE-2026-111943</a></p><table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>Multiple eMudhra (<code dir=\"ltr\">emSign</code>) subordinate Certificate Authority (CA) private keys were compromised (CVE-2026-111943). Unpatched TLS clients and container runtimes that trust these authorities are vulnerable to active network Man-in-the-Middle (MitM) interception and traffic spoofing on external TLS connections. Internal GKE cluster control-plane and node mutual TLS (mTLS) communication is unaffected because it uses an isolated per-cluster private PKI. However, external TLS connections from node daemons (such as <code dir=\"ltr\">containerd</code> pulling images from external registries) or control-plane components (such as <code dir=\"ltr\">kube-apiserver</code> calling external HTTPS webhooks without an explicit <code dir=\"ltr\">caBundle</code>) rely on the system or Go runtime root CA store. Most of these connections occur to registries or endpoints that are also on Google Cloud traveling over <a href=\"https://docs.cloud.google.com/docs/security/encryption-in-transit#encryption-transit-with-networks\">encrypted links</a> that are not at risk of a MitM attack. All currently supported GKE Standard and GKE Autopilot versions running Container-Optimized OS or Ubuntu node images are <strong>impacted</strong>. Node images and GKE system containers are being updated to distrust the compromised CAs. Customer application containers do <strong>not</strong> inherit the host node's root CA store and must be updated independently.</p>\n<h4 id=\"what-should-i-do\" tabindex=\"-1\">What should I do?</h4>\n<p>The following versions of GKE have been updated to fix this vulnerability in Container-Optimized OS. For security purposes, even if you have node auto-upgrade enabled, we recommend that you <a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/upgrading-a-container-cluster\">manually upgrade</a> your cluster and Container-Optimized OS node pools to one of the following GKE versions or later:</p>\n<ul>\n<li><code dir=\"ltr\">1.36.5-gke.1817000</code></li>\n<li><code dir=\"ltr\">1.35.9-gke.1390000</code></li>\n<li><code dir=\"ltr\">1.34.12-gke.1508000</code></li>\n<li><code dir=\"ltr\">1.33.13-gke.2152000</code></li>\n<li><code dir=\"ltr\">1.32.13-gke.2883000</code></li>\n<li><code dir=\"ltr\">1.31.14-gke.3093000</code></li>\n</ul>\n<p><em>Note: We'll update this bulletin when Ubuntu patch versions are available.</em></p>\n<p>If you don't see these versions in the Google Cloud console, use the <code dir=\"ltr\">gcloud container clusters upgrade</code> command to specify the versions and upgrade your node pools. Once patch versions are available in the Rapid channel, they can be installed on other channels, see <a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/release-channels#newer-patch-versions\">run patch versions from a newer channel</a>.</p>\n<p>If you are unable to patch, you can implement the following mitigations:</p>\n<ul>\n<li><strong>Enforce container image pull integrity:</strong> Use image digest pinning (<code dir=\"ltr\">@sha256:...</code>) in Pod specifications or enforce Binary Authorization so that a network MitM cannot substitute untrusted container images during registry pulls.</li>\n<li><strong>Verify admission webhook <code dir=\"ltr\">caBundle</code> configurations:</strong> When <code dir=\"ltr\">clientConfig.caBundle</code> is omitted on a <code dir=\"ltr\">ValidatingWebhookConfiguration</code> or <code dir=\"ltr\">MutatingWebhookConfiguration</code>, <code dir=\"ltr\">kube-apiserver</code> falls back to the system WebPKI root store. Ensure all external HTTPS webhooks specify an explicit <code dir=\"ltr\">caBundle</code>. You can check for webhooks with an empty <code dir=\"ltr\">caBundle</code> by running:\n          <div></div><pre class=\"devsite-click-to-copy wrap-code\" dir=\"ltr\">kubectl<span class=\"devsite-syntax-w\"> </span>get<span class=\"devsite-syntax-w\"> </span>validatingwebhookconfigurations,mutatingwebhookconfigurations<span class=\"devsite-syntax-w\"> </span>-o<span class=\"devsite-syntax-w\"> </span>go-template<span class=\"devsite-syntax-o\">=</span><span class=\"devsite-syntax-s1\">'{{range $item := .items}}{{range .webhooks}}{{if not .clientConfig.caBundle}}WARNING (No caBundle): {{$item.kind}}/{{$item.metadata.name}} -&gt; {{.name}}{{\"\\n\"}}{{end}}{{end}}{{end}}'</span></pre>\n</li>\n<li><strong>Apply live-node OS mitigation (GKE Standard only):</strong> For existing Container-Optimized OS worker nodes awaiting patched OS images, you can deploy the privileged <a href=\"https://github.com/GoogleCloudPlatform/k8s-node-tools/tree/master/cos-ca-cert-mitigation\">Container-Optimized OS CA certificate mitigation DaemonSet</a> to remove the compromised roots and restart node daemons in place. <em>(Note: Because this DaemonSet requires privileged host access, it is not supported on GKE Autopilot.)</em>\n        A similar approach can be followed for Ubuntu by using <a href=\"https://ubuntu.com/blog/emudhra-ca-compromise-fixes-available\">Canonical's upgrade advice</a>.</li>\n<li><strong>Rebuild and redeploy customer container workloads:</strong> Because containers bundle their own OS root certificates (<code dir=\"ltr\">/etc/ssl/certs</code>) and language runtimes, upgrading GKE nodes does not patch your application containers. Rebuild your container images using patched base images.</li>\n</ul>\n</td>\n<td>High</td>\n</tr>\n</tbody>\n</table>"
