"overview": |
  この日は 2 件で、ストレージのデータ完全性の強化と、分析基盤の移行事例でした。まず、Cloud Storage の端から端までのチェックサムが、すべての Cloud Storage SDK で既定で有効になりました。ディスクを使うストレージシステムと同じく、ビットはアプリケーションからディスクまでの道中のどこでも反転しうるという前提のもと、Cloud Storage はもともとアップロードするオブジェクトデータのチェックサムをクライアントから受け取り、ダウンロードするデータのチェックサムを返す仕組みを持ち、またどの経路でアップロードされたかに関わらず各オブジェクトのチェックサムをメタデータに保存してきました。ただし最近までは、端から端までの完全性を確かめるには開発者側でチェックサムを計算して渡す追加の作業が必要でした。今回の変更で、ネイティブのデータ完全性の機能を開発者が使いやすくなっています。事例では、PayPal が Managed Service for Apache Spark で分析基盤を刷新した取り組みが紹介されました。PayPal では不正検知から利用体験の改善まであらゆるものをデータが支えており、エージェント型のソリューションや体験の可能性を引き出すうえでもデータが中心にあります。一方で、急速な成長と買収を重ねる中で分析環境はオンプレミス上に組み上がった多種多様な技術の複雑な生態系となり、新しいプラットフォームや連携はそれぞれ個別の業務要件には応えたものの、全体としては運用の負荷を増やし性能の詰まりを生み、拡張と維持が難しくなっていったという経緯が語られています。
