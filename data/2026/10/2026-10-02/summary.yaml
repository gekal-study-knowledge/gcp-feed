"overview": |
  この日は 7 件で、検索とデータレイクの機能強化、GKE への移行支援、そしてデータ整合性の強化が中心でした。データベースでは、AlloyDB と Cloud SQL for PostgreSQL 17 以降でネイティブな BM25 インデックスがプレビューで利用できるようになりました。Tiger Data が作成したオープンソースの pg_textsearch 拡張機能によるもので、これまで BM25 ランキングのために別の全文検索バックエンドを立てる必要があり、データサイロ・同期の遅延・運用の複雑化を招いていた問題が解消されます。ベクトルエンベディングは概念的な意味を捉えるのは得意ですが、特定の英数字 ID や正確な商品 SKU 番号の扱いは苦手なため、セマンティックなベクトル検索と完全一致のキーワード全文検索を組み合わせるハイブリッド検索が必要になります。PostgreSQL 組み込みの ts_rank は、コーパスが大きくなるとランキング品質が落ち、逆文書頻度をサポートしないため一般的な単語と珍しい単語が同じ重みになり、用語頻度飽和がないため同じ単語が 50 回出る文書が 1 回の文書より上位に来てしまいます。BM25 は逆文書頻度・用語頻度飽和・文書長正規化を備えた情報検索の標準で、pg_textsearch は C 言語で最適化された高速な BM25 スコアリングを Postgres テーブルに直接適用します。AlloyDB 限定の強化として、ScaNN と HNSW のインデックスタイプにより、標準の PostgreSQL と比べてベクトル検索クエリが最大 6 倍および 10 倍高速になります。分析では、ボーダーレスな Lakehouse の機能強化として、Lakehouse 向けのクロスクラウドキャッシュと BigQuery のクロスクラウド接続がいずれもプレビューで発表されました。企業のデータは Amazon S3、Azure Data Lake Storage (ADLS)、Google Cloud Storage、運用データベース、さらに Salesforce・SAP・Workday のような SaaS に分散しているのが通常で、これらの統合には不安定な ETL パイプライン、ストレージの重複、高額なクロスクラウド転送費用がつきものでした。Google は今年、Apache Iceberg REST カタログ仕様の採用によって Databricks Unity Catalog・AWS Glue・Snowflake Horizon との直接連携を可能にするボーダーレスな Lakehouse と、他クラウドへの高帯域プライベートリンクである Partner Cross-Cloud Interconnect を導入していましたが、今回はネットワーク経由で転送するデータ量そのものを最適化する方向に踏み込んでいます。頻繁にアクセスされるデータを Google Cloud 内にローカルキャッシュすることで BigQuery のクロスクラウドクエリを高速化しリモート転送費用も削減でき、標準的な Iceberg の列圧縮とクロスクラウドのキャッシュを組み合わせると、実際にクラウド間を転送するデータ量が処理データの 5% 未満に収まることも珍しくないとされています。移行では、GKE エージェント型移行がオープンソースで公開されました。AWS EKS から GKE への移行は、複雑な Infrastructure as Code を手で分析し、クラウド固有のアーキテクチャの違いを把握してカスタム変換スクリプトを作る必要があり、汎用 LLM にアドホックなプロンプトで任せると存在しないリソースプロパティのハルシネーション、重要なネットワークや ID 構成の欠落、相互依存するファイル間のコンテキスト喪失といった落とし穴があります。GKE エージェント型移行は、構造化された状態の永続化、プラットフォームチームとアプリチームの間のマルチペルソナ境界、交渉の余地のない人間の承認ゲートといった決定論的なガードレールで保護された AI 支援の移行パイプラインを提供する専用のエージェントプラグインで、Persistent 社の EVP Rahul Shrivastava 氏は、コンパイラ並みの精度で検証可能な移行ファクトリーが得られデリバリーリスクを大幅に削減できたと述べています。AI インフラでは、Google Cloud ネットワーキングが AI ワークロードのコンピューティング選択をどう支えるかが解説されました。アクセラレータの可用性は業界全体の課題であり、特定のアクセラレータ前提で構築するとデプロイが遅れうるため、利用可能なリソースに応じて複数の選択肢で設計する「フルイドコンピューティング」という考え方が示されます。リソースへのアクセス手段として、必要なアクセラレータノードがすべて揃うまでキューに入れてまとめてプロビジョニングし最大 7 日間プリエンプト不可で実行する Dynamic Workload Scheduler (Flex Start VM)、1〜90 日前に容量を予約して開始・終了時刻が保証されるカレンダーモード、将来の予約、複数年のロックインなしに希少なアクセラレータを確保するフレックス予約、GKE の ComputeClasses にマルチファミリーのフォールバックリストを定義して代替アクセラレータを自動プロビジョニングさせる動的なノード自動プロビジョニング、そしてチェックポイント付きのバッチジョブ向けの Spot VM が挙げられています。選んだアクセラレータ (GPU または TPU) ごとにバックエンドのネットワーキング構成が同一ではない点が注意として示されました。最適化では、DoIt が Google との提携で AlphaEvolve を使い、macOS のライブストリーミングアプリの本番 Swift コードを自律的に最適化した事例が紹介されました。30 fps ではカメラフレームの取り込みからニューラルセグメンテーション、シェーダー適用、出力合成までを 33.3 ミリ秒 (60 fps なら 16.6 ミリ秒) のフレームバジェットに収める必要があり、1 ミリ秒超えるとコマ落ちやカクつきが生じます。AlphaEvolve はクラウド上の Gemini モデルアンサンブルによる生成と、ネイティブな Swift / Metal コードのコンパイルと実行時間計測というローカルの評価を分離する「分割ループ」アーキテクチャを採り、構造的類似性指数 (SSIM) などで採点関数を組んで、速度のためにレンダリングを丸ごと省くような抜け道を進化ループが選ばないよう品質ゲートを設けます。ストレージでは、Cloud Storage のすべての SDK でエンドツーエンドのチェックサムがデフォルトで有効になりました。ディスクベースのストレージではアプリケーションからディスクまでの経路のどこでもビット反転が起こりえます。Cloud Storage は以前からアップロードされるデータのチェックサムをクライアントから受け取り、ダウンロードするデータのチェックサムを返せるようになっており、またアップロード方法にかかわらず全オブジェクトのチェックサムをメタデータに保持し、受け取ったデータの crc32 を計算してディスク上のデータと一致することを保証してきました。ただしアップロード要求にチェックサムが含まれない場合、サーバー側で計算される前の転送中のビット反転に対して脆弱であり、クライアント側のチェックサムを有効にしていない利用者もいたため、デフォルトで有効にしたという背景が説明されています。あわせて、PayPal が成長と買収の積み重ねで複雑化し、ピーク時のスケールアップに数か月の計画と手作業のハードウェア調達を要していたオンプレミスの分析基盤を、Managed Service for Apache Spark に移行した取り組みが公開されました。
