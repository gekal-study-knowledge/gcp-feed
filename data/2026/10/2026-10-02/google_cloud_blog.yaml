"entries":
  "9353dc60a420c1504d8a691d2263bf06":
    "id": "9353dc60a420c1504d8a691d2263bf06"
    "title": "Enabling Cloud Storage end-to-end checksums for improved data integrity and durability"
    "link": "https://cloud.google.com/blog/products/storage-data-transfer/enabling-end-to-end-checksums-in-cloud-storage/"
    "published": "2026-10-02 01:00:00"
    "fetched": "2026-10-02 05:06:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At Google Cloud, we know that you count on us to maintain the durability and integrity of your data at all times, both at rest and in transit. And now we’re making it easier for developers to take advantage of native data integrity features in Cloud Storage, by enabling end-to-end checksumming by default in all the Cloud Storage SDKs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Like in any disk-based storage system, bits can flip anywhere in their journey, from the application all the way down to the disk. Cloud Storage has always let clients provide a checksum of the object data being uploaded, and receive a checksum of the data being downloaded. Also since its inception, Cloud Storage stores a checksum for every object in its metadata, regardless of how the object was uploaded into Cloud Storage.</span></p>\n<p><span style=\"vertical-align: baseline;\">But until recently, ensuring end-to-end data integrity required extra work on the part of developers to calculate and provide checksums to Cloud Storage. Cloud Storage always calculates the crc32 (32-bit cyclic redundancy check) of data it receives and ensures data stored on disk matches this checksum. When a client request includes the object’s checksum, Cloud Storage ensures that this checksum also matches. However, when an upload request doesn’t include a checksum, that upload is vulnerable to a bit flip while the data is in-flight, prior to the server-side checksum computation. Not all customers and clients enable client-side checksums by default, leaving data in this phase unprotected. </span></p>\n<p><span style=\"vertical-align: baseline;\">To address this gap, the latest version of all Cloud Storage SDKs now internally checksums data being uploaded and passes this checksum to Cloud Storage, if it’s not provided by the application. The SDKs also support verifying the object’s checksum when an object is being downloaded.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, there are many use-cases where applications download select ranges of objects instead of the full object. When using Cloud Storage SDKs with our gRPC API to perform a range read, the SDKs take advantage of gRPC’s built-in end-to-end range checksum, using it to verify the data it receives.</span></p>\n<p><span style=\"vertical-align: baseline;\">We highly recommend </span><a href=\"https://docs.cloud.google.com/storage/docs/data-validation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">updating to our latest SDK versions</span></a><span style=\"vertical-align: baseline;\"> to take advantage of these important integrity features.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">And now, let’s peek under the hood</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ensuring continuous “chain-of-custody” between the data and its associated checksum from your application down to the disk platter, with no gap where a bit flip could go unnoticed, is quite challenging. And it’s critical to get this right: at our current scale of hundreds of thousands of Cloud Storage frontends, bit flips aren’t theoretical and do happen from time to time.</span></p>\n<p><span style=\"vertical-align: baseline;\">For instance, consider this simple example: when Cloud Storage receives your data in its frontend, this data gets encrypted with per-object encryption keys. This involves a data copy: the plaintext data is passed through an encryptor into a new memory buffer containing ciphertext. Extremely rarely, a bit in the source or destination memory buffer flips during this process. However, at our scale, extremely rare things happen routinely. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this situation, we maintain chain-of-custody by reversing the whole process: after encrypting the data (1), we calculate a checksum that protects the ciphertext. Then we decrypt the ciphertext (2), and if the resulting plaintext doesn’t match the original (3), we throw everything away and start over. This adds up to a lot of extra CPU time spent on encryption and checksumming, but it’s a necessary step to ensure data integrity.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_XOxHkrR.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Another challenge is how data gets broken up and aggregated as it passes through layers of our stack. </span><span style=\"vertical-align: baseline;\">As data gets uploaded to Cloud Storage, it gets split up into chunks, each of which has its own checksum</span><span style=\"vertical-align: baseline;\">. To manage data efficiently at scale, Cloud Storage groups thousands of chunks together into a storage unit we call a shard file. These gigabyte-sized files are how Cloud Storage ultimately delivers data to our cluster-level storage system, </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/a-peek-behind-colossus-googles-file-system?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Colossus</span></a><span style=\"vertical-align: baseline;\">. Internally, Colossus uses Reed Solomon encodings to spread data across many disks and protect against the failures of individual disks, machines, and racks. This requires chopping up the shard file data into blocks, each of which is again protected by a checksum.</span></p>\n<p><span style=\"vertical-align: baseline;\">To maintain chain-of-custody of the data as it goes through all these transformations, we take advantage of some nifty properties of cyclic redundancy checks (CRCs), for example, concatenation. When you have two data buffers that each have their own CRC, you can cheaply compute the CRC of the two concatenated buffers without having to re-checksum the data. This comes in handy in many situations, such as when concatenating chunks together into shard files: Colossus can cheaply determine the CRC of the entire shard file from its constituent chunks and store that in its metadata.</span></p>\n<p><span style=\"vertical-align: baseline;\">Ultimately, the data lands on disks managed by our “D” file server (our network attached disks). D stores inline checksums for each range of data within a Colossus block. Whenever data is read from the disk, it is verified at several layers: The Colossus client verifies the data it reads against D’s inline checksums, and the Cloud Storage frontend reads data chunk-by-chunk, verifying each chunk against its checksum before sending it to the client. These chunk-level checksums are what enable our gRPC protocol to provide a checksum for a range read that can be verified by our SDKs, all without losing chain-of-custody.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_wfC90pO.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Chain of Custody: Maintaining Data integrity across Data transformations</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">The above image shows the data integrity handoff across multiple layers under the hood of Google Cloud Storage. On reads, checksums are verified inline at multiple layers to prevent silent corruptions.</span></p>\n<ol>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Client passes full object checksum to Cloud Storage Frontends.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Data is split into chunks and individual chunk level checksums are computed.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Shard level checksums are computed based on concatenated chunk level CRCs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Shards are stored across disk blocks with another level of block level inline checksums. </span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Here on the Cloud Storage team, we remain dedicated to maintaining the highest standards of data integrity for our customers. By making end-to-end checksumming the default in our SDKs and maintaining chain-of-custody throughout our internal storage stack, data remains exactly as intended from the moment of upload to the final download. This continuous vigilance reflects our commitment to protecting your data at any scale. To take full advantage of these protections, we recommend updating to the </span><a href=\"https://docs.cloud.google.com/storage/docs/data-validation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">latest</span></a><span style=\"vertical-align: baseline;\"> version of our </span><a href=\"https://docs.cloud.google.com/storage/docs/reference/libraries\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SDKs</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "d8705e68843ddb7a5b9fa773c3149b94":
    "id": "d8705e68843ddb7a5b9fa773c3149b94"
    "title": "Accelerating analytics: PayPal’s journey with Managed Service for Apache Spark"
    "link": "https://cloud.google.com/blog/products/data-analytics/paypals-journey-with-managed-service-for-apache-spark/"
    "published": "2026-10-02 01:00:00"
    "fetched": "2026-10-02 05:06:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In a data-driven world, PayPal’s ability to deliver timely and actionable insights is central to staying ahead. At PayPal, data powers everything from fraud detection to user experience enhancements. Data is also central to unleashing the potential of agentic solutions and experiences. </span></p>\n<p><span style=\"vertical-align: baseline;\">Over time, though, our analytics environment had become a complex ecosystem of various technologies and solutions assembled on-premise to address growing demands. While this approach supported our needs at the time, it began presenting new challenges to scale and maintain.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Navigating a challenging analytics landscape</span></h3>\n<p><span style=\"vertical-align: baseline;\">Due to expedited growth and acquisitions, our data analytics platform gradually turned into an uneven landscape. Each new platform or integration addressed a specific business need, but together, they increased operational overhead and introduced performance blockages. Scalability became increasingly difficult, and time-to-insight slowed as processes grew more complex. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Complexity breeds stagnation</span></h3>\n<p><span style=\"vertical-align: baseline;\">PayPal’s </span><a href=\"https://cloud.google.com/blog/products/databases/paypals-historic-data-migration-is-the-foundation-for-its-gen-ai-innovation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">legacy data analytics platform</span></a><span style=\"vertical-align: baseline;\"> was powerful—handling petabytes daily—but it was also increasingly rigid following rapid growth. Scaling up during peak retail events or global launches meant months of planning, slow manual provisioning of hardware, and too often, a compromise between speed and cost.</span></p>\n<p><span style=\"vertical-align: baseline;\">As PayPal continued to scale globally, we recognized the need for a streamlined, unified infrastructure to drive data efficiency and accelerate innovation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The solution: Unified, cloud-native analytics</span></h3>\n<p><span style=\"vertical-align: baseline;\">To overcome these obstacles, we migrated our analytics workloads from legacy Hadoop on-premise platforms to Google’s </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Key reasons for this choice included:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Rapid provisioning and elastic scaling: Managed Spark enabled us to deploy clusters in minutes and scale based on processing needs, eliminating lengthy setup and idle resource costs. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Unified infrastructure: Standardizing on Apache Spark created consistency across teams while leveraging Managed Service for Apache Spark and other managed services reduced operational complexity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Seamless integration: Native hooks into </span><a href=\"https://cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> (GCS), </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">, and other Google Cloud services streamlined end-to-end data movement.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">This move enabled PayPal to modernize our data processing capabilities, leveraging the flexibility, scalability, and reliability of cloud-native solutions. By consolidating previously disparate workflows and batch jobs that run on multiple platforms onto a single cloud-based analytics platform, we reduced data silos and built a unified data foundation that provides faster, richer insights. </span></p>\n<p><span style=\"vertical-align: baseline;\">This empowered developers and application teams to focus on delivering business value rather than being limited by infrastructure. Crucially, this shift was about more than re-platforming. We fostered a new culture of experimentation, enabling teams to test, tune, and deploy analytics workloads quickly in response to changing business needs.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The results: Faster insights, lower overhead</span></h3>\n<p><span style=\"vertical-align: baseline;\">The impact of our modernized Google Cloud-based ecosystem leveraging Managed Spark has been profound:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Processing times for core analytics workloads improved by 25%, enabling near real-time insights for key business operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SLA adherence rose substantially by 30%, even during traffic surges such as seasonal sales events.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Operational costs dropped as we consolidated tooling and reduced manual maintenance.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">But perhaps most importantly, our engineers now spend less time firefighting and more time innovating, rapidly prototyping new analytics capabilities that deliver value to customers and partners.</span></p>\n<p><span style=\"vertical-align: baseline;\">Transitioning from a fragmented environment to a cohesive, cloud-native platform has fundamentally strengthened PayPal’s analytics capabilities. As business needs evolve, investing in a scalable, unified data foundation ensures that we can deliver insights with speed, precision, and impact—driving continued innovation for customers worldwide. Our journey with Managed Service for Apache  Spark is an important step in building that modern analytics foundation.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Learn more about how you can get started with </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> to build your </span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> today.</span></p></div>"
  "0b9d184ca4ce994b1ee412c7ff340eed":
    "id": "0b9d184ca4ce994b1ee412c7ff340eed"
    "title": "How to implement long-term AI agent memory in AlloyDB and Memorystore for Valkey"
    "link": "https://cloud.google.com/blog/products/databases/implementing-long-term-ai-agent-memory-in-alloydb-and-memorystore/"
    "published": "2026-10-02 16:00:00"
    "fetched": "2026-10-03 03:58:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Enterprise AI agents need persistent memory to execute complex, multi-day workflows and long-horizon tasks. In this blog, we examine how a 2-tier memory architecture using </span><a href=\"https://docs.cloud.google.com/memorystore/docs/valkey\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Memorystore for Valkey</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> for short-term buffer memory and </span><a href=\"https://cloud.google.com/alloydb/ai\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">AlloyDB AI</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> for long-term persistent memory can help reduce token spend by up to 70%, while maintaining critical data and enterprise guardrails.</span></p>\n<p><span style=\"vertical-align: baseline;\">Imagine building a personalized travel agent designed to help users book vacations. The user interacts with the agent many times over the course of several days, asking questions that range from brainstorming itineraries to actual purchase intent. To provide a truly seamless experience, this agent must remember flight preferences (e.g. “I only want non-stop flights”), hotel budgets, and dietary restrictions (e.g. “I need Gluten Free dining options”) established in previous sessions. More importantly, it has to hold onto these core facts even when the conversation gets deep into the weeds of sightseeing recommendations and itinerary planning. The agent must ensure that all the follow-up questions and exciting details about places to visit doesn’t cause it to forget or overwrite the user's fundamental requirements and decisions. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Stateful workflows inherently conflict with LLM’s stateless nature</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AI agents are being used for multi-turn conversations and long-running workflows, but large language models (LLMs) remain stateless across sessions. When a user returns to an agent days later, the model starts with an empty context window. Unless your application is built to reconstruct past context using long-term agent memory, your users have to explain their goals and context all over again, resulting in a frustrating and fragmented experience.</span></p>\n<p><span style=\"vertical-align: baseline;\">With million-token context windows now the norm, a common shortcut to this problem is \"context stuffing\" -  dumping everything you can fit into the prompt at every turn, from raw chat histories to tool execution logs. In fact, this was a common pattern in the early days of AI model usage. But this shortcut quickly creates issues at scale: token costs multiply with every message, response times can drag out past 30+ seconds for otherwise simple prompts, and the model starts suffering from \"</span><a href=\"https://arxiv.org/abs/2307.03172\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">lost in the middle</span></a><span style=\"vertical-align: baseline;\">\" degradation, overlooking critical instructions buried in mountains of prompt text.</span></p>\n<p><span style=\"vertical-align: baseline;\">Another common workaround is to use rolling summaries; asking an LLM to periodically compress older messages into a summary paragraph. While this trims prompt size, LLM-based summarization is inherently lossy. After a few rounds of compression, subtle but important details get filtered out as background noise. A few turns later, your agent quietly breaks the exact constraints you set earlier. Clearly, you  need a more scalable approach for keeping a memory from previous conversations or multi-turn tasks, but without degrading the experience or creating new bottlenecks.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Implementing a 2-tier memory architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To build reliable, cost-effective enterprise agents that respect your guardrails and constraints, we recommend a </span><strong style=\"vertical-align: baseline;\">2-tier memory architecture</strong><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Short-term session buffer</strong><span style=\"vertical-align: baseline;\">: Caches active conversation turns in memory using a token-bounded sliding window, allowing the context window size to remain stable across multiple rounds, even across devices, while keeping the latest messages fresh. This tier requires sub-millisecond, high-throughput lookups on every turn, making </span><a href=\"https://docs.cloud.google.com/memorystore/docs/valkey\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Memorystore for Valkey</span></a><span style=\"vertical-align: baseline;\"> well suited for maintaining active session state. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Long-term persistent memory</strong><span style=\"vertical-align: baseline;\">: Stores important facts, user preferences, and episodic facts across sessions. This tier requires transactional integrity, data governance, and hybrid retrieval across relational data and vectors - capabilities provided natively by </span><a href=\"https://cloud.google.com/alloydb/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">While it’s possible to store both long-term memory and active session buffers directly in a relational database, a two-tier architecture with an in-memory cache provides better performance and scalability. Active session buffers are highly ephemeral and require sub-millisecond, high-throughput updates on every single conversation turn. Handling these rapid-fire writes in an in-memory key-value cache prevents write amplification and table bloat in your relational database, which would otherwise require frequent row deletions and intensive vacuuming. This is analogous to adding a caching tier in front of your database to offload high-frequency lookups for hot rows. The division of labor keeps your primary database lean and responsive, allowing it to focus its resources on what it is designed for: transactional consistency, complex hybrid vector search, and long-term analytical query execution. </span></p>\n<p><span style=\"vertical-align: baseline;\">By pairing short-term caching in Memorystore for Valkey with native AlloyDB AI capabilities, you can run entity extraction, memory compaction, cross-session memory, and hybrid retrieval directly inside the database tier, keeping active prompts lean, fast, and cost-efficient. </span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get started with a 30-day AlloyDB free trial instance&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569a3ef8d0&gt;), (&#x27;btn_text&#x27;, &#x27;&#x27;), (&#x27;href&#x27;, &#x27;&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Understanding the four memory types</span></h3>\n<p><span style=\"vertical-align: baseline;\">To organize long-term agent state effectively, we further divide agent memory into four complementary types across the short-term and long-term storage tiers we described above:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Memory type</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">What it stores</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Storage layer</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Lifespan</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Buffer (Short-term)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Recent raw conversation turns</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Memorystore for Valkey</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Active session</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Summary memory</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Compressed history of older turns, commonly referred to as “compaction”</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Memorystore for Valkey</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multi-turn window</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Episodic memory</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Past actions, events, and tool outputs</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB for PostgreSQL (Hybrid retrieval with structured SQL + full-text search + vector)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Permanent</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Entity &amp; rule memory</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">User preferences, constraints, and vetoes</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB for PostgreSQL (Hybrid retrieval with structured SQL + full-text search + vector)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Permanent</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">By isolating short-term conversation context from structured long-term rules, your agent retrieves relevant context on demand without filling token windows with raw interaction logs.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The tiered memory architectural blueprint</span></h3>\n<p><span style=\"vertical-align: baseline;\">The diagram below outlines the read and write paths connecting the application orchestration layer, the </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\"> short-term buffer, and the </span><strong style=\"vertical-align: baseline;\">AlloyDB AI</strong><span style=\"vertical-align: baseline;\"> long-term repository:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_dkY04WA.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The system operates across two coordinated execution paths:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The read path</strong><span style=\"vertical-align: baseline;\">: When a user asks a question, the application fetches the active sliding window from </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\">, runs in-database query normalization using </span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\">, and queries </span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\"> using </span><code style=\"vertical-align: baseline;\">ai.hybrid_search</code><span style=\"vertical-align: baseline;\"> to retrieve scoped entity rules and relevant episodic facts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The write path</strong><span style=\"vertical-align: baseline;\">: After generating the response, the turn is immediately cached in </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\">. An asynchronous background queue worker extracts structured entities from the exchange and writes them directly into </span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\">, where transactional auto-embeddings immediately compute and store vector representations in the database.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Business impact and ROI</span></h3>\n<p><span style=\"vertical-align: baseline;\">In our benchmark testing across multi-turn development dialogues (45+ turns with heavy tool executions), separating short-term caching from long-term persistence delivered measurable cost and performance improvements compared to naive context stuffing:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Metric / dimension</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Naive context stuffing</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Tiered memory (AlloyDB + Valkey)</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Net business impact</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Active prompt size (turn 45)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">747,033 tokens</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">83,262 tokens</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">88.9% smaller prompt</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Turn 45 response latency</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">33.5 seconds</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">6.7 seconds</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">80.0% faster response</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Per-turn response wait time</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">33.5 seconds</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4.2s – 6.7s</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">36% to 80% reduction</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Cumulative session tokens</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">17.9M tokens</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4.09M tokens</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">72.0% token &amp; cost savings</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rule &amp; constraint recall</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Degrades over turns</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Does not degrade </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ACID-preserved recall</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Note: The metrics above reflect internal benchmark results from a simulated developer workload that mimics a real-world enterprise AI pair-programming assistant interacting with a developer over multiple sessions, projects, and context switches. Actual savings and latencies vary based on prompt structure, query frequency, and data volume.</span></p>\n<p><span style=\"vertical-align: baseline;\">These results demonstrate how tiered memory changes agent unit economics: instead of an escalating cost curve on every additional turn, prompt sizes remain bounded, reducing ongoing LLM API expenses while keeping response times fast.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Core AlloyDB AI technical advantages</span></h3>\n<p><strong style=\"vertical-align: baseline;\">AlloyDB AI</strong><span style=\"vertical-align: baseline;\"> reduces the operational overhead of implementing persistent agent memory by embedding core AI functions directly into the database engine:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Transactional in-database auto-embeddings (</strong><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/generate-manage-auto-embeddings-for-tables\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ai.initialize_embeddings</strong></a><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: AlloyDB automatically generates vector embeddings for text columns using a native integration with </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform</strong></a><span style=\"vertical-align: baseline;\"> (formerly Vertex AI), generating up to 3,000 embeddings per second. Using </span><code style=\"vertical-align: baseline;\">incremental_refresh_mode =&gt; 'transactional'</code><span style=\"vertical-align: baseline;\">, AlloyDB keeps embeddings up to date as source data changes within the same transaction, removing the need for custom embedding pipelines, external schedulers, or complex retry logic.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">In-database generative AI functions (</strong><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/evaluate-semantic-queries-ai-operators\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ai.generate</strong></a><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: AlloyDB allows you to execute foundation models, such as Gemini, directly from SQL queries. You can use this for in-database query decomposition - breaking compound user questions into single-aspect sub-queries and resolving relative time phrases (like \"last session\") into explicit identifiers - without making separate roundtrips from your application.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Native hybrid search with built-in Reciprocal Rank Fusion (</strong><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ai.hybrid_search</strong></a><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: AlloyDB provides a built-in SQL function that executes Reciprocal Rank Fusion (RRF) directly inside the engine. It combines vector cosine similarity (</span><code style=\"vertical-align: baseline;\">&lt;=&gt;</code><span style=\"vertical-align: baseline;\"> over HNSW or ScaNN indexes) with PostgreSQL full-text search (using BM25, RUM, or GIN) in a single database call, blending semantic matching with exact keyword retrieval while supporting metadata filter pushdown (</span><code style=\"vertical-align: baseline;\">filter_condition</code><span style=\"vertical-align: baseline;\">) for improved performance and deterministic scope isolation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct Agent Platform integration with IAM credentials</strong><span style=\"vertical-align: baseline;\">: AlloyDB connects directly to </span><strong style=\"vertical-align: baseline;\">Agent Platform</strong><span style=\"vertical-align: baseline;\"> foundation models over Google Cloud's private network using </span><a href=\"https://cloud.google.com/products/iam\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud IAM</span></a><span style=\"vertical-align: baseline;\"> service account roles and database authentication, avoiding the need to store, rotate, or pass API keys in application code.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified operational, vector, and governance engine</strong><span style=\"vertical-align: baseline;\">: AlloyDB consolidates relational business data, vector embeddings, full-text indexes, and enterprise permissions in a single ACID-compliant PostgreSQL database, avoiding data drift and integration complexity across separate operational and vector databases.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Key implementation patterns</span></h3>\n<p><span style=\"vertical-align: baseline;\">Below are the core database patterns used to configure the 2-tier memory architecture. For complete, runnable Python and SQL scripts, refer to the companion </span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Agent Memory Codelab</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Setting up schema and auto-embeddings</span></h4>\n<p><span style=\"vertical-align: baseline;\">In </span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\">, install the necessary extensions and define the </span><code style=\"vertical-align: baseline;\">agent_entities</code><span style=\"vertical-align: baseline;\"> table with structured metadata, a generated </span><code style=\"vertical-align: baseline;\">tsvector</code><span style=\"vertical-align: baseline;\"> column for full-text search, and a vector embedding column.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 1. Enable AI extensions\\r\\nCREATE EXTENSION IF NOT EXISTS google_ml_integration CASCADE;\\r\\nCREATE EXTENSION IF NOT EXISTS vector CASCADE;\\r\\nCREATE EXTENSION IF NOT EXISTS rum CASCADE;\\r\\n\\r\\n-- 2. Create structured entity &amp; preference table\\r\\nCREATE TABLE IF NOT EXISTS agent_entities (\\r\\n    entity_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\\r\\n    user_id TEXT NOT NULL,\\r\\n    entity_name TEXT NOT NULL,\\r\\n    project_id TEXT DEFAULT &#x27;global&#x27;,\\r\\n    session_id TEXT,\\r\\n    scope TEXT NOT NULL DEFAULT &#x27;session&#x27;,\\r\\n    summary TEXT NOT NULL,\\r\\n    summary_embedding VECTOR(768),\\r\\n    summary_tsv TSVECTOR GENERATED ALWAYS AS (\\r\\n        to_tsvector(&#x27;english&#x27;, entity_name || &#x27; &#x27; || summary)\\r\\n    ) STORED,\\r\\n    updated_at TIMESTAMPTZ DEFAULT NOW(),\\r\\n    UNIQUE (user_id, entity_name)\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569ada78d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Then, generate embeddings using </span><code style=\"vertical-align: baseline;\">ai.initialize_embeddings</code><span style=\"vertical-align: baseline;\">. Using </span><code style=\"vertical-align: baseline;\">transactional</code><span style=\"vertical-align: baseline;\"> mode ensures the embeddings are kept up to date as source data changes.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Register transactional in-database auto-embedding\\r\\nCALL ai.initialize_embeddings(\\r\\n    model_id =&gt; &#x27;text-embedding-005&#x27;,\\r\\n    table_name =&gt; &#x27;agent_entities&#x27;,\\r\\n    content_column =&gt; &#x27;summary&#x27;,\\r\\n    embedding_column =&gt; &#x27;summary_embedding&#x27;,\\r\\n    incremental_refresh_mode =&gt; &#x27;transactional&#x27;,\\r\\n    batch_size =&gt; 10\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569ada4750&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Finally, create the HNSW vector index and the RUM full-text search index to ensure your hybrid searches are fast and efficient.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Create vector and full-text indexes\\r\\nCREATE INDEX IF NOT EXISTS agent_entities_embedding_idx\\r\\n    ON agent_entities USING hnsw (summary_embedding vector_cosine_ops);\\r\\n\\r\\nCREATE INDEX IF NOT EXISTS agent_entities_tsv_idx\\r\\n    ON agent_entities USING rum (summary_tsv rum_tsvector_ops);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569ada7390&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">2. Querying long-term memory with native hybrid search</span></h4>\n<p><span style=\"vertical-align: baseline;\">On the read path, retrieve relevant long-term entities using </span><code style=\"vertical-align: baseline;\">ai.hybrid_search</code><span style=\"vertical-align: baseline;\">. This native SQL function executes Reciprocal Rank Fusion (RRF) directly in AlloyDB, seamlessly reranking and combining vector similarity search and full-text keyword search results in a single database query:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;def retrieve_hybrid_entities(\\r\\n    conn,\\r\\n    user_id: str,\\r\\n    project_id: str,\\r\\n    query_text: str,\\r\\n    query_vector_literal: str,\\r\\n    limit: int = 3\\r\\n) -&gt; dict[str, Any]:\\r\\n    &quot;&quot;&quot;Queries long-term memory using AlloyDB native hybrid_search (RRF).&quot;&quot;&quot;\\r\\n    filter_cond = f&quot;user_id = \\&#x27;{user_id}\\&#x27; AND (project_id = \\&#x27;{project_id}\\&#x27; OR scope = \\&#x27;global\\&#x27;)&quot;\\r\\n    \\r\\n    search_inputs = [\\r\\n        json.dumps({\\r\\n            &quot;data_type&quot;: &quot;vector&quot;,\\r\\n            &quot;weight&quot;: 0.4,\\r\\n            &quot;table_name&quot;: &quot;agent_entities&quot;,\\r\\n            &quot;key_column&quot;: &quot;entity_name&quot;,\\r\\n            &quot;vec_column&quot;: &quot;summary_embedding&quot;,\\r\\n            &quot;distance_operator&quot;: &quot;&lt;=&gt;&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;query_vector&quot;: query_vector_literal,\\r\\n            &quot;filter_condition&quot;: filter_cond\\r\\n        }),\\r\\n        json.dumps({\\r\\n            &quot;data_type&quot;: &quot;text&quot;,\\r\\n            &quot;weight&quot;: 0.6,\\r\\n            &quot;table_name&quot;: &quot;agent_entities&quot;,\\r\\n            &quot;key_column&quot;: &quot;entity_name&quot;,\\r\\n            &quot;text_column&quot;: &quot;summary_tsv&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;ranking_function&quot;: &quot;ts_rank&quot;,\\r\\n            &quot;query_text_input&quot;: query_text,\\r\\n            &quot;filter_condition&quot;: filter_cond\\r\\n        })\\r\\n    ]\\r\\n\\r\\n    query_sql = &quot;&quot;&quot;\\r\\n        SELECT e.entity_name, e.summary, e.project_id, e.scope, e.updated_at\\r\\n        FROM ai.hybrid_search(\\r\\n          search_inputs =&gt; %s::JSONB[],\\r\\n          include_json_output =&gt; false\\r\\n        ) h\\r\\n        JOIN agent_entities e ON e.entity_name = h.id\\r\\n        WHERE e.user_id = %s\\r\\n        LIMIT %s;\\r\\n    &quot;&quot;&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b728ed0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">3. In-database memory compaction with AI functions</span></h4>\n<p><span style=\"vertical-align: baseline;\">To manage long-term storage growth without writing custom pruning scripts, you can run automated extraction and compaction queries directly in </span><strong style=\"vertical-align: baseline;\">AlloyDB</strong><span style=\"vertical-align: baseline;\"> to identify the important parts which can benefit from being stored. This pattern uses a SQL common table expression (CTE) with </span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\"> to consolidate older episodic entries into a high-density summary:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Consolidate older episodic logs into a permanent summary\\r\\nWITH old_events AS (\\r\\n    SELECT document AS content\\r\\n    FROM langchain_pg_embedding\\r\\n    WHERE cmetadata-&gt;&gt;&#x27;user_id&#x27; = &#x27;user_dev_42&#x27;\\r\\n      AND created_at &lt; NOW() - INTERVAL &#x27;30 days&#x27;\\r\\n    ORDER BY created_at ASC\\r\\n    LIMIT 50\\r\\n),\\r\\nconsolidated AS (\\r\\n    SELECT ai.generate(\\r\\n        &#x27;Summarize these historical events into a dense memory paragraph:\\\\n&#x27; || string_agg(content, E&#x27;\\\\n&#x27;),\\r\\n        model_id =&gt; &#x27;gemini-3.5-flash&#x27;\\r\\n    ) AS summary_text\\r\\n    FROM old_events\\r\\n)\\r\\nINSERT INTO agent_entities (user_id, entity_name, summary, updated_at)\\r\\nSELECT &#x27;user_dev_42&#x27;, &#x27;longterm_session_summary&#x27;, summary_text, NOW()\\r\\nFROM consolidated\\r\\nWHERE summary_text IS NOT NULL\\r\\nON CONFLICT (user_id, entity_name)\\r\\nDO UPDATE SET summary = EXCLUDED.summary, updated_at = NOW();&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b72b190&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For example, </span><span style=\"vertical-align: baseline;\">a long interaction regarding the complexities of changing flights with kids can result in a summary of “I prefer non-stop flights”.</span></p>\n<h4><span style=\"vertical-align: baseline;\">4. Connecting the 2-tier memory architecture to an ADK agent</span></h4>\n<p><span style=\"vertical-align: baseline;\">With the core 2-tier memory architecture configured, you can now extend the default ADK Memory provider to use this 2-tier memory architecture as shown in the </span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory#14\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">accompanying Codelab</span></a><span style=\"vertical-align: baseline;\"> (e.g. </span><code style=\"vertical-align: baseline;\">ADKTieredMemoryProvider</code><span style=\"vertical-align: baseline;\">). To attach the long-term memory to an ADK agent, you simply provide it as a tool (e.g. </span><code style=\"vertical-align: baseline;\">longterm_memory_tool</code><span style=\"vertical-align: baseline;\">) like this: </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from adk_memory_provider import ADKTieredMemoryProvider\\r\\n\\r\\nagent = Agent(\\r\\n    name=&quot;adk_memory_agent&quot;, model=GEMINI_MODEL, instruction=&quot;Initial instruction&quot;,\\r\\n    tools=[long_term_memory_tool, run_command_tool],\\r\\n    before_tool_callback=guardrail.create_before_tool_callback(USER_ID, &quot;CloudRetail&quot;)\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f569b72af10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Enterprise governance and multi-tenant security</span></h3>\n<p><span style=\"vertical-align: baseline;\">Running agent memory in enterprise production environments requires strict security boundaries and access controls. First of all, we need to maintain </span><strong style=\"vertical-align: baseline;\">scope and multi-tenant isolation.</strong><span style=\"vertical-align: baseline;\"> By indexing </span><code style=\"vertical-align: baseline;\">user_id</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">project_id</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">scope</code><span style=\"vertical-align: baseline;\"> columns in </span><code style=\"vertical-align: baseline;\">agent_entities</code><span style=\"vertical-align: baseline;\"> and enforcing PostgreSQL Row-Level Security (RLS), you can isolate memory stores across departments, teams, and individual users within the same database cluster. </span><a href=\"https://docs.cloud.google.com/alloydb/docs/parameterized-secure-views-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Parameterized Secure Views</span></a><span style=\"vertical-align: baseline;\"> (PSV) offer another layer of deterministic application-level security, helping you protect against malicious prompts and overly-broad SQL queries.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition, we need to provide </span><strong style=\"vertical-align: baseline;\">automated memory lifecycle management </strong><span style=\"vertical-align: baseline;\">as shown in the implementation pattern above. Combining scheduled SQL compaction queries with time-based partition pruning helps maintain predictable database footprint and query latencies over time. See the </span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">accompanying Codelab </span></a><span style=\"vertical-align: baseline;\">for more details on this approach.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Summary and next steps</span></h3>\n<p><span style=\"vertical-align: baseline;\">Decoupling active context windows from persistent storage is a practical approach to building production-ready AI agents. By pairing </span><strong style=\"vertical-align: baseline;\">Memorystore for Valkey</strong><span style=\"vertical-align: baseline;\"> for sub-millisecond session caching with </span><strong style=\"vertical-align: baseline;\">AlloyDB AI</strong><span style=\"vertical-align: baseline;\"> for transactional long-term storage, you can achieve substantial token cost savings and faster response times while maintaining strict business rules throughout long-horizon tasks and many-turn agentic experiences.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get started:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Step through the complete hands-on tutorial in the companion </span><a href=\"https://codelabs.developers.google.com/alloydb-agentic-tiered-memory\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Agent Memory Codelab</span></a><span style=\"vertical-align: baseline;\"> to deploy the working 2-tier memory architecture.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn more about database-side machine learning features in the </span><a href=\"https://cloud.google.com/alloydb/docs/ai/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore guides on </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/generate-manage-auto-embeddings-for-tables\"><span style=\"text-decoration: underline; vertical-align: baseline;\">generating auto vector embeddings</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">running hybrid vector search</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
