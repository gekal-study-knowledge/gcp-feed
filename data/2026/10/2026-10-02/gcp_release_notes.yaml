    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>The <a href=\"https://docs.cloud.google.com/bigquery/docs/reference/libraries\">Rust SDK for BigQuery</a> is now\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h3>Feature</h3>\n<p>The <a href=\"https://docs.cloud.google.com/gemini/data-agents/data-engineering-agent/agent-overview\">Data Engineering\nAgent</a> now supports\nthe <code>gemini-3.7-flash</code> model for the <code>us</code>, <code>eu</code>, and <code>global</code> multi-regional\nendpoints.</p>\n<h2 class=\"release-note-product-title\">Cloud NAT</h2>\n<h3>Feature</h3>\n<p><strong>General Availability</strong>: Cloud NAT gateways for Private NAT support IPv6 to\nIPv4 network address translation. For more information, see\n<a href=\"https://docs.cloud.google.com/nat/docs/private-nat#nat64\">NAT64 in Private NAT</a>.</p>\n<h2 class=\"release-note-product-title\">Google Kubernetes Engine</h2>\n<h3>Issue</h3>\n<p>In GKE control plane versions 1.36.3-gke.1244000 and later, Cloud Storage FUSE CSI driver (<code>gcsfusecsi-node</code>) DaemonSet Pods fail to start on specific node pools. The Pods crash and log the following error:</p>\n<pre class=\"prettyprint\"><code>MountVolume.SetUp failed for volume \"host-proc-sys-fs-fuse\" : hostPath type check failed: /proc/sys/fs/fuse is not a directory.\n</code></pre>\n<p>This issue occurs during a version skew when node pools run an older kernel lacking the required host path (earlier than 6.12.67 for Container-Optimized OS, or earlier than 6.13 for Ubuntu). Affected node pool configurations include:</p>\n<ul>\n<li>All Ubuntu with containerd (<code>ubuntu_containerd</code>) node pools.</li>\n<li>Container-Optimized OS with containerd (<code>cos_containerd</code>) node pools on GKE versions 1.33 and earlier, 1.34 versions earlier than 1.34.6-gke.1154000, and 1.35 versions earlier than 1.35.3-gke.1389000.</li>\n</ul>\n<p><strong>Workaround</strong>: For <code>cos_containerd</code> node pools,  upgrade the node pool to a version with the required kernel support (for example, 1.34.6-gke.1154000 or later, 1.35.3-gke.1389000 or later, or match the control plane). For <code>ubuntu_containerd</code> node pools, a fix is in progress. Alternatively, downgrade the control plane to a version earlier than 1.36.3-gke.1244000.</p>\n<h3>Feature</h3>\n<p>You can use Vertical Pod Autoscaler (VPA) with Horizontal Pod Autoscaler (HPA)\nto automatically optimize container CPU requests for workloads that scale\nreplicas based on CPU utilization. This feature is available in Public Preview\non clusters running GKE version 1.36.3-gke.1630000 or later. For more\ninformation, see\n<a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/rightsize-hpa-workloads-with-vpa\">Rightsize HPA workloads with VPA</a>.</p>\n<h2 class=\"release-note-product-title\">Network Connectivity Center</h2>\n<h3>Feature</h3>\n<p>Network Connectivity Center supports <a href=\"https://docs.cloud.google.com/network-connectivity/docs/network-connectivity-center/concepts/locations\">site-to-site data transfer</a>\nin the following country:</p>\n<ul>\n<li>Poland</li>\n</ul>"
