    "published": "2026-10-02 11:00:00"
    "fetched": "2026-10-02 15:42:09"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 9 月 25 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/topics/developers-practitioners/how-google-cloud-networking-supports-your-fluid-compute-choices-for-ai-workloads?e=0&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>AI ワークロード用のリソース、特にアクセラレータの可用性は、業界全体で課題となる可能性があります。特定のタイプのアクセラレータを中心に構築されている場合、AI ワークロードのデプロイが遅くなる可能性があります。<b>フルイド コンピューティング</b>というコンセプトにより、ユースケースに適合する利用可能なリソースに基づき、複数のオプションを使用して AI デプロイを設計することが可能になります。</p><p>このブログ投稿では、Google Cloud ネットワーキングが AI ワークロードをどのようにサポートしているかを紹介するとともに、アクセラレータ（GPU または TPU）を選択する際の考慮事項について説明します。バックエンドのネットワーキング コンポーネント構成は、それぞれで完全に同じではないためです。</p><h3><b>リソース オプション</b></h3><p>AI デプロイで実現したいタスクを決定したら、次に重要な要素は、それを実行する実際のハードウェアです。この場合、プライベート LLM の推論を実行する必要があり、ターゲットは<a href=\"https://cloud.google.com/compute/docs/gpus\"> A4 VM</a>（a4-highgpu-8g）で利用可能な NVIDIA B200 GPU ファミリーです。</p><p>これで、達成したいことと、利用可能なコンピューティング オプションは特定できました。しかし、「本当にそれが利用できるのか」という課題があります。</p><p>リソースにアクセスするには、次のような方法があります。</p><ul><li><a href=\"https://docs.cloud.google.com/compute/docs/instances/about-flex-start-vms\">Dynamic Workload Scheduler（Flex Start VM）</a>: 必要なアクセラレータ ノードがすべて同時に利用可能になるまでワークロードをキューに入れ、それらをまとめてプロビジョニングし、最大 7 日間プリエンプト不可で実行します。</li><li><a href=\"https://docs.cloud.google.com/compute/docs/instances/future-reservations-calendar-mode-overview\">Dynamic Workload Scheduler（カレンダー モード）</a>: 1～90 日前にアクセラレータ容量を予約でき、開始時間と終了時間が保証されるため、スケジュールされた事前トレーニングの実行やベンチマークに最適です。</li><li><a href=\"https://docs.cloud.google.com/compute/docs/instances/future-reservations-overview\">将来の予約</a>: 将来の特定の日付から、指定したゾーンで確約されたハードウェアへのアクセスを保証します。</li><li><a href=\"https://cloud.google.com/compute/docs/instances/reservations-overview\">フレックス予約</a>: 短期契約により、複数年のロックインなしで、希少なアクセラレータ ノードを確保できます。</li><li><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-provisioning#enable-workload-level\">動的なノード自動プロビジョニングと ComputeClasses</a>: Google Kubernetes Engine（GKE）では、ComputeClasses 内にマルチファミリー フォールバック リストを定義することで、プライマリ プールがリージョンの制約に直面した場合に、クラスタが代替アクセラレータ タイプのプロビジョニングを自動的に試行できます。</li><li><a href=\"https://cloud.google.com/compute/docs/instances/spot\">Spot VM</a>: フォールト トレラントなチェックポイント付きバッチジョブ向けに、余剰コンピューティングを大幅な割引価格で提供します。</li></ul><p>詳しくは、ブログ投稿 <a href=\"https://medium.com/google-cloud/never-run-out-of-compute-a-practical-guide-to-gke-resource-obtainability-eab4dea059ca\" target=\"_blank\"><i>コンピューティング リソースの不足を防止する: GKE リソースの入手可能性に関する実践ガイド</i></a> をご覧ください。</p><h3><b>ネットワーキングの選択肢</b></h3><p>アクセラレータのネットワーキング コンポーネントは選択内容によって異なるため、標準ネットワーキング、高速 GPU ネットワーキング（<a href=\"https://docs.cloud.google.com/compute/docs/gpus/gpudirect\">TCPX / TCPXO</a> と<a href=\"https://cloud.google.com/blog/products/networking/rdma-rocev2-for-ai-workloads-on-google-cloud?e=48754805\"> RoCEv2</a>）、TPU ネットワーキング、Cloud Run の 4 つの構成について説明します。</p><p><b>標準ネットワーキング</b></p><ul><li><b>サポートされているアクセラレータ:</b> NVIDIA T4（<a href=\"https://docs.cloud.google.com/compute/docs/gpus#n1-gpus\">N1 シリーズ</a>）、NVIDIA L4（<a href=\"https://docs.cloud.google.com/compute/docs/gpus#l4-gpus\">G2 シリーズ</a>）、NVIDIA A100（<a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a2-vms\">A2 マシンシリーズ</a>のシングルノードとマルチノード）、Cloud TPU v3、<a href=\"https://cloud.google.com/tpu/docs/v5e\"> Cloud TPU v5e</a>（単一ホスト / スタンドアロン スライス）。</li><li><b>アーキテクチャ:</b> ノードは、標準の TCP / IP を介して<a href=\"https://cloud.google.com/vpc/docs/vpc\"> Google Virtual NIC（gVNIC）</a>を使用し、プライマリ<a href=\"https://cloud.google.com/compute/docs/networking/using-gvnic\"> Virtual Private Cloud（VPC）</a>ネットワーク経由で通信します。</li><li><b>ワークロードの適合性:</b> Google Cloud コンピューティング環境間で簡単に移植できます。標準の VPC ルーティングとネットワーク ポリシーを使用し、分散データの前処理、パイプライン ステージの分離、独立した推論レプリカ、コンピュータ ビジョン ワークロードをサポートします。</li></ul><p><b>高速 GPU ネットワーキング（TCPX / TCPXO、RoCEv2）</b></p><p>分散トレーニングとマルチノード推論には、膨大なパラメータ交換と集団通信を処理するための特殊なマルチレール ネットワーク ファブリックが必要です。</p><p><b>GPUDirect-TCPX ファブリックと GPUDirect-TCPXO ファブリック</b></p><ul><li><b>サポートされているアクセラレータ</b>: NVIDIA H100（4 レールの <a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a3-high-vms\">A3 High VM</a>）と NVIDIA H100 Mega（8 レールの <a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a3-mega-vms\">A3 Mega VM</a>）。</li><li><b>アーキテクチャ:</b> カスタムの<a href=\"https://docs.cloud.google.com/compute/docs/gpus/gpudirect#a3-high-and-a3-edge\"> GPUDirect-TCPX</a>（4 つの専用 VPC）と<a href=\"https://docs.cloud.google.com/compute/docs/gpus/gpudirect#a3-mega\"> GPUDirect-TCPXO</a>（8 つの専用 VPC）オフロード エンジンを使用して、ネイティブ RDMA ハードウェアを必要とせずに、標準のイーサネット インフラストラクチャ上で高スループットのマルチレール GPU 通信を実現します。</li><li><b>デプロイ ブループリント:</b> これらのマルチ VPC トポロジは、<a href=\"https://docs.cloud.google.com/cluster-toolkit/docs/setup/cluster-blueprint\">Cluster Toolkit</a> の事前構築済みブループリントを使用するなど、さまざまな方法でデプロイできます。</li></ul><p><b>RoCEv2 ファブリック（VM とベアメタル）</b></p><ul><li><b>サポートされているアクセラレータ</b>: NVIDIA H200（<a href=\"https://docs.cloud.google.com/compute/docs/gpus#h200-gpus\">A3 Ultra VM</a>）、NVIDIA B200（<a href=\"https://docs.cloud.google.com/compute/docs/gpus#b200-gpus\">A4 VM</a>）、NVIDIA GB200 NVL72（<a href=\"https://docs.cloud.google.com/compute/docs/gpus#gb200-gpus\">A4X VM</a>）、NVIDIA GB300（<a href=\"https://docs.cloud.google.com/compute/docs/gpus#gb300-gpus\">A4X Max ベアメタル</a>）。</li><li><b>ゾーン ネットワーク プロファイル:</b> RoCEv2 は、専用のゾーン ネットワーク プロファイルに接続された専用の RDMA VPC 上で動作します。VM インスタンス（A3 Ultra、A4、A4X）は<a href=\"https://docs.cloud.google.com/vpc/docs/rdma-network-profiles#roce-supported-features\"> ZONE-vpc-roce</a> プロファイルを使用し、ベアメタル インスタンス（A4X Max など）は専用の<a href=\"https://docs.cloud.google.com/vpc/docs/rdma-network-profiles#roce-metal-supported-features\"> ZONE-vpc-roce-metal</a> ベアメタル プロファイルを使用します。</li><li><b>レール整列型ファブリック:</b> この専用 VPC は GPU 通信用に厳密に分離されており、アクセラレータ NIC に直接マッピングされたサブネットが含まれています。バックエンドはレール整列型で、ジャンボ フレーム（<a href=\"https://cloud.google.com/vpc/docs/mtu\">MTU 8896</a>）をサポートし、レール間の干渉を最小限に抑えながら、ノンブロッキングのマルチ テラビット帯域幅を実現します。</li><li><b>GKE</b><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/allocate-network-resources-dra\"> <b>Dynamic Resource Allocation Network（DRANET）</b></a>による自動配線: これらの GPU を GKE にデプロイする場合、GKE マネージド DRANET を使用して、追加のネットワークを自動的にプロビジョニングし、RDMA ネットワーク インターフェースを GPU にマッピングするドライバを割り当てることができます。これらは、標準の Kubernetes リソース クレームを使用して、ワークロード Pod に直接割り当てて使用できます。</li><li><b>ターンキー デプロイ</b>: RDMA VPC、MTU チューニング、DRA ドライバなど、このエンドツーエンドのスタック全体を、<a href=\"https://cloud.google.com/cluster-toolkit/docs/overview\">Cluster Toolkit</a> の自動化されたブループリントを使用してデプロイできます。</li></ul><p><b>TPU ネットワーキング</b></p><ul><li><b>サポートされているアクセラレータ</b>:<a href=\"https://cloud.google.com/tpu/docs/v4\"> Cloud TPU v4</a>、<a href=\"https://cloud.google.com/tpu/docs/v5p\">Cloud TPU v5p</a>、<a href=\"https://cloud.google.com/tpu/docs/v5e\">Cloud TPU v5e</a>（マルチホスト Pod スライス）、<a href=\"https://cloud.google.com/tpu/docs/v6e\">Cloud TPU v6e</a>（Trillium）、<a href=\"https://docs.cloud.google.com/tpu/docs/tpu7x\">TPU7x</a>（Ironwood）。</li><li><b>チップ間相互接続（ICI）</b>: TPU Pod またはスライス内では、チップは 2D または 3D トーラス メッシュで構成された専用の超低レイテンシ光リンクを介して直接通信し、従来のネットワーク スタックを完全にバイパスします。</li><li><b>光回線スイッチ</b>（OCS）: TPU v4 と TPU v5p の SuperPod では、ソフトウェアで再構成可能な OCS ユニットが物理ネットワーク トポロジを動的に変更し、障害のあるトレイを迂回して、手動でケーブルを再接続することなく、カスタムサイズのアクセラレータ スライスをプロビジョニングします。</li><li><b>マルチ NIC アーキテクチャ</b>（TPU v6e 以降）: 以前の TPU 世代は、スライス内の ICI とホスト トラフィック用の単一 NIC に依存していましたが、Cloud TPU v6e（Trillium）と TPU7x には、ネイティブのマルチ NIC アーキテクチャが導入されています。このアーキテクチャでは、ワーカーノードが標準の Kubernetes 管理トラフィックをプライマリ VPC に分離し、高スループットの TPU データとクロススライス通信用に構成されたセカンダリ専用 VPC を使用します。</li><li><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/allocate-network-resources-dra#use-non-rdma-interfaces-tpu\"><b>TPU デプロイ用の DRANET</b></a>: これらの TPU を GKE にデプロイする場合、GKE マネージド DRANET を使用して、追加のネットワークを自動的にプロビジョニングし、TPU 通信用にドライバを割り当てることができます。これらは、標準の Kubernetes リソース クレームを使用して、ワークロード Pod に直接割り当てて使用できます。</li><li><b>データセンター ネットワーク（DCN）マルチスライス</b>: 個々の TPU スライスを超えてスケールするモデルの場合、<a href=\"https://docs.cloud.google.com/tpu/docs/multislice-introduction\">Cloud TPU マルチスライス</a>は、これらの専用マルチ NIC パスを利用し、Google の高速 Jupiter データセンター ネットワークを介して複数の独立した ICI メッシュを接続します。</li></ul><p><b>Cloud Run</b></p><ul><li><b>サポートされているアクセラレータ:</b><a href=\"https://cloud.google.com/run/docs/configuring/services/gpu\"> Cloud Run GPU サービス</a>の NVIDIA L4（G2 シリーズ）と NVIDIA RTX PRO 6000（Blackwell）。</li><li><b>ダイレクト VPC 下り（外向き）</b>: <a href=\"https://cloud.google.com/run/docs/configuring/vpc-direct-vpc\">ダイレクト VPC 下り（外向き）</a>を介して 1 分未満で IP を割り当てることで、サーバーレス コンテナをプライベート VPC ネットワークに直接バインドします。これにより、公共のインターネットを経由したり、レガシー コネクタ VM を必要としたりすることなく、内部データレイク、データベース、プライベート API にセキュアかつ低レイテンシでアクセスできます。</li></ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"how-google-cloud-networking-supports-your-fluid-compute-choices-networks\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/how-google-cloud-networking-supports-your-.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>まとめ</b></h3><p>Google Cloud のネットワーキング オプションは、さまざまなアクセラレータ タイプをサポートしています。フルイド コンピューティングを使用する場合、ワークロードのパフォーマンスが最適化されるベストな設計をサポートするようネットワーク設定を調整できます。</p><h3><b>次のステップ</b></h3><p>Google Cloud AI インフラストラクチャとネットワーキング アーキテクチャについて詳しくは、以下のリソースをご覧ください。</p><ul><li>ブログ記事:<a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=48754805&amp;hl=ja\"> AI インフラストラクチャの動的容量管理</a></li><li>チュートリアル:<a href=\"https://discuss.google.dev/t/how-to-build-an-elastic-scalable-llm-inference-platform-on-gke-using-fluid-compute/388108\" target=\"_blank\"> フルイド コンピューティングを使用して GKE 上にエラスティックでスケーラブルな LLM 推論プラットフォームを構築する方法</a></li><li>ブログ記事:<a href=\"https://cloud.google.com/blog/ja/products/networking/how-google-cloud-networking-supports-your-ai-workloads?e=48754805&amp;hl=ja\"> Google Cloud ネットワーキングが AI ワークロードをサポートする仕組み</a></li></ul><p>ご質問やご意見がございましたら、<a href=\"https://www.linkedin.com/in/ammett/\" target=\"_blank\">LinkedIn</a> 経由で筆者までご連絡ください。</p><p><b><i>- デベロッパーリレーションズ エンジニア、Ammett Williams</i></b></p></div>"
  "04d1abfdb740bc834f0e649d693d27a8":
    "id": "04d1abfdb740bc834f0e649d693d27a8"
    "title": "ボーダーレスな Lakehouse を加速: クロスクラウド キャッシュのプレビュー版を発表"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/borderless-lakehouse-cross-cloud-caching-and-connections/"
    "published": "2026-10-02 10:10:00"
    "fetched": "2026-10-02 15:42:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 19 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-cross-cloud-caching-and-connections?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、</span><a href=\"https://cloud.google.com/solutions/data-lakehouse?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレスな Lakehouse</span></a><span style=\"vertical-align: baseline;\"> の機能強化についてお知らせします。これは、データ エンジニア、データ サイエンティスト、そして急速に導入が進む AI エージェントが、管理されたデータをその保存場所で直接クエリできるようにするためのソリューションです。</span></p>\n<p><span style=\"vertical-align: baseline;\">正確な推論を行い、複雑なエンタープライズ ワークフローを自動化するには、あらゆるタイプのエージェントとデータ利用者が、組織のデータ資産すべてに迅速かつ統合的にアクセスできる環境が必要です。そうした環境であれば、クラウドをまたいで顧客レコード、トランザクション ログ、運用テレメトリーを結合することが可能になります。しかし、現代の企業データが 1 か所に収まっていることはほとんどありません。データ資産は、Amazon S3、Azure Data Lake Storage（ADLS）、Google Cloud Storage、オペレーショナル データベース、さらには Salesforce、SAP、Workday などの SaaS プラットフォームに分散しているのが一般的です。これまで、こうした分散したデータセットの統合には、不安定な ETL パイプライン、ストレージの重複、極めて高額なクロスクラウド データ転送費用がつきものでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">組織がクラウドをまたいでデータをクエリして有効活用できるようにするため、</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/introducing-the-borderless-lakehouse?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今年 Google は</span><strong style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレスな Lakehouse を導入</strong></a><span style=\"vertical-align: baseline;\">しました。Apache Iceberg REST カタログ仕様を採用することで、Databricks Unity Catalog、AWS Glue、Snowflake Horizon などのカタログとの直接連携が可能になりました。また、他のクラウド プロバイダへの高帯域幅のプライベート リンクを確立する </span><strong style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect</strong><span style=\"vertical-align: baseline;\"> も導入しました。この接続により、1 ギガバイトあたりの転送費用を公共のインターネットを使用するよりも削減できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回の機能強化では、「そもそもネットワーク経由で転送する必要があるデータの量を最適化する」ことで、マルチクラウドの効率化をさらに一歩進めました。</span></p>\n<p><span style=\"vertical-align: baseline;\">クロスクラウド データのクエリ費用をさらに削減する、2 つの新機能をご紹介します。1 つは、Lakehouse 向けの</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-borderless-lakehouse#intelligent-caching\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">クロスクラウド キャッシュ</strong></a><span style=\"vertical-align: baseline;\">のプレビュー版です。頻繁にアクセスされるデータを Google Cloud 内にローカル キャッシュすることで、ユーザーに意識させることなく BigQuery でのクロスクラウド クエリを高速化し、リモート転送の費用も削減することができます。</span><strong style=\"vertical-align: baseline;\">標準的な Iceberg の列圧縮とクロスクラウドでのキャッシュ保存を組み合わせることで、クラウド間で実際に転送するデータの量を処理データの 5% 未満にまで抑えられることも珍しくありません。</strong><span style=\"vertical-align: baseline;\">これにより、総所有コスト（TCO）を削減して、エンタープライズ規模でのクロスクラウド分析と AI 活用を実現できます。もう 1 つは、</span><strong style=\"vertical-align: baseline;\">BigQuery のクロスクラウド接続</strong><span style=\"vertical-align: baseline;\">のプレビュー版（こちらも提供中）です。この機能を使用すれば、他のクラウドにある Iceberg 以外のデータをクエリしてワークロードを高速化できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">クロスクラウド キャッシュの仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">クロスクラウド キャッシュは、パラメータ調整やストレージ管理を一切必要とすることなくクエリを高速化し、企業が求める高度なパフォーマンスとセキュリティ要件を両立させます。それを実現する内部メカニズムの一部をご紹介します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サブファイル ブロック単位での処理:</strong><span style=\"vertical-align: baseline;\"> Apache Parquet などのカラム型フォーマットでは、クロスクラウド キャッシュはサブファイル ブロック レベルで動作します。そのため、クエリが数列にしかアクセスしない場合、数ギガバイトに及ぶファイル全体をクラウド間で転送する必要がなくなります。BigQuery は、クエリで指定された特定の列チャンクと辞書ページのみをキャッシュ保存します。キャッシュミスが発生すると、BigQuery はクエリに応答するために必要なデータをリモート クラウドから取得し、将来のクエリのためにコピーをローカルにキャッシュ保存します。これにより、繰り返し発生するワークロードのネットワーク転送とレイテンシを大幅に削減できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デフォルトの保存データの暗号化:</strong><span style=\"vertical-align: baseline;\"> キャッシュに保存されたデータブロックは、Google が管理する暗号鍵（GMEK）によってデフォルトで暗号化されます。一時的なキャッシュ ストレージであっても、追加のオーバーヘッドなしで、通常の BigQuery ストレージと同様のエンタープライズ グレードのセキュリティ ポスチャーを維持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">テナントとリージョンの分離:</strong><code style=\"vertical-align: baseline;\"> キャッシュ エントリは、プロジェクトとカタログの境界ごとに厳密に分割され、テナント間でのデータ漏洩を防ぎます。Lakehouse は、ローカル キャッシュとクエリ実行の両方を、指定された Google Cloud リージョン（例: us-east4</code><span style=\"vertical-align: baseline;\">）に厳密に限定します。これにより、リモート クラウドへのクエリ実行時にも、各リージョンのデータ所在地要件への準拠を支援します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">更新頻度チェック:</strong><span style=\"vertical-align: baseline;\"> マルチクラウド キャッシュでは、処理速度と鮮度のトレードオフを強いられることがよくあります。ステイル読み取りを防ぐため、BigQuery はキャッシュに保存されたデータを使用する前にリモート オブジェクトのメタデータを取得して、データが変更されておらず、ユーザーが引き続きアクセスできることを確認します。元データのテーブルが変更されると、BigQuery は新しいファイルをフェッチし、参照されなくなったキャッシュ ブロックは自動的に破棄します。これにより、信頼できる唯一の情報源の正確性を維持しながら、ローカルクエリと同等の速度を実現します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">キャッシュの仕組み、統計カウンタ、リージョンに関する留意事項について詳しくは、Lakehouse の</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-borderless-lakehouse#intelligent-caching\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">インテリジェント キャッシュに関するドキュメント</strong></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">クロスクラウド キャッシュの実際の操作</strong></h4>\n<p><code style=\"vertical-align: baseline;\">では、日常業務において、この仕組みはどのように動作するのでしょうか。例として、e コマースチームが、Databricks Unity Catalog から Lakehouse に統合された Amazon S3 の 10 TiB の Iceberg 売上テーブル（aws_lakehouse_catalog.sales.web_sales）に対してクエリを実行する場合を考えてみましょう。夕方のタイムセールの時間帯（午後 8 時～9 時）には、アナリストが過去の取引データをクエリし、購入意向の強いユーザー層において、どのオンライン店舗がピーク時の取引量と収益を押し上げているかを特定します。</code></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT w.web_name, hd.hd_buy_potential, COUNT(*) AS total_transactions, ROUND(SUM(ws.ws_sales_price), 2) AS total_sales\\r\\nFROM `aws_lakehouse_catalog.sales.web_sales` ws\\r\\n-- Joins household_demographics, time_dim (8:00-9:00 PM), and web_site.\\r\\nGROUP BY w.web_name, hd.hd_buy_potential;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696e994290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">初回実行: コールド状態でのカラム型データ取得</span></p>\n<p><span style=\"vertical-align: baseline;\">この最初のコールド実行では、ローカル キャッシュは空の状態です（</span><code style=\"vertical-align: baseline;\">cacheBytesRead: \"0\"）。BigQuery は、パーティションのプルーニングと列投影を適用して、必要な Parquet バイト範囲のみを Partner Cross-Cloud Interconnect 経由で Amazon S3 から転送します。</code></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;totalBytesProcessed&quot;: &quot;230343464114&quot;,\\r\\n  &quot;objectStorageStats&quot;: [\\r\\n{&quot;cloudProvider&quot;: &quot;AWS&quot;, \\r\\n&quot;objectStorageBytesRead&quot;: &quot;25834740486&quot;, \\r\\n&quot;cacheBytesRead&quot;: &quot;0&quot;}]\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696ea24d10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">処理される論理データ:</strong><span style=\"vertical-align: baseline;\"> BigQuery は、10 TiB のデータセット全体のうち </span><strong style=\"vertical-align: baseline;\">214.5 GiB</strong><span style=\"vertical-align: baseline;\"> を処理します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">標準的な Iceberg の圧縮効率:</strong><span style=\"vertical-align: baseline;\"> Zstandard（</span><strong style=\"vertical-align: baseline;\">zstd</strong><span style=\"vertical-align: baseline;\">）を使用した標準的な Iceberg 列圧縮により、BigQuery が S3 から読み取るのは</span><code style=\"vertical-align: baseline;\">24.1 GiB のみです。これは</code><strong style=\"vertical-align: baseline;\">8.9:1 の圧縮率</strong><code style=\"vertical-align: baseline;\">に相当します。これらのサブファイル Parquet ブロックが Google Cloud に到着すると、BigQuery はそれらのデータをリージョン キャッシュに保存します。</code></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">追加の探索: ディメンションの追加</span></p>\n<p><code style=\"vertical-align: baseline;\">実際には、アナリストやエージェントがまったく同じクエリを 2 回続けて実行することはほとんどありません。フルフィルメントの詳細をさらに深堀りするため、アナリストは配送方法ディメンション（sm.sm_type）</code><span style=\"vertical-align: baseline;\">を追加してクエリを修正します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT w.web_name, sm.sm_type, hd.hd_buy_potential, COUNT(*) AS total_transactions, ROUND(SUM(ws.ws_sales_price), 2) AS total_sales\\r\\nFROM `aws_lakehouse_catalog.sales.web_sales` ws\\r\\nJOIN `aws_lakehouse_catalog.sales.ship_mode` sm ON ws.ws_ship_mode_sk = sm.sm_ship_mode_sk\\r\\n-- Reuses existing joins on household_demographics, time_dim, and web_site.\\r\\nGROUP BY w.web_name, sm.sm_type, hd.hd_buy_potential;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f3f5610&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この後続クエリのジョブ統計は次のようになります。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;totalBytesProcessed&quot;: &quot;287928766472&quot;,\\r\\n  &quot;objectStorageStats&quot;: [\\r\\n{&quot;cloudProvider&quot;: &quot;AWS&quot;, \\r\\n&quot;objectStorageBytesRead&quot;: &quot;1426587648&quot;, \\r\\n&quot;cacheBytesRead&quot;: &quot;25834740486&quot;}]\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696eae7ed0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">94.8% のキャッシュ ヒット率:</strong><span style=\"vertical-align: baseline;\"> BigQuery は、以前にクエリを実行した列の </span><strong style=\"vertical-align: baseline;\">24.1 GiB</strong><span style=\"vertical-align: baseline;\"> をローカル キャッシュから直接返します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最小限のリモート取得:</strong><span style=\"vertical-align: baseline;\"> BigQuery は、新しい </span><code style=\"vertical-align: baseline;\">ws_ship_mode_sk</code><span style=\"vertical-align: baseline;\"> 列と </span><code style=\"vertical-align: baseline;\">ship_mode</code><span style=\"vertical-align: baseline;\"> テーブルを対象に、S3 から </span><strong style=\"vertical-align: baseline;\">1.33 GiB</strong><span style=\"vertical-align: baseline;\"> だけを転送します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サブファイル単位の柔軟性:</strong><span style=\"vertical-align: baseline;\"> キャッシュに保存された列チャンクが再利用されるため、クエリを修正しても新たに必要になったバイトのみが転送されます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ規模で効率性を向上</strong></h4>\n<p><span style=\"vertical-align: baseline;\">クロスクラウド クエリの TCO を検討する際に重要となる、上位 2 つの要素は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">圧縮率: </strong><span style=\"vertical-align: baseline;\">Iceberg でデフォルトの圧縮アルゴリズム（Zstandard / zstd）を使用すると、カラム型データは高い圧縮効果を発揮します。データの圧縮率が 8:1 であると仮定した場合、処理される論理データ 1 TiB ごとに、ネットワーク経由で移動する必要があるデータは約 128 GiB のみとなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">キャッシュ ヒット率: </strong><span style=\"vertical-align: baseline;\">最近アクセスされたデータをネットワーク経由ではなくキャッシュから取得できれば、ネットワーク転送を回避できます。データの 80% がキャッシュ ヒットになると仮定すると、アクセスされる物理データ 100 GiB ごとに、ネットワーク上を移動するデータは 20 GiB のみとなります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらの 2 つの要素と前提条件を掛け合わせると、</span><strong style=\"vertical-align: baseline;\">組織が処理するデータ 1 TiB あたり、ネットワーク経由で転送する必要があるデータ量は約 26 GiB（処理されるデータ全体の 3% 未満）で済みます</strong><span style=\"vertical-align: baseline;\">。この削減効果と Partner Cross-Cloud Interconnect を組み合わせることで、TCO を削減し、ペタバイト規模のクロスクラウド分析や AI 活用を極めて優れた費用対効果で実現できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">BigQuery クロスクラウド接続のプレビュー版を提供開始</strong></h4>\n<p><span style=\"vertical-align: baseline;\">クロスクラウド キャッシュと併せて提供開始となった </span><strong style=\"vertical-align: baseline;\">BigQuery クロスクラウド接続</strong><span style=\"vertical-align: baseline;\">のプレビュー版では、BigQuery を Amazon S3 や Azure Storage のオープン形式データに直接接続することができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">カタログ連携とクロスクラウド接続のどちらを使うべきかの判断基準はシンプルです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">BigQuery のクロスクラウド接続（元ファイル用）:</strong><span style=\"vertical-align: baseline;\"> Iceberg カタログで管理されていないスタンドアロン ファイル（CSV、JSON、アドホックな Parquet）の場合、クロスクラウド接続を利用することで、リモートのバケットパスを直接参照する BigQuery 外部テーブルを作成できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lakehouse カタログ連携（Iceberg 向け）:</strong><span style=\"vertical-align: baseline;\"> Databricks Unity、AWS Glue、Snowflake Horizon などのカタログで管理されている Iceberg データの場合、Lakehouse がスキーマとテーブル スナップショットを自動的に同期します。これにより、ユーザー エクスペリエンスが簡素化され、ユーザーが常に最新のデータに対してクエリを実行できるようになります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">クロスクラウド接続は、他のクラウドのコンピューティング ワーカーではなく、Google Cloud リージョン内の標準 BigQuery コンピューティング ワーカーを使用する、最先端のアーキテクチャを採用しています。このアプローチにより、</span><strong style=\"vertical-align: baseline;\">世界各地のリージョンでの利用</strong><span style=\"vertical-align: baseline;\">が可能になるほか、リモート ファイルでも </span><strong style=\"vertical-align: baseline;\">BigQuery と同等の機能</strong><span style=\"vertical-align: baseline;\">（BigQuery AI や Gemini を含む）が提供されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Lakehouse のクロスクラウド キャッシュ機能は、BigQuery のクロスクラウド接続からクエリされたデータと、Lakehouse カタログ連携のデータの双方に適用されます。接続の作成方法や外部バケットパスへのクエリ実行方法については、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/cross-cloud-connections\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery のクロスクラウド接続の設定に関するドキュメント</strong></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">- グループ プロダクト マネージャー、Will Ochandarena</strong></p>\n<p><strong style=\"vertical-align: baseline;\">- スタッフ ソフトウェア エンジニア、Jason Ganetsky</strong></p></div>"
