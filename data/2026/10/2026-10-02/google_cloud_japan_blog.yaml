    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 19 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/native-bm25-search-in-alloydb-and-cloud-sql?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">ベクトル検索は、生成 AI、検索拡張生成（RAG）、データ エージェント アーキテクチャの重要なコンポーネントですが、ベクトル検索だけでは不十分な場合もあります。ベクトル エンベディングは概念的な意味を理解するのに優れていますが、特定の英数字 ID や正確な商品 SKU 番号を扱うのは苦手です。真に堅牢な検索アプリケーションや AI アプリケーションを構築するには、セマンティック ベクトル検索と従来の完全一致キーワード全文検索を組み合わせる必要があるかもしれません。これは、ハイブリッド検索と呼ばれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">検索において、Best Matching 25（BM25）は、特定のクエリに対するドキュメントの関連性を推定するために使用される重要なアルゴリズムです。これまで、AlloyDB や Cloud SQL で BM25 ランキングを使用するには、全文検索バックエンドを追加する必要がありました。これにより、データサイロ、同期の遅延、運用の複雑化が生じていました。このたび、Tiger Data が作成したオープンソースの</span><a href=\"https://github.com/timescale/pg_textsearch\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><code style=\"text-decoration: underline; vertical-align: baseline;\">pg_textsearch</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> 拡張機能</span></a><span style=\"vertical-align: baseline;\">により、AlloyDB と Cloud SQL for PostgreSQL 17 以降でネイティブ BM25 インデックスのプレビュー版が利用可能になりました。これにより、個別の全文検索バックエンドを維持する手間がなくなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">統合されたハイブリッド検索バックエンドにより、最先端の全文検索を実現するために、個別のシステムをプロビジョニング、管理、または購入する必要がなくなりました。これらはすべて、運用データが保存されているデータベース内で直接行われ、以下を実現します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">業界標準のキーワード ランキング:</strong><span style=\"vertical-align: baseline;\"> Tiger Data の </span><code style=\"vertical-align: baseline;\">pg_textsearch</code><span style=\"vertical-align: baseline;\"> を活用して、C 言語で最適化された超高速の BM25 スコアリングを Postgres テーブルに直接適用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">複雑さを排除し、完全な整合性を実現:</strong><span style=\"vertical-align: baseline;\"> ベクトル検索と全文検索のために複数のバックエンドを維持する場合に発生する、データの重複、ETL パイプライン、同期の遅延を排除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">強化されたセマンティック検索（AlloyDB 限定）:</strong><span style=\"vertical-align: baseline;\"> ScaNN および HNSW インデックス タイプにより、ベクトル検索クエリが（標準の PostgreSQL と比較して）最大 6 倍および 10 倍高速になります。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">pg_textsearch を使用する理由</strong></h3>\n<p><span style=\"vertical-align: baseline;\">PostgreSQL に組み込まれている </span><code style=\"vertical-align: baseline;\">ts_rank を使用して、ある程度の規模で全文検索を行ったことがある方なら、その限界をご存じでしょう。コーパスが大きくなるにつれて、ランキングの品質が低下します。逆文書頻度はサポートされていないため、一般的な単語は珍しい単語と同じ重み付けになります。用語頻度飽和がないため、「データベース」という単語が 50 回出現するドキュメントは、1 回しか出現しないドキュメントよりも上位にランクされます。</code></p>\n<p><span style=\"vertical-align: baseline;\">BM25 は、情報検索のゴールド スタンダードであり、逆文書頻度（珍しい用語ほど重要）、用語頻度飽和（繰り返しに左右されない）、文書長正規化を提供します。Tiger Data の</span><a href=\"https://www.tigerdata.com/blog/pg-textsearch-bm25-full-text-search-postgres\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ投稿</span></a><span style=\"vertical-align: baseline;\">では、PostgreSQL ページで BM25 検索エンジンを構築した方法について詳しく説明しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">全文検索の例</strong></h3>\n<p><code style=\"vertical-align: baseline;\">AlloyDB と Cloud SQL の両方で BM25 全文検索を始める方法をご紹介します。サンプル テーブル cymbal_products を考えてみましょう。このテーブルには、固有識別子 uniq_id、product_name 列、各商品のテキスト説明を含む product_description 列、生成された product_embedding 列が含まれています。cymbal_products</code><span style=\"vertical-align: baseline;\"> には、屋内植物や屋外植物など、さまざまな小売商品に関する情報が含まれています。</span></p>\n<p><span style=\"vertical-align: baseline;\">インデックスの作成</span></p>\n<p><span style=\"vertical-align: baseline;\">BM25 を使用するには、pg_textsearch 拡張機能を有効にします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Install pg_textsearch extension\\r\\nCREATE EXTENSION pg_textsearch;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4c9650&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">cymbal_products</code><span style=\"vertical-align: baseline;\"> テーブルの </span><code style=\"vertical-align: baseline;\">product_description</code><span style=\"vertical-align: baseline;\"> 列にインデックスを作成します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Create the native BM25 index on the content column\\r\\nCREATE INDEX idx_docs_bm25 \\r\\nON cymbal_products \\r\\nUSING bm25 (product_description) \\r\\nWITH (text_config=&#x27;english&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4c8050&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">BM25 全文検索クエリは、&lt;@&gt; 特殊演算子を使用して実行できます。以下のスニペットでは、「cherry tree」を検索しています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Full text search query\\r\\nSELECT product_name, product_description &lt;@&gt; &#x27;cherry tree&#x27; AS bm25_score \\r\\nFROM cymbal_products\\r\\nORDER BY bm25_score \\r\\nLIMIT 5;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4cbe50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">出力例を以下に示します。スコアが低いほど、関連性が高いことを示します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_WmFinfJ.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">AlloyDB ハイブリッド検索の例</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB でハイブリッド検索システムを設定するのは簡単です。同じテーブルにベクトル インデックスとキーワード インデックスの両方を作成し、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search#hybrid-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ハイブリッド検索ユーザー定義関数（UDF）</span></a><span style=\"vertical-align: baseline;\">を使用して結果をシームレスに統合できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ベクトル インデックスの作成</span></p>\n<p><span style=\"vertical-align: baseline;\">ScaNN ベクトル検索インデックスを作成する方法は次のとおりです。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Install vector extension\\r\\nCREATE EXTENSION vector;\\r\\n\\r\\n-- Install scann extension\\r\\nCREATE EXTENSION IF NOT EXISTS alloydb_scann;\\r\\n\\r\\n-- Create scann vector search index \\r\\nCREATE INDEX cymbal_products_embeddings_scann ON cymbal_products USING scann(product_embedding cosine);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4cbdd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ハイブリッド検索</span></p>\n<p><span style=\"vertical-align: baseline;\">AlloyDB には、ハイブリッド検索クエリを非常に簡単に実行できる、すぐに使用可能なハイブリッド検索 UDF が用意されています。UDF は、Reciprocal Rank Fusion（RRF）アルゴリズムを使用して、各検索コンポーネントのランク付けされた結果を 1 つの統合リストにマージします。このクエリは、UDF を利用して、商品説明で「trees that grow taller than houses（家よりも高く成長する木）」のベクトル検索と「California（カリフォルニア）」のキーワード検索を実行します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE EXTENSION google_ml_integration;\\r\\n\\r\\nSELECT *\\r\\nFROM ai.hybrid_search(\\r\\n  search_inputs =&gt; ARRAY[\\r\\n      \\&#x27;{\\r\\n        &quot;data_type&quot;: &quot;vector&quot;,\\r\\n        &quot;weight&quot;: 0.5,\\r\\n        &quot;table_name&quot;: &quot;cymbal_products&quot;,\\r\\n        &quot;key_column&quot;: &quot;uniq_id&quot;,\\r\\n        &quot;vec_column&quot;: &quot;product_embedding&quot;,\\r\\n        &quot;distance_operator&quot;: &quot;public.&lt;=&gt;&quot;,\\r\\n        &quot;limit&quot;: 10,\\r\\n        &quot;query_vector&quot;: &quot;ai.embedding(\\&#x27;\\&#x27;text-embedding-005\\&#x27;\\&#x27;, \\&#x27;\\&#x27;trees that grow taller than houses\\&#x27;\\&#x27;)::vector&quot;\\r\\n      }\\&#x27;::JSONB,\\r\\n      \\&#x27;{\\r\\n        &quot;data_type&quot;: &quot;text&quot;,\\r\\n        &quot;weight&quot;: 0.5,\\r\\n        &quot;table_name&quot;: &quot;cymbal_products&quot;,\\r\\n        &quot;key_column&quot;: &quot;uniq_id&quot;,\\r\\n        &quot;text_column&quot;: &quot;product_description&quot;,\\r\\n        &quot;limit&quot;: 10,\\r\\n        &quot;ranking_function&quot;: &quot;&lt;@&gt;&quot;,\\r\\n        &quot;query_text_input&quot;: &quot;California&quot;\\r\\n      }\\&#x27;::JSONB\\r\\n  ],\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4cb750&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">以下のサンプル出力に示すように、結果は RRF スコアの降順でランク付けされます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_pnhsphx.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ここで、ハイブリッド検索は、セマンティックな直感と正確なキーワード マッチングのギャップを埋めます。ベクトル エンベディングは「家より高く育つ木」のような概念的なクエリの理解に優れていますが、従来の全文検索は「カリフォルニア」のような厳密な識別子に求められるピンポイントの精度を提供します。この 2 つを融合することで、AlloyDB は、アプリケーションが「California Sycamore」のような、地域に関連性の高い具体的な結果をリストの最上位に優先的に表示できるようにします。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Cloud SQL ハイブリッド検索の例</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Cloud SQL では、同じテーブルにベクトル インデックスとキーワード インデックスの両方を作成し、共通テーブル式（CTE）を使用して結果をシームレスに結合し、以下に示すように RRF スコアを統合できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ベクトル インデックスの作成</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud SQL で HNSW インデックスを作成する方法は次のとおりです。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Install vector extension\\r\\nCREATE EXTENSION vector;\\r\\n\\r\\n-- Create an HNSW index on the embedding column for fast approximate nearest neighbor search\\r\\nCREATE INDEX product_hnsw_idx ON cymbal_products USING hnsw(product_embedding vector_cosine_ops);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4cb090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ハイブリッド検索</span></p>\n<p><span style=\"vertical-align: baseline;\">こちらがハイブリッド検索クエリです。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE EXTENSION google_ml_integration;\\r\\n\\r\\n-- BM25 keyword results\\r\\nWITH keyword_results AS (\\r\\n  SELECT uniq_id, product_name, \\r\\n         ROW_NUMBER() OVER (ORDER BY product_description &lt;@&gt; &#x27;California&#x27;) AS rank_kw\\r\\n  FROM cymbal_products\\r\\n  ORDER BY product_description &lt;@&gt; &#x27;California&#x27;\\r\\n  LIMIT 10\\r\\n),\\r\\n-- Semantic vector results\\r\\nsemantic_results AS (\\r\\n  SELECT uniq_id, product_name, \\r\\n         ROW_NUMBER() OVER (ORDER BY product_embedding &lt;=&gt; google_ml.embedding(&#x27;text-embedding-005&#x27;, &#x27;trees that grow taller than houses&#x27;)::vector) AS rank_vec\\r\\n  FROM cymbal_products\\r\\n  ORDER BY product_embedding &lt;=&gt; google_ml.embedding(&#x27;text-embedding-005&#x27;, &#x27;trees that grow taller than houses&#x27;)::vector\\r\\n  LIMIT 10\\r\\n)\\r\\n-- Reciprocal Rank Fusion (RRF) to merge and score both lists\\r\\nSELECT COALESCE(k.uniq_id, s.uniq_id) AS uniq_id,\\r\\n       COALESCE(k.product_name, s.product_name) AS product_name,\\r\\n       COALESCE(1.0 / (60 + k.rank_kw), 0) + COALESCE(1.0 / (60 + s.rank_vec), 0) AS rrf_score\\r\\nFROM keyword_results k\\r\\nFULL OUTER JOIN semantic_results s ON k.uniq_id = s.uniq_id\\r\\nORDER BY rrf_score DESC\\r\\nLIMIT 5;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f696f4c8dd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">結果の出力は、上記の AlloyDB ハイブリッド検索の結果と同じです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">実際の操作を見る</strong></h3>\n<p><span style=\"vertical-align: baseline;\">こちらのデモ動画で、これらの機能がどのように連携するかをご覧ください。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=-JxQb-kjFHk\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Introducing BM25 on AlloyDB &amp; Cloud SQL</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=-JxQb-kjFHk\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">関連リソース </strong></h3>\n<p><code style=\"vertical-align: baseline;\">Google は、Tiger Data と協力できることを大変嬉しく思っています。また、皆さまにネイティブ BM25 サポートを活用いただき、より高速でスマート、かつシンプルな AI アプリケーションを構築していただけることを楽しみにしています。今すぐ pg_textsearch</code><span style=\"vertical-align: baseline;\"> 拡張機能を有効にして、AlloyDB と Cloud SQL で究極のハイブリッド検索エンジンを体験してください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">お試しになりたい場合は、以下のリソースをご確認ください。</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB のリソース</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB をまだご利用でない場合は、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/free-trial-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">30 日間の無料トライアル</span></a><span style=\"vertical-align: baseline;\">で AlloyDB をお試しください</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/choose-index-strategy\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI でベクトル インデックスを選択する</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-bm25-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB BM25 のドキュメント</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search#hybrid-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB ハイブリッド検索 UDF のドキュメント</span></a></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Cloud SQL のリソース </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/sql/docs/postgres/pg-textsearch\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL BM25 のドキュメント</span></a></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.tigerdata.com/blog/pg-textsearch-bm25-full-text-search-postgres\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Tiger Data pg_textsearch リリース ページ</span></a></p>\n</li>\n</ul></div>"
