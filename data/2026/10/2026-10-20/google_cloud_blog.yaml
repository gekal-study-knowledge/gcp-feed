  "05b5ea8b31ed884609999120271b7d9d":
    "id": "05b5ea8b31ed884609999120271b7d9d"
    "title": "Building full virtual vehicles on Google Cloud: From AAOS to the smallest MCU"
    "link": "https://cloud.google.com/blog/topics/manufacturing/building-full-virtual-vehicles-on-google-cloud-from-aaos-to-the-smallest-mcu/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Imagining traditional gearheads getting their hands on software-defined vehicles is an amusing thought experiment. With their socket wrenches and air compressors at the ready, they might be confused to encounter core functions more likely to run on 1s and 0s than oil and belts. But across the auto industry these days, more and more vehicles feature prominent systems built using cloud-native development, continuous integration/continuous delivery, fast digital iteration, and plenty of AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">But there’s still a big gap to be found in many automakers’ and Tier 1 suppliers’ cloud-based development processes. On the one hand, these companies are commonly using software to develop vehicles’ digital entertainment and information screens, or other onboard high-performance computers. </span></p>\n<p><span style=\"vertical-align: baseline;\">On the other, the dozens of microchips and control modules that make a car a car these days — such as gateways, body controllers, zone control units, sensor and actuator nodes — are still frequently hardwired to physical chips when they’re constructed, making them very difficult to update, reprogram, or expand after the vehicle drives off the factory floor. Teams have to wait for benches, samples, and rigs, and integration can easily slip to the end of the development process, where defects are most expensive to fix.</span></p>\n<p><span style=\"vertical-align: baseline;\">This inherent inefficiency has become a leading bottleneck. After all, manufacturers can’t really claim vehicles are software-defined if most of their electronics only function when connected to physical hardware and if developers are leaning heavily on actual hardware.</span></p>\n<p><span style=\"vertical-align: baseline;\">With Horizon, our agentic innovation platform for developing software-defined vehicles, our vision is to help manufacturers avoid these inefficiencies by working with partners like </span><a href=\"https://www.remotivelabs.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveLabs</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The cockpit already runs in the cloud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Android team has invested a significant amount of time and effort over the last few years on enabling seamless development of the many digital systems in vehicles’ cockpits. </span><a href=\"https://source.android.com/docs/automotive\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Automotive OS</span></a><span style=\"vertical-align: baseline;\"> (AAOS) runs inside Google’s official virtual testing environment for Android, </span><a href=\"https://source.android.com/docs/devices/cuttlefish\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cuttlefish</span></a><span style=\"vertical-align: baseline;\">, which itself runs comfortably on</span> <a href=\"https://cloud.google.com/compute/docs/instances/arm-on-compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Arm-based Google Cloud instances</span></a><span style=\"vertical-align: baseline;\">. With this approach, developers can build, boot, and test virtual versions of their infotainment stacks on the same Arm architecture that ships in vehicles.</span></p>\n<p><span style=\"vertical-align: baseline;\">And with the recent launch of </span><a href=\"https://source.android.com/docs/whatsnew/android-17-release#sdv\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android 17 and AAOS SDV</span></a><span style=\"vertical-align: baseline;\">, this capability is also extended to further domains, whenever AAOS SDV is used. Deploying it with Cuttlefish, for example, proves the model: representative software, on representative architecture, in the cloud, on demand. The question that still needs to be answered is how to extend that model to the rest of the vehicle, especially when other operating systems are involved.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The harness around the virtual vehicle</strong></h3>\n<p><span style=\"vertical-align: baseline;\">That’s where </span><a href=\"https://www.remotivelabs.com/products/remotivetopology\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveTopology</span></a><span style=\"vertical-align: baseline;\"> comes into play. As the harness around the virtual vehicle, it’s the layer that connects AAOS in Cuttlefish to a full, simulated electrical and electronic (E/E) architecture: the rest of the vehicle’s onboard computers, its data networks, and the live signals that make the system function like a real vehicle rather than a collection of standalone apps.</span></p>\n<p><span style=\"vertical-align: baseline;\">RemotiveTopology automatically utilizes manufacturers’ existing network design files to build a working, virtual version of their cars’ networks. This is vehicle-as-code: the E/E architecture expressed as an executable specification, versioned and provisioned like infrastructure-as-code. In this way, an entire vehicle can be spun up on demand. Cockpit software talks to the rest of the vehicle exactly as it would in a real vehicle. As a result, developers get full and continuous signal and cross-domain visibility, so they can see real-time system status. And because it is built on standard Linux tooling, the same topology runs on a laptop and in a contiguous integration pipeline on Google Cloud.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Integrate across domains early, not late</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The payoff for using this approach is that all onboard systems can be developed and integrated with software before any of them are connected to a vehicle’s hardware. That’s beneficial because the most difficult (and latest) integration in a vehicle’s development is bringing all its systems together. For example, advanced driver assistance systems (ADAS) produce object lists, trajectories, and mode requests that the cockpit has to render and react to, while the infotainment system and information cluster have to reflect driving state while body and chassis nodes sit in the loop.</span></p>\n<p><span style=\"vertical-align: baseline;\">With the full topology live on Google Cloud, the infotainment system and ADAS can operate simultaneously within a virtual vehicle, exchanging real signals over the simulated network. This means it’s possible to exercise handoffs like an ADAS event surfacing in the cluster or a driver-mode change rippling across domains from day one in continuous integration long before the benches and samples line up. In this way, developers can be confident they’ll discover multi-domain integration long before the end of the process so that they can test continuously from the start.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The full vehicle frontier</strong></h3>\n<p><span style=\"vertical-align: baseline;\">At the heart of this work is a shared desire to bring scalable software development to even the smallest and most common nodes in a vehicle, its microchips and control modules. That’s because these are the parts that have traditionally been wired to hardware, and as a result are the biggest blocker to fully software-defined vehicles.</span></p>\n<p><span style=\"vertical-align: baseline;\">The ultimate goal is that the same software that runs in the cloud can run on vehicles’ actual control modules with no re-tooling or re-validation needed to move between them. That parity is natural with Arm-based Google Cloud infrastructure because the cloud and the car share an instruction set. Google's </span><a href=\"https://cloud.google.com/products/axion\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Axion</span></a><span style=\"vertical-align: baseline;\"> makes it straightforward:</span> <a href=\"https://cloud.google.com/blog/products/compute/axion-based-n4a-vms-now-in-preview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C4A metal, a bare-metal Arm instance</span></a><span style=\"vertical-align: baseline;\">, is provided explicitly for automotive systems development and Android software development, giving direct hardware access without unnecessary software layers and delivering the consistent performance that vehicle systems require.</span></p>\n<p><span style=\"vertical-align: baseline;\">Taken together, this holistic system allows teams, for the first time, to develop and integration-test an entire vehicle’s systems in the cloud and then apply it to the actual vehicle without having to rewrite it.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why now, and where to start</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The payoff is not abstract. Treating the vehicle as code and moving integration into the cloud compresses the slowest, most expensive phase of a program. Early customer engagements with RemotiveLabs have measured more than 10x faster integration cycles. And the development loop is now changing faster than the hardware loop: AI-assisted and agentic workflows can rapidly generate, test, and refine vehicle software, but only virtual systems provide the required scale. Every element that can’t be virtualized can slow the entire development process down.</span></p>\n<p><span style=\"vertical-align: baseline;\">RemotiveTopology provides this architecture as vehicle-as-code and makes it accessible for developers, testers, and autonomous AI agents alike. </span><span style=\"vertical-align: baseline;\">Best of all, there is no new third-party tooling to adopt just to get started. Instead, RemotiveLabs publishes an</span> <a href=\"https://github.com/remotivelabs/remotivelabs-topology-examples\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source simplified vehicle on GitHub</span></a><span style=\"vertical-align: baseline;\"> that anyone can run in minutes on standard Linux tooling and platform definitions already in place. Full existing toolchains plug in as a manufacturer or Tier1 supplier scales, and RemotiveTopology can be easily dropped into an Arm-based Google Cloud environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">For those building software-defined vehicles whose virtual development stops at the cockpit, it’s time to start with an open-source example, bring unique platform definitions, and run an entire vehicle in the cloud. </span><a href=\"https://github.com/GoogleCloudPlatform/horizon-sdv/tree/main/gitops/modules/remotive-topology\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveTopology is available in Horizon</span></a><span style=\"vertical-align: baseline;\"> for easy usage in combination with other Horizon modules.</span></p></div>"
  "f478761ec238b6020cf9b7405b6b1b1b":
    "id": "f478761ec238b6020cf9b7405b6b1b1b"
    "title": "How to Use Python UDF Logging for Pipeline Observability"
    "link": "https://cloud.google.com/blog/products/data-analytics/python-udf-logging-for-pipeline-observability-in-bigquery/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We are announcing  a new </span><a href=\"https://docs.cloud.google.com/bigquery/docs/user-defined-functions-python#use_logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">logging feature </span></a><span style=\"vertical-align: baseline;\">that  is now available in Python User-Defined Function (UDF) in BigQuery. Developers can now use Python’s standard logging library directly inside BigQuery UDFs to emit structured logs seamlessly into Cloud Logging—with zero external plugins or custom connectors required.</span></p>\n<p><span style=\"vertical-align: baseline;\">While UDF logging enables a wide range of operational monitoring and debugging workflows, to demonstrate this feature we are showcasing an example for building fault-tolerant, resilient data pipelines. In the example below, we are capturing row-level diagnostic telemetry during query execution, so that teams can easily isolate problematic records, trigger real-time alerts, and triage issues via SQL without halting entire workloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we’ll show you how to get started with Python UDF logging and walk through an e-commerce event ingestion pipeline as a practical, end-to-end example.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Architecture overview</span></h2></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_D3BL7NE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The workflow consists of three stages:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inline validation</strong><span style=\"vertical-align: baseline;\">: The Python UDF parses incoming JSON payloads. Valid records pass to the destination table; corrupted or non-compliant rows trigger </span><code style=\"vertical-align: baseline;\">logging.error()</code><span style=\"vertical-align: baseline;\"> and return </span><code style=\"vertical-align: baseline;\">NULL</code><span style=\"vertical-align: baseline;\"> to prevent query failure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Real-time alerting</strong><span style=\"vertical-align: baseline;\">: A Cloud Monitoring log-based metric notifies your team when error rates breach SLA thresholds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SQL triage &amp; replay</strong><span style=\"vertical-align: baseline;\">: Data engineers query the quarantined payloads in BigQuery using standard SQL over the linked </span><code style=\"vertical-align: baseline;\">_AllLogs</code><span style=\"vertical-align: baseline;\"> view, diagnose the root cause, and re-ingest recovered data.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Although this specific demonstration relies on Python for data validation and transformation, you can seamlessly integrate Python-driven logging and validation into pipelines that perform SQL-based transformations.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Quickstart walkthrough: Step-by-step</span></h2>\n<h3><span style=\"vertical-align: baseline;\">Step 1: Create the generic Python UDF</span></h3>\n<p><span style=\"vertical-align: baseline;\">This UDF parses JSON and checks for a required field. If parsing fails or the required key is missing, it logs structured diagnostic JSON and returns </span><code style=\"vertical-align: baseline;\">NULL</code><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE OR REPLACE FUNCTION `YOUR_PROJECT.YOUR_DATASET.safe_parse_json`(\\r\\n    raw_payload STRING,\\r\\n    required_key STRING\\r\\n)\\r\\nRETURNS STRING\\r\\nLANGUAGE python\\r\\nOPTIONS (entry_point=\\&#x27;safe_parse_json\\&#x27;, runtime_version=\\&#x27;python-3.11\\&#x27;)\\r\\nAS r\\&#x27;\\&#x27;\\&#x27;\\r\\nimport json\\r\\nimport logging\\r\\n\\r\\ndef safe_parse_json(raw_payload, required_key):\\r\\n    if not raw_payload or raw_payload.strip() == &quot;&quot;:\\r\\n        logging.warning(json.dumps({&quot;error_type&quot;: &quot;EMPTY_PAYLOAD&quot;}))\\r\\n        return None\\r\\n\\r\\n    try:\\r\\n        data = json.loads(raw_payload)\\r\\n        if required_key and (required_key not in data or data[required_key] is None):\\r\\n            logging.error(json.dumps({\\r\\n                &quot;error_type&quot;: &quot;MISSING_REQUIRED_KEY&quot;,\\r\\n                &quot;missing_key&quot;: required_key,\\r\\n                &quot;raw_payload&quot;: raw_payload[:200]\\r\\n            }))\\r\\n            return None\\r\\n        return json.dumps(data)\\r\\n\\r\\n    except Exception as e:\\r\\n        logging.error(json.dumps({\\r\\n            &quot;error_type&quot;: &quot;JSON_SYNTAX_ERROR&quot;,\\r\\n            &quot;error_message&quot;: str(e),\\r\\n            &quot;raw_payload&quot;: raw_payload[:200]\\r\\n        }))\\r\\n        return None\\r\\n\\&#x27;\\&#x27;\\&#x27;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744b3ef550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 2: Run ingestion with logging enabled</span></h3>\n<p><span style=\"vertical-align: baseline;\">In this example, we simulate an e-commerce event ingestion pipeline processing incoming user actions (</span><code style=\"vertical-align: baseline;\">click</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">view</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">checkout</code><span style=\"vertical-align: baseline;\">). Our goal is to extract valid events into our clean analytics table while gracefully quarantining broken or missing-schema payloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">Enable logging in your session with </span><code style=\"vertical-align: baseline;\">SET @@udf.properties</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SET @@udf.properties = JSON \\&#x27;{&quot;enableDebugOutput&quot;: true}\\&#x27;;\\r\\n\\r\\nCREATE OR REPLACE TABLE `YOUR_PROJECT.YOUR_DATASET.clean_events` AS\\r\\nWITH sample_events AS (\\r\\n SELECT \\&#x27;evt_001\\&#x27; AS event_id, \\&#x27;{&quot;user_id&quot;: &quot;usr_101&quot;, &quot;event&quot;: &quot;click&quot;, &quot;amount&quot;: 25.5}\\&#x27; AS raw_data UNION ALL\\r\\n SELECT \\&#x27;evt_002\\&#x27; AS event_id, \\&#x27;corrupted_json{\\&#x27; AS raw_data UNION ALL                                 -- Syntax error\\r\\n SELECT \\&#x27;evt_003\\&#x27; AS event_id, \\&#x27;{&quot;event&quot;: &quot;view&quot;}\\&#x27; AS raw_data UNION ALL                               -- Missing required user_id\\r\\n SELECT \\&#x27;evt_004\\&#x27; AS event_id, \\&#x27;{&quot;user_id&quot;: &quot;usr_102&quot;, &quot;event&quot;: &quot;checkout&quot;, &quot;amount&quot;: 99.0}\\&#x27; AS raw_data\\r\\n),\\r\\nparsed_events AS (\\r\\n SELECT\\r\\n   event_id,\\r\\n   `YOUR_PROJECT.YOUR_DATASET.safe_parse_json`(raw_data, \\&#x27;user_id\\&#x27;) AS validated_json\\r\\n FROM sample_events\\r\\n)\\r\\nSELECT\\r\\n event_id,\\r\\n JSON_VALUE(validated_json, \\&#x27;$.user_id\\&#x27;) AS user_id,\\r\\n JSON_VALUE(validated_json, \\&#x27;$.event\\&#x27;) AS event_name,\\r\\n \\&#x27;VALID\\&#x27; AS status\\r\\nFROM parsed_events\\r\\nWHERE validated_json IS NOT NULL;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744b3ec790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Ingestion Results</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 96.4752%;\"><colgroup><col style=\"width: 24.8377%;\" /><col style=\"width: 22.627%;\" /><col style=\"width: 31.9899%;\" /><col style=\"width: 20.5464%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_id</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">user_id</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_name</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">status</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_001</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_101</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">click</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_004</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_102</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">checkout</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">The query succeeds without interruption while bad rows (2 and 3) are routed to Cloud Logging.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 3: Set up real-time alerts on Cloud Logging</span></h3>\n<p><span style=\"vertical-align: baseline;\">You can configure alerts to notify your on-call team as soon as malformed payloads exceed acceptable thresholds.</span></p>\n<h4><span style=\"vertical-align: baseline;\">In the Google Cloud Console (1-Click)</span></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">In the Google Cloud Console, open </span><strong style=\"vertical-align: baseline;\">Logs Explorer</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Paste the log filter for your UDF routine:</span></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;resource.type=&quot;bigquery.googleapis.com/ManagedRoutineInvocation&quot;\\r\\nseverity&gt;=ERROR&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744aefbb50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. Click </span><strong style=\"vertical-align: baseline;\">Create alert</strong><span style=\"vertical-align: baseline;\"> in the top action bar.</span></p>\n<p><span style=\"vertical-align: baseline;\">4. Set your notification channels (e.g., Slack, PagerDuty, or Email) and save the policy.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 4: Triage bad rows with BigQuery Log Analytics</span></h3>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"Note: To query your logs via BigQuery SQL, ensure you have enabled</span><a href=\"https://cloud.google.com/logging/docs/log-analytics\"><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"font-style: italic; vertical-align: baseline;\">BigQuery Log Analytics</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> on your Cloud Logging bucket and created a linked dataset.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Query the quarantined payloads using BigQuery SQL via the linked </span><code style=\"vertical-align: baseline;\">_AllLogs</code><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">view:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT\\r\\n    timestamp,\\r\\n    severity,\\r\\n    JSON_VALUE(json_payload.error_type) AS error_type,\\r\\n    JSON_VALUE(json_payload.missing_key) AS missing_key,\\r\\n    JSON_VALUE(json_payload.raw_payload) AS raw_payload\\r\\nFROM `YOUR_PROJECT.YOUR_LOGS_LINKED_DATASET._AllLogs`\\r\\nWHERE log_name LIKE &#x27;%managed_routine_output%&#x27;\\r\\nORDER BY timestamp DESC\\r\\nLIMIT 10;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744aefbc50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Log Analytics output</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">timestamp</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">severity</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">error_type</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">missing_key</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">raw_payload</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">2026-09-17 18:35:50</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">ERROR</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">MISSING_REQUIRED_KEY</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">user_id</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">{\"event\": \"view\"}</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">2026-09-17 18:35:50</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">ERROR</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">JSON_SYNTAX_ERROR</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">null</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">corrupted_json{</code></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h2><span style=\"vertical-align: baseline;\">Recovering data</span></h2>\n<p><span style=\"vertical-align: baseline;\">Because full raw payloads are preserved in Cloud Logging, you can recover quarantined records directly with SQL once upstream data is fixed:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 1. Replay and recover quarantined rows from Cloud Logging sink table\\r\\nINSERT INTO `YOUR_PROJECT.YOUR_DATASET.clean_events` (event_id, user_id, event_name, status)\\r\\nSELECT\\r\\n &#x27;evt_003_recovered&#x27; AS event_id,\\r\\n &#x27;default_user&#x27; AS user_id, -- Apply fallback default for the missing field\\r\\n JSON_VALUE(JSON_VALUE(json_payload.raw_payload), &#x27;$.event&#x27;) AS event_name,\\r\\n &#x27;RECOVERED&#x27; AS status\\r\\nFROM `YOUR_PROJECT.YOUR_LOGS_LINKED_DATASET._AllLogs`\\r\\nWHERE JSON_VALUE(json_payload.error_type) = &#x27;MISSING_REQUIRED_KEY&#x27;\\r\\n\\r\\n-- 2. Inspect the final clean destination table\\r\\nSELECT event_id, user_id, event_name, status\\r\\nFROM `YOUR_PROJECT.YOUR_DATASET.clean_events`\\r\\nORDER BY event_id;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744aef9850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Final </span><code style=\"vertical-align: baseline;\">clean_events</code><span style=\"vertical-align: baseline;\"> Table Result:</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 95.4308%;\"><colgroup><col style=\"width: 32.1722%;\" /><col style=\"width: 22.9553%;\" /><col style=\"width: 22.4336%;\" /><col style=\"width: 22.6075%;\" /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_id</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">user_id</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_name</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">status</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_001</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_101</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">click</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_004</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_102</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">checkout</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">evt_003_recovered</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">default_user</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">view</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">RECOVERED</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">All valid and recovered data is now unified in the production table without any data loss.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Other use cases</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Shadow execution &amp; safe migrations</strong><span style=\"vertical-align: baseline;\">: Run legacy and new business logic side-by-side in a UDF. Return the legacy result to production while logging calculation differences to Cloud Logging.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">PII redaction auditing</strong><span style=\"vertical-align: baseline;\">: Mask sensitive tokens (such as SSNs or account numbers) before writing to BigQuery, while emitting anonymized audit events to Cloud Logging.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ML inference drift</strong><span style=\"vertical-align: baseline;\">: Log warnings when embedded scoring logic encounters out-of-vocabulary inputs or low model confidence.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Best practices</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable debug output</strong><span style=\"vertical-align: baseline;\">: Include </span><code style=\"vertical-align: baseline;\">SET @@udf.properties = JSON '{\"enableDebugOutput\": true}';</code><span style=\"vertical-align: baseline;\"> in the session where you want logs captured.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Avoid sensitive data in logs</strong><span style=\"vertical-align: baseline;\">: Cloud Logging is visible to users with Logging Viewer permissions. Do not log credentials or secrets.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cost management</strong><span style=\"vertical-align: baseline;\">: On high-throughput pipelines, log selectively (e.g., only on errors or via sampling) to manage logging ingestion volume.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Getting started</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/bigquery/docs/user-defined-functions-python\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Python UDF Documentation</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/logging/docs/log-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Log Analytics Overview</span></a></p>\n</li>\n</ul></div>"
  "4a0dc8671fd0ac64404dde4a3160853d":
    "id": "4a0dc8671fd0ac64404dde4a3160853d"
    "title": "Developer’s guide to implementing MCP apps in Gemini"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/devs-guide-to-mcp-apps-in-gemini/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Enterprise assistants still respond mostly in text. However, that can break down for visual, multi-step work, where every adjustment costs another slow chat turn.</span></p>\n<p><a href=\"https://github.com/modelcontextprotocol/ext-apps\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Apps</span></a><span style=\"vertical-align: baseline;\"> (</span><span style=\"vertical-align: baseline;\">SEP-1865</span><span style=\"vertical-align: baseline;\">) solves this. This open Model Context Protocol (MCP) extension pairs a tool with a live UI. In </span><a href=\"https://business.gemini.google/?utm_source=cloud.google.com/blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">, that UI renders directly in the chat flow inside a sandboxed iframe, and can expand to fullscreen or a side panel. Edits run locally while the workspace and assistant stay synchronized.</span></p>\n<p><span style=\"vertical-align: baseline;\">You also avoid rebuilding core foundations: Gemini provides workforce sign-in, governed data access, and the Default Assistant, while you host your MCP server on a private </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> service.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why we need MCP Apps</span></h3>\n<p><span style=\"vertical-align: baseline;\">Enterprise assistants have evolved through three generations:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generation 1 (Text chatbots):</strong><span style=\"vertical-align: baseline;\"> Returns static markdown with no interactive controls.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generation 2 (Standard MCP tools):</strong><span style=\"vertical-align: baseline;\"> Invokes live APIs, but outputs static text. Every change requires another model turn.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generation 3 (Interactive MCP Apps):</strong><span style=\"vertical-align: baseline;\"> Pairs each tool with a live workspace. Adjustments happen in the widget without a model turn, while the assistant stays in sync.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Building MCP Apps in Gemini delivers six benefits:</span></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Responsive user experience:</strong><span style=\"vertical-align: baseline;\"> Single-click actions execute directly in the panel without round-tripping through the chat.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Purpose-built workflows:</strong><span style=\"vertical-align: baseline;\"> Deliver visual redaction views for legal review, 3D viewers for CAD, or sensitivity models for finance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise security:</strong><span style=\"vertical-align: baseline;\"> Workforce OAuth sign-in, private Cloud Run ingress, and a sandboxed iframe protect every layer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Human-in-the-loop governance:</strong><span style=\"vertical-align: baseline;\"> Experts inspect and approve high-stakes actions before execution.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Open standard:</strong><span style=\"vertical-align: baseline;\"> Portable across compatible hosts, with automatic text fallback.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Broad connectivity:</strong><span style=\"vertical-align: baseline;\"> Connect to BigQuery, Agent Platform, Cloud Storage, or internal ERP and CRM systems.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">High-level architecture</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-high level architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-high_level_architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Three decoupled tiers work together:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Client browser:</strong><span style=\"vertical-align: baseline;\"> Shows the chat alongside the MCP App widget in the side panel.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise:</strong><span style=\"vertical-align: baseline;\"> The default assistant calls tools, the AppBridge proxy relays widget messages, and the connector manages OAuth.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud (your project):</strong><span style=\"vertical-align: baseline;\"> You deploy and host the MCP server on Cloud Run, which exposes one JSON-RPC endpoint (/mcp), runs background jobs, and serves the single-file HTML widget.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Each tier talks only to its neighbor, letting Gemini Enterprise enforce security and routing.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Authentication with two independent layers</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3-Authentication\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3-Authentication.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Each user signs in through OAuth 2.0. On every call, Gemini Enterprise sends its service agent token alongside the user's OAuth token:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 1 (Cloud Run IAM):</strong><span style=\"vertical-align: baseline;\"> Enforced at Google's edge, this answers </span><span style=\"font-style: italic; vertical-align: baseline;\">\"which service may call?\"</span><span style=\"vertical-align: baseline;\"> Public access is disabled; unauthorized callers receive </span><span style=\"vertical-align: baseline;\">HTTP 403</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 2 (In-App OAuth):</strong><span style=\"vertical-align: baseline;\"> Enforced inside the application, this answers </span><span style=\"font-style: italic; vertical-align: baseline;\">\"which user is calling?\"</span><span style=\"vertical-align: baseline;\"> Failed verification returns </span><span style=\"vertical-align: baseline;\">HTTP 401</span><span style=\"vertical-align: baseline;\">, prompting the user to sign in again.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Cloud Run IAM cannot distinguish end users, so both layers are required. Outbound calls use a least-privilege service account.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Build, deploy on Google Cloud, and register in Gemini Enterprise</span></h3>\n<p><strong style=\"vertical-align: baseline;\">First, </strong><span style=\"vertical-align: baseline;\">build your custom MCP server (exposing POST /mcp and a bundled ui:// HTML widget) using the</span><a href=\"https://github.com/modelcontextprotocol/ext-apps\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Apps SDK</span></a><span style=\"vertical-align: baseline;\">, or use </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\">  to scaffold and deploy your MCP App with this starter prompt:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Build an MCP App for Gemini Enterprise using the create-mcp-app skill (https://github.com/modelcontextprotocol/ext-apps/tree/main/plugins/mcp-apps/skills/create-mcp-app).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Workflow: [describe your input data, side-panel UI controls, and approval or export actions].</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Generate a single-file HTML widget, a Streamable HTTP backend (POST /mcp) with &lt;2s async tool responses and get_app_state polling, and Cloud Run deployment commands (--no-allow-unauthenticated, --no-cpu-throttling, --min-instances=1).</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Once your MCP server code is ready, deploy it to Cloud Run and connect it to Gemini Enterprise</span><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 1: Enable APIs</strong><span style=\"vertical-align: baseline;\"> for Cloud Run, Discovery Engine, Agent Platform, and Organization Policy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 2: Deploy your MCP server container to Cloud Run from source </strong><code style=\"vertical-align: baseline;\">(gcloud run deploy &lt;service&gt; --source .</code><span style=\"vertical-align: baseline;\">)</span><span style=\"vertical-align: baseline;\"> with </span><code style=\"vertical-align: baseline;\">--no-allow-unauthenticated, --no-cpu-throttling</code><span style=\"vertical-align: baseline;\"> so background work does not freeze between polls, and </span><span style=\"vertical-align: baseline;\">--min-instances=1</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 3: Grant the invoker role</strong><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">roles/run.invoker</code><span style=\"vertical-align: baseline;\">) to your Discovery Engine service agent (Layer 1).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Step 4: Create an OAuth 2.0 Web Client</strong><span style=\"vertical-align: baseline;\"> with redirect URI </span><code style=\"vertical-align: baseline;\">https://vertexaisearch.cloud.google.com/oauth-redirect</code><span style=\"vertical-align: baseline;\">(Layer 2).</span></li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 5: </strong><span style=\"vertical-align: baseline;\">Override the </span><code style=\"vertical-align: baseline;\">discoveryengine.managed.disableCustomMcpServerConnector</code><span style=\"vertical-align: baseline;\"> constraint and complete the</span><a href=\"https://cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server#before-you-begin\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Before you begin</span></a><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">prerequisites </span><code style=\"vertical-align: baseline;\">(roles/discoveryengine.editor</code><span style=\"vertical-align: baseline;\"> for the admin,</span><span style=\"vertical-align: baseline;\"> allowedEgressFqdns</span><span style=\"vertical-align: baseline;\"> for your server and OAuth hosts, and</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">custom_mcp</code><span style=\"vertical-align: baseline;\">in</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">allowedDataSources</code><span style=\"vertical-align: baseline;\"> if enforced). Then, in the Google Cloud Console under Gemini Enterprise &gt; Data stores &gt; Create data store, select Custom MCP Server and register the connector:</span></p>\n</li>\n</ul>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 98.1723%;\"><colgroup><col style=\"width: 34.0211%;\" /><col style=\"width: 65.9803%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Configuration field</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Value</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">MCP Server URL</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">https://&lt;your-cloud-run-service&gt;.run.app/mcp</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Authorization URL</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">https://accounts.google.com/o/oauth2/v2/auth</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Token URL</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">https://oauth2.googleapis.com/token</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Client ID and Secret</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Your Web OAuth 2.0 Client ID and Secret</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Scopes</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">openid email profile</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Enable PKCE Support</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Checked (recommended)</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Use HTTP Basic Auth</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Unchecked</strong><span style=\"vertical-align: baseline;\"> (avoids </span><code style=\"vertical-align: baseline;\">invalid_client</code><span style=\"vertical-align: baseline;\"> errors)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 6: </strong><a href=\"https://cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server#enable-actions\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Enable actions</strong></a><span style=\"vertical-align: baseline;\"> on your data store. Gemini Enterprise imports your MCP server's tools as actions and disables them by default. In the Cloud Console, open Gemini Enterprise &gt; Data stores &gt; [Your MCP Data Store] &gt; Actions, click Reload custom actions (which calls</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">tools/list</code><span style=\"vertical-align: baseline;\"> on your server), select your model-visible tools, and click Enable actions.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4-Step 6 enable actions\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4-Step_6_enable_actions.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Step 7: </strong><a href=\"https://cloud.google.com/gemini/enterprise/docs/connectors/connect-existing-data-store\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Connect the data store to your app</strong></a><strong style=\"vertical-align: baseline;\">. </strong><span style=\"vertical-align: baseline;\">Open </span><strong style=\"vertical-align: baseline;\">Gemini Enterprise &gt; Apps &gt; [Your App] &gt; Connected data stores &gt; Add existing data stores</strong><span style=\"vertical-align: baseline;\">, and select your MCP data store. Connecting it as a data store gives the built-in Default Assistant access to your MCP tools and UI widget directly in main chat ( do not use \"Add Agent,\"  which is for external sub-agents rather than MCP data stores).</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5-Step 7 connect datastore\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5-Step_7_connect_datastore.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Build your own</span></h3>\n<p><span style=\"vertical-align: baseline;\">An MCP App pairs backend tools with a live workspace in Gemini Enterprise. You do not build a chat frontend or identity pipeline; you deploy one Cloud Run container and attach it as a Data Store, making Gemini Enterprise where enterprise work gets done.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Try Gemini </strong><a href=\"https://auth.business.gemini.google/login?continueUrl=https://business.gemini.google/?utm_source%3Dcloud.google.com/blog%26referrer%3Dhttps://www.google.com/&amp;wiffid=CAoSJGE0ZDBiMWMwLWVmYTUtNGExNy1iNTUzLWM0ODFmNGY4NmJjNQ\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">here</strong></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Co-build with Google Antigravity </strong><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">here</strong></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build on Google Cloud:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/modelcontextprotocol/ext-apps\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Apps Specification (SEP-1865)</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud AI</span></a><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n</ul></div>"
  "b3a08ef03891da57c6ae3fb74471b289":
    "id": "b3a08ef03891da57c6ae3fb74471b289"
    "title": "Who judges the judge? Three helpful ways to audit your LLM evaluators"
    "link": "https://cloud.google.com/blog/topics/consulting/three-ways-to-audit-your-llm-evaluators/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Is your LLM-as-a-judge truly objective? </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">There’s a common misconception in tech that humans are subjective, so we should rely on AI for objective evaluation. But the reality is that LLMs are also subjective. Just like human reviewers, they can carry biases:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Verbosity bias</strong><span style=\"vertical-align: baseline;\">: LLM judges usually favor </span><a href=\"https://arxiv.org/abs/2411.15594\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">longer, confident-sounding answers</span></a><span style=\"vertical-align: baseline;\">, even when the underlying facts are wrong.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Position bias</strong><span style=\"vertical-align: baseline;\">: Swapping the order of two options can cause an LLM judge to flip its verdict </span><a href=\"https://arxiv.org/abs/2306.05685\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">over 75% of the time</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">The halo effect</strong><span style=\"vertical-align: baseline;\">: Because LLMs generate text piece by piece, </span><a href=\"https://arxiv.org/abs/2411.16337\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">clean grammar and formatting can trick an AI judge</span></a><span style=\"vertical-align: baseline;\"> into giving top marks for accuracy while missing errors.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Agreeableness bias</strong><span style=\"vertical-align: baseline;\">: LLM judges are great at recognizing valid work. But with detecting errors, they may fail to catch incorrect, buggy, or unsafe outputs </span><a href=\"https://arxiv.org/abs/2510.11822\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">up to 75% of the time</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Self-enhancement bias:</strong><span style=\"vertical-align: baseline;\"> Also known as egocentric bias, AI evaluators systematically </span><a href=\"https://arxiv.org/abs/2309.17012\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">overrate outputs that were generated by themselves</span></a><span style=\"vertical-align: baseline;\"> or from their own family.</span></li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Ultimately, LLM judges are not objective arbiters of truth. They are subjective models with their own distinct biases. Treating them as infallible tools that don't need their quality measured might leave your work compromised. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In this post, we’ll explore what’s holding enterprises back from strong evals, and share an easy three-pillar method you can use to improve your quality. </span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Three helpful ways to audit your LLM judges </span></h3>\n<p><strong style=\"vertical-align: baseline;\">Pillar 1: Measure internal stability</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Before you can trust an AI judge’s score, you need to know that it isn't just guessing. Because LLMs are probabilistic, they can be inconsistent, giving different scores to the exact same text.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">You can test this internal stability by running multi-pass consistency checks on a single output and calculating the variance. If a judge's scores fluctuate wildly on identical inputs, its rubric is too ambiguous.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pillar 2: Validate human alignment</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">When your evaluation datasets are mostly valid responses, a lenient AI judge can look great on paper. It might align closely with human reviewers overall, but miss a majority of invalid or even unsafe outputs.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To prove your LLM judge is catching real errors, you need chance-corrected metrics. These mathematical models filter out agreements driven purely by leniency or random chance, showing how closely your evaluator actually aligns with the informed decisions of human experts.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pillar 3: Use multi-judge ensembles</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To avoid the halo effect mentioned earlier, teams should use decomposed prompting. Instead of asking one LLM judge to score an entire response, assign a specialized judge to evaluate a single criteria, like factual accuracy or tone. This isolates traits and forces independent scoring.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Second, to track performance in real time without human intervention, the established best practice is ensembling. This means running at least two different models under the hood to evaluate the exact same output simultaneously. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">By finding the statistical consensus between these models, you can flag if their evaluations begin to diverge and avoid any scoring quality degradation.</span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p style=\"text-align: justify;\"><a href=\"https://cloud.google.com/consulting/innovation-and-transformation?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Partner with Delta</span></a><span style=\"vertical-align: baseline;\"> to design and implement statistically-audited evaluation pipelines for your enterprise agentic systems. </span></p></div>"
"last_updated": "2026-10-20 04:01:59 JST"
