  "05b5ea8b31ed884609999120271b7d9d":
    "id": "05b5ea8b31ed884609999120271b7d9d"
    "title": "Building full virtual vehicles on Google Cloud: From AAOS to the smallest MCU"
    "link": "https://cloud.google.com/blog/topics/manufacturing/building-full-virtual-vehicles-on-google-cloud-from-aaos-to-the-smallest-mcu/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Imagining traditional gearheads getting their hands on software-defined vehicles is an amusing thought experiment. With their socket wrenches and air compressors at the ready, they might be confused to encounter core functions more likely to run on 1s and 0s than oil and belts. But across the auto industry these days, more and more vehicles feature prominent systems built using cloud-native development, continuous integration/continuous delivery, fast digital iteration, and plenty of AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">But there’s still a big gap to be found in many automakers’ and Tier 1 suppliers’ cloud-based development processes. On the one hand, these companies are commonly using software to develop vehicles’ digital entertainment and information screens, or other onboard high-performance computers. </span></p>\n<p><span style=\"vertical-align: baseline;\">On the other, the dozens of microchips and control modules that make a car a car these days — such as gateways, body controllers, zone control units, sensor and actuator nodes — are still frequently hardwired to physical chips when they’re constructed, making them very difficult to update, reprogram, or expand after the vehicle drives off the factory floor. Teams have to wait for benches, samples, and rigs, and integration can easily slip to the end of the development process, where defects are most expensive to fix.</span></p>\n<p><span style=\"vertical-align: baseline;\">This inherent inefficiency has become a leading bottleneck. After all, manufacturers can’t really claim vehicles are software-defined if most of their electronics only function when connected to physical hardware and if developers are leaning heavily on actual hardware.</span></p>\n<p><span style=\"vertical-align: baseline;\">With Horizon, our agentic innovation platform for developing software-defined vehicles, our vision is to help manufacturers avoid these inefficiencies by working with partners like </span><a href=\"https://www.remotivelabs.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveLabs</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The cockpit already runs in the cloud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Android team has invested a significant amount of time and effort over the last few years on enabling seamless development of the many digital systems in vehicles’ cockpits. </span><a href=\"https://source.android.com/docs/automotive\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Automotive OS</span></a><span style=\"vertical-align: baseline;\"> (AAOS) runs inside Google’s official virtual testing environment for Android, </span><a href=\"https://source.android.com/docs/devices/cuttlefish\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cuttlefish</span></a><span style=\"vertical-align: baseline;\">, which itself runs comfortably on</span> <a href=\"https://cloud.google.com/compute/docs/instances/arm-on-compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Arm-based Google Cloud instances</span></a><span style=\"vertical-align: baseline;\">. With this approach, developers can build, boot, and test virtual versions of their infotainment stacks on the same Arm architecture that ships in vehicles.</span></p>\n<p><span style=\"vertical-align: baseline;\">And with the recent launch of </span><a href=\"https://source.android.com/docs/whatsnew/android-17-release#sdv\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android 17 and AAOS SDV</span></a><span style=\"vertical-align: baseline;\">, this capability is also extended to further domains, whenever AAOS SDV is used. Deploying it with Cuttlefish, for example, proves the model: representative software, on representative architecture, in the cloud, on demand. The question that still needs to be answered is how to extend that model to the rest of the vehicle, especially when other operating systems are involved.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The harness around the virtual vehicle</strong></h3>\n<p><span style=\"vertical-align: baseline;\">That’s where </span><a href=\"https://www.remotivelabs.com/products/remotivetopology\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveTopology</span></a><span style=\"vertical-align: baseline;\"> comes into play. As the harness around the virtual vehicle, it’s the layer that connects AAOS in Cuttlefish to a full, simulated electrical and electronic (E/E) architecture: the rest of the vehicle’s onboard computers, its data networks, and the live signals that make the system function like a real vehicle rather than a collection of standalone apps.</span></p>\n<p><span style=\"vertical-align: baseline;\">RemotiveTopology automatically utilizes manufacturers’ existing network design files to build a working, virtual version of their cars’ networks. This is vehicle-as-code: the E/E architecture expressed as an executable specification, versioned and provisioned like infrastructure-as-code. In this way, an entire vehicle can be spun up on demand. Cockpit software talks to the rest of the vehicle exactly as it would in a real vehicle. As a result, developers get full and continuous signal and cross-domain visibility, so they can see real-time system status. And because it is built on standard Linux tooling, the same topology runs on a laptop and in a contiguous integration pipeline on Google Cloud.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Integrate across domains early, not late</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The payoff for using this approach is that all onboard systems can be developed and integrated with software before any of them are connected to a vehicle’s hardware. That’s beneficial because the most difficult (and latest) integration in a vehicle’s development is bringing all its systems together. For example, advanced driver assistance systems (ADAS) produce object lists, trajectories, and mode requests that the cockpit has to render and react to, while the infotainment system and information cluster have to reflect driving state while body and chassis nodes sit in the loop.</span></p>\n<p><span style=\"vertical-align: baseline;\">With the full topology live on Google Cloud, the infotainment system and ADAS can operate simultaneously within a virtual vehicle, exchanging real signals over the simulated network. This means it’s possible to exercise handoffs like an ADAS event surfacing in the cluster or a driver-mode change rippling across domains from day one in continuous integration long before the benches and samples line up. In this way, developers can be confident they’ll discover multi-domain integration long before the end of the process so that they can test continuously from the start.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The full vehicle frontier</strong></h3>\n<p><span style=\"vertical-align: baseline;\">At the heart of this work is a shared desire to bring scalable software development to even the smallest and most common nodes in a vehicle, its microchips and control modules. That’s because these are the parts that have traditionally been wired to hardware, and as a result are the biggest blocker to fully software-defined vehicles.</span></p>\n<p><span style=\"vertical-align: baseline;\">The ultimate goal is that the same software that runs in the cloud can run on vehicles’ actual control modules with no re-tooling or re-validation needed to move between them. That parity is natural with Arm-based Google Cloud infrastructure because the cloud and the car share an instruction set. Google's </span><a href=\"https://cloud.google.com/products/axion\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Axion</span></a><span style=\"vertical-align: baseline;\"> makes it straightforward:</span> <a href=\"https://cloud.google.com/blog/products/compute/axion-based-n4a-vms-now-in-preview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C4A metal, a bare-metal Arm instance</span></a><span style=\"vertical-align: baseline;\">, is provided explicitly for automotive systems development and Android software development, giving direct hardware access without unnecessary software layers and delivering the consistent performance that vehicle systems require.</span></p>\n<p><span style=\"vertical-align: baseline;\">Taken together, this holistic system allows teams, for the first time, to develop and integration-test an entire vehicle’s systems in the cloud and then apply it to the actual vehicle without having to rewrite it.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why now, and where to start</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The payoff is not abstract. Treating the vehicle as code and moving integration into the cloud compresses the slowest, most expensive phase of a program. Early customer engagements with RemotiveLabs have measured more than 10x faster integration cycles. And the development loop is now changing faster than the hardware loop: AI-assisted and agentic workflows can rapidly generate, test, and refine vehicle software, but only virtual systems provide the required scale. Every element that can’t be virtualized can slow the entire development process down.</span></p>\n<p><span style=\"vertical-align: baseline;\">RemotiveTopology provides this architecture as vehicle-as-code and makes it accessible for developers, testers, and autonomous AI agents alike. </span><span style=\"vertical-align: baseline;\">Best of all, there is no new third-party tooling to adopt just to get started. Instead, RemotiveLabs publishes an</span> <a href=\"https://github.com/remotivelabs/remotivelabs-topology-examples\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source simplified vehicle on GitHub</span></a><span style=\"vertical-align: baseline;\"> that anyone can run in minutes on standard Linux tooling and platform definitions already in place. Full existing toolchains plug in as a manufacturer or Tier1 supplier scales, and RemotiveTopology can be easily dropped into an Arm-based Google Cloud environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">For those building software-defined vehicles whose virtual development stops at the cockpit, it’s time to start with an open-source example, bring unique platform definitions, and run an entire vehicle in the cloud. </span><a href=\"https://github.com/GoogleCloudPlatform/horizon-sdv/tree/main/gitops/modules/remotive-topology\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveTopology is available in Horizon</span></a><span style=\"vertical-align: baseline;\"> for easy usage in combination with other Horizon modules.</span></p></div>"
  "f478761ec238b6020cf9b7405b6b1b1b":
    "id": "f478761ec238b6020cf9b7405b6b1b1b"
    "title": "How to Use Python UDF Logging for Pipeline Observability"
    "link": "https://cloud.google.com/blog/products/data-analytics/python-udf-logging-for-pipeline-observability-in-bigquery/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We are announcing  a new </span><a href=\"https://docs.cloud.google.com/bigquery/docs/user-defined-functions-python#use_logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">logging feature </span></a><span style=\"vertical-align: baseline;\">that  is now available in Python User-Defined Function (UDF) in BigQuery. Developers can now use Python’s standard logging library directly inside BigQuery UDFs to emit structured logs seamlessly into Cloud Logging—with zero external plugins or custom connectors required.</span></p>\n<p><span style=\"vertical-align: baseline;\">While UDF logging enables a wide range of operational monitoring and debugging workflows, to demonstrate this feature we are showcasing an example for building fault-tolerant, resilient data pipelines. In the example below, we are capturing row-level diagnostic telemetry during query execution, so that teams can easily isolate problematic records, trigger real-time alerts, and triage issues via SQL without halting entire workloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we’ll show you how to get started with Python UDF logging and walk through an e-commerce event ingestion pipeline as a practical, end-to-end example.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Architecture overview</span></h2></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_D3BL7NE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The workflow consists of three stages:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inline validation</strong><span style=\"vertical-align: baseline;\">: The Python UDF parses incoming JSON payloads. Valid records pass to the destination table; corrupted or non-compliant rows trigger </span><code style=\"vertical-align: baseline;\">logging.error()</code><span style=\"vertical-align: baseline;\"> and return </span><code style=\"vertical-align: baseline;\">NULL</code><span style=\"vertical-align: baseline;\"> to prevent query failure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Real-time alerting</strong><span style=\"vertical-align: baseline;\">: A Cloud Monitoring log-based metric notifies your team when error rates breach SLA thresholds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SQL triage &amp; replay</strong><span style=\"vertical-align: baseline;\">: Data engineers query the quarantined payloads in BigQuery using standard SQL over the linked </span><code style=\"vertical-align: baseline;\">_AllLogs</code><span style=\"vertical-align: baseline;\"> view, diagnose the root cause, and re-ingest recovered data.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Although this specific demonstration relies on Python for data validation and transformation, you can seamlessly integrate Python-driven logging and validation into pipelines that perform SQL-based transformations.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Quickstart walkthrough: Step-by-step</span></h2>\n<h3><span style=\"vertical-align: baseline;\">Step 1: Create the generic Python UDF</span></h3>\n<p><span style=\"vertical-align: baseline;\">This UDF parses JSON and checks for a required field. If parsing fails or the required key is missing, it logs structured diagnostic JSON and returns </span><code style=\"vertical-align: baseline;\">NULL</code><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE OR REPLACE FUNCTION `YOUR_PROJECT.YOUR_DATASET.safe_parse_json`(\\r\\n    raw_payload STRING,\\r\\n    required_key STRING\\r\\n)\\r\\nRETURNS STRING\\r\\nLANGUAGE python\\r\\nOPTIONS (entry_point=\\&#x27;safe_parse_json\\&#x27;, runtime_version=\\&#x27;python-3.11\\&#x27;)\\r\\nAS r\\&#x27;\\&#x27;\\&#x27;\\r\\nimport json\\r\\nimport logging\\r\\n\\r\\ndef safe_parse_json(raw_payload, required_key):\\r\\n    if not raw_payload or raw_payload.strip() == &quot;&quot;:\\r\\n        logging.warning(json.dumps({&quot;error_type&quot;: &quot;EMPTY_PAYLOAD&quot;}))\\r\\n        return None\\r\\n\\r\\n    try:\\r\\n        data = json.loads(raw_payload)\\r\\n        if required_key and (required_key not in data or data[required_key] is None):\\r\\n            logging.error(json.dumps({\\r\\n                &quot;error_type&quot;: &quot;MISSING_REQUIRED_KEY&quot;,\\r\\n                &quot;missing_key&quot;: required_key,\\r\\n                &quot;raw_payload&quot;: raw_payload[:200]\\r\\n            }))\\r\\n            return None\\r\\n        return json.dumps(data)\\r\\n\\r\\n    except Exception as e:\\r\\n        logging.error(json.dumps({\\r\\n            &quot;error_type&quot;: &quot;JSON_SYNTAX_ERROR&quot;,\\r\\n            &quot;error_message&quot;: str(e),\\r\\n            &quot;raw_payload&quot;: raw_payload[:200]\\r\\n        }))\\r\\n        return None\\r\\n\\&#x27;\\&#x27;\\&#x27;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744b3ef550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 2: Run ingestion with logging enabled</span></h3>\n<p><span style=\"vertical-align: baseline;\">In this example, we simulate an e-commerce event ingestion pipeline processing incoming user actions (</span><code style=\"vertical-align: baseline;\">click</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">view</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">checkout</code><span style=\"vertical-align: baseline;\">). Our goal is to extract valid events into our clean analytics table while gracefully quarantining broken or missing-schema payloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">Enable logging in your session with </span><code style=\"vertical-align: baseline;\">SET @@udf.properties</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SET @@udf.properties = JSON \\&#x27;{&quot;enableDebugOutput&quot;: true}\\&#x27;;\\r\\n\\r\\nCREATE OR REPLACE TABLE `YOUR_PROJECT.YOUR_DATASET.clean_events` AS\\r\\nWITH sample_events AS (\\r\\n SELECT \\&#x27;evt_001\\&#x27; AS event_id, \\&#x27;{&quot;user_id&quot;: &quot;usr_101&quot;, &quot;event&quot;: &quot;click&quot;, &quot;amount&quot;: 25.5}\\&#x27; AS raw_data UNION ALL\\r\\n SELECT \\&#x27;evt_002\\&#x27; AS event_id, \\&#x27;corrupted_json{\\&#x27; AS raw_data UNION ALL                                 -- Syntax error\\r\\n SELECT \\&#x27;evt_003\\&#x27; AS event_id, \\&#x27;{&quot;event&quot;: &quot;view&quot;}\\&#x27; AS raw_data UNION ALL                               -- Missing required user_id\\r\\n SELECT \\&#x27;evt_004\\&#x27; AS event_id, \\&#x27;{&quot;user_id&quot;: &quot;usr_102&quot;, &quot;event&quot;: &quot;checkout&quot;, &quot;amount&quot;: 99.0}\\&#x27; AS raw_data\\r\\n),\\r\\nparsed_events AS (\\r\\n SELECT\\r\\n   event_id,\\r\\n   `YOUR_PROJECT.YOUR_DATASET.safe_parse_json`(raw_data, \\&#x27;user_id\\&#x27;) AS validated_json\\r\\n FROM sample_events\\r\\n)\\r\\nSELECT\\r\\n event_id,\\r\\n JSON_VALUE(validated_json, \\&#x27;$.user_id\\&#x27;) AS user_id,\\r\\n JSON_VALUE(validated_json, \\&#x27;$.event\\&#x27;) AS event_name,\\r\\n \\&#x27;VALID\\&#x27; AS status\\r\\nFROM parsed_events\\r\\nWHERE validated_json IS NOT NULL;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744b3ec790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Ingestion Results</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 96.4752%;\"><colgroup><col style=\"width: 24.8377%;\" /><col style=\"width: 22.627%;\" /><col style=\"width: 31.9899%;\" /><col style=\"width: 20.5464%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_id</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">user_id</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_name</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">status</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_001</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_101</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">click</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_004</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_102</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">checkout</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">The query succeeds without interruption while bad rows (2 and 3) are routed to Cloud Logging.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 3: Set up real-time alerts on Cloud Logging</span></h3>\n<p><span style=\"vertical-align: baseline;\">You can configure alerts to notify your on-call team as soon as malformed payloads exceed acceptable thresholds.</span></p>\n<h4><span style=\"vertical-align: baseline;\">In the Google Cloud Console (1-Click)</span></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">In the Google Cloud Console, open </span><strong style=\"vertical-align: baseline;\">Logs Explorer</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Paste the log filter for your UDF routine:</span></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;resource.type=&quot;bigquery.googleapis.com/ManagedRoutineInvocation&quot;\\r\\nseverity&gt;=ERROR&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744aefbb50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. Click </span><strong style=\"vertical-align: baseline;\">Create alert</strong><span style=\"vertical-align: baseline;\"> in the top action bar.</span></p>\n<p><span style=\"vertical-align: baseline;\">4. Set your notification channels (e.g., Slack, PagerDuty, or Email) and save the policy.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step 4: Triage bad rows with BigQuery Log Analytics</span></h3>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"Note: To query your logs via BigQuery SQL, ensure you have enabled</span><a href=\"https://cloud.google.com/logging/docs/log-analytics\"><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"font-style: italic; vertical-align: baseline;\">BigQuery Log Analytics</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> on your Cloud Logging bucket and created a linked dataset.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Query the quarantined payloads using BigQuery SQL via the linked </span><code style=\"vertical-align: baseline;\">_AllLogs</code><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">view:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT\\r\\n    timestamp,\\r\\n    severity,\\r\\n    JSON_VALUE(json_payload.error_type) AS error_type,\\r\\n    JSON_VALUE(json_payload.missing_key) AS missing_key,\\r\\n    JSON_VALUE(json_payload.raw_payload) AS raw_payload\\r\\nFROM `YOUR_PROJECT.YOUR_LOGS_LINKED_DATASET._AllLogs`\\r\\nWHERE log_name LIKE &#x27;%managed_routine_output%&#x27;\\r\\nORDER BY timestamp DESC\\r\\nLIMIT 10;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744aefbc50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Log Analytics output</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">timestamp</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">severity</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">error_type</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">missing_key</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">raw_payload</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">2026-09-17 18:35:50</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">ERROR</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">MISSING_REQUIRED_KEY</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">user_id</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">{\"event\": \"view\"}</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">2026-09-17 18:35:50</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">ERROR</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">JSON_SYNTAX_ERROR</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">null</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">corrupted_json{</code></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h2><span style=\"vertical-align: baseline;\">Recovering data</span></h2>\n<p><span style=\"vertical-align: baseline;\">Because full raw payloads are preserved in Cloud Logging, you can recover quarantined records directly with SQL once upstream data is fixed:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 1. Replay and recover quarantined rows from Cloud Logging sink table\\r\\nINSERT INTO `YOUR_PROJECT.YOUR_DATASET.clean_events` (event_id, user_id, event_name, status)\\r\\nSELECT\\r\\n &#x27;evt_003_recovered&#x27; AS event_id,\\r\\n &#x27;default_user&#x27; AS user_id, -- Apply fallback default for the missing field\\r\\n JSON_VALUE(JSON_VALUE(json_payload.raw_payload), &#x27;$.event&#x27;) AS event_name,\\r\\n &#x27;RECOVERED&#x27; AS status\\r\\nFROM `YOUR_PROJECT.YOUR_LOGS_LINKED_DATASET._AllLogs`\\r\\nWHERE JSON_VALUE(json_payload.error_type) = &#x27;MISSING_REQUIRED_KEY&#x27;\\r\\n\\r\\n-- 2. Inspect the final clean destination table\\r\\nSELECT event_id, user_id, event_name, status\\r\\nFROM `YOUR_PROJECT.YOUR_DATASET.clean_events`\\r\\nORDER BY event_id;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f744aef9850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Final </span><code style=\"vertical-align: baseline;\">clean_events</code><span style=\"vertical-align: baseline;\"> Table Result:</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 95.4308%;\"><colgroup><col style=\"width: 32.1722%;\" /><col style=\"width: 22.9553%;\" /><col style=\"width: 22.4336%;\" /><col style=\"width: 22.6075%;\" /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_id</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">user_id</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">event_name</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">status</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_001</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_101</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">click</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">evt_004</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usr_102</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">checkout</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">VALID</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">evt_003_recovered</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">default_user</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">view</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">RECOVERED</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">All valid and recovered data is now unified in the production table without any data loss.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Other use cases</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Shadow execution &amp; safe migrations</strong><span style=\"vertical-align: baseline;\">: Run legacy and new business logic side-by-side in a UDF. Return the legacy result to production while logging calculation differences to Cloud Logging.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">PII redaction auditing</strong><span style=\"vertical-align: baseline;\">: Mask sensitive tokens (such as SSNs or account numbers) before writing to BigQuery, while emitting anonymized audit events to Cloud Logging.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ML inference drift</strong><span style=\"vertical-align: baseline;\">: Log warnings when embedded scoring logic encounters out-of-vocabulary inputs or low model confidence.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Best practices</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable debug output</strong><span style=\"vertical-align: baseline;\">: Include </span><code style=\"vertical-align: baseline;\">SET @@udf.properties = JSON '{\"enableDebugOutput\": true}';</code><span style=\"vertical-align: baseline;\"> in the session where you want logs captured.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Avoid sensitive data in logs</strong><span style=\"vertical-align: baseline;\">: Cloud Logging is visible to users with Logging Viewer permissions. Do not log credentials or secrets.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cost management</strong><span style=\"vertical-align: baseline;\">: On high-throughput pipelines, log selectively (e.g., only on errors or via sampling) to manage logging ingestion volume.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Getting started</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/bigquery/docs/user-defined-functions-python\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Python UDF Documentation</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/logging/docs/log-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Log Analytics Overview</span></a></p>\n</li>\n</ul></div>"
  "4a0dc8671fd0ac64404dde4a3160853d":
    "id": "4a0dc8671fd0ac64404dde4a3160853d"
    "title": "Developer’s guide to implementing MCP apps in Gemini"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/devs-guide-to-mcp-apps-in-gemini/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Enterprise assistants still respond mostly in text. However, that can break down for visual, multi-step work, where every adjustment costs another slow chat turn.</span></p>\n<p><a href=\"https://github.com/modelcontextprotocol/ext-apps\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Apps</span></a><span style=\"vertical-align: baseline;\"> (</span><span style=\"vertical-align: baseline;\">SEP-1865</span><span style=\"vertical-align: baseline;\">) solves this. This open Model Context Protocol (MCP) extension pairs a tool with a live UI. In </span><a href=\"https://business.gemini.google/?utm_source=cloud.google.com/blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">, that UI renders directly in the chat flow inside a sandboxed iframe, and can expand to fullscreen or a side panel. Edits run locally while the workspace and assistant stay synchronized.</span></p>\n<p><span style=\"vertical-align: baseline;\">You also avoid rebuilding core foundations: Gemini provides workforce sign-in, governed data access, and the Default Assistant, while you host your MCP server on a private </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> service.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why we need MCP Apps</span></h3>\n<p><span style=\"vertical-align: baseline;\">Enterprise assistants have evolved through three generations:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generation 1 (Text chatbots):</strong><span style=\"vertical-align: baseline;\"> Returns static markdown with no interactive controls.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generation 2 (Standard MCP tools):</strong><span style=\"vertical-align: baseline;\"> Invokes live APIs, but outputs static text. Every change requires another model turn.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generation 3 (Interactive MCP Apps):</strong><span style=\"vertical-align: baseline;\"> Pairs each tool with a live workspace. Adjustments happen in the widget without a model turn, while the assistant stays in sync.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Building MCP Apps in Gemini delivers six benefits:</span></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Responsive user experience:</strong><span style=\"vertical-align: baseline;\"> Single-click actions execute directly in the panel without round-tripping through the chat.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Purpose-built workflows:</strong><span style=\"vertical-align: baseline;\"> Deliver visual redaction views for legal review, 3D viewers for CAD, or sensitivity models for finance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise security:</strong><span style=\"vertical-align: baseline;\"> Workforce OAuth sign-in, private Cloud Run ingress, and a sandboxed iframe protect every layer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Human-in-the-loop governance:</strong><span style=\"vertical-align: baseline;\"> Experts inspect and approve high-stakes actions before execution.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Open standard:</strong><span style=\"vertical-align: baseline;\"> Portable across compatible hosts, with automatic text fallback.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Broad connectivity:</strong><span style=\"vertical-align: baseline;\"> Connect to BigQuery, Agent Platform, Cloud Storage, or internal ERP and CRM systems.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">High-level architecture</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-high level architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-high_level_architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Three decoupled tiers work together:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Client browser:</strong><span style=\"vertical-align: baseline;\"> Shows the chat alongside the MCP App widget in the side panel.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise:</strong><span style=\"vertical-align: baseline;\"> The default assistant calls tools, the AppBridge proxy relays widget messages, and the connector manages OAuth.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud (your project):</strong><span style=\"vertical-align: baseline;\"> You deploy and host the MCP server on Cloud Run, which exposes one JSON-RPC endpoint (/mcp), runs background jobs, and serves the single-file HTML widget.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Each tier talks only to its neighbor, letting Gemini Enterprise enforce security and routing.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Authentication with two independent layers</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3-Authentication\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3-Authentication.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Each user signs in through OAuth 2.0. On every call, Gemini Enterprise sends its service agent token alongside the user's OAuth token:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 1 (Cloud Run IAM):</strong><span style=\"vertical-align: baseline;\"> Enforced at Google's edge, this answers </span><span style=\"font-style: italic; vertical-align: baseline;\">\"which service may call?\"</span><span style=\"vertical-align: baseline;\"> Public access is disabled; unauthorized callers receive </span><span style=\"vertical-align: baseline;\">HTTP 403</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 2 (In-App OAuth):</strong><span style=\"vertical-align: baseline;\"> Enforced inside the application, this answers </span><span style=\"font-style: italic; vertical-align: baseline;\">\"which user is calling?\"</span><span style=\"vertical-align: baseline;\"> Failed verification returns </span><span style=\"vertical-align: baseline;\">HTTP 401</span><span style=\"vertical-align: baseline;\">, prompting the user to sign in again.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Cloud Run IAM cannot distinguish end users, so both layers are required. Outbound calls use a least-privilege service account.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Build, deploy on Google Cloud, and register in Gemini Enterprise</span></h3>\n<p><strong style=\"vertical-align: baseline;\">First, </strong><span style=\"vertical-align: baseline;\">build your custom MCP server (exposing POST /mcp and a bundled ui:// HTML widget) using the</span><a href=\"https://github.com/modelcontextprotocol/ext-apps\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Apps SDK</span></a><span style=\"vertical-align: baseline;\">, or use </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\">  to scaffold and deploy your MCP App with this starter prompt:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Build an MCP App for Gemini Enterprise using the create-mcp-app skill (https://github.com/modelcontextprotocol/ext-apps/tree/main/plugins/mcp-apps/skills/create-mcp-app).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Workflow: [describe your input data, side-panel UI controls, and approval or export actions].</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Generate a single-file HTML widget, a Streamable HTTP backend (POST /mcp) with &lt;2s async tool responses and get_app_state polling, and Cloud Run deployment commands (--no-allow-unauthenticated, --no-cpu-throttling, --min-instances=1).</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Once your MCP server code is ready, deploy it to Cloud Run and connect it to Gemini Enterprise</span><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 1: Enable APIs</strong><span style=\"vertical-align: baseline;\"> for Cloud Run, Discovery Engine, Agent Platform, and Organization Policy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 2: Deploy your MCP server container to Cloud Run from source </strong><code style=\"vertical-align: baseline;\">(gcloud run deploy &lt;service&gt; --source .</code><span style=\"vertical-align: baseline;\">)</span><span style=\"vertical-align: baseline;\"> with </span><code style=\"vertical-align: baseline;\">--no-allow-unauthenticated, --no-cpu-throttling</code><span style=\"vertical-align: baseline;\"> so background work does not freeze between polls, and </span><span style=\"vertical-align: baseline;\">--min-instances=1</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 3: Grant the invoker role</strong><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">roles/run.invoker</code><span style=\"vertical-align: baseline;\">) to your Discovery Engine service agent (Layer 1).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Step 4: Create an OAuth 2.0 Web Client</strong><span style=\"vertical-align: baseline;\"> with redirect URI </span><code style=\"vertical-align: baseline;\">https://vertexaisearch.cloud.google.com/oauth-redirect</code><span style=\"vertical-align: baseline;\">(Layer 2).</span></li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 5: </strong><span style=\"vertical-align: baseline;\">Override the </span><code style=\"vertical-align: baseline;\">discoveryengine.managed.disableCustomMcpServerConnector</code><span style=\"vertical-align: baseline;\"> constraint and complete the</span><a href=\"https://cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server#before-you-begin\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Before you begin</span></a><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">prerequisites </span><code style=\"vertical-align: baseline;\">(roles/discoveryengine.editor</code><span style=\"vertical-align: baseline;\"> for the admin,</span><span style=\"vertical-align: baseline;\"> allowedEgressFqdns</span><span style=\"vertical-align: baseline;\"> for your server and OAuth hosts, and</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">custom_mcp</code><span style=\"vertical-align: baseline;\">in</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">allowedDataSources</code><span style=\"vertical-align: baseline;\"> if enforced). Then, in the Google Cloud Console under Gemini Enterprise &gt; Data stores &gt; Create data store, select Custom MCP Server and register the connector:</span></p>\n</li>\n</ul>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 98.1723%;\"><colgroup><col style=\"width: 34.0211%;\" /><col style=\"width: 65.9803%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Configuration field</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Value</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">MCP Server URL</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">https://&lt;your-cloud-run-service&gt;.run.app/mcp</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Authorization URL</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">https://accounts.google.com/o/oauth2/v2/auth</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Token URL</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">https://oauth2.googleapis.com/token</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Client ID and Secret</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Your Web OAuth 2.0 Client ID and Secret</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Scopes</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">openid email profile</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Enable PKCE Support</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Checked (recommended)</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Use HTTP Basic Auth</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Unchecked</strong><span style=\"vertical-align: baseline;\"> (avoids </span><code style=\"vertical-align: baseline;\">invalid_client</code><span style=\"vertical-align: baseline;\"> errors)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Step 6: </strong><a href=\"https://cloud.google.com/gemini/enterprise/docs/connectors/custom-mcp-server/set-up-custom-mcp-server#enable-actions\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Enable actions</strong></a><span style=\"vertical-align: baseline;\"> on your data store. Gemini Enterprise imports your MCP server's tools as actions and disables them by default. In the Cloud Console, open Gemini Enterprise &gt; Data stores &gt; [Your MCP Data Store] &gt; Actions, click Reload custom actions (which calls</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">tools/list</code><span style=\"vertical-align: baseline;\"> on your server), select your model-visible tools, and click Enable actions.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4-Step 6 enable actions\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4-Step_6_enable_actions.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Step 7: </strong><a href=\"https://cloud.google.com/gemini/enterprise/docs/connectors/connect-existing-data-store\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Connect the data store to your app</strong></a><strong style=\"vertical-align: baseline;\">. </strong><span style=\"vertical-align: baseline;\">Open </span><strong style=\"vertical-align: baseline;\">Gemini Enterprise &gt; Apps &gt; [Your App] &gt; Connected data stores &gt; Add existing data stores</strong><span style=\"vertical-align: baseline;\">, and select your MCP data store. Connecting it as a data store gives the built-in Default Assistant access to your MCP tools and UI widget directly in main chat ( do not use \"Add Agent,\"  which is for external sub-agents rather than MCP data stores).</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5-Step 7 connect datastore\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5-Step_7_connect_datastore.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Build your own</span></h3>\n<p><span style=\"vertical-align: baseline;\">An MCP App pairs backend tools with a live workspace in Gemini Enterprise. You do not build a chat frontend or identity pipeline; you deploy one Cloud Run container and attach it as a Data Store, making Gemini Enterprise where enterprise work gets done.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Try Gemini </strong><a href=\"https://auth.business.gemini.google/login?continueUrl=https://business.gemini.google/?utm_source%3Dcloud.google.com/blog%26referrer%3Dhttps://www.google.com/&amp;wiffid=CAoSJGE0ZDBiMWMwLWVmYTUtNGExNy1iNTUzLWM0ODFmNGY4NmJjNQ\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">here</strong></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Co-build with Google Antigravity </strong><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">here</strong></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build on Google Cloud:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/modelcontextprotocol/ext-apps\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Apps Specification (SEP-1865)</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud AI</span></a><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n</ul></div>"
  "b3a08ef03891da57c6ae3fb74471b289":
    "id": "b3a08ef03891da57c6ae3fb74471b289"
    "title": "Who judges the judge? Three helpful ways to audit your LLM evaluators"
    "link": "https://cloud.google.com/blog/topics/consulting/three-ways-to-audit-your-llm-evaluators/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:01:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Is your LLM-as-a-judge truly objective? </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">There’s a common misconception in tech that humans are subjective, so we should rely on AI for objective evaluation. But the reality is that LLMs are also subjective. Just like human reviewers, they can carry biases:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Verbosity bias</strong><span style=\"vertical-align: baseline;\">: LLM judges usually favor </span><a href=\"https://arxiv.org/abs/2411.15594\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">longer, confident-sounding answers</span></a><span style=\"vertical-align: baseline;\">, even when the underlying facts are wrong.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Position bias</strong><span style=\"vertical-align: baseline;\">: Swapping the order of two options can cause an LLM judge to flip its verdict </span><a href=\"https://arxiv.org/abs/2306.05685\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">over 75% of the time</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">The halo effect</strong><span style=\"vertical-align: baseline;\">: Because LLMs generate text piece by piece, </span><a href=\"https://arxiv.org/abs/2411.16337\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">clean grammar and formatting can trick an AI judge</span></a><span style=\"vertical-align: baseline;\"> into giving top marks for accuracy while missing errors.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Agreeableness bias</strong><span style=\"vertical-align: baseline;\">: LLM judges are great at recognizing valid work. But with detecting errors, they may fail to catch incorrect, buggy, or unsafe outputs </span><a href=\"https://arxiv.org/abs/2510.11822\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">up to 75% of the time</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Self-enhancement bias:</strong><span style=\"vertical-align: baseline;\"> Also known as egocentric bias, AI evaluators systematically </span><a href=\"https://arxiv.org/abs/2309.17012\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">overrate outputs that were generated by themselves</span></a><span style=\"vertical-align: baseline;\"> or from their own family.</span></li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Ultimately, LLM judges are not objective arbiters of truth. They are subjective models with their own distinct biases. Treating them as infallible tools that don't need their quality measured might leave your work compromised. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In this post, we’ll explore what’s holding enterprises back from strong evals, and share an easy three-pillar method you can use to improve your quality. </span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Three helpful ways to audit your LLM judges </span></h3>\n<p><strong style=\"vertical-align: baseline;\">Pillar 1: Measure internal stability</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Before you can trust an AI judge’s score, you need to know that it isn't just guessing. Because LLMs are probabilistic, they can be inconsistent, giving different scores to the exact same text.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">You can test this internal stability by running multi-pass consistency checks on a single output and calculating the variance. If a judge's scores fluctuate wildly on identical inputs, its rubric is too ambiguous.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pillar 2: Validate human alignment</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">When your evaluation datasets are mostly valid responses, a lenient AI judge can look great on paper. It might align closely with human reviewers overall, but miss a majority of invalid or even unsafe outputs.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To prove your LLM judge is catching real errors, you need chance-corrected metrics. These mathematical models filter out agreements driven purely by leniency or random chance, showing how closely your evaluator actually aligns with the informed decisions of human experts.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pillar 3: Use multi-judge ensembles</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To avoid the halo effect mentioned earlier, teams should use decomposed prompting. Instead of asking one LLM judge to score an entire response, assign a specialized judge to evaluate a single criteria, like factual accuracy or tone. This isolates traits and forces independent scoring.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Second, to track performance in real time without human intervention, the established best practice is ensembling. This means running at least two different models under the hood to evaluate the exact same output simultaneously. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">By finding the statistical consensus between these models, you can flag if their evaluations begin to diverge and avoid any scoring quality degradation.</span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p style=\"text-align: justify;\"><a href=\"https://cloud.google.com/consulting/innovation-and-transformation?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Partner with Delta</span></a><span style=\"vertical-align: baseline;\"> to design and implement statistically-audited evaluation pipelines for your enterprise agentic systems. </span></p></div>"
  "0b9f710e80d67657076f3b327642083e":
    "id": "0b9f710e80d67657076f3b327642083e"
    "title": "TorchTPU is now open source: Run native PyTorch on TPUs"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus/"
    "published": "2026-10-20 20:30:00"
    "fetched": "2026-10-20 23:40:58"
    "summary": "<div class=\"block-paragraph\"><p>Today at PyTorch Conference 2026, we announced a range of new products and integrations designed to help you run PyTorch effectively on Google Cloud or in your own infrastructure. Notably, TorchTPU, our native PyTorch stack for Google TPUs, is now available as open source on GitHub. With TorchTPU, TPUs join GPUs and CPUs as a native option for PyTorch. You can now train, serve, and deploy models on TPUs using the tools you already rely on, including vLLM, SGLang, llm-d, TorchTitan, Ray, TorchRec, Hugging Face, LiteRT. Ultimately, this provides our customers choice across a broad range of workload-optimized computing options including TPUs, GPUs, and CPUs, with a consistent, open software and operational model across the full portfolio.</p><h3><b>Run PyTorch code natively on TPUs</b></h3><p>Co-developed with the PyTorch team at Meta, <a href=\"https://github.com/google-pytorch/torch_tpu\" target=\"_blank\">TorchTPU</a> lets you run existing PyTorch workloads on TPUs with minimal code changes, using the familiar APIs. TorchTPU lets you debug your models with eager mode, then transition to production-level performance via torch.compile to optimize TPU utilization and reduce memory overhead. By supporting standard PyTorch APIs, advanced diagnostics, and native distributed primitives out of the box, TorchTPU unlocks high performance and operational efficiency from day one.</p></div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">\"</span><span style=\"font-style: italic; vertical-align: baseline;\">At Meta, advancing the frontier of AI requires immense compute scale and deep hardware diversity</span><span style=\"vertical-align: baseline;\">. </span><span style=\"font-style: italic; vertical-align: baseline;\">We cannot be constrained by a single hardware architecture. TorchTPU is a massive step forward — allowing us to co-develop hardware flexibly with the core machine learning systems team while supporting major LLM, Ads, and Recommendation systems workloads on key production use cases. It enables us to deploy our PyTorch workloads to Google TPUs, provide direct feedback to the engineering teams, and build the ecosystem flexibility everyone needs.</span><span style=\"vertical-align: baseline;\">\"- Jana van Greunen, Director of PyTorch Engineering, Meta</span></p></div>\n<div class=\"block-paragraph\"><p>We also partnered with Hugging Face so that popular open-weight models across the Hugging Face Hub run natively on TorchTPU. In Transformers v5, deploying models to TPUs is now as simple as passing <code>device_map=\"tpu\"</code>. The Diffusers library runs natively on TPUs with support for eager mode, torch.compile, and tensor parallelism to scale large generative models across multiple accelerators. To maintain consistent reliability, we also built dedicated CI/CD pipelines for continuous nightly testing of the Hugging Face Transformers suite on TPU infrastructure.</p></div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Hugging Face is committed to being an open, neutral platform where AI builders can choose the models, frameworks and hardware that work best for them. Hardware diversity is essential to making open-source AI accessible to everyone. Our collaboration with Google to bring native TorchTPU support to our core libraries, including Transformers, puts that commitment into practice. Together, we’re making it easier for the community to run popular models from the Hub efficiently on Google Cloud TPUs using familiar PyTorch workflows. Giving developers more choice in how and where they build helps the entire open-source ecosystem grow.”</span><span style=\"vertical-align: baseline;\"> - Jeff Boudier, VP Product, Hugging Face</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=u4n558Ul6w0\">\n\n      \n        <img alt=\"Watch Introducing TorchTPU: Native PyTorch on Google Cloud TPUs to learn more\" src=\"https://img.youtube.com/vi/u4n558Ul6w0/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=u4n558Ul6w0\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Optimizing inference</b></h3><p>As reasoning and agentic models scale, inference cost and latency become the primary bottlenecks in production. We’ve integrated TorchTPU into widely used open-source serving engines and paired them with Kubernetes-native fleet routing across TPUs and GPUs to help you optimize throughput per dollar.</p><p>This foundation allows developers to scale workloads across diverse hardware while minimizing the friction of platform-specific tuning. To bring these framework-level enhancements to life in production, we have collaborated with leading open-source communities and industry partners. In the sections below, we explore how these partnerships are driving breakthrough efficiency across high-throughput serving with vLLM, structured agentic execution with SGLang, and large-scale distributed fleet orchestration with llm-d.</p><p></p></div>\n<div class=\"block-paragraph_advanced\"><div>\n<div class=\"Draftail-block--unstyled\">\n<h4 class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span style=\"text-decoration: underline;\">vLLM: High-throughput serving and memory efficiency</span></h4>\n</div>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Developed in partnership with Inferact, the native PyTorch </span><a class=\"TooltipEntity\" href=\"https://github.com/vllm-project/vllm-torchtpu\" rel=\"noopener\" target=\"_blank\"><span>vLLM</span></a><span> backend on TorchTPU enables developers to deploy open-weight models directly on TPUs with optimized, production-ready serving features and custom Pallas kernels. This integration supports continuous batching, quantization, and multi-chip parallelism on TPU hardware, while preserving upstream worker models, schedulers, and API servers to improve cost-performance ratios, without requiring changes to existing inference stacks.</span></div>\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"> </div>\n</div>\n</div>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">\"</span><span style=\"font-style: italic; vertical-align: baseline;\">Our mission at Inferact has always been to make high-performance inference accessible, reliable, and cost-effective across the entire AI ecosystem. We are thrilled to partner on the launch of TorchTPU and bring first-class support for vLLM to TPUs. By bridging PyTorch’s optimized TPU capabilities directly into vLLM, developers can immediately run production workloads on TPUs with the high throughput, low latency, and memory efficiency they expect from our stack.</span><span style=\"vertical-align: baseline;\">\" - Simon Mo, CEO and co-founder, Inferact</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"text-decoration: underline; vertical-align: baseline;\">SGLang: Accelerating agentic and structured workloads</span></h4>\n<p><span style=\"vertical-align: baseline;\">Developed in partnership with RadixArk, our native PyTorch backend for </span><a href=\"https://github.com/sgl-project/sglang-torchtpu/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SGLang</span></a><span style=\"vertical-align: baseline;\"> accelerates highly structured and agentic workloads on TPUs. SGLang uses RadixAttention to reuse KV cache across requests, allowing repeated prompt prefixes to skip recomputation entirely. SGLang-TorchTPU preserves upstream worker models, schedulers, and API servers, using a disaggregation transfer backend that also acts as the I/O backend for HiCache to optimize latency and throughput for complex multi-step generation.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">\"</span><span style=\"font-style: italic; vertical-align: baseline;\">At RadixArk, TorchTPU has supercharged our development velocity as we roll out SGLang support across diverse silicon. It’s given us a painless path to native TPU acceleration, passing massive efficiency gains and flexible compute choices directly down to our customers.</span><span style=\"vertical-align: baseline;\">\" - Banghua Zhu, CTO and co-founder, RadixArk</span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d for distributed LLM inference</span></h4>\n<p><span style=\"vertical-align: baseline;\">To run inference engines across large fleets, we are releasing llm-d 1.0 with Red Hat, IBM, and a community of more than 500 contributors and 25 organizations. As a Cloud Native Computing Foundation (CNCF) Sandbox project, llm-d connects two open-source communities: PyTorch, where vLLM and SGLang serve models, and Kubernetes, where distributed systems run and scale in production. The llm-d router sends each request to the replica that already holds its context, using prefix-cache-aware routing. It also splits compute-heavy prefill from memory-heavy decode. llm-d 1.0 makes that ready for production with multi-tenant flow control, router high availability, stable v1 APIs, and session-aware routing for agents. On Google Kubernetes Engine (GKE), you can have the choice of running on either GPUs or Google TPUs, with a common llm-d endpoint, and choose the hardware that fits each workload.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">\"</span><span style=\"font-style: italic; vertical-align: baseline;\">At Zenteiq, we use GKE Inference Gateway powered by llm-d to accelerate synthetic data generation for our sovereign Scientific Foundation Models. By leveraging load-aware and prefix-cache-aware routing, we have achieved over 4× higher aggregate inference throughput, increasing daily generated token capacity from 1.47 billion to 5.97 billion tokens per 1,000 TPU v6e accelerators. The open-source foundation of llm-d, integrated with GKE, enables us to efficiently serve multiple model families at scale without developing and maintaining a custom inference scheduler.</span><span style=\"vertical-align: baseline;\">\" - Prof. Sashikumaar Ganesan, Founder, Zenteiq.ai</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Training at scale</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Scaling PyTorch training across thousands of accelerators requires fault-tolerant, compile-aware distributed frameworks. We have integrated TorchTPU into the PyTorch community’s core training, reinforcement learning (RL), and orchestration frameworks.</span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">TorchTitan: Distributed high performance training at scale</span></h4>\n<p><a href=\"https://github.com/google-pytorch/torchtitan\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TorchTitan</span></a><span style=\"vertical-align: baseline;\"> is the PyTorch-native reference implementation for scalable distributed training and features a production-grade integration with TorchTPU. By connecting to PyTorch's </span><span style=\"vertical-align: baseline;\">torch.compile</span><span style=\"vertical-align: baseline;\"> and TorchTitan’s compile friendly SimpleFSDP, specialized Pallas kernels, and graph-level optimizations, developers can build and train models on TPUs with high efficiency at scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">TorchTitan provides recipes for pre-training large dense models (such as Llama 3 70B/405B, Qwen 3 8B/32B, and MuseGlimmer 30B), Mixture-of-Experts (MoE) such as Qwen 3 235B, and diffusion transformers (such as FLUX.1 12B), and has been validated running with up to 8000 Ironwood TPUs (TPU v7x). Beyond initial pre-training, TorchTitan serves as the scalable trainer inside post-training pipelines like VeRL for Group Relative Policy Optimization (GRPO) and RL alignment.</span><span style=\"vertical-align: baseline;\">To test large-scale efficiency on demanding open architectures, TorchTPU’s training paths via TorchTitan demonstrated up to 52% Model Flops Utilization (MFU) on Qwen 3 8B, showing near-linear scaling and stability across up to 8,192 Ironwood TPUs.</span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">VeRL: Scalable post-training and reinforcement learning in preview</span></h4>\n<p><span style=\"vertical-align: baseline;\">RL is a foundational technique for frontier labs that are advancing model capabilities, as well as for enterprises customizing models for domain-specific tasks. Yet, orchestrating distributed RL workloads remains one of the most complex challenges in modern AI infrastructure. Bridging that gap, </span><a href=\"https://github.com/verl-project/verl/tree/main/examples/tpu/grpo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VeRL</span></a><span style=\"vertical-align: baseline;\"> has quickly become one of the most popular RL frameworks, supporting everything from verifiable math and coding rewards, to multi-turn agentic tool use at massive scale. </span></p>\n<p><span style=\"vertical-align: baseline;\">To help expand hardware choice for this thriving community, we upstreamed a TPU backend and an end-to-end reference recipe to VeRL. Built on a disaggregated trainer-sampler architecture designed to maximize training efficiency, our GRPO reference recipe on mathematical reasoning datasets demonstrates how developers can deploy VeRL workloads on TPUs while preserving their existing, hardware-agnostic model and algorithm code. </span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray: Orchestrating heterogenous compute</span></h4>\n<p><span style=\"vertical-align: baseline;\">We’ve also added native TorchTPU support to </span><a href=\"https://github.com/ray-project/ray\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray</span></a><span style=\"vertical-align: baseline;\">, enabling you to orchestrate PyTorch data processing, training, RL, and serving across CPUs, GPUs, and TPUs within a single workflow. With a few lines of resource configuration, you can schedule each stage of a heterogeneous AI pipeline onto the accelerator best suited for the job.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">“</span><span style=\"font-style: italic; vertical-align: baseline;\">At Ray Summit we talked about the PARK stack, PyTorch, AI models, Ray, and Kubernetes, because that's what teams are building production AI on today. TorchTPU embeds Google TPUs directly in that industry-standard stack. We've also worked closely with the Google team to support TPUs as a first-class accelerator in Ray. Coupled with native PyTorch support, teams can now seamlessly develop, scale, and monitor their workloads on TPUs.</span><span style=\"vertical-align: baseline;\">\" - Edward Oakes, Chief Architect, Anyscale</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Deployment flexibility and operational efficiency</strong></h3>\n<p><span style=\"vertical-align: baseline;\">True portability requires standardizing deployment tools across different hardware profiles, including edge devices and cloud accelerators.</span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteRT joins the PyTorch Ecosystem</span></h4>\n<p><span style=\"vertical-align: baseline;\">Many PyTorch models need to run on phones, laptops, browsers, and embedded devices. Today, </span><a href=\"https://github.com/google-ai-edge/litert\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteRT</span></a><span style=\"vertical-align: baseline;\"> (formerly TensorFlow Lite), Google's high-performance on-device AI inference, joins the PyTorch ecosystem. </span></p>\n<p><span style=\"vertical-align: baseline;\">With </span><a href=\"https://github.com/google-ai-edge/litert-torch\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteRT-Torch</span></a><span style=\"vertical-align: baseline;\">, you convert a PyTorch model with a single </span><code style=\"vertical-align: baseline;\">litert-torch.convert()</code><span style=\"vertical-align: baseline;\"> call. It builds on</span><code style=\"vertical-align: baseline;\"> torch.export()</code><span style=\"vertical-align: baseline;\"> and Core ATen operators, so your model code stays in PyTorch. For LLMs, LiteRT Torch exports Hugging Face Transformer models to run with </span><a href=\"https://github.com/google-ai-edge/LiteRT-LM\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteRT-LM</span></a><span style=\"vertical-align: baseline;\">. The converted models run on Android, iOS, macOS, Windows, Linux, web, and IoT devices, with hardware acceleration across CPUs (via XNNPack), GPUs (via open source </span><a href=\"https://developers.googleblog.com/ml-drift-next-gen-gpu-aiml-inference-at-the-edge/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ML Drift</span></a><span style=\"vertical-align: baseline;\">), and NPUs from major chipsets provided through a single API. </span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU agent suite in early preview</span></h4>\n<p><span style=\"vertical-align: baseline;\">To expand Pytorch adoption on TPUs, we are announcing that the </span><a href=\"https://github.com/google-pytorch/tpu-agent-suite\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU agent suite</span></a><span style=\"vertical-align: baseline;\"> is in preview on GitHub. Integrating through plug-ins with several coding harness-model combinations, the TPU agent suite helps automate onboarding, diagnostics, user questions, and inference performance tuning for many PyTorch models. </span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=hK3xqW_HrP0\">\n\n      \n        <img alt=\"Watch Introducing the TPU agent suite (preview): Open-source agents for PyTorch on Cloud TPU to learn more\" src=\"https://img.youtube.com/vi/hK3xqW_HrP0/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=hK3xqW_HrP0\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Get started with PyTorch on Google Cloud</b></h3><p>Together, these releases reinforce our commitment to making the Google TPU software ecosystem an open, developer-friendly environment for the PyTorch community. By bringing native TPU support upstream into the PyTorch stack across TorchTPU, Hugging Face, vLLM, SGLang, llm-d, TorchTitan, VeRL, and Ray — and contributing LiteRT to the PyTorch Ecosystem — we are giving you the flexibility to build, adapt, and scale AI on your terms.</p><p>Visit the <a href=\"https://cloud.google.com/tpu/docs/pytorch-on-tpu\">Google Cloud documentation</a> to get started running PyTorch on TPUs today.</p></div>"
  "cdce3edae16b5ad3c03d4fbfb3ed811b":
    "id": "cdce3edae16b5ad3c03d4fbfb3ed811b"
    "title": "Announcing llm-d 1.0: Open distributed inference for agents on Google Cloud TPUs and GPUs"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/llm-d-1-0-an-open-source-stack-for-distributed-inference/"
    "published": "2026-10-20 20:30:00"
    "fetched": "2026-10-20 23:40:58"
    "summary": "<div class=\"block-paragraph\"><p>Today at the PyTorch Conference, we released llm-d 1.0, an open-source, Kubernetes-native stack for distributed LLM inference. Co-founded by Google with Red Hat, IBM and others, we worked with a community of more than 500 contributors over 25 organizations on this Cloud Native Computing Foundation (CNCF) Sandbox project, bringing together two important communities: PyTorch, where vLLM and SGLang serve models, and Kubernetes, where distributed systems run and scale in production.</p><p>llm-d 1.0 arrives at a time when agents are changing the nature of inference. A year ago, most inference traffic was chat: one prompt in, one response out. Today, workloads are shifting to multi-step agents and reinforcement learning (RL) rollouts that fan out across tools, share long prefixes, and arrive in bursts. Serving them on a single machine — or behind a generic round-robin load balancer — breaks down fast. Replicas recompute the same prompts, accelerator memory fills up with duplicate state, and one bursty agent loop can stall interactive users.</p><p>llm-d solves this for teams serving their own models by turning a cluster of model servers into a coordinated serving pool. During the PyTorch Conference keynote, we showed this in action with 1,000 sandboxed agents on <a href=\"https://cloud.google.com/blog/products/containers-kubernetes/bringing-you-agent-sandbox-on-gke-and-agent-substrate\">Agent Substrate on GKE</a> hitting a single llm-d endpoint across vLLM, SGLang, and a mixed fleet of Google Cloud TPUs and GPUs. As traffic scaled across the three stages below, cache-aware routing and tiered KV cache kept each agent's steps on the replicas holding its context, while flow control queued bursty agent loops so interactive requests stayed fast.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Figure 1 - llm-d 1.0 distributed inference architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Figure_1_-_llm-d_1.0_distributed_infer.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Evolution of distributed inference from round-robin load balancing to cache-aware routing, tiered KV cache, and priority flow control in llm-d 1.0</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>What 1.0 provides</b></h3><p>llm-d already delivered prefix- and load-aware routing, KV cache offloading, prefill/decode disaggregation, wide expert parallelism and batch inference across Google Cloud TPUs and GPUs. These capabilities provide:</p><ul><li><b>Multi-tenant quality of service.</b> Priority and fairness-aware routing via llm-d flow control, helping latency-sensitive requests and bursty agent workloads share a fleet to meet SLOs without starving one another.</li><li><b>A stable foundation.</b> v1 APIs and a hardened request path, validated on multiple clouds and accelerator types.</li><li><b>Safer upgrades.</b> Router high availability and zero-downtime updates, alongside <a href=\"https://llm-d.ai/docs/dev/architecture/model-server-orchestration/disaggregatedset\" target=\"_blank\">DisaggregatedSet</a>, which orchestrates prefill/decode-aware rolling updates without dropping context or disrupting active sessions.</li><li><b>Agent-aware serving.</b> Session-aware routing, turn-priority scheduling, and native Responses API state, helping agents reuse context across turns.</li><li><b>Expanded TPU integration</b>. Native PyTorch model serving with TorchTPU co-operative time-slicing to raise throughput and utilization across Google Cloud TPU fleets.</li></ul><p>The components are designed so that you can compose them into your own bespoke production environment. Keep your engine, model and cluster, and adopt only the serving components and configurations you need.</p><h3><b>llm-d under the hood</b></h3><p>Across the areas below, Google engineers worked with the llm-d community to connect upstream Kubernetes primitives, PyTorch serving engines, and accelerator-aware scheduling into a composable stack.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Figure 2 - llm-d 1.0 and TorchTPU stack on GKE\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Figure_2_-_llm-d_1.0_and_TorchTPU_stac.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: Multi-node llm-d orchestration and single-node TorchTPU model engines on Google Kubernetes Engine and Google TPUs</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>One endpoint, many accelerators</b></p><p>An agent fleet is not one workload. Interactive turns need low latency, background loops and reinforcement learning (RL) rollouts need high throughput, and demand swings by the minute. llm-d puts your accelerator pools behind a single endpoint, with one router, one KV cache index, and one flow-control policy in front of the whole fleet. Agents call a single API; the router picks the replica for each step and keeps a session's context on the replicas that already hold it. Adding capacity, mixing accelerator generations, or moving a model to a different pool becomes a platform change, not an agent rewrite. <a href=\"https://developers.googleblog.com/torchtpu-running-pytorch-natively-on-tpus-at-google-scale/\" target=\"_blank\">TorchTPU</a> brings Google Cloud TPUs into that fleet, running PyTorch models natively inside upstream vLLM and SGLang without model rewrites. For more, see the <a href=\"https://llm-d.ai/docs/dev/infrastructure/providers/gke#tpu-configuration\" target=\"_blank\">llm-d on Google Kubernetes Engine (GKE) TPU guide</a>.</p><p><b>Routing that remembers context</b></p><p>The llm-d router builds on Gateway API Inference, the Kubernetes project for inference-optimized routing that we launched. On GKE, <a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway#llm-d-router\">GKE Inference Gateway</a> runs the llm-d router as a managed service, simplifying installation and management and <a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway\">extending routing across regions</a>. The router tracks the replicas holding each cached prefix and weighs load and predicted latency when it picks one. When accelerator memory fills up, rather than dropping it, llm-d uses vLLM’s OffloadingConnector, Mooncake, or SGLang’s HiCache to move KV cache to host memory and then to SSD or Google Cloud Managed Lustre. This setup helps prevent prefix-eviction storms under heavy, multi-turn, and long-context conversational loads across mixed TPU and GPU fleets.</p><p>On an agentic coding workload on Ironwood TPU (TPU 7x), prefix-aware routing plus host memory offload cut median time-to-first-token (TTFT) by more than 85% and raised total throughput 2.4x versus a plain Kubernetes Service, as of October 2026 (<a href=\"https://github.com/llm-d/llm-d/blob/main/guides/models/qwen3-coder-480b/README.md\" target=\"_blank\">source</a>).</p><p><b>Disaggregation that upgrades safely</b></p><p>Prefill is compute-heavy and decode is memory-bound, so running both on the same replicas makes each wait on the other. llm-d runs prefill, decode, and multimodal encode as separate pools, with wide expert parallelism spreading large mixture-of-experts models across nodes. In 1.0, <a href=\"https://llm-d.ai/docs/dev/architecture/model-server-orchestration/disaggregatedset\" target=\"_blank\">DisaggregatedSet</a> — built on LeaderWorkerSet, the Kubernetes API for multi-host inference that we started — manages these pools as one unit. Rolling updates move prefill and decode together on matching versions while each phase scales independently. For more, see the <a href=\"https://llm-d.ai/docs/well-lit-paths/foundations/pd-disaggregation\" target=\"_blank\">disaggregated serving guide</a>.</p><p><b>Async inference that runs alongside real-time inference</b></p><p>For latency-tolerant traffic, llm-d 1.0 introduces <a href=\"https://github.com/llm-d/llm-d-async\" target=\"_blank\">llm-d-async-processor</a>, which pulls requests from queues like Google Cloud Pub/Sub or Redis and routes them alongside real-time traffic. Using queue and pool-dispatch gates, the processor checks available capacity and enforces strict priority lanes and quotas so background jobs run in slack capacity without starving interactive users.</p><p><b>Time-slicing to put idle RL capacity to work</b></p><p>During RL training, accelerators often sit idle 40% to 60% of the time during rollout generation or weight updates. llm-d now supports <a href=\"https://github.com/llm-d-incubation/llm-d-rl-time-slicing\" target=\"_blank\">Google Cloud TPU and GPU time-slicing</a> to interleave async inference into those quiet cycles, raising aggregate accelerator duty cycles from a ~40% baseline to &gt;70% (<a href=\"https://cloud.google.com/blog/products/containers-kubernetes/introducing-co-operative-time-slicing-for-rl-in-llm-d\">source</a>).</p><p><b>Benchmarks you can trust</b></p><p>Tuning a distributed inference stack across routers, KV cache tiers, and prefill/decode pools takes repeatable measurement under realistic multi-turn load. <a href=\"https://prism.llm-d.ai/\" target=\"_blank\">Prism</a> is llm-d’s open-source analysis dashboard for exploring published benchmarks across llm-d’s well-lit paths, backed by standardized <a href=\"https://github.com/llm-d/llm-d-benchmark\" target=\"_blank\">llm-d-benchmark</a> recipes and <a href=\"https://github.com/kubernetes-sigs/inference-perf\" target=\"_blank\">inference-perf</a> workloads. Inspect the exact configurations behind the numbers, or upload runs from your own cluster to compare throughput, latency, and cost curves side by side.</p><h3><b>Running llm-d 1.0 on Google Cloud</b></h3><p>llm-d builds on Kubernetes components you may already run: Gateway API, LeaderWorkerSet, Dynamic Resource Allocation, Prometheus, and OpenTelemetry. Running llm-d on Google Cloud brings these pieces together with managed infrastructure:</p><ul><li><a href=\"https://cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway#llm-d-router\"><b>GKE Inference Gateway</b></a> is the llm-d router operating in Gateway Mode, a managed GKE Gateway that handles the L7 proxy and load balancing and calls the llm-d Endpoint Picker on every request, simplifying installation and management so you don't run the proxy yourself. More importantly, GKE Inference Gateway is how you scale llm-d <a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway\">across clusters and regions</a> with global failover and Model Armor safety checks.</li><li><b>Autoscaling on inference signals</b>. KEDA and Horizontal Pod Autoscaler (HPA) scale pools based on queue depth, saturation, and predicted latency, while Kueue enforces per-model quota on shared accelerators.</li><li><b>Mixed accelerator node pools</b>. Google Cloud TPU and GPU pools run behind the same llm-d endpoint, deployed with verified Helm charts.</li><li><b>KV cache offloading across layers</b>. Google Cloud Managed Lustre provides a shared remote tier beneath local TPU and GPU HBM and host CPU RAM so long-context workloads run without exhausting accelerator memory.</li></ul><h3><b>In production</b></h3><p>This GKE llm-d stack carries production traffic, and it has been tested at fleet scale:</p><ul><li>Gemini platform (formerly Vertex AI) serves production traffic through GKE Inference Gateway, doubling its prefix cache hit rate from 35% to 70%, cutting TTFT by more than 35% for coding agents and cutting P95 TTFT by more than 50% under bursty chat traffic (<a href=\"https://cloud.google.com/blog/products/containers-kubernetes/how-gke-inference-gateway-improved-latency-for-vertex-ai\">source</a>).</li><li>In a published benchmark across a 17,000-node multi-region GKE deployment serving a mixture-of-experts model in the US and Europe, multi-cluster GKE Inference Gateway and the llm-d router scaled throughput 2.9x across three clusters with a 99.9% success rate and less than 1% routing overhead (<a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gpu-and-tpu-utilization-with-multi-cluster-gke-inference-gateway\">source</a>).</li><li>In a published benchmark on A3 Mega cluster serving a 70B-parameter model, llm-d with multi-connector KV cache offloading to Google Cloud Managed Lustre in addition to Host CPU RAM, delivered an approximately 40% improvement in TTFT and a 30% reduction in end-to-end latency responding to 50k-token prompts compared to CPU RAM offload only, while reducing GPU-hour requirements by nearly 60% (<a href=\"https://cloud.google.com/blog/topics/developers-practitioners/scaling-llm-inference-multi-node-kv-cache-offloading-with-gke-managed-lustre\">source</a>).</li></ul><p>Organizations running llm-d on Google Cloud are putting these same capabilities to work in different ways, for instance prefix-aware routing to raise cache hit rates, open interfaces that fit an existing service mesh, and flow control to hold latency for priority tiers when traffic spikes.</p><p></p></div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">“</span><span style=\"font-style: italic; vertical-align: baseline;\">At Snap, we are integrating llm-d into our production AI infrastructure to facilitate high-performance inference at scale. By employing prefix-cache-aware routing, we have</span><strong style=\"font-style: italic; vertical-align: baseline;\"> achieved prefix cache hit rates ranging up to 75-80%</strong><span style=\"font-style: italic; vertical-align: baseline;\">. We appreciate the open-source nature of llm-d, as it enables seamless integration with our Envoy-based Service Mesh.</span><span style=\"vertical-align: baseline;\">\" </span><span style=\"font-style: italic; vertical-align: baseline;\">- </span><strong style=\"vertical-align: baseline;\">Vinay Kola</strong><span style=\"vertical-align: baseline;\">, Senior Manager, Software Engineering, Snap Inc.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">\"</span><span style=\"font-style: italic; vertical-align: baseline;\">At ZenteiQ, we use GKE Inference Gateway powered by llm-d to accelerate synthetic data generation for our sovereign Scientific Foundation Models. By leveraging load-aware and prefix-cache-aware routing, we have achieved over </span><strong style=\"font-style: italic; vertical-align: baseline;\">4× higher aggregate inference throughput</strong><span style=\"font-style: italic; vertical-align: baseline;\">, increasing daily generated token capacity from </span><strong style=\"font-style: italic; vertical-align: baseline;\">1.47 billion to 5.97 billion tokens per 1,000 TPU v6e accelerators</strong><span style=\"font-style: italic; vertical-align: baseline;\">. The open-source foundation of llm-d, integrated with GKE, enables us to efficiently serve multiple model families at scale without developing and maintaining a custom inference scheduler.” </span><span style=\"vertical-align: baseline;\">- </span><strong style=\"vertical-align: baseline;\">Prof. Sashikumaar Ganesan</strong><span style=\"vertical-align: baseline;\">, Founder, Zenteiq.ai</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Serving frontier models across interactive applications and high-volume APIs means handling steep traffic spikes without letting bursty workloads degrade latency for priority customers. With llm-d's prefix-cache-aware routing, flow control and disaggregated serving support we can </span><strong style=\"font-style: italic; vertical-align: baseline;\">enforce strict priority bands across our commercial tiers</strong><span style=\"font-style: italic; vertical-align: baseline;\">, automatically holding or shedding lower-priority requests when pools saturate so</span><strong style=\"font-style: italic; vertical-align: baseline;\"> paid traffic meets our latency SLOs</strong><span style=\"font-style: italic; vertical-align: baseline;\">. Mistral is a proud supporter of open-source software, and we will continue to contribute back to llm-d and DisaggregatedSet projects.”</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Mathis Felardos, Lucas Fernandes-Martins and Nikhil Thomas,</strong><span style=\"vertical-align: baseline;\"> Mistral, Inference Engineers and llm-d contributors</span></p></div>\n<div class=\"block-paragraph\"><p>Teams serving their own models have been asking for an open stack they can take apart and adapt to their own infrastructure, with the cache-aware routing, traffic control, and upgrade controls required in production. llm-d 1.0 gives them that and a community to build with.</p><h3><b>Get started</b></h3><ol><li>Check out the full demo of llm-d with TPUs at the Google Cloud booth during the PyTorch Conference.</li><li>Deploy llm-d 1.0 on GKE with the verified Helm charts. See the <a href=\"https://llm-d.ai/docs/infrastructure/providers/gke\" target=\"_blank\">llm-d on GKE documentation</a>.</li><li>Start with prefix-aware routing in front of your existing vLLM deployment, then add flow control, KV cache <a href=\"https://llm-d.ai/docs/well-lit-paths/foundations/tiered-prefix-cache\" target=\"_blank\">offload</a> (<a href=\"https://github.com/llm-d/llm-d/tree/main/guides/tiered-prefix-cache/modelserver/gpu/sglang\" target=\"_blank\">SGlang</a>, <a href=\"https://github.com/llm-d/llm-d/tree/main/guides/tiered-prefix-cache/modelserver/gpu/vllm\" target=\"_blank\">vLLM</a>) and disaggregation.</li><li>Compare results on <a href=\"https://prism.llm-d.ai/\" target=\"_blank\">Prism</a> and contribute on <a href=\"https://github.com/llm-d/llm-d\" target=\"_blank\">GitHub</a>.</li></ol></div>"
  "bb9c74f1c46fc3102ab17940b53e6d89":
    "id": "bb9c74f1c46fc3102ab17940b53e6d89"
    "title": "Announcements and highlights from Google Public Sector Summit 2026"
    "link": "https://cloud.google.com/blog/topics/public-sector/announcements-and-highlights-from-google-public-sector-summit-2026/"
    "published": "2026-10-20 19:00:00"
    "fetched": "2026-10-20 23:40:58"
    "summary": "<div class=\"block-paragraph\"><p>Today we are bringing together mission leaders and builders from across the public sector at the<a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\"> Google Public Sector Summit</a> in Washington D.C. to explore a critical intersection: <i>Where mission meets moonshot.</i> Through our hands-on programming, we will offer inspiration as well as pragmatic steps for turning moonshot aspirations into secure, scaled, real-world outcomes.</p><p>From mapping the human genome to putting a human on the moon, public sector organizations have been at the helm of some of humanity’s most historic breakthroughs. Right now, public sector leaders are being asked to move faster than ever, amidst more complexity and uncertainty, often with fewer resources than the mission demands. To better understand these challenges and opportunities, we surveyed several hundred leaders from across the public sector with <a href=\"https://cloud.google.com/resources/content/scalingagentspublicsectoreport?e=48754805\">theCUBE and ECI Research</a>. According to the findings, while <b>96.3%</b> of agencies have deployed agents in some form, only <b>9%</b> have achieved agency-wide adoption. The bottleneck isn’t a lack of vision or ambition—it is the systemic friction of legacy data silos and integration complexity. That is why so many organizations turn to Google; we deliver powerful technology that reduces the toil of getting started, minimizes the friction of integration, and provides the secure foundation for scale.</p><p>To that end, we are excited to share several new announcements and capabilities to support your missions and moonshots in the agentic era.</p><p><b>Introducing the Gemini agent</b></p><p>We recently announced the <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\">Gemini agent</a>: your new single, universal agent for work. It can have all of your organizational context and can be used for everything from knowledge work to answering questions, and from content creation to coding, all from a single prompt box. At your direction, it can plan the work, use skills and tools, connect to your systems, and bring back something finished — inside the documents, the inbox, and the developer environments you already work in and give it permissions for. With your guidance, the agent chooses the best model for the job, employs built-in cost controls, and most importantly, reflects the security, administration, and governance controls established by your organization.</p><p><b>Introducing Gemini for government services</b></p><p>This morning we launched <a href=\"https://cloud.google.com/gemini-enterprise/gov\">Gemini for government services</a> in private preview, a purpose-built platform engineered for the security, governance, and workflow complexity of public sector missions. Built around the core promise of delivering \"less paperwork, more public service,\" it provides an integrated, fully governed environment configured for rapid deployment across federal, state, and local agencies. By combining pre-built partner agents, secure connectors, and deterministic skills, the platform enables civil servants to securely link Gemini directly to existing case management, ERP, and agency collaboration systems of record without migrating their agencies’ sensitive data. Civil servants are empowered to automate repetitive, high-stakes tasks—such as public records requests, document intake validation, expense auditing, and policy research—all grounded in authoritative federal regulatory sources with verifiable citations. Learn more about Gemini for government services in our <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-government-services\">blog post</a>.</p><p><b>Introducing Wiz agents in Wiz for Gov</b></p><p>The Wiz Red, Green, and Blue agents <a href=\"http://wiz.io/blog/wiz-for-gov-agents-fedramp\" target=\"_blank\">are now available</a> within Wiz for Gov, Wiz’s FedRAMP Class D (High) certified environment. The expansion of the agent trio into Wiz for Gov accelerates remediation for critical public sector priorities, including Post-Quantum Cryptography (PQC). The Green Agent can assist in driving PQC readiness through a new risk type dedicated to weak cryptography that investigates whether an asset is quantum-vulnerable and assesses potential Harvest Now, Decrypt Later (HNDL) exposure. By leveraging the cryptographic visibility from code to runtime gained through the Wiz AI-APP, the Wiz Green Agent is able to help weigh real-world external reachability against data sensitivity enabling delivery of continuously updated, PQC-resistant fixes directly into developer workflows.</p><p>Wiz has also invested in several other initiatives intended to benefit the public sector. <a href=\"https://www.wiz.io/scan-for-good\" target=\"_blank\">Scan for Good</a>, a program launched jointly by Wiz and Google DeepMind, uses the Wiz Red Agent and Gemini 4 Argon, alongside Gemini 3.8 Flash Cyber, to provide no-cost security assessments designed to uncover high-risk vulnerabilities and exposures across eligible public services, critical infrastructure, and other under-resourced organizations. Wiz is also expanding capabilities for organizations navigating the new FedRAMP Vulnerability Detection and Response (VDR) and Vulnerability Evaluation and Reporting (VER) rulesets. This includes operationalizing critical FedRAMP metrics, including Potential Agency Impact (PAIN), and validating likely exploitability (LEV) and internet reachability (IRV). These enhancements will assist organizations seeking to achieve or maintain FedRAMP certification with the automated reporting and prioritized risk assessment required.</p><p><b>Bringing enterprise search capabilities to Gemini on Google Distributed Cloud</b></p><p>For defense, intelligence, and national security agencies operating in classified environments, the challenge is not just analyzing vast volumes of sensitive data, it is doing so without compromising perimeter security. To help turn classified information into actionable intelligence, we are <a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/new-innovations-in-google-distributed-cloud\">bringing enterprise search capabilities to Gemini on Google Distributed Cloud for air-gapped deployments</a>. With this new capability, users gain an intuitive conversational interface to query, synthesize, and summarize records at machine speed, completely disconnected from the public internet. This launch brings Gemini 3.5 Flash models to on-premises air-gapped deployments, expands model flexibility with open models like Gemma, and delivers massive local compute through generally available NVIDIA Blackwell B300 GPUs.</p><p><b>Driving mission impact, together</b></p><p>Through partnership and powerful technology, organizations across the public sector are transforming how services are delivered, accelerating research and science, strengthening national security, improving healthcare delivery, and enhancing student outcomes. These organizations aren’t waiting for the future; they are actively building it right now.</p><ul><li><a href=\"http://america.gov/\" target=\"_blank\"><b>America.gov</b></a> is offering a streamlined \"front door\" that simplifies access to federal services online. Google is proud to be named a technology partner in this vital initiative, leveraging Gemini to help millions of Americans access critical public resources with greater speed and ease.</li><li><a href=\"https://cloud.google.com/blog/topics/public-sector/gps-suny-launch-ai-enabled-platform-to-accelerate-university-research?e=48754805\"><b>SUNY</b></a> is tackling challenges with direct impact for communities across New York and beyond. Together, we are ​​empowering researchers of all technical backgrounds to easily access and benefit from Google Cloud's advanced capabilities—bringing storage, high-powered computing, Gemini Enterprise, and more than 200 trusted models together into a seamless, centralized ecosystem.</li><li><a href=\"https://cloud.google.com/blog/topics/public-sector/accelerating-frontiers-of-scientific-discovery-40-million-dollar-commitment-genesis-mission?e=48754805\"><b>The Department of Energy</b></a> is accelerating breakthroughs in energy dominance, discovery science, and national security through the Genesis Mission. Gemini will support the full breadth of work - from the research bench to specialized user facilities – building a secure foundation that the DOE mission can depend on.</li><li><a href=\"https://www.army.mil/article/294805/army_launches_flagship_strategic_capital_initiative_with_fedex_dataworks_to_modernize_logistics_infrastructure\" target=\"_blank\"><b>The U.S. Army</b></a> is leading a sweeping modernization of its logistics infrastructure including non-tactical logistics networks, supply chain procedures, and organic industrial base sites. The Army's Strategic Capital Initiative will pair Google's secure cloud and FedEx's logistics expertise to build a more intelligent and connected supply chain network that helps reduce delivery times and ensures personnel receive the critical equipment where and when they need it.</li><li><a href=\"https://cloud.google.com/blog/topics/public-sector/gemini-for-government-build-custom-ai-agents-for-unclassified-work-on-genaimil?e=48754805\"><b>The Department of War</b></a> is supercharging daily operations and workflows with Gemini, giving 3 million personnel across the department access to a secure enterprise-grade platform. With Agent Designer, GenAI.mil users are quickly able to build their own agents using natural language to help streamline repetitive, multi-step tasks such as document creation and document reviews.</li><li><a href=\"https://case.edu/utech/about/utech-news/cwru-partners-google-expand-campus-wide-ai-access-gemini-enterprise\" target=\"_blank\"><b>Case Western Reserve University</b></a> is improving learning outcomes and accelerating research breakthroughs. They are leveraging Gemini for education campus-wide, transforming the experience of every scientist, staff member, and student. Tomorrow, they’re opening a new hub for discovery and innovation that leverages Google technology, and connects Google engineers with 300 university researchers across campus.</li></ul><p><b>Google Public Sector: Your mission partner</b></p><p>The agentic era will not be defined by what technology can do, but by what we choose to build with it. So let’s meet this moment, let's re-imagine what’s possible, and let’s create impact — together.</p><ul><li><a href=\"https://cloudonair.withgoogle.com/events/google-public-sector-summit-2026?utm_source=linkedin&amp;utm_medium=paidsocial&amp;utm_campaign=FY26-Q4-northam-PUB10000039-onlineevent-er-ps-summit-on-demand-2026&amp;utm_content=-&amp;utm_term=-\" target=\"_blank\">Register early for Google Public Sector Summit On-Demand</a> to be notified when the event’s content is published.</li><li>Learn how <a href=\"http://goo.gle/gemini-for-gov\" target=\"_blank\">Gemini for government services</a> can help transform critical workflows and advance your mission.</li><li>Request <a href=\"https://www.wiz.io/demo\" target=\"_blank\">a demo</a> to see how the Wiz Agents can help your agency meet today’s security demands at machine speed.</li><li>Catch the highlights from Google Public Sector Summit on <a href=\"https://www.linkedin.com/showcase/google-public-sector/\" target=\"_blank\">our Linkedin page</a>, schedule a <a href=\"https://cloud.google.com/contact/form?direct=true&amp;e=48754805\">1:1 consultation</a> with a Google team member or reach us at geminiforgov@google.com.</li></ul></div>"
  "ccf085b620faa935d58f7517ba977dea":
    "id": "ccf085b620faa935d58f7517ba977dea"
    "title": "Managed RAG search inside the sovereign perimeter: Gemini on GDC enterprise search"
    "link": "https://cloud.google.com/blog/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search/"
    "published": "2026-10-20 19:00:00"
    "fetched": "2026-10-20 23:40:58"
    "summary": "<div class=\"block-paragraph\"><p>National security agencies and other sovereign and highly regulated organizations handle incredibly sensitive data such as classified reports, field manuals, and sensitive multi-modal datasets. Search and multimodal intelligence that’s available in the public cloud can help teams manage and analyze that data, but due to strict data sovereignty mandates, that data cannot leave the customer premises.</p><p>The alternative has been to deploy custom agentic search inside a secure, disconnected perimeter, but until now, that meant months building and maintaining custom infrastructure — stitching together models, building speech-to-text and optical character recognition (OCR) pipelines, configuring vector databases, and managing a bespoke user interface.</p><p>Today, we're excited to announce enterprise search capabilities with Gemini on <a href=\"https://cloud.google.com/distributed-cloud\">Google Distributed Cloud (GDC)</a> air-gapped to help solve the above challenges. In preview, this fully managed retrieval-augmented generation (RAG) search experience runs entirely inside your physical security perimeter, with no connection to the public internet or to Google Cloud's global infrastructure. Your teams can now upload their files into a conversation and ask Gemini to find information about it, summarize it, compare it, or translate it. Every answer cites its sources, and conversations persist between sessions.</p><p>Enterprise search capabilities on GDC enable your teams to search across siloed data and unlock powerful insights. With these capabilities, you can now:</p><ul><li><b>Go from hundreds of pages to a cited answer:</b> Ask questions across long manuals, reports, and policies, and see exactly which files each answer came from.</li><li><b>Work across languages:</b> Ask in one language and get answers grounded in documents written in another, or have Gemini translate them.</li><li><b>Ask one question across many formats:</b> Combine audio recordings, video clips, images, and spreadsheets with no separate transcription or OCR steps.</li><li><b>Pick up where you left off:</b> Conversations and files persist between sessions, so you don’t have to start from scratch on long-running work.</li><li><b>Keep access need-to-know:</b> Each user's chats and files are private to that user, and access follows the identity provider groups you already manage.</li></ul><p>Users can work with PDF, Microsoft Word, PowerPoint, and Excel files, plus TXT, HTML, PNG and JPEG images, WAV audio, and MP4 video. Each file can be up to 100 MB, and each chat up to 500 MB.</p><h3><b>Core architectural layers: under the hood</b></h3><p>Let's follow a user query through each layer of the stack: signing in, ingesting files, generating the response with Gemini, and storing the session. Every step happens on the organization's air-gapped network.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_90BLzo5.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>Identity and access</b></p><p>Users sign in through their organization's identity provider. Administrators map the service's user role to identity provider groups, and only members of those groups can access the application. Each user's chats and uploaded files are private to that user.</p><p><b>Document ingestion and embedding</b></p><p>When a user uploads a file, it goes straight to the app's object storage bucket. The backend records the file's metadata in the app's managed PostgreSQL database, which is optimized for search. The backend then splits the file into chunks, such as groups of PDF pages or tiles of an image, and writes them to the bucket. A Gemini embedding model running natively within the GDC deployment converts each chunk into a vector, which the backend stores in the app's PostgreSQL database.</p><p>When the user asks a question, the state-of-the-art (SOTA) Gemini model running entirely on GDC inside the customer’s data center first rewrites the question with context from the conversation. The backend then embeds the rewritten question with the same model and searches the vector database.</p><p><b>Model serving</b></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_4I3U8T4.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>The backend then combines the question, the conversation history, and the best-matching data into a single multimodal prompt and sends it to a Gemini endpoint running on NVIDIA B300 GPUs in that same GDC deployment. Gemini is natively multimodal — it accepts text, images, audio, and video as input, so it can reason across data coming from different file types in a single context, and doesn't require separate speech-to-text and OCR models. The answer then streams back to the user with citations to the source files.</p><p><b>Persistence</b></p><p>Lastly, the persistence layer keeps each conversation's state. Each question and answer is stored in the system’s database and uploaded files stay in object storage, so users can reopen an earlier session and pick up where they left off.</p><h3><b>Built for classified and sovereign environments</b></h3><p>With Gemini and enterprise search on GDC, prompts, responses, uploaded documents, and embeddings never leave your organization's air-gapped network, and every model runs locally. Data is encrypted at rest with AES-256 disk encryption using locally managed HSM keys, and in transit with TLS using FIPS-approved algorithms. Local IAM integration with granular role-based access control (RBAC) governs access to resources. <a href=\"https://cloud.google.com/blog/topics/public-sector/google-distributed-cloud-gdc-gdc-air-gapped-appliance-achieve-dod-impact-level-6-il6-authorization\">GDC air-gapped has U.S. DoD IL6 accreditation</a> and is designed to support strict requirements in alignment with FedRAMP High security controls.</p><p><b>Code execution: Compliance and security</b></p><p>To deliver precise, deterministic answers from structured spreadsheet data (such as CSV and XLSX files), Gemini enterprise search leverages the Gemini inference stack's local code-execution engine.</p><p>When handling analytical queries — such as computing the average salary across departments — Gemini dynamically generates Python code and runs it securely within <a href=\"https://cloud.google.com/blog/products/containers-kubernetes/agent-substrate-available-on-gke\">Agent Substrate</a>, an open-source execution runtime built for large-scale agent orchestration.</p><p>To mitigate security risks inherent to executing LLM-generated code, Agent Substrate enforces strict network isolation and runs workloads inside <a href=\"https://cloud.google.com/blog/products/identity-security/open-sourcing-gvisor-a-sandboxed-container-runtime\">gVisor sandboxes</a>, helping ensure strong isolation boundaries without sacrificing inference performance.</p><h3><b>Bringing frontier models to the sovereign data center</b></h3><p>You no longer have to choose between uncompromising security and cutting-edge multimodal intelligence. Enterprise search, Gemini 3.5 Flash and databases optimized for search run together inside the GDC air-gapped perimeter with no dependency on the internet to bring the best autonomous capabilities to the sovereign cloud.</p><p>Explore the <a href=\"https://docs.cloud.google.com/distributed-cloud/hosted/docs/latest/gdcag/gemini-app/gemini-app-overview\">GDC air-gapped documentation</a> and contact your GDC representative to learn how you can best leverage these search capabilities in your sovereign cloud.</p></div>"
  "b57691cf87d32aaafabe29bff7bba56c":
    "id": "b57691cf87d32aaafabe29bff7bba56c"
    "title": "Enabling the next era of sovereign AI: The latest Google Distributed Cloud innovations"
    "link": "https://cloud.google.com/blog/topics/hybrid-cloud/new-innovations-in-google-distributed-cloud/"
    "published": "2026-10-20 19:00:00"
    "fetched": "2026-10-20 23:40:58"
    "summary": "<div class=\"block-paragraph\"><p>Agentic systems are quickly moving from pilots to production in the enterprise. But if your organization operates under stringent data sovereignty, defense, intelligence, or critical infrastructure mandates, sending sensitive data to a public cloud often isn’t an option — and building your own AI stack inside a disconnected perimeter can take months. Your missions demand frontier models, hardened security, and high performance, deployed directly where your most sensitive data lives.</p><p>The latest innovations in Google Distributed Cloud (GDC) air-gapped represent a huge leap forward for organizations struggling with these challenges, and they no longer need to make this tradeoff. Enterprise search capabilities with Gemini, support for open weight models, turnkey ISV applications, next-generation accelerated infrastructure, and support for new partners are all now available to be directly deployed in your sovereign, air-gapped environments.</p><p>Here’s a high-level look at the major capabilities launching across three pillars: Sovereign AI and enterprise search, next-generation infrastructure, and a growing ISV partner ecosystem.</p><h3>GDC technology stack: Infra, frontier models, data and applications</h3><p>The GDC technology stack turns isolated infrastructure into a modern agentic innovation platform, combining foundational and open model flexibility, intuitive out-of-the-box user experiences, and high-performance data processing.<br /></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_2n8CczN.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Overview of GDC architecture and capabilities</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>We are excited to bring the following innovations to GDC:</p><ul><li><b>Gemini on GDC enterprise search:</b> In air-gapped environments, analysts and knowledge workers spend critical hours manually sifting through compartmentalized documents, intercepted audio, and sensor video. Agentic systems can streamline those processes, but building those capabilities often requires months of custom development. With <a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search\">enterprise search capabilities in Gemini on GDC</a> (available in preview), organizations gain a turnkey conversational interface, so they can query, prompt, and summarize vast repositories of data near-instantaneously. Unlike text-only open-source alternatives, this managed architecture delivers native <b>multi-modality support via Gemini embedding models</b>, combining high-throughput scaling and low-latency inference performance for text, audio, and video modalities. Built-in retrieval-augmented generation (RAG) keeps indexing and interactions strictly within your sovereign perimeter, accelerating insights without compromising security.</li><li><b>Expanded frontier and open-weight models:</b> Google Cloud is one of the <b>first hyperscalers to bring a frontier model like Gemini to air-gapped deployments</b>. Now generally available on GDC air-gapped, <b>Gemini 3.5 Flash</b> delivers ultra-low-latency reasoning, multimodal understanding, and long-context capabilities entirely within your air-gapped boundary, allowing users to process large volumes of field intelligence, from reports to imagery and recordings, quickly. GDC also now supports leading open models like <b>Gemma</b> and <b>Mistral</b>, giving you architectural and workload choice, giving you the flexibility to match the right model to each workload on the same governed platform.</li></ul><h3>Next-generation IaaS powering GDC</h3><p>To run modern agentic systems and memory-intensive enterprise workloads on the same infrastructure, you need an uncompromising foundation. GDC air-gapped features a new, elevated Infrastructure-as-a-Service (IaaS) stack across compute, networking, and security, so you can run AI and traditional workloads side by side with the performance and protection they need.</p><ul><li><b>Next-gen high-performance agentic infrastructure:</b> <b>NVIDIA HGX B300 systems based on the NVIDIA Blackwell Ultra architecture</b> are now generally available on GDC air-gapped, giving you the local compute to serve Gemini and open models — and the agents built on them — at production scale. Paired with VM networking that now <b>supports up to 32 Gbps per VM</b> (up from 25 Gbps), you can move data to your GPUs faster and reduce bottlenecks in your inference pipelines.</li><li><b>Resilient, enterprise-grade networking:</b> Fully managed <b>Cloud DNS, now generally available on GDC</b>, lets your platform teams manage DNS records with the same Kubernetes APIs and command line they already use — with no third-party DNS infrastructure to deploy, patch, and maintain inside the air gap. And hardware-offloaded <b>IPsec encryption protects node-to-node traffic at up to 100 Gbps</b>, helping you meet encryption-in-transit requirements without taking CPU away from your applications.</li><li><b>SecOps enabled by Elastic:</b> As agentic workloads scale, you need machine-speed security to defend your distributed environments. Through our deep integration with <a href=\"https://www.elastic.co/blog/elastic-security-integration-with-google-distributed-cloud\" target=\"_blank\"><b>Elastic Security</b></a>, we are modernizing threat detection and response (SIEM and EDR) on GDC air-gapped. Together, Elastic Security and GDC air-gapped provide automated case management, behavioral analytics, and agentic-driven telemetry correlation, so you can accelerate your mean time to response (MTTR).</li></ul><h3>Expanding the sovereign ISV partner ecosystem</h3><p>Your missions depend on more than infrastructure — they run on the data platforms, developer tools, and collaboration apps your teams already know. That’s why we’re bringing more of that software to run natively on GDC, so you can adopt AI without leaving familiar tools behind. Today, we’re expanding the GDC partner marketplace with independent software vendors (ISVs) including <b>Teradata, Solo.io, and Mattermost</b>:</p><ul><li><a href=\"https://www.teradata.com/insights/ai-and-machine-learning/analytics-meets-sovereign-infrastructure\" target=\"_blank\"><b>Teradata</b></a> extends industry-standard enterprise data analytics and warehouse intelligence to the distributed edge, so you can run complex analytical pipelines right next to local AI inference — and act on insights without moving data outside your perimeter.</li></ul></div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Enterprises in highly regulated and air-gapped environments are eager to harness the transformative power of generative AI, but they cannot compromise on data privacy or analytical rigor. By bringing Teradata to Google Distributed Cloud, we are enabling our joint customers to run complex analytical workloads and AI inferencing right where their data resides. Together with Google Cloud, we are breaking down barriers between sovereign cloud infrastructure and enterprise-grade intelligence.\" - </span><span style=\"vertical-align: baseline;\">Sumeet Arora, Chief Product Officer, </span><strong style=\"vertical-align: baseline;\">Teradata </strong></p></div>\n<div class=\"block-paragraph\"><ul><li><a href=\"https://www.solo.io/blog/from-sovereign-models-to-sovereign-agents-kagent-and-agentgateway-on-google-distributed-cloud\" target=\"_blank\"><b>Solo.io</b></a> brings API management, service mesh, and agentic networking — including kagent and agentgateway — to sovereign deployments, so you can securely connect and govern microservices and AI agents across isolated clusters, including which tools and other agents each agent can reach.</li><li><a href=\"https://docs.mattermost.com/\" target=\"_blank\"><b>Mattermost</b></a> delivers secure collaboration and mission-critical operations workflows for defense and public sector teams, so your people can coordinate in real time entirely inside the air gap — including AI-assisted summaries and translation using models running locally on GDC.</li></ul><h3>Building the future of sovereign cloud</h3><p>With these capabilities, sovereignty no longer has to slow down your AI ambitions. By bringing Gemini and open-weight models, multimodal enterprise search, high-performance infrastructure, built-in security, and a growing ISV ecosystem together inside your air-gapped perimeter, GDC helps you turn your most sensitive data into actionable insights, while you maintain compliance, security, and control.</p><p>Ready to get started?</p><ul><li>Read our <a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search\">technical deep dive</a> on Gemini on GDC enterprise search.</li><li>Explore the <a href=\"https://docs.cloud.google.com/distributed-cloud/hosted/docs/latest/gdcag\">GDC air-gapped documentation</a>.</li><li>Contact your GDC representative to schedule a demo.</li></ul></div>"
  "a21357823326f8ab4b9a40cc141f4c0b":
    "id": "a21357823326f8ab4b9a40cc141f4c0b"
    "title": "Introducing Gemini for government services"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-government-services/"
    "published": "2026-10-20 19:00:00"
    "fetched": "2026-10-20 23:40:58"
    "summary": "<div class=\"block-paragraph\"><p>Earlier this month at Gemini at Work, we introduced the Gemini agent: a single, universal agent for work. It answers your questions, handles your knowledge work, creates your images and media, and writes and runs code. You give it objectives, not instructions, and come back to finished work. It plans the work, uses skills and tools, connects to your systems, and has the security, administration, and governance your organization requires.</p><p>Every industry runs on knowledge a general model does not have. Government work runs on statute, regulation, and agency guidance, across siloed legacy systems, under strict requirements for data sovereignty, compliance, and confidentiality. Too often that leaves civil servants on data entry and manual document review instead of the services citizens depend on.</p><p>Today we're bringing the Gemini agent to public service with Gemini for government services in preview, part of our new suite of purpose-built industry solutions. It adds skills built around government work, connections to the systems agencies already run, and specialized partner agents, with governance running underneath it all.</p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=ZapIlMXcBLo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Bringing Gemini to government services</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=ZapIlMXcBLo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p><b>Five components of Gemini for government services</b></p><p>Developed alongside agency leaders, Gemini for government services provides an integrated, fully governed environment configured for rapid deployment across federal, state, and local agencies with five core components:</p><ol><li><b>Skills for government work:</b> Skills are reusable instructions and context, written by domain experts, that teach Gemini to run a specific task. Each one applies the statute, regulation, and agency guidance that govern that task, so an agency's standard operating procedures carry into the work Gemini supports.</li><li><b>Connectors to agency systems:</b> Secure connectors link Gemini to the case management, ERP, HR, and collaboration systems agencies already run, along with authoritative federal data sources. Gemini queries each system in place, so no data is migrated, and access follows the identity and permission controls the agency already has.</li><li><b>Partner agents:</b> Skills and connectors come together in agents, including pre-built agents from public sector software providers that agencies can deploy right away. They handle tasks like FOIA discovery and batch redaction under the same central governance, with a person approving each consequential step.</li><li><b>A governed control plane:</b> Security and compliance teams get one place to set and enforce policy across every agent, including VPC Service Controls, CMEK, and Assured Workloads. Outputs are grounded in source documents, with citations, so reviewers can check where each answer came from.</li><li><b>An open partner ecosystem:</b> Every agency works under a different statute and runs a different mix of systems. System integrators and public sector ISVs help agencies customize Gemini, connect it to what they already have, and scale it without lock-in.</li></ol><h3><b>Skills for government workflows</b></h3><p>Gemini for government services helps automate and accelerate complex government operations, including:</p><ul><li><b>Policy and regulatory research</b>: Ask an operational or eligibility question and get an answer drawn from the CFR, the Federal Register, state administrative codes, and internal manuals, with page and paragraph citations. Where federal and state rules both apply, Gemini shows which one governs to empower agency decision makers.</li><li><b>FOIA record discovery</b>: Gemini searches SharePoint, Drive, and email archives for records responsive to a FOIA or state Sunshine Law request. It organizes them into a review set for the records officer and agency counsel, shortening discovery that often takes weeks.</li><li><b>Redaction for public release</b>: Gemini finds sensitive constituent data across a batch of documents, groups the findings so reviewers can clear them in passes, and proposes redactions labeled by statutory exemption. After a reviewer confirms, it produces the exemption log and audit-ready copies.</li><li><b>Vendor bid evaluation</b>: Gemini checks multi-volume bids against RFP requirements, FAR guidelines, minimum mandatory criteria, and evaluation rubrics, and returns scoring justifications with citations. Contracting officers get a documented basis for each award decision.</li><li><b>Grant and program expense audits</b>: Gemini checks invoices, receipts, purchase orders, and ledger entries against 2 CFR 200 Uniform Guidance and the terms of the award. It flags unallowable costs, missing documentation, and funding discrepancies with line-item citations, so problems surface while there's still time to fix them.</li><li><b>Document validation at intake</b>: Gemini classifies and validates pay stubs, W-2s, utility bills, and leases when they arrive, checks the numbers for consistency, and flags missing signatures. Defects are caught before the application enters the queue, not weeks into the case.</li><li><b>Plain-language notices</b>: Gemini turns policy memos and agency guidance into public notices, aligned to the Plain Writing Act of 2010, USDA-FNS standards, and Title VI language access guidance.</li></ul><h3><b>Open ecosystem of connectors across the government technology stack</b></h3><p>Gemini for government services connects directly to core agency systems via secure <a href=\"https://cloud.google.com/gemini-enterprise/connectors\">connectors</a>. Access is bound by existing role-based access controls, record-level permissions, and the trusted data controls inherited from each system — and nothing is migrated to make the connection work.</p><p><b>Federal regulatory and public data:</b></p><ul><li><b>Federal Register:</b> Tracks legislative actions, regulations, and executive orders as they post, so state and local teams see federal changes as they land.</li><li><b>regulations.gov:</b> Tracks federal rulemaking dockets, public comments, and statutory agency response deadlines, keeping policy analysts ahead of incoming mandates.</li><li><b>eCFR (Electronic Code of Federal Regulations):</b> Grounds answers in the governing regulation, with citations down to the paragraph.</li></ul><p><b>Agency systems of record:</b></p><ul><li><b>Oracle E-Business Suite:</b> Gives agents permission-bound access to procurement, payables, and ledger transactions for expense auditing and award reconciliation.</li><li><b>Oracle PeopleSoft:</b> Connects HR and personnel records under existing role-based controls, so workforce questions are answered from the system of record.</li><li><b>Salesforce:</b> Enables conversational experiences across the Missionforce portfolio, including benefits, licensing and permitting, and contact center management.</li><li><b>ServiceNow:</b> Automates IT, CRM, security, employee experience, and workflow records, so agents can track incidents, requests, and approval chains inside existing routing rules.</li></ul><p><b>Productivity and collaboration:</b></p><ul><li><b>Google Workspace:</b> Connects with Google Docs, Gmail, Drive, and Sheets to analyze case communications and agency correspondence and surface internal files while enforcing agency access controls.</li><li><b>Microsoft 365 and SharePoint:</b> Integrates with Word, Outlook, and SharePoint to triage inquiries and ground responses in mail and intranet repositories without breaking workflow context.</li></ul><h3><b>Third-party agents and implementation partners</b></h3><p>Every agency operates differently. Through our open platform, agencies can deploy pre-built partner agents or work with system integrators to scale custom capabilities:</p><ul><li><b>SZNS Solutions FOIA and public records discovery agent:</b> Turns a plain-language request, a piece of correspondence, or a formal citizen inquiry into a scoped search across enterprise archives — bounded by custodian and date range, so a records officer narrows the set before any data moves. It exports responsive material into secure agency repositories and tracks delivery status, giving each request an auditable trail from intake to release.</li><li><b>SZNS Solutions document redaction agent:</b> Works inside connected repositories — SharePoint and Drive among them — finding sensitive citizen data across a batch and grouping the findings so a reviewer clears them in passes rather than page by page. Each proposed redaction carries its statutory exemption, and once the reviewer confirms, the agent exports permanently redacted, audit-ready copies back to the system of record, with the processing never leaving the agency's cloud perimeter.</li><li><b>Systems integrators &amp; tech partners:</b> Strategic partnerships with <b>Accenture Federal Services, Clutch, Dark Wolf, Daston, Deloitte, Egen, Game Plan Tech, Knexus, Onix, Resultant, SAIC, Slalom, and SZNS Solutions</b> so agencies can customize, integrate, and scale these capabilities without vendor lock-in.</li></ul><h3><b>Developed alongside federal, state, and local government agencies</b></h3><p>We are working closely with select federal and state agencies, including the State of Missouri and the U.S. Department of Health and Human Services to ensure these capabilities work in day-to-day agency operations.</p><p><i>\"Our citizens expect the government to move at the speed of modern life, not the speed of paperwork. By automating routine work in our workflows, we're delivering faster, better services to Missourians.\"</i> -<b> Tim Marczewski, Director of AI and Innovation, State of Missouri Office of Administration.</b></p><h3><b>Built on an enterprise-grade foundation</b></h3><p>Gemini for government services runs on Google Cloud's secure foundation, and can be deployed using the Assured Workloads FedRAMP High Data Boundary, enforcing U.S. data residency and personnel controls. It works within the authorities, retention rules, and approval chains your agency already has.</p><p>Agency records, constituent data, institutional documents, custom agents, and model outputs stay private to your organization, and are never used to train or fine-tune Google's foundation models without your permission. Because we operate the full stack, from infrastructure and models through the application layer, we can tune performance and cost together — routing high-volume document parsing and routine records sweeps to fast, low-cost models and reserving high-reasoning models for complex policy analysis, so expanding what your teams can take on does not mean expanding spend at the same rate.</p><h3><b>This is just the beginning</b></h3><p>The launch of Gemini for government services represents another defining step in delivering on our promise to bring the best of Gemini to every professional, for every workflow, natively tailored to the way they work.</p><p><a href=\"https://cloud.google.com/gemini-enterprise/gov\">Gemini for government services</a> is available in <b>preview</b> today, joining our purpose-built solutions for industries. We invite leaders at every level of government to explore how <a href=\"https://cloud.google.com/gemini-enterprise\">Gemini</a> can transform their most critical workflows.</p></div>"
"last_updated": "2026-10-20 23:40:58 JST"
