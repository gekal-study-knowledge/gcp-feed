  "7ca788dd2505d84bbf9048c92c608ef3":
    "id": "7ca788dd2505d84bbf9048c92c608ef3"
    "title": "AI インフラストラクチャとオーケストレーションに関する最新情報"
    "link": "https://cloud.google.com/blog/ja/topics/ai-infrastructure/whats-new-in-ai-infrastructure-this-month/"
    "published": "2026-10-20 11:00:00"
    "fetched": "2026-10-20 12:30:35"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 1 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/whats-new-in-ai-infrastructure-this-month?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">9 月はスケーラビリティ月間です。世界がエージェント フリートの急増に備えるなか、Google はそのニーズに迅速かつ適切に対応できるように AI インフラストラクチャとオーケストレーション サービスを強化するとともに、ワークロードの分離とセキュリティを維持し、コストを抑えています。今回の記事では、Google Cloud のコンピューティング、ネットワーク、ストレージ、オーケストレーションのサービス全体でこれらの機能強化がどのように現れているかに加えて、お客様が Google Cloud AI インフラストラクチャを使用する新しい方法、Google の戦略に対するサードパーティの業界検証をご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">プロダクト、テクノロジー、ツールに関する最新情報</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">Google Kubernetes Engine の更新:</strong><span style=\"vertical-align: baseline;\"> GKE チームはプラットフォームのスケーラビリティの向上に全力を注いでいます。9 月には、さまざまな形や規模で改善が行われました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新機能: </strong><span style=\"vertical-align: baseline;\">エージェント ワークロードに、より高密度の実行ランタイムが必要ですか？新しいオープンソースの</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> は、標準的なコンテナ ランタイムよりも 10 倍高い密度で数百万のサンドボックスを実行できるように設計されています。また Agent Substrate は、ネイティブのゼロトラスト カーネルとネットワーク分離により、1 秒あたり 500 回を超える一時停止 / 再開アクティベーションを実行しながら、500 ミリ秒未満での再開オペレーションを実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><span style=\"vertical-align: baseline;\"> GKE に</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ゼロへのスケーリング</span></a><span style=\"vertical-align: baseline;\">機能が組み込まれました。ワークロードをスケールダウンするために複雑なコンポーネントを構成する必要はありません。AutoscalingMetric を使用した HPA と KEP-2021 のサポートにより、その作業はすぐに自動的に行われます。詳細については、</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのブログ記事をお読みください</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報: </strong><span style=\"vertical-align: baseline;\">さらに、GKE HPA（前述の AutoscalingMetric を使用）では、標準指標に加えてカスタム PromQL 指標に基づいてスケールアップとスケールダウンを行えるようになりました。これにより、ビジネスにとって意味のある独自の条件に従ってワークロードをトリガーできます。詳しくは</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/native-support-for-prometheus-metrics-in-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新機能: </strong><span style=\"vertical-align: baseline;\">もう一つのスケーラビリティ機能は</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/pod-snapshots\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Pod スナップショット</span></a><span style=\"vertical-align: baseline;\">です。これは、CPU や GPU のメモリを含むワークロードの実行状態を保存し、オンデマンドで復元できるようにするものです。内部テストによると、GKE Pod スナップショットにより、AI 推論の起動時間を最大 89% 短縮できます。詳しくは</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新しい移行ツール: </strong><span style=\"vertical-align: baseline;\">最後に、コンテナ ワークロードを AWS EKS から GKE に移行したいと考えていたものの、困難で摩擦の多いエンジニアリング作業を恐れていた方のために、</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-agentic-migration?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE エージェント型移行</span></a><span style=\"vertical-align: baseline;\">をリリースしました。これは、不安定なアドホック プロンプトに代わり、決定論的なガードレールで保護された AI 支援移行パイプラインを提供する専用のエージェント プラグインです。エージェント スキルとローカルの Model Context Protocol（MCP）サーバーを組み合わせた設計になっており、AI を使用して複雑な AWS EKS IaC と Kubernetes マニフェストを GKE ランディング ゾーンに直接変換します。</span><a href=\"https://github.com/gke-labs/gke-agentic-migration/blob/main/docs/onboarding-guide.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">オンボーディング ガイド</span></a><span style=\"vertical-align: baseline;\">を確認して利用を開始しましょう。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">機能の更新: </strong><span style=\"vertical-align: baseline;\">強化学習（RL）と評価のワークロードは非常に複雑です。標準的なエージェント RL ループでは、LLM ポリシーが GPU 上でコード スニペットなどのアクションを生成し、分離された CPU サンドボックス内で実行して報酬シグナルを観察します。しかし、このループをスケールアップして数万の並列ロールアウトをサポートしようとすると、アクセラレータのアイドル状態、イメージのカーディナリティ、コントロール プレーンの飽和など、インフラストラクチャのボトルネックが発生します。そこで、RL 向けに最適化された GKE Agent Sandbox に加えて、Agent Sandbox RL オーケストレーション SDK、一般的な RL ジムやハーネスとのネイティブ連携機能を開発しました。すべて一般提供が開始されています。詳しくは</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ストレージの最新情報: </strong><span style=\"vertical-align: baseline;\">AI は大量のデータをトレーニングして作成します。そのデータは、ブロック ストレージ システム、ファイル システム、オブジェクト ストア、データベースのいずれかに保存する必要があります。この重要なレイヤがエージェントの要求に対応できるよう、ストレージ ポートフォリオの強化を発表しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><a href=\"https://cloud.google.com/blog/ja/products/storage-data-transfer/filestore-agent-volumes?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore エージェント ボリューム</span></a><span style=\"vertical-align: baseline;\">は、エージェント ワークロード向けに高パフォーマンスで柔軟な永続ファイル ストレージを提供します。GKE Agent Substrate および GKE Agent Sandbox との緊密なインテグレーションにより、Filestore エージェント ボリュームは、分離された専用ファイル ワークスペースを GKE Agent Sandbox にミリ秒単位で自動的に割り当て、アタッチします。プレビュー版へのアクセスは</span><a href=\"http://forms.gle/vYPkcFiZVoTjf7Ah7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">からリクエストできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新しいプロダクト:</strong><span style=\"vertical-align: baseline;\"> 生成 AI と RAG のデータレイヤ（Milvus、Pinecone、Qdrant、Vespa、Redis、インメモリ コンテキスト キャッシュなど）を実行している場合は、</span><a href=\"https://cloud.google.com/blog/ja/products/compute/compute-engine-m4n-vms?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">M4N ファミリーの VM</span></a><span style=\"vertical-align: baseline;\">をご覧ください。一般提供が開始されたこれらの VM は、主要なハイパースケーラーの中でコアあたりの IOPS とスループットが最高です。M4N インスタンスは、Google Cloud のカスタム</span><a href=\"https://cloud.google.com/titanium\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> オフロード アーキテクチャおよび </span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Extreme</span></a><span style=\"vertical-align: baseline;\"> と組み合わせることで、ホストあたり合計で最大 25,000 MiB/秒（25 GiB/秒）のストレージ スループットと最大 100 万 IOPS を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新しいプロダクト:</strong><span style=\"vertical-align: baseline;\"> もう一つの新しい Compute Engine プロダクトである</span><a href=\"https://cloud.google.com/blog/ja/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D の一般提供が開始</span></a><span style=\"vertical-align: baseline;\">され、AI / ML のトレーニングおよび推論ワークロード向けの強力なストレージ ソリューションとしてご利用いただけるようになりました。ベアメタル インスタンスとして構成すると、Z4D はエージェント型マイクロ VM に必要な大容量のローカル SSD（LSSD）と低レイテンシの両方を提供するため、ホストごとに数千の分離されたサンドボックスをネイティブのパフォーマンスと効率で実行できます。Z4D マシンの詳細は</span><a href=\"https://cloud.google.com/blog/ja/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">でご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報: </strong><span style=\"vertical-align: baseline;\">現在の AI トレーニングや推論のパイプラインは、ほとんどのストレージ管理システムが対応できないほどのスピードでデータを作成するため、ストレージ資産を把握しようとするチームにとって課題となっています。</span><a href=\"https://docs.cloud.google.com/storage/docs/storage-intelligence/advisor-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage Intelligence アドバイザー</span></a><span style=\"vertical-align: baseline;\">の新バージョンでは、「バケットには何が入っているか？」という疑問の答えが簡単にわかり、予期しない変更をすばやく特定できます。さらに、強化された</span><a href=\"https://docs.cloud.google.com/storage/docs/batch-operations/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">バッチ オペレーション</span></a><span style=\"vertical-align: baseline;\">により、バケット全体にわたる一括変更、たとえば、ストレージ クラスの移動、古いデータや一時データの一括削除、メタデータ、タグ付け、保持、暗号化の変更の適用などを自動化できます。Storage Intelligence アドバイザーの最新情報については、</span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/storage-intelligence-advisor-and-batch-operations-updates/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新しいプロダクト:</strong><span style=\"vertical-align: baseline;\"> 最後に、</span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> の新バージョンは、Google の先駆的なインフラストラクチャである Colossus 分散ファイル システムと Jupiter ネットワークを統合し、</span><a href=\"https://cloud.google.com/blog/ja/products/databases/alloydbs-agentic-database-architecture?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェントの時代における妥協のない新しいデータベース アーキテクチャ</span></a><span style=\"vertical-align: baseline;\">を実現します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">実践ガイドとハウツー</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハウツー:</strong><span style=\"vertical-align: baseline;\"> 世界中に分散している GPU と TPU を、単一のエントリ ポイントの背後にある単一のプールとして動作させたいとお考えの場合は、</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gpu-and-tpu-utilization-with-multi-cluster-gke-inference-gateway?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのブログ記事</span></a><span style=\"vertical-align: baseline;\">でその方法をご確認いただけます。エッジでは、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">マルチクラスタ GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> が、グローバルなマルチリージョン トラフィック分配と高可用性を担います。その下では、</span><a href=\"https://github.com/llm-d/llm-d-router\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLM-d ルーター</span></a><span style=\"vertical-align: baseline;\">が、使用率を高く維持するための複雑なメモリ認識型スケジューリング アルゴリズムを処理します。このアーキテクチャは、ランタイム、モデル、アクセラレータに依存しないように意図的に設計されており、テストでは、マルチクラスタ GKE Inference Gateway を介してトラフィックをルーティングしたところ、オーバーヘッドは 1% 未満でした。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ガイド: </strong><span style=\"vertical-align: baseline;\">AI モデルのトレーニングや推論に TPU 上の GKE を使用されているか、使用される予定ですか？巨大な大規模言語モデル（LLM）のトレーニングや、高スループットの推論サービングの実行には、Cloud TPU や Cloud GPU などの特殊な AI ハードウェアへの多額の投資が必要です。費用対効果を最大化するには、</span><a href=\"https://discuss.google.dev/t/a-tale-of-tpu-observability-on-gke-part-1/397955\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE のワークロード ライフサイクル指標を理解する</span></a><span style=\"vertical-align: baseline;\">必要があります。この詳細なガイドでは、不透明なクラスタの動作を実用的なテレメトリーに変換する方法を説明します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">お客様とパートナーに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE のお客様:</strong><span style=\"vertical-align: baseline;\"> ゲームのスタートアップである SeaVerse が</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/seaverse-chooses-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">マルチテナント ワークロードに GKE Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> を利用している理由と、このプラットフォームによってインフラストラクチャ費用を 60% 削減できた経緯をご覧ください。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">調査、レポート、詳細解説</strong></h4>\n<p><span style=\"vertical-align: baseline;\">また、Google は Gartner と Forrester の 3 つの主要なアナリスト レポートでリーダーに選出され、プロダクトまたは戦略のいずれかで最高スコアを獲得しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/ja/products/compute/forrester-wave-public-cloud-platforms-q3-2026-report?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google、「The Forrester Wave™: Public Cloud Platforms, Q3 2026」でリーダーに選出</span></a><span style=\"vertical-align: baseline;\">: クラウド プロバイダの中で最高の総合スコアを獲得しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/ja/products/compute/google-named-a-leader-in-2026-gartner-magic-quadrant-for-scps?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google、2026 年 Gartner® Magic Quadrant™ で戦略的クラウド プラットフォーム サービス部門のリーダーに選出</span></a><span style=\"vertical-align: baseline;\">: 評価対象となったすべてのベンダーの中で、「ビジョンの完全性」において最高評価を獲得しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/2026-gartner-magic-quadrant-for-container-management?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google、2026 年 Gartner Magic Quadrant でコンテナ管理部門のリーダーに選出</span></a><span style=\"vertical-align: baseline;\">: 評価対象となった全ベンダーの中で「実行能力」において最高評価を獲得しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、世界中の GPU プロバイダの信頼性、パフォーマンス、サポート、料金、セキュリティを評価する最新の SemiAnalysis ClusterMax 3.0 レポートでゴールド評価を獲得しました。詳しくは、</span><a href=\"https://newsletter.semianalysis.com/p/clustermax-30-the-industry-standard\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">レポート全文</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<hr />\n<h4><strong style=\"vertical-align: baseline;\">2026 年 8 月</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">プロダクト、テクノロジー、ツールに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><a href=\"https://cloud.google.com/filestore\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore</span></a><span style=\"vertical-align: baseline;\"> は Google Cloud がファーストパーティとして提供するセキュアでスケーラブルな NFS ファイル サービスであり、AI やエージェント ワークフロー向けのストレージ プラットフォームとして人気を集めています。このたび、Google の基盤となる分散ストレージ システムである</span><a href=\"https://cloud.google.com/blog/ja/products/storage-data-transfer/how-colossus-optimizes-data-placement-for-performance?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Colossus</span></a><span style=\"vertical-align: baseline;\"> 上に直接構築された新しいバックエンド ストレージ レイヤが追加され、これらのタスクにさらに適したサービスとなりました。この新しいバックエンドでは、ストレージ容量とは別に IOPS をプロビジョニングでき、GKE と緊密に統合されています。AI 環境では、いわゆるエージェント スウォーム（多数のエージェントからなる大規模なグループで、共通のデータセットに対して読み取りと書き込みを行う必要がある）を、パフォーマンスを低下させることなく処理できます。詳しくは、</span><a href=\"https://cloud.google.com/blog/ja/products/storage-data-transfer/filestore-file-service-runs-on-colossus?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ投稿</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新機能:</strong><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke?e=48754805&amp;hl=ja\"><strong style=\"vertical-align: baseline;\"> </strong><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor サンドボックスを GKE 上の分散 Ray クラスタで利用できるようになりました</span></a><span style=\"vertical-align: baseline;\">。Anyscale との提携により、gVisor を分散 Ray クラスタに直接組み込むことができる、Ray 向けの試験運用版ライブラリを導入しました。gVisor は Google のオープンソース アプリケーション カーネルであり、通常のコンテナよりも強力な分離機能を持ち、起動時間が短く、メモリ オーバーヘッドが少ない軽量な環境を提供します。GKE でこれらのサンドボックス機能を試すには、</span><a href=\"https://docs.ray.io/en/master/cluster/kubernetes/examples/ray-sandboxing.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray サンドボックス ユーザーガイド</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報: </strong><span style=\"vertical-align: baseline;\">費用はあまりかけたくないけれど、パーソナル AI エージェントを実行するための高性能で使いやすいインフラストラクチャをお探しという方に朗報です。新しい</span><a href=\"https://cloud.google.com/blog/ja/products/serverless/introducing-cloud-run-instances\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run インスタンス</span></a><span style=\"vertical-align: baseline;\">は、Cloud Run 上の専用のシングルトン コンピューティング ランタイムであり、エージェントがアイドル状態になってもシャットダウンされません。さらに、1 個の vCPU と 1 GiB のメモリを備えた Cloud Run インスタンスを 30 日間連続で実行しても、費用は 5.70 ドルしかかかりません。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">実践ガイド、ドキュメント、ハウツー</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド:</strong><span style=\"vertical-align: baseline;\"> Model Context Protocol（MCP）に関する最新情報: 2026-07-28 仕様で、プロトコル コアは「完全にステートレスになりました。handshake はなくなり、initialize / initialized handshake（SEP-2575）と論理的な Mcp-Session-Id ヘッダー（SEP-2567）は完全に削除されました。代わりに、すべてのリクエストが自己記述型で独立したものになりました。」最新の MCP 仕様の変更点と、さらに重要なその実装方法について詳しくは、</span><a href=\"https://developers.googleblog.com/scaling-ai-agent-infrastructure-with-the-mcp-stateless-updates/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらの Google for Developers のブログ記事</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ガイド: </strong><span style=\"vertical-align: baseline;\">従来のネットワーク ロード バランシング手法では、リアルタイム AI システムをうまく扱いきれない場合があります。「バックエンドは、今までのように個別のリクエストを処理するのではなく、継続的なライブ双方向ストリームを管理する必要があります。音声チャンク、文字起こし、モデル出力、合成音声が同時にやり取りされる、絶え間ないストリームを処理するからです。」ここにユーザーへの対応が追加されると、状況はさらに悪化します。「サーバーは、現在処理中の音声生成を即座に停止して、コンテキストを更新し、場合によっては新しいツールをトリガーして、別の回答の作成を開始する必要があります。また、これを接続を切断することなく行わなくてはなりません。」AI 時代における負荷管理の新しいアプローチについては、</span><a href=\"https://developers.googleblog.com/scaling-real-time-ai-agents-with-session-aware-load-balancing/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">セッション対応のロード バランシングによるリアルタイム AI エージェントのスケーリング</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハウツー:</strong><span style=\"vertical-align: baseline;\"> さまざまな GPU アクセラレータが混在する場合でも、GKE 上に弾力性のあるスケーラブルな LLM 推論プラットフォームを構築する方法を学びます。ここで提案するアーキテクチャでは、Capacity Advisor と Compute Advisor に加え、Run:ai Model Streamer や、並列ダウンロード機能を備えた GCSFuse などの高性能ストレージを組み合わせて使用します。詳しくは、</span><a href=\"https://discuss.google.dev/t/how-to-build-an-elastic-scalable-llm-inference-platform-on-gke-using-fluid-compute/388108\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドキュメント: </strong><span style=\"vertical-align: baseline;\">GPU や TPU を搭載したホストの問題は、ライブ マイグレーションを使用して更新することができないためにメンテナンスが困難であることです。この新しいドキュメント ページでは、トレーニング ワークロードと推論ワークロードのダウンタイムをどれだけ許容できるかに応じて、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/perform-host-maintenance-accelerators\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アクセラレータ搭載ホストを更新する</span></a><span style=\"vertical-align: baseline;\">方法を説明します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドキュメント: </strong><span style=\"vertical-align: baseline;\">Advanced Compute Images（ACI）は AI / ML および HPC インフラストラクチャ用の標準化されたイメージ スタックであり、独自のカスタム イメージを手動で構築する必要はありません。この新しいドキュメント ページでは、Google Cloud CLI、コンソール、または SchedMD の Slurm ワークロード マネージャーを使用して</span><a href=\"https://docs.cloud.google.com/compute/docs/instances/use-aci-images\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ACI イメージを作成する</span></a><span style=\"vertical-align: baseline;\">方法を説明します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ガイド: </strong><span style=\"vertical-align: baseline;\">AI ワークロードは、設計の難しさ、リソース消費の激しさ、そしてバースト性があることで知られています。これらはスケーリングのボトルネックを招くだけでなく、十分に活用されない（または誤用される）コンピューティング リソースを大量に発生させる原因にもなります。新しいブログ投稿では、</span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud で動的な容量管理を実現する 3 つの主な方法</span></a><span style=\"vertical-align: baseline;\">について説明します。その 3 つの方法は以下のとおりです。1）計画的なダウンタイムに備えて容量をスケジュールする、2）計画外のダウンタイムに備えて自動フォールバック容量を確保しておく、3）GKE のコア オーケストレーション機能を利用してリソース割り当てを自動化する。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">お客様とパートナーに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ビジネス オーケストレーション ソフトウェア プロバイダの</span><a href=\"https://www.uipath.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">UiPath</strong></a><span style=\"vertical-align: baseline;\"> は、急激に変動するワークロードに対処し、費用の予測可能性を高めたいと考えていました。これを実現するために、同社は分離された複数のクラスタで構成されていたインフラストラクチャを再設計し、トレーニング用の A3 VM インスタンス（NVIDIA H100 GPU）と推論用の G4 VM インスタンス（NVIDIA RTX PRO 6000 Blackwell Server Edition GPU）の両方を含む共有 Google Cloud GPU フリートへと移行しました。同社のアーキテクチャについて詳しくは、</span><a href=\"https://cloud.google.com/blog/topics/customers/how-uipath-built-its-high-performance-gpu-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI 開発の加速に注力する最先端の AI 研究所である </span><a href=\"https://mirendil.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mirendil</strong></a><span style=\"vertical-align: baseline;\"> は、モデルの事前トレーニングとトレーニング後のアプリケーションをサポートするために、TPU と NVIDIA GPU の両方を備えた</span><a href=\"https://cloud.google.com/blog/ja/topics/startups/mirendil-selects-ai-hypercomputer?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer を使用</span></a><span style=\"vertical-align: baseline;\">することを発表しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">小売業向け CRM プロバイダの </span><a href=\"https://replen.it/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Replenit</strong></a><span style=\"vertical-align: baseline;\"> は、BigQuery、Gemini Enterprise Agent Platform、Cloud TPU で実行するオープンソースの Gemma モデルを使用して、Google Cloud で AI 意思決定エンジンを構築しました。同社では、この組み合わせにより、以前のクラウド プロバイダと比較してパイプライン費用が 90% 削減されたとしています。詳しくは、</span><a href=\"https://cloud.google.com/customers/replenit?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">事例紹介の全文</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.malachyte.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Malachyte</strong></a><span style=\"vertical-align: baseline;\"> は、Bigtable、Managed Service for Apache Kafka、Pub/Sub、Compute Engine、そして GKE を基盤として、AI を活用した e コマース レコメンデーション プラットフォームを構築しました。</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのブログ記事</span></a><span style=\"vertical-align: baseline;\">で、これらがどのように連携するかをご覧ください。</span></p>\n</li>\n</ul>\n<hr />\n<h4><strong style=\"vertical-align: baseline;\">2026 年 7 月</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">プロダクト、テクノロジー、ツールに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"vertical-align: baseline;\"> の一般提供が開始されました。4 種類のパフォーマンス ティアがあり、容量 1 TiB あたり 125 MB/秒、250 MB/秒、500 MB/秒、1,000 MB/秒のスループットを選択できます。ストレージ容量は最大 8 PB までスケールアップ可能です。Managed Lustre ソリューションは DDN の EXAScaler を活用しており、DDN が数十年にわたって培ってきた高パフォーマンス ストレージ界をリードする技術と、Google Cloud のクラウド インフラストラクチャに関する専門知識を組み合わせています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><a href=\"https://cloud.google.com/blog/ja/products/compute/c4n-network-and-storage-optimized-vms?e=0\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">C4N ネットワーク / ストレージ最適化 VM の一般提供を開始</span></a><span style=\"vertical-align: baseline;\">しました。C4N は、データ転送のボトルネックを解消するために構築された、Google 初のネットワークとブロック ストレージに最適化された VM シリーズです。第 5 世代 Intel Xeon スケーラブル プロセッサを搭載し、Google の</span><a href=\"https://cloud.google.com/titanium?e=0\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> オフロード ハードウェア上に構築された C4N は、400 Gbps のネットワーク帯域幅と 9,500 万パケット/秒（95 MPPS）の処理速度を実現します。また、Hyperdisk Extreme と組み合わせた場合のブロック ストレージ スループットは最大 25 GiB/秒に達します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新機能:</strong><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/planning-large-clusters#clusters-5k-nodes\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Dataplane V2 が、ネットワーク ポリシー適用下で最大 15,000 ノードまでサポートできるようになりました（一般提供）</span></a><span style=\"vertical-align: baseline;\">。これにより、標準の GKE クラスタ上で、ネットワーク ポリシーの適用を完全に維持したまま、最大 15,000 ノードまでのスケールアップが可能になります。大企業や AI / ML を活用するお客様の膨大なインフラストラクチャ ニーズに対応する機能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新機能:</strong><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/introducing-co-operative-time-slicing-for-rl-in-llm-d?e=0&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d が協調型タイムスライスに対応しました</span></a><span style=\"vertical-align: baseline;\">。強化学習（RL）ワークロードで、独立した RL ジョブを共有の物理ハードウェアにインターリーブして実行できるようになりました。これにより、モデルの収束や精度に影響を与えることなく、アクセラレータの総デューティ サイクルをベースラインの約 40% から最大 70% まで引き上げることが可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新しい AI セキュリティ ツール:</strong><a href=\"https://cloud.google.com/blog/ja/products/identity-security/introducing-k8s-aibom-on-gke-for-automated-ai-bills-of-materials?e=0&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE 上の AI サプライ チェーンの保護</span></a><span style=\"vertical-align: baseline;\">、AI ワークロードの安全なデプロイ、シャドー AI の削減をお考えですか？Google は k8s-aibom をオープンソース化しました。これは、コンテナ クラスタを継続的にモニタリングして、実行中の AI ランタイム（vLLM や Triton など）を自動的に検出し、標準的な CycloneDX Machine Learning 部品構成表（ML-BOM）を生成する、軽量で特権を必要としない Kubernetes コントローラです。</span><a href=\"https://github.com/GoogleCloudPlatform/k8s-aibom\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">k8s-aibom プロジェクト</span></a><span style=\"vertical-align: baseline;\">をチェックして、ぜひ開発にご参加ください。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">実践ガイドとハウツー</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド: </strong><span style=\"vertical-align: baseline;\">7 月 27 日、Google は Moonshot AI の 2.8 兆パラメータのオープンウェイト モデルである</span><a href=\"https://discuss.google.dev/t/announcing-day-0-support-for-kimi-k3-on-google-cloud/385392\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Kimi K3 の「Day 0 サポート」</span></a><span style=\"vertical-align: baseline;\">を発表しました。モデルのウェイト公開と同時にサポートを開始し、即日の利用を可能にしました。Model Garden、カスタム オーケストレーション、llm-d レシピを使用した GKE など、選択したデプロイ手法に合わせて Google Cloud で Kimi K3 を評価して試験運用するための詳細な手順をこのガイドでご確認いただけます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド:</strong><a href=\"https://cloud.google.com/blog/ja/topics/developers-practitioners/autopilot-clusters-with-gke-managed-dranet-gpus-and-tpus\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine（GKE）マネージド DRANET は、GPU と TPU の両方に対応しています</span></a><span style=\"vertical-align: baseline;\">。この実装を使用するための構成には、標準クラスタ（ユーザーが完全に制御可能）や Autopilot クラスタ（Google によって複雑な構成が自動的に行われる）など、いくつか選択肢があります。詳細については、ハンズオンラボ</span><a href=\"https://codelabs.developers.google.com/codelabs/gke-autopilot-tpus-dranet-gemma#0\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU を使用する GKE Autopilot クラスタ、GKE マネージド DRANET、Gemma 4</span></a><span style=\"vertical-align: baseline;\"> でご確認いただけます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド:</strong><span style=\"vertical-align: baseline;\"> GPU ではなく TPU で Ray を実行する方法を学べます。全 2 回シリーズの</span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-1-the-foundations/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パート 1</span></a><span style=\"vertical-align: baseline;\"> では、TPU スライスについて説明します（ヒント: Ray は TPU スライスを、スケジュール設定可能なアクセラレータの一種として認識します）。続く</span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-2-ray-ai-libraries/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パート 2</span></a><span style=\"vertical-align: baseline;\"> では、Ray のさまざまな AI ライブラリについて説明します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド: </strong><span style=\"vertical-align: baseline;\">新しいマイクロベンチマーク スイートを使用して、サンプル ワークロードにおける TPU の性能を評価します。このスイートを活用することで、デバイスが理論上のパフォーマンス仕様を達成しているかを正確に測定できるほか、特定の性能ギャップやアーキテクチャ固有のボトルネックを特定することも可能です。詳細は</span><a href=\"https://developers.googleblog.com/how-to-use-google-microbenchmarks-for-evaluating-tpu-performance/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">でご確認いただけます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド:</strong><span style=\"vertical-align: baseline;\"> 予算を圧迫することなく、エージェントをスケールしましょう。GKE Agent Sandbox と Pod スナップショットを活用して</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/reduce-your-agents-costs-with-gke-agent-sandbox?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">固定のコンピューティング リソース内でより多くのエージェントを安全に集約する方法を、GKE オーケストレーションの観点から解説</span></a><span style=\"vertical-align: baseline;\">します。パフォーマンス重視かコスト重視かを問わず、エージェントの効率を最大化するための適切な最適化方法を解説します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">技術ブループリント: </strong><span style=\"vertical-align: baseline;\">Ironwood における Mistral 3 Large 推論の最適化について詳細に解説します。こちらのブログ記事では、Google のあるチームが Google の Ironwood（TPU v7x）で Mistral 3 Large MoE モデルの推論を最適化し、パフォーマンスを 1.5 倍向上させた方法について説明しています。具体的には、ハイブリッド シャーディングの導入、線形 VPU 合計からツリー リダクションへの置き換え、GMM / MLA カーネルの最適化、非同期スケジューリングの採用によって、これを実現しました。その結果、ベンチマーク精度を維持したまま、スループットを最大 48% 向上させるという成果を収めました。ブログの全文は</span><a href=\"https://discuss.google.dev/t/inside-the-optimization-of-mistral-3-large-inference-on-ironwood/385847\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">でご覧ください。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">調査、レポート、詳細解説</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レポート: </strong><span style=\"vertical-align: baseline;\">Google は、初めて発表された</span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/google-is-a-leader-in-gartner-magic-quadrant-for-ai-infra?e=0&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gartner</span><span style=\"text-decoration: underline; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Ⓡ</span></span><span style=\"text-decoration: underline; vertical-align: baseline;\"> Magic Quadrant™ の AI インフラストラクチャ部門</span></a><span style=\"vertical-align: baseline;\">において、リーダーに選出され、「実行能力」で最高位、「ビジョンの完全性」で最も先進的との評価を獲得しました。Gartner は、Google 独自の拡張可能なコンピューティング、統合された AI Hypercomputer アーキテクチャ、AI コンピューティング容量の規模を主な強みとして挙げています。レポートは</span><a href=\"https://cloud.google.com/resources/content/2026-gartner-mq-ai-infrastructure?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">からダウンロードしてお読みいただけます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レポート:</strong><span style=\"vertical-align: baseline;\"> Google は先ごろ、「</span><a href=\"https://cloud.google.com/resources/content/state-of-infrastructure-in-the-agentic-ai-era?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI インフラストラクチャの現状</span></a><span style=\"vertical-align: baseline;\">」レポートの作成にあたり、1,400 人を超える IT 部門の上級リーダーを対象に調査を実施しました。その結果、AI に対する構想とインフラストラクチャの実態との隔たりが広がっているという明確な傾向が浮かび上がりました。実際、83% の組織が、本番運用に対応できるエージェント型 AI を支えるには、インフラストラクチャのアップグレードが必要だと回答しています。</span><a href=\"https://cloud.google.com/blog/ja/products/compute/state-of-ai-infrastructure-report-overview?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">この調査について紹介したブログ記事</span></a><span style=\"vertical-align: baseline;\">では、エージェント型アプリケーションがシステムに求める要件に合わせてインフラストラクチャを整備することで、試験導入から本番運用への移行を進めやすくなることを説明しています。</span></p>\n</li>\n</ul>\n<hr />\n<h4><strong style=\"vertical-align: baseline;\">2026 年 6 月</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">プロダクト、テクノロジー、ツールに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><span style=\"vertical-align: baseline;\"> AI で使用される機密データの保護は、先進的でセキュアなクラウド インフラストラクチャを実現するうえで欠かせない要素です。</span><a href=\"https://cloud.google.com/security/products/confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> は、ハードウェアベースの高信頼実行環境（TEE）で使用中のデータを暗号で保護し、データの完全性を検証可能にする技術です。このたびこの技術が、</span><a href=\"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell Server Edition GPU</span></a><span style=\"vertical-align: baseline;\"> を搭載したアクセラレータ最適化型</span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">G4 マシンシリーズ</span></a><span style=\"vertical-align: baseline;\">で</span><a href=\"https://cloud.google.com/blog/products/identity-security/verifiable-trust-in-the-ai-era-whats-new-in-confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">提供開始</span></a><span style=\"vertical-align: baseline;\">されました。</span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 VMs</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 GKE Nodes</span></a><span style=\"vertical-align: baseline;\"> をぜひ使ってみてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デベロッパー向けリソース: </strong><span style=\"vertical-align: baseline;\">新設された</span><a href=\"https://cloud.google.com/products/tpu/tpu-developer?e=0\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU デベロッパー ハブ</span></a><span style=\"vertical-align: baseline;\">は、モデルの作成者、最適化担当者、デベロッパーが Google Cloud TPU のパフォーマンスを最大限に引き出す方法を学ぶための場所です。詳細については、こちらの</span><a href=\"https://developers.googleblog.com/unlocking-the-power-of-the-tpu-stack-introducing-our-new-developer-hub/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新プロダクト: </strong><span style=\"vertical-align: baseline;\">新しい</span><a href=\"https://discuss.google.dev/t/stop-training-blind-scaling-ai-with-the-new-opentelemetry-based-tpu-ai-telemetry-collector-agent/375210\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenTelemetry ベースの TPU AI テレメトリー コレクタ エージェント</span></a><span style=\"vertical-align: baseline;\">を使用して、AI ワークロードをスケールしましょう。このたび初めて、高忠実度の TPU ハードウェア テレメトリーを、Google Cloud Monitoring、Google Managed Prometheus、または独自のセルフホスト型 Grafana スタックにルーティングできるようになりました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">実践ガイドとハウツー</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド:</strong><span style=\"vertical-align: baseline;\"> TPU、Cloud Storage FUSE、動的リソース割り当て（DRA）を使用して、GKE Inference Gateway で実行される AI 推論ワークロードで高可用性を実現する方法を学べます。こちらの</span><a href=\"https://cloud.google.com/blog/ja/topics/developers-practitioners/experimenting-with-tpus-gke-managed-dranet-and-multi-cluster-inference-gateway?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">で概要を紹介しています。また、技術的な詳細については</span><a href=\"https://codelabs.developers.google.com/codelabs/gke-inference-gateway-multi-cluster-tpus-dranet#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ハンズオン Codelab</span></a><span style=\"vertical-align: baseline;\"> でご確認いただけます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">入門ガイド:</strong><span style=\"vertical-align: baseline;\"> Model Context Protocol（MCP）を使用して、AI エージェントを</span><a href=\"https://cloud.google.com/storage\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> の非構造化データに接続できることをご存じですか？</span><a href=\"https://cloud.google.com/blog/ja/topics/developers-practitioners/build-ai-agents-faster-with-gcs-google-cloud-storage-mcp-server\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのブログ記事</span></a><span style=\"vertical-align: baseline;\">では 3 つのお客様事例に基づく導入のメリットと、具体的な実装方法を解説しています。フルマネージド サービスにすべきか、詳細なカスタマイズと管理が可能なセルフマネージド ローカル サーバーにすべきかを判断する方法もご紹介しています。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">調査、レポート、詳細解説</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レポート: </strong><span style=\"vertical-align: baseline;\">第三者機関によるベンチマーク レポートにおいて、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> は他社の主要マネージド Kubernetes サービスを凌駕するパフォーマンスを記録しました。具体的には、スループットは 15.7% 高く、待ち時間は 92.8% 短く、トークン間のレイテンシは 62.6% 低いという結果でした。このパフォーマンスの鍵は、接頭辞キャッシュの使用にあります。長く繰り返し使用されるプロンプトの接頭辞に対応する KV キャッシュ（アクティベーション状態）を保存することで、LLM のパフォーマンスを最適化しています。詳しくは、こちらの</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-inference-gateway-prefix-caching-accelerates-ai-inference?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アーキテクチャの詳細解説: </strong><span style=\"vertical-align: baseline;\">今回は</span><a href=\"https://discuss.google.dev/t/accelerate-tpu-model-loading-while-saving-ram-on-gke/374835\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU と GKE におけるコールド スタート問題</span></a><span style=\"vertical-align: baseline;\">を深堀りし、Run:ai Model Streamer がどのようにその状況を変えられるかについて解説します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">お客様とパートナーに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お客様の成功事例:</strong><span style=\"vertical-align: baseline;\"> Pager Health は、GKE、BigQuery、Cloud SQL、Gemini Enterprise Agent Platform を活用して</span><a href=\"https://www.youtube.com/watch?v=x36QJ-QKRGg\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">運用の断片化を解消し、人々の生活に大きな変化をもたらすシンプルかつパーソナライズされた医療体験を米国で展開</span></a><span style=\"vertical-align: baseline;\">しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お客様の成功事例:</strong><span style=\"vertical-align: baseline;\"> カスタマー レビュー プラットフォームの Trustpilot は、A100 GPU 搭載のコスト最適化済み A2 VM 上で Dataflow と Gemini Enterprise Agent Platform を活用して、大規模なストリーミング パイプラインを構築しました。ファインチューニングされた Gemma モデルや、同プラットフォームが管理する最適化版 vLLM を採用しています。</span></p>\n</li>\n</ul>\n<hr />\n<h4><strong style=\"vertical-align: baseline;\">2026 年 5 月</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">プロダクト、テクノロジー、ツールに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの最新情報:</strong><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> の一般提供が開始されました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新しいオープンソース プロジェクト:</strong><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> は、エージェント インフラストラクチャの密度を限界まで高めることを目指す、新しいオープンソース プロジェクトです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">新機能:</strong><a href=\"https://ai.google.dev/edge/ai-edge-portal\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Edge Portal</span></a><span style=\"vertical-align: baseline;\"> は、オンデバイス ML を大規模にテストしてベンチマーク評価するためのソリューションです。このたび、オンデバイス LLM のベンチマークとデバッグに対応しました。詳しくは</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/benchmark-llms-on-device-with-ai-edge-portal?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロダクトの詳細解説: </strong><span style=\"vertical-align: baseline;\">AI ワークロード向けの新しい高性能ストレージ サービス ファミリーである</span><a href=\"https://cloud.google.com/blog/ja/products/storage-data-transfer/cloud-storage-rapid-turbocharges-object-storage-for-ai-analytics?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage Rapid について詳しく説明</span></a><span style=\"vertical-align: baseline;\">しました。リリース時点でご利用いただけるサービスには、高パフォーマンスのゾーン オブジェクト ストレージ サービスである Rapid Bucket（旧称: Rapid Storage）と、オンデマンドで読み取りを高速化して既存バケットのワークロードのコンピューティングとデータをコロケーションする Rapid Cache（旧称: Anywhere Cache）が含まれます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">調査、レポート、詳細解説</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アーキテクチャの詳細解説: </strong><span style=\"vertical-align: baseline;\">Google グローバル インフラストラクチャ担当バイス プレジデントの Bikash Koley とエンジニアリング フェローの Arjun Singh が、</span><a href=\"https://cloud.google.com/blog/ja/products/networking/data-center-and-global-networks-built-for-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI ワークロードがネットワーク インフラストラクチャにもたらす課題</span></a><span style=\"vertical-align: baseline;\">の概要を説明し、AI ワークロードをより適切にサポートするためにデータセンター ファブリック、WAN、グローバル ネットワークに施した大幅な機能強化をご紹介します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アーキテクチャの詳細解説: </strong><span style=\"vertical-align: baseline;\">TPU で最先端の AI モデルを開発するために、インスタンス レベルの信頼性モデルを廃止し、</span><a href=\"https://cloud.google.com/blog/ja/products/compute/cluster-reliability-for-trillion-parameter-models-on-tpus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">新しいクラスタレベルの信頼性モデル</span></a><span style=\"vertical-align: baseline;\">を公開しました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">お客様とパートナーに関する最新情報</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お客様の成功事例:</strong><span style=\"vertical-align: baseline;\"> ビジュアル メディア プロバイダの Imgix は、NVIDIA RTX PRO 6000 Blackwell GPU 搭載の G4 VM を備えた</span><a href=\"https://cloud.google.com/blog/ja/products/infrastructure/how-imgix-processes-8-billion-images-daily-with-g4-vms-powered-by-nvidia-blackwell?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer を活用して、80 億を超える画像や動画を配信しています</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud ブログ編集者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Alex Barrett</strong></p></div>"
  "d4a1f1feac92becce9539516466c20b8":
    "id": "d4a1f1feac92becce9539516466c20b8"
    "title": "アイルランドにおけるイノベーション: アイルランド企業が Gemini によって事業を拡大している方法"
    "link": "https://cloud.google.com/blog/ja/topics/customers/ireland-innovation-companies-startups-governments-scale-with-gemini/"
    "published": "2026-10-20 10:00:00"
    "fetched": "2026-10-20 12:30:35"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 9 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/customers/ireland-innovation-companies-startups-governments-scale-with-gemini?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここ数十年間で、アイルランドはグローバル テクノロジーの一大拠点へと成長を遂げました。モダナイゼーションが加速するなか、政府機関から大手企業、AI などの分野で成長を続けるスタートアップに至るまで、アイルランドのさまざまな組織が技術基盤を強化しています。現在、国内のリーダーたちは、ビジネスや業務ワークフローのあらゆるレイヤにエージェント型 AI を導入しています。</span></p>\n<p><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> を活用し、初期のプロトタイプからプロダクション レディなデプロイへと移行する組織が増えています。このような進展が、欧州市場におけるアイルランドの競争力を強固なものにしています。</span><a href=\"https://services.google.com/fh/files/blogs/google_ireland_economic_impact_25_final.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google の現地での貢献度</span></a><span style=\"vertical-align: baseline;\">を試算した Implement Consulting Group の最新レポートによると、官民のリーダーたちは、世界の AI 市場における経済効果を 400 億〜450 億ユーロと推計しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした強い意欲は、政府が進めるより広範な取り組みとも合致しています。2026 年後半の EU 理事会議長国就任を見据え、アイルランドはより高次元なテクノロジーおよび政策対話を主導してきました。そして、さまざまな分野における生産性とイノベーションの向上を目指し、</span><a href=\"https://www.gov.ie/en/department-of-the-taoiseach/press-releases/government-publishes-new-digital-ai-strategy-90-actions-to-strengthen-irelands-position-as-a-digital-leader-and-ai-hub/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">国家デジタルおよび AI 戦略</span></a><span style=\"vertical-align: baseline;\">の枠組みを策定しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この戦略を支援するため、Google はこれらの機能をより手軽に利用できるよう注力しています。Google の現地チームは、業界をリードする企業と連携して Gemini Enterprise の導入を進めています。Gemini Enterprise は、会話型 AI エージェントや自然言語によるデータ分析から、エージェント型エコシステムを活用した業務運用の最適化まで、多彩な機能を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">経済的な波及効果は、すでに目に見える形で現れ始めています。2025 年だけでも、AI やクラウド サービスを含む Google の事業活動は、アイルランドの国内総生産に推定 100 億ユーロの付加価値をもたらしました。この勢いはアイルランド全土に広がりを見せており、さまざまな組織が Google Cloud を活用してインフラストラクチャをモダナイズし、AI の本格的な業務活用を進めています。</span></p>\n<p><span style=\"vertical-align: baseline;\">アイルランドのさまざまな組織が Google Cloud と Gemini Enterprise を活用してモダナイゼーションを実現している事例をご紹介します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Ryanair: AI を活用したオペレーションで数百万人の乗客をサポート</strong></p>\n<p><span style=\"vertical-align: baseline;\">ヨーロッパ最大の航空会社である Ryanair は、約 35,000 人の従業員に Gemini Enterprise と Google Workspace を導入することで、協調的な業務とインフラストラクチャを</span><a href=\"https://www.googlecloudpresscorner.com/2026-08-12-Ryanair-and-Google-Cloud-Announce-Five-Year-Data-and-AI-Partnership\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">モダナイズ</span></a><span style=\"vertical-align: baseline;\">しています。乗務員、運航計画担当者、本社系スタッフは、意思決定の合理化、クルーのロジスティクスの最適化、本社業務の生産性向上によるメリットを享受できます。同時に、デュアル クラウド戦略が、インフラストラクチャの復元力を強化し、2034 年までに乗客数を 3 億人に増やすという同社の目標達成を支えています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Smyths Toys: エージェント型サポートでカスタマー エクスペリエンスを刷新</strong></p>\n<p><span style=\"vertical-align: baseline;\">世界最大級の玩具専門小売業者である Smyths Toys は、Google Cloud と Gemini Enterprise を活用して</span><a href=\"https://cloud.google.com/customers/smyths-toys-ge?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">カスタマー サポートを刷新</span></a><span style=\"vertical-align: baseline;\">しています。AI エージェント「Codie」を導入したことで、同社はウェブ問い合わせの 60% 以上を自己解決へと導き、ホリデー シーズンの未対応メールの滞留を削減しました。繁忙期には 1 日最大 1,000 件のメール対応に追われていたカスタマーケア チームが、より複雑な判断を要する約 50 件の問い合わせに集中できるようになりました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">アイルランド歳入庁: 公共部門のデータを進化</strong></p>\n<p><span style=\"vertical-align: baseline;\">アイルランドでは、公共機関も進歩を遂げています。税金や関税を管理し、アイルランド経済の円滑な運用を支える</span><a href=\"https://www.revenue.ie/en/home.aspx\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アイルランド歳入庁</span></a><span style=\"vertical-align: baseline;\">は、</span><a href=\"https://blog.google/intl/en-ie/products/revenue-ireland/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud と連携</span></a><span style=\"vertical-align: baseline;\">して、従来のオンプレミス システムから統合 AI レイクハウス アーキテクチャへの移行を進めています。このアーキテクチャは、データサイロを解消し、信頼できる唯一の情報源を確立するよう設計されています。厳格なデータ主権管理によって納税者情報を保護する一方で、Gemini Enterprise がエージェント型データ分析を推進し、歳入庁がセキュアで迅速かつ柔軟な行政サービスを提供できるよう支援しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Virgin Media Ireland: ワークフローを高速化</strong></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud と </span><a href=\"https://www.libertyglobal.com/liberty-global-google-cloud/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Liberty Global のパートナーシップ</span></a><span style=\"vertical-align: baseline;\">のもと、Virgin Media Ireland は AI の活用を概念検証から本番環境へと移行させています。最新のインフラストラクチャと自動化により、同チームはワークロードのデプロイ速度を 3 倍に向上させました。現在は複数の AI エージェントの展開を進めているほか、事業成長を牽引する新たなカスタマー サービスの立ち上げに取り組んでいます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ向けツールで事業を拡大するアイルランドのスタートアップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">既存の大手企業がレガシー システムのモダナイズを進める一方で、アイルランドのスタートアップは創業初日から最新のテクノロジーを基盤にビジネスを展開しています。現地の強固なテクノロジー エコシステムに支えられたこれらの機動的なチームは、グローバルな舞台で競い合えるサービスを生み出しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Hexis: パーソナライズされたスポーツ栄養の提供を拡大</strong></p>\n<p><a href=\"https://hexis.live/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hexis</span></a><span style=\"vertical-align: baseline;\"> は、アスリートがパフォーマンスの最大化とコンディションの回復を図るためのテクノロジー ソリューションを開発しています。同社は、リアルタイムの生体データや行動データを Google Cloud 上で保存および処理し、Gemini Enterprise を活用して自然言語での対話機能を実現しています。これにより、ユーザーに対して 1 日を通じた最適な栄養補給の調整方法を説明しています。現在、このプラットフォームは、</span><a href=\"https://www.letour.fr/en/landing-page\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ツール・ド・フランスの集団</span></a><span style=\"vertical-align: baseline;\">に属する選手の 40% と、2026～2027 年シーズンの</span><a href=\"https://www.premierleague.com/en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プレミアリーグ</span></a><span style=\"vertical-align: baseline;\">加盟クラブの半数をサポートしています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Kitman Labs: パフォーマンス分析を統合</strong></p>\n<p><span style=\"vertical-align: baseline;\">2012 年にダブリンで設立された </span><a href=\"https://www.kitmanlabs.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kitman Labs</span></a><span style=\"vertical-align: baseline;\"> は、世界 26 か国、4,000 以上のスポーツ組織に向けて、スポーツ サイエンスとパフォーマンス インテリジェンスを提供しています。同社は、自社のインテリジェンス プラットフォームに高度なアナリティクスと Gemini Enterprise を組み合わせることで、チームがデータに基づく意思決定を行えるよう支援しています。これにより、アスリートの健康維持、怪我のリスク軽減、選手のキャリア延伸に貢献しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Spryt: 医療連携の自動化</strong></p>\n<p><a href=\"https://spryt.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spryt</span></a><span style=\"vertical-align: baseline;\"> は、</span><a href=\"https://cloud.google.com/customers/spryt?hl=en&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud と Gemini Enterprise を基盤とする AI を使用</span></a><span style=\"vertical-align: baseline;\">し、患者体験の最適化、無断キャンセルの削減、管理業務の負担軽減を実現することで、英国と米国における医療連携の効率化を図っています。同社は NHS と連携し、米国の 70 以上のクリニックで事業を展開しています。また、Mayo Clinic との複数年にわたる共同プロジェクトの一環として、これまでに 2 億 2,400 万件もの予約実績データを分析してきました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">IMPT: カーボン オフセットを自動化</strong></p>\n<p><a href=\"https://impt.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IMPT</span></a><span style=\"vertical-align: baseline;\"> は、AI、ブロックチェーン、Google Cloud を連携させることで、検証済みのカーボン オフセットを日常的なホテル予約やオンライン購入に組み込んでいます。15 週間かけて Google Cloud に移行した同社は、195 か国で 800 万件のリスティングをサポートしています。Gemini Enterprise の導入により、同社の少数精鋭チームは 1 日あたり約 400 件の顧客チャットに対応し、応答時間の中央値 6 秒という迅速なサポートを実現しています。これにより、スタッフはシステム管理の手間から解放され、ビジネスの成長に注力できるようになりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">アイデアを構想から本番環境へ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">アイルランドが世界のテクノロジー ハブとして発展を続けるなか、現地の組織は AI の持つ可能性をいかにして実質的な成果へと結びつけるか、その実践例を示しています。お客様事例をご覧いただき、他の組織が Google Cloud をどのように活用しているかをご確認ください。また、アイルランドの Google チームにお問い合わせいただき、導入への取り組みを加速させてください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud 英国およびアイルランド担当マネージング ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sandeep Khanna</strong></p></div>"
  "0c9f7a26ecaa732d44e8360c5983d70a":
    "id": "0c9f7a26ecaa732d44e8360c5983d70a"
    "title": "AI 推論モデル提供のためのネットワーキング - GKE のみ、およびその他すべてのバックエンド"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/networking-for-ai-inference-model-serving-gke-only-and-for-all-other-backends/"
    "published": "2026-10-20 10:30:00"
    "fetched": "2026-10-20 18:08:00"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/networking-for-ai-inference-model-serving-gke-only-and-for-all-other-backends?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業や個人の開発者は、複数の AI 推論モデルを頻繁に実行しています。適切なアーキテクチャを使用することで、モデルの呼び出し方法を簡素化すると同時に、一元化されたガバナンスを提供できます。この投稿では、ネットワークにおける AI 推論モデルの提供に焦点を当てた 2 つのリファレンス アーキテクチャについて説明します。1 つは</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine（GKE）</span></a><span style=\"vertical-align: baseline;\">用、もう 1 つはその他のすべてのバックエンド タイプ用です。まず、後ほど紹介するリファレンス アーキテクチャの共通点について説明します。次に、GKE バックエンドのアーキテクチャに固有のコンポーネントについて説明し、最後に、すべてのバックエンド タイプに共通するアーキテクチャの要素を確認します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エントリ ポイント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">推論呼び出しのフロントエンドとして機能する、高い安定性、セキュリティ、信頼性を持つエントリ ポイントの背後にモデルのデプロイを公開できます。このエントリ ポイントは、ポリシー、セキュリティ、ロジックを適用できる制御ゾーンとしても機能します。Cloud ロードバランサと推論ゲートウェイはどちらもエントリ ポイント機能を提供します。これらのタイプのエンドポイントは、TLS によるセキュアな接続の終端、API 管理コンポーネントとの統合、Service Extensions による機能の拡張、Model Armor の機能を活用したセキュリティ強化が可能です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">設計における共通サービス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">どちらのリファレンス設計でも、次のサービスを使用します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/vpc/docs/private-service-connect#endpoints\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Private Service Connect 推論エンドポイント</strong></a><span style=\"vertical-align: baseline;\">: 消費者の Virtual Private Cloud（VPC）ネットワーク内にエントリ ポイントを固定します。トラフィックはプライベート内部</span><a href=\"https://docs.cloud.google.com/vpc/docs/subnets#valid-ranges\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">IP アドレス</span></a><span style=\"vertical-align: baseline;\">に到達するため、推論呼び出しはプライベート ネットワーク内に保持されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/get-started/what-apigee\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Apigee API Management</strong></a><strong style=\"vertical-align: baseline;\">（省略可）</strong><span style=\"vertical-align: baseline;\">: Apigee Extension Processor コールアウトを介して統合され、リクエストがコンピューティング リソースに到達する前に、クライアント ID の検証、レート制限、割り当ての適用を処理します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/model-armor/overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</strong></a><span style=\"vertical-align: baseline;\">: インライン AI 安全性チェックポイントとして機能し、プロンプト インジェクションや機密データの漏洩がないか、プロンプトと出力補完をスクリーニングします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">GKE のみで提供される設計パターン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このセクションでは、GKE のみのバックエンド設計に焦点を当てます。エンドツーエンドのコンセプトを完全に理解するには、アーキテクチャに関するドキュメント </span><a href=\"https://docs.cloud.google.com/architecture/networking-for-ai-inference-gke\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE での AI 推論モデル提供のためのネットワーキング</strong></a><span style=\"vertical-align: baseline;\">をすべてお読みください。設計パターンは、次の図に基づいています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"networking-ai-inference-model-serving-gke-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/networking-ai-inference-model-serving-gke-.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">前のセクションで特定した共通サービスに加えて、GKE の設計では次のコンポーネントを使用します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</strong></a><span style=\"vertical-align: baseline;\">: 内部アプリケーション ロードバランサ（</span><code style=\"vertical-align: baseline;\">gke-l7-rilb</code><span style=\"vertical-align: baseline;\">）としてデプロイされます。受信リクエストのペイロードを解析し、HTTPRoute ルールを評価して、適切なモデル提供ターゲットにクエリを転送する、特殊な内向きエンジンとして機能します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">推論プール</strong><span style=\"vertical-align: baseline;\">: 同じモデルのレプリカを含む論理グループ。Gateway はプロンプトを受け取ると、HTTPRoute ルールを評価し、モデル識別子に基づいて適切な推論プールを選択します。プールには初期サイズがあり、動的に自動スケーリングされるように構成できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">モデル レプリカセット</strong><span style=\"vertical-align: baseline;\">: シングルノードまたはマルチノードの GPU または TPU ノードプールにデプロイされた個々のモデルレプリカ（推論サーバー インスタンス）。レプリカセットは、これらのモデルレプリカの均一なグループを表します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">GKE のトラフィック フローの例</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この GKE ベースのアーキテクチャを使用してバックエンド モデルを呼び出すクライアント アプリケーションは、次のようなフローをたどります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">内向き</strong><span style=\"vertical-align: baseline;\">: コンシューマー VPC 内のクライアント アプリケーションが、ローカルの Private Service Connect エンドポイントに対して OpenAI 互換の API 呼び出しを発行し、リージョン内部アプリケーション ロードバランサを使用して GKE Inference Gateway に直接ルーティングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ペイロード検査</strong><span style=\"vertical-align: baseline;\">: Gateway は、リクエスト本文で指定されたターゲット モデル パラメータを読み取り、HTTP ヘッダーに追加します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コントロール プレーンの検証</strong><span style=\"vertical-align: baseline;\">: Apigee が使用されている場合、クライアントの認証情報と割り当てがチェックされます。Model Armor がプロンプトをスクリーニングし、ポリシー違反やデータ漏洩がないかを確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">バックエンドの選択</strong><span style=\"vertical-align: baseline;\">: Gateway は HTTPRoute マッピングを評価してターゲット プールを特定し、プレフィックス キャッシュ共有コンテキストを照合して、リアルタイムの Prometheus データに基づいて最も負荷の低い GPU または TPU レプリカにルーティングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">外向き</strong><span style=\"vertical-align: baseline;\">: レプリカが推論ワークロードを実行します。出力トークンは Model Armor を通過して最終的なレスポンス検証が行われ、その後、プライベート接続を介してストリーミングで送り返されます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">すべてのバックエンドで提供される設計パターン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このセクションでは、推論に使用できる複数のバックエンド タイプに焦点を当て、次の図に示すアーキテクチャの概要を説明します。エンドツーエンドのコンセプトを完全に理解するには、アーキテクチャに関するドキュメント</span><a href=\"https://docs.cloud.google.com/architecture/networking-for-ai-inference\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">すべてのバックエンドでの AI 推論モデル提供のためのネットワーキング</strong></a><span style=\"vertical-align: baseline;\">をすべてお読みください。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"networking-ai-inference-model-serving-all-backends\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/networking-ai-inference-model-serving-all-.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">GKE、Cloud Run、Agent Platform、オンプレミス データセンター、外部クラウドなどの混合環境にまたがるアーキテクチャでは、次のコンポーネントが追加で使用されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/load-balancing/docs/l7-internal#load-balancer-mode\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">リージョン内部アプリケーション ロードバランサ</strong></a><span style=\"vertical-align: baseline;\">: ルーティング ロジック、SSL 終端、Service Extensions コールアウトを管理する、中央のレイヤ 7 ルーティング プロキシとして機能します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/llm-d/llm-d-inference-payload-processor\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">推論ペイロード プロセッサ</strong></a><strong style=\"vertical-align: baseline;\">（Service Extensions）</strong><span style=\"vertical-align: baseline;\">: これは、GKE Inference Gateway で使用される本文ベースのルーティングに似ていますが、アプリケーション ロードバランサでこの機能を有効にするには、Service Extensions が必要です。軽量の Cloud Run コールアウトが、受信した OpenAI API リクエストの JSON 本文を検査し、ターゲット モデル識別子を抽出して、URL マップによるルーティングを実行するために X-Gateway-Model-Name ヘッダーを書き込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/load-balancing/docs/negs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ネットワーク エンドポイント グループ（NEG）</strong></a><span style=\"vertical-align: baseline;\">: 書き込まれたモデルヘッダーに基づいて、異種バックエンドへの柔軟なルーティングを実現します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">すべてのバックエンドのトラフィック フローの例</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このアーキテクチャを使用してバックエンド モデルを呼び出すクライアント アプリケーションは、次のようなフローをたどります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プライベート内向き</strong><span style=\"vertical-align: baseline;\">: クライアント アプリケーションは、プライベート IP アドレス空間を介して Private Service Connect エンドポイントをターゲットにします。リージョン内部アプリケーション ロードバランサがリクエストを受信します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">モデル名の抽出</strong><span style=\"vertical-align: baseline;\">: ロードバランサは、ペイロードを Cloud Run 本文ベースのルーター コールアウトに送信します。このコールアウトは、JSON ペイロードを検査して X-Gateway-Model-Name ヘッダーを挿入します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ポリシーと安全性の適用</strong><span style=\"vertical-align: baseline;\">: リクエストは Apigee に渡されて ID と割り当てが検証され、その後 Model Armor に渡されて機密データが削除され、悪意のあるプロンプトがブロックされます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NEG ルーティング</strong><span style=\"vertical-align: baseline;\">: ロードバランサの URL マップがモデルヘッダーを検査し、一致するバックエンド NEG（Agent Platform、GKE、Cloud Run、ハイブリッド、インターネット）にリクエストを転送します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プライベート配信</strong><span style=\"vertical-align: baseline;\">: ターゲット バックエンドがモデル プロンプトを実行し、Model Armor が補完をスクリーニングして、結果が内向きパスに沿ってプライベートに返されます。</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"networking-ai-inference-model-serving-flow\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/networking-ai-inference-model-serving-flow.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud での AI ワークロードの構築について詳しくは、以下をご覧ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ドキュメント セット:</span><a href=\"https://docs.cloud.google.com/architecture/agentic-ai-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント型 AI アーキテクチャ ガイド</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アーキテクチャ センター:</span><a href=\"https://docs.cloud.google.com/architecture/multi-agent-private-networking-patterns\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud におけるマルチエージェント プライベート ネットワーキング パターン</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ドキュメント:</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/general/netsec-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform のネットワーキング アクセスの概要</span></a></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ご質問やご意見がございましたら、</span><a href=\"https://www.linkedin.com/in/ammett/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Linkedin</span></a><span style=\"vertical-align: baseline;\"> 経由で筆者までご連絡ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">デベロッパーリレーションズ エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ammett Williams</strong></p></div>"
