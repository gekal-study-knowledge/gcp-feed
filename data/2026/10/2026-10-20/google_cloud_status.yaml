    "summary": "<p> Incident began at <strong>2026-10-19 23:08</strong> <span>(all times are <strong>US/Pacific</strong>).</span></p><div class=\"cBIRi14aVDP__status-update-text\"><p><strong>Summary</strong></p>\n<p>Multiple services are experiencing issues in the europe-west2 region.</p>\n<p><strong>Description</strong></p>\n<p>We are experiencing an issue with multiple services in europe-west2  beginning on Monday, 2026-10-19 23:08 PDT.</p>\n<p>Our engineering team continues to investigate the issue.</p>\n<p>We will provide an update by Tuesday, 2026-10-20 02:30 PDT with current details.</p>\n<p>We apologize to all who are affected by the disruption.</p>\n<p><strong>Symptoms</strong></p>\n<p>Multiple Google Cloud services are experiencing elevated errors and intermittent network failures in europe-west2 region.</p>\n<p><strong>Workaround</strong></p>\n<p>None for now</p>\n</div><hr /><p>Affected products: AlloyDB for PostgreSQL, Apigee, BigQuery Data Transfer Service, Cloud Data Fusion, Cloud Filestore, Cloud Firestore, Cloud Memorystore, Cloud Run, Cloud Spanner, Datastream, Google App Engine, Google BigQuery, Google Cloud Bigtable, Google Cloud Dataflow, Google Cloud Dataproc, Google Cloud NetApp Volumes, Google Cloud Pub/Sub, Google Cloud SQL, Google Cloud Storage, Google Compute Engine, Google Kubernetes Engine, Looker (Google Cloud core), Managed Airflow, Google Cloud Composer, Managed Service for Apache Kafka, Memorystore for Redis, Memorystore for Redis Cluster, Memorystore for Valkey, Persistent Disk, Storage Transfer Service, VMWare engine, Virtual Private Cloud (VPC)</p><p>Affected locations: London (europe-west2)</p>"
