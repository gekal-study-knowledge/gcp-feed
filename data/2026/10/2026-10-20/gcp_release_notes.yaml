    "title": "October 20, 2026"
    "link": "https://docs.cloud.google.com/release-notes#October_20_2026"
    "published": "2026-10-20 16:00:00"
    "fetched": "2026-10-21 07:07:25"
    "summary": "<h2 class=\"release-note-product-title\">Apigee X</h2>\n<h3>Announcement</h3>\n<p>On October 20th, 2026, we began maintenance updates of Apigee instances <a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/system-administration/maintenance-windows\">configured for maintenance windows</a>.</p>\n<p>If you set a preferred window for maintenance for your instance, and your instance version is\nbelow <strong>1-18-0-apigee-6</strong>, your instance will be updated to <strong>1-18-0-apigee-6</strong> within the\nnext seven to 21 days. A notification containing the expected date of upgrade will be sent within the next two business days.</p>\n<aside class=\"note\">Note: Instances that meet either of the following two criteria will <b>not</b> be updated:\n<ul>\n<li>Your instance has a DNS misconfiguration, as described in <a href=\"https://docs.cloud.google.com/apigee/docs/release/known-issues\">Known Issue 445936920</a>.</li>\n<li>Your instance uses an Apigee Java Library that has been removed, as described in <a href=\"https://docs.cloud.google.com/apigee/docs/release/release-notes#October_16_2025\">Apigee release notes dated October 16, 2025</a>.</li>\n</ul></aside>\n<p>For more information on participating in scheduled maintenance windows, see <a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/system-administration/maintenance\">Maintenance overview</a> and <a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/system-administration/maintenance-windows\">Manage Apigee instance maintenance windows</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud SDK</h2>\n<h3>Breaking</h3>\n<h2 id=\"59000_2026-10-20\">590.0.0 (2026-10-20)</h2>\n<h3 id=\"breaking_changes\">Breaking Changes</h3>\n<ul>\n<li><strong>(Google Cloud CLI)</strong> Removed the <code>gcloud-man-pages</code> component. Use <code>--help</code> for full command documentation.</li>\n<li><strong>(App Engine)</strong> Removed the <code>app-engine-grpc</code> component from the Google Cloud CLI.</li>\n<li><strong>(Cloud Build)</strong> Removed the Cloud Build Local Builder component (<code>cloud-build-local</code>) from the Google Cloud CLI.</li>\n</ul>\n<h3 id=\"google_cloud_cli\">Google Cloud CLI</h3>\n<ul>\n<li>Updated bundled Python on Linux and Windows, and in the Alpine-based Docker\nimages, to pyOpenSSL 26.4.0 and cryptography 50.0.1. 32-bit Windows uses\npyOpenSSL 26.2.0 and cryptography 48.0.1, the newest releases that support it.</li>\n</ul>\n<h3 id=\"ai\">AI</h3>\n<ul>\n<li>Updated <code>gcloud beta ai endpoints deploy-model</code> to request automatic resources for Gemini deployments on GDC connected endpoints.\n<ul>\n<li>If no replica counts are specified, the minimum replica count defaults to 1 only for <code>gemini-2.5-flash</code>.</li>\n<li>Specifying flags that apply only to dedicated resources, such as <code>--machine-type</code> or <code>--accelerator</code>, now prints a warning and deploys with dedicated resources.</li>\n</ul></li>\n</ul>\n<h3 id=\"agent_identity\">Agent Identity</h3>\n<ul>\n<li>Added <code>gcloud beta agent-identity auth-providers resolve-authorization</code>\ncommand.</li>\n</ul>\n<h3 id=\"alloydb\">AlloyDB</h3>\n<ul>\n<li>Added <code>--enable-public-dns</code> flag to <code>gcloud beta alloydb instances create|update</code>.</li>\n</ul>\n<h3 id=\"apigee\">Apigee</h3>\n<ul>\n<li>Fixed an issue where <code>gcloud apigee</code> commands would fail with an\n<code>UnauthorizedRequestError</code> for users who authenticate using Mutual TLS (mTLS).</li>\n</ul>\n<h3 id=\"app_engine\">App Engine</h3>\n<ul>\n<li>Updated <code>gcloud beta app migrate-to-run</code> to default to the App Engine\napplication's region instead of <code>us-central1</code> when neither <code>--region</code> nor\nthe <code>run/region</code> property is set.</li>\n</ul>\n<h3 id=\"biglake\">BigLake</h3>\n<ul>\n<li>Promoted <code>--federated-catalog-identity-mode</code> for <code>gcloud biglake iceberg\ncatalogs create</code> to GA.</li>\n<li>Promoted <code>--federated-catalog-identity-mode</code> for <code>gcloud biglake iceberg\ncatalogs update</code> to GA.</li>\n<li>Promoted <code>--metadata-service-directory-name</code> for <code>gcloud biglake iceberg\ncatalogs create</code> to GA.</li>\n<li>Promoted <code>--metadata-service-directory-name</code> for <code>gcloud biglake iceberg\ncatalogs update</code> to GA.</li>\n<li><code>federated</code> value for <code>--catalog-type</code> flag of <code>gcloud biglake iceberg\ncatalogs create</code> is now supported.</li>\n</ul>\n<h3 id=\"certificate_authority_service\">Certificate Authority Service</h3>\n<ul>\n<li>Added <code>--filter</code> flag to <code>gcloud privateca subordinates list</code>. The flag is\nable to allow filtering results based on specified boolean expression.</li>\n</ul>\n<h3 id=\"cloud_bigtable\">Cloud Bigtable</h3>\n<ul>\n<li>Build with 1.26.4 to resolve CVE-2026-39820.</li>\n</ul>\n<h3 id=\"cloud_bigtable_emulator\">Cloud Bigtable Emulator</h3>\n<ul>\n<li>Rebuild cbt-emulator for CVE-2026-39820.</li>\n</ul>\n<h3 id=\"cloud_dataflow\">Cloud Dataflow</h3>\n<ul>\n<li>Promoted <code>gcloud dataflow config-store-settings</code> to GA.</li>\n</ul>\n<h3 id=\"cloud_dataplex\">Cloud Dataplex</h3>\n<ul>\n<li>Fixed <code>gcloud dataplex dbt metadata-jobs create</code> so that dbt resources whose\nnames contain a dot, such as tests on a model with a decimal version, are no\nlonger rejected by the import job.</li>\n<li>Fixed <code>gcloud dataplex dbt metadata-jobs create</code> so that two dbt resources\nthat map to the same Dataplex entry ID no longer fail the whole import job.\nThe first is imported and a warning names the other.</li>\n</ul>\n<h3 id=\"cloud_iam\">Cloud IAM</h3>\n<ul>\n<li>Added <code>--vendor-type</code> flag to <code>gcloud iam workforce-pools providers create-oidc</code>, <code>create-saml</code>, <code>update-oidc</code>, and <code>update-saml</code> commands.</li>\n</ul>\n<h3 id=\"cloud_resource_manager\">Cloud Resource Manager</h3>\n<ul>\n<li>Promoted <code>gcloud resource-manager capability-configs</code> to GA.</li>\n<li>Promoted <code>gcloud resource-manager boundary-configs</code> to GA.</li>\n<li>Promoted <code>gcloud resource-manager boundaries</code> to GA.</li>\n</ul>\n<h3 id=\"cloud_run\">Cloud Run</h3>\n<ul>\n<li>Added <code>--dry-run</code> flag to <code>gcloud beta run domain-mappings create</code> to\nvalidate a domain mapping, including whether the domain is available,\nwithout creating it.</li>\n</ul>\n<h3 id=\"cloud_sql\">Cloud SQL</h3>\n<ul>\n<li>Added <code>POSTGRES_19</code> to <code>--database-version</code> flag of <code>gcloud sql instances create</code> and <code>gcloud sql instances patch</code>.</li>\n<li>Added <code>--no-replication-lag-max-seconds-for-recreate</code> flag to <code>gcloud beta sql instances patch</code> to disable recreating a lagging MySQL read replica.</li>\n<li>Updated 'cloud-sql-proxy' packaged component to use 2.26.2 of the Cloud SQL Proxy.</li>\n</ul>\n<h3 id=\"cloud_spanner\">Cloud Spanner</h3>\n<ul>\n<li>Improved error output when <code>gcloud spanner cli</code> runs an incompatible\n<code>spanner-cli</code> binary found on <code>PATH</code> instead of the <code>spanner-cli</code>\ncomponent; users are now directed to install the component.</li>\n</ul>\n<h3 id=\"cloud_workstations\">Cloud Workstations</h3>\n<ul>\n<li>Added <code>enable-automatic-failover</code> to <code>--boost-config</code> flag in <code>gcloud beta workstations configs create</code> and <code>gcloud beta workstations configs update</code>.</li>\n</ul>\n<h3 id=\"compute_engine\">Compute Engine</h3>\n<ul>\n<li>Added <code>compute instance-templates export</code> command to all release tracks.</li>\n<li>Removed WORKLOAD_IDENTITY choise in <code>--identity-type</code> flag.</li>\n<li>Promoted <code>--instance-flexibility-policy</code> flag and min CPU platform and disk\noverrides to GA for <code>gcloud compute instance-groups managed create</code> and\n<code>update</code>.</li>\n<li>Added <code>compute instance-templates import</code> command to all release tracks.</li>\n</ul>\n<h3 id=\"database_migration\">Database Migration</h3>\n<ul>\n<li>Added <code>--failback</code> flag to <code>gcloud database-migration migration-jobs\npromote</code> command to promote a migration job from destination back to source\nduring the FAILBACK phase.</li>\n</ul>\n<h3 id=\"gke_hub\">GKE Hub</h3>\n<ul>\n<li><p>Promoted <code>--view</code>, <code>--memberships</code>, <code>--filter</code>, and <code>--sort-by</code> flags on\n<code>gcloud container fleet|hub config-management describe</code> command to <code>GA</code>.</p></li>\n<li><p>Updated <code>gcloud container fleet|hub memberships register</code> to allow skipping the Connect agent installation on non-GKE clusters via the <code>--no-install-connect-agent</code> flag.</p></li>\n</ul>\n<h3 id=\"kubernetes_engine\">Kubernetes Engine</h3>\n<ul>\n<li>Added the <code>reservedSystemCpus</code> kubelet config option to the <code>gcloud\ncontainer clusters create</code>, <code>gcloud container node-pools create</code>, and\n<code>gcloud container node-pools update</code> commands. This option specifies the\nlist of CPUs reserved for host system services.</li>\n<li>Added <code>ltsc2025</code> option to <code>--windows-os-version</code> flag of <code>gcloud container\nnode-pools create</code> and <code>gcloud container node-pools update</code> to create or\nupdate Windows node pools using the Windows Server 2025 (LTSC2025) image.</li>\n<li>Updated default kubectl to 1.35.9.</li>\n<li>Additional kubectl versions:\n<ul>\n<li>1.31.14</li>\n<li>1.32.13</li>\n<li>1.33.13</li>\n<li>1.34.12</li>\n<li>1.35.9</li>\n<li>1.36.5</li>\n<li>1.37.1</li>\n</ul></li>\n<li>Allowed <code>--num-nodes=0</code> for <code>gcloud container clusters create</code> to create\na cluster without a default node pool on GKE versions that support it.\nFlags that only configure the default node pool, such as <code>--machine-type</code>\nand <code>--enable-autoscaling</code>, can't be used with <code>--num-nodes=0</code>.</li>\n</ul>\n<h3 id=\"network_connectivity\">Network Connectivity</h3>\n<ul>\n<li>Added <code>--purpose</code> flag to <code>gcloud network-connectivity internal-ranges\ncreate</code> to specify the purpose of the internal range.</li>\n</ul>\n<h3 id=\"network_security\">Network Security</h3>\n<ul>\n<li>Promoted <code>--wildfire-analysis-profile</code> flag of\n<code>gcloud network-security security-profile-groups create</code> and\n<code>gcloud network-security security-profile-groups update</code> commands to GA.</li>\n<li>Promoted <code>gcloud network-security security-profiles wildfire-analysis</code>\ncommand group and its <code>create</code>, <code>delete</code>, <code>describe</code>, <code>list</code> and <code>update</code>\ncommands to GA.</li>\n<li>Promoted <code>add-submission-rule</code>, <code>delete-submission-rule</code>,\n<code>add-inline-cloud-analysis-rule</code> and <code>delete-inline-cloud-analysis-rule</code>\ncommands of <code>gcloud network-security security-profiles wildfire-analysis</code>\nto GA.</li>\n</ul>\n<h3 id=\"service_extensions\">Service Extensions</h3>\n<ul>\n<li>Created a new set of commands for <code>gcloud service-extensions extension-bindings</code> (alpha and beta).</li>\n<li>Added <code>gcloud beta service-extensions cdn-edge-extensions</code> command group to manage <code>CdnEdgeExtension</code> resources.</li>\n</ul>\n<p>Subscribe to these release notes at <a href=\"https://groups.google.com/forum/#!forum/google-cloud-sdk-announce\">https://groups.google.com/forum/#!forum/google-cloud-sdk-announce</a>.</p>\n<h2 class=\"release-note-product-title\">Google Kubernetes Engine</h2>\n<h3>Fixed</h3>\n<p>This is an update to the release note regarding the Cloud Storage FUSE CSI\ndriver issue published on\n<a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/release-notes#October_02_2026\">October 2, 2026</a>.</p>\n<p>This issue has been resolved. You can upgrade your cluster control plane to the\nfollowing versions to fix the issue for <code>ubuntu_containerd</code> and older\n<code>cos_containerd</code> node pools:</p>\n<ul>\n<li><p>1.36.5-gke.1032000 or later</p></li>\n<li><p>1.37.1-gke.1552000 or later</p></li>\n<li><p>Specific 1.36.4 mitigation patches: 1.36.4-gke.1247001, 1.36.4-gke.1247002,\n1.36.4-gke.1391001, 1.36.4-gke.1391003, 1.36.4-gke.1495001,\n1.36.4-gke.1495003, 1.36.4-gke.2046001, 1.36.4-gke.2202002</p></li>\n</ul>"
