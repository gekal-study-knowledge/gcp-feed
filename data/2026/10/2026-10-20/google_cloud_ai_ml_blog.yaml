  "05b5ea8b31ed884609999120271b7d9d":
    "id": "05b5ea8b31ed884609999120271b7d9d"
    "title": "Building full virtual vehicles on Google Cloud: From AAOS to the smallest MCU"
    "link": "https://cloud.google.com/blog/topics/manufacturing/building-full-virtual-vehicles-on-google-cloud-from-aaos-to-the-smallest-mcu/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:02:03"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Imagining traditional gearheads getting their hands on software-defined vehicles is an amusing thought experiment. With their socket wrenches and air compressors at the ready, they might be confused to encounter core functions more likely to run on 1s and 0s than oil and belts. But across the auto industry these days, more and more vehicles feature prominent systems built using cloud-native development, continuous integration/continuous delivery, fast digital iteration, and plenty of AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">But there’s still a big gap to be found in many automakers’ and Tier 1 suppliers’ cloud-based development processes. On the one hand, these companies are commonly using software to develop vehicles’ digital entertainment and information screens, or other onboard high-performance computers. </span></p>\n<p><span style=\"vertical-align: baseline;\">On the other, the dozens of microchips and control modules that make a car a car these days — such as gateways, body controllers, zone control units, sensor and actuator nodes — are still frequently hardwired to physical chips when they’re constructed, making them very difficult to update, reprogram, or expand after the vehicle drives off the factory floor. Teams have to wait for benches, samples, and rigs, and integration can easily slip to the end of the development process, where defects are most expensive to fix.</span></p>\n<p><span style=\"vertical-align: baseline;\">This inherent inefficiency has become a leading bottleneck. After all, manufacturers can’t really claim vehicles are software-defined if most of their electronics only function when connected to physical hardware and if developers are leaning heavily on actual hardware.</span></p>\n<p><span style=\"vertical-align: baseline;\">With Horizon, our agentic innovation platform for developing software-defined vehicles, our vision is to help manufacturers avoid these inefficiencies by working with partners like </span><a href=\"https://www.remotivelabs.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveLabs</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The cockpit already runs in the cloud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Android team has invested a significant amount of time and effort over the last few years on enabling seamless development of the many digital systems in vehicles’ cockpits. </span><a href=\"https://source.android.com/docs/automotive\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Automotive OS</span></a><span style=\"vertical-align: baseline;\"> (AAOS) runs inside Google’s official virtual testing environment for Android, </span><a href=\"https://source.android.com/docs/devices/cuttlefish\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cuttlefish</span></a><span style=\"vertical-align: baseline;\">, which itself runs comfortably on</span> <a href=\"https://cloud.google.com/compute/docs/instances/arm-on-compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Arm-based Google Cloud instances</span></a><span style=\"vertical-align: baseline;\">. With this approach, developers can build, boot, and test virtual versions of their infotainment stacks on the same Arm architecture that ships in vehicles.</span></p>\n<p><span style=\"vertical-align: baseline;\">And with the recent launch of </span><a href=\"https://source.android.com/docs/whatsnew/android-17-release#sdv\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android 17 and AAOS SDV</span></a><span style=\"vertical-align: baseline;\">, this capability is also extended to further domains, whenever AAOS SDV is used. Deploying it with Cuttlefish, for example, proves the model: representative software, on representative architecture, in the cloud, on demand. The question that still needs to be answered is how to extend that model to the rest of the vehicle, especially when other operating systems are involved.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The harness around the virtual vehicle</strong></h3>\n<p><span style=\"vertical-align: baseline;\">That’s where </span><a href=\"https://www.remotivelabs.com/products/remotivetopology\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveTopology</span></a><span style=\"vertical-align: baseline;\"> comes into play. As the harness around the virtual vehicle, it’s the layer that connects AAOS in Cuttlefish to a full, simulated electrical and electronic (E/E) architecture: the rest of the vehicle’s onboard computers, its data networks, and the live signals that make the system function like a real vehicle rather than a collection of standalone apps.</span></p>\n<p><span style=\"vertical-align: baseline;\">RemotiveTopology automatically utilizes manufacturers’ existing network design files to build a working, virtual version of their cars’ networks. This is vehicle-as-code: the E/E architecture expressed as an executable specification, versioned and provisioned like infrastructure-as-code. In this way, an entire vehicle can be spun up on demand. Cockpit software talks to the rest of the vehicle exactly as it would in a real vehicle. As a result, developers get full and continuous signal and cross-domain visibility, so they can see real-time system status. And because it is built on standard Linux tooling, the same topology runs on a laptop and in a contiguous integration pipeline on Google Cloud.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Integrate across domains early, not late</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The payoff for using this approach is that all onboard systems can be developed and integrated with software before any of them are connected to a vehicle’s hardware. That’s beneficial because the most difficult (and latest) integration in a vehicle’s development is bringing all its systems together. For example, advanced driver assistance systems (ADAS) produce object lists, trajectories, and mode requests that the cockpit has to render and react to, while the infotainment system and information cluster have to reflect driving state while body and chassis nodes sit in the loop.</span></p>\n<p><span style=\"vertical-align: baseline;\">With the full topology live on Google Cloud, the infotainment system and ADAS can operate simultaneously within a virtual vehicle, exchanging real signals over the simulated network. This means it’s possible to exercise handoffs like an ADAS event surfacing in the cluster or a driver-mode change rippling across domains from day one in continuous integration long before the benches and samples line up. In this way, developers can be confident they’ll discover multi-domain integration long before the end of the process so that they can test continuously from the start.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The full vehicle frontier</strong></h3>\n<p><span style=\"vertical-align: baseline;\">At the heart of this work is a shared desire to bring scalable software development to even the smallest and most common nodes in a vehicle, its microchips and control modules. That’s because these are the parts that have traditionally been wired to hardware, and as a result are the biggest blocker to fully software-defined vehicles.</span></p>\n<p><span style=\"vertical-align: baseline;\">The ultimate goal is that the same software that runs in the cloud can run on vehicles’ actual control modules with no re-tooling or re-validation needed to move between them. That parity is natural with Arm-based Google Cloud infrastructure because the cloud and the car share an instruction set. Google's </span><a href=\"https://cloud.google.com/products/axion\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Axion</span></a><span style=\"vertical-align: baseline;\"> makes it straightforward:</span> <a href=\"https://cloud.google.com/blog/products/compute/axion-based-n4a-vms-now-in-preview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C4A metal, a bare-metal Arm instance</span></a><span style=\"vertical-align: baseline;\">, is provided explicitly for automotive systems development and Android software development, giving direct hardware access without unnecessary software layers and delivering the consistent performance that vehicle systems require.</span></p>\n<p><span style=\"vertical-align: baseline;\">Taken together, this holistic system allows teams, for the first time, to develop and integration-test an entire vehicle’s systems in the cloud and then apply it to the actual vehicle without having to rewrite it.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why now, and where to start</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The payoff is not abstract. Treating the vehicle as code and moving integration into the cloud compresses the slowest, most expensive phase of a program. Early customer engagements with RemotiveLabs have measured more than 10x faster integration cycles. And the development loop is now changing faster than the hardware loop: AI-assisted and agentic workflows can rapidly generate, test, and refine vehicle software, but only virtual systems provide the required scale. Every element that can’t be virtualized can slow the entire development process down.</span></p>\n<p><span style=\"vertical-align: baseline;\">RemotiveTopology provides this architecture as vehicle-as-code and makes it accessible for developers, testers, and autonomous AI agents alike. </span><span style=\"vertical-align: baseline;\">Best of all, there is no new third-party tooling to adopt just to get started. Instead, RemotiveLabs publishes an</span> <a href=\"https://github.com/remotivelabs/remotivelabs-topology-examples\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source simplified vehicle on GitHub</span></a><span style=\"vertical-align: baseline;\"> that anyone can run in minutes on standard Linux tooling and platform definitions already in place. Full existing toolchains plug in as a manufacturer or Tier1 supplier scales, and RemotiveTopology can be easily dropped into an Arm-based Google Cloud environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">For those building software-defined vehicles whose virtual development stops at the cockpit, it’s time to start with an open-source example, bring unique platform definitions, and run an entire vehicle in the cloud. </span><a href=\"https://github.com/GoogleCloudPlatform/horizon-sdv/tree/main/gitops/modules/remotive-topology\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RemotiveTopology is available in Horizon</span></a><span style=\"vertical-align: baseline;\"> for easy usage in combination with other Horizon modules.</span></p></div>"
  "b3a08ef03891da57c6ae3fb74471b289":
    "id": "b3a08ef03891da57c6ae3fb74471b289"
    "title": "Who judges the judge? Three helpful ways to audit your LLM evaluators"
    "link": "https://cloud.google.com/blog/topics/consulting/three-ways-to-audit-your-llm-evaluators/"
    "published": "2026-10-20 01:00:00"
    "fetched": "2026-10-20 04:02:03"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Is your LLM-as-a-judge truly objective? </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">There’s a common misconception in tech that humans are subjective, so we should rely on AI for objective evaluation. But the reality is that LLMs are also subjective. Just like human reviewers, they can carry biases:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Verbosity bias</strong><span style=\"vertical-align: baseline;\">: LLM judges usually favor </span><a href=\"https://arxiv.org/abs/2411.15594\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">longer, confident-sounding answers</span></a><span style=\"vertical-align: baseline;\">, even when the underlying facts are wrong.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Position bias</strong><span style=\"vertical-align: baseline;\">: Swapping the order of two options can cause an LLM judge to flip its verdict </span><a href=\"https://arxiv.org/abs/2306.05685\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">over 75% of the time</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">The halo effect</strong><span style=\"vertical-align: baseline;\">: Because LLMs generate text piece by piece, </span><a href=\"https://arxiv.org/abs/2411.16337\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">clean grammar and formatting can trick an AI judge</span></a><span style=\"vertical-align: baseline;\"> into giving top marks for accuracy while missing errors.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Agreeableness bias</strong><span style=\"vertical-align: baseline;\">: LLM judges are great at recognizing valid work. But with detecting errors, they may fail to catch incorrect, buggy, or unsafe outputs </span><a href=\"https://arxiv.org/abs/2510.11822\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">up to 75% of the time</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Self-enhancement bias:</strong><span style=\"vertical-align: baseline;\"> Also known as egocentric bias, AI evaluators systematically </span><a href=\"https://arxiv.org/abs/2309.17012\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">overrate outputs that were generated by themselves</span></a><span style=\"vertical-align: baseline;\"> or from their own family.</span></li>\n</ul>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Ultimately, LLM judges are not objective arbiters of truth. They are subjective models with their own distinct biases. Treating them as infallible tools that don't need their quality measured might leave your work compromised. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In this post, we’ll explore what’s holding enterprises back from strong evals, and share an easy three-pillar method you can use to improve your quality. </span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Three helpful ways to audit your LLM judges </span></h3>\n<p><strong style=\"vertical-align: baseline;\">Pillar 1: Measure internal stability</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Before you can trust an AI judge’s score, you need to know that it isn't just guessing. Because LLMs are probabilistic, they can be inconsistent, giving different scores to the exact same text.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">You can test this internal stability by running multi-pass consistency checks on a single output and calculating the variance. If a judge's scores fluctuate wildly on identical inputs, its rubric is too ambiguous.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pillar 2: Validate human alignment</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">When your evaluation datasets are mostly valid responses, a lenient AI judge can look great on paper. It might align closely with human reviewers overall, but miss a majority of invalid or even unsafe outputs.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To prove your LLM judge is catching real errors, you need chance-corrected metrics. These mathematical models filter out agreements driven purely by leniency or random chance, showing how closely your evaluator actually aligns with the informed decisions of human experts.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pillar 3: Use multi-judge ensembles</strong></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To avoid the halo effect mentioned earlier, teams should use decomposed prompting. Instead of asking one LLM judge to score an entire response, assign a specialized judge to evaluate a single criteria, like factual accuracy or tone. This isolates traits and forces independent scoring.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Second, to track performance in real time without human intervention, the established best practice is ensembling. This means running at least two different models under the hood to evaluate the exact same output simultaneously. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">By finding the statistical consensus between these models, you can flag if their evaluations begin to diverge and avoid any scoring quality degradation.</span></p>\n<h3 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p style=\"text-align: justify;\"><a href=\"https://cloud.google.com/consulting/innovation-and-transformation?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Partner with Delta</span></a><span style=\"vertical-align: baseline;\"> to design and implement statistically-audited evaluation pipelines for your enterprise agentic systems. </span></p></div>"
