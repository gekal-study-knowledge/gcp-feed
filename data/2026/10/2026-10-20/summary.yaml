"overview": |
  この日は 6 件 (重複を除くと 4 件) で、LLM 評価者の監査、車載ソフトウェアの仮想化、BigQuery の可観測性、Gemini での MCP Apps 実装が話題でした。評価の記事では、LLM-as-a-judge が本当に客観的かという問いを立て、人間は主観的だから客観的な評価は AI に任せるべきという思い込みに対して、LLM も人間のレビュアーと同様に偏りを持つと指摘しています。挙げられている偏りは、事実が誤っていても長く自信ありげな回答を好む冗長性バイアス、2 つの選択肢の順序を入れ替えると 75% 以上の確率で判定が覆る位置バイアス、文章を逐次生成する性質から整った文法や書式に引っぱられて正確性に満点を付け誤りを見落とすハロー効果、そして同調バイアスです。車載では、Google Cloud 上で AAOS から最小の MCU までを含む「完全な仮想車両」を構築する方法が紹介されました。自動車業界ではクラウドネイティブ開発や CI/CD、高速なデジタルの反復、AI を使ったシステムが増えている一方、自動車メーカーや Tier 1 サプライヤーのクラウドベースの開発プロセスには依然として大きな隔たりがあるという問題意識です。データ基盤では、BigQuery の Python ユーザー定義関数 (UDF) でロギングが使えるようになりました。Python 標準の logging ライブラリを UDF の中からそのまま使って、構造化ログを外部プラグインやカスタムコネクターなしに Cloud Logging へ送れます。記事では、クエリ実行中に行単位の診断テレメトリーを取得して問題のあるレコードを切り分け、リアルタイムのアラートやトリアージにつなげる、耐障害性のあるデータパイプラインの例を扱っています。エージェント開発では、Gemini で MCP Apps (SEP-1865) を実装する開発者向けガイドが公開されました。エンタープライズのアシスタントは今も主にテキストで応答するため、視覚的で多段の作業では調整ごとにチャットの往復が増えてしまいます。MCP Apps はツールとライブな UI を組み合わせるオープンな Model Context Protocol の拡張で、Gemini Enterprise ではその UI がサンドボックス化された iframe としてチャットの流れの中に描画され、全画面やサイドパネルに広げられます。編集はローカルで実行されつつワークスペースとアシスタントは同期され、従業員のサインイン、ガバナンスされたデータアクセス、既定のアシスタントは Gemini 側が提供するため、MCP サーバーをプライベートな Cloud Run サービスとして動かすだけで済みます。
