"overview": |
  この日は 19 件で、europe-west2 の障害と復旧、公共部門向けの発表とソブリン AI、PyTorch Conference 2026 での発表、LLM 評価者の監査、そして AI 推論のネットワーク設計が中心でした。障害情報では、2026 年 10 月 19 日 23:08 (米国太平洋時間) から europe-west2 (ロンドン) リージョンで複数のサービスに問題が発生していることが報告されました。エラー率の上昇と断続的なネットワーク障害が症状で、影響を受けるプロダクトは AlloyDB for PostgreSQL・Apigee・BigQuery・Cloud Run・Cloud Spanner・Cloud SQL・Cloud Storage・Compute Engine・GKE・Pub/Sub・Looker・Memorystore・VMware Engine・VPC など広範にわたります。この障害はその後解消し、米国太平洋時間 2026 年 10 月 20 日 07:00 に終了しました。ほとんどの顧客では影響が緩和され、ごく少数の顧客への影響についてはエンジニアリングチームが対応を続けるとされています。内部調査の完了後に分析が公開される予定です。AI の評価では、LLM-as-a-judge の客観性を問い直す記事が公開されました。人間は主観的だから客観的な評価は AI に任せればよい、という技術分野によくある思い込みに対し、LLM も人間のレビュアーと同様に偏りを持つことが示されています。長く自信ありげな回答を、根拠となる事実が誤っていても好む冗長性バイアス、2 つの選択肢の順序を入れ替えると 75% を超える確率で判定が覆る位置バイアス、LLM がテキストを少しずつ生成することに由来し、綺麗な文法と書式が正確性の満点評価を引き出して誤りを見落とさせるハロー効果、妥当な成果物を認めるのは得意な一方、誤りやバグ、安全でない出力を最大 75% の割合で見落としうる同調性バイアス、そして自分自身や同じファミリーが生成した出力を体系的に過大評価する自己強化バイアス (自己中心バイアス) が挙げられ、LLM の判定者は真実の客観的な裁定者ではなく固有の偏りを持つ主観的なモデルである、という結論のもとで品質を高める 3 本柱の手法が示されます。ネットワークでは、AI 推論モデルを提供するための 2 つのリファレンスアーキテクチャが解説されました。1 つは Google Kubernetes Engine (GKE) 向け、もう 1 つはそれ以外のすべてのバックエンドタイプ向けです。いずれもモデルのデプロイを、安定性・セキュリティ・信頼性の高いエントリポイントの背後に公開します。このエントリポイントはポリシー・セキュリティ・ロジックを適用する制御ゾーンとしても働き、Cloud ロードバランサと推論ゲートウェイのどちらもその役割を担えます。TLS によるセキュアな接続の終端、API 管理コンポーネントとの統合、Service Extensions による機能拡張、Model Armor によるセキュリティ強化が可能で、共通サービスとして Private Service Connect の推論エンドポイントを使います。データ分析では、BigQuery の Python ユーザー定義関数 (UDF) でロギングが使えるようになりました。外部プラグインやカスタムコネクタを一切使わず、Python 標準の logging ライブラリを UDF の中からそのまま使って構造化ログを Cloud Logging へ送れます。記事では耐障害性のあるデータパイプラインの例として、クエリ実行中に行レベルの診断テレメトリーを取得し、Python UDF が受け取った JSON ペイロードを検証して、正常なレコードは宛先テーブルへ、壊れたレコードや規約に合わない行は logging.error() を呼んで NULL を返してクエリ全体の失敗を防ぐ構成、Cloud Monitoring のログベース指標でエラー率が SLA のしきい値を超えたら通知する仕組み、そして隔離されたペイロードを標準 SQL で調査して再処理する流れが示されました。エージェント開発では、Gemini における MCP Apps の実装ガイドが公開されました。エンタープライズのアシスタントは今も主にテキストで応答するため、視覚的で多段の作業では調整のたびに遅いチャットのやり取りが発生します。MCP Apps (SEP-1865) はツールとライブな UI を組み合わせるオープンな Model Context Protocol の拡張で、Gemini Enterprise ではその UI がサンドボックス化された iframe としてチャットの流れの中に描画され、全画面やサイドパネルへ広げられます。編集はローカルで実行されつつワークスペースとアシスタントは同期が保たれ、従業員のサインイン・統制されたデータアクセス・既定のアシスタントは Gemini が提供し、MCP サーバーはプライベートな Cloud Run サービスでホストします。記事ではエンタープライズアシスタントを、静的な Markdown を返すテキストチャットボット (第 1 世代)、ライブ API を呼ぶが出力は静的で変更ごとにモデルのターンが必要な標準 MCP ツール (第 2 世代)、各ツールにライブなワークスペースを組み合わせモデルのターンなしに調整できる対話的な MCP Apps (第 3 世代) の 3 世代として整理しています。自動車分野では、Google Cloud 上に完全な仮想車両を構築する取り組みが紹介されました。多くの自動車メーカーや Tier 1 サプライヤーは、車載の情報・娯楽画面や高性能コンピューターの開発にはソフトウェアを使う一方、ゲートウェイ・ボディコントローラー・ゾーンコントロールユニット・センサーやアクチュエーターのノードといった数十のマイクロチップと制御モジュールは、製造時に物理チップへ直結されたままで、出荷後の更新・再プログラム・拡張が難しいという課題を抱えています。ベンチやサンプル、実機リグを待つ必要があり、統合が開発工程の最後に滑り込んで不具合の修正コストが最も高くなる段階に寄るため、これが主要なボトルネックになっているという前提が示されました。インフラでは、AI インフラストラクチャとオーケストレーションの 9 月のまとめが日本語で公開され、エージェントフリートの急増に備えてワークロードの分離とセキュリティを保ちコストを抑えたまま需要に応える強化が紹介されました。GKE では、標準的なコンテナランタイムの 10 倍の密度で数百万のサンドボックスを動かせる新しいオープンソースの GKE Agent Substrate (ネイティブのゼロトラストカーネルとネットワーク分離を備え、毎秒 500 回を超える一時停止・再開で 500 ミリ秒未満の再開を実現) と、スケールトゥゼロの組み込みが取り上げられています。地域の事例では、アイルランドの組織が Gemini Enterprise を活用して初期のプロトタイプから本番運用へ移っている状況が紹介されました。Implement Consulting Group のレポートでは、官民のリーダーが世界の AI 市場における経済効果を 400 億〜450 億ユーロと推計しており、2026 年後半の EU 理事会議長国就任を見据えた国家デジタルおよび AI 戦略の枠組み策定とも合致するとされています。PyTorch Conference 2026 では 2 つの発表がありました。1 つは Google TPU 向けのネイティブ PyTorch スタックである TorchTPU のオープンソース公開で、TPU が GPU と CPU に並ぶ PyTorch のネイティブな選択肢になりました。vLLM、SGLang、llm-d、TorchTitan、Ray、TorchRec、Hugging Face、LiteRT といった既存のツールのまま TPU で学習・提供・デプロイができます。もう 1 つは llm-d 1.0 のリリースで、分散 LLM 推論のための Kubernetes ネイティブなオープンソーススタックです。Google が Red Hat や IBM などと共同で立ち上げた CNCF Sandbox プロジェクトで、25 組織・500 名を超えるコントリビューターのコミュニティによって開発され、vLLM と SGLang がモデルを提供する PyTorch 側と、分散システムを本番で動かす Kubernetes 側をつなぎます。1 年前は推論トラフィックのほとんどがチャット (プロンプト 1 つに応答 1 つ) でしたが、現在は多段のエージェントや強化学習へと移っている点が背景として挙げられています。公共部門では、ワシントン D.C. で開催された Google Public Sector Summit 2026 の発表とハイライトが公開されました。あわせて政府業務向けの Gemini for government services が発表され、政府の業務が法令・規則・省庁のガイダンスに基づき、サイロ化したレガシーシステムをまたいで、データ主権・コンプライアンス・機密保持の厳しい要件のもとで行われるという前提から、汎用モデルが持たない知識を補う形で位置づけられています。ソブリン AI 関連では、Google Distributed Cloud (GDC) の air-gapped 環境における最新の機能強化が紹介されました。データ主権や防衛、情報、重要インフラの要件のもとでは機密データをパブリッククラウドへ送れず、切り離された境界の内側に自前の AI スタックを作るには数か月かかるという課題に対するものです。その具体例として、GDC 上の Gemini によるエンタープライズ検索でマネージドな RAG 検索をソブリン境界の内側で提供する機能が取り上げられました。機密報告書やフィールドマニュアル、機微なマルチモーダルデータを扱う国家安全保障機関などが、モデルを組み合わせて音声認識や OCR のパイプラインを作り、ベクトル構成を整えるといった作業を数か月かけて行わずに済むようになります。リリースノートでは、2026 年 10 月 20 日からメンテナンスウィンドウを設定している Apigee X インスタンスの保守更新が始まりました。希望するウィンドウを設定していてバージョンが 1-18-0-apigee-6 未満のインスタンスは、7〜21 日のうちに 1-18-0-apigee-6 へ更新され、予定日は 2 営業日以内に通知されます (DNS の設定不備がある場合や、削除された Apigee Java ライブラリを使っている場合は対象外)。
