    "title": "October 13, 2026"
    "link": "https://docs.cloud.google.com/release-notes#October_13_2026"
    "published": "2026-10-13 16:00:00"
    "fetched": "2026-10-14 05:59:30"
    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>The\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-agg\"><code>AI.AGG</code> function</a>\nis\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA). You can use this function to semantically aggregate unstructured input\ndata based on natural language instructions.</p>\n<h2 class=\"release-note-product-title\">Cloud Billing</h2>\n<h3>Feature</h3>\n<p><strong>Spend cap budgets are now generally available for a limited set of services</strong></p>\n<p>For\n<a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#eligible-services\">eligible services</a>,\nyou can configure a <strong>spend cap budget</strong> to automatically pause usage when your\nestimated spend exceeds the budget amount you set. You can manage spend cap\nbudgets in the\n<a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps\">Budgets page in the Google Cloud console</a>\nand using the\n<a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap\">Cloud Billing Budget API</a>.</p>\n<p>Spend caps are a cost control mechanism. A spend cap is enforced when usage\ncosts exceed your budget target amount. When enforced, any new request to the\neligible services, within the specified project, are paused and no further\nusage costs are accrued until the spend cap is lifted. You can manually lift an\nenforced spend cap, or wait until the start of the next month when the\nspend cap is automatically lifted.</p>\n<p>Spend caps use <em>gross, estimated costs</em> to trigger the alerts and caps,\nenforcing a cap much faster than the <em>actual costs</em> are processed and appear\non billing reports. Even though faster than reports, the enforcement of spend\ncaps isn't instant and any cost overages are billed as normal.</p>\n<p><strong>More information about spend cap budgets</strong></p>\n<p>For managing spend cap budgets in the Google Cloud console, see:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#how-spend-cap-budgets-work\">How spend cap budgets work to help you control spend</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#limitations\">Limitations of spend cap budgets</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#configure-spend-cap\">Configure a spend cap budget</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps#lift-spend-cap\">Lift an enforced spend cap</a></li>\n</ul>\n<p>For managing spend cap budgets using the Cloud Billing Budget API, see:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap\">Using the Cloud Billing Budget API for spend cap budgets</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap#concepts-limitations\">Spend cap budget concepts and limitations</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap#create\">Create a spend cap budget</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap#lift\">Lift an enforced spend cap</a></li>\n<li><a href=\"https://docs.cloud.google.com/billing/docs/reference/budget/rest/v1/billingAccounts.budgets\">Cloud Billing Budget API REST reference</a></li>\n</ul>\n<h2 class=\"release-note-product-title\">Cloud SDK</h2>\n<h3>Breaking</h3>\n<h2 id=\"58900_2026-10-13\">589.0.0 (2026-10-13)</h2>\n<h3 id=\"breaking_changes\">Breaking Changes</h3>\n<ul>\n<li><strong>(Google Cloud CLI)</strong> Deprecated the <code>skaffold</code> component in Google Cloud CLI. The component will be removed from Google Cloud CLI releases after January 15, 2027. A portion of <code>gcloud components install skaffold</code> attempts now return an error. Please install Skaffold following the instructions at <a href=\"https://skaffold.dev/docs/install/\">https://skaffold.dev/docs/install/</a>.</li>\n</ul>\n<h3 id=\"google_cloud_cli\">Google Cloud CLI</h3>\n<ul>\n<li>Updated Linux and Windows bundled Python to install <code>cryptography</code> 46.0.7 from the official PyPI wheels instead of custom builds.</li>\n<li>Updated the Alpine-based Docker images (<code>:alpine</code>, <code>:VERSION-alpine</code>) to use a bundled Python and no longer include a system <code>python3</code>.</li>\n<li>Updated bundled Python to 3.14.8 on Linux and Windows, and in the Alpine-based Docker images. This updates the OpenSSL that Python uses for TLS to 3.5.9.</li>\n</ul>\n<h3 id=\"alloydb\">AlloyDB</h3>\n<ul>\n<li>Added <code>--enable-express</code> flag to <code>gcloud beta alloydb clusters create|update</code>.</li>\n</ul>\n<h3 id=\"apigee\">Apigee</h3>\n<ul>\n<li>Promoted <code>gcloud apigee apis delete</code> to GA. The command deletes an API proxy\nand all of its revisions. Every command in <code>gcloud apigee apis</code> now serves\nGA.</li>\n<li>Fixed an issue where <code>gcloud apigee apis import --from-template</code> discarded a\ntemplate's <code>endpoints</code> and <code>targets</code> whenever the template referenced a\nfeature. A template that declared its own topology and used features only for\npolicies compiled to a proxy with no <code>ProxyEndpoint</code>, and the import failed.\nA template's <code>endpoints</code> and <code>targets</code> now seed the proxy, and features are\napplied on top of them.</li>\n</ul>\n<h3 id=\"app_engine\">App Engine</h3>\n<ul>\n<li>Fixed an issue where <code>gcloud beta app migrate-to-run</code> dropped the Serverless\nVPC Access connector for deployed versions.</li>\n<li>Fixed an issue where <code>gcloud beta app migrate-to-run</code> mapped App Engine\nFlexible <code>instance_ip_mode</code> to Cloud Run ingress.</li>\n<li>Fixed an issue where <code>gcloud beta app migrate-to-run</code> did not route all\negress through Direct VPC for internal-only App Engine Flexible apps.</li>\n</ul>\n<h3 id=\"app_lifecycle_manager\">App Lifecycle Manager</h3>\n<ul>\n<li>Hid the deprecated <code>gcloud beta saas-runtime</code> command group. Existing\ncommands continue to work and print a deprecation warning. Use <code>gcloud beta\napp-lifecycle-manager</code> instead.</li>\n</ul>\n<h3 id=\"beyondcorp\">Beyondcorp</h3>\n<ul>\n<li>Deprecated <code>gcloud beta beyondcorp app</code> command group.</li>\n</ul>\n<h3 id=\"biglake\">BigLake</h3>\n<ul>\n<li>Added <code>--service-directory-name</code> flag to <code>gcloud biglake delta-sharing catalogs update</code>.</li>\n</ul>\n<h3 id=\"bigquery\">BigQuery</h3>\n<ul>\n<li>Added support for Azure Data Lake Storage URIs (<code>abfs://</code> and <code>abfss://</code>) in\ninline external table definitions (<code>--external_table_definition</code>).</li>\n<li>Added <code>--dataplex_entry_group</code> flag to <code>bq mk --transfer_config</code> and\n<code>bq update --transfer_config</code> to allow integration with Dataplex Entry\nGroups.</li>\n<li>Added support to filter Transfer Configs by Dataplex Entry Group using\n<code>--filter=\"metadata_destination.dataplex_configuration:*\"</code> for\n<code>bq ls --transfer_config</code>.</li>\n</ul>\n<h3 id=\"cloud_alerting\">Cloud Alerting</h3>\n<ul>\n<li>Promoted <code>gcloud monitoring alerts</code> command group to GA.</li>\n</ul>\n<h3 id=\"cloud_composer\">Cloud Composer</h3>\n<ul>\n<li>Updated <code>gcloud composer environments storage dags export</code>,\n<code>gcloud composer environments storage data export</code>,\n<code>gcloud composer environments storage plugins export</code>,\n<code>gcloud beta composer environments storage dags export</code>,\n<code>gcloud beta composer environments storage data export</code>, and\n<code>gcloud beta composer environments storage plugins export</code> to skip, with a\nwarning, objects that would be written outside of the local <code>--destination</code>\ndirectory.</li>\n</ul>\n<h3 id=\"cloud_dns\">Cloud DNS</h3>\n<ul>\n<li>Added <code>gcloud beta dns outbound-endpoints</code> command group.</li>\n<li>Added <code>--outbound-endpoints</code> flag to <code>gcloud beta dns managed-zones</code> and <code>gcloud beta dns policies</code>.</li>\n</ul>\n<h3 id=\"cloud_firestore\">Cloud Firestore</h3>\n<ul>\n<li>Promoted <code>gcloud firestore change-streams</code> commands to GA.</li>\n</ul>\n<h3 id=\"cloud_storage\">Cloud Storage</h3>\n<ul>\n<li>Added server-side hash validation by default for resumable uploads in\n<code>gcloud storage cp</code>, <code>gcloud storage mv</code>, and <code>gcloud storage rsync</code>. To\ndisable this behavior, run <code>gcloud config set\nstorage/enable_server_side_hash_validation False</code>.</li>\n</ul>\n<h3 id=\"compute_engine\">Compute Engine</h3>\n<ul>\n<li>Optimized <code>gcloud compute instance-groups managed list-instances</code> by\npassing <code>--limit</code> and <code>--page-size</code> to the backend API and terminating page\nfetching early when the limit is reached.</li>\n<li>Added <code>CMEK_ENCRYPTION</code> option to <code>--local-ssd-encryption-mode</code> flag of\n<code>gcloud beta compute instances create</code> to encrypt Local SSDs with\ncustomer-managed encryption keys.</li>\n<li>Fixed <code>gcloud beta compute disk-types list</code> returning no results when\n<code>--zones</code> or <code>--regions</code> is specified. Deprecated <code>NAME</code> positional\nargument and <code>--regexp</code> flag of this command. Use <code>--filter</code> instead.</li>\n<li>Promoted <code>loadBalancingScheme</code> value <code>EXTERNAL_PASSTHROUGH</code> to GA in import\nand export schemas for <code>gcloud compute backend-services</code>.</li>\n<li>Promoted <code>IPAddresses</code> and <code>loadBalancingScheme</code> value\n<code>EXTERNAL_PASSTHROUGH</code> to GA in import and export schemas for <code>gcloud\ncompute forwarding-rules</code>.</li>\n<li>Promoted <code>gcloud compute advice capacity</code> to GA.</li>\n<li>Promoted <code>gcloud compute advice capacity-history</code> to GA.</li>\n</ul>\n<h3 id=\"database_migration\">Database Migration</h3>\n<ul>\n<li>Updated <code>--ssl-flags</code> flag documentation and parsing for <code>gcloud\ndatabase-migration connection-profiles</code> commands to support custom\ndelimiter syntax (<code>^DELIM^</code>) for values containing commas (e.g.\n<code>server_certificate_dn</code>).</li>\n<li>Added <code>--dbm-port</code> flag to\n<code>gcloud database-migration connection-profiles create sqlserver</code> and\n<code>gcloud database-migration connection-profiles update</code> commands to specify\nthe Database Mirroring (DBM) port for SQL Server Distributed Availability\nGroup (DAG) migrations.</li>\n<li>Added <code>--sqlserver-dag-source-ag</code> and <code>--sqlserver-dag-linked-server</code> flags\nto <code>gcloud database-migration migration-jobs create</code> and\n<code>gcloud database-migration migration-jobs update</code> commands to configure SQL\nServer Distributed Availability Group (DAG) migrations.</li>\n</ul>\n<h3 id=\"device_run\">Device Run</h3>\n<ul>\n<li>Removed <code>gcloud beta device-run sessions submit xctest</code>. The command remains available in the alpha release track.</li>\n</ul>\n<h3 id=\"gke_hub\">GKE Hub</h3>\n<ul>\n<li>Added <code>--prioritized</code> flag to <code>gcloud beta container fleet rolloutsequences\nupgrade</code> and <code>gcloud beta container hub rolloutsequences upgrade</code>.</li>\n</ul>\n<h3 id=\"kubernetes_engine\">Kubernetes Engine</h3>\n<ul>\n<li>Added <code>--wiz-sensor-api-key-secret-uri</code>, <code>--wiz-sensor-proxy-secret-uri</code>,\nand <code>--wiz-sensor-registry-secret-uri</code> flags to <code>gcloud container clusters\ncreate</code>, <code>create-auto</code>, and <code>update</code> commands to configure Wiz Sensor.</li>\n</ul>\n<h3 id=\"looker\">Looker</h3>\n<ul>\n<li>Fixed <code>gcloud looker instances update --linked-lsp-project-number</code> sending\nan empty update mask and failing.</li>\n</ul>\n<h3 id=\"oracle_database\">Oracle Database</h3>\n<ul>\n<li>Added <code>update</code> command to the following <code>gcloud oracle-database</code> command\ngroups to support adding, updating, removing, and clearing labels using\n<code>--update-labels</code>, <code>--remove-labels</code>, and <code>--clear-labels</code> flags:\n<ul>\n<li><code>gcloud oracle-database cloud-exadata-infrastructures update</code></li>\n<li><code>gcloud oracle-database cloud-vm-clusters update</code></li>\n<li><code>gcloud oracle-database db-systems update</code></li>\n<li><code>gcloud oracle-database exascale-db-storage-vaults update</code></li>\n<li><code>gcloud oracle-database goldengate-connections update</code></li>\n<li><code>gcloud oracle-database goldengate-connection-assignments update</code></li>\n<li><code>gcloud oracle-database goldengate-deployments update</code></li>\n<li><code>gcloud oracle-database odb-networks odb-subnets update</code></li>\n</ul></li>\n</ul>\n<h3 id=\"workbench\">Workbench</h3>\n<ul>\n<li>Fixed <code>--nic-type</code> flag choices in <code>gcloud workbench instances create</code> to\nuse <code>VIRTIO_NET</code> instead of <code>VIRTIGO_NET</code>.</li>\n</ul>\n<p>Subscribe to these release notes at <a href=\"https://groups.google.com/forum/#!forum/google-cloud-sdk-announce\">https://groups.google.com/forum/#!forum/google-cloud-sdk-announce</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Enterprise: Gemini 4 Argon is available in AlphaEvolve</strong></p>\n<p>AlphaEvolve experiments can generate candidate programs with Gemini 4 Argon\nin the <code>global</code>, <code>us</code>, and <code>eu</code> regions. To use it, specify\n<code>gemini-4-argon</code> in the <code>models</code> field of <code>generationSettings</code>. Gemini 3.8\nFlash remains the default model.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/alphaevolve/reference-guide/api-reference#supported-models\">Supported\nmodels</a>\nand <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/locations#alphaevolve-limitations\">AlphaEvolve\nlimitations</a>.</p>\n<h2 class=\"release-note-product-title\">Managed Service for Apache Airflow</h2>\n<h3>Feature</h3>\n<p><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/create-environments#development-mode\">Development mode environments</a>\nand\n<a href=\"https://docs.cloud.google.com/composer/docs/composer-3/hibernate-environments\">Environment hibernation</a> are now generally available (GA).</p>\n<p>You can now create Managed Airflow (Gen 3) environments with Airflow 3 in\ndevelopment mode to test and develop DAGs before publishing them to production.\nYou can hibernate development mode environments when you no longer need them.\nHibernation reduces most environment costs to zero.</p>"
