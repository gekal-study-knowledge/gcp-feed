"entries":
  "c2b36d02d250f01e4ea0c1909490957e":
    "id": "c2b36d02d250f01e4ea0c1909490957e"
    "title": "エージェント型ソースコード レビューで敵対的 AI に先手を打つ"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review/"
    "published": "2026-10-13 09:00:00"
    "fetched": "2026-10-14 14:49:50"
    "summary": "<div class=\"block-paragraph_advanced\"><div><span style=\"vertical-align: baseline;\">執筆者: </span>Alex Tselevich, Michael Maturi</div>\n<div><hr />\n<h4><strong style=\"vertical-align: baseline;\">はじめに</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI の敵対的な不正使用により、データ窃盗や恐喝事案のリスクが増大しています。独自のソースコードが流出した際、防御者が脆弱性の特定とパッチ適用に奔走する一方で、攻撃者は AI ツールを使用してマシンスピードで攻撃を仕掛けてくるためです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、分析プロセスの構造化、懐疑的な視点による検証ステップの徹底、そしてドメイン固有の人間の専門知識をパイプラインに直接組み込むことで、その実効性を飛躍的に向上させました。AI モデルと、人間の専門家が主導する高度に構造化されたオーケストレーション レイヤを組み合わせることで、防御者が攻撃者よりも先に攻撃できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在、Mandiant は Agentic Vulnerability Discovery Harness（AVDH）を使用して、プロアクティブなレビュー、ペネトレーション テスト、レッドチーム オペレーション、インシデント対応業務において、コードを迅速に分析し、エクスプロイト パスを検出しています。このフレームワークは、マルチエージェント オーケストレーションと最前線の専門知識を組み合わせることで、日常的な脆弱性の発見と検証を強化し、人間がその能力を最大限に発揮できる作業に専念できるようにします。</span></p>\n<p><span style=\"vertical-align: baseline;\">防御者が同様のアプローチを自社環境に実装できるよう、Mandiant は、これまで社内で運用してきたポイントインタイム アーキテクチャの詳細を初めて公開します。AVDH を CodeMender の継続的なスキャンと併用して、2 層の防御戦略を構築することもできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">実際の成果</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AVDH を使用して 10 か月になりますが、大きな効果を実感しています。企業のリポジトリが窃取された最近のインシデント対応調査において、このハーネスはわずか 2 日間で 100 件を超える真陽性の深刻な脆弱性を発見しました。これは、手動レビューに要する時間のわずか数分の 1 で成果を上げたことになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これにより、Mandiant が大規模に脆弱性を発見するスピードが大幅に向上しました。Mandiant は、数千万行のコードにわたる環境を分析し、数千のパイプラインを実行して数万の検出結果を生成するために、このツールを使用しています。この迅速な分析により、広く利用されているウェブ拡張機能やオープンソース プロジェクトにおいて、CVE 採番の対象となる脆弱性が数十件特定されました。その結果、</span><a href=\"https://www.drupal.org/sa-contrib-2026-062\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-13242</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"https://www.drupal.org/sa-core-2026-005\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-55803</span></a><span style=\"vertical-align: baseline;\"> を含む 12 件の CVE がすでに割り当てられており、さらに 12 件についても現在、開示手続きが進められています。</span></p>\n<p><span style=\"vertical-align: baseline;\">迅速かつ広範囲で高精度なスキャンは、AVDH の主なメリットの一つですが、標的型攻撃シミュレーションの実施中には、戦力増強の役割も果たしました。最近、あるクライアントのウェブ アプリケーションのソースコードをこのハーネスで処理したところ、初期アクセスを可能にするリモートコード実行（RCE）の脆弱性がすぐに見つかりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">AVDH は、強固な防御網をかいくぐり、複雑なエクスプロイト チェーンを加速させるうえで、極めて有用であることが繰り返し実証されています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">パイプラインの設計</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ハーネスは、大規模言語モデル（LLM）をサイバーセキュリティに活用するうえで不可欠なツールとなっています。これにより、モデルの予測不可能性の多くが軽減され、コード分析の有効性が劇的に向上します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ハーネスのプログラム制御されたインフラストラクチャは、目標の完遂に向けて、エージェントを厳密に決定論的な手法でオーケストレートします。AVDH では、</span><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Development Kit</span></a><span style=\"vertical-align: baseline;\">（ADK）を使用しました。これは、最も一般的なエージェント オーケストレーション パターンを実装し、カスタム統合やサードパーティ統合を柔軟に構成できる LLM フレームワークです。このアプローチは、</span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\"> で利用可能になったエージェント オーケストレーション機能と整合しています。この機能は、ビルダーがエージェント ワークフローを制御および管理するための集中型ワークスペースを提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">あらゆるソフトウェア分野で脆弱性の発見と修正に携わってきた、数十年にわたる最前線での経験を活かし、コンサルタントが日々実践している実績ある手法を基盤として AVDH を構築しました。AVDH は、ソフトウェア開発のウォーターフォール方式のように、専門のエージェントをパイプライン内で順次連携させます。これは、1 つのフェーズが完了してから次のフェーズを開始するという仕組みです。このパイプラインにより、優先順位とリスク評価が付与された検出結果リストが生成され、人間の専門家がレビューできるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">現場のセキュリティ専門家が組織のコンテキストを頼りにするのと同様に、エージェント ハーネスも、アセット インベントリ、ソフトウェア部品構成表（SBOM）、アーキテクチャ ドキュメント、脅威インテリジェンスといった豊富な環境データを必要とします。このコンテキスト データを、専門家の知見を凝縮したナレッジベースにフィードすることで、エージェントは関連するスキル、言語ルール、脆弱性パターンを動的に選択し、詳細な分析を行えるようになります。</span></p>\n</div></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Sequential vulnerability discovery methodology\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Sequential_vulnerability_discover.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: 脆弱性を順次検出する手法</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">脅威モデリング</strong></p>\n<p><span style=\"vertical-align: baseline;\">AI を使用してコード セキュリティ分析を行う際の重要な最初のステップは、対象のコードベースの脅威モデルを確立することです。ソフトウェア アーキテクチャは千差万別であり、脅威モデルがなければ、攻撃ベクトル、ビジネス ロジック、到達可能性といった重要なコンテキストを見失うおそれがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">従来のソースコード レビュー エンジンが画一的なパターン マッチング ルールに依存するのに対し、LLM には、標準権限ユーザーがアクセスできるコード、管理者限定のコード、あるいはまったく実行されないコードを識別できるという明確な優位性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">パイプラインは、</span><strong style=\"vertical-align: baseline;\">探索</strong><span style=\"vertical-align: baseline;\">エージェントをディスパッチして、ターゲット コードベースの主な目的を特定することから始まります。このエージェントは、ソフトウェア ドメイン（ウェブやデスクトップ アプリケーションなど）を判別し、検出されたドキュメントを確認します。また、スキャンから除外すべきディレクトリ（単体テストを含むものなど）にフラグを立て、</span><strong style=\"vertical-align: baseline;\">スペシャリスト探索</strong><span style=\"vertical-align: baseline;\">サブエージェントをディスパッチします。</span></p>\n<p><span style=\"vertical-align: baseline;\">スペシャリスト探索サブエージェントは、認証、認可、ルーティング、その他のドメイン固有のカテゴリなど、それぞれの専門分野を掘り下げます。これらの出力は、</span><strong style=\"vertical-align: baseline;\">脅威モデル合成</strong><span style=\"vertical-align: baseline;\">エージェントに渡され、検出結果が一貫性のある脅威モデルへと集約されます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Codebase reconnaissance workflow diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_Codebase_reconnaissance_workflow_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 2: コードベースの偵察ワークフロー図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この段階の分析が完了すると、次の工程に進む前の検証用として、脅威モデルのテキスト情報と図解の両方がコンサルタントに提示されます。この承認ゲートにより、パイプラインの残りの部分が正確な基盤に基づいて動作することが保証されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">図 3 は、ハーネスによって生成されたビジュアル脅威モデルのレイアウト例であり、どのアプリケーション コンポーネントが公開され、それらがどのように接続されているかを示しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Visual representation of a threat model for a sample codebase\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3a.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 3: サンプル コードベースの脅威モデルの視覚的表現</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">エントリ ポイントの検出</strong></p>\n<p><span style=\"vertical-align: baseline;\">脅威モデルを確立した段階で、並列化された</span><strong style=\"vertical-align: baseline;\">検出</strong><span style=\"vertical-align: baseline;\">エージェントをデプロイして、スコープ内のすべてのファイルを分析します。これらのエージェントは、軽量な Gemini Flash Lite モデルを活用してコードを大規模に処理することで、HTTP ルートやプロセス間通信（IPC）リスナー、その他のドメイン固有の攻撃ベクトルといった、アプリケーションの重要なエントリ ポイントを抽出します。同時に、これらの特定されたエントリ ポイントにネストされている、ユーザー入力の特定可能なすべてのソースを分離して抽出します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Entry point discovery workflow diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_4_Entry_point_discovery_workflow_di.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 4: エントリ ポイント検出ワークフロー図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">コンテキストの拡充</strong></p>\n<p><span style=\"vertical-align: baseline;\">分析対象のエントリ ポイントが選択されると、ハーネスはそれぞれを専用の</span><strong style=\"vertical-align: baseline;\">拡充</strong><span style=\"vertical-align: baseline;\">エージェントに割り当てます。エンタープライズ アプリケーションでは、エントリ ポイントを個別に分析するだけでは不十分なことがほとんどです。というのも、サニタイザー、権限、ルーティング条件といった重要なコンポーネントは、高度に分散していることが多いからです。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、脆弱性は、ネストされた関数呼び出し、複数のホップ、最初のソースから離れたファイルの奥深くに隠れていることがよくあります。このギャップを埋めるために、拡充エージェントはコードベースを探索し、割り当てられたエントリ ポイントのコンテキストに関連するコードを集約します。この集約されたデータを評価し、エントリ ポイントに対して、アクセス制御エージェントやデータフロー分析エージェント、あるいはその両方によるさらなる分析が必要かどうかを判断します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Context enrichment workflow diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_5_Context_enrichment_workflow_diagr.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 5: コンテキストの拡充ワークフロー図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Hypothesis Generation</strong></p>\n<p><span style=\"vertical-align: baseline;\">効果的なコード分析ができるかどうかは、制御フローとデータフローという 2 つの主要な特性をいかに把握できるかにかかっています。制御フローがタスクと命令の実行順序を規定するのに対し、データフローはアプリケーション全体で情報がどのように移動し、変換されるかを追跡します。</span></p>\n<p><span style=\"vertical-align: baseline;\">AVDH はこれらの重要なタスクを、</span><strong style=\"vertical-align: baseline;\">アクセス制御</strong><span style=\"vertical-align: baseline;\">エージェントと</span><strong style=\"vertical-align: baseline;\">データフロー分析</strong><span style=\"vertical-align: baseline;\">エージェントにそれぞれ委任します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この段階では、これらのエージェントは最小限の自己検証を行います。主な目的は、広範なブレインストーミングです。生成される膨大な数の仮説を管理するために、このクリエイティブ プロセスは、コンサルタントが構成した</span><strong style=\"vertical-align: baseline;\">信頼度フィルタ</strong><span style=\"vertical-align: baseline;\">によって制御されます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Hypothesis generation gating diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_6_Hypothesis_generation_gating_diag.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 6: 仮説生成のゲーティング図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">アクセス制御</strong><span style=\"vertical-align: baseline;\">エージェントは、ターゲットとなるエントリ ポイントに適用されている保護機能を評価し、アプリケーション ユーザーに対する全体的なアクセス性を判定します。その主な目的は、セキュリティの前提条件を検証し、特権機能が制限されているか、権限のないユーザーに誤って公開されていないかを確認することです。この分析により、チェックの未実施や誤った ID に対する検証といった欠陥が浮き彫りになります。これには、認可の欠落、権限昇格、クロスサイト リクエスト フォージェリ（CSRF）などが含まれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">一方、</span><strong style=\"vertical-align: baseline;\">データフロー分析</strong><span style=\"vertical-align: baseline;\">エージェントは、最初の入力ポイントからアプリケーション全体にわたるユーザー入力の流れを追跡します。具体的には、ネストされた関数呼び出し、サニタイザー変換、データベースなどのストレージ境界を通過するデータをトレースします。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントの目標は、このユーザー提供データが危険な「シンク」（悪意のある入力が行われて害を及ぼす可能性がある関数）に到達するかどうかを判断することです。この詳細なトレースにより、SQL インジェクション、クロスサイト スクリプティング（XSS）、コマンド インジェクション、パス トラバーサルなどの脆弱性クラスが明らかになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">仮説の検証</strong></p>\n<p><span style=\"vertical-align: baseline;\">ターゲット コードベースの仮説が生成されると、ハーネスは新しいエージェント セットをディスパッチして仮説を検証します。LLM では、Temperature パラメータが出力の変動性とランダム性を左右します。Temperature が低いと予測可能で安定した回答が得られる一方で、値が高いと毎回大きく異なる結果が生成されるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">ハーネスではこの特性を活かし、高い Temperature 設定で構成された複数の </span><strong style=\"vertical-align: baseline;\">検証</strong><span style=\"vertical-align: baseline;\">エージェントをディスパッチして各仮説を評価します。それと並行して、1 つの</span><strong style=\"vertical-align: baseline;\">検証合成</strong><span style=\"vertical-align: baseline;\">エージェントが、これらのエージェントの判定を処理して最終的な決定を下します。Temperature を高く設定することで、予測可能な期待どおりの回答にとどまらず、より幅広い可能性を検証できるようになります。最終的に、この Temperature 設定によって、最終判断を下すエージェントには、より豊富で包括的なコンテキストがもたらされます。</span></p>\n<p><span style=\"vertical-align: baseline;\">合成エージェントは、検証エージェントによる推論内容と判定結果を評価し、仮説が Mandiant の厳格な品質基準を満たしているか、また全体的な脅威モデルと整合しているかを判断します。その結果、次の 3 つのいずれかの結論に至ります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">確認済みの検出結果</strong><span style=\"vertical-align: baseline;\">: 仮説は妥当であり、検証エージェントによって個別に実証されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">反証された仮説</strong><span style=\"vertical-align: baseline;\">: 検証エージェントが、欠陥の妥当性を否定する重大な矛盾証拠を明らかにしました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">却下された仮説</strong><span style=\"vertical-align: baseline;\">: 仮説が確立された脅威モデルと整合しないか、脆弱性として認められません。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Hypothesis validation workflow diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_7_Hypothesis_validation_workflow_di.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 7: 仮説検証のワークフロー図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">人間による専門的知見</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">専門家による検証</strong></p>\n<p><span style=\"vertical-align: baseline;\">ハーネスが確認済みの検出結果を重複排除し、リスク評価を行った後、人間の専門家による厳格なレビューを行い、分析を継続します。Mandiant は、エクスプロイトを動的に再現し、概念実証（POC）コードを実行することで、AI の想定が正確であるか、また攻撃パスを阻害する未知の補完的コントロールが存在しないかを確認し、デュー デリジェンスを徹底しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">検証が完了すると、コンサルタントは AI が生成した検出結果を自身の専門的な分析と統合し、正式な開示に向けた準備を整えます。逆に、この動的テストフェーズをクリアできなかった検出結果は破棄されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">同様の脆弱性発見ハーネスの実装を検討しているネットワーク防御担当者の方には、検出結果を手動で検証することをおすすめします。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Human-in-the-loop handover diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_8_Human-in-the-loop_handover_diagra.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 8: 人間参加型ハンドオーバーの図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">蒸留された知識</strong></p>\n<p><span style=\"vertical-align: baseline;\">人間参加型の検証によって、確認された検出結果の偽陽性を効果的に最小限に抑えることはできますが、依然として偽陰性への対処も必要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントが脆弱性を見逃していないかどうかを判断するために、Mandiant の専門知識を分析パイプラインに直接注入するルールベースのアプローチを設計しました。これは、スキル エンジニアリングのコンセプトと同様に、コンサルタントの集合知から抽出された高度に専門化されたプロンプトを使用します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この人間の知性を AI 主導の分析に直接統合することで、結果の精度が大幅に向上します。このナレッジ システムのモジュール性とスケーラビリティを維持するため、ソフトウェア ドメインを最上位とし、その下に言語、フレームワーク、脆弱性という 3 つの主要なルールカテゴリを配した階層構造を採用しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Agentic rule system hierarchy\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_9_Agentic_rule_system_hierarchy.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 9: エージェント ルール システムの階層</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>フレームワークと言語のルールはパイプライン全体に適用され、対象のコードベースで採用されている特定のテクノロジーに関するコンサルタントの知見をエージェントに提供します。これらのルールは、一般的なエントリ ポイントの定義パターンや固有の攻撃対象領域といった重要な詳細を網羅しており、脅威モデリングに不可欠なコンテキスト情報も併せて提供します。</p><p>対照的に、脆弱性ルールはパイプラインの最終段階でのみ適用され、特定の種類の脆弱性をどのように検出し、検証し、リスク評価すべきかを厳密に定めています。この構造化されたシステムにより、分析パイプライン全体に Mandiant の専門的知見が反映されます。しかもそれは、保守性と高度なモジュール性を備えた形で実現されています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Methodology rule application diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Methodology_rule_application_diagram.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 10: 方法論のルール適用図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">成果の測定</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントによるコード分析パイプラインを維持し、継続的に改善するには、正確なベンチマークと評価が不可欠です。Mandiant は、オーケストレーション ハーネスのパフォーマンスを測定するための厳格な社内手法を開発しました。これにより、プロンプトの調整やルールの更新が、品質の劣化を招くことなく、データに裏付けられた改善を常に確実にもたらすようにしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">コード分析パイプラインの進捗と有効性を評価するために、同様のベンチマーク システムを実装することをおすすめします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ベンチマークの目標</strong></p>\n<p><span style=\"vertical-align: baseline;\">公開されているコード脆弱性データセットは存在するものの、トレーニング データの汚染は、LLM を評価するうえでの大きな課題となっています。最新のフロンティア モデルは、すでにこれらの公開リポジトリを学習に取り込んでいる可能性があるため、モデルが脆弱性を真に推論しているのか、それとも記憶した解決策を単に呼び出しているだけなのかを判断することはほぼ不可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">高忠実度の評価を確保するために、Mandiant は独自の合成コードベースのスイートを開発しました。これらのカスタム ベンチマークは、ソフトウェア ドメイン、プログラミング言語、脆弱性の深さ、そして従来のモノリスから最新のマイクロサービスに至るアーキテクチャまで、多岐にわたる分野を網羅しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">特筆すべきは、Mandiant のセキュリティ コンサルタントが、注入されたすべての脆弱性を手動で検証し、実際に到達可能で動的に悪用可能であることを担保している点です。ハーネスとその基盤となるプロンプトをチューニングする際には、厳格なレビュー プロセスを徹底し、AI がこれらのベンチマーク コードベースに過学習するのを能動的に防止しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ベンチマークの採点</strong></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant の採点プロセスでは、AI による評価と、専門家による人間参加型のレビューを組み合わせています。ハーネスがベンチマーク ディレクトリを分析すると、出力は専用の</span><strong style=\"vertical-align: baseline;\">採点</strong><span style=\"vertical-align: baseline;\">エージェントに渡されます。この採点エージェントは、パイプラインの検出結果をグラウンド トゥルース データセットと照らし合わせて評価します。そこでは、曖昧な意味的類似性に頼るのではなく、脆弱性の正確な一致を厳格に求めます。</span></p>\n<p><span style=\"vertical-align: baseline;\">その後、採点パイプラインは分岐してエッジケースを処理します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">偽陽性のトリアージ</strong><span style=\"vertical-align: baseline;\">: グラウンド トゥルースにマッピングされないハーネスの検出結果は、セカンダリ エージェントにルーティングされ、偽陽性か正当な脆弱性かが確定的に分類されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">重複の解消:</strong><span style=\"vertical-align: baseline;\"> パイプラインが単一のグラウンド トゥルースの問題にマッピングされる複数の検出結果を生成した場合、別のエージェントがそのクラスタを分析し、検出結果が重複しているかどうかを判定します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">最後に、人間の専門家が採点済みデータを手動で確認することで、AI による判定の精度を検証します。Mandiant は、ハーネスのメジャー リリースごとに、複数のドメインとアーキテクチャにわたってこの厳格なテストサイクルを実施しています。その際、LLM 固有の非決定性を考慮し、結果を平均化することで精度の安定を図っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">フレームワークと言語のルールはパイプライン全体に適用され、対象のコードベースで採用されている特定のテクノロジーに関するコンサルタントの知見をエージェントに提供します。これらのルールは、一般的なエントリ ポイントの定義パターンや固有の攻撃対象領域といった重要な詳細を網羅しており、脅威モデリングに不可欠なコンテキスト情報も併せて提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">対照的に、脆弱性ルールはパイプラインの最終段階でのみ適用され、特定の種類の脆弱性をどのように検出し、検証し、リスク評価すべきかを厳密に定めています。この構造化されたシステムにより、分析パイプライン全体に Mandiant の専門的知見が反映されます。しかもそれは、保守性と高度なモジュール性を備えた形で実現されています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Benchmarking process diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_11_Benchmarking_process_diagram.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 11: ベンチマーク プロセスの図</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ソフトウェア開発パイプラインのセキュリティ確保は、現代の企業防衛における極めて重要な課題となっています。Mandiant の継続的な調査により、防御者は</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/defending-enterprise-ai-vulnerabilities\"><span style=\"text-decoration: underline; vertical-align: baseline;\">敵対的 AI の急速な能力向上への対応</span></a><span style=\"vertical-align: baseline;\">において、極めて困難な課題に直面していることが明らかになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした新たな脅威に対抗するには、コード パイプラインの保護が最新の防御戦略における不可欠な要素でなければなりません。手動によるソースコード レビューでは AI のスピードに追いつけず、従来のスキャン エンジンでは、最新のソフトウェアに潜む広範な脆弱性を常に見逃してしまいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、このハーネスの成功は、防御者が敵対的 AI に対して再び優位に立てることを実証しています。専門家が定義したハーネスにフロンティア モデルを組み込むことで、防御者は定型的な脆弱性の検出を自動化できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした定型的な検出結果を処理することで、ソースコードの可視性はスケーラブルな防御へと進化します。これにより、コンサルタントなどの防御者は単純作業から解放され、複雑な欠陥の分析に完全に専念できるようになります。このハーネスを構築し、改良を重ねるなかで確信したのは、AI の真価は、人間の専門知識を何倍にも高めるマルチプライヤーとして活用したときにこそ発揮されるということです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant のツールは、スポット的な評価や、プロアクティブで詳細な脆弱性調査を目的として構築されました。一方で、</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ai-assisted-vulnerability-management\"><span style=\"text-decoration: underline; vertical-align: baseline;\">最近のブログ投稿</span></a><span style=\"vertical-align: baseline;\">では、CodeMender が AI による継続的なモニタリングをソフトウェア開発と脆弱性管理に提供し、このツールをいかに補完するかについて解説しています。これらの機能をすぐにデプロイして活用したい組織のために、</span><a href=\"https://cloud.google.com/security/ai-threat-defense?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Threat Defense</span></a><span style=\"vertical-align: baseline;\"> は常時稼働のプラットフォームを提供しています。これには CodeMender のコードスキャンと修復機能が含まれており、システムの分析、脅威の優先順位付け、脆弱性へのパッチ適用、そして新たな攻撃の継続的な監視を可能にします。標的を絞った深層分析を行う AVDH と、CodeMender による継続的なスキャンを組み合わせることで、2 層構造の防御戦略を実現します。このアプローチでは、複雑な攻撃チェーンに対してスポット的な修復を活用しながら、開発ライフサイクル全体にわたって継続的な可視性を維持します。</span></p>\n<p><span style=\"vertical-align: baseline;\">実際の環境でのパイプライン構築とデプロイの詳細にご興味はありませんか？2026 年 9 月 15 日～16 日にワシントン D.C. で開催される</span><a href=\"https://cyberdefensesummit.mandiant.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サイバー防御サミット</span></a><span style=\"vertical-align: baseline;\">にぜひご参加ください。Mandiant は「</span><a href=\"https://cyberdefensesummit.mandiant.com/conf2026/session/4345117/how-mandiant-orchestrates-gemini-to-find-zero-days-before-adversaries\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">How Mandiant Orchestrates Gemini to Find Zero-Days Before Adversaries</span></a><span style=\"vertical-align: baseline;\">」（Mandiant が Gemini をオーケストレートして、敵対者よりも先にゼロデイを見つける方法）というプレゼンテーションを行います。ライブデモの実演、エージェント ワークフローの導入から得られた知見の共有、AI による攻防能力の未来についての議論などをお届けします。</span><a href=\"https://cyberdefensesummit.mandiant.com/conf2026/begin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サミットには、こちらからご登録ください</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Google Threat Intelligence Group</strong></p></div>"
