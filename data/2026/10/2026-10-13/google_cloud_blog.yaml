    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Imagine your compliance team notices that payments are taking longer than expected to clear. They suspect fraud, and you’re the data scientist helping figure out which transactions to investigate first. Assembling that shortlist requires ingesting and cleaning raw transaction logs, training a model on past fraud, scoring new records, and scheduling the pipeline to run daily. Here’s how you can build that workflow end to end with an agent, using the Data Agent Kit inside the Antigravity IDE.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Introducing the Data Agent Kit</span></h3>\n<p><a href=\"https://cloud.google.com/products/data-agent-kit?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> helps you work with Google Cloud data through a </span><a href=\"https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">plugin for coding agents</span></a><span style=\"vertical-align: baseline;\"> or an </span><a href=\"https://open-vsx.org/extension/googlecloudtools/datacloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">extension for Visual Studio Code-based IDEs</span></a><span style=\"vertical-align: baseline;\">. It brings two significant additions to the workflow:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Help for your agent: </strong><span style=\"vertical-align: baseline;\">MCP tools connect your agent to data services. Skills are Markdown files that give it instructions and best practices for working with your data stack</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tools in your IDE: </strong><span style=\"vertical-align: baseline;\">work with Google’s </span><a href=\"https://cloud.google.com/data-cloud?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\">, from querying databases to deploying an Airflow pipeline, without leaving your editor</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Loading the data</span></h3>\n<p><span style=\"vertical-align: baseline;\">Let’s start with the raw transaction logs in </span><a href=\"https://cloud.google.com/storage?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Storage</span></a><span style=\"vertical-align: baseline;\">. You can ask the agent to create a notebook that loads them into </span><a href=\"https://cloud.google.com/bigquery?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> using </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spark</span></a><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Create a PySpark notebook to ingest JSON transaction logs from gs://financials-clearing-raw/ into the BigQuery table transactions.raw_transactions.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67f2780d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The agent generates a Jupyter notebook that loads the JSON logs into a BigQuery table named </span><span style=\"vertical-align: baseline;\">raw_transactions</span><span style=\"vertical-align: baseline;\">. You can open the notebook, review the code, and run it using a preconfigured Spark Serverless runtime from the IDE.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1_spark_runtime\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_spark_runtime.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Running a generated PySpark notebook</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">After the notebook runs, you can open the </span><span style=\"vertical-align: baseline;\">raw_transactions</span><span style=\"vertical-align: baseline;\"> table with the Data Agent Kit. The extension allows you to browse the table and inspect its metadata right from the IDE.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2_raw_table_ide\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_raw_table_ide.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Inspecting a BigQuery table in the IDE</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The records are now in BigQuery, but they aren’t ready for model training yet. First, we’ll handle duplicate and incomplete records, then join the remaining records with info about who sent and received each payment.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Cleaning it up</span></h3>\n<p><span style=\"vertical-align: baseline;\">Let’s put the cleanup logic into a dbt project so we can run it on each new batch of data. We’ll also test that each transaction appears only once. Prompt the agent:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Create a dbt project in dbt_project/ for the BigQuery dataset transactions.\\r\\n\\r\\nDeduplicate raw_transactions by transaction_id in staging. Separate records with null IDs into invalid_transactions. Join valid records with dim_payers and dim_payees to create enriched_transactions, preserving the is_fraud label. Add a transaction uniqueness test.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67f2782f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The agent generates a dbt project with SQL models for cleaning and enriching the data. Take a look at the generated code to check how it handles duplicates and joins reference tables. Then run </span><span style=\"vertical-align: baseline;\">dbt build</span><span style=\"vertical-align: baseline;\"> in the terminal. This builds the staging and enriched tables in BigQuery, along with a separate table for records with missing transaction IDs. dbt also runs the uniqueness test.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3_dbt_build\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_dbt_build.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Validating dbt models in the integrated terminal</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We also keep the </span><span style=\"vertical-align: baseline;\">is_fraud</span><span style=\"vertical-align: baseline;\"> column, which indicates whether a past transaction was fraudulent. We’ll train the model on records with known labels and use it to score new transactions, where we’re unsure yet whether fraud occurred.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Building the review queue</span></h3>\n<p><span style=\"vertical-align: baseline;\">With the data prepared, let’s ask the agent to create a training notebook using a Random Forest classifier running on Spark Serverless. </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Create a PySpark notebook to train a RandomForestClassifier\\r\\non table transactions.enriched_transactions.\\r\\n\\r\\nPredict is_fraud, training only on records where the label\\r\\nis not null. Encode categorical features, scale amounts,\\r\\nand evaluate the model using ROC AUC. Save the evaluated model to gs://models/fraud_model.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67f27802d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Review and run the notebook, then check its evaluation output to see how well the model separates fraudulent transactions from legitimate ones. You can also use the Data Agent Kit extension to verify that the trained model artifacts were saved to Google Cloud Storage.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"4_trained_model_gcs\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_trained_model_gcs.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Verifying the trained model artifacts in Google Cloud Storage</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Now we can use the saved model to score transactions that don’t have an </span><span style=\"vertical-align: baseline;\">is_fraud</span><span style=\"vertical-align: baseline;\"> value yet:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Create a batch inference notebook that loads the saved model from gs://my_models/fraud_model and scores records in transactions.enriched_transactions where is_fraud is null.\\r\\n\\r\\nWrite transactions with a fraud probability score &gt;= 0.50 to the Spanner table SparkEvalFraudReviewQueue, in the instance cymbal-fraud, database fraud-db.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67f27801d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In this example, the inference notebook scores the unlabeled transactions in BigQuery and sends those with an estimated fraud probability of 50% or higher to the </span><a href=\"https://cloud.google.com/spanner?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\"> review queue. The flagged records help the team decide where to investigate, but they still need to determine whether fraud occurred.</span></p>\n<p><span style=\"vertical-align: baseline;\">Look at how the inference notebook filters and writes flagged records, then run it. Once it finishes, query the Spanner table in the IDE to inspect the results.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5_spanner_results\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5_spanner_results.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Querying flagged transactions in the Spanner table</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This table is the list we set out to build. The compliance team can now start reviewing transactions, and we have a workflow that gets records from raw logs into the queue.</span></p>\n<p><span style=\"vertical-align: baseline;\">So far, we have been kicking off each step ourselves. We can now connect them so the workflow runs automatically each day.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Running it again tomorrow</span></h3>\n<p><span style=\"vertical-align: baseline;\">Each day we will load the latest logs, apply the dbt transformations, and score unlabeled transactions using the saved model. We’ll use the </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-airflow?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Airflow</span></a><span style=\"vertical-align: baseline;\"> to run these steps in order. </span><span style=\"vertical-align: baseline;\">Ask the agent: </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Create an orchestration pipeline named fraud_analysis_pipeline that runs ingestion, the dbt project, and batch inference in that order.\\r\\n\\r\\nSchedule it daily at midnight. Use Spark Serverless for the notebooks, including the Spanner connector for inference, and gs://YOUR_ARTIFACT_BUCKET for artifact storage.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67f2781110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The agent generates a YAML pipeline definition and deployment configuration. The pipeline definition sets the schedule and dependencies between steps. Meanwhile, the deployment configuration specifies the Airflow environment where it will run.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit then turns the definition into an Airflow DAG, which you can explore as an interactive graph in the IDE. Open the pipeline under “Orchestration Pipelines” and click a task to inspect it. For notebook tasks, you can follow the link straight back to the code.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"6_pipeline_config\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/6_pipeline_config.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Inspecting a data pipeline</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">With the Airflow environment configured, click “Run pipeline” in the canvas. Data Agent Kit packages the notebooks and dbt project, deploys the DAG, and triggers a run. Open the pipeline’s execution history to follow its progress. You can also select individual tasks to inspect their status, duration, and logs.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"7_airflow_logs\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/7_airflow_logs.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Kicking off an Airflow DAG and inspecting the logs</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Airflow will run the pipeline every day, taking new batches of data from raw logs to the review queue. The compliance team can now focus on flagged transactions, and you’ve automated the work of getting those records to them!</span></p>\n<h3><span style=\"vertical-align: baseline;\">Try it yourself</span></h3>\n<p><span style=\"vertical-align: baseline;\">If you are ready to try this for yourself, we have </span><a href=\"https://codelabs.developers.google.com/dak-data-science-antigravity-ide?hl=en#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">designed a codelab</span></a><span style=\"vertical-align: baseline;\"> that walks you through the full setup so you can build and run this workflow. You can also </span><a href=\"https://docs.cloud.google.com/data-agent-kit/overview?utm_campaign=CDR_0xaea1deef_default_b563520811&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">read our documentation</span></a><span style=\"vertical-align: baseline;\"> or check out the skills and tools in the open-source repository on </span><a href=\"https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-related_article_tout\">\n\n\n\n\n\n<div class=\"uni-related-article-tout h-c-page\">\n  <section class=\"h-c-grid\">\n    <a class=\"uni-related-article-tout__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n        h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3 uni-click-tracker\" href=\"https://cloud.google.com/blog/products/data-analytics/agentic-analytics-with-the-data-agent-kit/\">\n      <div class=\"uni-related-article-tout__inner-wrapper\">\n        <p class=\"uni-related-article-tout__eyebrow h-c-eyebrow\">Related Article</p>\n\n        <div class=\"uni-related-article-tout__content-wrapper\">\n          <div class=\"uni-related-article-tout__image-wrapper\">\n            <div class=\"uni-related-article-tout__image\"></div>\n          </div>\n          <div class=\"uni-related-article-tout__content\">\n            <h4 class=\"uni-related-article-tout__header h-has-bottom-margin\">Agentic analytics with the Data Agent Kit</h4>\n            <p class=\"uni-related-article-tout__body\">Data Agent Kit is a set of MCP servers and agent skills that helps data developers run data workflows from their IDEs. It’s available bot...</p>\n            <div class=\"cta module-cta h-c-copy  uni-related-article-tout__cta muted\">\n              <span class=\"nowrap\">Read Article\n                <svg class=\"icon h-c-icon\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <use xlink:href=\"#mi-arrow-forward\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n                </svg>\n              </span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </a>\n  </section>\n</div>\n\n</div>"
  "1888396359d430d6028e8739d40b2666":
    "id": "1888396359d430d6028e8739d40b2666"
    "title": "One Agent Development Kit, five languages"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/one-agent-development-kit-five-languages/"
    "published": "2026-10-13 21:22:00"
    "fetched": "2026-10-14 00:35:39"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When we talk about agents, that doesn't necessarily mean we're talking about Python. In today's modern ecosystem, an agent might run as a high-concurrency Go microservice on </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://github.com/google/adk-js/blob/main/core/src/models/chrome_prompt_llm.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">live inside a browser tab</span></a><span style=\"vertical-align: baseline;\"> calling Chrome's on-device model. Yet many agent frameworks assume a Python-only stack. That assumption forces teams to either spin up a Python service just for their agent workloads, or to build agent orchestration logic from scratch in their own language.</span></p>\n<p><span style=\"vertical-align: baseline;\">Google's </span><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit (ADK)</span></a><span style=\"vertical-align: baseline;\"> <span style=\"vertical-align: baseline;\">removes that trade-off with </span>coverage for </span><a href=\"https://github.com/google/adk-python\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Python</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/google/adk-go\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Go</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/google/adk-js\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TypeScript</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/google/adk-java\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Java</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://github.com/google/adk-kotlin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kotlin</span></a><span style=\"vertical-align: baseline;\">. Each version of the ADK is built from the ground up for its own runtime and type system, while sharing a unified architecture with interoperability through open protocols.</span></p>\n<h2><span style=\"vertical-align: baseline;\">A shared foundation</span></h2>\n<p><span style=\"vertical-align: baseline;\">Picking a language doesn't lock in your architecture: all five support the same open protocols. </span><span style=\"vertical-align: baseline;\">ADK includes a </span><a href=\"https://modelcontextprotocol.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Context Protocol</span></a><span style=\"vertical-align: baseline;\"> client in every language, so a custom tool exposed as an MCP server can be called from any of them immediately.</span></p>\n<p><span style=\"vertical-align: baseline;\">For multi-agent systems, ADK supports the </span><a href=\"https://github.com/a2aproject/A2A\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent2Agent (A2A)</span></a><span style=\"vertical-align: baseline;\"> protocol, allowing an agent to communicate with a remote agent over HTTP. Through A2A, agents written in different languages or frameworks are interoperable.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Starting agent-first</span></h2>\n<p><span style=\"vertical-align: baseline;\">To get started, run the one-time setup command to check your Google Cloud authentication, install the CLI, and then set up first-party ADK skills in coding agents like </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.anthropic.com/en/docs/claude-code\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Claude Code</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://github.com/openai/codex\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Codex</span></a><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;uvx google-agents-cli setup&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d11efdf50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Then, run the scaffold command to generate a working project with A2A endpoints and deployment config for Cloud Run, </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Runtime</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE)</span></a><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Scaffold an ADK project (use --agent adk for Python or --agent adk_go for Go)\\r\\nagents-cli scaffold create my-go-agent \\\\\\r\\n  --agent adk_go \\\\\\r\\n  --deployment-target cloud_run \\\\\\r\\n  --region us-central1&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d11efe290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Both the </span><a href=\"https://github.com/google/adk-python/tree/main/.agents/skills/adk-agent-builder\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Python</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://github.com/google/adk-kotlin/tree/main/.agents/skills/adk-kotlin-agent-builder\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Kotlin</span></a><span style=\"vertical-align: baseline;\"> repositories also ship agent builder skills in their source trees, and the </span><a href=\"https://adk.dev/llms.txt\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">adk.dev/llms.txt</code></a><span style=\"vertical-align: baseline;\"> resource gives any coding agent on-demand API documentation across all five languages.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"one-agent-development-kit-five-languages-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/one-agent-development-kit-five-languages-a.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Coding-agent skills scaffold your project while MCP and A2A connect all five language runtimes.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Hands-on view of each ADK</span></h2>\n<p><span style=\"vertical-align: baseline;\">The clearest way to feel the difference between the five languages is to define the same weather tool in each one and see how its design fits the runtime.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Python</span></h3>\n<p><span style=\"vertical-align: baseline;\">In </span><a href=\"https://github.com/google/adk-python/blob/main/contributing/samples/core/quickstart/agent.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Python</span></a><span style=\"vertical-align: baseline;\">, you don't need a decorator or a schema builder class. You pass a plain Python function into the </span><code style=\"vertical-align: baseline;\">tools</code><span style=\"vertical-align: baseline;\"> parameter, and ADK inspects its signature, type hints, and docstring at startup to automatically construct the tool declaration and </span><a href=\"https://docs.pydantic.dev/latest/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pydantic</span></a><span style=\"vertical-align: baseline;\"> parameter schema:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.adk.agents.llm_agent import Agent\\r\\n\\r\\n\\r\\ndef get_weather(city: str) -&gt; dict:\\r\\n  &quot;&quot;&quot;Retrieves the current weather report for a specified city.\\r\\n\\r\\n  Args:\\r\\n      city (str): The name of the city for which to retrieve the weather report.\\r\\n  &quot;&quot;&quot;\\r\\n  return {&quot;status&quot;: &quot;success&quot;, &quot;report&quot;: f&quot;Sunny and 72F in {city}.&quot;}\\r\\n\\r\\n\\r\\nroot_agent = Agent(\\r\\n    name=&quot;weather_agent&quot;,\\r\\n    model=&quot;gemini-3.8-flash&quot;,\\r\\n    instruction=&quot;Answer questions about the weather in a city.&quot;,\\r\\n    tools=[get_weather],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d1188bc90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Beyond fast prototyping, Python is ADK's reference implementation, shipping the broadest set of Google Cloud integrations (</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\">) and model adapters (</span><a href=\"https://ai.google.dev/gemini-api/docs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini</span></a><span style=\"vertical-align: baseline;\">, Anthropic, OpenAI, LiteLLM). Paired with the </span><code style=\"vertical-align: baseline;\">adk eval</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">agents-cli eval run</code><span style=\"vertical-align: baseline;\"> commands</span><span style=\"vertical-align: baseline;\">, its evaluation tooling scores agent trajectories against golden datasets in continuous integration (CI) to test the whole system end to end, even when your production service runs in another language.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Go</span></h3>\n<p><span style=\"vertical-align: baseline;\">While Python leads in experimentation and evaluation, </span><a href=\"https://github.com/google/adk-go/blob/main/examples/quickstart/main.go\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Go</span></a><span style=\"vertical-align: baseline;\"> hits the sweet spot for production backend engineering.</span></p>\n<p><span style=\"vertical-align: baseline;\">A Go tool function takes the </span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/agent#Context\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">agent.Context</code></a><span style=\"vertical-align: baseline;\"> configuration and a strongly typed input struct. The </span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/tool/functiontool#New\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">functiontool.New</code></a><span style=\"vertical-align: baseline;\"> function uses Go generics to infer both the input and output schemas from your </span><code style=\"vertical-align: baseline;\">struct</code><span style=\"vertical-align: baseline;\"> tags:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;type GetWeatherArgs struct {\\r\\n\\tCity string `json:&quot;city&quot; jsonschema:&quot;The city to look up weather for.&quot;`\\r\\n}\\r\\n\\r\\ntype GetWeatherResult struct {\\r\\n\\tReport string `json:&quot;report&quot;`\\r\\n}\\r\\n\\r\\nfunc getWeather(_ agent.Context, args GetWeatherArgs) (GetWeatherResult, error) {\\r\\n\\treturn GetWeatherResult{Report: &quot;Sunny and 72F in &quot; + args.City}, nil\\r\\n}\\r\\n\\r\\nweatherTool, err := functiontool.New(functiontool.Config{\\r\\n\\tName:        &quot;get_weather&quot;,\\r\\n\\tDescription: &quot;Retrieves the current weather report for a city.&quot;,\\r\\n}, getWeather)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d1188a010&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Because the </span><code style=\"vertical-align: baseline;\">functiontool.New</code><span style=\"vertical-align: baseline;\"> function is generic over your handler's signature, the Go compiler verifies that your function matches the expected contract before your binary ever runs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Go was also the first language after Python to ship the </span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/workflow\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK 2.0 Graph Workflow runtime</span></a><span style=\"vertical-align: baseline;\">. When you need deterministic control flow alongside LLM reasoning, the </span><code style=\"vertical-align: baseline;\">workflow.New</code><span style=\"vertical-align: baseline;\"> function wires agents and plain Go functions into a directed graph with conditional routing and parallel steps:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;ag, err := workflowagent.New(&quot;order_pipeline&quot;, []workflow.Edge{\\r\\n\\t{From: workflow.Start, To: triageNode},\\r\\n\\t{From: triageNode, To: fulfillNode, Route: workflow.StringRoute(&quot;fulfill&quot;)},\\r\\n\\t{From: fulfillNode, To: notifyNode},\\r\\n})&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d1188a450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Where Go really stands out is in production on Cloud Run and GKE. A compiled Go agent packages onto a roughly 2 MiB </span><a href=\"https://github.com/GoogleContainerTools/distroless\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google distroless static base image</span></a><span style=\"vertical-align: baseline;\">, with no language VM or heavy dependency tree. A static Go binary binds to its port as soon as the container starts, skipping the module imports of </span><a href=\"https://docs.cloud.google.com/run/docs/tips/general\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dynamic languages</span></a><span style=\"vertical-align: baseline;\"> and the JAR unpacking and JIT warmup of </span><a href=\"https://docs.cloud.google.com/run/docs/tips/java\"><span style=\"text-decoration: underline; vertical-align: baseline;\">JVM services</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">After it's running, Go's concurrency model fits agent workloads naturally. Each goroutine starts with a </span><a href=\"https://go.dev/doc/go1.4#runtime\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2 KB stack</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://go.dev/doc/faq#goroutines\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">minimal scheduling overhead</span></a><span style=\"vertical-align: baseline;\">, so a single instance can multiplex thousands of concurrent streaming requests and tool calls. ADK for Go also includes </span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/server/adka2a/v2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">built-in A2A server handlers</span></a><span style=\"vertical-align: baseline;\"> and OpenTelemetry tracing out of the box.</span></p>\n<h3><span style=\"vertical-align: baseline;\">TypeScript</span></h3>\n<p><span style=\"vertical-align: baseline;\">TypeScript erases type annotations when compiling to JavaScript, so runtime reflection isn't an option. Instead, </span><a href=\"https://github.com/google/adk-js/blob/main/core/src/tools/function_tool.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for TypeScript</span></a><span style=\"vertical-align: baseline;\"> pairs with </span><a href=\"https://zod.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Zod</span></a><span style=\"vertical-align: baseline;\">. You pass a </span><code style=\"vertical-align: baseline;\">z.object(...)</code><span style=\"vertical-align: baseline;\"> schema to the </span><code style=\"vertical-align: baseline;\">FunctionTool</code><span style=\"vertical-align: baseline;\"> function, and TypeScript statically infers the parameter types of your </span><code style=\"vertical-align: baseline;\">execute</code><span style=\"vertical-align: baseline;\"> callback from that single declaration:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import { FunctionTool, LlmAgent } from &quot;@google/adk&quot;;\\r\\nimport { z } from &quot;zod&quot;;\\r\\n\\r\\nconst getWeatherTool = new FunctionTool({\\r\\n  name: &quot;get_weather&quot;,\\r\\n  description: &quot;Retrieves the current weather report for a city.&quot;,\\r\\n  parameters: z.object({\\r\\n    city: z.string().describe(&quot;The name of the city.&quot;),\\r\\n  }),\\r\\n  execute: async ({ city }) =&gt; {\\r\\n    return { status: &quot;success&quot;, report: `Sunny and 72F in ${city}.` };\\r\\n  },\\r\\n});\\r\\n\\r\\nexport const rootAgent = new LlmAgent({\\r\\n  name: &quot;weather_agent&quot;,\\r\\n  model: &quot;gemini-3.8-flash&quot;,\\r\\n  instruction: &quot;Answer questions about the weather in a city.&quot;,\\r\\n  tools: [getWeatherTool],\\r\\n});&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d11889f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Your runtime input validation, the JSON Schema sent to the model, and your IDE autocomplete inside the </span><code style=\"vertical-align: baseline;\">execute</code><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">callback </span><span style=\"vertical-align: baseline;\">all flow from one source of truth.</span></p>\n<p><span style=\"vertical-align: baseline;\">TypeScript also runs on the ADK 2.0 Graph Workflow engine and ships a </span><a href=\"https://github.com/google/adk-js/blob/main/core/src/index_web.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">standalone browser bundle</span></a><span style=\"vertical-align: baseline;\">. Beyond Node.js services, you can run an ADK agent directly in a browser tab using </span><a href=\"https://github.com/google/adk-js/blob/main/core/src/tools/webmcp/webmcp_toolset.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">WebMCP</span></a><span style=\"vertical-align: baseline;\"> for page-level tools and Chrome's on-device </span><a href=\"https://developer.chrome.com/docs/ai/prompt-api\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Prompt API</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Java</span></h3>\n<p><a href=\"https://github.com/google/adk-java/blob/main/tutorials/city-time-weather/src/main/java/com/google/adk/tutorials/CityTimeWeather.java\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Java</span></a><span style=\"vertical-align: baseline;\"> snaps right in for teams who have standardized on Maven, Gradle, and Spring Boot. You add</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">@Schema</code><span style=\"vertical-align: baseline;\"> annotations to method parameters and assemble agents by using a fluent </span><code style=\"vertical-align: baseline;\">LlmAgent.builder()</code><span style=\"vertical-align: baseline;\"> API:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;public class WeatherTools {\\r\\n  public static Map&lt;String, String&gt; getWeather(\\r\\n      @Schema(name = &quot;city&quot;, description = &quot;The name of the city&quot;)\\r\\n      String city) {\\r\\n    return Map.of(&quot;status&quot;, &quot;success&quot;, &quot;report&quot;, &quot;Sunny and 72F in &quot; + city);\\r\\n  }\\r\\n}\\r\\n\\r\\nLlmAgent agent = LlmAgent.builder()\\r\\n    .name(&quot;weather_agent&quot;)\\r\\n    .model(&quot;gemini-3.8-flash&quot;)\\r\\n    .instruction(&quot;Answer questions about the weather in a city.&quot;)\\r\\n    .tools(FunctionTool.create(WeatherTools.class, &quot;getWeather&quot;))\\r\\n    .build();&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d1188b3d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At runtime, the runner streams agent events reactively through </span><a href=\"https://github.com/ReactiveX/RxJava\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RxJava</span></a><span style=\"vertical-align: baseline;\">. For local testing and existing JVM apps, ADK for Java ships a Maven Dev UI plugin alongside first-party bridges for Spring AI and LangChain4j.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Kotlin</span></h3>\n<p><a href=\"https://github.com/google/adk-kotlin/blob/main/examples/src/main/kotlin/com/google/adk/kt/examples/tools/FunctionToolDemoAgent.kt\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Kotlin</span></a><span style=\"vertical-align: baseline;\"> takes a strong stance on build-time safety. Its </span><a href=\"https://kotlinlang.org/docs/ksp-overview.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kotlin Symbol Processing (KSP)</span></a><span style=\"vertical-align: baseline;\"> compiler plugin reads </span><code style=\"vertical-align: baseline;\">@Tool</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">@Param</code><span style=\"vertical-align: baseline;\"> annotations at build time and emits the tool schema directly into bytecode:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;class WeatherTools {\\r\\n  @Tool(\\r\\n    name = &quot;get_weather&quot;,\\r\\n    description = &quot;Retrieves the current weather report for a city.&quot;,\\r\\n  )\\r\\n  suspend fun getWeather(\\r\\n    @Param(&quot;The name of the city.&quot;) city: String\\r\\n  ): Map&lt;String, String&gt; = mapOf(&quot;status&quot; to &quot;success&quot;, &quot;report&quot; to &quot;Sunny and 72F in $city&quot;)\\r\\n}\\r\\n\\r\\nval agent = LlmAgent(\\r\\n  model = Gemini(&quot;gemini-3.8-flash&quot;),\\r\\n  name = &quot;weather_agent&quot;,\\r\\n  instruction = Instruction(&quot;Answer questions about the weather in a city.&quot;),\\r\\n  tools = WeatherTools().generatedTools(),\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1d1188b8d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If a tool signature uses an unsupported type or declares a default value on a non-nullable parameter, your Gradle build fails immediately instead of breaking in production. Because the </span><code style=\"vertical-align: baseline;\">.generatedTools()</code><span style=\"vertical-align: baseline;\"> function uses zero runtime reflection, it survives </span><a href=\"https://developer.android.com/topic/performance/app-optimization/enable-app-optimization\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android R8 shrinking</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">That zero-reflection design makes it possible to run the entire agent loop locally on Android. It offers JVM server support, including a Spring AI bridge and experimental ADK 2.0 graph workflows. On-device, ADK for Kotlin integrates with </span><a href=\"https://ai.google.dev/edge/litert-lm\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteRT-LM</span></a><span style=\"vertical-align: baseline;\"> for tool calling and </span><a href=\"https://developers.google.com/ml-kit/genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ML Kit</span></a><span style=\"vertical-align: baseline;\"> (Gemini Nano) for text generation. It also works with Room and AppSearch for local state, and Android AppFunctions for OS-level actions, all without requiring a network connection.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Choice without compromise</span></h2>\n<p><span style=\"vertical-align: baseline;\">Having five native languages in ADK means you don't have to pick a single runtime for your entire organization. Because every version of ADK speaks MCP and A2A, each component of your system can use the language that fits it best.</span></p>\n<p><span style=\"vertical-align: baseline;\">What languages have you used to build agents with Google's ADK? Let me know what stack you're running on </span><a href=\"https://x.com/kweinmeister\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.linkedin.com/in/karlweinmeister/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://bsky.app/profile/kweinmeister.bsky.social\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bluesky</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
