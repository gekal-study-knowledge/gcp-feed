"overview": |
  この日は 4 件で、データ分析とエージェント活用、それに運用の話題が並びました。BigQuery では TimesFM 3.0 がプレビューとなり、Google Research が開発した 3.3 億パラメーターの基盤モデルによって、SQL から直接マルチバリアントの時系列予測が行えるようになりました。TimesFM 2.5 までは単一系列のみを扱う単変量予測に限られていましたが、天候や販促、休日といった外部要因や関連する複数の対象を同時に扱えるようになり、GIFT-Eval、FEV-Bench、TIME の 3 つの公開リーダーボードすべてで 1 位、共変量・多変量いずれのゼロショット精度でも既存の基盤モデルを上回ったとしています。BI では Looker Data Apps がプレビューとなり、自然言語で欲しいものを説明するとエージェントが本番相当のアプリケーションを組み立てます。従来は LLM が書いたツールがガバナンスされたデータや行レベルのセキュリティ、セキュリティレビューの経路を欠いたまま試作で終わりがちでしたが、既存の Looker のガバナンス基盤を踏まえる形にすることでその隔たりを埋める狙いです。開発者向けには Data Agent Kit が紹介され、コーディングエージェント用のプラグインまたは VS Code 系 IDE の拡張として、データサービスへつなぐ MCP ツールと、データスタックの扱い方を示す Markdown のスキルを提供します。Cloud Storage の生トランザクションログを BigQuery に取り込み、過去の不正から学習したモデルでスコアリングし、Airflow のパイプラインを日次実行するところまで、Antigravity IDE 上で一通り組み立てる例が示されています。最後に、書籍「Site Reliability Engineering」の刊行から 10 年を迎え、全面的に書き直した第 2 版が発表されました。AI、マイクロサービス、マルチクラウド、サーバーレス、プラットフォームエンジニアリングによって変わった 10 年分の知見を反映した内容です。
