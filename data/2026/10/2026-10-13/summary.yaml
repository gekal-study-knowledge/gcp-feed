"overview": |
  この日は 7 件で、BigQuery の時系列予測モデルの刷新、Looker のデータアプリ、そしてエージェント開発キットの多言語化が中心でした。BigQuery では TimesFM 3.0 がプレビューで登場しました。Google Research が開発した 3 億 3,000 万パラメータの基盤モデルで、BigQuery SQL の中で多変量の時系列予測をネイティブに扱えるようにするものです。これまで AI.FORECAST を支えてきた TimesFM 2.0 / 2.5 は単変量の予測に限られ、1 本の時系列の履歴だけから将来値を予測していましたが、現実の予測問題は天候・プロモーション・祝日といった外部要因と関連する対象が相互に影響する多変量であることがほとんどです。TimesFM 3.0 は GIFT-Eval・FEV-Bench・TIME という 3 つの主要な公開リーダーボードすべてで 1 位となり、共変量と多変量の予測タスクで既存の基盤モデルを上回るゼロショット精度を達成しています。AI.FORECAST による単変量予測と AI.DETECT_ANOMALIES による異常検知についても、モデルを指定するだけで既存のワークフローがそのまま精度向上の恩恵を受けられるドロップイン置き換えとして使えます。あわせてリリースノートでは、自然言語の指示に基づいて非構造データを意味的に集約する BigQuery の AI.AGG 関数が一般提供となったこと、そして Cloud Billing の spend cap 予算が一部のサービスで一般提供となったことが告知されました。spend cap はコスト管理の仕組みで、対象サービスの見積もり支出が設定した予算額を超えると、そのプロジェクト内での新しいリクエストが一時停止され、上限が解除されるまでそれ以上の利用コストが発生しなくなります。手動で解除するか、翌月の開始時に自動で解除されます。総額の見積もりコストでアラートと上限を発動するため実際のコストが請求レポートに現れるより早く機能しますが、即時ではないため超過分は通常どおり請求されます。BI では、Looker Data Apps がプレビューで発表されました。多くのダッシュボードが定型のキャンバスと固定のチャートライブラリしか提供せず、分析が別システムへ移る CSV エクスポートに終わってしまう、あるいは思い描いたエグゼクティブ向け資料や顧客向けポータルを既存のグリッドタイルでは組めないという課題に対するもので、従来はカスタムアプリケーションを作るしかありませんでした。AI によって試作は一晩でできるようになりましたが、統制されたデータへのアクセス・行レベルセキュリティ・インフラの持ち主・セキュリティレビューを通す道筋がないままでは、LLM が書いたツールは本番に出られない試作にとどまります。Looker Data Apps は、エージェントが生成するアプリケーションの速さと、既存の Looker のガバナンスフレームワークによる統制・セキュリティ・信頼性を組み合わせ、平易な言葉で必要なものを説明すると、エージェントが Looker 内にネイティブにホストされる本番品質のアプリケーションとして構築します。エージェント開発では、Agent Development Kit (ADK) が Python・Go・TypeScript・Java・Kotlin の 5 言語に対応しました。エージェントが Cloud Run 上の高並行な Go マイクロサービスとして動いたり、ブラウザータブ内で Chrome のオンデバイスモデルを呼び出したりする一方、多くのエージェントフレームワークは Python 前提のスタックを想定しており、エージェントのためだけに Python サービスを立てるか、自分の言語でオーケストレーションを自作するかという選択を強いていました。ADK の各言語版はそれぞれのランタイムと型システムに合わせて作られながら、統一されたアーキテクチャを共有しオープンプロトコルで相互運用します。5 言語すべてに Model Context Protocol クライアントが含まれるため、MCP サーバーとして公開したカスタムツールはどの言語からも呼び出せ、マルチエージェント構成では Agent2Agent (A2A) プロトコルにより異なる言語やフレームワークで書かれたエージェントが HTTP 越しに相互運用できます。データサイエンスでは、Data Agent Kit が紹介されました。コーディングエージェント向けのプラグイン、または Visual Studio Code ベースの IDE 向け拡張機能として Google Cloud のデータを扱えるようにするもので、データサービスにつなぐ MCP ツールと、データスタックの扱い方やベストプラクティスを Markdown で与えるスキルをエージェントに提供し、IDE 内からデータベースのクエリから Airflow パイプラインのデプロイまでを行えます。記事では、Cloud Storage の生の取引ログを Spark で BigQuery へ取り込み、過去の不正データでモデルを学習させ、新しいレコードをスコアリングして日次実行をスケジュールするまでを Antigravity IDE 上のエージェントで組み立てる流れが示されました。信頼性では、オライリーから『Site Reliability Engineering: How Google Runs Production Systems』が出版されてから 10 年を迎えるのにあわせ、全面的に書き直した第 2 版が発表されました。初版の頃は多くの組織が初期のクラウド移行やモノリスからの脱却を始めた段階でしたが、現在は高速かつグローバルな規模でソフトウェアを届けるなかで、クラウド基盤の採用ではなく膨大な複雑さのもとで高い信頼性を保つことが課題になっており、AI・マイクロサービス・マルチクラウド・サーバーレス・プラットフォームエンジニアリングによる変化を踏まえた指針が示されます。セキュリティでは、Mandiant の Agentic Vulnerability Discovery Harness (AVDH) が紹介されました。AI の敵対的な不正使用によってデータ窃盗や恐喝のリスクが増し、ソースコードが流出すると攻撃側は AI ツールでマシンスピードで攻めてくるという前提のもと、分析プロセスの構造化・懐疑的な検証ステップ・ドメイン固有の人間の専門知識をパイプラインに直接組み込むことで実効性を高めたフレームワークです。運用 10 か月の成果として、企業のリポジトリが窃取されたインシデント対応調査でわずか 2 日間に 100 件を超える真陽性の深刻な脆弱性を発見したこと、数千万行規模の環境を分析して数千のパイプラインを実行し数万の検出結果を生成していること、広く使われている Web 拡張機能やオープンソースプロジェクトで CVE-2026-13242 や CVE-2026-55803 を含む 12 件の CVE が既に割り当てられさらに 12 件が開示手続き中であること、標的型攻撃シミュレーションでクライアントの Web アプリケーションのソースコードを処理したところ初期アクセスにつながる RCE 脆弱性がすぐに見つかったことが挙げられています。CodeMender の継続的スキャンと併用して 2 層の防御戦略を組むこともできるとされ、これまで社内で運用してきたポイントインタイムのアーキテクチャの詳細が初めて公開されました。
