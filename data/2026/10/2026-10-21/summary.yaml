"overview": |
  この日は 12 件 (重複を除くと 10 件) で、PHP の重大な脆弱性への対応、NVIDIA GTC Berlin 2026 にあわせたインフラとソブリン AI の発表、model garden への OpenAI モデル追加、そして Google Antigravity で選べるモデルが増えたことが中心でした。Google Cloud の顧客向けに、Claude Opus 5.5 と Claude Sonnet 5.5 が Google Antigravity で利用できるようになりました。素早いバグ修正か複雑な移行の計画かといった作業の性質によって適したモデルが異なるという考えから、開放的なエコシステムへの取り組みとして、仕事ごとに適切なモデルを選べるようにするものです。Claude Opus 5.5 は複雑な作業向け、Claude Sonnet 5.5 はより速く低コストな補完的な選択肢と位置づけられています。管理者が有効化すると、開発者はモデルピッカーから直接これらを選べます。管理者は Gemini 3.8 Flash や Gemini 4 Argon を含む Google の Gemini モデルも選択できます。対象は Antigravity 2.0、Antigravity CLI、そして最近公開された VS Code・JetBrains IntelliJ・Visual Studio 向けの Antigravity IDE 拡張で、統一された企業の課金とセキュリティの境界の中で使い分けられます。記事では、これらのモデルを使って Antigravity で構築する 2 つのエンジニアリングパターンも紹介されています。あわせて、新しいフロンティアモデル Gemini 4 Argon が Google Cloud で提供開始されたことの日本語記事も公開されました。Argon は高度な思考力と正確性を併せ持つように学習されているため、複数のステップからなる長いタスクでも一貫してコンテキストを維持し、専門的な知識を活用しながら処理を進められます。複雑なソフトウェアビルド、財務や法務の詳細な作業、CodeMender のようなサイバーセキュリティツールの導入といった場面で、チームが最初から最後まで集中を保てるよう助けるという位置づけです。前週に発表された Gemini Enterprise の進化と、1 つのプロンプトボックスからコード生成や長く複雑なタスクを任せられる万能エージェント「Gemini エージェント」を支えるモデルでもあります。セキュリティでは、PHP と Wiz Research が PHP 言語ランタイム本体の 2 件の重大な脆弱性 CVE-2026-109618 と CVE-2026-109619 を公開しました。認証なしのリモートコード実行とメモリの開示につながる恐れがあり、CVE.org が 2026 年 10 月 21 日に識別子を割り当てています。Wiz は複数のモデルを使って発見と修正を進め、脆弱性の発見、エクスプロイトの開発、攻撃の検知、パッチの検証で Gemini 4 Argon が大きく貢献したとされています。Google Cloud 自体は影響を受けませんが、Google Cloud 上で PHP を動かしている利用者は影響を受ける可能性があるため、直ちに取るべき対策のガイダンスが示されました。NVIDIA GTC Berlin 2026 にあわせた発表も複数公開されました。Google Cloud と NVIDIA は共同エンジニアリングを拡大し、継続的で多段のエージェント型ワークフローへの移行で従来のインフラが限界に達していることを踏まえ、ボトルネックの削減、エコシステムの選択肢の拡大、そして機密性の高いワークロードをハードウェアで保護する新しいソブリン AI と Confidential Computing の機能を打ち出しました。その一つとして、NVIDIA RTX PRO 6000 Blackwell Server edition GPU を使う G4 インスタンスでの Confidential Computing が一般提供となりました。NVIDIA Confidential Computing を AI Hypercomputer に直接統合し、計算中のデータを守りながら必要な性能を出すもので、36 のゾーンで複数の購入形態から利用できます。モデルの選択肢では、Google Cloud の model garden に OpenAI のモデルが加わりました。これにより、主要なクローズドソースの LLM 3 つすべてに加えて、ファーストパーティー・サードパーティー・オープンモデルを合わせて 200 以上を 1 つのエンタープライズ AI プラットフォームで提供する唯一のハイパースケーラーになったとしています。1 つのモデルに頼るのではなく、ワークロードごとに適したモデルを選べるようにするという考え方です。公共部門では、Google Public Sector Summit の Partner Connect でパートナー向けの施策が拡充されました。プリセールスの技術的な深掘り・ソリューション設計・PoC の実行を担うパートナーへのインセンティブと割引、パートナー主導で現場の Gemini 活用を継続させる Partner-Led User Success Program など 4 つの柱が示されています。リリースノートでは、Model Armor のテンプレートリソースについて、新規または更新時に責任ある AI やプロンプトインジェクション・脱獄の検出といった必要なフィルターを必ず適用させるカスタム組織ポリシーが一般提供となりました。日本のブログでは 2 本が公開されました。1 本目は Agent Development Kit (ADK) が Python・Go・TypeScript・Java・Kotlin の 5 言語に対応したことで、エージェントのためだけに Python サービスを立てたり、オーケストレーションのロジックを自分の言語でゼロから作ったりする必要がなくなります。各言語版はその言語のランタイムと型システムに合わせて作られながら、共通のオープンプロトコルを備え、すべてに Model Context Protocol クライアントが含まれるため MCP サーバーとして公開したツールをどの言語からでも呼べ、マルチエージェントでは Agent2Agent (A2A) で言語やフレームワークをまたいで相互運用できます。2 本目はブラウザベースのセキュリティで、ナレッジワーカーが勤務時間の 56% 以上をブラウザで過ごし (Omdia、2026 年)、ブラウザが AI ワークスペースとして中心的な運用環境になったという前提に立ちます。未承認の生成 AI ツール利用 (シャドー AI) によるプロンプト共有や自律エージェントの動作を通じた機密 IP の漏えいを 92% の組織が懸念している一方、EDR や境界ファイアウォールはブラウザ内のインタラクションを認識できず、悪意のある拡張機能・環境寄生型 (LOTL) 戦術・セッションハイジャックを見逃すため、Chrome Enterprise Premium でブラウザのテレメトリーを取り込んで可視性のギャップを埋める方針が示されました。
