    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 14 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/one-agent-development-kit-five-languages?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントといえば Python というイメージがありますが、実際は必ずしもそうではありません。現在の先進的なエコシステムでは、エージェントは</span><a href=\"https://cloud.google.com/run\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> 上で Go マイクロサービスとして大規模に同時実行されることもあれば、</span><a href=\"https://github.com/google/adk-js/blob/main/core/src/models/chrome_prompt_llm.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブラウザタブ内で動作</span></a><span style=\"vertical-align: baseline;\">して Chrome のオンデバイス モデルを呼び出すこともあります。しかし、エージェント フレームワークの多くは Python のみのスタックを想定しています。そのため、エージェント ワークロードのためだけに Python サービスをスピンアップしたり、エージェント オーケストレーション ロジックを独自の言語でゼロから構築したりすることが必要になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の</span><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit（ADK）</span></a><span style=\"vertical-align: baseline;\">は、</span><a href=\"https://github.com/google/adk-python\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Python</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/google/adk-go\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Go</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/google/adk-js\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TypeScript</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/google/adk-java\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Java</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/google/adk-kotlin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kotlin</span></a><span style=\"vertical-align: baseline;\"> をサポートしているため、このようなトレードオフは発生しません。ADK の各バージョンはそれぞれの言語のランタイムと型システムに合わせてゼロから構築されており、かつ、オープン プロトコルによる相互運用性を備えた統合アーキテクチャを共有しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">共通の基盤</strong></h4>\n<p><span style=\"vertical-align: baseline;\">5 つの言語すべてが同じオープン プロトコルをサポートしているため、使用する言語によってアーキテクチャが固定されることはありません。すべての言語の ADK に</span><a href=\"https://modelcontextprotocol.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Context Protocol</span></a><span style=\"vertical-align: baseline;\"> クライアントが含まれており、MCP サーバーとして公開されたカスタムツールを、どの言語からでもすぐに呼び出すことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">マルチエージェント システムの場合、ADK は</span><a href=\"https://github.com/a2aproject/A2A\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent2Agent（A2A）</span></a><span style=\"vertical-align: baseline;\">プロトコルをサポートしているため、エージェントは HTTP 経由でリモート エージェントと通信できます。エージェントが異なる言語やフレームワークで記述されていても、A2A を通じて相互運用することができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント ファースト開発の第一歩</strong></h4>\n<p><span style=\"vertical-align: baseline;\">まず、1 回限りの設定コマンドを実行して Google Cloud 認証を確認し、CLI をインストールします。その後、</span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.anthropic.com/en/docs/claude-code\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Claude Code</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/openai/codex\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Codex</span></a><span style=\"vertical-align: baseline;\"> などのコーディング エージェントでファーストパーティの ADK スキルを設定します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;uvx google-agents-cli setup&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c7810&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">次に scaffold コマンドを実行して、A2A エンドポイントと Cloud Run、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Runtime</span></a><span style=\"vertical-align: baseline;\">、または</span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine（GKE）</span></a><span style=\"vertical-align: baseline;\">のデプロイ構成を含む作業プロジェクトを生成します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Scaffold an ADK project (use --agent adk for Python or --agent adk_go for Go)\\r\\nagents-cli scaffold create my-go-agent \\\\\\r\\n  --agent adk_go \\\\\\r\\n  --deployment-target cloud_run \\\\\\r\\n  --region us-central1&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c6b10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><a href=\"https://github.com/google/adk-python/tree/main/.agents/skills/adk-agent-builder\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Python</span></a><span style=\"vertical-align: baseline;\"> リポジトリと</span><a href=\"https://github.com/google/adk-kotlin/tree/main/.agents/skills/adk-kotlin-agent-builder\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Kotlin</span></a><span style=\"vertical-align: baseline;\"> リポジトリの両方とも、ソースツリーにはエージェント ビルダーのスキルも含まれています。また、</span><a href=\"https://adk.dev/llms.txt\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">adk.dev/llms.txt</code></a><span style=\"vertical-align: baseline;\"> リソースにより、5 つの言語すべてのコーディング エージェントでオンデマンドの API ドキュメントを利用できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"one-agent-development-kit-five-languages-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/one-agent-development-kit-five-languages-a.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>コーディング エージェント スキルがプロジェクトの基盤を構築し、MCP と A2A が 5 つの言語ランタイムすべてを接続します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">各 ADK の実践的なサンプル</strong></h4>\n<p><span style=\"vertical-align: baseline;\">5 つの言語の違いを感じるには、各言語で同じ天気ツールを定義し、その設計とランタイムの連携方法を確認することが最もわかりやすいでしょう。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Python</strong></p>\n<p><a href=\"https://github.com/google/adk-python/blob/main/contributing/samples/core/quickstart/agent.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Python</span></a><span style=\"vertical-align: baseline;\"> では、デコレータやスキーマ ビルダー クラスは必要ありません。プレーンな Python 関数を </span><code style=\"vertical-align: baseline;\">tools</code><span style=\"vertical-align: baseline;\"> パラメータに渡すと、ADK の起動時にシグネチャ、型ヒント、docstring が検査され、ツール宣言と</span><a href=\"https://docs.pydantic.dev/latest/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Pydantic</span></a><span style=\"vertical-align: baseline;\"> パラメータ スキーマが自動的に構築されます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.adk.agents.llm_agent import Agent\\r\\n\\r\\n\\r\\ndef get_weather(city: str) -&gt; dict:\\r\\n  &quot;&quot;&quot;Retrieves the current weather report for a specified city.\\r\\n\\r\\n  Args:\\r\\n      city (str): The name of the city for which to retrieve the weather report.\\r\\n  &quot;&quot;&quot;\\r\\n  return {&quot;status&quot;: &quot;success&quot;, &quot;report&quot;: f&quot;Sunny and 72F in {city}.&quot;}\\r\\n\\r\\n\\r\\nroot_agent = Agent(\\r\\n    name=&quot;weather_agent&quot;,\\r\\n    model=&quot;gemini-3.8-flash&quot;,\\r\\n    instruction=&quot;Answer questions about the weather in a city.&quot;,\\r\\n    tools=[get_weather],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c4fd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Python は迅速なプロトタイピングが可能であるだけでなく、ADK のリファレンス実装でもあり、最も幅広い Google Cloud の統合（</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\">）とモデル アダプタ（</span><a href=\"https://ai.google.dev/gemini-api/docs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini</span></a><span style=\"vertical-align: baseline;\">、Anthropic、OpenAI、LiteLLM）が提供されています。</span><code style=\"vertical-align: baseline;\">adk eval</code><span style=\"vertical-align: baseline;\"> コマンドまたは </span><code style=\"vertical-align: baseline;\">agents-cli eval run</code><span style=\"vertical-align: baseline;\"> コマンドと組み合わせて評価ツールを使用することで、継続的インテグレーション（CI）でゴールデン データセットを基準としてエージェントの軌跡をスコアリングし、本番環境サービスが別の言語で実行されている場合でも、システム全体をエンドツーエンドでテストできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Go</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Python がテストと評価に優れている一方で、</span><a href=\"https://github.com/google/adk-go/blob/main/examples/quickstart/main.go\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Go</span></a><span style=\"vertical-align: baseline;\"> は本番環境のバックエンド エンジニアリングに最適です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Go ツールの関数は、</span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/agent#Context\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">agent.Context</code></a><span style=\"vertical-align: baseline;\"> 構成と厳密に型指定された入力構造体を受け取ります。</span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/tool/functiontool#New\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">functiontool.New</code></a><span style=\"vertical-align: baseline;\"> 関数は、Go ジェネリクスを使用して、</span><code style=\"vertical-align: baseline;\">struct</code><span style=\"vertical-align: baseline;\"> タグから入力スキーマと出力スキーマの両方を推測します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;type GetWeatherArgs struct {\\r\\n\\tCity string `json:&quot;city&quot; jsonschema:&quot;The city to look up weather for.&quot;`\\r\\n}\\r\\n\\r\\ntype GetWeatherResult struct {\\r\\n\\tReport string `json:&quot;report&quot;`\\r\\n}\\r\\n\\r\\nfunc getWeather(_ agent.Context, args GetWeatherArgs) (GetWeatherResult, error) {\\r\\n\\treturn GetWeatherResult{Report: &quot;Sunny and 72F in &quot; + args.City}, nil\\r\\n}\\r\\n\\r\\nweatherTool, err := functiontool.New(functiontool.Config{\\r\\n\\tName:        &quot;get_weather&quot;,\\r\\n\\tDescription: &quot;Retrieves the current weather report for a city.&quot;,\\r\\n}, getWeather)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c4690&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">functiontool.New</code><span style=\"vertical-align: baseline;\"> 関数はハンドラのシグネチャに対してジェネリクスを活用しているため、Go コンパイラは関数が想定されるコントラクトと一致することを確認してからバイナリを実行します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Go は、Python の次に</span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/workflow\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK 2.0 Graph Workflow ランタイム</span></a><span style=\"vertical-align: baseline;\">が提供された言語でもあります。LLM 推論と併せて決定的な制御フローを使用する必要がある場合は、</span><code style=\"vertical-align: baseline;\">workflow.New</code><span style=\"vertical-align: baseline;\"> 関数を使用して、エージェントとプレーンな Go 関数を条件付きルーティングと並列ステップを持つ有向グラフに接続します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;ag, err := workflowagent.New(&quot;order_pipeline&quot;, []workflow.Edge{\\r\\n\\t{From: workflow.Start, To: triageNode},\\r\\n\\t{From: triageNode, To: fulfillNode, Route: workflow.StringRoute(&quot;fulfill&quot;)},\\r\\n\\t{From: fulfillNode, To: notifyNode},\\r\\n})&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c6610&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Go が真価を発揮するのは、本番環境でCloud Run および GKE と組み合わせて使用する場合です。コンパイルされた Go エージェントは、約 2 MiB の</span><a href=\"https://github.com/GoogleContainerTools/distroless\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google distroless 静的ベースイメージ</span></a><span style=\"vertical-align: baseline;\">にパッケージ化され、言語 VM や重い依存関係ツリーはありません。静的な Go バイナリはコンテナが起動するとすぐにポートにバインドされ、</span><a href=\"https://docs.cloud.google.com/run/docs/tips/general\"><span style=\"text-decoration: underline; vertical-align: baseline;\">動的言語</span></a><span style=\"vertical-align: baseline;\">のモジュール インポートや、</span><a href=\"https://docs.cloud.google.com/run/docs/tips/java\"><span style=\"text-decoration: underline; vertical-align: baseline;\">JVM サービス</span></a><span style=\"vertical-align: baseline;\">の JAR の展開と JIT のウォームアップはスキップされます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Go の同時実行モデルは、実行されたエージェントのワークロードと優れた適合性を発揮します。各 goroutine は</span><a href=\"https://go.dev/doc/go1.4#runtime\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2 KB のスタック</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://go.dev/doc/faq#goroutines\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">最小限のスケジューリング オーバーヘッド</span></a><span style=\"vertical-align: baseline;\">で開始されるため、単一のインスタンスで数千の同時ストリーミング リクエストとツール呼び出しを多重化できます。ADK for Go には、</span><a href=\"https://pkg.go.dev/google.golang.org/adk/v2/server/adka2a/v2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">組み込みの A2A サーバー ハンドラ</span></a><span style=\"vertical-align: baseline;\">と OpenTelemetry トレースも含まれています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">TypeScript</strong></h4>\n<p><span style=\"vertical-align: baseline;\">TypeScript は JavaScript へのコンパイル時に型アノテーションが消去されるため、ランタイム リフレクションは使用できません。代わりに、</span><a href=\"https://github.com/google/adk-js/blob/main/core/src/tools/function_tool.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for TypeScript</span></a><span style=\"vertical-align: baseline;\"> は </span><a href=\"https://zod.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Zod</span></a><span style=\"vertical-align: baseline;\"> と連携します。</span><code style=\"vertical-align: baseline;\">z.object(...)</code><span style=\"vertical-align: baseline;\"> スキーマを </span><code style=\"vertical-align: baseline;\">FunctionTool</code><span style=\"vertical-align: baseline;\"> 関数に渡すと、TypeScript はその単一の宣言から </span><code style=\"vertical-align: baseline;\">execute</code><span style=\"vertical-align: baseline;\"> コールバックのパラメータ型を静的に推測します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import { FunctionTool, LlmAgent } from &quot;@google/adk&quot;;\\r\\nimport { z } from &quot;zod&quot;;\\r\\n\\r\\nconst getWeatherTool = new FunctionTool({\\r\\n  name: &quot;get_weather&quot;,\\r\\n  description: &quot;Retrieves the current weather report for a city.&quot;,\\r\\n  parameters: z.object({\\r\\n    city: z.string().describe(&quot;The name of the city.&quot;),\\r\\n  }),\\r\\n  execute: async ({ city }) =&gt; {\\r\\n    return { status: &quot;success&quot;, report: `Sunny and 72F in ${city}.` };\\r\\n  },\\r\\n});\\r\\n\\r\\nexport const rootAgent = new LlmAgent({\\r\\n  name: &quot;weather_agent&quot;,\\r\\n  model: &quot;gemini-3.8-flash&quot;,\\r\\n  instruction: &quot;Answer questions about the weather in a city.&quot;,\\r\\n  tools: [getWeatherTool],\\r\\n});&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c5310&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ランタイム入力の検証、モデルに送信される JSON スキーマ、</span><code style=\"vertical-align: baseline;\">execute</code><span style=\"vertical-align: baseline;\"> コールバック内の IDE 予測入力はすべて、信頼できる唯一の情報源から取得されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">TypeScript は ADK 2.0 Graph Workflow エンジンでも動作し、</span><a href=\"https://github.com/google/adk-js/blob/main/core/src/index_web.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">スタンドアロンのブラウザ バンドル</span></a><span style=\"vertical-align: baseline;\">が提供されています。Node.js サービス以外にも、ページレベルのツール用の</span><a href=\"https://github.com/google/adk-js/blob/main/core/src/tools/webmcp/webmcp_toolset.ts\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">WebMCP</span></a><span style=\"vertical-align: baseline;\"> と Chrome のオンデバイス</span><a href=\"https://developer.chrome.com/docs/ai/prompt-api\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Prompt API</span></a><span style=\"vertical-align: baseline;\"> を使用して、ブラウザタブで ADK エージェントを直接実行することができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Java</strong></h4>\n<p><a href=\"https://github.com/google/adk-java/blob/main/tutorials/city-time-weather/src/main/java/com/google/adk/tutorials/CityTimeWeather.java\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Java</span></a><span style=\"vertical-align: baseline;\"> は、Maven、Gradle、Spring Boot で標準化している場合に最適です。メソッド パラメータに </span><code style=\"vertical-align: baseline;\">@Schema</code><span style=\"vertical-align: baseline;\"> アノテーションを追加し、Fluent API である </span><code style=\"vertical-align: baseline;\">LlmAgent.builder()</code><span style=\"vertical-align: baseline;\"> を使用してエージェントを組み立てます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;public class WeatherTools {\\r\\n  public static Map&lt;String, String&gt; getWeather(\\r\\n      @Schema(name = &quot;city&quot;, description = &quot;The name of the city&quot;)\\r\\n      String city) {\\r\\n    return Map.of(&quot;status&quot;, &quot;success&quot;, &quot;report&quot;, &quot;Sunny and 72F in &quot; + city);\\r\\n  }\\r\\n}\\r\\n\\r\\nLlmAgent agent = LlmAgent.builder()\\r\\n    .name(&quot;weather_agent&quot;)\\r\\n    .model(&quot;gemini-3.8-flash&quot;)\\r\\n    .instruction(&quot;Answer questions about the weather in a city.&quot;)\\r\\n    .tools(FunctionTool.create(WeatherTools.class, &quot;getWeather&quot;))\\r\\n    .build();&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c54d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">実行時には、ランナーが</span><a href=\"https://github.com/ReactiveX/RxJava\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">RxJava</span></a><span style=\"vertical-align: baseline;\"> を介してエージェント イベントをリアクティブにストリーミングします。ローカルテストと既存の JVM アプリ向けに、ADK for Java には Maven Dev UI プラグインと、Spring AI および LangChain4j 用のファーストパーティ ブリッジが提供されています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Kotlin</strong></h4>\n<p><a href=\"https://github.com/google/adk-kotlin/blob/main/examples/src/main/kotlin/com/google/adk/kt/examples/tools/FunctionToolDemoAgent.kt\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK for Kotlin</span></a><span style=\"vertical-align: baseline;\"> は、ビルド時の安全性を重視しています。</span><a href=\"https://kotlinlang.org/docs/ksp-overview.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kotlin Symbol Processing（KSP）</span></a><span style=\"vertical-align: baseline;\">コンパイラ プラグインが、ビルド時に </span><code style=\"vertical-align: baseline;\">@Tool</code><span style=\"vertical-align: baseline;\"> アノテーションと </span><code style=\"vertical-align: baseline;\">@Param</code><span style=\"vertical-align: baseline;\"> アノテーションを読み取り、ツールスキーマをバイトコードに直接出力します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;class WeatherTools {\\r\\n  @Tool(\\r\\n    name = &quot;get_weather&quot;,\\r\\n    description = &quot;Retrieves the current weather report for a city.&quot;,\\r\\n  )\\r\\n  suspend fun getWeather(\\r\\n    @Param(&quot;The name of the city.&quot;) city: String\\r\\n  ): Map&lt;String, String&gt; = mapOf(&quot;status&quot; to &quot;success&quot;, &quot;report&quot; to &quot;Sunny and 72F in $city&quot;)\\r\\n}\\r\\n\\r\\nval agent = LlmAgent(\\r\\n  model = Gemini(&quot;gemini-3.8-flash&quot;),\\r\\n  name = &quot;weather_agent&quot;,\\r\\n  instruction = Instruction(&quot;Answer questions about the weather in a city.&quot;),\\r\\n  tools = WeatherTools().generatedTools(),\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f6a604c4310&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ツール シグネチャが、サポートされていない型を使用したり、null 非許容パラメータにデフォルト値を宣言したりした場合、本番環境で問題が発生するのではなく、Gradle ビルドがただちに失敗します。</span><code style=\"vertical-align: baseline;\">.generatedTools()</code><span style=\"vertical-align: baseline;\"> 関数はランタイム リフレクションを使用しないため、</span><a href=\"https://developer.android.com/topic/performance/app-optimization/enable-app-optimization\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android R8 圧縮</span></a><span style=\"vertical-align: baseline;\">後も保持されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">リフレクションを使用しないこの設計により、エージェント ループ全体を Android 上でローカルに実行できます。また、JVM サーバーをサポートしており、Spring AI ブリッジや試験運用版の ADK 2.0 グラフ ワークフローなどを使用できます。オンデバイスでは、ADK for Kotlin は</span><a href=\"https://ai.google.dev/edge/litert-lm\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteRT-LM</span></a><span style=\"vertical-align: baseline;\">（ツール呼び出し）および</span><a href=\"https://developers.google.com/ml-kit/genai\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ML Kit</span></a><span style=\"vertical-align: baseline;\">（Gemini Nano、テキスト生成）と統合できます。さらに、Room および AppSearch と連携してローカル状態を管理したり、Android AppFunctions と連携して OS レベルのアクションを実行したりすることができ、このいずれにもネットワーク接続は必要ありません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">妥協のない選択</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ADK は 5 つの言語にネイティブで対応しているため、組織全体で 1 つのランタイムに統一する必要がありません。すべてのバージョンが MCP と A2A に対応しており、システムの各コンポーネントで最適な言語を使用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の ADK で、どの言語を使用してエージェントを構築しましたか？皆様がどのようなスタックを使用しているか、</span><a href=\"https://x.com/kweinmeister\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.linkedin.com/in/karlweinmeister/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://bsky.app/profile/kweinmeister.bsky.social\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bluesky</span></a><span style=\"vertical-align: baseline;\"> でぜひ教えてください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- デベロッパーリレーションズ担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Karl Weinmeister</strong></p></div>"
  "b81a634b4276b1804e003aaec888102b":
    "id": "b81a634b4276b1804e003aaec888102b"
    "title": "ブラウザベースのセキュリティの未来: ブラウザデータを活用してプロアクティブな防御を実現"
    "link": "https://cloud.google.com/blog/ja/products/chrome-enterprise/the-future-of-browser-based-security-leveraging-browser-data-for-proactive-defense/"
    "published": "2026-10-21 09:00:00"
    "fetched": "2026-10-21 22:27:00"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 2 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/chrome-enterprise/the-future-of-browser-based-security-leveraging-browser-data-for-proactive-defense?e=0&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>ブラウザは大きく変化しました。現代の企業では、ウェブへの入口としてだけでなく、AI ワークスペースとしても機能し、中心的な運用環境となっています。ナレッジ ワーカーは勤務時間の 56% 以上でブラウザを使用しており、ブラウザは日常業務、複雑なワークフロー、自律型 AI エージェントとの直接的なやり取りのための主要な場所であると言えます（<a href=\"https://services.google.com/fh/files/misc/omdiareport.pdf\" target=\"_blank\">Omdia</a>、2026 年）。脅威アクターに対抗するには、ブラウザ テレメトリーをセキュリティ アーキテクチャの中心に据えたブラウザ戦略が必要です。</p><p><b>シャドー AI の登場とエージェントがもたらすリスク</b></p><p>さまざまな企業が AI を導入する中、新たな脆弱性が生じています。シャドー AI（一般公開されている生成 AI ツールを未承認で使用すること）は、プロンプトの共有や自律型エージェントのアクションを通じて、企業の機密 IP を漏洩させる可能性があります。92% の組織が、これらのチャネルを通じたデータ漏洩の危険性に懸念を示しています。こうした状態を監視せずに放置すると、重大なリスクが生じます（<a href=\"https://services.google.com/fh/files/misc/omdiareport.pdf\" target=\"_blank\">Omdia</a>、2026 年）。</p><p>そもそも従来のセキュリティ スタック（エンドポイントの検出と対応（EDR）や境界ファイアウォールなど）は、ブラウザ内のインタラクションを認識できません。AI 主導のワークフローに特有の、次のような高リスクの脅威ベクトルは完全に見逃されます。</p><ul><li>機密性の高い財務データを「読み取る」、またはログインページにキーロガーを「書き込む」悪意のある拡張機能。</li><li>「環境寄生型」（LOTL）戦術とセッション ハイジャック。</li><li>AI を利用して攻撃ライフサイクルを加速する、国家支援型脅威アクター。</li></ul><p><b>Chrome Enterprise Premium: 高忠実度のテレメトリー エンジン</b></p><p>Chrome Enterprise Premium は、ブラウザのテレメトリーを取り込むことで、この可視性のギャップを解消します。事後に外部から観察するのではなく、ユーザー インタラクションの時点でシグナルを直接記録します。</p><p><b>最新の防御の中核となる機能</b></p><ul><li><b>リアルタイム シグナル:</b> ネットワーク イベント、リスクの高いユーザー行動、不審なドメイン アクセスに関する継続的なテレメトリー。</li><li><b>拡張機能のテレメトリー:</b> 従来の EDR では見逃される可能性のある、サイドローディングされた拡張機能や拡張機能とドメインの間の通信を詳細に可視化。</li><li><b>生成 AI と SaaS アプリのレポート:</b> フリート全体で承認済みの AI ツールと未承認の AI ツールを検出して管理するための専用機能。</li><li><b>エビデンス ロッカー:</b> DLP ポリシーに違反するファイルやコンテンツを取り込む機能。フォレンジック分析、根本原因の特定、検出ルールの改良に不可欠な証跡を提供します。</li></ul><p><b>リアクティブなレビューからプロアクティブな緩和戦略への転換</b></p><p>プロアクティブな防御に移行することで、セキュリティ チームは脅威を早期に緩和できるようになります。ブラウザのシグナルを Google Security Operations などのセキュリティ運用プラットフォームにストリーミングすることで、対応を自動化し、手動での調査時間を短縮して、インシデント対応にかかる費用を削減できます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Blog table_2000x1115 (1)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Blog_table_2000x1115_1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>最前線からのインサイト: Mandiant の事例紹介</b></p><p>Mandiant の観測から、ブラウザの可視性が及ぼす実質的な効果が明らかになっています。これらの事例は、標準的な制御を回避する攻撃を検出するうえで、ブラウザのテレメトリーが果たす役割を示すものです。</p><ol><li><b>RMM ソフトウェアのダウンロード:</b> Chrome Enterprise Premium が、ある正規のリモート モニタリングおよび管理（RMM）実行可能ファイルにフラグを立てました。このファイルが新規登録されたドメインから配信されたものであったためです。新規登録されたドメインは、ネットワーク ツールが見落としがちなソーシャル エンジニアリングの重要な指標です。</li><li><b>認証情報の窃取:</b> Chrome Enterprise Premium が、インタラクションが発生した瞬間に URL のリスクとナビゲーション パラメータを評価し、ユーザーが認証情報を送信する前にフィッシングの試みを阻止しました。</li><li><b>マルバタイジング:</b> Google Threat Intelligence との統合により、悪意のある広告クリックを即座に特定し、アクターがハンズオン キーボード攻撃を実行する前に脅威を封じ込めました。</li></ol><p>セキュリティ ギャップを解消するには、まずブラウザが企業セキュリティの重要なリソースであることを認識する必要があります。数十億台の保護されたデバイスに Google のテレメトリーを行き渡らせることで、組織は新たな AI を利用しながら防御の可視性を維持し、プロアクティブなセキュリティ戦略を推進できます（<a href=\"https://safebrowsing.google.com/\" target=\"_blank\">Google セーフ ブラウジング</a>）。</p><p><b>セキュリティ ポスチャーの変革に向けて</b></p><p>セキュリティ戦略には盲点を残すべきではありません。ウェブ防御に関するさまざまな選択肢について詳しくは、Google のデジタル ペーパー「<a href=\"https://chromeenterprise.google/engage/strengthening-secops-with-browser-telemetry/\" target=\"_blank\">Securing the Browser: How telemetry brings web defense into the next frontier</a>」（ブラウザのセキュリティ確保: テレメトリーがウェブ防御を次のフロンティアに導く方法）をご覧ください。</p><p>このリソースでは、最新の防御のフレームワークを概説し、敵対者の戦術、感染経路、脅威の傾向について詳しく説明しています。このデジタルペーパーで、組織のブラウザ セキュリティ戦略を評価しましょう。</p><p><b><i>-</i></b> <i>Chrome Enterprise、シニア プロダクト マネージャー、</i><b><i>Niamh Cunningham</i></b></p></div>"
