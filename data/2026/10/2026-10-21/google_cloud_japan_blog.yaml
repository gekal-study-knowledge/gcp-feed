  "5c89b6accc39aac0ec312b780fdfed9e":
    "id": "5c89b6accc39aac0ec312b780fdfed9e"
    "title": "Google Cloud で Gemini 4 Argon が利用可能に：ビジネスの最も困難な課題解決をサポート"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud/"
    "published": "2026-10-21 11:00:00"
    "fetched": "2026-10-21 16:05:11"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 14 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">先週、Google は Gemini Enterprise が進化し、業務をさらに簡単に完了できるようになったことを発表しました。また、あらゆる業務に対応する新しい万能エージェント、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェント</strong></a><span style=\"vertical-align: baseline;\">も紹介しました。常時稼働しており、いつでも質問に答えてくれます。コードの生成、より長く複雑なタスクの処理、業務を遂行するために必要なあらゆる作業を、すべて 1 つのプロンプト ボックスから実行できます。そして、そのすべてをモデル インテリジェンスが支えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">新たな働き方を実現するため、Google は新しいフロンティア モデルである </span><a href=\"https://deepmind.google/models/gemini/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\"> を Google Cloud で提供開始します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon は、高度な思考力と正確性を併せ持つようにトレーニングされています。そのため、複数のステップからなる長いタスクでも一貫してコンテキストを維持でき、専門的な知識を活用しながら処理を進めることができます。チームが複雑なソフトウェア ビルドを実行する場合も、財務や法務の詳細な作業を処理する場合も、</span><a href=\"https://cloud.google.com/security/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> のようなサイバーセキュリティ ツールを導入する場合も、Argon はチームが最初から最後まで集中して作業を進められるよう支援します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Logo Wall Argon V3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Gemini_4_Logo_Wall_3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Gemini 4 Argon をご利用中のお客様とパートナー</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Argon がビジネスのあり方を変える 4 つの方法</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">1. 面倒な作業を委任可能</strong></h4>\n<p><span style=\"vertical-align: baseline;\">皆様のチームでも、質問への回答やコンテンツの下書きに Gemini for Business をすでにご活用いただいているかと思います。Argon を使用すると、これまで数時間から数日かかっていた、複数のステップからなる複雑な作業を任せ、すぐに使える完成した成果物を受け取ることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon は、テキスト、表、グラフ、画像が混在する長文ドキュメントを読み取り、それらのソースを確実な根拠とした 1 つの明確なアウトプットを生成します。多数のソースから得られた知見を 1 つの構造化された回答にまとめ、経時的なデータ分析を行い、法務、財務、経営に関するより完成度の高い文書を作成できます。時間のかかるタスクであっても、処理が完了するまで途切れることなく実行し続けます。Argon は、システムの権限や制約を遵守し、ネガティブな検出結果も隠さず報告し、元に戻せない操作を行う前には必ずユーザーの確認を挟むようトレーニングされています。また、目的のデータが見つからなかった場合やタスクを完了できなかった場合も、その旨を明確に通知します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon をテストしたお客様からは、膨大な非構造化データをまとまりのあるアウトプットに変換する能力が非常に優れている、という声が寄せられています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「ソフトウェア開発がよりエージェント指向になるにつれ、開発ライフサイクルのすべての段階で、長時間にわたるマルチステップの作業をサポートできるモデルがチームに必要になります。Gemini 4 Argon は、組織が開発、セキュリティ、運用の領域に AI を導入する際、既存のエンタープライズ ワークフローや統制の枠組みを維持できるよう設計されています。」</span><strong style=\"vertical-align: baseline;\">– GitLab、バイス プレジデント、Stuart Moncada 氏</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">2. ビジネスを推進する重要業務において、正確かつ検証可能な結果を実現</strong></h4>\n<p><span style=\"vertical-align: baseline;\">財務、法務、税務をはじめとする規制対象の業務では、計算やデータ抽出における高い正確性、再現性、そして検証可能性が求められます。</span></p>\n<p><span style=\"vertical-align: baseline;\">財務定量業務において、Argon は複数ステップにわたる元帳照合、スプレッドシートの数式設定、差異分析の自動化をサポートします。定量モデル全体で、計算の整合性、引用の忠実度、数式の精度を高く保ちます。数字がそれを証明しています。Argon は、財務、コーディング、法務、税務の業務における経済効果を測定する</span><a href=\"https://www.vals.ai/benchmarks/vals_index\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Vals Index</span></a><span style=\"vertical-align: baseline;\"> で首位を獲得しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">法務調査において、Argon は法務チームによる判例法や規制当局への提出書類の確認をサポートし、検証済みの引用や重要な判例の抽出を支援します。法務調査や文書作成に関する Harvey の Legal Agent Benchmark などの分野固有の評価でトップに立っており、チームが複雑な判例を検討する際にも、正確な引用とともに的確で直接的な回答を提供します</span></p>\n<p><span style=\"vertical-align: baseline;\">「Gemini 4 Argon は、Google がエージェントによる法的推論においてどれほど進歩したかを示しています。当社の法務エージェント評価では、特に企業の M&amp;A、データ プライバシーとサイバーセキュリティ、EC / VC において、Gemini 3.1 Pro と比較して大幅な向上が見られました。長いドキュメントの分析でも精度が維持され、詳細な取引事項を扱う弁護士にとって心強い結果となりました。」</span><strong style=\"vertical-align: baseline;\">– Harvey、応用研究責任者、Niko Grupen 氏</strong></p>\n<p><span style=\"vertical-align: baseline;\">「当社は Google と NowAI-Bench で連携し、Gemini 4 を主要なエンタープライズ業務向けに最適化できるよう協力しました。早期アクセスでは、Gemini 3.8 Flash と比較してタスクの成功率が約 20% 向上し、人事とカスタマー サービスで特に大きな成果を上げました。ServiceNow AI Platform では、当社の L1 サービスデスク AI スペシャリストが、ガバナンスの効いた安全な環境のもとで Google の最先端インテリジェンスを活用し、定型タスクを完全自律型の業務へと変革します。」</span><strong style=\"vertical-align: baseline;\">- ServiceNow、AI プロダクト担当シニア バイス プレジデント、Nenshad Bardoliwalla 氏</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">3. プロダクトの構築とリリースを迅速化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Argon は、複数のステップからなる複雑なプロジェクトを、最初から最後まで一貫して処理できるよう設計されています。お客様からは、目標を細分化し、進捗状況を追跡し、複数のファイルを同時に更新できるインテリジェンスを求める声が常に寄せられています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Gemini 4 Argon は、3D ゲームからリッチなアニメーションまで、複雑なタスクを確実に処理します。Figma Make では、チームが抱く複数のステップに及ぶ最も野心的なアイデアを、魅力的なプロトタイプとして具現化するのを強力にサポートします。」</span><strong style=\"vertical-align: baseline;\">- Figma、最高デザイン責任者、Loredana Crisan 氏 </strong></p>\n<p><span style=\"vertical-align: baseline;\">Argon がこうした高度な処理をどれほど優れてこなせるか検証するため、Google 自身のツールで実際に活用してみました。Google のオープンソース Agent Development Kit（ADK）の開発チームは、既存のアプリケーションとの完全な互換性を維持しながら、フレームワークのオーバーヘッドを削減し、コードのパフォーマンスを向上させることに取り組みました。Argon は、自動テストのガードレールのもと夜間に自律的に動作し、コードの最適化ポイントを見つけ出しました。この最適化は現在 google/adk-python に反映されており、長時間のセッションにおけるインメモリ セッション準備時間を 40% 短縮し、コールド インポートを 21% 高速化させています。詳細については、</span><a href=\"https://developers.googleblog.com/optimizing-a-200000-line-python-codebase-overnight-with-gemini-4-argon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">のエンジニアリング詳細解説をご覧ください。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google 全体で、Google Antigravity 上で Argon を活用しているエンジニアリング チームは、エージェントによるコード提出量を 35% 以上増加させつつ、コードのロールバックをほぼ 3 分の 1 削減しました。Chrome チームは Argon を使用して、Chromium の 4,000 万行のコードベースにある数百ものファイルにわたるアーキテクチャ リファクタリングを行い、数か月かかる作業をわずか数週間で完遂しました。Argon は空間推論、数学的精度、ビジュアル コーディングが向上しているため、アイデアから実用的なプロトタイプをより迅速に作成できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">より高度なアルゴリズムについては、コード最適化および検出エージェントである</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/alphaevolve-is-available-for-everyone\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve</span></a><span style=\"vertical-align: baseline;\"> が</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/alphaevolve/reference-guide/api-reference#supported-models\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Argon</span></a><span style=\"vertical-align: baseline;\"> を使用して、工場のスケジューリング、ロジスティクス、ゲームコードの高速化、チップ レイアウトなどの実際のエンタープライズ ワークロードや、複雑な数学的ベンチマークなどで、大幅なパフォーマンス向上を実現しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon を最大限に活用する方法については、デベロッパー</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/guides/gemini-4-argon\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ガイド</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">4. コードとビジネスの防御を強化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Argon には、ペネトレーション テストや悪用などの攻撃的なタスクをブロックするサイバー攻撃緩和策が備わっていますが、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> を使用して脆弱性を発見および修正したり、独自のセキュリティ ハーネスで Argon を使用したりすることで、その防御機能を最大限に活用できます。CWE-Bench v1 では、セキュリティの脆弱性の修復において最高スコアの 68% を獲得し、1 位タイとなっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「当社では、MarketingX に Gemini 4 Argon を統合して、コードベースのセキュリティ監査を自動化しています。当社の評価では、検証された指摘事項において、モデルは最優先で対応すべき脆弱性を 100% 特定し、架空の脆弱性の誤検知は 0% でした。この精度により、デプロイ前にコードレベルでプロアクティブなセキュリティを確保できます。」</span><strong style=\"vertical-align: baseline;\">- HubX、AI ラボ最高 AI 責任者、Yunus Emre 氏</strong></p>\n<p><span style=\"vertical-align: baseline;\">セキュリティとは、自社の環境内で Argon を信頼できることも意味します。Argon は、悪意のある指示やコンテキストを使用してモデルの動作を乗っ取る間接的なプロンプト インジェクションに対して、これまでで最も高い耐性を備えたモデルです。Gray Swan の間接プロンプト インジェクション ベンチマークでトップに立ち、15 回のアダプティブ攻撃の成功率を 0.7% にまで低減しました。これは、悪意のある指示が隠されている可能性のあるメール、ドキュメント、ウェブページを Argon が読み取る場合に重要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、サイバー ガードレールなしの Argon を、信頼できる一部の防御者に提供しています。これにより、サイバーセキュリティ機能の全範囲をテストできます。信頼できる防御者は、</span><a href=\"https://deepmind.google/fairwind-program/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fairwind プログラム</span></a><span style=\"vertical-align: baseline;\">を通じて審査されます。このプログラムは、政府機関、重要インフラ、サイバーセキュリティ パートナーに、高度なモデルへの独占的かつ無制限のアクセスを提供する、対象者限定の取り組みです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">早期アクセス プログラムに参加している企業のお客様やパートナーは、すでに Argon で大きな成果を上げています。</strong></h4></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=opNsprLPCKc\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 4 Argon 実践レポート</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=opNsprLPCKc\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Amplitude、Deloitte、楽天のリーダーが Gemini 4 Argon の成果を共有</span></span></em></sup></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このたび、Gemini 4 Argon がウェブ、デスクトップ、モバイルの</span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for Business</span></a><span style=\"vertical-align: baseline;\"> でご利用いただけるようになりました。企業のデベロッパーやビルダーは、</span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal;mode=prompt?model=gemini-4-argon&amp;region=global\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini プラットフォーム</span></a><span style=\"vertical-align: baseline;\">（モデル ID </span><code style=\"vertical-align: baseline;\">gemini-4-argon</code><span style=\"vertical-align: baseline;\">）、</span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://antigravity.google/blog/gemini-4-argon-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\"> において、API を介して Argon にアクセスできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon は、2026 年 11 月 30 日まで、100 万入力トークンあたり 2 ドル、100 万出力トークンあたり 10 ドルの特別価格で提供されます。キャッシュに保存された入力トークンは 95% 割引となります。2026 年 11 月 30 日以降は、100 万入力トークンあたり 4 ドル、100 万出力トークンあたり 20 ドルの標準価格が適用されます。技術仕様、トークン制限、移行手順の詳細については、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-argon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">モデルカード</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://drive.google.com/file/d/1YQ0xENI0e-jauxPSxTfUoOQ9aXHGsoWh/view\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">デベロッパー ガイド</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><span style=\"vertical-align: baseline;\">サイバー防御者の皆様は、</span><a href=\"https://cloudonair.withgoogle.com/events/summit-amer-security-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY26-Q4-GLOBAL-GLO10000010-onlineeventsession-er-dgcsm-SS-NORAM-249572&amp;utm_content=blog&amp;utm_term=argon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Summit</span></a><span style=\"vertical-align: baseline;\"> にご参加いただくことで、Gemini 4 Argon を使用してマシンスピードの脅威から防御し、修復を自動化する方法を学ぶことができます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Cloud、Gemini、プロダクト マネジメント担当バイス プレジデント、</span><strong><span style=\"font-style: italic; vertical-align: baseline;\">Michael Gerstenhaber</span></strong></p></div>"
"last_updated": "2026-10-21 16:05:11 JST"
