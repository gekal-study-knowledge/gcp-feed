  "8b51e83cabf9a41f052f40aa907cf82b":
    "id": "8b51e83cabf9a41f052f40aa907cf82b"
    "title": "Claude Opus 5.5 and Claude Sonnet 5.5 are now available in Google Antigravity"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/claude-opus-55-and-claude-sonnet-55-available-in-antigravity/"
    "published": "2026-10-21 01:00:00"
    "fetched": "2026-10-21 07:07:29"
    "summary": "<div class=\"block-paragraph\"><p>Whether you are iterating on a quick bug fix or planning a complex migration, different tasks call for different models.</p><p>In keeping with Google Cloud's commitment to an open ecosystem and to give developers the right model for every job, <b>Claude Opus 5.5 and Claude Sonnet 5.5 are now available in Google Antigravity for Google Cloud customers.</b> Claude Opus 5.5 is built for complex work while Claude Sonnet 5.5 is a faster, lower-cost complement.</p><p>Once enabled by an administrator, developers can select Claude Opus 5.5 and Sonnet 5.5 directly from the model picker. Administrators can also select Google’s Gemini models, including Gemini 3.8 Flash and Gemini 4 Argon. The models apply across Antigravity 2.0, Antigravity CLI and our recently released <a href=\"https://antigravity.google/docs/ide/extensions/\" target=\"_blank\">Antigravity IDE extensions</a> for VS Code, JetBrains IntelliJ, and Visual Studio. This lets you choose the right model for the job, under a unified enterprise billing and security boundary.</p><p>In this post, we’ll share two engineering patterns for building in Antigravity using these models. To view the entire list of models supported in Antigravity across subscriptions, see our documentation <a href=\"https://antigravity.google/docs/models/\" target=\"_blank\">here</a>.</p><h3>Multi-model engineering patterns in Antigravity</h3><p>Having multiple model families available inside the same agent harness unlocks practical multi-model workflows that improve code quality while controlling latency and cost.</p><h3><b>Pattern 1: Cross-model verification (\"LLM-as-a-Judge\") in loop and graph workflows</b></h3><p>When building agentic loops or multi-step graph workflows, using the same model to both write code and review its own output can reinforce model-specific blind spots. Pairing two distinct model families, one as the implementer and another as the validator (judge), provides independent verification before moving to the next stage of a workflow.</p><p>In Antigravity, you can run this pattern either interactively or via automated subagents:</p><ol><li><b>Plan and implement with Model A:</b> Start in planning mode using <code>Claude Opus 5.5</code> or <code>Gemini 4 Argon</code> to design and implement a multi-file change.</li><li><b>Validate with Model B:</b> Before committing or advancing the loop, switch models, or invoke a one-shot <code>/model</code> check in the CLI, to have a different model family critique the implementation against your test suite and requirements.</li></ol><h3><b>Pattern 2: Pairing reasoning models with Flash subagents</b></h3><p>Complex engineering tasks often combine a few high-reasoning decisions with dozens of high-volume, mechanical lookups (searching files, grepping logs, checking lint output, or classifying test failures). Running every lookup on a frontier model can increase both latency and spend.</p><p>Antigravity's Subagent customization system (<code>.agents/agents/*.md</code>) lets you assign specific model tiers (<code>inherit</code>, <code>flash</code>, or <code>pro</code>) to specialized subagents. When your primary session is running a more powerful model.</p><p>Subagents configured with <code>model: inherit</code> use your active session model for deep reasoning subtasks.</p><p>Subagents configured with <code>model: flash</code> offload high-speed search, classification, and triage work to Gemini Flash models.</p><p>For example, you can define a fast log-triage subagent in <code>.agents/agents/test-triager.md</code>:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;---\\r\\nname: test-triager\\r\\ndescription: Runs unit tests, classifies failures, and returns a concise summary of failing assertions.\\r\\nmodel: flash\\r\\ntools:\\r\\n  - read\\r\\n  - edit\\r\\n---\\r\\n\\r\\nRun the requested test targets, classify any failures by root cause (compilation error, assertion failure, or timeout), and return a structured summary to the parent agent.&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f623f6eb1d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>And a cross-model code reviewer subagent in <code>.agents/agents/gemini-judge.md</code>:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;---\\r\\nname:cross-model-judge\\r\\ndescription: Independent LLM-as-a-judge verifier that audits diffs and edge cases using Gemini Pro.\\r\\nmodel: pro\\r\\ntools:\\r\\n  - read\\r\\n---\\r\\n\\r\\nReview the current workspace diff against the user&#x27;s requirements. Check for regressions, missing edge-case tests, and security issues. Output a pass/fail verdict with specific line references.&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f623f6eb990&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>With this setup, you can delegate rapid test-and-classify loops to <code>test-triager</code> and trigger <code>cross-model-judge</code> to validate the final diff, combining the strengths of each model in a single workflow.</p><h3>Getting started</h3><p>Claude Opus 5.5 and Claude Sonnet 5.5 are available now for Google Cloud customers using Antigravity:</p><ol><li><b>Administrators (Gemini for business):</b> Third-party partner models do not draw from the pooled Gemini Enterprise Standard and Plus edition monthly token quota. Instead, usage is billed on a pay-as-you-go basis through your existing Google Cloud Billing account, so overages must be enabled. Visit “Gemini Enterprise” &gt; “Settings” &gt; “AI developer tools” in the Google Cloud Console to configure overage billing, spend limits and authorize partner models for your organization. See <a href=\"https://cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings\">Configure AI developer tools settings</a> for step-by-step instructions.</li><li><b>Administrators (Gemini platform):</b> You can also enable partner models if you are using Antigravity through the API in Gemini platform. Enable Claude models in Model Garden and complete the standard Anthropic terms.</li><li><b>Developers:</b> Update to the latest version of Antigravity 2.0, the Antigravity CLI, or the Antigravity IDE extensions, and open the model picker (or run <code>/model</code>) to select the right model for your task. To learn more about enterprise governance and multi-agent configuration, visit the <a href=\"https://antigravity.google/docs/enterprise/\" target=\"_blank\">Google Antigravity Enterprise documentation</a>. You can switch the active model between turns in the same conversation thread while preserving workspace state, open artifacts, and terminal context.</li></ol><p>Note: Lightweight first-party Gemini models continue to run in the background to handle high-frequency client-side coordination, such as context management and summaries. They consume first-party tokens and can incur charges.</p></div>"
  "17270513e395cffcced95e35eda677fd":
    "id": "17270513e395cffcced95e35eda677fd"
    "title": "Google Public Sector increases partner investments for frontline adoption"
    "link": "https://cloud.google.com/blog/topics/public-sector/google-public-sector-increases-partner-investments-for-frontline-adoption/"
    "published": "2026-10-21 22:00:00"
    "fetched": "2026-10-21 22:26:57"
    "summary": "<div class=\"block-paragraph\"><p>Partnership is at the core of Google Public Sector’s mission to empower government agencies and education institutions with transformative, mission-aligned solutions. We recognize that we can only scale our impact through a thriving, highly capable partner community.</p><p>At today’s <a href=\"https://events.govexec.com/google-public-sector-partner-connect/\" target=\"_blank\"><b>Partner Connect at Google Public Sector Summit</b></a>, we are introducing enhanced partner initiatives focused on fostering deeper collaboration, supercharging frontline adoption, and expanding mission delivery capabilities across our valued partner network. These updates are centered around four pillars:</p><ul><li><b>Enhanced partner incentives:</b> We will reward partners who do the heavy lifting of pre-sales technical depth, solution design, and proof-of-concept execution through newly announced incentives and discounts.</li><li><b>Partner-Led User Success Program:</b> We will support sustained frontline Gemini adoption led by our partners through three targeted investments.<ul><li><b><i>Training and enablement:</i></b> Launching a new <b>Forward Deployed Engineer (FDE) academy,</b> a rigorous bootcamp designed to build elite, Google-trained FDEs inside partner’s practices.</li><li><b><i>Pre-sales acceleration:</i></b> Increasing our Pre-Sales <b>Deal Acceleration Funds</b> to directly co-invest in partner-led customer workshops and proofs of concept.</li><li><b><i>Post-sales adoption:</i></b> Expanding our investment pool to <b>$45M in dedicated deployment and adoption funding</b>, designed to pay for partner professional services to deploy Gemini across the <b>entirety of the U.S. public sector</b> for the first time—ensuring day-one operational readiness.</li></ul></li><li><b>Backing builders and powering alliances:</b> We know specialized missions require purpose-built software and scalable infrastructure.<ul><li>We are launching a new <b>ISV Agent Factory</b> to accelerate the development of specialized public sector agents.</li><li>This is on top of our <b>ISV ATO Accelerator</b> which provides individual ISVs <b>up to $1M</b> in funding from Google to offset the cost of GovRAMP, FedRAMP, and DoD Impact Level accreditations.</li></ul></li><li><b>Market-accelerating alliances:</b> We are announcing a new Strategic Alliance with <b>SHI</b> to activate 400+ sellers across state, local, and education markets. At the federal level, <b>Accenture Federal Services</b> is announcing new <a href=\"https://newsroom.accenture.com/news/2026/accenture-federal-services-and-google-public-sector-establish-gemini-launchpads-to-power-purpose-built-agents-across-federal-missions\" target=\"_blank\"><b>Gemini Launchpads</b></a> to help agencies move from agentic experimentation to mission execution, faster.</li></ul><p>In the public sector, technology is never just about deployment; it is about the mission. Together with our partners, we are ensuring that our joint public sector customers have the mission-ready capabilities they need to lead on the front lines.</p><p>To operationalize these announcements, partner organizations are encouraged to engage in the programs below and access upcoming trainings:</p><ul><li><a href=\"https://carahevents.carahsoft.com/Event/Details/828116-google\" target=\"_blank\">Google Public Sector Partner Enablement Series</a></li><li><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSeFt20QpfK4q5m349en53cuGZYdN7_UnE4WxP1KYJ2FwUx8zw/viewform\" target=\"_blank\">Google Public Sector Partner Specialty Badge Program</a></li><li><a href=\"https://docs.google.com/forms/d/e/1FAIpQLScGOqvXQ6vHXewQWfA4tYxLSfaIihu9X-PvMdh5sG7kmRbYrQ/viewform\" target=\"_blank\">ISV ATO Accelerator</a></li></ul></div>"
  "35eee795094d69183fbd9b57f58432fe":
    "id": "35eee795094d69183fbd9b57f58432fe"
    "title": "Google Cloud expands model choice and flexibility, bringing OpenAI models to customers"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-brings-openai-models-to-customers/"
    "published": "2026-10-21 21:00:00"
    "fetched": "2026-10-21 22:26:57"
    "summary": "<div class=\"block-paragraph\"><p>Google Cloud has always been defined by choice, enterprise-grade governance, and market-leading price-performance. Key to the foundation of openness and choice is giving customers flexibility to run agentic workloads across their choice of models and infrastructure to achieve the right balance of cost, capability, and performance. Today, we are expanding that foundation by launching OpenAI models in Google Cloud’s model garden.</p><p>Google Cloud is now the only hyperscale cloud provider offering access to all three leading closed source LLMs, alongside more than 200 first-party, third-party, and open models on a unified enterprise AI platform.</p><h3><b>The right model for every workload</b></h3><p>Modern enterprise AI requires matching each workload to the right model rather than relying on a single model for every task. By adding OpenAI’s newest models to model garden, we are giving teams options across the full spectrum of enterprise workloads. For OpenAI models:</p><ul><li><b>GPT-6 Astra</b>: Designed for demanding work across coding, computer use, professional tasks, and scientific research.</li><li><b>GPT-6.1 Sol</b>: Near-Astra intelligence at lower cost across agentic coding, computer use, and professional work.</li><li><b>GPT-6 Luna</b>: A fast, cost-efficient model for everyday work at scale.</li></ul><p>Using the platform, customers can dynamically select and swap the optimal model for any use case based on performance, latency, and cost efficiency without architectural lock-in or separate vendor contracts. Developers gain the freedom to build with hundreds of choices in model garden. Because OpenAI models are transacted directly through Google Cloud Marketplace, all usage appears on a single Google Cloud invoice, draws down existing cloud commitments, and counts toward <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud?e=48754805\">Flexible Savings Plans (FSP)</a> across model providers.</p><h3><b>Built-in data governance and enterprise security</b></h3><p>Scaling generative AI should never require compromising on compliance or security. Built from the ground up for enterprise governance, the <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\">Gemini platform</a> is trusted by leading global organizations today. We ensure that running any third-party or OpenAI workload meets the most rigorous enterprise standards:</p><ul><li><b>Strict data perimeters</b>: Customer prompts, context, and outputs remain entirely within your designated data perimeter and are never used to train foundation models, with Zero Data Retention (ZDR) options available coming soon.</li><li><b>Isolated access boundaries</b>: OpenAI models run on dedicated Google Cloud infrastructure with Confidential Compute coming soon. All queries are routed through hardened, isolated gateways, ensuring data transit remains strictly within Google Cloud's secure environment and third-party model providers have no unauthorized access to your cloud environment.</li><li><b>Unified auditing and identity</b>: Every agent and model interaction operates under an authenticated identity, giving IT administrators end-to-end visibility, VPC Service Controls protection, and unified audit logging across their entire enterprise footprint.</li></ul><h3><b>Getting started</b></h3><p>OpenAI’s GPT-6 Astra, GPT-6.1 Sol, and GPT-6 Luna models are rolling out now in private preview to select enterprise customers in Google Cloud’s model garden, with more coming soon. Starting today, customers can build with these models through our APIs and connect their local Codex CLI and Desktop workflows directly to our Gemini platform for inference. Please use<a href=\"https://cloud.google.com/resources/interest/openai-models\"> this form</a> to express interest.</p><p>Coming soon, OpenAI models will be available in Google Cloud’s Gemini for business and Google Antigravity, providing enterprise customers and developers with model choice flexibility and the best model for each task.</p></div>"
  "0bb34b30fd18638e833c054fe9b5ad49":
    "id": "0bb34b30fd18638e833c054fe9b5ad49"
    "title": "Hardware-backed security at global scale: Confidential G4 with NVIDIA Blackwell is GA"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/confidential-g4-gpus-are-ga/"
    "published": "2026-10-21 20:30:00"
    "fetched": "2026-10-21 22:26:57"
    "summary": "<div class=\"block-paragraph\"><p>Bringing autonomous agents into production means processing sensitive data and valuable intellectual property in real time. Protecting proprietary model weights, user prompts, and generated outputs requires security that safeguards data while it is actively being computed.</p><p>As part of our efforts to enable your enterprise securely, today we are announcing that Confidential Computing on Google Cloud’s G4 instances enabled by NVIDIA RTX PRO 6000 Blackwell Server edition GPUs is now generally available. This release integrates NVIDIA Confidential Computing directly into <a href=\"https://cloud.google.com/ai-infrastructure\">Google Cloud's AI Hypercomputer</a>, delivering the dynamic performance needed to scale without compromising privacy.</p><p>When we announced <a href=\"https://cloud.google.com/blog/products/identity-security/verifiable-trust-in-the-ai-era-whats-new-in-confidential-computing?e=48754805\">Confidential G4 in preview</a> earlier this year, we talked about its global footprint and scale. Today, these instances are generally available across <a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/supported-configurations#g4-machine-type\">36 zones</a>, using <a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#consumption_option_availability_by_machine_type\">multiple consumption models</a>, on <a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\">Compute Engine VMs</a> and <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes\">GKE nodes</a>.</p><p>In addition, support for <a href=\"https://docs.cloud.google.com/confidential-computing/confidential-space/docs/confidential-space-overview\">Confidential Space</a> enabling secure multi-party data sharing is rolling out to general availability in the coming weeks.</p><h3><b>Protecting sensitive data and models at low latency</b></h3><p>Protecting data in use shouldn't mean sacrificing GPU throughput or operational agility. By combining non-exportable hardware keys, verifiable remote attestation, and transparent memory encryption, Confidential G4 helps organizations maximize their investments in agentic and inference workloads. Enterprises can keep costs low while meeting strict regulatory and compliance requirements.</p></div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“As organizations deploy AI across increasingly complex cloud, on-premises, and agentic environments, protecting sensitive data is critical. Enterprises must also ensure that AI systems operate securely and consistently with their policies. Google Cloud Confidential G4 VMs powered by NVIDIA RTX PRO 6000 Blackwell GPUs provide a powerful foundation for privacy-preserving AI and AI operations. Confidential Core AI builds on Google Cloud to transform enterprise principles, policies, and operating requirements into real-time safeguards that monitor and govern AI agents, models, data, and tools. Together, these capabilities enable organizations to scale trusted AI on Google Cloud while maintaining control, confidentiality, and accountability.”</span><span style=\"vertical-align: baseline;\"> <strong>- Taher Behbehani, Founder and CEO, Confidential Core AI</strong></span></p>\n<p><span style=\"vertical-align: baseline;\">Additional benefits for enterprise AI workloads include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">End-to-end confidentiality and isolation: </strong><span style=\"vertical-align: baseline;\">Encrypt data and model parameters in hardware-enforced execution environments to shield intellectual property and customer inputs from host system administrators, hypervisors, and access by cloud providers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verifiable cryptographic trust: </strong><span style=\"vertical-align: baseline;\">Use hardware-rooted remote attestation to verify code, platform configuration, and environment integrity before releasing sensitive datasets and running workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No code refactoring: </strong><span style=\"vertical-align: baseline;\">Deploy models out of the box using standard Ubuntu OS images, NVIDIA drivers, and NVIDIA CUDA-X libraries without application changes or custom builds.  </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For Polaris Cloud, this ease of deployment was transformational. </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Polaris builds workspaces for AI agents, and our customers need to know where an agent's work actually ran and that it was cryptographically isolated along the way. Google Cloud Confidential G4 has been a game changer for that. We get hardware-backed provenance from the NVIDIA RTX PRO 6000 Blackwell GPU, which we bind into the receipt customers get back with their results. Virtually nothing else changed: same G4 image, same NVIDIA driver, same container runtime, one flag at launch, same performance. Overnight it upgraded our customer promise from 'we run your agent' to 'every workload you run with us is verifiable.”</span><span style=\"vertical-align: baseline;\"> </span><strong><span style=\"vertical-align: baseline;\">- Fred Esere, Founder and CEO, Polaris Cloud</span></strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-party data collaboration: </strong><span style=\"vertical-align: baseline;\">Run collaborative analytics and joint model training securely using Confidential Space. Multiple parties can combine sensitive datasets without revealing underlying private data to each other.</span></p>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Enterprises need to put their most valuable data to work with AI while protecting it during processing. NVIDIA Confidential Computing brings hardware-backed protection to GPU-accelerated workloads, helping safeguard sensitive data and proprietary models while in use. Together with Google Cloud, we’re bringing NVIDIA Blackwell performance and these security capabilities to Confidential G4 VMs so organizations can scale production AI with high performance and verifiable protection.” </span><strong><span style=\"vertical-align: baseline;\">- Dave Salvator, Director of Accelerated Computing Products, NVIDIA</span></strong></p></div>\n<div class=\"block-paragraph\"><h3><b>Testing performance</b></h3><p>To understand the operational impact of memory encryption, we analyzed Confidential G4 instances against standard, non-confidential G4 instances on the g4-standard-48 machine shape. Our testing focused on widely adopted open-weight models that customers frequently deploy on single-GPU instances for their own inference pipelines.</p></div>\n<div class=\"block-paragraph\"><p>Benchmarking across popular models including Llama 3, Llama 3.3, Resnet-50, and SDXL shows that <b>Confidential G4 delivers performance on par with standard G4 instances for AI inference workloads, with less than 3.5% degradation in throughput</b> (measured in tokens or images per second).</p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Note:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Performance results are based on specific testing conditions and configurations. Individual workload performance may vary based on system setup, hardware choice, and software environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our analysis can help you move fast while protecting sensitive data and meeting compliance requirements — a trade-off that real-world deployments are already validating.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">”</span>We benchmarked Google Cloud's Confidential G4 against a standard G4 running identical software on our workloads</span><span style=\"vertical-align: baseline;\">.</span><span style=\"font-style: italic; vertical-align: baseline;\"> We found that for a modest 5.2% increase in end-to-end latency, we get a hardware-level assurance that ensures unauthorized users outside our users' attested environment cannot eavesdrop on their conversations. We'd make that trade every time; our users get the convenience of the cloud with the privacy of on-premises.<span style=\"font-style: italic; vertical-align: baseline;\">” </span></span><strong><span style=\"vertical-align: baseline;\">- Andy Qin, CEO, <a href=\"https://vertebrae.ai/\" rel=\"noopener\" target=\"_blank\">Vertebrae</a></span></strong></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started with Confidential G4s</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With Confidential G4, improving enterprise security during model execution and agentic workloads doesn't require sacrificing performance, flexibility, or operational simplicity. By providing verifiable trust and robust hardware isolation with near-zero throughput degradation, organizations can securely deploy high-value models and protect critical data assets at cloud scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">Get started today by following the </span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential VM with GPU documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "4753f96f881d2c96810d8a3323af7604":
    "id": "4753f96f881d2c96810d8a3323af7604"
    "title": "Google Cloud and NVIDIA expand co-engineering collaboration to scale infrastructure for the agentic era"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/google-cloud-infrastructure-at-nvidia-gtc-berlin-2026/"
    "published": "2026-10-21 20:30:00"
    "fetched": "2026-10-21 22:26:57"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As enterprises transition to continuous, multi-step agentic workflows, traditional infrastructure is hitting its limits. But raw performance is only part of the equation. To truly scale agentic AI, enterprises also need the flexibility to run the right models for the right tasks, alongside the data and operational sovereignty required to maintain verifiable control over both their sensitive intellectual property and the underlying infrastructure.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today at NVIDIA GTC Berlin 2026, we are announcing new advancements across the stack to deliver this foundation: minimizing bottlenecks, expanding ecosystem choice, and introducing new sovereign AI and Confidential Computing capabilities to protect your most sensitive workloads with hardware-enforced security.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Architecting for the agentic era</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To help you train, serve, and operate models at scale, </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud’s AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> is built on compute, storage, networking, and software that we co-designed as a single system. Today, in collaboration with NVIDIA, we are announcing new updates to this agent-native infrastructure:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Accelerated computing with A5X instances based on NVIDIA Vera Rubin platform</strong><span style=\"vertical-align: baseline;\">: These bare-metal GPU-accelerated instances feature the latest NVIDIA Vera Rubin NVL72 platform to deliver performance at scale. With general availability, coming next month, we are also expanding our infrastructure footprint to support EMEA data residency and sovereignty requirements with availability in new local regions. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale-out A5X networking with Virgo Network:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/networking/introducing-virgo-megascale-data-center-fabric?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Virgo Network</span></a><span style=\"vertical-align: baseline;\"> supports a non-blocking intra- and inter-building scale-out fabric via mesh topology. This new capability will enable extreme horizontal scaling, allowing clusters to expand to 80,000 Rubin GPUs within a single site and up to 960,000 Rubin GPUs across multi-site deployments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Storage with Managed Lustre and NVIDIA GPUDirect Storage:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre </span></a><span style=\"vertical-align: baseline;\">will support NVIDIA GPUDirect Storage on A5X instances, giving training and inference data a direct RDMA path from the parallel file system into GPU memory, bypassing the CPU and system memory. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Long-context memory with KV Caching:</strong><span style=\"vertical-align: baseline;\"> A5X instances will also support advanced KV-caching capabilities designed to scale context memory beyond GPU high-bandwidth memory (HBM) for long-context and multi-turn agentic workloads. This high-speed caching layer will offload and reuse context across storage tiers, reducing redundant computation, lowering time-to-first-token, and improving inference goodput per dollar.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Workload orchestration with A5X instances on Google Kubernetes Engine (GKE):</strong><span style=\"vertical-align: baseline;\"> GKE brings a suite of features for distributed AI workloads, such as </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/allocate-network-resources-dra?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Managed DRANET</span></a><span style=\"vertical-align: baseline;\">, which</span><span style=\"vertical-align: baseline;\"> simplifies RDMA management by making network interface cards first-class native Kubernetes resources; and </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/schedule-gke-workloads-tas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kueue</span></a><span style=\"vertical-align: baseline;\">, which</span><span style=\"vertical-align: baseline;\"> boosts performance of distributed workloads through topology-aware scheduling and resource management. This makes GKE and A5X instances a powerful combination for agentic workload orchestration. </span></p>\n</li>\n</ul>\n<p> </p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=jSsyHFW3uOs\">\n\n      \n        <img alt=\"Google Cloud A5X instances: Powering next-gen AI with NVIDIA Vera Rubin platform\" src=\"https://img.youtube.com/vi/jSsyHFW3uOs/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=jSsyHFW3uOs\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“The true promise of agentic AI isn’t just speed, it’s freeing up human creativity from the friction of modern production pipelines. With Google Cloud’s A5X instances </span><span style=\"font-style: italic; vertical-align: baseline;\">accelerated</span><span style=\"font-style: italic; vertical-align: baseline;\"> by NVIDIA Vera Rubin NVL72, our WPP Creative and Production teams can direct intelligent agents that perform frame-accurate quality checks and adapt brand assets seamlessly. Google Cloud gives us the reliability, scale and sovereign security required to meet our clients' most ambitious creative demands.”</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Stephan Pretorius, Chief Technology Officer, WPP</strong></p></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Expanding open models and ecosystem innovation</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Agentic workflows rarely rely on a single model. They route tasks to the most efficient model for the job. Your infrastructure should expand your options rather than restrict your roadmap. With Google Cloud, you can deploy infrastructure on your choice of software and NVIDIA AI infrastructure across multicloud, hybrid, and highly regulated environments. Today, we announced several updates to give you the freedom to build and adapt quickly:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Open models: </strong><span style=\"vertical-align: baseline;\">We are adding support for models like Gemma, Mistral, NVIDIA Nemotron, and others to our </span><a href=\"https://cloud.google.com/sovereign-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sovereign Cloud portfolio</span></a><span style=\"vertical-align: baseline;\">. This allows you to run and govern open-weight models, while retaining full custody of model weights and runtimes, avoiding lock-in while maintaining high-performance acceleration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NVIDIA Cosmos 3 and NVIDIA Nemotron 3.5 SuperVL with NVIDIA NeMo now available on Gemini</strong><span style=\"vertical-align: baseline;\">: You can now customize the new NVIDIA Nemotron 3.5 SuperVL model with </span><strong style=\"vertical-align: baseline;\">Managed Training Clusters</strong><span style=\"vertical-align: baseline;\">. </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/training-clusters/get-started\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Use an MTC-optimized training recipe</span></a><span style=\"vertical-align: baseline;\"> to jumpstart your Nemotron post-training work with NVIDIA NeMo RL and NVIDIA NeMo Gym on Google Cloud. With NVIDIA Cosmos 3, you can generate virtual worlds where robots and autonomous vehicles can try, fail and improve before real-world deployment, supporting simulation-to-reality workflows.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Securing deployment with Sovereign AI and Confidential Computing</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As agents take on more autonomous, mission-critical tasks, the data they process becomes increasingly sensitive. Organizations deploying these advanced workloads require hardware-enforced protection and operational control that don’t sacrifice innovation. Whether safeguarding intellectual property during model training in the cloud or executing mission-critical workloads in fully air-gapped environments, Google Cloud and NVIDIA help provide verifiable security and local custody.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are announcing new Sovereign AI capabilities for on-premises environments, alongside advancements in Confidential Computing for the public cloud:</span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">Sovereign AI on-premises with Google Distributed Cloud</span></h4>\n<p><span style=\"vertical-align: baseline;\">For mission-critical workloads that must remain or strictly isolated from the internet, </span><a href=\"https://cloud.google.com/distributed-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Distributed Cloud</span></a><span style=\"vertical-align: baseline;\"> (GDC) brings a managed cloud stack directly to your data center or edge facility. To advance sovereign AI initiatives, we are delivering new compute accelerators, multimodal models, and turnkey search capabilities across GDC air-gapped deployments:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NVIDIA Blackwell Ultra GPUs on GDC:</strong><span style=\"vertical-align: baseline;\"> Following our preview announced earlier this year, the latest NVIDIA HGX B300 systems are now generally available (GA) on GDC. This brings industry-leading compute density and energy efficiency on-premises, providing the high-throughput platform foundation that demanding local inference workloads require.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Flash models on GDC:</strong><span style=\"vertical-align: baseline;\"> We are expanding our sovereign model catalog with Gemini 3.5 Flash on GDC, accelerated by NVIDIA HGX B300. Organizations can now execute rapid, high-throughput multimodal reasoning, spanning text, audio, video, and imagery, entirely inside their air-gapped perimeter.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise search capabilities on GDC:</strong><span style=\"vertical-align: baseline;\"> Available in preview, </span><a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our enterprise search capabilities with Gemini on GDC air-gapped</span></a><span style=\"vertical-align: baseline;\"> delivers an out-of-the-box conversational interface powered by multimodal retrieval-augmented generation (RAG). These capabilities are powered by Gemini on GDC air-gapped with NVIDIA HGX B300. Now, analysts and knowledge workers can instantly query, summarize, and cross-examine proprietary documents, media, and unstructured archives without custom engineering, keeping all indexing, embeddings, and interactions strictly within your sovereign security boundary.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Beyond air-gapped on-premises deployments, you can also run sovereign AI workloads on NVIDIA AI infrastructure using </span><a href=\"https://cloud.google.com/security/products/assured-workloads\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Boundary</span></a><span style=\"vertical-align: baseline;\"> to enforce controls such as regional data residency on our public cloud, or </span><a href=\"https://cloud.google.com/products/dedicated\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Dedicated</span></a><span style=\"vertical-align: baseline;\"> for an isolated cloud run by a local independent partner such as S3NS in France or Thales in Germany.</span></p>\n<h4><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing in the public cloud</span></h4>\n<p><span style=\"vertical-align: baseline;\">As enterprise workloads scale, safeguarding highly sensitive intellectual property during active training, and user context and model IP during real-time inference is critical to maintaining a secure AI architecture. By combining Google Cloud’s advanced security runtimes with NVIDIA Confidential Computing, organizations can deploy high-performance generative AI models inside verified and trusted execution environments without sacrificing processing speed. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">G4 instances with Confidential Compute are GA: </strong><span style=\"vertical-align: baseline;\">We are expanding access to privacy-preserving AI with Confidential G4 instances enabled by NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs. G4 Confidential GPUs, with NVIDIA Confidential Computing provide upgraded security without compromising on performance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Confidential Computing is available today on </span><strong style=\"vertical-align: baseline;\">A4</strong><span style=\"vertical-align: baseline;\"> instances enabled by </span><strong style=\"vertical-align: baseline;\">NVIDIA HGX B200</strong><span style=\"vertical-align: baseline;\"> and Intel TDX</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">We are introducing Confidential Bare Metal to Google Cloud, recognizing the value of single-tenant bare-metal performance and isolation for frontier model AI serving. Our innovation leads to </span><strong style=\"vertical-align: baseline;\">A4X Max</strong><span style=\"vertical-align: baseline;\"> instances (enabled by </span><strong style=\"vertical-align: baseline;\">NVIDIA GB300 NVL72</strong><span style=\"vertical-align: baseline;\">) using </span><strong style=\"vertical-align: baseline;\">NVIDIA Confidential Bare Metal</strong><span style=\"vertical-align: baseline;\">. By extending hardware-rooted secure boot and attestation with encrypted DDR and NVLink interconnects, bare-metal AI workloads leverage this trusted execution boundary to protect user prompts and models during inference and training.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">The Google Cloud advantage</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Our co-engineering collaboration with NVIDIA integrates their full-stack accelerated computing platforms directly into </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\">. This gives you the agent-native infrastructure you need to train, serve, and operate models at scale. Today's announcements deliver this unified foundation, combining the NVIDIA Vera Rubin platform and high-throughput networking with expanded support for open models.</span></p>\n<p><span style=\"vertical-align: baseline;\">Together, we also give you verifiable control over your data. With new sovereign AI deployments and confidential computing across NVIDIA infrastructure, you can protect your most sensitive workloads using hardware-enforced security and local data residency.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because we design hardware and software together as a single system, you can run models across different architectures without rewriting code. Your compute cycles stay focused on the workload, so you ship AI products faster.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get started with these new capabilities, please contact your Google Cloud sales representative.</span></p></div>"
