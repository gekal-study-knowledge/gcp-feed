    "summary": "<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>You can use custom organization policies to ensure that all new or updated\nModel Armor <code>Template</code> resources enforce required filters, like\nresponsible AI or prompt injection and jailbreak detection. This feature is\ngenerally available (<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>).\nFor more information, see <a href=\"https://docs.cloud.google.com/model-armor/access-control/custom-constraints\">Use custom organization policies</a>.</p>"
