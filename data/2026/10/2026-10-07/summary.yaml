"overview": |
  この日は 8 件で、エージェント時代のデータベースアーキテクチャと、レイクハウスのカタログ、そして国内イベントの案内が中心でした。分析では、Spanner が Lakehouse runtime catalog を支える仕組みが解説されました。レイクハウスアーキテクチャへ移行する顧客は、互換エンジンをまたいだ共有のデータ資産を作るために Apache Iceberg のような開かれたフォーマットへ標準化しつつあります。レイクハウスの重要な構成要素がカタログで、Apache Iceberg の世界では通常 Iceberg REST Catalog を指します。カタログはテーブルのポインタを保ち、アトミックなコミットを扱い、テーブルの場所についての単一の真実の源として機能します。大企業がレイクハウスへ移行するにつれ、高いスケーラビリティと可用性を備えたマネージドなカタログがアーキテクチャの一部として必要だと気づき始めており、エージェントによってクエリが増えるほどその重要性は増します。エージェントから繰り返し飛んでくる大量の小さなクエリを支えるには、巨大な規模でアトミック性・一貫性・可用性・同時実行性を提供するマネージドなカタログの上に構築する必要がある、という問題意識です。Google Cloud のサーバーレスな Lakehouse runtime catalog は、事実上無限のスケールを持つ常時稼働のデータベースである Spanner を基盤に、開かれた Apache Iceberg REST catalog の仕様を満たす形で作られており、エージェントの時代に必要な高くスケールする可用性の高い土台になります。エージェントのデータアクセスでは、MCP Toolbox Java SDK がバージョン 1.0 に到達しました。世界で最も広く採用されているエンタープライズのエコシステムの 1 つに、型安全なエージェントのオーケストレーションをもたらすリリースです。Java の成熟したアーキテクチャは厳しい要求に応えるために作られており、本番でミッションクリティカルな AI エージェントを安全にスケールさせるために必要な高い同時実行性、厳密なトランザクション整合性、堅牢な状態管理を提供します。背景には、N 種類の AI モデルと M 個のエンタープライズデータソースがあると N × M 本の独自の接続を作って守って保守しなければならない、統合のボトルネックがあります。統合レイヤーが統一されていないために場当たり的なパイプラインの寄せ集めに頼ることになり、エージェント型のアーキテクチャのスケールは早々に持続不能になって、機微なエンタープライズデータベースを深刻なセキュリティ上の脆弱性やばらばらのアクセス制御、膨大な保守の負担にさらします。Model Context Protocol (MCP) は AI オーケステーションにおける「USB Type-C」のような普遍的なインターフェイスとして振る舞い、モデルとデータソースを切り離すことでこの問題を解決します。モデルやデータベースごとに独自の統合コードを書く代わりに、標準化された 1 つのプロトコルに対して書けばよく、MCP に準拠したエージェントはどの MCP 対応システムとも安全にすぐやり取りできます。データベースでは、AlloyDB がエージェント向け PostgreSQL をプレビュー提供しました。ミッションクリティカルな運用データベースは性能の低下が許されませんが、従来のアーキテクチャではわずか数個のエージェントが高密度の推論ループを回すだけで、予測できないクエリのバーストによって簡単に過負荷になります。AlloyDB はサンドボックス化されたデータベースインスタンスを数秒でプロビジョニングしてスケールさせることで突発的なクエリの急増に対応し、ワークロードを完全に分離します。インスタンスはエージェントが終了すると自動でスピンダウンするため、数個でも数百万個でも費用対効果よく動かせます。秒単位で同期された本番の最新データに読み取り専用でアクセスできる数千のサーバーレスなインスタンスへ PostgreSQL をスケールさせる設計で、これらは本番ワークロードが使うプライマリ・スタンバイ・リードレプリカから常時完全に分離されています。各インスタンスは Google のエクサバイト規模の分散ストレージである Colossus を基盤とする統合ストレージ層のリアルタイムデータにアクセスし、1 ミリ秒未満の I/O とテラビット/秒の集約スキャンスループット、秒間 300 万以上のクエリに対応します。完全な AlloyDB PostgreSQL エンジンを備え、すべてのインデックス、SQL の全機能、ベクトル検索・全文検索・空間検索を使えるほか、複雑な ETL を組まずに BigQuery と Spark でレイクハウス分析も行えます。タスクが終わるとすぐにゼロへスケールダウンするため、課金はアクティブな推論ループに対してのみ発生します。静的パスワードに代わる IAM 認証、VPC Service Controls によるトラフィック分離、顧客管理の暗号化と監査も備えます。あわせて、エージェントの時代に求められるデータベースアーキテクチャの考え方も示されました。Exadata はクエリを下部のスケールアウトストレージ層へオフロードし、Azure SQL Hyperscale は共有ブロックサーバーで数十のリードレプリカへスケールアウトし、Aurora はログの適用処理を分散ストレージノードへオフロードしてきましたが、いずれもスケール・レイテンシー・分離という 3 つの特性のうち少なくとも 1 つ、場合によっては 2 つの制約を本質的に抱えています。エージェントのワークロードは動的に生成されて事前に検証できないため、ミッションクリティカルなシステムからの分離が事業継続に不可欠であり、同時に単一のデータベースに対して数秒で 1,000 のコンピュートノードを要求して 1 分以内に終えるような、前例のない弾力的なスケーリングも求められます。Google はそのための原則として、設計レベルの物理的な分離とリアルタイムなデータアクセス、1 ミリ秒未満のベースライン I/O、そして弾力的なスケーリングの 3 つすべてを満たす必要があると述べています。セキュリティでは、Google Cloud のパートナーが Gemini Enterprise を活用した新しいセキュリティエージェントと AI 防御機能を提供し始めたことが紹介されました。企業のサイバー防御は ID・ネットワーク・エンドポイント・データ・クラウド・アプリケーションの各レイヤーにまたがり、しばしば 12 種類以上のプロダクトに分散してそれぞれが独自のコンテキストを持っています。Gemini Enterprise のエコシステムでパートナー製のセキュリティサービスのカタログを拡充し、単一の統合インターフェイスから複数ステップのセキュリティワークフローをオーケストレーションできるようになりました。Acalvio の ShadowPlex はネットワークデコイや ID のハニーアカウント、RAG デコイ、ハニートークンの大規模な展開を手作業の構成なしに自動化し、Britive の Emergency Termination Agent は自然言語の 1 つの依頼で侵害された ID を封じ込め (ID の確認、アクティブな特権セッションの一覧、人間の承認を得た上での全セッションの取り消し、ID の無効化、インシデントチケット用の監査コンテキストの収集)、封じ込めまでの平均時間 (MTTC) を大きく短縮します。Check Point の AI Defense Plane は Google Cloud Agent Gateway と Agent Registry と統合され、AI ワークロードの検出、リスクポスチャーの監視、プロンプトインジェクションやデータ漏洩、エージェントの不正な挙動に対するリアルタイムのガードレールを提供します。リリースノートでは、Apigee hybrid のパッチリリース v1.14.9 が公開されました。JWKS の uriRef を使う VerifyJWT ポリシーが、5 分の JWKS キャッシュ TTL の失効直後の最初のリクエストで ID プロバイダの鍵ローテーション時に steps.jwt.NoMatchingPublicKey を返しうる問題 (キャッシュが失効時に同期的に更新されるようになりました)、Message Processor の送信 HTTP 検証を強化して Kubernetes クラスター内部のホスト名 (*.svc.cluster.local) へのリクエストを遮断することなど、複数の修正が含まれます。国内のイベントでは 2 本の案内が出ました。2026 年 10 月 16 日 (金) に Google 渋谷オフィスとオンラインで開催される AI-Ready Infra & DB Summit '26 は、「AI が使う基盤、AI で作る基盤」を基調講演のテーマに、ロッテホールディングスとマクロミルが登壇し、GovTech 東京・ロッテ・マクロミル・スタメンの 4 社が基盤づくりと移行の実例を紹介します。Gemini と Skills を使ったクラウド移行、AI によるデータベース移行、クラウドネットワークの見える化といった AI 駆動の移行・運用の手法も解説されます。2026 年 10 月 29 日 (木)・30 日 (金) にベルサール渋谷ガーデンとオンラインで開催される Agentic AI Summit '26 Fall は、Day 1 が Gemini Enterprise を中心とした全社展開の実例 (三菱 UFJ 銀行の基調講演、ソニー・日本テレビ・足立区などのブレイクアウト、第 6 回 AI エージェント事例アワードのピッチコンテスト)、Day 2 がエンジニア向けにエージェントの構築・デプロイ・運用と本番運用のアーキテクチャ設計を扱う構成です。
