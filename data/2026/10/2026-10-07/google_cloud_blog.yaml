  "3d2a8163cc2514401a5f4e96b5ef1f1f":
    "id": "3d2a8163cc2514401a5f4e96b5ef1f1f"
    "title": "Managed Apache Iceberg at scale: How Spanner powers Lakehouse runtime catalog"
    "link": "https://cloud.google.com/blog/products/data-analytics/lakehouse-runtime-catalog-powered-by-spanner/"
    "published": "2026-10-07 01:00:00"
    "fetched": "2026-10-07 03:00:24"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As customers modernize to lakehouse architectures, they are standardizing on open formats such as Apache Iceberg to create a shared data estate across compatible engines. This enables you to build AI-native lakehouses that turn data to semantic knowledge, enable proactive action, and operate at an agentic scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">One of the key components of a lakehouse is the catalog, and in the Apache Iceberg environment, that usually means the Iceberg REST Catalog. An Apache Iceberg catalog is responsible for maintaining table pointers, handling atomic commits, and serving as the single source of truth for table locations. But as large enterprise organizations modernize to lakehouses, they have begun to realize that they need a highly scalable and available managed catalog as a part of their lakehouse architecture. This becomes even more important as querying scales with agents. To support a large amount of repeated small queries from agents, you will need to build on top of a managed catalog that provides atomicity, consistency, availability and concurrency at massive scale. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this blog, we explore the challenges a managed catalog faces in modern cloud environments at agent scale, and show you how Google Cloud’s serverless </span><a href=\"https://cloud.google.com/blog/products/data-analytics/biglake-metastore-now-supports-iceberg-rest-catalog?e=a\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse runtime catalog</span></a><span style=\"vertical-align: baseline;\"> can help address them. Powered by </span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, Google Cloud’s always-on database with virtually unlimited scale, and built to meet the open Apache Iceberg REST catalog specification, the Lakehouse runtime catalog is the highly scalable and available foundation you need for the agentic era.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Challenges a managed catalog needs to solve in the Lakehouse</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When speaking with data engineers and infrastructure leads running production analytics at scale in a Lakehouse, the following core pain points consistently emerge and need to be solved by a managed catalog: </span></p>\n<p><strong style=\"vertical-align: baseline;\">Atomic commits and concurrency control:</strong><span style=\"vertical-align: baseline;\"> Iceberg guarantees ACID transactions via optimistic concurrency control (OCC). A managed catalog must implement a bulletproof atomic compare-and-swap (CAS) operation to swap the current metadata pointer.</span></p>\n<p><strong style=\"vertical-align: baseline;\">High availability and operational maintenance:</strong><span style=\"vertical-align: baseline;\"> Because queries fail immediately if the catalog is down, a managed catalog becomes a critical Tier-1 service.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Scaling the database backing the catalog:</strong><span style=\"vertical-align: baseline;\"> Catalog architects typically face a difficult trade-off when choosing a backing database for table metadata and state. Traditional scale-up relational databases provide SQL and ACID transactions, but hit vertical CPU, memory, storage and connection limits under heavy concurrent read/write loads unless manually sharded which incurs a huge operational overhead; while scale-out database systems are either eventually consistent, hard to manage, not enterprise-ready, or all of the above. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Table maintenance coordination:</strong><span style=\"vertical-align: baseline;\"> A catalog alone does not optimize data; you must build and operate ancillary pipelines for compaction, snapshot expiration, manifest rewriting, and orphan file cleanup.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Governance and security:</strong><span style=\"vertical-align: baseline;\"> A catalog acts as the security gatekeeper. The catalog must implement and maintain:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Authentication protocols (e.g., OAuth2 token exchange, IAM federation)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Access control down to namespace and table levels</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Vended storage credentials (e.g., generating short-lived tokens so query engines don't need broad, direct storage credentials)</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Lakehouse runtime catalog</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To solve these challenges, we built the Lakehouse runtime catalog (GA) with support for Iceberg Rest Catalog. The Lakehouse runtime catalog is a fully serverless, highly available, and unified metadata registry designed from the ground up to support modern open table formats like</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Apache Iceberg. By natively implementing the Apache Iceberg REST Catalog specification</span><strong style=\"vertical-align: baseline;\">,</strong><span style=\"vertical-align: baseline;\"> the Lakehouse runtime catalog decouples metadata discovery from compute engines, helping ensure multiple Iceberg-compatible engines can access a shared data estate and enabling you to take your workloads to production sooner. We’ve helped many customers streamline the migration of their managed catalogs. For example, </span><a href=\"https://cloud.google.com/customers/etsy-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Etsy</span></a><span style=\"vertical-align: baseline;\"> migrated its catalog to Lakehouse runtime catalog, joining data in place to accelerate pipeline queries by 60%.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_bmVFk8w.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This approach offers a number of architectural benefits:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Open APIs</strong><span style=\"vertical-align: baseline;\">: Support for Iceberg Rest Catalog enables different teams to use their preferred analytics tools on a single, unified dataset.</span></li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-engine interoperability</strong><span style=\"vertical-align: baseline;\">: Once registered, tables are immediately discoverable and queryable across Google Cloud Managed Service for Apache Spark, BigQuery, and open-source engines via standard REST interfaces. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/data-analytics/the-future-of-data-lakehouse-for-the-agentic-era?e=0\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read/write interoperability</strong></a><strong style=\"vertical-align: baseline;\"> for Iceberg tables: </strong><span style=\"vertical-align: baseline;\">Leverage Iceberg-compatible engines such as BigQuery, Managed Spark to write to Iceberg tables registered in the Lakehouse runtime catalog. Customers can also use Managed Spark to write to Iceberg tables in external catalogs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fully managed Iceberg storage with enterprise-grade features: </strong><span style=\"vertical-align: baseline;\">Use Google's </span><a href=\"https://cloud.google.com/blog/products/data-analytics/unveiling-new-bigquery-capabilities-for-the-agentic-era?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">differentiated infrastructure</span></a><span style=\"vertical-align: baseline;\"> to run analytics with performance on Iceberg tables. This gives you the benefits of open-source flexibility plus performance, scale, governance, and multimodal processing. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero data copy</strong><span style=\"vertical-align: baseline;\">: Table definitions point directly to your existing data in the underlying object store. You do not move, rewrite, or duplicate your underlying data.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Bi-directional catalog federation</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">across clouds:</strong><span style=\"vertical-align: baseline;\"> Access data from </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-databricks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Databricks Unity</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-snowflake\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Snowflake Horizon</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-aws-glue\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS Glue</span></a><span style=\"vertical-align: baseline;\"> with support for vended credentials and OIDC token exchange. This lets you bring Google AI </span><a href=\"https://cloud.google.com/blog/products/data-analytics/introducing-the-borderless-lakehouse?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">directly to your AWS and Azure data</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Secure access using credential vending</strong><span style=\"vertical-align: baseline;\">: The catalog supports multiple authorization mechanisms, letting you choose between </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/credential-vending\"><span style=\"text-decoration: underline; vertical-align: baseline;\">credential vending</span></a><span style=\"vertical-align: baseline;\"> and end-user credentials. This means that you can access tables with modern mechanisms such as credential vending without needing direct access to the files in the underlying object store (Cloud Storage, AWS S3, Azure Blob Storage). </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI-powered context and governance: </strong><span style=\"vertical-align: baseline;\">The Lakehouse runtime catalog integrates directly with </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/products/iam?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud IAM</span></a><span style=\"vertical-align: baseline;\">, allowing you to define trusted context for your agents, and apply table-level security consistently across all compute engines.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Get out-of-the-box search, lineage, and insights for Iceberg tables in the catalog. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Atomic commits and concurrency control, high availability and scalability: </strong><span style=\"vertical-align: baseline;\">Backed by Google’s planet-scale infrastructure and Spanner, you get the high availability, concurrency and scale you need for your metadata to scale with your data. Support for Cloud Storage dual-region and multi-region buckets enables failover use cases. It also provides reduced TCO due to serverless and no-ops environments, and scalability for any workload size.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">What powers the Lakehouse runtime catalog?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Lakehouse runtime catalog is a highly available, concurrent and scalable catalog with strong consistency guarantees because it is built on top of </span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">. Unlike traditional scale-up relational databases that hit vertical single-node ceilings, Spanner combines full relational SQL semantics and multi-table ACID transactions with the horizontal scale-out elasticity for both reads and writes of a NoSQL system. </span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Spanner makes the Lakehouse runtime catalog highly available through Spanner’s </span><a href=\"https://docs.cloud.google.com/spanner/docs/instance-configurations#regional-configurations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">regional configurations</span></a><span style=\"vertical-align: baseline;\"> with up to 99.99% availability. Spanner also delivers out-of-the-box scalability for  Lakehouse runtime catalog: As a horizontally scalable database, Spanner does not require manual sharding and scales compute and storage independently and transparently. Spanner dynamically monitors data volume and query load, splitting and redistributing data ranges across nodes. Compute nodes scale dynamically based on CPU utilization and storage thresholds. Spanner automatically detects split-level overload and moves heavy splits away from overloaded nodes. Spanner also lets Lakehouse runtime catalog users eliminate the </span><a href=\"https://dl.acm.org/doi/abs/10.1145/2491245?__cf_chl_tk=oi5rkZKtX5q2CR93K9mrIHsAp_oqRxwaGqqpqq99v9Y-1790923307-1.0.1.1-pNUQvRr4OBosWiOcfxGuTWTD8I3JW_8V0i5xLuCsErU\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">traditional trade-offs</span></a><span style=\"vertical-align: baseline;\"> between relational consistency and distributed scalability, delivering Lakehouse runtime catalog’s industry-leading </span><a href=\"https://docs.cloud.google.com/spanner/docs/true-time-external-consistency\"><span style=\"text-decoration: underline; vertical-align: baseline;\">consistency guarantees</span></a><span style=\"vertical-align: baseline;\">. Lakehouse transactions are serializable — the order of transactions within the database is the same as the order in which clients observe the transactions to have been committed. </span><span style=\"vertical-align: baseline;\">This foundation allows Lakehouse users to operate at agent-scale. </span> </span></p>\n<p><span style=\"vertical-align: baseline;\">Then, to further power agentic use cases, the Lakehouse runtime catalog integrates directly with Knowledge Catalog to easily discover lakehouse Iceberg tables and provide trusted context to agents. Knowledge Catalog leverages an efficient combination of </span><a href=\"https://docs.cloud.google.com/spanner/docs/full-text-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">full-text search</span></a><span style=\"vertical-align: baseline;\"> and native</span><a href=\"https://docs.cloud.google.com/spanner/docs/vector-search-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">vector search</span></a><span style=\"vertical-align: baseline;\"> provided by Spanner; this approach enables better recall for search retrieval, pairing lexical keyword searches with semantic embeddings in a single query. Because both index types are built on the identical base dataset, they update with strict, transactional ACID consistency alongside base table DML operations. This removes operational overhead such as managing sync pipelines, and external-vector and full-text search systems. In short, the Lakehouse runtime catalog provides faster time-to-market for your agentic use cases.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Combine analytical and operational workloads</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With Google Cloud’s borderless Lakehouse based on Apache Iceberg, you can combine your analytical data with your operational workloads. Use cases span combining data assets from your Lakehouse with OLTP data (from Spanner) for analytics, to low-latency serving applications where your Lakehouse assets are accessible in an operational database such as Spanner, to conversational analytics in first-party and third-party agents. </span></p>\n<p><span style=\"vertical-align: baseline;\">Below, in an example, you can see the Lakehouse runtime catalog with Spanner in action. Here, we combine analytical data for taxi trips in Manhattan (backed by Apache Iceberg) with operational data for taxi zones in Spanner to find the most congested traffic routes. The example also shows that you can also use a Conversational Analytics Agent to access the same data and get second-order insights.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_TvlKrOP.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Find out most congested traffic routes in Manhattan</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Modernize to the borderless Lakehouse</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Modernizing to Google Cloud’s</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/solutions/data-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse</span></a><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">minimizes data silos across analytics engines and agents, unifies multi-engine governance, provides trusted context to your agents and slashes operational TCO. Leveraging the Spanner-based Lakehouse </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-lakehouse-iceberg-rest-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">runtime catalog</span></a><span style=\"vertical-align: baseline;\"> helps prepare your modern cloud environments to operate at agent-scale. To learn more and get started with a free trial, visit the </span></p>\n<p><a href=\"https://cloud.google.com/products/lakehouse?e=a\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse</span></a><span style=\"vertical-align: baseline;\"> web</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">page and learn more about Spanner </span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "5be054e79cf1f6ee80a7a57e396fc2f3":
    "id": "5be054e79cf1f6ee80a7a57e396fc2f3"
    "title": "Announcing MCP Toolbox Java SDK v1.0: Agentic data access for the enterprise"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/announcing-mcp-toolbox-java-sdk-v10-agentic-data-access-for-the-enterprise/"
    "published": "2026-10-07 04:00:00"
    "fetched": "2026-10-07 07:53:17"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: center; font-size: 0.8rem;\"><em><span style=\"vertical-align: baseline;\">Co-authors:</span></em><br /><em><span style=\"vertical-align: baseline;\"><strong>Stenal Jolly</strong>, Strategic Cloud Engineer, Google</span></em><br /><em><span style=\"vertical-align: baseline;\"><strong>Anubhav Dhawan</strong>, Software Engineer, Google</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Following the </span><a href=\"https://medium.com/google-cloud/mcp-toolbox-v1-0-the-open-source-framework-for-secure-agentic-data-access-3c2199546ba8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">landmark announcement</span></a><span style=\"vertical-align: baseline;\"> of MCP Toolbox v1.0, we're thrilled to announce that the <a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java\" rel=\"noopener\" target=\"_blank\">MCP Toolbox Java SDK</a> has officially reached version 1.0.</span></p>\n<p><span style=\"vertical-align: baseline;\">This release brings first-class, type-safe agent orchestration to one of the world's most widely adopted enterprise ecosystems. Java's mature architecture is purpose-built for rigorous demands, providing the high concurrency, strict transactional integrity, and robust state management required to safely scale mission-critical AI agents in production.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we'll tell you about what's new in Java SDK v1.0, show you a real-world example, and help you get started with your own implementation.</span></p>\n<h2><span style=\"vertical-align: baseline;\">MCP: The universal interface</span></h2>\n<p><span style=\"vertical-align: baseline;\">Today, developers face a compounding integration bottleneck: if you have <em>N</em> different AI models and <em>M</em> enterprise data sources, you must build, secure, and maintain <em>N × M</em> bespoke, custom connections. This lack of a unified integration layer forces engineering teams to rely on a fragmented web of ad-hoc pipelines. As a result, scaling an agentic architecture quickly becomes unsustainable, exposing sensitive enterprise databases to severe security vulnerabilities, fragmented access controls, and massive maintenance overhead.</span></p>\n<p><span style=\"vertical-align: baseline;\">Eliminating the fragmented web of custom integrations is the core problem solved by the Model Context Protocol (MCP). Acting as a universal interface—the \"USB Type-C\" for AI orchestration—MCP decouples models from data sources. Instead of writing custom or managed API integration code for every new model or database, developers write to a single, standardized protocol. This approach allows any MCP-compliant agent to securely and immediately interact with any MCP-enabled system. The MCP connection lets developers connect agents to real-world systems without building bespoke integrations for every new model.</span></p>\n<h2><span style=\"vertical-align: baseline;\">What's new in Java SDK v1.0: Built for production workloads</span></h2>\n<p><span style=\"vertical-align: baseline;\">When we announced the </span><a href=\"https://medium.com/google-cloud/announcing-the-mcp-toolbox-java-sdk-2ed3171bbaa0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">public Beta</span></a><span style=\"vertical-align: baseline;\"> for the MCP Toolbox Java SDK, our goal was to bring first-class, type-safe agent orchestration to enterprise Java environments. Since then, we've collaborated with developers and open-source contributors to harden our APIs.</span></p>\n<p><span style=\"vertical-align: baseline;\">The v1.0 release marks a stable, backwards-compatible foundation suitable for enterprise workloads. Here's what's new and hardened since our v0.2 release:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Transport layer abstraction &amp; </strong><code><strong style=\"vertical-align: baseline;\">HttpMcpTransport</strong></code><span style=\"vertical-align: baseline;\">: We introduced a clean transport layer abstraction alongside </span><code style=\"vertical-align: baseline;\">HttpMcpTransport</code><span style=\"vertical-align: baseline;\">. This feature decouples the core protocol logic from underlying HTTP clients, making it easy to swap network implementations or customize connection pooling.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Decoupled client authentication</strong><span style=\"vertical-align: baseline;\">: To simplify enterprise security compliance, client authentication is now decoupled using </span><code style=\"vertical-align: baseline;\">CredentialsProvider</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">AuthMethods</code> classes<span style=\"vertical-align: baseline;\">. Credentials are resolved asynchronously on every request, so teams can refresh tokens dynamically or plug in their own token source (Google OIDC via ADC ships in the box, anything else is a one-method interface).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Default parameter support</strong><span style=\"vertical-align: baseline;\">: Native support for default values in tool parameters, reducing prompt payload sizes and enhancing agent reliability.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pruning bound parameters</strong><span style=\"vertical-align: baseline;\">: Sensitive parameters that are bound server-side (like </span><code style=\"vertical-align: baseline;\">tenant_id</code><span style=\"vertical-align: baseline;\">) are now automatically stripped from exposed tool definitions so the LLM can't manipulate them.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Version selection &amp; session tracking</strong><span style=\"vertical-align: baseline;\">: Standardized MCP version selection and robust session tracking ensure consistent protocol negotiation and conversation-state lifecycles.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">HTTP credential exposure warnings</strong><span style=\"vertical-align: baseline;\">: Added built-in detection that warns you at runtime when credentials are about to travel over a plaintext HTTP connection.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Generic client headers map</strong><span style=\"vertical-align: baseline;\">: Easily attach custom corporate proxy headers, transaction tracing IDs, or correlation metadata to all outgoing requests.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Get started with the Java SDK v1.0</span></h2>\n<p><span style=\"vertical-align: baseline;\">We designed the MCP Toolbox Java SDK to be frictionless for enterprise teams. Just add the following dependency to your </span><code style=\"vertical-align: baseline;\">pom.xml</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;&lt;dependency&gt;\\r\\n    &lt;groupId&gt;com.google.cloud.mcp&lt;/groupId&gt;\\r\\n    &lt;artifactId&gt;mcp-toolbox-sdk-java&lt;/artifactId&gt;\\r\\n    &lt;version&gt;1.0.0&lt;/version&gt;\\r\\n&lt;/dependency&gt;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41fc3a90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Real-world example: The autonomous transit concierge</span></h2>\n<p><span style=\"vertical-align: baseline;\">To demonstrate the power of the Java SDK combined with AlloyDB, let's look at an enterprise use case.</span></p>\n<p><span style=\"vertical-align: baseline;\">Meet</span><strong style=\"vertical-align: baseline;\"> Cymbal Transit</strong><span style=\"vertical-align: baseline;\">, a fictitious intercity bus network. Customers don't want to click through nested dropdown menus to plan a trip. They want to ask:</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"I need to get from New York to Boston tomorrow morning. Can I bring my Golden Retriever? If so, book me the fastest trip.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">To answer this question, an AI agent must cross-reference unstructured data (pet policies) with structured data (schedules and seat availability) and execute a transaction (booking)—all while maintaining the context of the conversation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The foundation: AlloyDB schema with native embeddings</span></h3>\n<p><span style=\"vertical-align: baseline;\">We used AlloyDB for this implementation because it handles relational data and high-dimensional vectors natively. Set up your database tables with these statements:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Enable necessary extensions for semantic search and embeddings\\r\\nCREATE EXTENSION IF NOT EXISTS vector;\\r\\nCREATE EXTENSION IF NOT EXISTS google_ml_integration;\\r\\n\\r\\n-- Table 1: Transit Policies (Unstructured Data for RAG)\\r\\nCREATE TABLE transit_policies (\\r\\n    policy_id SERIAL PRIMARY KEY,\\r\\n    category VARCHAR(50),\\r\\n    policy_text TEXT,\\r\\n    policy_embedding vector(768)\\r\\n);\\r\\n\\r\\n-- Table 2: Intercity Bus Schedules (Structured Data)\\r\\nCREATE TABLE bus_schedules (\\r\\n    trip_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\\r\\n    origin_city VARCHAR(100),\\r\\n    destination_city VARCHAR(100),\\r\\n    departure_time TIMESTAMP,\\r\\n    arrival_time TIMESTAMP,\\r\\n    available_seats INT DEFAULT 50,\\r\\n    ticket_price DECIMAL(6,2)\\r\\n);\\r\\n\\r\\n-- Table 3: Booking Ledger (Transactional Action Data)\\r\\nCREATE TABLE bookings (\\r\\n    booking_id UUID PRIMARY KEY DEFAULT gen_random_uuid(),\\r\\n    trip_id UUID REFERENCES bus_schedules(trip_id),\\r\\n    passenger_id VARCHAR(100),\\r\\n    status VARCHAR(20) DEFAULT &#x27;CONFIRMED&#x27;,\\r\\n    booking_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;lang-sql&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41fc1250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Mapping intents to SQL: The </span><code style=\"vertical-align: baseline;\">tools.yaml</code></h3>\n<p><span style=\"vertical-align: baseline;\">The MCP Toolbox lets you define custom tools securely. Rather than granting the LLM direct database access, a </span><code style=\"vertical-align: baseline;\">tools.yaml</code><span style=\"vertical-align: baseline;\"> configuration maps natural language intents directly to parameterized, safe queries:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kind: source\\r\\nname: alloydb\\r\\ntype: alloydb-postgres\\r\\nproject: my-project\\r\\nregion: us-central1\\r\\ncluster: my-cluster\\r\\ninstance: my-instance\\r\\ndatabase: postgres\\r\\n---\\r\\nkind: tool\\r\\nname: query-schedules\\r\\ntype: postgres-sql\\r\\nsource: alloydb\\r\\ndescription: Find available bus schedules between cities.\\r\\nparameters:\\r\\n  - name: origin\\r\\n    type: string\\r\\n    description: The departure city name.\\r\\n  - name: destination\\r\\n    type: string\\r\\n    description: The arrival city name.\\r\\n  - name: limit\\r\\n    type: integer\\r\\n    description: Maximum number of schedules to return.\\r\\n    default: 5\\r\\nstatement: |\\r\\n  SELECT CAST(trip_id AS TEXT) AS trip_id, departure_time, ticket_price\\r\\n  FROM bus_schedules\\r\\n  WHERE lower(origin_city) = lower($1) AND lower(destination_city) = lower($2)\\r\\n  ORDER BY departure_time ASC\\r\\n  LIMIT $3&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41fc3b90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For the complete YAML file, see the </span><a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java/blob/main/demo-applications/cymbal-transit/tools.yaml\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">tools.yaml</code></a><span style=\"vertical-align: baseline;\"> file in the </span><code style=\"vertical-align: baseline;\">mcp-toolbox-sdk-java</code><span style=\"vertical-align: baseline;\"> repository.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Stateful agent architecture in Spring Boot</span></h3>\n<p><span style=\"vertical-align: baseline;\">The hardest part of building conversational AI in enterprise applications is managing state: when a user asks, \"What times are available?\" and follows up with, \"Book the 8 AM one,\" the agent must remember prior context across turns.</span></p>\n<p><span style=\"vertical-align: baseline;\">Using the Java MCP Toolbox SDK with Spring Boot and LangChain4j, we can cleanly maintain conversational memory in the HTTP Session and we can cleanly separate the agent into two declarative components:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A declarative agent interface that manages the prompt, tools, and conversational memory via an HTTP session.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A tool execution service that routes agent requests directly to the MCP Toolbox server.</span></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;interface TransitAgent {\\r\\n    @SystemMessage({\\r\\n        &quot;You are the Cymbal Transit Concierge.&quot;,\\r\\n        &quot;Use the \\&#x27;querySchedules\\&#x27; tool for finding schedules.&quot;,\\r\\n        &quot;Use \\&#x27;bookTicket\\&#x27; to execute transactions.&quot;,\\r\\n        &quot;Use \\&#x27;searchPolicies\\&#x27; to look up luggage and pet rules.&quot;\\r\\n    })\\r\\n    String chat(@MemoryId String sessionId, @UserMessage String userMessage);\\r\\n}\\r\\n\\r\\n@Service\\r\\nclass TransitAgentTools {\\r\\n    // These methods automatically invoke our MCP Toolbox server!\\r\\n    @Tool(&quot;Query specific schedules between an origin and destination city.&quot;)\\r\\n    public String querySchedules(String origin, String destination) { ... }\\r\\n\\r\\n    @Tool(&quot;Book a ticket for a passenger.&quot;)\\r\\n    public String bookTicket(String tripId, String passengerName) { ... }\\r\\n\\r\\n    @Tool(&quot;Search transit policies for luggage and pet rules.&quot;)\\r\\n    public String searchPolicies(String query) { ... }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41b1e650&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Notice how the <code>@MemoryId</code> annotation abstracts session tracking: Spring Boot automatically correlates conversational context to the user's HTTP session. Meanwhile, LangChain4j and the MCP Toolbox handle schema translation and tool routing behind the scenes—no handwritten if/else intent parsing required.</span></p>\n<p><span style=\"vertical-align: baseline;\">By pairing the MCP Toolbox Java SDK with LangChain4j, we achieve clean separation of concerns and effortless state management:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero-boilerplate session management</strong><span style=\"vertical-align: baseline;\">: The </span><code style=\"vertical-align: baseline;\">@MemoryId String sessionId</code><span style=\"vertical-align: baseline;\"> parameter binds conversation history directly to the user's HTTP session.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Declarative agent contract</strong><span style=\"vertical-align: baseline;\">: The </span><code style=\"vertical-align: baseline;\">TransitAgent</code><span style=\"vertical-align: baseline;\"> interface defines the model's persona and system instructions without complex prompt templating.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Type-safe tool execution</strong><span style=\"vertical-align: baseline;\">: The </span><code style=\"vertical-align: baseline;\">TransitAgentTools</code><span style=\"vertical-align: baseline;\"> Spring service wraps remote MCP database tools as native Java methods.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">This architecture ensures your agent remains modular: you can refine prompt guidance in the interface, manage user sessions automatically, and execute secure database queries through MCP Toolbox without tight coupling.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Connecting the dots: Listing, invoking, and executing tools in Java v1.0</span></h2>\n<p><span style=\"vertical-align: baseline;\">Now let's look under the hood of the </span><code style=\"vertical-align: baseline;\">TransitAgentTools</code><span style=\"vertical-align: baseline;\"> interface. Inside those LangChain4j </span><code style=\"vertical-align: baseline;\">@Tool</code><span style=\"vertical-align: baseline;\"> methods on our Spring </span><code style=\"vertical-align: baseline;\">@Service</code><span style=\"vertical-align: baseline;\">, the MCP Toolbox Java SDK handles the heavy lifting—bridging your Java service methods to the MCP tools defined in the </span><code style=\"vertical-align: baseline;\">tools.yaml</code><span style=\"vertical-align: baseline;\"> file. In just a few lines of type-safe code, we can initialize our client using the new v1.0 decoupled authentication and headers abstractions:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// 1. Initialize the Client with Decoupled Auth and Custom Headers (v1.0)\\r\\nString serviceUrl = &quot;https://toolbox-my-project-uc.a.run.app/mcp&quot;;\\r\\nMcpToolboxClient mcpClient = McpToolboxClient.builder()\\r\\n    .baseUrl(serviceUrl)\\r\\n    .credentialsProvider(new GoogleCredentialsProvider(serviceUrl)) // Decoupled OIDC credentials\\r\\n    .headers(Map.of( // Generic client headers\\r\\n        &quot;X-Correlation-ID&quot;, &quot;enterprise-session-abc123&quot;,\\r\\n        &quot;X-Client-Platform&quot;, &quot;Spring-Boot&quot;\\r\\n    ))\\r\\n    .build();\\r\\n\\r\\n// 2. Listing Discoverable Tools\\r\\nmcpClient.listTools().thenAccept(tools -&gt; {\\r\\n    System.out.println(&quot;Successfully discovered &quot; + tools.size() + &quot; tools.&quot;);\\r\\n});\\r\\n\\r\\n// 3. Invoking a Tool (Read-Only Data with Default Parameter Support)\\r\\n// &quot;limit&quot; is omitted: the SDK fills it from the default in the tool definition\\r\\nString schedules = mcpClient.loadTool(&quot;query-schedules&quot;)\\r\\n    .thenCompose(tool -&gt; tool.execute(Map.of(\\r\\n        &quot;origin&quot;, &quot;New York&quot;,\\r\\n        &quot;destination&quot;, &quot;Boston&quot;)))\\r\\n    .join().text();\\r\\n\\r\\n// 4. Executing a Transactional Tool (Using Bound Parameters)\\r\\nAuthTokenGetter toolAuthGetter = () -&gt; CompletableFuture.completedFuture(myIdToken);\\r\\n\\r\\nString bookingConfirmation = mcpClient.loadTool(&quot;book-ticket&quot;, Map.of(&quot;google_auth&quot;, toolAuthGetter))\\r\\n    // Bind the authenticated user context securely. bindParam returns a new immutable\\r\\n    // Tool, and the bound parameter is pruned from the definition exposed to the LLM!\\r\\n    .thenCompose(tool -&gt; tool.bindParam(&quot;passenger_name&quot;, &quot;Jane Doe&quot;)\\r\\n        // Execute the mutable transaction\\r\\n        .execute(Map.of(&quot;trip_id&quot;, &quot;123e4567-e89b-12d3-a456-426614174000&quot;)))\\r\\n    .join().text();&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41b1dd50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Secure by default: authentication and deployment</span></h2>\n<p><span style=\"vertical-align: baseline;\">Moving an AI agent to production requires rock-solid credential handling and an infrastructure that scales with demand. Let's look at how you can enforce credential safety across environments and deploy independently on Cloud Run.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Application Default Credentials (ADC) &amp; safety</span></h3>\n<p><span style=\"vertical-align: baseline;\">By using the </span><code style=\"vertical-align: baseline;\">GoogleCredentialsProvider</code><span style=\"vertical-align: baseline;\"> service</span><span style=\"vertical-align: baseline;\">, your Java app inherits its secure identity from its execution environment (whether local or in Google Cloud) through Application Default Credentials (ADC)—no hard-coded keys, with OIDC tokens minted and cached per audience under the hood. Furthermore, v1.0 offers HTTP Credential Exposure Warnings that automatically detect when credentials are about to travel over a plaintext HTTP connection and emit a runtime warning telling you to switch to HTTPS.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Deploying the fleet to Cloud Run</span></h3>\n<p><span style=\"vertical-align: baseline;\">Because MCP Toolbox and the Spring Boot Agent are fully decoupled, they scale independently on Google Cloud Run to meet high concurrency and stateful conversation requirements.</span></p>\n<p><span style=\"vertical-align: baseline;\">To set up and configure Toolbox on Cloud Run, download the open-source MCP Toolbox for Databases and then follow the </span><a href=\"https://mcp-toolbox.dev/documentation/deploy-to/cloud-run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">deployment guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Get started today</span></h2>\n<p><span style=\"vertical-align: baseline;\">With MCP Toolbox Java SDK v1.0, enterprise Java teams can wire Spring Boot and LangChain4j agents to the Toolbox server, and through it, to AlloyDB and every other supported data source. When you use the toolbox, arguments are validated against the tool definition before they leave the JVM, authentication is decoupled, and custom headers are attached to every outgoing request. The following </span><strong style=\"vertical-align: baseline;\">implementation steps will help you get started</strong>.</p>\n<h3><span style=\"vertical-align: baseline;\">Step 1: Add the Dependency</span></h3>\n<p><span style=\"vertical-align: baseline;\">To start building with the SDK, add the following dependency to your Maven project's <code>pom.xml</code> file:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;&lt;dependency&gt;\\r\\n        &lt;groupId&gt;com.google.cloud.mcp&lt;/groupId&gt;\\r\\n        &lt;artifactId&gt;mcp-toolbox-sdk-java&lt;/artifactId&gt;\\r\\n        &lt;version&gt;1.0.0&lt;/version&gt;\\r\\n &lt;!-- {x-version-update:mcp-toolbox-sdk-java:current} --&gt;\\r\\n    &lt;/dependency&gt;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41b1f0d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step 2: Explore Resources &amp; Demos</span></h3>\n<ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GitHub Repository</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Java SDK for interacting with the MCP Toolbox for Databases</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Official Documentation</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://mcp-toolbox.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases</span></a></p>\n</li>\n</ul>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Demo Application</strong><span style=\"vertical-align: baseline;\">: To experience the Java SDK V1.0 for MCP Toolbox latest, try the sample application <a href=\"https://github.com/googleapis/mcp-toolbox-sdk-java/tree/main/demo-applications/cymbal-transit\" rel=\"noopener\" target=\"_blank\">Cymbal transit project</a></span><span style=\"vertical-align: baseline;\">.</span></p>\n<h4>Gradle implementation</h4>\n<p><span style=\"vertical-align: baseline;\">If your team uses Gradle instead of Maven, remember they will need to translate this dependency:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;implementation &#x27;com.google.cloud.mcp:mcp-toolbox-sdk-java:1.0.0&#x27;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3c41b1d810&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Automatic version tracking</span></h4>\n<p><span style=\"vertical-align: baseline;\">I<span style=\"vertical-align: baseline;\">f you copy this setup into automated internal repositories, k</span>eep the XML comment <code>&lt;!-- {x-version-update...} --&gt;</code> intact. It's required by the release manager's deployment scripts to automatically bump versions.</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Now that you can integrate your modern agentic tools and servers to your enterprise Java applications with a stale MCP Toolbox Java SDK, get started today!</span></span></p></div>"
