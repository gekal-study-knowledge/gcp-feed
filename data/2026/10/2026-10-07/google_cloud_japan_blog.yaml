  "4de9940ebfa9e57a741fb4cb9a54ea5b":
    "id": "4de9940ebfa9e57a741fb4cb9a54ea5b"
    "title": "AI 駆動で進める、クラウド移行と運用のこれから。AI-Ready Infra & DB Summit '26"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/ai-ready-infra-db-summit-26/"
    "published": "2026-10-07 11:00:00"
    "fetched": "2026-10-07 11:06:17"
    "summary": "<div class=\"block-paragraph\"><p>こんにちは、Google Cloud Japan です。</p><p>AI がシステムを使うようになると、アクセスは昼夜を問わず増え、データには検索と生成の両方が求められます。AI を業務で使い続けるには、それに耐えるインフラとデータベースへの移行が欠かせません。</p><p>Google Cloud は 2026 年 10 月 16 日（金）に AI-Ready Infra &amp; DB Summit '26 を開催します。最新のクラウド動向調査の結果を発表するほか、Google Cloud のインフラとデータベースの最新情報を、お客様の事例とともにお届けします。調査からコード移植までを AI 駆動で進めるクラウド移行の方法も、あわせて解説します。会場は Google 渋谷オフィスで、オンライン配信もあります。</p><p><b>▶</b> <a href=\"https://cloudonair.withgoogle.com/events/infra-db-summit26?utm_source=cloud_sfdc&amp;utm_medium=social_post_feed&amp;utm_campaign=FY26-Q4-JAPAN-JAP40173-onlineevent-er-InfraDBSMT-233117&amp;utm_content=blog1006&amp;utm_term=-\" target=\"_blank\"><b>AI-Ready Infra &amp; DB Summit '26 に申し込む</b></a></p><h3><b>基調講演のテーマは「AI が使う基盤、AI で作る基盤」</b></h3><p>基調講演には、ロッテホールディングスの橋本 桂祐 氏とマクロミルの宮坂 雅輝 氏をお迎えし、Google Cloud の安原 稔貴とともに登壇いただきます。コンピュート、ネットワーク、ストレージ、データベースの各領域の最新情報とあわせて、既存の基盤をどこから見直すべきか、その道筋を示します。</p><h3><b>お客様 4 社が、基盤づくりと移行の実例を紹介</b></h3><p>お客様セッションには、業種も規模も異なる 4 社が登壇します。</p><ul><li><b>GovTech 東京</b>: 都民 1,400 万人が利用する東京都公式アプリ「東京アプリ」で、将来の利用拡大や AI 活用まで見据えて、後から変えにくい技術をどう選んだのかをお話しします。</li><li><b>ロッテ</b>: データと AI の基盤づくりと重点ユースケースの創出を同時に進め、TAP (Tech Acceleation Program) を活用して事業部門と一体で内製開発を進める取り組みをお話しします。</li><li><b>マクロミル</b>: クラウド コストとレガシー構成の保守リスクを抱えたアンケート配信システム「TRANS-AM」を、Google Cloud へ移管する計画を紹介します。</li><li><b>スタメン</b>: 1,400 社、150 万ユーザーが使う TUNAG を、AWS から Google Cloud へ移行中です。AI Skills を使い、少人数で進める具体策をお話しします。</li></ul><h3><b>Google Cloud が、AI 駆動型の移行と運用のアプローチを紹介</b></h3><p>Google Cloud のスペシャリストが、移行と運用の各工程での AI の使い方を、具体的な手順とあわせて解説します。</p><ul><li><b>Gemini と Skills で進めるクラウド移行</b>: 移行のノウハウを Skills にまとめて Gemini に読み込ませ、現行環境の調査からコード移植と差分検証まで進める方法です。実際に使った Skills と成果物をお見せします。</li><li><b>AI で進めるデータベース移行</b>: 手間のかかる異種データベースへの移行で、AI が手作業をどこまで減らせるかを紹介します。</li><li><b>クラウド ネットワークの見える化</b>: 障害の原因がアプリかネットワークかを切り分ける手法を、AI を使ったトラブルシューティングとあわせて解説します。</li></ul><p>このほか、Jagu'e'r によるパネルトーク、Datadog、GitLab、KDDI アイレットによるセッションも予定しています。</p><h3><b>会場に来た方だけの特典も</b></h3><p>渋谷の会場にお越しの方には、Google Cloud オリジナルの特典を用意しています。お渡しには条件があり、詳しくは当日ご案内します。終了後の懇親会にも、ぜひお立ち寄りください。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"blog-present-2436x1000\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/blog-present-2436x1000.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><a href=\"https://cloudonair.withgoogle.com/events/infra-db-summit26?utm_source=cloud_sfdc&amp;utm_medium=social_post_feed&amp;utm_campaign=FY26-Q4-JAPAN-JAP40173-onlineevent-er-InfraDBSMT-233117&amp;utm_content=blog1006&amp;utm_term=-\" target=\"_blank\">AI-Ready Infra &amp; DB Summit '26 のイベントページ</a> からお申し込みください。</p><p>基盤を作る方も、運用する方も、移行を任された方も、会場とオンラインでお会いしましょう！</p></div>"
  "f47da10e0d5ae03ff626d31c753cf951":
    "id": "f47da10e0d5ae03ff626d31c753cf951"
    "title": "AI エージェントを現場実装する 2 日間、Agentic AI Summit '26 Fall"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/agentic-ai-summit-26-fall/"
    "published": "2026-10-07 11:00:00"
    "fetched": "2026-10-07 11:06:17"
    "summary": "<div class=\"block-paragraph\"><p>こんにちは、Google Cloud Japan です。</p><p>AI エージェントは、動くものを作るところまでは驚くほど早く進みます。難しいのはその先です。</p><p>エンジニアにとっては本番で任せられる品質の担保、情報システム部門にとってはセキュリティとガバナンス、事業部門にとっては全社への定着と成果づくりが次の課題になります。</p><p>Google Cloud は 2026 年 10 月 29 日（木）と 30 日（金）に Agentic AI Summit '26 Fall を開催し、それぞれの課題に取り組んできた企業の知見をお届けします。会場はベルサール渋谷ガーデンで、オンラインでも配信します。</p><p><b>▶</b> <a href=\"https://cloudonair.withgoogle.com/events/agentic-ai-summit-26-fall?utm_source=cloud_sfdc&amp;utm_medium=social_post_feed&amp;utm_campaign=FY26-Q4-JAPAN-JAP40913-onlineevent-er-AgenticAIFAL-215742&amp;utm_content=blog1006&amp;utm_term=-\" target=\"_blank\"><b>Agentic AI Summit '26 Fall に申し込む</b></a></p><h3><b>Day 1 は全社展開の実例がそろう</b></h3><p>初日は、Gemini Enterprise を中心に、AI エージェントを社内で使われる状態にするまでの進め方がテーマです。基調講演には三菱 UFJ 銀行をはじめ 2 社のお客様が登壇し、Gemini Enterprise を選んだ理由とその背景を語ります。</p><p>ブレイクアウトは全社展開の実例が中心です。</p><ul><li><b>ソニー</b>: 非エンジニア約 70 名の経営企画部門が、2 桁の業務アプリを本番稼働させるまでの記録です。定着や社内調整でのつまずきも語ります。</li><li><b>日本テレビ</b>: 担当者の経験と勘に支えられてきた番組づくりに客観性を加え、「ヒットの再現性」を高める AI エージェント「ミカタッチAI」の取り組みです。</li><li><b>足立区</b>: 議会答弁 AI エージェントの実装プロセスと、区民の声にすばやく応えるための取り組みです。</li></ul><p>ほかにも、大阪ガスの内製 AI 駆動開発基盤や、営業担当に次の一手を届ける Hajimari のエージェント開発があります。そして、Googler Cloudのセッションでは、Tokenmics（適切なモデルを利用する際のコスト効率向上について）や、AI エージェントの統制とモデル選択を両立するエージェント基盤の設計、Microsoft 365 などの既存環境とつないで Gemini Enterprise を全社に定着させる進め方などがあります。</p><h3><b>他社の事例を一気に見るならピッチ コンテスト</b></h3><p>Day 1 の 13:30 からは、第 6 回 AI エージェント事例アワードのピッチ コンテストを開催します。生成 AI で自社の課題を解いたファイナリストが、その取り組みをステージで発表します。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"finalist (1)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/finalist_1.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>ファイナリストは、KDDI アイレット、コクヨ、Contrea、千趣会、テレビ朝日、ベンチャーサポート税理士法人と SoLabo、三菱食品、Ubie の 8 チームです。</p><p>審査員には、次の 4 名を迎えます。</p><ul><li>漆原 茂 氏（ULS コンサルティング株式会社 取締役会長）</li><li>酒井 真弓 氏（ノンフィクション ライター、Jagu'e'r アンバサダー）</li><li>深津 貴之 氏（株式会社 THE GUILD 代表取締役）</li><li>森 正弥 氏（株式会社博報堂 DY ホールディングス 執行役員 Chief AI Officer）</li></ul><p>MC は、PIVOT などで MC とプロデューサーを務め、J-WAVE のニュース情報番組「JAM THE PLANET」のパーソナリティとしても活躍する野嶋 紗己子 氏です。</p><p>アワードの詳細は <a href=\"https://cloudonair.withgoogle.com/events/gcgenai-innovation-awards\" target=\"_blank\">AI エージェント事例アワードの開催概要</a> をご覧ください。</p><h3><b>Day 2 は丸ごとエンジニア向け</b></h3><p>2 日目は、AI エージェントを構築、デプロイ、運用するための Google Cloud のプラットフォームを中心に、エージェント開発とバイブコーディングのセッションが並びます。</p><p>基調講演には Antigravity のエンジニアや、エージェント開発のエキスパートが登壇し、Sakana AI、荏原製作所、エイベックスがエージェントを現場で動かしている取り組みを話します。</p><p>ブレイクアウトは本番運用の話が中心です。</p><ul><li><b>AI エージェントを本番に載せるアーキテクチャ設計</b>: 同じ入力でも同じ答えが返るとは限らない相手を、どうテストし、どこでリリース可否を決めるか。複数エージェントの責任の境界、コストとレイテンシの制約まで扱います。</li><li><b>コロプラ</b>: Agent2Agent プロトコル (A2A) の作法だけを接続境界に決め、各部署のエージェントを作り直さずに Agent Development Kit (ADK) 製のハブへつないだ全社基盤です。</li><li><b>損保ジャパン</b>: 全自動エージェントをあえて捨て、人が承認する場所を設けて、実験サイクルを 1 週間から 1 日に縮めました。</li></ul><p>ほかにも、ライブデモと agy teamwork まで紹介する Antigravity 徹底解説、メルカリの AI PDLC と TPU 活用、エージェントの推測を減らすデータ基盤の設計、Google Cloud のテクニカル サポートチームの AI 活用などがあります。</p><h3><b>作って試すなら Builder Day</b></h3><p>Day 2 には、参加型の Builder Day を並行開催します。90 分の座学の後、Google Cloud 上で Antigravity などを使い、AI エージェントやアプリを作るミニハッカソンに挑戦できます。</p><p>Google Cloud のデベロッパー リレーションズのメンバーがメンターにつきます。</p><p>定員制なので、参加希望の方は<a href=\"https://cloudonair.withgoogle.com/events/agentic-ai-summit-26-fall?utm_source=cloud_sfdc&amp;utm_medium=social_post_feed&amp;utm_campaign=FY26-Q4-JAPAN-JAP40913-onlineevent-er-AgenticAIFAL-215742&amp;utm_content=blog1006&amp;utm_term=-\" target=\"_blank\">登録フォーム</a>で Builder Day への参加を忘れずに選択してください。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"t-shirt (1)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/t-shirt_1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <h3><b>会場に来た方だけの特典も</b></h3><p>各フロアのデモブースでは、最新の生成 AI 製品やお客様の事例に触れられます。現地参加の方には、抽選でオリジナル T シャツのプレゼントもあります。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p>エージェントを作る方も、守る方も、社内に広げる方も、渋谷の会場でも、オンラインでもお待ちしています！</p><p><b>▶</b> <a href=\"https://cloudonair.withgoogle.com/events/agentic-ai-summit-26-fall?utm_source=cloud_sfdc&amp;utm_medium=social_post_feed&amp;utm_campaign=FY26-Q4-JAPAN-JAP40913-onlineevent-er-AgenticAIFAL-215742&amp;utm_content=blog1006&amp;utm_term=-\" target=\"_blank\"><b>Agentic AI Summit '26 Fall に申し込む</b></a></p></div>"
  "500f4ffafa250c93c43df56b1007de05":
    "id": "500f4ffafa250c93c43df56b1007de05"
    "title": "AlloyDB がエージェント向け PostgreSQL を提供: ワークロードを完全に分離し、エージェント規模でリアルタイム データを処理"
    "link": "https://cloud.google.com/blog/ja/products/databases/announcing-postgresql-for-agents-in-alloydb/"
    "published": "2026-10-07 03:10:00"
    "fetched": "2026-10-07 18:50:43"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 25 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/announcing-postgresql-for-agents-in-alloydb?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p> </p>\n<p><span style=\"vertical-align: baseline;\">ミッション クリティカルな運用データベースは企業にとってなくてはならないものであり、パフォーマンスの低下は許されません。しかし従来のアーキテクチャでは、わずか数個のエージェントが高密度の推論ループを実行しただけで、予測不可能なクエリのバーストが発生して簡単に過負荷状態に陥ります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、AlloyDB でエージェント向け PostgreSQL（プレビュー版）の提供を開始したことをお知らせいたします。これにより、ミッション クリティカルなシステムのパフォーマンスを損なうことなくリアルタイムのデータアクセスを行うことが可能になります。AlloyDB は、サンドボックス化されたデータベース インスタンスを数秒でプロビジョニングしてスケールすることでエージェントによる突発的なクエリの急増に対応し、ワークロードの完全な分離を可能にします。インスタンスはエージェントが終了すると自動的にスピンダウンするため、数個でも数百万個でも、エージェントをあらゆる規模で費用対効果よく実行できます。この発表による変更点は以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB に、秒単位で同期された本番環境の最新データに読み取り専用でアクセスできる数千のサーバーレス データベース インスタンスへと PostgreSQL をスケールさせるように設計された</span><a href=\"https://cloud.google.com/blog/ja/products/databases/alloydbs-agentic-database-architecture?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント向けデータベース アーキテクチャ</span></a><span style=\"vertical-align: baseline;\">が搭載されます。これらのインスタンスは常時、本番環境ワークロードがアクセスするプライマリ、スタンバイ、リードレプリカのインスタンスから完全に分離されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">これらの各インスタンスは、</span><a href=\"https://cloud.google.com/blog/ja/products/storage-data-transfer/a-peek-behind-colossus-googles-file-system?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google が提供するエクサバイト規模の分散ストレージ システムである Colossus</span></a><span style=\"vertical-align: baseline;\"> の統合ストレージ レイヤを基盤とするデータベース内のリアルタイム データにアクセスします。これにより、エージェントはミリ秒未満の I/O とテラビット/秒の集約スキャン スループットを実現し、秒間 300 万以上のクエリにも対応できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">これらのインスタンスは完全な AlloyDB PostgreSQL エンジンを備え、すべてのインデックス、SQL の全機能、包括的なベクトル検索、全文検索、空間検索へのアクセスを提供します。さらに、複雑な ETL パイプラインを構築しなくても、エージェントは </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Spark</span></a><span style=\"vertical-align: baseline;\"> を活用してレイクハウス分析を実行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">これらのインスタンスはエージェントがタスクを完了するとすぐにゼロへとスケールダウンされるため、料金はアクティブな推論ループに対してのみ発生し、クラウド費用を削減できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google は、この</span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> により高度なベクトル演算、ML 推論、基盤モデルのインテグレーションを 100% PostgreSQL 互換のエンジンに直接組み込み、エージェント向けエンタープライズ リレーショナル データベースの分野における先駆けとなりました。AlloyDB for PostgreSQL は Google Cloud のセキュリティ機能と緊密に統合されており、静的パスワードに代わる IAM 認証の使用、VPC Service Controls を介したトラフィック分離、顧客管理の暗号化と監査の提供によりデータを保護します。この機能とエージェント アーキテクチャによるスケーラビリティを組み合わせて提供する AlloyDB は、エンタープライズ グレードの優れたエージェント PostgreSQL サービスとなっています。</span></p>\n<p style=\"text-align: center;\"><span style=\"font-style: italic; vertical-align: baseline;\">プレビュー版をご利用になるには、</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSfYv_zv2CI9L6xZxkExZai_jG-eiz8iEYPfwLFwaIatZdYCrA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">こちらからお申し込み</span></a><span style=\"font-style: italic; vertical-align: baseline;\">ください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">重要である理由</strong></h3>\n<p><span style=\"vertical-align: baseline;\">エージェントの時代となった今、企業による AI の使用方法は単一のコパイロット エージェントとのやり取りから、数百万のエージェントが同時に連携するネットワークへと急速に移行しています。これらのエージェントが一斉にクエリを実行してデータベースを操作すると、突発的なトラフィックの急増によってコア データベースが過負荷に陥り、ビジネスを運営する基幹システムと競合してしまう可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントがワークフローを効率的に実行するためには、B ツリー、ベクトル、テキスト、空間の各インデックスを活用して、高度な分析とリアルタイムの本番データに対する低遅延アクセスの両方を実現する必要があります。新興のアーキテクチャはオブジェクト ストレージの上に配置されたページ キャッシュ レイヤを使用しますが、これにはスケーリングと費用に関する課題があり、本番環境システムの安定性が損なわれる可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">加えて、分析のために本番環境のデータを解放すると運用アクセスにパフォーマンスのボトルネックが生じ、エージェントが本番環境にリリースされた瞬間からミッション クリティカルなデータベースがリスクにさらされるという、難しいトレードオフも発生します。これらは、データベース ストレージに従来のオブジェクト ストアを使用して問題を解決しようとするアプローチです。分析アクセスが可能になるので一部のエージェントはこれを役立てることができますが、基盤となるデータベースの処理速度が本番環境のワークロードに対して遅すぎ、I/O レイテンシが最大で 10 倍悪化します。ページ キャッシュ レイヤがあっても、一時しのぎ程度にしかなりません。キャッシュ自体の速度が依然として十分に速くないうえに、エージェント ワークロードによって簡単に飽和してしまうスケーラビリティのボトルネックを抱えることになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">アクティブなマルチエージェント システムが高密度な推論サイクルを実行すると、高度に並列化された予測不可能なクエリのバーストが発生してこれらのキャッシュ レイヤを圧倒し、ミッション クリティカルな本番環境システムが、エージェント起因のサービス停止に対して無防備な状態になります。その結果、このアーキテクチャでは運用ユースケースの全領域が実行不可能となり、企業はライブのエンタープライズ データが持つ、AI による変革の力をビジネスに活用する機会を失うことになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AlloyDB 独自の PostgreSQL エージェント アーキテクチャ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google はこれとは異なるアプローチを採用しました。AlloyDB は、AI 時代に特化して設計された</span><a href=\"https://cloud.google.com/blog/ja/products/databases/alloydbs-agentic-database-architecture?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント向けデータベース アーキテクチャ</span></a><span style=\"vertical-align: baseline;\">を提供し、4 つの主要な差別化機能を備えています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">人工的なボトルネックのない、1 ミリ秒未満の I/O レイテンシ: </strong><span style=\"vertical-align: baseline;\">業界をリードする AlloyDB のトランザクションおよびクエリ処理性能と、Google の地球規模の Colossus ストレージ インフラストラクチャに支えられた低レイテンシのオブジェクト ストレージが組み合わさったこのアーキテクチャは、エージェント向けの大規模な共有ストレージ プレーンを提供します。ミリ秒未満の I/O と 1 秒あたり 1 テラビットを超える集計スキャン帯域幅を実現しているため、エージェントが最新の運用データに対して直接、集中的に読み取りクエリとベクトル検索を実行しても問題なく処理できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">本番環境のワークロードから完全に分離しつつ、需要に合わせてスケーリング: </strong><span style=\"vertical-align: baseline;\">AlloyDB は、最新の本番環境データに対してサンドボックス化されたデータベース インスタンスを数秒で動的にプロビジョニングすることでスケールします。エージェント同士が運用リソースを奪い合う従来のアーキテクチャとは異なり、エージェント データベース コンピューティングはプライマリ データベース クラスタから完全に分離されています。そのため、エージェントが高密度で予測不可能な推論ループを実行しても本番環境のパフォーマンスが低下することはありません。これらの堅牢な安全ガードレールと、エンタープライズ グレードのガバナンス、きめ細かいアクセス制御が組み合わさっているため、アクティブなエージェント ループで分析クエリ、ベクトルクエリ、運用データのポイント ルックアップをシームレスに組み合わせ、本番環境データに対して PostgreSQL の性能を制限なく最大限に活用することができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">従量課金制: </strong><span style=\"vertical-align: baseline;\">エージェントのアクティビティは一般的に、短時間のうちに大量のクエリが同時送信され、それが終わると非アクティブな期間が続くという特徴があります。このような急増に備えて専用のリードレプリカをプロビジョニングした場合、高価なインフラストラクチャを 24 時間体制で維持する必要があります。費用対効果の高い方法で大規模なエージェント グループをサポートし、プロビジョニングしたシステムがアイドル状態のままでコンピューティング オーバーヘッドを発生させることを避けられるよう、エージェント AlloyDB インスタンスは迅速にスケールして秒間数百万のクエリに対応できます。また、柔軟な従量課金制の料金モデルによって自動的にゼロへとスケールさせることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ETL 不要のネイティブ レイクハウス統合: </strong><span style=\"vertical-align: baseline;\">本番環境データはすべて、Google Cloud の</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/introducing-the-borderless-lakehouse?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレス レイクハウス</span></a><span style=\"vertical-align: baseline;\">とネイティブに統合されます。そのため、エージェントは BigQuery と Lightning Engine for Apache Spark に対して連携クエリを実行し、大規模なレイクハウス データセットと、AlloyDB の秒単位で更新される最新のトランザクション データを結合できます。これにより、壊れやすいバッチ ETL パイプラインを構築して維持する必要がなくなり、自律型エージェントは最新の運用状態と、レイクハウスに格納されている過去のコンテキスト データの両方に即座にアクセスできます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">「サプライ チェーンの自律性が高まるにつれ、当社のプラットフォームでは、数千もの施設にわたる複雑な物流ワークフローを調整するリアルタイムのトランザクション インテリジェンスが欠かせなくなっています。AlloyDB の新しいエージェント向け PostgreSQL アーキテクチャは、当社にとって大きな転機となりました。現在では、コアのトランザクション処理には一切影響を及ぼすことなく、同時に連携して動作するエージェントのネットワークをデプロイし、在庫データや注文データを 1 秒未満の鮮度で分析できるようになっています。このアーキテクチャにより、次世代のエンタープライズ サプライ チェーン AI を支えるために必要な分離、スピード、費用対効果を実現できました。」 - Manhattan Associates、エグゼクティブ バイス プレジデント兼最高技術責任者、Sanjeev Siotia 氏</span></p>\n<h3><strong style=\"vertical-align: baseline;\">提供状況</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB の PostgreSQL for Agents は現在、プレビュー版としてご利用いただけます。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳細については、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/postgresql-agents-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">ページをご覧ください。ご利用を開始するには、</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSfYv_zv2CI9L6xZxkExZai_jG-eiz8iEYPfwLFwaIatZdYCrA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらからお申し込みください</span></a><span style=\"vertical-align: baseline;\">。</span></p></div>"
  "1e2b24e9551bbae4ffaa6b47378cb84a":
    "id": "1e2b24e9551bbae4ffaa6b47378cb84a"
    "title": "Google Cloud パートナー、Gemini Enterprise を活用して新たなセキュリティ エージェントと AI 防御機能を提供"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/google-cloud-partners-deliver-new-security-agents-and-ai-defenses-with-gemini-enterprise/"
    "published": "2026-10-07 03:00:00"
    "fetched": "2026-10-07 18:50:43"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 30 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/google-cloud-partners-deliver-new-security-agents-and-ai-defenses-with-gemini-enterprise?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">脅威アクターが AI を利用してサイバー攻撃を加速、開発するケースが増えるなか、企業の防御者は AI と、防御者にとって重要な強みである「自社だけが持つビジネス コンテキスト」の両方を活用する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業のサイバー防御は、ID、ネットワーク、エンドポイント、データ、クラウド、アプリケーションの各レイヤにまたがっており、多くの場合、12 種類以上のプロダクトに分散し、それぞれが独自のコンテキストを持っています。Google Cloud Next では、パートナーが構築したエージェントを</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/partner-built-agents-available-in-gemini-enterprise?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> に組み込み、セールス、コンテンツおよびクリエイティブ ワークフロー、人事、セキュリティなどの機能にわたり、専門エージェントを 1 か所で検出してデプロイできるようにしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Gemini Enterprise エコシステムでパートナーが構築したセキュリティ サービス カタログを拡充し、単一の統合インターフェースからセキュリティ コンテキストを最大限に活用できるようにいたしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">主要なサイバーセキュリティ ベンダーが提供するこれらの新たなセキュリティ エージェントとインテグレーションは、チームが Gemini Enterprise で直接呼び出すパートナー製セキュリティ エージェントと、AI およびエージェント型ワークロードの保護という 2 つの領域にわたっています。これらを Gemini Enterprise に組み込むことにより、Gemini Enterprise 環境で直接、複数ステップのセキュリティ ワークフローをオーケストレーションできるようになり、AI を活用した機能を防御に取り入れることが可能になります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Enterprise で構築された、新たなセキュリティ エージェントとエージェント型防御のご紹介</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">Acalvio</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise からアクセスできる Acalvio ShadowPlex ディセプション エージェントは、企業ネットワーク全体へのデコイとハニートークンのデプロイを自動化し、ディセプション ガードレールを顧客の運用環境に直接埋め込みます。手動での構成は不要です。ShadowPlex は、ネットワーク デコイ、ID ハニー アカウント、検索拡張生成（RAG）デコイ、ハニースキル、ハニートークンを大規模にデプロイし、不正なインタラクションを迅速に捕捉します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Britive</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise を基盤とする Britive Emergency Termination Agent を使用すると、セキュリティ チームは複数のコンソールを操作することなく、単一の自然言語リクエストから、侵害された人間または人間以外の ID を封じ込めることができます。このエージェントは、ID を確認し、アクティブな特権セッションをすべて一覧表示して、人間の承認を得てすべてのセッションを取り消し、ID を無効にして、インシデント チケットの監査コンテキストを収集します。その結果、エージェントの厳格なガバナンスと最小権限アクセスを維持しながら、封じ込めまでの平均時間（MTTC）を大幅に短縮できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Check Point</strong><span style=\"vertical-align: baseline;\">: Google Cloud Agent Gateway および Agent Registry と統合された Check Point AI Defense Plane は、エンタープライズ規模の AI で必要とされる重要なセキュリティ管理と可視性を提供します。組織は、AI ワークロードの検出、リスク ポスチャーのモニタリング、コンプライアンスに違反する動作の検出に加えて、プロンプト インジェクション、データ漏洩、エージェントの不正な挙動に対するリアルタイムのガードレールの適用が可能になります。Gemini Enterprise 内の Check Point Agent を通じて管理されるこの統合ソリューションは、Gemini Enterprise での AI ワークロードのデプロイを保護し、高速化します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">CrowdStrike</strong><span style=\"vertical-align: baseline;\">: CrowdStrike Falcon® Guardian は、Agent Gateway と統合することでガードレールとランタイム保護を拡張し、Gemini Enterprise で実行されるエージェント型ワークロードをプロンプト インジェクション、機密データの漏洩、悪意のある AI アクティビティなどのリスクから保護します。さらに、CrowdStrike Gemini Enterprise エージェントにより、実務担当者は Gemini Enterprise を通じて CrowdStrike プラットフォームを操作できます。これにより、CrowdStrike のセキュリティ コンテキストをエージェント型の調査と対応に組み込み、多数のツールにわたる SOC ワークフローのオーケストレーションを支援します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Cyberhaven</strong><span style=\"vertical-align: baseline;\">: Cyberhaven Linea エージェントは、エンドポイント、クラウドアプリ、エージェント型ワークフロー全体にわたる機密データの検出と分類を Gemini Enterprise で可能にします。Cyberhaven のデータリネージ モデルを活用したこのエージェントは、平易な言葉で表現された意図を適用可能なポリシーに変換し、インタラクションをモニタリングして、マッピングされていないリスクを侵害が発生する前に捕捉します。また、証拠の自動収集により調査が迅速化します。</span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise の Antigravity</span></a><span style=\"vertical-align: baseline;\"> 全体にわたり、Linea エージェントはアラート疲れを解消し、自律型エージェントが機密性の高いアセットを移動するのと同じ速さでセキュリティ チームがそれらを保護できるようにします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Cyera</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise を基盤とする Cyera Agent Guardian は、Gemini で実行されるエージェントを保護し、データ セキュリティ ポスチャー管理（DSPM）とデータ損失防止（DLP）を提供します。Cyera エージェントは、マシン ID、委任された権限、機密データの分類を相互に関連付け、承認されたエージェント型の動作を検証できるため、組織はエージェントを安全にデプロイし、エンタープライズ規模で運用コンプライアンスを維持できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Endor Labs</strong><span style=\"vertical-align: baseline;\">: Endor Labs AURI エージェントは、デベロッパーとセキュリティのワークフロー全体に AI ネイティブのアプリケーション セキュリティをもたらします。同社の静的アプリケーション セキュリティ テスト（SAST）トリアージ エージェントは、Google Antigravity などのデベロッパー プラットフォーム内でコードから検出された問題を自動的に分類し、優先順位を付けることができます。Gemini Enterprise では、セキュリティ チームはこれらの検出結果を会話形式でクエリして対応できます。実際に悪用可能なものを確認し、修正を追跡することが可能で、そのすべてが Endor Labs アプリケーションのコンテキストに基づいています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Exabeam</strong><span style=\"vertical-align: baseline;\">: Exabeam は、Gemini Enterprise を基盤とする次世代の Exabeam Nova を導入しています。これは、セキュリティ チームが脅威をより迅速に調査して対応できるようにする、統合マルチエージェント AI システムです。Nova は、ワークフロー全体で共有されている運用コンテキストを維持しながら、行動の分析、リスクの優先順位付け、調査の実施、対応アクションの誘導を行うことができる、専門の AI エージェントと連携します。その結果、アナリストはよりインテリジェントで効率的なエクスペリエンスを得ることができ、組織は既存のセキュリティ運用環境からより大きな価値を引き出すことができます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Fastly</strong><span style=\"vertical-align: baseline;\">: Fastly Autonomous Edge Defense Agent（AEDA）を使用すると、セキュリティ チームは Gemini Enterprise 内で、ログを手動で解析する代わりに、エッジやインフラストラクチャのインシデントを平易な言葉で調査できます。AEDA は、組織独自のテレメトリーと Fastly のグローバルな顧客ベースから得た匿名化されたインテリジェンスを組み合わせ、異常は単発的なものなのか、より広範な攻撃の一部なのかを数秒で判断し、証拠に裏付けられた調査結果と推奨される修正策を返します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Fortinet</strong><span style=\"vertical-align: baseline;\">: Fortinet FortiAIGate は、Google Cloud のお客様に大規模言語モデル（LLM）のランタイム保護を提供します。Gemini Enterprise と統合され、Google Cloud 環境にデプロイされた FortiAIGate は、組織が高度なエージェント型 AI アプリケーションをデプロイできるよう支援します。これにより、データ、プロンプト、モデルとのインタラクションを新たな脅威から積極的に保護できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Menlo Security</strong><span style=\"vertical-align: baseline;\">: Gemini を使用して構築された HEAT Shield Agent は、ウェブ コンテンツを分析し、実行時にゼロデイ脅威やプロンプト インジェクションをブロックします。これに加えて、Gemini Enterprise を基盤とする Menlo Security Orchestrator が、セキュリティ オペレーション センター（SOC）のレスポンスを自然言語によるエージェント型ワークフローに変換します。これは、攻撃の再構築、影響範囲の特定、ポリシーの適用を、数時間ではなく数秒で行うことができます。Menlo Agent Runtime Security（MARS）は、このループを完結させ、人間とエージェントおよびエージェント同士のインタラクションを保護することで、エージェント型ワークロード全体で検出と封じ込めが統合された状態を維持します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Obsidian Security</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise で Obsidian Security の Risk Analyzer エージェントと Breach Response エージェントを使用すると、セキュリティ アナリストはリスクを評価し、侵害に対応できるようになります。組織のクラウドと AI ネイティブ アプリケーション ポートフォリオを保護するために構築された Obsidian エージェントは、企業環境全体にわたり AI エージェントを検出し、リスクを評価して、ガバナンスのギャップを報告します。また、どのエージェントが昇格された権限や書き込みアクセス権を持っているかといった重要な質問に答えます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Palo Alto Networks</strong><span style=\"vertical-align: baseline;\">: Palo Alto Networks のクラウド、ネットワーク、AI リスク評価（CLARA）エージェントは、開発のペースを落とすことなく、重要なデータとコンプライアンスを確保した AI 運用を保護できるよう、セキュリティ チームを支援します。クラウド インフラストラクチャと AI ワークロードを継続的にスキャンし、隠れた脆弱性を自動的に検出して修正の優先順位を付けることで、クラウドや AI のリスクが侵害に発展する前に発見して修正できます。これにより、セキュリティ チームは脅威の検出に費やす時間を減らし、脅威の解消により多くの時間を費やすことができるようになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Ping Identity</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise で利用可能になった Ping Identity の新しい PingID セルフサービス エージェントを使用すると、従業員は多要素認証（MFA）のリセットやデバイスの復元など、ID やデバイスに関する一般的な問題を自然言語で質問して解決できます。ヘルプデスクのチケットは不要です。PingOne を基盤とする、セキュアな委任認証を備えた PingID セルフサービス エージェントは、従業員の ID を管理するためのエンタープライズ対応の手段を IT チームに提供すると同時に、サポート費用の削減とオンボーディング エクスペリエンスの向上を実現します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Qualys</strong><span style=\"vertical-align: baseline;\">: Qualys ROCky for Gemini Enterprise は、セキュリティ チームが Gemini Enterprise 内で会話を使用して脆弱性を管理し、パッチを適用するのに役立ちます。「Log4Shell の影響はどの程度か」、「まず何を修正すべきか」、「CISA KEV の期限を守れているか」といった質問をすると、Qualys TruRisk スコアに基づいてランク付けされた回答が得られます。各ユーザーが所有する Qualys の利用資格に基づいて動作するため、誰でもサポートなしで自ら回答を得ることができます。また、パッチのステージングとデプロイも行えます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Splunk（Cisco 傘下）</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise と統合された Splunk Security AI エージェントは、膨大なテレメトリー ストリームをセキュリティ データとオブザーバビリティ データ全体にわたるリアルタイム インテリジェンスに変換する自律システムとして機能します。手動によるトリアージを省略して、重大な異常やシステム脅威を即座に表面化させることで、チームは事後対応型の調査からプロアクティブな防御へと転換できます。これにより、プレッシャーの大きなインシデント発生時の認知負荷が軽減され、セキュリティ チームはリスクをより迅速に解決できるようになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Synk</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise と Antigravity を使用して構築しているすべての企業が、かつてない速さでコードをリリースしています。Snyk は、コードが作成された後ではなく作成されたその瞬間から、コードがセキュアであることを保証します。Snyk は、AI エージェントが生成したものをリアルタイムで検証し、脆弱性やセキュアでない依存関係がリポジトリに到達する前に検出します。これは、AI がコードを記述する速度に合わせて構築されたセキュリティです。人がかつて記述していた速度に合わせたものではありません。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Thales</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise と統合された Thales AI Security Fabric は、エージェント型 AI のインタラクション全体にわたって可視性、ランタイム保護、一元化されたガバナンスを提供します。組織は、エージェント型 AI を試験運用から本稼働に移行し、きめ細かなアクセス ポリシーを適用して、重要なデータアセットを実行環境で直接保護できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Transmit Security</strong><span style=\"vertical-align: baseline;\">: Gemini Enterprise を基盤として構築された Transmit Security Agent Intelligence は、顧客向けアプリケーションとやり取りを行うエージェント型アクティビティを特定します。ユーザーがタスク、トランザクション、権限を AI エージェントに委任することが増えるにつれ、組織は、そのアクティビティの内容、発生元、意図を明確に把握する必要があります。こうしたコンテキストを把握することで、企業は正常なエージェントと悪意のあるエージェントを見分け、許可すべきものとブロックすべきものを判断し、正当な取引を制限することなくリスクを未然に防ぐことができます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Zscaler</strong><span style=\"vertical-align: baseline;\">: Zscaler Risk360 は、既存の Zscaler のデプロイからデータを取り込み、サイバーリスクを定量化し、リスク ポスチャーの詳細なビューを作成して、リスクを軽減するための明確な分析情報を提示する、包括的かつ実用的なフレームワークを提供します。Risk360 Agent は、Gemini Enterprise を使用した ZAgent フレームワーク上に構築された AI 搭載コンパニオンです。自然言語によるやり取りを使用して、Zscaler とパートナーからのシグナルの統合、ゼロトラスト リスクの分析、財務的影響の定量化、緩和策の推奨、意思決定に役立つ分析情報を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">パートナーが構築したエージェントやコネクタのエコシステムが拡大する中、Gemini Enterprise は、お客様がすでに利用しているセキュリティ ツールと連携し、それらを基盤としてカスタム エージェント型ワークフローを構築できるようにします。</span><a href=\"https://console.cloud.google.com/marketplace/browse?filter=category:ai-agent\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Marketplace</span></a><span style=\"vertical-align: baseline;\"> で、現在利用可能なセキュリティ エージェントを今すぐご確認ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">セキュリティおよび ID パートナーシップ担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vineet Bhan</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">セキュリティ担当パートナー エンジニアリング責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ashish Verma</strong></p></div>"
