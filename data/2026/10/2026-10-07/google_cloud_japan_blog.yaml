    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 25 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/alloydbs-agentic-database-architecture?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データベース エンジニアはキャリア全体を通して、ある 1 つの課題に取り組んできました。それは、データを保持する記録システムの信頼性を損なうことなく、OLTP ワークロードをどのようにスケールするかということです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Exadata は、データベース下部のスケールアウト ストレージ階層にクエリをオフロードすることで、ネットワークのボトルネックを排除し、この課題を解決しました。Azure SQL Hyperscale は、共有ブロック サーバーを使用して、数十のリードレプリカにスケールアウトしました。Aurora は、ログの適用処理を分散ストレージ ノードにオフロードし、複数の PostgreSQL ノードにわたる読み取り処理のスケーリングを実現しました。一方、新しいアーキテクチャでは、従来のオブジェクト ストレージにデータを永続化し、その手前にプロビジョニングされたキャッシュ階層を配置しています。これにより、ホットデータのレイテンシは抑制できるものの、キャッシュミスが発生するたびに長いレイテンシが発生します。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらのアーキテクチャはどれも、スケール、レイテンシ、分離という 3 つの特性のうち、少なくとも 1 つ、場合によっては 2 つの制約を本質的に抱えています。たとえば、共有ブロック サーバー上に構築されたアーキテクチャでは、ブロック サーバーで I/O が必然的にボトルネックになるため、スケーラビリティが損なわれます。また、レプリケーション トラフィックが急増するたびに本番環境のワークロードがスロットリングされるため、分離も損なわれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうしたトレードオフの中には、設計当初は実際に妥当だったものもあり、40 年間にわたってエンタープライズ データベース ワークロードの要件を満たしてきました。しかし、エージェントの時代においては、このような妥協はもはや通用しません。エージェント ワークロードは動的に生成されるため、事前に検証することはできません。そのため、ミッション クリティカルなシステムから分離することが、ビジネスの継続性を確保するうえで不可欠です。エージェント ワークロードは、データベース エンジンとそのすべてのインデックスの能力を最大限に活用して初めて実現できる低レイテンシを必要とします。同時に、単一のデータベースでは前例のない、まったく新しいレベルの弾力的なスケーリングも求められます。具体的には、単一のデータベースに対して数秒以内に 1,000 個のコンピューティング ノードを要求し、1 分以内に処理を終了するような、エージェントのバーストに対応できるスケーリングです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">真のエージェント型データベース アーキテクチャに必要な 3 つの原則</strong></h3>\n<p><span style=\"vertical-align: baseline;\">エージェントの時代には、3 つの基本原則によって定義される新しいエージェント型データベース アーキテクチャが必要であると Google は考えています。エージェント型データベース アーキテクチャがその真価を発揮するには、これら 3 つの条件すべてを満たすことが不可欠です。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">原則: 分離 - 設計レベルでの分離でありながら、リアルタイムなデータアクセスを実現。</strong><span style=\"vertical-align: baseline;\">エージェントは、プライマリ クラスタとデータベース コンポーネントを共有しないデータパスを介して、1 秒未満の更新頻度で本番環境のライブデータを読み取る必要があります。リアルタイムとは、古いコピーやブランチではなく、秒単位で更新される最新のデータを意味します。これは割り当てではなく、物理的な分離です。リソースを共有するということは、運命を共にすることを意味するからです。その境界線はストレージ レイヤまで達しているため、設計レベルでリソースの競合を排除しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">原則: レイテンシ - 1 ミリ秒未満のベースライン I/O。</strong><span style=\"vertical-align: baseline;\">運用ワークロードでは 1 ミリ秒未満のブロック I/O が求められますが、エージェントでもその基準は変わりません。コンピューティング ノードは DRAM とローカル SSD を利用して高速化を実現していますが、キャッシュミスが発生してリモート ストレージへアクセスする場合であっても、アプリケーションかエージェントかを問わず、1 ミリ秒未満で処理を完了できるストレージ設計が求められます。パフォーマンスが桁違いに低下するアーキテクチャは、エージェントにとって根本的に使い物になりません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">原則: スケール - エージェント スケールのコンピューティングと I/O。</strong><span style=\"vertical-align: baseline;\">エージェントのスケールは、瞬発的かつ一時的でありながら、極めて大規模という特徴を同時に持ちます。データベース コンピューティング ノードは、数秒でのスピンアップ、数千台へのスケール、短時間でのバースト実行、エージェントの処理終了後の自動的なゼロへのスピンダウンを行う必要があります。本番環境に一切影響を与えずに、データベースのコンピューティングと I/O を数千ノード規模へ即座にスケールさせることは、従来のデータベースの常識では不可能なことでした。エージェントの動的な性質を考えると、コンピューティング、ストレージ I/O、その間にあるキャッシュ階層にいたるまで、スタック全体における事前プロビジョニングは現実的ではありません。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">重要なのは、エージェント アーキテクチャは、これら 3 つの原則をすべて同時に満たす必要があるということです。こうしたアーキテクチャにより、エージェントは本番環境の安定性を損なうことなく、ライブ運用データ、つまり企業の実体に直接アクセスして処理を行うことができます。その結果、以下のような劇的な変化がもたらされます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">連動障害がない:</strong><span style=\"vertical-align: baseline;\"> ビジネスを運営するエンジンと、その上で推論を行うエージェント フリートが完全に分離されているため、エージェントが本番環境に影響を与える経路が排除されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">容量予測が不要:</strong><span style=\"vertical-align: baseline;\"> 真の弾力性により、予測不可能なエージェントの急増に備えて事前プロビジョニングを行う煩わしさが解消されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セマンティクスの妥協がない:</strong><span style=\"vertical-align: baseline;\"> エージェントに対して制限される機能はありません。すべての推論ステップにおいて、リレーショナル SQL、ハイブリッド検索（ベクトル、全文、空間）、そしてインデックスの機能を最大限に活用できます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">AlloyDB のエージェント アーキテクチャ</strong></h3>\n<p><a href=\"https://cloud.google.com/blog/products/databases/announcing-postgresql-for-agents-in-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB の新しいエージェント型データベース アーキテクチャ</span></a><span style=\"vertical-align: baseline;\">は、これら 3 つの原則をすべて満たす初のシステムです。Google は、ストレージ、ネットワーク、コンピューティング、データベースにわたって、これをゼロから構築し、以下を実現しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">分離によって設計レベルでの障害の連鎖を回避:</strong><span style=\"vertical-align: baseline;\"> トランザクション本番環境クラスタは、エージェント ワークロードから完全に分離され、事前プロビジョニングされた専用インフラストラクチャ上で実行されます。エージェントは、Model Context Protocol（MCP）を介して、本番環境とは別の専用の Colossus ストレージ セグメントから直接読み取る、マイクロ VM ベースの AlloyDB ノードの独立したエフェメラル プールに接続します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">予測可能な 1 ミリ秒未満のストレージ I/O:</strong><span style=\"vertical-align: baseline;\"> すべてのストレージ読み取りは、Google の Colossus ストレージ システムによって直接処理され、1 ミリ秒未満のベースライン レイテンシを継承します。これにより、コールド キャッシュミスによるパフォーマンスの急激な低下がなくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ゼロから数千ノードへの真のコンピューティング スケーリング:</strong><span style=\"vertical-align: baseline;\"> エージェント プールは、エージェント アクティビティのバーストに対応して、ゼロから数千のノードへと迅速にスケールアップし、タスクが完了した瞬間にゼロにスケールダウンします。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_W9G0CoR.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェントは、1 秒未満の更新頻度で本番環境データをクエリし、PostgreSQL エンジンのすべての機能（ポイント検索、インデックス トラバーサル、ベクトル、全文検索、空間検索、カラム型スキャン、レイクハウス全体の連携クエリ）を駆使して、推論ループを強化できます。</span></p>\n<p><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSfYv_zv2CI9L6xZxkExZai_jG-eiz8iEYPfwLFwaIatZdYCrA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">エージェント向け AlloyDB PostgreSQL のプレビュー</span></a><span style=\"font-style: italic; vertical-align: baseline;\">に参加して、データの規模を問わず本番環境データ上でエージェントを実行しましょう。その全機能について詳しくは、</span><a href=\"https://cloud.google.com/blog/ja/products/databases/announcing-postgresql-for-agents-in-alloydb\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">関連するお知らせのブログ記事</span></a><span style=\"font-style: italic; vertical-align: baseline;\">をご覧ください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">既存のアーキテクチャが 3 つの原則をすべて満たせない理由</strong></h3>\n<p><span style=\"vertical-align: baseline;\">従来型および新興の運用データベースは、3 つのアーキテクチャ パラダイムのいずれかを採用することでスケーリングを図っています。自律型 AI エージェントの要件に照らして評価すると、どのパラダイムにも構造上の根本的な限界があり、3 つの原則を同時に満たすことは不可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">独立したレプリカ（シェアードナッシング ストレージ）</span></p>\n<p><span style=\"vertical-align: baseline;\">従来のリレーショナル アーキテクチャでは、プライマリ インスタンスから専用のレプリカ データベースにレプリケーション ログをストリーミングすることで読み取りをスケールします。各レプリカ データベースは、それぞれ専用のローカル ストレージまたはアタッチされたブロック ストレージを備えています。これは「原則: 分離」を満たしています。つまりレプリカはプライマリ クラスタと物理リソースを共有せず、継続的なログ レプリケーションにより、準リアルタイムの最新性が維持されます。また、「原則: レイテンシ」も満たしています。専用のローカル ストレージにより、予測可能な 1 ミリ秒未満の読み取りレイテンシが保証されます。しかし、「原則: スケーリング」は満たしていません。スケーリングには、新しいレプリカをプロビジョニングし、数百ギガバイトまたはテラバイトのストレージをリハイドレーションする必要があります。これらすべての処理には数時間かかります。これでは、秒単位で発生するエージェントの爆発的な推論バーストには対応できません。さらに、静的にプロビジョニングされたコンピューティングとストレージは、エージェントの実行が完了した後も、アイドル状態でコストが発生し続けます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">分離された共有ストレージ サーバー</strong></h3>\n<p><span style=\"vertical-align: baseline;\">2 つ目のアプローチは、ステートレス コンピューティング ノードを、永続性とレプリケーションを管理し、ブロック書き込みをオフロードする可能性のあるカスタム ストレージ サーバーの共有マルチテナント階層から切り離すことです。このアプローチは、「原則: レイテンシ」を満たします。最適化されたストレージ サーバーへの読み取りアクセスは、常に安定した低いレイテンシで処理されます。しかし、「原則: 分離」は満たしていません。すべてのレプリカがプライマリと同じサーバーから読み取るため、エージェント I/O が本番環境 I/O と直接競合し、障害の連鎖のリスクが生じるためです。また、「原則: スケール」も満たしていません。データがコピーされないため、ステートレス コンピューティング レプリカは迅速にスピンアップするものの、ストレージ I/O の合計帯域幅が、事前にプロビジョニングされたストレージ階層の容量に制限されるためです。基盤となる I/O 容量をスケールせずにコンピューティング ノードを追加しても、ストレージの処理能力が飽和し、スロットリングを加速させるだけです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">共有ブロック サーバーを使用したオブジェクト ストレージ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">3 つ目の新しいアプローチは、汎用オブジェクト ストレージでデータの耐久性を確保し、ブロック サーバーの共有階層からブロック読み取りを行うというものです。オブジェクト ストレージからのランダム読み取りには数十ミリ秒かかります。これは従来のデータベース ストレージより桁違いに遅く、少なくとも 25 年前のエンタープライズ向けディスクアレイと比べてもさらに遅いレベルです。そのため、ブロック サーバーにホットデータを保持させることで、低レイテンシでのデータ提供を実現しています。このアプローチは、「原則: レイテンシ」を満たしますが、1 つ注意点があります。それは、ブロック サーバーでキャッシュミスが起きると、許容できないほど高いレイテンシでオブジェクト ストレージまでフォールバックが発生してしまう点です。一方で、「原則: 分離」を満たしていません。レプリカは本番環境とブロック サーバーを共有しているためです。エージェント I/O と本番環境 I/O は同じ処理容量を使用します。そのため、その容量が枯渇したりスロットリングされたりすると、エージェントだけでなく本番環境にも影響が及びます。また、共有ストレージ サーバーと同じ理由で、「原則: スケール」も満たしていません。レプリカはすぐに起動しますが、ブロック サーバーがバーストに合わせて I/O をスケールしないためです。</span></p>\n<p><span style=\"vertical-align: baseline;\">このファミリーの一部のアーキテクチャでは、Apache Spark などの分析エンジンがデータベース エンジンをバイパスして、基盤となるオブジェクト ストレージを直接読み取ることもできます。分析ワークロードの場合、これは価値があり、十分に現実的なアプローチです。しかし、エージェントには低レイテンシの検索が不可欠です。インデックス、ポイント検索、ベクトル検索を排除すると、ブルート フォース テーブル スキャンが余儀なく行われ、レイテンシが急増し、エージェントが検索と推論のループを実行できなくなります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">既存アーキテクチャの評価</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google は、共有ブロック サーバーを備えたオブジェクト ストレージ アーキテクチャを使用する市販のサービスを対象に、スケーリングの限界と本番環境の分離の両方を検証する評価を行いました。利用可能な DRAM よりも大きなデータセットに対して、同時にインデックス検索を実行しました。1 つのリーダー インスタンスから始めて、最大 8 つのリードレプリカを追加してワークロードをスケールしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">物理リソースを共有するアーキテクチャでは、リードレプリカを追加してエージェントをスケールすると、レプリカとプライマリの両方のパフォーマンスが急速に低下します。以下のグラフに示すように、Google のテストでは、レプリカを追加してもスループットの増加は 2 倍未満にとどまりました。レプリカ 4 台でピークに達した後、共有ブロック サーバーの帯域幅が飽和状態になると、スループットは低下しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_sz3VF5H.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">プライマリ データベースへの影響は即座に、かつ深刻な形で現れました。レプリカが追加されると、プライマリのスループットは 75% 以上も急落したのです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_AJe6Y3V.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">つまり、従来型と新興型のどちらのアーキテクチャも、エージェントが求める規模に対応できないということです。本番環境システムの安定性を損なうことなくそれを実現することは、到底不可能です。</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">原則に基づく評価</span></strong></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_ErZMLBi.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">* 部分的に対応: ホットデータはブロック サーバーから低レイテンシで提供されますが、ブロック サーバーでキャッシュミスが発生すると、オブジェクト ストレージへのアクセスが生じて数十ミリ秒のレイテンシが発生します。</span></p>\n<p><span style=\"vertical-align: baseline;\">いずれの場合も、この課題は構造的なものであり、単にチューニングで解決できる問題ではありません。レプリケーションは、各レプリカに専用ストレージを割り当てることで分離を実現します。そのため、そのストレージへのデータ同期にかかる時間よりも短い時間でレプリカを追加することはできません。共有ストレージ サーバーは、ストレージを共有することでコンピューティングを迅速に追加できますが、I/O を分離することもスケールすることもできません。オブジェクト ストレージ上のブロック サーバーは、プロビジョニングされた階層でレイテンシを抑制できるものの、分離もバーストもできず、キャッシュミスが発生するたびにオブジェクト ストレージへのアクセスが生じてしまいます。どのアプローチも、あるレイヤで問題を解決したとしても、別のレイヤでその代償を払うことになります。3 つの原則をすべて同時に満たすには、コンピューティング、ネットワーク、ストレージにわたるデータベース アーキテクチャを再考する必要があります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AlloyDB をスタック全体でどのように構築したか</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB のエージェント型データベース アーキテクチャは、Google のデータ、AI、インフラストラクチャ スタック（AI モデル、データベース エンジン、および分析エンジン、さらにはストレージ、ネットワーキング、コンピューティング インフラストラクチャ）全体にわたって垂直統合されています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_DPg3jLH.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">ストレージ: 基盤としての Colossus</strong></p>\n<p><span style=\"vertical-align: baseline;\">永続レイヤでは、AlloyDB は Google のエクサバイト規模の分散ストレージ システムである Colossus を基盤としています。Colossus は、Google 検索、YouTube、Gmail、Google ドライブ、Spanner、Bigtable を支えています。1 つの</span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/a-peek-behind-colossus-googles-file-system\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Colossus クラスタ</span></a><span style=\"vertical-align: baseline;\">は、エクサバイト規模のストレージと数万台のマシンにスケールします。Spanner では、Colossus 上に直接構築されたトランザクション データベースが数千ノードまでスケールできることを実証しました。新しい AlloyDB アーキテクチャは、同じ基盤を新たな課題、すなわちエージェントに適用します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Colossus には、AlloyDB がこれら 3 つの原則を満たすための、3 つの特性があります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">1 ミリ秒未満の直接 I/O:</strong><span style=\"vertical-align: baseline;\"> Colossus は、読み取りレイテンシを最小限に抑えるように設計されています。Colossus ストリームを開くデータベース ノードは、データが物理的に存在する場所を記述したハンドルを受け取ります。承認とメタデータの解決は、ストリームの作成時に 1 回しか行われません。それ以降の読み取りはすべて、最適化されたネットワーク プロトコルを介して、データを保持するディスクに対して直接行われます。その結果、データベースのすべてのデータで 1 ミリ秒未満のレイテンシが実現します。ウォームアップする中間層も、キャッシュミスを起こすような層もありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">圧倒的なスループット:</strong><span style=\"vertical-align: baseline;\"> Colossus は、帯域幅をプロビジョニングする必要がなく、同時ホスト数に制限がないため、単一の AlloyDB データベースに対して最大 15 TB/秒の総スループットと 2,000 万の秒間クエリ数を実現します。Colossus のスケールから見れば、AlloyDB エージェント ノードのフリートがもたらす負荷は、ストレージのサイズ調整が必要になるようなものではありません。それは、このストレージがすでに処理している負荷のごく一部にすぎないからです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">物理セグメントのパーティショニング:</strong><span style=\"vertical-align: baseline;\"> AlloyDB は、本番とは別の Colossus セグメントからエージェントにサービスを提供するため、エージェントの I/O が本番環境のデータパスと競合することはなく、意図的に本番環境のデータパスから分散されます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">コンピューティング、ネットワーク、ストレージのいずれのデータパスにおいても、エージェントがデータベース コンポーネントを本番環境と共有することはありません。</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">ネットワーク: Jupiter によるスケーラブルな帯域幅</span></strong></p>\n<p><span style=\"vertical-align: baseline;\">コンピューティングとストレージは、Google の大容量データセンター ネットワークである Jupiter によって結び付けられています。1 つの Jupiter ファブリックが 10 万台以上のサーバーを 13 ペタビット/秒の二分割帯域幅で接続します。これは、地球上のすべての人がビデオ通話を行うのに十分な帯域幅です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Jupiter は、ネットワーキング ファブリック全体で予測可能な低レイテンシと高い二分割帯域幅を提供します。そのため、エージェント ノードをクラスタ内のどこにでも柔軟に配置でき、一元化されたストレージに常にアクセスできます。エージェント プールがゼロから数千ノード規模にスケールするにつれて、基盤となる相互接続の容量が、配置上のボトルネックを発生させることなく、増大するトラフィックを吸収します。</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">コンピューティング: 柔軟でサーバーレスな PostgreSQL と分析</span></strong></p>\n<p><span style=\"vertical-align: baseline;\">コンピューティング レイヤでは、エージェントが MCP を介して AlloyDB のエージェント プールに接続します。エージェント プールを構成する AlloyDB エージェント ノードは、データベースの秒単位の最新状態に、読み取り専用でアクセスできます。このレイヤは、以下の機能を提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マイクロ VM 分離:</strong><span style=\"vertical-align: baseline;\"> 各エージェント ノードは、軽量かつセキュアなマイクロ VM 内で実行される、完全に機能する AlloyDB for PostgreSQL データベース エンジンです。これらのインスタンスは、互いに完全に分離されており、専用のプライマリ クラスタからも分離されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">迅速なスピンアップとスケーリング:</strong><span style=\"vertical-align: baseline;\"> エージェント ノードは、エージェントからのリクエストに応じてプロビジョニングされ、エージェントが処理を終了すると自動的に停止します。バーストが発生すると、AlloyDB は数千のエージェント ノードを迅速にプロビジョニングし、数百万の同時エージェントにサービスを提供します。エージェントが処理を終了すると、それらを解放します。課金はエージェント ノードのアクティビティの秒単位で行われるため、1,000 個のノードを数十秒間使用するバーストでは、ジョブが消費したリソースに対してのみ課金され、それ以上のコストは発生しません。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">一方、本番環境クラスタは、専用インフラストラクチャ上に事前プロビジョニングされ、記録システムに合わせてサイジングされた、従来通りの状態のまま維持されます。エージェント ノードは Colossus から直接データを読み取るため、1 秒未満の更新頻度で、一貫した本番環境のデータを参照できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント プール以外にも、BigQuery と Spark は本番環境クラスタから同じように分離された Colossus から AlloyDB データを読み取ることができるため、エージェントは Lakehouse Federation を使用して、リアルタイムの運用データを大規模な Lakehouse データセットと結合できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">AlloyDB の新しいエージェント データベース アーキテクチャは、Google 規模のストレージ、ネットワーク、コンピューティング レイヤを基盤とすることで、際立った目標を達成しています。それは「データのみを共有し、それ以外は何一つ共有しない」という目標です。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AlloyDB のエージェント型データベース アーキテクチャの評価</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google は、利用可能な DRAM よりも大きなデータセットに対して同時インデックス検索を実行し、フルスタック全体におけるスケーラビリティを検証することで、AlloyDB の性能を評価しました。エージェント ワークロードを、単一のエージェント ノード（従来のリードレプリカではなく、エージェント プール内の独立したデータベース インスタンス）から開始し、単一のデータベース上で数千ノードまで動的にスケールしました。その際、エージェント全体の合計スループットと、本番環境への影響を測定しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このテストでは、エージェント ノードを 1 つから 10 個に増やすと、スループットが 3,900 QPS から 4.1 万 QPS へとほぼ完全に比例して向上しました。さらに 2 桁上（100倍）の規模までスケールさせても、最大 1,000 ノードに達するまで、ほぼ完全に比例したパフォーマンスが得られました。Google は、以下を確認しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プライマリのパフォーマンス低下ゼロ:</strong><span style=\"vertical-align: baseline;\"> エージェント ノードを 1 から 1,000 にスケールしても、プライマリ クラスタのパフォーマンスに</span><strong style=\"vertical-align: baseline;\">測定可能な影響は生じませんでした</strong><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">膨大なスループット:</strong><span style=\"vertical-align: baseline;\"> 合計スループットが動的に 773 倍の </span><strong style=\"vertical-align: baseline;\">300 万 QPS</strong><span style=\"vertical-align: baseline;\"> にスケールされ、1,000 台のコンピューティング ノードにわたって Colossus で </span><strong style=\"vertical-align: baseline;\">800 万 IOPS 以上</strong><span style=\"vertical-align: baseline;\">を達成しました。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"7\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/7_C0rtDwX.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2,100 のエージェント ノードでテーブル全体のスキャンを同時に実行する同様のベンチマークでは、合計スキャン スループットが </span><strong style=\"vertical-align: baseline;\">1 秒あたり約 1 テラビット</strong><span style=\"vertical-align: baseline;\">を超えました。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント プールは本番環境クラスタと物理インフラストラクチャを共有しないため、チームは本番環境システムを危険にさらすことなく、推論フリートを数千ノード規模にスケールできます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">3 つの原則すべてを設計に組み込む</strong></h3>\n<p><span style=\"vertical-align: baseline;\">次の表は、AlloyDB のアーキテクチャが 3 つの原則をどのように満たしているかを示しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"8\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/8_OwYnVhS.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェント型データベース アーキテクチャには、これら 3 つの基本要素が不可欠です。すなわち、Colossus の特性を備えたストレージ、コンピューティングとストレージをボトルネックなしに接続するネットワーク、そしてエージェントの規模に合わせてプロビジョニングと解放ができるコンピューティングです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、Google 検索、YouTube、Gmail を稼働させるために、20 年以上かけてまさにその基盤を構築してきました。現在、これは Google のエージェント型データベース アーキテクチャの基盤となっています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">本番環境に影響を与えることなく、エージェントにライブデータを提供</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AI を活用した開発に取り組むすべての組織が、ある共通のジレンマに直面しています。それは、ビジネスを支えるシステムを危険にさらすことなく、エージェントに対して本番環境のライブデータへの完全なアクセス権をどのように付与するか、という問題です。これまでは、アプリケーションのニーズではなく、アーキテクチャの制約によって、その選択を強いられていました。エージェントにデータベースへの直接アクセスを許可すると、ミッション クリティカルなシステムを、予測不可能な負荷、深刻なリソース競合、本番環境の停止のリスクにさらすことになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これら 3 つの原則に基づいて構築されたアーキテクチャは、こうした妥協を完全に排除します。エージェントは、1 秒未満の更新頻度を保った本番環境のライブデータに基づいて推論します。そして、すべてのインデックス、ベクトル、全文検索、空間検索、SQL の全機能など、エンジンのフル機能を 1 ミリ秒未満の I/O で自由自在に駆使できます。このアーキテクチャは、エージェントの要求に応じて数千もの分離されたノードに動的にスケールし、処理が終了したらゼロにスケールダウンします。その間も、コア トランザクション ワークロードは影響を受けることはありません。共有コンポーネントも、共有割り当ても存在せず、連動障害のリスクもないからです。エージェントは、ビジネスの継続性を損なうことなくビジネスにイノベーションをもたらすことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この優れた特性が、本番環境データを参照する他のすべてのシステムにも適用されます。レポート、分析、アプリケーションは、本番環境を危険にさらすことなくライブデータを自由に読み取ることが可能になり、50 年間にわたってオペレーショナル データベースを縛り続けてきた制約が、ついに解消します。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業の記録システム内のデータは、その企業にとって最も重要なものです。この基盤の上に構築されたそのデータは、ついに最大限に活用できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">制約なきデータベースへ。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳細については、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/postgresql-agents-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">ページをご覧ください。</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSfYv_zv2CI9L6xZxkExZai_jG-eiz8iEYPfwLFwaIatZdYCrA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらから登録</span></a><span style=\"vertical-align: baseline;\">すると、今すぐご利用いただけます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- データベース エンジニアリング担当バイス プレジデント、Amit Ganesh</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- データベース、エンジニアリング担当バイス プレジデント、Sailesh Krishnamurthy</strong></p></div>"
