    "summary": "<h2 class=\"release-note-product-title\">Apigee hybrid</h2>\n<h3>Announcement</h3>\n<h3 id=\"v1149\">v1.14.9</h3>\n<p>On October 7, 2026 we released an updated version of the Apigee hybrid software, v1.14.9.</p>\n<ul>\n<li>For information on upgrading, see <a href=\"https://docs.cloud.google.com/apigee/docs/hybrid/v1.14/upgrade\">Upgrading Apigee hybrid to version v1.14.9</a>.</li>\n<li>For information on new installations, see <a href=\"https://docs.cloud.google.com/apigee/docs/hybrid/v1.14/big-picture\">The big picture</a>.</li>\n</ul>\n<aside class=\"note\"><strong>Note:</strong><span> This is a patch release: The container images used in patch releases are integrated with the Apigee hybrid Helm charts. Upgrading to a patch via the Helm chart automatically updates the images. No manual image changes are typically needed. For information on container image support in Apigee hybrid releases, see <a href=\"https://docs.cloud.google.com/apigee/docs/release/apigee-release-process#apigee-hybrid-container-images\">Apigee release process</a>.</span></aside>\n<h3>Fixed</h3>\n<h4 id=\"fixed_in_this_release\">Fixed in this release</h4>\n<table>\n<thead>\n<tr>\n<th>Bug ID</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>565072374</strong></td>\n<td><strong>Fixed an issue where <code>VerifyJWT</code> policies using a JWKS <code>uriRef</code> could return <code>steps.jwt.NoMatchingPublicKey</code> on the first request after the 5-minute JWKS cache TTL expired when the identity provider rotated keys. The cache now refreshes synchronously upon expiration.</strong></td>\n</tr>\n<tr>\n<td><strong>564969400</strong></td>\n<td><strong>Fixed an issue where variables initialized from an empty <code>&lt;Value/&gt;</code> element in <code>AssignMessage</code> (<code>AssignVariable</code>) were not treated as empty strings when referenced in message template functions such as <code>replaceAll</code>.</strong></td>\n</tr>\n<tr>\n<td><strong>558888960</strong></td>\n<td><strong>Fixed an issue in distributed tracing where the target URL was omitted from outbound target request span attributes after a request-flow policy step executed.</strong></td>\n</tr>\n<tr>\n<td><strong>554114419</strong></td>\n<td><strong>Apigee hybrid now allows policies to modify HTTP/2 request pseudo-headers (<code>:path</code> and <code>:authority</code>) when communicating over HTTP/2.</strong></td>\n</tr>\n<tr>\n<td><strong>548763108</strong></td>\n<td><strong>Hardened Message Processor outbound HTTP validation to block requests to internal Kubernetes cluster hostnames (<code>*.svc.cluster.local</code>).</strong></td>\n</tr>\n<tr>\n<td><strong>513032450</strong></td>\n<td><strong>Fixed an issue where <code>apigee-connect-agent</code> control-plane connections could hang for up to 2 hours when silently dropped by a network intermediary by restoring a 15-second TCP keep-alive.</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>Security</h3>\n<table>\n<thead>\n<tr>\n<th>Bug ID</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-asm-ingress</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-33818\">CVE-2026-33818</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-39821\">CVE-2026-39821</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56853\">CVE-2026-56853</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56858\">CVE-2026-56858</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56859\">CVE-2026-56859</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56860\">CVE-2026-56860</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56862\">CVE-2026-56862</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56864\">CVE-2026-56864</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56865\">CVE-2026-56865</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-asm-istiod</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-33818\">CVE-2026-33818</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-39821\">CVE-2026-39821</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56853\">CVE-2026-56853</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56858\">CVE-2026-56858</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56859\">CVE-2026-56859</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56860\">CVE-2026-56860</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56862\">CVE-2026-56862</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56864\">CVE-2026-56864</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56865\">CVE-2026-56865</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-connect-agent</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-fluent-bit</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-14456\">CVE-2026-14456</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-14457\">CVE-2026-14457</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-18798\">CVE-2026-18798</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-54874\">CVE-2026-54874</a> </li><li><a hre