detail/CVE-2026-56864\">CVE-2026-56864</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56865\">CVE-2026-56865</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-81870\">CVE-2026-81870</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-mart-server</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2025-46392\">CVE-2025-46392</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-13506\">CVE-2026-13506</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-19032\">CVE-2026-19032</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-49844\">CVE-2026-49844</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-68497\">CVE-2026-68497</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-83557\">CVE-2026-83557</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-8763\">CVE-2026-8763</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-mint-task-scheduler</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2025-46392\">CVE-2025-46392</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-13506\">CVE-2026-13506</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-19032\">CVE-2026-19032</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-49844\">CVE-2026-49844</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-68497\">CVE-2026-68497</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-83557\">CVE-2026-83557</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-8763\">CVE-2026-8763</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-open-telemetry-collector</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-43871\">CVE-2026-43871</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-81870\">CVE-2026-81870</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-81871\">CVE-2026-81871</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-81872\">CVE-2026-81872</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-operators</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-prom-prometheus</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-33818\">CVE-2026-33818</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-39821\">CVE-2026-39821</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-46600\">CVE-2026-46600</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56853\">CVE-2026-56853</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56858\">CVE-2026-56858</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56859\">CVE-2026-56859</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56860\">CVE-2026-56860</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56862\">CVE-2026-56862</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56864\">CVE-2026-56864</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56865\">CVE-2026-56865</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-prometheus-adapter</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-81870\">CVE-2026-81870</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-runtime</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2025-46392\">CVE-2025-46392</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-13506\">CVE-2026-13506</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-19032\">CVE-2026-19032</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-49844\">CVE-2026-49844</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-68497\">CVE-2026-68497</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-83557\">CVE-2026-83557</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-8763\">CVE-2026-8763</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-synchronizer</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-13506\">CVE-2026-13506</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-19032\">CVE-2026-19032</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-49844\">CVE-2026-49844</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-68497\">CVE-2026-68497</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-83557\">CVE-2026-83557</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-8763\">CVE-2026-8763</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-udca</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-81870\">CVE-2026-81870</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n<tr>\n<td><strong>N/A</strong></td>\n<td><strong>Security fixes for <code>apigee-watcher</code>.</strong> <br />This addresses the following vulnerabilities: <ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84303\">CVE-2026-84303</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a> </li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a> </li></ul></td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Feature</h3>\n<p><strong>Anthropic's Claude Haiku 5.5</strong></p>\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/haiku-5-5\">Claude Haiku 5.5</a>\nis available in Model Garden.</p>\n<h3>Fixed</h3>\n<p><strong>CodeMender updates (v0.13.0)</strong></p>\n<p>This release introduces updates to CodeMender:</p>\n<ul>\n<li><strong>Consistent finding deduplication</strong>: Improved finding deduplication consistency across repeated <code>cm find</code>, <code>--deep</code>, <code>--diff</code>, and <code>--parallel</code> scans.</li>\n<li><strong>Bug fixes</strong>:\n<ul>\n<li>Fixed an issue where deduplicated findings could appear in <code>cm report --status DISMISSED</code>.</li>\n<li>Improved local state reliability during concurrent <code>cm find --diff</code> and <code>cm find --deep</code> scans.</li>\n<li>Updated streaming error handling so non-retryable errors fail immediately instead of retrying.</li>\n<li>Ensured local session state and logs are saved cleanly when a session is interrupted (<code>Ctrl+C</code>).</li>\n</ul></li>\n</ul>\n<p>For more information, see the <a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/codemender\">CodeMender documentation</a>.</p>\n<h2 class=\"release-note-product-title\">Google Kubernetes Engine</h2>\n<h3>Feature</h3>\n<p>The microVM sandbox type is now Generally Available (GA) with GKE Sandbox in\nclusters that run version 1.37.0-gke.4713000 and later. MicroVM sandboxes\nprovide hardware virtualization and isolation for untrusted workloads, AI agent\nruntimes, and multi-tenant environments. GKE microVM sandboxes use Kata\nContainers and Cloud Hypervisor to provide this isolation while maintaining a\nfull Linux kernel that includes standard Linux features</p>\n<p>For more information, see the\n<a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods\">GKE Sandbox</a>\ndocumentation.</p>"
