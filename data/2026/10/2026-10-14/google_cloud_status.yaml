    "title": "RESOLVED: Google Cloud Storage (GCS) customers experienced elevated latencies and error rates when performing upload or write operations."
    "link": "https://status.cloud.google.com/incidents/mSFVt6PiP557bjRyYsut"
    "published": "2026-10-14 16:15:32"
    "fetched": "2026-10-14 20:14:26"
    "summary": "<p> Incident began at <strong>2026-10-08 04:00</strong> and ended at <strong>2026-10-09 09:46</strong> <span>(all times are <strong>US/Pacific</strong>).</span></p><div class=\"cBIRi14aVDP__status-update-text\"><h2>Preliminary Incident Report</h2>\n<p>We sincerely apologize for the disruption this incident caused to your business. We know how much you rely on Google Cloud, and we regret the impact on your productivity. We are working to address the root cause and prevent this from occurring in the future.</p>\n<p>Please note, this information is based on our best knowledge at the time of posting and is subject to change as our investigation continues. A final Incident Report with preventative actions will be posted once our investigation is complete.</p>\n<p>If you have experienced impact outside of what is listed below, please reach out to Google Cloud Support using <a href=\"https://cloud.google.com/support\">https://cloud.google.com/support</a></p>\n<h2>Date/Time of the Issue (All time US/Pacific)</h2>\n<p>Incident Start: 08 October 2026 04:00</p>\n<p>Incident End: 08 October 2026 16:30</p>\n<p>Duration: 12 hours, 30 minutes</p>\n<h2>Summary</h2>\n<p>On Thursday, 08 October 2026, Google Cloud Storage experienced elevated write latency and write error rates in the us-central1 region for a duration of 12 hours, 30 minutes. We are taking immediate steps to ensure this doesn’t happen again.</p>\n<h2>Preliminary Root Cause</h2>\n<p>Google Cloud Storage relies on a highly distributed backend architecture to process and store incoming data. During the incident window, specific storage backend nodes within the us-central1 region experienced a localized capacity shortfall.</p>\n<p>The sequence of events leading to customer impact was as follows:</p>\n<ul>\n<li>A traffic sorting optimization intended to address localized capacity constraints caused severe resource exhaustion on specific backend storage nodes in the affected region.</li>\n<li>This resource exhaustion caused backend services handling object data ingestion to begin timing out.</li>\n<li>As a result, incoming upload and write requests routed to these nodes experienced elevated latency and failed to complete, resulting in errors surfaced to customers.</li>\n<li>Concurrently, a separate issue with the underlying database service contributed to additional metadata processing errors during a portion of the incident window.</li>\n</ul>\n<p>Google engineers have begun a full root cause analysis (RCA) and will provide additional information once it is available.</p>\n<h2>Remediation</h2>\n<p>The issue was initially detected by Google engineering teams actively monitoring system telemetry early in the incident window.</p>\n<p>To mitigate the issue, Google engineers executed the following step-by-step strategy:</p>\n<ul>\n<li>Engineers initially attempted to dynamically allocate additional emergency capacity to the affected region, but this was blocked by systemic regional capacity limits.</li>\n<li>To relieve immediate pressure, engineers selectively drained traffic from the most overloaded backend storage nodes.</li>\n<li>A configuration change was deployed to disable the traffic sorting optimization, significantly reducing resource overhead on the storage backend.</li>\n<li>For the concurrent metadata issue, engineers rolled back a recent update to the underlying metadata database service.</li>\n</ul>\n<p>Once traffic levels stabilized and resource utilization returned to normal baseline levels, the previously drained nodes were restored to active service, successfully restoring normal operations.</p>\n<h2>Description of Impact</h2>\n<p>On 08 October, 2026, from 04:00 to 16:30 US/Pacific, customers utilizing the us-central1 region experienced elevated latency and error rates during Cloud Storage upload and write operations.</p>\n<ul>\n<li>Customers primarily observed HTTP 503 UNAVAILABLE errors on WriteObject operations and client-side timeouts.</li>\n<li>A minor impact was also observed on read operations during this timeframe.</li>\n<li>Cloud Storage operations in all other regions, as well as all other Google Cloud services, remained unaffected by this specific event.</li>\n</ul>\n</div><hr /><p>Affected products: Google Cloud Storage</p><p>Affected locations: Iowa (us-central1)</p>"
