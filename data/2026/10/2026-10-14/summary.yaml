"overview": |
  この日は 11 件で、新しいフロンティアモデルの提供開始、クロスクラウド分析、そしてランサムウェアとサプライチェーンの脅威分析が中心でした。モデルでは、新しいフロンティアモデル Gemini 4 Argon が Google Cloud で利用可能になりました。深さと精度の両方を備えるように学習されており、長く多段のタスクを通してコンテキストを保ちながら、その過程で強いドメイン専門性に支えられるとされています。複雑なソフトウェアビルド、細部まで詰める必要のある財務・法務の作業、CodeMender のようなサイバーセキュリティツールのデプロイといった場面で、チームが最初から最後まで集中を保てるよう助けるという位置づけです。これまで質問への回答や文章の下書きに Gemini を使ってきたチームが、数時間から数日かかっていた深く多段の作業を任せて、そのまま使える成果物を受け取れるようになり、テキスト・表・グラフ・画像が混在する長い文書を読んで出典に根拠づけられた 1 つの明快な出力にまとめられます。分析では、オープン標準によるクロスクラウドの対話型分析が紹介されました。エンジニアリングチームが拡大しワークロードごとに専用プラットフォームを採用するにつれ、企業データは複数のクラウドと業務システムに自然に分散します。従来のアーキテクチャはスケジュール実行の抽出パイプラインでリモートのデータセットを中央のステージングウェアハウスへ複製してきましたが、同期の遅れ、恒常的なストレージコスト、変動するネットワーク下り料金が生じ、上流でスキーマが変わるとパイプラインが壊れ、同期の取れないダッシュボード間で指標を突き合わせる作業に時間を取られます。BigQuery と Google Cloud のボーダーレスな Lakehouse は、オープンな Apache Iceberg REST カタログ仕様を土台に、データをコンピュートへ動かすのではなく Google Cloud のコンピュートと生成 AI をデータのある場所へ持ち込み、Databricks・Snowflake・AWS Glue をまたいでその場でクエリする方法を提供します。記事では Databricks Unity Catalog を BigQuery へフェデレーションする設定手順 (AWS Glue と Snowflake は付録) と、複数ソースを結合する単一クエリの実行が示されました。インフラの事例では、AI21 Labs が Google Cloud AI Hypercomputer を採用して AI ワークロードの起動時間を 83% 短縮したことが紹介されました。優先度の高いジョブの待ち時間は 72 時間から 12 時間に、手動のスケジューリング介入は週 20 回からゼロになっています。Jamba ファミリーを含むモデルの学習は、数千の Google Cloud A3 (NVIDIA H100) および A3 Ultra (NVIDIA H200) インスタンスをプールした 1 つの共有 GKE クラスタで動き、どのチームも割り当てられた一部のキャパシティに縛られずフリート全体を使えます。GKE でオーケストレーションする前は Slack の #gpu-resources に投稿して手動でキャパシティを調整しており、使用率が 100% 近くに張り付くと機能せず、クラスタの半分以上を一度に必要とする大規模マルチノードの学習実行が最大 72 時間ブロックされることもあったと振り返られています。データベースでは、AlloyDB AI のハイブリッド検索についての記事が公開されました。AI / RAG アプリケーションで高い検索関連性を得るには、意味を捉えるベクトル検索とキーワード精度のための全文検索 (FTS) を組み合わせる必要がありますが、難しいのは検索そのものではなく結果の統合で、距離スコアと関連性スコアを混ぜるには複雑な SQL やアプリケーション層のコード、さらには統合・スコア正規化・再ランキングのための別システムの維持が必要でした。今回の更新では、Reciprocal Rank Fusion (RRF) を活用した単一の高性能な SQL 関数への統合、単語の位置をインデックスに直接保存して低レイテンシーの関連性ランキングと効率的なフレーズマッチを実現する新しい RUM 拡張機能、ネイティブ対応した新しい BM25 インデックス、そして AlloyDB を離れずに Elasticsearch・OpenSearch・Solr のような外部クラスタへクエリできる外部検索用の外部データラッパー (FDW) が示されています。あわせて、Spanner を基盤とするサーバーレスの Lakehouse ランタイムカタログが紹介されました。Apache Iceberg のカタログはテーブルポインタの維持とアトミックコミットの処理を担い、テーブルの場所に関する信頼できる唯一の情報源になりますが、エージェントが繰り返す大量の細かいクエリに応えるには、アトミック性・整合性・可用性・同時実行性を大規模に提供する必要があります。オープンな Apache Iceberg REST カタログ仕様に準拠しつつ、実質的に無制限に拡張できる Spanner を土台とすることで、アトミックな比較交換 (CAS) によるメタデータポインタの差し替え、Tier-1 サービスとしての高可用性、カタログを支えるデータベースのスケーリングという課題に応えます。モダナイゼーションでは、Google Cloud Modernize の日本語記事が公開され、Migration Center・Google Cloud VMware Engine・Google Cloud Mainframe Modernization・新しい EKS-to-GKE Migration Agent を 1 つのポートフォリオに統合したこと、コンソール上の Modernization Hub で Java・.NET・メインフレームのコード分析と依存関係マッピングができること、Migration Center の Agentic Quick Estimator (一般提供) が RVTools などのインベントリから Compute Engine 環境の TCO を対話的に算出し数週間のスプレッドシート作業を数分に短縮すること、Rapid Migration and Modernization Program (RaMP) を通じて包括的なモダナイゼーション評価を無料で提供することが示されました。セキュリティでは、2025 年に Mandiant Consulting が対応したランサムウェアインシデントから見た戦術・技術・手順 (TTP) のレポートが公開されました。サイバーセキュリティ対策の強化、組織の復旧能力の向上、支払い金額と支払い率の低下などによりランサムウェア攻撃全体の収益性は低下しており、法執行機関の介入やアクター間の内部対立といった圧力で LockBit・ALPHV・Basta・RansomHub といった RaaS グループが消滅または大幅に弱体化した一方、Qilin と Akira がその空白を埋めるように台頭し 2025 年のデータリークサイト掲載被害組織数で上位となりました。主な分析結果として、3 分の 1 のインシデントで初期アクセスベクトルとして脆弱性の悪用が確認または疑われ (多くは一般的な VPN とファイアウォールの脆弱性)、分析した侵入の 77% でデータ窃取が疑われ (2024 年の 57% から大幅増)、約 43% で仮想化インフラが標的になり (2024 年は 29%)、REDBIKE が最も多くデプロイされたランサムウェアファミリーで分析対象の 30% を占めたことが挙げられています。あわせて、コードパイプラインと CI/CD インフラの強化に関するプロアクティブな防御の指針が公開されました。高度な脅威アクターが、信頼されたセキュリティスキャナやユーティリティライブラリ、AI 開発者ツールを標的にしてビルドパイプライン内の高い権限を悪用する、ソーシャルエンジニアリングや悪意のある拡張機能・タイポスクワットした依存関係で開発者のワークステーションや IDE から鍵・API トークン・セッション認証情報を直接盗む、GitHub Actions のキャッシュポイズニングや OpenID Connect トークンの抽出、変更可能なアクションタグの改ざんといったパイプライン操作で、暗号学的に検証された正当な来歴を保ったまま侵害パッケージを公開する、という 3 つの戦術が整理され、ソフトウェア開発ライフサイクルの 5 つの柱にわたる多層防御のアプローチが示されています。脅威分析ではさらに、正規の認証フローを悪用して欧州の学術機関・航空宇宙 / 防衛産業・政府機関・シンクタンク、および米国の学術機関やシンクタンクに勤務する個人を標的とする、ロシアの関与が疑われる 3 つのサイバーエスピオナージクラスタについて Google Threat Intelligence Group (GTIG) が報告しました。UNC6293 に加えて UNC7005 と UNC5976 を追跡しており、フィッシング、OAuth フローの悪用、マルウェアのデプロイを行いますが、いずれも最終的にはアカウントを侵害するために正規の認証ワークフローを悪用する点が共通しています。UNC7005 は ReliaQuest と Microsoft が報告したホスピタリティ業界を標的としたキャプティブポータルリダイレクトに関連します。UNC6293 は初期アクセスを担う ICE RELIC (旧 APT29) のサブクラスタと中程度の確信度で評価されており、2025 年 6 月に初めて報告されたロシアに批判的な著名人を狙うアプリパスワードフィッシングでは、米国国務省になりすまして「ms.state.gov」という名称のアプリパスワードを設定させ、2 要素認証を経由せずにアカウントへアクセスしようとしていました。一見してフィッシングと判別しにくい正規の認証プロセスを悪用するため、GTIG は悪意ある接触を認識しやすくするための注意喚起を行っています。障害情報では、Google Cloud Storage のアップロード・書き込み操作で遅延とエラー率が上昇した事象が解決済みとして報告されました。2026 年 10 月 8 日 04:00 (米国太平洋時間) に始まり同日 16:30 に終了、継続時間は 12 時間 30 分で、us-central1 リージョンにおける書き込みレイテンシーと書き込みエラー率の上昇です。暫定的な原因として、分散バックエンドアーキテクチャのうち us-central1 内の特定のストレージバックエンドノードで問題が生じたことが挙げられており、調査完了後に予防措置を含む最終インシデントレポートが公開される予定です。リリースノートでは、セキュリティ情報と証明書の変更が告知されました。Application Integration の 2026 年 8 月 27 日より前のバージョンに、AuthConfig の検証と統合実行ランタイムにおける不適切な認可の脆弱性があり、セキュリティ速報 GCP-2026-068 として公開されています。また、Google Public CA (pki.goog) が署名する Google 管理の公開 SSL 証明書が、セキュリティ向上のため有効期間 90 日から 45 日へ段階的に移行します。Certificate Manager が発行と更新を自動で管理するため、手作業や設定変更は不要で、Cloud Load Balancing 側でも同じ変更が案内されています。
