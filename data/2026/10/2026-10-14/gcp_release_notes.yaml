    "summary": "<h2 class=\"release-note-product-title\">Application Integration</h2>\n<h3>Security</h3>\n<p>An Incorrect Authorization vulnerability in the <code>AuthConfig</code>\nvalidation and integration execution runtime in Application Integration\nversions prior to August 27, 2026.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/application-integration/docs/security-bulletins#gcp-2026-068\">GCP-2026-068</a>\nsecurity bulletin.</p>\n<h2 class=\"release-note-product-title\">Certificate Manager</h2>\n<h3>Change</h3>\n<p>Google-managed public SSL certificates signed by <a href=\"https://docs.cloud.google.com/certificate-manager/docs/public-ca\">Google Public\nCA</a> (pki.goog) are gradually transitioning from a\n90-day validity period to a 45-day validity period to improve security.</p>\n<p>To align with modern industry-wide security standards and promote shorter\ncertificate lifespans, Google-managed public certificates now rotate more\nfrequently. This proactive rotation enhances the overall security posture of\nload balancers. The transition requires no manual intervention or configuration\nchanges as Certificate Manager automatically manages both issuance and renewal.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/certificate-manager/docs/core-components#google-managed-certificates\">Google-managed\ncertificates</a>\nand <a href=\"https://docs.cloud.google.com/certificate-manager/docs/certificate-manager-best-practices#use_google_managed_certificates\">Use Google-managed\ncertificates</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Load Balancing</h2>\n<h3>Change</h3>\n<p>Google-managed public SSL certificates signed by <a href=\"https://docs.cloud.google.com/certificate-manager/docs/public-ca\">Public Certificate Authority</a> (<code>pki.goog</code>) are gradually transitioning from a 90-day\nvalidity period to a 45-day validity period to improve security.</p>\n<p>To align with modern industry-wide security standards and promote shorter\ncertificate lifespans, Google-managed public certificates signed by\nPublic Certificate Authority now rotate more frequently.</p>\n<p>This proactive rotation enhances the overall security posture of load balancers.\nTransition requires no manual intervention or configuration changes as\nGoogle Cloud automatically manages issuance and renewal for both\nCertificate Manager and Compute Engine SSL certificates.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/load-balancing/docs/ssl-certificates/google-managed-certs#renewal\">Renew a Google-managed SSL certificate</a>.</p>"
