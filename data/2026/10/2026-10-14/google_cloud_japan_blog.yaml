    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/lakehouse-runtime-catalog-powered-by-spanner?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業がレイクハウス アーキテクチャへとモダナイズを進めるなかで、Apache Iceberg などのオープン フォーマットに準拠した共有データ資産を作成し、複数のエンジンで使用できるようにするという動きが広がっています。このように、AI ネイティブなレイクハウスを構築すれば、データをセマンティックな知識に変換したり、プロアクティブにアクションを実行したりするなど、エージェントの規模での運用が可能となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">レイクハウスの主要コンポーネントの一つはカタログであり、Apache Iceberg 環境では通常、Iceberg REST カタログがこれに該当します。Apache Iceberg カタログは、テーブル ポインタの維持や、アトミック コミットの処理といった役割を担うほか、テーブルの場所に関する信頼できる唯一の情報源となります。しかし、大規模なエンタープライズがレイクハウスへとモダナイズするにしたがって、スケーラビリティと可用性を備えたマネージド カタログがレイクハウス アーキテクチャの一部として必要であるという認識が生まれつつあります。エージェントによるクエリの量が増えるにつれて、この重要性はさらに増していきます。エージェントが繰り返し実行する大量の細かなクエリに対応するために、基盤のマネージド カタログには、アトミック性、整合性、可用性、同時実行性を大規模なスケールで提供する能力が求められます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このブログ投稿では、エージェント規模へと広がる最新のクラウド環境においてマネージド カタログが直面する課題を考察するとともに、Google Cloud のサーバーレスの</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/biglake-metastore-now-supports-iceberg-rest-catalog?e=a&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse ランタイム カタログ</span></a><span style=\"vertical-align: baseline;\">がこうした課題の解決にどのように役立つかについて説明します。Lakehouse ランタイム カタログは、Google Cloud の常時稼働データベースである </span><a href=\"https://cloud.google.com/spanner?e=a&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">（実質的に無制限で拡張可能）を基盤とし、オープンな Apache Iceberg REST カタログ仕様に準拠しています。これにより、エージェントの時代に必要なスケーラビリティと可用性を提供する基盤となります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">レイクハウスのマネージド カタログが直面する課題</strong></h4>\n<p><span style=\"vertical-align: baseline;\">データ エンジニアやインフラストラクチャ責任者の方々に話を伺うと、レイクハウスで大規模に本番環境の分析を行うことに関して、以下のような共通した課題を抱えています。これらはすべて、マネージド カタログにおいて解決すべきものです。</span></p>\n<p><strong style=\"vertical-align: baseline;\">アトミック コミットと同時実行制御:</strong><span style=\"vertical-align: baseline;\"> Iceberg は、オプティミスティック同時実行制御（OCC）により、ACID トランザクションを保証しています。したがって、マネージド カタログに強固なアトミック比較交換（CAS）オペレーションを実装し、現在のメタデータ ポインタをスワップする必要があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">高可用性と運用保守:</strong><span style=\"vertical-align: baseline;\"> カタログがダウンすると、クエリはその瞬間からエラーとなります。そのため、マネージド カタログは最重要な Tier-1 サービスに位置付けられます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">カタログを支えるデータベースのスケーリング:</strong><span style=\"vertical-align: baseline;\"> カタログの設計者は往々にして、テーブルのメタデータおよび状態の保存用データベースの選択において、難しいジレンマに陥ります。従来のスケールアップ型のリレーショナル データベースは SQL に対応しており、ACID トランザクションを提供しますが、読み取り / 書き込みの同時実行処理が増えると、CPU、メモリ、ストレージ、接続数が垂直方向の限界に達します。これを回避するには、手動でのシャーディングが必要となりますが、その場合は、運用上のオーバーヘッドが膨大になります。一方、スケールアウト型のデータベース システムは、即時整合性が得られない、管理が困難、エンタープライズに対応できない、といった問題があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">テーブルのメンテナンス作業:</strong><span style=\"vertical-align: baseline;\"> カタログは、データの最適化まではしてくれません。人間の担当者が、データの圧縮、古いスナップショットの消去、マニフェストの書き換え、孤立ファイルのクリーンアップといった補助パイプラインを構築して運用する必要があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ガバナンスとセキュリティ:</strong><span style=\"vertical-align: baseline;\"> カタログは、セキュリティの門番として、以下を実装して維持することが求められます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">認証プロトコル（OAuth2 トークン交換、IAM 連携など）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">名前空間からテーブルレベルまでのアクセス制御</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">一時的なストレージ認証情報（例: クエリエンジンに対して、広範なストレージに直接アクセスできる認証情報ではなく、有効期間の短いトークンを生成する）</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これらの課題を解決するために、Google は Iceberg REST カタログをサポートする Lakehouse ランタイム カタログ（一般提供）を構築しました。Lakehouse ランタイム カタログは、高可用性を備えた完全にサーバーレスな統合メタデータ レジストリであり、Apache Iceberg などの最新のオープンなテーブル フォーマットをサポートするようにゼロから設計されています。</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログでは、Apache Iceberg REST カタログ仕様をネイティブに実装することで</span><strong style=\"vertical-align: baseline;\">、</strong><span style=\"vertical-align: baseline;\">メタデータ検出をコンピューティング エンジンから分離しています。これにより、複数の Iceberg 互換エンジンが共有データ資産にアクセスできるようになり、ワークロードを迅速に本番環境に移すことが可能となります。Google はすでに、多くのお客様がマネージド カタログの移行をスムーズに行えるよう支援してきました。たとえば、</span><a href=\"https://cloud.google.com/customers/etsy-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Etsy</span></a><span style=\"vertical-align: baseline;\"> は Lakehouse ランタイム カタログへと移行し、データを動かさずに結合することで、パイプライン クエリを 60% 高速化しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_bmVFk8w.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このアプローチには、アーキテクチャ上のメリットが以下のように多数あります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープン API</strong><span style=\"vertical-align: baseline;\">: Iceberg REST カタログがサポートされているため、ユーザーは単一の統合データセットに対してさまざまな分析ツールを自由に使用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチエンジンの相互運用性</strong><span style=\"vertical-align: baseline;\">: 登録されたテーブルは、標準の REST インターフェースを介して、Google Cloud Managed Service for Apache Spark、BigQuery、オープンソース エンジンで即座に検出やクエリが可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\"> Iceberg テーブルの</strong><a href=\"https://cloud.google.com/blog/products/data-analytics/the-future-of-data-lakehouse-for-the-agentic-era?e=0\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">読み取り / 書き込みの相互運用性</strong></a><span style=\"vertical-align: baseline;\">: BigQuery、Managed Spark などの Iceberg 互換エンジンを使用して、Lakehouse ランタイム カタログに登録されている Iceberg テーブルに書き込めます。また、Managed Spark を使用して、外部カタログの Iceberg テーブルに書き込むこともできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンタープライズ グレードの機能を備えたフルマネージドの Iceberg ストレージ: </strong><span style=\"vertical-align: baseline;\">Google </span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/unveiling-new-bigquery-capabilities-for-the-agentic-era?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">独自のインフラストラクチャ</span></a><span style=\"vertical-align: baseline;\">を使用し、Iceberg テーブルでパフォーマンスの高い分析を実行できます。これにより、オープンソースの柔軟性に加え、パフォーマンス、スケーリング、ガバナンス、マルチモーダル処理のメリットが得られます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データコピー不要</strong><span style=\"vertical-align: baseline;\">: テーブル定義は、基盤となるオブジェクト ストアの既存データを直接参照します。基盤となるデータの移動、書き換え、複製を行う必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クラウド間の双方向のカタログ連携</strong><span style=\"vertical-align: baseline;\">: 一時的な認証情報と OIDC トークン交換がサポートされており、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-databricks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Databricks Unity</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-snowflake\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Snowflake Horizon</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-aws-glue\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS Glue</span></a><span style=\"vertical-align: baseline;\"> のデータにアクセスできます。これにより、Google AI を</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/introducing-the-borderless-lakehouse?e=0&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS や Azure のデータに直接</span></a><span style=\"vertical-align: baseline;\">適用することが可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一時的な認証情報によるセキュアなアクセス</strong><span style=\"vertical-align: baseline;\">: カタログは複数の認可メカニズムに対応しており、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/credential-vending\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一時的な認証情報</span></a><span style=\"vertical-align: baseline;\">とエンドユーザー認証情報のいずれかを選択できます。そのため、一時的な認証情報などの最新方式を使って、基盤となるオブジェクト ストア（Cloud Storage、AWS S3、Azure Blob Storage）内のファイルに直接アクセスすることなく、テーブルにアクセスすることが可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI を活用したコンテキストとガバナンス: </strong><span style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログは、</span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> および </span><a href=\"https://cloud.google.com/products/iam?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud IAM</span></a><span style=\"vertical-align: baseline;\"> と直接統合されているため、エージェント用の信頼できるコンテキストを定義したり、すべてのコンピューティング エンジンにテーブルレベルのセキュリティを一貫して適用したりできます。また、カタログ内の Iceberg テーブルの検索や、リネージや分析情報の取得にあらかじめ対応しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アトミック コミットによる同時実行制御、高可用性、スケーラビリティ: </strong><span style=\"vertical-align: baseline;\">Google の地球規模のインフラストラクチャと Spanner を基盤としたアーキテクチャによって、データに合わせてメタデータをスケールするために必要な高可用性、同時実行性、スケーラビリティが得られます。たとえば、Cloud Storage のデュアル リージョン バケットとマルチリージョン バケットのサポートにより、フェイルオーバーのユースケースに対応できます。また、サーバーレスな NoOps 環境によって TCO 削減につながるほか、あらゆるサイズのワークロードに対応可能なスケーラビリティを得られます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログの原動力</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログは </span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\"> 上に構築されているため、高可用性、同時実行性、スケーラビリティに優れているのに加えて、強整合性が保証されています。従来のスケールアップ型のリレーショナル データベースが、単一ノード内で垂直方向の限界に達するのに対し、Spanner は、読み取りと書き込みの両方で水平方向にスケールアウトできるという NoSQL システムならではの柔軟性に加え、完全なリレーショナル SQL のセマンティクス、複数テーブルでの ACID トランザクションというメリットを提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Spanner の</span><a href=\"https://docs.cloud.google.com/spanner/docs/instance-configurations#regional-configurations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">リージョン構成</span></a><span style=\"vertical-align: baseline;\">では最大 99.99% の可用性が得られ、Lakehouse ランタイム カタログにおいて高可用性を実現できます。さらに、Spanner が自動的なスケーラビリティを Lakehouse ランタイム カタログに提供します。Spanner は水平方向にスケーラブルなデータベースであるため、手動でのシェーディングは必要なく、コンピューティングおよびストレージのリソースが自動的かつ透過的にスケールされます。具体的には、Spanner がデータ量とクエリ負荷を動的にモニタリングし、データ範囲を分割して、ノード間で再分配します。コンピューティング ノードは、CPU 使用率とストレージのしきい値に基づいて、動的にスケールされます。また、スプリット レベルで過負荷を自動検出し、過負荷状態のノードから重いスプリットを移動します。また、Spanner によって、「リレーショナルの整合性」と「分散によるスケーラビリティ」の間の</span><a href=\"https://dl.acm.org/doi/abs/10.1145/2491245?__cf_chl_tk=oi5rkZKtX5q2CR93K9mrIHsAp_oqRxwaGqqpqq99v9Y-1790923307-1.0.1.1-pNUQvRr4OBosWiOcfxGuTWTD8I3JW_8V0i5xLuCsErU\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">従来のトレードオフ</span></a><span style=\"vertical-align: baseline;\">が解消され、Lakehouse ランタイム カタログのユーザーは業界最高水準の</span><a href=\"https://docs.cloud.google.com/spanner/docs/true-time-external-consistency\"><span style=\"text-decoration: underline; vertical-align: baseline;\">整合性保証</span></a><span style=\"vertical-align: baseline;\">を享受できます。Lakehouse のトランザクションはシリアル化されており、データベース内のトランザクションの順序は、クライアント側でトランザクションのコミットが観察される順序と一致します。この基盤によって、Lakehouse ユーザーは、エージェント規模での運用を実現できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、エージェント ユースケースへの対応を強化するため、Lakehouse ランタイム カタログは Knowledge Catalog と直接統合されており、レイクハウス内の Iceberg テーブルを簡単に検出して、信頼できるコンテキストをエージェントに提供することができます。Spanner が提供する</span><a href=\"https://docs.cloud.google.com/spanner/docs/full-text-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">全文検索</span></a><span style=\"vertical-align: baseline;\">とネイティブの</span><a href=\"https://docs.cloud.google.com/spanner/docs/vector-search-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ベクトル検索</span></a><span style=\"vertical-align: baseline;\">という効率的な組み合わせを Knowledge Catalog で活用して、単一のクエリ内で語彙キーワード検索とセマンティック エンベディングを併用し、検索の再現率を高められます。これらの 2 種類のインデックス タイプは同じベース データセット上に構築されており、ベーステーブルが DML で操作されると、トランザクションの ACID 整合性を厳密に保ちながらインデックスが更新されます。そのため、運用上のオーバーヘッド、たとえば、同期パイプライン、外部ベクトル、全文検索システムの管理といった作業が発生しません。簡潔に言うと、Lakehouse ランタイム カタログを使用すると、エージェントのユースケースを迅速に市場に投入することが可能となります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">分析と運用のワークロードを組み合わせる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Apache Iceberg をベースにした、Google Cloud のボーダーレスな Lakehouse なら、分析データを運用ワークロードと組み合わせることができます。ユースケースとしては、Lakehouse のデータアセットと Spanner からの OLTP データを組み合わせて分析を実行する、Spanner やその他の運用データベースからレイクハウスのアセットにアクセスして低レイテンシのアプリケーションを実現する、ファースト パーティおよびサードパーティのエージェントで会話型分析を行う、など多岐にわたるものがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログと Spanner の動作の例を以下に示します。この例では、マンハッタンのタクシー運行に関する分析データ（Apache Iceberg）と、タクシーのゾーンに関する運用データ（Spanner）を組み合わせて、最も混雑している交通経路を特定しています。さらに、会話型分析エージェントを使ってこの同じデータにアクセスし、二次的な分析情報を取得しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_TvlKrOP.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>マンハッタンで最も混雑している交通ルートを調べる</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">ボーダーレスな Lakehouse にモダナイズ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の </span><a href=\"https://cloud.google.com/solutions/data-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse</span></a><span style=\"vertical-align: baseline;\"> にモダナイズすることによって、分析エンジンやエージェント間のデータサイロを最小限に抑える、マルチエンジンのガバナンスを統合する、信頼できるコンテキストをエージェントに提供する、運用コストを大幅に削減する、といったメリットが得られます。Spanner ベースの Lakehouse </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-lakehouse-iceberg-rest-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ランタイム カタログ</span></a><span style=\"vertical-align: baseline;\">を活用し、最新のクラウド環境をエージェント規模で運用する基盤を整えましょう。詳細および無料トライアルについては、</span></p>\n<p><a href=\"https://cloud.google.com/products/lakehouse?e=a\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse</span></a><span style=\"vertical-align: baseline;\"> のウェブページをご覧ください。Spanner の詳細については</span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vinod Ramachandran</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア エンジニアリング マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Mina Mikhail</strong></p></div>"
  "964df995cdd562cf66238bde0c10642e":
    "id": "964df995cdd562cf66238bde0c10642e"
    "title": "AlloyDB: ハイブリッド検索のための統合データベース エンジン"
    "link": "https://cloud.google.com/blog/ja/products/databases/simplify-ai-search-with-alloydb-hybrid-search-and-rrf/"
    "published": "2026-10-14 11:30:00"
    "fetched": "2026-10-14 14:49:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 6 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/simplify-ai-search-with-alloydb-hybrid-search-and-rrf?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">最新の AI アプリケーションや RAG アプリケーションで高い検索関連性を実現するには、少なくとも 2 つの手法を組み合わせる必要があります。それは、セマンティックなコンテキストを把握するためのベクトル検索と、キーワードの精度を高めるための全文検索（FTS）です。AlloyDB for PostgreSQL はこれら両方の機能に対応していますが、従来、これらの機能を管理して最高のパフォーマンスを確保するには、より多くの手作業を伴う運用アプローチが必要でした。</span></p>\n<p><span style=\"vertical-align: baseline;\">難しいのは、検索を実行することではなく、その検索結果を統合することです。ベクトルクエリ（距離スコア）と FTS クエリ（関連性スコア）の結果を統合するには、複雑な SQL クエリや、アプリケーション レイヤ側でのカスタムコードの実装が必要です。そのため多くの場合、結果の統合、スコアの正規化、再ランキングのための別システムを維持管理する手間が発生します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この記事では、AlloyDB AI のハイブリッド検索がこの複雑さを解消する仕組みを詳しくご紹介します。最近のアップデートによって実現した、以下の機能を順に見ていきます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド検索の簡素化:</strong><span style=\"vertical-align: baseline;\"> 複雑な SQL クエリや複数ステップのアプリケーション ワークフローを、Reciprocal Rank Fusion（</span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search#rank-fusion\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RRF</span></a><span style=\"vertical-align: baseline;\">）を活用した単一の高性能 SQL 関数に統合します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">FTS のパフォーマンス最適化:</strong><span style=\"vertical-align: baseline;\"> 新しい RUM 拡張機能を使用して、単語の位置をインデックスに直接保存することで、低レイテンシの関連性ランキングと効率的なフレーズ マッチを実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">業界標準のランキングの活用:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/ja/products/databases/native-bm25-search-in-alloydb-and-cloud-sql?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ネイティブにサポートされる新しい BM25 インデックス</span></a><span style=\"vertical-align: baseline;\">を利用して、キーワード ベースの優れたスコアリングをすぐに利用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">検索の汎用性の拡張:</strong><span style=\"vertical-align: baseline;\"> 新しい外部検索用の外部データラッパー（FDW）を使用して、AlloyDB 環境を離れることなく、Elasticsearch、OpenSearch、Solr などの特化型の外部クラスタに対してクエリを実行できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">複数ステップのワークフローの問題</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB AI のネイティブ ソリューションが登場する前は、堅牢なハイブリッド検索の実現は非常に骨の折れる作業でした。特に、標準 SQL を使用してこのロジックをデータベース内で完結させようとするデベロッパーにとっては困難な課題でした。そうしたアプローチでは複数のステップからなるオーケストレーションが必要となりますが、2 つのソースを管理、維持するだけでも困難なうえ、ソースが追加されるとスケーリングが事実上不可能になります。具体的には、以下のような手順が必要でした。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ベクトル検索を実行する:</strong><span style=\"vertical-align: baseline;\"> ベクトル列またはベクトル インデックス（AlloyDB の場合は ScaNN インデックス）を使用してクエリを実行し、Top-K の検索結果を見つけてベクトルスコアを生成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">FTS クエリを実行する:</strong><span style=\"vertical-align: baseline;\"> 汎用転置インデックス（GIN）を使用して Top-K の結果を検索するなどして、FTS クエリを実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スコアを正規化する（脆弱なステップ）:</strong><span style=\"vertical-align: baseline;\"> 複雑な SQL ロジックやカスタム アプリケーション コードを記述して、両方の結果セットを共通のスケールにマッピングします。このロジックは、データの分布が変化すると破綻する恐れがあります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クロスサービス結合と再ランキングを実行する:</strong><span style=\"vertical-align: baseline;\"> ベクトル検索に使用するシステムとは別のシステムで FTS 検索を行う場合は、アプリケーション メモリを使用してドキュメント ID に対し複雑な FULL OUTER JOIN を実行し、正規化されたスコアの加重合計を適用して、最後に結合された結果を並べ替えます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">このような分散型のアプローチは、スコアロジックの脆弱化、レイテンシの増加、運用負荷の上昇を招き、検索品質の維持作業が属人化してアプリケーション開発者に大きな負担がかかり続ける原因となっていました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_XqX6b2x.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">AlloyDB でハイブリッド検索アーキテクチャを簡素化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これを簡素化する鍵は、RRF を採用することです。RRF は本質的にランクベースであるため、スコア正規化という脆弱なステップをスマートに回避できます。RRF は次の 2 つの要素で構成されています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 信頼できる唯一の情報源</strong></p>\n<p><span style=\"vertical-align: baseline;\">複数のステップからなるフェッチと結合の処理を行う代わりに、1 つの SQL 関数を呼び出して、検索コンポーネントを宣言型の JSON 配列として渡します。</span></p>\n<p><span style=\"vertical-align: baseline;\">SQL</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT id, score \\r\\nFROM ai.hybrid_search(\\r\\n    search_inputs =&gt; ARRAY[\\r\\n        -- Vector Component (Semantic) with dynamic embedding generation from natural language\\r\\n        $json${\\r\\n            &quot;data_type&quot;: &quot;vector&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;table_name&quot;: &quot;documents&quot;,\\r\\n            &quot;key_column&quot;: &quot;doc_id&quot;,\\r\\n            &quot;vec_column&quot;: &quot;embedding&quot;,\\r\\n            &quot;distance_operator&quot;: &quot;&lt;=&gt;&quot;,\\r\\n            &quot;query_vector&quot;: &quot;ai.embedding(\\&#x27;text-embedding-005\\&#x27;, \\&#x27;alloydb search\\&#x27;)::vector&quot;\\r\\n        }$json$::jsonb,\\r\\n        \\r\\n        -- Text Component (Keyword)\\r\\n        $json${\\r\\n            &quot;data_type&quot;: &quot;text&quot;,\\r\\n            &quot;limit&quot;: 10,\\r\\n            &quot;table_name&quot;: &quot;documents&quot;,\\r\\n            &quot;key_column&quot;: &quot;doc_id&quot;,\\r\\n            &quot;text_column&quot;: &quot;content&quot;,\\r\\n            &quot;query_text_input&quot;: &quot;alloydb search&quot;\\r\\n        }$json$::jsonb\\r\\n    ]\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f206adec890&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">（注: 統合された </span><code style=\"vertical-align: baseline;\">ai.hybrid_search</code><span style=\"vertical-align: baseline;\"> API は、2 つのコンポーネントだけに限定されるものではありません。また、新しい FDW を介して外部検索ソースをネイティブにサポートします。）</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. データベース ネイティブのオーケストレーション</strong></p>\n<p><span style=\"vertical-align: baseline;\">hybrid_search() 関数は、ワークフロー全体を単一のクエリプランで実行するため、オーバーヘッドを最小限に抑えながらトランザクションの整合性を確保することができます。この関数は、以下の処理を行います。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">動的な CTE 生成:</strong><span style=\"vertical-align: baseline;\"> この関数は動的 SQL を構築して、各コンポーネントの共通テーブル式（CTE）を作成します。各 CTE は、結果の順位（ROW_NUMBER()）の計算を担います。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">カーネルレベルでの融合:</strong><span style=\"vertical-align: baseline;\"> ランキングされたすべてのコンポーネントの結果が、ドキュメント ID に基づく FULL OUTER JOIN を使用して直ちに結合されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最終的な RRF スコア:</strong><span style=\"vertical-align: baseline;\"> 結合されたランクから、RRF の数式に基づいて最終的な統合スコアが算出されます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_bAjNPuH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このアプローチを採用することで、脆弱なスコア計算処理や、アプリケーション側での結合が不要になります。現在のランキング アルゴリズムは Reciprocal Rank Fusion（RRF）ですが、追加の結合オプションとランキング オプションを今後導入していく予定です。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_534j9B2.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">結果: パフォーマンスと運用の簡素化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">複雑な外部ワークフローからネイティブ SQL 関数への移行は、即座に目に見えるメリットをもたらします。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">指標</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">複数ステップのアプリケーション ワークフロー（手動 SQL によるシミュレーション）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB AI ネイティブの hybrid_search() UDF</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">コードの複雑さ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">複雑なスコア正規化関数、サービス呼び出し、アプリケーション結合。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">外部ロジック不要。宣言型の SQL 呼び出し 1 回のみ。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">維持管理</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">正規化数式の継続的な調整。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">チューニング不要。RRF はランクベースで、分布に依存しない。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">FTS のパフォーマンスを向上: RUM 拡張機能</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB AI の hybrid_search() 関数は、高パフォーマンスのベクトル検索と FTS を組み合わせることで、網羅的で関連性の高い検索結果を返すように設計されています。AlloyDB のネイティブ FTS 機能は、強力である一方、テキスト コンポーネントに標準の PostgreSQL GIN インデックスを使用しているため、高度なオペレーションではボトルネックになる可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">GIN インデックスの課題は、単語の出現位置の情報が保存されないことです。この制限があるため、以下のような処理を行う際はコストのかかるテーブル スキャンを実行して再分析せざるを得なくなります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">関連性ランキング:</strong><span style=\"vertical-align: baseline;\"> 単語の近接性と頻度に基づいて検索結果のスコアを計算する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フレーズ検索:</strong><span style=\"vertical-align: baseline;\"> 正確な語順を見つける。出現位置の情報が必要。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">FTS のレイテンシを低減する RUM 拡張機能のご紹介</span></p>\n<p><strong style=\"vertical-align: baseline;\">RUM 拡張機能</strong><span style=\"vertical-align: baseline;\">は、GIN をベースにした強力なインデックス アクセス手法で、これらのパフォーマンスの課題を直接解決します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">RUM の主な利点:</strong><span style=\"vertical-align: baseline;\"> GIN インデックス（単語 -&gt; [docID] をマッピング）とは異なり、RUM インデックスは各単語の出現位置の情報をインデックス内に直接保存します（例: 単語 -&gt; [(docID1, [pos])], ...）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パフォーマンス上のメリット:</strong><span style=\"vertical-align: baseline;\"> これにより、RUM はランキングやフレーズ照合などの複雑なオペレーションを主にインデックス自体の中で実行できるため、コストのかかるヒープスキャンを回避できます。RUM を使用することで、関連性ランキングが大幅に高速化され、フレーズ検索や近接検索も効率的に行えるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド検索に最適:</strong><span style=\"vertical-align: baseline;\"> RUM は、ハイブリッド検索フレームワークにおいてベクトル検索（ScaNN など）を補完する極めて重要な要素です。GIN はレイテンシが発生するリスクがあるため、リアルタイムのハイブリッド処理にはあまり適していません。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">RUM 拡張機能は、ランキング重視のアプリケーションや同時実行性の高い検索アプリケーションに最適です。単語の出現位置をインデックスに直接保存することで、ランキング処理中にテーブルページを再スキャンする必要がなくなり、並べ替え済みの結果を高速に返すことができます。ただし、インデックスの構築が遅くなり、ディスク使用量が増えるというトレードオフもあります。書き込み速度やストレージ密度よりも、高速なクエリと正確なランキングが優先されるワークロードであれば、RUM は投資する価値が十分にあります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">測定可能な成果とインテグレーション</strong></h4>\n<p><span style=\"vertical-align: baseline;\">RUM を採用すると、AlloyDB の FTS のパフォーマンスが直接的に向上します。単体の FTS クエリはもちろん、FTS クエリを含むハイブリッド検索のパフォーマンスも向上します。以下は、さまざまな </span><a href=\"https://github.com/beir-cellar/beir\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BEIR</span></a><span style=\"vertical-align: baseline;\"> データセットにおける、GIN と比較した RUM のパフォーマンス向上率を示した統計データです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_rFbNdqQ.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>（パフォーマンスは、<a href=\"https://github.com/beir-cellar/beir\">BEIR Natural Questions ベンチマーク</a>を使用したテストに基づきます）。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">RUM は、検索とランキングに特化した &lt;=&gt; 距離演算子と統合されており、ハイブリッド検索の SQL 呼び出しで使用できるため、双方の長所を活かすことができます。次の </span><a href=\"https://codelabs.developers.google.com/next26/alloydb-ai-hybrid-search\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Codelab</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">では、ハイブリッド検索 UDF で RUM インデックスを構成して使用する方法を説明します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">BM25 インデックスの導入: 最新のランキング標準</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google はこのたび、CloudSQL と AlloyDB に </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-bm25-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BM25 インデックス</span></a><span style=\"vertical-align: baseline;\">をプレビュー版として導入し、pg_textsearch 拡張機能を通じて業界標準の関連性ランキングを利用できるようにしました。BM25 は、用語頻度飽和と文書長正規化を考慮した </span><a href=\"https://en.wikipedia.org/wiki/Tf%E2%80%93idf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TF-IDF</span></a><span style=\"vertical-align: baseline;\"> を使用して、キーワードベースの検索クエリの精度と品質を大幅に向上させます。AlloyDB AI 内のネイティブ BM25 インデックスを活用することで、導入してすぐに高いランキング精度を達成できます。外部の検索エンジンや複雑なカスタム スコアリング ロジックの実装が不要になり、完全一致の用語や重要なキーワードに高いスコアが自動的に割り当てられます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Install pg_textsearch extension\\r\\nCREATE EXTENSION pg_textsearch;\\r\\n\\r\\n-- Create the native BM25 index on the content column\\r\\nCREATE INDEX idx_docs_bm25 \\r\\nON cymbal_products \\r\\nUSING bm25 (product_description) \\r\\nWITH (text_config=&#x27;english&#x27;);\\r\\n\\r\\n-- Full text search query\\r\\nSELECT product_name, product_description &lt;@&gt; &#x27;cherry tree&#x27; AS bm25_score \\r\\nFROM cymbal_products\\r\\nORDER BY bm25_score \\r\\nLIMIT 5;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f2068ebb110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">外部検索: 外部データラッパーで汎用性を拡大</strong></h4>\n<p><span style=\"vertical-align: baseline;\">検索機能をさらに拡張するため、外部検索用の外部データラッパー（</span><a href=\"https://docs.cloud.google.com/alloydb/docs/reference/extensions#fdw-extensions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">FDW</span></a><span style=\"vertical-align: baseline;\">）も AlloyDB AI に導入しました。これにより、Elasticsearch、OpenSearch、Solr をはじめとする特化型の外部クラスタに対する全文検索が可能になり、アーキテクチャ面で以下のような重要なメリットを得られます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最適化された検索:</strong><span style=\"vertical-align: baseline;\"> AlloyDB 環境を離れることなく、専用の検索バックエンドからランキング アルゴリズムと豊富な機能セットを活用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">統合された SQL インターフェース:</strong><span style=\"vertical-align: baseline;\"> 高度な FTS クエリの表現力を維持したまま、標準の PostgreSQL SQL を使用して外部データを操作し、結合を実行して、結果を統合できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">優れたポータビリティ:</strong><span style=\"vertical-align: baseline;\"> 既存の検索インフラストラクチャをそのまま維持しながら、AlloyDB AI が提供するシンプルなハイブリッド アーキテクチャのメリットを享受できます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">以下の Codelab は、</span><a href=\"https://codelabs.developers.google.com/next26/alloydb-elastic?hl=en#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Elasticsearch</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://codelabs.developers.google.com/alloydb-solr-fdw?hl=en#0\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Solr</span></a><span style=\"vertical-align: baseline;\"> のインテグレーションを使用したハイブリッド検索について説明する、エンドツーエンドのコードガイドです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AI を活用した検索のための統合アーキテクチャ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">最先端の検索における真の課題は、技術的そのものではなく、アーキテクチャの簡素化と長期にわたる運用の安定性を両立させることにあります。AlloyDB AI は、以下の 3 つのコア イノベーションを基盤とした統合プラットフォームによってこの問題を解決します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド検索の簡素化:</strong><span style=\"vertical-align: baseline;\"> RRF を活用した AlloyDB AI のハイブリッド検索機能は、脆弱な複数ステップのアプリケーション ワークフローを、単一の高性能な SQL 呼び出しに変換します。このネイティブ実装により、複雑なスコア正規化やアプリケーション側での結合が不要になります。その結果、運用コストとエンジニアリング コストを大幅に削減しながら、一貫して正確で高速かつ関連性の高いハイブリッド検索結果を提供できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">FTS パフォーマンスの最適化:</strong><span style=\"vertical-align: baseline;\"> ハイブリッド検索における FTS コンポーネントが多様なアプリケーション要件を満たせるよう、AlloyDB AI はさまざまな全文検索オプションを提供しています。RUM 拡張機能は、出現位置データをインデックスに直接保存することで、関連性ランキングの高速化と効率的なフレーズ検索を可能にし、低レイテンシなパフォーマンスを実現します</span><strong style=\"vertical-align: baseline;\">。</strong><span style=\"vertical-align: baseline;\">これは、高速なクエリが求められる場合に重要です。一方、BM25 インデックスは業界標準の関連性ランキングを提供するため、キーワード スコアリングの精度を優先する場合に推奨される選択肢です。検索レイテンシとランキング精度のどちらを重視するかによって使い分けることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">外部検索による汎用性の向上:</strong><span style=\"vertical-align: baseline;\"> FDW を介した外部検索を追加することで、AlloyDB は Elasticsearch などの特化型の検索バックエンドとも連携できるようになります。これにより、使い慣れた PostgreSQL インターフェースはそのままに、特化型検索クラスタの大規模な処理能力と高度な検索機能を活用できます。これらの外部結果をハイブリッド検索フレームワークに直接統合することで、AlloyDB AI は、非常に大規模なテキスト リポジトリとベクトルベースのセマンティック分析情報を組み合わせることができます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">AlloyDB AI は、スコアリング、結合、再ランキングという複雑な処理をデータベース カーネル内に集約し、FTS を実現する 2 通りの方法（最適化された低レイテンシの内部 FTS に RUM を活用する、または特化型のスケーラブルなバックエンドに外部検索を活用する）を提供することで、堅牢で自己完結型の検索基盤を実現します。この 2 つの方法の共存が、ハイブリッド検索の実現を根本から支え、ワークロード、データ量、既存のインフラストラクチャに基づいて最適な方法を選択できる柔軟性をもたらします。これにより、検索アーキテクチャの優れたパフォーマンスとメンテナンス性の高さを信頼して、インテリジェントなアプリケーション機能の開発に集中できるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">デモ動画のご紹介</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB が</span><a href=\"https://www.youtube.com/watch?v=vYB0P9rPXt8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">究極のハイブリッド検索エンジン</span></a><span style=\"vertical-align: baseline;\">と呼ばれる理由を、ぜひ動画でご確認ください。</span></p>\n<p><a href=\"https://www.youtube.com/watch?v=-JxQb-kjFHk\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB での BM25 のサポート</span></a><span style=\"vertical-align: baseline;\">についての詳細をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ご利用にあたって</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI ワークロードのスピードと費用対効果を向上させる準備はできていますか？</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB を初めてご利用の場合:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/alloydb/docs/free-trial-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">30 日間の無料トライアル</span></a><span style=\"vertical-align: baseline;\">で AlloyDB をお試しください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド検索を使ってみる</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/full-text-search-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">テキスト検索インデックス</span></a><span style=\"vertical-align: baseline;\">を設定し、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/choose-index-strategy\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ベクトル検索インデックス</span></a><span style=\"vertical-align: baseline;\">を選択します。インデックスを作成すると、さまざまなハイブリッド検索クエリ実行するための</span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サンプル</span></a><span style=\"vertical-align: baseline;\">を確認できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">外部検索</strong><span style=\"vertical-align: baseline;\">: AlloyDB に外部データラッパーと外部テーブルを作成し、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/elastic-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Elasticsearch</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/solr-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Solr</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/opensearch\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenSearch</span></a><span style=\"vertical-align: baseline;\"> から外部データをクエリします。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース担当シニア プロダクト マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Kumar Ramamurthy</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース担当ソフトウェア エンジニア</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Ricky Zhou</strong></p></div>"
  "b379878b70447a76e8eb1e382dd2a298":
    "id": "b379878b70447a76e8eb1e382dd2a298"
    "title": "プロアクティブな防御: コード パイプラインと CI / CD インフラストラクチャの強化"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure/"
    "published": "2026-10-14 10:00:00"
    "fetched": "2026-10-14 14:49:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 25 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">はじめに</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ソフトウェア サプライ チェーン セキュリティを取り巻く状況は大きく変化しています。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">最近の攻撃キャンペーン</span></a><span style=\"vertical-align: baseline;\">では、高度な脅威アクターが、信頼できるセキュリティ ツールやプログラミング ツールを侵害することで、エンジニアリング ライフサイクルを体系的に標的にしていることが示されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このような侵入から、以下の 3 つの主な戦術が明らかになっています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">攻撃者は、信頼できるセキュリティ スキャナ、ユーティリティ ライブラリ、AI 開発者のツールを標的にして、ビルド パイプライン内でこれらのシステムに付与された高い権限を悪用しようとします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">攻撃者は、高度にカスタマイズされたソーシャル エンジニアリング、悪意のある拡張機能、タイポスクワットしたローカル依存関係などを介し、開発者ワークステーションや統合開発環境（IDE）を標的にして、秘密暗号鍵、API トークン、アクティブなセッション認証情報をローカル エンジニアリング環境から直接窃取します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">攻撃者は、侵害した静的認証情報のみを利用するのではなく、GitHub Actions のキャッシュ ポイズニング、OpenID Connect（OIDC）トークンの抽出、変更可能なアクションタグの改ざんといった高度なパイプライン操作手法へと手を広げ、暗号学的に検証された正当な来歴を保持したまま、侵害したパッケージを公開しています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">このブログ記事では、以前のガイダンス（</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/protecting-supply-chains-and-vendor-connections?e=48754805?hl-ja&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">）を基に、ソフトウェア開発ライフサイクル（SDLC）全体にわたり、活発に悪用されている脅威ベクトル、サードパーティ リスク、アーキテクチャの脆弱性からソフトウェア サプライ チェーンを保護するように設計された、ソフトウェアおよびプラットフォーム アーキテクト向けの実用的な行動指針を説明します。</span></p>\n<p><span style=\"vertical-align: baseline;\">継続的インテグレーションと継続的デリバリー / デプロイ（CI / CD）の安全保護対策の確立、開発者のワークフローの強化、堅牢なエンドツーエンドの多層防御の構築を実現する方法の詳細をぜひお読みください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">多層的なアプローチ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">このような多層攻撃はビルド パイプライン全体に及ぶ脆弱性を標的にするため、パイプラインの各ステージを独立したセキュリティ ドメインとして扱うだけではもはや不十分です。こうした持続的な脅威から防御するには、図 1 で示している、ソフトウェア開発ライフサイクルの 5 つの主要な柱にわたる徹底した多層防御アプローチが必要です。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"The five core pillars for securing the software development lifecycle\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/The_five_core_pillars_for_securing_the_sof.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: ソフトウェア開発ライフサイクルを保護するための 5 つの主要な柱</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">エンドポイント</strong></h3>\n<p><span style=\"vertical-align: baseline;\">開発者のワークステーションは、リポジトリ、パイプライン、クラウド環境に直接、特権アクセスができるため、攻撃者にとって価値の高い標的となります。脅威アクターは IDE を標的にして、モニタリングされていないローカル アクセスを悪用し、個人用アクセス トークン（PAT）、SSH 認証鍵、独自コードを収集することがよくあります。組織は、すべてのローカル ホストマシンとクラウドベースの開発環境全体に一貫したセキュリティ ポスチャーを適用する、統合セキュリティ レイヤを確立する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ローカル シークレット スキャン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">組織は、リポジトリの commit 前にシークレットを検出してブロックするために、pre-commit フックと IDE 統合スキャンツールをデプロイする必要があります。ローカルの pre-commit テンプレートを標準化することで、変更が中央サーバーに push される前に git ツリーが完全に検証されるようになります。潜在的な漏洩の影響を最小限に抑えるために、組織は従来のクラシックな PAT から、上限の短い有効期間（TTL）と環境固有の最小限の権限で制約される、きめ細かな PAT に移行する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エンドポイント セキュリティ管理</strong></h4>\n<p><span style=\"vertical-align: baseline;\">組織は、エンドポイント検知対応（EDR）ソリューションを構成して、開発者のソフトウェアのインテグレーションをモニタリングし、継続的なデバイス ポスチャー チェックを適用する必要があります。また、EDR エージェントでは、信頼できる IDE プロセスツリーをモニタリングして、異常なファイル アクセス、予期しないプロセス生成、不正なアウトバウンド ネットワーク接続がないかを確認する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">完全な整合性を確保するには、これらの EDR コンプライアンス シグナルを統合エンドポイント管理（UEM）システムに直接統合し、デバイスがコンプライアンスに違反した場合は、ソースコード管理（SCM）システムへのアクセス、パイプライン タスクの実行、コードの公開などを行うユーザー権限を自動的に制限または取り消す必要があります。必要なコマンドライン インターフェース（CLI）プロセスの除外は、企業のエンドポイント全体に広く適用するのではなく、指定および隔離された開発環境に厳密に制限する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">IDE の標準化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">組織は、IDE、ブラウザ統合、サードパーティ拡張機能の特定のバージョンを審査して承認する必要があります。IDE やブラウザのマーケットプレイスは、検証済みのアプリケーションのみを許可して、未検証の拡張機能を明示的にブロックするよう制限する必要があります。すべての連携ツールは、許可リストに登録する前に、正式なサードパーティ リスク管理審査を受ける必要があります。組織は、新たに発見された脅威を阻止するため、厳格なバージョン固定と一元化された緊急ブロック機能を組み合わせた、アクティブなソフトウェア アセット インベントリを維持する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AI を活用したセキュリティ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エンジニアリング チームは、承認済みの大規模言語モデル（LLM）と AI エージェントのみを、マージ前の脆弱性分析とアプリケーション セキュリティ テストに使用する必要があります。脅威アクターがオープンソースの Model Context Protocol（MCP）パッケージに悪意のあるコードを積極的に挿入し、AI コーディング エージェントを騙し始めているため、この境界は非常に重要です（詳細は付随する</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">をご覧ください）。</span></p>\n<p><span style=\"vertical-align: baseline;\">コンテキスト ポイズニングやデータ引き出しなどのリスクを軽減するため、セキュリティ チームはコンテキスト保護ツールをデプロイし、ランタイム実行前に入力を検証する必要があります。開発者は、機密性の高い認証情報がモデルのコンテキスト ウィンドウに入らないよう、プラットフォーム固有の除外設定を使用して、可能な限りローカル環境（.env）ファイルをワークスペースから除外する必要があります。組織は、すべての AI 生成コードをリポジトリに書き込む前に検証するための、人間参加型制御モデルを維持する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">隔離された開発環境のサンドボックス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ホストレベルの侵害を防ぐため、組織は可能な限り、コンテナ化された開発環境または専用の仮想マシン（VM）の使用を義務付ける必要があります。サンドボックス化することで、悪意のあるポストインストール スクリプトや依存関係ポイズニング攻撃がローカル ファイルシステムを探索することを防ぎます。</span></p>\n<p><span style=\"vertical-align: baseline;\">侵害された依存関係がホスト権限で実行されないようにするには、機密性の高いホストパスのワークスペース コンテナへのマウントを制限する必要があります。開発者のゲスト VM は、一元化および堅牢化されたゴールデン イメージからインスタンス化し、稼働中の本番環境からネットワークを隔離する必要があります。すべてのサンドボックス実行とネットワーク アクティビティは、一元化された社内のログ管理システムに統合する必要があります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">コード リポジトリ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ソースコード リポジトリは、組織の独自ソフトウェアと知的財産に関する、最も信頼できる情報源として機能します。このレイヤを強化するには、ユーザー ID の管理、厳格なブランチ ガバナンス、コード履歴の継続的な検証により、不正な変更がライフサイクルに侵入しないようにする必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ユニバーサル ID</strong></h4>\n<p><span style=\"vertical-align: baseline;\">リポジトリを保護するには、ユーザー ID を厳格に管理する必要があります。企業管理ユーザー（CMU）モデルを実装すると、組織は外部の共同編集者を含むすべてのアカウントの完全な所有権を保持できるうえ、FIDO2 準拠の物理的なセキュリティ キーやデジタル パスキーなど、フィッシング耐性のある多要素認証（MFA）を適用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ただし、CMU アカウントは、外部のオープンソース リポジトリへのコントリビューションが禁止される場合があります。この制限があるため、一般公開プロジェクトやオープンソース プロジェクトの公開、および非公開での共同編集に携わるチームには、MFA を適用したシングル サインオン（SSO）連携を備えた標準的なユーザーモデルの利用が引き続き推奨されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">選択したアカウント モデルに関係なく、ID 検証は継続的に行う必要があります。組織は、アクセスを許可する前に、デバイス ポスチャーを検証する条件付きアクセス ポリシーをデプロイするとともに、ユーザーの API アクティビティをモニタリングし、侵害されたセッションを迅速に検知する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ブランチの保護</strong></h4>\n<p><span style=\"vertical-align: baseline;\">組織は、main ブランチへの直接 commit を禁止するポリシーを実装し、すべての変更において、マージの前にピアレビューを受け、自動化された CI チェックに合格することを必須とする、隔離された機能ブランチを通過するようにする必要があります。管理バイパス ポリシーは無効にする必要があります。ファイルシステム レベルでは、強制 push アクティビティを制限してモニタリングする必要があります。セキュリティ チームは、監査履歴を継続的に分析して時系列上の矛盾を見つけ出し、タイムラインの改ざんを特定するとともに、コードの引き出しに使用される不正なデッドドロップ リポジトリを検出しなければなりません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">認証情報のライフサイクル</strong></h4>\n<p><span style=\"vertical-align: baseline;\">長期にわたる持続的な侵入を防ぐため、組織は認証情報のローテーションを自動化し、ジャストインタイムの取得メカニズムを実装して、トークンの TTL を厳格に設定する必要があります。開発者のアクセスについては、組織は PAT の使用を廃止する必要があります。ホストに保存される静的なパスワードとして本質的に機能する PAT は、ローカルの情報窃取型マルウェアに対して脆弱です。代わりに、ハードウェア セキュリティ キー（FIDO2 / YubiKey や macOS Secure Enclave など）を基盤とする、暗号学的に検証された SSH ベースの認証に移行します。</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">自動化された CI / CD パイプラインやサードパーティ統合の場合、組織はサービス アカウントの PAT の代わりに GitHub アプリの使用を義務付け、1 時間後に自動的に失効する、有効期間が短く、アクセス範囲が厳格に制限されたアクセス トークンを活用する必要があります。シークレットは環境変数に保存しないでください。ローカル環境ファイル（.env）は .gitignore で除外し、ランタイム インジェクションにはネイティブ プラットフォームのシークレット機能を使用してください。</span></span></p>\n<h4><strong style=\"vertical-align: baseline;\">依存関係のセキュリティ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">セマンティック バージョニング（SemVer）を利用するアプリケーション マニフェストでは、解決時に依存関係のドリフトを引き起こす動的なバージョン範囲（キャレット ^、チルダ ~、ワイルドカード * 演算子など）を禁止する必要があります。代わりに、厳格に適用され、暗号学的に検証されたロックファイルによって裏付けられた、厳密な SemVer 固定（例: 1.4.2）を設定で義務付ける必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">未検証の実行ベクトル（「curl to bash」のようなブラインド スクリプトなど）はブロックし、明示的な SHA-256 ダイジェストを介して呼び出される、ベンダーが直接提供するコンテナを優先する必要があります。組織は、ソフトウェア構成分析（SCA）と到達可能性分析を組み合わせて実施し、アプリケーション パス内で実際に実行される脆弱性へのパッチ適用を優先する必要があります。ビルドでは、ソフトウェア部品構成表（SBOM）を生成し、ソフトウェア アーティファクトのためのサプライ チェーン レベル（SLSA）レベル 2 以上の来歴チェックを適用する必要があります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">アーティファクト管理</strong></h3>\n<p><span style=\"vertical-align: baseline;\">アーティファクト レイヤを防御するには、信頼できるビルド環境の境界を越えて入ってくるものを制御する必要があります。ポイントインタイムのスキャンではもはや不十分です。組織は、アップストリームのコンポーネントがダウンストリームに伝播する前に、継続的に検査および検証する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">依存関係のクールダウン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">組織は、新たに公開されたパブリック パッケージ バージョンがインストール可能になるまで、リリース後少なくとも 7 日間のクールダウン期間を義務付ける必要があります。コミュニティによる検出により、悪意のあるオープンソース パッケージが公開後すぐに特定され、排除されることがよくあるからです。</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">7 日間の厳格なバッファを設けることで、オープンソース エコシステムは、ポイズニングされたリリースが内部ビルドに到達する前に、それを検出して排除する時間を確保できます。この遅延は、一元化されたレジストリまたはローカル構成で適用する必要があります。具体的な構成パラメータ（npm の minimumReleaseAge クールダウンやセキュアな Python pip インデックスの指定など）については、付随する</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">で詳述されている技術実装手順をご覧ください。</span></span></p>\n<h4><strong style=\"vertical-align: baseline;\">プロキシと隔離</strong></h4>\n<p><span style=\"vertical-align: baseline;\">外部パッケージとコンテナ イメージはすべて、各コンポーネントをキャッシュ保存、検査、ゲート処理する一元化された内部プロキシを、可能な限り経由する必要があります。組織は、</span><a href=\"https://docs.cloud.google.com/artifact-registry/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Artifact Registry</span></a><span style=\"vertical-align: baseline;\"> を使用して、非公開リポジトリのホスト、仮想アップストリーム リポジトリの構成、公開レジストリへのビルドランナーの直接アクセスの制限を行うことで、このセキュアな境界を管理できます。プロキシ経由で到達する新しいコンポーネントは、隔離状態を保持してスクリーニングし、セキュリティ判定に失敗した場合はビルドを自動的にブロックする必要があります。依存関係の混乱を狙った攻撃を防ぐため、内部リポジトリは公開レジストリとは区別して管理する必要があります。また、信頼できるレジストリへの昇格は、ポリシーに基づく慎重な承認プロセスに従う必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">脆弱性スキャン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">コンテナ イメージとサードパーティの依存関係については、レジストリ レイヤとランタイムで自動スキャンを実行する必要があります。保存されたアーティファクトは、新たな脆弱性が見つかるたびに継続的に再評価する必要があります。アラート件数を管理するには、到達可能性分析や、</span><a href=\"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CISA の悪用が確認されている既知の脆弱性（KEV）カタログ</span></a><span style=\"vertical-align: baseline;\">といった実際の悪用シグナルを使用して、検出結果の優先順位を決定します。また、Vulnerability Exploitability eXchange（VEX）ステートメントを使用して、該当しない検出結果を抑制し、ノイズを減らします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">イメージの来歴</strong></h4>\n<p><span style=\"vertical-align: baseline;\">アーティファクトが信頼できるソースから取得されたものであると検証することは、既知の脆弱性がないことを確認することと同じくらい重要です。来歴は、内部で生成されたすべてのコンテナ イメージとパッケージに暗号署名し、それぞれを特定の構築ワークフローと、それらを生成したソース commit にバインドすることで、この信頼を確立します。最新の署名ツールを使用すると、有効期間の長い署名鍵を管理する負担を負うことなく、各署名イベントをビルド ID に関連付け、公開の透明性ログに記録することで、これを実用的なものにすることができます。署名は検証されて初めて意味を持つため、アドミッション制御時に検証を強制する必要があります。この検証は、期待される厳密なビルド ID に限定し、変更可能なタグではなくアーティファクトの不変のダイジェストに対して行う必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">この原則は、アーティファクトを公開する認証情報にも当てはまります。有効期間の長いレジストリ公開トークンは、繰り返しサプライ チェーン インシデントの根本原因となっています。盗んだトークンがあれば、攻撃者はポイズニングされたバージョンを信頼できる名前で公開できるからです。可能な場合は、これらの静的なトークンを、リリース時に特定の構築ワークフローに対して発行される、有効期間が短く、ID にバインドされた公開トークンに置き換えます。ファーストパーティ ビルドの場合、広く認められた来歴標準を採用することにより、ソフトウェアがどこでどのように構築されたかについて、一貫した基準を確立できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">SHA の参照</strong></h4>\n<p><span style=\"vertical-align: baseline;\">コンテナ イメージのタグとアクション参照はデフォルトで変更可能であるため、アップストリームのアクターは、信頼できる名前の背後にあるコンテンツをいつでも密かに置き換えることができます。不変の暗号ダイジェストに固定することで、この抜け穴をふさぐことができます。ダイジェストはコンテンツ ハッシュであり、基盤となるアーティファクトに変更が加えられると、別の識別子が生成されるからです。これにより、パイプラインがすでに信頼している名前で悪意のあるコンテンツにすり替えられるのを防ぎ、代わりに参照を切断できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">イメージはダイジェストで固定する必要があります。また、サードパーティのアクションは、再設定可能なバージョンではなく、完全な commit ハッシュに固定する必要があります。このルールは、メインのアプリケーション イメージだけでなく、ビルドが関与するすべてのイメージに適用する必要があります。変更可能なタグのままにしておくと、ベースイメージ、サイドカー、初期コンテナも同様にインジェクション ポイントとして利用される可能性があるからです。また、本番環境で再起動するたびに変更可能なタグを再解決するような構成も避ける必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">CI / CD</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CI / CD インフラストラクチャ内の自動化されたパイプラインを強化することは、ソフトウェア開発ライフサイクル全体を保護するための重要な要件です。これらの環境は、特権統合された広範なネットワークに依存してソース リポジトリ、サードパーティのレジストリ、クラウド インフラストラクチャにアクセスしているため、攻撃者にとって格好の標的となります。このような構築システムとデリバリー システムを保護するには、最小権限の原則を厳密に適用し、ネットワーク境界を厳格に運用して、信頼できるすべてのソフトウェア コンポーネントを継続的に検証する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ランナーとビルドサーバー</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これらのパイプラインはコード リポジトリ、依存関係レジストリ、クラウド環境へのアクセスを必要とするため、CI / CD インフラストラクチャの強化は極めて重要なタスクです。これらのインテグレーションを保護するための主な防御目標は、ランナーの永続性を排除することです。組織は、短命な単回使用のランナーを使用し、完了時に自動的に破棄される、隔離された新しい環境ですべてのジョブが実行されるようにする必要があります。このクリーンな状態から始めるアプローチにより、ジョブ間の汚染を防ぎ、攻撃者が永続的な足場を築くことを阻止します。セルフホスト環境の場合、この隔離をネットワーク層まで拡張し、ランナーのアウトバウンド トラフィックを、事前承認されたレジストリとリポジトリ API のみに制限して、データの引き出しを防ぐ必要があります。さらに、Poisoned Pipeline Execution（PPE）を軽減するため、実行エンジンは管理者が手動で承認するまで、pull リクエストに含まれる未検証のコードがシークレットにアクセスしたり、デプロイ グレードのランナーをトリガーしたりするのをブロックする必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、パイプラインでは、共有ビルド キャッシュが改ざんされないよう保護する必要があります。ビルド キャッシュは、ビルドを高速化するためにブランチ間で頻繁に共有されるため、悪意のある pull リクエストによって、破損した依存関係が共有キャッシュに直接挿入される可能性があります。これを放置すると、その後の本番環境ビルドでこのポイズニングされたキャッシュが取得され、信頼できる環境で悪意のあるコードが実行されてしまいます。パイプラインの設定では、ブランチの権限によってキャッシュ アクセスを厳密に隔離し、認証されていないフォークからのキャッシュ書き込みを拒否する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">最小権限の CI / CD</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フェデレーテッド エフェメラル ID:</strong><span style=\"vertical-align: baseline;\"> ワークフロー内での永続的な自動化シークレットの使用を禁止し、OIDC を利用してパイプライン ID を有効期間の短いトークンと交換するようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ゼロトラスト実行スコープ:</strong><span style=\"vertical-align: baseline;\"> デフォルトで読み取り専用または権限なしのランナー ID を発行し、実行可能な最小限の権限を明示的にリクエストするようコンポーネントに義務付けます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">共有状態のパラメータ化:</strong><span style=\"vertical-align: baseline;\"> ダウンストリーム テンプレートやネストされたワークフロー間で認証情報を自動継承することを禁止し、機密性の高い変数を隔離します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ランタイム ガバナンス: </strong><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">未承認のサードパーティ プラグインやマーケットプレイスのアクションを制限します。また、セキュリティ チームは、パッケージ インストールのライフサイクル スクリプトをサンドボックス化または無効化して（ignore-scripts=true などの構成を使用。詳細は付随する</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">をご覧ください）、侵害された依存関係が構築環境で任意のコマンドを実行することを防ぐ必要もあります。</span></span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">環境の分離:</strong><span style=\"vertical-align: baseline;\"> ネットワークと IAM の境界をセグメント化し、初期段階の検証タスクや lint チェックタスクを、リリース権限を持つシステムから完全に切り離して動作させるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">変更不可のブランチ履歴:</strong><span style=\"vertical-align: baseline;\"> 履歴の書き換え機能とカノニカル ブランチでの強制 push を無効にして、追加専用の監査証跡を維持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">IaC の検証:</strong><span style=\"vertical-align: baseline;\"> デプロイ前に Infrastructure as Code（IaC）をスキャンし、過剰な権限を持つ鍵、引用符で囲まれていないユーザー パラメータの挿入、暗号化されていない Webhook、ランナーの RBAC 構成ミスをブロックします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">スキャンゲートと証明書</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CI / CD のスキャンゲートは、デプロイ プロセス内で自動化された品質検証として機能します。設定されたセキュリティ基準に照らしてコードを評価し、定義された基準を満たさない場合はデプロイを自動的に停止します。スキャンゲートをプロセスのできるだけ早い段階に配置することで、潜在的な脆弱性が本番環境に到達する前に開発者に警告できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">シークレット スキャン</strong><span style=\"vertical-align: baseline;\">（開発者の commit / PR ゲート）:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">ハードコードされた API キー、パスワード、SSH 認証鍵が含まれている場合は開発者の push をブロックするよう、pre-commit フックと SCM レベルのスキャナを構成します。これにより、シークレットがリポジトリの永続的な履歴に保存されるのを防ぐことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">SAST - 静的アプリケーション セキュリティ テスト</strong><span style=\"vertical-align: baseline;\">（pull リクエスト / ピアレビュー ゲート）: SAST を継続的インテグレーション（CI）テストに統合し、ドラフト コードを main ブランチにマージする前に分析します。これにより、開発中に構造上の欠陥、ロジックの脆弱性、危険な関数（エスケープされていないユーザー入力など）が自動的に検出されます。</span></span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">SCA - ソフトウェア構成分析（構築フェーズ中）: </strong><span style=\"vertical-align: baseline;\">ビルド環境が依存関係を解決する際に SCA スキャンをトリガーします。パッケージ ロックファイル（package-lock.json や requirements.txt など）をスキャンして</span><a href=\"https://github.com/google/osv.dev\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Google OSV</span></a><span style=\"vertical-align: baseline;\"> などのデータベースと照合することで、アクティブな既知の CVE が存在するライブラリをインポートしようとするビルドを自動的に失敗させることができます。</span></span></span></p>\n<p><strong style=\"vertical-align: baseline;\">コンテナ / イメージ スキャン</strong><span style=\"vertical-align: baseline;\">（レジストリ / push ゲート）: 自動スキャナをコンテナ レジストリ パイプラインに直接組み込みます。新しく構築されたコンテナ イメージを本番環境用に許可リストに登録する前に、レジストリ スキャナでそのベース OS パッケージを検査し、重大な OS レベルの脆弱性やデフォルトでの root アクセスが含まれているイメージを拒否するようにします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">DAST - 動的アプリケーション セキュリティ テスト</strong><span style=\"vertical-align: baseline;\">（ステージング / デプロイ前）: デプロイの手順として、実行中のアプリケーションの、隔離された一時的なステージング インスタンスを作成します。自動化された DAST テストを実行し、エンドポイントに対する実際の攻撃（SQL インジェクションやクロスサイト スクリプティングなど）をシミュレートして、アクティブなランタイム防御構成が機能しているかどうかを検証します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">CSPM - クラウド セキュリティ ポスチャー管理</strong><span style=\"vertical-align: baseline;\">（デプロイ前の IaC スキャンおよびデプロイ後）: 変更を適用する前に、Policy as Code ツールを使用して Infrastructure as Code（IaC）テンプレート（Terraform や Kubernetes マニフェストなど）をスキャンします。これにより、過剰な権限を持つ IAM ロールや、SSH（ポート 22）がインターネットに公開されているセキュリティ グループなど、構成ミスのあるクラウド環境のプロビジョニングが自動的にブロックされます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">SBOM の生成と証明書</strong></h4>\n<p><span style=\"vertical-align: baseline;\">SBOM は、ビルドに含まれるすべてのコンポーネントの完全かつ検証可能なインベントリです。構築の一環として SBOM を生成して署名すると、このインベントリは、事後に再構築されたものではなく、改ざん検出が可能な証明書として生成されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">実際には、これは構築ステップとして、CycloneDX や SPDX のような広く認識された形式で SBOM を生成することを意味します。生成された SBOM は、アーティファクトのダイジェストに関連付けられた証明書として署名され、変更を防止します。署名付きの SBOM は、フリート内のすべてのイメージを再スキャンすることなく、影響を受けるアーティファクトにマッピングし直す必要があります。モニタリングを有効に保つには、VEX ステートメントを使用して、コードに適用されない検出結果にフラグを立て、インベントリが実用的なトリアージ ツールとして機能し続けるようにする必要があります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">デプロイ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ランタイム フェーズを保護することで、攻撃者がパイプラインの初期の防御策をうまくすり抜けたとしても、ワークロードは保護されたままになります。この運用レイヤは、コードがビルド パイプラインからアクティブな本番環境に移行する際の最終的な品質ゲートとして機能します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ワークロードの保護とランタイムの強化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ワークロードの保護は、実行中のアプリケーションとコンテナ インスタンスに直接適用し、実行フットプリントを制限して、アクティブなエクスプロイトをブロックする必要があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デプロイのガードレール: </strong><span style=\"vertical-align: baseline;\">本番環境の入り口に自動セキュリティ チェックを設置し、有効な暗号署名のないコンテナ、不要な root 権限を要求するコンテナ、信頼できない公開レジストリから取得されたコンテナをブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロード ポスチャー: </strong><span style=\"vertical-align: baseline;\">強化されたベースイメージからワークロードを構築し、読み取り専用のルート ファイル システムと削除された SSH 機能を備えた不変のインフラストラクチャで実行して、脆弱性の悪用後のファイル作成や横方向のディレクトリ トラバーサルを防止します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティブなアプリケーション保護: </strong><span style=\"vertical-align: baseline;\">ランタイム アプリケーション自己保護（RASP）をデプロイし、SQL インジェクションのような実行レベルでのエクスプロイトを阻止します。</span><a href=\"https://cloud.google.com/security/products/model-armor\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Model Armor</span></a><span style=\"vertical-align: baseline;\"> といったランタイム ガードレールを使用して、プロンプト インジェクションやジェイルブレイクから AI ワークロードを保護します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ジャストインタイム アクセス: </strong><span style=\"vertical-align: baseline;\">常時有効な管理者権限を排除し、有効期限が設定され、アクセスがタスクの範囲に限定された認証情報を採用します。この認証情報は自動的に期限切れとなり、必要な場合にのみ実行時に特権認証情報が挿入されます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">稼働中のインフラストラクチャの保護</strong></h4>\n<p><span style=\"vertical-align: baseline;\">周辺ネットワークとクラウド コントロール プレーンを保護することで、デプロイ済みのアプリケーションを外部の脅威から守り、ラテラル ムーブメントをブロックして、クラウド構成の完全性を維持できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ウェブ アプリケーション ファイアウォール（WAF）: </strong><span style=\"vertical-align: baseline;\">エッジ ファイアウォールをデプロイし、受信するアプリケーション レイヤのトラフィックを検査することで、悪意のあるペイロードをフィルタし、クロスサイト スクリプティングや</span><a href=\"https://owasp.org/Top10/2025/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">OWASP Top 10</span></a><span style=\"vertical-align: baseline;\"> の脆弱性といった一般的なウェブ エクスプロイトを、バックエンド サービスに到達する前にブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">API ゲートウェイとロードバランサ: </strong><span style=\"vertical-align: baseline;\">エッジ認証を一元化し、レート制限を適用して、リクエストの署名を検証することで、アプリケーション バックエンドが直接公開されることを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マイクロセグメンテーション: </strong><span style=\"vertical-align: baseline;\">ID 認識型のきめ細かなネットワーク ポリシーを適用してワークロードを隔離し、事前承認されたサービス間通信パスのみにトラフィックを制限することにより、デフォルトでネットワークのラテラル ムーブメントをブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">構成の整合性: </strong><span style=\"vertical-align: baseline;\">Policy as Code ツールをデプロイし、バージョン管理された IaC の信頼できる情報源と照らし合わせて稼働環境を継続的に検証し、コード外での変更を自動的に元に戻すことで、不正な変更を防止します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティブなポスチャー スキャン: </strong><span style=\"vertical-align: baseline;\">クラウド セキュリティ ポスチャー管理（CSPM）とクラウドネイティブ アプリケーション保護プラットフォーム（CNAPP）を実行し、クラウドの構成ミス、制限が過度に緩い IAM、公開されたストレージを継続的にスキャンします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">継続的なモニタリング: </strong><span style=\"vertical-align: baseline;\">ログ、システム指標、監査イベントを収集することですべてのシステムを完全に可視化し、ライブ セキュリティ イベントを迅速に検出、追跡して対応します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">まとめ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">最近のソフトウェア サプライ チェーンへの攻撃キャンペーンは、開発インフラストラクチャ、ビルド パイプライン、開発者のユーティリティが重要な脅威ベクトルであり、主要な侵害ポイントであることを示しています。従来のアクセス制御やポイントインタイムのセキュリティ スキャンでは、高度な侵入からこれらの環境を保護するには不十分です。開発ライフサイクルを強化するには、すべての段階で継続的な自動検証を実装し、開発者のエンドポイント、コード リポジトリ、パッケージ レジストリ、ビルドランナー、デプロイ ガードレールにわたるセキュリティ ポスチャーを、包括的な防御フレームワークに統合する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">最終的に、パイプライン セキュリティの目的は、侵入を隔離して封じ込めることができる、復元力のあるアーキテクチャを構築することです。コードの最初の commit から本番環境への最終的なデプロイに至るまで暗号学的検証とポリシー適用を自動化することで、組織は全体的な攻撃対象領域を大幅に縮小し、ダウンストリームの消費者を保護するとともに、個々の侵害が拡大する前に迅速に隔離して解決できます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">謝辞</strong></h3>\n<p><span style=\"vertical-align: baseline;\">このガイダンスの作成にあたり、多大なるご協力をいただいた Arafat Ismail 氏、Bhavesh Dhake 氏、Brentyn Muir 氏、Brian Meyer 氏、Emilio Oropeza 氏、Eyad Mahmoud 氏、Franklin Ramos 氏、Gursev Singh 氏、Omar ElAhdan 氏、Sara Takhim 氏、Stuart Carrera 氏、Stuart Munro 氏、Will Silverstone 氏、ならびに Mandiant セキュリティ トランスフォーメーション サービス チームの皆様に、深く感謝いたします。</span></p>\n<p><em><span style=\"vertical-align: baseline;\"> - Mandiant</span></em></p></div>"
