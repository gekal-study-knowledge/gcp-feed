"entries":
  "9e839811f0a786d06569b073f8fb326a":
    "id": "9e839811f0a786d06569b073f8fb326a"
    "title": "Cross-cloud conversational analytics made simple with open standards"
    "link": "https://cloud.google.com/blog/products/data-analytics/cross-cloud-conversational-analytics-with-borderless-lakehouse/"
    "published": "2026-10-14 01:00:00"
    "fetched": "2026-10-14 05:59:34"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The reality for most organizations is that data lives everywhere. As engineering teams expand and adopt specialized platforms for their workloads, enterprise data naturally disperses across multiple clouds and operational systems. When analytical and AI initiatives require context from across the entire organization,these teams traditionally face a difficult trade-off: build complex extraction pipelines to copy data into a central repository or accept fragmented reporting.</span></p>\n<p><span style=\"vertical-align: baseline;\">Traditional architectures address this fragmentation with scheduled extraction pipelines that copy remote datasets into a central staging warehouse. This approach creates synchronization lag, adds recurring storage costs, and triggers variable network egress fees. When schemas change upstream, pipelines break, and teams spend hours reconciling metrics across out-of-sync dashboards.</span></p>\n<p><span style=\"vertical-align: baseline;\">BigQuery and Google Cloud’s borderless Lakehouse offer a streamlined way to solve this challenge with a foundation based on the open Apache Iceberg REST catalog specification. Rather than moving data to the compute engine, you can bring Google Cloud compute and generative AI directly to your data, querying it in place across Databricks, Snowflake, and AWS Glue.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we walk through how to configure Databricks Unity Catalog for federation into BigQuery (AWS Glue and Snowflake set up in appendix),  run a single query joining data across all three external catalogs, and use conversational analytics in BigQuery to explore the consolidated data with natural language.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_dTgBJRG.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: BigQuery federates metadata across external Apache Iceberg REST catalogs through Lakehouse, enabling in-place conversational analytics without data migration.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">The borderless lakehouse architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">This solution uses </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse runtime catalog</span></a><span style=\"vertical-align: baseline;\"> to synchronize metadata from other cloud providers, allowing you to query data with BigQuery or external open source engines through the Apache Iceberg REST catalog endpoint, all without migrating the data. Because Databricks Unity Catalog, Snowflake Horizon Catalog, and AWS Glue Data Catalog support the open Apache Iceberg REST catalog specification, you can apply a consistent connection pattern across all three platforms.</span></p>\n<p><span style=\"vertical-align: baseline;\">When you run a federated query, Lakehouse runtime catalog separates metadata synchronization from storage access:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Metadata synchronization:</strong><span style=\"vertical-align: baseline;\"> Lakehouse runtime catalog  periodically syncs schemas, snapshot pointers, and table definitions from the remote catalog based on a refresh schedule you define.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct storage access:</strong><span style=\"vertical-align: baseline;\"> During query runtime, a compatible engine reads Parquet data files directly from remote object storage, such as Amazon S3, using temporary credentials issued by the remote platform.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">All query processing runs within Google cloud compute such as </span><a href=\"https://docs.cloud.google.com/bigquery/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> or </span><a href=\"https://docs.cloud.google.com/managed-spark/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service  for Apache Spark</span></a><span style=\"vertical-align: baseline;\">. Remote Databricks clusters, Snowflake virtual warehouses, and AWS compute instances are not invoked during execution.</span></p>\n<p><span style=\"vertical-align: baseline;\">Authentication follows an explicit three-step deployment pattern: create the federated catalog in Google Cloud, inspect its configuration to retrieve its automatically generated service account, and grant access permissions within the remote platform.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can use AI to generate sample data. The schema details for tables are provided below. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Configure Databricks Unity Catalog</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We begin in Databricks by preparing the catalog and table. In Unity Catalog, federated access requires that your target schema be associated with an external location registered in Databricks:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Run inside Databricks SQL workspace\\r\\nCREATE CATALOG IF NOT EXISTS dbx_retail_db;\\r\\n\\r\\n-- Declare the managed target location at the schema level\\r\\nCREATE SCHEMA IF NOT EXISTS dbx_retail_db.dbx_core \\r\\n  MANAGED LOCATION &#x27;s3://my-databricks-bucket/retail/data/&#x27;;\\r\\n\\r\\n-- Create the Iceberg dimension table\\r\\nCREATE TABLE IF NOT EXISTS dbx_retail_db.dbx_core.dim_products (\\r\\n    product_key INT,\\r\\n    product_id STRING,\\r\\n    product_name STRING,\\r\\n    category STRING,\\r\\n    subcategory STRING,\\r\\n    brand STRING,\\r\\n    price DOUBLE,\\r\\n    cost DOUBLE\\r\\n)\\r\\nUSING iceberg;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30e66290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You can use AI to generate sample data. The schema details for tables are provided in each section.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Before external engines can read this table, a Databricks metastore administrator must enable </span><strong style=\"vertical-align: baseline;\">External data access</strong><span style=\"vertical-align: baseline;\"> on the metastore details tab.</span></p>\n<p><span style=\"vertical-align: baseline;\">Go to Databricks Admin account and under User Management, create a </span><span style=\"vertical-align: baseline;\">Databricks Service Principal and make a note of its UUID </span><code style=\"vertical-align: baseline;\">\"6ea7b861-c5a5-xxxx-xxxx-xxxxxxxxxxxx\"</code></p>\n<h3><strong style=\"vertical-align: baseline;\">Connect Databricks to BigQuery</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Next, create the federated catalog inside Google Cloud using the </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> command-line tool. You will need your Databricks workspace URL and the application ID of your Databricks service principal:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;export GCP_PROJECT_ID=&quot;my-lakehouse-project&quot;\\r\\nexport GCP_REGION=&quot;us-central1&quot;\\r\\n\\r\\ngcloud alpha biglake iceberg catalogs create dbx_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --primary-location=&quot;$GCP_REGION&quot; \\\\\\r\\n  --catalog-type=&quot;federated&quot; \\\\\\r\\n  --federated-catalog-type=&quot;unity&quot; \\\\\\r\\n  --unity-instance-name=&quot;dbc-xxxxxxxx-xxxx.cloud.databricks.com&quot; \\\\\\r\\n  --unity-catalog-name=&quot;dbx_retail_db&quot; \\\\\\r\\n  --unity-service-principal-application-id=&quot;6ea7b861-c5a5-xxxx-xxxx-xxxxxxxxxxxx&quot; \\\\\\r\\n  --refresh-interval=&quot;300s&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e315db8d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Once created, describe the catalog to view its assigned service account:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud alpha biglake iceberg catalogs describe dbx_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e315da010&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Return to Databricks to assign permissions to your service principal:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Grant catalog traversal permission\\r\\nGRANT USE CATALOG ON CATALOG dbx_retail_db \\r\\n  TO `6ea7b861-c5a5-xxxx-xxxx-xxxxxxxxxxxx`;\\r\\n\\r\\n-- Grant schema and read permissions\\r\\nGRANT USE SCHEMA,EXTERNAL USE SCHEMA, SELECT ON SCHEMA dbx_retail_db.dbx_core \\r\\n  TO `6ea7b861-c5a5-xxxx-xxxx-xxxxxxxxxxxx`;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e317dd090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">You must grant the </span><code style=\"vertical-align: baseline;\">EXTERNAL USE SCHEMA</code><span style=\"vertical-align: baseline;\"> privilege to the Databricks Service Principal on the target schemas or catalog to enable credential vending for external data access.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, to complete the connection, configure the federation policy on the Databricks service principal with the following details - </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Issuer URL* -  </span><a href=\"https://accounts.google.com\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">https://accounts.google.com</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Subject* -  numeric subject ID returned by the catalog describe command eg 1124251400450xxxxxxxx</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Audiences - https://accounts.cloud.databricks.com</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Run one query across three clouds</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Federated Iceberg tables are addressed in BigQuery using four-part paths: </span><code style=\"vertical-align: baseline;\">project.catalog.namespace.table</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our environment, sales transactions reside natively in BigQuery:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE SCHEMA IF NOT EXISTS local_retail_dataset\\r\\nOPTIONS(location=&quot;us-central1&quot;);\\r\\n\\r\\nCREATE OR REPLACE TABLE `my-lakehouse-project.local_retail_dataset.fact_sales` (\\r\\n    sale_id STRING,\\r\\n    sale_date DATE,\\r\\n    customer_key INT64,\\r\\n    product_key INT64,\\r\\n    store_key INT64,\\r\\n    quantity INT64,\\r\\n    unit_price NUMERIC,\\r\\n    discount NUMERIC,\\r\\n    total_revenue NUMERIC,\\r\\n    total_cost NUMERIC,\\r\\n    margin NUMERIC\\r\\n)\\r\\nPARTITION BY sale_date\\r\\nCLUSTER BY store_key, product_key;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e317dfa10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We can now run a single SQL query joining our native sales transactions with customer records in Snowflake, product lines in Databricks, and store locations in AWS Glue:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT \\r\\n    c.first_name || &#x27; &#x27; || c.last_name AS customer_name, -- From Snowflake Iceberg\\r\\n    p.product_name,                                      -- From Databricks Iceberg\\r\\n    s.store_name,                                        -- From AWS S3 Iceberg\\r\\n    SUM(f.quantity) AS total_units_sold,                 -- From BigQuery native fact\\r\\n    SUM(f.total_revenue) AS total_sales_revenue          -- From BigQuery native fact\\r\\nFROM `my-lakehouse-project.local_retail_dataset.fact_sales` f\\r\\nINNER JOIN `my-lakehouse-project.sf_retail_db.CORE.DIM_CUSTOMERS` c \\r\\n  ON f.customer_key = c.customer_key\\r\\nINNER JOIN `my-lakehouse-project.dbx_retail_db.dbx_core.dim_products` p \\r\\n  ON f.product_key = p.product_key\\r\\nINNER JOIN `my-lakehouse-project.glue_retail_db.glue_retail_db.dim_stores` s \\r\\n  ON f.store_key = s.store_key\\r\\nGROUP BY 1, 2, 3\\r\\nORDER BY total_sales_revenue DESC\\r\\nLIMIT 10;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e317dc8d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">BigQuery processes the joins in place. Notice that Snowflake identifiers appear in uppercase (</span><code style=\"vertical-align: baseline;\">CORE.DIM_CUSTOMERS</code><span style=\"vertical-align: baseline;\">), while Databricks and AWS Glue maintain lowercase table paths.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_rJTiq5W.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2 - Query results combining data across Snowflake, Databricks, and AWS Glue.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Explore cross-cloud data with natural language</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Because federated Iceberg tables behave like native tables within BigQuery, downstream analytical features inherit access directly. You can point conversational analytics in BigQuery at these federated schemas to let team members explore cross-cloud data using natural language prompts.</span></p>\n<p><span style=\"vertical-align: baseline;\">To give conversational analytics full operational context, we save our federated join as a logical view:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE OR REPLACE VIEW `my-lakehouse-project.local_retail_dataset.v_omnichannel_sales_pulse` AS\\r\\nSELECT \\r\\n    f.sale_id,\\r\\n    f.sale_date,\\r\\n    c.first_name || &#x27; &#x27; || c.last_name AS customer_name,\\r\\n    c.country AS customer_country,\\r\\n    p.product_name,\\r\\n    p.category AS product_category,\\r\\n    p.brand AS product_brand,\\r\\n    s.store_name,\\r\\n    s.city AS store_city,\\r\\n    s.region AS store_region,\\r\\n    f.quantity,\\r\\n    f.total_revenue,\\r\\n    f.margin\\r\\nFROM `my-lakehouse-project.local_retail_dataset.fact_sales` f\\r\\nINNER JOIN `my-lakehouse-project.sf_retail_db.CORE.DIM_CUSTOMERS` c \\r\\n  ON f.customer_key = c.customer_key\\r\\nINNER JOIN `my-lakehouse-project.dbx_retail_db.dbx_core.dim_products` p \\r\\n  ON f.product_key = p.product_key\\r\\nINNER JOIN `my-lakehouse-project.glue_retail_db.glue_retail_db.dim_stores` s \\r\\n  ON f.store_key = s.store_key;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc3090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Analyze sales performance in natural language</span></h4>\n<p><span style=\"vertical-align: baseline;\">When you ask conversational analytics in BigQuery:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Who are our top customers by total sales revenue, what products did they buy, and which stores did they shop at?\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Conversational analytics evaluates the schema across all three remote catalogs, generates the SQL statement, executes the query, and presents the response. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_7V8coFu.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Conversational analytics in BigQuery translates plain-language prompts into federated queries across Snowflake, Databricks, and AWS Glue.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Plan for caching and data residency</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Before deploying federated catalogs in production, consider these operational behaviors:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Background refresh timing:</strong><span style=\"vertical-align: baseline;\"> The </span><code style=\"vertical-align: baseline;\">--refresh-interval</code><span style=\"vertical-align: baseline;\"> flag controls metadata synchronization. The minimum interval is 300 seconds. For larger catalogs containing hundreds of tables, metadata retrieval can take longer. If a sync cycle overruns, BigQuery skips the next scheduled run to avoid task queuing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automatic query caching:</strong><span style=\"vertical-align: baseline;\"> BigQuery caches retrieved cross-cloud data blocks in the region where your federated catalog resides (e.g. </span><code style=\"vertical-align: baseline;\">us-central1</code><span style=\"vertical-align: baseline;\">). This helps reduce network transfer on repeated queries. Because cached blocks reside within Google Cloud storage in that region, confirm that this aligns with your organization's data residency policies.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Encryption controls:</strong><span style=\"vertical-align: baseline;\"> Cross-cloud cache blocks use Google-managed encryption keys. If your organization enforces the </span><code style=\"vertical-align: baseline;\">constraints/gcp.restrictNonCmekServices</code><span style=\"vertical-align: baseline;\"> policy constraint, BigQuery bypasses the cache and reads directly from remote storage for every query.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitoring access metrics:</strong><span style=\"vertical-align: baseline;\"> You can evaluate cache utilization in your query execution plans. Check the </span><code style=\"vertical-align: baseline;\">objectStorageStats</code><span style=\"vertical-align: baseline;\"> section in BigQuery job statistics to compare </span><code style=\"vertical-align: baseline;\">cacheBytesRead</code><span style=\"vertical-align: baseline;\"> against </span><code style=\"vertical-align: baseline;\">objectStorageBytesRead</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Next steps</span></h3>\n<p><span style=\"vertical-align: baseline;\">In summary, Google Cloud’s borderless Lakehouse helps you activate your data regardless of where it lives without costly migrations or building additional data pipelines.   Get started today by reviewing the</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-cross-cloud-data-access\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">borderless Lakehouse architecture documentation</span></a><span style=\"vertical-align: baseline;\"> to learn more about supported regions and credential configurations. You can work through the</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/cross-cloud-data-access-codelab\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">borderless Lakehouse codelab</span></a><span style=\"vertical-align: baseline;\"> to practice federating external catalogs step-by-step. Finally, connect with your Google Cloud account team or customer engineer to evaluate borderless lakehouse patterns for your specific data platforms or industries.</span></p></div>\n<div class=\"block-paragraph_advanced\"><hr />\n<h3><span style=\"vertical-align: baseline;\">Appendix</span></h3>\n<p><strong style=\"vertical-align: baseline;\">Setting up Snowflake and AWS Glue cross cloud data access</strong></p>\n<h3><span style=\"vertical-align: baseline;\">Connect Snowflake and Big Query</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Configure Snowflake Horizon Catalog</span></h4>\n<p><span style=\"vertical-align: baseline;\">We begin in Snowflake by creating the database, schema, and Iceberg table. In Snowflake Horizon, managed Iceberg tables expose an open Apache Iceberg REST catalog interface automatically:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Run inside Snowflake SQL worksheet\\r\\nCREATE DATABASE IF NOT EXISTS sf_retail_db;\\r\\nCREATE SCHEMA IF NOT EXISTS sf_retail_db.core;\\r\\n\\r\\n-- Create the Iceberg dimension table\\r\\nCREATE OR REPLACE ICEBERG TABLE sf_retail_db.core.dim_customers (\\r\\n    customer_key INTEGER,\\r\\n    customer_id VARCHAR,\\r\\n    first_name VARCHAR,\\r\\n    last_name VARCHAR,\\r\\n    email VARCHAR,\\r\\n    gender VARCHAR,\\r\\n    country VARCHAR,\\r\\n    signup_date DATE\\r\\n\\r\\n)\\r\\nCATALOG = &#x27;SNOWFLAKE&#x27;\\r\\nEXTERNAL_VOLUME = &#x27;SNOWFLAKE_MANAGED&#x27;;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc1b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Before external engines can read this catalog, configure a dedicated reader role and grant traversal permissions across the database, schema, and table. </span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">SQL</span></span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Create a dedicated reader role\\r\\nCREATE ROLE IF NOT EXISTS gcp_lakehouse_reader_role;\\r\\n\\r\\n-- Grant database and schema traversal permissions\\r\\nGRANT USAGE ON DATABASE sf_retail_db TO ROLE gcp_lakehouse_reader_role;\\r\\nGRANT USAGE ON SCHEMA sf_retail_db.core TO ROLE gcp_lakehouse_reader_role;\\r\\n\\r\\n-- Grant read access on the target table\\r\\nGRANT SELECT ON TABLE sf_retail_db.core.dim_customers TO ROLE gcp_lakehouse_reader_role;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc3490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, create the federated catalog inside Google Cloud using the </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> command-line tool. You will need your Snowflake account identifier, the reader role, and the root Iceberg database name:</span></p>\n<p><span style=\"vertical-align: baseline;\">bash</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;export GCP_PROJECT_ID=&quot;my-lakehouse-project&quot;\\r\\nexport GCP_REGION=&quot;us-central1&quot;\\r\\n\\r\\ngcloud alpha biglake iceberg catalogs create sf_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --primary-location=&quot;$GCP_REGION&quot; \\\\\\r\\n  --catalog-type=&quot;federated&quot; \\\\\\r\\n  --federated-catalog-type=&quot;snowflake&quot; \\\\\\r\\n  --snowflake-account-identifier=&quot;xy12345-ab67890&quot; \\\\\\r\\n  --snowflake-warehouse=&quot;SF_RETAIL_DB&quot; \\\\\\r\\n  --snowflake-role=&quot;gcp_lakehouse_reader_role&quot; \\\\\\r\\n  --refresh-interval=&quot;300s&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e317dd4d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In the Apache Iceberg REST specification, </span><code style=\"vertical-align: baseline;\">--snowflake-warehouse</code><span style=\"vertical-align: baseline;\"> references the catalog root database name (</span><code style=\"vertical-align: baseline;\">SF_RETAIL_DB</code><span style=\"vertical-align: baseline;\">), not a virtual compute warehouse.</span></p>\n<p><span style=\"vertical-align: baseline;\">Once created, describe the catalog to view its assigned numeric service account ID:</span></p>\n<p><span style=\"vertical-align: baseline;\">bash</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud alpha biglake iceberg catalogs describe sf_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --format=\\&#x27;value(biglake-service-account-id)\\&#x27;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc2b90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Return to Snowflake to bind Google Cloud's numeric identity to a passwordless service user via Workload Identity Federation (WIF):</span></p>\n<p><span style=\"vertical-align: baseline;\">SQL</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Run inside Snowflake SQL worksheet\\r\\nUSE ROLE ACCOUNTADMIN;\\r\\n\\r\\n-- Bind Google Cloud&#x27;s numeric identity to a passwordless service user\\r\\nCREATE OR REPLACE USER snowflake_service_user\\r\\n  TYPE = SERVICE\\r\\n  WORKLOAD_IDENTITY = (\\r\\n    TYPE = GCP\\r\\n    SUBJECT = &#x27;102669xxxxxxxxxxxxxxxxx&#x27; -- Numeric subject ID returned by gcloud describe\\r\\n  )\\r\\n  DEFAULT_ROLE = gcp_lakehouse_reader_role\\r\\n  COMMENT = &#x27;Service user for Lakehouse catalog federation over WIF&#x27;;\\r\\n\\r\\n-- Grant the reader role to this service user\\r\\nGRANT ROLE gcp_lakehouse_reader_role TO USER snowflake_service_user;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc2950&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This establishes passwordless authentication over OpenID Connect, allowing BigQuery to discover table metadata and vend temporary query-time credentials directly from Snowflake Horizon.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Configure AWS Glue Data Catalog</span></h3>\n<p><span style=\"vertical-align: baseline;\">We begin in AWS by preparing the IAM identity, establishing access permissions across AWS Glue and Amazon S3, and registering the Iceberg table.</span></p>\n<p><span style=\"vertical-align: baseline;\">First, create a placeholder trust policy named </span><code style=\"vertical-align: baseline;\">trust_policy.json</code><span style=\"vertical-align: baseline;\">. This allows you to provision the AWS IAM role before Google Cloud assigns the unique catalog service agent:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;Version&quot;: &quot;2012-10-17&quot;,\\r\\n  &quot;Statement&quot;: [\\r\\n    {\\r\\n      &quot;Effect&quot;: &quot;Allow&quot;,\\r\\n      &quot;Principal&quot;: {\\r\\n        &quot;Federated&quot;: &quot;accounts.google.com&quot;\\r\\n      },\\r\\n      &quot;Action&quot;: &quot;sts:AssumeRoleWithWebIdentity&quot;,\\r\\n      &quot;Condition&quot;: {\\r\\n        &quot;StringEquals&quot;: {\\r\\n          &quot;accounts.google.com:aud&quot;: [&quot;PLACEHOLDER_VALUE&quot;],\\r\\n          &quot;accounts.google.com:sub&quot;: [&quot;PLACEHOLDER_VALUE&quot;]\\r\\n        }\\r\\n      }\\r\\n    }\\r\\n  ]\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc0d10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Create the IAM role using the AWS CLI. Setting a 12-hour session duration (</span><code style=\"vertical-align: baseline;\">43200</code><span style=\"vertical-align: baseline;\"> seconds) prevents credential expiration during long-running analytical queries:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;export AWS_ROLE_NAME=&quot;lakehouse_glue_federation_role&quot;\\r\\n\\r\\naws iam create-role \\\\\\r\\n  --role-name &quot;$AWS_ROLE_NAME&quot; \\\\\\r\\n  --assume-role-policy-document file://trust_policy.json \\\\\\r\\n  --max-session-duration 43200&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc3f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, define the permissions policy in a file named </span><code style=\"vertical-align: baseline;\">permissions_policy.json</code><span style=\"vertical-align: baseline;\">. This policy grants BigQuery permission to read the AWS Glue catalog metadata and access the underlying Parquet data files in Amazon S3:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;Version&quot;: &quot;2012-10-17&quot;,\\r\\n  &quot;Statement&quot;: [\\r\\n    {\\r\\n      &quot;Sid&quot;: &quot;GlueCatalogRead&quot;,\\r\\n      &quot;Effect&quot;: &quot;Allow&quot;,\\r\\n      &quot;Action&quot;: [\\r\\n        &quot;glue:GetCatalog&quot;,\\r\\n        &quot;glue:GetDatabase&quot;,\\r\\n        &quot;glue:GetDatabases&quot;,\\r\\n        &quot;glue:GetTable&quot;,\\r\\n        &quot;glue:GetTables&quot;\\r\\n      ],\\r\\n      &quot;Resource&quot;: &quot;arn:aws:glue:us-east-2:123456789012:*&quot;\\r\\n    },\\r\\n    {\\r\\n      &quot;Sid&quot;: &quot;S3BucketAndObjectRead&quot;,\\r\\n      &quot;Effect&quot;: &quot;Allow&quot;,\\r\\n      &quot;Action&quot;: [\\r\\n        &quot;s3:ListBucket&quot;,\\r\\n        &quot;s3:GetObject&quot;\\r\\n      ],\\r\\n      &quot;Resource&quot;: [\\r\\n        &quot;arn:aws:s3:::my-glue-iceberg-bucket&quot;,\\r\\n        &quot;arn:aws:s3:::my-glue-iceberg-bucket/*&quot;\\r\\n      ]\\r\\n    }\\r\\n  ]\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc0f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Attach this permissions policy to your newly created role:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;aws iam put-role-policy \\\\\\r\\n  --role-name &quot;$AWS_ROLE_NAME&quot; \\\\\\r\\n  --policy-name &quot;lakehouse_glue_federation_policy&quot; \\\\\\r\\n  --policy-document file://permissions_policy.json&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc1850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Important (AWS Lake Formation):</strong><span style=\"vertical-align: baseline;\"> If your AWS environment uses AWS Lake Formation, verify that the </span><code style=\"vertical-align: baseline;\">IAMAllowedPrincipals</code><span style=\"vertical-align: baseline;\"> group has access to the target database and table (or grant explicit Lake Formation permissions to </span><code style=\"vertical-align: baseline;\">lakehouse_glue_federation_role if the bucket is registered with AWS Lake Formation</code><span style=\"vertical-align: baseline;\">). Without this, Lake Formation security settings will block the IAM role from accessing catalog metadata.</span></p>\n<p><span style=\"vertical-align: baseline;\">With permissions in place, create the database and Iceberg table in AWS Glue using Amazon Athena:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Run inside Amazon Athena\\r\\nCREATE DATABASE IF NOT EXISTS glue_retail_db;\\r\\n\\r\\nCREATE TABLE IF NOT EXISTS glue_retail_db.dim_stores (\\r\\n    store_key INT,\\r\\n    store_id STRING,\\r\\n    store_name STRING,\\r\\n    city STRING,\\r\\n    state STRING,\\r\\n    region STRING,\\r\\n    manager STRING,\\r\\n    opened_date DATE\\r\\n\\r\\n)\\r\\nLOCATION &#x27;s3://my-glue-iceberg-bucket/retail/dim_stores/&#x27;\\r\\nTBLPROPERTIES (\\r\\n    &#x27;table_type&#x27;=&#x27;ICEBERG&#x27;,        \\r\\n    &#x27;format&#x27;=&#x27;parquet&#x27;,           \\r\\n    &#x27;write_compression&#x27;=&#x27;zstd&#x27; \\r\\n\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc2150&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Connect AWS Glue to BigQuery</span></h3>\n<p><span style=\"vertical-align: baseline;\">Next, register the federated catalog inside Google Cloud using the </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> command-line tool. You will need your 12-digit AWS Account ID, AWS Region, and the role ARN created above:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;export GCP_PROJECT_ID=&quot;my-lakehouse-project&quot;\\r\\nexport GCP_REGION=&quot;us-central1&quot;\\r\\nexport AWS_REGION=&quot;us-east-2&quot;\\r\\nexport AWS_ACCOUNT_ID=&quot;123456789012&quot;\\r\\n\\r\\ngcloud alpha biglake iceberg catalogs create glue_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --primary-location=&quot;$GCP_REGION&quot; \\\\\\r\\n  --catalog-type=&quot;federated&quot; \\\\\\r\\n  --federated-catalog-type=&quot;glue&quot; \\\\\\r\\n  --glue-warehouse=&quot;$AWS_ACCOUNT_ID&quot; \\\\\\r\\n  --glue-aws-region=&quot;$AWS_REGION&quot; \\\\\\r\\n  --glue-aws-role-arn=&quot;arn:aws:iam::${AWS_ACCOUNT_ID}:role/lakehouse_glue_federation_role&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc0490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To prevent premature background refresh failures while the AWS trust policy propagates, initialize the catalog without setting a refresh schedule.</span></p>\n<p><span style=\"vertical-align: baseline;\">Next, extract the unique numeric subject ID assigned to the catalog by Google Cloud:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;export LAKEHOUSE_SA_ID=$(gcloud alpha biglake iceberg catalogs describe glue_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --format=&quot;value(biglake-service-account-id)&quot;)\\r\\n\\r\\necho &quot;Assigned Lakehouse Service Account ID: $LAKEHOUSE_SA_ID&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc2f50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Return to the AWS CLI and update your IAM role's trust policy, replacing the placeholder with the verified Google Cloud identity:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;cat &gt; trust_policy_final.json &lt;&lt; EOF\\r\\n{\\r\\n  &quot;Version&quot;: &quot;2012-10-17&quot;,\\r\\n  &quot;Statement&quot;: [\\r\\n    {\\r\\n      &quot;Effect&quot;: &quot;Allow&quot;,\\r\\n      &quot;Principal&quot;: {\\r\\n        &quot;Federated&quot;: &quot;accounts.google.com&quot;\\r\\n      },\\r\\n      &quot;Action&quot;: &quot;sts:AssumeRoleWithWebIdentity&quot;,\\r\\n      &quot;Condition&quot;: {\\r\\n        &quot;StringEquals&quot;: {\\r\\n          &quot;accounts.google.com:aud&quot;: [\\r\\n            &quot;$LAKEHOUSE_SA_ID&quot;\\r\\n          ],\\r\\n          &quot;accounts.google.com:sub&quot;: [\\r\\n            &quot;$LAKEHOUSE_SA_ID&quot;\\r\\n          ]\\r\\n        }\\r\\n      }\\r\\n    }\\r\\n  ]\\r\\n}\\r\\nEOF\\r\\n\\r\\naws iam update-assume-role-policy \\\\\\r\\n  --role-name &quot;$AWS_ROLE_NAME&quot; \\\\\\r\\n  --policy-document file://trust_policy_final.json&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc1050&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">5. Enable metadata synchronization and verify</span></h3>\n<p><span style=\"vertical-align: baseline;\">bash</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud alpha biglake iceberg catalogs update glue_retail_db \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --refresh-interval=&quot;300s&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc3890&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Verify that the namespaces are discovered and synchronized:</span></p>\n<p><span style=\"vertical-align: baseline;\">bash</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Verify namespaces synchronized from AWS Glue\\r\\ngcloud alpha biglake iceberg namespaces list \\\\\\r\\n  --project=&quot;$GCP_PROJECT_ID&quot; \\\\\\r\\n  --catalog=&quot;glue_retail_db&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7e30dc07d0&gt;)])]&gt;</dd>\n</dl></div>"
  "613f7bed4825d70ff31b1c5bf99c3e8f":
    "id": "613f7bed4825d70ff31b1c5bf99c3e8f"
    "title": "Gemini 4 Argon available on Google Cloud, built to help solve your business’ hardest problems"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud/"
    "published": "2026-10-14 01:00:00"
    "fetched": "2026-10-14 05:59:34"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Last week we announced that Gemini Enterprise has evolved to make it even simpler to get work done, and introduced the </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini agent</strong></a><span style=\"vertical-align: baseline;\">, your new universal agent for work. It's always on and ready to answer your questions. It will write code, complete longer and more complex tasks, or perform whatever you need to get the job done, all from a single prompt box. And model intelligence underpins it all.</span></p>\n<p><span style=\"vertical-align: baseline;\">To enable a new frontier of work, we are making our new frontier model, </span><a href=\"https://deepmind.google/models/gemini/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\">, available on Google Cloud. </span></p>\n<p><span style=\"vertical-align: baseline;\">We trained Argon to work with both depth and precision, which allows it to maintain context across long, multi-step tasks which are reinforced with strong domain expertise along the way. Whether your team is running complex software builds, handling detailed financial and legal work, or deploying cybersecurity tools like </span><a href=\"https://cloud.google.com/security/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\">, Argon helps your teams maintain focus from start to finish.</span><strong style=\"vertical-align: baseline;\"> </strong></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Logo Wall Argon V3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Gemini_4_Logo_Wall_3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Customers and partners using Gemini 4 Argon</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Four ways Argon changes how your business works</span></h3>\n<h4><strong style=\"vertical-align: baseline;\">1. Hand off your hardest work</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Your teams already use Gemini for business to answer questions and draft content. With Argon, they can hand off the deep, multi-step work that used to take hours or days, and get back finished work they can use.</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon reads long documents that mix text, tables, charts and images, and turns them into one clear output grounded in those sources. It can pull findings from many sources into a single structured answer, analyze data over time, and write stronger legal, finance, and executive documents. On long tasks, it keeps going until the job is done. We trained Argon to respect system boundaries, report negative findings honestly, and pause for confirmation before taking irreversible steps, and it tells you when it couldn't find something or finish a task.</span></p>\n<p><span style=\"vertical-align: baseline;\">Customers who tested Argon tell us it excels at turning huge, unstructured inputs into cohesive outputs. </span></p>\n<p><span style=\"vertical-align: baseline;\">\"As software development becomes more agentic, teams need models that can support long-running, multi-step work across all stages of the development lifecycle. Gemini 4 Argon is designed to help organizations bring AI into development, security, and operations while keeping it within established enterprise workflows and controls.” </span><strong style=\"vertical-align: baseline;\">– Stuart Moncada, VP, GitLab.</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">2. Precise, verifiable results on the work that drives your business</strong></h4>\n<p><span style=\"vertical-align: baseline;\">In finance, legal, tax, and other regulated work, calculations and data extraction need to be precise, repeatable, and verifiable. </span></p>\n<p><span style=\"vertical-align: baseline;\">For financial quantitative work, Argon can help automate multi-step ledger reconciliations, spreadsheet formulas, and variance analyses. It delivers high calculation integrity, citation fidelity, and formula accuracy across quantitative models. The proof is in the numbers: Argon leads on the </span><a href=\"https://www.vals.ai/benchmarks/vals_index\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Vals Index</span></a><span style=\"vertical-align: baseline;\">, which measures economic impact across finance, coding, legal, and tax work.</span></p>\n<p><span style=\"vertical-align: baseline;\">In legal research, Argon can help legal teams review case law and regulatory filings to pull out verified citations and key precedents. It leads on domain-specific evaluations like Harvey's Legal Agent Benchmark for legal research and drafting, with strong citation fidelity and direct answers when helping teams evaluate complex legal precedents. </span></p>\n<p><span style=\"vertical-align: baseline;\">\"Gemini 4 Argon shows how much progress Google has made on agentic legal reasoning. We saw substantial improvements over Gemini 3.1 Pro across our legal agent evaluations, particularly in corporate M&amp;A, data privacy and cybersecurity, and EC/VC. Accuracy also held up on long-document analysis, an encouraging result for lawyers working through detailed transactional matters.\" </span><strong style=\"vertical-align: baseline;\">– Niko Grupen, Head of Applied Research, Harvey.</strong></p>\n<p><span style=\"vertical-align: baseline;\">“We collaborated with Google on NowAI-Bench to help shape Gemini 4 for key enterprise work. In early access, it delivered roughly 20% improved task success than Gemini 3.8 Flash, with standout gains in HR and customer service. On the ServiceNow AI Platform, our L1 Service Desk AI specialist brings Google’s most advanced intelligence, governed and secure, turning tasks into fully autonomous work.” </span><strong style=\"vertical-align: baseline;\">- Nenshad Bardoliwalla, Senior Vice President, AI Products, ServiceNow.</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">3. Build and ship products faster</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Argon is built to handle complex, multi-step projects from start to finish. Our customers consistently ask for intelligence that can break down goals, track progress, and update multiple files at the same time.</span></p>\n<p><span style=\"vertical-align: baseline;\">\"Gemini 4 Argon handles complex tasks reliably, from 3D games to rich animations. In Figma Make, it helps teams turn their most ambitious, multi-step ideas into impressive prototypes.” <strong>– Loredana Crisan, Chief Design Officer, Figma. </strong></span></p>\n<p><span style=\"vertical-align: baseline;\">To see how well Argon handles this, we put it to work on our own tools. The team behind our open-source Agent Development Kit (ADK) set out to reduce framework overhead and improve code performance while maintaining full compatibility with existing applications. Working autonomously overnight within automated testing guardrails, Argon surfaced optimizations, now live in google/adk-python, that </span><strong style=\"vertical-align: baseline;\">cut in-memory session prep time by 40% in long sessions and speed up cold imports by 21%. </strong><span style=\"vertical-align: baseline;\">To learn more, read the engineering deep dive </span><a href=\"https://developers.googleblog.com/optimizing-a-200000-line-python-codebase-overnight-with-gemini-4-argon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Across Google, engineering teams using Argon in Google Antigravity have increased agentic code submissions by more than 35% while cutting code rollbacks by nearly a third. The Chrome team used Argon to finish an architectural refactor across hundreds of files in Chromium's 40 million-line codebase, completing months of work in weeks. </span><span style=\"vertical-align: baseline;\">Argon's improvements in spatial reasoning, mathematical precision and visual coding also make it faster to go from idea to working prototype. </span></p>\n<p><span style=\"vertical-align: baseline;\">For more advanced algorithms, our code optimization and discovery agent </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/alphaevolve-is-available-for-everyone\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve</span></a><span style=\"vertical-align: baseline;\"> uses </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/alphaevolve/reference-guide/api-reference#supported-models\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Argon</span></a><span style=\"vertical-align: baseline;\"> to deliver strong performance improvements across real-world enterprise workloads, including factory scheduling, logistics, game code speed-ups, and chip layout — as well as complex mathematical benchmarks, and more. </span></p>\n<p><span style=\"vertical-align: baseline;\">To learn how to best use Argon, check out the developer's </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/guides/gemini-4-argon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">4. Stronger defense for your code and business </strong></h4>\n<p><span style=\"vertical-align: baseline;\">While Argon has cyber mitigations that block offensive tasks such as pentesting and exploitation,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">you can still take full advantage of Argon’s defensive capabilities using </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> to find and fix vulnerabilities, or use Argon with your own security harness.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">It ties for first place on CWE-Bench v1 with a top score of </span><span style=\"vertical-align: baseline;\">68% for remediating security vulnerabilities.</span></p>\n<p><span style=\"vertical-align: baseline;\">\"We are integrating Gemini 4 Argon into MarketingX for automated codebase security audits. In our evaluations, the model successfully identified 100% of top-priority vulnerabilities with 0% fabricated vulnerabilities across verified claims. This precision unlocks proactive, code-level security for our customers before deployment.” </span><strong style=\"vertical-align: baseline;\">- Yunus Emre, Chief AI Officer of AI Lab, HubX.</strong></p>\n<p><span style=\"vertical-align: baseline;\">Security also means being able to trust Argon inside your own environment. </span><span style=\"vertical-align: baseline;\">Argon is our most resilient model yet against indirect prompt injections</span><span style=\"vertical-align: baseline;\">, where malicious instructions or context are used to hijack a model’s behavior. It leads the Gray Swan Indirect Prompt Injection benchmark, cutting attack success across 15 adaptive attempts to 0.7%. That matters when Argon reads email, documents and webpages that may contain hidden malicious instructions. </span></p>\n<p><span style=\"vertical-align: baseline;\">We are also releasing Argon without cyber guardrails to a select set of trusted defenders, which allows for testing a full breadth of cybersecurity capabilities. Trusted defenders are vetted through our </span><a href=\"https://deepmind.google/fairwind-program/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fairwind Program</span></a><span style=\"vertical-align: baseline;\">, a limited access initiative that provides government, critical infrastructure, and cybersecurity partners exclusive, unmitigated access to advanced  models. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Enterprise customers and partners in our early access program are already seeing strong wins with Argon.</span></h3></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=opNsprLPCKc\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Business leaders discuss how they are testing and building with Gemini 4 Argon.</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=opNsprLPCKc\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em>Leaders from Amplitude, Deloitte, and Rakuten share Gemini 4 Argon results</em></sup></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Starting today, Gemini 4 Argon is available in </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for business</span></a><span style=\"vertical-align: baseline;\"> on the web, desktop, and mobile. Enterprise developers and builders can access Argon via API in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal;mode=prompt?model=gemini-4-argon&amp;region=global\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini platform</span></a><span style=\"vertical-align: baseline;\"> under model ID </span><code style=\"vertical-align: baseline;\">gemini-4-argon</code><span style=\"vertical-align: baseline;\">, in </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">, and in <a href=\"https://antigravity.google/blog/gemini-4-argon-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\">.</span></span></p>\n<p><span style=\"vertical-align: baseline;\">Argon launches at an introductory rate of $2 per million input tokens and $10 per million output tokens through November 30, 2026, with cached input tokens priced at 95% off. After November 30, standard pricing of $4 per million input tokens and $20 per million output tokens will apply. Review the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-argon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">model card</span></a><span style=\"vertical-align: baseline;\"> and <a href=\"https://drive.google.com/file/d/1YQ0xENI0e-jauxPSxTfUoOQ9aXHGsoWh/view\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">developer guide</span></a> </span><span style=\"vertical-align: baseline;\">for complete technical specifications, token limits, and migration instructions.</span></p>\n<p><span style=\"vertical-align: baseline;\">Cyber defenders can join us at </span><a href=\"https://cloudonair.withgoogle.com/events/summit-amer-security-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY26-Q4-GLOBAL-GLO10000010-onlineeventsession-er-dgcsm-SS-NORAM-249572&amp;utm_content=blog&amp;utm_term=argon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Summit</span></a><span style=\"vertical-align: baseline;\"> to learn how to use Gemini 4 Argon to defend against machine-speed threats and automate remediation.</span></p></div>"
