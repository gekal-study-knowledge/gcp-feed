  "613f7bed4825d70ff31b1c5bf99c3e8f":
    "id": "613f7bed4825d70ff31b1c5bf99c3e8f"
    "title": "Gemini 4 Argon available on Google Cloud, built to help solve your business’ hardest problems"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud/"
    "published": "2026-10-14 01:00:00"
    "fetched": "2026-10-14 05:59:38"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Last week we announced that Gemini Enterprise has evolved to make it even simpler to get work done, and introduced the </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini agent</strong></a><span style=\"vertical-align: baseline;\">, your new universal agent for work. It's always on and ready to answer your questions. It will write code, complete longer and more complex tasks, or perform whatever you need to get the job done, all from a single prompt box. And model intelligence underpins it all.</span></p>\n<p><span style=\"vertical-align: baseline;\">To enable a new frontier of work, we are making our new frontier model, </span><a href=\"https://deepmind.google/models/gemini/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\">, available on Google Cloud. </span></p>\n<p><span style=\"vertical-align: baseline;\">We trained Argon to work with both depth and precision, which allows it to maintain context across long, multi-step tasks which are reinforced with strong domain expertise along the way. Whether your team is running complex software builds, handling detailed financial and legal work, or deploying cybersecurity tools like </span><a href=\"https://cloud.google.com/security/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\">, Argon helps your teams maintain focus from start to finish.</span><strong style=\"vertical-align: baseline;\"> </strong></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Logo Wall Argon V3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Gemini_4_Logo_Wall_3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Customers and partners using Gemini 4 Argon</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Four ways Argon changes how your business works</span></h3>\n<h4><strong style=\"vertical-align: baseline;\">1. Hand off your hardest work</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Your teams already use Gemini for business to answer questions and draft content. With Argon, they can hand off the deep, multi-step work that used to take hours or days, and get back finished work they can use.</span></p>\n<p><span style=\"vertical-align: baseline;\">Argon reads long documents that mix text, tables, charts and images, and turns them into one clear output grounded in those sources. It can pull findings from many sources into a single structured answer, analyze data over time, and write stronger legal, finance, and executive documents. On long tasks, it keeps going until the job is done. We trained Argon to respect system boundaries, report negative findings honestly, and pause for confirmation before taking irreversible steps, and it tells you when it couldn't find something or finish a task.</span></p>\n<p><span style=\"vertical-align: baseline;\">Customers who tested Argon tell us it excels at turning huge, unstructured inputs into cohesive outputs. </span></p>\n<p><span style=\"vertical-align: baseline;\">\"As software development becomes more agentic, teams need models that can support long-running, multi-step work across all stages of the development lifecycle. Gemini 4 Argon is designed to help organizations bring AI into development, security, and operations while keeping it within established enterprise workflows and controls.” </span><strong style=\"vertical-align: baseline;\">– Stuart Moncada, VP, GitLab.</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">2. Precise, verifiable results on the work that drives your business</strong></h4>\n<p><span style=\"vertical-align: baseline;\">In finance, legal, tax, and other regulated work, calculations and data extraction need to be precise, repeatable, and verifiable. </span></p>\n<p><span style=\"vertical-align: baseline;\">For financial quantitative work, Argon can help automate multi-step ledger reconciliations, spreadsheet formulas, and variance analyses. It delivers high calculation integrity, citation fidelity, and formula accuracy across quantitative models. The proof is in the numbers: Argon leads on the </span><a href=\"https://www.vals.ai/benchmarks/vals_index\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Vals Index</span></a><span style=\"vertical-align: baseline;\">, which measures economic impact across finance, coding, legal, and tax work.</span></p>\n<p><span style=\"vertical-align: baseline;\">In legal research, Argon can help legal teams review case law and regulatory filings to pull out verified citations and key precedents. It leads on domain-specific evaluations like Harvey's Legal Agent Benchmark for legal research and drafting, with strong citation fidelity and direct answers when helping teams evaluate complex legal precedents. </span></p>\n<p><span style=\"vertical-align: baseline;\">\"Gemini 4 Argon shows how much progress Google has made on agentic legal reasoning. We saw substantial improvements over Gemini 3.1 Pro across our legal agent evaluations, particularly in corporate M&amp;A, data privacy and cybersecurity, and EC/VC. Accuracy also held up on long-document analysis, an encouraging result for lawyers working through detailed transactional matters.\" </span><strong style=\"vertical-align: baseline;\">– Niko Grupen, Head of Applied Research, Harvey.</strong></p>\n<p><span style=\"vertical-align: baseline;\">“We collaborated with Google on NowAI-Bench to help shape Gemini 4 for key enterprise work. In early access, it delivered roughly 20% improved task success than Gemini 3.8 Flash, with standout gains in HR and customer service. On the ServiceNow AI Platform, our L1 Service Desk AI specialist brings Google’s most advanced intelligence, governed and secure, turning tasks into fully autonomous work.” </span><strong style=\"vertical-align: baseline;\">- Nenshad Bardoliwalla, Senior Vice President, AI Products, ServiceNow.</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">3. Build and ship products faster</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Argon is built to handle complex, multi-step projects from start to finish. Our customers consistently ask for intelligence that can break down goals, track progress, and update multiple files at the same time.</span></p>\n<p><span style=\"vertical-align: baseline;\">\"Gemini 4 Argon handles complex tasks reliably, from 3D games to rich animations. In Figma Make, it helps teams turn their most ambitious, multi-step ideas into impressive prototypes.” <strong>– Loredana Crisan, Chief Design Officer, Figma. </strong></span></p>\n<p><span style=\"vertical-align: baseline;\">To see how well Argon handles this, we put it to work on our own tools. The team behind our open-source Agent Development Kit (ADK) set out to reduce framework overhead and improve code performance while maintaining full compatibility with existing applications. Working autonomously overnight within automated testing guardrails, Argon surfaced optimizations, now live in google/adk-python, that </span><strong style=\"vertical-align: baseline;\">cut in-memory session prep time by 40% in long sessions and speed up cold imports by 21%. </strong><span style=\"vertical-align: baseline;\">To learn more, read the engineering deep dive </span><a href=\"https://developers.googleblog.com/optimizing-a-200000-line-python-codebase-overnight-with-gemini-4-argon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Across Google, engineering teams using Argon in Google Antigravity have increased agentic code submissions by more than 35% while cutting code rollbacks by nearly a third. The Chrome team used Argon to finish an architectural refactor across hundreds of files in Chromium's 40 million-line codebase, completing months of work in weeks. </span><span style=\"vertical-align: baseline;\">Argon's improvements in spatial reasoning, mathematical precision and visual coding also make it faster to go from idea to working prototype. </span></p>\n<p><span style=\"vertical-align: baseline;\">For more advanced algorithms, our code optimization and discovery agent </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/alphaevolve-is-available-for-everyone\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve</span></a><span style=\"vertical-align: baseline;\"> uses </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/alphaevolve/reference-guide/api-reference#supported-models\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Argon</span></a><span style=\"vertical-align: baseline;\"> to deliver strong performance improvements across real-world enterprise workloads, including factory scheduling, logistics, game code speed-ups, and chip layout — as well as complex mathematical benchmarks, and more. </span></p>\n<p><span style=\"vertical-align: baseline;\">To learn how to best use Argon, check out the developer's </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/guides/gemini-4-argon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">4. Stronger defense for your code and business </strong></h4>\n<p><span style=\"vertical-align: baseline;\">While Argon has cyber mitigations that block offensive tasks such as pentesting and exploitation,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">you can still take full advantage of Argon’s defensive capabilities using </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> to find and fix vulnerabilities, or use Argon with your own security harness.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">It ties for first place on CWE-Bench v1 with a top score of </span><span style=\"vertical-align: baseline;\">68% for remediating security vulnerabilities.</span></p>\n<p><span style=\"vertical-align: baseline;\">\"We are integrating Gemini 4 Argon into MarketingX for automated codebase security audits. In our evaluations, the model successfully identified 100% of top-priority vulnerabilities with 0% fabricated vulnerabilities across verified claims. This precision unlocks proactive, code-level security for our customers before deployment.” </span><strong style=\"vertical-align: baseline;\">- Yunus Emre, Chief AI Officer of AI Lab, HubX.</strong></p>\n<p><span style=\"vertical-align: baseline;\">Security also means being able to trust Argon inside your own environment. </span><span style=\"vertical-align: baseline;\">Argon is our most resilient model yet against indirect prompt injections</span><span style=\"vertical-align: baseline;\">, where malicious instructions or context are used to hijack a model’s behavior. It leads the Gray Swan Indirect Prompt Injection benchmark, cutting attack success across 15 adaptive attempts to 0.7%. That matters when Argon reads email, documents and webpages that may contain hidden malicious instructions. </span></p>\n<p><span style=\"vertical-align: baseline;\">We are also releasing Argon without cyber guardrails to a select set of trusted defenders, which allows for testing a full breadth of cybersecurity capabilities. Trusted defenders are vetted through our </span><a href=\"https://deepmind.google/fairwind-program/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fairwind Program</span></a><span style=\"vertical-align: baseline;\">, a limited access initiative that provides government, critical infrastructure, and cybersecurity partners exclusive, unmitigated access to advanced  models. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Enterprise customers and partners in our early access program are already seeing strong wins with Argon.</span></h3></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=opNsprLPCKc\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Business leaders discuss how they are testing and building with Gemini 4 Argon.</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=opNsprLPCKc\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em>Leaders from Amplitude, Deloitte, and Rakuten share Gemini 4 Argon results</em></sup></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Starting today, Gemini 4 Argon is available in </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for business</span></a><span style=\"vertical-align: baseline;\"> on the web, desktop, and mobile. Enterprise developers and builders can access Argon via API in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal;mode=prompt?model=gemini-4-argon&amp;region=global\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini platform</span></a><span style=\"vertical-align: baseline;\"> under model ID </span><code style=\"vertical-align: baseline;\">gemini-4-argon</code><span style=\"vertical-align: baseline;\">, in </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">, and in <a href=\"https://antigravity.google/blog/gemini-4-argon-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\">.</span></span></p>\n<p><span style=\"vertical-align: baseline;\">Argon launches at an introductory rate of $2 per million input tokens and $10 per million output tokens through November 30, 2026, with cached input tokens priced at 95% off. After November 30, standard pricing of $4 per million input tokens and $20 per million output tokens will apply. Review the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/4-argon\"><span style=\"text-decoration: underline; vertical-align: baseline;\">model card</span></a><span style=\"vertical-align: baseline;\"> and <a href=\"https://drive.google.com/file/d/1YQ0xENI0e-jauxPSxTfUoOQ9aXHGsoWh/view\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">developer guide</span></a> </span><span style=\"vertical-align: baseline;\">for complete technical specifications, token limits, and migration instructions.</span></p>\n<p><span style=\"vertical-align: baseline;\">Cyber defenders can join us at </span><a href=\"https://cloudonair.withgoogle.com/events/summit-amer-security-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY26-Q4-GLOBAL-GLO10000010-onlineeventsession-er-dgcsm-SS-NORAM-249572&amp;utm_content=blog&amp;utm_term=argon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Summit</span></a><span style=\"vertical-align: baseline;\"> to learn how to use Gemini 4 Argon to defend against machine-speed threats and automate remediation.</span></p></div>"
