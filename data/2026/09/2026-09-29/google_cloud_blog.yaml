  "d90f365d77da359241118b7d1a57aa50":
    "id": "d90f365d77da359241118b7d1a57aa50"
    "title": "Introducing Ask, a new Google Earth Engine feature to accelerate geospatial coding"
    "link": "https://cloud.google.com/blog/products/data-analytics/accelerate-geospatial-coding-with-ai-in-google-earth-engine/"
    "published": "2026-09-29 01:00:00"
    "fetched": "2026-09-29 03:27:48"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Whether you are mapping global forest cover, detecting changes in the built environment, or monitoring agricultural yields, writing scripts in </span><a href=\"https://earthengine.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Earth Engine</span></a><span style=\"vertical-align: baseline;\"> is a powerful way to develop these insights. This platform is part of </span><a href=\"https://ai.google/earth-ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Earth AI</span></a><span style=\"vertical-align: baseline;\">, our collection of geospatial models and datasets designed to help you transform planetary information into actionable intelligence, and we’ve launched a new feature, Ask, that makes accessing that planetary intelligence even easier. </span></p>\n<p><span style=\"vertical-align: baseline;\">We know that translating complex geospatial logic into code takes time, and memorizing specific Google Earth Engine API functions, searching documentation, and debugging syntax or memory errors can interrupt your flow. Ask is designed to help you get to actionable insights faster, by integrating Gemini capabilities directly into the Google Earth Engine Code Editor.</span></p>\n<p><span style=\"vertical-align: baseline;\">Starting today, you can use your own Gemini API key to write, debug, understand, and optimize geospatial queries without ever leaving the Code Editor.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_hhaY4vo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: The new Ask panel resides on the right side of the Code Editor, providing chat-based AI assistance tailored to your active script.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">How it works: Context-aware assistance</span></h3>\n<p><span style=\"vertical-align: baseline;\">You can ask a question directly in the Code Editor, and get a response based on context from your workspace, such as:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The full text of your active script</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Your imported assets and geometries</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Your active session chat history</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Because Gemini capabilities in Google Earth Engine automatically understand your work, you don’t have to add code or explain your datasets. It already knows these details, so it can provide more relevant, helpful answers. Additionally, you can automatically view the diff and merge it into your script. No more copy and pasting!</span></p>\n<p><span style=\"vertical-align: baseline;\">You can also personalize Ask to make responses more comprehensive and suited to your needs:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Access the latest Gemini models:</strong><span style=\"vertical-align: baseline;\"> Choose the Gemini model that meets your needs — at launch, the available models are Gemini 3 Flash Preview, Gemini 3.1 Pro Preview, and Gemini 3.5 Flash.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Docs search:</strong><span style=\"vertical-align: baseline;\"> Use AI to search the official </span><a href=\"https://developers.google.com/earth-engine\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> for up-to-date syntax and functions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dataset search:</strong><span style=\"vertical-align: baseline;\"> Allow AI to search the </span><a href=\"https://developers.google.com/earth-engine/datasets\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Earth Engine Data Catalog</span></a><span style=\"vertical-align: baseline;\"> to find and reference the exact datasets you need.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Search:</strong><span style=\"vertical-align: baseline;\"> Grounds response in the latest public web results using Grounding with Google Search (mutually exclusive with docs search and dataset search).</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Quick-start examples</span></h3>\n<p><span style=\"vertical-align: baseline;\">Not sure where to start? Here are four ways you can use Ask in your workflows:</span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Generate code from natural language</span></h4>\n<p><span style=\"vertical-align: baseline;\">Need to calculate NDVI (“Normalized Difference Vegetation Index”), perform a cloud mask, or build a chart, but can't remember the exact syntax? Just ask and Earth Engine can generate JavaScript code for you. You can review the code directly in the chat and click </span><strong style=\"vertical-align: baseline;\">Insert</strong><span style=\"vertical-align: baseline;\"> to add it to your script, or </span><strong style=\"vertical-align: baseline;\">Copy</strong><span style=\"vertical-align: baseline;\"> it to your clipboard. If your editor is not empty, inserting code displays a side-by-side diff view so you can review changes before accepting them.</span></p>\n<p style=\"padding-left: 40px;\"><strong style=\"vertical-align: baseline;\">Prompt example:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"font-style: italic; vertical-align: baseline;\">\"Write a script to load Sentinel-2 imagery for 2025 over Boulder, CO, apply a cloud mask, calculate NDVI, and add the median composite to the map.\"</span></p>\n<h4><span style=\"vertical-align: baseline;\">2. Explain complex code</span></h4>\n<p><span style=\"vertical-align: baseline;\">If you’re working with a script written by a colleague or adapting an example from the community, you can use Gemini capabilities to explain it. Simply ask, </span><span style=\"font-style: italic; vertical-align: baseline;\">\"Explain what this script does,\"</span><span style=\"vertical-align: baseline;\"> and receive a step-by-step breakdown of the logic and Earth Engine functions being used.</span></p>\n<h4><span style=\"vertical-align: baseline;\">3.  Perform one-click troubleshooting and debugging</span></h4>\n<p><span style=\"vertical-align: baseline;\">Debugging is an inevitable part of coding. When your script throws an error in Google Earth Engine, the Console displays an error message. Now, those messages include a </span><strong style=\"vertical-align: baseline;\">\"Troubleshoot\"</strong><span style=\"vertical-align: baseline;\"> button. Clicking it automatically populates the Ask panel with a prompt that contains the error message and a request for help to diagnose the issue and suggest a fix.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_qed5vZZ.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: The \"Troubleshoot\" button in the Console makes debugging errors fast and frictionless.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">4. Optimize queries</span></h4>\n<p><span style=\"vertical-align: baseline;\">If your script is, for example, running slowly, consuming resources inefficiently, throwing \"computation timed out\" or \"too many concurrent aggregations\" errors, ask for optimization tips. Gemini capabilities can suggest best practices like early filtering, reducing computation steps, or converting client-side loops into server-side operations.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started in two steps</span></h3>\n<p><span style=\"vertical-align: baseline;\">Ask is available globally today. To get started, you just need a Gemini API key:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Get an API key:</strong><span style=\"vertical-align: baseline;\"> If you don’t already have a Gemini API key, head to </span><a href=\"https://aistudio.google.com/app/apikey\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\"> and create one (there are free options; if you choose a paid-tier API key, you will be billed for your usage). Learn more about </span><a href=\"https://ai.google.dev/terms\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini API terms</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Add the API key to GEE:</strong><span style=\"vertical-align: baseline;\"> Open the Google Earth Engine Code Editor. On the right-hand panel, click the </span><strong style=\"vertical-align: baseline;\">Ask</strong><span style=\"vertical-align: baseline;\"> panel. Click the key icon in the bottom left corner and enter your API key.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">We want to hear from you! Please use the Code Editor Feedback button to share your feedback and help us improve the experience.</span></p></div>"
  "bb23c6609c1d01782e7d29df26dc9d6c":
    "id": "bb23c6609c1d01782e7d29df26dc9d6c"
    "title": "Why your startup needs open models alongside frontier APIs"
    "link": "https://cloud.google.com/blog/topics/startups/why-your-startup-needs-open-models-alongside-frontier-apis/"
    "published": "2026-09-29 01:00:00"
    "fetched": "2026-09-29 03:27:48"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Every week, I talk with founders who are building at an unbelievable pace. Teams are moving from inception to product-market fit faster than ever, with foundation models wired deeply into their core product workflows.</span></p>\n<p><span style=\"vertical-align: baseline;\">Yet as startup architectures mature, a clear divide has emerged between teams struggling with margins and those scaling sustainably. The most effective engineering teams have abandoned the one-size-fits-all model strategy.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the early days of LLMs the default architecture was simple: send every interaction to the largest model available. But as applications move into production, serving millions of people and running autonomous multi-agent workflows, relying on a single frontier model starts to strain in three places:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Latency penalties: </strong><span style=\"vertical-align: baseline;\">Relying entirely on cloud round trips makes it difficult to deliver the sub-second responsiveness that interactive mobile and desktop apps require.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Infrastructure overhead: </strong><span style=\"vertical-align: baseline;\">Self-hosting large open models with more than 70 billion parameters forces early-stage teams to act like infrastructure providers, pulling senior engineers on cluster provisioning and multi-GPU orchestration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Margin erosion:</strong><span style=\"vertical-align: baseline;\"> Sending high-frequency, structured tasks (like intent routing, JSON extraction, or status validation) to general-purpose frontier endpoints spends capital that could be funding product differentiation.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Great engineering teams pick the right tool for each job. Most production requests don’t require a frontier generalist, and routing every call to one can actually slow your product down. Instead, the winning pattern is a compound AI stack: pairing frontier models for complex synthesis with compact, open-weight models that you can tune, control, and run anywhere. </span></p>\n<p><span style=\"vertical-align: baseline;\">It’s for these reasons that an open model like Gemma belongs in your model lineup. With more than one billion downloads across the </span><a href=\"https://deepmind.google/models/gemma/gemmaverse/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">developer community</span></a><span style=\"vertical-align: baseline;\">, Gemma 4 is our most capable open model family to date,</span><span style=\"vertical-align: baseline;\"> using the same foundational research and technology behind the Gemini models.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Built under one roof</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemma is built by Google DeepMind using the same foundational research and architecture advances behind the Gemini models. Because they share common DNA and developer tooling, your team can prototype in Google AI Studio and design hybrid architectures where Gemini and Gemma work together.</span></p>\n<p><span style=\"vertical-align: baseline;\">Released under a commercially permissive </span><strong style=\"vertical-align: baseline;\">Apache 2.0 license</strong><span style=\"vertical-align: baseline;\">, </span><a href=\"https://ai.google.dev/gemma/docs/core\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">Gemma 4</span></a><span style=\"vertical-align: baseline;\"> is engineered for </span><strong style=\"vertical-align: baseline;\">parameter and token efficiency</strong><span style=\"vertical-align: baseline;\">. Rather than forcing a single model architecture onto every hardware target, Gemma 4 spans five sizes across four specialized architectures: compact </span><strong style=\"vertical-align: baseline;\">E2B and E4B</strong><span style=\"vertical-align: baseline;\"> models with native audio and vision for mobile and edge devices; an encoder-free </span><strong style=\"vertical-align: baseline;\">12B Unified</strong><span style=\"vertical-align: baseline;\"> multimodal model; a </span><strong style=\"vertical-align: baseline;\">26B A4B Mixture-of-Experts (MoE)</strong><span style=\"vertical-align: baseline;\"> model that activates only 4B parameters per token for high-throughput serving; and a dense </span><strong style=\"vertical-align: baseline;\">31B</strong><span style=\"vertical-align: baseline;\"> model that fits on a single GPU for maximum reasoning quality and fine-tuning. Every model includes configurable thinking modes, native function calling, up to 256K context, and built-in Multi-Token Prediction (MTP) draft models for speculative decoding.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><span style=\"vertical-align: baseline;\">Real proof: How startups are winning with Gemma</span></h3>\n<p><span style=\"vertical-align: baseline;\">Founders are using Gemma to solve urgent problems around unit economics, output accuracy, and responsiveness.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flipping the architecture:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://heycue.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cue</span></a><span style=\"vertical-align: baseline;\"> is a voice-activated desktop assistant that runs natively on a user's machine to automate everyday tasks. They integrated Gemma 4 E4B via Ollama on local hardware to handle real-time transcript formatting. While they originally planned for Gemma to be a weak offline fallback, benchmarking proved it was so fast and precise that they made it their default engine—driving a </span><a href=\"https://deepmind.google/models/gemma/gemmaverse/cue-ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">44% latency drop</span></a><span style=\"vertical-align: baseline;\"> (from 876 ms to 488 ms).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">True edge independence: </strong><span style=\"vertical-align: baseline;\">Mobile development studio </span><a href=\"https://hubx.co/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">HubX</span></a><span style=\"vertical-align: baseline;\"> built </span><a href=\"https://betterspeak.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BetterSpeak</span></a><span style=\"vertical-align: baseline;\">, a voice-based interactive mobile English-learning tutor that simulates immersive, real-time voice conversations. To bypass cellular network lag and avoid charging users expensive subscription fees to cover cloud hosting, they packaged a 4-bit quantized Gemma 4 E2B model (~2.9 GB) natively on-device. The result is an </span><a href=\"https://deepmind.google/models/gemma/gemmaverse/betterspeak/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">offline, speech-to-speech mobile tutor</span></a><span style=\"vertical-align: baseline;\"> that costs them $0 in server bills.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scientific discovery and air-gapped security</strong><span style=\"vertical-align: baseline;\">: K-Dense has built </span><a href=\"https://www.k-dense.ai/products/faraday\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Faraday</span></a><span style=\"vertical-align: baseline;\">, an AI-powered scientific collaborator optimized end-to-end across hardware, software, and sensor suites, powered by Gemma 4 together with K-Dense's Scientific Agent Skills. Faraday runs fully air-gapped, making it suitable for secure, proprietary scientific work in pharma and biotech. Deployed on an NVIDIA DGX Spark, Gemma 4 can also be fine-tuned locally on a user's own proprietary datasets.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unlocking infinite gameplay and retention:</strong><span style=\"vertical-align: baseline;\"> Gaming company</span><a href=\"https://aidungeon.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Latitude</span></a><span style=\"vertical-align: baseline;\"> integrated Gemma across their AI-native game products. By swapping in Gemma for</span><a href=\"https://aidungeon.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Dungeon</span></a><span style=\"vertical-align: baseline;\">, they significantly improved player retention, while their new AI RPG platform</span><a href=\"https://voyage.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Voyage</span></a><span style=\"vertical-align: baseline;\"> leverages Gemma to deliver high intelligence at a cost that enables unlimited user gameplay with ultra-fast latency.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Four workloads where Gemma wins for startups</span></h3>\n<p><span style=\"vertical-align: baseline;\">If you’re evaluating where Gemma fits into your stack today, start with these four jobs:</span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Edge and local execution (low latency, true privacy)</span></h4>\n<p><span style=\"vertical-align: baseline;\">If you’re building mobile apps, developer desktop tools, robotics, or offline-first experiences, every cloud round-trip adds latency that people can feel. Gemma can run directly on laptops (including Apple silicon), smartphones, and local appliances. Your users get immediate feedback, and sensitive data never has to leave their device.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can handle many local interactions on-device for zero incremental cost, and keep a bridge to frontier models in the cloud for the requests that need it. When a local workflow calls for large-scale multimodal reasoning, long-context data synthesis, or complex planning, your application can route that specific request to Gemini.</span></p>\n<h4><span style=\"vertical-align: baseline;\">2. High-throughput triage and agent routing</span></h4>\n<p><span style=\"vertical-align: baseline;\">In multi-agent architectures, agents spend a surprising amount of tokens on simple tasks like checking statuses, classifying intent, and routing tickets. With Gemma as your front-line gatekeeper, those high-volume background tasks run on a compact model and your team can save frontier reasoning for the requests where it creates product value.</span></p>\n<h4><span style=\"vertical-align: baseline;\">3. Task-specific fine-tuning for real moats</span></h4>\n<p><span style=\"vertical-align: baseline;\">Adapting a model to your proprietary data is one way to build a competitive moat. Because Gemma gives you full access to model weights and has a compact memory footprint, your team can run parameter-efficient fine-tuning (LoRA or QLoRA) on a single GPU in hours rather than days.</span></p>\n<h4><span style=\"vertical-align: baseline;\">4. Turnkey vertical starting lines</span></h4>\n<p><span style=\"vertical-align: baseline;\">DeepMind releases domain-specific variants of Gemma, so you don’t have to start from scratch. One example is </span><a href=\"https://research.google/blog/medgemma-our-most-capable-open-models-for-health-ai-development/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MedGemma</span></a><span style=\"vertical-align: baseline;\">. MedGemma scores 87.7% on the MedQA benchmark, matching the clinical accuracy of frontier models at roughly one-tenth the inference cost. In a blind clinical study, board-certified radiologists judged that 81% of chest X-ray reports generated by the lightweight MedGemma 1.5 4B were accurate enough to result in equivalent patient management compared to reports written by human experts.</span></p>\n<p><span style=\"vertical-align: baseline;\">Beyond healthcare, biotech startups use </span><a href=\"https://research.google/blog/teaching-machines-the-language-of-biology-scaling-large-language-models-for-next-generation-single-cell-analysis/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C2S Scale</span></a><span style=\"vertical-align: baseline;\"> to model virtual cellular responses and accelerate oncology research. Meanwhile, </span><a href=\"https://deepmind.google/models/gemma/datagemma/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DataGemma</span></a><span style=\"vertical-align: baseline;\"> cross-references more than 240 billion public data points to help reduce numerical hallucinations. If you’re operating in a specialized market, starting with a model that already speaks your industry's language can save you engineering time and compute budget.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Deploy wherever your business lives</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemma is designed to fit into your existing engineering stack without lock-in:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Apache 2.0 licensing</strong><span style=\"vertical-align: baseline;\">: Gemma 4 ships under the Apache 2.0 license, giving startups the freedom to fine-tune, quantize, redistribute, and deploy commercial products on-premises or at the edge with full ownership of their custom weights.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Day-zero open tooling</strong><span style=\"vertical-align: baseline;\">: Run and fine-tune Gemma with the tools your engineers already use, including vLLM, Ollama, llama.cpp, LM Studio, MLX, Unsloth, Hugging Face, Kaggle, Keras, PyTorch, JAX, and LiteRT-LM.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Serverless and managed cloud deployment</strong><span style=\"vertical-align: baseline;\">: Prototype immediately in </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">, scale to zero on serverless GPUs with Cloud Run, or deploy dedicated endpoints from </span><a href=\"https://cloud.google.com/model-garden?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Garden</span></a><span style=\"vertical-align: baseline;\"> on Gemini Enterprise Agent Platform when traffic surges and you don’t want to manage GPU clusters.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise-ready safety</strong><span style=\"vertical-align: baseline;\">: Gemma undergoes rigorous pre-release safety evaluations, data filtering, and red-teaming, and pairs with ShieldGemma 2 to help you meet enterprise compliance requirements.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Build with Gemma: What to do this week</span></h3>\n<p><span style=\"vertical-align: baseline;\">Great technical architecture isn't about finding one model to do everything. It’s about assembling the right tool for each job so you can move faster, protect your runway, and ship a superior product.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here’s my challenge to your engineering team this week:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Audit your model calls:</strong><span style=\"vertical-align: baseline;\"> Look at your logging dashboard and identify three high-volume, deterministic tasks (such as intent classification, JSON validation, or summarization) currently running on your most expensive models.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Benchmark Gemma:</strong><span style=\"vertical-align: baseline;\"> Run a quick test with a compact Gemma model locally or on a single endpoint. Measure the latency and calculate what happens to your gross margins when that workload runs with lower inference cost.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Redirect your runway:</strong><span style=\"vertical-align: baseline;\"> Take the capital and engineering hours you save on compute and invest them back into your core differentiators.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">You can download the Gemma weights directly or deploy them through Model Garden. If you need compute credits and technical architecture reviews to get up and running, the Google for Startups team is ready to help you build - </span><a href=\"https://startup.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn more</span></a><span style=\"vertical-align: baseline;\">. </span></p></div>"
