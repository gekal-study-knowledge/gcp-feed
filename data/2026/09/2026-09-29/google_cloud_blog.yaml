    "title": "Defending at machine speed: Securing the public sector in the agentic era"
    "link": "https://cloud.google.com/blog/topics/public-sector/defending-at-machine-speed-securing-the-public-sector-in-the-agentic-era/"
    "published": "2026-09-29 23:00:00"
    "fetched": "2026-09-30 02:40:43"
    "summary": "<div class=\"block-paragraph\"><p>Over the last three decades in cybersecurity, I’ve witnessed major paradigm shifts — yet none match the velocity and complexity of today’s landscape. Attackers are now using AI to move at machine speed: accelerating intrusions, exploiting zero-day vulnerabilities, and rendering legacy defenses obsolete.</p><p>Reactive, manual security reviews can no longer keep pace with sophisticated and increasingly automated threats. Building true cyber resilience means shifting from reactive troubleshooting to a proactive defense — one where continuous posture validation and autonomous remediation are built directly into every workload from day one.</p><p>Public sector teams require a unified, structured approach to continuously scan, validate, and remediate software vulnerabilities. <a href=\"https://cloud.google.com/security/ai-threat-defense\">Google AI Threat Defense</a> brings together the reasoning power of <a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/\" target=\"_blank\">Gemini</a>, deep multi-cloud visibility from <a href=\"https://www.wiz.io/\" target=\"_blank\">Wiz</a>, autonomous code remediation with <a href=\"https://deepmind.google/blog/introducing-codemender-an-ai-agent-for-code-security/\" target=\"_blank\">CodeMender</a>, and <a href=\"https://services.google.com/fh/files/misc/accelerated-vulnerability-readiness-program-sb-en.pdf\" target=\"_blank\">Mandiant</a> frontline threat intelligence into a singular, continuous operational loop.</p><p>By securing the entire software lifecycle from code to cloud, this unified system enables agencies to continuously monitor and neutralize emerging threats at machine speed — safeguarding critical infrastructure, mission integrity, and public trust.</p><h3><b>Real-world cyber defenses in action</b></h3><p>Across state governments and higher education institutions, security and IT leaders are using Google’s AI and security solutions to secure highly dynamic environments, systems, and operations in the agentic era. Let’s take a closer look at how organizations across the public sector are automating defense and building resilience.</p><ul><li><a href=\"https://www.govexec.com/sponsors/2026/05/securing-government-mission-leveraging-agentic-ai-cybersecurity/413603/\" target=\"_blank\"><b>The State of Iowa</b></a><b>:</b> Under CISO Shane Dwyer, the state partnered with Google Public Sector to eliminate operational blindness, consolidating more than 20 separate security environments into a single, centralized security operations center (SOC). By ingesting large volumes of telemetry through Google Security Operations, Iowa established a unified operational view across its multi-cloud footprint — enabling its cyber personnel to move away from routine alert triage and focus on proactive threat defense and rapid incident remediation. Underway are several SOC process automation efforts that will continue to support the mission of reducing the overall workload and effectiveness of the SOC team.</li><li><a href=\"https://www.youtube.com/watch?v=N2l0NUlPlqk\" target=\"_blank\"><b>The State of Connecticut</b></a><b>:</b> Connecticut faced an unsustainable, fragmented security model across its multicloud footprint. Under CISO Gene Meltser, the state transitioned to a unified, AI-driven operations center with Google Cloud. This agentic Security Operations Center (SOC) configuration allows Connecticut to apply automated cyber defenses across decentralized networks, neutralizing novel threats in near real-time before they reach production systems.</li><li><a href=\"https://www.youtube.com/watch?v=Wv81ntozeBs&amp;t\" target=\"_blank\"><b>University of California, Riverside (UCR)</b></a><b>:</b> Under CIO Matthew Gunkel, UCR Information Technology Solutions (ITS) built an integrated stack on Google Cloud to serve an academic community of more than 26,000 students, faculty, and researchers. The university implemented Google Security Operations and Security Command Center to establish a Zero Trust security architecture, while deploying Gemini Enterprise to automate IT support workflows, empower faculty, and give security analysts real-time assistive intelligence to resolve incidents at machine speed.</li><li><a href=\"https://www.govexec.com/sponsors/2026/05/securing-government-mission-leveraging-agentic-ai-cybersecurity/413603/\" target=\"_blank\"><b>Arizona State University (ASU)</b></a><b>:</b> Under CISO Lester Godsey, ASU addressed policy friction by consolidating 19 new security standards and existing university policies into an interactive, queryable AI assistant. To prepare future cyber defenders for the agentic era, ASU is launching a student-led SOC that provides hands-on training in orchestration, automation, and AI security through Google technology and ASU’s CreateAI platform.</li></ul><h3><b>Scaling public trust through active defense</b></h3><p>In an operating environment shaped by machine-speed automation, true cyber resilience depends on embedding active, threat-informed defenses directly into every workload from day one. When public sector and higher education leaders empower their analysts with continuous visibility and intelligent security workflows, they can close critical exposure windows before adversaries can strike.</p><p>By replacing slow, manual reviews with automated defenses, security leaders can protect institutional integrity and ensure that the vital digital services supporting local communities, residents, and learners remain resilient, responsive, and secure.</p><p>Join us at our <a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\">Google Public Sector Summit</a> on October 20 where I’m moderating a breakout panel discussion, “Automating defense: Securing the agentic era against complex threats,” with security leaders who are fortifying critical missions. <a href=\"https://events.govexec.com/google-public-sector-summit/register/\" target=\"_blank\">Register now</a>.</p></div>"
  "2e5fddfe06a67c96f5daa32b6ed40b33":
    "id": "2e5fddfe06a67c96f5daa32b6ed40b33"
    "title": "Defending Against Active Exploitation of Citrix NetScaler ADC and Gateway Appliances"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances/"
    "published": "2026-09-29 14:00:00"
    "fetched": "2026-09-30 02:40:43"
    "summary": "<div class=\"block-paragraph_advanced\"><h3>Introduction</h3>\n<p><span style=\"vertical-align: baseline;\">In late September 2026, Mandiant Consulting and Google Threat Intelligence Group (GTIG) identified active, in-the-wild exploitation of a zero-day vulnerability (CVE-2026-88772) affecting Citrix NetScaler ADC and NetScaler Gateway appliances. We have observed evidence that organizations in North America and Europe in the government, financial services, education, legal and professional services sectors were likely impacted by this exploitation campaign, which has been ongoing since at least early September. According to vendor disclosures, threat actors are also actively exploiting a second zero-day vulnerability (CVE-2026-88771). </span></p>\n<p><span style=\"vertical-align: baseline;\">Exploitation of CVE-2026-88772 bypasses authentication and triggers an unhandled termination of the NetScaler Packet Processing Engine (NSPPE) to establish initial root-level access. Analysis of the actor’s post-exploitation toolkit reveals newly discovered custom PHP web shells, such as WHIPSHOT, capable of disguising Base64-encoded command-and-control (C&amp;C) payloads within native HTTP headers. The toolkit also includes a novel companion Python tunneler, SLAPSHOT, capable of proxying traffic into internal networks for reconnaissance and credential theft. In at least one observed intrusion, the threat actor routed traffic through this proxy to manually conduct internal reconnaissance and credential theft.</span></p>\n<p><span style=\"vertical-align: baseline;\">Citrix issued guidance for customers on newly addressed vulnerabilities and recommended updates </span><a href=\"https://community.citrix.com/techzone-blogs/110_security-updates/netscaler-adc-and-netscaler-gateway-security-bulletin-for-cve-2026-88771-through-cve-2026-88778/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. We encourage defenders to review the Citrix documentation and prioritize patching of these vulnerabilities. As part of this blog, Mandiant is also issuing containment and remediation guidance. </span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Campaign Overview</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Initial Access</span></h4>\n<p><span style=\"vertical-align: baseline;\">During the initial pre-authentication cryptographic handshake the NSPPE parses inbound DTLS record structures. While Google Threat Intelligence Group does not possess exploit code, analysis of frontline telemetry suggests that transmitting specially malformed or fragmented record headers induces heap memory boundary corruption within the packet engine, diverting control flow to execute arbitrary shellcode with root-level operating system privileges on the underlying FreeBSD platform.</span></p>\n<p><span style=\"vertical-align: baseline;\">Successful exploitation attempts generated two log artifacts:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>0-PPE-0 : default SSLLOG SSL_HANDSHAKE_FAILURE 0 : SPCBId - ClientIP - ClientPort - VserverServiceIP - VserverServicePort 443 - ClientVersion DTLSv1.0 - CipherSuite \"TLS1-AES-256-CBC-SHA\" - Session New - Reason \"Handshake failure-Internal Error\"\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 1: SSL Handshake Failure recorded in Syslog</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>qat0: Process &lt;PID&gt; NSPPE-&lt;##&gt; exit with orphan rings 5:500\npitboss[&lt;##&gt;]: pitboss &lt;DATETIME&gt; NOT restarting NSPPE-&lt;##&gt; (&lt;PID&gt;)\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 2: NSPPE Process Termination (/var/log/messages) recorded by the FreeBSD kernel and the appliance watchdog daemon (pitboss) </span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Establish Foothold and Persistence</span></h4>\n<p><span style=\"vertical-align: baseline;\">Following successful exploitation, the initial web shell payload self-installs by modifying target httpd.conf files, configuring the system to treat specified non-script file types as executable PHP scripts, setting the stage for the deployment of additional custom malware including WHIPSHOT (a PHP web shell) and SLAPSHOT (a Python proxy/tunneler). </span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Web Server Persistence Method A: Package Handler Masquerading (.deb)</span></h4>\n<p><span style=\"vertical-align: baseline;\">In one case, the initial installer modified </span><code style=\"vertical-align: baseline;\">/etc/httpd.conf</code><span style=\"vertical-align: baseline;\"> to have the web server handle .deb files as though they were PHP scripts.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>php_flag engine on\n  &lt;FilesMatch \"\\.deb$\"&gt;\n    Header set Cache-Control \"no-cache\"\n  &lt;/FilesMatch&gt;\nAddHandler application/x-httpd-php .deb\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 3: Persistence via package handler masquerading</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This configuration change allowed the actor to stage web shells with deceptive file type extensions in </span><code style=\"vertical-align: baseline;\">/netscaler/gui/vpn/scripts/linux</code><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Web Server Persistence Method B: Icon Aliasing and Signature File Handler (.sig)</span></h4>\n<p><span style=\"vertical-align: baseline;\">In other intrusions, the threat actor implemented a stealthier configuration hook that disguised web shell execution as image requests:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>php_flag engine on#\nAliasMatch ^/vpn/media/(.+).ico$ /var/netscaler/gui/vpn/scripts/linux/$1.sig\nAddHandler application/x-httpd-php .sig\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 4: Persistence via icon aliasing and signature file handler</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This configuration directive performs three actions:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enables the mod_php engine.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Registers .sig files as executable PHP scripts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Maps any incoming HTTP request ending in .ico under /vpn/media/ directly to a corresponding .sig file with the same base name inside /var/netscaler/gui/vpn/scripts/linux/.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">For example, clients accessing /vpn/media/e6ee7c85.ico would be served by the dropped PHP web shell </span><code style=\"vertical-align: baseline;\">e6ee7c85.sig</code><span style=\"vertical-align: baseline;\">. In at least one case, web server access logs showed GET requests returning HTTP 404 responses, but exhibiting elevated processing durations and multi-kilobyte response sizes. In subsequent days, the actor attempted access to non-existent .sig files, which generated missing-file errors in httperror-vpn logs implying the files were not there. This may be an indication of attackers managing similar web shells in multiple compromised environments.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Root Privilege Persistence</span></h4>\n<p><span style=\"vertical-align: baseline;\">Although the initial exploitation of CVE-2026-88772 executes with root privileges, subsequent requests processed by the web server (httpd) run under an unprivileged web service context. To establish persistent root-level execution for its web shells, the threat actor leveraged its lightweight installer web shells to assert the setuid (Set User ID) bit on the </span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\"> executable</span><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>chmod u+s /bin/sh\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 5: Command to set the User ID</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">By altering the permissions of </span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\">, the threat actor was able to ensure that subsequent web requests processed by the web server would execute with the elevated permissions.</span><span style=\"vertical-align: baseline;\"> To apply the </span><code style=\"vertical-align: baseline;\">/etc/httpd.conf</code><span style=\"vertical-align: baseline;\"> modifications alongside the SUID shell change, the installer initiated a full NetScaler appliance reboot (</span><code style=\"vertical-align: baseline;\">/netscaler/nsshutdown -R</code><span style=\"vertical-align: baseline;\">). </span></p>\n<p><span style=\"vertical-align: baseline;\">In other variations of the web shell, the threat actor issued a command to restart</span><span style=\"vertical-align: baseline;\"> the web service directly and assign root setuid (Set User ID)</span><span style=\"vertical-align: baseline;\"> permissions to the </span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\"> executable. </span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>system('/bin/httpd -k restart -f /etc/httpd.conf &amp;&amp; chmod u+s /bin/sh');</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 6: Command to restart the webservice</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Malware Analysis</span></h4>\n<p><span style=\"vertical-align: baseline;\">The threat actor has deployed multiple PHP web shells and a tunneler malware to proxy traffic into the victim organization’s network facilitating internal reconnaissance, lateral movement and credential harvesting.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Installer and Standalone web shells</span></h4>\n<p><span style=\"vertical-align: baseline;\">Mandiant recovered several lightweight PHP web shells staged in files with .deb and .sig extensions that provide direct command execution and automated appliance persistence. Across directly observed intrusions, the web shell filenames varied between victims. We observed multiple examples of lightweight web shells using variations of “nginstaller,” often followed by a number, as the filename. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">One example, when executed via command-line interface (CLI), it modifies </span><code style=\"vertical-align: baseline;\">/etc/httpd.conf</code><span style=\"vertical-align: baseline;\">, enables setuid root permissions on </span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">chmod u+s /bin/sh</code><span style=\"vertical-align: baseline;\">), scrubs references to </span><code style=\"vertical-align: baseline;\">/vpn/scripts/linux</code><span style=\"vertical-align: baseline;\"> from </span><code style=\"vertical-align: baseline;\">/etc/crontab</code><span style=\"vertical-align: baseline;\">, and initiates an appliance reboot via </span><code style=\"vertical-align: baseline;\">/netscaler/nsshutdown -R</code><span style=\"vertical-align: baseline;\">. Over HTTP, it extracts Base64-encoded commands from the </span><code style=\"vertical-align: baseline;\">HTTP_NSC_LDAP</code><span style=\"vertical-align: baseline;\"> header, executes them via </span><code style=\"vertical-align: baseline;\">shell_exec()</code><span style=\"vertical-align: baseline;\">, and returns Base64-encoded output.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Another observed web shell variant that returns a spoofed HTTP </span><code style=\"vertical-align: baseline;\">404 Not Found</code><span style=\"vertical-align: baseline;\"> response code. It restarts the Apache daemon (</span><code style=\"vertical-align: baseline;\">/bin/httpd -k restart -f /etc/httpd.conf</code><span style=\"vertical-align: baseline;\">) to apply configuration changes and executes incoming payloads using </span><code style=\"vertical-align: baseline;\">eval()</code><span style=\"vertical-align: baseline;\">. For evasion, it uses a regular expression (</span><code style=\"vertical-align: baseline;\">#^.*/vpn/scripts/linux.*\\n#m</code><span style=\"vertical-align: baseline;\">) to systematically scrub its installation path from system `/etc/crontab`. The web shell executes incoming Base64-encoded payloads received via HTTP from the </span><code style=\"vertical-align: baseline;\">HTTP_NSC_LDAP</code><span style=\"vertical-align: baseline;\"> header directly as PHP using `eval()`.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">e6ee7c85.sig</strong><span style=\"vertical-align: baseline;\">: A web shell variant that also enforces </span><code style=\"vertical-align: baseline;\">HTTP 404 Not Found</code><span style=\"vertical-align: baseline;\"> responses, but extracts Base64-encoded payloads from the </span><code style=\"vertical-align: baseline;\">HTTP_NSC_CLIENTTYPE</code><span style=\"vertical-align: baseline;\"> request header, likewise executing via </span><code style=\"vertical-align: baseline;\">eval()</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"font-style: italic; vertical-align: baseline;\">WHIPSHOT</span></h4>\n<p><span style=\"vertical-align: baseline;\">WHIPSHOT is a PHP web shell disguised as a Debian package and placed in </span><code style=\"vertical-align: baseline;\">/netscaler/ns_gui/vpn/scripts/linux/</code><span style=\"vertical-align: baseline;\">. It functions as an HTTP transport bridge for the SLAPSHOT proxy daemon.</span></p>\n<p><span style=\"vertical-align: baseline;\">Key capabilities and behaviors include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">HTTP Chunked Transport:</strong><span style=\"vertical-align: baseline;\"> It inspects incoming HTTP request headers for sequential parameter blocks (</span><code style=\"vertical-align: baseline;\">HTTP_X_UX_0</code><span style=\"vertical-align: baseline;\"> through </span><code style=\"vertical-align: baseline;\">HTTP_X_UX_95</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">HTTP_X_UX</code><span style=\"vertical-align: baseline;\">). It concatenates these header values, Base64-decodes the resulting stream, and forwards the data over loopback to the SLAPSHOT proxy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Process Management &amp; Launcher:</strong><span style=\"vertical-align: baseline;\"> Before establishing a connection, WHIPSHOT checks for the presence of </span><code style=\"vertical-align: baseline;\">/tmp/.uxdport</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">/tmp/.uxdlock</code><span style=\"vertical-align: baseline;\">. If the proxy is not active, WHIPSHOT extracts an embedded Base64 payload containing </span><code style=\"vertical-align: baseline;\">SLAPSHOT</code><span style=\"vertical-align: baseline;\"> and spawns it in the background using:</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>nohup &lt;python&gt; -c 'import base64;exec(base64.b64decode(\"&lt;payload&gt;\"))' /tmp/.uxdport /tmp/.uxdlock &gt; /dev/null 2&gt;&amp;1 &lt;/dev/null &amp;</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 7: Command to execute SLAPSHOT in the background</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Loopback IPC:</strong><span style=\"vertical-align: baseline;\"> Once SLAPSHOT is active, WHIPSHOT reads the dynamic TCP port recorded in </span><code style=\"vertical-align: baseline;\">/tmp/.uxdport</code><span style=\"vertical-align: baseline;\">, establishes a socket connection to </span><code style=\"vertical-align: baseline;\">127.0.0.1:&lt;port&gt;</code><span style=\"vertical-align: baseline;\">, and relays the client request.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evasion:</strong><span style=\"vertical-align: baseline;\"> WHIPSHOT suppresses standard error reporting (</span><code style=\"vertical-align: baseline;\">error_reporting(0)</code><span style=\"vertical-align: baseline;\">) and sets an HTTP </span><code style=\"vertical-align: baseline;\">404 Not Found</code><span style=\"vertical-align: baseline;\"> response header while returning the tunneled TCP response within the HTTP body.</span></p>\n</li>\n</ul>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">SLAPSHOT</span></h4>\n<p><span style=\"vertical-align: baseline;\">SLAPSHOT is a TCP tunneling tool written in Python. It acts as an internal network bridge, accepting commands from WHIPSHOT and forwarding arbitrary TCP streams to internal hosts.</span></p>\n<p><span style=\"vertical-align: baseline;\">Key capabilities and behaviors include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dynamic Port Binding &amp; Locking: </strong><span style=\"vertical-align: baseline;\">When launched, SLAPSHOT binds to an ephemeral port on 127.0.0.1, writes the active port number to a specified file such as </span><code style=\"vertical-align: baseline;\">/tmp/.uxdport</code><span style=\"vertical-align: baseline;\">, and uses fcntl.flock to secure an exclusive file lock on a lock file such as </span><code style=\"vertical-align: baseline;\">/tmp/.uxdlock</code><span style=\"vertical-align: baseline;\"> via  ensuring only a single instance runs concurrently.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Custom Wire Protocol:</strong><span style=\"vertical-align: baseline;\"> Communication with the proxy uses a custom binary protocol where each message consists of a 4-byte big-endian length prefix followed by a JSON payload. Supported command actions include:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">open</code><span style=\"vertical-align: baseline;\">: Establishes an outbound TCP socket to a target host and port.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">push</code><span style=\"vertical-align: baseline;\">: Writes data to an open session.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">pull</code><span style=\"vertical-align: baseline;\">: Polls and reads data from an open session socket.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">exch</code><code style=\"vertical-align: baseline;\">:</code><span style=\"vertical-align: baseline;\"> Sends and receives C&amp;C data to and from an open session socket.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">close</code><span style=\"vertical-align: baseline;\">: Terminates a specified network session.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">ping</code><span style=\"vertical-align: baseline;\">: Performs a basic health-check verification.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Idle Timeout: </strong><span style=\"vertical-align: baseline;\">The daemon monitors connection activity and automatically closes the individual session sockets after 15 minutes of inactivity. If no active sessions or commands are received within 10 minutes (configurable via the UXD_IDLE_EXIT variable), SLAPSHOT removes its port and lock files, and terminates its process to minimize memory footprint and detection risk.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Implications</span></h3>\n<p><span style=\"vertical-align: baseline;\">This campaign underscores the continued targeting of edge devices to gain initial access to victim networks, a trend that GTIG has tracked across a range of threat actors. Notably, these vulnerabilities made up about half of the </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/2025-zero-day-review\"><span style=\"text-decoration: underline; vertical-align: baseline;\">enterprise-related zero-days in 2025</span></a><span style=\"vertical-align: baseline;\">. These appliances—including Application Delivery Controllers, VPN gateways, and firewalls—remain  attractive targets because they are exposed to the internet, sit outside the reach of endpoint detection and response (EDR) tools, and often store or process credentials that can be used to move deeper into the network. We expect threat actors to continue to exploit vulnerabilities in edge devices, given the proven effectiveness of this tactic. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Hunting, Containment, and Remediation Guidance</span></h3>\n<p><span style=\"vertical-align: baseline;\">Organizations should begin by analyzing existing logs and configuration files to detect potential signs of compromise.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Hunting Strategies </span></h4>\n<p><strong><span style=\"vertical-align: baseline;\">Citrix NetScaler ADC Appliances</span></strong></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verify Web Server Configuration:</strong><span style=\"vertical-align: baseline;\"> Inspect </span><code style=\"vertical-align: baseline;\">/etc/httpd.conf</code><span style=\"vertical-align: baseline;\"> on all NetScaler ADC appliances for unauthorized MIME types, script handler directives, or web path aliasing. Any instance of </span><code style=\"vertical-align: baseline;\">AddHandler</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">AddType</code><span style=\"vertical-align: baseline;\"> registering non-PHP file extensions (such as </span><code style=\"vertical-align: baseline;\">.deb</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">.sig</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">.html</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">.rpm</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">.tgz</code><span style=\"vertical-align: baseline;\">) to run as PHP scripts, or any </span><code style=\"vertical-align: baseline;\">AliasMatch</code><span style=\"vertical-align: baseline;\"> diverting public web paths (</span><code style=\"vertical-align: baseline;\">/vpn/media/</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">/vpn/theme/</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">/vpn/images/</code><span style=\"vertical-align: baseline;\">) to appliance script directories, indicates compromise.</span></p>\n</li>\n</ol></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>grep -En -i \"application/x-httpd-php|php_flag|AliasMatch\" /etc/httpd.conf\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 8: Web path aliasing</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2.</span><strong style=\"vertical-align: baseline;\"> Audit Appliance Staging and Client Plug-in Directories:</strong><span style=\"vertical-align: baseline;\"> Audit the contents of native client plug-in paths (</span><code style=\"vertical-align: baseline;\">/var/netscaler/gui/vpn/scripts/linux/</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">/var/netscaler/gui/vpns/scripts/vista/</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">/var/netscaler/gui/vpns/scripts/mac/</code><span style=\"vertical-align: baseline;\">) and web asset paths (</span><code style=\"vertical-align: baseline;\">/netscaler/ns_gui/vpn/media/</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">/var/vpn/theme/</code><span style=\"vertical-align: baseline;\">). Legitimate client deliverables in these directories are compiled binaries or archives; any file identified as ASCII text or containing PHP script markers is anomalous. In default installations, these directories contain legitimate compiled client binaries and static web assets. Inspect them for plain-text scripts masquerading under non-script extensions or files containing PHP code:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>file /var/netscaler/gui/vpn/scripts/linux/* /var/netscaler/gui/vpns/scripts/vista/* /var/netscaler/gui/vpns/scripts/mac/* /netscaler/ns_gui/vpn/media/* 2&gt;/dev/null | grep -E \"ASCII text|PHP script\"\ngrep -rlE \"&lt;\\?php|eval\\(|base64_decode\\(|shell_exec\\(\" /var/netscaler/gui/ /netscaler/ns_gui/ /var/vpn/ /netscaler/portal/ 2&gt;/dev/null\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 9: Inspect client plugin paths for scripts masquerading as non-script extensions or files containing PHP code</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3.</span><strong style=\"vertical-align: baseline;\"> Review Web Server Access &amp; Error Logs: </strong><span style=\"vertical-align: baseline;\">Review </span><code style=\"vertical-align: baseline;\">/var/log/httperror*</code><span style=\"vertical-align: baseline;\"> for syntax, parse, or execution errors referencing disguised or non-standard file extensions (which persist even if access logs were scrubbed). Audit </span><code style=\"vertical-align: baseline;\">/var/log/httpaccess.log</code><span style=\"vertical-align: baseline;\"> for requests targeting static media, icons, or script paths returning simulated HTTP 404 status codes or unexpectedly large response payloads. Search access logs for sudden chronological gaps or truncated lines around </span><code style=\"vertical-align: baseline;\">/vpn/scripts/</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">/vpn/media/</code><span style=\"vertical-align: baseline;\">, which may indicate execution of the actor's regex-based log wiper.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>grep -E -i \"\\.(deb|sig|rpm|tgz|sh|so|dat|ico|png|html)\" /var/log/httperror*</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 10: Search for non-standard file extensions and execution errors</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>grep -E \"/vpn/media/|/vpn/scripts/|/vpn/theme/\" /var/log/httpaccess.log* | awk '$9 ~ /200|404/ &amp;&amp; $10 &gt; 5000'</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 11: Search for unexpectedly large response payloads</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">4. </span><strong style=\"vertical-align: baseline;\">Check for Ephemeral IPC Artifacts: </strong><span style=\"vertical-align: baseline;\">Inspect the /tmp/ directory on appliances for lock files and port pointer files created by SLAPSHOT. The presence of </span><code style=\"vertical-align: baseline;\">/tmp/.uxdport</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">/tmp/.uxdlock</code><span style=\"vertical-align: baseline;\"> indicates active or recent execution of the SLAPSHOT proxy daemon. Responders should record the port contained in </span><code style=\"vertical-align: baseline;\">.uxdport</code><span style=\"vertical-align: baseline;\"> and inspect the listening process via </span><code style=\"vertical-align: baseline;\">sockstat -4 -l</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>ls -la /tmp/.uxdport* /tmp/.uxdlock</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 12: Search for files created by SLAPSHOT</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">5.</span><strong style=\"vertical-align: baseline;\"> Verify Shell and Binary Permissions:</strong><span style=\"vertical-align: baseline;\"> Inspect </span><code style=\"vertical-align: baseline;\">/bin/sh</code><span style=\"vertical-align: baseline;\"> to confirm unauthorized SUID permissions have not been established. If permissions indicate </span><code style=\"vertical-align: baseline;\">-rwsr-xr-x</code><span style=\"vertical-align: baseline;\"> with root ownership, the binary has been modified for persistent setuid privilege escalation.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>ls -l /bin/sh</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 13: Check for unauthorized SUID permissions</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">6. </span><strong style=\"vertical-align: baseline;\">Examine Process Execution &amp; Shell History: </strong><span style=\"vertical-align: baseline;\">Inspect active system processes for anomalous Python interpreters executing background commands referencing </span><code style=\"vertical-align: baseline;\">/tmp/.uxdport</code><span style=\"vertical-align: baseline;\"> or running under </span><code style=\"vertical-align: baseline;\">nohup</code><span style=\"vertical-align: baseline;\">. Review </span><code style=\"vertical-align: baseline;\">/var/log/sh.log</code><span style=\"vertical-align: baseline;\"> for administrative commands executed outside change windows, including forced restarts (</span><code style=\"vertical-align: baseline;\">/netscaler/nsshutdown -R</code><span style=\"vertical-align: baseline;\">) and manual Apache restarts (</span><code style=\"vertical-align: baseline;\">httpd -k restart</code><span style=\"vertical-align: baseline;\">).</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>ps aux | grep -E \"python.*(\\.uxd|uxdport|uxdlock|base64)\"</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 14: Inspect system process for anomalous Python interpreters</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Note: </strong><span style=\"vertical-align: baseline;\">Citrix has published guidance on using its indicator of compromise (IOC) Scanner to identify potential indicators of compromise on an organization’s NetScaler infrastructure. For additional details, refer to the following Citrix documentation:</span></p>\n<ul>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><a href=\"https://docs.netscaler.com/en-us/netscaler-console-service/instance-advisory/security-advisory-dashboard.html\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">https://docs.netscaler.com/en-us/netscaler-console-service/instance-advisory/security-advisory-dashboard.html</span></a></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><a href=\"https://docs.netscaler.com/en-us/netscaler-console-service/instance-advisory/ioc.html\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">https://docs.netscaler.com/en-us/netscaler-console-service/instance-advisory/ioc.html</span></a></p>\n</li>\n</ul>\n<p><strong>Note</strong>: Organizations should apply hunting techniques holistically across their broader infrastructure to identify potential lateral movement originating from the NetScaler infrastructure. These techniques should be applied across the environment, including, but not limited to, other Privileged Access Management (PAM) platforms.</p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Containment and Remediation Strategies </span></h4>\n<p><span style=\"vertical-align: baseline;\">Organizations that have not yet applied the latest security updates should immediately assess their exposure and risk. Broad internet isolation or strict IP allow-listing on NetScaler Gateways can create significant disruption for organizations supporting remote workforces through Citrix Virtual Apps and Desktops (formerly XenApp and XenDesktop). For this reason, Mandiant recommends a targeted, phased approach that prioritizes patching while applying appropriate containment and compensating controls based on the organization’s risk profile.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Immediate Mitigation</strong></p>\n<p><span style=\"vertical-align: baseline;\">Organizations should evaluate the following options based on their risk tolerance, evidence of compromise, and operational requirements.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Option 1 — Apply the Latest Citrix Build (Mandiant Recommended)</span></h4>\n<p><span style=\"vertical-align: baseline;\">Implement the latest Citrix build that addresses the in-scope vulnerabilities. Organizations should upgrade to the following fixed releases (or later) depending on their current deployment track:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NetScaler 14.1 Track</strong><span style=\"vertical-align: baseline;\">: Upgrade to version 14.1-73.37 and later releases.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NetScaler 13.1 Track</strong><span style=\"vertical-align: baseline;\">: Upgrade to version 13.1-64.23 and later releases of 13.1.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Note: Specific patched builds are also available for 14.1-FIPS and 13.1-FIPS/NDcPP deployments</span></p>\n<p><span style=\"vertical-align: baseline;\">Organizations that cannot locate specific builds in the </span><a href=\"https://www.citrix.com/downloads/citrix-adc/?srsltid=AU7gw4VIBRubpeLNwVih-IfEWx4a6lwGu_9bL-QtttFlBXnuGjTzmXX7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Citrix customer downloads portal </span></a><span style=\"vertical-align: baseline;\">should  open a Severity 1 support case with Citrix to confirm and obtain the latest build containing the required fixes.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Option 2 — Isolate Compromised or Suspected Appliances</span></h4>\n<p><span style=\"vertical-align: baseline;\">For confirmed or suspected compromise, isolate affected NetScaler appliances from the network. This option can introduce significant business disruption, particularly when the appliance provides remote access or other critical services.</span></p>\n<p><span style=\"vertical-align: baseline;\">If the hunting strategies described above identify indicators of compromise, Mandiant recommends implementing the following containment actions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Isolate the node.</strong><span style=\"vertical-align: baseline;\"> Immediately remove the confirmed or suspected appliance from the network.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Halt HA synchronization.</strong><span style=\"vertical-align: baseline;\"> For NetScalers deployed in High Availability (HA) pairs, assess both nodes independently. Disable configuration synchronization until both nodes have been validated to prevent a compromised node from replicating malicious changes, such as modified httpd.conf files, to the standby node.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Restrict egress.</strong><span style=\"vertical-align: baseline;\"> Block observed threat actor infrastructure and restrict outbound internet connectivity from the appliance. In particular, prevent arbitrary outbound TCP/UDP traffic and block outbound SMTP over TCP/25 unless explicitly required.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\"> Review hypervisor network isolation.</strong><span style=\"vertical-align: baseline;\"> If the NetScaler runs as a VPX appliance in a virtualized environment, review vSphere vSwitch and Port Group configurations. Confirm that the NetScaler VPX is appropriately segmented and does not share a Layer 2 network with hypervisor management interfaces, such as ESXi vmk0 or vCenter, or other highly sensitive infrastructure tiers. Refer to the Mandiant hardening guidance for vSphere for additional recommendations.</span></p>\n</li>\n</ul>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Option 3 — Apply Targeted Compensating Controls</span></h4>\n<p><span style=\"vertical-align: baseline;\">If immediate patching is not possible, organizations should implement targeted controls to reduce the exposed attack surface until the affected appliances can be updated. The DTLS and UDP/443 controls below are specific to CVE-2026-88772 and should not be relied on to mitigate CVE-2026-88771. Installing a fixed NetScaler build remains required to address both vulnerabilities.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Part A — Network Restrictions</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Disable DTLS where operationally feasible.</strong><span style=\"vertical-align: baseline;\"> If patching is delayed, disable DTLS on internet-facing NetScaler Gateway virtual servers where it is not required. In this campaign, the exploit payload is delivered over UDP/443 using Datagram Transport Layer Security (DTLS).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Restrict inbound UDP/443 upstream.</strong><span style=\"vertical-align: baseline;\"> Block inbound UDP/443 to affected appliances unless DTLS is explicitly required. This control should be implemented on an upstream perimeter firewall or edge router. Relying exclusively on local NetScaler ACLs allows traffic to reach the vulnerable packet-processing engine (nsppe) before it is dropped.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Implement upstream IP allow-listing where feasible.</strong><span style=\"vertical-align: baseline;\"> Organizations using NetScaler strictly for load balancing, or operating Access Gateways that serve a predictable set of external source IP addresses, should consider upstream network ACLs that drop unauthorized traffic before it reaches the appliance.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For public-facing VPNs supporting large remote workforces, this approach may not be practical because dynamic residential IP addresses can create significant administrative and operational overhead. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Preserve virtual appliance state for forensic analysis.</strong><span style=\"vertical-align: baseline;\"> For NetScalers deployed as virtual appliances, including NetScaler VPX on VMware vSphere or other hypervisors, take a full VM snapshot with memory state included before rebooting whenever operationally possible.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Part B — Credential Rotation and Session Termination</strong></p>\n<p><span style=\"vertical-align: baseline;\">Organizations should operate under the assumption that credentials stored on a compromised appliance may have been exposed. Credential rotation and session termination should be coordinated across the appliance and connected systems.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Revoke active sessions.</strong><span style=\"vertical-align: baseline;\"> Invalidate existing administrative, Gateway, and VPN sessions to remove potentially compromised session tokens. For organizations using the appliance as a gateway for Citrix Virtual Apps and Desktops, this should include terminating active ICA/HDX sessions where appropriate. Refer to Citrix CTX584227 for additional guidance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rotate appliance secrets.</strong><span style=\"vertical-align: baseline;\"> Rotate NetScaler administrator credentials, local appliance accounts, Secure Shell (SSH) keys, TLS certificates, and associated private keys.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rotate integration credentials.</strong><span style=\"vertical-align: baseline;\"> Rotate LDAP bind and service accounts, RADIUS shared secrets, TACACS credentials, SNMP community strings, and NITRO/application programming interface (API) credentials.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Audit downstream Citrix infrastructure.</strong><span style=\"vertical-align: baseline;\"> Review systems that the NetScaler communicates with directly, particularly Citrix StoreFront servers, Citrix Delivery Controllers (DDCs), and internal Citrix Virtual Apps and Desktops hosts. Review Windows Event Logs for anomalous interactive logons, unexpected remote desktop protocol (RDP) activity, signs of credential dumping, and other evidence of lateral movement.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Organizations should also consider revoking and rotating TLS certificates and associated private keys stored on compromised appliances.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Note: </strong><span style=\"vertical-align: baseline;\">Organizations should rotate credentials after the appliance has been successfully patched.</span></p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Part C — Control Plane Restrictions</strong></p>\n<p><span style=\"vertical-align: baseline;\">Organizations should apply additional restrictions to the NetScaler control and management planes.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Restrict internet-facing services to required ports and protocols only.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Implement default-deny outbound firewall rules for NetScaler appliances.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Permit outbound connectivity only to explicitly approved destinations and services, including DNS, NTP, required OCSP/CRL services, approved backend applications, and approved management and security infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explicitly block outbound SMTP over TCP/25 unless there is a documented business requirement.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Prevent NSIP and management interfaces from being exposed to the internet.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Restrict SSH, HTTPS management, and NITRO/API access to dedicated administrative networks, approved jump hosts, and explicitly approved source IP ranges.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Part D — Logging and Detection Engineering</strong></p>\n<p><span style=\"vertical-align: baseline;\">Detection is a critical component of the response strategy. Mandiant recommends approaching detection across two areas: ensuring the necessary telemetry is available and implementing detections that correlate network, appliance, file system, and identity activity.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Logging and Visibility</strong></p>\n<p><span style=\"vertical-align: baseline;\">Several of the detections below depend on logs that NetScaler does not forward by default. Before implementing detection logic, confirm that the SIEM receives the following telemetry:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">NetScaler audit logs (ns.log) through a syslog action, including SSL-related events.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The appliance’s FreeBSD system log (/var/log/messages), which records NSPPE termination/crashes and pitboss messages and is not included in standard ns.log forwarding.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Web server logs (</span><code style=\"vertical-align: baseline;\">/var/log/httpaccess.log</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">/var/log/httperror*</code><span style=\"vertical-align: baseline;\">), NetScaler Web Logging, or AppFlow telemetry. Because TLS terminates on the appliance, upstream network devices generally cannot inspect HTTP request paths or headers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Firewall or network flow logs for traffic originating from NetScaler NSIP and SNIP addresses.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Secret Server or other privileged access management (PAM) audit logs.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Detection Engineering</span></h4>\n<p><strong style=\"vertical-align: baseline;\">Protocol and Traffic Analysis</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Alert on exploit-pattern DTLS failures.</strong><span style=\"vertical-align: baseline;\"> Look for SSL_HANDSHAKE_FAILURE events where ClientVersion is DTLSv1.0 and the reason is Handshake failure-Internal Error. Successful exploitation observed during this activity produced this event. Review individual occurrences and prioritize clusters originating from the same appliance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Correlate DTLS failures with engine termination/crashes.</strong><span style=\"vertical-align: baseline;\"> A matching DTLS handshake failure followed within minutes by an NSPPE termination/crash on the same appliance is a strong exploitation signal and should be investigated with high priority.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review unexpected inbound UDP/443.</strong><span style=\"vertical-align: baseline;\"> Focus on appliances where DTLS is disabled or not expected. Baseline the sources that normally establish DTLS connections with each Gateway. Because exploitation can require very little traffic, volume-based anomaly detection alone may not identify the activity.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Appliance Process and Memory Stability</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor for NSPPE termination/crashes.</strong><span style=\"vertical-align: baseline;\"> Generate high-severity alerts for kernel messages indicating that an NSPPE process exited or was terminated by a signal. Also monitor for the creation of new NSPPE core files under /var/core/.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Alert when pitboss does not restart NSPPE.</strong><span style=\"vertical-align: baseline;\"> Monitor for pitboss messages containing pitboss NOT restarting NSPPE. Alert on these messages and NSPPE kernel termination/crash events independently rather than requiring both conditions to occur.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Correlate with availability events.</strong><span style=\"vertical-align: baseline;\"> Treat unexpected HA failovers or appliance restarts on internet-facing Gateways within the same time window as supporting evidence of potential exploitation.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">File System and Configuration Integrity</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor critical VPN script paths.</strong><span style=\"vertical-align: baseline;\"> Detect the creation, modification, or staging of .sig files, including files such as nsgclient.sig, within VPN-related directories such as:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/var/netscaler/gui/vpn/scripts/linux/</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/netscaler/ns_gui/vpn/scripts/linux/</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/var/netscaler/gui/vpns/scripts/vista/</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/var/netscaler/gui/vpns/scripts/mac/</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/netscaler/ns_gui/vpn/media/</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">/var/vpn/theme/</code></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Detect unauthorized web server configuration changes.</strong><span style=\"vertical-align: baseline;\"> Monitor /etc/httpd.conf, /nsconfig/httpd.conf, and /flash/nsconfig/httpd.conf for unauthorized modifications. In particular, alert on:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The addition or modification of AddHandler application/x-httpd-php .[ext] directives.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">php_flag engine on configurations or other changes that enable PHP execution. Threat actor activity has included PHP-based web shells using extensions other than .php, and the specific extension may vary by environment. Alias, AliasMatch, or RewriteRule directives that map web asset paths such as /vpn/media/, /vpn/theme/, or /vpn/images/ to script directories or executable files.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Check runtime state on a recurring basis.</strong><span style=\"vertical-align: baseline;\"> Monitor for:</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The SUID bit being set on </span><code style=\"vertical-align: baseline;\">/bin/sh</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The presence of </span><code style=\"vertical-align: baseline;\">/tmp/.uxdport</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">/tmp/.uxdlock</code></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Python processes launched through </span><code style=\"vertical-align: baseline;\">nohup</code><span style=\"vertical-align: baseline;\"> or containing Base64-encoded payloads</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Unexpected changes to persistent configuration or startup files under </span><code style=\"vertical-align: baseline;\">/nsconfig/</code></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Egress and Interaction Monitoring</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Detect suspicious web shell interaction with static or client-script paths.</strong><span style=\"vertical-align: baseline;\"> Focus on behavior rather than the requested path alone, since legitimate clients routinely access /vpn/media/ resources. Potential indicators include:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">404 responses to </span><code style=\"vertical-align: baseline;\">/vpn/media/*.ico</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">/vpn/scripts/</code><span style=\"vertical-align: baseline;\"> paths that return multi-KB response bodies or exhibit unusually long processing times.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">“File does not exist” entries in HTTP error logs involving .sig or other non-standard files under </span><code style=\"vertical-align: baseline;\">/vpn/scripts/</code><span style=\"vertical-align: baseline;\">. These events may remain visible even when access logs have been modified or cleared.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gaps, malformed entries, or truncated lines in httpaccess.log around requests to </span><code style=\"vertical-align: baseline;\">/vpn/scripts/</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">/vpn/media/</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Identify anomalous appliance egress.</strong><span style=\"vertical-align: baseline;\"> Monitor outbound connections originating directly from NetScaler appliances and alert when destinations fall outside the organization’s approved egress allow-list. Prioritize activity involving credential vaults and PAM systems, connections to domain controllers over unexpected ports, connections to a large number of internal systems within a short period, and outbound SMTP over TCP/25.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Indicators of Compromise (IOCs)</span></h3>\n<h3><span style=\"font-style: italic; vertical-align: baseline;\">Network &amp; Transport Indicators</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 124.282%;\"><colgroup><col style=\"width: 10.1998%;\" /><col style=\"width: 16.0883%;\" /><col style=\"width: 73.7119%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Type</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Description</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Indicator</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Inbound Network Traffic</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Delivery protocol used for zero-day exploit delivery </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">UDP :443 (DTLSv1.0)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP Request Header</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Inbound command execution header used by nsginstaller.deb</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP_NSC_LDAP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP Request Header</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Inbound command execution header used by nsgclient.sig</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP_NSC_CLIENTTYPE</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP Request Header</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Chunked Base64 transport headers used by WHIPSHOT</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP_X_UX / HTTP_X_UX_[0-9]+</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">URI Path</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Masquerading icon request URI routed to .sig web shell via AliasMatch</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/vpn/media/nsgclient.ico / /vpn/media/*.ico</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">URI Path</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Staging path for malicious PHP web shells on NetScaler Gateway</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/vpn/scripts/linux/nsginstaller*.deb</span><span style=\"vertical-align: baseline;\">/vpn/scripts/linux/nsgclient*.deb</span><span style=\"vertical-align: baseline;\">/vpn/scripts/linux/*.php</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">IPv4 Address</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Scanning and staging infrastructure </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">143.198.7.94</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">IPv4 Address</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Netscaler exploitation and installation of basic web shell backdoor</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">157.254.167.12</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">To assist the wider community in hunting and identifying activity outlined in this blog post, we have included indicators of compromise (IOCs) in a </span><a href=\"https://www.virustotal.com/gui/collection/c794f2e5d051c46cd2ff5e429128d7e68954ba78e66735fc69362ec726e63ee4\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GTI Collection</span></a><span style=\"vertical-align: baseline;\"> for registered users.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">File Indicators</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">File Path</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/tmp/.uxdport</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SLAPSHOT Active Port Artifact</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">File Path</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/tmp/.uxdlock</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SLAPSHOT Process Lock Artifact</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Detections</span></h3>\n<h4><span style=\"vertical-align: baseline;\">YARA Rules</span></h4>\n<pre class=\"language-markup\"><code>rule G_APT_Backdoorwebshell_WHIPSHOT_1\n{\n    meta:\n        description = \"Detects WHIPSHOT PHP webshell tunneling frontend deployed on Citrix NetScaler ADC appliances\"\n        author = \"GTIG\"\n        family = \"WHIPSHOT\"\n        \n\n    strings:\n        // Chunked transport headers\n        $sh1 = \"HTTP_X_UX\" ascii\n        $sh2 = \"HTTP_X_UX_\" ascii\n\n        // IPC lock and port pointers to local proxy daemon\n        $si1 = \"/.uxdport\" ascii\n        $si2 = \"/.uxdlock\" ascii\n        $si3 = \"/tmp/.uxdport /tmp/.uxdlock\" ascii\n\n        // Socket forwarding logic\n        $sf1 = \"fsockopen\" ascii\n        $sf2 = \"127.0.0.1\" ascii\n    condition:\n        filesize &lt; 50KB and (\n            ($sh1 or $sh2) and ($si1 or $si2 or $si3) and ($sf1 or $sf2)\n        )\n}\n</code></pre>\n<pre class=\"language-markup\"><code>rule G_APT_Tunneler_SLAPSHOT_1\n{\n    meta:\n        description = \"Detects SLAPSHOT Python proxy daemon and tunneling tool deployed alongside WHIPSHOT on compromised NetScaler appliances\"\n        author = \"GTIG\"\n        family = \"SLAPSHOT\"\n\n   strings:\n        // Lock and port files\n        $ss1 = \"/tmp/.uxdport\" ascii fullword\n        $ss2 = \"/tmp/.uxdlock\" ascii fullword\n        $ss3 = \"UXD_IDLE_EXIT\" ascii fullword\n        $ss4 = \"127.0.0.1\" ascii\n\n        // Wire protocol command verbs\n        $sc1 = \"\\\"open\\\"\" ascii fullword\n        $sc2 = \"\\\"conn\\\"\" ascii fullword\n        $sc3 = \"\\\"push\\\"\" ascii fullword\n        $sc4 = \"\\\"pull\\\"\" ascii fullword\n        $sc5 = \"\\\"exch\\\"\" ascii fullword\n        $sc6 = \"\\\"close\\\"\" ascii fullword\n        $sc7 = \"\\\"ping\\\"\" ascii fullword\n\n        // Protocol parameter names\n        $sp1 = \"\\\"sid\\\"\" ascii fullword\n        $sp2 = \"\\\"host\\\"\" ascii fullword\n        $sp3 = \"\\\"port\\\"\" ascii fullword\n        $sp4 = \"\\\"data\\\"\" ascii fullword\n    condition:\n        filesize &lt; 30KB and (\n            ($ss1 and $ss2 and $ss3) or\n            ($ss4 and ($ss1 or $ss2) and 3 of ($sc*) and 2 of ($sp*)) or\n            ($ss3 and 3 of ($sc*) and 2 of ($sp*))\n        )\n}\n</code></pre>\n<pre class=\"language-markup\"><code>rule G_Hunting_Config_NetScaler_PHP_1\n{\n    meta:\n        description = \"Detects unauthorized Apache configuration directives registering non-standard extensions as PHP scripts, or aliasing web paths to appliance script directories on Citrix NetScaler ADC\"\n        author = \"GTIG\"\n\n    strings:\n        // NetScaler appliance configuration context markers\n        $ns1 = \"/netscaler\" ascii nocase\n        $ns2 = \"/var/netscaler\" ascii nocase\n        $ns3 = \"/vpn/\" ascii nocase\n        $ns4 = \"ns_gui\" ascii nocase\n        $ns5 = \"&lt;VirtualHost *:81&gt;\" ascii nocase\n        $ns6 = \"Listen 81\" ascii nocase\n\n        // Generic type or handler registration mapping non-standard file extensions to PHP\n        $t1 = /Add(Handler|Type)\\s+['\"]?application\\/x-httpd-php['\"]?\\s+\\.([^p\\s\\r\\n][a-zA-Z0-9_-]*|p[^h\\s\\r\\n][a-zA-Z0-9_-]*|ph[^p\\s\\r\\n][a-zA-Z0-9_-]*|php[^s\\s\\r\\n][a-zA-Z0-9_-]*|phps[a-zA-Z0-9_-]+)/ ascii nocase\n\n        // Diversion of web asset paths (media, theme, help, logon, images) to script staging directories\n        $a1 = \"AliasMatch\" ascii nocase\n        $a2 = /\\^?\\/vpn(s)?\\/(media|theme|themes|images|help|logon|support)\\// ascii nocase\n        $a3 = /\\/var\\/netscaler\\/gui\\/vpn(s)?\\/scripts\\// ascii nocase\n        $a4 = /\\/vpn(s)?\\/scripts\\// ascii nocase\n\n        // PHP execution flags\n        $p1 = \"php_flag engine on\" ascii nocase\n\n        // Exclusions for web pages, markup, and source code\n        $not_html1 = \"&lt;html\" ascii nocase\n        $not_html2 = \"&lt;!DOCTYPE\" ascii nocase\n        $not_html3 = \"&lt;?xml\" ascii nocase\n        $not_code1 = \"package \" ascii\n        $not_code2 = \"#include \" ascii\n    condition:\n        filesize &lt; 100KB and not (\n            $not_html1 or $not_html2 or $not_html3 or $not_code1 or $not_code2\n        ) and (1 of ($ns*)) and (\n            // Any directive registering a non-PHP extension as PHP\n            $t1 or\n            // Any AliasMatch diverting web paths to script directories\n            ($a1 and ($a2 or $a3 or $a4)) or\n            // Generic combination of php_flag engine on with script directory aliasing\n            ($p1 and $a1 and ($a3 or $a4))\n        )\n}\n</code></pre>\n<pre class=\"language-markup\"><code>rule G_Hunting_Backdoorwebshell_NetScaler_C2Headers_1\n{\n    meta:\n        description = \"Detects standalone PHP webshells deployed on NetScaler appliances extracting commands from custom or native SetEnvIf HTTP headers\"\n        author = \"GTIG\"\n\n   strings:\n        // NetScaler C2 header patterns (both HTTP_NSC_* and raw NSC_*, covering all native SetEnvIf variables)\n        $h1 = /(HTTP_)?NSC_[a-zA-Z0-9_]+/ ascii\n        $h2 = /(HTTP_)?NSC_(USER|NONCE|LDAP|CLIENTTYPE|FT_HIDE)/ ascii nocase\n\n        // Specific named NetScaler SetEnvIf headers\n        $hs1 = \"HTTP_NSC_LDAP\" ascii fullword nocase\n        $hs2 = \"HTTP_NSC_CLIENTTYPE\" ascii fullword nocase\n        $hs3 = \"HTTP_NSC_USER\" ascii fullword nocase\n        $hs4 = \"HTTP_NSC_NONCE\" ascii fullword nocase\n        $hs5 = \"HTTP_NSC_FT_HIDE\" ascii fullword nocase\n        $hs6 = \"NSC_USER\" ascii fullword nocase\n        $hs7 = \"NSC_NONCE\" ascii fullword nocase\n        $hs8 = \"NSC_LDAP\" ascii fullword nocase\n        $hs9 = \"NSC_CLIENTTYPE\" ascii fullword nocase\n        $hs10 = \"NSC_FT_HIDE\" ascii fullword nocase\n\n        // Dynamic execution sinks\n        $e1 = \"eval(base64_decode(\" ascii\n        $e2 = \"shell_exec(base64_decode(\" ascii\n        $e3 = \"system(base64_decode(\" ascii\n        $e4 = \"passthru(base64_decode(\" ascii\n        $e5 = \"eval(\" ascii\n        $e6 = \"base64_decode(\" ascii\n        $e7 = \"shell_exec(\" ascii\n        $e8 = \"passthru(\" ascii\n        $e9 = \"system(\" ascii\n        $e10 = \"exec(\" ascii\n        $e11 = \"popen(\" ascii\n        $e12 = \"proc_open(\" ascii\n        $e13 = \"assert(\" ascii\n\n        // Concealment and response markers\n        $c1 = \"http_response_code(404)\" ascii\n        $c2 = \"REQUEST_METHOD\" ascii\n        $c3 = \"&lt;FATO&gt;\" ascii\n        $c4 = \"&lt;/FATO&gt;\" ascii\n    condition:\n        filesize &lt; 50KB and (\n            // Any NSC header accessed alongside dynamic execution\n            ((1 of ($h*) or 1 of ($hs*)) and ($e1 or $e2 or $e3 or $e4 or ($e6 and ($e5 or $e7 or $e8 or $e9 or $e10 or $e11 or $e12 or $e13)))) or\n            // Any NSC header paired with concealment markers\n            ((1 of ($h*) or 1 of ($hs*)) and ($c3 or $c4 or ($c1 and $c2))) or\n            // Standalone FATO marker webshell\n            (($c3 and $c4) and ($e1 or $e2 or ($e5 and $e6) or ($e6 and $e7)))\n        )\n}\n</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Script_NetScaler_Persistence_1\n{\n    meta:\n        description = \"Detects appliance staging, installer, and anti-forensic maintenance scripts deployed during NetScaler compromise\"\n        author = \"GTIG\"\n\n    strings:\n        // Appliance restart / shutdown commands\n        $cmd1 = \"/netscaler/nsshutdown\" ascii\n        $cmd2 = \"nsshutdown -R\" ascii\n\n        // SUID root backdoor creation\n        $cmd3 = \"chmod u+s /bin/sh\" ascii\n\n        // Web server reload / restart\n        $cmd4 = \"/bin/httpd -k restart\" ascii\n        $cmd5 = \"httpd -k restart -f /etc/httpd.conf\" ascii\n\n        // Forensic access log scrubbing regex pattern (across any staging path)\n        $scrub1 = /#\\^\\.\\*\\/vpn(s)?\\/(scripts|media|theme|themes|help|logon)/ ascii\n\n        // Apache configuration modification strings\n        $cfg1 = \"AddHandler application/x-httpd-php\" ascii\n        $cfg2 = \"AddType application/x-httpd-php\" ascii\n        $cfg3 = \"php_flag engine on\" ascii\n        $cfg4 = \"AliasMatch\" ascii\n        $cfg5 = \"SetEnvIf\" ascii\n    condition:\n        filesize &lt; 50KB and (\n            // Log scrubber + privilege escalation or web server restart\n            ($scrub1 and ($cmd3 or $cmd4 or $cmd5)) or\n            // SUID root backdoor creation + appliance command or config modification\n            ($cmd3 and ($cmd1 or $cmd2 or $cmd4 or $cmd5 or $cfg1 or $cfg2 or $cfg3 or $cfg4 or $cfg5)) or\n            // Configuration tampering + appliance command\n            (($cfg1 or $cfg2 or $cfg4) and ($cmd1 or $cmd2 or $cmd4 or $cmd5)) or\n            // Generic 2 of the specific appliance maintenance commands\n            (2 of ($cmd*))\n        )\n}\n</code></pre></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Google Security Operations</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Security Operations is continuously developing and updating rules within the Mandiant Intel Emerging Threats rule pack to ensure robust protection for customers. New rules are under active testing for threat activity detailed in this post, detection coverage will be added and deployed across Google SecOps.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Acknowledgements</span></h3>\n<p><span style=\"vertical-align: baseline;\">This analysis would not have been possible without the assistance of Bella Valdescruz, Bhavesh Dhake, Chris Linklater, Christopher Romano, Geoff Carstairs, Greg Blaum, Josh Thackston, Kimberly Goody, Lianis Oliva, Matthew Quick, Michael Edie, Omar ElAhdan, Peter Ukhanov, Sagun Chetry, Stuart Carrera, Tyler McLellan.</span></p></div>"
