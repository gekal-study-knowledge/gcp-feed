"overview": |
  この日は 6 件 (重複を除くと 5 件) で、モデル構成の考え方と地理空間コーディングの支援機能、そしてエージェント向けの基盤とセキュリティ管理の強化が中心でした。スタートアップ向けの記事では、フロンティアモデルの API だけに頼らずオープンモデルも併せて使うべき理由が論じられました。LLM の初期には「すべてのやり取りを、利用できる最大のモデルへ送る」という構成が既定でしたが、アプリケーションが本番に入り、数百万人に提供され自律的なマルチエージェントのワークフローを動かすようになると、単一のフロンティアモデルへの依存が 3 か所で無理を生じるとしています。クラウドへの往復に頼りきることで、対話的なモバイル・デスクトップアプリに必要なサブ秒の応答性が出しにくくなるレイテンシーの問題、700 億パラメータを超える大きなオープンモデルを自前でホストするとアーリーステージのチームがインフラ事業者のように振る舞わざるを得ず、上級エンジニアがクラスターの用意やマルチ GPU のオーケストレーションに取られる運用負荷、そして意図のルーティングや JSON の抽出、ステータスの検証といった高頻度で構造化された処理を汎用のフロンティアエンドポイントに送ることで、製品の差別化に回せる資本が削られるマージンの侵食です。地理空間では、Google Earth Engine に Ask という機能が追加されました。Code Editor に Gemini の機能を直接統合するもので、自分の Gemini API キーを使って、Code Editor から離れることなく地理空間のクエリを書き、デバッグし、理解し、最適化できます。Ask のパネルは Code Editor の右側に置かれ、現在のスクリプトやインポートしたアセットといった作業中の文脈をふまえて回答します。ストレージでは、Filestore エージェント ボリュームの提供が始まりました。エージェント ワークスペース向けのフルマネージドなファイルストレージで、エージェント サンドボックスと一元化されたストレージの間で状態をやり取りしたり、ローカルディスクやセルフホストのファイルシステムを手で管理したりする回避策を置き換えるものです。エージェント フリートが数千・数百万セッションの規模までスケールするときのコールドスタートのレイテンシー、運用の複雑化、未割り当てのアイドルストレージの費用といった課題に対し、動的プロビジョニングのアーキテクチャで応えます。GKE 上の Agent Substrate や GKE Agent Sandbox と組み合わせることで、隔離された永続ワークスペースへ即座にアクセスできます。セキュリティでは、セッション管理が一般提供となり、広範な管理設定からコンテキストアウェア アクセス (CAA) と緊密に統合されたきめ細かい機能へ進化しました。認証情報の窃取やアカウント乗っ取り (ATO) のリスクを下げるため、独自設定のなかった顧客にはデフォルトのセッション時間 16 時間のロールアウトが完了しています。今回の一般提供では、Terraform・gcloud CLI・REST API からポリシーを定義・デプロイ・管理できるようになり、対象の指定も組織部門 (OU) だけでなく Google グループが使えるようになりました。これにより、課金管理者やプロジェクト オーナーのような権限昇格されたユーザーには 2 時間、一般の開発者には標準の 16 時間、といった使い分けができます。さらに、Google Cloud API スコープを必要とする全アプリケーションに一律に効く包括的なポリシーではなく、特定のアプリケーション単位でセッション管理を設定できます。事例では、住友重機械工業が製造業 DX と SDV (Software Defined Vehicle) 用のロボット開発基盤を Google Cloud で構築した取り組みが紹介されました。Gemini Enterprise、Gemini CLI、Cloud Workstations、BigQuery、Cloud Build、Cloud Run、Identity-Aware Proxy などを使い、AI ロボティクスセンターが自動フォークリフト (AGF) の開発を進めています。生成 AI でアルゴリズムを短時間で実装し、時間・場所・安全性の制約が大きい実機実験の前にシミュレーターで不具合を解消し、得られたデータをクラウドで分析して原因特定と次の改善につなげる流れで、デジタルツインによる事前検証により実機実験を 1 回でクリアしています。得られた知見は油圧ショベルやクレーンなど他機種にも展開する予定で、労働力不足の解消と人材育成の両立も狙いに挙げられています。
