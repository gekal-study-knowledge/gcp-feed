"overview": |
  この日は 3 件 (重複を除くと 2 件) で、モデル構成の考え方と、地理空間コーディングの支援機能でした。スタートアップ向けの記事では、フロンティアモデルの API だけに頼らずオープンモデルも併せて使うべき理由が論じられました。LLM の初期には「すべてのやり取りを、利用できる最大のモデルへ送る」という構成が既定でしたが、アプリケーションが本番に入り、数百万人に提供され自律的なマルチエージェントのワークフローを動かすようになると、単一のフロンティアモデルへの依存が 3 か所で無理を生じるとしています。クラウドへの往復に頼りきることで、対話的なモバイル・デスクトップアプリに必要なサブ秒の応答性が出しにくくなるレイテンシーの問題、700 億パラメータを超える大きなオープンモデルを自前でホストするとアーリーステージのチームがインフラ事業者のように振る舞わざるを得ず、上級エンジニアがクラスターの用意やマルチ GPU のオーケストレーションに取られる運用負荷、そして意図のルーティングや JSON の抽出、ステータスの検証といった高頻度で構造化された処理を汎用のフロンティアエンドポイントに送ることで、製品の差別化に回せる資本が削られるマージンの侵食です。優れたエンジニアリングチームは工程ごとに適切な道具を選んでおり、本番のリクエストの多くはフロンティアの汎用モデルを必要としない、という整理がなされています。地理空間では、Google Earth Engine に Ask という機能が追加されました。Code Editor に Gemini の機能を直接統合するもので、自分の Gemini API キーを使って、Code Editor から離れることなく地理空間のクエリを書き、デバッグし、理解し、最適化できます。Ask のパネルは Code Editor の右側に置かれ、現在のスクリプトの全文、インポートしたアセットやジオメトリ、そのセッションのチャット履歴といった作業中の文脈をふまえて回答します。複雑な地理空間のロジックをコードに落とす作業で、API 関数を覚えたりドキュメントを探したり構文やメモリのエラーを追いかけたりして流れが途切れる、という状況の解消を狙っています。
