"overview": |
  この日は 9 件 (重複を除くと 8 件) で、モデル構成の考え方と地理空間コーディングの支援機能、そしてエージェント向けの基盤とセキュリティ管理の強化が中心でした。スタートアップ向けの記事では、フロンティアモデルの API だけに頼らずオープンモデルも併せて使うべき理由が論じられました。LLM の初期には「すべてのやり取りを、利用できる最大のモデルへ送る」という構成が既定でしたが、アプリケーションが本番に入り、数百万人に提供され自律的なマルチエージェントのワークフローを動かすようになると、単一のフロンティアモデルへの依存が 3 か所で無理を生じるとしています。クラウドへの往復に頼りきることで、対話的なモバイル・デスクトップアプリに必要なサブ秒の応答性が出しにくくなるレイテンシーの問題、700 億パラメータを超える大きなオープンモデルを自前でホストするとアーリーステージのチームがインフラ事業者のように振る舞わざるを得ず、上級エンジニアがクラスターの用意やマルチ GPU のオーケストレーションに取られる運用負荷、そして意図のルーティングや JSON の抽出、ステータスの検証といった高頻度で構造化された処理を汎用のフロンティアエンドポイントに送ることで、製品の差別化に回せる資本が削られるマージンの侵食です。地理空間では、Google Earth Engine に Ask という機能が追加されました。Code Editor に Gemini の機能を直接統合するもので、自分の Gemini API キーを使って、Code Editor から離れることなく地理空間のクエリを書き、デバッグし、理解し、最適化できます。Ask のパネルは Code Editor の右側に置かれ、現在のスクリプトやインポートしたアセットといった作業中の文脈をふまえて回答します。ストレージでは、Filestore エージェント ボリュームの提供が始まりました。エージェント ワークスペース向けのフルマネージドなファイルストレージで、エージェント サンドボックスと一元化されたストレージの間で状態をやり取りしたり、ローカルディスクやセルフホストのファイルシステムを手で管理したりする回避策を置き換えるものです。エージェント フリートが数千・数百万セッションの規模までスケールするときのコールドスタートのレイテンシー、運用の複雑化、未割り当てのアイドルストレージの費用といった課題に対し、動的プロビジョニングのアーキテクチャで応えます。GKE 上の Agent Substrate や GKE Agent Sandbox と組み合わせることで、隔離された永続ワークスペースへ即座にアクセスできます。セキュリティでは、セッション管理が一般提供となり、広範な管理設定からコンテキストアウェア アクセス (CAA) と緊密に統合されたきめ細かい機能へ進化しました。認証情報の窃取やアカウント乗っ取り (ATO) のリスクを下げるため、独自設定のなかった顧客にはデフォルトのセッション時間 16 時間のロールアウトが完了しています。今回の一般提供では、Terraform・gcloud CLI・REST API からポリシーを定義・デプロイ・管理できるようになり、対象の指定も組織部門 (OU) だけでなく Google グループが使えるようになりました。これにより、課金管理者やプロジェクト オーナーのような権限昇格されたユーザーには 2 時間、一般の開発者には標準の 16 時間、といった使い分けができます。さらに、Google Cloud API スコープを必要とする全アプリケーションに一律に効く包括的なポリシーではなく、特定のアプリケーション単位でセッション管理を設定できます。事例では、住友重機械工業が製造業 DX と SDV (Software Defined Vehicle) 用のロボット開発基盤を Google Cloud で構築した取り組みが紹介されました。Gemini Enterprise、Gemini CLI、Cloud Workstations、BigQuery、Cloud Build、Cloud Run、Identity-Aware Proxy などを使い、AI ロボティクスセンターが自動フォークリフト (AGF) の開発を進めています。生成 AI でアルゴリズムを短時間で実装し、時間・場所・安全性の制約が大きい実機実験の前にシミュレーターで不具合を解消し、得られたデータをクラウドで分析して原因特定と次の改善につなげる流れで、デジタルツインによる事前検証により実機実験を 1 回でクリアしています。得られた知見は油圧ショベルやクレーンなど他機種にも展開する予定で、労働力不足の解消と人材育成の両立も狙いに挙げられています。セキュリティでは、Citrix NetScaler ADC と NetScaler Gateway のアプライアンスを狙ったゼロデイの実環境での悪用が報告されました。2026 年 9 月下旬に Mandiant Consulting と Google Threat Intelligence Group (GTIG) が CVE-2026-88772 の active な悪用を確認したもので、少なくとも 9 月上旬から続くこのキャンペーンにより、北米と欧州の政府・金融サービス・教育・法務および専門サービスの組織が影響を受けた可能性があります。ベンダーの開示によれば、2 つ目のゼロデイである CVE-2026-88771 も悪用されています。CVE-2026-88772 の悪用は認証を回避し、NetScaler Packet Processing Engine (NSPPE) を異常終了させることで root 権限の初期アクセスを確立します。侵入後のツールキットからは、Base64 エンコードしたコマンド&コントロールのペイロードをネイティブな HTTP ヘッダーに潜ませる WHIPSHOT などの新たなカスタム PHP Web シェルと、内部ネットワークへトラフィックをプロキシして偵察や認証情報の窃取を行う Python 製のトンネラー SLAPSHOT が見つかっています。実際に観測された侵入の少なくとも 1 件では、攻撃者がこのプロキシ経由で手作業による内部偵察と認証情報の窃取を行っていました。Citrix が対処済みの脆弱性について案内を出しており、防御側にはその文書の確認とパッチ適用の優先が呼びかけられています。公共部門向けの記事では、攻撃者が AI を使ってマシンスピードで動き、侵入を加速させゼロデイを突いて従来の防御を無効化していく状況に対し、事後の手作業のレビューでは追いつけないとして、Gemini の推論能力、Wiz によるマルチクラウドの可視性、CodeMender による自律的なコード修正、Mandiant の最前線の脅威インテリジェンスを 1 つの継続的な運用ループにまとめた Google AI Threat Defense が紹介されました。リリースノートでは、Gemini Enterprise の AlphaEvolve が候補プログラムの生成に Gemini 3.7 Flash と Gemini 3.8 Flash を使えるようになり、モデルを明示しない場合の既定が Gemini 3.5 Flash から Gemini 3.8 Flash に変わりました (この変更前に作成した実験は設定に記録されたモデルを保ちます)。また SAP on Google Cloud に Hyperdisk のサイジングウィジェットが加わり、SAP 認定のマシンタイプを選ぶと、SAP HANA のサイズと性能の要件を満たすディスク構成を最大 3 つまで確認できます。
