    "title": "住友重機械工業: Google Cloud で SDV 開発基盤を構築し、大型機械用ソフトウェア開発の高速化と人材育成を両立"
    "link": "https://cloud.google.com/blog/ja/topics/customers/shi-builds-sdv-development-platform-on-google-cloud/"
    "published": "2026-09-29 11:00:00"
    "fetched": "2026-09-29 13:21:51"
    "summary": "<div class=\"block-paragraph\"><p>「デジタルの力で、世界中の現場を快適に、携わる人々を幸せに」というビジョンに基づき DX を推進している住友重機械工業株式会社（以下、住友重機械工業）では、製造業 DX と SDV（Software Defined Vehicle）用のロボット開発基盤を Google Cloud で構築。製造業で深刻化している労働力不足の解消にも取り組んでいます。なぜ SDV のために Google Cloud を採用し、いかに人材育成も充実させたのか。AIロボティクスセンターの開発者と責任者に話を伺いました。</p><p><b>利用しているサービス:</b><br /> <a href=\"https://cloud.google.com/ai?e=0\">Gemini Enterprise</a>, <a href=\"https://docs.cloud.google.com/gemini/docs/codeassist/gemini-cli?hl=ja\">Gemini CLI</a>, <a href=\"https://cloud.google.com/workstations?hl=ja&amp;utm_source=gemini\">Cloud Workstations</a>, <a href=\"https://cloud.google.com/bigquery?hl=ja\">BigQuery</a>, <a href=\"https://cloud.google.com/build?hl=ja\">Cloud Build</a>, <a href=\"https://cloud.google.com/run?hl=ja\">Cloud Run</a>, <a href=\"https://cloud.google.com/security/products/iap?hl=ja\">Identity-Aware Proxy</a> など</p><p><b>利用しているソリューション:</b><br /><a href=\"https://cloud.google.com/ai/generative-ai?hl=ja\">生成 AI</a></p><h3><b>加速する SDV の流れに対応するために、Google Cloud でプラットフォームを構築</b></h3><p>重機械メーカーである住友重機械工業は、減速機や放射線治療装置など、多岐にわたる製品を研究開発しています。その中で、物流・建設機械を扱うロジスティックス＆コンストラクション セグメントを担当しているのが、AIロボティクスセンターです。現在、同センターでは、自動フォークリフト（AGF：Automated Guided Forklift）の開発を推進。技術本部 技術研究所 AIロボティクスセンター ロボティクスプラットフォームグループの中尾 拓真氏は、その背景を次のように説明します。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image3_IlziBO3.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「製造業は、ハードウェアの性能で製品価値 が決まる時代から、ソフトウェアのアップデートで機能が追加され、より便利になる SDV の時代への変革期にあります。自動車ではすでに、OTA と呼ばれるインターネット経由のアップデートで自動運転の性能や燃費が購入後にも向上するようになりました。この流れは物流・建設機械にも広がってきていますので、大型機械の中で動くソフトウェアの開発を、より高速化することが求められています。」</p><p>同センターでは、AGF の開発を通じて、SDV に対応したクラウドの開発環境を検証。得られた成果や知見をもとに、ソフトウェア開発を効率化し、油圧ショベルやクレーンなどの他の機種にも展開していく予定です。</p><p>「コーディングでは生成 AI を利用して、AGF の動作やアルゴリズムを短時間で実装します。こうして実装した機能は、まずシミュレーターで動作を確認してから実機実験に進みますが、実機実験は時間や場所、安全性の制約が大きいので、可能な限りシミュレーターで不具合を解決しておくことが大切になります。また、そこで得られたデータはクラウド上で分析され、不具合の原因特定や次の改善に活かされます。」（中尾氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>デジタルツインを活用した事前検証を行い、実機実験を 1 回でクリア</b></h3><p>住友重機械工業では基盤となるプラットフォームとして、Google Cloud を採用。決め手となったのは、開発に必要な機能はもちろん、内製化に向けた支援プログラムなどが包括的に提供されることでした。</p><p>Google Cloud 上の開発プラットフォームは、生成 AI 開発環境、CI/CD、デジタルツイン、データ分析の 4 つの役割を担っており、検証を終えた機能は Docker イメージで実機にデプロイされます。例えば AGF がパレットを検出してピックアップする自動化機能の開発では、Cloud Workstations 上のデジタルツインでシミュレーションを行った結果、1 回目の実機実験で動作テストを問題なくクリアできました。</p><p>「シミュレーターは実機とまったく同じプロトコルで通信できるので、ロボットのプログラムから見ると、接続している相手が実機なのか、シミュレーターなのかを意識する必要がなくなります。だからこそ、動作確認したプログラムが実機でもそのまま動くのです。」（中尾氏）</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"全体アーキテクチャ\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/QuanTiakitekuchiya.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>中尾氏によれば、Google Cloud の導入は個別の開発だけでなく、チーム全体の作業プロセスにも大きな変化をもたらしました。</p><p>「クラウドを導入する前は、開発環境や使用ツールが各自バラバラで、ソースコード管理も個々が行っていました。しかし Cloud Workstations で環境を標準化し、ソースコード管理や CI/CD も実現したことにより、シナジーを生むチーム開発へ移行できました。特に Cloud Workstations は、メンバー全員が同一環境で開発できるため、新規メンバーのオンボーディング短縮にもつながっています。新入社員として配属されたメンバーが、配属初日から作業に着手できた例もありました。」（中尾氏）</p><p>開発プラットフォームでは、コーディングやデバッグ、ドキュメント作成などの幅広い工程で、Gemini CLI や Gemini Enterprise などの生成 AI が活用されています。中尾氏は、その効果を高めるために独自の仕組みも構築してきました。</p><p>「生成 AI でエンジニアの発想をすぐにコード化し、CI/CD と組み合わせて定型作業も自動化したことで、エンジニアが創造的な作業に専念できるようになりました。ただし、AI コーディング エージェントは、同じエラーの解決方法を毎回 1 から探してしまいます。そこで、エラーログをキーにして AI が解決策を自動蓄積・検索する『KAI（Knowledge &amp; AI）』を構築し、チーム全体へナレッジを展開できるようにしました。さらに、AI の学習データに含まれない社内の内製ライブラリの仕様を正しく理解させるため、ソースコードとドキュメントを関連付けて検索できる『GraphRAG』も実装しています。」（中尾氏）</p><h3><b>Cloud Workstations と TAP で最適なクラウド人材の育成環境を整備</b></h3><p>住友重機械工業は、Google Cloud 上のプラットフォームによって AGF の新機能実装を大幅に効率化しました。しかし意欲的な開発を継続していくには、クラウドに習熟した人材の確保が急務となります。ロボティクスプラットフォームグループでグループリーダを務める藤井 北斗氏は、2025 年に入社した中尾氏を例に挙げながら、短期間で優れた人材を育成するうえでも Google Cloud の導入が有用だと語りました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_gSPCnmx.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「SDV をけん引する人材育成には、早い段階で数多くの失敗と成功を体験させることが重要です。しかし弊社のように歴史が古く、規模の大きな組織では、自由にロボット開発を試せるクラウド環境を提供するのは、ガバナンスやセキュリティの観点から難しいのも事実です。この課題を Google Cloud で解決しようと考えました。」<br /></p><p>まずガバナンス・セキュリティ面では、Google Workspace の Enterprise エディションを採用し、組織管理アカウントと IAM（権限管理）を連携させることで、少人数でも安全かつ適切なアカウント管理を実現。Security Command Center（SCC）も導入し、脅威の検知から修復までをカバーするセキュアで効率的な運用環境を確保しています。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「開発の経験を積むにはセキュリティ ガードレール、自由なプレイグラウンド（実験環境）と AI サポート、失敗しても元に戻せるサンドボックスの 3 要素が必要です。Cloud Workstations はコンテナなので壊れても元に戻せますし、IAP（Identity-Aware Proxy）で防護されているので安全も確保できます。生成 AI は Gemini Enterprise で誰が何に使っているかを把握できるようにし、ネットワークやセキュリティは Google Cloud Skills Boost で基礎的なことを学んでから、実装に取り組む体制にしています。中尾も、ガードレールの中で安全に失敗を繰り返すことで、バランスが取れた実装ができるようになりました。」（藤井氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">一方、組織開発では、外部の知見を入れながら継続的に組織をスケールさせるための取り組みがなされています。そこで利用されたのが、Google Cloud が提供するアジャイル型内製化支援ワークショップ、</span><a href=\"https://cloud.google.com/solutions/in-house-development-support?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TAP（Tech Acceleration Program）</span></a><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">「ロボット開発基盤のプロトタイピングでは、Google Cloud のエンジニアと 3 日間の合宿を実施していただきました。TAP では、プラットフォーム エンジニアリング</span></p>\n<p><span style=\"vertical-align: baseline;\">やサイト信頼性エンジニアリング（SRE）だけでなく、Google のカルチャーや組織開発についても学ぶことができました。さらには生成 AI を使ったバイブ コーディング研修を実施いただき、それを軸に社内教育も実施しています。」（藤井氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">住友重機械工業は今後、SDV のサービス化に向けた企画やビジネスモデル構築、マイクロサービス開発、デジタルツイン環境の拡張へと取り組みを広げていく計画です。藤井氏は次の目標をすでに見据えていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「例えばデジタルツインは、開発やデバッグだけでなく、お客さまに新しいサービスを早く検証していただくための環境も提供します。この技術を基に、すべての住友製品とクラウドでつくったサービスが、仮想空間でつながる世界を実現したいと考えています。また、Gemini Robotics-ER 1.6 が公開されたので、フィジカル AI との統合も検討しています。OTA の仕組みを欧州の規制に適合させる、あるいは Firebase で顧客の操作状況を把握して UX を向上させるなど、弊社には他にも多くの目標があります。これらの実現に向け、今後も Google Cloud を活用した開発の効率化や、労働力不足などの課題を解決できる仕組みづくりに挑戦し続けていきます。」（藤井氏）</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_j4VEf5r.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><a href=\"https://www.shi.co.jp/\" target=\"_blank\"><b>住友重機械工業株式会社</b></a><br />1888 年の創業から 130 年以上の歴史がある総合機械メーカー。「住友の事業は住友自身を利するとともに、国家を利し、社会を利する事業でなければならぬ」という住友グループの経営理念に基づき、メカトロニクス、インダストリアル マシナリー、ロジスティックス＆コンストラクション、エネルギー＆ライフラインの 4 つのセグメントを事業領域としてカバーする。連結従業員数は 2 万 5,123 名（2025 年 12 月 31 日現在）で売上高は 1 兆 669 億円（2025 年度）。</p><p><b>インタビュイー（写真左から）</b><br />技術本部 技術研究所 AIロボティクスセンター<br />・ロボティクスプラットフォームグループ グループリーダ・主任研究員　藤井 北斗 氏<br />・ロボティクスプラットフォームグループ　中尾 拓真 氏</p></div>\n<div class=\"block-paragraph_advanced\"><hr />\n<p><span style=\"vertical-align: baseline;\">その他の導入事例は</span><a href=\"https://cloud.google.com/customers?hl=ja&amp;e=48754805#/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p></div>"
  "e80fb962af7c8500434b001d76f235dd":
    "id": "e80fb962af7c8500434b001d76f235dd"
    "title": "Filestore エージェント ボリュームのご紹介: エージェント ワークスペース向けのフルマネージド ストレージ"
    "link": "https://cloud.google.com/blog/ja/products/storage-data-transfer/filestore-agent-volumes/"
    "published": "2026-09-29 10:00:00"
    "fetched": "2026-09-29 13:21:51"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">ビルドツールの運用から、データ分析パイプラインや共同リサーチまで、データドリブンなタスクの実行は、あらゆるエンタープライズ エージェントにとって不可欠な作業です。</span></p>\n<p><span style=\"vertical-align: baseline;\">にもかかわらず、多くのプラットフォーム チームは、エージェントのストレージ要件にカスタムの回避策を継ぎ合わせて対応しているのが現状です。たとえば、エージェント サンドボックスと一元化されたストレージの間で状態をやり取りしたり、ローカル ディスクやセルフホスト型ファイル システムを手動で管理したりしています。このようなアプローチは、エージェント フリートが拡大するにつれ、コールド スタート時のレイテンシ、運用の複雑化、未割り当てアイドル状態のストレージの費用といった課題とのバランスを取るのが難しくなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント サンドボックスは、数千、数百万のセッションを同時進行する規模までスケーリングする可能性があります。ストレージはそれに合わせて上記の課題を克服し、ワークスペースの徹底した隔離、セッションの即時再開、柔軟な従量課金制、流動的なマルチエージェント コラボレーションを必要とする動的なワークロードのニーズを満たすように進化する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした新たな需要に応えるため、Google は AI ストレージ ポートフォリオを拡大し、</span><strong style=\"vertical-align: baseline;\">Filestore エージェント ボリューム</strong><span style=\"vertical-align: baseline;\">の提供を開始しました。これは、高パフォーマンスの柔軟なファイル ストレージで Google Cloud でのエージェント ワークロードのスケーリングを可能にするために設計されたフルマネージドの新機能です。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AI エージェント ワークスペース専用のストレージ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">自律型エージェントが安全にタスクを実行するためには、隔離されたランタイム環境が必要です。たとえば、動的コードの実行、サードパーティ パッケージのインストール、各種ツールの運用を、ホスト インフラストラクチャやテナントデータを危険にさらすことなく実行する必要があります。</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE 上の Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> と GKE Agent Sandbox は、高密度のエージェント フリートを実行するために必要な専用コンピューティング環境を提供しますが、サンドボックスには専用の永続ワークスペースも必要です。</span></p>\n<p><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Filestore</span></a><span style=\"vertical-align: baseline;\"> に含まれる </span><strong style=\"vertical-align: baseline;\">Filestore エージェント ボリューム</strong><span style=\"vertical-align: baseline;\">は、AI エージェント フリートのスケーリングと弾力性を考慮して特別に設計された動的プロビジョニング アーキテクチャにより、エージェント コンピューティングを補完する専用のエージェント ストレージを提供します。Agent Substrate との連携で大規模なエージェント フリートもサポートできるように設計されており、GKE サンドボックスに隔離された永続的なファイル ストレージへの即時アクセスを可能にします。Filestore を活用するようにエージェント環境を構成すると、GKE のストレージ管理がバックグラウンドで行われます。GKE が新しいエージェント タスク用にサンドボックスを起動するたびに、Filestore は隔離された専用ファイル ワークスペースをミリ秒単位でその環境に自動的に割り当て、アタッチします。プラットフォーム チームは、個々のエージェントの実行用にストレージ ボリュームを手動で作成、アタッチ、破棄する必要はありません。エージェント フリートのスケールアップとスケールダウンに応じて、システムがボリュームのライフサイクル全体を自動的に処理します。これにより、効率的なエンドツーエンドのインフラストラクチャ ソリューションが実現し、費用対効果の高いエージェント管理が以下の機能性をもたらします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">緻密な隔離と企業のガードレール</strong><span style=\"vertical-align: baseline;\">: エージェント プラットフォームは、信頼できない自律型コードを実行する際に、セキュリティとデータ漏洩のリスクに直面します。Filestore エージェント ボリュームは、ワークスペースごとに厳格な境界制御と細分化されたアクセス権限を適用します。これにより、エージェントは指定されたディレクトリ内でのみ動作し、動的なツールチェーンがテナント間で厳密に分離されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">1 秒未満でのセッション再開</strong><span style=\"vertical-align: baseline;\">: 従来のストレージ プロビジョニング手法では、インタラクティブなエージェント セッションがコールド スタート時のレイテンシの影響で停止することがありました。Filestore エージェント ボリュームではミリ秒単位でアタッチとデタッチが行われるため、オーケストレーターがアイドル状態のサンドボックスを積極的に停止してコンピューティング費用を節約し、新しいタスクやユーザー入力を受け取ると直ちに再開します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スマート ライフサイクル エコノミーと従量課金制</strong><span style=\"vertical-align: baseline;\">: 数千もの短時間または断続的なエージェント タスクに固定サイズの高パフォーマンス ストレージを事前割り当てすると、ストレージが大量に無駄になる可能性があります。Filestore エージェント ボリュームを使用すると、プラットフォームは消費されたストレージ容量に対してのみ課金され、自動ライフサイクル階層化のメリットを享受できます。つまり、エージェントがコードの読み取り / 変更やデータセットの分析を行っていないときは、アイドル状態のワークスペースを自動的に低コストのストレージに移行でき、費用の無駄を省いて高パフォーマンスを実現できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチエージェント コラボレーション</strong><span style=\"vertical-align: baseline;\">: マルチエージェント スウォームの使用は、データ受け渡しのパイプラインが脆弱になりがちで、ファイル競合のリスクにもつながります。Filestore エージェント ボリュームは、ネイティブの Read-Write-Many（RWX）サポートと POSIX ファイルロックを備えており、オーケストレーターが複数のエージェントに単一の共有ワークスペースをアタッチできます。共同作業を行うエージェントは、ファイルレベルの整合性と書き込み競合プロテクトにより、プロジェクト ファイルを安全に共同編集、テスト、レビューできます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">次世代エージェント ワークロードをサポート</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Filestore エージェント ボリュームは、柔軟で高パフォーマンスの分離されたファイル階層化により、以下を含む本番環境の幅広いエージェント ワークロードとユースケースをサポートします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ソフトウェア エンジニアリングとコーディングのサンドボックス</strong><span style=\"vertical-align: baseline;\">: エージェント コーディング プラットフォームで、数千件もの隔離されたワークスペースをスピンアップできます。エージェントは、ストレージ固有のカスタマイズを必要とせず、標準の POSIX ファイル セマンティクスを活用して、ライブラリのインストール、複数ファイルのパッチ作成、ビルドツールの運用、そして単体テストを安全に行うことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチエージェント スウォームのコラボレーション</strong><span style=\"vertical-align: baseline;\">: リード オーケストレーターがリサーチ、コード生成、検証担当の専任サブエージェントにタスクを委任するような複雑なワークフローで、統合ファイルツリーを直接共有できます。RWX サポートにより、エージェントは書き込みの競合を発生させることなく、プロジェクト ファイルを同時に共同編集およびレビューできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インタラクティブな長期ワークフロー</strong><span style=\"vertical-align: baseline;\">: ユーザーが関与するアプリケーション（ユーザー承認を不定期に複数回必要とするエージェントや、数時間にわたるデータ分析パイプラインを実行するエージェントなど）の場合、プラットフォームはアイドル状態のエージェント サンドボックスを一時停止してコンピューティングの無駄を最小限に抑え、実行の再開にはオンデマンドで瞬時に対応します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">今すぐ利用開始</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Agent-as-a-Service プラットフォームの構築から、コーディング支援のスケーリングやエンタープライズ エージェント フリートのデプロイまで、いかなるタスクにおいても、ストレージ ティアはイノベーションを妨げるのではなく、加速させるものでなければなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">Filestore エージェント ボリュームは、Google Cloud のすべてのお客様が非本番環境ワークロードで今すぐご利用いただけます。本番環境ワークロードの一般提供サポートは、許可リストを通じてのご提供となります。この新サービスは、</span><strong style=\"vertical-align: baseline;\">GKE 上の Agent Substrate</strong><span style=\"vertical-align: baseline;\"> および </span><strong style=\"vertical-align: baseline;\">GKE Agent Sandbox</strong><span style=\"vertical-align: baseline;\"> と直ちに統合できる点を特長としており、応答性が高く、スケーラブルで、費用対効果の高いエージェント プラットフォームをすぐに構築することができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Filestore エージェント ボリュームへのアクセスをご希望の場合は、</span><a href=\"https://forms.gle/vYPkcFiZVoTjf7Ah7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのフォーム</span></a><span style=\"vertical-align: baseline;\">をご提出ください。詳細については、</span><a href=\"https://docs.cloud.google.com/filestore/docs/agent-volumes-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore のドキュメント</span></a><span style=\"vertical-align: baseline;\">と </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE のドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- グループ プロダクト マネージャー、Micah Waldman</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- エンジニアリング マネージャー、Maya Gal</strong></p></div>"
  "e9438f749a210f60ceb04d8892ec22c5":
    "id": "e9438f749a210f60ceb04d8892ec22c5"
    "title": "きめ細かい制御が可能な、新しいネイティブ セッション管理ツールのご紹介"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/introducing-new-session-management-tools-with-native-granular-controls/"
    "published": "2026-09-29 01:00:00"
    "fetched": "2026-09-29 13:21:51"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-new-session-management-tools-with-native-granular-controls?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud のセッション管理では、組織のセキュリティ ポリシーのニーズに基づいて</span><a href=\"https://knowledge.workspace.google.com/admin/security/about-2sv-enforcement-for-admins?ref_topic=7556782&amp;visit_id=639262429149592500-2280071449&amp;rd=1&amp;hl=ja\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">セッション管理を設定</span></a><span style=\"vertical-align: baseline;\">できる柔軟なオプションを提供しています。その一環として、セキュリティ ポスチャーの向上と、認証情報の窃取やアカウント乗っ取り（ATO）リスクの軽減を目的に、Google Cloud をご利用のお客様向けに、デフォルトのセッション時間を 16 時間に設定してロールアウトしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このセキュリティ標準は、セッション時間を独自に設定していなかったすべてのお客様への適用を完了しましたが、今日のクラウド環境ではさらに高い精度が求められています。このグローバル ロールアウトの完了に伴い、Google Cloud のセッション管理も、広範な管理設定から、</span><a href=\"https://docs.cloud.google.com/access-context-manager/docs/securing-console-and-apis?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コンテキストアウェア アクセス</span></a><span style=\"vertical-align: baseline;\">（CAA）の緊密に統合されたきめ細かい機能へと進化しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このアップデートにより、管理者はより柔軟に、より優れた自動化を実現し、より自然なセキュリティ ワークフローを構築できるようになりました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">セッション管理の新機能</strong></h3>\n<p><span style=\"vertical-align: baseline;\">1. 自動化ファースト: Terraform、gcloud、API のサポート</span><span style=\"vertical-align: baseline;\">最新のインフラストラクチャはコードとして管理されます。DevSecOps ワークフローをサポートするため、セッション管理ポリシーの設定は、UI からの手動設定に限定されなくなりました。一般提供が開始されたことにより、以下を使用してプログラムでセッション ポリシーを定義、デプロイ、管理できるようになりました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Terraform</strong><span style=\"vertical-align: baseline;\">: セッション管理をインフラストラクチャ マニフェストに直接統合します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">gcloud CLI</strong><span style=\"vertical-align: baseline;\">: コマンドラインからポリシーを管理します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">REST API</strong><span style=\"vertical-align: baseline;\">: 複雑なマルチテナント環境全体でポリシーの適用を自動化します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">2. Google グループによるきめ細かいターゲティング</span><span style=\"vertical-align: baseline;\">最も要望の多かったアップグレードの一つは、ポリシーを正確にターゲティングする機能でした。以前は、セッション継続時間は組織部門（OU）に関連付けられていました。一般提供が開始されたセッション管理ポリシーでは、Google グループを使用できるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この変更により、組織階層内のユーザーの場所に関係なく、特定のユーザー クラスタに異なるセッション ポリシーを適用できます。たとえば、権限昇格されたユーザー（課金管理者やプロジェクト オーナーなど）には 2 時間のセッションを適用し、一般の開発者には標準の 16 時間のセッションを維持できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">3. アプリケーションの精密な制御</span><span style=\"vertical-align: baseline;\">セッション管理ポリシーでは、Google Cloud API スコープを必要とするすべてのアプリケーションに影響する包括的なポリシーではなく、特定のアプリケーションに対して個別にセッション管理を設定できます。これらのアプリケーションには、以下が含まれます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud コンソール</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">gcloud コマンドライン ツール</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">特定の OAuth アプリケーション</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">一般提供が開始されたこのアップデートにより、「全か無か（オール・オア・ナッシング）」といった極端なシナリオを防ぐことができます。たとえば、Cloud SDK に厳格なポリシーを適用した結果、OAuth を利用している正当なビジネス インテリジェンスやダッシュボードとの連携まで意図せず遮断されてしまう、といった事態を回避できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">4. Google Cloud ネイティブのエクスペリエンス</span><span style=\"vertical-align: baseline;\">これまで、Google Cloud のセッション継続時間の設定は、Google Workspace 管理コンソールでしか行えませんでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud のお客様は、</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSeoPfTKIyJRBJuvZ0DuSjLKR3dSitJW8uzMFTfKtyU_d7U8Ng/viewform?usp=dialog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">お申し込み</span></a><span style=\"vertical-align: baseline;\">いただくことで Google Cloud コンソールを使用できるようになり、Access Context Manager（ACM）の他のアクセスレベルやセキュリティ バインディングと合わせて、セッション ポリシーを管理することも可能になります。プレビュー版として提供されるこのアップデートにより、Google Cloud コンソールでのポリシー管理を好む管理者は、すべての CAA ポリシーをより柔軟に、そして統一された操作感で設定できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ご利用方法</strong></h3>\n<p><span style=\"vertical-align: baseline;\">セッション制御を静的な組織のデフォルト設定から、動的なコンテキストアウェア ポリシーへと進化させることで、セキュリティ チームは開発スピードを損なうことなく、最もリスクの高い場面において、認証情報の窃取に対する再認証の制限を厳格化できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Terraform、REST API、gCloud を使用してセッション管理を構成する方法については、</span><a href=\"https://docs.cloud.google.com/access-context-manager/docs/session-controls-for-reauthentication\"><span style=\"text-decoration: underline; vertical-align: baseline;\">セッション管理に関するドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- プロダクト マネージャー、Senzeni Mpofu</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- ソフトウェア エンジニア、Cris Scruggs</strong></p></div>"
"last_updated": "2026-09-29 13:21:51 JST"
