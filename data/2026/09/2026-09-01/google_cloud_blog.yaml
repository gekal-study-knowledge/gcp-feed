    "title": "Cloud CISO Perspectives: Tips on securing the water sector in the AI era"
    "link": "https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-tips-on-securing-water-sector-ai-era/"
    "published": "2026-09-01 01:00:00"
    "fetched": "2026-09-01 05:39:39"
    "summary": "<div class=\"block-paragraph\"><p>Welcome to the second Cloud CISO Perspectives for August 2026. Today, Chris Sistrunk and Stephanie Kiel detail the critical issues facing the water sector, and actionable steps that OT operators can take to secure their infrastructure.</p><p>As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the <a href=\"https://cloud.google.com/blog/products/identity-security/\">Google Cloud blog</a>. If you’re reading this on the website and you’d like to receive the email version, you can <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">subscribe here</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7efcdec59eb0&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Tips on securing the water sector in the AI era</b></h3><p><i>By Chris Sistrunk, Practice Leader, OT, Mandiant Consulting, and Stephanie Kiel, Head of Cloud Security Policy, Government Affairs and Public Policy, Google Cloud</i></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"ChrisSistrunk\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/ChrisSistrunk.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Chris Sistrunk, Practice Leader, OT, Mandiant Consulting</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Google Cloud’s threat intelligence teams have observed that threat actors are becoming bolder when targeting critical infrastructure amid geopolitical conflicts. Recently, we’ve seen increased targeting of water utilities' internet-connected programmable logic controllers in the U.S.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Stephanie Kiel crop\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Stephanie_Kiel_crop.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Stephanie Kiel, Head of Cloud Security Policy, Government Affairs and Public Policy, Google Cloud</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Historically, cyber incidents haven’t usually disrupted operations, in part because water utility operators have long had manual override capabilities and established water-quality checks that kick in before water reaches consumers. Pumps and pipes fail routinely for reasons that have nothing to do with cyber threats.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">However, </span><span style=\"vertical-align: baseline;\">they do require our urgent attention and a commitment to stronger security hygiene. Manual overrides provide a reliable safety net, but preventing cyber threats still requires a </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-why-water-security-cant-wait\"><span style=\"text-decoration: underline; vertical-align: baseline;\">commitment to fundamental digital security</span></a><span style=\"vertical-align: baseline;\"> — especially in the AI era. </span></p>\n<p><span style=\"vertical-align: baseline;\">We recommend a threat-informed, risk-managed response. The current state of water sector security is indicative that additional action should be strongly considered in light of the unique operational resilience that keeps these systems safe.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Actions water and wastewater utilities should consider</strong></p>\n<p><span style=\"vertical-align: baseline;\">For resource-constrained utilities, the most effective defense is to </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-sticking-to-security-fundamentals-in-the-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">focus on cybersecurity fundamentals</span></a><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">By prioritizing these fundamental practices, you can significantly harden your systems and transform your organization into a far more challenging and resilient target, causing even well-resourced threat actors to look elsewhere.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inventory assets and assess exposure</strong><span style=\"vertical-align: baseline;\">: Identify if your control systems are insecurely exposed to the internet, which often allows for the successful exploitation of vulnerabilities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Basic security hygiene</strong><span style=\"vertical-align: baseline;\">: Replace default credentials with strong passwords, and rigorously harden exposed access points, including firewalls.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Backups</strong><span style=\"vertical-align: baseline;\">: Make sure that critical systems, including control systems, are safeguarded following the proven 3-2-1 backup rule (keep three copies of your data on two types of storage, with at least one copy stored off-site). Ensure critical spare equipment is on-hand to minimize downtime from cyberattacks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Segmentation</strong><span style=\"vertical-align: baseline;\">: Use network segmentation and multifactor authentication to ensure that remote access, when necessary, is strictly controlled. You should use read-only access where full control isn't required.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Emergency planning</strong><span style=\"vertical-align: baseline;\">: Integrate cyber-incident planning into your existing all-hazards incident command system, including </span><a href=\"https://www.fema.gov/emergency-managers/nims\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">FEMA NIMS</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"http://ics4ics.org\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Incident Command System for Industrial Control Systems</span></a><span style=\"vertical-align: baseline;\">, the same response structures you already use for physical pipe breaks, boil water alerts, and natural disasters.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Secure third-party and vendor access</strong><span style=\"vertical-align: baseline;\">: As many water utilities do not manage their own IT or OT and rely on third-party system integrators, you should audit the remote connections used by the system integrators and maintenance contractors. You should ensure third-party vendors are held to rigorous access controls (such as MFA standards) and logging requirements.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">These recommendations echo guidance from the American Water Works Association, the National Rural Water Association, the Water-ISAC, the Environmental Protection Agency, the Cybersecurity and Infrastructure Security Agency, and the FBI.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Recommendations for IT and OT leaders: Bridging the governance gap</strong></p>\n<p><span style=\"vertical-align: baseline;\">IT and OT leaders must work together to build a unified governance framework and should focus on making cyber-physical systems more resilient over the long term, a collective effort that spans government agencies, private sector organizations, and individuals. The goal is to build a future where these systems are secure, adaptable, and capable of recovering quickly from disruptions.</span></p>\n<p><span style=\"vertical-align: baseline;\">Although PLCs almost always sit outside standard software development practices, a robust approach to the software your organization uses can significantly enhance your overall security posture, such as those outlined in NIST’s </span><a href=\"https://csrc.nist.gov/Projects/ssdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secure Software Development Framework</span></a><span style=\"vertical-align: baseline;\"> (SSDF). They’re also good examples of leading indicators that can help you gauge your resilience, and to help you get started we’ve published a </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-10-ways-to-make-cyber-physical-systems-more-resilient\"><span style=\"text-decoration: underline; vertical-align: baseline;\">guide to evaluate leading indicators</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Manual overrides provide a reliable safety net, but preventing cyber threats still requires a commitment to fundamental digital security — especially in the AI era.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As technology evolves, it is critical to modernize security, transitioning from a reactive, manual model to an AI-augmented approach that keeps human expertise central to decision-making. This approach offers an unique opportunity to be a force multiplier for lean security teams. </span></p>\n<p><span style=\"vertical-align: baseline;\">To stay ahead of today’s threats, organizations must move beyond simple compliance checklists and adopt a more agile, threat-informed strategy that makes compliance a natural outcome of good security, rather than the primary goal.</span></p>\n<p><span style=\"vertical-align: baseline;\">The Mandiant Operational Technology (OT) </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/Mandiant-approach-to-operational-technology-security\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Theory of 99</span></a><span style=\"vertical-align: baseline;\"> has become more relevant in the AI era. Although the funnel of opportunity has been significantly compressed, in intrusions that go deep enough to impact OT:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">99% of compromised systems will be computer workstations and servers</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">99% of malware will be designed for computer workstations and servers</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">99% of forensics will be performed on computer workstations and servers</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">99% of detection opportunities will be for activity connected to computer workstations and servers</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">99% of intrusion dwell time happens in commercial, off-the-shelf computer equipment before any Purdue level 0-1 devices are impacted</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">As a result, there is often a significant overlap across tactics, techniques, and procedures used by threat actors who target IT and OT networks. However, the Theory of 99 underscores a significant defender's advantage in the AI era. By using </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review\"><span style=\"text-decoration: underline; vertical-align: baseline;\">advanced AI capabilities</span></a><span style=\"vertical-align: baseline;\"> to secure the 99% of intermediary infrastructure, organizations can proactively neutralize threats and ensure robust protection for the critical 1% of physical operational processes.</span></p>\n<p><strong style=\"vertical-align: baseline;\">AI for cyber defense</strong></p>\n<p><span style=\"vertical-align: baseline;\">As we have </span><a href=\"https://cloud.google.com/security/resources/defenders-advantage?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">shared before</span></a><span style=\"vertical-align: baseline;\">, AI capabilities offer the opportunity to shift the balance in network security in the favor of defenders. The defender’s advantage becomes even more important as </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">malicious actors</span></a><span style=\"vertical-align: baseline;\"> increasingly use AI capabilities across the attack lifecycle. </span></p>\n<p><span style=\"vertical-align: baseline;\">In the current threat environment, automating defenses can serve as a force multiplier for human security teams, enhancing decision-making and productivity to ensure critical exposures are addressed before they can be exploited. With careful planning, critical infrastructure providers can protect their physical assets while building a more resilient, threat-informed defense.</span></p>\n<p><span style=\"vertical-align: baseline;\">To effectively realize AI advantages for defense, you should integrate AI tools into systems in a structured, intentional way. It’s crucial that o</span><span style=\"vertical-align: baseline;\">perators understand the unique vulnerabilities that AI introduces to physical processes, evaluate specific business uses that can benefit from security automation, and establish clear frameworks to continuously test and monitor. As part of our approach, </span><span style=\"vertical-align: baseline;\">we’ve developed the </span><a href=\"https://saif.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secure AI Framework</span></a><span style=\"vertical-align: baseline;\"> to help you achieve secure integration and deployment of AI capabilities, regardless of sector. </span></p>\n<p><span style=\"vertical-align: baseline;\">Most importantly, human oversight must remain central — meaning that AI should support decision-making, and safety practices need to be embedded directly into incident response plans. </span></p>\n<p><strong style=\"vertical-align: baseline;\">What’s next for water security</strong></p>\n<p><span style=\"vertical-align: baseline;\">Protecting water systems from malicious cyber threats is not just a technical challenge; it is a fundamental public safety imperative. Given that access to clean, reliable water is an essential service, we anticipate that federal, state, and local governments will increasingly shift from policy debate to decisive action to ensure the continuity of this critical public infrastructure in the face of cyber threats.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">For example, the Office of the National Cyber Director in partnership with the State of Texas has just launched a pilot program to help </span><a href=\"https://www.nextgov.com/cybersecurity/2026/08/white-house-soon-launch-water-provider-cyber-protection-program/415650/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">protect water infrastructure providers from cyberattacks</span></a><span style=\"vertical-align: baseline;\">, and U.S. senators have already introduced a </span><a href=\"https://www.waterworld.com/water-utility-management/asset-management/news/55397851/senators-introduce-bill-to-strengthen-cybersecurity-at-water-utilities\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new bill in response to recent events</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Google is committed to helping you protect your cloud and hybrid cloud OT environments. To learn more about Google guidance on securing critical infrastructure, please visit our </span><a href=\"https://cloud.google.com/solutions/security/leaders?hl=en&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CISO Insights Hub</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7efcdd97ea90&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://x.com/googlecloud/status/2090213589558698309?s=20&#x27;), (&#x27;image&#x27;, &lt;GAEImage: Cloud-CISO-Perspectives-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>In case you missed it</b></h3><p>Here are the latest updates, products, services, and resources from our security teams so far this month:</p><ul><li><b>Empowering autonomous agents with advanced security governance</b>: To be useful and secure, AI agents need access — and also guardrails. In our new State of AI infrastructure report, 79% of tech leaders cite security, governance, or operations as their most significant challenge to scaling inference. <a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/state-of-ai-infrastructure-report-agent-governance-and-security\"><b>Read more</b></a>.</li><li><b>The state of cloud risk 2026: Most security findings aren’t real attacker opportunities</b>: Wiz Research telemetry reveals why the majority of high-severity findings lack a path to compromise. <a href=\"https://www.wiz.io/blog/cloud-risk-report-2026\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Introducing Google Cloud Fault Injection Testing in preview</b>: When databases fail and network paths falter, you still need your mission-critical cloud services to stay online. Fault Injection Testing (FIT) can help you automate failure testing to ensure predictable behavior during disruptions. <a href=\"https://cloud.google.com/blog/products/networking/introducing-google-cloud-fault-injection-testing-in-preview\"><b>Read more</b></a>.</li><li><b>How Wiz built AI-powered data discovery</b>: Inside the multi-agent pipeline and feedback loops that turned a bucket scanner into a context engine. <a href=\"https://www.wiz.io/blog/bucket-scanner-to-context-engine\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Democratizing FinOps with Wiz</b>: How the Wiz Cloud Cost automates cost allocation to power developer-led cost optimization and connect cost to business value. <a href=\"https://www.wiz.io/blog/cost-attribution-with-the-wiz-service-catalog\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Defend against agent risks with layered protections in Google Workspace Studio</b>: Studio incorporates layered defenses to mitigate risks from threat actors and robust observability tools to help organizations adopt agents safely. Built on Google’s secure-by-design architecture, Studio combines native threat defenses with deep ecosystem visibility to secure multi-step agentic workflows. <a href=\"https://workspace.google.com/blog/identity-and-security/defend-against-agentic-risks-with-multi-layered-protections-in-google-workspace-studio\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more security stories <a href=\"https://cloud.google.com/blog/products/identity-security\">published this month</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7efcdd97e130&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Threat Intelligence news</b></h3><ul><li><b>Distinct clusters target individuals of interest to Russia</b>: Google Threat Intelligence Group (GTIG) is tracking three suspected Russian cyber espionage threat clusters abusing legitimate authentication flows to target individuals working in academia, aerospace, governments, and think tanks across Europe and in the U.S. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia\"><b>Read more</b></a>.</li><li><b>Inside 90 days of attacks on AI infrastructure</b>: Wiz honeypots uncover active campaigns targeting LiteLLM, MCP servers, and AI frameworks through RCE, blind prompt injection, and memory credential theft. <a href=\"https://www.wiz.io/blog/ai-infrastructure-honeypot\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Version Control DFIR: A cheatsheet to GitHub, GitLab, Bitbucket, and Azure DevOps</b>: A practitioner’s guide to log visibility, incident readiness, and threat hunting across the major version control services. <a href=\"https://www.wiz.io/blog/vcs-dfir-threat-hunting-github-gitlab-azure-devops\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Rust supply chain attack on arrayref: Significant overlap with DPRK campaigns</b>: Malicious versions of the arrayref Rust crate (and others) executed a backdoor at compile time. The campaign's infrastructure overlaps with recent DPRK supply chain attacks, including Mastra and axios. <a href=\"https://www.wiz.io/blog/rust-supply-chain-attack-on-arrayref-significant-overlap-with-dprk-campaigns\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more threat intelligence stories <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\">published this month</a>.</p></div>\n<div class=\"block-paragraph\"><h3><b>Now hear this: Podcasts from Google Cloud</b></h3><ul><li><b>Cloud Security Podcast: Patching browsers with AI, agents, Rust, and your tabs</b>: Jasika Bawa and Doug Turner of Chrome Security explore how Google Chrome now uses AI agents to autonomously identify and patch security vulnerabilities at an unprecedented scale, significantly accelerating the browser's update cadence. <a href=\"https://www.youtube.com/watch?v=pCXT8lQqg_U\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: All about Project Atlas, Wiz's AI vulnerability research</b>: Near Orfeld, head of vulnerability research, Wiz, discusses how his team uses multi-agent AI systems for discovering high-impact zero-day vulnerabilities in cloud infrastructure. <a href=\"https://www.youtube.com/watch?v=qRJJ9ekpuVg\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: How Google eliminates classes of vulnerabilities at scale</b>: How do you build the foundations for a secure Google-scale enterprise that stays secure even if an AI is writing the code and nobody has time to review it? Christoph Kern, principal security engineer, Google, explores what secure-by-design really means in the AI era. <a href=\"https://www.youtube.com/watch?v=43imRRfgLgc\" target=\"_blank\"><b>Listen here</b></a>.</li></ul><p>To have our Cloud CISO Perspectives post delivered twice a month to your inbox, <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">sign up for our newsletter</a>. We’ll be back in a few weeks with more security-related updates from Google Cloud.</p></div>"
  "aa57e013bee4d3c84ff48cea1574bfe8":
    "id": "aa57e013bee4d3c84ff48cea1574bfe8"
    "title": "From weeks to minutes: The new agentic era of data pipelines"
    "link": "https://cloud.google.com/blog/products/data-analytics/build-data-pipelines-in-less-time-with-data-agent-kit/"
    "published": "2026-09-01 01:00:00"
    "fetched": "2026-09-01 05:39:39"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Data pipelines are the backbone of the modern enterprise, yet a barrier to entry exists for orchestrating them, making this critical capability unavailable to many data professionals. Following our </span><a href=\"https://cloud.google.com/blog/products/data-analytics/managed-apache-airflow-scaling-data-and-ai-workloads\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announcements at Google Cloud NEXT ’26</span></a><span style=\"vertical-align: baseline;\">, where we introduced the Orchestration Pipelines framework, we are fundamentally changing this dynamic.</span></p>\n<p><span style=\"vertical-align: baseline;\">To bring this powerful framework directly to practitioners, we offer the </span><a href=\"https://docs.cloud.google.com/data-cloud-extension\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> — a unified, freely available, and open-source collection of data engineering and data science tools that integrate directly into your preferred IDE or CLI (such as VS Code, Claude Code, or Codex).</span></p>\n<p><span style=\"vertical-align: baseline;\">The Data Agent Kit seamlessly embeds the </span><a href=\"https://docs.cloud.google.com/orchestration-pipelines/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines</span></a><span style=\"vertical-align: baseline;\"> framework into your workflow in two distinct ways. First, it provides a dedicated </span><a href=\"https://docs.cloud.google.com/data-agent-kit/build-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Engineering tab</span></a><span style=\"vertical-align: baseline;\"> for comprehensive pipeline management. Second, it includes a specialized agentic skill designed to author, deploy, and troubleshoot production-grade </span><a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Airflow® DAGs</span></a><span style=\"vertical-align: baseline;\"> using natural language.</span></p>\n<p><span style=\"vertical-align: baseline;\">By pairing these specialized agent skills with a declarative YAML DSL, all data personas — from analysts to ML engineers — can bypass complex Python Airflow boilerplate. This framework decouples high-level orchestration logic from underlying compute execution, democratizing access to powerful MLOps capabilities across your entire data organization.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we will walk through an exemplary MLOps use case to demonstrate how easily this can be achieved.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Setting up your environment</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Before authoring your first Orchestration Pipeline, you need to set up your local development environment. Getting started takes less than two minutes.</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. Install and configure the extension</strong></p>\n<p><span style=\"vertical-align: baseline;\">To install the extension in your preferred IDE or CLI — such as VS Code, VS Code forks, Antigravity, Claude Code, Antigravity CLI, or Codex — and authenticate it with your Google Cloud account, follow the step-by-step setup guide in the official documentation:</span> <a href=\"https://docs.cloud.google.com/data-cloud-extension/vs-code/install\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Agent Kit installation guide</strong></a></p>\n<p><strong style=\"vertical-align: baseline;\">2. Verify orchestration pipeline skills</strong></p>\n<p><span style=\"vertical-align: baseline;\">Once installed, verify that the required agent skills are active:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Open the ‘</span><strong style=\"vertical-align: baseline;\">Google Cloud Data Agent Kit’</strong><span style=\"vertical-align: baseline;\"> panel on the VS Code activity bar.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Navigate to ‘</span><strong style=\"vertical-align: baseline;\">Settings’</strong><span style=\"vertical-align: baseline;\"> then ‘</span><strong style=\"vertical-align: baseline;\">Skills’</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Ensure the ‘</span><strong style=\"vertical-align: baseline;\">gcp-pipelines-orchestration’</strong><span style=\"vertical-align: baseline;\"> skill is enabled.</span></p>\n</li>\n</ol>\n<p><a href=\"https://github.com/gemini-cli-extensions/data-agent-kit-starter-pack/tree/main/skills/gcp-pipeline-orchestration\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">This skill provides</span></a><span style=\"vertical-align: baseline;\"> the agent with deep contextual knowledge of pipeline syntax, variable substitution, secret management, and automated incident diagnosis for Airflow runs.</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. Building your first pipeline</strong></p>\n<p><span style=\"vertical-align: baseline;\">To start authoring, building, and validating orchestration pipelines directly inside the any VS Code compatible IDE using natural language prompts, follow the official building guide: </span><a href=\"https://docs.cloud.google.com/data-cloud-extension/vs-code/build-pipelines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Build pipelines guide</strong></a></p>\n<h3><strong style=\"vertical-align: baseline;\">An example business problem: Proactive supply chain management</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Let’s walk through an example business problem. </span><span style=\"vertical-align: baseline;\">In the logistics and retail sector, customer satisfaction hinges on accurate delivery estimates. When an order is delayed without warning, customer churn can spike and support costs can escalate.</span></p>\n<p><span style=\"vertical-align: baseline;\">To address this, we are building an end-to-end MLOps architecture that predicts the exact transit time (in days) based on warehouse location, customer location, and order characteristics. By predicting these delays before shipping, operations teams can proactively notify customers or automatically upgrade shipping tiers before Service Level Agreements (SLAs) are breached.</span></p>\n<p><span style=\"vertical-align: baseline;\">To make this architecture fully reproducible, we use the </span><code style=\"vertical-align: baseline;\">bigquery-public-data.thelook_ecommerce</code><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/bigquery/public-data\"><span style=\"text-decoration: underline; vertical-align: baseline;\">public dataset in BigQuery</span></a><span style=\"vertical-align: baseline;\">. For demo purposes, we split this static dataset into training and inference sets. In a real-life scenario, inference would be performed on new, incoming data. This dataset provides authentic operational complexity:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Geographical data:</strong><span style=\"vertical-align: baseline;\"> Latitude and longitude for both customer addresses (</span><code style=\"vertical-align: baseline;\">users</code><span style=\"vertical-align: baseline;\">) and distribution centers (</span><code style=\"vertical-align: baseline;\">distribution_centers</code><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Temporal data:</strong><span style=\"vertical-align: baseline;\"> Granular order lifecycle timestamps (</span><code style=\"vertical-align: baseline;\">created_at</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">shipped_at</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">delivered_at</code><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Order attributes:</strong><span style=\"vertical-align: baseline;\"> Product categories, pricing, and fulfillment status (</span><code style=\"vertical-align: baseline;\">orders</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">order_items</code><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By combining this dataset with BigQuery, </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> serverless, </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://www.getdbt.com/product/what-is-dbt\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dbt</span></a><span style=\"vertical-align: baseline;\">, we will demonstrate how to build an automated, self-healing MLOps loop that handles training, daily batch inference, and model drift evaluation.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The agentic workflow: From prompt to pipeline in minutes</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With the extension configured, we can bypass boilerplate Python for DAG authoring entirely. Inside VS Code, we opened the Data Agent Kit chat and provided a single natural language prompt to define our continuous MLOps feedback loop:</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">Note:</strong><span style=\"font-style: italic; vertical-align: baseline;\"> The detailed prompt was crafted with repeatability in mind specifically for this blog post. In real-life scenarios, you can achieve the same result in a more conversational way, pipeline by pipeline. The complete prompt and all generated files are available in the </span><a href=\"https://github.com/GoogleCloudPlatform/orchestration-pipelines/tree/main/examples/blogpost-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Orchestration-pipelines GitHub repository</span></a><span style=\"font-style: italic; vertical-align: baseline;\">. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Note:</strong><span style=\"vertical-align: baseline;\"> While frontier models equipped with the Orchestration Pipelines skill can often scaffold complete workflows in a single step, LLM responses naturally vary based on model versions, workspace context, and token depth. If a specific parameter, dataset path, or dependency is omitted in the initial pass, simply provide a short follow-up prompt.</span></p>\n<p><span style=\"vertical-align: baseline;\">Within minutes, the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/data-engineering-agent-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> generated the underlying PySpark scripts, dbt configurations, and the three declarative YAML pipelines.</span></p>\n<p><span style=\"vertical-align: baseline;\">Please find below the generated YAML pipelines and a visual diagram of them. This pipeline is a simplified example designed to showcase Orchestration Pipelines capabilities. In practice, recommended production MLOps setups will vary depending on your specific use cases and operational needs.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_XMQ1O65.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Pipeline 1: The training engine<br /></strong><span style=\"vertical-align: baseline;\">This pipeline serves as our heavy-compute engine. The agent generated a YAML definition that first queries BigQuery to extract historical completed orders. It then dynamically provisions a Managed Spark serverless cluster to calculate geographical distances and train a model for production use. Finally, it pushes the trained model to Gemini Enterprise Agent Platform Model Registry.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;modelVersion: &quot;1.0&quot;\\r\\npipelineId: &quot;training-pipeline&quot;\\r\\nrunner: airflow\\r\\nowner: &quot;mlops&quot;\\r\\ntags:\\r\\n  - &quot;job:datacloud:antigravity&quot;\\r\\ndefaults:\\r\\n  projectId: &quot;your-project-id&quot;\\r\\n  location: &quot;us-central1&quot;\\r\\n  executionConfig:\\r\\n    retries: 0\\r\\n\\r\\nactions:\\r\\n  - sql:\\r\\n      name: &quot;extract_training_data&quot;\\r\\n      engine:\\r\\n        bigquery:\\r\\n          location: &quot;US&quot;\\r\\n          destinationTable: &quot;your-project-id.mlops.training_dataset&quot;\\r\\n      query:\\r\\n        path: &quot;blogpostdemo/training_query.sql&quot;\\r\\n\\r\\n  - pyspark:\\r\\n      name: &quot;train_model_dataproc&quot;\\r\\n      dependsOn:\\r\\n        - &quot;extract_training_data&quot;\\r\\n      engine:\\r\\n        dataprocServerless:\\r\\n          location: &quot;us-central1&quot;\\r\\n          resourceProfile:\\r\\n            inline:\\r\\n              runtimeConfig:\\r\\n                version: &quot;2.3&quot;\\r\\n                properties:\\r\\n                  &quot;spark.dataproc.driverEnv.PYTHONPATH&quot;: &quot;./libs/lib/python3.11/site-packages&quot;\\r\\n                  &quot;spark.executorEnv.PYTHONPATH&quot;: &quot;./libs/lib/python3.11/site-packages&quot;\\r\\n      mainFilePath: &quot;blogpostdemo/train_model.py&quot;\\r\\n      environment:\\r\\n        requirements:\\r\\n          inline:\\r\\n            list:\\r\\n              - &quot;tensorflow==2.14.1&quot;\\r\\n              - &quot;numpy&lt;2.0.0&quot;\\r\\n              - &quot;protobuf&lt;5.0.0dev&quot;\\r\\n              - &quot;google-cloud-storage&quot;\\r\\n\\r\\n  - ai:\\r\\n      name: &quot;upload_model_vertex&quot;\\r\\n      dependsOn:\\r\\n        - &quot;train_model_dataproc&quot;\\r\\n      agentPlatform:\\r\\n        projectId: &quot;your-project-id&quot;\\r\\n        location: &quot;us-central1&quot;\\r\\n        modelUpload:\\r\\n          modelName: &quot;transit_days_predictor&quot;\\r\\n          modelArtifactUri: &quot;gs://your-bucket-name/models/tf_transit_days_model&quot;\\r\\n          servingContainerImageUri: &quot;us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-14:latest&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7efcde1e2340&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Pipeline 2: Daily inference<br /></strong><span style=\"vertical-align: baseline;\">For our daily operational workflow, this lightweight pipeline applies the trained model to all currently in-transit orders. It queries the dataset via BigQuery job, executes inference job via Gemini Enterprise Agent Platform, and writes the results back to a BigQuery table to flag potential SLA breaches for the customer support team.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;modelVersion: &quot;1.0&quot;\\r\\npipelineId: &quot;inference-pipeline&quot;\\r\\nrunner: airflow\\r\\nowner: &quot;mlops&quot;\\r\\ntags:\\r\\n  - &quot;job:datacloud:antigravity&quot;\\r\\ndefaults:\\r\\n  projectId: &quot;your-project-id&quot;\\r\\n  location: &quot;us-central1&quot;\\r\\n  executionConfig:\\r\\n    retries: 0\\r\\n\\r\\nactions:\\r\\n  - sql:\\r\\n      name: &quot;extract_inference_data&quot;\\r\\n      engine:\\r\\n        bigquery:\\r\\n          location: &quot;US&quot;\\r\\n          destinationTable: &quot;your-project-id.mlops.inference_dataset&quot;\\r\\n      query:\\r\\n        path: &quot;blogpostdemo/inference_query.sql&quot;\\r\\n\\r\\n  - ai:\\r\\n      name: &quot;run_vertex_batch_prediction&quot;\\r\\n      dependsOn:\\r\\n        - &quot;extract_inference_data&quot;\\r\\n      agentPlatform:\\r\\n        projectId: &quot;your-project-id&quot;\\r\\n        location: &quot;us-central1&quot;\\r\\n        batchInference:\\r\\n          jobDisplayName: &quot;inference_job&quot;\\r\\n          modelName: &quot;projects/your-project-id/locations/us-central1/models/your-model-id&quot;\\r\\n          bigquerySource: &quot;bq://your-project-id.mlops.inference_dataset&quot;\\r\\n          bigqueryDestinationPrefix: &quot;bq://your-project-id.mlops&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7efcde1e20a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Pipeline 3: Automated evaluation and branching<br /></strong><span style=\"vertical-align: baseline;\">The daily evaluation pipeline acts as our automated quality gate. It triggers dbt models to join our predictions with actual delivery timestamps, calculating absolute errors and SLA breaches.</span></p>\n<p><span style=\"vertical-align: baseline;\">Using built-in logic, the pipeline automatically evaluates these metrics. If the model’s error rate exceeds our acceptable threshold, it conditionally triggers the ‘training-pipeline’ to generate a fresh model.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;modelVersion: &quot;1.0&quot;\\r\\npipelineId: &quot;evaluation-pipeline&quot;\\r\\nrunner: airflow\\r\\nowner: &quot;mlops&quot;\\r\\ntags:\\r\\n  - &quot;job:datacloud:antigravity&quot;\\r\\ndefaults:\\r\\n  projectId: &quot;your-project-id&quot;\\r\\n  location: &quot;us-central1&quot;\\r\\n  executionConfig:\\r\\n    retries: 0\\r\\n\\r\\nactions:\\r\\n  - pipeline:\\r\\n      name: &quot;run_dbt_models&quot;\\r\\n      framework:\\r\\n        dbt:\\r\\n          airflowWorker:\\r\\n            projectDirectoryPath: &quot;blogpostdemo/dbt_project&quot;\\r\\n\\r\\n  - python:\\r\\n      name: &quot;check_retraining_condition&quot;\\r\\n      dependsOn:\\r\\n        - &quot;run_dbt_models&quot;\\r\\n      mainFilePath: &quot;blogpostdemo/evaluate_drift.py&quot;\\r\\n      pythonCallable: &quot;check_drift&quot;\\r\\n      engine:\\r\\n        local: {}\\r\\n\\r\\n  - orchestrationPipeline:\\r\\n      name: &quot;trigger_retraining_pipeline&quot;\\r\\n      dependsOn:\\r\\n        - &quot;check_retraining_condition&quot;\\r\\n      pipelineId: &quot;training-pipeline&quot;\\r\\n      bundleId: &quot;my-first-bundle&quot;\\r\\n      waitForCompletion: false&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7efcde1e2130&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Automated deployment to Managed Service for Apache Airflow</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Authoring pipeline logic is only half the battle; deploying it securely and reliably to production is where data teams historically lose valuable time.</span></p>\n<p><span style=\"vertical-align: baseline;\">With </span><a href=\"https://docs.cloud.google.com/orchestration-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines</span></a><span style=\"vertical-align: baseline;\">, deployment is streamlined through standard CI/CD practices. Rather than manually writing deployment scripts or configuring complex environment boundaries, the Data Agent Kit automatically generates the necessary continuous integration workflows (such as GitHub Actions) for your workspace.</span></p>\n<p><span style=\"vertical-align: baseline;\">This means you can simply click commit, and the framework will seamlessly package and deploy your Orchestration Pipeline bundle directly to your Managed Airflow environment.</span></p>\n<p><span style=\"vertical-align: baseline;\">For a comprehensive guide on integrating these automated workflows into your existing CI/CD pipelines, review the official guide:</span> <a href=\"https://docs.cloud.google.com/orchestration-pipelines/deploy-orchestration-pipelines#deploy-run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deploying Orchestration Pipelines</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Day-two operations: Monitoring and agentic troubleshooting</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Maintaining these pipelines is just as intuitive as building them. By bringing the orchestration control plane directly into your IDE, the Data Agent Kit provides real-time monitoring of your Managed Airflow runs without requiring you to constantly context-switch between browser tabs.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_6wcKwIA.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>The Data Agent Kit provides real-time monitoring of your Managed Airflow runs directly within your IDE.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_qAVdnpZ.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>The Data Agent Kit visualises the created pipeline.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Inevitably, infrastructure or data issues occur—perhaps a Managed Spark cluster hits an out-of-memory exception due to a seasonal data spike, or a BigQuery quota is reached. Resolving these issues no longer requires digging through thousands of lines of raw execution logs.</span></p>\n<p><span style=\"vertical-align: baseline;\">If a pipeline fails, the Data Agent Kit provides out-of-the-box agentic troubleshooting. With the click of a \"Troubleshoot\" button in your IDE, the Data Engineering Agent analyzes the failure context. It can accurately distinguish between infrastructure quota limits and code-level bugs, instantly providing a root-cause summary and suggesting an inline fix (such as scaling up the compute template).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_tCCNsgc.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Agentic troubleshooting instantly diagnoses pipeline failures, identifies infrastructure bottlenecks, and suggests inline fixes.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Summary: Accelerating time to value</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Building a resilient MLOps architecture — extracting historical data, executing dbt transformations, provisioning Managed Spark ML compute, integrating Gemini Enterprise Agent Platform for model registry and inference, and configuring cross-DAG conditional triggers — traditionally takes platform engineering teams weeks of writing complex Python Operator logic.</span></p>\n<p><span style=\"vertical-align: baseline;\">With Orchestration Pipelines and the Data Agent Kit, this entire lifecycle was authored, deployed, and easily maintained in a matter of minutes. By replacing boilerplate infrastructure code with a declarative, agent-ready standard, we are ensuring your data organization spends less time orchestrating pipelines and more time delivering tangible business value.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Get Started Today:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the</span><a href=\"https://docs.cloud.google.com/orchestration-pipelines/overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Install the</span> <a href=\"https://docs.cloud.google.com/data-agent-kit\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> in your preferred IDE or CLI and configure your workspace.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn more about the broader ecosystem in our recent blog post: </span><a href=\"https://cloud.google.com/blog/products/data-analytics/data-agent-kit-brings-data-skills-and-tools-to-your-ide-or-cli\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit brings data skills and tools to your IDE or CLI</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore reference architectures in the </span><a href=\"https://docs.cloud.google.com/data-cloud-extension/vs-code/train-models\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
  "e7d91810f8c5c15ea8100191ee7480b6":
    "id": "e7d91810f8c5c15ea8100191ee7480b6"
    "title": "What’s new in AI infrastructure and orchestration in August"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/whats-new-in-ai-infrastructure-this-month/"
    "published": "2026-09-01 01:00:00"
    "fetched": "2026-09-01 05:39:39"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Welcome back to </span><span style=\"font-style: italic; vertical-align: baseline;\">What’s new in AI infrastructure and orchestration this month</span><span style=\"vertical-align: baseline;\">, a collection of product updates, how-tos, customer stories, research and other resources about all the AI compute, networks, storage, frameworks, and orchestration software that you can find at Google Cloud. To be honest, we thought August would be a slow month, but nothing could be further from the truth. Read on and you’ll see what we mean.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">August 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore</span></a><span style=\"vertical-align: baseline;\">, Google Cloud’s first-party, secure, scalable NFS file service, has emerged as a popular storage platform for AI and agentic workflows, and now, it’s even better suited to the task, with a new backend storage layer built directly on </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/how-colossus-optimizes-data-placement-for-performance?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Colossus</span></a><span style=\"vertical-align: baseline;\">, Google’s foundational distributed storage system. This new backend lets you provision IOPS independently from storage capacity, and is deeply integrated with GKE. In AI environments, this can help you service so-called agentic swarms — large groups of agents that need to read and write to a common dataset — without a drop off in performance. For more, check out the </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-file-service-runs-on-colossus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog post</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature: </strong><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor sandboxes are now available in distributed Ray clusters on GKE</span></a><span style=\"vertical-align: baseline;\">. In partnership with Anyscale, we introduced an experimental library for Ray that brings gVisor, Google’s open-source application kernel, directly into distributed Ray clusters. gVisor provides lightweight environments with stronger isolation than ordinary containers, plus fast startup times and low memory overhead. To try out these sandboxing capabilities on GKE, head over to the </span><a href=\"https://docs.ray.io/en/master/cluster/kubernetes/examples/ray-sandboxing.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray sandboxing User Guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update: </strong><span style=\"vertical-align: baseline;\">Looking for high-performance, easy-to-use infrastructure on which to run a personal AI agent, but don’t want to spend a lot of money? New </span><a href=\"https://cloud.google.com/blog/products/serverless/introducing-cloud-run-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run instances</span></a><span style=\"vertical-align: baseline;\"> are dedicated, singleton compute runtimes on Cloud Run that won’t shut down when the agent is idle. Better yet, the cost to run a Cloud Run instance with 1 vCPU and 1 GiB of memory continuously for 30 days is just $5.70.  </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides, documentation and how-tos</span></h4>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Big news in Model Context Protocol (MCP) land: As of the 2026-07-28 specification, the protocol core is “completely stateless. The handshake is gone. The initialize / initialized handshake (SEP-2575) and the logical Mcp-Session-Id header (SEP-2567) have been removed entirely. Instead, every request is now self-describing and independent.” Whoa. Learn more about the changes that the latest MCP specification brings, and more importantly, how to implement them, in </span><a href=\"https://developers.googleblog.com/scaling-ai-agent-infrastructure-with-the-mcp-stateless-updates/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this Google Developers blog</span></a><span style=\"vertical-align: baseline;\">.  </span></li>\n<li><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">Real-time AI systems make a mess of traditional network load balancing techniques.</span><span style=\"font-style: italic; vertical-align: baseline;\"> “Instead of handling isolated requests, the backend has to manage a continuous, live bidirectional stream. You’re dealing with a constant stream of audio chunks, transcripts, model outputs, and synthesized speech flowing back and forth simultaneously.”</span><span style=\"vertical-align: baseline;\"> Things only get worse when the user gets involved. </span><span style=\"font-style: italic; vertical-align: baseline;\">“The server has to immediately halt its current speech generation, pivot to update the context, maybe trigger a new tool, and start drafting a different response; this must be done without dropping the connection.”</span><span style=\"vertical-align: baseline;\"> For a new approach to managing load in the AI era, read </span><a href=\"https://developers.googleblog.com/scaling-real-time-ai-agents-with-session-aware-load-balancing/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scaling real-time AI agents with session-aware load balancing</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">How-to:</strong><span style=\"vertical-align: baseline;\"> Learn how to build an elastic, scalable LLM inference platform on GKE, even with a mix of different GPU accelerators. The proposed architecture combines Capacity Advisor and Compute Advisor, plus high-performance storage like RunAI:model streamer or GCPFuse with parallel downloads. Get all the details </span><a href=\"https://discuss.google.dev/t/how-to-build-an-elastic-scalable-llm-inference-platform-on-gke-using-fluid-compute/388108\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Documentation: </strong><span style=\"vertical-align: baseline;\">The thing about hosts with GPUs or TPUs is that you can’t use live migration to update them, setting up a maintenance challenge. In this new docs page, learn how to </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/perform-host-maintenance-accelerators\"><span style=\"text-decoration: underline; vertical-align: baseline;\">update accelerator-equipped hosts</span></a><span style=\"vertical-align: baseline;\"> according to your tolerance for downtime for your training and inference workloads.   </span><strong style=\"vertical-align: baseline;\"> </strong></li>\n<li><strong style=\"vertical-align: baseline;\">Documentation: </strong><span style=\"vertical-align: baseline;\">Advanced Compute Images, or ACIs, are standardized image stacks for AI/ML and HPC infrastructure, so you don’t need to manually build your own custom images. In this new docs page, learn how to </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/use-aci-images\"><span style=\"text-decoration: underline; vertical-align: baseline;\">create an ACI image</span></a><span style=\"vertical-align: baseline;\"> using the Google Cloud CLI, console, or SchedMD's Slurm workload manager</span><strong style=\"vertical-align: baseline;\">. </strong></li>\n<li><strong style=\"vertical-align: baseline;\">Guide: </strong><span style=\"vertical-align: baseline;\">AI workloads are notoriously difficult to architect, resource-intensive, and bursty, which can also lead to scaling bottlenecks and large pools of underutilized — or misutilized — compute resources. A new blog outlines the </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">three main ways to achieve dynamic capacity management in Google Cloud</span></a><span style=\"vertical-align: baseline;\">: 1) scheduling capacity for planned downtime; 2) maintaining automated fallback capacity for unplanned downtime; and 3) relying on GKE’s core orchestration capabilities to automate resource allocation. </span></li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Business orchestration software provider </span><a href=\"https://www.uipath.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">UiPath</strong></a><span style=\"vertical-align: baseline;\"> was dealing with spiky workloads, and wanted more predictable costs. To get there, it re-architected its infrastructure, moving from isolated clusters to a shared Google Cloud GPU fleet that included both A3 VM instances (NVIDIA H100 GPUs) for training with G4 VM instances (NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs) for inference. You can read more about their architecture </span><a href=\"https://cloud.google.com/blog/topics/customers/how-uipath-built-its-high-performance-gpu-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://mirendil.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mirendil</strong></a><span style=\"vertical-align: baseline;\">, an frontier AI lab focused on accelerating AI development, announced that it is </span><a href=\"https://cloud.google.com/blog/topics/startups/mirendil-selects-ai-hypercomputer?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">using AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> with both TPUs and NVIDIA GPUs to support its model pre-training and post-training applications. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://replen.it/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Replenit</strong></a><span style=\"vertical-align: baseline;\">, a retail CRM provider, built its AI decision engine in Google Cloud, using BigQuery, Gemini Enterprise Agent Platform, and open-source Gemma models that it runs on Cloud TPUs. This latter combination provided Replenit with 90% lower pipeline costs than their previous cloud provider, the company reports. Read the </span><a href=\"https://cloud.google.com/customers/replenit?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">full case study</span></a><span style=\"vertical-align: baseline;\"> for more. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.malachyte.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Malachyte</strong></a><span style=\"vertical-align: baseline;\"> architected its AI-powered e-commerce recommendation platform on top of Bigtable, Managed Service for Apache Kafka, Pub/Sub, Compute Engine, and last but not least, GKE. See how it all comes together in </span><a href=\"https://cloud.google.com/blog/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this blog</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">July 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology, and tools updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"vertical-align: baseline;\"> is now GA, and available in four distinct performance tiers that deliver throughput ranging from 125 MB/s, 250 MB/s, 500 MB/s, to 1000 MB/s per TiB of capacity — with the ability to scale up to 8 PB of storage capacity. The Managed Lustre solution is powered by DDN’s EXAScaler, combining DDN's decades of leadership in high-performance storage with Google Cloud's expertise in cloud infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/compute/c4n-network-and-storage-optimized-vms?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">C4N network and storage optimized VMs are now GA</span></a><span style=\"vertical-align: baseline;\">. C4N is our first network- and block-storage-optimized VM series built to eliminate data-transfer bottlenecks. Powered by 5th Gen Intel Xeon Scalable processors and built on Google's </span><a href=\"https://cloud.google.com/titanium?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> offloading hardware, it achieves 400 Gbps network bandwidth, 95 million packets per second (MPPS), and up to 25 GiB/s of block storage throughput when paired with Hyperdisk Extreme.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/planning-large-clusters#clusters-5k-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Dataplane V2 up to 15K Nodes with Network Policies (GA)</span></a><span style=\"vertical-align: baseline;\">. This capability enables standard GKE clusters to scale up to 15,000 nodes while maintaining full active Network Policy enforcement, supporting the massive infrastructure needs of large enterprise and AI/ML customers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/introducing-co-operative-time-slicing-for-rl-in-llm-d?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Co-operative time-slicing in llm-d</span></a><span style=\"vertical-align: baseline;\">. If you’re running reinforcement learning (RL) workloads, you can now interleave independent RL jobs onto shared physical hardware, increasing aggregate accelerator duty cycles from a ~40% baseline up to 70% without impacting model convergence or accuracy. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New AI security tool:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-k8s-aibom-on-gke-for-automated-ai-bills-of-materials?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looking to secure your AI supply chain on GKE</span></a><span style=\"vertical-align: baseline;\">, deploy AI workloads safely, and cut down on shadow AI? We open-sourced k8s-aibom, a lightweight, unprivileged Kubernetes controller that continuously monitors container clusters to automatically detect running AI runtimes (like vLLM and Triton) and generate standard CycloneDX Machine Learning Bill of Materials (ML-BOMs). Check out the </span><a href=\"https://github.com/GoogleCloudPlatform/k8s-aibom\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">k8s-aibom project</span></a><span style=\"vertical-align: baseline;\"> and get involved.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide: </strong><span style=\"vertical-align: baseline;\">On July 27, Google announced </span><a href=\"https://discuss.google.dev/t/announcing-day-0-support-for-kimi-k3-on-google-cloud/385392\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Day 0 support for Moonshot AI’s Kimi K3</span></a><span style=\"vertical-align: baseline;\"> 2.8-trillion-parameter open-weight model, the day weights were released. Whichever your preferred deployment path — via Model Garden, custom orchestration, or GKE with llm-d recipes — this guide offers detailed step-by-step instructions to help you evaluate and pilot Kimi K3 in Google Cloud. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/autopilot-clusters-with-gke-managed-dranet-gpus-and-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE) managed DRANET supports both GPUs and TPUs</span></a><span style=\"vertical-align: baseline;\">. There are several configurations to use this implementation, including standard cluster (where you have full control) and autopilot cluster (where Google does the heavy configs for you). Take a deeper dive in the hands-on lab, </span><a href=\"https://codelabs.developers.google.com/codelabs/gke-autopilot-tpus-dranet-gemma#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Autopilot clusters with TPUs, GKE managed DRANET and Gemma 4</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Learn to run Ray on TPUs, not GPUs. In </span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-1-the-foundations/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Part 1</span></a><span style=\"vertical-align: baseline;\"> of this two-part series, we discuss TPU slices (hint: Ray thinks of them as just another accelerator on which to schedule), then walk through Ray’s various AI libraries (</span><a href=\"https://developers.googleblog.com/run-ray-on-tpu-part-2-ray-ai-libraries/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Part 2</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide: </strong><span style=\"vertical-align: baseline;\">Evaluate TPUs for sample workloads using a new microbenchmark suite that helps you accurately assess whether a device is achieving its theoretical performance specifications, and to identify specific performance gaps or architecture-specific bottlenecks. Dive in </span><a href=\"https://developers.googleblog.com/how-to-use-google-microbenchmarks-for-evaluating-tpu-performance/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Scale your agents without killing your budget. </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/reduce-your-agents-costs-with-gke-agent-sandbox?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn how GKE orchestration can help you safely pack more agents onto a fixed compute footprint</span></a><span style=\"vertical-align: baseline;\"> with GKE Agent Sandbox and Pod snapshots. Whether your goal is performance or cost optimization, we teach you how to turn the right dials for optimal agent efficiency. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Technical blueprint: </strong><span style=\"vertical-align: baseline;\">Inside the optimization of Mistral 3 large inference on Ironwood. This blog outlines how one Google team optimized Mistral 3 large MoE model inference on Google’s Ironwood (TPU v7x), achieving a 1.5x performance gain. They did so with hybrid sharding, replacing linear VPU summations with tree reductions, optimizing GMM/MLA kernels, and adopting asynchronous scheduling. As a result, they boosted throughput by up to 48% while maintaining benchmark accuracy neutrality. Read the full blog </span><a href=\"https://discuss.google.dev/t/inside-the-optimization-of-mistral-3-large-inference-on-ironwood/385847\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report: </strong><span style=\"vertical-align: baseline;\">Google was named a Leader in the inaugural </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/google-is-a-leader-in-gartner-magic-quadrant-for-ai-infra?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gartner</span><span style=\"text-decoration: underline; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Ⓡ</span></span><span style=\"text-decoration: underline; vertical-align: baseline;\"> Magic Quadrant™ for AI Infrastructure</span></a><span style=\"vertical-align: baseline;\">, positioned highest for ‘Ability to Execute’ and furthest for ‘Completeness of Vision’. Gartner called out Google’s proprietary scalable compute, integrated AI Hypercomputer architecture, and the scale of our AI compute capacity as key strengths. Download a copy </span><a href=\"https://cloud.google.com/resources/content/2026-gartner-mq-ai-infrastructure?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report:</strong><span style=\"vertical-align: baseline;\"> We recently surveyed more than 1,400 senior IT leaders for our </span><a href=\"https://cloud.google.com/resources/content/state-of-infrastructure-in-the-agentic-ai-era?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">State of AI Infrastructure report</span></a><span style=\"vertical-align: baseline;\">, and a resounding pattern emerged: The gap between AI ambition and infrastructure reality is widening. In fact, 83% of organizations say they require infrastructure upgrades to support production-grade agentic AI. </span><a href=\"https://cloud.google.com/blog/products/compute/state-of-ai-infrastructure-report-overview?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the accompanying blog</span></a><span style=\"vertical-align: baseline;\"> to understand how adapting your infrastructure to meet the demands that agentic applications place on your systems will help you move from pilot to production.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">June 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology and tool updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> Protecting sensitive data used with AI is a critical part of advanced and secure cloud infrastructure. </span><a href=\"https://cloud.google.com/security/products/confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> cryptographically protects data in use in hardware-based Trusted Execution Environments (TEEs) with verifiable data integrity, and is </span><a href=\"https://cloud.google.com/blog/products/identity-security/verifiable-trust-in-the-ai-era-whats-new-in-confidential-computing?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">now available</span></a><span style=\"vertical-align: baseline;\"> on the accelerator-optimized </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G4 machine series</span></a><span style=\"vertical-align: baseline;\">, featuring </span><a href=\"https://www.nvidia.com/en-us/products/workstations/professional-desktop-gpus/rtx-pro-6000-family/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs</span></a><span style=\"vertical-align: baseline;\">. Get started with </span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-vm/docs/create-a-confidential-vm-instance-with-gpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 VMs</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/gpus-confidential-nodes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential G4 GKE Nodes</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Developer resource: </strong><span style=\"vertical-align: baseline;\">The new </span><a href=\"https://cloud.google.com/products/tpu/tpu-developer?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Developer Hub</span></a><span style=\"vertical-align: baseline;\"> is the place to go for model builders, optimizers, and developers to learn to unlock the full performance of Google Cloud TPUs. Read more in this </span><a href=\"https://developers.googleblog.com/unlocking-the-power-of-the-tpu-stack-introducing-our-new-developer-hub/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New product: </strong><span style=\"vertical-align: baseline;\">Scale your AI workloads with the new </span><a href=\"https://discuss.google.dev/t/stop-training-blind-scaling-ai-with-the-new-opentelemetry-based-tpu-ai-telemetry-collector-agent/375210\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenTelemetry-Based TPU AI Telemetry Collector Agent</span></a><span style=\"vertical-align: baseline;\">. For the first time, you can route high-fidelity TPU hardware telemetry to Google Cloud Monitoring, Google Managed Prometheus, or your own self-hosted Grafana stack.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Practitioner guides and how-tos</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Learn how to build high availability into an AI inference workload running on GKE Inference Gateway with TPUs, Cloud Storage FUSE and Dynamic Resource Allocation (DRA). This </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/experimenting-with-tpus-gke-managed-dranet-and-multi-cluster-inference-gateway?_gl=1*jj3plw*_ga*OTAxNzc0MzU1LjE3ODIyMjAxNDk.*_ga_4LYFWVHBEB*czE3ODI3NTc3NzAkbzkkZzEkdDE3ODI3NTg2MDEkajYwJGwwJGgw&amp;e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\"> provides an overview, or you can get all the technical details in the </span><a href=\"https://codelabs.developers.google.com/codelabs/gke-inference-gateway-multi-cluster-tpus-dranet#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">hands-on codelab</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How-to guide:</strong><span style=\"vertical-align: baseline;\"> Did you know you can connect your AI agents to unstructured data in </span><a href=\"https://cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> via Model Context Protocol (MCP)? In </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/build-ai-agents-faster-with-gcs-google-cloud-storage-mcp-server\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this blog</span></a><span style=\"vertical-align: baseline;\">, learn about why would want to do that from three customer examples, then how to do it, choosing either a fully managed service, or a self-managed local server for more customization and control. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep-dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Report: </strong><span style=\"vertical-align: baseline;\">According to an independent benchmark report, </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> outperforms the next leading managed Kubernetes service with 15.7% higher throughput, 92.8% shorter wait times, and 62.6% lower inter-token latency. This performance can be attributed to its use of prefix caching, which optimizes LLM performance by storing the KV cache (activation states) of long, repetitive prompt prefixes. Learn more in the </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-inference-gateway-prefix-caching-accelerates-ai-inference?e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">A closer look at </span><a href=\"https://discuss.google.dev/t/accelerate-tpu-model-loading-while-saving-ram-on-gke/374835\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the cold start problem, this time for TPUs and GKE</span></a><span style=\"vertical-align: baseline;\">, and how the Run:ai Model Streamer can help change the dynamic. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Leveraging GKE, BigQuery, Cloud SQL, and Gemini Enterprise Agent Platform, </span><a href=\"https://www.youtube.com/watch?v=x36QJ-QKRGg\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pager Health is eliminating operational fragmentation to deliver a simplified, personalized U.S. healthcare experience</span></a><span style=\"vertical-align: baseline;\"> that transforms lives.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Trustpilot, the customer review platform, built a high-volume streaming pipeline using fine-tuned Gemma models with Dataflow and Gemini Enterprise Agent Platform running on cost-optimized A2 VMs using A100 GPUs, as well as optimized version of vLLM maintained by Gemini Enterprise Agent Platform.</span></p>\n</li>\n</ul>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">May 2026</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Product, technology and tool updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product update:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> is now generally available.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New open-source project:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> is a new open-source project aimed at continuing to push the limits of agentic infrastructure density</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New feature:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://ai.google.dev/edge/ai-edge-portal\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Edge Portal</span></a><span style=\"vertical-align: baseline;\">, a solution for testing and benchmarking on-device machine learning (ML) at scale, now supports benchmarking and debugging on-device LLMs. Read more </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/benchmark-llms-on-device-with-ai-edge-portal?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Product deep dive: </strong><span style=\"vertical-align: baseline;\">We went </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/cloud-storage-rapid-turbocharges-object-storage-for-ai-analytics?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">into depth about Cloud Storage Rapid</span></a><span style=\"vertical-align: baseline;\">, a new family of high-performance storage offerings for AI workloads. At launch, offerings include Rapid Bucket (formerly Rapid Storage), a high-performance zonal object storage offering, and Rapid Cache (formerly Anywhere Cache), which accelerates reads on-demand and colocates compute and data for workloads in existing buckets. </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Research, reports and deep dives</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">Google Global Infrastructure VP Bikash Koley and Engineering Fellow Arjun Singh provide a high-level overview of </span><a href=\"https://cloud.google.com/blog/products/networking/data-center-and-global-networks-built-for-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the challenges that AI workloads pose to network infrastructure</span></a><span style=\"vertical-align: baseline;\">, and discuss the deep enhancements we’ve made to our data center fabrics, WAN, and global networks to better support them. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Architecture deep dive: </strong><span style=\"vertical-align: baseline;\">We unveiled a </span><a href=\"https://cloud.google.com/blog/products/compute/cluster-reliability-for-trillion-parameter-models-on-tpus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new cluster-level reliability model</span></a><span style=\"vertical-align: baseline;\"> for developing frontier AI models on TPUs, ditching instance-level reliability </span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Customer and partner updates</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer win:</strong><span style=\"vertical-align: baseline;\"> Visual media provider </span><a href=\"https://cloud.google.com/blog/products/infrastructure/how-imgix-processes-8-billion-images-daily-with-g4-vms-powered-by-nvidia-blackwell?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Imgix serves more than 8 billion images and videos from AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> equipped with G4 VMs powered by NVIDIA RTX PRO 6000 Blackwell GPUs.</span></p>\n</li>\n</ul></div>"
