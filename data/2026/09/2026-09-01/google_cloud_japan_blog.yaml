  "1e1c3ee89429e42cc5e6bea2907dca8b":
    "id": "1e1c3ee89429e42cc5e6bea2907dca8b"
    "title": "Google Antigravity の提供対象を企業のお客様まで拡大"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers/"
    "published": "2026-09-01 11:00:00"
    "fetched": "2026-09-01 15:01:34"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 21 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">5 月の I/O で Gemini Enterprise Agent Platform の Google Antigravity を発表して以来、お客様から有益なフィードバックをいただいています。デベロッパーは、さまざまなサーフェスでコーディング エージェントに簡単にアクセスしたいと考えています。企業ガバナンス チームは、セキュリティ管理とライセンス管理を求めています。財務チームは、プリペイド トークンが未使用のままになることがないよう、使用できるトークンをプールしたいと考えています。このたび、いずれのチームの要望にも対応できるようになりました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Antigravity は、</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">対象となる</span></a><span style=\"vertical-align: baseline;\"> Gemini Enterprise app サブスクリプションの一部として提供されます。これには、すぐに利用できる管理機能と支出管理機能が含まれます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">新しい </span><a href=\"https://antigravity.google/blog/antigravity-ide-extensions\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IDE 拡張機能</span></a><span style=\"vertical-align: baseline;\">により、デベロッパーは </span><a href=\"https://marketplace.visualstudio.com/items?itemName=Google.google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VS Code</span></a><span style=\"vertical-align: baseline;\"> などの任意の IDE で Antigravity を使用できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">AI デベロッパー ツールとエンタープライズ グレードの管理機能を 1 つのサブスクリプションに統合</strong></h4>\n<p><span style=\"vertical-align: baseline;\">デベロッパーに高度なエージェント ツールを提供するために、アドオン ライセンス、請求書、課金コンソール、セキュリティ設定を個別に管理する必要はありません。Gemini Enterprise サブスクリプションに含まれる AI デベロッパー ツールを使用すると、管理者は、</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">対象となる</span></a><span style=\"vertical-align: baseline;\"> Gemini Enterprise Standard、Plus、Standard Emerging Market のライセンスを持つユーザーに対して Antigravity と </span><a href=\"http://d.android.com/gemini-in-android\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</span></a><span style=\"vertical-align: baseline;\"> を簡単に</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">有効化</span></a><span style=\"vertical-align: baseline;\">でき、Gemini Enterprise 管理コンソールに統合された費用、セキュリティ、オブザーバビリティ、使用状況の指標を使用して、完全なガバナンスを維持できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">支出を管理しながら、デベロッパーの障害を取り除く</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise の柔軟な課金および費用管理ツールにより、費用を管理しながら、デベロッパーに必要なリソースを確保できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細な費用上限</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> 管理者は、課金コンソールでプロジェクト レベルの月間予算上限を直接設定できます。ユーザーごと、チームごとの追加の管理機能は、今年中にリリースされる予定です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/quotas-and-overages\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">割り当てのプール</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">トークンの共有プールにより、需要の高いチームに柔軟性がもたらされ、組織全体で購入した割り当てが使用されずに残ることを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/configure-overages\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">超過分の有効化</strong></a><span style=\"vertical-align: baseline;\">: プールされた割り当てを使い切ってもデベロッパーのワークフローを継続できるように、管理者は月額費用の上限を設定して超過分を有効にすることで、超過分の使用量を標準の使用量ベースの料金にスムーズに移行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-metrics\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">使用状況の指標</strong></a><span style=\"vertical-align: baseline;\">: 使用状況を一元的に追跡することで、トークンの使用量、API 呼び出し、デベロッパーのアクティビティを可視化し、組織が AI への投資を継続的に最適化できるようにします。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Gif 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Gif_1_vK8C2Nf.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">組み込みのプライバシーとセキュリティの機能で組織のコードとデータを保護</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise サブスクリプションでは、Google Antigravity が Google Cloud の標準的なセキュリティとコンプライアンスの保護の対象となります。管理者と IT チームは、単一のコンソールから、ワークスペースへのアクセスに関する明確な境界を設定し、完全な監査ロギングを有効にして、データ プライバシーを適用できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">構成可能なセキュリティ ポリシー</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> ワークスペースのサンドボックス化、ブラウザと MCP サーバーへのアクセスなど、セキュリティとコンプライアンスの管理を適用して、AI エージェントが承認されたエンタープライズ環境内で安全に動作するようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">一元的な監査ロギング</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> 1 回の切り替えで包括的な監査ロギングを有効にし、プロンプト、エージェントの回答、メタデータをキャプチャしてコンプライアンス レポートを作成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/privacy?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">データ プライバシー</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Google Cloud の利用規約に基づいてデータの所有権を維持し、すべてのエージェント アクティビティが安全なクラウド境界内で厳密に実行されるようにします。</span></p>\n</li>\n</ul></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=CJnchBVryCQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Antigravity in Gemini Enterprise - AI Developer Tools Settings</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=CJnchBVryCQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">チームが好む開発環境にエージェント コーディングを直接導入</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このたび、デベロッパーは、</span><a href=\"https://antigravity.google/blog/antigravity-ide-extensions\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">新しい IDE 拡張機能</span></a><span style=\"vertical-align: baseline;\">、Antigravity 2.0 デスクトップ アプリ、Antigravity CLI を介して、</span><a href=\"https://marketplace.visualstudio.com/items?itemName=Google.google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visual Studio Code</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://marketplace.visualstudio.com/items?itemName=Google.GoogleAntigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visual Studio</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）、Jetbrains（プレビュー版）、Zed IDE（プレビュー版）など、すでに使い慣れているサーフェスで Antigravity を使用できるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">管理者は、すべてのサーフェスで、企業 ID 標準を適用でき、また Workforce Identity 連携（WIF）とアプリケーションのデフォルト認証情報（ADC）のネイティブ サポートにより、技術チームのセットアップの煩雑さを解消できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"VSCode IDE Plugin\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/VSCode_IDE_Plugin_gif_v3_720p.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AGY IDE 拡張機能のデモ</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">お客様の声</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Antigravity は、迅速なコード生成からエンドツーエンドのタスク自動化まで、Google Cloud の安定性、ガバナンス、スケールに支えられた最先端の AI 開発の勢いをエンジニアリング チームに与えています。大手企業のお客様とパートナー様が、本番環境で測定可能な成果をどのように実現しているかをご紹介します。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Accenture では、Gemini Enterprise に Antigravity をデプロイすることで、Google Cloud の安全で信頼できる基盤上で、Google DeepMind の優れたテクノロジーをエンジニアに提供しています。運用の複雑さを取り除くことで、当社のチームは開発スピードとエンタープライズ グレードのガバナンスのどちらかを選ぶ必要がなくなり、お客様に迅速なエンジニアリングと革新的な価値を提供できるようになりました。」- </span><strong style=\"vertical-align: baseline;\">Accenture Google ビジネス グループ</strong><span style=\"vertical-align: baseline;\">、グローバル プラクティス リード、Chetna Sehgal 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「AirAsia とグループ全体で、従業員の能力強化に力を入れています。Antigravity 2.0 を使用して、高性能な Gemini モデルを日々のワークフローに直接組み込むことで、まさにそれを実現しています。当社は、ソフトウェア エンジニアリングから、財務、マーケティング、法務、人事などに至るまで、全従業員に最先端の AI 機能を提供しています。これにより、デベロッパーと重要なバックオフィス チームの両方が、これまでにないペースでイノベーションを起こし、全体的に時間を節約できるようになりました。」- </span><strong style=\"vertical-align: baseline;\">AirAsia Next</strong><span style=\"vertical-align: baseline;\">、CTO、Nikunj Shanti 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「企業は AI の試験運用から一歩進んで、測定可能なビジネス成果を期待しています。Gemini Enterprise と、Antigravity 2.0 や Antigravity CLI などの次世代デベロッパー ツールにより、エージェント型 AI、特に Gemini モデルの高度な推論機能をソフトウェア デリバリー ワークフローに直接組み込む大きな機会が生まれています。これは生産性向上にとどまらず、意思決定の迅速化、コード品質の向上、技術的負債の削減を大規模に実現します。特に際立っているのは、これらの機能が、コードの記述から成果のオーケストレーションへとチームを進化させ、ソフトウェア開発ライフサイクルのあらゆるフェーズを強化しながら、安全かつ責任を持ってイノベーションを拡大するのに役立っている点です。」- </span><strong style=\"vertical-align: baseline;\">CGI</strong><span style=\"vertical-align: baseline;\">、アジア太平洋グローバル デリバリー センター オブ エクセレンス担当プレジデント、Rakesh Aerath 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「デベロッパーのワークフローはそれぞれ異なります。エンジニアがエージェント型 AI に適応するのではなく、エージェント型 AI がはエンジニアに適応するべきです。Google Antigravity は、デベロッパーが好む IDE、デスクトップ アプリ、CLI でサポートされているため、Cognizant はエージェント型エンジニアリングをグローバル デリバリー センター全体にシームレスに組み込むことができます。これにより、当社のチームは好みのサーフェスを自由に選択しながら、お客様に高速で安全なソフトウェアを提供できます。」- </span><strong style=\"vertical-align: baseline;\">Cognizant India</strong><span style=\"vertical-align: baseline;\">、グローバル オペレーション担当プレジデント兼会長兼マネージング ディレクター、Rajesh Varrier 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「Antigravity は、Datamatics の AI ファースト戦略を推進するうえで重要な役割を果たしています。この数か月間、当社のチームは Antigravity を使用して、複数のアプリケーションを迅速に構築、デプロイし、ソリューション開発を加速させ、AI をコアビジネス プロセスに組み込んできました。AI Impact Hub から分析ソリューションやセールス イネーブルメント ソリューションまで、Antigravity は当社が試験運用段階から実際の実行段階へと移行するうえで役立ちました。その結果、測定可能なビジネス成果を達成し、チームがより迅速かつ大規模にイノベーションを起こせるようになりました。」- </span><strong style=\"vertical-align: baseline;\">Datamatics</strong><span style=\"vertical-align: baseline;\">、情報システム グループ（ISG）担当バイス プレジデント、Vijay Venkatachalam 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「Google Antigravity の自律機能を Gemini Enterprise の開発環境に直接組み込むことで、社内チームと現場配置エンジニアリング チームが複雑なタスクを自動化できるようになりました。プラットフォームの新しい FinOps とガバナンス管理に支えられ、当社のチームは、価値が高く、安全で、費用対効果の高い成果をお客様のために大規模にオーケストレートすることに自信を持って集中できます。」— </span><strong style=\"vertical-align: baseline;\">Deloitte</strong><span style=\"vertical-align: baseline;\">、米国 AI / エンジニアリング戦略およびサービス リーダー、Faruk Muratovic 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「Wipro は Antigravity を採用したことで、AI 主導のソフトウェア開発ライフサイクルの最先端に立っています。Antigravity 2.0、CLI、新しい IDE 拡張機能を、シームレスなデベロッパー エクスペリエンスおよび優れたコード精度と組み合わせることは、当社の AI ファーストのエンジニアリング戦略に自然に適合します。Google Cloud と連携することで、ソフトウェア デリバリーを加速し、グローバル企業のお客様に次世代の価値を提供できます。」- </span><strong style=\"vertical-align: baseline;\">Wipro</strong><span style=\"vertical-align: baseline;\">、Google パートナーシップ担当バイス プレジデント兼グローバル責任者、Debashish Ghosh 氏</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini Enterprise で Antigravity を使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise の Google Antigravity は、</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">対象となる</span></a><span style=\"vertical-align: baseline;\"> Gemini Enterprise Standard、Plus、Standard Emerging Market のライセンスをお持ちのお客様に、本日よりご利用いただけます。また、まもなく、より幅広いお客様にご利用いただけるようになる予定です。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">管理者の場合:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">企業向けのセットアップ ガイド</span></a><span style=\"vertical-align: baseline;\">にアクセスして、Google Antigravity と Android Studio の AI デベロッパー ツールを有効にすることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デベロッパーの場合: </strong><span style=\"vertical-align: baseline;\">Antigravity 2.0、Antigravity CLI、または Antigravity IDE 拡張機能を介したお好みの IDE で</span><a href=\"https://antigravity.google/docs/home\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">構築</span></a><span style=\"vertical-align: baseline;\">を開始できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">エンジニアリング担当シニア ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Scott Densmore</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Damith Karunaratne</strong></p></div>"
