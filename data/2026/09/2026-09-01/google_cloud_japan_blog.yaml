    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/bigquery-performance-optimizations?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">現代のデータ環境において、クエリ パフォーマンスのチューニングやシステムのコスト パフォーマンスの管理は、大きな課題になっています。特に、エージェント型ワークロードの増加に伴い、その難易度はさらに高まっています。データの量、多様性、速度が爆発的に増加し続けるなか、クエリ実行プランの分析やスキーマの調整、クエリヒントの追加といった作業は、経験豊富な開発者や DBA にとっても終わりのないルーチンワークとなり、ビジネスの機動力を削いでいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">パフォーマンス チューニングは一般的な手法ですが、最新のデータ プラットフォームに求められるのは、それだけではありません。データ プラットフォームが「インテリジェンス システム」から「アクション システム」へと進化し、分析ワークロードの主体が「人間による 1 日数回の実行」から「無数のエージェントによる毎分数千回の実行」へと移行するなか、従来の手動によるクエリ調整はもはや限界を迎えています。ユーザーのアクションに応じてエージェントやアプリケーションがクエリを自動生成するようになると、手動での最適化は事実上不可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">BigQuery は、データ ウェアハウスからエージェント型 AI 時代の主要なエンジンへと進化しました。ストレージとコンピューティングを真に分離した独自のアーキテクチャ、サーバーレス処理、きめ細かいコンピューティング管理を基盤に、BigQuery は自律的なクエリ処理の限界を押し広げ続けています。Google の究極の目標は、クエリ、スキーマ、データ、ワークロードを問わず、人間とエージェントの双方が手間をかけずに最適なコスト パフォーマンスを享受できる、自律型クエリ プロセッサを実現することです。2025 年だけでも、クエリのパフォーマンスが最大 35% 向上し、クエリ処理コスト（スロット使用量）が最大 40% 削減されました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_1 - Last12MonthsOfPerfImprovements\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_-_Last12MonthsOfPerfImprovements.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1. 業界標準のベンチマークに基づく、2025 年の BigQuery コスト パフォーマンス向上の概要。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">以下は、パフォーマンスと総所有コスト（TCO）の改善に貢献する主なイノベーションの一部です。これには、回帰に対する組み込みのガードレールも含まれます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">BigQuery の自己学習エンジン: 履歴ベースの最適化（HBO）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">BigQuery の自律型クエリ プロセッサの基盤となる機能の一つが、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/history-based-optimizations?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">履歴ベースの最適化</span></a><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">従来のクエリ オプティマイザーは、静的な統計情報やメタデータ、カーディナリティ推定に依存しています。そのため、非常に複雑な複数テーブルの結合や、急速に増加または変化するデータに直面すると、その精度が著しく低下することがあります。これらに対応することは、管理者にとって極めて重要な業務であり、効果的かつ効率的な運用には、ワークロードごとに自動化をきめ細やかに調整する必要があります。すべてが最新かつ正確であっても、自然なデータスキューや利用可能なコンピューティング リソースの変化により、クエリの動作が大きく異なることがあります。履歴ベースの最適化は、これまでのパラダイムを転換します。クエリ実行中にプランやリソース割り当てを変更できる BigQuery の既存の適応型クエリ実行に加え、過去の実行から学習し、将来の実行に向けてさらなる最適化を自動的に適用します。</span></p>\n<p><span style=\"vertical-align: baseline;\">過去のクエリのランタイム統計を追跡して、どの最適化が有益だったかを「記憶」し、それらを適用し続けます。また、以前のミスから学習して、同じミスを繰り返さないようにします。同じまたは類似のクエリが再度実行されると、BigQuery は効果が実証されている最適化手法を自動的に適用し、回帰を引き起こす可能性のある手法を回避します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ユーザーの操作が不要、安全ガードレールが標準実装</strong></h4>\n<p><span style=\"vertical-align: baseline;\">履歴ベースの最適化では、アプリケーションの書き換え、SQL の修正、スキーマの変更は必要ありません。ユーザーは文字どおり何もする必要がなく、定期的なダッシュボード、ELT パイプライン、エージェント ワークロード、事業部門モジュールがより高速に実行されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">重要なのは、これが安全ガードレールを標準実装した、自己メンテナンス型、自己改善型のクローズドループ システムであるということです。履歴ベースの最適化は、パフォーマンスの向上が確実に見込まれる場合にのみ適用されます。もし最適化の判断を誤った場合は、どうなるでしょうか？この機能には本質的に自己修正能力が備わっています。最適化が適用されると、システムが結果を測定します。期待される改善が確認された場合、最適化が承認されます。パフォーマンスが大幅に向上しない場合、またはさらに悪いことに、パフォーマンスが低下したり、失敗につながったりした場合、その最適化は直ちに拒否され、取り消され、そのクエリに対して再度試行されることはありません。これにはデータスキューの検出も含まれます。これにより、パラメータ依存のプランを持つクエリにおいて、WHERE 句などのパラメータを一つ変更しただけでパフォーマンスが大幅に低下する、といった事態を防ぐことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">その結果、実行時間の短縮とスロットの削減が実現します。ある企業のお客様は、P90 の実行時間が最大 50% 短縮され、スロット使用量が最大 15% 削減されたと報告しています。これにより、コスト パフォーマンスが大幅に向上し、回帰も発生しなくなりました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_2 - HBO\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_-_HBO.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 2. 企業のお客様から報告された、履歴ベースの最適化によるパフォーマンス改善の一例。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">BigQuery 実行エンジンに新しいトリックを教える: 高度なランタイム</strong></h4>\n<p><span style=\"vertical-align: baseline;\">BigQuery の自律型機能は、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/advanced-runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery の高度なランタイム</span></a><span style=\"vertical-align: baseline;\">によって、実行レイヤの深部にまで及びます。このエンジンのアップグレードにより、手動での細かなチューニングを一切行うことなく、クエリに最適な物理実行パスが自動的に決定されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. ベクトル化の強化</strong></p>\n<p><span style=\"vertical-align: baseline;\">ベクトル化実行自体は新しいコンセプトではありませんが、BigQuery は単一命令複数データ（SIMD）命令による最新のプロセッサ処理効率を活用することで、その実装を強化しました。エンジンは、重複する計算を回避する機会を自律的に特定し、辞書とランレングス圧縮でデータをネイティブに処理します。最先端の並列アルゴリズムと組み合わせ、対象となるクエリステージに適用することで、高速化の機会を増やします。効果: 完全に自動化されたプロセスを通じて、対象となるクエリを最大 10 倍まで安全に高速化し、全体のスロット時間を最大 40% 削減することに成功しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_3 - AR-EV\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3_-_AR-EV.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 3. 高度なランタイム - ベクトル化の強化</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">2. 短いクエリの最適化</strong></p>\n<p><span style=\"vertical-align: baseline;\">高い同時実行性と低レイテンシが求められる BI ダッシュボードや、1 秒未満のレイテンシを必要とし、数千件のクエリを生成するエージェント型アプリケーションの場合、分散処理に伴うオーバーヘッドがボトルネックになる可能性があります。BigQuery は、同時実行されている他のクエリに影響を与えることなく、対象となる「短い」クエリを自律的に高速化できるようになりました。ステージ数を減らしてデータ シャッフルを減らすことで、BigQuery はクエリのレイテンシとリソース効率を全体的に向上させます。BigQuery は、スケーラブルな大規模並列処理（MPP）分散データベースにおいて、効率的な対称型マルチプロセッシング（SMP）クエリパスを透過的に実現しています。効果: 短いクエリのスロット使用量が最大 10 分の 1 に減少し、P99 のクエリ レイテンシが 1 秒未満になります。各クエリのスロット占有時間が短縮されることで、一部のお客様のワークロードではスループットが最大 3 倍向上しました。これらはすべて、エンドユーザーが一切意識することなく、透過的に実現されます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_4_AR-SQO\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_4_AR-SQO_GGNgpTD.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 4. 高度なランタイム - 短いクエリの最適化</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">データ形式を問わない共通のメリット</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Apache Iceberg のようなオープン テーブル形式を使用してオープン レイクハウス アーキテクチャを採用する場合でも、自律的なパフォーマンスを犠牲にする必要はないと Google は考えています。BigQuery のパフォーマンス向上は、基盤となるテーブルやデータ形式に関係なく同じように機能します。すなわち、BigQuery のネイティブ </span><a href=\"https://cloud.google.com/blog/products/bigquery/inside-capacitor-bigquerys-next-generation-columnar-storage-format\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Capacitor ストレージ形式</span></a><span style=\"vertical-align: baseline;\">を使用する場合でも、基盤となるデータが Parquet 形式の Iceberg テーブルを使用する場合でも、同じメリットが得られるということです。</span></p>\n<p><span style=\"vertical-align: baseline;\">フィルタの自動プッシュダウン、</span><a href=\"https://cloud.google.com/blog/products/data-analytics/understanding-the-bigquery--column-metadata-cmeta-index/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">列メタデータ インデックス（CMETA）</span></a><span style=\"vertical-align: baseline;\">の枝刈り、ページスキップと非同期読み取りによる I/O レイヤの最適化、同じ拡張ベクトル化の採用など、オープン形式でもネイティブ テーブルと変わらない自動高速化の恩恵を受けられます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_5 - OSS-comp\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_5v2_-_OSS-comp.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 5. レイクハウス Iceberg テーブルでの BigQuery のパフォーマンスとコストを、TPC-DS（10 TB）から派生したベンチマークを使用して、一般的なオープンソースの分散 SQL クエリエンジンに対して社内でテスト</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">流動的なスケーリング: 実際の使用量のみを支払うオートスケーラー</strong></h4>\n<p><span style=\"vertical-align: baseline;\">BigQuery のコンピューティング モデルは、ノードやクラスタのスライスではなく、消費されたスロット秒に直接結びついているため、自律的なパフォーマンスの向上は直接的なコスト削減につながります。流動的なスケーリングで強化された </span><a href=\"https://docs.cloud.google.com/bigquery/docs/slots#slot-autoscaling\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery オートスケーラー</span></a><span style=\"vertical-align: baseline;\">を使用すると、コストとパフォーマンスのトレードオフを解消した優れた自動スケーリング モデルで、変動の大きいワークロードを柔軟に組み合わせて実行できます。BigQuery の流動的なスケーリングにより、消費されたコンピューティング リソース（スロット）に対して厳密な秒単位の課金が可能になり、自動スケーリング ワークロードのコストが平均で最大 34% 削減されます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_6 -FluidScaling_stating\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Figure_6_-FluidScaling_stating_vw77BjY.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 6. 流動的なスケーリングを可能にする拡張オートスケーラー</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">流動的なスケーリングがもたらすコストパフォーマンスのメリットについて、1 日 1 PB 以上のデータを処理し、月間 3 兆件を超える入札を管理する大手アドテック企業 RISE の CEO / 共同創業者である Chen Shalit 氏は次のように述べています。</span><span style=\"font-style: italic; vertical-align: baseline;\">「広告の世界は競争が激しく、1 セントも無駄にできません。BigQuery の流動的なスケーリングにより、インフラストラクチャのコストが 25% 削減され、スロット消費をスケールしてワークフロー全体を加速できるようになりました。モデルの結果をより迅速に提供し、1 時間あたりのデータ処理スループットを向上させることで、お客様に可能な限り最新のデータを提供できるようになりました。」</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント時代の未来に向けた基盤</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これらの自律型機能は、現在のビジネス インテリジェンス ダッシュボードや分析クエリの実行を高速化するだけでなく、最新のデータ プラットフォームの未来を支える基盤となります。AI や ML の導入が急速に進むなか、組織のワークロードはエージェント型へと移行しつつあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントによるデータの扱いは、人間とは根本的に異なります。クエリのレイテンシや同時実行数（QPS）に対する要件水準は、人間のユーザーが生成するものよりも桁違いに厳しく、人間を基準に設計された従来の分析プラットフォームの限界を超えています。自律型エージェントがリアルタイムの意思決定を行うために、1 秒間に数千もの異なる秒間クエリを発行するような状況では、人間参加型のクエリ チューニングなど到底不可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">自己チューニングや自己学習システムといった BigQuery の差別化された機能には、回帰に対する組み込みの安全ガードレールが組み込まれています。こうした自律性が基準となることで、インフラストラクチャの手動管理、事後対応的なクエリの最適化、急増するコンピューティング費用の抑制といった作業に、貴重なエンジニアリング サイクルを浪費する必要がなくなります。その分、高度なエージェント アプリケーションでユーザーに最高のエクスペリエンスを提供するという、真に価値のある業務に時間と労力を集中させることができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">BigQuery が TCO に与える総合的な効果: 高速化とコスト パフォーマンスのさらなる向上</strong></h4>\n<p><span style=\"vertical-align: baseline;\">履歴ベースの自己学習型オプティマイザーと、高度にスケーラブルなメタデータ プラットフォーム（CMETA）でサポートされる自動スケーリングの高度なランタイム エンジンを組み合わせることで、パフォーマンスと総所有コスト（TCO）に大きな効果がもたらされます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google が目指しているのは、ユーザーの手を煩わせることなく BigQuery がクエリを自動的かつ安全に最適化することです。それにより、ユーザーが「出勤するだけで、BigQuery が前日よりも速くなっている」と感じられるような体験を提供したいと考えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">データスキューや古い統計情報によるパフォーマンス低下の心配は無用です。どのクエリにどのプランガイドが最適か、時間帯や時期（日次、月次）に合わせて頭を悩ませる必要はなくなります。低価格なスポット インスタンスが不足して予算が足りなくなるのでは、と気をもむ必要はもうありません。組織の目標に集中するだけで、あとは BigQuery データ プラットフォームがエージェントと人間のワークロードの両方に最適なコスト パフォーマンスを自律的に提供します。特別な操作や設定は一切不要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">BigQuery のデータと AI 機能の詳細を確認し、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">無料トライアルを開始</span></a><span style=\"vertical-align: baseline;\">しましょう。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Joe Yong</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Manan Goel</strong></p></div>"
  "299749bd0f799346a3fff8b22ca6293a":
    "id": "299749bd0f799346a3fff8b22ca6293a"
    "title": "Google Cloud の Lakehouse ランタイム カタログを使用して Apache Hive をモダナイズする"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/lakehouse-runtime-catalog-helps-modernize-apache-hive/"
    "published": "2026-09-01 11:30:00"
    "fetched": "2026-09-01 21:21:38"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 20 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/lakehouse-runtime-catalog-helps-modernize-apache-hive?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Apache Hive メタストア（HMS）は、10 年以上にわたり、ビッグデータ分析における事実上のメタデータ管理基盤として機能してきました。Hadoop クラスタ上でも、MySQL や PostgreSQL を基盤とする自己管理型の Compute Engine VM 上でも、HMS は中央スキーマ レジストリとして機能し、Apache Spark、Presto、Hive が未加工の </span><code style=\"vertical-align: baseline;\">.parquet</code><span style=\"vertical-align: baseline;\"> ファイルや </span><code style=\"vertical-align: baseline;\">.orc</code><span style=\"vertical-align: baseline;\"> ファイルをクエリできるようにしてきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、企業のデータ アーキテクチャがペタバイト規模に拡大し、複数のクエリエンジン（Google Cloud Managed Service for Apache Spark、BigQuery、Trino など）を横断的に利用するようになると、従来の Hive メタストアが運用上の深刻なボトルネックとして顕在化するようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このブログ記事では、エージェント規模の最新のクラウド環境において、従来のメタストアがなぜ課題を抱えているのかを探り、</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/biglake-metastore-now-supports-iceberg-rest-catalog?e=a&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">昨年発表した</span></a><span style=\"vertical-align: baseline;\">サーバーレスの Google Cloud Lakehouse ランタイム カタログが、その解決にどのように役立つかを紹介します。このカタログは、オープンな Apache Iceberg REST カタログ仕様に基づいて構築されており、本番環境の Hive テーブルをわずか数分で即座に実行可能な形で移行できる、データコピー不要の移行ソリューションです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">従来の Hive メタストアの課題</strong></h4>\n<p><span style=\"vertical-align: baseline;\">本番環境で大規模な分析を実行しているデータ エンジニアやインフラストラクチャ責任者の方々と話をすると、スタンドアロンの Hive メタストアには共通して 3 つの課題があることが分かります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">アーキテクチャとスケーリングのボトルネック</strong><span style=\"vertical-align: baseline;\">スタンドアロンの HMS デプロイでは、テーブル スキーマ、パーティション、保存場所を追跡するために、リレーショナル データベースのバックエンド（MySQL や Postgres など）に依存しています。データレイクが数十万ものパーティション分割テーブルにまで拡大すると、パーティションのプルーニングや大量のリスト処理が発生し、このことがリレーショナル データベースにおける深刻なパフォーマンスのボトルネックを引き起こします。パーティション メタデータを要求する複雑な Spark ジョブが実行されると、メタストアの CPU 使用率が 100% に達し、クラスタ全体のクエリ処理に遅延が生じたり、メモリ不足（OOM）が発生したりする可能性があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">サイロ化された ID とセキュリティ ガバナンス</strong><span style=\"vertical-align: baseline;\">従来のメタストアは、境界ベースの Hadoop セキュリティ モデルに基づいて設計されています。そのため、Apache Spark のコンピューティング ジョブと BigQuery のようなエンタープライズ SQL エンジンの両方で、テーブルレベルのアクセス制御リスト（ACL）などの最新のきめ細かいデータ ガバナンスを適用するには、2 つの異なるコントロール プレーンに分断された、重複するセキュリティ ポリシーを維持する必要があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">運用上のオーバーヘッドと総所有コスト（TCO）</strong><span style=\"vertical-align: baseline;\">高可用性 MySQL / Postgres インスタンスの管理、HMS デーモンのパッチ適用、JDBC 接続プールの調整、アイドル状態でも課金されるインスタンス ベースのメタストア サーバーの運用などは、データ プラットフォーム チームに大きな負荷を強いるものであり、本来であればエージェント向けの高価値なデータ プロダクトの開発に充てるべき、データ プラットフォーム チームの貴重な時間を奪っています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">解決策: Lakehouse ランタイム カタログ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">既存のペタバイト規模のストレージ ペイロードを書き換えることなく、こうしたアーキテクチャ上のボトルネックを解消するために、Google は Iceberg REST カタログと Hive カタログをサポートする Lakehouse ランタイム カタログを構築しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログは、高可用性を備えた完全にサーバーレスな統合メタデータ レジストリであり、従来の Hive / Parquet テーブルと、Apache Iceberg などの最新のオープン テーブル形式の両方をサポートするようにゼロから設計されています。</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Lakehouse ランタイム カタログでは、Apache Iceberg REST カタログ仕様をネイティブに実装することで</span><strong style=\"vertical-align: baseline;\">、</strong><span style=\"vertical-align: baseline;\">メタデータ検出をコンピューティング エンジンから分離しています。カタログとコンピューティング エンジンをこのように分離することで、複数の Iceberg 互換エンジンがデータコピー不要で同じデータにアクセスできるようになり、その結果、顧客側でデータのコピーを複数維持する必要性が軽減され、ワークロードをより早く本番環境に移行できるようになります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_i5lkwYb.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このアプローチには、アーキテクチャ上のメリットが数多くあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチエンジンの相互運用性</strong><span style=\"vertical-align: baseline;\">: 登録されたテーブルは、標準の REST インターフェースを介して、Google Cloud Managed Spark、BigQuery、オープンソース エンジンで即座に検出やクエリが可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープン API</strong><span style=\"vertical-align: baseline;\">: Iceberg REST カタログと Hive カタログをサポートしているため、異なるチームがそれぞれ好みの分析ツールを使用しながら、単一の統合データセットを共有できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データコピー不要</strong><span style=\"vertical-align: baseline;\">: テーブル定義は、Google Cloud Storage の既存のデータを直接参照します。基盤となるデータの移動、書き換え、複製を行う必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI を活用したガバナンス、セキュリティ、信頼できるコンテキスト</strong><span style=\"vertical-align: baseline;\">: Lakehouse ランタイム カタログは、</span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> および </span><a href=\"https://www.cloud-iam.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud IAM</span></a><span style=\"vertical-align: baseline;\"> と直接統合されているため、エージェント用の信頼できるコンテキストや、すべてのコンピューティング エンジンに一貫して適用されるテーブルレベルのセキュリティを定義できます。さらに、</span><strong style=\"vertical-align: baseline;\">認証情報ベンディングなどの主要な認証メカニズム</strong><span style=\"vertical-align: baseline;\">もサポートしています。これにより、基盤となる Cloud Storage バケット内のファイルに直接アクセスすることなく、テーブルにアクセスできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンタープライズ対応、スケーリング、TCO 削減</strong><span style=\"vertical-align: baseline;\">: Google の地球規模のインフラストラクチャと Spanner を基盤としたメタデータは、データに合わせてスケールできます。Cloud Storage のデュアルリージョン バケットとマルチリージョン バケットのサポートにより、フェイルオーバーのユースケースが可能になります。また、サーバーレスな NoOps 環境と、あらゆるワークロード サイズに対応可能なスケーラビリティにより TCO を削減します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">従来の Hive メタストアからゼロコピーで移行</strong></h4>\n<p><span style=\"vertical-align: baseline;\">実際の運用においてスムーズなカットオーバーが可能であることを示すために、従来の自己管理型 Hive メタストアを Google Cloud Lakehouse にモダナイズできる機能を提供しています。この機能は、従来の Hive メタストアに直接接続し、外部テーブルの定義とパーティション マップを抽出して、サーバーレスの Lakehouse カタログに直接登録します。登録後は、Google Managed Spark、BigQuery、Gemini の会話型分析エージェントでデータを利用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Lakehouse にモダナイズし、主要なエージェント ジャーニーで即座にデータを活用できるようにしましょう。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_ykGR7QL.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">データ アーキテクチャをモダナイズする準備はできていますか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">従来の Hive メタストアから Google Cloud の </span><a href=\"https://cloud.google.com/products/lakehouse?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse</span></a><span style=\"vertical-align: baseline;\"> にモダナイズすることで、分析エンジンやエージェント間のデータサイロを最小限に抑え、マルチエンジンのガバナンスを統合し、信頼できるコンテキストをエージェントに提供し、運用コストを大幅に削減できます。これにより、最新のクラウド環境をエージェント規模で運用できる基盤が整います。</span></p>\n<p><span style=\"vertical-align: baseline;\">今すぐ </span><a href=\"https://docs.cloud.google.com/bigquery/docs/hdfs-data-lake-transfer?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Hive メタストア テーブルを Google Cloud に移行</span></a><span style=\"vertical-align: baseline;\">して、エージェントの時代に備えましょう。Google Cloud Lakehouse の詳細については、</span><a href=\"https://cloud.google.com/products/lakehouse?e=a&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Lakehouse 担当プロダクト リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vinod Ramachandran</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Pratibha Suryadevara</strong></p></div>"
  "ddb3cb4c18648706ce4ad173216fc512":
    "id": "ddb3cb4c18648706ce4ad173216fc512"
    "title": "Google、2026 年 Gartner® Magic Quadrant™ クラウドネイティブ アプリケーション プラットフォーム部門のリーダーに選出"
    "link": "https://cloud.google.com/blog/ja/products/application-development/2026-gartner-mq-for-cloud-native-application-platforms/"
    "published": "2026-09-01 11:00:00"
    "fetched": "2026-09-01 21:21:38"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 21 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/application-development/2026-gartner-mq-for-cloud-native-application-platforms?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><strong style=\"vertical-align: baseline;\">2026 年 Gartner® Magic Quadrant™ クラウドネイティブ アプリケーション プラットフォーム（CNAP）部門</strong><span style=\"vertical-align: baseline;\">で、Google が 3 年連続</span><strong style=\"vertical-align: baseline;\">リーダー</strong><span style=\"vertical-align: baseline;\">に選出されました。リーダー・クアドラントという位置付けは、デベロッパー中心の使いやすいプラットフォームを提供し、オンボーディングの加速や最新ワークロードでの迅速なプロトタイピングを支援するという、Google の取り組みが評価された結果であると考えています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_1_Magic_Quadrant_for_CloudNative_Application_Platforms\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Magic_Quadrant_for_CloudNative_Ap.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「アプリケーション中心のクラウド」という Google のビジョンが目指すのは、インフラストラクチャの複雑さを排除して、デベロッパーがコードの作成や、エージェントまたは従来型アプリの構築に専念できる環境を提供することです。Google Cloud は、サーバーレス、コンテナ化、エージェント型のデプロイ オプションに対応する統合実行環境を提供します。今回の Google の選出は、標準的なエンタープライズ マイクロサービスと次世代の自律型 AI アプリケーションの両方を支える、Google 独自の万全な体制を裏付けるものと考えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google のプラットフォームの主な機能と特長を以下にご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">アイデアから実装まで</strong></h4>\n<p><span style=\"vertical-align: baseline;\">生成 AI はバイブ コーディングという波を巻き起こしました。これにより、誰もがアイデアを形にし、アプリケーションとしてデプロイするまでを、従来の数分の一の時間で実現できるようになっています。これをさらにスムーズに行えるように、Google Cloud はサーバーレス インフラストラクチャを AI バイブ コーディングおよびプロトタイピング ツールと統合しています。また、</span><a href=\"https://docs.cloud.google.com/mcp/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">マネージド MCP サーバー</span></a><span style=\"vertical-align: baseline;\">や</span><a href=\"http://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント スキル</span></a><span style=\"vertical-align: baseline;\">などのツールを使用して、Google Cloud リソースへのアクセスを簡素化しています。エージェント スキルは、AI に専門的な複数ステップのワークフローを実行する方法を教えるための、一連の指示、スクリプト、リソースをパッケージ化したものです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google AI Studio でのワンクリック プロトタイピング: </strong><span style=\"vertical-align: baseline;\">デベロッパーは、Google AI Studio 内で</span><a href=\"https://cloud.google.com/blog/ja/products/databases/vibe-coded-ai-studio-apps-with-firestore-firebase-cloud-sql?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">フルスタック アプリケーション</span></a><span style=\"vertical-align: baseline;\">を直接構築してデプロイできるため、同ツールはプロトタイピングやテストに最適な環境となっています。ワンクリックで、バイブ コーディングされたアプリケーションをパッケージ化して </span><a href=\"https://cloud.google.com/run?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> に公開できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google が管理する MCP サーバー:</strong><span style=\"vertical-align: baseline;\"> AI エージェントがクラウド リソースとやり取りできるように、公式のフルマネージド </span><a href=\"https://docs.cloud.google.com/mcp/supported-products\"><span style=\"text-decoration: underline; vertical-align: baseline;\">リモート MCP サーバー</span></a><span style=\"vertical-align: baseline;\">が用意されています。たとえば、Cloud Run MCP サーバー（run.googleapis.com/mcp 経由）を使用すると、デベロッパーはエンドポイントを簡単に起動でき、サーバーサイド ロジックをデプロイできます。MCP ツールは簡単な構成でデプロイできるため、クラウドビルドをスキップして数秒でコードを起動し、デベロッパーの貴重な時間を節約できます。これらのフルマネージド サーバーは IAM および VPC Service Controls と統合されており、コンテンツ セキュリティには Model Armor を活用しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google 公式のスキル リポジトリ</strong><span style=\"vertical-align: baseline;\">: さまざまな Google Cloud テクノロジーに関する専門知識を凝縮した追加のスキルで、エージェントを強化できます。エージェント レジストリで公開されているリポジトリには、</span><a href=\"https://github.com/google/skills/tree/main/skills/cloud/cloud-run-basics\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run のスキル</span></a><span style=\"vertical-align: baseline;\">、Well-Architected の柱（セキュリティ、信頼性、費用の最適化）などが含まれています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">バイブ コーディングを試してみませんか？</span><a href=\"https://codelabs.developers.google.com/deploy-from-aistudio-to-run#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">バイブ コーディングされたアプリを構築して Cloud Run にデプロイする</span></a><span style=\"vertical-align: baseline;\"> Codelab で実際に体験してみてください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">実装からエンタープライズ対応まで</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、デベロッパー、アーキテクト、プラットフォーム エンジニアリング用のツールをフルパッケージで用意しており、プロトタイプを本番環境グレードの安全で費用対効果の高いエンタープライズ ソフトウェアに変換するのに優れています。アプリケーションの設計から Day 2（2 日目からの）運用の最適化まで、Google はアプリケーションのライフサイクル全体にわたってビルド、運用、デプロイするのに役立つサービスとツールを提供しており、あらゆる言語、ライブラリ、フレームワークを使用して自由に構築できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ビルド</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</strong></a><strong style=\"vertical-align: baseline;\"> によるビルド: </strong><span style=\"vertical-align: baseline;\">Google では、Antigravity ハーネスを基盤として開発エコシステムの簡素化と拡張を進めており、開発におけるサイロ化を解消して、統合されたオーケストレーション レイヤへと一元化しています。Antigravity は、マルチステップの AI 推論をデベロッパー ワークフローに直接統合することで、ローカル コードベース開発を Google のクラウドネイティブ アプリケーション プラットフォーム（Cloud Run など）にネイティブに導入します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/application-design-center/docs/overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">App Design Center</strong></a><strong style=\"vertical-align: baseline;\">（ADC）を使用した設計とデプロイ: </strong><span style=\"vertical-align: baseline;\">App Design Center を使用して Terraform と YAML の手動構成を排除することで、デベロッパーのスピードと企業の管理のギャップを埋めることができます。このプラットフォーム エンジニアリング コンポーネントは、チームが Google Cloud でテンプレート駆動型アプリケーションを設計、標準化、デプロイするのに役立ちます。また、Gemini Cloud Assist 設計エージェントの一部として統合され、MCP サーバーとして公開されています。ADC を使用すると、自動化された Gemini Cloud Assist セキュリティ テンプレートを基盤とする Cloud Run サービス、データベース、イベント ブローカーを使用して、アーキテクチャを視覚的に設計できます。ADC は、人間が主導する設計だけでなく、HITL（人間参加型）でない場合のプログラマティックなオーケストレーションも可能にします。これにより、自動化されたパイプラインが、ポリシーで管理された Terraform 構成を直接かつ自律的にプロビジョニングできるようになります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">運用</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インテリジェントな調査: </strong><a href=\"https://cloud.google.com/products/gemini/cloud-assist?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Cloud Assist</span></a><span style=\"vertical-align: baseline;\"> をネイティブ テレメトリーと統合することで、Day-2 インシデント向けの AI 主導のフレームワークが作成されます。アラートが発せられると、オペレーターは Gemini Cloud Assist を使用してログと指標を即座に統合し、根本原因を特定して修復策を生成します。このコンテキストは、サポートのエスカレーションを迅速化するために引き継ぐことができます。重要なのは、IAM 権限によってすべての AI 推奨事項が厳密に管理され、インフラストラクチャの変更が行われる前に、人間参加型の明示的な承認が確実に必要になるということです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">費用の分析と最適化: </strong><span style=\"vertical-align: baseline;\">機械学習アルゴリズムが季節ごとの自然なトラフィック サイクルを学習し、費用の異常を数分以内に検出して通知をトリガーします。これにより、インフラストラクチャのシャットダウンといった致命的なリスクを避けながら、収益を保護できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">デプロイ</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">信頼性と高可用性: </strong><span style=\"vertical-align: baseline;\">Cloud Run はデフォルトではリージョン サービスですが、1 つの gcloud コマンドで複数のリージョンにアプリをデプロイできます。</span><a href=\"https://docs.cloud.google.com/run/docs/configuring/configure-service-health\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Service Health</span></a><span style=\"vertical-align: baseline;\"> との連携により、Cloud Run はクロスリージョン フェイルオーバーとフェイルバックを自動化します。あるリージョンのサービスが異常な状態になると、トラフィックは次に近い正常なリージョンに自動的にルーティングされ、問題が解決するとフェイルバックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープン プラットフォーム: </strong><span style=\"vertical-align: baseline;\">Google は、Cloud Native Computing Foundation（</span><a href=\"https://www.cncf.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CNCF</span></a><span style=\"vertical-align: baseline;\">）への長年にわたる主要な貢献者として、オープンソース ファーストの戦略を推進しています。コミュニティ主導の基盤テクノロジーを統合することで、マルチクラウドの柔軟性をますます重視するエンタープライズのお客様が、アプリケーションのポータビリティを実現できるようサポートしています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google Cloud へのアプリのデプロイを開始する準備はできましたか？次の Codelab で実際に体験してみてください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/build-and-deploy-gcp-with-antigravity#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run で Antigravity を使用してアプリをビルドする</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/next26/adc-apps#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">App Design Center を使用して Cloud Run アプリをデプロイする</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/next26/gemini-cloud-assist-cost-optimization#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Cloud Assist でアプリケーションの費用を最適化する</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ対応から自律型へ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI エージェントはソフトウェアの次なるフロンティアです。生産性と効率の向上だけでなく、飛躍的な成長も実現できます。企業に堅牢なエージェント型のデプロイ オプションを提供するため、Google Cloud は、自律型エージェント群のホスト、管理、保護に特化した専用のインフラストラクチャ スタックを提供します。このスタックは、Google の Agent Development Kit（</span><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK</span></a><span style=\"vertical-align: baseline;\">）やその他の主要なエージェント フレームワークとシームレスに統合され、デベロッパーに最大限の柔軟性を提供します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise Agent Runtime</strong><span style=\"vertical-align: baseline;\">このスタックの中核となるのは、Gemini Enterprise Agent Platform とその専用の </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Runtime</span></a><span style=\"vertical-align: baseline;\"> です。これらは、エンタープライズ規模のエージェント開発に必要なサーバーレスおよびコンテナ化されたデプロイ オプションを提供し、次のような機能を備えています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ネイティブのパーソナライズ:</strong><span style=\"vertical-align: baseline;\"> 組み込みのセッションとメモリバンクがコンテキストと長期的な状態を管理し、費用が膨らむのを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェントのオブザーバビリティとトレース:</strong><span style=\"vertical-align: baseline;\"> OpenTelemetry（OTel）標準と</span><a href=\"https://opentelemetry.io/blog/2026/genai-observability/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント スキーマ</span></a><span style=\"vertical-align: baseline;\">に基づいて構築されたターンキー ダッシュボードには、エージェントのトポロジグラフと、セッション、ツール呼び出し、推論パスの詳細を示すインタラクティブなトレースログが用意されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェントの評価とシミュレーション:</strong><span style=\"vertical-align: baseline;\"> 自動シミュレーション ツールにより、デベロッパーはゴールデン セットに対してエージェントをテストし、並べて比較できます。また、数千ものインタラクションをシミュレートしてエッジケースをテストできます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Cloud Run でのエージェントのホスティング</strong><span style=\"vertical-align: baseline;\">さらなる柔軟性、きめ細かい制御、特定の規制遵守を必要とするお客様には、エージェントをホストする優れたサーバーレスの代替手段として Cloud Run をご利用いただけます。最新の機能には、次のようなものがあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run インスタンス </strong><span style=\"vertical-align: baseline;\">（近日提供予定）</span><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">このプリミティブは、Cloud Storage ボリューム マウントを統合した、個別にアドレス指定可能な長時間実行のシングルトン リソースを管理します。これにより、常駐型のバックグラウンド エージェントをコスト効率よくデプロイできるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run </strong><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-run-sandboxes-are-in-public-preview?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">サンドボックス</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">500 ミリ秒未満でスピンアップするハードウェア的に隔離された環境で、信頼性の低いモデル生成コードを安全に実行し、ホストシステムを不正アクセスから保護します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">エージェントのセキュリティ、ガバナンス、監査可能性</strong><span style=\"vertical-align: baseline;\">AI エージェントを安全にデプロイし、管理されていないシャドー AI を防止するために、企業は堅牢なガバナンス フレームワークを必要とします。Google Cloud は、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Identity</span></a><span style=\"vertical-align: baseline;\">（暗号化 ID を使用した非人間用 IAM）を通じて、すべてのアクションと推論の監査可能なトレイルを提供します。また、一元化さらた </span><a href=\"https://docs.cloud.google.com/agent-registry/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Registry</span></a><span style=\"vertical-align: baseline;\"> により、承認済みのエージェント、スキル、ツール、アプリケーション アーティファクトを管理して、不正なツールの統合を防止します。さらに、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Gateway</span></a><span style=\"vertical-align: baseline;\"> を使用して、トラフィックをプロキシ経由にし、Model Armor ポリシーを適用して、破壊的なアクションを積極的にブロックします。これらの機能は現在 </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Runtime</span></a><span style=\"vertical-align: baseline;\"> で利用可能で、Cloud Run と Google Kubernetes Engine（GKE）でもまもなく利用可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントのデプロイを開始する準備はできましたか？Gemini Enterprise Agent Platform を取り上げたさまざまな Codelab は、</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/13-demos-on-gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">でご覧いただけます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">クラウドネイティブ アプリケーションの未来を構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">初めてフルスタック アプリケーションをデプロイするバイブ コーダーから、本番環境のマイクロサービスを標準化するソフトウェア アーキテクト、そして安全な AI エージェント群をスケーリングさせる企業チームまで、Google Cloud はあらゆるニーズに応えるシンプルさ、弾力性、そしてセキュリティを提供します。</span><strong style=\"vertical-align: baseline;\">レポート全文を読む:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/resources/content/gartner-cloud-native-application-platforms-magic-quadrant-report-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 Gartner® Magic Quadrant™ クラウドネイティブ アプリケーション プラットフォーム部門（CNAP）</span></a><span style=\"vertical-align: baseline;\">を無料でダウンロードできます。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">「Magic Quadrant for Cloud-Native Application Platforms」、Mukul Saha、Alex Coqueiro、Prasanna Lakshmi Narasimha、Richard Watson 著、2026 年 8 月 3 日</span></span></sup></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Gartner および Magic Quadrant は、Gartner, Inc. および/またはその関係会社の商標です。上の図は、リサーチ ドキュメントの一部として Gartner, Inc. より公開されているもので、ドキュメント全体の文脈に即して評価する必要があります。この Gartner のドキュメントをご希望の方は、Google までご請求ください。</span></span></sup></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Gartner は、発行物に掲載されている特定の企業、ベンダー、製品、サービスを推奨するものではありません。また、最高の格付けまたはその他の評価を得たベンダーのみを選択するように助言するものでもありません。Gartner の発行物は、Gartner のビジネスおよびテクノロジー インサイト組織の見解を表したものであり、事実を表現したものではありません。Gartner は、明示または黙示を問わず、商品性や特定の目的への適合性を含め、本出版物に関連したいかなる保証も行いません。</span></span></sup></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト管理担当シニア ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ines Envid</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Lisa Shen</strong></p></div>"
  "e5cabb27a446a953322fd706638f369b":
    "id": "e5cabb27a446a953322fd706638f369b"
    "title": "元データを空間インテリジェンスに変換"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/turning-raw-data-into-spatial-intelligence/"
    "published": "2026-09-01 19:00:00"
    "fetched": "2026-09-02 16:50:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 7 月 23 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/turning-raw-data-into-spatial-intelligence/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<h3><span style=\"vertical-align: baseline;\">適切な場所とタイミングの把握</span></h3>\n<p><span style=\"vertical-align: baseline;\">物理的な拠点を有する企業や、自社の業務が刻々と変化する現実世界の状況に左右される企業にとって、その地点について理解することは、新たなビジネス機会を見出すうえで極めて重要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Maps Platform の最新機能を活用して、建物の立地、クリーン エネルギーの可能性、大気質を分析することで、元データを空間インテリジェンスに変換して、トレンドの特定や予測、サステナブルな収益源の構築に役立てることができます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">立地情報の重要性: Places Insights データセットを拡張</span></h3>\n<p><span style=\"vertical-align: baseline;\">実店舗を構える企業にとって、新しい店舗や施設をどこに建設、開設するかという判断は、収益や ROI に大きな影響を及ぼします。事業拡大を成功させるには、現地の市場を正確に把握する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Maps Platform の </span><a href=\"https://mapsplatform.google.com/demos/places-insights/?utm_source=blog&amp;utm_campaign=Q2_theme3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places Insights データセット</span></a><span style=\"vertical-align: baseline;\">は、これまでも、</span><a href=\"https://developers.google.com/maps/architecture/places-insights-analyze-site-performance-ml?utm_source=blog&amp;utm_campaign=Q2_theme3&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">店舗のパフォーマンス分析</span></a><span style=\"vertical-align: baseline;\">や</span><a href=\"https://developers.google.com/maps/architecture/places-insights-sales-leads?utm_source=blog&amp;utm_campaign=Q2_theme3&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">新規の見込み顧客の特定</span></a><span style=\"vertical-align: baseline;\">に必要なインテリジェンスを提供してきました。このたび、米国、英国、カナダ、オーストラリアにおける Places Insights を拡張し、</span><a href=\"https://developers.google.com/maps/documentation/placesinsights/brands?utm_source=blog&amp;utm_campaign=Q2_theme3&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブランドの展開状況</span></a><span style=\"vertical-align: baseline;\">に関する情報が含まれるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この新しい Places Insights データセットは、商業エリアの特性や、補完または競合する事業者の所在地を把握するのに役立ち、販売エリアの最適化、配送ネットワークの拡大、新規事業との統合の評価など、さまざまな用途に利用できます。この新しいデータを活用して商業密度を分析することで、市場拡大、製品流通、出店場所の選定といったデータドリブンな意思決定をより精緻化できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Turning raw-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Turning_raw-1.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Places Insights を活用することで、新しい支店や小売店舗、サービス拠点に最適な場所を選定できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Places Insights のデータはすべて BigQuery で利用できるため、それらのデータを自社の売上、顧客、運用のデータや、サードパーティの人口統計、交通、環境のデータにマッピングして、わかりやすい形で可視化できます。また、データサイロを解消することで、市場飽和度、市場浸透度、空間需要をより効率的に分析できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Places Insights は、アルゼンチン、フィンランド、韓国などで新たに利用できるようになり、合わせて 50 か国へと拡大しました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">太陽光発電パネルの設置状況を把握</span></h3>\n<p><span style=\"vertical-align: baseline;\">屋上太陽光発電パネルが設置されている場所を特定するには、これまでは衛星画像を丹念に調べる必要がありました。新しい </span><a href=\"https://mapsplatform.google.com/maps-products/solar/?utm_source=blog&amp;utm_campaign=Q2_theme3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Detected Arrays</span></a><span style=\"vertical-align: baseline;\"> は、既存の太陽光発電パネルの設置状況を可視化することで、あらゆる建物の発電の可能性を把握できるようにします。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、当社の Earth AI の</span><a href=\"https://research.google/blog/google-earth-ai-unlocking-geospatial-insights-with-foundation-models-and-cross-modal-reasoning/?utm_source=blog&amp;utm_campaign=Q2_theme3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">地理空間基盤モデル</span></a><span style=\"vertical-align: baseline;\">を使用して、Solar API にこの新しい太陽光発電検出データセットを作成しました。これにより、地域全体の実際の太陽光発電容量をデスクトップから直接分析できるようになり、現地調査にかかる時間と費用を削減できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"Turning raw-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Turning_raw-2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Detected Arrays は、既存の屋上太陽光発電パネルを可視化し、各建物においてどれだけ電化の可能性があるかを把握できるようにします。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エネルギー状況をミクロな視点で把握できるようになることで、クリーン エネルギーの機器やサービスを提供する事業者は、住宅の電化を検討している顧客の発掘、現地調査の強化、拡大の余地がある地域の特定などが可能になります。また、エネルギー事業者は、エネルギー インフラストラクチャ、負荷調整、バーチャル パワー プラント プログラムについて、エビデンスに基づく意思決定を行い、新規ビジネスの獲得につなげることができます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">過去の大気質と花粉のデータを実践的なビジネス戦略に変換</span></h3>\n<p><span style=\"vertical-align: baseline;\">花粉の量と、花粉が原因で起こる季節性アレルギーは、地域ごとに絶えず変化しています。</span><a href=\"https://mapsplatform.google.com/maps-products/air-quality/?utm_source=blog&amp;utm_campaign=Q2_theme3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Air Quality Insights</span></a><span style=\"vertical-align: baseline;\"> は、汚染物質に関する超局地的な最新データを長年にわたって提供しており、健康やビジネスのリスクをより正確に評価できるようにしてきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"https://mapsplatform.google.com/resources/blog/from-reaction-to-resilience-empowering-industries-with-advanced-environmental-intelligence/?utm_source=blog&amp;utm_campaign=Q2_theme3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pollen Insights と Air Quality Insights</span></a><span style=\"vertical-align: baseline;\"> のデータセットに 4 年分のデータが追加されました。これにより、リアルタイムのモニタリングだけでなく、予測的な分析も可能になり、季節的な環境要因が人々に影響を及ぼす前に予測できるようになります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Turning raw-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Turning_raw-3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>マンハッタンにおける特定の種類の花粉の中央値を可視化した例。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">製薬、ヘルスケア、ライフ サイエンスの企業は、この花粉と大気質の過去のデータを活用して、研究開発に役立てたり、季節ごとのサプライ チェーンを最適化したりできます。また、粒子状物質、アレルゲン、花粉（形状や種類なども含む）を詳細に把握することで、アレルギーをより適切に管理するために必要な予測や健康に関する推奨事項を提供できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、</span><a href=\"https://cloud.google.com/bigquery??utm_source=blog&amp;utm_campaign=Q2_theme3\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> では、大気質や花粉のデータと各企業固有のビジネスデータとを簡単に結合できるため、呼吸器系の健康動向や、関連する医薬品のサプライ チェーンの需要予測に役立てることができます。Air Quality Insights と Pollen Insights は、米国、カナダ、オーストラリアでご利用いただけます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Turning raw-4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Turning_raw-4.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>花粉飛散量の現在のデータと予測データを提供し、花粉対策に役立つヒントをユーザーに提供します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Maps Platform の新旧のデータセットと機能を組み合わせることで、強力な「空間インテリジェンス エンジン」を実現できます。業務をより深く理解して、新たな機会を特定できるほか、ビジネスの実世界におけるフットプリントを賢く、かつ持続可能な形で最適化することが可能になります。</span></p>\n<p><a href=\"https://developers.google.com/maps/documentation/placesinsights?utm_source=blog&amp;utm_campaign=Q2_theme3&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places Insights</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://developers.google.com/maps/documentation/solar?utm_source=blog&amp;utm_campaign=Q2_theme3&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Solar API</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://mapsplatform.google.com/resources/blog/from-reaction-to-resilience-empowering-industries-with-advanced-environmental-intelligence/?utm_source=blog&amp;utm_campaign=Q2_theme3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pollen Insights</span></a><span style=\"vertical-align: baseline;\"> で、Google Maps Platform の最新のデータセットを今すぐご利用ください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform、シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Saleem Van Groenou</strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Amit Lesman</strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform、グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Erika Yamasaki</strong></p></div>"
  "da0afcc2d3abfab65cbc305dcbb9ea05":
    "id": "da0afcc2d3abfab65cbc305dcbb9ea05"
    "title": "ピーター パーカーの世界を体験: Sony Pictures の映画『スパイダーマン: ブランド・ニュー・デイ』の「スパイディ トラッカー」を構築"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/discover-peter-parkers-world-building-the-sony-pictures-spider-man-brand-new-day-spidey-tracker/"
    "published": "2026-09-01 10:10:00"
    "fetched": "2026-09-02 16:50:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 7 月 22 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/intl/ja_jp/resources/blog/discover-peter-parkers-world-building-the-sony-pictures-spider-man-brand-new-day-spidey-tracker/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回の記事は、Google Maps Platform のセールスリードである Rawleigh Smith と、Google マップのプロダクト マーケティング マネージャーである Emily Gao によるものです。Sony Pictures の映画『Spider-Man</span><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">TM</span></span><span style=\"font-style: italic; vertical-align: baseline;\">: Brand New Day』（邦題: スパイダーマン: ブランド・ニュー・デイ）に登場するスパイディ トラッカーを支えるエクスペリエンスがどのように開発されたかを両氏が紹介します。</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">7 月 31 日、私たちの親愛なる隣人であるスパイダーマンが、Sony Pictures の待望の新作『</span><span style=\"font-style: italic; vertical-align: baseline;\">スパイダーマン</span><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">TM</span></span><span style=\"font-style: italic; vertical-align: baseline;\">: ブランド・ニュー・デイ』で劇場に帰ってきました。</span><span style=\"vertical-align: baseline;\">この記念すべき劇場公開を祝して、Sony Pictures は Samsung および Google マップのチームとともに、映画の魅力を世界中のファンに直接届けることにしました。</span><a href=\"https://spideytracker.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SpideyTracker.com</span></a><span style=\"vertical-align: baseline;\"> は、映画の中で Ned Leeds（Jacob Batalon）が作成した架空のアプリに着想を得たもので、Ned は Samsung のスマートフォンを使用してスパイダーマンの居場所を追跡します。Sony Pictures は、このアイデアを実際のオンライン エクスペリエンスとして具現化しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">スパイディ トラッカーのウェブサイトには、スパイダーマンの目撃情報、キャンペーン イベント、イースター エッグ、ファンが作成したユーザー生成コンテンツ、映画の限定コンテンツなどが掲載されています。スパイディ トラッカーでは、Google Maps Platform を使用して開発されたオリジナルの地図を通じて、世界中のスパイダーマン関連イベントを閲覧したり、視覚的な体験を楽しんだりできます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">Google Maps Platform で開発されたスパイディ トラッカー</span></h3>\n<p><span style=\"vertical-align: baseline;\">スパイディ トラッカーは、主人公のピーター パーカーの世界をファンが直接体験できるカスタムメイドの没入型のマップであり、世界 35 か国で利用可能です。開発にあたっては、トラフィックの多いプロモーション サイトを構築するために、スケーラビリティ、スピード、場所に関する豊富な情報のシームレスな統合が必要であり、開発者はこのビジョンを実現するために、Google Maps Platform API の堅牢な機能を積極的に利用しました。このサイトの基盤は </span><a href=\"https://developers.google.com/maps/documentation/javascript/overview?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Maps JavaScript API</span></a><span style=\"vertical-align: baseline;\"> で構築されており、</span><span style=\"vertical-align: baseline;\">これにより、高度にカスタマイズされたインタラクティブな世界地図を提供しています。</span><a href=\"https://developers.google.com/maps/documentation/javascript/cloud-customization?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud ベースのマップのスタイル設定</span></a><span style=\"vertical-align: baseline;\">が、地図に特徴的な外観を与え、</span><a href=\"https://developers.google.com/maps/documentation/javascript/reference/advanced-markers?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">高度なマーカー</span></a><span style=\"vertical-align: baseline;\">がカスタム デザインのピンで目撃情報を生き生きと表現しています。一部の目撃場所では、ファンはストリートビューを通じて直接そのシーンに足を踏み入れることができ、その位置情報により、ユーザーはリアルタイムで地図上の自分の位置を把握できます。地図自体に加え、@SpideyTracker からの最新投稿を表示するライブ X フィードや、世界中のスパイダーマン関連イベントの最新情報をファンに提供するカスタム イベント パネルも備わっています。Samsung が提供するこのエクスペリエンスは、「Exclusives」セクションによってさらに充実しています。Galaxy デバイス向けの壁紙、ステッカー、絵文字パックをダウンロードでき、これらのブランド コンテンツを画面の外の世界でも楽しめるように設計されています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Sony Pictures-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Sony_Pictures-1.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>スパイディ トラッカーでは、マップを探索してイベントや目撃情報などを確認できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Google マップのストリートビューで宝探し</span></h3>\n<p><span style=\"vertical-align: baseline;\">映画の公開を記念して、ニューヨーク市内のストリートビューに 5 つの象徴的なサプライズが隠されています。これらは、ストリートビューの撮影車がスパイダーマンの活躍に偶然遭遇したときに撮影された、スパイダーマンならではの特別な瞬間です。屋上の見張り台からの眺め、ウェブスリング（「スウィップ」）の瞬間、路上での遭遇後の余韻など、すべてのシーンが Google マップにシームレスに組み込まれています。そして何よりすばらしいのは、ファンが自分自身でそれらを発見できることです。Google マップのストリートビューが持つ没入感あふれる機能を活用してニューヨークをバーチャルに探索することで、街中に隠されたスパイダーマンのサプライズを発見できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google マップの公式</span><a href=\"https://www.instagram.com/googlemaps/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ソーシャル チャネル</span></a><span style=\"vertical-align: baseline;\">をこまめにチェック</span><span style=\"vertical-align: baseline;\">して手がかりを探しましょう。お気に入りの街をまったく新しい方法で体験できる絶好の機会です。</span></p>\n<h3><span style=\"vertical-align: baseline;\">アクションの世界へ飛び込みましょう</span></h3>\n<p><a href=\"https://youtu.be/P3uI5sLosKU?si=qcRHUf3mJqnb0w-p\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">7 月 31 日の映画公開に</span></a><span style=\"vertical-align: baseline;\">あたって、</span><span style=\"vertical-align: baseline;\">デベロッパーもファンも、アクションの世界に足を踏み入れることができます。Google マップと Google Maps Platform を統合することで、Sony Pictures は、地図を利用したストーリーテリングの驚くべき力を示す、真に没入感のあるエクスペリエンスを創出しました。ぜひ宝探しを楽しんでください！</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform、セールスリード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Rawleigh Smith</strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Google マップ、プロダクト マーケティング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Emily Gao</strong></p></div>"
