  "d2f3f1921329253db19407e685158816":
    "id": "d2f3f1921329253db19407e685158816"
    "title": "M4N VM ファミリーの一般提供を開始: I/O およびメモリ バウンド ワークロードでコアあたり最高の IOPS とスループットを実現"
    "link": "https://cloud.google.com/blog/ja/products/compute/compute-engine-m4n-vms/"
    "published": "2026-09-25 10:00:00"
    "fetched": "2026-09-25 14:50:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 17 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/compute/compute-engine-m4n-vms?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業がミッション クリティカルなアプリケーションの規模を拡大するにつれ、ストレージ I/O やメモリアクセスが運用上の大きなボトルネックになることがあります。Oracle Database、SAP HANA のようなインメモリ データベース、高スループットの SQL Server クラスタ、EHR システム、リアルタイムのビッグデータ分析など、メモリバウンドのワークロードでは、必要な RAM 容量とストレージ帯域幅を確保するために、実際に必要な数を超えるコンピューティング コア（vCPU）をプロビジョニングせざるを得ないことが少なくありません。その結果、高額なサードパーティ ソフトウェアのライセンス費用がさらに膨らむことになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Google Compute Engine の </span><strong style=\"vertical-align: baseline;\">M4N</strong><span style=\"vertical-align: baseline;\"> マシンシリーズの</span><strong style=\"vertical-align: baseline;\">一般提供</strong><span style=\"vertical-align: baseline;\">を開始しました。M4N は、I/O 負荷が高く、大容量メモリを必要とするワークロード向けに特化して設計されたマシンシリーズで、ネットワークとブロック ストレージに最適化された VM ファミリーの第 2 弾です。主要なハイパースケーラーが提供する同等のサービスと比べ、M4N はハイメモリ インスタンスでコアあたり最高の IOPS とスループットを実現し、Oracle Database の TCO を 20% 以上削減できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_gZSsHxy.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">M4N は、ネットワークおよびブロック ストレージに最適化されたインスタンスとして、より高いメモリ比率（最大 26:1）と大容量メモリ（最大 6 TB）を実現した</span><strong style=\"vertical-align: baseline;\">業界初</strong><span style=\"vertical-align: baseline;\">のプロダクトでもあります。第 5 世代 Intel® Xeon® スケーラブル プロセッサを搭載し、Google Cloud 独自の </span><a href=\"https://cloud.google.com/titanium\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> オフロード アーキテクチャを基盤とする M4N インスタンスは、</span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Extreme</span></a><span style=\"vertical-align: baseline;\"> と組み合わせることで、ホストあたり合計で最大 25,000 MiB/秒（25 GiB/秒）のストレージ スループットと最大 100 万 IOPS を実現します。これは、現行の M4 インスタンスと比べて 2 倍のブロック ストレージ性能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">M4N は、極めて大容量の RAM と妥協のない I/O 性能の両方が求められるワークロード向けに設計されています。高スループットのエンタープライズ アプリケーションで課題となるストレージやネットワークのボトルネックを解消することで、M1、M2、M3、M4、X4 などの既存のメモリ最適化ファミリーを補完します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">要求の厳しいワークロードに対応</strong></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">ワークロードのカテゴリ</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">主な用途</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">M4N の強み</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ミッション クリティカルなエンタープライズ データベース</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Oracle、SAP HANA、SQL Server、IBM DB2、MySQL、PostgreSQL</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">vCPU あたり最大 26.57 GB のメモリと 25 GiB/秒のストレージ性能を組み合わせることで、データの高速取り込みやトランザクション ログ処理を実現し、バックアップ時の処理停止も回避できます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">生成 AI と RAG のデータレイヤ</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Milvus、Pinecone、Qdrant、Vespa、Redis、インメモリ コンテキスト キャッシュ</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">RAM 上の大規模なベクトル インデックスに対してミリ秒未満で類似性検索を実行できます。さらに、400 Gbps のネットワーク帯域幅により、分散環境でのモデル取得を高速化します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">エンタープライズ向け医療システムと ERP</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Epic Systems（オペレーショナル データベース）、SAP ECC、SAP S/4HANA</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">十分な I/O 余力を継続的に確保することで、臨床業務やトランザクション処理が集中するピーク時間帯でもクエリ レイテンシの急増を防ぎます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">リアルタイム分析と EDA</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">電子設計自動化、ゲノム モデリング、インメモリ OLAP</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">大容量メモリにより大規模なデータセット全体を RAM に読み込み、最大限のストレージ帯域幅を活用してチェックポイント ダンプを高速に処理できます。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">Oracle のライセンス費用を最適化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">企業の IT 部門にとって、コア数に応じて増加するソフトウェア ライセンス費用は大きな課題です。Oracle Database などのワークロードでは、通常、インスタンスに割り当てられた vCPU または物理コアの数に基づいてライセンス料が算定されます。そのため従来は、必要な RAM 容量やストレージ性能を確保するためだけに、実際には不要なコンピューティング コアまでプロビジョニングし、その分の費用を負担せざるを得ないというトレードオフがありました。</span></p>\n<p><span style=\"vertical-align: baseline;\">M4N は、業界をリードする高いメモリ対 vCPU 比によって、この課題を解消します。主要なハイパースケーラーが提供するハイメモリ インスタンスの中で、M4N はコアあたり最高の IOPS とスループットを実現します。これにより、データベース管理者は次のようなメリットを得られます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TCO とライセンス費用を削減:</strong><span style=\"vertical-align: baseline;\"> Oracle Database に必要な性能密度を確保しながら、コアの過剰なプロビジョニングを回避できます。その結果、主要なハイパースケーラーの同等サービスと比較して、</span><strong style=\"vertical-align: baseline;\">TCO を 20% 以上削減</strong><span style=\"vertical-align: baseline;\">できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インフラストラクチャを適正規模に調整:</strong><span style=\"vertical-align: baseline;\"> 大容量メモリを利用しながら、ワークロードに必要な分だけコンピューティング リソースを割り当てることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">キャッシュ ヒット率を向上:</strong><span style=\"vertical-align: baseline;\"> コアあたりのメモリ容量が増えることで、データベースのより多くの部分をシステム グローバル領域（SGA）に保持できます。これにより、負荷の大きい I/O 処理を減らし、さらなる効率向上を図ることができます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">お客様の声</strong></h3>\n<p><span style=\"vertical-align: baseline;\">M4N を早期に利用したお客様の事例からは、ワークロードに最適化されたインフラストラクチャが変革を支える原動力となることがわかります。</span></p>\n<p><span style=\"vertical-align: baseline;\">「M4N の登場以前は、Google Cloud 上で厳しい I/O 要件を満たそうとすると、必要な性能密度を確保するために、コンピューティング リソースを過剰にプロビジョニングせざるを得ないことがよくありました。新しい M4N インスタンスでは、小規模から大規模まで、さまざまなマシン構成で高いスループットを実現することで、この課題を解消できます。」- Sabre、シニア プリンシパル ソリューション アーキテクト Sherri Trojan 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"sabre\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sabre_jNZmgxf.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「Google Cloud が、ミッション クリティカルなデータベース ワークロード向けに次世代の高性能インフラストラクチャを導入したことを大変嬉しく思います。この新しいコンピューティング プラットフォームは、スケーラビリティ、レジリエンス、高いパフォーマンスが求められるエンタープライズ向け Oracle 環境に大きな可能性をもたらします。このイノベーションによって、Google Cloud 上で Oracle ワークロードを実行するお客様にどのような新たな可能性が開かれるのか、大いに期待しています。」- Tessell、共同創業者 / CEO Bala Kuchibhotla 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"tessel\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/tessel.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「M4N によって、Google Cloud はプラットフォームの共同設計の可能性をさらに広げています。第 5 世代 Intel Xeon スケーラブル プロセッサと Google 独自の Titanium オフロード アーキテクチャを組み合わせることで、M4N は、世界でも特に要求の厳しいミッション クリティカルなデータ環境に求められる大容量メモリ、高いメモリ帯域幅、妥協のない I/O スループットを実現します。」- Intel</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"intel\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/intel_iwN65co.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">新機能: M4N で大規模なデータレイヤをスケール</strong></h3>\n<p><span style=\"vertical-align: baseline;\">M4N は、これまでクラウド インフラストラクチャでは別々に追求されてきた</span><strong style=\"vertical-align: baseline;\">大容量メモリ</strong><span style=\"vertical-align: baseline;\">と</span><strong style=\"vertical-align: baseline;\">極めて高い I/O 性能</strong><span style=\"vertical-align: baseline;\">を両立します。Google Cloud 独自の Titanium オフロード技術を採用することで、追加のインフラストラクチャを導入したり、メモリ密度を犠牲にしたりすることなく、I/O のボトルネックを最小限に抑えます。ここでは、M4N がこうした環境でどのようなメリットをもたらすのかを見ていきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. 高帯域幅のデータ転送を実現</span></p>\n<p><span style=\"vertical-align: baseline;\">大容量メモリを必要とするワークロードに対して、M4N は次の機能を提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">優れた VM 間帯域幅:</strong><span style=\"vertical-align: baseline;\"> 同一 VPC 内で、</span><strong style=\"vertical-align: baseline;\">VM 間の合計ネットワーク帯域幅は最大 400 Gbps</strong><span style=\"vertical-align: baseline;\">、</span><strong style=\"vertical-align: baseline;\">単一フローの帯域幅は最大 50 Gbps</strong><span style=\"vertical-align: baseline;\"> に達します。これにより、分散データベース クラスタやリアルタイム ストリーミング データレイヤで、滞りのないデータ交換が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インターネットへの送信（外向き通信）のスループットを向上:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">インターネットへの送信帯域幅は最大 200 Gbps</strong><span style=\"vertical-align: baseline;\">、パケット処理性能は最大 </span><strong style=\"vertical-align: baseline;\">48 MPPS</strong><span style=\"vertical-align: baseline;\"> を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">追加オプションなしで高帯域幅を利用:</strong><span style=\"vertical-align: baseline;\"> プレミアムな Tier_1 ネットワーキング アドオンを購入したり構成したりすることなく、最大限の性能を引き出せます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">2. Hyperdisk でストレージ性能を柔軟に調整</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の次世代ストレージ ポートフォリオと組み合わせることで、M4N と Hyperdisk では、IOPS、スループット、容量をそれぞれ個別に調整できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hyperdisk Extreme（HdX）:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">合計ブロック ストレージ スループットは最大 25 GiB/秒、IOPS は最大 100 万</strong><span style=\"vertical-align: baseline;\">に達し、標準の M4 と比べて 2 倍のストレージ性能を実現します。データベースの迅速な復旧、トランザクションのチェックポイント処理、インメモリ インデックスの即時再読み込みなどに適しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hyperdisk Balanced（HdB）:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">スループットは最大 20 GiB/秒、IOPS は最大 64 万</strong><span style=\"vertical-align: baseline;\">まで拡張でき、大規模なエンタープライズ ストレージを高い費用対効果で実現します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">M4N のマシンタイプと仕様</strong></h3>\n<p><span style=\"vertical-align: baseline;\">M4N インスタンスは、メモリ対 vCPU 比が異なる 3 つのティアで提供され、16～224 個の vCPU と最大 5,952 GB の DDR5 RAM に対応しています。また、さまざまなワークロード要件に合わせて、3 種類のメモリ対 vCPU 比に基づく事前定義済みの VM シェイプが用意されており、リソースベースの確約利用割引（CUD）も利用できます。詳しくは、</span><a href=\"https://docs.cloud.google.com/compute/docs/memory-optimized-machines#m4n_machine_types\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">M4N インスタンスは現在、世界各地の一部のリージョンでご利用いただけます。M4N ファミリーを活用して、メモリバウンドおよび I/O バウンドのアプリケーションの性能を高め、ライセンス費用を削減する方法について詳しくは、アカウント担当者にお問い合わせいただくか、</span><a href=\"https://cloud.google.com/compute/docs/memory-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- シニア プロダクト マネージャー、Eduardo Mattos Duarte</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- シニア プロダクト マネージャー、Sajal Agarwal</strong></p></div>"
