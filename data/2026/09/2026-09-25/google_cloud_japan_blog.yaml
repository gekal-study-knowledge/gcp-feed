    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 15 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/new-dataflow-features-to-enable-large-scale-ai-workloads?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">概要</strong></h4>\n<p><span style=\"vertical-align: baseline;\">企業は AI とエージェント ワークフローを拡大するにつれて、モデルのトレーニング、評価、推論のためのデータ準備を簡単かつ効率的に行えるサーバーレス プラットフォームが必要になります。</span><a href=\"https://cloud.google.com/products/dataflow\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataflow</span></a><span style=\"vertical-align: baseline;\"> は、Google Cloud による AI スタックにおける重要なコンポーネントです。Dataflow を使用すると、さまざまな分析や AI のユースケースを支援するバッチ パイプラインとストリーミング パイプラインを作成できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Dataflow に大幅な機能強化が施されました。これにより、長時間実行されるバッチジョブのコンピューティング効率を最大化し、最も要求の厳しい AI ワークロードにさらなる推論能力を提供するという、お客様の最大の課題に直接対応できるようになりました。その一環として、このたび、Dataflow バッチジョブの一時停止 / 再開機能の一般提供を開始し、NVIDIA RTX PRO 6000 Blackwell Server Edition GPU を搭載した G4 VM のサポートを開始したことをお知らせいたします。これらの機能により、AI 開発ライフサイクルを加速し、コストを最適化できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Dataflow バッチジョブの一時停止 / 再開機能で無駄なコンピューティングを削減し、デベロッパーの生産性を向上</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Dataflow のお客様は、大規模なバッチ ワークロードを頻繁に実行しており、場合によっては数日間実行されることもあります。これらのジョブが失敗すると、Dataflow ユーザーは現在、ジョブが失敗する前にすでに処理されていたデータにアクセスできなくなります。代わりに、ジョブ全体を再試行する必要があるため、コンピューティング リソースが無駄になり、エンジニアリングの生産性が低下してしまいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">大規模なジョブの障害に対処するだけでなく、AI ワークロードを抱える Dataflow のお客様は、すでに実行されている優先度の低い Dataflow バッチジョブから、特徴量エンジニアリングや AI 推論などの優先度の高いワークロードに GPU や TPU などのアクセラレーテッド コンピューティング リソースを動的に再割り当てすることで、それらのリソースの使用率を高めたいと考えることがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうしたユースケースをより適切にサポートするために、Dataflow バッチジョブの一時停止 / 再開機能の一般提供を開始します。Google 内部のイノベーションを活用したこの機能により、Dataflow のお客様は、失敗した長時間実行ジョブを最初からやり直すのではなく、再開できるようになります。また、お客様はそれぞれのビジネス要件に基づいて Dataflow バッチジョブを一時停止、再開することもできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳細については、</span><a href=\"https://docs.cloud.google.com/dataflow/docs/guides/pause-job#console\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataflow ジョブを手動で一時停止する</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_k7tia8a.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">NVIDIA RTX PRO 6000 GPU で AI 推論ワークロードを高速化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Dataflow はすでに、AI 推論ワークロードを高速化するための幅広い GPU と TPU をサポートしていますが、さらに一歩進めて、</span><a href=\"https://cloud.google.com/dataflow/docs/gpu/gpu-support#availability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell GPU</span></a><span style=\"vertical-align: baseline;\"> を搭載した G4 VM のサポートを発表します。</span></p>\n<p><span style=\"vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell GPU は、NVIDIA L4 GPU と比べて大幅な性能向上を実現しており、96 GB の vGPU メモリと 1.6 TB/秒の帯域幅を提供します。つまり、最大 700 億以上のパラメータを持つモデルを使用して、Dataflow ジョブ内で直接 AI 推論を実行できるということです。これは、</span><a href=\"https://docs.cloud.google.com/dataflow/docs/machine-learning/runinference-best-practices\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RunInference</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/dataflow/docs/guides/right-fitting\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Right Fitting</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/dataflow/docs/guides/tune-horizontal-autoscaling#parallelism-hint\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GPU 対応の自動スケーリング</span></a><span style=\"vertical-align: baseline;\">などのネイティブ Dataflow ML 機能を継続して利用しながら行うことができます。これらの機能により、基盤となるインフラストラクチャを管理したり、チューニングや自動スケーリングなどの難しい問題に手動で対処したりすることなく、AI 推論ジョブを簡単にオンボーディングしてスケールできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">一時停止 / 再開機能と RTX PRO 6000 Blackwell GPU を組み合わせることで、要求の厳しい AI ワークロードを実行しながら、バッチジョブのコストを最適化できます。Google は、Dataflow の機能とお客様にもたらされる可能性に大きな期待を寄せています。今すぐ </span><a href=\"https://cloud.google.com/dataflow/docs/machine-learning\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataflow の使用を開始</span></a><span style=\"vertical-align: baseline;\">し、これらの機能を活用して、AI の最も困難な課題を解決しましょう。皆様が構築されるサービスを楽しみにしております。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Cloud、プロダクト マネージャー、Efesa Origbo</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Cloud、ソフトウェア エンジニア、Danny McCormick</span></p></div>"
