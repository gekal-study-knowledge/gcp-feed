    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/agent-substrate-available-on-gke?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">本日は、Google Kubernetes Engine（GKE）で Agent Substrate が利用可能になったことをお知らせします。</span><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> は、オープンソースかつセキュア バイ デフォルトのエージェント実行ランタイムであり、</span><strong style=\"vertical-align: baseline;\">標準的なコンテナ ランタイムよりも 10 倍高い密度</strong><span style=\"vertical-align: baseline;\">で数百万のサンドボックスを実行できるように設計されています。自律型エージェントの時代に向けて専用設計された Substrate は、ネイティブのゼロトラスト カーネルとネットワーク分離により、</span><strong style=\"vertical-align: baseline;\">1 秒あたり 500 回を超える一時停止 / 再開アクティベーション</strong><span style=\"vertical-align: baseline;\">を実行しながら、</span><strong style=\"vertical-align: baseline;\">500 ミリ秒未満での再開オペレーション</strong><span style=\"vertical-align: baseline;\">を実現します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate は、あらゆる Kubernetes インフラストラクチャで動作し、GKE 向けに最適化されたオープンソース ソリューションとして提供されます。最先端の AI チームはすでに Agent Substrate を活用しています。</span><strong style=\"vertical-align: baseline;\">Hermes Agent</strong><span style=\"vertical-align: baseline;\"> の開発チームである </span><strong style=\"vertical-align: baseline;\">Nous Research</strong><span style=\"vertical-align: baseline;\"> は、Agent Substrate を基盤とした開発を積極的に進めています。</span><strong style=\"vertical-align: baseline;\">Hermes</strong><span style=\"vertical-align: baseline;\"> は現在、生産性、コーディング、CLI、個人向けエージェントの OpenRouter 使用量において、世界第 1 位の AI エージェントにランクされています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ローカルから 100 万エージェント規模へ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">デベロッパーはすでに Antigravity、Claude Code、Codex、OpenClaw、Hermes などのハーネスをローカルで実行していますが、それと、コード生成、ツールとの連携、自動実行を行う数十万の長期実行エージェントを同時に稼働させることとでは、根本的に異なります。そして、これこそが既存のアーキテクチャでは対応が極めて難しい課題となっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント プラットフォームをローカル プロトタイプから大規模なエージェントの実行にスケールすると、インフラストラクチャの制約が根本的に変化します。これには、次のようなものが含まれます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">不透明な信頼境界: </strong><span style=\"vertical-align: baseline;\">モデルは任意のコードをその場で生成して実行できます。カーネルレベルの分離と動的なネットワーク制御がなければ、人間の目に触れたことのない信頼できないコードを実行することは、ホスト エスケープや認証情報の窃盗、データの流出といったリスクを伴います。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ツールアクセスの障壁:</strong><span style=\"vertical-align: baseline;\"> エージェントがコマンドライン ツール、ヘッドレス ブラウザ、ファイル システム ワークスペースを呼び出すには、フル機能のコンピュータ環境が必要です。これらを安全に実行するには、高速かつ容易でなければなりません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">大規模なバースト: </strong><span style=\"vertical-align: baseline;\">エージェント ハーネス、ベンチマーク、強化学習のロールアウトにより、1 分間に数千のサンドボックスが生成されることがあります。汎用スケジューラはこうしたチャーンに対応しきれず、また、コンテナ イメージが繰り返し解凍されることで、深刻なディスク競合が発生する恐れがあります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アイドル状態のコンピューティング: </strong><span style=\"vertical-align: baseline;\">自律型エージェントは、モデルの推論、ツールの応答、人間のフィードバックを待つ間、ほとんどの時間を休止状態で過ごします。アイドル状態のコンテナに専用の CPU と RAM を予約すると、貴重なリソースが無駄になります</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">エージェント専用に構築された基盤</strong></h3>\n<p><span style=\"vertical-align: baseline;\">プラットフォームチームがこれらの課題にぶつかったとき、彼らは受け入れがたいトレードオフを迫られます。それは、「制御と分離を犠牲にする」か、それとも「VM の高レイテンシと非効率性に目をつぶる」か、という選択です。Google は、チームがどちらか一方を選択する必要はないと考えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate は、エージェントの実行をマシン管理から切り離すことで、この問題を回避します。クラウドネイティブな Kubernetes インフラストラクチャ上に構築された Agent Substrate は、エージェント ワークロード専用に設計された新しい実行レイヤを提供します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_2dtrRM6.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この基盤の上で、実行レイヤがサンドボックス化されたエージェント環境のライフサイクルを直接管理し、以下の機能を提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デフォルトでのセキュリティ確保: </strong><span style=\"vertical-align: baseline;\">ハードウェアで分離された Cloud Hypervisor microVM または gVisor サンドボックスを採用。さらに、きめ細かいネットワークポリシーを適用する Egress プロキシを組み合わせ、エージェントの手の届かない場所で認証情報を安全に挿入することで、認証情報の窃盗を防止します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">1 秒未満で起動: </strong><span style=\"vertical-align: baseline;\">コンテナの起動遅延を排除。オンデマンドで、事前にウォームアップされたワーカーに対して、アクティブ化したエージェントをミリ秒単位で即座にディスパッチします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高効率</strong><span style=\"vertical-align: baseline;\">: アイドル状態のアクターは数百ミリ秒で一時停止され、スケジュールが解除されるため、コンピューティング リソースが解放されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープンソースでポータブル: </strong><span style=\"vertical-align: baseline;\">あらゆるコンピューティング環境のあらゆる Kubernetes クラスタで実行でき、Claude Code、OpenClaw、Hermes などのあらゆるエージェント フレームワークやハーネスと連携します</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">アーキテクチャの基本原則</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate がこれらの課題を解決する上での指針として、以下の4つのコア・アーキテクチャ原則を掲げています。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. カーネルとネットワークのレベルで、デフォルトで保護</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントは、信頼できないコードやターミナル コマンドを生成、実行することをコア機能としています。共有サーバー上でそうしたコードを実行することは、共有カーネルまたはネットワーク レベルで、ブレイクアウトや意図しないデータ漏洩を引き起こす重大なリスクを伴います。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_zC5wfpY.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Agent Substrate は、ホストカーネルとネットワーク レイヤの両方で、デフォルトで安全な状態を維持します。チームは、完全な Linux カーネル互換性を提供するハードウェア分離された Cloud Hypervisor microVM か、さらにオーバーヘッドの低いカーネル分離を提供する gVisor サンドボックスのいずれかを選択できます。Agent Substrate の統合ゲートウェイは、すべての Egress リクエストと Ingress リクエストを管理し、ネットワーク アクセスをきめ細かく拡張可能な方法で制御できるようにします。</span></p>\n<p><span style=\"vertical-align: baseline;\">2. 低レイテンシのアクティベーション用に構築されたコントロール プレーンとデータプレーン</span></p>\n<p><span style=\"vertical-align: baseline;\">分離された環境で長時間実行されるエージェントワークロードの密度を最適化するには、レイテンシを極限まで抑え、一時停止および再開のオペレーションを極めて高い頻度で実行できる、専用設計のコントロールプレーンとデータプレーンが必要です。Agent Substrate は、最小限のレイテンシでデータアウェア スケジューリングを処理する専用のコントロール プレーンを導入しています。一方、データプレーンは、事前にウォームアップされたワーカー上で 1 秒あたり数百件の一時停止 / 再開オペレーションを直接処理し、環境の準備にかかるオーバーヘッドを削減します。スナップショットは、永続的な状態を維持するためにローカル ディスクと Google Cloud Storage に書き込まれます。サンドボックス環境は 500 ミリ秒未満で以前の状態に再開でき、アイドル状態になるとすぐに再び一時停止できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_AQ7nEJ0.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. 高密度かつアクティブ時のみのコンピューティング エコノミクス</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントは、ほとんどの時間をモデルの推論、ツールの応答、ユーザー入力の待機に費やします。アイドル状態のコンテナのために物理 CPU と RAM を予約することは、高価で希少な容量をロックすることになり、エージェント フリートを大規模に実行できなくなる恐れがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate は、エージェントが一時停止した瞬間にリソースを解放できます。ゲスト ハイパーバイザの状態をローカル ディスクと Cloud Storage にスナップショットとして保存し、そのまま維持しながら、RAM と CPU を解放して他のエージェントを実行できるようにします。次のターンまたはツール呼び出しが到着すると、Agent Substrate はスナップショットとして保存したセッションをミリ秒単位で再開します。このゼロアイドル モデルでは、ホストあたり 1,000 を超える休止状態のエージェントを収容でき、従来のコンピューティングよりも 10 倍高いコンピューティング密度を実現します。ターン間で共有ファイル システムを必要とするワークロードの場合、オプションの </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore</span></a><span style=\"vertical-align: baseline;\"> エージェント ボリューム コントローラが永続的な NFS ストレージを提供します。詳細については後述します。</span></p>\n<p><span style=\"vertical-align: baseline;\">4. 基盤としての Kubernetes: スケールと信頼性</span></p>\n<p><span style=\"vertical-align: baseline;\">標準 VM 上にカスタム サンドボックス オーケストレーターを構築すると、チームはノードの復元、自動スケーリング、マルチゾーン スケジューリング、ネットワーク ポリシーといった、煩雑な運用ツールのメンテナンスを余儀なくされます。しかし、1 秒に満たないツール呼び出しを標準の Kubernetes Pod ライフサイクル経由でルーティングすると、リクエストごとに数秒の遅延が発生してしまいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate は、両方のアプローチを組み合わせています。高頻度の一時停止 / 再開は、専用設計されたデータプレーンを介してローカル ワーカー上で直接実行されます。一方、Kubernetes はマシンを管理し、自己修復ノード、フリートの自動スケーリング、クラスタの信頼性を制御するとともに、ワーカー Pod 自体のライフサイクルを司ります。標準の Pod セマンティクスを必要とするワークロードでは、Agent Sandbox やカーネル分離 Pod などの既存のプリミティブが引き続き並行して動作します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Google Cloud インフラストラクチャ向けに最適化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">100 万エージェント規模を実現できるエージェント プラットフォームを構築するには、適切な基盤となるコンピューティングとストレージのインフラストラクチャが必要です。GKE 上の Agent Substrate は、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-custom-compute-classes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">カスタム ComputeClass</span></a><span style=\"vertical-align: baseline;\"> を使用して、スポットプールやオンデマンド プールを含む、さまざまなシェイプやファミリーにわたるマシンプールを動的に管理することで、マシンの入手可能性と柔軟性を最大化します。これには、Google のカスタム Arm ベース プロセッサである Google Axion のネイティブ サポートが含まれます。Google Axion は、競合するクラウド サービスと比較して、サンドボックス ワークロードのコスト パフォーマンスを最大 30% 向上させます。ステートフルなワークスペースの場合、GKE 上の Agent Substrate を </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore エージェント ボリューム</span></a><span style=\"vertical-align: baseline;\">とオプションで統合できます。これは、NFS マウントをミリ秒単位でアタッチ / デタッチする新しいサービスで、エージェントをほぼ瞬時に開始 / 再開できます。また、ネイティブの Read-Write-Many（RWX）アクセスと POSIX 準拠のファイル ロックにより、書き込みの競合なしに安全なマルチエージェント コラボレーションを実現します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">スケーラブルな基盤上にエージェント プラットフォームを構築</strong></h3>\n<p><span style=\"vertical-align: baseline;\">本番環境向けのエージェント アプリケーションを構築する際、強固なセキュリティ、低レイテンシ、運用規模のいずれかを犠牲にする必要はありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">Nous Research は、OpenRouter において使用量世界第 1 位を誇る AI エージェントである Hermes を開発しています。Hermes は、生産性、コーディング、個人向け、CLI エージェントでも第 1 位にランクされています。Nous Research は、Agent Substrate の初期設計パートナーとして、エージェント ワークロードが導入する分離と ID の要件をランタイムがどのように処理するかを評価しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Hermes Enterprise は、お客様が既存のインフラストラクチャにデプロイできるようにすると同時に、エージェントごとの分離と拡張可能なアクセス制御を処理できるように構築されています。Agent Substrate は、プラットフォーム レイヤでこの両方に対処しつつ、貴重なコンピューティング リソースの消費も抑えます。Agent Substrate を使用した経験から、エージェント ワークロードの増加に合わせてアーキテクチャを効率的にスケールできると確信しています。」 - Nous Research、最高ビジネス責任者、Hervé Bizira 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate は、Kubernetes のマシンの復元力、自己修復ノード、宣言型管理を、カーネル分離、アクティブ時のみのコンピューティング、1 秒未満の実行のために構築されたエージェント ネイティブのデータプレーンと組み合わせることで、エンジニアリング チームに確実な拡張への道筋を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate はオープンソースであり、GKE をご利用のすべてのお客様が非本番環境ワークロードで利用できます。本番環境向けの一般提供サポートは、許可リストを通じてご利用いただけます。GKE クラスタにデプロイするには、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/install-overview-substrate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE 上の Agent Substrate に関するドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">詳細については、Agent Substrate について、または</span><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">オープンソース リポジトリ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- エンジニアリング担当バイス プレジデント、Alex Zakonov</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- エンジニア、Tim Hockin</span></p></div>"
