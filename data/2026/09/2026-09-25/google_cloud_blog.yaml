"entries":
  "ccb3e0803611dd130fd5de8cea99d5c6":
    "id": "ccb3e0803611dd130fd5de8cea99d5c6"
    "title": "Scribd, Inc. classifies more than 400 million documents with Gemini batch inference on Gemini Enterprise"
    "link": "https://cloud.google.com/blog/topics/customers/scribd-inc-classifies-millions-of-documents-on-gemini-enterprise/"
    "published": "2026-09-25 01:00:00"
    "fetched": "2026-09-25 03:12:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><a href=\"https://www.scribd.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scribd, Inc</span></a><span style=\"vertical-align: baseline;\">. is home to one of the world's largest collections of human-created content. </span></p>\n<p><span style=\"vertical-align: baseline;\">Scribd’s  products leverage one of the world's largest collections of human-created content and intelligent tools to help people move from information access to real understanding and application.</span></p>\n<p><span style=\"vertical-align: baseline;\">This past year, Scribd used Gemini's native PDF understanding and Gemini Enterprise batch prediction to run trust and safety classification across its entire user-generated content corpus of more than 400 million documents, spanning over 12 billion pages, in a matter of months.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Here were the results: </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Classified 400M+ user-uploaded documents (12B+ pages of text and images) across Scribd and Slideshare</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Completed the corpus-wide backfill in a matter of months, with Google Cloud scaling batch throughput to meet the timeline</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Native PDF input meant more than 99% of the corpus was processed as-is, with no OCR, rendering, or screenshotting pipeline to build</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise’s batch prediction at a 50% discount to interactive pricing made LLM classification viable at corpus scale</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Trust and safety at the scale of an entire corpus</span></h3>\n<p><span style=\"vertical-align: baseline;\">Scribd, Inc. is the parent company to four distinct products: Scribd, Slideshare, Everand, and Fable. Across Scribd and Slideshare, hundreds of millions of user-uploaded PDFs, presentations, and documents help people find information, build understanding, and finish projects. With that scale comes responsibility. We aim to balance access with protecting our communities. We leverage a mix of human and automated methods to review and best ensure the content on our platforms complies with our community rules. As the corpus continues to grow and technology evolves, this challenge requires even more resources.</span></p>\n<p><span style=\"vertical-align: baseline;\">Understanding a document requires reading its text and its images together, in context. Classification has to work across all possible use cases, all possible languages, all possible contexts. There is no single solution that can translate cleanly across all of it. And each policy area traditionally demanded its own specialized detection model, which meant either years of in-house engineering effort or specialized vendor solutions that don't fit the economics of a 400-million-document backfill. The team evaluated several off-the-shelf moderation tools and open models, but none delivered the quality they needed at their scale.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“This is a genuinely hard problem that we have been working on for a long time. Every category of content behaves differently, and historically each one required its own specialized solution. Gemini collapsed all of that into one model, one prompt, and one pipeline.”</span><span style=\"vertical-align: baseline;\"> – </span><span style=\"vertical-align: baseline;\">Sachin Sebastian, Senior Engineering Manager, Scribd, Inc.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why Gemini: PDFs are a first-class input</span></h3>\n<p><span style=\"vertical-align: baseline;\">The turning point was realizing that Gemini treats Scribd's corpus the way it actually exists: as PDFs. Gemini accepts PDF input natively and reads each page as both text and image, so a single multimodal model could evaluate everything from dense text documents to image-heavy presentations, with no OCR pipeline, page rendering, or screenshot infrastructure in between. Because Gemini processes each PDF page at a fixed, predictable token count, costs scale linearly and stay low even across 12 billion pages.</span></p>\n<p><span style=\"vertical-align: baseline;\">After benchmarking model families and versions, the team selected Gemini 2.5 Flash Lite as the classification workhorse, with Gemini 2.5 Pro serving as an LLM judge in a full second consistency pass over the corpus to validate output quality. In the team's evaluations, Gemini's multimodal understanding caught visual policy signals that text-only moderation endpoints routinely missed.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Gemini's peculiar advantage is that it meets our content in its native format. It reads the text, layout, and images of a PDF directly. More than 99% of our corpus went in exactly as it lives on our site without any pre-processing”</span><span style=\"vertical-align: baseline;\"> – </span><span style=\"vertical-align: baseline;\">Sachin Sebastian, Senior Engineering Manager, Scribd, Inc.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Batch prediction, simple enough to bet the corpus on</span></h3>\n<p><span style=\"vertical-align: baseline;\">The execution model was deliberately simple. Documents were staged in Cloud Storage, submitted to Gemini Enterprise batch prediction, and the results flowed back into the team's data platform for downstream analysis. There was no serving infrastructure to operate, no rate-limiting logic to write, and no GPU capacity to manage.</span></p>\n<p><span style=\"vertical-align: baseline;\">Batch pricing, at 50% below interactive rates, is what made the economics work at corpus scale. The team later layered on Gemini Enterprise’s implicit prefix caching, restructuring prompts so the static policy text hit the cache, which pushed efficiency further with no loss in classification quality.</span></p>\n<h3><span style=\"vertical-align: baseline;\">A partnership measured in throughput</span></h3>\n<p><span style=\"vertical-align: baseline;\">Processing 400 million documents is ultimately a throughput problem, and this is where the partnership with Google Cloud mattered most. Scribd's team connected directly with Google Cloud engineering and product to plan the backfill, advise on region strategy, and make sure the right capacity was in place ahead of launch.</span></p>\n<p><span style=\"vertical-align: baseline;\">As the backfill ramped up, Google Cloud worked closely with the team to scale throughput to the demands of the project. The effect was dramatic: batch jobs began completing far faster than projected, and for much of the run Gemini Enterprise was not the bottleneck. Scribd's own upstream pipeline was.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Google Cloud didn't just answer support tickets. They partnered with us on the backfill, and there were stretches where Gemini Enterprise finished work faster than our own systems could produce it. That is a good problem to have.”</span><span style=\"vertical-align: baseline;\"> – </span><span style=\"vertical-align: baseline;\">Sachin Sebastian, Senior Engineering Manager, Scribd, Inc.</span></p>\n<h3><span style=\"vertical-align: baseline;\">What's next</span></h3>\n<p><span style=\"vertical-align: baseline;\">The backfill is now the foundation of an ongoing program: newly uploaded content flows through the same Gemini classification pipeline, keeping the corpus continuously evaluated rather than periodically cleaned. And because the pattern of PDFs in Cloud Storage, Gemini batch prediction, and results in the lakehouse proved so operationally simple, the team is applying it to a growing set of content-understanding workloads across its platforms.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">“This project changed how we think about our roadmap. Work we had classified as multi-year, multi-team efforts is now a prompt, a batch pipeline, and a few weeks of runtime.” – </span><span style=\"vertical-align: baseline;\">Sachin Sebastian, Senior Engineering Manager, Scribd, Inc.</span></p>\n<hr />\n<p><em><sup><span style=\"vertical-align: baseline;\">This work was a collaboration between Google Cloud and Scribd. We'd like to thank everyone involved for their support throughout this project:</span></sup></em></p>\n<ul>\n<li><em><sup><strong style=\"vertical-align: baseline;\">Scribd Engineering:</strong><span style=\"vertical-align: baseline;\"> Anish Kumar, Jeanie Lam, James Watkins, Hima Alladi</span></sup></em></li>\n<li><em><sup><strong style=\"vertical-align: baseline;\">Scribd Applied Research:</strong><span style=\"vertical-align: baseline;\"> Rafael Pedrosa Lacerda de Melo, Kara Killough, Eric Chang</span></sup></em></li>\n<li><em><sup><strong style=\"vertical-align: baseline;\">Scribd Product:</strong><span style=\"vertical-align: baseline;\"> Seyoon Kim, Nicole Pauls</span></sup></em></li>\n<li><em><sup><strong style=\"vertical-align: baseline;\">Google Cloud AI Batch Inference team: </strong><span style=\"vertical-align: baseline;\">James Liu, Digvijay Singh, Wei-chung Wang, Yan Wang, Kun Shi </span></sup></em></li>\n<li><em><sup><strong style=\"vertical-align: baseline;\">Google Cloud Customer Engineer:</strong><span style=\"vertical-align: baseline;\"> Jennifer Liang</span></sup></em></li>\n</ul></div>"
  "52304376510a69cd8ca475db70f308ff":
    "id": "52304376510a69cd8ca475db70f308ff"
    "title": "Introducing GKE agentic migration for AI-assisted EKS-to-GKE migrations with built-in governance"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gke-agentic-migration/"
    "published": "2026-09-25 01:00:00"
    "fetched": "2026-09-25 03:12:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Enterprises are increasingly standardizing on Google Kubernetes Engine (GKE) to run their most critical and AI-driven workloads. From Cloud Storage FUSE for high-throughput data access to custom compute classes (CCC) and advanced GPU slicing, GKE provides the scale and efficiency required for modern applications.</span></p>\n<p><span style=\"vertical-align: baseline;\">However, migrating complex Kubernetes environments from AWS EKS to GKE has traditionally been a daunting, high-friction engineering endeavor. Your platform teams must manually dissect sprawling infrastructure-as-code (IaC), navigate cloud-specific architectural differences, and build custom translation scripts.</span></p>\n<p><span style=\"vertical-align: baseline;\">While your engineering teams often experiment with general-purpose LLMs to draft conversions, ad-hoc prompting quickly can become an operational trap. Raw models hallucinate non-existent resource properties, drop critical network or identity configurations, and lose context across interdependent files. The time platform engineers spend auditing, untangling, and debugging model errors ends up cannibalizing any upfront speed gains, creating manual toil and unpredictability. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are excited to announce the open-source release of GKE agentic migration, a purpose-built agent plugin that replaces brittle, ad-hoc prompting with an AI-assisted migration pipeline protected by deterministic guardrails. </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“For large enterprise clients, the biggest barrier to cloud modernization is execution risk and unpredictability. Unlike raw chat prompts that lose context and hallucinate configurations, Google’s GKE agentic migration pairs the speed of generative AI with the deterministic guardrails enterprises need: structured state persistence, multi-persona boundaries between platform and app teams, and non-negotiable human approval gates. It gives our global engineering practice a provable, compiler-grade migration factory that slashes delivery risk.- </span><strong style=\"font-style: italic; vertical-align: baseline;\">Rahul Shrivastava</strong><strong style=\"vertical-align: baseline;\">, </strong><strong style=\"font-style: italic; vertical-align: baseline;\">EVP, Persistent</strong></p>\n<h3><span style=\"vertical-align: baseline;\">The challenges of infrastructure migrations</span></h3>\n<p><span style=\"vertical-align: baseline;\">When talking to customers about their infrastructure migration journeys, we consistently hear about several governance challenges:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The automation trust gap: </strong><span style=\"vertical-align: baseline;\">Refactoring Kubernetes configurations manually can be agonizingly slow. Yet, using generic AI coding assistants introduces unacceptable risk. Standard LLMs can hallucinate infrastructure code, use deprecated API fields, or omit critical security rules. Generating code that is \"almost right\" simply shifts the bottleneck from writing code to debugging it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The danger of live cluster mutability (ClickOps): </strong><span style=\"vertical-align: baseline;\">Legacy migration tools often connect directly to live clusters and deploy via API calls. This bypasses the organization's Git repository (the true source of truth), breaks CI/CD pipelines, and makes rollbacks incredibly difficult.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The siloed handoff bottleneck:</strong><span style=\"vertical-align: baseline;\"> Migrations are often long-running, multi-week operations. Platform engineers build the landing zone and your application developers migrate the workloads.</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Standard AI tools lose context across the handoff.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The fragmented toolchain: </strong><span style=\"vertical-align: baseline;\">Backup tools like Velero are excellent for disaster recovery but capture exact AWS-specific configurations (like ALBs) without translating them for Google Cloud. Reverse-engineering tools, meanwhile, generate flat configurations that strip away the developer's original logical intent.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Introducing the GKE agentic migration</span></h3>\n<p><span style=\"vertical-align: baseline;\">The GKE agentic migration addresses these challenges by combining the reasoning capabilities of LLMs with strict, deterministic tooling. Designed as a compilation of agent skills and a local Model Context Protocol (MCP) server, it uses AI to translate complex AWS EKS IaC and Kubernetes manifests directly into GKE landing zones via automated Pull Requests.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here are the key capabilities that set the GKE agentic migration apart:</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. Hybrid verification</strong><span style=\"vertical-align: baseline;\"> —</span><strong style=\"vertical-align: baseline;\"> LLM-generated, deterministically validated. </strong><span style=\"vertical-align: baseline;\">To combat dangerous IaC hallucinations, LLM workers handle the complex authoring of Terraform and Kubernetes YAML, while the server runs deterministic transforms for exact mappings such as Workload Identity annotations and image registries. Crucially, these AI-generated translations are then submitted to strict deterministic validations (e.g., terraform validate, Kubernetes manifest contracts) before they are presented to the user. This approach helps maintain safety against hallucinations while gating everything behind human-in-the-loop (HITL) approval.</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. GitOps-native PR workflows: </strong><span style=\"vertical-align: baseline;\">The plugin never applies changes directly to a live cluster. Instead, it reads your source of truth, generates the target state, and opens a Pull Request. This helps route all changes through your standard human-in-the-loop (HITL) CI/CD review process. No \"ClickOps.\"</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. Protected separation of translation vs. transport:</strong><span style=\"vertical-align: baseline;\"> The plugin automates the tedious logic of architectural translation, but it intentionally does not transport stateful data. To protect your most sensitive assets, the plugin generates contextual runbooks that guide your team in using purpose-built, SLA-backed tools (like Google Cloud's Database Migration Service or Storage Transfer Service).</span></p>\n<p><strong style=\"vertical-align: baseline;\">4. Multi-persona state management:</strong><span style=\"vertical-align: baseline;\"> Migrations are team efforts. The plugin persists the long-running migration state.  This enables protected, asynchronous handoffs: Platform engineers establish the baseline landing zone, while app developers independently join the workspace from their own machines to translate individual workloads within permission-isolated folders.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How it works: The migration lifecycle</span></h3>\n<p><span style=\"vertical-align: baseline;\">Under the hood, the GKE agentic migration utilizes a migration state graph of executable functions, systematically passing context down the chain. Packaged as an open-source agent plugin, there are no custom CLI binaries to install and no central control planes to manage — your team collaborates through your existing development harness, delivering validated pull requests and actionable runbooks directly into your source repositories.</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">This provides:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Deep EKS repository discovery:</strong><span style=\"vertical-align: baseline;\"> The plugin clones the source Git repository or performs a live scan of your EKS cluster, programmatically indexes the source manifests, maps dependencies, and builds an inventory</span></li>\n<li><strong style=\"vertical-align: baseline;\">Assessment &amp; blocker governance:</strong><span style=\"vertical-align: baseline;\"> It generates a readiness report identifying architectural incompatibilities. Before design can unlock, every blocker must have an assigned owner and target resolution date. The Platform Engineer signs off on the migration boundaries before translation begins.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Landing zone design:</strong><span style=\"vertical-align: baseline;\"> The plugin scaffolds the foundational Google Cloud Terraform modules (VPC, subnets, GKE cluster, org policies) based on explicit platform decisions (such as GKE Autopilot vs. GKE Standard).</span></li>\n<li><strong style=\"vertical-align: baseline;\">AI-assisted cloud translation:</strong><span style=\"vertical-align: baseline;\"> The plugin handles proprietary shifts, including translating AWS IRSA to Workload Identity, mapping ALB ingress to the Gateway API, and converting Karpenter node claims to GKE Node Auto Provisioning (NAP) or Custom Compute Classes (CCC).</span></li>\n<li><strong style=\"vertical-align: baseline;\">Offline validation</strong><span style=\"vertical-align: baseline;\">: Generated modules and manifests are compiled and verified offline (terraform validate, manifest structure checks, and output contracts). </span></li>\n<li><strong style=\"vertical-align: baseline;\">Deployment</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">via Pull Request:</strong><span style=\"vertical-align: baseline;\"> The finalized configuration is verified locally and opens a PR for review. </span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Getting</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">started</span></h3>\n<p><span style=\"vertical-align: baseline;\">The GKE agentic migration transforms cloud migrations from disjointed refactoring exercises into predictable, AI-assisted, and reviewable GitOps workflows. </span><strong style=\"vertical-align: baseline;\">Ready to accelerate your journey to GKE?</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Star and clone the </span><a href=\"https://github.com/gke-labs/gke-agentic-migration\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE agentic migration repository on GitHub</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Read the </span><a href=\"https://github.com/gke-labs/gke-agentic-migration/tree/main/docs/onboarding-guide.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">onboarding guide</span></a><span style=\"vertical-align: baseline;\"> to run the plugin against a sample EKS repository.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Join the </span><a href=\"https://cloud.google.com/communities\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Community</span></a><span style=\"vertical-align: baseline;\"> to share feedback, ask questions, and contribute. </span></p>\n</li>\n</ul></div>"
  "997a2373bf761f34f2a870d8589fff29":
    "id": "997a2373bf761f34f2a870d8589fff29"
    "title": "Power your agents: Gemini 3.8 Live with Live Avatar is now generally available"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-3-8-live-with-live-avatar-is-now-generally-available/"
    "published": "2026-09-25 00:00:00"
    "fetched": "2026-09-25 03:12:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Following our </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-gemini-3-8-live-extended-thinking/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announcement</span></a><span style=\"vertical-align: baseline;\"> of Gemini 3.8 Live and Gemini 3.8 Live Extended Thinking last week, we are thrilled to share that </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-with-live-avatar/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar</span></a><span style=\"vertical-align: baseline;\"> is now generally available in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">. First previewed at Google Cloud Next 2026</span><span style=\"vertical-align: baseline;\">, the technology is now officially ready for enterprise production.</span></p>\n<p><span style=\"vertical-align: baseline;\">As enterprise voice AI evolves beyond basic speed and cost metrics, our priority has shifted to making each interaction even higher quality. Gemini 3.8 Live already delivers a native speech-to-speech foundation for fluid, responsive dialogue. The Live Avatar feature brings an interactive visual presence to conversational video agents across web, mobile, and interactive kiosks. Together, you’ll have access to:  </span></p>\n<ol>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Video avatars: </strong><span style=\"vertical-align: baseline;\">Conversational video with the Live Avatar </span><span style=\"vertical-align: baseline;\">feature can generate video avatars with synchronized lip-syncing. Note: Custom avatar feature is available via allowlist only.  </span> </span></li>\n<li><strong style=\"vertical-align: baseline;\">Fluid dialogue: </strong><span style=\"vertical-align: baseline;\">Native speech-to-speech means more natural interruption recovery without dropping conversation context or backend transactions.</span></li>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Tool calling: </strong><span style=\"vertical-align: baseline;\">It executes tools and API calls in the background while continuing the conversation, so the model can acknowledge requests and keep chatting while tasks finish in the background.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Breaks language barriers: </strong><span style=\"vertical-align: baseline;\">Gemini 3.8 Live understands and speaks 97 languages, with automatic language detection.</span></span></li>\n<li><strong style=\"vertical-align: baseline;\">Make it easy for agents to see what your user sees: </strong><span style=\"vertical-align: baseline;\">Live visual understanding can process live camera feeds and screen shares alongside audio, all at the same time. </span></li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Though Gemini 3.8 Live Extended Thinking remains in private preview, </span><strong style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar is now available</strong><span style=\"vertical-align: baseline;\"> with US and EU endpoints, with provisioned throughput, enterprise compliance, and strict data governance. Try the model and its features in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">, and start building now with </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Trust and transparency at its core</strong></p>\n<p><span style=\"vertical-align: baseline;\">To safeguard identity and prevent misuse, customers can deploy from a library of curated, pre-built avatars, while custom avatar creation is gated behind a strict enterprise allowlisting and verification process. Furthermore, all generated audio and video streams carry imperceptible SynthID watermarks, ensuring AI-generated content remains transparent and verifiable.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Three demos of Gemini 3.8 Live with Live Avatar in action</span></h3>\n<p><strong style=\"vertical-align: baseline;\">#1: Interactive custom avatar</strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=oVG-5BF-dWo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 3.8 Live with Live Avatar</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=oVG-5BF-dWo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Create an interactive custom avatar in a step-by-step process </span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">Watch how Gemini 3.8 Live makes it possible to build a custom avatar by adding system instructions, uploading a single reference photo and audio file sample.  </span></p>\n<p><strong style=\"vertical-align: baseline;\">Demo #2: Live video understanding in a voice-first claims intake </strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=QXiJfxdcSgo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 3.8 Live demo for insurance claim agent</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=QXiJfxdcSgo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Streamline claims intake with live video understanding using Gemini 3.8 Live</span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">In this demo, you’ll see a common use case come to life using Gemini 3.8 Live: an intake agent. <span style=\"vertical-align: baseline;\">In this scenario, we chose an insurance claims agent. </span>You talk and show the damage on camera, and the claim notebook fills itself in as you go. In the background, an ADK agent team checks the policy, applies the intake rules, and builds the adjuster packet. To dive deeper, check out the </span><a href=\"https://github.com/Shubhamsaboo/awesome-llm-apps/tree/main/voice_ai_agents/insurance_claim_live_agent_team\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source code</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><strong style=\"vertical-align: baseline;\">#3: A real-time voice AI agent with Google ADK and Gemini Live API</strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=yQEKMsCtsmE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Build a real-time voice AI agent with Google ADK and Gemini Live API</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=yQEKMsCtsmE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Build a live voice agent using Google ADK and Gemini Live API</span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">See how developers can use </span><a href=\"https://adk.dev/live/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit </span></a><span style=\"vertical-align: baseline;\">(ADK) to define agents, manage runners and session memory, and stream real-time audio directly to the Gemini Live API without a traditional speech-to-text pipeline.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How our customers are innovating with Gemini 3.8 Live with Live Avatar</span></h3></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"4 autotrader\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_autotrader.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Cox Automotive built an AI-powered shopping assistant for Autotrader that uses live screen-highlighting and tool-calling capabilities to guide car shoppers through vehicle search, comparison, and financing — in real time, through natural conversation.</p><p>“Shoppers increasingly expect to describe what they need in their own words rather than work through filters and menus. Autotrader’s new conversational AI Avatar brings that experience to vehicle discovery by matching natural conversation to the right inventory. It is another step toward our vision of connected intelligence, where every consumer interaction draws on the full depth of Cox Automotive data.” — Marianne Johnson, EVP and Chief Product Officer, Cox Automotive.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=0pS0I7mhv10\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Autotrader AI-powered shopping assistant | Gemini 3.8 Live with Live Avatar</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=0pS0I7mhv10\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"6 equal ai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/6_equal_ai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We're building a personal AI that knows you, speaks your language, and is always on your side. Today, it handles over a million live calls daily across nine Indian languages. Gemini 3.8 Live improved interruption handling, multilingual conversations, and tool-call reliability. This AI doesn't just answer calls; it gets things done for you.” — Akhilesh Damaraju, CEO, Equal AI.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"7 salesforce\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/7_salesforce.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We're excited that Gemini 3.8 Live and Agentforce are coming together to reimagine what's possible in intelligent service. This collaboration between Salesforce AI Research and Google combines real-time, multimodal capabilities with agentic AI to explore new ways to create richer, more intuitive customer experiences from first contact to resolution.\" — Bob Van Osten, VP of Product for Agentforce, Salesforce.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=1x8UAK9demI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Salesforce&#x27;s Agentforce and Gemini 3.8 Live</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=1x8UAK9demI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"9 specs\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/9_specs.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“Our team has been very impressed with Gemini 3.8 Live throughout testing and benchmarking! The updates made to Voice Activity Detection and the improvements to overall latency are huge steps forward and further our ability to deliver the highest quality AI Assistant on the SPECS platform.” — Eric Walsh, Software Engineer, Specs.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Start building today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar are available now for enterprise customers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Try the model in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Access the Gemini Live API </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> for integration guides</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review pricing on our </span><a href=\"https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pricing page</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google-gemini/gemini-skills/blob/main/skills/gemini-live-api-dev/SKILL.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Skill</span></a><span style=\"vertical-align: baseline;\"> for building real-time, bidirectional streaming apps with the Gemini Live </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If your application requires specialized, modular audio capabilities, explore our other audio models:  </span></p>\n<ul>\n<li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-5-transcribe/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Transcribe</span></a></li>\n<li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-live-3-5-translate/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Live Translate</span></a></li>\n<li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-text-to-speech/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash-Lite TTS and Gemini 3.8 Flash TTS</span></a></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Reach out to your Google Cloud sales representative to activate provisioned throughput, discuss customized deployment architectures and allowlisting for custom avatar.</span></p></div>"
  "c8017cc7cb3b9350ac6b970173e510ab":
    "id": "c8017cc7cb3b9350ac6b970173e510ab"
    "title": "Google is a Leader in the 2026 Gartner Magic Quadrant for Container Management"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/2026-gartner-magic-quadrant-for-container-management/"
    "published": "2026-09-25 04:00:00"
    "fetched": "2026-09-25 06:58:22"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We’re excited and proud to share that Gartner has recognized </span><strong style=\"vertical-align: baseline;\">Google as a Leader for the fourth year in a row in the 2026 Gartner® Magic Quadrant™ for Container Management</strong><span style=\"vertical-align: baseline;\">, based on its Completeness of Vision and Ability to Execute. Google was positioned </span><strong style=\"vertical-align: baseline;\">highest in Ability to Execute of all vendors evaluated</strong><span style=\"vertical-align: baseline;\"> and we believe this validates the success of our mission to deliver a container platform that’s highly optimized for both performance and efficiency. We help global customers to build and run their most demanding and complex workloads at scale, including the next generation of AI and agentic applications. </span></p>\n<p><span style=\"vertical-align: baseline;\">In the accompanying </span><a href=\"https://www.gartner.com/interactive/cc/8353849\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 Gartner Critical Capabilities for Container Management</span></a><span style=\"vertical-align: baseline;\"> report, Google Cloud was ranked first in every use case: New Cloud Native Applications, Containerized Existing Applications, AI Training, AI Inference, Edge Applications, and Hybrid Applications.</span></p>\n<p><span style=\"vertical-align: baseline;\">Gartner predicts<sup>1</sup></span><span style=\"vertical-align: baseline;\"> that “By 2028, 95% of new AI deployments will use Kubernetes, up from less than 30% in 2025.” Containers power today’s most innovative apps and businesses — and deliver the infrastructure customers demand as they transform their businesses in the agentic era.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2026 Gartner Magic Quadrant for Container Management\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2026_Gartner_Magic_Quadrant_for_Container_.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Cloud spearheaded the industry-wide cloud-native revolution when we introduced Kubernetes in 2014 and launched Google Kubernetes Engine (GKE), the world’s first managed Kubernetes service, in 2015. Our commitment to container platforms and the vibrant, innovative Kubernetes ecosystem has only grown stronger and deeper since. Alongside GKE, our serverless container platforms GKE Autopilot and Cloud Run dramatically lower operational costs and help developers deliver amazing containerized apps faster than ever before. </span></p>\n<p><span style=\"vertical-align: baseline;\">The massive acceleration in enterprise AI has inspired us to redefine infrastructure management for the AI era. In 2026 so far we’ve introduced a wide range of foundational improvements to shift GKE and Cloud Run into agent-native, high-performance platforms designed for autonomous AI systems, massive inference workloads, and secure runtime isolation. Whether you’re training AI at the frontier, launching an AI startup, or leading your enterprise AI transformation, we have the container platform you need. Important highlights include:</span></p>\n<h3><span style=\"vertical-align: baseline;\">Delivering leading performance and efficiency for AI infrastructure</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE predictive latency boost:</strong><span style=\"vertical-align: baseline;\"> Built into the </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/whats-new-in-gke-at-next26\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\">, this ML-driven capability uses capacity-aware routing rather than static configurations to reduce Time-to-First-Token (TTFT) by up to 70%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE automatic KV Cache storage tiering: </strong><span style=\"vertical-align: baseline;\">Automatically shifts KV cache data across RAM, Local SSD, and Cloud Storage. This reduces memory bottlenecks, improving TTFT by 40% via RAM offloading and increasing throughput by 70% via Local SSDs for large prompt contexts. [</span><a href=\"https://cloud.google.com/blog/topics/google-cloud-next/google-cloud-next-2026-wrap-up\"><span style=\"text-decoration: underline; vertical-align: baseline;\">1</span></a><span style=\"vertical-align: baseline;\">]</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE accelerated container and model startups: </strong><span style=\"vertical-align: baseline;\">GKE node spin-up times are up to 4x faster, and pod startup speeds have improved by up to 80%. Additionally, native run:AI Model Streamer integration pulls heavy models from Cloud Storage 5x faster.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run on-demand serverless GPU scale-to-zero:</strong><span style=\"vertical-align: baseline;\"> Cloud Run supports NVIDIA RTX PRO 6000 Blackwell GPUs, allowing teams to serve 70B+ parameter models on-demand. Your services can go from zero to a fully provisioned GPU — with all drivers pre-installed — in under 5 seconds. Once active inference or fine-tuning runs complete, Cloud Run automatically scales instances back to zero, eliminating idle infrastructure costs.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Evolving Kubernetes for agentic infrastructure security and scale</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Agent Substrate: </strong><span style=\"vertical-align: baseline;\">As an open-source, secure-by-default agent execution runtime, </span><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> is engineered to run millions of sandboxes with </span><strong style=\"vertical-align: baseline;\">10x higher density than standard container runtimes</strong><span style=\"vertical-align: baseline;\">. Purpose-built for the era of autonomous agents, Substrate delivers </span><strong style=\"vertical-align: baseline;\">sub-500ms resume operations </strong><span style=\"vertical-align: baseline;\">at over </span><strong style=\"vertical-align: baseline;\">500 suspend/resume activations per second</strong><span style=\"vertical-align: baseline;\"> with a native zero-trust kernel and network isolation. Agent Substrate is available as an open-source solution that runs on any Kubernetes infrastructure and is optimized for GKE.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Agent Sandbox: </strong><span style=\"vertical-align: baseline;\">Built on gVisor kernel-isolation technology, </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> isolates the host environment from untrusted, multi-agent AI code execution. It provides secure execution at scale, processing up to </span><strong style=\"vertical-align: baseline;\">300 sandboxes per second</strong><span style=\"vertical-align: baseline;\"> with sub-second latency and delivering up to 30% better price-performance when running on Axion processors than comparable hyperscaler cloud providers. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Dataplane V2 scalability limits: </strong><span style=\"vertical-align: baseline;\">Architectural capacity bounds for GKE clusters implementing active NetworkPolicies doubled from 7,500 nodes to </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/planning-large-clusters\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">15,000 nodes per cluster</strong></a><span style=\"vertical-align: baseline;\">, supporting the massive infrastructure needs of large enterprise and AI customers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE intent-based autoscaling:</strong><span style=\"vertical-align: baseline;\"> GKE can now natively autoscale horizontally using application intent and custom metrics beyond basic hardware metrics. This reduces resource allocation reaction times from </span><strong style=\"vertical-align: baseline;\">25 seconds down to just 5 seconds</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Filestore agent volumes</strong></a><span style=\"vertical-align: baseline;\">: a new offering that attaches and detaches NFS mounts in milliseconds, allowing agents to start/resume near-instantaneously, along with native Read-Write-Many (RWX) access and POSIX-compliant file locking to enable safe multi-agent collaboration without write collisions. </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Next-gen developer experience with serverless containers</span></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you’re hosting a standard web API, running a heavy batch data job, processing an asynchronous message queue, or deploying a complex AI agent, Cloud Run handles it all under a single, unified serverless model that delivers an unmatched developer experience and maximum engineering velocity. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">One-click prototyping in Google AI Studio: </strong><span style=\"vertical-align: baseline;\">You can build and deploy full-stack applications directly within Google AI Studio, making it an exceptional environment for rapid prototyping and experimentation. With a single click, you can instantly package and publish your vibe-coded applications to Cloud Run.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run instances:</strong><span style=\"vertical-align: baseline;\"> This new primitive manages individual, addressable, long-running singleton resources with integrated Cloud Storage volume mounts, allowing persistent background agents like OpenClaw to be deployed cost-effectively. With baseline shared-CPU configurations starting at a highly predictable flat rate of ~$5.70 per month (for 1 vCPU and 1 GiB of RAM), Cloud Run instances delivers an always-on, VM-like experience while bypassing the idle-cost penalties and operational overhead of traditional VMs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run sandboxes:</strong><span style=\"vertical-align: baseline;\"> Hard-isolated environments spin up in under 500 milliseconds to safely execute untrusted, model-generated code, protecting the host system from unauthorized access.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Take the next steps</span></h3>\n<p><span style=\"vertical-align: baseline;\">As we reach for new heights of performance, security, and scale for our container platforms, we continue to build the future in the open. We invite you to explore Agent Sandbox and Agent Substrate today. We can’t wait to shape the future of agent infrastructure together with our customers and partners. Check out these resources to continue your learning journey:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Download your complimentary copy of the </span><a href=\"https://cloud.google.com/resources/content/2026-gartner-mq-for-container-management\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">2026 Gartner® Magic Quadrant™ for Container Management</strong></a><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Try</span> <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> on GKE.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Contribute: Join the Agent Sandbox </span><a href=\"http://github.com/kubernetes-sigs/agent-sandbox\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source community</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore </span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Join us at </span><a href=\"http://goo.gle/KubeConSLC26\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">KubeCon North America 2026</span></a><span style=\"vertical-align: baseline;\"> in Salt Lake City, November 9-12. For even more fun, arrive a day early for GKE Day on November 9.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Discover why Google is also named a Leader in the </span><a href=\"https://cloud.google.com/blog/products/application-development/2026-gartner-mq-for-cloud-native-application-platforms?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 Gartner® Magic Quadrant™ for Cloud-Native Application Platforms</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Start building the future of serverless applications today at </span><a href=\"http://cloud.run\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">cloud.run</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\"><span style=\"vertical-align: baseline;\">1. <span style=\"vertical-align: baseline;\">Gartner report: </span><a href=\"https://www.gartner.com/interactive/cc/8353849\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Critical Capabilities for Container Management, 8 September 2026</span></a></span></span></span></sup></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Gartner, Magic Quadrant for Container Management, Dennis Smith, et al, 2 September 2026<br /></span></span></sup><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Gartner, Critical Capabilities for Container Management, By Tony Iams, Wataru Katsurashima, Lucas Albuquerque, Dennis Smith, Bhuvie Chhabra, 8 September 2026. <br /></span></span></sup><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Gartner and Magic Quadrant are trademarks of Gartner, Inc. and/or its affiliates.<br /></span></span></sup><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Disclaimer: Gartner does not endorse any company, vendor, product or service depicted in its publications, and does not advise technology users to select only those vendors with the highest ratings or other designation. Gartner publications consist of the opinions of Gartner’s business and technology insights organization and should not be construed as statements of fact. Gartner disclaims all warranties, expressed or implied, with respect to this publication, including any warranties of merchantability or fitness for a particular purpose.</span></span></sup></p></div>"
  "2c9e5c75c2f56f6ff4581a1df893e04e":
    "id": "2c9e5c75c2f56f6ff4581a1df893e04e"
    "title": "Agent Factory recap: Agent harnesses, shifting left, and autonomous coding"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/agent-factory-recap-agent-harnesses-shifting-left-and-autonomous-coding/"
    "published": "2026-09-25 08:00:00"
    "fetched": "2026-09-25 09:24:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In this episode of </span><a href=\"https://www.youtube.com/playlist?list=PLIivdWyY5sqLXR1eSkiM5bE6pFlXC-OSs\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">The Agent Factory</span></a><span style=\"vertical-align: baseline;\">, we explore the reality of building with autonomous agents alongside Ryan Lopopolo, a software engineer at Google Cloud and the person who coined the term </span><a href=\"https://cloud.google.com/discover/agent-harness?e=48754805\"><strong style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">agent harness</strong></a><span style=\"vertical-align: baseline;\">. From throwing out manual code editors to treating team collaboration like leveling up RPG stats, Ryan breaks down how grounding models in rich context and shifting interventions left unlocks high levels of agent autonomy.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=F8EZJAm9iO8\">\n\n      \n        <img alt=\"Harness Engineering Explained: Inside the Stack Behind Antigravity, Claude Code &amp; Cursor\" src=\"https://img.youtube.com/vi/F8EZJAm9iO8/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=F8EZJAm9iO8\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This post guides you through the key ideas from our conversation. Use it to quickly recap topics or dive deeper into specific segments with links and timestamps.</span></p>\n<h2><span style=\"vertical-align: baseline;\">The Agent Harness - What is it?</span></h2>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://www.youtube.com/watch?v=F8EZJAm9iO8&amp;t=30s\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">00:30</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">An <em>AI agent</em> as we're defining it here is a large language model (LLM) plus an </span><a href=\"https://cloud.google.com/discover/agent-harness?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agent harness</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Think of the harness as everything wrapped around the LLM that isn't the model itself. For example, if you're working in </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\"> using </span><a href=\"https://antigravity.google/blog/gemini-3-8-flash-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash</span></a><span style=\"vertical-align: baseline;\">, Gemini Flash is the LLM and Google Antigravity is the harness.</span></p>\n<p><span style=\"vertical-align: baseline;\">While an unassisted model can answer simple questions out of the box, it can't check live conditions or interact with your workspace on its own. When a user asks a question like </span><span style=\"font-style: italic; vertical-align: baseline;\">\"Why is the sky blue?\"</span><span style=\"vertical-align: baseline;\">, an unassisted LLM can respond without issue. However, when asked a question like </span><span style=\"font-style: italic; vertical-align: baseline;\">\"Should I wear a raincoat today?\"</span><span style=\"vertical-align: baseline;\">, the model can't answer on its own because it lacks the necessary data. The harness catches the intent, queries live weather tools, bundles that context back into the prompt, and hands it to the model to produce an informed answer.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Ryan Lopopolo on agent harnesses and autonomous coding</span></h2>\n<p><span style=\"vertical-align: baseline;\">Tilde Thurium sat down with Ryan Lopopolo to discuss what it takes to run fully autonomous coding workflows in production. See the summary below!</span></p>\n<h3><span style=\"vertical-align: baseline;\">Coining the harness and writing zero production code</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://www.youtube.com/watch?v=F8EZJAm9iO8&amp;t=142s\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">02:22</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">The term <em>agent harness</em> grew out of Ryan's extensive work on autonomous coding agents, culminating in a </span><a href=\"https://openai.com/index/harness-engineering/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">February 2026 essay</span></a><span style=\"vertical-align: baseline;\"> on leveraging coding models in an agent-first world. Ryan shared that he hasn't opened a traditional code editor since May of last year, maintaining that streak through his transition into </span><a href=\"https://cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud</span></a><span style=\"vertical-align: baseline;\">. In this paradigm, engineers no longer author or review individual lines of syntax; instead, they operate at the level of natural language specifications and inspect the final artifacts, such as pull requests, documents, and spreadsheets. Then they determine whether the end result meets organizational standards.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Harness engineering is the study and the practice of putting a model into an environment where it can succeed. If you don&#x27;t do that work, you end up doing what I call &#x27;prompt and pray&#x27;.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Ryan Lopopolo</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Context curation and lazy prompting</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=dZGjT_rG5fiLeVfm&amp;t=215\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">03:35</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Upfront harness investment pays off by allowing engineers to become lazy prompters. When the repository contains structured documentation, clear interfaces, and discoverable tools, you do not need to paste walls of text into a prompt box every morning </span></p>\n<p><em>\"I aspire to be an incredibly lazy prompter. If I have done the job to give the model the tools and context it needs to ground itself, I don't need to write a long prompt. It figures it out.\"</em></p>\n<p><span style=\"vertical-align: baseline;\">The model uses its harness to pull relevant context, allowing it to navigate large codebases and execute complex tasks without oversight.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Shifting left: engineering best practices as autonomous guardrails</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://www.youtube.com/watch?v=F8EZJAm9iO8&amp;t=300s\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">05:00</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">When an agent fails, developers face a whole spectrum of interventions. The most common reflex is to fiddle with the prompt or retry, but that never scales across a team.</span></p>\n<p><em>\"The simplest, smooth-brain, stupidest intervention I can think of is literally just: try my prompt again without changing anything else. But shifting left means moving interventions earlier into the development lifecycle where they are cheapest and automated: from prompts, to repo docs, to linters, to tests, and all the way to upstream evals.\"</em></p>\n<p><span style=\"vertical-align: baseline;\">Instead of hoping the model guesses right on the next turn, shifting left embeds standards directly into the environment. Linters, tests, and </span><span style=\"vertical-align: baseline;\">AGENTS.md</span><span style=\"vertical-align: baseline;\"> files act as durable memory and enforcement of what you think good looks like, making sure the agent stays on the rails without needing constant hand-holding.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Leveraging established tools and determinism</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=0K18aWfjWSkEv0Ws&amp;t=410\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">06:50</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Agents shine when they're handed tools that already mirror patterns heavily represented in pre-training data. Pairing models with standard command-line interfaces moves reasoning into determinism, shifting the burden of context aggregation away from the model and onto reliable tools.</span></p>\n<p><span style=\"vertical-align: baseline;\">Ryan also shared an environmental design trick for context efficiency: structuring markdown files so link anchors sit directly beneath their corresponding prose blocks rather than inline. This prevents context clutter and mitigates \"lost in the middle\" retrieval issues. Because Ryan operates exclusively by reviewing end-state artifacts, keeping documentation readable allows him to easily inspect execution runs:</span></p>\n<p><em>\"I want to be able to look at the pull request and review it. If it made a bad decision, I need to know where it went off the rails so I can whack the agent on the head and make sure it does not make that same mistake again.\"</em></p>\n<h3><span style=\"vertical-align: baseline;\">Long horizons and expanding the agentic loop</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=o3r4mie7FkoYLTTS&amp;t=586\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">09:45</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">The central challenge of harness engineering is ensuring that agents cohere over long time horizons. Because human organizations produce software through iterative refinement rather than single-shot prompts, agent workflows must mirror that cadence. Harness engineering uses tightly scoped, reviewable pull requests to narrow the agent's state space. Stacking these high-confidence changes end-to-end allows supervisors to gradually expand the loop size, building trust until agents can autonomously execute large-scale initiatives, including entire language migrations </span></p>\n<h3><span style=\"vertical-align: baseline;\">Curating agent teams like RPG stats</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=1l25hbXKZjjKoLsh&amp;t=718\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">11:58</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Rather than divvying up sprint tasks based on individual specialties, having a diverse team contribute to an agent turns it into a central producer of work that carries everyone's strengths. Ryan compared leveling up an agent's capabilities to building out a character sheet:</span></p>\n<p><em>\"[It's like] building out the stats of your RPG character. I get a new person on the team who is a React architect and boom! The attention that they pay is able to bump out the stats in front-end architecture and performance.\"</em></p>\n<p><span style=\"vertical-align: baseline;\">With that collective expertise baked into the environment, the agent can autonomously classify incoming work and activate the exact skills it needs on demand, operating as both a backend architect and a front-end specialist.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Accruing leverage in tools, not custom harnesses</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=giil4EL8zs3RDif-&amp;t=878\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">14:38</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">For developers wondering whether to build their own custom agent harness, Ryan offered clear advice: don't build one from scratch. Standard harnesses already provide the foundational primitives: file reading, grep search, and command execution. Over-scaffolding an agent with rigid, bespoke frameworks creates technical debt and leads to sunk-cost traps when frontier models advance.</span></p>\n<p><em>\"If you focus all of your efforts on improving quality on tools and context, you can freely adopt the newest models as they come out and you'll be constantly accruing leverage into a bit of the system that will never become obsolete.\"</em></p>\n<h3><span style=\"vertical-align: baseline;\">Operating Google Cloud and eliminating capability overhang</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=MlXgcYa5QcQqOogM&amp;t=1007\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">16:47</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Discussing his work at </span><a href=\"https://cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud</span></a><span style=\"vertical-align: baseline;\">, Ryan outlined his motivation to eliminate <em>capability overhang</em>: the delta between what frontier AI models are theoretically capable of and how much useful work is currently extracted in production. Because the cloud functions as a massive, programmable surface, equipping agents with direct interfaces to Google Cloud lets them manage and deploy infrastructure effectively, turning raw model capability into tangible enterprise utility.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Continually updating your priors on AI</span></h3>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=NSFTXZjs6QvgCFiM&amp;t=1093\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">18:13</span></a><span style=\"font-style: italic; vertical-align: baseline;\">]</span></p>\n<p><span style=\"vertical-align: baseline;\">The speed of AI development requires engineers and teams to actively unlearn old limitations and constantly reassess what these models can achieve. \"</span><span style=\"font-style: italic; vertical-align: baseline;\">It's very important to continually be updating what you think is possible with these lovely tools that we have</span><span style=\"vertical-align: baseline;\">,\" Ryan urged. What broke six months ago often runs effortlessly on today's frontier models. Rather than getting locked into rigid workflows, developers should build around the two highly extensible interfaces that will remain relevant across every model upgrade: tools and context.</span></p>\n<p><em>\"Agents will always need context in order to do that last mile adaptation into what you think good is. And as you can continue to... shift it to the left, in terms of increasingly capable tools which act as a form of memory and enforcement of what you think good looks like, you'll continually be amazed as the models are able to do more and more interesting things for you over time.\"</em></p>\n<h2><span style=\"vertical-align: baseline;\">How To Build A Custom Harness</span></h2>\n<p><span style=\"vertical-align: baseline;\">Next, </span><a href=\"https://www.linkedin.com/in/billyjacobson/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Billy Jacobson</span></a><span style=\"vertical-align: baseline;\"> started us off by showing how developers can customize their own agent harnesses for specific tasks.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Under the hood: Why build a custom harness?</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://www.youtube.com/watch?v=F8EZJAm9iO8&amp;t=1184s&amp;pp=0gcJCWMAwfN6Pr3D\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">19:44</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Before jumping into code, Billy unpacked why developers should understand the mechanics of a harness rather than treating it like a black box. Recalling advice from an engineering mentor that </span><span style=\"font-style: italic; vertical-align: baseline;\">\"You can just use the framework, but a great engineer will really understand the framework\"</span><span style=\"vertical-align: baseline;\">, Billy explained that building a </span><a href=\"https://cloud.google.com/discover/agent-harness?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">harness</span></a><span style=\"vertical-align: baseline;\"> yourself is the best way to debug what happens when an agent breaks. You can evaluate three core design decisions for every workflow:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Looping</strong><span style=\"vertical-align: baseline;\">: How many iterations should the agent run, and what conditions trigger an exit state?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tools</strong><span style=\"vertical-align: baseline;\">: What specific tools should the agent access, and when and how should it invoke them?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Memory</strong><span style=\"vertical-align: baseline;\">: How important is conversational and operational memory, and when should it be retrieved or compacted?</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Linear Agent Harness: Deterministic Single-Pass Execution</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=teRfnEVBrXQa0DBl&amp;t=1234\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">21:34</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Billy demonstrated a minimalist </span><a href=\"https://docs.cloud.google.com/architecture/choose-design-pattern-agentic-ai-system#sequential-pattern\"><span style=\"text-decoration: underline; vertical-align: baseline;\">linear harness</span></a><span style=\"vertical-align: baseline;\"> designed for deterministic workflows where looping is unnecessary. This pattern is ideal for targeted inspections, file transformations, or single-turn data analyses where you want a high level of determinism and need the agent to perform the exact same execution flow every single time.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Closed-Loop Agent Harness: Iterative Test-Driven Repair</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=SZK9VsaI6x4FpKXT&amp;t=1365\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">22:45</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">When tasks demand active bug fixing and refactoring, a </span><a href=\"https://docs.cloud.google.com/architecture/choose-design-pattern-agentic-ai-system#loop-pattern\"><span style=\"text-decoration: underline; vertical-align: baseline;\">closed-loop harness</span></a><span style=\"vertical-align: baseline;\"> provides the iterative reasoning required to reach a verified resolution. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this demo, Billy showcased an agent that applies an automated code edit to address a failing requirement, and the harness executes the unit test suite against the updated codebase. If the tests fail, the runtime captures standard failure logs and detailed stack traces, feeding those error diagnostics directly back into the agent's working memory. The process repeats continuously until all unit tests pass, backed by a five-iteration ceiling to prevent infinite loops and runaway execution costs.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Guardrail Harness with Google's Agent Development Kit (ADK)</span></h3>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=iyoPxuMlAkYkrrls&amp;t=1405\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">23:25</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">For developers who require custom behavior without rewriting core orchestration plumbing from scratch, Google's </span><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit <span style=\"vertical-align: baseline;\">(ADK)</span></span></a><span style=\"vertical-align: baseline;\"> provides scaffolding with automated memory management and execution safeguards. </span></p>\n<p><span style=\"vertical-align: baseline;\">Billy walked through an example that leverages ADK's native context compaction to summarize older conversational turns, preventing context window bloat during extended debugging runs. Custom interception hooks inspect and filter shell actions before execution, automatically stopping high-risk operations such as recursive file deletions, database drops, or unauthorized remote git pushes. This architecture gives teams fine-grained control over tool execution boundaries while avoiding the maintenance burden of bespoke harness frameworks.</span></p>\n<h2><span style=\"vertical-align: baseline;\">The 3-Layer Agent Dev Stack: Gemini 3.8 Flash, Google Antigravity, and Google Skills</span></h2>\n<p><em><span style=\"vertical-align: baseline;\">Timestamp: [</span><a href=\"https://youtu.be/F8EZJAm9iO8?si=L0T5reEiQBXxZ86H&amp;t=1527\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">25:27</span></a><span style=\"vertical-align: baseline;\">]</span></em></p>\n<p><span style=\"vertical-align: baseline;\">Next up, </span><a href=\"https://www.linkedin.com/in/smithakolan/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Smitha Kolan</span></a><span style=\"vertical-align: baseline;\"> broke down why coding agents do not always require heavier reasoning models, emphasizing that high performance stems from balancing the three layers of the agent stack: </span><strong style=\"vertical-align: baseline;\">Model</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Harness</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Knowledge</strong><span style=\"vertical-align: baseline;\">. </span></p>\n<p><em>\"Your coding agent doesn't need a smarter model. It needs a better stack: model, harness, and knowledge. When all three click into place, everything changes.\"</em></p>\n<p><span style=\"vertical-align: baseline;\">She then walked through the three tools she's been loving recently, one for each layer of the stack.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Layer 1 | Model | </strong><a href=\"https://antigravity.google/blog/gemini-3-8-flash-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash</strong></a><span style=\"vertical-align: baseline;\">:</span><span style=\"vertical-align: baseline;\"> High-frequency agentic loops run between 20 and 60 sequential hops per task (inspecting files, updating functions, and executing unit tests). Because latency and API costs compound across iterations, a lightweight, responsive model like Gemini 3.8 Flash makes real-time agent loops practical without running up a massive bill.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Layer 2 | Harness | </strong><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</strong></a><strong style=\"vertical-align: baseline;\"> with </strong><a href=\"https://antigravity.google/docs/boost/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">/boost</strong></a><span style=\"vertical-align: baseline;\">:</span><span style=\"vertical-align: baseline;\"> Default Antigravity handles standard navigation and component creation. On top of that, the </span><code><span style=\"vertical-align: baseline;\">/boost</span></code><span style=\"vertical-align: baseline;\"> command spins up an orchestrator that coordinates specialized sub-agents in parallel and concludes with an independent audit pass before modifying files.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Layer 3 | Knowledge | </strong><a href=\"https://github.com/google/skills/tree/main\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills Repository</strong></a><span style=\"vertical-align: baseline;\">:</span><span style=\"vertical-align: baseline;\"> With over 19,000 GitHub stars and 100+ curated domain packages across Google Cloud, Firebase, Flutter, and Maps, this harness-agnostic repository injects precise domain context on demand, preventing agents from guessing cloud configurations </span></p>\n<h2><span style=\"vertical-align: baseline;\">Your turn to build</span></h2>\n<p><span style=\"vertical-align: baseline;\">Building effective coding agents requires moving past the reflex of simply swapping in larger models. As Ryan Lopopolo's philosophy of harness engineering illustrates, true developer leverage is achieved by shifting best practices to the left and investing in rich tools, deterministic verifiers, and well-curated context that survive model upgrades. When combined with fast inference models, structured orchestration harnesses, and modular domain knowledge, agents evolve from conversational novelties into dependable, autonomous engineering partners.</span></p>\n<p><span style=\"vertical-align: baseline;\">Ready to put it into practice? Explore the tools and resources covered in this episode:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://antigravity.google/blog/gemini-3-8-flash-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash</span></a><span style=\"vertical-align: baseline;\">: Fast, low-cost model for multi-hop agent loops.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\"> (</span><a href=\"https://antigravity.google/docs/boost/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">/boost</span></a><span style=\"vertical-align: baseline;\">): Orchestrator harness for parallel coding agents and verification.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\">: Modular domain knowledge for Google Cloud, Firebase, and Flutter.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit (ADK)</span></a><span style=\"vertical-align: baseline;\">: Custom harness middleware for safety guardrails and memory compaction.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://youtu.be/F8EZJAm9iO8?si=Uptrs898iW1XIRC6\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Full episode video</span></a><span style=\"vertical-align: baseline;\">: The full interview and live Factory Floor code demos.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Connect with us</span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Smitha Kolan</strong><span style=\"vertical-align: baseline;\"> →</span> <a href=\"https://www.linkedin.com/in/smithakolan/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\"> |</span> <a href=\"https://www.youtube.com/@smithakolan\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">YouTube</span></a><span style=\"vertical-align: baseline;\"> |</span> <a href=\"https://x.com/smithakolan\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Luke Schlangen</strong><span style=\"vertical-align: baseline;\"> → </span><a href=\"https://www.linkedin.com/in/lukeschlangen/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\"> |</span> <a href=\"https://www.luke.mn/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">website</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ryan Lopopolo</strong><span style=\"vertical-align: baseline;\"> → </span><a href=\"https://www.linkedin.com/in/ryanlopopolo/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\"> | </span><a href=\"https://hyperbo.la/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperbola</span></a><span style=\"vertical-align: baseline;\"> | </span><a href=\"https://x.com/_lopopolo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tilde</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Thurium </strong><span style=\"vertical-align: baseline;\">→</span> <a href=\"https://www.linkedin.com/in/annthurium/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Billy Jacobson</strong><span style=\"vertical-align: baseline;\"> →</span> <a href=\"https://www.linkedin.com/in/billyjacobson/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\"> | </span><a href=\"https://x.com/billyjacobson\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mollie Pettit</strong><span style=\"vertical-align: baseline;\"> → </span><a href=\"https://www.linkedin.com/in/molliepettit/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\"> | </span><a href=\"https://dev.to/molliepettit\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dev.to</span></a> | <a href=\"https://x.com/MollzMP\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a><span style=\"vertical-align: baseline;\"> |</span> <a href=\"https://bsky.app/profile/mollzmp.bsky.social\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bluesky</span></a></p>\n</li>\n</ul></div>"
