"overview": |
  この日は 5 件 (重複を除くと 4 件) で、対話型 AI の GA と、Kubernetes 周りの話題が中心でした。Gemini 3.8 Live with Live Avatar が Gemini Enterprise で一般提供となりました。先週の Gemini 3.8 Live と Gemini 3.8 Live Extended Thinking の発表に続くもので、Google Cloud Next 2026 でプレビュー公開された技術が本番利用できる段階に入りました。Live Avatar は Web・モバイル・対話型キオスクにまたがる会話型の動画エージェントに視覚的な存在感を与えるもので、リップシンクを同期させた動画アバターを生成できます (カスタムアバターは許可リスト制)。ネイティブな音声間 (speech-to-speech) 処理により、割り込みからの復帰も自然な対話になります。事例では、Scribd が Gemini のネイティブ PDF 理解と Gemini Enterprise のバッチ予測を使い、Scribd と Slideshare のユーザー投稿コンテンツ 4 億件以上・120 億ページ超に対する信頼性と安全性の分類を数か月で完了させた取り組みが紹介されました。コーパス全体の 99% 以上をネイティブ入力のまま処理でき、OCR やレンダリング、スクリーンショットのパイプラインを作る必要がなかった点が成果として挙げられています。Kubernetes では、AWS EKS から GKE への移行を AI で支援する GKE agentic migration が発表されました。これまで、複雑な Kubernetes 環境の移行は、広範なインフラのコードを手作業で読み解き、クラウド間のアーキテクチャの違いを埋め、独自の変換スクリプトを書く必要のある骨の折れる作業でした。汎用の LLM に場当たり的なプロンプトで変換させると、存在しないリソースのプロパティをでっち上げたり、ネットワークや ID の設定を落としたり、相互に依存するファイルをまたいだ文脈を見失ったりするため、その監査とデバッグに時間が吸い取られるという問題に対し、ガバナンスを組み込んだ移行の仕組みを提供します。あわせて、2026 年の Gartner Magic Quadrant for Container Management で Google が 4 年連続でリーダーに位置づけられ、評価対象のベンダーの中で Ability to Execute が最も高かったことが報告されました。併載の Critical Capabilities レポートでは、新規クラウドネイティブアプリケーション、コンテナ化された既存アプリケーション、AI トレーニング、AI 推論、エッジアプリケーション、ハイブリッドアプリケーションのすべてのユースケースで 1 位となっています。
