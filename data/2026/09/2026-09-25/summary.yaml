"overview": |
  この日は 10 件 (重複を除くと 4 件) で、対話型 AI の GA と、Kubernetes 周りの話題が中心でした。Gemini 3.8 Live with Live Avatar が Gemini Enterprise で一般提供となりました。先週の Gemini 3.8 Live と Gemini 3.8 Live Extended Thinking の発表に続くもので、Google Cloud Next 2026 でプレビュー公開された技術が本番利用できる段階に入りました。Live Avatar は Web・モバイル・対話型キオスクにまたがる会話型の動画エージェントに視覚的な存在感を与えるもので、リップシンクを同期させた動画アバターを生成できます (カスタムアバターは許可リスト制)。ネイティブな音声間 (speech-to-speech) 処理により、割り込みからの復帰も自然な対話になります。事例では、Scribd が Gemini のネイティブ PDF 理解と Gemini Enterprise のバッチ予測を使い、Scribd と Slideshare のユーザー投稿コンテンツ 4 億件以上・120 億ページ超に対する信頼性と安全性の分類を数か月で完了させた取り組みが紹介されました。コーパス全体の 99% 以上をネイティブ入力のまま処理でき、OCR やレンダリング、スクリーンショットのパイプラインを作る必要がなかった点が成果として挙げられています。Kubernetes では、AWS EKS から GKE への移行を AI で支援する GKE agentic migration が発表されました。これまで、複雑な Kubernetes 環境の移行は、広範なインフラのコードを手作業で読み解き、クラウド間のアーキテクチャの違いを埋め、独自の変換スクリプトを書く必要のある骨の折れる作業でした。汎用の LLM に場当たり的なプロンプトで変換させると、存在しないリソースのプロパティをでっち上げたり、ネットワークや ID の設定を落としたり、相互に依存するファイルをまたいだ文脈を見失ったりするため、その監査とデバッグに時間が吸い取られるという問題に対し、ガバナンスを組み込んだ移行の仕組みを提供します。あわせて、2026 年の Gartner Magic Quadrant for Container Management で Google が 4 年連続でリーダーに位置づけられ、評価対象のベンダーの中で Ability to Execute が最も高かったことが報告されました。併載の Critical Capabilities レポートでは、新規クラウドネイティブアプリケーション、コンテナ化された既存アプリケーション、AI トレーニング、AI 推論、エッジアプリケーション、ハイブリッドアプリケーションのすべてのユースケースで 1 位となっています。エージェント基盤では、Agent Substrate が Google Kubernetes Engine (GKE) で利用できるようになりました。オープンソースかつセキュアバイデフォルトのエージェント実行ランタイムで、標準的なコンテナランタイムより 10 倍高い密度で数百万のサンドボックスを動かせるように設計されています。ネイティブなゼロトラストのカーネル分離とネットワーク分離を備え、1 秒あたり 500 回を超える一時停止 / 再開のアクティベーションをこなしながら、再開は 500 ミリ秒未満で完了します。Antigravity・Claude Code・Codex・OpenClaw・Hermes といったハーネスを手元で動かすのと、コード生成やツール連携、自動実行を行う数十万の長期実行エージェントを同時に走らせるのとでは、信頼境界の不透明さ (モデルがその場で生成した未検証のコードを実行するため、カーネルレベルの分離と動的なネットワーク制御がなければホストエスケープや認証情報の窃取につながる) やツールアクセスの要件が根本的に異なる、という課題意識が語られています。Hermes Agent を開発する Nous Research が Agent Substrate を基盤に開発を進めており、Hermes は OpenRouter の利用量で生産性・コーディング・CLI・個人向けエージェントの各分野で世界 1 位にランクされています。コンピュートでは、M4N マシンシリーズが一般提供となりました。ネットワークとブロックストレージに最適化された VM ファミリーの第 2 弾で、I/O 負荷が高くメモリを多く必要とするワークロード向けです。第 5 世代 Intel Xeon スケーラブルプロセッサと Google 独自の Titanium オフロードアーキテクチャを基盤とし、Hyperdisk Extreme と組み合わせるとホストあたり最大 25,000 MiB/秒 (25 GiB/秒) のストレージスループットと最大 100 万 IOPS に達します。これは現行の M4 の 2 倍のブロックストレージ性能です。メモリ比率は最大 26:1、メモリは最大 6 TB で、Oracle Database や SAP HANA のようなインメモリデータベース、高スループットの SQL Server クラスター、EHR システム、リアルタイムのビッグデータ分析などで、メモリ容量とストレージ帯域を確保するためだけに余分な vCPU をプロビジョニングしてサードパーティのライセンス費用が膨らむ問題に対応し、Oracle Database の TCO を 20% 以上削減できるとしています。データ処理では、Dataflow のバッチジョブの一時停止 / 再開が一般提供となり、NVIDIA RTX PRO 6000 Blackwell Server Edition GPU を搭載した G4 VM もサポートされました。数日にわたるような長時間のバッチジョブが失敗したときに、処理済みのデータを捨てて最初からやり直すのではなく再開できるようになり、優先度の低いジョブから特徴量エンジニアリングや AI 推論といった優先度の高いワークロードへ GPU や TPU を動的に振り向けることもできます。このほか、エージェントハーネスという言葉を作った Google Cloud のソフトウェアエンジニア Ryan Lopopolo を迎えた The Agent Factory の回のまとめが公開され、モデルを豊かな文脈に接地させ、介入を前倒し (シフトレフト) することで高い自律性が引き出せるという議論が紹介されています。リリースノートでは、API キーのリモート Model Context Protocol (MCP) サーバーがプレビューとなり、AI アプリケーションから Google Cloud プロジェクトの API キーの作成・確認・制限・ライフサイクル管理ができるようになりました。また、GKE Standard クラスターのノードあたり最大 Pod 数が 256 から 512 に引き上げられ、257〜512 Pod を設定したノードには /22 の Pod CIDR ブロック (1,024 個の IP アドレス) が割り当てられます。
