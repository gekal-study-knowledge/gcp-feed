    "id": "997a2373bf761f34f2a870d8589fff29"
    "title": "Power your agents: Gemini 3.8 Live with Live Avatar is now generally available"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-3-8-live-with-live-avatar-is-now-generally-available/"
    "published": "2026-09-25 00:00:00"
    "fetched": "2026-09-25 03:12:25"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Following our </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-gemini-3-8-live-extended-thinking/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announcement</span></a><span style=\"vertical-align: baseline;\"> of Gemini 3.8 Live and Gemini 3.8 Live Extended Thinking last week, we are thrilled to share that </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-with-live-avatar/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar</span></a><span style=\"vertical-align: baseline;\"> is now generally available in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">. First previewed at Google Cloud Next 2026</span><span style=\"vertical-align: baseline;\">, the technology is now officially ready for enterprise production.</span></p>\n<p><span style=\"vertical-align: baseline;\">As enterprise voice AI evolves beyond basic speed and cost metrics, our priority has shifted to making each interaction even higher quality. Gemini 3.8 Live already delivers a native speech-to-speech foundation for fluid, responsive dialogue. The Live Avatar feature brings an interactive visual presence to conversational video agents across web, mobile, and interactive kiosks. Together, you’ll have access to:  </span></p>\n<ol>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Video avatars: </strong><span style=\"vertical-align: baseline;\">Conversational video with the Live Avatar </span><span style=\"vertical-align: baseline;\">feature can generate video avatars with synchronized lip-syncing. Note: Custom avatar feature is available via allowlist only.  </span> </span></li>\n<li><strong style=\"vertical-align: baseline;\">Fluid dialogue: </strong><span style=\"vertical-align: baseline;\">Native speech-to-speech means more natural interruption recovery without dropping conversation context or backend transactions.</span></li>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Tool calling: </strong><span style=\"vertical-align: baseline;\">It executes tools and API calls in the background while continuing the conversation, so the model can acknowledge requests and keep chatting while tasks finish in the background.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Breaks language barriers: </strong><span style=\"vertical-align: baseline;\">Gemini 3.8 Live understands and speaks 97 languages, with automatic language detection.</span></span></li>\n<li><strong style=\"vertical-align: baseline;\">Make it easy for agents to see what your user sees: </strong><span style=\"vertical-align: baseline;\">Live visual understanding can process live camera feeds and screen shares alongside audio, all at the same time. </span></li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Though Gemini 3.8 Live Extended Thinking remains in private preview, </span><strong style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar is now available</strong><span style=\"vertical-align: baseline;\"> with US and EU endpoints, with provisioned throughput, enterprise compliance, and strict data governance. Try the model and its features in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">, and start building now with </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Trust and transparency at its core</strong></p>\n<p><span style=\"vertical-align: baseline;\">To safeguard identity and prevent misuse, customers can deploy from a library of curated, pre-built avatars, while custom avatar creation is gated behind a strict enterprise allowlisting and verification process. Furthermore, all generated audio and video streams carry imperceptible SynthID watermarks, ensuring AI-generated content remains transparent and verifiable.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Three demos of Gemini 3.8 Live with Live Avatar in action</span></h3>\n<p><strong style=\"vertical-align: baseline;\">#1: Interactive custom avatar</strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=oVG-5BF-dWo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 3.8 Live with Live Avatar</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=oVG-5BF-dWo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Create an interactive custom avatar in a step-by-step process </span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">Watch how Gemini 3.8 Live makes it possible to build a custom avatar by adding system instructions, uploading a single reference photo and audio file sample.  </span></p>\n<p><strong style=\"vertical-align: baseline;\">Demo #2: Live video understanding in a voice-first claims intake </strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=QXiJfxdcSgo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 3.8 Live demo for insurance claim agent</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=QXiJfxdcSgo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Streamline claims intake with live video understanding using Gemini 3.8 Live</span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">In this demo, you’ll see a common use case come to life using Gemini 3.8 Live: an intake agent. <span style=\"vertical-align: baseline;\">In this scenario, we chose an insurance claims agent. </span>You talk and show the damage on camera, and the claim notebook fills itself in as you go. In the background, an ADK agent team checks the policy, applies the intake rules, and builds the adjuster packet. To dive deeper, check out the </span><a href=\"https://github.com/Shubhamsaboo/awesome-llm-apps/tree/main/voice_ai_agents/insurance_claim_live_agent_team\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source code</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><strong style=\"vertical-align: baseline;\">#3: A real-time voice AI agent with Google ADK and Gemini Live API</strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=yQEKMsCtsmE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Build a real-time voice AI agent with Google ADK and Gemini Live API</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=yQEKMsCtsmE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Build a live voice agent using Google ADK and Gemini Live API</span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">See how developers can use </span><a href=\"https://adk.dev/live/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit </span></a><span style=\"vertical-align: baseline;\">(ADK) to define agents, manage runners and session memory, and stream real-time audio directly to the Gemini Live API without a traditional speech-to-text pipeline.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How our customers are innovating with Gemini 3.8 Live with Live Avatar</span></h3></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"4 autotrader\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_autotrader.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Cox Automotive built an AI-powered shopping assistant for Autotrader that uses live screen-highlighting and tool-calling capabilities to guide car shoppers through vehicle search, comparison, and financing — in real time, through natural conversation.</p><p>“Shoppers increasingly expect to describe what they need in their own words rather than work through filters and menus. Autotrader’s new conversational AI Avatar brings that experience to vehicle discovery by matching natural conversation to the right inventory. It is another step toward our vision of connected intelligence, where every consumer interaction draws on the full depth of Cox Automotive data.” — Marianne Johnson, EVP and Chief Product Officer, Cox Automotive.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=0pS0I7mhv10\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Autotrader AI-powered shopping assistant | Gemini 3.8 Live with Live Avatar</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=0pS0I7mhv10\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"6 equal ai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/6_equal_ai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We're building a personal AI that knows you, speaks your language, and is always on your side. Today, it handles over a million live calls daily across nine Indian languages. Gemini 3.8 Live improved interruption handling, multilingual conversations, and tool-call reliability. This AI doesn't just answer calls; it gets things done for you.” — Akhilesh Damaraju, CEO, Equal AI.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"7 salesforce\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/7_salesforce.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We're excited that Gemini 3.8 Live and Agentforce are coming together to reimagine what's possible in intelligent service. This collaboration between Salesforce AI Research and Google combines real-time, multimodal capabilities with agentic AI to explore new ways to create richer, more intuitive customer experiences from first contact to resolution.\" — Bob Van Osten, VP of Product for Agentforce, Salesforce.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=1x8UAK9demI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Salesforce&#x27;s Agentforce and Gemini 3.8 Live</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=1x8UAK9demI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"9 specs\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/9_specs.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“Our team has been very impressed with Gemini 3.8 Live throughout testing and benchmarking! The updates made to Voice Activity Detection and the improvements to overall latency are huge steps forward and further our ability to deliver the highest quality AI Assistant on the SPECS platform.” — Eric Walsh, Software Engineer, Specs.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Start building today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar are available now for enterprise customers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Try the model in </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Access the Gemini Live API </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> for integration guides</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review pricing on our </span><a href=\"https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pricing page</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google-gemini/gemini-skills/blob/main/skills/gemini-live-api-dev/SKILL.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Skill</span></a><span style=\"vertical-align: baseline;\"> for building real-time, bidirectional streaming apps with the Gemini Live </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If your application requires specialized, modular audio capabilities, explore our other audio models:  </span></p>\n<ul>\n<li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-5-transcribe/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Transcribe</span></a></li>\n<li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-live-3-5-translate/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Live Translate</span></a></li>\n<li><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-text-to-speech/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash-Lite TTS and Gemini 3.8 Flash TTS</span></a></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Reach out to your Google Cloud sales representative to activate provisioned throughput, discuss customized deployment architectures and allowlisting for custom avatar.</span></p></div>"
