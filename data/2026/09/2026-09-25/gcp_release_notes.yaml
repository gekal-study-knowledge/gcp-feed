    "summary": "<h2 class=\"release-note-product-title\">API Keys API</h2>\n<h3>Feature</h3>\n<p>The API Keys remote Model Context Protocol (MCP) server is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>. You can\nconnect to the API Keys remote MCP server from AI applications to\ncreate, inspect, restrict, and manage the lifecycle of API keys in your\nGoogle Cloud projects.</p>\n<p>For more information, see the\n<a href=\"https://docs.cloud.google.com/api-keys/docs/reference/mcp\">API Keys MCP reference</a>.</p>\n<h2 class=\"release-note-product-title\">Google Kubernetes Engine</h2>\n<h3>Feature</h3>\n<p>GKE Standard clusters now support up to 512 maximum Pods per node, an increase\nfrom the previous limit of 256. Nodes configured for 257 to 512 Pods will now\nbe allocated a /22 Pod CIDR block (1,024 IP addresses).</p>"
