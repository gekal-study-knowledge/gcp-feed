    "summary": "<h2 class=\"release-note-product-title\">Apigee API hub</h2>\n<h3>Feature</h3>\n<p><strong>Preview launch of AWS API Gateway and Azure API Management plugins</strong></p>\n<p>API hub now includes two new built-in plugins for ingesting API metadata from third-party gateways: <strong>AWS API Gateway</strong> and <strong>Azure API Management</strong>. Both plugins are in <a href=\"https://cloud.google.com/products#product-launch-stages\">Public Preview</a>, extending API hub's multi-cloud governance to give you a single pane of glass across your Google Cloud, AWS, and Azure APIs.</p>\n<p><strong>What's new</strong></p>\n<ul>\n<li><strong>Automated discovery and onboarding</strong>: Connect your AWS account or Azure API Management (APIM) service and API hub automatically discovers your existing deployed APIs and related metadata.</li>\n<li><strong>Scheduled pull sync</strong>: A full metadata sync runs every 6 hours by default, with reconciliation (upserts and orphan deletes) to keep your catalog in sync with the source gateway.</li>\n<li><strong>Optional near-real-time push sync</strong>: Deploy a customer-managed AWS Lambda function (for AWS API Gateway) or Azure Function (for Azure API Management) to relay control-plane change events to API hub in near real time. For sample deployment code, see the <a href=\"https://github.com/GoogleCloudPlatform/apigee-samples/tree/main/apihub-plugins\">apigee-samples</a> repository.</li>\n</ul>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/apigee/docs/apihub/plugins\">About plugins</a>, <a href=\"https://docs.cloud.google.com/apigee/docs/apihub/manage-third-party-plugins\">Manage third-party plugins</a>, and <a href=\"https://docs.cloud.google.com/apigee/docs/apihub/create-plugin-instances\">Create a plugin instance</a>.</p>\n<h3>Feature</h3>\n<p><strong>Spec-to-deployment linkage and gateway revision tracking in API hub (GA)</strong></p>\n<p>API hub now provides a first-class, bidirectional link between API specifications, operations, and the deployments that serve them, together with native tracking of the underlying gateway revision.</p>\n<p><strong>What's new</strong></p>\n<ul>\n<li><strong>Direct visibility between specs and deployments</strong>: See exactly which API specification and operations are served by a specific deployment, and navigate from a spec to the deployments that serve it.</li>\n<li><strong>Native gateway revision tracking</strong>: Deployments now capture and display their underlying gateway revision (for example, an Apigee proxy revision) via the new <code>source_revision</code> field on the Deployment resource.</li>\n<li><strong>More accurate operation resolution</strong>: When multiple revisions expose overlapping operations (same method and path), API hub associates each operation with its specific specification instead of dropping duplicates.</li>\n<li><strong>Multiple spec revisions per API</strong>: API hub can store multiple revisions of the same spec for an API deployed across different environments.</li>\n</ul>\n<h2 class=\"release-note-product-title\">Cloud Key Management Service</h2>\n<h3>Feature</h3>\n<p><strong>Preview:</strong> Cloud EKM supports external key migration. For keys with the\n<code>EXTERNAL</code> or <code>EXTERNAL_VPC</code> protection levels, you can create new key versions\nwith either of these protection levels. You can also change the protection level\nof existing external key versions to change how you access your existing key\nmaterial with zero downtime and without reconfiguring your applications.</p>\n<p>For more information about migrating external keys, see <a href=\"https://docs.cloud.google.com/kms/docs/migrate-external-keys\">Migrate external\nkeys</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Service Mesh</h2>\n<h3>Announcement</h3>\n<p><strong>1.30.4-asm.14 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud Service\nMesh 1.30.4-asm.14 uses Envoy v1.38.5-dev.</p>\n<h3>Fixed</h3>\n<p>Patch 1.30.4-asm.14 contains the fix for the following platform CVEs:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">CVE</th>\n<th style=\"text-align: left;\">Proxy</th>\n<th style=\"text-align: left;\">Control Plane</th>\n<th style=\"text-align: left;\">Distroless</th>\n<th style=\"text-align: left;\">CNI</th>\n<th style=\"text-align: left;\">Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2022-31045\">CVE-2022-31045</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (9.8)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-5450\">CVE-2026-5450</a></td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Low (9.8)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84304\">CVE-2026-84304</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">High (8.7)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-84445\">CVE-2026-84445</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">High (8.7)</td>\n</tr>\n<tr>\n<td style=\"text-ali