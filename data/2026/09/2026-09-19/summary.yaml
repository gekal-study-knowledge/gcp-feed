"overview": |
  この日は 9 件で、Google 自身のエージェント型セキュリティ、データ基盤の拡張、そして人材育成が話題でした。Google は数億行規模のコードを守るため、AI ネイティブなエージェント手法で高精度かつ広範な脆弱性スキャンとパッチ適用を開発ライフサイクルに組み込んでいます。大規模な単発のスキャンではなく、コードのチェックインごとにリアルタイムで AI エージェントが評価する提出前スキャンにより、毎月数百件の脆弱性が本番や既存のコードベースに到達する前に防がれているとされています。この取り組みは、Google の AI・インフラストラクチャチームがインフラストラクチャコードのセキュリティをどう変えているかという切り口でも取り上げられ、AI によるコード生成の加速とともに増える脆弱性の悪用、とりわけ AI を使った新しい攻撃への対処として位置づけられています。データ基盤では、クラウドをまたいで管理されたデータをその場でクエリできるボーダーレス Lakehouse に、クロスクラウドキャッシングがプレビューで加わりました。Amazon S3、Azure Data Lake Storage、Google Cloud Storage、各種 SaaS に分散したデータを、脆弱な ETL や重複ストレージ、クラウド間転送コストなしに結合できる方向をさらに進めるものです。AlloyDB と Cloud SQL for PostgreSQL (17 以降) には、TigerData が作成したオープンソースの pg_textsearch 拡張に基づくネイティブな BM25 インデックスがプレビューで登場し、ベクトル検索と厳密なキーワード全文検索を組み合わせるハイブリッド検索を、別の全文検索バックエンドなしにデータベース内で実現できます。公共部門向けには、州・地方政府のレガシーなデータサイロや手作業の負担をエージェントで解消する取り組みが紹介され、全米州 CIO 協会 (NASCIO) の年次報告で AI が初めて州 CIO の最優先事項に挙げられたことにも触れられています。人材育成では、北米で開幕した DevFest で 80 人のエンジニアが長時間稼働する自己進化型マルチエージェントシステムを構築した Workbench 形式のワークショップと、企業の AI 開発者を毎日の短い習慣で育成する 4 本柱のアプローチが公開されました。
