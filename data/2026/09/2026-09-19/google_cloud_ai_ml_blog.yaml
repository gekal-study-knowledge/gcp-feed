prove security can adopt a similar AI-native approach, following these principles: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keep systems separate:</strong><span style=\"vertical-align: baseline;\"> To prevent bias, keep the harnesses, rules, and context for each of your development, scanning, triage agents separate. Pair lightweight AI scans with deterministic, structural validation to drive down latency and improve accuracy. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Use context wisely: </strong><span style=\"vertical-align: baseline;\">Feed your agents your existing threat models. Precise context is the answer to reducing false positives, and up-to-date threat models set a high floor on a team's security posture by improving the rate of true positives in presubmit scanning.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a good harness:</strong><span style=\"vertical-align: baseline;\"> While the choice of the underlying model is important, using a multi-agent harness can have substantial impact, by helping compensate for variability in model choice. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automate the fix:</strong><span style=\"vertical-align: baseline;\"> Use agents to also propose human-in-the-loop fixes, to further reduce time-to-resolution. </span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">If you want to get started on your own AI-native security transformation, </span><a href=\"https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\"> is now available as open source for you to use and benefit from. You can also </span><a href=\"https://cloud.google.com/learn/security/mandiant-academy-courses/fcs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn more about the fundamentals of cybersecurity</span></a><span style=\"vertical-align: baseline;\"> and the other platforms that power this agentic pipeline: Google Cloud, Gemini Enterprise and Gemini models running on Trillium and Ironwood TPUs. And you can get inspiration from how agentic vulnerability scanning and remediation defends Google Cloud customers as an integral part of </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud’s secure software development lifecycle (SDLC) effort</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">With special recognition to critical team members who made this delivery possible: Stella Voutsina (Lead Program Manager), Yulong Zhang (Senior Staff Security Engineer, Mantis), and Nick Galloway (Staff Security Engineer, Mantis).</span></sup></p></div>"
