  "603396734570925df6a70e5b379a071b":
    "id": "603396734570925df6a70e5b379a071b"
    "title": "Changing the game: How Google uses agentic AI to secure hundreds of millions of lines of code"
    "link": "https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure/"
    "published": "2026-09-19 01:00:00"
    "fetched": "2026-09-19 01:57:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI is accelerating software development at an unprecedented pace. But as code generation scales, so do the challenges of securing the code, especially emerging AI-based vulnerability exploitations. To meet these challenges, the Google AI and Infrastructure team is transforming how we approach security. In this article, we discuss new AI-native agentic methods that we’ve developed that systematically embed high-precision, pervasive vulnerability scanning and patching directly into Google’s software development lifecycle. By continuously scanning every code change across hundreds of millions of lines of code that we deploy onto our infrastructure, we are preventing hundreds of vulnerabilities per month from ever reaching our code base or production, defending our global network, AI infrastructure and our users. </span></p>\n<p><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Solution architecture and implementation </strong></span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_DMfXM9r.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Pervasive pre-submit agentic scanning: security as part of ongoing software development</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Traditionally, the technology industry relies on large one-off security scans that are slow and lack sufficient context. As a result, they often find vulnerabilities too late. Our approach instead focuses on pre-submit scanning, where we evaluate each code check-in (across every layer of the stack) in real-time using AI agents. By integrating the pre-submit scan into the tools developers already use, security becomes a continuous routine process, similar to rule checkers, readability reviews or other software development tools. Also, from an AI perspective, scanning each individual code change requires much less context than performing a large one-off scan, significantly improving the scan’s effectiveness. </span></p>\n<h3><span style=\"vertical-align: baseline;\">The importance of localized threat models</span></h3>\n<p><span style=\"vertical-align: baseline;\">For this initiative, w</span><span style=\"vertical-align: baseline;\">e evolved </span><a href=\"https://github.com/google/mantis\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\">, our open-source multi-agent review harness, to increase the precision of our security agents by matching them with a cohort of robust localized threat mode</span><span style=\"vertical-align: baseline;\">ls. Rather than relying on static decoupled documents, the threat models use live codebase metadata. The scanning agent improves its accuracy further using a dependence call graph across packages and libraries to expand and refine its threat model context. </span><span style=\"vertical-align: baseline;\">Making threat models part of our ongoing vulnerability scanning encourages developers to continuously update threats and dependencies, keeping the models up-to-date. Using localized and precise threat model data translates to dramatic accuracy improvements, bringing our false-positive rates down to 3% in some cases.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Specialized triage agents speed up development</span></h3>\n<p><span style=\"vertical-align: baseline;\">Vulnerability scanning as part of code check-in requires it to respond quickly to the developer or agents generating the code, so as not to impede engineering productivity. To get responses with low latency, we run a two-step validation process. First, we run a quick lightweight scan that validates its findings against a specialized triage agent. This agent programmatically checks the actual structure of the code (using abstract syntax tree parsing, call-graph traversal, and pre-indexed domain safety rules) to prove that the vulnerable path is actually reachable by an attacker. This agent gets over 92% precision and completes its work in less than a minute. Then, a post-submit scan as part of nightly integration testing serves as a second layer of defense, using off-peak cycles to test for vulnerabilities that may have been introduced across multiple changes. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Bug fix agents close the loop</span></h3>\n<p><span style=\"vertical-align: baseline;\">Finding vulnerabilities is only half the battle. The last component of our solution is an automated bug-fix agent that uses the scan results and generated proofs (snippet of code that demonstrates how the vulnerability is exercised) to autonomously construct precise fixes that are consistent with our internal coding standards. The agent submits the fixes for human review as part of the original change request’s review, further reducing the time between detection and resolution. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Learnings and call to action </span></h3>\n<p><span style=\"vertical-align: baseline;\">Embedding continuous scanning directly into the software development lifecycle has been a game changer at Google; its suggestions are widely adopted, and it’s prevented a multitude of vulnerabilities from being introduced into the codebase. But any organization wishing to improve security can adopt a similar AI-native approach, following these principles: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keep systems separate:</strong><span style=\"vertical-align: baseline;\"> To prevent bias, keep the harnesses, rules, and context for each of your development, scanning, triage agents separate. Pair lightweight AI scans with deterministic, structural validation to drive down latency and improve accuracy. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Use context wisely: </strong><span style=\"vertical-align: baseline;\">Feed your agents your existing threat models. Precise context is the answer to reducing false positives, and up-to-date threat models set a high floor on a team's security posture by improving the rate of true positives in presubmit scanning.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a good harness:</strong><span style=\"vertical-align: baseline;\"> While the choice of the underlying model is important, using a multi-agent harness can have substantial impact, by helping compensate for variability in model choice. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automate the fix:</strong><span style=\"vertical-align: baseline;\"> Use agents to also propose human-in-the-loop fixes, to further reduce time-to-resolution. </span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">If you want to get started on your own AI-native security transformation, </span><a href=\"https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\"> is now available as open source for you to use and benefit from. You can also </span><a href=\"https://cloud.google.com/learn/security/mandiant-academy-courses/fcs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn more about the fundamentals of cybersecurity</span></a><span style=\"vertical-align: baseline;\"> and the other platforms that power this agentic pipeline: Google Cloud, Gemini Enterprise Agent Platform and Gemini models running on Trillium and Ironwood TPUs. And you can get inspiration from how agentic vulnerability scanning and remediation defends Google Cloud customers as an integral part of </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud’s secure software development lifecycle (SDLC) effort</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
