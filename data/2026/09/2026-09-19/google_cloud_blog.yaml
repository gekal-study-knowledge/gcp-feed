  "9c7578152b8c84fc19c5f5b2a71bdf53":
    "id": "9c7578152b8c84fc19c5f5b2a71bdf53"
    "title": "Announcing Native BM25 Ranking in AlloyDB and Cloud SQL"
    "link": "https://cloud.google.com/blog/products/databases/native-bm25-search-in-alloydb-and-cloud-sql/"
    "published": "2026-09-19 01:30:00"
    "fetched": "2026-09-19 01:57:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Vector search is a critical component of generative AI, retrieval-augmented generation (RAG), and data agent architectures, but sometimes vector search alone isn't enough. While vector embeddings are incredible at understanding conceptual meaning, they stumble on specific alphanumeric IDs and exact product SKU numbers. To build truly robust search and AI applications, you may need the combination of semantic vector search and traditional exact keyword full-text search — what we call hybrid search.</span></p>\n<p><span style=\"vertical-align: baseline;\">In search, Best Matching 25, or BM25, is a key algorithm used to estimate how relevant a document is to a given query. Until today, if you wanted BM25 ranking with AlloyDB or Cloud SQL, you needed to add an additional full-text search backend. This introduced data silos, sync lags, and operational complexity. Today, we are eliminating the friction of maintaining a separate full-text search backend altogether, with the preview of the native BM25 index in AlloyDB and Cloud SQL for PostgreSQL 17+, made possible through the open-source </span><a href=\"https://github.com/timescale/pg_textsearch\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">pg_textsearch</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> extension</span></a><span style=\"vertical-align: baseline;\"> created by TigerData.</span></p>\n<p><span style=\"vertical-align: baseline;\">Now, with a unified hybrid search backend, you </span><span style=\"vertical-align: baseline;\">no longer need to provision, manage, or pay for separate systems to get state-of-the-art full-text retrieval. It all happens directly inside your database, where your operational data lives, delivering: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Industry-standard keyword ranking:</strong><span style=\"vertical-align: baseline;\"> Powered by TigerData's </span><code style=\"vertical-align: baseline;\">pg_textsearch</code><span style=\"vertical-align: baseline;\">, bring lightning-fast, C-optimized BM25 scoring directly to your Postgres tables.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No complexity, total consistency:</strong><span style=\"vertical-align: baseline;\"> Eliminate the data duplication, ETL pipelines, and synchronization lag that you get when you maintain multiple backends for vector and full-text retrieval.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Supercharged semantic search (AlloyDB exclusive):</strong><span style=\"vertical-align: baseline;\"> Get up to 6x and 10x faster vector search queries (when compared to standard PostgreSQL) with ScaNN and HNSW index types.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Why </strong><strong style=\"vertical-align: baseline;\">pg_textsearch</strong><strong style=\"vertical-align: baseline;\">?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">If you’ve used PostgreSQL's built-in</span><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">ts_rank</code><span style=\"vertical-align: baseline;\"> for full-text search at any meaningful scale, you already know its limitations. Ranking quality degrades as your corpus grows. There’s no support for inverse document frequency, so common words carry the same weight as rare ones. There’s no term-frequency saturation, so a document that mentions \"database\" 50 times outranks one that mentions it once. </span></p>\n<p><span style=\"vertical-align: baseline;\">BM25 is the information retrieval gold standard, providing inverse document frequency (rarer terms matter more), term frequency saturation (repetition doesn't dominate), and document length normalization. You can learn more in this </span><a href=\"https://www.tigerdata.com/blog/pg-textsearch-bm25-full-text-search-postgres\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog post</span></a><span style=\"vertical-align: baseline;\"> by TigerData about how they built a BM25 search engine on PostgreSQL pages. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Full-text search example</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Here’s how to get started with BM25 full-text search on both AlloyDB and Cloud SQL. Consider a sample table, </span><span style=\"vertical-align: baseline;\">cymbal_products</span><span style=\"vertical-align: baseline;\">, that contains the unique identifier </span><span style=\"vertical-align: baseline;\">uniq_id</span><span style=\"vertical-align: baseline;\">, a </span><span style=\"vertical-align: baseline;\">product_name</span><span style=\"vertical-align: baseline;\"> column, a </span><span style=\"vertical-align: baseline;\">product_description</span><span style=\"vertical-align: baseline;\"> column containing a text description of each product, and a generated </span><span style=\"vertical-align: baseline;\">product_embedding</span><span style=\"vertical-align: baseline;\"> column. </span><code style=\"vertical-align: baseline;\">cymbal_products</code><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">contains information on various</span><span style=\"vertical-align: baseline;\"> retail products, including indoor and outdoor plants.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Index creation</span></h4>\n<p><span style=\"vertical-align: baseline;\">To use BM25, enable the </span><span style=\"vertical-align: baseline;\">pg_textsearch</span><span style=\"vertical-align: baseline;\"> extension.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Install pg_textsearch extension\\r\\nCREATE EXTENSION pg_textsearch;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54d910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Create the index on the </span><code style=\"vertical-align: baseline;\">product_description</code><span style=\"vertical-align: baseline;\"> column from the </span><code style=\"vertical-align: baseline;\">cymbal_products</code><span style=\"vertical-align: baseline;\"> table.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Create the native BM25 index on the content column\\r\\nCREATE INDEX idx_docs_bm25 \\r\\nON cymbal_products \\r\\nUSING bm25 (product_description) \\r\\nWITH (text_config=&#x27;english&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54e550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A BM25 full-text search query can be executed using the </span><span style=\"vertical-align: baseline;\">&lt;@&gt;</span><span style=\"vertical-align: baseline;\"> special operator.  In the snippet below, we search for  ‘cherry tree’. </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Full text search query\\r\\nSELECT product_name, product_description &lt;@&gt; &#x27;cherry tree&#x27; AS bm25_score \\r\\nFROM cymbal_products\\r\\nORDER BY bm25_score \\r\\nLIMIT 5;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54e710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Sample output is shown below. A more negative score indicates a stronger relevance match. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_WmFinfJ.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">AlloyDB hybrid search example</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Setting up a hybrid search system in AlloyDB is simple. You can create both your vector and keyword indexes on the same table and merge the results seamlessly using the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search#hybrid-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">hybrid search user-defined function (UDF</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n<h4><span style=\"vertical-align: baseline;\">Vector index creation</span></h4>\n<p><span style=\"vertical-align: baseline;\">Here is how to create a ScaNN vector search index: </span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Install vector extension\\r\\nCREATE EXTENSION vector;\\r\\n\\r\\n-- Install scann extension\\r\\nCREATE EXTENSION IF NOT EXISTS alloydb_scann;\\r\\n\\r\\n-- Create scann vector search index \\r\\nCREATE INDEX cymbal_products_embeddings_scann ON cymbal_products USING scann(product_embedding cosine);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54dfd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Hybrid search</span></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB provides an out-of-the-box hybrid search UDF that makes </span><span style=\"vertical-align: baseline;\">it</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">very simple to run hybrid search queries. </span><span style=\"vertical-align: baseline;\">The UDF merges the ranked results from each search component into a single, unified list using the Reciprocal Rank Fusion (RRF) algorithm. This query utilizes the UDF to perform a vector search for ‘trees that grow taller than houses’ and a keyword search for ‘California’ in the product description.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE EXTENSION google_ml_integration;\\r\\n\\r\\nSELECT *\\r\\nFROM ai.hybrid_search(\\r\\n  search_inputs =&gt; ARRAY[\\r\\n      \\&#x27;{\\r\\n        &quot;data_type&quot;: &quot;vector&quot;,\\r\\n        &quot;weight&quot;: 0.5,\\r\\n        &quot;table_name&quot;: &quot;cymbal_products&quot;,\\r\\n        &quot;key_column&quot;: &quot;uniq_id&quot;,\\r\\n        &quot;vec_column&quot;: &quot;product_embedding&quot;,\\r\\n        &quot;distance_operator&quot;: &quot;public.&lt;=&gt;&quot;,\\r\\n        &quot;limit&quot;: 10,\\r\\n        &quot;query_vector&quot;: &quot;ai.embedding(\\&#x27;\\&#x27;text-embedding-005\\&#x27;\\&#x27;, \\&#x27;\\&#x27;trees that grow taller than houses\\&#x27;\\&#x27;)::vector&quot;\\r\\n      }\\&#x27;::JSONB,\\r\\n      \\&#x27;{\\r\\n        &quot;data_type&quot;: &quot;text&quot;,\\r\\n        &quot;weight&quot;: 0.5,\\r\\n        &quot;table_name&quot;: &quot;cymbal_products&quot;,\\r\\n        &quot;key_column&quot;: &quot;uniq_id&quot;,\\r\\n        &quot;text_column&quot;: &quot;product_description&quot;,\\r\\n        &quot;limit&quot;: 10,\\r\\n        &quot;ranking_function&quot;: &quot;&lt;@&gt;&quot;,\\r\\n        &quot;query_text_input&quot;: &quot;California&quot;\\r\\n      }\\&#x27;::JSONB\\r\\n  ],\\r\\n);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54cd10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As shown in the sample output below, results are ranked in descending order of their RRF scores.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_pnhsphx.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Here, hybrid search bridges the gap between semantic intuition and exact keyword matching. While vector embeddings excel at grasping conceptual queries, like \"trees that grow taller than houses\", traditional full-text search provides the pinpoint precision needed for strict identifiers like \"California.\" By fusing the two, AlloyDB helps ensure your application prioritizes highly specific, locally relevant results like ‘California Sycamore’ right at the top of the list.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Cloud SQL hybrid search example</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In Cloud SQL, you can create both your vector and keyword indexes on the same table and merge the results seamlessly using Common Table Expressions (CTEs) and coalescing the RRF score, as shown below. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Vector index creation </span></h4>\n<p><span style=\"vertical-align: baseline;\">Here is how to create an HNSW index in Cloud SQL.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- Install vector extension\\r\\nCREATE EXTENSION vector;\\r\\n\\r\\n-- Create an HNSW index on the embedding column for fast approximate nearest neighbor search\\r\\nCREATE INDEX product_hnsw_idx ON cymbal_products USING hnsw(product_embedding vector_cosine_ops);&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54cd50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Hybrid search </span></h4>\n<p><span style=\"vertical-align: baseline;\">Here is the hybrid search query.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE EXTENSION google_ml_integration;\\r\\n\\r\\n-- BM25 keyword results\\r\\nWITH keyword_results AS (\\r\\n  SELECT uniq_id, product_name, \\r\\n         ROW_NUMBER() OVER (ORDER BY product_description &lt;@&gt; &#x27;California&#x27;) AS rank_kw\\r\\n  FROM cymbal_products\\r\\n  ORDER BY product_description &lt;@&gt; &#x27;California&#x27;\\r\\n  LIMIT 10\\r\\n),\\r\\n-- Semantic vector results\\r\\nsemantic_results AS (\\r\\n  SELECT uniq_id, product_name, \\r\\n         ROW_NUMBER() OVER (ORDER BY product_embedding &lt;=&gt; google_ml.embedding(&#x27;text-embedding-005&#x27;, &#x27;trees that grow taller than houses&#x27;)::vector) AS rank_vec\\r\\n  FROM cymbal_products\\r\\n  ORDER BY product_embedding &lt;=&gt; google_ml.embedding(&#x27;text-embedding-005&#x27;, &#x27;trees that grow taller than houses&#x27;)::vector\\r\\n  LIMIT 10\\r\\n)\\r\\n-- Reciprocal Rank Fusion (RRF) to merge and score both lists\\r\\nSELECT COALESCE(k.uniq_id, s.uniq_id) AS uniq_id,\\r\\n       COALESCE(k.product_name, s.product_name) AS product_name,\\r\\n       COALESCE(1.0 / (60 + k.rank_kw), 0) + COALESCE(1.0 / (60 + s.rank_vec), 0) AS rrf_score\\r\\nFROM keyword_results k\\r\\nFULL OUTER JOIN semantic_results s ON k.uniq_id = s.uniq_id\\r\\nORDER BY rrf_score DESC\\r\\nLIMIT 5;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923b54ddd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The resulting output is identical to the AlloyDB hybrid search results shown above.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Watch it in action</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Watch how this all comes together in this demo video. </span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=-JxQb-kjFHk\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Introducing BM25 on AlloyDB &amp; Cloud SQL</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=-JxQb-kjFHk\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Relevant resources </strong></h3>\n<p><span style=\"vertical-align: baseline;\">We are incredibly excited to work with TigerData and cannot wait to see how you leverage native BM25 support to build faster, smarter, and simpler AI applications. Turn on the </span><code style=\"vertical-align: baseline;\">pg_textsearch </code><span style=\"vertical-align: baseline;\">extension today, and experience the ultimate hybrid search engine experience with AlloyDB and Cloud SQL.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Want to get started?</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Check out”</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB resources </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">New to AlloyDB? Discover AlloyDB with a </span><a href=\"https://docs.cloud.google.com/alloydb/docs/free-trial-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">30-day free trial</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/choose-index-strategy\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Choose a vector index in AlloyDB AI</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-bm25-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB BM25 documentation </span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/run-hybrid-vector-similarity-search#hybrid-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB hybrid search UDF documentation</span></a></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Cloud SQL resources </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/sql/docs/postgres/pg-textsearch\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL BM25 documentation</span></a><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.tigerdata.com/blog/pg-textsearch-bm25-full-text-search-postgres\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TigerData pg_textsearch Release Page</span></a></p>\n</li>\n</ul></div>"
  "603396734570925df6a70e5b379a071b":
    "id": "603396734570925df6a70e5b379a071b"
    "title": "Changing the game: How Google uses agentic AI to secure hundreds of millions of lines of code"
    "link": "https://cloud.google.com/blog/topics/systems/using-ai-agents-to-secure-google-infrastructure/"
    "published": "2026-09-19 01:00:00"
    "fetched": "2026-09-19 01:57:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI is accelerating software development at an unprecedented pace. But as code generation scales, so do the challenges of securing the code, especially emerging AI-based vulnerability exploitations. To meet these challenges, the Google AI and Infrastructure team is transforming how we approach security. In this article, we discuss new AI-native agentic methods that we’ve developed that systematically embed high-precision, pervasive vulnerability scanning and patching directly into Google’s software development lifecycle. By continuously scanning every code change across hundreds of millions of lines of code that we deploy onto our infrastructure, we are preventing hundreds of vulnerabilities per month from ever reaching our code base or production, defending our global network, AI infrastructure and our users. </span></p>\n<p><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Solution architecture and implementation </strong></span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_DMfXM9r.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Pervasive pre-submit agentic scanning: security as part of ongoing software development</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Traditionally, the technology industry relies on large one-off security scans that are slow and lack sufficient context. As a result, they often find vulnerabilities too late. Our approach instead focuses on pre-submit scanning, where we evaluate each code check-in (across every layer of the stack) in real-time using AI agents. By integrating the pre-submit scan into the tools developers already use, security becomes a continuous routine process, similar to rule checkers, readability reviews or other software development tools. Also, from an AI perspective, scanning each individual code change requires much less context than performing a large one-off scan, significantly improving the scan’s effectiveness. </span></p>\n<h3><span style=\"vertical-align: baseline;\">The importance of localized threat models</span></h3>\n<p><span style=\"vertical-align: baseline;\">For this initiative, w</span><span style=\"vertical-align: baseline;\">e evolved </span><a href=\"https://github.com/google/mantis\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\">, our open-source multi-agent review harness, to increase the precision of our security agents by matching them with a cohort of robust localized threat mode</span><span style=\"vertical-align: baseline;\">ls. Rather than relying on static decoupled documents, the threat models use live codebase metadata. The scanning agent improves its accuracy further using a dependence call graph across packages and libraries to expand and refine its threat model context. </span><span style=\"vertical-align: baseline;\">Making threat models part of our ongoing vulnerability scanning encourages developers to continuously update threats and dependencies, keeping the models up-to-date. Using localized and precise threat model data translates to dramatic accuracy improvements, bringing our false-positive rates down to 3% in some cases.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Specialized triage agents speed up development</span></h3>\n<p><span style=\"vertical-align: baseline;\">Vulnerability scanning as part of code check-in requires it to respond quickly to the developer or agents generating the code, so as not to impede engineering productivity. To get responses with low latency, we run a two-step validation process. First, we run a quick lightweight scan that validates its findings against a specialized triage agent. This agent programmatically checks the actual structure of the code (using abstract syntax tree parsing, call-graph traversal, and pre-indexed domain safety rules) to prove that the vulnerable path is actually reachable by an attacker. This agent gets over 92% precision and completes its work in less than a minute. Then, a post-submit scan as part of nightly integration testing serves as a second layer of defense, using off-peak cycles to test for vulnerabilities that may have been introduced across multiple changes. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Bug fix agents close the loop</span></h3>\n<p><span style=\"vertical-align: baseline;\">Finding vulnerabilities is only half the battle. The last component of our solution is an automated bug-fix agent that uses the scan results and generated proofs (snippet of code that demonstrates how the vulnerability is exercised) to autonomously construct precise fixes that are consistent with our internal coding standards. The agent submits the fixes for human review as part of the original change request’s review, further reducing the time between detection and resolution. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Learnings and call to action </span></h3>\n<p><span style=\"vertical-align: baseline;\">Embedding continuous scanning directly into the software development lifecycle has been a game changer at Google; its suggestions are widely adopted, and it’s prevented a multitude of vulnerabilities from being introduced into the codebase. But any organization wishing to improve security can adopt a similar AI-native approach, following these principles: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keep systems separate:</strong><span style=\"vertical-align: baseline;\"> To prevent bias, keep the harnesses, rules, and context for each of your development, scanning, triage agents separate. Pair lightweight AI scans with deterministic, structural validation to drive down latency and improve accuracy. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Use context wisely: </strong><span style=\"vertical-align: baseline;\">Feed your agents your existing threat models. Precise context is the answer to reducing false positives, and up-to-date threat models set a high floor on a team's security posture by improving the rate of true positives in presubmit scanning.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a good harness:</strong><span style=\"vertical-align: baseline;\"> While the choice of the underlying model is important, using a multi-agent harness can have substantial impact, by helping compensate for variability in model choice. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automate the fix:</strong><span style=\"vertical-align: baseline;\"> Use agents to also propose human-in-the-loop fixes, to further reduce time-to-resolution. </span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">If you want to get started on your own AI-native security transformation, </span><a href=\"https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis</span></a><span style=\"vertical-align: baseline;\"> is now available as open source for you to use and benefit from. You can also </span><a href=\"https://cloud.google.com/learn/security/mandiant-academy-courses/fcs?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn more about the fundamentals of cybersecurity</span></a><span style=\"vertical-align: baseline;\"> and the other platforms that power this agentic pipeline: Google Cloud, Gemini Enterprise Agent Platform and Gemini models running on Trillium and Ironwood TPUs. And you can get inspiration from how agentic vulnerability scanning and remediation defends Google Cloud customers as an integral part of </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud’s secure software development lifecycle (SDLC) effort</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "5dda1d159dc282cc9f3bd015da287066":
    "id": "5dda1d159dc282cc9f3bd015da287066"
    "title": "Reimagining service delivery in the agentic era with Google Public Sector"
    "link": "https://cloud.google.com/blog/topics/public-sector/reimagining-service-delivery-in-the-agentic-era-with-google-public-sector/"
    "published": "2026-09-19 01:00:00"
    "fetched": "2026-09-19 01:57:04"
    "summary": "<div class=\"block-paragraph\"><p>State and local governments are driven by a shared mission to provide responsive, equitable, and accessible services. However, achieving this goal is often hindered by legacy technical debt, disconnected data, and heavy administrative burdens that slow down mission delivery.</p><p>This systemic fragmentation creates costly operational bottlenecks across the public sector, including:</p><ul><li><b>Legacy data silos:</b> Crucial caseworker information frequently resides in isolated repositories managed by separate departments.</li><li><b>Manual bottlenecks:</b> Agency personnel spend a significant amount of time managing routine data entry and manual documentation.</li><li><b>Stakeholder and end-user friction:</b> Users are often required to submit identical verification documents multiple times across different platforms because legacy systems cannot interoperate.</li></ul><p>Today, agents can help break down silos, automate routine and manual tasks, and enable agency employees to focus on high value public services, and the deeply human work they were called to do.</p><h2><b>AI is the number one priority for state CIOs</b></h2><p>Across the public sector, AI has rapidly evolved from an experiment to a core part of the strategy. Reflecting on this shift, the National Association of State Chief Information Officers (NASCIO) State CIO <a href=\"https://www.nascio.org/resource/state-cio-top-ten-policy-and-technology-priorities-for-2026/\" target=\"_blank\">top 10 annual</a> report recently ranked AI as the number one priority for state CIOs for the first time. This reprioritization matters deeply for the future of state and local governance: as state agencies face mounting administrative backlogs, aging infrastructure, and shifting public expectations, CIOs recognize that intelligent automation is the central mechanism to increase staff capacity, streamline caseworker workflows, and deliver more responsive, equitable services to local residents.</p><p>As agencies move from AI pilots and experiments to full-scale adoption, the central question for many agencies becomes: How do we leverage AI to bridge the gap between existing legacy investments and modern service delivery?</p><h2><b>Leveraging AI for mission impact</b></h2><p>Google provides an integrated AI stack designed to remove the friction of manual systems integration, with a focus on speed, scale, and cost-efficiency. Let’s take a closer look at some public sector organizations who are partnering with Google Public Sector and putting AI to work:</p><ul><li><a href=\"https://www.govexec.com/sponsors/2026/06/smarter-cities-safer-communities-how-state-and-local-government-leaders-are-advancing-public-services-ai/413852/?oref=featured-insights\" target=\"_blank\"><b>Utah Department of Transportation (UDOT)</b></a><b>:</b> Faced the monumental task of identifying and mapping more than 52,000 property parcels. Originally estimated to take 33.5 years of manual labor to complete, UDOT built a unified data platform on BigQuery, <b>completing the entire project in less than one year</b> and freeing engineers to <b>focus on roadway safety</b>.</li><li><a href=\"https://www.govtech.com/gov-experience/hartford-conn-integrates-ai-for-translation-services\" target=\"_blank\"><b>City of Hartford</b></a><b>:</b> Set a national benchmark for inclusive governance by using AI to provide <b>real-time, two-way translation in 80 languages</b> across all public city meetings, expanding participation while <b>achieving $1.3 million in structural cost savings</b>.</li><li><a href=\"https://cloud.google.com/customers/chattanooga\"><b>City of Chattanooga</b></a><b>:</b> Centralized municipal crash and incident data using Google Cloud's AI and analytics tools, enabling city planners and public safety teams to <b>identify high-risk corridors, optimize traffic signal timing, and prioritize infrastructure investments</b> to <b>make streets safer for residents</b>.</li><li><a href=\"https://www.govtech.com/artificial-intelligence/indiana-government-integrates-more-ai-into-operations\" target=\"_blank\"><b>Indiana Department of Transportation (INDOT)</b></a><b>:</b> INDOT deployed Google Cloud’s AI and document analysis models to automate compliance auditing across dense procurement contract repositories and scale smart road infrastructure. Meeting tight 30-day compliance mandates without pulling licensed engineers from active field projects, the solution<b> saved 360 hours</b> of senior engineering labor while <b>automating roadway asset detection</b> to ensure safer, well-maintained highways for residents statewide.</li><li><a href=\"https://www.youtube.com/watch?v=SHI_E1vMRws\" target=\"_blank\"><b>City of Los Angeles</b></a><b>:</b> Facing the massive operational demand of hosting global events—including the 2026 World Cup, 2027 Super Bowl, and 2028 Olympic and Paralympic Games—the city is embedding Gemini directly into daily workflows across <b>45 departments</b> and <b>27,500 employees</b>. Serving as a force multiplier for municipal staff, the platform automates complex administrative tasks to amplify workforce capacity, accelerating service delivery and expanding multilingual support for over<b> 15 million expected visitors</b> and <b>four million residents</b> speaking more than<b> 224 languages</b>.</li><li><a href=\"https://www.youtube.com/watch?v=BKHxnvPav3w\" target=\"_blank\"><b>Maryland State</b></a><b>:</b> The state partnered with Google Public Sector to empower its <b>40,000-strong workforce</b> using Gemini and Gemini Notebook within a secure, privacy-first cloud foundation. By lowering cognitive load and <b>automating repetitive administrative tasks</b>, agency teams built and deployed a clean water management application in just <b>five weeks</b>-<b>saving thousands of staff hours</b> and <b>accelerating environmental oversight</b> to deliver more responsive, sustainable public services to Maryland residents statewide.</li></ul><h2><b>Accelerate your AI journey with Google Public Sector</b></h2><p>The agentic era is all about augmenting human capacity and empowering leaders and builders who make public service possible. Organizations across the public sector are leveraging Google Cloud’s integrated AI stack to redefine how they serve their stakeholders, empower their workforce, and advance their mission. At Google Public Sector, we are excited to partner with pioneering organizations as we build a more resilient, responsive, and connected government, together.</p><p>Join us at our <a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\">Google Public Sector Summit</a> on October 20 to hear from public sector leaders who are leveraging AI to re-imagine service delivery in the agentic era.</p></div>"
  "4a08cfbccc095a805deaf86d6e0d3a0d":
    "id": "4a08cfbccc095a805deaf86d6e0d3a0d"
    "title": "The DevFest Community Workshop Experience: Building Real Agents Together"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/the-devfest-community-workshop-experience-building-real-agents-together/"
    "published": "2026-09-19 01:00:00"
    "fetched": "2026-09-19 01:57:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This week we kicked off the DevFest season in North America at Google Hudson Square in New York City with 80 engineers packed into the room. Typical technical workshops hand you a finished repo, tell you to blindly paste blocks of code into your terminal, and hope nothing crashes. You walk away with green checkmarks, but your brain stays on autopilot.</span></p>\n<p><span style=\"vertical-align: baseline;\">We've introduced a completely different experience called </span><span style=\"font-style: italic; vertical-align: baseline;\">Workbench</span><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Workbench focuses on understanding core ideas and architectural models rather than obsessing over syntax and code snippets. Instead of getting bogged down in boilerplate, engineers spent the day grappling with the actual mental models behind graph engineering, self-evolving architectures, and automated self-patching harnesses.</span></p>\n<h2>A glimpse into the Workshop Experience</h2>\n<p><span style=\"vertical-align: baseline;\">At the DevFest Community Workshop, we spent one intense day building long-running, self-evolving multi-agent systems powered by Google's agentic stack. Ricky Robinett, Senior Director of Developer Marketing, kicked off the day by diagnosing why so many engineering teams hit a wall with agents. Ricky broke down why prompt engineering fails as a safety mechanism: English is just a probabilistic suggestion, not an execution boundary. </span></p>\n<p><span style=\"vertical-align: baseline;\">Right after Ricky, Rachel Francois, Google Developer Groups (GDG) North America Program Lead, took the stage alongside GDG Brooklyn organizers to welcome the community and spotlight the power of local developer chapters. They set the tone for the entire day, reminding everyone that building durable software works best as a team sport where engineers share real-world patterns and build local networks that outlast any single framework.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Getting hands on with labs</span></h3>\n<p><span style=\"vertical-align: baseline;\">Annie Wang &amp; Christina Lin, Americas DevRel Team members, led the morning lab that put those runtime ideas to work. Attendees explored Google's Agent Development Kit (ADK), Veo 3.1, Memory Bank on Gemini Enterprise Agent Platform, and RAG Engine on Gemini Enterprise Agent Platform. Through Workbench, developers grasped the principle of separating state from active compute for long running tasks. Workflows paused cleanly mid-execution, waited out asynchronous human approvals, and resumed without running up idle compute costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">After lunch, Logan Hennessy, Americas Developer Relations Engineer (DRE), and Kartik Derasari, Google Developer Expert (GDE), led a lab using auction history as insight for better bidding strategy. Attendees worked through the architecture by integrating BigQuery data into autonomous data engineering pipelines, reasoning about deterministic bidding logic and adding eval-gated, self-patching harnesses that catch spend anomalies and update runtime execution safely.</span></p>\n<p><span style=\"vertical-align: baseline;\">Between lab blocks, we ran fast-paced speed quizzes where developers raced to lock in their answers as quickly as possible. Screens flashed, fingers flew across keyboards, and seconds made the difference between topping the leaderboard or dropping five spots. Nothing beats watching a room full of serious engineers completely lose their cool over a live quiz leaderboard.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Join a DevFest Community Workshop this fall</span></h2>\n<p><span style=\"vertical-align: baseline;\">New York was only round one. We are taking this exact experience on tour to five more cities this fall. Find your city and grab your seat before spots fill up:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://rsvp.withgoogle.com/events/devfest-extended-sunnyvale\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sunnyvale on September 30</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://rsvp.withgoogle.com/events/devfest-extended-dc\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Washington DC on October 6</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://goo.gle/devfest-extended-atlanta\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Atlanta on October 30</span></a><span style=\"vertical-align: baseline;\"> (as a part of DevFest Atlanta)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://rsvp.withgoogle.com/events/devfest-extended-seattle\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Seattle on November 4</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://rsvp.withgoogle.com/events/devfest-extended-boston\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Boston on November 10</span></a></p>\n</li>\n</ul></div>"
  "d08927088ebee4a4efb9007270d6be17":
    "id": "d08927088ebee4a4efb9007270d6be17"
    "title": "How to upskill enterprise AI builders by using daily micro habits"
    "link": "https://cloud.google.com/blog/topics/consulting/upskill-your-ai-using-daily-micro-habits/"
    "published": "2026-09-19 01:00:00"
    "fetched": "2026-09-19 01:57:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As enterprises invest in generative AI, tech leaders keep seeing the same pattern: Developers test AI tools for a week, hit setup problems, and then drift back to the backlog. Nothing ships.</span></p>\n<p><span style=\"vertical-align: baseline;\">The real gap is enablement. In this landmark </span><a href=\"https://hbr.org/2019/02/making-learning-a-part-of-everyday-work\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Harvard Business Review</span><span style=\"text-decoration: underline; vertical-align: baseline;\"> article</span></a><span style=\"vertical-align: baseline;\">, Josh Bersin and Marc Zao-Sanders noted that knowledge workers carve out just five minutes a day for formal learning. Most enterprise training programs still lean on week-long classroom bootcamps, multi-week certification tracks, and passive video lectures, none of which fit into the time developers actually have. </span></p>\n<p><span style=\"vertical-align: baseline;\">With the </span><a href=\"https://cloud.google.com/events/build-with-gemini-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Build with Gemini</span></a><span style=\"vertical-align: baseline;\"> event series underway, Google Cloud Consulting is seeing more leaders rethink AI enablement by building quick, daily practice into their teams' routines. In this post, we'll walk through a four-pillar approach and the lessons from our global developer challenges to share what micro-habit upskilling looks like.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Moving from workshops to daily practice</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">The traditional method…</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">…now becomes</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multi-week, semi-annual classroom bootcamps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Five-minute hands-on exercises</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Local workstation configuration and credential setup</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Pre-configured browser-based sandboxes</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Mandatory attendance and compliance checks</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Daily streaks, badges, and team challenges</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multiple-choice quiz completion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Deployable agent tools and reusable code </span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Rolling out a model like this comes down to keeping each task small and manageable. Here's how we structure that work across engineering teams:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Make micro-learning a habit.</strong><span style=\"vertical-align: baseline;\"> Offer short objectives that each cover one skill, like connecting a model to a database schema or validating structured output, in place of full-day training blocks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Give teams browser-based sandboxes.</strong><span style=\"vertical-align: baseline;\"> Setup is where most training stalls, so remove it. With a pre-configured, managed cloud environment, developers open a tab and are writing code within minutes, with no credentials to request and nothing to install or maintain on their own machines.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build in daily streaks.</strong><span style=\"vertical-align: baseline;\"> Milestones, shared wins, and teammates comparing solutions turn practice into a normal part of the workday.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">End every session with something that runs.</strong><span style=\"vertical-align: baseline;\"> Each exercise should leave behind a working component, and over time those components accumulate into a shared library of code and prompts the whole team can pull from.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Lessons from the Advent of Agents program</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/image_aG6dSR4.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When Google Cloud launched </span><a href=\"https://adventofagents.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Advent of Agents</span></a><span style=\"vertical-align: baseline;\">, a daily agent-building program for developers, we wanted to test one question: what happens when you remove setup and scheduling from technical enablement?</span></p>\n<p><span style=\"vertical-align: baseline;\">Each day, developers got one short, real-world agent exercise they could run right in the browser, with no half-day to block off and no setup guide to read first. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">150,000+ developers participated across global teams.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">859,000+ hands-on code executions in browser-based environments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">31% of participants returned daily, more than triple the </span><a href=\"https://blog.vocaliv.com/course-completion-rate-benchmarks-by-industry/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">10% industry average</span></a><span style=\"vertical-align: baseline;\"> for self-paced tech, and significantly exceeding the standard 5%–15% MOOC benchmark</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">32,000+ participants built working agent components.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">The above data was accessed via Advent of Agents Google Analytics metrics.</span></p>\n<p><span style=\"vertical-align: baseline;\">Keeping each exercise under five minutes and pre-wiring the sandboxes removed the two things that usually stall workplace training: setup time and scheduling. The numbers suggest developers will make time to learn when the exercise fits into the day they already have.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Putting micro-enablement into practice</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_loKECqr.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI enablement doesn't have to pause your sprints. It takes a consistent habit of practice and the tools that let teams build alongside their regular work.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Experience live building.</strong><span style=\"vertical-align: baseline;\"> Bring your engineering teams to a </span><a href=\"https://cloud.google.com/events/build-with-gemini-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Build with Gemini</span></a><span style=\"vertical-align: baseline;\"> workshop. The events are complimentary and run different tracks according to technical depth, from no-code for business leaders to code-first for developers, with live hands-on labs supported by Google Cloud experts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build skills with GEAR.</strong><span style=\"vertical-align: baseline;\"> Enroll your technical and business teams in the </span><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Ready (GEAR)</span></a><span style=\"vertical-align: baseline;\"> program. Membership is free and includes monthly learning credits on </span><a href=\"https://www.skills.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\">, hands-on labs, and skill badges, with learning paths for developers, line-of-business leaders, and IT decision-makers.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Start small, build often</span></h3>\n<p><span style=\"vertical-align: baseline;\">Developing AI skills starts with a change in routine. Short, daily, hands-on exercises let developers learn by doing, and the working code they produce along the way becomes the team's starting library for production work.</span></p>\n<p><span style=\"vertical-align: baseline;\">Give your developers a few minutes a day and a sandbox that's ready when they are. Start with one exercise this week and see how small, daily habits can build AI capability across your organization.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/events/build-with-gemini-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Join a Build with Gemini workshop</span></a><span style=\"vertical-align: baseline;\">: Sign up today for interactive labs and practical training for developing secure AI agents.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Start building with GEAR</span></a><span style=\"vertical-align: baseline;\">: Join GEAR and discover how to deploy enterprise-grade agents with hands-on learning and guidance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Explore free courses on Google Skills</span></a><span style=\"vertical-align: baseline;\">: Build in-demand AI expertise at your own pace.</span></p>\n</li>\n</ul></div>"
  "b683fc795fb34c164e5f18b6b0045778":
    "id": "b683fc795fb34c164e5f18b6b0045778"
    "title": "Accelerating the borderless Lakehouse: Announcing preview of cross-cloud caching"
    "link": "https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-cross-cloud-caching-and-connections/"
    "published": "2026-09-19 01:00:00"
    "fetched": "2026-09-19 01:57:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we are excited to announce enhancements to the </span><a href=\"https://cloud.google.com/solutions/data-lakehouse?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">borderless Lakehouse</span></a><span style=\"vertical-align: baseline;\">,</span><span style=\"vertical-align: baseline;\"> our answer to how data engineers, data scientists, and increasingly, AI agents, can query governed data directly where it lives.</span></p>\n<p><span style=\"vertical-align: baseline;\">To reason accurately and automate complex enterprise workflows, agents and data consumers of all types need fast, unified access to an organization's complete data estate, joining customer records, transaction logs, and operational telemetry across clouds. However, modern enterprise data is rarely confined to a single location; data estates often span Amazon S3, Azure Data Lake Storage (ADLS), Google Cloud Storage, operational databases, and SaaS platforms like Salesforce, SAP, and Workday. Historically, uniting these distributed datasets required brittle ETL pipelines, duplicated storage, and prohibitive cross-cloud data transfer costs.</span></p>\n<p><a href=\"https://cloud.google.com/blog/products/data-analytics/introducing-the-borderless-lakehouse?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">We introduced the </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">borderless Lakehouse</strong></a><span style=\"vertical-align: baseline;\"> earlier this year to let organizations query and activate data in place across clouds. By adopting the Apache Iceberg REST catalog specification, we federate directly to catalogs such as Databricks Unity Catalog, AWS Glue, and Snowflake Horizon. We also introduced </span><strong style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect </strong><span style=\"vertical-align: baseline;\">to establish high-bandwidth, private links to other cloud providers, lowering per-gigabyte transfer costs compared to the public internet. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are taking multi-cloud efficiency a step further by optimizing </span><span style=\"font-style: italic; vertical-align: baseline;\">how much data needs to be transferred across the wire in the first place</span><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">We are excited to announce two new features to help further reduce costs of querying cross-cloud data.  First, the preview of </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-borderless-lakehouse#intelligent-caching\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">cross-cloud caching</strong></a><span style=\"vertical-align: baseline;\"> for Lakehouse transparently accelerates cross-cloud queries in BigQuery and cuts remote transfer costs by caching frequently accessed data locally in Google Cloud. </span><strong style=\"vertical-align: baseline;\">Combining standard Iceberg columnar compression with cross-cloud caching means you often only need to transfer under 5% of the data you process across clouds,</strong><span style=\"vertical-align: baseline;\"> which helps lower the Total Cost of Ownership (TCO) to make cross-cloud analytics and AI viable at enterprise scale. In addition, </span><strong style=\"vertical-align: baseline;\">BigQuery cross-cloud connections</strong><span style=\"vertical-align: baseline;\"> are also available in preview to query non-Iceberg data in other clouds and accelerate workloads.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How cross-cloud caching works</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Cross-cloud caching meets enterprise performance and security requirements with no knobs to turn or storage to manage to accelerate your queries. Some of the mechanisms used under the hood are:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-file block granularity:</strong><span style=\"vertical-align: baseline;\"> Instead of transferring entire multi-gigabyte files across clouds when a query touches only a few columns, cross-cloud caching operates at the sub-file block level for columnar formats like Apache Parquet. BigQuery caches only the specific column chunks and dictionary pages projected by the query. On a cache miss, BigQuery fetches the needed data from the remote cloud to answer the query, and saves a local copy in the cache for future queries, drastically cutting network transfer and latency on repeated workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Default encryption at rest:</strong><span style=\"vertical-align: baseline;\"> Cached data blocks are encrypted at rest by default using Google-managed encryption keys (GMEK) so that temporary cache storage maintains the same enterprise-grade security posture as native BigQuery storage without extra overhead.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tenant and regional isolation:</strong><span style=\"vertical-align: baseline;\"> Cache entries are strictly partitioned by project and catalog boundaries to help prevent cross-tenant data exposure. Lakehouse anchors both the local cache and query execution strictly to the configured Google Cloud region (e.g., </span><code style=\"vertical-align: baseline;\">us-east4</code><span style=\"vertical-align: baseline;\">) to support compliance with regional data residency requirements when querying remote clouds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Freshness checks:</strong><span style=\"vertical-align: baseline;\"> Multi-cloud caching often forces a trade-off between speed and freshness. To avoid stale reads, BigQuery fetches remote object metadata before using cached data to ensure the data hasn’t changed and the user still has access. Any upstream table modification prompts BigQuery to fetch new files, while unreferenced cached blocks expire automatically, delivering local query speed with single-source-of-truth accuracy.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For more details on caching mechanics, statistics counters, and regional considerations, see the Lakehouse </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-borderless-lakehouse#intelligent-caching\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">intelligent caching documentation</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Cross-cloud caching in action</strong></h3>\n<p><span style=\"vertical-align: baseline;\">So how does this work in day-to-day operations? Consider an e-commerce team querying a 10 TiB Iceberg sales table (</span><code style=\"vertical-align: baseline;\">aws_lakehouse_catalog.sales.web_sales</code><span style=\"vertical-align: baseline;\">) in Amazon S3, federated into Lakehouse from Databricks Unity Catalog. During evening promotional drops (8:00–9:00 PM), analysts query historical transactions to identify which storefronts drive peak volume and revenue among high-intent demographics:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT w.web_name, hd.hd_buy_potential, COUNT(*) AS total_transactions, ROUND(SUM(ws.ws_sales_price), 2) AS total_sales\\r\\nFROM `aws_lakehouse_catalog.sales.web_sales` ws\\r\\n-- Joins household_demographics, time_dim (8:00-9:00 PM), and web_site.\\r\\nGROUP BY w.web_name, hd.hd_buy_potential;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f923a976fd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Initial execution: Cold columnar retrieval</span></h4>\n<p><span style=\"vertical-align: baseline;\">On this initial cold run, the local cache is empty (</span><code style=\"vertical-align: baseline;\">cacheBytesRead: \"0\"</code><span style=\"vertical-align: baseline;\">). BigQuery applies partition pruning and column projection to transfer only the required Parquet byte ranges from Amazon S3 over Partner Cross-Cloud Interconnect:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;totalBytesProcessed&quot;: &quot;230343464114&quot;,\\r\\n  &quot;objectStorageStats&quot;: [\\r\\n{&quot;cloudProvider&quot;: &quot;AWS&quot;, \\r\\n&quot;objectStorageBytesRead&quot;: &quot;25834740486&quot;, \\r\\n&quot;cacheBytesRead&quot;: &quot;0&quot;}]\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f92395b4cd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Logical data processed:</strong><span style=\"vertical-align: baseline;\"> BigQuery processes </span><strong style=\"vertical-align: baseline;\">214.5 GiB</strong><span style=\"vertical-align: baseline;\"> across the 10 TiB dataset.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Standard Iceberg compression efficiency:</strong><span style=\"vertical-align: baseline;\"> BigQuery reads </span><strong style=\"vertical-align: baseline;\">24.1 GiB</strong><span style=\"vertical-align: baseline;\"> from S3 thanks to standard Iceberg columnar compression with Zstandard (</span><code style=\"vertical-align: baseline;\">zstd</code><span style=\"vertical-align: baseline;\">) — an </span><strong style=\"vertical-align: baseline;\">8.9:1 compression ratio</strong><span style=\"vertical-align: baseline;\">. As these sub-file Parquet blocks arrive in Google Cloud, BigQuery populates the regional cache.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Follow-on exploration: Adding a dimension</span></h4>\n<p><span style=\"vertical-align: baseline;\">In practice, analysts and agents rarely run the exact same query twice in a row. To drill deeper into fulfillment methods, the analyst modifies the query by adding the shipping method dimension (</span><code style=\"vertical-align: baseline;\">sm.sm_type</code><span style=\"vertical-align: baseline;\">):</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT w.web_name, sm.sm_type, hd.hd_buy_potential, COUNT(*) AS total_transactions, ROUND(SUM(ws.ws_sales_price), 2) AS total_sales\\r\\nFROM `aws_lakehouse_catalog.sales.web_sales` ws\\r\\nJOIN `aws_lakehouse_catalog.sales.ship_mode` sm ON ws.ws_ship_mode_sk = sm.sm_ship_mode_sk\\r\\n-- Reuses existing joins on household_demographics, time_dim, and web_site.\\r\\nGROUP BY w.web_name, sm.sm_type, hd.hd_buy_potential;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f92397946d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Job statistics for this follow-on query show:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;totalBytesProcessed&quot;: &quot;287928766472&quot;,\\r\\n  &quot;objectStorageStats&quot;: [\\r\\n{&quot;cloudProvider&quot;: &quot;AWS&quot;, \\r\\n&quot;objectStorageBytesRead&quot;: &quot;1426587648&quot;, \\r\\n&quot;cacheBytesRead&quot;: &quot;25834740486&quot;}]\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f9239794090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">94.8% cache hit rate:</strong><span style=\"vertical-align: baseline;\"> BigQuery serves </span><strong style=\"vertical-align: baseline;\">24.1 GiB</strong><span style=\"vertical-align: baseline;\"> of previously queried columns directly from local cache.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Granular remote retrieval:</strong><span style=\"vertical-align: baseline;\"> BigQuery transfers only </span><strong style=\"vertical-align: baseline;\">1.33 GiB</strong><span style=\"vertical-align: baseline;\"> from S3 for the new </span><code style=\"vertical-align: baseline;\">ws_ship_mode_sk</code><span style=\"vertical-align: baseline;\"> column and </span><code style=\"vertical-align: baseline;\">ship_mode</code><span style=\"vertical-align: baseline;\"> table.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-file flexibility:</strong><span style=\"vertical-align: baseline;\"> Modifying a query reuses cached column chunks and transfers only newly required bytes.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Compounding efficiency at enterprise scale</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When thinking about TCO of cross-cloud queries, the top two factors to account for are:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Compression ratio: </strong><span style=\"vertical-align: baseline;\">when using default compression algorithms (Zstandard/zstd) on Iceberg, columnar data is highly compressible. If you assume that your data achieves a compression ratio of 8:1, it means every 1 TiB of logical data processed only requires ~128 GiB of data to move over the network.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cache hit rates: </strong><span style=\"vertical-align: baseline;\">when data is retrieved from cache rather than across the network because it was recently accessed, a network transit is avoided. Assuming 80% of your data results in a cache hit it means for every 100 GiB of physical data accessed only 20 GiB moves over the network.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Taking both factors and assumptions into account, </span><strong style=\"vertical-align: baseline;\">for every 1 TiB of data your organization processes, you only need to transfer ~26 GiB across the network (under 3% of total data processed)</strong><span style=\"vertical-align: baseline;\">. Combining this reduction with Partner Cross-Cloud Interconnect lowers TCO enough to make cross-cloud analytics and AI cost-effective at petabyte scale.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">BigQuery cross-cloud connections now in preview</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Alongside cross-cloud caching, the preview of </span><strong style=\"vertical-align: baseline;\">BigQuery cross-cloud connections</strong><span style=\"vertical-align: baseline;\"> lets organizations connect BigQuery directly to open-format data in Amazon S3 and Azure Storage. </span></p>\n<p><span style=\"vertical-align: baseline;\">Understanding when to use catalog federation versus cross-cloud connections is straightforward:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">BigQuery cross-cloud connections (for raw files):</strong><span style=\"vertical-align: baseline;\"> For standalone files (CSV, JSON, ad-hoc Parquet) without an Iceberg catalog, cross-cloud connections let you create BigQuery external tables referencing remote bucket paths directly.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lakehouse catalog federation (for Iceberg):</strong><span style=\"vertical-align: baseline;\"> For Iceberg data managed by catalogs like Databricks Unity, AWS Glue, or Snowflake Horizon, Lakehouse automatically synchronizes schemas and table snapshots to simplify the user experience and ensure users are always querying the latest data.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Cross-cloud connections serve as the modern architectural evolution by using standard BigQuery compute workers in Google Cloud regions rather than compute workers in other clouds. This approach helps unlock </span><strong style=\"vertical-align: baseline;\">global region availability</strong><span style=\"vertical-align: baseline;\"> and provides </span><strong style=\"vertical-align: baseline;\">full BigQuery feature parity </strong><span style=\"vertical-align: baseline;\">— including with BigQuery AI and Gemini on remote files.</span></p>\n<p><span style=\"vertical-align: baseline;\">The cross-cloud caching capabilities for Lakehouse applies to data queried from BigQuery cross-cloud connections as well as Lakehouse catalog federation. To learn how to create connections and query external bucket paths, see the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/cross-cloud-connections\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery cross-cloud connections setup documentation</strong></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
"last_updated": "2026-09-19 01:57:04 JST"
