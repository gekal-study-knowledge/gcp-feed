  この日は Google Cloud 日本語ブログの抄訳 2 本のみで、いずれも 9 月 5 日 (米国時間) の記事の翻訳でした。1 本は TPU v6e 上での Gemma 3 12B / 27B のベンチマークで、デコード負荷の高い生成タスクでは 27B が同時 64 ユーザーを超えると頭打ちになり 128 ユーザーで正規化スループットが 4.12 倍にとどまる一方、12B は 8.19 倍までスケールすること、プリフィル負荷の高い分類タスクではパラメータサイズの影響が小さく 12B・27B とも 128 ユーザーで約 6.0〜6.4 倍の同等のスケーリングに達することを報告しています。対策として、CPU / メモリではなくエンドツーエンド (E2E) レイテンシ指標に基づくスケーリングや、vLLM のバケットパディング最適化 (VLLM_TPU_BUCKET_PADDING_GAP) が推奨されています。もう 1 本は、Google の財務エンジニアリングチームがレガシーデータ層を Spanner へ移行した事例の抄訳で、ヘッドレスモードの Antigravity CLI による自動リファクタリングパイプラインを使い、過去データのバックフィル・二重書き込み / 二重読み取りの実装・自動化された API 検証とパリティチェックという 3 フェーズで、数十の DAO にまたがる移行をサービス停止なしに進めた内容です。いずれも前週にすでに紹介された記事の日本語訳です。
