  "fa484e982befb56a3fc126ec0cc38d7f":
    "id": "fa484e982befb56a3fc126ec0cc38d7f"
    "title": "分散 Ray クラスタに gVisor サンドボックスを導入"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke/"
    "published": "2026-09-04 20:20:00"
    "fetched": "2026-09-04 17:29:26"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 26 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">強化学習（RL）のエコシステムでは、複雑なトレーニング後のワークフローを支える統合コンピューティング ランタイムとして、Ray の採用が急速に進んでいます。Google Cloud のお客様も、マルチモーダル データ パイプラインから最先端の RL まで、さまざまなワークロードに Ray を活用しています。しかし、エージェント モデルと推論モデルが進化するにつれて、重大な課題が浮き彫りになってきています。それは、動的なロールアウト、コード生成、マルチターンのツール操作を安全に実行するために、安全で分離されたサンドボックスを大規模にオーケストレートすることです。このたび、</span><a href=\"https://www.anyscale.com/blog/announcing-native-sandboxing-in-ray\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Anyscale とのパートナーシップ</span></a><span style=\"vertical-align: baseline;\">による Ray の試験運用版ライブラリを導入いたします。このライブラリは、Google で開発中のエージェント型 AI テクノロジーを活用して、ネイティブで高性能なサンドボックス環境を分散 Ray クラスタに直接提供するものです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Ray プリミティブとしてのサンドボックス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Ray は、トレーニング後のワークロードをオーケストレートするための標準的なランタイムとして定着しています。veRL、NeMo-RL、SLIME、MILES、SkyRL などのフレームワークは、すでに Ray を使用して分散トレーナー、推論エンジン、ロールアウト ワーカーなどのコンポーネントを調整しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Ray サンドボックスの設計において重要な目標としたのは、隔離された実行のために新たな抽象化を導入するのではなく、既存の Ray プログラミング モデルに自然に馴染む形にすることです。サンドボックスは、Ray が管理する他のリソースと共通する特性を多く備えています。具体的には、マシンへの配置や、リソースの割り当て、作成と破棄、障害からの復旧、周囲のワークロードに応じたスケーリングなど、他のリソースと同様の管理が求められます。こうした背景から、各ハイレベル サンドボックスを Ray アクターとして表現する手法を採用しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_SrQumpQ.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Ray スケジューラは、どのノードでサンドボックスを実行するかを決定し、対応する CPU とメモリリソースを予約します。サンドボックス アクターが自身のライフサイクルを管理する一方で、gVisor はそのノード上で隔離された実行環境を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Ray 2.58 以降では、フレームワークの作成者と研究者は、他のワークロードで使い慣れた Ray API やパターンをそのまま使用して、サンドボックス環境を管理できます。以下にその例を示します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import ray\\r\\nfrom ray.experimental import sandbox\\r\\n\\r\\nray.init()\\r\\n# Create a gVisor sandbox environment and return an actor handle for a proxy actor\\r\\nsb = sandbox.create(\\r\\n    cpu=1.0,\\r\\n    memory=&quot;512Mi&quot;,\\r\\n    image=&quot;python:3.12-slim&quot;\\r\\n)\\r\\n# Execute code inside the sandbox\\r\\nresult = ray.get(sb.exec.remote(&quot;python -c \\&#x27;import sys; print(sys.version)\\&#x27;&quot;))\\r\\nprint(result.stdout)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb55adc0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これにより、OCI 互換イメージから gVisor サンドボックスが作成され、Ray アクターのハンドルが返されます。</span><code style=\"vertical-align: baseline;\">exec</code><span style=\"vertical-align: baseline;\"> の呼び出しは通常の Ray アクター呼び出しと同じであるため、サンドボックスはクラスタ内のどこにでも配置できます。作成されたアクターは、オペレーションを gVisor に転送するプロキシです。</span></p>\n<p><a href=\"https://docs.ray.io/en/master/ray-core/api/sandboxes.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サンドボックス API</span></a><span style=\"vertical-align: baseline;\"> は、エージェント型ワークロードに必要な基本的なライフサイクル管理に対応しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">OCI コンテナ イメージから環境を作成する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">CPU とメモリの上限を設定する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">環境変数、作業ディレクトリ、ネットワーキングを構成する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">コマンドを実行する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ファイルの読み取り、書き込み、アップロード、ダウンロードを行う</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">サンドボックスの状態を検査する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">環境を終了または削除する</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">さらに詳細な制御が必要な場合は、</span><code style=\"vertical-align: baseline;\">SandboxRuntime</code><span style=\"vertical-align: baseline;\"> を使用してローカルの gVisor サンドボックスを直接操作できます。これにより、gVisor に引き渡す前の OCI 仕様をユーザー側で編集できるようになります。この API を使用してアクター内にローカル サンドボックスのプールを構築する方法を以下に示します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import ray\\r\\nfrom ray.experimental.sandbox.runtime import SandboxRuntime\\r\\n\\r\\n@ray.remote\\r\\nclass SandboxPool:\\r\\n    def __init__(self, size: int = 3, image: str = &quot;python:3.10-slim&quot;):\\r\\n        self.runtime = SandboxRuntime()\\r\\n        self.sandboxes = [\\r\\n            self.runtime.create(image=image, memory=&quot;512Mi&quot;)\\r\\n            for _ in range(size)\\r\\n        ]\\r\\n\\r\\n    def run_command(self, index: int, command: str):\\r\\n        return self.runtime.exec(self.sandboxes[index], command)\\r\\n\\r\\n    def close(self):\\r\\n        for sb_id in self.sandboxes:\\r\\n            self.runtime.delete(sb_id)\\r\\n\\r\\n# Deploy an actor managing a pool of local sandboxes\\r\\npool = SandboxPool.remote(size=3)\\r\\nresult = ray.get(pool.run_command.remote(0, &quot;python3 -c \\&#x27;print(\\\\&quot;Hello from pool!\\\\&quot;)\\&#x27;&quot;))\\r\\nprint(result.stdout)\\r\\nray.get(pool.close.remote())&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb55abb0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">gVisor を選ぶ理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">モデルが生成したコードを実行する際は、その環境内のコードを「信頼できないもの」として扱う必要があります。Ray サンドボックスは、Google のオープンソース アプリケーション カーネルである </span><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor</span></a><span style=\"vertical-align: baseline;\"> を初期サンドボックス ランタイムとして使用します。gVisor は、Linux システムコール インターフェースの大部分をユーザー空間に実装し、ワークロードとホストカーネルの間に、さらなる分離境界を追加します。OCI 互換で、標準のコンテナ イメージをそのまま利用でき、Docker デーモンやホスト Docker ソケットをサンドボックスに公開する必要もありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">この組み合わせは、エージェント型ワークロードに非常に適しています。環境を動的に作成できるほど軽量に保ちながら、生成されたコードを通常のコンテナで直接実行するよりも強力な隔離環境を実現できるからです。gVisor は 1 秒未満の高速起動と低メモリ オーバーヘッドを両立しているため、サンドボックスを粒度の細かい分散リソースとして柔軟に活用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Ray の今後のバージョンでは、</span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> や Kata Containers といった他のサンドボックス ランタイムにもサポートを拡大していく予定です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">GKE で Ray サンドボックスを試す</strong></h4>\n<p><a href=\"https://docs.ray.io/en/master/ray-core/sandboxes.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray サンドボックス</span></a><span style=\"vertical-align: baseline;\">の詳細は、Ray のドキュメントでご確認いただけます。GKE でこれらのサンドボックス機能を試すには、</span><a href=\"https://docs.ray.io/en/master/cluster/kubernetes/examples/ray-sandboxing.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray サンドボックスのユーザーガイド</span></a><span style=\"vertical-align: baseline;\">をご参照ください。フィードバックやアイデアがございましたら、</span><a href=\"https://github.com/ray-project/ray/issues/65352\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\"> の issue でディスカッションにぜひご参加ください。強化学習における Ray の未来を一緒に考えていきましょう。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、スタッフ ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Andrew Sy Kim</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Anyscale、最高技術責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Philipp Moritz 氏</strong></p></div>"
  "8f070b79f7f52854f86e80172125b95a":
    "id": "8f070b79f7f52854f86e80172125b95a"
    "title": "AI プロトタイプを本番環境に移行する前にすべてのスタートアップが答えておくべき 10 の質問"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/10-questions-for-your-startup-developers/"
    "published": "2026-09-04 20:00:00"
    "fetched": "2026-09-04 17:29:26"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 21 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/10-questions-for-your-startup-developers?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud で AI を活用したスタートアップを立ち上げることが、これまでになく簡単になっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">朝食時に </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\"> から API キーを取得し、それを Antigravity に貼り付ければ、昼食時には製品のプロトタイプができ始めているでしょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、進歩の道のりは一直線ではありません。スタックを構築する際に、次の 3 つの課題に直面することがよくあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">API キーが漏洩し、48</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">時間で高額な請求が発生する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI Studio から </span><a href=\"https://cloud.google.com/vertex-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> への移行を急いで進めたが、チームに Identity and Access Management（IAM）の担当者がいないため、ロードマップが数週間停滞する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">リリースは成功したが、プロジェクトごとのデフォルトの割り当てが原因でアプリが「HTTP 429 Too Many Requests」を返すようになり、追加料金を支払わずに容量を増やす明確な方法がない。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらはどれも特殊なエッジケースではありません。​これらは、計画なしに急いで行動して失敗に陥ってしまうパターンであり、誰もが一度は経験したことがあるでしょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、スタートアップが事業を拡大する前に答えられるようにしておくべき 10 の質問を紹介します。これらの質問を、意思決定が将来を左右する 3 つのフェーズに分類しています。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オンボーディング</strong><span style=\"vertical-align: baseline;\">（独自のプロジェクトと ID を適切に設定する）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スケール</strong><span style=\"vertical-align: baseline;\">（費用をかけずにスループットを高める）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">管理</strong><span style=\"vertical-align: baseline;\">（費用、キー、エージェントの暴走を防ぐ）。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">これらの 10 の質問は、プロトタイプから本番環境への移行そのものを対象としています。各質問の最後には、すぐに実行できる短いスニペットが用意されています。このスニペットは、ご自身のプロジェクトにコピーして使用できます。その移行に特有ではない周辺的な意思決定（データレイヤと RAG アーキテクチャ、CI / CD、ネットワーク設計など）については、同様に重要ですが、ここでは意図的に対象外としています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">オンボーディング: 基礎を固める（ごく初期の段階）。</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">#1 Google AI Studio と Gemini Enterprise Agent Platform のどちらから始めればよいですか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">どちらのサーフェスも同じ Gemini ファミリーのモデルを提供しますが、解決する問題は異なります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google AI Studio</strong><span style=\"vertical-align: baseline;\">（Gemini Developer API を使用）は、アイデアから実際に動作するコードへと至る最短経路となります。ブラウザ IDE、API キー、豊富な無料枠が用意されており、クラウド プロジェクトを構成する必要はありません。ほとんどのアイデアはここから始めるべきであり、Google のガイダンスでもそのように推奨されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise Agent Platform </strong><span style=\"vertical-align: baseline;\">（旧称 Vertex AI）は、同じ Gemini モデル（サードパーティ製と OSS のモデルも含む）に加えて、企業向けの管理機能を備えています。具体的には、未加工のキーに代わる IAM とサービス アカウントによる認証、VPC Service Controls、Cloud Logging と Cloud Monitoring、予約済み容量、リージョン エンドポイント、そして最初の企業顧客によるセキュリティ審査で問われるコンプライアンス サーフェスです。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ほとんどのスタートアップにとっての正解は、両方を</span><strong style=\"vertical-align: baseline;\">意図した順序で</strong><span style=\"vertical-align: baseline;\">行うことです。まず AI Studio でプロトタイプを作成し、その後、実際のユーザーに提供する</span><strong style=\"vertical-align: baseline;\">前に</strong><span style=\"vertical-align: baseline;\">移行します。スタートアップにとって危険なのは、これらを交換可能なソリューションとして扱うことです。AI Studio のシンプルなキーモデルは企業向けの管理機能に適したものではなく、Agent Platform の IAM モデルは、認証情報が盗まれる被害から保護されていることを実感するまで、過剰なものに見えるかもしれません。</span></p>\n<p><span style=\"vertical-align: baseline;\">実際には、思ったより手間はかかりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">統合された </span><a href=\"https://github.com/googleapis/python-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">google-genai</span></a><span style=\"vertical-align: baseline;\"> SDK は、両方を対象としています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Prototype: Google AI Studio, raw API key\\r\\nfrom google import genai\\r\\nclient = genai.Client(api_key=&quot;YOUR_AI_STUDIO_KEY&quot;)\\r\\n\\r\\n# Production: GEAP, no key — uses Application Default Credentials (ADC)\\r\\nfrom google import genai\\r\\nclient = genai.Client(\\r\\n    vertexai=True,\\r\\n    project=&quot;my-startup-prod&quot;,\\r\\n    location=&quot;us-central1&quot;,\\r\\n)\\r\\n\\r\\nresp = client.models.generate_content(\\r\\n    model=&quot;gemini-2.5-pro&quot;,\\r\\n    contents=&quot;Summarize this contract in three bullets.&quot;,\\r\\n)\\r\\nprint(resp.text)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75fdc0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">#2 IAM のエキスパートがいない場合に Google Cloud プロジェクトを設定するにはどうすればよいですか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">スタートアップが Agent Platform への移行を躊躇する最大の理由は、コードではなく、API キーを 1 つ用意するだけの運用から、フォルダ、サービス アカウント、組織のポリシー、ロギング、IAM バインディングを備えたクラウド プロジェクトに移行するという、運用上の大きな変化です。チームに専任のクラウド管理者がいない場合、最初のプロジェクトのセットアップに 1 週間分のエンジニアリング時間がかかることがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">3 つのステップで、この時間を大幅に短縮できます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンソールを操作する代わりに、独自の設計思想が反映されたプロジェクト テンプレートを使用する。</strong><a href=\"https://console.cloud.google.com/cloud-setup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">クラウド設定のチェックリスト</span></a><span style=\"vertical-align: baseline;\">と </span><a href=\"https://cloud.google.com/architecture/framework\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud アーキテクチャ フレームワーク</span></a><span style=\"vertical-align: baseline;\">を使用すると、本番環境レベルのフォルダ階層（prod / non-prod / dev）、一元的なロギングとモニタリングのプロジェクト、</span><a href=\"https://cloud.google.com/security-command-center\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</span></a><span style=\"vertical-align: baseline;\"> の有効化、ベースライン組織ポリシーが提供されるため、これらをゼロから設計する必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">実際に使用する API を一度有効にする</strong><span style=\"vertical-align: baseline;\">必要なときにプロジェクトごとに実行しなくても済むように、バッチ処理します。請求先のリンクの手順は省略できません。これから有効にしようとしている有料 API は、請求先アカウントが関連付けられていないプロジェクトでは有効にできないため、まずはその設定を行います。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/iam/docs/role-picker-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini にロールを選択させます</span></a><span style=\"vertical-align: baseline;\">が、限定的なロールをリクエストします。ロールのリファレンスを覚える必要はありません。アクセス権を付与するダイアログで [推奨ロールの表示] を使用すると、平易な言葉でタスクを説明できます（「このサービス アカウントは Gemini モデルを呼び出し、1 つの Cloud Storage バケットを読み取る必要があります」など）。すると、その理由とともに事前定義ロールが返されます。初日に知っておくべき注意点が 1 つあります。デフォルトでは、一般的なユースケースをカバーするロールが提案されます。通常は、サービスの管理者、編集者、閲覧者のロールです。これらは、必要以上に広い権限を持っています。プロンプトで「最小権限」または「最小限のアクセス」と指定すると、代わりに詳細なロールが返されます。入力する量は同じですが、認証情報が漏洩した場合の影響範囲は大幅に小さくなります。</span><span style=\"vertical-align: baseline;\">出典: </span><a href=\"https://cloud.google.com/iam/docs/role-picker-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini のアシスト機能を使用して事前定義ロールの候補を取得する</span></a></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# One-shot: create a Vertex-ready project and turn on the services a\\r\\n# typical AI startup uses.\\r\\ngcloud projects create my-startup-prod --name=&quot;My Startup (prod)&quot;\\r\\ngcloud config set project my-startup-prod\\r\\n\\r\\n# REQUIRED before enabling billing-dependent APIs (aiplatform, run, etc.).\\r\\n# Use `gcloud billing accounts list` to find your billing account ID.\\r\\ngcloud billing projects link my-startup-prod --billing-account=012345-6789AB-CDEF01\\r\\n\\r\\ngcloud services enable \\\\\\r\\n  aiplatform.googleapis.com \\\\\\r\\n  run.googleapis.com \\\\\\r\\n  artifactregistry.googleapis.com \\\\\\r\\n  logging.googleapis.com \\\\\\r\\n  monitoring.googleapis.com \\\\\\r\\n  secretmanager.googleapis.com \\\\\\r\\n  cloudbilling.googleapis.com&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75f100&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">出典: </span><a href=\"https://cloud.google.com/sdk/gcloud/reference/services/enable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud services enable リファレンス</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/sdk/gcloud/reference/billing/projects/link\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud billing projects link（GA）</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/vertex-ai/docs/start/cloud-environment\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GE Agent Platform 環境の設定</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><span style=\"vertical-align: baseline;\">単独の創業者である場合は、個人の GCP アカウントで構築しないようにしてください。適切な組織または自己所有の組織を最初に作成し、その内部ににプロジェクトを作成します。この 1 つの決定により、IAM から請求、監査まで、その他すべての作業が大幅に簡素化されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">#3 Google Cloud を使用しています。コードの認証には、API キー、サービス アカウント、ユーザー認証情報のどれを使用すればよいですか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この問題には安全性の階層があり、最も簡単なオプションが本番環境において適切なオプションであることは稀です。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">未加工の API キー</strong><span style=\"vertical-align: baseline;\">は、ローカルでのプロトタイピングには適しています。これは、有効期間が長く、クライアント バンドルや公開リポジトリに漏洩しやすく、それに気づくまで無制限のアクセスを許可してしまうため、本番環境では危険です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">OAuth によるユーザー認証情報（アプリケーションのデフォルト認証情報）</strong><span style=\"vertical-align: baseline;\">は、対話型ツール、CLI のほか、デベロッパーのノートパソコンで実行されるコードに最適です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">サーバー、コンテナ、スケジュールされたジョブで実行されるものには、</span><strong style=\"vertical-align: baseline;\">最小権限の IAM ロールを持つサービス アカウント</strong><span style=\"vertical-align: baseline;\">が適しています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">目指すべきパターンは、コードが鍵をまったく認識しないパターンです。</span><a href=\"https://google-auth.readthedocs.io/en/latest/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Auth ライブラリ</span></a><span style=\"vertical-align: baseline;\">を呼び出すだけで、環境からアプリケーションのデフォルト認証情報（ADC）が読み取られます。これは、Cloud Run サービス、GKE ワークロード、または Compute Engine VM にアタッチされているサービス アカウントに対して発行された有効期間の短いトークンです。認証コードを記述しなくても、エンタープライズ グレードの認証を利用できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# On a developer laptop\\r\\ngcloud auth application-default login\\r\\n\\r\\n# On a server (Cloud Run, GKE, etc.) — no login, no key file.\\r\\n# Attach a service account with just the roles the app needs.\\r\\ngcloud run deploy my-agent \\\\\\r\\n  --image=us-docker.pkg.dev/my-startup-prod/agents/api:v1 \\\\\\r\\n  --service-account=agent-runtime@my-startup-prod.iam.gserviceaccount.com \\\\\\r\\n  --region=us-central1&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75f3a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Application code — notice: no keys, no secrets.\\r\\nfrom google import genai\\r\\n\\r\\nclient = genai.Client(\\r\\n    vertexai=True,\\r\\n    project=&quot;my-startup-prod&quot;,\\r\\n    location=&quot;us-central1&quot;,\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75f280&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">最後に、今後に備えて、そのサービス アカウントに、ワークロードが実際に必要とする最小限の IAM ロールを付与します。通常は、より広範な管理者ロールではなく、モデルを呼び出すための </span><a href=\"https://cloud.google.com/vertex-ai/docs/general/access-control\"><span style=\"text-decoration: underline; vertical-align: baseline;\">roles/aiplatform.user</span></a><span style=\"vertical-align: baseline;\"> にします。30 秒ほど余分に時間がかかりますが、認証情報が漏洩したとしても、それがマスターキーになるのを防ぐことができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">#4 AI Studio の API キーから Agent Platform の IAM モデルへの移行は、いつまで引き延ばせますか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">思っているよりも早く対応すべきです。正しいトリガーは、実害が出たときでは</span><strong style=\"vertical-align: baseline;\">ありません</strong><span style=\"vertical-align: baseline;\">。次のいずれかに該当する場合です。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">キーがノートパソコンから流出した（リポジトリにチェックインした、Slack に貼り付けた、モバイルアプリに組み込んだ）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">チームに API を呼び出す必要がある人が複数いる。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">1 か月あたり数百ドル以上を費やしている。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">有料ユーザーのオンボーディングが間近に迫っている。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">成長中のスタートアップが不意を突かれる可能性のある落とし穴は、単純なものです。たとえば、通常は月額 180 ドルを支払っているアカウントの Gemini API キーが公開リポジトリから漏洩し、蒸留攻撃に悪用されるケースです。この場合、所有者が最初の請求アラートを確認する前に、数万ドルの料金が累積してしまいます。</span><a href=\"https://cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud の責任の共有モデル</span></a><span style=\"vertical-align: baseline;\">は明確です。お客様は、有効な認証情報を使用して発生した料金について責任を負います。</span></p>\n<p><span style=\"vertical-align: baseline;\">移行自体は、移行に対する不安よりもはるかに小規模なものです。</span><strong style=\"vertical-align: baseline;\">google-genai </strong><span style=\"vertical-align: baseline;\">では、#1 に示す 2 行の変更です。実際に時間がかかるのは、それに伴うプロジェクトのセットアップです。まさにそのために 2 が存在します。</span></p>\n<p><span style=\"vertical-align: baseline;\">カットオーバー日の実用的なチェックリスト:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# 1. Revoke every existing AI Studio key that has ever left a laptop.\\r\\n#    (Go to https://aistudio.google.com/apikey and delete them.)\\r\\n\\r\\n# 2. Confirm your production code has no api_key= arguments.\\r\\ngrep -rn &quot;api_key&quot; src/\\r\\n\\r\\n# 3. Enable GEAP and confirm ADC works locally.\\r\\ngcloud services enable aiplatform.googleapis.com\\r\\ngcloud auth application-default login\\r\\npython -c &quot;\\r\\nfrom google import genai\\r\\nc = genai.Client(vertexai=True, project=\\&#x27;my-startup-prod\\&#x27;, location=\\&#x27;us-central1\\&#x27;)\\r\\nprint(c.models.generate_content(model=\\&#x27;gemini-2.5-flash\\&#x27;, contents=\\&#x27;ping\\&#x27;).text)\\r\\n&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75fd90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ステップ 3 でレスポンスが出力された場合は、Agent Platform を使用しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">スケール: 追加料金を支払うことなく容量を増やす。</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">#5 リリースしたのに、HTTP 429 エラーが頻発しています。これを解消するにはどうすればよいですか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Agent Platform からの「429 Too Many Requests」はほとんどの場合、次の 2 つのいずれかを意味します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">プロジェクトの階層の</span><strong style=\"vertical-align: baseline;\">動的共有割り当て（DSQ）</strong><span style=\"vertical-align: baseline;\">の上限に達した場合。DSQ は、プロジェクトの履歴に基づいてサイズが設定される共有プールです。プラットフォーム全体での不正使用を防ぐため、新しいプロジェクトは設計上、控えめな上限から始まります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">世界的に需要が急増しているときに、</span><strong style=\"vertical-align: baseline;\">グローバル エンドポイント</strong><span style=\"vertical-align: baseline;\">を呼び出し、共有容量をめぐって世界中のトラフィックと競合している場合。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">対策としてすぐ思いつくのは、割り当て増加のチケットを送信することです。必要であればそうすることもできますが、通常は 2 つのアーキテクチャ上の変更で、より迅速かつ安価に問題を解決できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">リージョン エンドポイントに固定する。</strong><span style=\"vertical-align: baseline;\">Agent Platform でのスタートアップ トラフィックの半分以上は、デフォルトでグローバル ルーティングに設定されています。特定のリージョン（</span><strong style=\"vertical-align: baseline;\">us-central1</strong><span style=\"vertical-align: baseline;\"> など）に固定すると、グローバルな競合を回避でき、通常はレイテンシも改善されます（次の質問で説明しますが、1 つだけ例外があります。Priority PayGo を特に希望される場合、この機能は現在グローバル エンドポイントでのみ提供されています。それ以外の場合は、リージョンに固定します）。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google import genai\\r\\n\\r\\n# Global (default): competes against worldwide demand.\\r\\n# Regional: routes only to the regional cluster, less contention.\\r\\nclient = genai.Client(\\r\\n    vertexai=True,\\r\\n    project=&quot;my-startup-prod&quot;,\\r\\n    location=&quot;us-central1&quot;,   # &lt;-- this is the one-line fix\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75f1c0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">適切な再試行とバックオフを追加する。</strong><span style=\"vertical-align: baseline;\">429 は再試行可能なシグナルであり、致命的なエラーではありません。本番環境のクライアントには、ジッターを伴う指数バックオフが必要です。最新の google-genai SDK には、</span><a href=\"https://cloud.google.com/vertex-ai/docs/reference/rest#retry_settings\"><span style=\"text-decoration: underline; vertical-align: baseline;\">この動作</span></a><span style=\"vertical-align: baseline;\">が組み込まれていますが、実際に有効にした場合にのみ機能します。これは見落としがちです。古い Vertex コードで見たことがあるかもしれませんが、従来の `google.api_core.retry.if_transient_error` デコレータは使用しないでください。これは従来の例外クラス向けに設計されており、新しい `google.genai.errors.APIError` を認識しないため、429 エラーを再試行せずに無視します。代わりに、SDK の組み込みの再試行オプションを使用します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(\\r\\n    vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;us-central1&quot;,\\r\\n    http_options=types.HttpOptions(retry_options=types.HttpRetryOptions(\\r\\n        attempts=5, initial_delay=1.0, max_delay=60.0, exp_base=2.0, jitter=1.0,\\r\\n        http_status_codes=[408, 429, 500, 502, 503, 504],\\r\\n    ))\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb75ff40&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この状況をどのように予測しますか？できれば、ユーザーから報告を受ける形ではなく。Agent Platform はサービング指標を Cloud Monitoring に公開します。また、[コンソール] &gt; [Agent Platform] &gt; [ダッシュボード] &gt; [モデルのオブザーバビリティ] に、アセンブル不要の事前構築済みダッシュボードがあります。1 秒あたりのリクエスト数、トークン スループット、最初のトークンのレイテンシ、エラー率をすぐに確認できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">実際にアラートを生成する指標は </span><code style=\"vertical-align: baseline;\">aiplatform.googleapis.com/publisher/online_serving/model_invocation_count</code><span style=\"vertical-align: baseline;\"> です。</span><code style=\"vertical-align: baseline;\">error_category</code><span style=\"vertical-align: baseline;\"> ラベルが付き、値は </span><code style=\"vertical-align: baseline;\">user</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">system</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">capacity</code><span style=\"vertical-align: baseline;\"> のいずれかになります。</span><code style=\"vertical-align: baseline;\">capacity</code><span style=\"vertical-align: baseline;\">に関するアラートは、自分自身の間違ったリクエストから実際のスロットリングを分離します。これは、未加工の 429 エラーのカウントでは行われません。</span></p>\n<p><span style=\"vertical-align: baseline;\">注意すべき点として、Standard PayGo では「使用量が割り当ての 80% に達したら警告して」というアラートを作成できません。動的共有割り当てでは、80% を限度とする、プロジェクトごとの固定値はありません。429 エラーは、共有容量の一時的な競合を意味し、限度を超えたことを意味するものではありません。割合を上限とするアラートは、実際の上限指標が提供されるプロビジョンド スループットを使用している場合にのみ意味を持ちます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud monitoring policies create --policy-from-file=capacity-alert.yaml&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dcecbd760&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">出典: </span><a href=\"https://cloud.google.com/monitoring/api/metrics_gcp_a_b\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform の指標リスト</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">モデルのオブザーバビリティ ダッシュボード</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/googleapis/python-genai/blob/main/google/genai/types.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RetryOptions のソース</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/googleapis/google-cloud-python/blob/main/packages/google-api-core/google/api_core/retry/retry_base.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コア retry_base.py</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/googleapis/python-genai/blob/main/google/genai/errors.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">genai </span></a><a href=\"http://errors.py/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">errors.py</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/reduce-429-errors-on-vertex-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">429 エラーの削減</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/sdk/gcloud/reference/monitoring/policies/create\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud monitoring policies create</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/dynamic-shared-quota\"><span style=\"text-decoration: underline; vertical-align: baseline;\">動的共有割り当て</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/quotas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform のレート制限に関するドキュメント</span></a><span style=\"vertical-align: baseline;\">に沿って、プロジェクトの現在の上限が実際にどの程度であるかを把握してから、上限を超えているかどうかを判断してください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">#6 Standard PayGo、Priority PayGo、プロビジョンド スループットのうち、どの消費モデルを利用すればよいですか。</strong></h4>\n<p><span style=\"vertical-align: baseline;\">3 つの消費モデルは、ワークロードの形態も進め方もまったく異なります。適切なものを選択することで、スタートアップは AI の請求額を大幅に削減できます。まず、それぞれの定義を確認し、どのような場合に適しているか、または適していないかを見ていきましょう。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Standard PayGo（DSQ）</strong><span style=\"vertical-align: baseline;\">: 共有プールからのトークン単位の課金。低価格、保証なし。</span><strong style=\"vertical-align: baseline;\">Priority PayGo</strong><span style=\"vertical-align: baseline;\">: トークン単位の課金、プレミアム料金のためキューをスキップ可能。</span><strong style=\"vertical-align: baseline;\">プロビジョンド スループット（PT）</strong><span style=\"vertical-align: baseline;\">: 予約済み容量を前払い。予測可能、使用しないと無効。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">消費タイプ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">最適な用途</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">注意点</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Standard PayGo（DSQ）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">初期段階、低 QPS、急激に変動するプロトタイプ トラフィック</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">急増時に 429 エラーが発生、信頼性 SLO なし</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Priority PayGo</strong></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">429 を許容できない、バースト性の高い、収益に不可欠なトラフィック</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">標準トークン価格の約 1.8 倍</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/provisioned-throughput\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">プロビジョンド スループット（PT）</strong></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">安定した、予測可能な、大量の本番環境トラフィック</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">使用率が 40% 未満の場合、費用が無駄になる。スパイク時には PayGo にオーバーフロー</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">スタートアップによくある間違いは、PT を早すぎる時期に購入することです。特に、大規模なリリースの翌週、トラフィックが増加する一方のように感じられるときに、こうした間違いが起きます。PT は予約済みの容量です。使用するかどうかにかかわらず料金を支払う必要があり、ベースラインが単なる願望ではなく、真に予測可能になった場合にのみ、元が取れるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">実用的な手順は次のとおりです。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Standard PayGo の第 1～4 週。</strong><span style=\"vertical-align: baseline;\">これを使用して、実際のリクエストの形態（p50 と p99 での 1 分あたりのトークン数、リクエストのバースト、バッチ処理可能とリアルタイム処理の内訳）を測定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">初めて 429 エラーが大量に発生したとき</strong><span style=\"vertical-align: baseline;\">は、実際に重要なトラフィックに対して Priority PayGo を有効にします。これは構成の変更であり、注文書ではないため、調達部門の担当者は関与する必要はありません。</span></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Priority PayGo request: use the global endpoint + two extra headers.\\r\\nfrom google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;global&quot;)\\r\\nresp = client.models.generate_content(\\r\\n    model=&quot;gemini-2.5-pro&quot;,\\r\\n    contents=&quot;Rank these support tickets by urgency: ...&quot;,\\r\\n    config=types.GenerateContentConfig(\\r\\n        # Priority PayGo headers, per current GEAP docs.\\r\\n        http_options=types.HttpOptions(headers={&quot;X-Vertex-AI-LLM-Request-Type&quot;: &quot;shared&quot;, &quot;X-Vertex-AI-LLM-Shared-Request-Type&quot;: &quot;priority&quot;}),\\r\\n    ),\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb7e5bb0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. </span><strong style=\"vertical-align: baseline;\">ベースラインの TPM を予測できるようになったら、</strong><span style=\"vertical-align: baseline;\">PT を購入してフラット ベースラインをカバーし、ベースラインを超える分は PayGo にオーバーフローします。これが、</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/provisioned-throughput-on-vertex-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google が推奨する組み合わせパターン</span></a><span style=\"vertical-align: baseline;\">であり、まったく理にかなったものです。単なる宣伝文句ではなく、両方の利点を活かしています。</span></p>\n<p><span style=\"vertical-align: baseline;\"> 出典: </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Priority PayGo のドキュメント</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://github.com/googleapis/python-genai/blob/main/google/genai/types.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">google-genai HttpOptions のソース</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/reference/rest\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GEAP REST リファレンス</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">#7 どのリクエストをライブにして、どのリクエストをバッチジョブにする必要がありますか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">スタートアップのワークロードのほとんどは、リアルタイムを装ったバッチジョブであることが実態です。ジョブをインタラクティブなパスから外すたびに、本当に高速であることが必要なトラフィック、つまりユーザーが実際にスピナーを見つめているトラフィックのために DSQ のヘッドルームが解放されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">トラフィックを分類するのに役立つ 3 つの質問:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーが 1 秒以内に結果を確認する必要がありますか？この場合は、</span><strong style=\"vertical-align: baseline;\">ライブ推論</strong><span style=\"vertical-align: baseline;\">です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーはスピナーを見ながら数秒間待つことができますか？この場合もライブですが、ストリーミングの候補でもあります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーは「準備が整い次第メールでお知らせします」または「しばらくしてからもう一度ご確認ください」というメッセージを許容できますか？この場合は、</span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/multimodal/batch-prediction\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">バッチ予測</strong></a><strong style=\"vertical-align: baseline;\">です。</strong></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Agent Platform でのバッチ予測は完全に独立したキューで実行され、インタラクティブな DSQ を消費しません。また、通常はオンデマンド推論の半額程度です。これは、ライブ トラフィックの高速化と費用の削減という二重のメリットをもたらす、まれな例です。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Kick off a batch prediction job from a JSONL file in Cloud Storage.\\r\\n# Each line is one prompt; results land in another Cloud Storage prefix.\\r\\nfrom google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;us-central1&quot;)\\r\\n\\r\\njob = client.batches.create(\\r\\n    model=&quot;gemini-2.5-flash&quot;,\\r\\n    src=&quot;gs://my-startup-prod-batch/inputs/nightly-summaries.jsonl&quot;,\\r\\n    config=types.CreateBatchJobConfig(\\r\\n        dest=&quot;gs://my-startup-prod-batch/outputs/&quot;,\\r\\n    ),\\r\\n)\\r\\nprint(job.name, job.state)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb7e5520&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">一般的な候補: 夜間のドキュメント要約、新規登録者のバックグラウンド分類、一括翻訳、エンベディングのバックフィル、テストセットに対する評価実行。これらのいずれかが現在のライブパスにあれば、通常、それらを移動することが、今週できる最も効果的な変更となります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">管理: 費用、鍵、エージェントを管理する。</strong></h4>\n<h4><strong style=\"vertical-align: baseline;\">#8 請求額が 3 倍になっても丁寧なメールが届くだけでなく、実際に費用を削減できる利用額上限を設定するにはどうすればよいですか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">正直なところ、最近まで予算は通知するだけで、ブレーキペダルは自分で作る必要がありました。7 月にこの状況が変わりました。メカニズムは 3 つあり、これらはレイヤとして考えることができます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">利用額上限の予算</span></a><span style=\"vertical-align: baseline;\">（プレビュー）。Cloud Billing の予算で、メール通知だけでなく、強制的な適用が可能になりました。プロジェクトに利用額上限を設定すると、使用料金が予算の 100% を超えた時点で、Google はサービスを一時停止します。サービスを再開するには、手動で一時停止を解除する必要があります。Gemini API、Cloud Run、Cloud Run Functions とともに、Agent Platform が対象リストに明示的に記載されています。アラートは 50% と 80% で引き続き発生するため、予告もなく一時停止になるわけではありません。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">利用する前に知っておくべき 3 つのこと:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">各上限は、1 つのプロジェクトと 1 つの対象サービスに適用されます。アカウント全体の保護ではありません。Agent Platform と Cloud Run の両方に上限を設定する場合は、2 つの上限を設定することになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">適用は即時ではなく、推定費用に基づきます。上限を超えた分は通常どおり請求されるため、実際の予算上限よりも低い数値を設定してください。上限の解除は手動で行われ、サービスの再開には最長で 1 時間かかることがあります。また、プロビジョンド スループットの使用も一時停止されるため、容量を前払いしている場合は、上限に達するとその容量も使えなくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">公開時点ではプレビュー版であり、対象サービスのリストは今後増えていくことが記載されています。設計する前に、現在のリストを確認してください。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">課金を無効にする Pub/Sub トリガーによる予算設定</strong><span style=\"vertical-align: baseline;\">。利用額上限では対応できない、広範な影響範囲（複数のサービスの一括設定、プロジェクト全体、まだ対象になっていないサービスなど）が必要な場合は、依然として適切なツールです。予算がしきい値に達すると、Pub/Sub が Cloud Functions の関数を起動して請求先アカウントを切り離し、数分以内にすべての課金対象アクティビティを停止します。ネイティブの上限よりも大雑把で危険です。リソースが回復不能になる可能性があるため、最初にではなく、2 番目に試みてください。詳細なチュートリアル: </span><a href=\"https://cloud.google.com/billing/docs/how-to/notify\"><span style=\"text-decoration: underline; vertical-align: baseline;\">予算通知に自動的に応答する</span></a><span style=\"vertical-align: baseline;\">。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Sketch: create a budget SCOPED TO ONE PROJECT that publishes to Pub/Sub at 50%, 90%, 100%.\\r\\ngcloud billing budgets create \\\\\\r\\n  --billing-account=012345-6789AB-CDEF01 \\\\\\r\\n  --display-name=&quot;my-startup-prod hard stop&quot; \\\\\\r\\n  --budget-amount=2000USD \\\\\\r\\n  --filter-projects=projects/my-startup-prod \\\\\\r\\n  --threshold-rule=percent=0.5 \\\\\\r\\n  --threshold-rule=percent=0.9 \\\\\\r\\n  --threshold-rule=percent=1.0,basis=current-spend \\\\\\r\\n  --notifications-rule-pubsub-topic=projects/my-startup-prod/topics/budget-alerts&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb7e5b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">出典: </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">利用額上限の予算を管理する</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-programmatic-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プログラムによる通知を設定する</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/sdk/gcloud/reference/billing/budgets/create\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud billing budgets create リファレンス</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Billing の予算のコンセプト</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/billing/docs/how-to/disable-billing-with-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">通知で課金を無効にするチュートリアル</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-programmatic-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プログラムによる通知のペイロード スキーマ</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><span style=\"vertical-align: baseline;\">デフォルト設定が予期しない問題を引き起こす可能性があるため、事前に対応すべきことが 2 つあります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">予算の範囲を制限する: --filter-projects を使用しない場合、予算は請求先アカウント全体に適用されます。いずれかのプロジェクトで急増が発生すると、すべてのキルスイッチがトリガーされます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ローカルにデプロイする: 予算通知では、影響を受けるプロジェクトが指定されていません。キルスイッチが目的のプロジェクトにのみ影響するように、保護するプロジェクト（my-startup-prod など）と同じプロジェクトに Cloud Functions の関数をデプロイします。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">次に、そのトピックに小さな Cloud Functions の関数を接続し、100% のしきい値に達したときに </span><strong style=\"vertical-align: baseline;\">projects.updateBillingInfo </strong><span style=\"vertical-align: baseline;\">を呼び出して請求先アカウントのリンクを解除します。これが、回路ブレーカーの役割を果たします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">割り当てのオーバーライドによる機械的な上限。</strong><span style=\"vertical-align: baseline;\">上記のキルスイッチを設定しなくても、プラットフォームのデフォルトを下回る、モデルごと、リージョンごとの割り当てを明示的に設定することで、費用が累積するレートに上限を設けることができます。アプリの本来の用途において </span><strong style=\"vertical-align: baseline;\">gemini-2.5-pro</strong><span style=\"vertical-align: baseline;\"> に対する 1 分あたりのリクエスト数が 500 を超えることがない場合は、</span><a href=\"https://cloud.google.com/docs/quotas/view-manage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Quotas コンソール</span></a><span style=\"vertical-align: baseline;\">で上限を 500 に設定します。割り当てによってサービスが拒否されるため、キーが漏洩してもリソースが消費されることはありません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">#9 シークレットはどこに保存すべきですか？（.env ファイルではありません）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">簡潔に言うと、</span><a href=\"https://cloud.google.com/secret-manager\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager</span></a><span style=\"vertical-align: baseline;\"> です。環境変数、</span><strong style=\"vertical-align: baseline;\">.env</strong><span style=\"vertical-align: baseline;\"> ファイル、リポジトリのいずれにも保存しないでください。IAM を介して、読み取りアクセス権を、そのアクセス権を必要とするサービス アカウントにのみ付与します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Store a third-party API key (Stripe, OpenAI, whatever).\\r\\necho -n &quot;sk_live_xxx&quot; | gcloud secrets create stripe-live-key --data-file=-\\r\\n\\r\\n# Grant only the runtime service account access to read it.\\r\\ngcloud secrets add-iam-policy-binding stripe-live-key \\\\\\r\\n  --member=serviceAccount:agent-runtime@my-startup-prod.iam.gserviceaccount.com \\\\\\r\\n  --role=roles/secretmanager.secretAccessor&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dbb7e5a90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Application code fetches it at startup; nothing lives on disk.\\r\\nfrom google.cloud import secretmanager\\r\\nsm = secretmanager.SecretManagerServiceClient()\\r\\nresp = sm.access_secret_version(\\r\\n    name=&quot;projects/my-startup-prod/secrets/stripe-live-key/versions/latest&quot;\\r\\n)\\r\\nstripe_key = resp.payload.data.decode(&quot;utf-8&quot;)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dccf6f130&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">次に、2 つのちょっとした習慣を紹介します。これらは、いざ必要になったときにその価値がわかります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">定期的なローテーションと、疑いがあるときのローテーション。</strong><span style=\"vertical-align: baseline;\">Secret Manager のバージョンは安価です。既存のバージョンを書き換えずに、ロール フォワードしてください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">シークレットが漏洩したときの検出。</strong><a href=\"https://cloud.google.com/secret-manager/docs/event-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager の通知</span></a><span style=\"vertical-align: baseline;\">と Google Cloud の</span><a href=\"https://cloud.google.com/sensitive-data-protection\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sensitive Data Protection</span></a><span style=\"vertical-align: baseline;\">により、攻撃者に先んじて、リポジトリにチェックインされたキーやログストリームに貼り付けられたキーを捕捉できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ユーザーに代わって動作する AI アプリケーション（ユーザーに代わって Gmail を呼び出す、ドライブのフォルダを読み取る、ユーザーの認証情報を使用してサードパーティの SaaS にアクセスするなど）には、有効期間の長いトークンを保存しないでください。有効期間の短いアクセス トークンと更新フローとともに OAuth 2.0 を使用します。これにより、ユーザーが突然退職した場合や、不正使用されたアカウントが取り消された場合、エージェントは同時にアクセス権を失います。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">#10 新しい AI エージェントが、決してすべきではないことをしないようにするにはどうすればよいでしょうか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ツールの呼び出し、ウェブの閲覧、コードの実行が可能なエージェントには、他のあらゆる本番環境サービスと同様の、あるいはそれ以上に「多層防御」の考え方が求められます。なぜなら、そうしたエージェントは、ユーザーにとってもモデルにとっても事前に完全には予測できないような判断を下すからです。</span></p>\n<p><span style=\"vertical-align: baseline;\">4 つのレイヤがあり、実際のユーザーがいる場合は、どれも省略できません。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. エージェント自体の ID。エージェントに独自のサービス アカウントを付与し、本当に必要なリソースとツールのみにスコープを限定します。これは、他のワークロードと同じ最小権限の原則です。Agent Engine はファースト クラスの</span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/agent-engine/identity\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント ID</span></a><span style=\"vertical-align: baseline;\"> をサポートしているため、監査ログですべてのアクションを特定のエージェント インスタンスに関連付けることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">2. サンドボックス化されたコード実行。エージェントが生成されたコードを実行する場合（データ分析や「この Python を実行して」のフローにおける一般的なパターン）、アプリケーション プロセスで実行しないでください。</span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/code-execution\"><span style=\"text-decoration: underline; vertical-align: baseline;\">隔離されたサンドボックス</span></a><span style=\"vertical-align: baseline;\">を使用することで、不適切な組み合わせが本番環境データに影響を与えないようにします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Enable server-side code execution inside a sandbox for a request.\\r\\nfrom google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;us-central1&quot;)\\r\\nresp = client.models.generate_content(\\r\\n    model=&quot;gemini-2.5-pro&quot;,\\r\\n    contents=&quot;Compute the correlation between these two columns: ...&quot;,\\r\\n    config=types.GenerateContentConfig(\\r\\n        tools=[types.Tool(code_execution=types.ToolCodeExecution())],\\r\\n    ),\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f3dccf6f4f0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. プロンプトと回答のフィルタリング。</span><a href=\"https://cloud.google.com/security-command-center/docs/model-armor-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</span></a><span style=\"vertical-align: baseline;\"> は、モデル呼び出しの手前に配置され、プロンプト インジェクション、ジェイルブレイク、機密データの引き出し、ブランドにそぐわない出力をスクリーニングします。これらはすべて、実際のユーザーが使い始めれば、実質的に避けられないものとなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">4. 行動のモニタリング。</span><a href=\"https://cloud.google.com/security-command-center/docs/concepts-security-sources\"><span style=\"text-decoration: underline; vertical-align: baseline;\">脅威検出</span></a><span style=\"vertical-align: baseline;\">機能を備えた </span><a href=\"https://cloud.google.com/security-command-center\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</span></a><span style=\"vertical-align: baseline;\"> は、エージェントの動作における異常にフラグを立てます。たとえば、サービス アカウントがこれまで使用したことのない API を突然呼び出す、エージェントが未知の外部ホストにアクセスする、特権操作が予期せず急増する、といったことです。これは、ほぼリアルタイムで行われます。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントが実際のユーザーに代わって行動したり、実際のお金を扱ったりするようになると、これらはどれも省略できなくなります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">いわば宿題として</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">リポジトリ、ノートブック、本番環境ランタイムで、未加工の API キーを監査します。そこにあるべきでないキーをローテーションします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">同期レスポンスを必要としないワークロードは、Batch API に移行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">モデルのオブザーバビリティ ダッシュボードを有効にして、容量エラーに関するアラートを 1 つ設定し、次の 429 エラーが顧客より前に自分に届くようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">プロジェクトの利用額上限を設定し、50% と 80% のアラートに注意します。使用量が予算の 100% を超えると、手動で解除するまで、Google はサービスを一時停止します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">今週この 4 つの事項を実施すれば、AI 機能をリリースしているほとんどのスタートアップよりも先を行くことができます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">次回取り上げてほしいシナリオはありますか？</span><a href=\"https://cloud.google.com/startup\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Google Cloud for Startups</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> までお問い合わせください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud AI、テクニカル ソリューション、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sergio Villani</strong></p></div>"
  "ab201d2745f53b42d25e1be8ae3e3bb9":
    "id": "ab201d2745f53b42d25e1be8ae3e3bb9"
    "title": "エージェントがより適切に委任を行う方法"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/how-agents-can-delegate-better/"
    "published": "2026-09-04 11:10:00"
    "fetched": "2026-09-04 17:29:26"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 22 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/how-agents-can-delegate-better?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">組織行動論の授業では、効果的な委任が経験豊富なリーダーにとって最も重要なスキルの一つであると生徒は学びます。有意義な作業を完了するには、プロジェクトを管理可能なタスクに細分化し、そのタスクをチームのスキルにマッピングして、適切な担当者に割り当てることから始めて、慎重に調整する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud では、エンタープライズ ワークフローにおける AI エージェントの構築とデプロイに関しても、同様の教訓を得ています。これらのワークフローには、複雑なタスクを分割して実行できるマルチエージェント システムが最適です。そのためには、AI エージェントが優れた委任者になる必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">その方法を学ぶために、Google DeepMind の研究に目を向けました。最近の研究「</span><a href=\"https://arxiv.org/abs/2602.11865\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intelligent AI Delegation</span></a><span style=\"vertical-align: baseline;\">」では、委任自体にインテリジェンス、具体的には、適応型の交渉、正式なコントラクトに基づく調整、セキュリティ ガードレールがどのように関わっているかが実証されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">この研究により、コミュニケーション、タスクの共有、設定された目標に向けた調整が可能な AI エージェントを構築するお客様に新たな機会がもたらされます。今回は、その研究から生まれた 4 つの原則と、それらを独自のワークフローに適用する方法をご紹介します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">原則 1: 委任された作業を検証する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AI にタスクを委任することを許可する場合、単に作業を任意に割り当てる以上のことが AI に求められます。エージェントは、作業を、確実に検証できるタスクにインテリジェントに分割する必要があります。Google の研究では、これを「コントラクト ファーストの分解」と呼んでいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">人間が委任を行う場合と同様に、これには慎重な検討が必要です。人間の場合、リーダーがチームの強みを理解し、完了前に作業を確認することなどが考えられます。AI にも同様の学習曲線があります。オーケストレーション AI（マルチエージェント システムの最上位に位置するマネージャー）は、作業を最適に分解して割り当てる方法について複数の計画を検討し、サブ目標を、監視および検証できるほど単純になるまで、より小さなチャンクに分解し続けます。理想的には、すべてを確実に評価できる計画を立てる必要があります。しかし、実際には、これを常に実現できるとは限りません。</span></p>\n<p><span style=\"vertical-align: baseline;\">場合によっては、期待どおりに作業が完了したかどうかを主観的に評価する必要があるかもしれません。このようなコンポーネントを特定することは、問題にはならず、むしろ、人間の時間をどこに費やすのが最適か、エージェント システムの監視に人間の専門家の判断をどのように関与させるのが最適かを判断するのに役立ちます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">原則 2: 費用を賢く管理する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">この研究フレームワークは、お客様からよく寄せられる「この特定のタスクは、より小さく、より安価なモデルで処理できるか？」という質問に答えるのに役立ちます。企業は費用にますます注意を払うようになっており、それは当然のことです。</span></p>\n<p><span style=\"vertical-align: baseline;\">パフォーマンスと予算の適切なバランスを見つけるのは難しいことです。給与計算のような複雑な問題を軽量モデルに任せても、期待する結果を得るだけの能力がない可能性があります。また、スプレッドシートの形式の再設定のような単純なタスクを強力な推論モデルにルーティングすることは不必要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">研究によると、委任についてインテリジェントなエージェントは、このようなシナリオを認識し、各タスクに適したツールまたはエンドポイントを選び、最小限のコストで望ましい結果と最大限の信頼性を実現することを学習します。API ゲートウェイ内のモデル ルーティング機能の使用は、クライアントサイド プロキシの使用の代替手段（LiteLLM など）に加えて、お客様の間で人気が高まっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">モデル ルーティングについて詳しくは、</span><a href=\"https://docs.cloud.google.com/api-gateway/docs/model-routing-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">原則 3: 機密データを尊重する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">多くのワークフローは非公開の機密データを処理するため、AI エージェントはそれらの境界と権限を尊重する必要があります。たとえば、給与データ用のオーケストレーター エージェントをデプロイする場合、そのエージェントが一連の情報全体をサブエージェントに渡すことがあってはなりません。これが発生すると、セキュリティが損なわれるだけでなく、エージェントのコンテキスト ウィンドウが肥大化し、パフォーマンスが低下します。エージェントには、特定の任務を完了するために必要な最小限の権限のみを付与する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">難しいのは、最初の原則に従って、非公開の情報を明らかにすることなく、作業が確実に完了したことを証明する必要がある場合です。研究によると、ゼロ知識証明などの手法による高度な暗号化が、この問題の解決に役立つ可能性があります。ゼロ知識証明により、一方の AI エージェントが、データ自体を明らかにすることなく、計画された計算が正しく実行されたことをもう一方の AI エージェントに証明できます。たとえば、機密性の高いデータセットの分析を任されたエージェントは、結果の特定のプロパティを証明する簡潔で非インタラクティブな知識の論証を生成できます。これにより、委任者は証明の有効性を即座に検証できます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">原則 4: 無関心圏に注意する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">無関心圏とは、アメリカの企業経営者であるチェスター バーナードが 1938 年に著した『The Function of the Executive（経営者の役割）』で用いた造語であり、従業員が疑問を抱くことなくタスクを受け入れる心理的スペースのことを意味します。通常、このタスクは従業員の業務範囲内にあるため、無意識のうちに受け入れてしまいます。たとえば、営業担当者が、重要な顧客との今後のプレゼンテーションに参加するようマネージャーから指示された場合、おそらく反論したり、深く考えたりすることはないでしょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">研究で示されているように、現在の AI システムは、トレーニング後の安全フィルタとシステム指示によって定義されています。リクエストが重大な違反を引き起こさない限り、モデルはリクエストに従います。しかし、台頭しつつあるエージェント型ウェブを考慮すると、リクエストに従うというこの行動は実際にはシステム上のリスクを生み出す可能性があります。研究で言及されているように、「委任チェーンが長くなると（? → ? → ?）、広範な無関心圏により、微妙な意図の不一致やコンテキストに依存する危害が下流に急速に伝播する可能性があり、各エージェントは責任あるアクターではなく、無思考のルーターとして機能します。」</span></p>\n<p><span style=\"vertical-align: baseline;\">これは重大な影響を及ぼします。なぜなら、インテリジェントな委任には「動的な認知的摩擦」が必要であることを意味するためです。つまり、エージェントに提供される情報を検証して、その情報が正確で、関連性があり、管理されており、効率的であることを確認する必要があるということです。</span></p>\n<p><span style=\"vertical-align: baseline;\">このようにして、エージェントは、リクエストがあまりにも曖昧なために、無関心圏から脱却することを正当化し、委任者に異議を唱えたり、人間の検証を要求したりする必要がある場合に、それを認識できます。同様に、人間の参加と監督は、ある程度の認知的摩擦と積極的なエンゲージメントを前提としていますが、システムのユーザーに過度の負担をかけないように、慎重に管理する必要があります。人間の時間は貴重であり、必要な場合にのみ人間の介入を要求する必要があります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">今後の展望</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の長期的な目標は、エージェントを組織に自然かつ効率的に統合することです。これは、人間の専門家との間で委任を行い、境界を尊重することを意味します。この組み合わせが、個々のエージェントが対応できる枠を超えたビジネス価値をもたらすと考えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント型ウェブをナビゲートする準備ができたら、arXiv で Google DeepMind のレポート「</span><a href=\"https://arxiv.org/abs/2602.11865\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intelligent AI Delegation</span></a><span style=\"vertical-align: baseline;\">」をお読みください。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">注: この投稿に協力してくれた Google DeepMind の Matija Franklin と Simon Osindero、Google Cloud の Vishal Agarwal と Andrea Morange に感謝します。</span></span></sup></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google DeepMind、リサーチ サイエンティスト</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Nenad Tomasev</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、応用 AI ブラックベルト</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Reshu Yadav</strong></p></div>"
