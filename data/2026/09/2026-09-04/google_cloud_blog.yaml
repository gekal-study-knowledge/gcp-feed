  "4ca01aff31b6d8b50548d036dca30d9e":
    "id": "4ca01aff31b6d8b50548d036dca30d9e"
    "title": "What’s new with Google Data Cloud"
    "link": "https://cloud.google.com/blog/products/data-analytics/whats-new-with-google-data-cloud/"
    "published": "2026-09-04 01:00:00"
    "fetched": "2026-09-04 06:34:34"
    "summary": "<div class=\"block-paragraph_advanced\"><h3>August 31 - September 4</h3>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Stateful processing is available in BigQuery continuous queries in Preview</strong><br /><a href=\"https://docs.cloud.google.com/bigquery/docs/continuous-queries-introduction#supported_stateful_operations\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Stateful operations</strong></a><span style=\"vertical-align: baseline;\"> significantly expand what’s possible with BigQuery continuous queries. This feature allows users to leverage functions like </span><code style=\"vertical-align: baseline;\">JOIN</code><span style=\"vertical-align: baseline;\">s, aggregations, and windowing functions directly in their streaming queries. Now you can calculate metrics over time (for example, a 30-minute average) to power your downstream applications and AI agents with much richer, real-time signals.<br /><br /></span><span style=\"vertical-align: baseline;\">Try out our feature </span><a href=\"https://docs.cloud.google.com/bigquery/docs/continuous-query-joins\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\"> and share your feedback with bq-continuous-queries-feedback@google.com!</span></li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Synthetic data generator tool is available for Managed Service for Kafka<br /></strong><span style=\"vertical-align: baseline;\">You’ve launched your first Kafka cluster. Now what? The next thing to do is to produce some data to the cluster, but that involves modifying a client application somewhere or spinning up a virtual machine. The synthetic data generator tool, now generally available, can start sending mock data to your cluster in 3 clicks, and will get data streaming into your cluster in less than two minutes. The perfect utility for those moments you just want to test your cluster and new features. Try </span><a href=\"https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/quickstart-synthetic-data\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our quickstart</span></a><span style=\"vertical-align: baseline;\"> today!</span></p>\n</li>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dataflow pipeline updates are faster &amp; more flexible<br /></strong><a href=\"https://docs.cloud.google.com/dataflow/docs/guides/upgrade-guide\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Dataflow pipeline updates</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">can now stop-and-replace pipelines, a major addition to the existing in-place-update feature. The new parallel pipeline option accelerates the migration between the old &amp; new pipeline, resulting in reduced disruption to your business. You can also set a timeout on drains that prevents runaway costs for your pipeliness in the event of stuck processing. This feature is generally available. Try it </span><a href=\"https://docs.cloud.google.com/dataflow/docs/guides/updating-a-pipeline\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">!</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">July 6 - July 10</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">New Lakehouse managed tables now in preview <br /></strong><a href=\"https://docs.cloud.google.com/lakehouse/docs/manage-tables\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse tables for Apache Iceberg</strong></a><span style=\"vertical-align: baseline;\"> are now in preview and available </span><span style=\"vertical-align: baseline;\">in the console</span><span style=\"vertical-align: baseline;\">. By using Google-managed Apache Iceberg tables in Lakehouse, you can eliminate the overhead of maintaining duplicate data pipelines and complex synchronization logic between BigQuery and open-source engine</span><span style=\"vertical-align: baseline;\">s</span><span style=\"vertical-align: baseline;\">. This unified table format delivers native, multi-engine read and write interoperability, allowing you to run concurrent DML/DDL operations across diverse analytics tools on a single, shared storage layer.  Built-in automated table management handles painful background optimization tasks like compaction and partition tuning, freeing up your team to focus on building rather than managing storage maintenance.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">June 1 - June 5</span></span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Beyond the Query: Powering AI Agents with Bigtable, Firestore &amp; Memorystore <br /></strong><span>Discover the latest advancements in Google Cloud's NoSQL Database portfolio, including Bigtable, Firestore, and Memorystore. This series is designed for a broad audience: whether you are exploring these databases for the first time or are an existing user looking to leverage the new capabilities announced at Next '26. <br /><br /></span><a href=\"https://rsvp.withgoogle.com/events/beyond-the-query-powering-ai-agents-with-bigtable-firestore-memorystore\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Register here to secure your spot!</strong></a></p>\n</li>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Engineer's AI Toolkit Workshops: </strong><span style=\"vertical-align: baseline;\">Solve data-driven challenges with </span><strong style=\"vertical-align: baseline;\">BigQuery, AlloyDB</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Gemini</strong><span style=\"vertical-align: baseline;\"> and more. </span><span style=\"vertical-align: baseline;\">Hosted by Google Cloud Labs, this highly technical event is built specifically for Platform Engineers, SREs, and cloud infrastructure teams ready to bridge the gap between AI prototypes and production-grade deployments. Look out for more locations coming soon<br /><br /></span><strong style=\"vertical-align: baseline;\">Toronto</strong><span style=\"vertical-align: baseline;\"> - June 25 (Data Cloud) | </span><a href=\"https://rsvp.withgoogle.com/events/google-cloud-labs-data-cloud-toronto\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RSVP Here</span></a><br /><strong style=\"vertical-align: baseline;\">Chicago</strong><span style=\"vertical-align: baseline;\"> - June 30 (Data Cloud) | </span><a href=\"https://rsvp.withgoogle.com/events/google-cloud-labs-data-cloud-chicago\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RSVP Here</span></a></p>\n</li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Start a 10-day </strong><a href=\"https://cloud.google.com/bigtable\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</strong></a><strong style=\"vertical-align: baseline;\"> free trial with a 1 node SSD cluster and up to 500GB of storage capacity. </strong><span style=\"vertical-align: baseline;\">W</span><span style=\"vertical-align: baseline;\">ith no credit card required to start, you can easily ingest workloads and manage workloads that require low-latency, high-throughput, and predictable access. </span><span style=\"vertical-align: baseline;\">Plus, new Google Cloud customers get </span><a href=\"https://docs.cloud.google.com/sql/docs/mysql/create-free-trial-instance\"><span style=\"text-decoration: underline; vertical-align: baseline;\">$300 in free credits</span></a><span style=\"vertical-align: baseline;\"> on signup.</span></span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">May 11 - May 15</span></span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Managed Service for Apache Airflow</strong><span style=\"vertical-align: baseline;\"> has launched a wave of new features, including the general availability of Airflow 3.1, AI-powered agentic troubleshooting, a new managed Airflow MCP Server for custom agent integration, and declarative YAML-based orchestration pipelines—discover all the details in the</span><a href=\"https://cloud.google.com/blog/products/data-analytics/managed-apache-airflow-scaling-data-and-ai-workloads\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">full blog post</span></a><span style=\"vertical-align: baseline;\">.</span></span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">April 20 - April 24</span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Google-built ODBC Driver for BigQuery is now available in Preview<br /></strong><span style=\"vertical-align: baseline;\">We are excited to announce the launch of the new, Google-built ODBC driver for BigQuery. This new open-source driver provides a direct, high-performance connection for applications to BigQuery and is developed entirely in-house by Google. </span><a href=\"https://docs.cloud.google.com/bigquery/docs/odbc-for-bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Download a new driver and connect your application to BigQuery</span></a><span style=\"vertical-align: baseline;\">.</span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">April 13 - April 17</span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\">We announced </span><a href=\"https://cloud.google.com/blog/products/data-analytics/looker-studio-is-data-studio\"><span style=\"text-decoration: underline; vertical-align: baseline;\">we are reintroducing Data Studio</span></a><span style=\"vertical-align: baseline;\"> to play a significant role in the AI era, expanding from data visualizations and reports to host BigQuery conversational agents and data apps built in Colab notebooks.</span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">We announced </span><a href=\"https://cloud.google.com/blog/products/data-analytics/introducing-bigquery-graph\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph is now available in preview</span></a><span style=\"vertical-align: baseline;\">, offering an easy-to-use, highly scalable graph analytics solution, empowering data professionals to model, analyze and visualize massive-scale relationships in an entirely new way. </span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">April 6 - April 10</span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\">We introduced </span><a href=\"https://cloud.google.com/blog/products/business-intelligence/looker-embedded-adds-conversational-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics for Looker Embedded environments</span></a><span style=\"vertical-align: baseline;\">, enabling users to add natural language experiences to their own custom data-driven applications, powered by Gemini. </span></li>\n<li><span style=\"vertical-align: baseline;\">We expanded Looker’s capabilities for faster ad-hoc analysis, with the </span><a href=\"https://cloud.google.com/blog/products/business-intelligence/looker-self-service-explores\"><span style=\"text-decoration: underline; vertical-align: baseline;\">introduction of self-service Explores</span></a><span style=\"vertical-align: baseline;\">, enabling you to bring your own data to Looker’s semantic layer and gain instant access to insights in a governed data environment.</span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">March 23 - March 27</span></span></span></span></span></span></span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\">We showed you how you can </span><a href=\"https://cloud.google.com/blog/products/databases/cloudsql-read-pools-support-autoscaling\"><span style=\"vertical-align: baseline;\">scale your reads with Cloud SQL autoscaling read pools.</span></a><span style=\"vertical-align: baseline;\"> This feature allows you to provision multiple read replicas that are accessible via a single read endpoint and to dynamically adjust your read capability based on real-time application needs. </span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Our customers are leveraging the full power of Conversational Analytics and Looker to drive major business and technical breakthroughs in the AI era. Companies like </span><a href=\"https://cloud.google.com/customers/telenor-looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Telenor</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/petcircle-looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pet Circle</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/fluent-commerce\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fluent Commerce</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/lighthouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lighthouse Intelligence</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/wego\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wego</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/customers/roller\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ROLLER</span></a><span style=\"vertical-align: baseline;\"> are turning data into insights and actions, grounded by Looker’s semantic layer.</span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">March 16 - March 20</span></span></span></span></span></span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">We introduced </span><a href=\"https://cloud.google.com/blog/products/data-analytics/gemini-supercharges-the-bigquery-studio-assistant\"><span style=\"text-decoration: underline; vertical-align: baseline;\">an enhanced Gemini assistant in BigQuery Studio</span></a><span style=\"vertical-align: baseline;\">, transforming the agent from a code assistant into a fully context-aware analytics partner.</span></span></span></span></span></span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">February 23 - February 27</span></span></span></span></span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">We introduced </span><a href=\"https://cloud.google.com/blog/products/databases/managed-mcp-servers-for-google-cloud-databases\"><span style=\"text-decoration: underline; vertical-align: baseline;\">managed and remote MCP support for Google Cloud databases</span></a><span style=\"vertical-align: baseline;\">, including AlloyDB, Spanner, Cloud SQL, Bigtable and Firestore, to power the next generation of agents. This announcement extends the ability for AI models to plan, build, and solve complex problems, connecting to the database tools our customers leverage daily as the backbone of their work environment.</span></p>\n</li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">We outlined how you can </span><a href=\"https://cloud.google.com/blog/products/data-analytics/build-data-agents-with-conversational-analytics-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">build a conversational agent in BigQuery using the Conversational Analytics API</span></a><span style=\"vertical-align: baseline;\"> to help you build context-aware agents that can understand natural language, query your BigQuery data, and deliver answers in text, tables, and visual charts.</span></span></span></span></span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">February 16 - February 20</span></span></span></span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Our customers are leveraging the full power of Looker to drive major business and technical breakthroughs. Companies like </span><a href=\"https://cloud.google.com/customers/arrive\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Arrive</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/audika\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Audika</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/looker-carousell\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Carousell</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/framebridge\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Framebridge</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/gumgum\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GumGum</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/intel-looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intel</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/overdose-digital\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Overdose Digital</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/one-looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ocean Network Express</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/customers/subskribe\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Subskribe</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/customers/promevo-looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Promevo</span></a><span style=\"vertical-align: baseline;\"> are leveraging Looker’s newest AI-driven capabilities, including Conversational Analytics, to transform data to insights and actions, and empower their entire organization with a single source of truth, powered by Looker’s semantic layer.</span></span></span></span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">February 2 - February 6</span></span></span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Join us on March 4 for our webinar, Win Your AI Strategy with Cloud SQL Enterprise Plus, to learn how to power your generative AI workloads with 3x higher performance and 99.99% availability. </span><a href=\"https://rsvp.withgoogle.com/events/win-your-ai-strategy-with-cloud-sql-enterprise-plus\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Register today</span></a><span style=\"vertical-align: baseline;\"> to discover how to build a scalable, enterprise-grade foundation for your most demanding AI applications.</span></span></span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">January 26 - January 30</span></span></h3>\n<ul>\n<li><span style=\"vertical-align: baseline;\">We introduced </span><a href=\"https://cloud.google.com/blog/products/data-analytics/introducing-conversational-analytics-in-bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics in BigQuery</span><span style=\"vertical-align: baseline;\">, which allows users to analyze data using natural language.</span></a> <span style=\"vertical-align: baseline;\">Conversational Analytics in BigQuery is an intelligent agent that generates, executes and visualizes answers grounded in your business context directly in BigQuery Studio, making data insights for data professionals more conversational.</span></li>\n<li><span style=\"vertical-align: baseline;\">We outlined how </span><a href=\"https://cloud.google.com/transform/from-asset-to-action-how-data-products-have-become-the-foundation-for-ai-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">data products have become the foundation for AI agents</span></a><span style=\"vertical-align: baseline;\">, providing the context needed to make autonomous agents reliable and trusted for real business use, backed by organized business logic and semantic understanding.</span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">We highlighted how </span><a href=\"https://cloud.google.com/use-cases/data-analytics-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">you can supercharge data analytics workflows</span></a><span style=\"vertical-align: baseline;\">, and outlined Google Cloud’s AI agent offerings for data engineering, data science, and development tools, so you can integrate agentic workflows in your applications, empower your teams and speed discovery.</span></span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">January 19 - January 23</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">We have fundamentally reimagined </span><a href=\"https://cloud.google.com/blog/products/data-analytics/new-firestore-query-engine-enables-pipelines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Firestore with pipeline operations for Enterprise edition</strong></a><strong style=\"vertical-align: baseline;\">.</strong><span style=\"vertical-align: baseline;\"> Experience a powerful new engine featuring over a hundred new query features, index-less queries, new index types, and observability tooling to improve query performance. Seamlessly migrate using built-in tools and leverage Firestore’s existing differentiated serverless foundation, virtually unlimited scale, and industry-leading SLA. Join a community of 600K developers to craft expressive applications that maximize the benefits of rich queryability, real-time listen queries, robust offline caching, and cutting-edge AI-assistive coding integrations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.mssqltips.com/sqlservertip/11578/introducing-google-cloud-sql/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Introducing Google Cloud SQL on MSSQLTips</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> We are highlighting a new technical guide published on MSSQLTips titled \"Introducing Google Cloud SQL.\" This article serves as an essential resource for SQL Server administrators and developers exploring Google Cloud's fully managed database service. It provides a detailed overview of Cloud SQL capabilities, including high availability, security integration, and the seamless transition of on-premises SQL Server workloads to the cloud, making it an ideal resource for those planning their migration strategy.</span></p>\n</li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">We are excited to announce the </span><strong><a href=\"https://medium.com/google-cloud/bridging-the-identity-gap-microsoft-entra-id-integration-with-cloud-sql-for-sql-server-a30207d63035\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Public Preview of Microsoft Entra ID</span></a></strong><span style=\"vertical-align: baseline;\"> (formerly Azure Active Directory) integration with Cloud SQL for SQL Server. Designed to tackle the challenge of identity sprawl in multi-cloud environments, this integration allows organizations to govern database access using their existing Microsoft identity infrastructure. Key benefits include centralized identity management, enhanced security features like Multi-Factor Authentication (MFA), and simplified user administration through direct group mapping. This feature is available for SQL Server 2022 and supports both public and private IP configurations.</span></span></li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">January 12 - January 16</strong></h3>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Google-built JDBC Driver for BigQuery is now available in Preview<br /></strong><span style=\"vertical-align: baseline;\">We are excited to announce the launch of the new, Google-built JDBC driver for BigQuery. This new open-source driver provides a direct, high-performance connection for Java applications to BigQuery and is developed entirely in-house by Google. </span><a href=\"https://docs.cloud.google.com/bigquery/docs/jdbc-for-bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Download a new driver and connect your Java application to BigQuery</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Troubleshoot Airflow tasks instantly with Gemini Cloud Assist investigations:</strong><span style=\"vertical-align: baseline;\"> Cloud Composer just got smarter. We are excited to announce that </span><strong style=\"vertical-align: baseline;\">Gemini Cloud Assist investigations </strong><span style=\"vertical-align: baseline;\">are now available directly within</span><strong style=\"vertical-align: baseline;\"> Cloud Composer 3</strong><span style=\"vertical-align: baseline;\">. Instead of manually sifting through raw logs, you can now simply click \"Investigate\" on a failed Airflow task. Gemini analyzes logs and task metadata to identify failure patterns—such as resource exhaustion or timeouts—and provides actionable recommendations driven by Gemini Cloud Assist to resolve the issue. This integration shifts the debugging experience from manual toil to automated root cause analysis, significantly reducing the time required to restore your pipelines.</span> <a href=\"https://docs.cloud.google.com/composer/docs/composer-3/troubleshooting-dags#investigations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn more about AI-assisted troubleshooting</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n</ul></div>\n<div class=\"block-related_article_tout\">\n\n\n\n\n\n<div class=\"uni-related-article-tout h-c-page\">\n  <section class=\"h-c-grid\">\n    <a class=\"uni-related-article-tout__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n        h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3 uni-click-tracker\" href=\"https://cloud.google.com/blog/products/data-analytics/whats-new-with-google-data-cloud-2025/\">\n      <div class=\"uni-related-article-tout__inner-wrapper\">\n        <p class=\"uni-related-article-tout__eyebrow h-c-eyebrow\">Related Article</p>\n\n        <div class=\"uni-related-article-tout__content-wrapper\">\n          <div class=\"uni-related-article-tout__image-wrapper\">\n            <div class=\"uni-related-article-tout__image\"></div>\n          </div>\n          <div class=\"uni-related-article-tout__content\">\n            <h4 class=\"uni-related-article-tout__header h-has-bottom-margin\">What’s new with Google Data Cloud - 2025</h4>\n            <p class=\"uni-related-article-tout__body\">Recent product news and updates from our data analytics, database and business intelligence teams.</p>\n            <div class=\"cta module-cta h-c-copy  uni-related-article-tout__cta muted\">\n              <span class=\"nowrap\">Read Article\n                <svg class=\"icon h-c-icon\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <use xlink:href=\"#mi-arrow-forward\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n                </svg>\n              </span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </a>\n  </section>\n</div>\n\n</div>"
