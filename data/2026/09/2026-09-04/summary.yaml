"overview": |
  この日は Google Data Cloud の週次まとめ (8 月 31 日〜9 月 4 日) を軸に、リリースノートと日本語の技術記事が並びました。BigQuery の継続的クエリでステートフル処理がプレビュー提供となり、JOIN や集計、ウィンドウ関数をストリーミングクエリの中で直接使えるようになりました。30 分平均のような時間をまたいだ指標を計算できるため、下流のアプリケーションや AI エージェントへ渡す信号を格段に豊かにできます。Managed Service for Kafka には合成データ生成ツールが一般提供で加わり、クライアントアプリの書き換えや VM の用意なしに、3 クリックで 2 分以内にモックデータをクラスタへ流し始められます。Dataflow ではパイプラインの更新が速く柔軟になり、既存のインプレース更新に加えて停止と置き換えによる更新ができるようになりました。リリースノートでは Cloud SQL for SQL Server が書き込みエンドポイントでの接続に対応し、Cloud SQL Auth Proxy や言語コネクタに書き込みエンドポイントの DNS 名を設定しておくと、レプリカのフェイルオーバーやスイッチオーバーの際に新しいプライマリへ自動的にリダイレクトされます。課金面では、Gemini Code Assist のサブスクリプションを持たない請求先アカウントは、Google Cloud コンソールから新規に購入できなくなりました。既にサブスクリプションがあるアカウントは影響を受けません。新規に必要な場合は営業への問い合わせとなり、代替の AI 開発ツールとしては Gemini Enterprise のサブスクリプションや Gemini Enterprise Agent Platform から使える Antigravity が案内されています。日本語ブログでは、分散 Ray クラスタに gVisor サンドボックスを導入する Anyscale との協業による試験運用版ライブラリが紹介されました。強化学習の事後学習で Ray が標準のランタイムとして定着するなか、動的なロールアウトやコード生成、マルチターンのツール操作を安全に実行するための隔離環境を大規模に扱う課題に応えるもので、新しい抽象を持ち込まずに各サンドボックスを Ray アクターとして表現し、Ray 2.58 以降では使い慣れた API とパターンのまま管理できます。あわせて、Google DeepMind の研究「Intelligent AI Delegation」を踏まえ、検証できる単位へ仕事を分解する「コントラクトファーストの分解」など 4 つの原則からエージェントの委任を設計する記事と、API キーの流出や AI Studio から Gemini Enterprise Agent Platform への移行、プロジェクトごとの割り当てによる HTTP 429 といったつまずきを避けるために、スタートアップが本番移行前に答えておくべき 10 の質問が公開されています。
