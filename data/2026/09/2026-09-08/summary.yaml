"overview": |
  この日は 5 件で、リリースノートの Compute Engine 更新と、敵対的 AI の進化に関する脅威レポートが目を引きました。Compute Engine では、単一プロジェクトの予約と共有予約を相互に変換できる機能が一般提供になりました。予約の共有タイプを変更して、組織内の他プロジェクトと予約リソースを共有したり、所有プロジェクトだけに制限したりできます。Google Threat Intelligence Group (GTIG) の AI Threat Tracker は、2026 年 5 月のレポート以降、攻撃者が基本的なプロンプト操作からエージェント型 AI ワークフローと AI による自動化へ移行していると報告しました。第 2 四半期には、クラウドリソースを侵害してから 6 時間未満で、エージェントを使った大規模な認証情報収集キャンペーンを計画・構築・実行した事例が観測され、UNC6780 が AI コーディングアシスタントや LLM のセキュリティスキャナーを欺いてオープンソースのサプライチェーンを侵害する手口も追跡されています。モデルの重みやクラウドの計算枠といった AI 資産自体が、諜報・恐喝・リソース窃取の標的になっているとしています。日本語ブログ (抄訳) では、サーバーレス Apache Spark のアーキテクチャ選択と Gemini Cloud Assist を使った障害のトラブルシューティング、前日までに扱われた BigQuery Graph GA と水道分野の Cloud CISO の視点の記事も出ています。
