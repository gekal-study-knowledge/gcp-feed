    "title": "How a solo founder runs a five-continent tender platform on AlloyDB and MCP"
    "link": "https://cloud.google.com/blog/products/databases/solo-founder-runs-a-global-tender-platform-on-alloydb-and-mcp/"
    "published": "2026-09-18 01:00:00"
    "fetched": "2026-09-18 01:16:51"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Editor's note:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"font-style: italic; vertical-align: baseline;\">Lucius AI, a tender-intelligence startup covering markets across five continents, runs its entire data platform on AlloyDB for PostgreSQL with a single operator. By migrating semantic search to a ScaNN index and managing database operations through Model Context Protocol (MCP), query latency dropped by 47x while automating day-to-day administrative tasks via MCP.</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Executive summary</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Lucius AI runs a global tender platform spanning more than 210,000 tenders across the UK, EU, India, and Australia, requiring minimal operational overhead for a solo founder.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Lucius AI deployed AlloyDB for PostgreSQL to consolidate its relational catalog, audit logs, and vector embeddings into a single managed database engine.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Migrating semantic search to a ScaNN index lowered query latency from 1.14 seconds to 24 milliseconds — a 47x speedup on a representative production query.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Connecting an AI agent to AlloyDB using the Model Context Protocol (MCP) helps Lucius AI automate query analysis, data freshness checks, and incident forensics under strict least-privilege permissions.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Making tender intelligence work as a company of one</span></h2>\n<p><span style=\"vertical-align: baseline;\">Lucius AI helps businesses bidding on public contracts evaluate opportunities across global markets. The platform ingests public procurement notices from the UK, the EU, the US and Canada, Australia and New Zealand, India and Singapore, alongside World Bank donor-funded notices across Africa and Asia. Lucius AI analyzes tender documents using Gemini to generate compliance matrices, bid recommendations, and draft responses citing original source pages. For small and mid-sized suppliers, this replaces days of manual document reviews and costly external consulting.</span></p>\n<p><span style=\"vertical-align: baseline;\">Running a platform of this scope requires extensive operational coordination:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Nightly ingestion from thirteen public procurement sources</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A catalog of more than 210,000 tenders, including tens of thousands open for active bidding</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Two production regions on Cloud Run: Europe, and an Australian deployment on its own AlloyDB cluster with customer-managed encryption keys (CMEK) for defense-adjacent customers</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Ongoing analytics, performance tuning, data validation, and incident response</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Managing these responsibilities without dedicated data engineering or database administration teams requires offloading operational maintenance. Lucius AI addressed this challenge on two fronts: using AlloyDB for PostgreSQL as the core system of record, and connecting an AI agent through the Model Context Protocol (MCP) to safely execute database operations.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_Zpv001B.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Consolidating systems into AlloyDB</span></h3>\n<p><span style=\"vertical-align: baseline;\">Rather than deploying separate relational databases, vector databases, and log stores, Lucius AI houses all core data in AlloyDB for PostgreSQL. The relational tender catalog, document metadata, audit logs, and vector embeddings reside in the same database engine. Storing vector embeddings alongside relational rows avoids managing separate vector stores, establishes a unified backup schedule, and centralizes identity management.</span></p>\n<p><span style=\"vertical-align: baseline;\">Authentication relies strictly on Cloud IAM. Services connect using dedicated Google Cloud service accounts mapped to database roles scoped to specific access requirements, without storing database passwords in application environments. Database reliability is managed natively by AlloyDB through automated backups and point-in-time recovery, avoiding custom disaster recovery procedures.</span></p>\n<p><span style=\"vertical-align: baseline;\">In production, this consolidated architecture supports:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">More than 210,000 tenders in the catalog</strong><span style=\"vertical-align: baseline;\">, with embeddings stored directly alongside them</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Rebuilding the semantic index embedded </span><strong style=\"vertical-align: baseline;\">115,820 records in 10.6 minutes</strong><span style=\"vertical-align: baseline;\"> with the Gemini embedding model, for around three dollars in API spend; AlloyDB auto embeddings now keep those vectors current.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Retrieval reranking executed directly inside the database using the </span><code style=\"vertical-align: baseline;\">ai.rank</code><span style=\"vertical-align: baseline;\"> function — with </span><strong style=\"vertical-align: baseline;\">mean latency of 77-milliseconds</strong><span style=\"vertical-align: baseline;\"> - returning the most relevant results for search queries without requiring a standalone reranking microservice</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Accelerating semantic search by 47x</span></h3>\n<p><span style=\"vertical-align: baseline;\">Semantic search across the tender catalog initially relied on unindexed vector comparisons, where a representative query took 1.14 seconds. Migrating this workload to a ScaNN index in AlloyDB reduced query latency to </span><strong style=\"vertical-align: baseline;\">24 milliseconds — a 47x improvement</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">The index recommendation originated from the AI agent during an automated performance audit, where it benchmarked the query plan before preparing the index migration.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_SEuqQ6L.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Automating database operations with MCP</span></h3>\n<p><span style=\"vertical-align: baseline;\">To delegate routine administrative tasks, Lucius AI configured the open-source MCP Toolbox for Databases using the prebuilt </span><code style=\"vertical-align: baseline;\">alloydb-postgres</code><span style=\"vertical-align: baseline;\"> server.</span></p>\n<p><span style=\"vertical-align: baseline;\">Operational delegation requires strict access controls. The agent connects using a dedicated PostgreSQL role granted SELECT across the schema and UPDATE on a single operational table. Destructive commands (</span><code style=\"vertical-align: baseline;\">DROP</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">DELETE</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">TRUNCATE</code><span style=\"vertical-align: baseline;\">) are omitted, restricting agent actions to authorized operational boundaries.</span></p>\n<p><span style=\"vertical-align: baseline;\">Under this configuration, the AI agent performs regular database operations across four key areas:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">On-demand analytics</strong><span style=\"vertical-align: baseline;\">: Compiles retention cohorts, activation funnels, and catalog coverage by country via ad hoc SQL queries, removing the need to build and maintain manual dashboards or complex analytical pipelines.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Performance optimization</strong><span style=\"vertical-align: baseline;\">: Performs query-plan inspections and index analysis, such as identifying the ScaNN indexing strategy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Incident forensics</strong><span style=\"vertical-align: baseline;\">: In response to an external security probe, the agent parsed audit logs to reconstruct the request timeline in minutes, verifying that tenant isolation remained intact.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated data-quality checks</strong><span style=\"vertical-align: baseline;\">: Evaluates ingestion watermarks and freshness across all thirteen procurement sources every morning.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_MXwqVC6.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For teams adopting this architecture, establishing a progressive permission structure provides clear guardrails: start with read-only access, expand permissions as requirements dictate, and keep destructive operations restricted to human administrators.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Looking ahead</span></h3>\n<p><span style=\"vertical-align: baseline;\">Lucius AI is planning three technical initiatives to further reduce operational overhead:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated vector embeddings in AlloyDB AI</strong><span style=\"vertical-align: baseline;\">: After validating </span><code style=\"vertical-align: baseline;\">ai.initialize_embeddings</code><span style=\"vertical-align: baseline;\"> across the full catalog, a weekly maintenance job uses </span><code style=\"vertical-align: baseline;\">ai.refresh_embeddings</code><span style=\"vertical-align: baseline;\"> to update vectors.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Columnar engine acceleration</strong><span style=\"vertical-align: baseline;\">: Having enabled AlloyDB’s columnar engine with auto-columnarization, the database identified and stored 40 frequently queried columns across four tables in memory within a day, accelerating reporting queries without a separate analytical store.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Managed Remote MCP Server</strong><span style=\"vertical-align: baseline;\">: Transitioning from self-hosted Toolbox processes to Google Cloud's fully managed Remote MCP Server for AlloyDB will offload MCP server hosting and maintenance.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">By anchoring core data in AlloyDB and managing routine operations through MCP, Lucius AI demonstrates how a single engineer can build and operate a resilient, multi-region procurement platform.</span></p>\n<p><span style=\"vertical-align: baseline;\">To explore Lucius AI, visit </span><a href=\"https://ailucius.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ailucius.com</span></a><span style=\"vertical-align: baseline;\">. To evaluate AlloyDB for PostgreSQL, deploy an </span><a href=\"https://cloud.google.com/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB cluster</span></a><span style=\"vertical-align: baseline;\"> to test performance against your own workloads.</span></p></div>"
