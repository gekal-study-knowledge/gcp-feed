    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 15 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/compute/forrester-wave-public-cloud-platforms-q3-2026-report?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、「</span><strong style=\"vertical-align: baseline;\">Forrester Wave™: Public Cloud Platforms, Q3 2026</strong><span style=\"vertical-align: baseline;\">」レポートにおいて、</span><strong style=\"vertical-align: baseline;\">Google Cloud がリーダーに選出され、「現在のサービス」カテゴリで最高スコアを獲得しました</strong><span style=\"vertical-align: baseline;\">。このレポートは、30 項目の包括的な基準に基づいて、最も重要なパブリック クラウド プロバイダ 10 社を評価したものです。また Google は、ビジョン、イノベーション、AI 開発サービス、データベース サービス、分析サービス、コンテナおよび Kubernetes サービス、モダナイゼーション サービス、セキュリティ サービスなど、30 項目の評価基準のうち 23 項目で最高スコアを獲得しました。Forrester による今回の評価は、エージェントの時代をリードするには、シリコンからシステム、モデルに至るまで、ゼロから設計された完全な統合プラットフォームが必要であるという Google の信念を裏付けるものだと考えています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_ZbIiC7j.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>無料レポート <a href=\"https://cloud.google.com/resources/content/2026-forrester-public-cloud-platform-wave-report\">The Forrester Wave™: Public Cloud Platforms, Q3 2026</a> をご覧ください。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">グローバル企業で実績のある共同設計インフラストラクチャを基盤に構築</strong></h3>\n<p><span style=\"vertical-align: baseline;\">10 年以上にわたり、Google のインフラストラクチャ エンジニア、アプリケーション デベロッパー、AI 研究者は肩を並べて、Gemini、検索、YouTube、マップ、Gmail を支えるインフラストラクチャを共同設計してきました。必要なプラットフォームとインフラストラクチャを単純に購入することはできず、自社での開発が必要でした。その結果、TPU から、Transformer アーキテクチャ、Kubernetes、Axion、そして Gemini に至るまで、あらゆるものが生み出されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントの時代には、最前線で AI 研究に取り組んでいなくても、コンピューティング、オーケストレーション ソフトウェア、モダナイゼーション ツール、グローバル ネットワークが連携して、投資からより多くの価値を引き出す統合 AI スタックが必要です。Google Cloud は、大手企業、スタートアップ、最先端の研究機関にこうした画期的なイノベーションをもたらし、新たなレベルの規模と効率性を実現できるよう、たゆまぬ努力を続けてきました。Forrester の評価は、その戦略が正しいことを証明するものだと考えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Google Cloud のビジョンは『エージェント型エンタープライズ』を実現することです。AI はすでにそのプラットフォームに浸透しており、同社は、企業における AI 導入をますます形作っているビジネス ユーザー向けに、技術スタックをさらに拡張する立場にあります。Google Cloud は、迅速な技術革新と、AI を活用した幅広いクラウド プラットフォームを求める企業に最適です。」-「The Forrester Wave™: Public Cloud Platforms, Q3 2026」レポート</span></p>\n<h3><strong style=\"vertical-align: baseline;\">セキュアで柔軟なプラットフォームでエージェントを迅速に実行</strong></h3>\n<p><span style=\"vertical-align: baseline;\">従来のインフラストラクチャのほとんどは、エージェントの進化についていけないため、企業はスケーラブルな代替インフラストラクチャを必要としています。しかし、AI エージェントのためだけに新しいグリーンフィールド プラットフォームを導入することは望ましくありません。Kubernetes は、マイクロサービスやトランザクション データベースからリアルタイムの LLM 推論まで、最新のエンタープライズ アプリケーションにおける実績のある業界標準です。Google は、組織が単一の実績あるプラットフォーム上で従来のワークロードとともに自律型エージェントをスケールできるように、Google Kubernetes Engine（GKE）と運用ツールを進化させています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Forrester は、コンテナおよび Kubernetes サービス、サーバーレス / FaaS サービス、運用管理サービスの評価で Google Cloud に最高スコアを付け、次のように述べています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「オペレーターは、運用管理、コンテナ、Kubernetes サービスにおいて、強力なサービスを見つけることができます。評価の結果、機能に大きなギャップは見つかりませんでした。」</span></p>\n<p><span style=\"vertical-align: baseline;\">過去 3 か月間、Google は、チームが企業の予測可能性を維持しながらエージェント ワークロードをスケールできるように、インフラストラクチャ ポートフォリオを強化しました。最近のアップデートにより、以下のことが可能になりました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GKE Agent Sandbox（一般提供版）と Cloud Run Sandbox（プレビュー版）を使用して、デフォルト拒否のセキュリティで従来のワークロードと並行して、</span><strong style=\"vertical-align: baseline;\">信頼できないエージェント コードを安全に実行</strong><span style=\"vertical-align: baseline;\">できます。これらのプロダクトにより、エージェント用に gVisor で分離された軽量の境界が 1 秒未満で（および 1 つのクラスタで毎秒最大 300 個のサンドボックスが）プロビジョニングされます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GKE Pod スナップショットを使用してコンテナの RAM 状態を Google Cloud Storage に直接シリアル化することで、</span><strong style=\"vertical-align: baseline;\">アイドル状態のコンピューティング費用を最大 90% 削減</strong><span style=\"vertical-align: baseline;\">できます。これにより、アイドル状態のエージェント セッションを約 100 ミリ秒で一時停止し、約 280 ミリ秒で再開できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GKE Inference Gateway の予測ルーティングにより、</span><strong style=\"vertical-align: baseline;\">最初のトークンまでの時間（TTFT）を最大 70%短縮</strong><span style=\"vertical-align: baseline;\">し、キャッシュ ヒット率を 2 倍に向上させることができます。GKE Inference Gateway は継続的にトレーニングされた ML モデルを使用して、リアルタイムのトラフィック データに基づいてルーティングを決定します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">リアルタイムの企業データでエージェントをグラウンディング</strong></h3>\n<p><span style=\"vertical-align: baseline;\">エージェントの有効性は、グラウンディングのコンテキストによって決まります。従来の分散データ トポロジでは、断片化されたマルチホップ パイプラインを介して、オペレーショナル データベースと分析システムが分離されています。エージェントの時代において、この分断はマルチホップのレイテンシ、古いコンテキスト、ガバナンスの摩擦を引き起こします。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の Agentic Data Cloud は、エンタープライズ データ プラットフォームを静的なリポジトリから動的な推論エンジンへと進化させます。トランザクション処理と分析インテリジェンスをアクティブなアクション システムに統合し、自律型ワークフローに必要なリアルタイムのコンテキストと決定論的な応答性を提供します。Google は、データベース サービス、分析サービス、データ統合サービス、データ ガバナンス サービスの各基準で 5/5 のスコアを獲得しました。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「マルチクラウドとハイブリッドの機能、分析システムとトランザクション システムを橋渡しする Agentic Data Cloud など、Google Cloud のデータベース サービスと分析における従来の強みは、優れたパフォーマンスを推進しています。」</span></p>\n<p><span style=\"vertical-align: baseline;\">過去 3 か月間で、Google は、お客様がデータ資産を統合できるよう、Agentic Data Cloud に以下の重要な機能を導入しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SAP BDC Connect for BigQuery（一般提供版）を使用して、コストのかかるデータの移動を必要とせずに、</span><strong style=\"vertical-align: baseline;\">エージェントがライブの財務記録やサプライ チェーン記録をクエリできるようにする。</strong><span style=\"vertical-align: baseline;\">SAP BDC Connect for BigQuery により、SAP システムと BigQuery の間でゼロコピーの双方向データ共有が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Knowledge Catalog を使用して、データ資産全体にわたってビジネス上の意味をマッピングおよび推論する。Google とパートナーのデータ プラットフォーム、セマンティック モデル、サードパーティのカタログ全体でネイティブ コンテキストを集約し、それらを管理された信頼できる唯一の情報源として統合できるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">レイクハウス フェデレーションを使用して、</span><strong style=\"vertical-align: baseline;\">PostgreSQL データプレーンから Iceberg と BigQuery のライブデータにアクセスする。</strong><span style=\"vertical-align: baseline;\">データの移動を必要とせずに、AlloyDB のトランザクション データと BigQuery または Iceberg の過去の分析情報をライブで結合できます。また、Datastream を使用して、AlloyDB から BigQuery および Iceberg テーブルにデータを継続的に複製することもできます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">新たな基準の確立: Google Cloud で次世代のテクノロジーを構築</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud が </span><a href=\"https://reprint.forrester.com/reports/the-forrester-wavetm-public-cloud-platforms-q3-2026-1154d3e5/index.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">The Forrester Wave™: Public Cloud Platforms, Q3 2026</span></a><span style=\"vertical-align: baseline;\"> においてリーダーに選出されたことを光栄に思います。この評価は、数十年にわたる基礎研究、統制されたフルスタックの共同設計、オープンで信頼性の高いクラウドの構築に対する Google の取り組みが認められた結果だと考えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">断片化されたインフラストラクチャの時代は終わりを告げました。100 万個のアクセラレータ チップでモデルをスケールする AI 研究機関、決済システムで数兆ドルを決済するグローバルな金融取引所、自律型ワークフローで数百万人のユーザーを支援する企業など、どのような組織にも、Google Cloud は次世代のテクノロジーの構築に必要なパフォーマンス、スケール、セキュリティ、データ基盤を提供します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">クラウドへの移行の次のステップ:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/resources/content/2026-forrester-public-cloud-platform-wave-report\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">レポート全文をダウンロード</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"font-style: italic; vertical-align: baseline;\">The Forrester Wave™: Public Cloud Platforms, Q3 2026</span><span style=\"vertical-align: baseline;\"> で詳細な分析をご覧ください。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Cloud Platform および SRE 担当プレジデント、Brad Calder</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- AI およびコンピューティング インフラストラクチャ担当バイス プレジデント兼ゼネラル マネージャー、Mark Lohmeyer</span></p></div>"
