  "a1f639db7fff4289b5bbeb40642ebe57":
    "id": "a1f639db7fff4289b5bbeb40642ebe57"
    "title": "AlloyDB Omni RPM オーケストレーターを使用するエンタープライズ グレードの PostgreSQL の一般提供を開始"
    "link": "https://cloud.google.com/blog/ja/products/databases/alloydb-omni-rpm-orchestrator-is-generally-available/"
    "published": "2026-09-18 11:30:00"
    "fetched": "2026-09-18 16:04:41"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/alloydb-omni-rpm-orchestrator-is-generally-available?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/docs/redhat-orchestrator-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni Red Hat RPM オーケストレーター</strong></a><span style=\"vertical-align: baseline;\">の一般提供を開始しました。これにより、エンタープライズ環境の PostgreSQL ワークロードで、プロダクション レディなセキュリティ、復元力、低ダウンタイムの運用が実現します。今回の一般提供開始は、</span><a href=\"https://medium.com/@lujjwal/automate-on-premises-database-operations-introducing-the-alloydb-omni-red-hat-rpm-orchestrator-4ab02ca8a85a\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プレビュー リリースで築いた基盤</span></a><span style=\"vertical-align: baseline;\">を足がかりとしています。また、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/docs/linux-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni バージョン 18.3.0</span></a><span style=\"vertical-align: baseline;\"> とともにリリースされたため、Google AI の機能により、仮想マシンやベアメタル サーバーで直接、クラウドのようなデータベース自動化が可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">この一般提供の開始時点では、要件に合わせて以下の 4 つのモードで AlloyDB Omni をデプロイできます。詳しくは、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/docs/choose-deployment\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni のドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">スタンドアロン コンテナ（Debian / UBI）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">高可用性エンタープライズ デプロイ向けの Kubernetes オペレーターを備えたコンテナ</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">スタンドアロン RPM</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">高可用性エンタープライズ デプロイ向けの RPM オーケストレーター</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">セルフマネージド データベースを運用する理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">多くのユースケースで、</span><a href=\"https://cloud.google.com/products/databases\"><span style=\"text-decoration: underline; vertical-align: baseline;\">マネージド クラウド データベース サービス</span></a><span style=\"vertical-align: baseline;\">が最もシンプルで費用対効果の高いオプションとなっています。しかし、クラウド上またはクラウド外で、PostgreSQL データベースを独自に運用することを選択するシナリオもあります。AlloyDB Omni RPM デプロイは、クラウドのパフォーマンスと、コンテナ化されていないローカル インフラストラクチャの制御を必要とする組織向けのソリューションであり、次のようなユースケースに対応できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードのモダナイゼーション:</strong><span style=\"vertical-align: baseline;\"> AlloyDB Omni は、標準の PostgreSQL と比較して、トランザクション ワークロードに関しては 2 倍以上、分析クエリに関しては最大 100 倍のスピードで動作し、完全な移行を行わなくても、既存のインフラストラクチャを活性化できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">規制の厳しい環境:</strong><span style=\"vertical-align: baseline;\"> RPM オーケストレーターは、データの所在地とセキュリティに関する厳格な要件がある業界向けに、コンプライアンスを維持するために必要な SELinux やローカル監査ロギングなどのツールを提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エッジへのデプロイとオンプレミスのデプロイ: </strong><span style=\"vertical-align: baseline;\">エッジまたはベアメタル サーバーにデプロイすることで、低レイテンシの処理とオフライン環境での運用が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI 対応インフラストラクチャ: </strong><span style=\"vertical-align: baseline;\">最新の生成 AI アプリケーションに対応した</span><a href=\"https://docs.cloud.google.com/alloydb/omni/linux/current/docs/ai/perform-vector-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ベクトル検索</span></a><span style=\"vertical-align: baseline;\">などの AlloyDB AI 機能をオンプレミスで直接使用して、AI 統合用のデータベース クラスタをプロビジョニングできます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">柔軟なリファレンス アーキテクチャ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Omni RPM オーケストレーターは、パフォーマンスの最大化、読み取りスループットのスケーリング、堅牢な高可用性（HA）の確保など、組織の特定の運用要件に合わせてカスタマイズされた柔軟なデプロイ モデルを提供します。詳しくは、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/database-availability-reference-architecture-overview?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni の可用性リファレンス アーキテクチャの概要</span></a><span style=\"vertical-align: baseline;\">をご覧ください。オーケストレーターは、ユーザーがインスタンス パラメータ、ノード構成、ネットワーキング オプションを調整してカスタマイズ可能なリファレンス アーキテクチャ仕様を定義できるようにすることで、クラスタのプロビジョニングとライフサイクル管理を簡素化します。スケーラブルな AlloyDB Omni HA リファレンス アーキテクチャのデプロイ図の例を以下に示します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_8L3W52J.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>RPM オーケストレーターを使用した AlloyDB Omni クラスタの高可用性リファレンス アーキテクチャ</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この図は、</span><strong style=\"font-style: italic; vertical-align: baseline;\">RPM オーケストレーター</strong><span style=\"vertical-align: baseline;\">によって管理される </span><strong style=\"font-style: italic; vertical-align: baseline;\">AlloyDB Omni</strong><span style=\"vertical-align: baseline;\"> の高可用性分散データベース リファレンス アーキテクチャを示しています。クライアント アプリケーションは堅牢なロード バランシング層に接続し、ロードバランサは読み取り / 書き込みトラフィックをアクティブなプライマリ データベース ノードに直接ルーティングしています。また、読み取り専用トラフィックはレプリカノードにルーティングされています。ロードバランサは仮想 IP（VIP）を使用しており、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Keepalived</strong><span style=\"vertical-align: baseline;\">（VIP フェイルオーバー用）、</span><strong style=\"font-style: italic; vertical-align: baseline;\">PgBouncer</strong><span style=\"vertical-align: baseline;\">（PostgreSQL 接続プーリング用）、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Haproxy</strong><span style=\"vertical-align: baseline;\">（ルーティングとロード バランシング用）により、ロードバランサ自体が高可用性を備えています。</span><strong style=\"font-style: italic; vertical-align: baseline;\">AlloyDB Omni プライマリ </strong><span style=\"vertical-align: baseline;\">インスタンス</span><strong style=\"font-style: italic; vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">データベース ノードは、複数のゾーンにわたってデータを同期的に複製することで高可用性を実現します。プライマリ HA クラスタに影響を与えずに、読み取り負荷の高いワークロードをスケールアウトするために、個別の</span><strong style=\"font-style: italic; vertical-align: baseline;\">読み取りプール </strong><span style=\"vertical-align: baseline;\">インスタンスがデプロイされています。これらはアクティブ ノードから非同期レプリケーションを受け取り、スケールアウトされます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この図は、独立したコントロール プレーンがクラスタ全体の構成と状態を管理する仕組みを示しています。管理者は RPM オーケストレーターを操作して、データベースのライフサイクルを監視します。コントロール プレーンは、冗長な</span><strong style=\"font-style: italic; vertical-align: baseline;\">クラスタ マネージャー</strong><span style=\"vertical-align: baseline;\">と 3 ノードの etcd ベースの</span><strong style=\"font-style: italic; vertical-align: baseline;\">分散構成ストア</strong><span style=\"vertical-align: baseline;\">で構成されており、クラスタの状態を確実に維持して構成を管理できます。コントローラは、個々のデータベース ノードで実行されている</span><strong style=\"font-style: italic; vertical-align: baseline;\">ノード マネージャー</strong><span style=\"vertical-align: baseline;\">と直接やり取りします。単一のクラスタのみをデプロイする場合は、コントロール プレーンとデータプレーンのコンポーネントを同じノードセットで実行できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">高可用性と読み取りのスケーラビリティ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">RPM オーケストレーターを使用すると、要求の厳しいワークロードの稼働時間の維持と読み取りのスケーリングが簡単になります。このオーケストレーターは、スタック全体の障害を自動的に処理できる復元力のあるアーキテクチャを提供します。たとえば、すべてのデータ / 制御パス コンポーネントや読み取り可能なスタンバイの障害を処理する機能や、ノード間のネットワーク中断を軽減する機能などがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このオーケストレーターは、読み取りワークロードをスケールアウトするための</span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/read-pool-orchestrator\"><span style=\"text-decoration: underline; vertical-align: baseline;\">読み取りプール</span></a><span style=\"vertical-align: baseline;\">をサポートするようになりました。これにより、読み取りプールを動的に作成したりクラスタに追加したりして、分析クエリや同様のワークロードのニーズを満たすことができます。また、スタンバイ ノードと読み取りプールに対する専用の読み取りエンドポイントの構成もシステムによって行われます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、AlloyDB Omni RPM オーケストレーターの機能を継続的に拡張しています。ビジネスの継続性とクロスリージョンの復元力をさらに強化する高度なエンタープライズ グレードの機能など、今後の機能にご期待ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">データ保護とセキュリティ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">データ セキュリティとデータの復元は、RPM オーケストレーターの中核をなす要素です。このリリースでは、自動化された</span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/backup-restore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">バックアップと復元の機能</span></a><span style=\"vertical-align: baseline;\">が統合され、バックアップ スケジュールを構成して、GCS または S3 互換ストレージへの完全自動バックアップを自動的に管理できるようになりました。このオーケストレーターを使用すると、S3 バケットまたは GCS バケットに対して、またはローカルでバックアップを実行できます。さらに、ポイントインタイム リカバリと、完全に自動化されたインプレース PIT 復元がネイティブにサポートされています。</span></p>\n<p><span style=\"vertical-align: baseline;\">RPM オーケストレーターは、ブートストラップ時またはブートストラップ後の SELinux 適用をサポートしています。これにより、厳格な企業のコンプライアンスとセキュリティ基準を満たし、強制的なアクセス制御と強力なプロセス分離を実現できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\"> データベース運用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">データベース フリートの管理に関連する運用上のオーバーヘッドが削減されました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">手間のかからない低ダウンタイム メンテナンス: </strong><span style=\"vertical-align: baseline;\">完全に自動化された新しい低ダウンタイム メンテナンス（LDTM）により、ライフサイクル アップデートとスケーリング オペレーションの管理が容易になります。マイナー バージョンのアップグレード時や CPU とメモリリソースの調整時に、ダウンタイムを最小限に抑え、自動ロールバックをサポートすることで、最大限の可用性を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">動的な構成: </strong><span style=\"vertical-align: baseline;\">データベース管理者は、ブートストラップ時またはブートストラップ後に GUC / 構成を変更する機能などを使用して、設定を動的に調整できます。AI 統合用のクラスタをプロビジョニングすることもできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クラスタ メンテナンスの簡素化: </strong><span style=\"vertical-align: baseline;\">ワークロードの需要の変化に応じてデータベース ノードを追加または削除するネイティブな運用機能により、クラスタ フットプリントの管理が簡単になります。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">オブザーバビリティ、AI、拡張機能</strong></h4>\n<p><span style=\"vertical-align: baseline;\">フリートのモニタリングと調整には、細部まで把握できる可視性と適切なツールセットが必要です。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高度なロギング: </strong><span style=\"vertical-align: baseline;\">このオーケストレーターは、データパスとコントロール パスのログをログディスクに転送することで、監査とデバッグを簡素化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">優れたオブザーバビリティ: </strong><span style=\"vertical-align: baseline;\">カスタム指標がサポートされているため、モニタリング エコシステムに合わせてオブザーバビリティを微調整できます。カスタム指標を使用すると、1 分あたりの新規ユーザー登録数、特定のテナントのアクティブ セッション数、処理された注文数など、ビジネスレベルのイベントをデータベースから直接追跡し、自社の中心的なオブザーバビリティ プラットフォームにエクスポートできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI と拡張機能:</strong><span style=\"vertical-align: baseline;\"> このオーケストレーターでは、AlloyDB Omni でサポートされている</span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/reference/extensions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一連の拡張機能</span></a><span style=\"vertical-align: baseline;\">だけでなく、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/linux/current/docs/ai/generate-sql-queries-natural-language\"><span style=\"text-decoration: underline; vertical-align: baseline;\">自然言語を使用したクエリ</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/linux/current/docs/ai/store-embeddings\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI を活用した検索</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/alloydb/omni/linux/current/docs/ai/evaluate-semantic-queries-ai-operators\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI 関数</span></a><span style=\"vertical-align: baseline;\">など、AlloyDB Omni のすべての AI 機能がサポートされています。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">早速始めましょう</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Omni Red Hat RPM オーケストレーターは、ベアメタルまたは VM プラットフォームで PostgreSQL 互換ワークロードを管理するための新たな手段となります。AlloyDB の高パフォーマンス、生成 AI 機能へのアクセス、Gemini モデルを組み合わせて、AI エージェントとアプリケーションを構築し、完全な自動化を実現できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">オンプレミスのデータベース運用のレベルアップをご希望なら、AlloyDB の</span><a href=\"https://docs.cloud.google.com/alloydb/omni/redhat-orchestrator/current/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">で詳細をご確認のうえ、今すぐ一般提供リリースをお試しください。</span><a href=\"http://forms.gle/zxuHekMtV67Bw9Av9\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらからご登録</span></a><span style=\"vertical-align: baseline;\">いただけます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、Google の新しい </span><a href=\"https://codelabs.developers.google.com/alloydb/omni/rpm/alloydb-omni-vm-ha-deployment\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Codelab</span></a><span style=\"vertical-align: baseline;\"> もお試しください。RPM オーケストレーターを使用して高可用性 AlloyDB Omni クラスタをデプロイできます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">シニア スタッフ エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ujjwal Lanjewar</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Omkar Deshmukh</strong></p></div>"
