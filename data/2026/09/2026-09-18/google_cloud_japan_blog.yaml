    "published": "2026-09-18 11:30:00"
    "fetched": "2026-09-18 16:04:41"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/how-to-replicate-sql-server-logins-and-passwords-to-cloud-sql?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データベースのモダナイゼーションを計画したとしましょう。Google Cloud の </span><a href=\"https://cloud.google.com/database-migration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Database Migration Service</span></a><span style=\"vertical-align: baseline;\">（DMS）を設定し、レプリケーションを構成して、オンプレミスまたはクラウド システムからフルマネージドの </span><a href=\"https://cloud.google.com/sql/sqlserver\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL for SQL Server</span></a><span style=\"vertical-align: baseline;\"> インスタンスにアプリケーション データベースを正常に同期しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">そしてレプリケーションが完了し、データが最新の状態になり、カットオーバーの準備が整いました。しかし、移行したばかりのデータベースにアプリケーションを接続しようとすると、次のメッセージが表示され、壁にぶつかります。</span></p>\n<p><code style=\"vertical-align: baseline;\">Msg 18456, Level 14, State 1, Line 1: Login failed for user 'app_user.</code></p>\n<p><span style=\"vertical-align: baseline;\">原因は単純です。SQL Server のログインが、データベースと一緒に移行されなかったからです。この投稿では、このギャップが存在する理由、これが組織のセキュリティ ポスチャーの保護につながる理由、そして長年の実績がある標準的な SQL Server ツールを使用して簡単にこのギャップを埋める方法をご説明します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">DMS でログインが移行されない理由: セキュリティとコンプライアンス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Database Migration Service（DMS）は、データベース レベルのスキーマとトランザクション データを非常に効率的に複製しますが、システム </span><code style=\"vertical-align: baseline;\">master</code><span style=\"vertical-align: baseline;\"> データベースやサーバーのログインと権限などのインスタンス レベルのオブジェクトは移行しません。これは、意図的な動作です。</span></p>\n<p><span style=\"vertical-align: baseline;\">機能が欠けているように感じられるかもしれませんが、実際には、次の 3 つの基本方針に基づく慎重な設計なのです。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セキュリティの分離と権限の境界:</strong><span style=\"vertical-align: baseline;\"> 移行元の環境と移行先の Cloud SQL 環境は、異なるセキュリティ パラダイムで運用されています。マスター システム データベースを直接複製すると、不正な権限昇格につながる可能性があります。たとえば、</span><code style=\"vertical-align: baseline;\">sysadmin</code><span style=\"vertical-align: baseline;\"> 権限を持つオンプレミスのログインに、フルマネージドの Google Cloud データベースへの無制限の </span><code style=\"vertical-align: baseline;\">sysadmin</code><span style=\"vertical-align: baseline;\"> アクセス権を付与すべきではありません。クラウド プロバイダが物理的なバックアップ、パッチ適用、セキュリティを管理する場合、適切な運用を確保するために、基盤となるオペレーティング システムへのアクセスを制限する必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンプライアンスと監査ガバナンス:</strong><span style=\"vertical-align: baseline;\"> 暗号化されたパスワード ハッシュとサーバーレベルのセキュリティ認証情報を、管理者の明示的な監視なしに自動的に移行した場合、PCI-DSS や SOC 2 などの企業のコンプライアンス フレームワークに違反してしまうことが珍しくありません。セキュリティ オブジェクトの移行を管理者が主導する慎重なステップとして維持することで、組織は承認された ID のみがクラウド ランディング ゾーンにプロビジョニングされることを保証できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ID のモダナイゼーションの必要性:</strong><span style=\"vertical-align: baseline;\"> クラウドへの移行は、古くなった認証情報を更新および削除する絶好の機会です。オンプレミス インスタンスには、使用されなくなった以前の SQL ログインが含まれていることがよくあります。深く考えずにそれらをクラウド マネージド サービスに複製することは、セキュリティのアンチパターンです。さらに、Cloud SQL への移行が、以前の SQL 認証から、顧客管理の Active Directory（CMAD）などのクラウドネイティブな最新の ID ソリューションへの移行を促進するきっかけとなることがよくあります。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">ログインとユーザーの違い: SID 接続</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ログインを正常に移行するために、SQL Server がセキュリティを管理する方法を簡単に復習しておきましょう。SQL Server では、ID が次の 2 つのレイヤに分かれています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ログイン（サーバーレベル）:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">master</code><span style=\"vertical-align: baseline;\"> データベースに保存されます。ログインは、SQL Server インスタンスへのクライアント接続を認証します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ユーザー（データベース レベル）:</strong><span style=\"vertical-align: baseline;\"> 個々のユーザー データベース内に保存されます。ユーザーは、その特定のデータベース内で接続が実行できるアクションを承認します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">サーバー ログインとデータベース ユーザーを橋渡しするのは、一意の</span><strong style=\"vertical-align: baseline;\">セキュリティ識別子（SID）</strong><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データベースをバックアップして復元する（または DMS を使用して複製する）と、データベース レベルの「ユーザー」（および対応する SID）がデータベース ファイル内に移行されます。ただし、対応するサーバーレベルの「ログイン」が移行先の </span><code style=\"vertical-align: baseline;\">master</code><span style=\"vertical-align: baseline;\"> データベースに存在しない場合、または存在しても SID が異なる場合、マッピングは解除されます。これにより、データベース アクセス権限はあるものの、サーバーレベルで認証できない「孤立したユーザー」が生じます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"SQL Server Logins 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_kO5uMVL.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: 対応するログインがないデータベース、またはセキュリティ識別子（SID）が一致しないデータベースを移行すると、移行先のインスタンスで孤立したユーザーが生じる。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">推奨ソリューション: sp_help_revlogin を使用してログインを複製する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">すべてのログインを手動で再作成し、パスワード ハッシュの見当を付けようとする代わりに、Microsoft が従来より提供しているスクリプト </span><a href=\"https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/security/transfer-logins-passwords-between-instances\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">sp_help_revlogin</code></a><span style=\"vertical-align: baseline;\"> を使用するとよいでしょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">このスクリプトは、移行元インスタンスのすべての SQL Server 認証ログイン用 </span><code style=\"vertical-align: baseline;\">CREATE LOGIN</code><span style=\"vertical-align: baseline;\"> ステートメントを含む T-SQL クエリを生成します。このステートメントは、元の暗号化されたパスワード ハッシュと正確なセキュリティ識別子（SID）を備えています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ステップ 1: 移行元インスタンスでヘルパー プロシージャを作成する</strong></p>\n<p><span style=\"vertical-align: baseline;\">SQL Server Management Studio（SSMS）を使用して、移行元の SQL Server インスタンスに接続します。Microsoft の公式スクリプトをコピーして実行し、移行元の </span><code style=\"vertical-align: baseline;\">master</code><span style=\"vertical-align: baseline;\"> データベースに 2 つの必須ストアド プロシージャ（</span><code style=\"vertical-align: baseline;\">sp_hexadecimal</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">sp_help_revlogin</code><span style=\"vertical-align: baseline;\">）を作成します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ステップ 2: 移行スクリプトを生成する</strong></p>\n<p><span style=\"vertical-align: baseline;\">プロシージャが作成されたら、SSMS のクエリ ウィンドウで次のステートメントを実行します。出力を正確にコピーするには、出力設定を [</span><strong style=\"vertical-align: baseline;\">Results to Text</strong><span style=\"vertical-align: baseline;\">] に切り替えてください（Ctrl+T）。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;EXEC master.dbo.sp_help_revlogin;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be0b95550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">出力には、次のような自動生成された T-SQL ステートメントが含まれます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE LOGIN [app_user] WITH PASSWORD = 0x01004F3D... HASHED, SID = 0x8D2F..., DEFAULT_DATABASE = [CustomerDB]&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be126e850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">HASHED</code><span style=\"vertical-align: baseline;\"> パスワード オプションと元の </span><code style=\"vertical-align: baseline;\">SID</code><span style=\"vertical-align: baseline;\"> を使用してログインをスクリプト化することで、SQL Server で元のパスワードと安全なリンクをそのまま維持してログインを安全に再作成できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ステップ 3: スクリプトを Cloud SQL に適用する</strong></p>\n<p><span style=\"vertical-align: baseline;\">生成されたスクリプトをコピーし、移行先の Cloud SQL for SQL Server インスタンスに接続して、クエリを実行します。ログインは、正しいパスワードでクラウドに即座に作成されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">sp_help_revlogin によって生成されたスクリプトを実行することで、正確なセキュリティ識別子（SID）とパスワード ハッシュをそのまま維持した状態で、移行先の Cloud SQL インスタンスにログインを複製できます。以下に示すように、これにより、データベース レベルのユーザーがデータベースの移行時にサーバーレベルのログインに自動的にマッピングされるため、「孤立したユーザー」を完全に回避できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"SQL Server Logins 2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_lFILOIi.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 2: sp_help_revlogin スクリプトを使用した統合移行プロセス。パスワード ハッシュと元の SID を保持し、Cloud SQL for SQL Server でユーザー マッピングを解決する。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">注: </strong><strong style=\"vertical-align: baseline;\">sp_help_revlogin</strong><span style=\"vertical-align: baseline;\"> は、Microsoft が作成、管理しているストアド プロシージャです。必ず最新バージョンをダウンロードし、</span><a href=\"https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/security/transfer-logins-passwords-between-instances\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をお読みください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">孤立したユーザーのトラブルシューティング</strong></h4>\n<p><code style=\"vertical-align: baseline;\">sp_help_revlogin</code><span style=\"vertical-align: baseline;\"> を実行する前に、移行先の Cloud SQL インスタンスにログインを手動で作成していた場合、SID が一致せず、ユーザーが「孤立」する可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">孤立したユーザー（</span><code style=\"vertical-align: baseline;\">app_user</code><span style=\"vertical-align: baseline;\"> など）が見つかった場合は、次の 1 つのコマンドで簡単に、新しく作成したサーバー ログインに再マッピングできます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;ALTER USER [app_user] WITH LOGIN = [app_user];&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be126d790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このコマンドにより、データベース ユーザーとサーバー ログインが SID を介してすぐに再結合され、アプリケーションの接続が完全に復元されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">セキュリティをさらに強化</strong></h4>\n<p><code style=\"vertical-align: baseline;\">sp_help_revlogin</code><span style=\"vertical-align: baseline;\"> を使用した SQL ログインの移行は、リフト＆シフト移行の最も簡単な方法ですが、クラウド移行を利用した認証のモダナイズもご検討いただけます。Cloud SQL for SQL Server は、</span><strong style=\"vertical-align: baseline;\">顧客管理の Active Directory（CMAD）</strong><span style=\"vertical-align: baseline;\">との堅牢な統合をサポートしています。移行先インスタンスを Active Directory と統合することで、従来の SQL ログインを廃止し、一元化されたエンタープライズ グレードの Kerberos 認証に移行できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">データベースの移行は、単なるデータ行の移動ではありません。アプリケーションのセキュリティ、コンプライアンス、運用性を初日から確保することが重要です。Google Cloud の DMS によってデータ レプリケーションの煩雑な処理を行う一方、シームレスなカットオーバーを保証する簡単な 3 ステップのプロセスでログインを移行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">移行戦略の最適化について詳しくは、</span><a href=\"https://cloud.google.com/sql/docs/sqlserver/migrate-data\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL for SQL Server 移行ガイド</span></a><span style=\"vertical-align: baseline;\">をご覧ください。また、</span><a href=\"https://cloud.google.com/database-migration-service\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Database Migration Service</span></a><span style=\"vertical-align: baseline;\"> を使用して Google Cloud への移行を効率化する方法もご確認ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">SQL Server ブラックベルト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Assaf Fraenkel</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Adi Shtatfeld</strong></p></div>"
  "b21c0665efeedf1c1721aa7d2467d73b":
    "id": "b21c0665efeedf1c1721aa7d2467d73b"
    "title": "Airtel、2026 年インディアン プレミアリーグのクリケット中継を完璧に配信"
    "link": "https://cloud.google.com/blog/ja/products/media-entertainment/how-airtel-delivered-its-flawless-indian-premiere-league-2026-cricket-broadcasts/"
    "published": "2026-09-18 11:00:00"
    "fetched": "2026-09-18 16:04:41"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/media-entertainment/how-airtel-delivered-its-flawless-indian-premiere-league-2026-cricket-broadcasts?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><a href=\"https://www.iplt20.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">インディアン プレミアリーグ</span></a><span style=\"vertical-align: baseline;\">（IPL）の何百万人もの熱狂的なファンにとって、クリケットのライブ配信を完璧な状態で視聴できることは絶対条件です。世界最大規模の同時視聴者数を誇る</span><a href=\"https://www.airtelxstream.in/Landing/page/indian-premier-league-2026/ipl-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">リーグのテレビ放送</span></a><span style=\"vertical-align: baseline;\">を制作する Airtel にとって、パケットのドロップやバッファリングは、決してあってはならないことです。</span></p>\n<p><span style=\"vertical-align: baseline;\">IPL 2026 のシーズン中、Airtel は Google Cloud と提携して、このデジタル配信に対応しました。このストリーミング インフラストラクチャが 74 試合にわたって配信した外向きデータは数百ペタバイトに及びます。決勝戦だけで数百億件のリクエストが処理され、ピーク時の外向きトラフィックは数 Tbps に達しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このような同時接続数の急増に対応して動画を配信するには、ローカル化を徹底追及したエッジ アーキテクチャと、プロアクティブな運用モニタリングを組み合わせる必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">IPL 2026 の目標は、同時接続数の急増やネットワークの状況にかかわらず、インド全土のクリケット ファンに、スタジアムにいるかのようなスムーズな視聴体験を提供することでした。Airtel は、Google Cloud と提携して Media CDN を使用することで、ローカルエッジへの近接性と優れたキャッシュ効率を実現できました。そして、これを試合当日のプロアクティブなリアルタイム モニタリングと組み合わせることで、最初から最後まで信頼性の高いブロードキャスト体験を提供できました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">同時接続数とエッジ効率を考慮した設計</strong></h4></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"IPL-BLog-Architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/IPL-BLog-Architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">スポーツのライブ配信における主な課題の一つは、トラフィックの急増をシームレスに処理し、ストリーミングのパフォーマンスを低下させたり、バックエンドの配信元に過剰な負荷をかけたりしないことです。最終オーバーは何百万人もの視聴者が同時に視聴します。1 ミリ秒が勝負を分けるため、この点が特に重要となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Airtel は、インドの多様な ISP 環境にわたってコンテンツ配信を高速化するために、Google Cloud の </span><a href=\"https://docs.cloud.google.com/media-cdn/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Media CDN</span></a><span style=\"vertical-align: baseline;\"> を利用しました。Google の広範なグローバル エッジ ネットワークを活用することで、エンドユーザーに物理的に近いエッジ ロケーションから視聴者のリクエストを処理できるようになります。この徹底したローカル化が、ブロードキャストの成功の礎となりました。インド国内からローカル配信されたトーナメントのトラフィックは 99.9% にも及びます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この効率的なアーキテクチャにより、ネットワーク ホップが最小限に抑えられ、トランジットの輻輳が軽減されました。その結果、全 74 試合にわたりインフラストラクチャと視聴者エクスペリエンスの指標が大幅に向上しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">優れたキャッシュ効率:</strong><span style=\"vertical-align: baseline;\"> キャッシュ ヒット率が全体的に 98% を超えました。大量の視聴者トラフィック負荷をエッジで効果的に吸収することで、プレーオフの視聴者数がピークに達したときでも、配信元サーバー / 動画プラットフォームに対する需要は最小限に抑えられました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一貫した超低レイテンシ:</strong><span style=\"vertical-align: baseline;\"> Airtel はトーナメント中に 300 ミリ秒未満の p99 レイテンシを維持しました。その結果、ストリーミング開始までの時間が短縮され、試合の重要な場面でのバッファリングのリスクが最小限に抑えられました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">運用準備のためのプロアクティブな戦略</strong></h4>\n<p><span style=\"vertical-align: baseline;\">インテリジェントなバックエンド アーキテクチャの維持は、Airtel の IPL ストリーミング戦略において極めて重要なことでしたが、それだけでは不十分でした。全 74 試合連続で一発勝負のライブ配信を行うには、入念な運用準備と、試合当日のプロアクティブな対応も必要でした。</span></p>\n<p><span style=\"vertical-align: baseline;\">Airtel と Google Cloud は、最初の試合が始まるずっと前に潜在的なボトルネックを特定する必要があることを認識し、緊密に統合された運用サポートモデルを確立しました。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">トーナメント前のサポート準備状況の確認:</strong><span style=\"vertical-align: baseline;\"> 開幕戦のかなり前に、共同エンジニアリング チームが包括的なサポート準備状況の確認を実施しました。チームは、トラフィック予測の監査、マニフェスト構成の確認、フェイルオーバー メカニズムの検証を早期に実施することで、クライアントが堅牢な準備態勢を整えられるようサポートし、結果的にトーナメント中の運用上の摩擦を軽減しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/monitoring\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Monitoring as a Service</strong></a><strong style=\"vertical-align: baseline;\">（MaaS）:</strong><span style=\"vertical-align: baseline;\"> チームは、Media CDN 上の MaaS を通じて継続的かつプロアクティブなテレメトリー モニタリングを維持しました。リアルタイムのオブザーバビリティにより、異常が視聴者の再生に影響を与える前にネットワークの変化を早期に検出して軽減できました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">試合日と週末の専用サポート:</strong><span style=\"vertical-align: baseline;\"> スポーツのライブ配信は通常の営業時間内に行われるとは限らないため、Airtel はすべての試合を対象とした包括的なモニタリング プロトコルを確立しました。週末の重大な試合や、命運をかけたプレーオフのステージでは、Google Cloud の</span><a href=\"https://cloud.google.com/tam\"><span style=\"text-decoration: underline; vertical-align: baseline;\">テクニカル アカウント マネジメント</span></a><span style=\"vertical-align: baseline;\"> チームと MaaS チームが Airtel のエンジニアリング チームと緊密に連携して、専任でリアルタイムのイベント サポートを提供しました。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">優れたライブ配信のためのブループリント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Airtel が IPL 2026 のストリーミングに成功したことで、膨大な同時接続数への対応には、アーキテクチャ、エッジのローカル化、運用ガバナンスにわたる統合戦略が不可欠であると実証されました。Airtel は、98% 以上のキャッシュ ヒット率、99.9% のローカル配信、試合当日のプロアクティブなモニタリングを組み合わせることで、大規模なライブ スポーツ放送のベンチマークを達成しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このデプロイメントは、同時接続数が多いイベント向けにライブメディア配信をスケールする際の技術アーキテクチャと運用戦略の全体像を示します。ライブ配信とエッジ配信の最適化について詳しくは、</span><a href=\"https://cloud.google.com/media-cdn/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Media CDN のデベロッパー向けドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">-</span><strong style=\"font-style: italic; vertical-align: baseline;\">Hitesh Bhatia,</strong><span style=\"font-style: italic; vertical-align: baseline;\"> Assistant Vice President and Head of Engineering, Airtel Digital</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">-</span><strong style=\"font-style: italic; vertical-align: baseline;\">Anand Vijayan, </strong><span style=\"font-style: italic; vertical-align: baseline;\">Senior Product Manager, Media CDN, Google Cloud</span></p></div>"
  "a2b263c330df701df2ba9feabeb6dac9":
    "id": "a2b263c330df701df2ba9feabeb6dac9"
    "title": "Antigravity SDK を使用してエージェント ハブやカスタム ハーネスを単一ツールキットで実現"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/power-agent-hubs-or-custom-harnesses-with-the-antigravity-sdk/"
    "published": "2026-09-18 10:10:00"
    "fetched": "2026-09-18 16:04:41"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/power-agent-hubs-or-custom-harnesses-with-the-antigravity-sdk?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ エージェントの導入に、万能の解決策はありません。エージェントを導入する際、多くの組織は、そのまますぐに使えるエージェントのデプロイとガバナンスの施行を求めて、</span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> のような商用マネージド プラットフォームを選択する傾向があります。しかし、固有のワークフローやカスタム実行エンジンを利用しているデベロッパーは、独自の軽量エージェント ハブの構築を選択することもよくあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">一元化されたエージェント ハブをゼロから構築するには、サンドボックス内で予測どおりに動作してすべてをログに記録してくれるツールが必要になります。</span><a href=\"https://antigravity.google/product/antigravity-sdk\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity SDK</span></a><span style=\"vertical-align: baseline;\"> を使用すると、Antigravity 2.0 や Antigravity CLI と同じランタイム エンジンを利用でき、安全性に関する宣言型ポリシー、リアルタイム テレメトリー、ステートフルなマルチターンの永続性を直接アプリケーションに組み込むことができます。しかも、コア ランタイムが更新されると、SDK エージェントは自動的に最適化されます。そこで今回は、Antigravity SDK を使用して、完全なマルチエージェント コントロール プレーンを実現する方法について詳しく解説していきます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Antigravity の仕組み</strong></h4></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"01-agy-harness\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/01-agy-harness.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">マルチエージェント コントロール プレーンは、LLM ワークロードをモニタリングして管理します。これにより、エージェントが何を考え、どのツールを呼び出し、状態をどのように保存しているのかを、正確に把握することができます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"02-agents-dashboard\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/02-agents-dashboard.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">そのワークフローは、次の 2 つの重要なコンポーネントで構成されています。</strong></h4>\n<p><span style=\"vertical-align: baseline;\">1. Antigravity SDK エージェント コア: モデルのインタラクション（Gemini 3.1 Pro や Gemini 3.8 Flash など）を管理し、ツールを実行し、思考トレースを生成し、スキルを実行するランタイム。</span></p>\n<p><span style=\"vertical-align: baseline;\">2. オブザーバビリティとテレメトリーのミドルウェア: Antigravity SDK ライフサイクル フックを活用したイベント ドリブン レイヤ。ステップの開始、思考の更新、ツール呼び出しなどのエージェント アクションをインターセプトし、WebSocket 経由でテレメトリーをダッシュボードにストリーミングします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ユースケース: マルチエージェントのモニタリングとインタラクティブな制御</strong></h4>\n<p><span style=\"vertical-align: baseline;\">カスタム エージェント ハブを構築または維持している組織が、Antigravity SDK を活用したエージェントとの統合を考えている場合、どのようなアプローチがあるか、一緒に見ていきましょう。</span></p>\n<p><strong style=\"vertical-align: baseline;\">問題</strong><span style=\"vertical-align: baseline;\">: オペレーション エンジニアは、バックグラウンド調査、ドキュメントの要約、タスクのスケジューリングを実行する複数のアクティブなエージェント（</span><code style=\"vertical-align: baseline;\">gemini-pro-agent、github-agent、email-agent</code><span style=\"vertical-align: baseline;\"> など）をモニタリングする必要があります。従来、エージェントの進捗状況をモニタリングするには、以下の必須タスクと課題がありました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">複数のターミナル ウィンドウにまたがって断片化されたコンソールログを追跡</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">JSON の文字起こしを手動で検査して、ツール呼び出しの停止や失敗を診断</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">特定のエージェント セッションでどのスキルまたは MCP コネクタが読み込まれているかの把握が困難</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">累積トークン使用量と実行レイテンシの追跡が困難</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">解決策</strong><span style=\"vertical-align: baseline;\">: この投稿では、リアルタイム オブザベーションのためのストリーミング API、ライフサイクル フックによるテレメトリーとインターセプト、ポリシー エンジンによる制御、機能管理のためのスキル、永続性を維持するセッション状態について、それぞれ詳しく説明します。SDK がもたらすダッシュボードにより、オペレーターは各エージェントの作業を 1 つのビューで確認できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"03-agy-bespoke-agent-hub\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/03-agy-bespoke-agent-hub.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">実際のメカニズム</strong><span style=\"vertical-align: baseline;\">オペレーターまたはダッシュボードが Antigravity エージェントとやり取りすると、ランタイムは 5 つのコア メカニズムを通じて処理の実行を調整します。</span></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セッションの初期化と状態のアタッチ（save_dir と conversation_id）:</strong><span style=\"vertical-align: baseline;\"> ランタイムはセッションを初期化または再アタッチし、処理の実行をルート </span><code style=\"vertical-align: baseline;\">save_dir</code><span style=\"vertical-align: baseline;\"> にバインドします。マルチターン軌跡のログ、ツール受信歴、アーティファクトは、永続的な監査を可能にするために </span><code style=\"vertical-align: baseline;\">traj-&lt;conversation_id&gt;</code><span style=\"vertical-align: baseline;\"> に保存されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スキル解決（skills_paths）:</strong><span style=\"vertical-align: baseline;\"> ドメイン固有の機能と指示が、SKILL.md バンドルを指すファイルシステム パスから直接解決され、外部レジストリなしでエージェントのシステム プロンプトを動的に補充します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">同時ストリーム生成（ChatResponse）:</strong><span style=\"vertical-align: baseline;\"> ランタイムは、単一のモデル レスポンスに対して同時進行の 3 つの非同期イテレータを公開します。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">response</code><span style=\"vertical-align: baseline;\">（表示可能なテキスト トークンを生成）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">response.thoughts</code><span style=\"vertical-align: baseline;\">（内部の Chain-of-Thought 推論の差分を生成）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">response.tool_calls</code><span style=\"vertical-align: baseline;\">（.name と .args を含む型付き </span><code style=\"vertical-align: baseline;\">ToolCall</code><span style=\"vertical-align: baseline;\"> イベントを生成）</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">宣言型ポリシーによるサンドボックス化と組み込みツールの実行:</strong><span style=\"vertical-align: baseline;\"> エージェントがワークスペース オペレーションを実行すると、組み込みツール（list_directory、find_file、search_directory、view_file、create_file、edit_file）は、安全性に関するポリシー（</span><code style=\"vertical-align: baseline;\">policy.workspace_only()</code><span style=\"vertical-align: baseline;\"> など）に則って管理される指定のワークスペース ディレクトリ内でのみ実行されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ライフサイクル フックによるテレメトリーとインターセプト:</strong><span style=\"vertical-align: baseline;\"> パラメータを付与された非同期フック関数（</span><code style=\"vertical-align: baseline;\">@hooks.on_session_start、@hooks.pre_tool_call_decide、@hooks.post_tool_call、@hooks.on_session_end</code><span style=\"vertical-align: baseline;\">）が、エージェントのやり取りの推移をリアルタイムでインターセプトし、ツール呼び出しを検証または修正して、WebSocket 経由でテレメトリー ペイロードをライブ ダッシュボードにブロードキャストします。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Antigravity SDK は、これらのメカニズムを 4 つの主要な構成要素に分けて実行します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. ドメイン別のスキル適用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">スキルは、エージェントが動的に読み込める、再利用可能なドメイン固有の指示バンドルと参照アセットを提供します。インメモリ レジストリを管理する代わりに、</span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> ファイルを含むファイル システム ディレクトリからスキルのパスを直接解決できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.antigravity import Agent, LocalAgentConfig\\r\\n\\r\\n# Pass directory paths containing SKILL.md bundles directly to config.\\r\\n# The runtime dynamically resolves and injects them into the prompt.\\r\\nconfig = LocalAgentConfig(\\r\\n    model=&quot;gemini-3.8-flash&quot;,\\r\\n    system_instructions=(\\r\\n        &quot;You are an enterprise operations assistant equipped with &quot;\\r\\n        &quot;specialized operational skills.&quot;\\r\\n    ),\\r\\n    skills_paths=[&quot;./skills/research&quot;, &quot;./skills/code_review&quot;],\\r\\n)\\r\\n\\r\\nasync with Agent(config) as agent:\\r\\n    response = await agent.chat(&quot;Analyze the deployment logs.&quot;)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be05b7ad0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">2. 組み込みツールとワークスペースのサンドボックス範囲指定</strong></h4>\n<p><span style=\"vertical-align: baseline;\">SDK には、すぐに使用できるプロダクション レディなファイルツールとワークスペース ツールが用意されているため、カスタム ファイルシステム ラッパーを記述する必要がありません。これらのツールは、</span><code style=\"vertical-align: baseline;\">ワークスペース</code><span style=\"vertical-align: baseline;\">および安全性に関する宣言型ポリシーと組み合わさることで、承認されたディレクトリ内での使用に厳密に制限されます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.antigravity import Agent, LocalAgentConfig, types\\r\\nfrom google.antigravity.policies import policy\\r\\n\\r\\nconfig = LocalAgentConfig(\\r\\n    model=&quot;gemini-3.8-flash&quot;,\\r\\n    # Selectively enable built-in tools via CapabilitiesConfig\\r\\n    capabilities=types.CapabilitiesConfig(\\r\\n        enabled_tools=[\\r\\n            types.BuiltinTools.LIST_DIR,       # &quot;list_directory&quot;\\r\\n            types.BuiltinTools.FIND_FILE,      # &quot;find_file&quot;\\r\\n            types.BuiltinTools.SEARCH_DIR,     # &quot;search_directory&quot;\\r\\n            types.BuiltinTools.VIEW_FILE,      # &quot;view_file&quot;\\r\\n            types.BuiltinTools.CREATE_FILE,    # &quot;create_file&quot;\\r\\n            types.BuiltinTools.EDIT_FILE,      # &quot;edit_file&quot;\\r\\n        ]\\r\\n    ),\\r\\n    # Enforce filesystem isolation: operations outside these paths are blocked\\r\\n    workspaces=[&quot;./workspace&quot;],\\r\\n    policies=[policy.workspace_only()],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be106c550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">3. セッションの隔離と軌跡の永続化（save_dir</strong><strong style=\"vertical-align: baseline;\"> と </strong><strong style=\"vertical-align: baseline;\">conversation_id</strong><strong style=\"vertical-align: baseline;\">）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Antigravity SDK の状態の永続性は、外部データベースではなく、宣言型の構成によって管理されます。</span><code style=\"vertical-align: baseline;\">save_dir</code><span style=\"vertical-align: baseline;\"> を指定すると、</span><code style=\"vertical-align: baseline;\">traj-&lt;conversation_id&gt;</code><span style=\"vertical-align: baseline;\"> の下に、マルチターン軌跡、ツール受信歴、アーティファクトが保存されるルート ディレクトリが確立されます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.antigravity import Agent, LocalAgentConfig\\r\\n\\r\\nconfig = LocalAgentConfig(\\r\\n    model=&quot;gemini-3.8-flash&quot;,\\r\\n    # Root directory storing all conversation trajectories\\r\\n    save_dir=&quot;./storage/sessions&quot;,\\r\\n    # Supply conversation_id to reattach to an existing trajectory;\\r\\n    # omit it to let the SDK mint a new ID on the first turn.\\r\\n    conversation_id=&quot;ops-session-20260820-001&quot;,\\r\\n)\\r\\n\\r\\nasync with Agent(config) as agent:\\r\\n    # Resumes prior context and continues the multi-turn session seamlessly\\r\\n    response = await agent.chat(&quot;Summarize the issues identified in the last turn.&quot;)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be0aace90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">4. ライフサイクル フックによるリアルタイムのテレメトリーとインターセプト</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ライフサイクル フックにより、ダッシュボードとモニタリング エンジンは処理の実行の全段階を監視し、制御できます。パラメータを付与された非同期関数を使用することで、WebSocket 経由でステータスの更新をストリーミングしたり、ツールのパラメータを検査したり、ツールを実行する前に人間参加型の承認を強制したりできます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.antigravity import Agent, LocalAgentConfig, types\\r\\nfrom google.antigravity.hooks import hooks\\r\\n\\r\\n# 1. Session start &amp; end telemetry\\r\\n@hooks.on_session_start\\r\\nasync def on_session_start():\\r\\n    broadcast_to_dashboard({&quot;type&quot;: &quot;STATUS&quot;, &quot;status&quot;: &quot;RUNNING&quot;})\\r\\n\\r\\n@hooks.on_session_end\\r\\nasync def on_session_end():\\r\\n    broadcast_to_dashboard({&quot;type&quot;: &quot;STATUS&quot;, &quot;status&quot;: &quot;IDLE&quot;})\\r\\n\\r\\n# 2. Intercept tool calls before execution (human-in-the-loop / audit gate)\\r\\n@hooks.pre_tool_call_decide\\r\\nasync def intercept_tool(tool_call: types.ToolCall) -&gt; types.HookResult:\\r\\n    broadcast_to_dashboard({\\r\\n        &quot;type&quot;: &quot;TOOL_CALL&quot;,\\r\\n        &quot;tool&quot;: tool_call.name,\\r\\n        &quot;args&quot;: tool_call.args,\\r\\n    })\\r\\n    # Return HookResult to approve or block execution\\r\\n    return types.HookResult(allow=True)\\r\\n\\r\\n# 3. Post-execution tool receipts\\r\\n@hooks.post_tool_call\\r\\nasync def record_tool_result(result):\\r\\n    broadcast_to_dashboard({\\r\\n        &quot;type&quot;: &quot;TOOL_RESULT&quot;,\\r\\n        &quot;tool&quot;: result.name,\\r\\n        &quot;error&quot;: getattr(result, &quot;error&quot;, None),\\r\\n    })\\r\\n\\r\\nconfig = LocalAgentConfig(\\r\\n    model=&quot;gemini-3.8-flash&quot;,\\r\\n    hooks=[on_session_start, on_session_end, intercept_tool, record_tool_result],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be0aac310&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">以下のリソースを参考にして、独自のエンタープライズ向けエージェント コントロール プレーンの構築を開始してみませんか。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://antigravity.google/docs/sdk/overview\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity SDK クイック スタート</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google-antigravity/antigravity-sdk-python\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity GitHub リポジトリ</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、フォワード デプロイド エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Wei Yih Yap</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プラクティス カスタマー エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Paul Datta</strong></p></div>"
  "90b67f38686bec2d4a1ff37bec1d73a8":
    "id": "90b67f38686bec2d4a1ff37bec1d73a8"
    "title": "Data Agent Kit でエージェントを駆使した問題分析"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/agentic-analytics-with-the-data-agent-kit/"
    "published": "2026-09-18 10:00:00"
    "fetched": "2026-09-18 16:04:41"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 9 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/agentic-analytics-with-the-data-agent-kit?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">想像してみてください。月曜の朝、出社早々、上司からチャット メッセージが入ります。曰く、「1 月の平均注文額は 7% 減だけど、総収益は横ばいだね。なんでかな？」</span></p>\n<p><span style=\"vertical-align: baseline;\">データ実務者であれば、このような質問が一筋縄ではいかないことは、よくご存じなのではないでしょうか。しかも、答えは単純明快ではありません。根本原因を示す単一のダッシュボードがあるわけでもありません。ウェブのログにエラーが記録されているのか。プロモーション コードの設定に誤りがあったのか。深掘りするまで皆目見当がつかないし、1 か所や 2 か所、調べただけでは答えはまず見つからないでしょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">答えにつながる鍵は、環境内のさまざまな領域に散在しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">販売履歴</strong><span style=\"vertical-align: baseline;\">（注文と明細項目）はデータ ウェアハウスに保存されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">有効な顧客レコード</strong><span style=\"vertical-align: baseline;\">は本番環境の PostgreSQL インスタンスに保存されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マーケティング キャンペーン ルール</strong><span style=\"vertical-align: baseline;\">は、オブジェクト ストア内の未加工 JSON ファイルに保存されています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらの情報を引き出すクエリを 1 つだけ作成するなら簡単です。実際には、同じクエリを何度も記述し、</span><code style=\"vertical-align: baseline;\">WHERE</code><span style=\"vertical-align: baseline;\"> 句を調整したり、サブクエリを追加したりして、答えを見つけ出す必要があります。1 つのシステムが終わったら次のシステムに移動し、別の方法で再びクエリを行います。気づけばブラウザのタブが 10 個も開いていて、1 つの質問に答えるだけで丸一日がつぶれてしまいます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Data Agent Kit</strong></h4>\n<p><span style=\"vertical-align: baseline;\">まさにこのような問題を解決するために構築されたのが、</span><a href=\"https://docs.cloud.google.com/data-agent-kit?utm_campaign=CDR_0xaea1deef_default_b548660329&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> です。MCP サーバーとエージェント スキルを組み合わせた Data Agent Kit を使用することで、データ デベロッパーは IDE からデータ ワークフローを実行できるようになります。VS Code フォーク（Antigravity IDE、Cursor）の拡張機能としても、他のツール（Antigravity 2.0、Antigravity CLI、Claude Code、Codex）の</span><a href=\"https://github.com/gemini-cli-extensions/data-agent-kit-starter-pack\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プラグイン</span></a><span style=\"vertical-align: baseline;\">としても利用できるため、IDE を離れることなく、答えを見つけ出せます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit は、次の 2 つのコア メカニズムを基盤としています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model Context Protocol（MCP）:</strong><span style=\"vertical-align: baseline;\"> エージェントをツール、データベース、リモート クラウド インフラストラクチャに接続するオープン スタンダード。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェント スキル:</strong><span style=\"vertical-align: baseline;\"> AI エージェントに特定スタックとのやり取りの方法を教え、エージェントの知識を補強する Markdown ファイル。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit を使用すると、SQL スニペットを生成してコンソールにコピーして貼り付ける代わりに、エージェントがクエリを実行して結果を読み取ることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">これを平均注文額（AOV）のシナリオに適用したら、どのようになるのか見てみましょう。この場合、データ ウェアハウスには </span><a href=\"https://cloud.google.com/bigquery?utm_campaign=CDR_0xaea1deef_default_b548660329&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> が、Postgres インスタンスには </span><a href=\"https://cloud.google.com/sql?utm_campaign=CDR_0xaea1deef_default_b548660329&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\"> が相当し、キャンペーン ルールは </span><a href=\"https://cloud.google.com/storage?utm_campaign=CDR_0xaea1deef_default_b548660329&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> に保存されています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1_dak_architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_dak_architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Data Agent Kit のサンプル アーキテクチャ</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">事象を把握する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">調査は、まず IDE のチャットペインで、次の自然言語プロンプトを使用して、基本的な数値の確認から始めます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;BigQuery の orders テーブルと order items テーブルを使用して、2025 年 8 月から 2026 年 1 月までの月間平均注文額を計算してください。&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be1958490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">結果を確認する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントがプロンプトを処理し、関連スキルを呼び出して、データのクエリを開始する準備をします。しかし、まだ実行はせず、IDEを一時停止して必要な MCP ツール（</span><code style=\"vertical-align: baseline;\">execute_sql_readonly</code><span style=\"vertical-align: baseline;\"> など）の使用許可を求めます。ユーザーは、監査のために 1 回だけ許可することも、[常に許可] を選択してワークフローを継続することもできます。許可すると、エージェントはクエリを送信します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2_skill_tool_use\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_skill_tool_use.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>チャットでエージェント スキルと BigQuery MCP を呼び出す</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェント IDE では、実行トレイルを検査して、各 MCP ツール呼び出しの記録や BigQuery に送信された未加工 SQL などを確認できます。エージェントが生成したコードは人間の目で再確認する必要がありますが、不慣れなスキーマに対して一からクエリを記述するの比べれば、大幅な時間の節約になるはずです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">数値を深掘りする</strong></h4>\n<p><span style=\"vertical-align: baseline;\">数値を見ると、平均注文額（AOV）は 8 月から 12 月まで 110 ドル前後を維持していましたが、1 月には 103 ドルに減少しています。この理由を調べるために、エージェントにドリルダウンを依頼します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;1 月の AOV を注文タイプ別に分類して、詳細を確認してください。&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be04b4f10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">結果は、ビジネスの衰退ではなく、平均値の偏りを示しています。オンライン注文とオフライン注文は約 110 ドルで堅調に推移していますが、1 月に </span><code style=\"vertical-align: baseline;\">B2B-Wholesale</code><span style=\"vertical-align: baseline;\"> という新しいチャネルが登場し、その AOV はわずか 75 ドルほどでした。注文が減少したのではなく、プロダクト構成の変化が AOV の見た目を押し下げました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Cloud SQL に調査を広げる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AOV の低下につながった</span><span style=\"font-style: italic; vertical-align: baseline;\">要因</span><span style=\"vertical-align: baseline;\">がわかりました。次に、卸売業者のバイヤーの</span><span style=\"font-style: italic; vertical-align: baseline;\">実体</span><span style=\"vertical-align: baseline;\">を把握する必要があります。顧客レコードは Cloud SQL Postgres の運用データベースに保存されています。同じチャット スレッドで、次のように続けましょう。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;B2B のお客様はどのような事業者ですか。Cloud SQL データベースで、アカウントの詳細と作成日を確認してください。&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be04b7410&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェントは MCP を Cloud SQL MCP に切り替え、</span><code style=\"vertical-align: baseline;\">customers</code><span style=\"vertical-align: baseline;\"> テーブルを調査します。100 件の卸売アカウントはすべて、過去 30 日以内に作成された新しい事業体です。12 月には、これらの事業体はいずれも存在していませんでした。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3_b2b_customers\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_b2b_customers.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Cloud SQL で運用顧客レコードをクエリする</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">コードを探求する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">BigQuery で B2B 注文を簡単に確認すると、92% が </span><code style=\"vertical-align: baseline;\">promo_code = BIGORDER25</code><span style=\"vertical-align: baseline;\"> を適用していることがわかります。次に、エージェントにそのコードを追跡してキャンペーン ファイルを確認するよう依頼すると、エージェントは Google Cloud Storage MCP サーバーを使用してファイルにアクセスします。</span></p>\n<p><span style=\"vertical-align: baseline;\">マーケティング キャンペーンでは、25% 割引コードにより低価格の卸売注文が大量に発生し、総収益は横ばいだったものの、総合的な AOV は減少しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このように、エージェントは、1 回のチャット セッションで、分析データ（BigQuery）、運用記録（Cloud SQL）、非構造化メタデータ（Cloud Storage）をクエリして、根本原因を特定しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">調査結果を報告する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">調査が終わったので、上司に短いエグゼクティブ サマリーを提出するようエージェントに指示します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4_executive_summary\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_executive_summary.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>エージェントが生成したエグゼクティブ サマリー</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これで完了です。IDE から直接、自然言語のプロンプトをいくつか入力するだけで、上司からの一筋縄ではいかない質問に答えることができました。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、このような根本原因の分析作業は、日常業務のごく一部であり、その都度、時間を費やすわけにはいきません。次にまた作業が必要になったときに、同じプロセスを繰り返すのは非効率です。代わりに、この調査を再現可能なデータモデルに変換すると便利です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">再現可能なパイプラインを構築する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントに、アドホック分析を永続的な dbt プロジェクトに変換するよう依頼することができます。AOV はペット関連商品の平均注文額なので、ここでは顧客のペット プロファイルを分析に組み込みます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;BigQuery ステージング モデルを Cloud SQL の顧客レコードおよびペットのプロファイル属性と結合する dbt プロジェクトを構築してください。さらに、order_id に一意性テストを追加し、dbt build を実行してください。&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1be0aac090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェントは、1 つのプロンプトから </span><code style=\"vertical-align: baseline;\">dbt-bigquery</code><span style=\"vertical-align: baseline;\"> を使用して仮想 Python 環境を作成し、プロジェクト モデルとテストを記述します。しかし、</span><code style=\"vertical-align: baseline;\">dbt build</code><span style=\"vertical-align: baseline;\"> は、一意性テストで </span><code style=\"vertical-align: baseline;\">order_id</code><span style=\"vertical-align: baseline;\"> の重複が検出され、失敗に終わります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは、顧客によっては複数のペットを飼っている場合があるためです。モデルの最初のバージョンでは、これらのプロファイルを各注文に直接関連付けたため、3 匹のペットを飼っている世帯からの注文は 3 行になりました（一意ではありませんでした）。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントは自身のターミナル出力を読み取り、失敗を検出します。その後、dbt ロジックを書き換え、ビルドが成功するまで再実行を繰り返します。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは、エージェント ワークフローに関して特記すべき点です。エージェントは大量のコードを記述できますが、パイプラインへのデータ品質チェックの適用は不可欠です（幸い、エージェントはそれも記述できます）。</span></p>\n<p><span style=\"vertical-align: baseline;\">次に上層部から平均注文額の変動理由を尋ねられたときには、dbt モデルが回答を準備してくれます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェント IDE を使用すると、ウェアハウス、データベース、オブジェクト ストア、ターミナルを行き来する必要がなくなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">MCP などのオープン スタンダードと、柔軟な構成と編集が可能なエージェント スキルを組み合わせることで、Data Agent Kit は質問と回答をスムーズに連動させて問題解決へと導きます。不慣れなスキーマを調べたり、多様なコードを使い分けたりすることはもちろん、これまで何度も記述してきた結合の生成も、これからはすべてエージェントに任せられます。エージェントが行う調査の指揮をするのが、あなたの役目です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">実際に試す</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit は現在プレビュー版で提供され、Antigravity（2.0、CLI、IDE）、Claude Code、Codex、Cursor、その他の一般的なツールでネイティブに動作します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">シナリオを試す:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://codelabs.developers.google.com/dak-analytics-eng-antigravity-ide#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit と Antigravity IDE を使用した分析の Codelab</span></a><span style=\"vertical-align: baseline;\"> で、詳しい設定手順を確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドキュメントを読む:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/data-cloud-extension?utm_campaign=CDR_0xaea1deef_default_b548660329&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Agent 拡張機能のドキュメント</span></a><span style=\"vertical-align: baseline;\">で詳細を確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プラグインを試す:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/gemini-cli-extensions/data-agent-kit-starter-pack\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\"> のオープンソース リポジトリでスキルとツールを確認する。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、デベロッパー アドボケイト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jeff Nelson</strong></p></div>"
