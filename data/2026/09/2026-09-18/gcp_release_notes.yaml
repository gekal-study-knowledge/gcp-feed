    "summary": "<h2 class=\"release-note-product-title\">Cloud Load Balancing</h2>\n<h3>Feature</h3>\n<p>Managed workload identity for backend mTLS is <strong>generally available</strong> for the\nfollowing Application Load Balancers:</p>\n<ul>\n<li>Global external Application Load Balancers</li>\n<li>Regional external Application Load Balancers</li>\n<li>Cross-region internal Application Load Balancers</li>\n<li>Regional internal Application Load Balancers</li>\n</ul>\n<p>The key benefits are as follows:</p>\n<ul>\n<li><p><strong>Streamline certificate management</strong>: Automated certificate and trust\nmanagement for backend mTLS through seamless\nintegration with Certificate Authority Service and Certificate Manager.</p></li>\n<li><p><strong>Eliminate operational toil</strong>: Certificates are automatically rotated based\non the workload identity pool's configuration, removing the complexity and\nmanual bottleneck of private key provisioning and maintenance.</p></li>\n<li><p><strong>Improve visibility and governance</strong>: Gain visibility into communication\nbetween distributed services and proactively apply governance to workloads\nacross environments.</p></li>\n</ul>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/load-balancing/docs/managed-workload-identities-load-balancers-overview\">Backend mTLS with managed workload identity overview</a></p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Filter version <code>v4</code> is available and set as the default for the <code>Latest</code> alias.\nFilter version <code>v3</code> is promoted to the <code>Stable</code> alias in all supported regions\nexcept the following:</p>\n<ul>\n<li>In <code>asia-northeast3</code>, <code>v1</code> remains the <code>Stable</code> version.</li>\n<li>In <code>australia-southeast2</code>, <code>v3</code> becomes the <code>Stable</code> version on\nSeptember 25, 2026.</li>\n</ul>\n<p>If your templates use the <code>Stable</code> alias, they automatically upgrade to <code>v3</code>\nwhen <code>v3</code> becomes <code>Stable</code> in that region.</p>\n<p>Filter versions <code>v1</code> (except in <code>asia-northeast3</code>, and starting\nSeptember 25, 2026 in <code>australia-southeast2</code>) and <code>v2</code> transition to <code>Legacy</code>\nstatus and retire on December 17, 2026. If your templates are explicitly\nconfigured with <code>v1</code> or <code>v2</code> in regions where those versions are in <code>Legacy</code>\nstatus, you must migrate them to <code>v3</code> or the <code>Stable</code> alias before December 17,\n2026.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/set-filter-version#release-timeline\">Version release\ntimeline</a> and\n<a href=\"https://docs.cloud.google.com/model-armor/version-history#release-history\">Model Armor filter version\nhistory</a>.</p>"
