    "title": "How KDDI built Buffmee, a faster, reliable consumer RAG app"
    "link": "https://cloud.google.com/blog/topics/customers/how-kddi-optimized-rag-performance-with-agent-development-kit/"
    "published": "2026-09-09 01:00:00"
    "fetched": "2026-09-09 03:19:30"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When building consumer-facing generative AI applications,  balancing high generation quality with fast response times across diverse media types, can be challenging. KDDI, a major telecommunications carrier in Japan, tackled this challenge head-on when they developed Buffmee, their consumer Retrieval-Augmented Generation (RAG) app.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Buffmee is an interactive AI service built on the concept of 'AI that helps you grow.' By grounding responses in over 100 sources — including books, magazines, and web media — it helps users search for information, summarize key points, and explore personalized learning and hobby interests. By citing sources, Buffmee alleviates concerns about information reliability, allowing users to safely deepen their knowledge.</span></p>\n<p><span style=\"vertical-align: baseline;\">As part of their app launch, the engineer team needed to ground a massive variety of proprietary content, including books and magazines. However, they struggled with latency issues that prevented them from meeting their target response times, and they needed a reliable way to ensure hallucination-free results. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_9ZYjQgt.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Buffmee App Description and Images</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To meet these performance targets, organizations need a systematic approach to AI evaluation and real-time bottleneck identification. That is why we are sharing the automated evaluation framework and performance optimization techniques that helped KDDI successfully launch their application. </span></p>\n<p><span style=\"vertical-align: baseline;\">The results were inspiring: </span><strong style=\"vertical-align: baseline;\">KDDI reduced total application response latency by 38%, successfully hitting their target response performance. They also achieved a nearly 18% improvement in TTFT.</strong></p>\n<p><span style=\"vertical-align: baseline;\">\"Our vision hinged on a platform where content, once ingested, would instantly function as a working RAG system. Google's careful, hands-on guidance made that a reality — we're sincerely grateful for their support.\" — Shunya Onoda, AI Product Department, KDDI.</span></p>\n<p><span style=\"vertical-align: baseline;\">With these performance and accuracy improvements, Buffmee now empowers users to safely explore their favorite media through interactive Q&amp;A and deep-dive analysis, delivering a highly personalized experience while maintaining strict trust and compliance for content providers.</span></p>\n<p><span style=\"vertical-align: baseline;\">Let’s deep dive into how they achieved these results. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Establish automated evaluation for diverse content</span></h3>\n<p><span style=\"vertical-align: baseline;\">Traditional manual testing requires immense effort and cannot scale to accommodate a large content library. To solve this, the development team designed a systematic AI evaluation process using Gemini Enterprise Agent Platform Evaluation Service.</span></p>\n<p><span style=\"vertical-align: baseline;\">By implementing automated evaluation frameworks like LLM-as-a-Judge and the Rule of Hundreds, the team replaced labor-intensive manual testing with a data-driven process. They ingested their extensive document corpus, constructed hundreds of automated evaluation tests, and built a comprehensive benchmark dataset to measure the reliability of answers for each use case. As a result, the team improved their groundedness scores by 25%, helping deliver highly accurate and reliable outputs.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_R5gWUyX.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>KDDI's automated evaluation loop: AI generates questions and scores answers, while humans calibrate thresholds and analyze edge-case failures.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Identify bottlenecks and optimize performance with an agentic loop</span></h3>\n<p><span style=\"vertical-align: baseline;\">To improve response speeds, the team implemented BigQuery Agent Analytics and the Agent Development Kit (ADK) log analysis agent. By analyzing actual production logs, they visualized how skill division and prompt bloat—especially with highly complex, multi-page system prompts — impacted the Time To First Token (TTFT).</span></p>\n<p><span style=\"vertical-align: baseline;\">The team optimized the system prompt, including the inline integration of skills, and reviewed the sub-agent routing. This allowed them to identify and resolve deep-stack bottlenecks in real time without sacrificing response accuracy.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Four core principles for reliable evaluation </span></h3>\n<p><span style=\"vertical-align: baseline;\">To achieve these results, the team implemented four core technical practices:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Transitioning to binary evaluation: </strong><span style=\"vertical-align: baseline;\">By selectively moving away from ambiguous 1–5 ratings to a binary \"pass (1) / fail (0)\" system for critical metrics, the team minimized variance and noise, helping improve automation accuracy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strategic content sampling:</strong><span style=\"vertical-align: baseline;\"> Rather than attempting to evaluate every single document, the team classified their entire corpus along a two-dimensional grid: File Format (Web articles, EPUBs, PDFs, structured data) and Media Composition (Text-heavy, image-heavy, or mixed). By selecting representative samples from each cell of this difficulty grid, they reduced the evaluation workload by 75% while maintaining comprehensive test coverage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Thresholds grounded in product judgment:</strong><span style=\"vertical-align: baseline;\"> Instead of relying solely on default tool parameters, the product owner reviewed randomly sampled answers alongside their automated scores to calibrate and establish what \"good enough to ship\" actually meant for the user experience.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Modular splitting of massive prompts into ADK Skills:</strong><span style=\"vertical-align: baseline;\"> Because massive system prompts exceeding 800 lines can cause LLM attention drift and latency degradation, the team split prompts by function into Agent Development Kit (ADK) Skills, dynamically loading only the required logic to optimize response times.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Building scalable, reliable generative AI applications requires both automated evaluation and deep performance analytics. To apply these techniques to your own applications:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Measure quality systematically with the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/evaluation-overview?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gen AI evaluation service</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Structure your agents with </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit</span></a><span style=\"vertical-align: baseline;\"> and apply progressive disclosure deliberately</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Ground your agents with </span><a href=\"https://docs.cloud.google.com/generative-ai-app-builder/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Search</span></a><span style=\"vertical-align: baseline;\"> and inspect your retrieval queries</span></p>\n</li>\n</ul></div>"
