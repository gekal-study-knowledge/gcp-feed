  "09683f38a9aef1a309cf6599b579f397":
    "id": "09683f38a9aef1a309cf6599b579f397"
    "title": "Uber がクラウド移行を妨げることなくネットワークの信頼性を向上させた方法"
    "link": "https://cloud.google.com/blog/ja/products/networking/uber-de-risks-hybrid-ai-with-cloud-interconnect/"
    "published": "2026-09-09 12:00:00"
    "fetched": "2026-09-09 17:39:07"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 27 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/networking/uber-de-risks-hybrid-ai-with-cloud-interconnect?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Uber には、サービスを展開している都市との共通点が数多くあります。どちらも常に変化と成長を続けており、混雑や無秩序な拡大を防ぐために、それに伴うトラフィックを慎重に管理する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Uber は、拡大するネットワークを管理するために技術戦略を絶えず進化させてきました。こうした綿密な計画と継続的な進化が、プラットフォーム全体のアプリケーション トラフィックの円滑な運用を支えています。最終的には、いつでもシームレスに動作する信頼性の高い大規模なプラットフォームを維持することが、ユーザーの信頼を維持する鍵となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">この取り組みにおける重要なソリューションの一つが、</span><a href=\"https://cloud.google.com/blog/ja/products/networking/cross-cloud-network-enhancements-for-distributed-workloads/?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Interconnect 上の Application Awareness</span></a><span style=\"vertical-align: baseline;\"> です。ハイブリッド ネットワーク全体でアプリケーションの優先順位付けを行う業界初のツールである Cloud Interconnect 上の Application Awareness は、Uber が重要なトラフィックを優先し、ネットワークの輻輳が発生した場合でもビジネスの継続性を確保するのに役立っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Uber は、Cloud Interconnect 上の Application Awareness の初期設計パートナーとして、この機能が Uber のグローバル規模の運用ニーズを満たすものとなるよう貢献しました。これにより、Uber の日々の業務が改善されただけでなく、切り替え時のサービス中断のリスクを抑えられるという確信を得たことで、Google Cloud への移行を自信を持って進められるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、Uber が最も求めていた機能とその理由、Cloud Interconnect 上の Application Awareness の内部の仕組み、そしてそれが他の組織にもどのように役立つかについて説明します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">重要なトラフィックの優先順位付け</strong></h4>\n<p><span style=\"vertical-align: baseline;\">分散型、ハイブリッド、またはマルチクラウドのアプリケーションをグローバル規模で移行する場合、ネットワークの信頼性が最大の懸念事項となります。どんなに意義のある移行であっても、稼働中のサービスを中断させてしまうようでは、その価値は損なわれてしまいます。Uber のような組織にとって、台頭する AI ユースケースを含む大規模なデータ分析ワークロードを支えるための膨大なデータ転送は、ネットワーク リンクを飽和状態にし、重要なアプリケーション トラフィックの信頼性を損なうリスクを招きかねません。</span></p>\n<p><span style=\"vertical-align: baseline;\">標準的なクラウド接続手法では、企業は通常、膨大なインフラストラクチャのニーズを満たすために、単純に帯域幅をオーバープロビジョニングするという方法をとります。しかし、昨今のハイブリッド クラウドの需要と、Uber のような組織の規模を考えると、ピーク時の使用量に合わせてネットワーク容量をオーバープロビジョニングすることは、費用がかかりすぎるうえ、信頼性も低い場合があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">最先端の AI イノベーションを統合すると、オーバープロビジョニングの欠点がさらに拡大します。Uber は、ネットワークを混雑させることなく、ビジネス クリティカルなアプリケーションのパフォーマンスを保護しながら、大量のデータ転送に対応できるシステムを必要としています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Interconnect の Application Awareness が備える 4 つの主要機能（トラフィック処理、輻輳対応、レイテンシ管理、コスト効率）を活用することで、Uber は最新の技術スタックに不可欠なネットワークの最適化を実現しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"aai concept value prop with_without picture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/aai_concept_value_prop_with_without_pictur.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Uber は限定公開プレビューの段階からこの機能の導入を開始しました。まずはアリゾナ州フェニックスとバージニア州アッシュバーンの Google Cloud Interconnect から着手し、その後インフラ全体へと展開を広げました。Cloud Interconnect 上の Application Awareness により、Uber は DSCP マーキングや構成済みのキューイング プロファイルを活用して、エンドユーザーのアプリケーション トラフィックを分類し、緊急性の低いデータよりも優先的に処理できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">次の表では、Cloud Interconnect 上の Application Awareness の 4 つの主な機能、従来の方式との違い、そして Uber のような組織の運用継続性の向上にどのように役立つかについて説明しています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">機能</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">標準的な接続ソリューション</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Interconnect 上の Application Awareness</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">トラフィックの処理</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">すべてのトラフィックが平等に扱われる（先入れ先出し）</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">トラフィックを 6 つの異なるトラフィック クラスに分類</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">輻輳対応</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">バースト時に優先度の高いアプリケーション トラフィックがドロップされる可能性がある</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ビジネス クリティカルなトラフィックは、厳密な優先度ポリシーまたは帯域幅共有ポリシーによって保護される</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイテンシ管理</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">優先度の高いアプリケーションのレイテンシが予測不能</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">時間的制約のあるワークロードに対して、予測可能かつ一貫した低レイテンシを実現</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">コスト効率</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ピークを吸収するために高額なオーバープロビジョニングが必要</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">効率的な帯域幅利用と TCO の削減</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">Uber の事例の要点</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Uber にとって、Cloud Interconnect 上の Application Awareness を導入し、ネットワーク上のビジネス クリティカルなトラフィックに優先順位を付けられることの価値は、すぐに目に見える形で現れました。この取り組みを通じて、Uber は、同様のハイブリッド クラウドの課題を抱える他の企業が再現できるブループリントも作成しました。このブループリントの主要な要素は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ビジネス継続性の確保</strong><span style=\"vertical-align: baseline;\">: Uber は、トラフィック量の多い大規模なイベントが発生した際に、優先すべきアプリケーション トラフィックをリアルタイムに決定できます。これにより、計画的か不測の事態かを問わず、極端な負荷が発生するような状況下でも、ミッション クリティカルなアプリケーションの稼働を維持できます。Uber の経営陣は、Cloud Interconnect 上の Application Awareness はグローバルな事業運営に重要であると述べています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">帯域幅の効率的な利用</strong><span style=\"vertical-align: baseline;\">: 輻輳を防ぐために帯域幅を盲目的にオーバープロビジョニングするのではなく、Application Awareness により、Uber は予想されるネットワーク帯域幅のニーズに合わせて、既存の Cloud Interconnect 容量をより有効に活用できるようになりました。その結果、ネットワーク インフラストラクチャの総所有コストが削減されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロード移行の障害を排除</strong><span style=\"vertical-align: baseline;\">: 重要なアプリケーションをネットワークの輻輳から保護することで、Uber は重要なワークロードを Google Cloud に移行し、その過程で運用上のオーバーヘッドを大幅に削減できました。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">「Cloud Interconnect 上の Application Awareness は、より戦略的なワークロードの Google Cloud 移行を実現する鍵となりました。世界規模で需要が急増する際にも、サービスの信頼性を維持するうえで不可欠な役割を果たしています。トラフィックにインテリジェントに優先順位を付けることで、優先度の高いサービスを保護し、インフラストラクチャの効率を高め、総所有コストを削減できます。これは単なる機能の導入にとどまりません。当社のビジネスに不可欠なソリューションを共に創り上げた、両社の深いエンジニアリング パートナーシップの賜物です。」</span><span style=\"font-style: italic; vertical-align: baseline;\">– Uber、エンジニアリング ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Harry Liu 氏</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">AI とそれ以外のネットワークの信頼性を確保</strong></h4>\n<p><span style=\"vertical-align: baseline;\">クラウドベースの AI モデル、分散アプリケーション、データ分析を統合する企業が増えるにつれ、それに伴う大量のデータ転送に対応する準備を整えることが、ビジネス上の必須事項となっています。しかし、その一方で、重要なアプリケーションの信頼性を決して損なわないようにする必要もあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Uber は、Cloud Interconnect 上の Application Awareness を使用することで、ビジネス クリティカルなトラフィックを保護するために単に帯域幅をオーバープロビジョニングするのではなく、最新のハイブリッド クラウド戦略やマルチクラウド戦略を採用するために必要な安定性を構築することが不可欠なステップであることを実証しました。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Cloud Interconnect が組織にもたらすメリットについて詳しくは、</span><a href=\"https://cloud.google.com/blog/ja/products/networking/cross-cloud-network-enhancements-for-distributed-workloads/?e=48754805&amp;hl=ja\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">さまざまな業界における Cloud Interconnect の可能性</span></a><span style=\"font-style: italic; vertical-align: baseline;\">に関するブログをご覧ください。さらに詳しく知りたい場合は、Google のネットワーキングと業界の</span><a href=\"https://cloud.google.com/contact/form?e=48754805\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">エキスパートがサポート</span></a><span style=\"font-style: italic; vertical-align: baseline;\">いたします。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Uber、上級エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jean He 氏</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プリンシパル アーキテクト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Gopinath Balakrishnan</strong></p></div>"
  "44214bc169b032dcfc0c1e0986dde6e7":
    "id": "44214bc169b032dcfc0c1e0986dde6e7"
    "title": "バグの発見と修正を支援するオープンソースの AI ハーネス、Mantis のスタートガイド"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs/"
    "published": "2026-09-09 11:00:00"
    "fetched": "2026-09-09 17:39:07"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 3 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI モデルは、人間の手をほとんど、あるいはまったく介さずに脆弱性を発見して悪用する能力を持っていることが判明しています。防御側が AI を活用して優位性を確保できるよう、Google はソフトウェアの脆弱性の発見、トリアージ、再現、パッチ適用を自動化する Mantis ハーネスを構築しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">誰でも利用可能なオープンソース フレームワークである Mantis は、マシンスピードでの脆弱性の発見と修正を実現するための Google の社内アプローチの一環として誕生しました。Mantis により、より効果的でスケーラブルかつコンテキストを考慮したリポジトリ分析が可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI コードスキャンは精度が低く、ハルシネーションを起こすことが多いため、真陽性率は 7% を下回ります。Mantis は、批評エージェントやレビュー エージェントなどの業界標準のエージェント手法とサンドボックス環境での脆弱性の再現を組み合わせてグラウンディングを行うことで、実効性を持たせた設計になっています。</span></p>\n<p><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally/?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">6 月に公開した記事で詳しく解説した</span></a><span style=\"vertical-align: baseline;\">とおり、Mantis はリポジトリの履歴を調べて過去のセキュリティに関する修正から学習し、アーキテクチャと脅威モデルのドキュメントが提供されていない場合でも、それらのドキュメントを自動的に作成します。</span></p>\n<p><span style=\"vertical-align: baseline;\">階層型のセキュリティ サマリー ツリーを構築し、個々のファイルをディレクトリ レベルとルートレベルのサマリーに集約します。この手法により、大規模なリポジトリ全体で重要な構造コンテキストを維持しながら、トークンのオーバーヘッドを 85% 以上削減することに成功しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google が数十年の期間をかけて幅広いコードベースにわたって蓄積してきたサイバーセキュリティの専門知識の結晶である Mantis は、</span><a href=\"https://github.com/google/mantis\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub で入手可能です</span></a><span style=\"vertical-align: baseline;\">。Mantis の使用を開始する方法は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">まず</strong><span style=\"vertical-align: baseline;\">、次のコマンドを使用して Mantis リポジトリのクローンをローカルに作成します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;git clone https://github.com/google/mantis.git&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd4cad80fa0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">次に</strong><span style=\"vertical-align: baseline;\">、</span><a href=\"https://antigravity.google/docs/enterprise/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">任意のコーディング エージェント</span></a><span style=\"vertical-align: baseline;\">を開き、「</span><code style=\"vertical-align: baseline;\">path/to/mantis</code><span style=\"vertical-align: baseline;\"> にある Mantis フレームワークを使用して、</span><code style=\"vertical-align: baseline;\">path/to/your/code</code><span style=\"vertical-align: baseline;\"> にあるコードをレビューしたいのですが、やり方を教えてください」というプロンプトを入力します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google 社内では、このプロンプトを使用して、多くのコード リポジトリで実際の脆弱性を発見しています。GitHub の Mantis リポジトリには、サンドボックス化のサンプル オプションが含まれています。自社のワークフローに合わせて独自のサンドボックスを実装することもできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Mantis は、脆弱性の検出、真陽性のフィルタリング、パッチ適用を簡単に開始できるようにすることを目的としています。AI が検出した脆弱性を把握したら、新しい </span><a href=\"https://github.com/google/mantis/blob/main/mantis-advise/SKILL.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">mantis-advise スキル</span></a><span style=\"vertical-align: baseline;\">を使用して、蓄積された知識を活用し、コーディング エージェントに最初から安全なコードを記述させることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI を活用した脆弱性検出を最大限に活用して開発手法をモダナイズするにあたって、以下に示す 2 つの重要事項の実行を推奨します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ツールに適切なコンテキストを提供する</strong><span style=\"vertical-align: baseline;\">。Mantis はコミット履歴とコードを自動的に分析してドキュメントを独自に作成することができますが、人間によってキュレートされた知識を得ることで、結果の品質が大幅に向上することがよくあります。たとえば、プログラムをクラッシュさせるようなバグの修正に時間を取られないようにするには、スキャン パイプラインでそうしたバグを確実に検出できるよう、人間によってキュレートされた知識を提供することが非常に重要になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">脆弱性受け入れ基準を使用してサイバー サンドボックスを構築する</strong><span style=\"vertical-align: baseline;\">。明確な脆弱性再現基準に基づいて脆弱性を再現できる安全なサンドボックス環境を使用すると、知るべきことのみを明らかにし、修正が正しいことを確認することが容易になります。</span></p>\n</li>\n</ol>\n<p><a href=\"https://github.com/google/mantis/issues\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mantis について詳しくは、こちらをご覧ください</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、スタッフ セキュリティ エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Nick Galloway</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、シニア スタッフ セキュリティ エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Yulong Zhang</strong></p></div>"
  "dce58cb3173cba8efecc70ba53e4aadc":
    "id": "dce58cb3173cba8efecc70ba53e4aadc"
    "title": "Cloud KMS における耐量子鍵インポートの発表"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/announcing-quantum-safe-key-import-in-cloud-kms/"
    "published": "2026-09-09 10:00:00"
    "fetched": "2026-09-09 17:39:07"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 21 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/announcing-quantum-safe-key-import-in-cloud-kms?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業の間でマルチクラウド アーキテクチャの採用が広がるなか、Bring Your Own Key（BYOK）は、データ主権の維持と重要なクラウド ワークロードの保護において不可欠な柱となっています。同時に、量子コンピューティングは急速に進歩しており、セキュリティ チームは、ネットワーク間で暗号鍵を安全に転送する方法を再評価する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Key Management Service（Cloud KMS）における</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/announcing-quantum-safe-digital-signatures-in-cloud-kms?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">耐量子デジタル署名</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/announcing-quantum-safe-key-encapsulation-mechanisms-in-cloud-kms?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">耐量子鍵カプセル化メカニズム</span></a><span style=\"vertical-align: baseline;\">（KEM）の発表に続き、このたび、ソフトウェア ベースの暗号鍵を対象とした </span><a href=\"https://docs.cloud.google.com/kms/docs/quantum-safe-key-import\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud KMS における耐量子鍵インポート</strong></a><span style=\"vertical-align: baseline;\">のプレビュー版をリリースしました。</span></p>\n<p><a href=\"https://cloud.google.com/blog/ja/products/identity-security/pqc-in-plaintext-google-clouds-post-quantum-cryptography-roadmap?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ポスト量子暗号（PQC）移行タイムライン</span></a><span style=\"vertical-align: baseline;\">の次のフェーズの第一歩となる、更新された耐量子 BYOK 機能は、暗号解読が可能な量子コンピュータ（CRQC）が登場する前に、機密性の高い鍵を保護するのに役立ちます。</span></p>\n<p><span style=\"vertical-align: baseline;\">転送中の鍵の保護を強化するために耐量子鍵インポートを導入する際は、一般提供が開始された </span><a href=\"https://docs.cloud.google.com/kms/docs/view-pqc-insights?hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud KMS PQC insights</strong></a><span style=\"vertical-align: baseline;\"> を活用して、ポスト量子に向けた全体的なセキュリティ ポスチャーをモニタリングすることも可能です。この概要を示すビジュアルでは、使用されているアルゴリズムの分類に基づいて非対称鍵が可視化されます。これにより、将来のモダナイゼーションに向けた計画立案や、長期的なレジリエンスの向上に役立てることができます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">脅威:「今すぐ保存、後で解読」攻撃</strong></h3>\n<p><span style=\"vertical-align: baseline;\">従来の鍵インポート方法では、転送中の鍵をラップするために、従来の非対称暗号化標準が使用されます。これらのアルゴリズムは現在の脅威に対しては有効ですが、攻撃者が傍受して保存した鍵を復号できる実用的な量子コンピュータが登場すると、根本的に安全ではなくなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">耐量子鍵インポートは、鍵を耐量子エンベロープで最初からラップすることで、「</span><a href=\"https://www.ietf.org/archive/id/draft-reddy-uta-pqc-app-03.html#name-timeline-for-transition\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今すぐ保存、後で解読</span></a><span style=\"vertical-align: baseline;\">」（SNDL）攻撃を軽減するのに役立ちます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">鍵を保護する耐量子エンベロープの構築</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Cloud KMS で利用可能になったポスト量子転送メカニズムは、</span><a href=\"https://datatracker.ietf.org/doc/rfc9180/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ハイブリッド公開鍵暗号化</span></a><span style=\"vertical-align: baseline;\">（HPKE）を使用します。Google の新しいインポート方法では、機密性の高いソフトウェア鍵マテリアルを耐量子転送エンベロープでラップします。このプロセスは既存の Cloud KMS API ワークフローに統合されるため、導入の手間を最小限に抑えることができます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ジョブの開始</strong><span style=\"vertical-align: baseline;\">: クライアントは、Cloud KMS API を通じて新しいインポート ジョブを作成し、ポスト量子 HPKE インポート メソッドをリクエストします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">鍵の生成</strong><span style=\"vertical-align: baseline;\">: Cloud KMS サーバーは、ポスト量子 KEM 秘密鍵を生成し、対応する公開鍵をクライアントに公開します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クライアントサイドのラッピング</strong><span style=\"vertical-align: baseline;\">: サポートされている暗号ライブラリ（Tink や OpenSSL など）を使用して、クライアントは HPKE </span><code style=\"vertical-align: baseline;\">Seal()</code><span style=\"vertical-align: baseline;\"> オペレーションを実行します。これにより、共有シークレットを確立するために公開鍵がカプセル化され、HKDF-SHA256 を使用してエフェメラル AES 鍵が導出され、ターゲット鍵マテリアルが暗号化されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">送信</strong><span style=\"vertical-align: baseline;\">: クライアントは、カプセル化された暗号テキストと暗号化された鍵マテリアルを直接連結して Cloud KMS エンドポイントに送信します。このエンドポイントには、すでに耐量子な転送中データ保護機能が組み込まれています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ラップ解除</strong><span style=\"vertical-align: baseline;\">: Cloud KMS サーバーは、ラッピング鍵の秘密部分を使用して HPKE </span><code style=\"vertical-align: baseline;\">Open()</code><span style=\"vertical-align: baseline;\"> オペレーションを実行し、Cloud KMS 境界内で鍵マテリアルを安全に復号して保護します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">KEM レイヤでは、</span><a href=\"https://datatracker.ietf.org/doc/draft-connolly-cfrg-xwing-kem/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">X-Wing</strong></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://csrc.nist.gov/pubs/fips/203/final\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ML-KEM-768</strong></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://csrc.nist.gov/pubs/fips/203/final\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ML-KEM-1024</strong></a><span style=\"vertical-align: baseline;\"> のいずれかを選択できます。鍵導出レイヤは </span><strong style=\"vertical-align: baseline;\">HKDF-SHA-256</strong><span style=\"vertical-align: baseline;\"> を利用し、最終的な対称ラッパーは、標準の 12 バイトのノンスを備えた </span><strong style=\"vertical-align: baseline;\">AES-256-GCM</strong><span style=\"vertical-align: baseline;\"> を採用しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">インポート ジョブの設定、外部暗号ライブラリを使用したローカル鍵マテリアルの準備、耐量子ソリューションの管理の詳細については、</span><a href=\"https://docs.cloud.google.com/kms/docs/quantum-safe-key-import\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud KMS の耐量子鍵インポートに関するドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Google Cloud の PQC への取り組みにおける重要なマイルストーン</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ポスト量子暗号へのグローバルな移行は、マイルストーンを 1 つずつ達成していくマラソンのようなものです。今すぐ最初の</span><a href=\"https://docs.cloud.google.com/kms/docs/quantum-safe-key-import\"><span style=\"text-decoration: underline; vertical-align: baseline;\">耐量子鍵インポート ジョブ</span></a><span style=\"vertical-align: baseline;\">を作成して、アプリケーションの耐量子化のプロセスを開始できます。</span></p>\n<p><a href=\"https://mail.google.com/mail/?view=cm&amp;fs=1&amp;tf=1&amp;to=cloudkms-feedback@google.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">皆様からのフィードバックをお待ちしております</span></a><span style=\"vertical-align: baseline;\">。また、貴組織のポスト量子戦略を Google がどのようにサポートできるかについて、ぜひお問い合わせください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Cloud KMS、シニア ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Alessio Buraggina</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Erlander Lo</strong></p></div>"
  "7a46444410c19e7dac491009063de694":
    "id": "7a46444410c19e7dac491009063de694"
    "title": "Fault Injection Testing で復元力テスト戦略を簡素化"
    "link": "https://cloud.google.com/blog/ja/products/networking/introducing-google-cloud-fault-injection-testing-in-preview/"
    "published": "2026-09-09 09:30:00"
    "fetched": "2026-09-09 17:39:07"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 27 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/networking/introducing-google-cloud-fault-injection-testing-in-preview?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データベースの障害やネットワーク パスの不調が発生しても、ミッション クリティカルなクラウド サービスはオンラインの状態を維持し続けなければなりません。しかし、現代の分散システムは複雑化しており、高可用性の確保はますます困難になっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">障害発生時にも可用性と信頼性を維持できるよう、Fault Injection Testing のプレビュー版をリリースいたしました。Fault Injection Testing は、開発者やアーキテクトが障害テストを自動化し、サービス中断時にも予測可能な動作を確保できるように設計されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">意図的に障害を環境に注入することで、実際のサービス停止が顧客に影響を与える</span><span style=\"font-style: italic; vertical-align: baseline;\">前</span><span style=\"vertical-align: baseline;\">に、安全メカニズムを検証できます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ネイティブな復元力テストが重要な理由</strong></h3>\n<p><span style=\"vertical-align: baseline;\">セルフホスト型のデータセンターとは異なり、クラウド アプリケーションでは、フェイルオーバー テストを容易にするために、基盤となるインフラストラクチャへの直接アクセスが制限されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">アプリケーションが障害を乗り越えられることを証明するネイティブ ツールがなければ、信頼性戦略に重大なギャップが生じ、複数のリスクにさらされることになります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">信頼と評判の低下</strong><span style=\"vertical-align: baseline;\">: 障害が頻繁に発生したり、パフォーマンスが低下したりすると、顧客の不満を招き、ブランド イメージに長期的なダメージを与えます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンプライアンスと規制によるペナルティ</strong><span style=\"vertical-align: baseline;\">: 多くの業界、特に金融機関では、障害復旧機能を証明できないと、コンプライアンス違反、監査、罰金につながる可能性があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">移行の遅延</strong><span style=\"vertical-align: baseline;\">: ゾーン障害が発生しても重要なアプリケーションの安定性を維持できることを検証できない場合、大規模な移行プロジェクトは停滞してしまいがちです。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Fault Injection Testing の仕組み</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Fault Injection Testing では、テスト テンプレートを作成してテストを実行できます。これらのテンプレートはブループリントとして機能し、注入する特定の障害と、テストの対象となるリソースを定義します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この公開プレビュー版では、次の 2 つの主な障害シナリオをテストできます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud SQL のフェイルオーバー</strong><span style=\"vertical-align: baseline;\">: この障害は、高可用性 Cloud SQL インスタンスの、プライマリ ゾーンからスタンバイ ゾーンへのフェイルオーバーをトリガーします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アプリケーション トラフィックの劣化</strong><span style=\"vertical-align: baseline;\">: レイヤ 7 ロードバランサを介して、レイテンシと HTTP エラーコードを選択的に追加できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Fault Injection Testing では、障害が注入される前に自動ドライランが実行されます。この読み取り専用のシミュレーションでは、権限がチェックされ、影響を受けるすべてのリソースの最新リストが提供されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">スコープを確認したら、手動で注入を開始できます。テンプレートで定義した期間が経過すると、タイマーが切れて障害が元に戻ります。</span></p>\n<p><span style=\"vertical-align: baseline;\">テスト中に、アプリケーションが計画どおりに動作していることを確認できます。計画どおりに進まない場合は、停止と復元の機能を使用して、テストを直ちに停止し、リソースを通常の状態に復元できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">プレビュー期間中は、ベスト プラクティスとして、本番環境以外で FIT を使用することをおすすめします。プレビュー版では、サービスが既存のテスト手法にどのように適合し、補完するのかを早期に確認できます。また、プロダクトの改善に役立つフィードバックを Google に提供することもできます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">企業向けに設計</strong></h3>\n<p><span style=\"vertical-align: baseline;\">KeyBank や Servier などのパートナーは、すでに Fault Injection Testing を使用してデプロイを検証しています。これらの組織はネイティブなフォールト インジェクションを活用することで、ゾーンの停止といった極めて過酷な障害シナリオをシミュレーションし、サービスの安定稼働を確かなものにしています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Fault Injection Testing を使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Fault Injection Testing は、Google Cloud コンソール、gcloud CLI、REST API を介して利用できます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プレビュー版へのアクセスをリクエストする</strong><span style=\"vertical-align: baseline;\">: Google Cloud アカウント チームに連絡して、プロジェクトをプレビュー版に追加します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">API を有効にする</strong><span style=\"vertical-align: baseline;\">: Google Cloud コンソールで「Fault Testing API」を検索し、有効にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ロールを割り当てる</strong><span style=\"vertical-align: baseline;\">: チームに roles/faulttesting.operator ロールがあり、テストを構成して実行できることを確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最初のドライランを実行する</strong><span style=\"vertical-align: baseline;\">: 本番環境以外で Cloud SQL またはロードバランサ リソースのテンプレートを作成し、ドライランを実行して潜在的な影響を確認します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">実装の詳細については、Google のアカウント担当者にお問い合わせいただくか、</span><a href=\"https://docs.cloud.google.com/fault-injection-testing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fault Injection Testing のユーザーガイド</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Toby Owen</strong></p></div>"
