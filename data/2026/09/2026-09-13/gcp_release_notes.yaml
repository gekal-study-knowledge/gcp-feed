    "summary": "<h2 class=\"release-note-product-title\">Agent Platform Workbench</h2>\n<h3>Change</h3>\n<h3 id=\"2026091100_p0_release\">20260911.00_p0 Release</h3>\n<h3>Change</h3>\n<h3 id=\"2026091300_p0_release\">20260913.00_p0 Release</h3>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Fixed</h3>\n<p>Fixed the %%bigquery notebook cell magic, which returned an error instead of query results in JupyterLab 4.</p>\n<h3>Fixed</h3>\n<p>Fixed the %%bigquery notebook cell magic, which returned an error instead of query results in JupyterLab 4.</p>\n<h3>Change</h3>\n<h3 id=\"20260913-2230-rc0_release\">20260913-2230-rc0 Release</h3>\n<h3>Change</h3>\n<h3 id=\"20260913-2230-rc0_release\">20260913-2230-rc0 Release</h3>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Fixed</h3>\n<p>Fixed an issue where the <code>notebook-disable-nbconvert</code> metadata flag was ignored in custom containers.</p>\n<h3>Change</h3>\n<p>The obsolete\n<code>google-cloud-sdk</code> transitional package is no longer installed. The Google Cloud\nCLI itself is unchanged; it was already provided by the <code>google-cloud-cli</code>\npackage.</p>\n<h3>Fixed</h3>\n<p>Fixed the %%bigquery notebook cell magic, which returned an error instead of query results in JupyterLab 4.</p>\n<h3>Fixed</h3>\n<p>Fixed an issue where the <code>notebook-disable-nbconvert</code> metadata flag was ignored in custom containers.</p>\n<h3>Fixed</h3>\n<p>Fixed the %%bigquery notebook cell magic, which returned an error instead of query results in JupyterLab 4.</p>\n<h3>Change</h3>\n<h3 id=\"20260913-2130-rc0_release\">20260913-2130-rc0 Release</h3>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Fixed</h3>\n<p>Fixed the %%bigquery notebook cell magic, which returned an error instead of query results in JupyterLab 4.</p>\n<h3>Change</h3>\n<h3 id=\"m149_release\">M149 Release</h3>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Fixed</h3>\n<p>Fixed the %%bigquery notebook cell magic, which returned an error instead of query results in JupyterLab 4.</p>"
