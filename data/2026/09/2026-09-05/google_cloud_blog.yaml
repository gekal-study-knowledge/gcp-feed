  "e0d7e10f17700f7f69fbb69d7d8c1f62":
    "id": "e0d7e10f17700f7f69fbb69d7d8c1f62"
    "title": "How Yahoo optimizes resources with flexible VMs in Managed Service for Apache Spark"
    "link": "https://cloud.google.com/blog/products/data-analytics/how-yahoo-optimizes-apache-spark-with-flexible-vms/"
    "published": "2026-09-05 01:00:00"
    "fetched": "2026-09-05 02:22:19"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As a global media and technology company connecting hundreds of millions of users to finance, sports, and entertainment platforms, Yahoo operates a massive data infrastructure where analytics workloads must run continuously at high speed. In deadline-driven data environments, relying on fixed virtual machine (VM) configurations creates a brittle system; if a specific machine shape faces a regional capacity constraint, cluster provisioning in </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> (formerly Dataproc) can experience delays and stall critical data pipelines.</span></p>\n<p><span style=\"vertical-align: baseline;\">Yahoo utilizes </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">flexible VMs</span></a><span style=\"vertical-align: baseline;\"> in </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> clusters to automatically absorb these resource fluctuations by defining a ranked list of acceptable VM shapes. This allows the system to dynamically search regional zones and maintain pipeline execution without manual intervention. To search for capacity across a region, teams must also enable </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Auto-Zone placement</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">This optimization builds on Yahoo's broader data modernization journey, which involved </span><a href=\"https://www.youtube.com/watch?v=_7Oz1V1-ZiE\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">migrating on-premises Hadoop and big data estates</span></a><span style=\"vertical-align: baseline;\"> directly to Google Cloud. By transitioning those legacy workloads, the team established a cloud foundation capable of running high-scale batch and streaming analytics with dynamic resource flexibility.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=_7Oz1V1-ZiE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Hadoop pioneer to cloud innovator: Yahoo’s data lake modernization journey</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=_7Oz1V1-ZiE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This post provides a technical blueprint for configuring flexible VM instance rankings in </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> to automatically manage capacity constraints and maintain pipeline execution.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Operational trade-offs of static configurations</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Configuring clusters with a single, fixed machine type in a specific zone introduces constraints when regional zonal capacity fluctuations occur, potentially impacting cluster provisioning. Rather than manage these capacity variations through custom retry logic or manual intervention, using flexible configurations allows your infrastructure to automatically adapt. By accepting multiple VM shapes and searching across zones in the selected region, flexible configurations help streamline provisioning to better support high-scale analytics workloads.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Rules for configuring flexible clusters</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Deploying flexible configurations requires aligning several connected design choices:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable auto-zone placement:</strong><span style=\"vertical-align: baseline;\"> You must pass a region(</span><span style=\"vertical-align: baseline;\">--region=${REGION}</span><span style=\"vertical-align: baseline;\">) or an empty zone string (</span><span style=\"vertical-align: baseline;\">--zone=\"\"</span><span style=\"vertical-align: baseline;\">) so Managed Spark can search for available capacity across the entire region.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Maintain core and memory symmetry:</strong><span style=\"vertical-align: baseline;\"> If your Managed Spark cluster uses </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/autoscaling\"><span style=\"text-decoration: underline; vertical-align: baseline;\">autoscaling</span></a><span style=\"vertical-align: baseline;\">, all machine types in your flexible list must share a similar core count and memory size, even if they come from different VM families. A uniform CPU-to-memory ratio across primary and secondary workers prevents performance degradation, as the smallest ratio determines your effective container sizing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Align component properties:</strong><span style=\"vertical-align: baseline;\"> Managed Spark calculates system properties based on VM cores and memory. When mixing machine shapes, you may need explicit property overrides to keep YARN and Spark resource allocations aligned with your expected worker behavior.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Two ways flexible VMs support massive workloads</strong></h3>\n<p><span style=\"vertical-align: baseline;\">For large-scale data environments, flexible configurations support operations in two ways:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Higher cluster creation success:</strong><span style=\"vertical-align: baseline;\"> Instead of failing when a preferred VM type is out of stock, Managed Spark selects from a ranked list to keep provisioning moving.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Better regional resource use:</strong><span style=\"vertical-align: baseline;\"> Auto-zone placement searches the entire region to find capacity, which reduces provisioning friction during high-demand periods.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">gcloud example</strong></h3></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud dataproc clusters create analytics-cluster \\\\\\r\\n  --region=us-central1 \\\\\\r\\n  --zone=&quot;&quot; \\\\\\r\\n  --num-workers=10 \\\\\\r\\n  --master-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;e2-standard-8&quot;],&quot;rank&quot;:0}\\&#x27; \\\\\\r\\n  --master-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n2-standard-8&quot;],&quot;rank&quot;:1}\\&#x27; \\\\\\r\\n  --worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;e2-standard-8&quot;],&quot;rank&quot;:0}\\&#x27; \\\\\\r\\n  --worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n2-standard-8&quot;],&quot;rank&quot;:1}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f78f8cf7700&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">API example</strong></h3>\n<p><span style=\"vertical-align: baseline;\">You can also build this capacity policy into your automated pipelines or </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-airflow\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Airflow</span></a><span style=\"vertical-align: baseline;\"> DAGS using the </span><span style=\"vertical-align: baseline;\">instanceFlexibilityPolicy</span><span style=\"vertical-align: baseline;\"> field in the ‘Dataproc’ API:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;projectId&quot;: &quot;PROJECT_ID&quot;,\\r\\n  &quot;clusterName&quot;: &quot;analytics-cluster&quot;,\\r\\n  &quot;config&quot;: {\\r\\n    &quot;gceClusterConfig&quot;: {\\r\\n      &quot;zoneUri&quot;: &quot;&quot;\\r\\n    },\\r\\n    &quot;secondaryWorkerConfig&quot;: {\\r\\n      &quot;numInstances&quot;: 8,\\r\\n      &quot;instanceFlexibilityPolicy&quot;: {\\r\\n        &quot;instanceSelectionList&quot;: [\\r\\n          {\\r\\n            &quot;machineTypes&quot;: [&quot;n2-standard-8&quot;],\\r\\n            &quot;rank&quot;: 0\\r\\n          },\\r\\n          {\\r\\n            &quot;machineTypes&quot;: [&quot;e2-standard-8&quot;, &quot;t2d-standard-8&quot;],\\r\\n            &quot;rank&quot;: 1\\r\\n          }\\r\\n        ]\\r\\n      }\\r\\n    }\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f78f8cf72b0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This API policy achieves the same goal: it establishes your preferred shape, documents valid fallbacks, and lets Managed Spark resolve resource constraints without breaking your automation scripts.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Establishing an infrastructure policy</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Managing data at this scale requires standardizing a clear resource policy rather than relying on a single rigid machine type. Your configuration standards should outline:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Preferred and fallback VM families for secondary workers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Default auto-zone placement to enable flexible provisioning.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Identical core and memory configurations when using autoscaling.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Uniform CPU-to-memory ratios across all worker groups to maintain predictable container sizing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explicit YARN or Spark property overrides to guarantee consistent runtime behavior across different machine lines.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Shuffle-safe patterns for Spark workloads running on Spot or highly elastic capacity.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By adopting flexible configurations, you turn infrastructure scarcity into a predictable fallback plan, keeping your critical data pipelines up and running.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Yahoo impact and results</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By implementing flexible VMs in Managed Service for Apache Spark, Yahoo successfully reduced cluster provisioning failures by 85% which were caused by regional capacity stockouts. This flexible configuration allows their data infrastructure to automatically handle capacity constraints and successfully provision resources without requiring manual intervention. As a result, Yahoo ensures continuous workload execution and prevents downstream processing delays across their massive data pipelines.</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Managing high-scale data analytics at Yahoo requires resilient, automated infrastructure. Moving to flexible VMs in Managed Service for Apache Spark has transformed our approach; instead of stalling when a specific machine shape faces capacity constraints, our clusters now automatically pivot to our ranked fallback options. This has helped us reduce provisioning failures by 85%, providing the reliability we need to keep our global media platforms running smoothly.\"</span><span style=\"vertical-align: baseline;\"> - Akshay Jain, Senior Software Developer Engineer, Yahoo! </span></span></p>\n<h3><strong style=\"vertical-align: baseline;\">Strategic benefits of flexible infrastructure</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Adopting a flexible compute stack transforms your environment into a dynamic pool of resources that adapts to your operational needs. By moving away from rigid, single-machine type configurations, you ensure that your workloads reliably access the compute they need, regardless of supply fluctuations. This shift not only maximizes workload obtainability and reliability but also facilitates seamless hardware modernization by allowing you to prioritize newer VM generations while maintaining older types as reliable fallback options.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Build your resilient data pipeline</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Transitioning to a fluid compute strategy ensures your critical analytics remain operational despite regional resource shifts. Here is how you can begin optimizing your infrastructure today:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Audit your workloads: </strong><span style=\"vertical-align: baseline;\">Identify applications tightly coupled to specific VM families or zones and map out viable alternative hardware shapes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Standardize resource policies: </strong><span style=\"vertical-align: baseline;\">Explore the </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation for Managed Spark flexible VMs</span></a><span style=\"vertical-align: baseline;\"> to establish your preferred and fallback VM families.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Align financial strategy: </strong><span style=\"vertical-align: baseline;\">Utilize Flexible Committed Use Discounts (Flex CUDs) to maintain cost predictability when workloads dynamically pivot to alternative machine types.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Claim your credits: </strong><span style=\"vertical-align: baseline;\">New customers may be eligible for </span><a href=\"https://cloud.google.com/free\"><span style=\"text-decoration: underline; vertical-align: baseline;\">$300 in credits</span></a><span style=\"vertical-align: baseline;\"> to try Managed Service for Apache Spark and other Google Cloud products at no cost.</span></p>\n</li>\n</ol></div>"
  "248a35a4f8c94d45ffb0b4eed08d4d56":
    "id": "248a35a4f8c94d45ffb0b4eed08d4d56"
    "title": "Spanner migrations: Automating dual-write with Antigravity CLI for minimal disruption"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/using-antigravity-cli-to-streamline-dual-write-database-migration/"
    "published": "2026-09-05 01:00:00"
    "fetched": "2026-09-05 02:22:19"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When Google's Finance Engineering team needed to modernize their legacy data layer, they chose </span><a href=\"https://cloud.google.com/spanner?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, a globally distributed, strongly consistent, multi-model database with high availability capabilities. But migrating to Spanner without taking production services offline was a daunting engineering challenge: As the internal team responsible for the application, we needed to manually rewrite dual-write logic across dozens of Data Access Objects (DAOs), a process that is slow and prone to human error. Further, doing so without disruption would have required implementing multi-phase dual-write architectures across every DAO in our codebase. </span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this, we took an alternative approach: We built an automated refactoring pipeline powered by Antigravity CLI in headless mode. This helped us accelerate our migration velocity significantly while maintaining strict data parity in our staging environments as we prepare for production. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The challenge: Anatomy of a dual-write migration</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When migrating high-throughput production services where financial accuracy is essential, simple cutover scripts do not work. You must verify that both the legacy datastore and Spanner receive identical writes simultaneously until all the historical data backfills and verifications are complete.</span></p>\n<p><span style=\"vertical-align: baseline;\">We structured our migration across three distinct phases:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Historical backfill:</strong><span style=\"vertical-align: baseline;\"> Copying existing historical records to Spanner while maintaining referential integrity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dual-write / dual-read implementation:</strong><span style=\"vertical-align: baseline;\"> Modifying every DAO to write mutations to both the primary store and Cloud Spanner in parallel during the migration window.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated API verification and parity checking:</strong><span style=\"vertical-align: baseline;\"> Intercepting RPC traffic and verifying end-to-end that every write lands with byte-for-byte equivalence across both stores.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Dual Write Architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Dual_Write_Architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The architectural pattern is clean, but at our scale, we began to encounter friction. That’s because each DAO requires:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A dedicated </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\"> class mapping complex domain models to Spanner schema columns</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Dual-write branch handling and rollback or error-reporting logic</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A suite of unit tests verifying both primary and Spanner writes using fake time sources and test doubles (</span><span style=\"vertical-align: baseline;\">FakeTimeSource</span><span style=\"vertical-align: baseline;\">)</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Performing these identical, high-precision code changes across 30+ DAOs by hand would have taken months of engineering time.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The solution: Standardized mutation converter patterns</span></h3>\n<p><span style=\"vertical-align: baseline;\">To verify that our automation pipeline could reliably generate clean code, we first standardized our DAO refactoring pattern around a decoupled </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\"> interface.</span></p>\n<p><span style=\"vertical-align: baseline;\">Instead of embedding raw Spanner table names and column assignments directly inside core DAO business logic, we isolate Spanner schema translation into dedicated converter units:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// Example of the standardized pattern generated by our pipeline\\r\\n\\r\\ntype BpcTransferAmountsMutationConverter interface {\\r\\n    ToInsertMutation(entity *model.BpcTransferAmount) (*spanner.Mutation, error)\\r\\n    ToUpdateMutation(entity *model.BpcTransferAmount) (*spanner.Mutation, error)\\r\\n}\\r\\n\\r\\ntype bpcTransferAmountsMutationConverterImpl struct {\\r\\n    tableName string\\r\\n}\\r\\n\\r\\nfunc (c *bpcTransferAmountsMutationConverterImpl) ToInsertMutation(entity *model.BpcTransferAmount) (*spanner.Mutation, error) {\\r\\n    if entity == nil {\\r\\n        return nil, errors.New(&quot;entity cannot be nil&quot;)\\r\\n    }\\r\\n    \\r\\n    // Map domain fields to Cloud Spanner table schema\\r\\n    cols := []string{&quot;TransferId&quot;, &quot;AmountCents&quot;, &quot;CurrencyCode&quot;, &quot;LastModifiedTimestamp&quot;}\\r\\n    vals := []interface{}{\\r\\n        entity.TransferId,\\r\\n        entity.AmountCents,\\r\\n        entity.CurrencyCode,\\r\\n        spanner.CommitTimestamp, // Use Spanner commit timestamps\\r\\n    }\\r\\n    \\r\\n    return spanner.Insert(c.tableName, cols, vals), nil\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f78f90169a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">By establishing a rigid, deterministic contract between the DAO and the Spanner SDK (</span><span style=\"vertical-align: baseline;\">spanner.Mutation</span><span style=\"vertical-align: baseline;\">), we created an exact target specification that an AI coding agent could reason about and generate reliably.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why use Antigravity</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">CLI in headless mode?</span></h3>\n<p><span style=\"vertical-align: baseline;\">Interactive AI chat interfaces in IDEs work well for exploratory coding, but they are poorly suited for systematic, multi-file code updates across an entire codebase. When you need to apply repeatable refactoring to dozens of targets without missing edge cases, you need automated workflows.</span></p>\n<p><span style=\"vertical-align: baseline;\">We addressed this by building an orchestration script (</span><span style=\"vertical-align: baseline;\">migration_ui.py</span><span style=\"vertical-align: baseline;\">) that runs Antigravity CLI in headless mode (</span><span style=\"vertical-align: baseline;\">-p</span><span style=\"vertical-align: baseline;\">).</span></p>\n<p><span style=\"vertical-align: baseline;\">Headless mode lets Antigravity run directly inside shell scripts, continuous integration pipelines, and background automation jobs without requiring manual terminal prompts. This approach helped us scale our work in three key ways:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deterministic prompt architectures:</strong><span style=\"vertical-align: baseline;\"> We treated our prompts as version-controlled engineering artifacts. We codified precise rules handling common Spanner edge cases — such as timestamp serialization, nullability conversions, mutation ambiguity, and </span><span style=\"vertical-align: baseline;\">FakeTimeSource</span><span style=\"vertical-align: baseline;\"> test injection — directly into reusable prompt templates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Batch execution and automated verification:</strong><span style=\"vertical-align: baseline;\"> Our orchestration script takes a target DAO name as input, retrieves the existing single-write source code and schema, and feeds it to headless Antigravity alongside our structural conventions. Antigravity generates the new converter, the refactored dual-write DAO, and corresponding unit tests. The script then runs </span><span style=\"vertical-align: baseline;\">blaze test</span><span style=\"vertical-align: baseline;\">. If a linter error or test assertion fails, the error log feeds directly back into Antigravity for self-correction.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Overnight execution at scale:</strong><span style=\"vertical-align: baseline;\"> Because the loop runs unattended, engineers can queue up 10 DAOs at the end of the day. By morning, the pipeline generates, tests, and validates 10 clean changelists ready for human code review.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Results and key takeaways for cloud engineers</span></h3>\n<p><span style=\"vertical-align: baseline;\">Combining Spanner's distributed database primitives with Antigravity CLI's headless automation produced clear benefits across our engineering organization:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Significant reduction in migration effort</strong><span style=\"vertical-align: baseline;\">: DAO dual-write migrations that previously required extensive manual coding and testing were completed and reviewed in a fraction of the time </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Highly reliable data migration:</strong><span style=\"vertical-align: baseline;\"> Because every generated DAO adhered to the exact same tested </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\"> pattern and underwent automated unit testing against Spanner test doubles, we sustained high data fidelity during our extensive migration testing. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Focus on higher-value engineering:</strong><span style=\"vertical-align: baseline;\"> Engineers avoided repetitive boilerplate refactoring, giving them time to focus on data modeling, architectural resilience, and performance optimization.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Three tips for your next database migration</span></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Decouple schema translation first:</strong><span style=\"vertical-align: baseline;\"> Before writing migration scripts, define a strict interface (like our </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\">) that isolates your new cloud database SDK requirements from your existing business logic. AI agents work best when given clear, bounded design patterns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Move from interactive chat to headless automation:</strong><span style=\"vertical-align: baseline;\"> When executing repetitive refactoring across more than three or four files, invest in scripted, headless workflows. Treating prompt inputs and test verifications as automated build steps help maintain quality and consistency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Let the build system act as your guardrail:</strong><span style=\"vertical-align: baseline;\"> Connect your AI generation loop directly to your build and test harness (</span><span style=\"vertical-align: baseline;\">bazel test</span><span style=\"vertical-align: baseline;\"> or </span><span style=\"vertical-align: baseline;\">go test</span><span style=\"vertical-align: baseline;\">). This lets the model fix compile and assertion errors before a developer reviews the code.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you’re migrating financial systems or building cloud-native applications from scratch, Spanner and Antigravity provide a foundation for scalable software development.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore Cloud Spanner:</strong><span style=\"vertical-align: baseline;\"> Learn more about Spanner's distributed architecture </span><a href=\"https://cloud.google.com/spanner/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Spanner documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Discover Gemini for Developers:</strong><span style=\"vertical-align: baseline;\"> See how AI-assisted coding and headless CLI automation can assist your engineering workflows at </span><a href=\"https://cloud.google.com/use-cases/ai-for-developers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud AI for Developers</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
