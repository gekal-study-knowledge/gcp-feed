"overview": |
  この日は移植と性能検証という、実務寄りの記事が揃いました。Google の財務エンジニアリングチームが、レガシーなデータ層を Spanner へ移行する際に、本番サービスを止めずに二重書き込みを実装するという難題へ取り組んだ事例が公開されています。金額の正確さが要求される高スループットのサービスでは単純な切り替えスクリプトは通用せず、履歴データのバックフィルと検証が終わるまで、レガシーのデータストアと Spanner の双方が同一の書き込みを同時に受けていることを確かめ続ける必要があります。数十個のデータアクセスオブジェクト (DAO) すべてに多段階の二重書き込みを手で書くのは遅く、人的ミスも起きやすいため、チームは Antigravity CLI をヘッドレスモードで動かす自動リファクタリングのパイプラインを構築し、ステージング環境で厳密なデータ同一性を保ちながら移行速度を大きく引き上げました。性能検証では、TPU v6e 上の Gemma 3 12B と 27B を、分類 (プリフィル中心) と生成 (デコード中心) という構造の異なるワークロードで比較したベンチマークが公開されています。生成では 27B が同時 64 ユーザーを超えると明確な性能の壁にぶつかり、128 ユーザーで正規化スループットが 4.12 倍に頭打ちになる一方、12B は 8.19 倍まで伸びました。高い同時実行の生成が必要なら 12B へ落とすか、27B ではレプリカあたりの同時リクエストを 64 に制限するオートスケーリングを設定すべき、という指針が示されています。分類ではパラメータ数の影響がずっと小さく、12B と 27B がともに 6.0 倍前後の同等のスケーリングに達しました。運用の工夫としては、Yahoo が Managed Service for Apache Spark (旧 Dataproc) で柔軟な VM を活用している例が紹介されています。特定のマシン形状がリージョンの容量制約に当たるとクラスタのプロビジョニングが遅れ、重要なデータパイプラインが止まってしまうため、許容できる VM 形状に順位を付けたリストを定義しておき、リージョン内のゾーンを動的に探索して人手を介さずパイプラインの実行を維持する構成です (リージョン全体で容量を探すには Auto-Zone placement の有効化も必要)。
