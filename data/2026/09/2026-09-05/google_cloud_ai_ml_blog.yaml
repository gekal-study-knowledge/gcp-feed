    "title": "Spanner migrations: Automating dual-write with Antigravity CLI for minimal disruption"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/using-antigravity-cli-to-streamline-dual-write-database-migration/"
    "published": "2026-09-05 01:00:00"
    "fetched": "2026-09-05 02:22:23"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When Google's Finance Engineering team needed to modernize their legacy data layer, they chose </span><a href=\"https://cloud.google.com/spanner?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, a globally distributed, strongly consistent, multi-model database with high availability capabilities. But migrating to Spanner without taking production services offline was a daunting engineering challenge: As the internal team responsible for the application, we needed to manually rewrite dual-write logic across dozens of Data Access Objects (DAOs), a process that is slow and prone to human error. Further, doing so without disruption would have required implementing multi-phase dual-write architectures across every DAO in our codebase. </span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this, we took an alternative approach: We built an automated refactoring pipeline powered by Antigravity CLI in headless mode. This helped us accelerate our migration velocity significantly while maintaining strict data parity in our staging environments as we prepare for production. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The challenge: Anatomy of a dual-write migration</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When migrating high-throughput production services where financial accuracy is essential, simple cutover scripts do not work. You must verify that both the legacy datastore and Spanner receive identical writes simultaneously until all the historical data backfills and verifications are complete.</span></p>\n<p><span style=\"vertical-align: baseline;\">We structured our migration across three distinct phases:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Historical backfill:</strong><span style=\"vertical-align: baseline;\"> Copying existing historical records to Spanner while maintaining referential integrity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dual-write / dual-read implementation:</strong><span style=\"vertical-align: baseline;\"> Modifying every DAO to write mutations to both the primary store and Cloud Spanner in parallel during the migration window.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated API verification and parity checking:</strong><span style=\"vertical-align: baseline;\"> Intercepting RPC traffic and verifying end-to-end that every write lands with byte-for-byte equivalence across both stores.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Dual Write Architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Dual_Write_Architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The architectural pattern is clean, but at our scale, we began to encounter friction. That’s because each DAO requires:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A dedicated </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\"> class mapping complex domain models to Spanner schema columns</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Dual-write branch handling and rollback or error-reporting logic</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A suite of unit tests verifying both primary and Spanner writes using fake time sources and test doubles (</span><span style=\"vertical-align: baseline;\">FakeTimeSource</span><span style=\"vertical-align: baseline;\">)</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Performing these identical, high-precision code changes across 30+ DAOs by hand would have taken months of engineering time.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The solution: Standardized mutation converter patterns</span></h3>\n<p><span style=\"vertical-align: baseline;\">To verify that our automation pipeline could reliably generate clean code, we first standardized our DAO refactoring pattern around a decoupled </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\"> interface.</span></p>\n<p><span style=\"vertical-align: baseline;\">Instead of embedding raw Spanner table names and column assignments directly inside core DAO business logic, we isolate Spanner schema translation into dedicated converter units:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// Example of the standardized pattern generated by our pipeline\\r\\n\\r\\ntype BpcTransferAmountsMutationConverter interface {\\r\\n    ToInsertMutation(entity *model.BpcTransferAmount) (*spanner.Mutation, error)\\r\\n    ToUpdateMutation(entity *model.BpcTransferAmount) (*spanner.Mutation, error)\\r\\n}\\r\\n\\r\\ntype bpcTransferAmountsMutationConverterImpl struct {\\r\\n    tableName string\\r\\n}\\r\\n\\r\\nfunc (c *bpcTransferAmountsMutationConverterImpl) ToInsertMutation(entity *model.BpcTransferAmount) (*spanner.Mutation, error) {\\r\\n    if entity == nil {\\r\\n        return nil, errors.New(&quot;entity cannot be nil&quot;)\\r\\n    }\\r\\n    \\r\\n    // Map domain fields to Cloud Spanner table schema\\r\\n    cols := []string{&quot;TransferId&quot;, &quot;AmountCents&quot;, &quot;CurrencyCode&quot;, &quot;LastModifiedTimestamp&quot;}\\r\\n    vals := []interface{}{\\r\\n        entity.TransferId,\\r\\n        entity.AmountCents,\\r\\n        entity.CurrencyCode,\\r\\n        spanner.CommitTimestamp, // Use Spanner commit timestamps\\r\\n    }\\r\\n    \\r\\n    return spanner.Insert(c.tableName, cols, vals), nil\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f52900e51c0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">By establishing a rigid, deterministic contract between the DAO and the Spanner SDK (</span><span style=\"vertical-align: baseline;\">spanner.Mutation</span><span style=\"vertical-align: baseline;\">), we created an exact target specification that an AI coding agent could reason about and generate reliably.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why use Antigravity</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">CLI in headless mode?</span></h3>\n<p><span style=\"vertical-align: baseline;\">Interactive AI chat interfaces in IDEs work well for exploratory coding, but they are poorly suited for systematic, multi-file code updates across an entire codebase. When you need to apply repeatable refactoring to dozens of targets without missing edge cases, you need automated workflows.</span></p>\n<p><span style=\"vertical-align: baseline;\">We addressed this by building an orchestration script (</span><span style=\"vertical-align: baseline;\">migration_ui.py</span><span style=\"vertical-align: baseline;\">) that runs Antigravity CLI in headless mode (</span><span style=\"vertical-align: baseline;\">-p</span><span style=\"vertical-align: baseline;\">).</span></p>\n<p><span style=\"vertical-align: baseline;\">Headless mode lets Antigravity run directly inside shell scripts, continuous integration pipelines, and background automation jobs without requiring manual terminal prompts. This approach helped us scale our work in three key ways:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deterministic prompt architectures:</strong><span style=\"vertical-align: baseline;\"> We treated our prompts as version-controlled engineering artifacts. We codified precise rules handling common Spanner edge cases — such as timestamp serialization, nullability conversions, mutation ambiguity, and </span><span style=\"vertical-align: baseline;\">FakeTimeSource</span><span style=\"vertical-align: baseline;\"> test injection — directly into reusable prompt templates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Batch execution and automated verification:</strong><span style=\"vertical-align: baseline;\"> Our orchestration script takes a target DAO name as input, retrieves the existing single-write source code and schema, and feeds it to headless Antigravity alongside our structural conventions. Antigravity generates the new converter, the refactored dual-write DAO, and corresponding unit tests. The script then runs </span><span style=\"vertical-align: baseline;\">blaze test</span><span style=\"vertical-align: baseline;\">. If a linter error or test assertion fails, the error log feeds directly back into Antigravity for self-correction.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Overnight execution at scale:</strong><span style=\"vertical-align: baseline;\"> Because the loop runs unattended, engineers can queue up 10 DAOs at the end of the day. By morning, the pipeline generates, tests, and validates 10 clean changelists ready for human code review.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Results and key takeaways for cloud engineers</span></h3>\n<p><span style=\"vertical-align: baseline;\">Combining Spanner's distributed database primitives with Antigravity CLI's headless automation produced clear benefits across our engineering organization:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Significant reduction in migration effort</strong><span style=\"vertical-align: baseline;\">: DAO dual-write migrations that previously required extensive manual coding and testing were completed and reviewed in a fraction of the time </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Highly reliable data migration:</strong><span style=\"vertical-align: baseline;\"> Because every generated DAO adhered to the exact same tested </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\"> pattern and underwent automated unit testing against Spanner test doubles, we sustained high data fidelity during our extensive migration testing. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Focus on higher-value engineering:</strong><span style=\"vertical-align: baseline;\"> Engineers avoided repetitive boilerplate refactoring, giving them time to focus on data modeling, architectural resilience, and performance optimization.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Three tips for your next database migration</span></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Decouple schema translation first:</strong><span style=\"vertical-align: baseline;\"> Before writing migration scripts, define a strict interface (like our </span><span style=\"vertical-align: baseline;\">MutationConverter</span><span style=\"vertical-align: baseline;\">) that isolates your new cloud database SDK requirements from your existing business logic. AI agents work best when given clear, bounded design patterns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Move from interactive chat to headless automation:</strong><span style=\"vertical-align: baseline;\"> When executing repetitive refactoring across more than three or four files, invest in scripted, headless workflows. Treating prompt inputs and test verifications as automated build steps help maintain quality and consistency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Let the build system act as your guardrail:</strong><span style=\"vertical-align: baseline;\"> Connect your AI generation loop directly to your build and test harness (</span><span style=\"vertical-align: baseline;\">bazel test</span><span style=\"vertical-align: baseline;\"> or </span><span style=\"vertical-align: baseline;\">go test</span><span style=\"vertical-align: baseline;\">). This lets the model fix compile and assertion errors before a developer reviews the code.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you’re migrating financial systems or building cloud-native applications from scratch, Spanner and Antigravity provide a foundation for scalable software development.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore Cloud Spanner:</strong><span style=\"vertical-align: baseline;\"> Learn more about Spanner's distributed architecture </span><a href=\"https://cloud.google.com/spanner/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Spanner documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Discover Gemini for Developers:</strong><span style=\"vertical-align: baseline;\"> See how AI-assisted coding and headless CLI automation can assist your engineering workflows at </span><a href=\"https://cloud.google.com/use-cases/ai-for-developers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud AI for Developers</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
