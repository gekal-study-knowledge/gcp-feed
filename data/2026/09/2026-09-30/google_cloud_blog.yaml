    "published": "2026-09-30 01:00:00"
    "fetched": "2026-09-30 02:40:43"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As threat actors increasingly use AI to accelerate and develop cyberattacks, enterprise defenders need to rely on both AI and a critical defender’s advantage: Business context that only you possess.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Enterprise cyber defense spans identity, network, endpoint, data, cloud, and application layers, often split across a dozen or more products, each with its own context. At Google Cloud Next, we brought partner-built agents into </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/partner-built-agents-available-in-gemini-enterprise?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> to give you one place to discover and deploy specialized agents across functions including sales, content and creative workflows, HR, and security. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we're expanding our catalog of partner-built security offerings in the Gemini Enterprise ecosystem to help you leverage your full security context from one unified interface.</span></p>\n<p><span style=\"vertical-align: baseline;\">These new security agents and integrations from leading cybersecurity vendors span two areas: partner security agents that your teams invoke directly in Gemini Enterprise, and protections for AI and agentic workloads. By bringing them into Gemini Enterprise, you can now orchestrate multi-step security workflows directly in your Gemini Enterprise environment, bringing AI-powered capabilities to your defenses.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Meet new security agents and agentic defenses built with Gemini Enterprise</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">Acalvio</strong><span style=\"vertical-align: baseline;\">: The Acalvio ShadowPlex deception agent, accessible through Gemini Enterprise, automates the deployment of decoys and honeytokens across enterprise networks and embeds deception guardrails directly into customer’s operating environment, with no manual configuration required. ShadowPlex deploys network decoys, identity honey accounts, retrieval-augmented generation (RAG) decoys, honey skills, and honeytokens at scale, trapping unauthorized interactions quickly.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Britive</strong><span style=\"vertical-align: baseline;\">: The Britive Emergency Termination Agent, built on Gemini Enterprise, lets security teams contain a compromised human or non-human identity from a single natural-language request instead of working across multiple consoles. The agent confirms the identity, lists all active privileged sessions, revokes all sessions with human approval, disables the identity, and gathers audit context for the incident ticket. The result is significantly lower mean time to containment (MTTC) while maintaining strict governance and least-privilege access for agents.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Check Point</strong><span style=\"vertical-align: baseline;\">: Integrated with the Google Cloud Agent Gateway and Agent Registry, Check Point AI Defense Plane provides the critical security controls and visibility required for your enterprise-scale AI. It allows organizations to discover AI workloads, monitor risk posture, detect non-compliant behavior, and apply real-time guardrails against prompt injection, data exposure, and rogue agentic behavior. Managed through the Check Point Agent in Gemini Enterprise, the unified solution secures and accelerates AI workload deployments on Gemini Enterprise.</span></p>\n<p><strong style=\"vertical-align: baseline;\">CrowdStrike</strong><span style=\"vertical-align: baseline;\">: CrowdStrike Falcon® Guardian extends guardrails and runtime protection by integrating with Agent Gateway to help secure agentic workloads running in Gemini Enterprise against risks including prompt injection, sensitive data leakage, and malicious AI activity. In addition, the CrowdStrike Gemini Enterprise agent enables practitioners to interact with the CrowdStrike platform through Gemini Enterprise, bringing CrowdStrike security context into agentic investigation and response and helping orchestrate SOC workflows across numerous tools.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Cyberhaven</strong><span style=\"vertical-align: baseline;\">: The Cyberhaven Linea agent brings discovery and classification of sensitive data across endpoints, cloud apps, and agentic workflows to Gemini Enterprise. Powered by Cyberhaven's data lineage model, it can turn plain-language intent into enforceable policies, monitor interactions to catch unmapped risks before they become breaches, and fast-track investigations with automated evidence. Extending across </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity in Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">, the Linea agent can eliminate alert fatigue and empowers security teams to protect sensitive assets as fast as autonomous agents move them.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Cyera</strong><span style=\"vertical-align: baseline;\">: Cyera Agent Guardian, built on Gemini Enterprise, secures agents that run on Gemini, providing data security posture management (DSPM) and data loss prevention (DLP). The Cyera agent can correlate machine identities, delegated permissions, and sensitive data classification to verify authorized agentic behavior, so organizations can deploy agents safely and maintain operational compliance at enterprise scale.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Endor Labs</strong><span style=\"vertical-align: baseline;\">: Endor Labs AURI agents bring AI-native application security across the developer and security workflow. Its Static Application Security Testing (SAST) triage agent can automatically classify and prioritize code findings inside developer platforms like Google Antigravity. In Gemini Enterprise, security teams can query and act on those findings conversationally, confirming what's actually exploitable and tracking fixes, all grounded in the Endor Labs application context.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Exabeam</strong><span style=\"vertical-align: baseline;\">: With Gemini Enterprise as its foundation, Exabeam is introducing the next generation of Exabeam Nova, a unified multi-agent AI system that helps security teams investigate and respond to threats faster. Nova coordinates specialized AI agents that can analyze behavior, prioritize risk, conduct investigations, and guide response actions while maintaining a shared operational context across the entire workflow. The result is a more intelligent and efficient analyst experience that helps organizations get greater value from their existing security operations environment.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Fastly</strong><span style=\"vertical-align: baseline;\">: The Fastly Autonomous Edge Defense Agent (AEDA) can help security teams investigate edge and infrastructure incidents in plain language inside Gemini Enterprise, instead of manually parsing logs. AEDA pairs an organization's own telemetry with anonymized intelligence from Fastly's global customer base, determining in seconds whether an anomaly is isolated or part of a broader attack, returning evidence-backed findings with a recommended fix.  </span></p>\n<p><strong style=\"vertical-align: baseline;\">Fortinet</strong><span style=\"vertical-align: baseline;\">: Fortinet FortiAIGate delivers large language model (LLM) runtime protection for Google Cloud customers. Integrated with the Gemini Enterprise and deployed in your Google Cloud environment, FortiAIGate can empower organizations to deploy sophisticated, agentic AI applications so that their data, prompts and model interactions are actively protected against emerging threats.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Menlo Security</strong><span style=\"vertical-align: baseline;\">: HEAT Shield Agent, built withGemini, analyzes web content and blocks zero-day threats and prompt injection at runtime. Alongside it, Menlo Security Orchestrator — built on Gemini Enterprise — turns security operations center (SOC) responses into natural-language, agentic workflows. It can reconstruct attacks, identify blast radius, and enforce policy in seconds, not hours. Menlo Agent Runtime Security (MARS) closes the loop, protecting human and agent-to-agent interactions so detection and containment stay unified across agentic workloads.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Obsidian Security</strong><span style=\"vertical-align: baseline;\">: Obsidian Security's Risk Analyzer and Breach Response agents on Gemini Enterprise can help security analysts assess risk and respond to breaches. Built to secure an organization's cloud and AI-native application portfolio, Obsidian agents discover AI agents across enterprise environments, assess the risk, flag governance gaps, and answer critical questions like which agents hold escalated privileges or write access. </span></p>\n<p><strong style=\"vertical-align: baseline;\">Palo Alto Networks</strong><span style=\"vertical-align: baseline;\">: Palo Alto Networks’ Cloud, Network, and AI Risk Assessment (CLARA) agent can help security teams protect critical data and compliant AI operations, without slowing down the pace of development. It can find and fix cloud and AI risks before they become breaches by continuously scanning cloud infrastructure and AI workloads, automatically surfacing hidden vulnerabilities and prioritizing fixes so security teams spend less time hunting for threats and more time closing them.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Ping Identity</strong><span style=\"vertical-align: baseline;\">: With Ping Identity's new PingID self-service agent, now available in Gemini Enterprise, employees can resolve common identity and device issues, including multi-factor authentication (MFA) resets and device recovery, by asking in natural language — no help-desk ticket required. Built on PingOne with secure delegated authentication, the PingID self-service agent gives IT teams an enterprise-ready way to manage workforce identities while reducing support costs and improving onboarding experience.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Qualys</strong><span style=\"vertical-align: baseline;\">: Qualys ROCky for Gemini Enterprise can help security teams manage and patch vulnerabilities using conversation inside Gemini Enterprise. Ask, \"How exposed are we to Log4Shell,\" \"What should we fix first,\" or \"Are we meeting our CISA KEV deadlines,\" and get answers ranked by the Qualys TruRisk score. It runs on each user's own Qualys entitlements so anyone can self-serve answers without help. It can also stage and deploy the patch.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Splunk, a Cisco company</strong><span style=\"vertical-align: baseline;\">: The Splunk Security AI agent, integrated with Gemini Enterprise, functions as an autonomous system that converts massive telemetry streams into real-time intelligence across security and observability data. By bypassing manual triage to instantly surface critical anomalies and system threats, it shifts teams from reactive investigations to proactive defense, lowering cognitive load during high-pressure incidents and enabling security teams to resolve risks faster.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Synk: </strong><span style=\"vertical-align: baseline;\">Every enterprise building with Gemini Enterprise and Antigravity is shipping code faster than ever, and Snyk makes sure that code is secure from the moment it's written, not after. Snyk validates what AI agents generate in real time, catching vulnerabilities and insecure dependencies before they ever reach a repo. It's security built for the speed AI writes code, not the speed humans used to.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Thales</strong><span style=\"vertical-align: baseline;\">: The Thales AI Security Fabric, integrated with Gemini Enterprise, can provide visibility, runtime protection, and centralized governance across agentic AI interactions. Organizations can move agentic AI from pilots to production, enforcing fine-grained access policies and protecting critical data assets right where they run.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Transmit Security</strong><span style=\"vertical-align: baseline;\">: Transmit Security Agent Intelligence built with Gemini Enterprise identifies agentic activity interacting with customer-facing applications. As users increasingly delegate tasks, transactions, and authority to AI agents, organizations need clear visibility into what that activity is, its origin, and its intent. That context allows businesses to distinguish good agents from malicious ones, decide what to allow versus block, and stay ahead of the risk without restricting legitimate commerce.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Zscaler</strong><span style=\"vertical-align: baseline;\">: Zscaler Risk360 provides a comprehensive, actionable framework that ingests data from existing Zscaler deployments to quantify cyber risk, create a detailed view of risk posture, and deliver clear insights to reduce risk. The Risk360 Agent is an AI-powered companion built on the ZAgent Framework with Gemini Enterprise, using natural-language interactions to unify Zscaler and partner signals, analyze Zero Trust risk, quantify financial exposure, recommend mitigations, and deliver decision-ready insights.</span></p>\n<p><span style=\"vertical-align: baseline;\">With this growing ecosystem of partner-built agents and connectors, Gemini Enterprise works with the security tools you already use — and lets you build custom agentic workflows on top of them. You can explore the security agents available in the</span> <a href=\"https://console.cloud.google.com/marketplace/browse?filter=category:ai-agent\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Marketplace</span></a><span style=\"vertical-align: baseline;\"> today.</span></p></div>"
  "7f162b5ef3bf28cd9fc38bde21659e45":
    "id": "7f162b5ef3bf28cd9fc38bde21659e45"
    "title": "Graph Workflows in ADK: Everything You Need to Know"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/graph-workflows-in-adk-everything-you-need-to-know/"
    "published": "2026-09-30 01:00:00"
    "fetched": "2026-09-30 06:53:33"
    "summary": "<div class=\"block-paragraph\"><p>Graph engineering is the design work: breaking a task into nodes, connecting them with edges, and deciding where code, models, or people control the next step. The <a href=\"https://adk.dev/\" target=\"_blank\">Agent Development Kit (ADK)</a>'s Workflow turns that design into an executable process, with functions and agents doing the work. Through a refund example, this post shows how to run steps in parallel, route decisions, pause for human review, and process a list of cases. It also explains when to declare the paths in a static graph and when to let Python schedule further work as results arrive.</p><p><b>TL;DR:</b> Using a refund workflow in ADK, we'll cover fan-out and fan-in, deterministic and agent routers, human-in-the-loop pauses, parallel workers, and dynamic orchestration— along with when to use a static graph or let Python decide what runs next.</p><h2><b>Start with a single agent</b></h2><p>We can give one agent the tools and instructions to handle the refund request from start to finish:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;refund_agent = Agent(\\r\\n    name=&quot;refund_agent&quot;, model=MODEL,\\r\\n    tools=[fetch_order, fetch_payment, fetch_history],\\r\\n    instruction=&quot;&quot;&quot;You handle refund requests.\\r\\n    1. Look up the order.\\r\\n    2. Check the payment record.\\r\\n    3. Check the customer\\&#x27;s refund history.\\r\\n    4. Deny if there\\&#x27;s an open chargeback or it\\&#x27;s past 30 days.\\r\\n       Approve if it\\&#x27;s under $50 and they\\&#x27;ve had fewer than three\\r\\n       refunds this year.\\r\\n    5. Write the customer an email explaining the decision.&quot;&quot;&quot;,\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f678aa81210&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>This puts the model in charge of choosing the tools, applying the policy, and writing the reply. But the prompt already describes distinct pieces of work: three lookups, a decision, and a response. Making those pieces separate nodes lets us decide how each should run.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"graph-workflows-in-adk-everything-you-need-to-know-01-five-nodes\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/graph-workflows-in-adk-everything-you-need.max-1000x1000_wEZYObA.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>Assume the customer has selected an order and clicked “Request refund.” The app knows the order ID, so the workflow can begin with the lookups.</p><h2><b>Let independent steps run together</b></h2><p>The order, payment, and refund-history lookups all need the order ID, but none needs another lookup's result. Although the prompt lists them one after another, there is no reason for them to wait for each other. We can run all three in parallel.</p><p>The policy decision is different: it needs all three records. So the workflow splits into three paths, then brings their results together before continuing. These two moves are called <b>fan-out</b> and <b>fan-in</b>.</p><p>In ADK, the lookup functions can become nodes directly. A nested tuple starts them together, and a <code>JoinNode</code> waits for their results. First, the imports and a lookup signature:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import asyncio\\r\\nfrom pydantic import BaseModel, Field\\r\\n\\r\\nfrom google.adk import Agent, Context, Event, Workflow\\r\\nfrom google.adk.events import RequestInput\\r\\nfrom google.adk.workflow import JoinNode, START, node\\r\\n\\r\\nasync def fetch_order(node_input: str) -&gt; dict:\\r\\n    ...&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67886a25d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>Each lookup receives the order ID through <code>node_input</code> and returns a dictionary. We can connect them like this:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;join_case = JoinNode(name=&quot;join_case&quot;)\\r\\n\\r\\nedges=[\\r\\n    (START, (fetch_order, fetch_payment, fetch_history), join_case),\\r\\n]&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67884c5890&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>Read this from left to right: start all three lookups, then continue through <code>join_case</code> once they finish.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"graph-workflows-in-adk-everything-you-need-to-know-02-fanout-join\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/graph-workflows-in-adk-everything-you-need.max-1000x1000_59cATcj.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>The join returns a dictionary keyed by node name. The next node can read <code>node_input[\"fetch_order\"]</code>, <code>node_input[\"fetch_payment\"]</code>, and <code>node_input[\"fetch_history\"]</code> without a model call to collect the results. The <a href=\"https://github.com/google/adk-python/blob/main/docs/guides/workflow/join_node/index.md\" target=\"_blank\">JoinNode guide</a> explains the details.</p><p>If the payment lookup needed a transaction ID from the order lookup, those two would run in sequence. <b>Dependencies determine the edges</b>, even when the prompt lists every step in order.</p><p>You can learn more about fan out and fan in in this video:</p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Mzr7byMFy_4\">\n\n      \n        <img alt=\"Video about how to build a production-ready, multi-agent AI system from scratch using Graph Engineering and Google&#x27;s Agent Development Kit (ADK).\" src=\"https://img.youtube.com/vi/Mzr7byMFy_4/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Graph Engineering with ADK</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Mzr7byMFy_4\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p>One detail matters when turning tools into nodes: the parameter named <code>node_input</code> receives the previous node's output. Other names bind to <code>ctx.state</code> by default, so <code>order_id</code> would look for <code>ctx.state[\"order_id\"]</code> and raise a <code>ValueError</code> if it is missing. Here, the str annotation also converts <code>START</code>'s <code>types.Content</code> input to a string.</p><h2><b>Route each request to the right workflow</b></h2><p>So far, the customer has explicitly requested a refund. In a broader support conversation, we first need to identify what they want and send the request to the right process. “The shoes are the wrong size. Could you send me a different pair?” should go to an exchange workflow, while a request for money back should enter our refund workflow.</p><p>That introduces a <b>router</b>, a node that chooses which branch runs next.</p><ul><li>A <b>deterministic router</b> follows explicit rules, the same inputs produce the same route.</li><li>A <b>nondeterministic router</b> can choose different branches for the same input.</li><li>An <b>agent router</b> uses a model to interpret the request, so its choice can vary.</li></ul><p>Routers choose among the paths defined by the workflow. In our support example, we can use an agent to identify the customer's intent, then fixed rules to apply the refund policy.</p><h3><b>Identify the intent with an agent router</b></h3><p>An agent can interpret the customer's message and classify the request. In one ADK pattern, it returns a structured category, then a small function emits the corresponding <code>Event(route=...)</code> to send the request to the chosen workflow:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Customer message → classification agent → route function\\r\\n                                           ├─ REFUND → refund workflow\\r\\n                                           ├─ EXCHANGE → exchange workflow\\r\\n                                           └─ CLARIFY → ask a follow-up question&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67884c7650&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>The model identifies the intent; the graph defines the available destinations. If the request is unclear, the workflow can ask a follow-up question. ADK's <a href=\"https://github.com/google/adk-python/blob/main/contributing/samples/workflows/route/agent.py\" target=\"_blank\">routing sample</a> shows this pattern.</p><p>This intent router would sit before our refund workflow. For the selected-order example, the “Request refund” button has already established the intent, so we can enter that workflow directly.</p><h3><b>Apply the refund policy with a deterministic router</b></h3><p>Inside the refund workflow, the three lookups give us the facts for another decision: approve, deny, or ask a person to review. This time, the policy gives us explicit thresholds, so a function can choose the path:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;def refund_policy(amount, days_ago, chargeback_open, priors):\\r\\n    if chargeback_open or days_ago &gt; 30:\\r\\n        return &quot;DENY&quot;\\r\\n    if amount &lt; 50 and priors &lt; 3:\\r\\n        return &quot;AUTO_APPROVE&quot;\\r\\n    return &quot;MANUAL_REVIEW&quot;\\r\\n\\r\\ndef route_refund(node_input):\\r\\n    case = {**node_input[&quot;fetch_order&quot;], **node_input[&quot;fetch_payment&quot;],\\r\\n            **node_input[&quot;fetch_history&quot;]}\\r\\n    route = refund_policy(case[&quot;amount_usd&quot;], case[&quot;placed_days_ago&quot;],\\r\\n                          case[&quot;chargeback_open&quot;], case[&quot;prior_refunds_12mo&quot;])\\r\\n    return Event(output=case, route=route)        # the function names the path&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67884c56d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\"><code>route_refund</code> combines the records and returns the case with one of three route names: </span><code style=\"vertical-align: baseline;\">AUTO_APPROVE</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">DENY</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">MANUAL_REVIEW</code><span style=\"vertical-align: baseline;\">. Manual review handles cases that meet neither automatic rule.</span></p>\n<p><span style=\"vertical-align: baseline;\">This is a </span><strong style=\"vertical-align: baseline;\">deterministic router</strong><span style=\"vertical-align: baseline;\">: the same case data produces the same decision, and we can test the policy without calling a model.</span></p>\n<p> </p>\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table border=\"1\" style=\"border-collapse: collapse; width: 100%;\">\n<thead>\n<tr>\n<td style=\"width: 31.4907%;\"> </td>\n<td style=\"width: 31.4907%;\"><strong>Deterministic router</strong></td>\n<td style=\"width: 31.4907%;\"><strong><span style=\"vertical-align: baseline;\">Agent router</span></strong></td>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Decisions come best from</strong></td>\n<td style=\"width: 31.4907%;\">Rules in code</td>\n<td style=\"width: 31.4907%;\">A model interpreting the input</td>\n</tr>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Best fit</strong></td>\n<td style=\"width: 31.4907%;\">Known facts and explicit policy</td>\n<td style=\"width: 31.4907%;\">Meaning that is hard to capture in rules</td>\n</tr>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Example</strong></td>\n<td style=\"width: 31.4907%;\">Deny an order older than 30 days</td>\n<td style=\"width: 31.4907%;\">Recognize an exchange request</td>\n</tr>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Model call for routing</strong></td>\n<td style=\"width: 31.4907%;\">None</td>\n<td style=\"width: 31.4907%;\">Required</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"> </div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Both routers choose among defined paths. </span><strong style=\"vertical-align: baseline;\">An agent router can sit inside a static graph</strong><span style=\"vertical-align: baseline;\">: the model's choice varies, while the possible connections stay the same.</span></p>\n<p><span style=\"vertical-align: baseline;\">For an automatic approval or denial, the next step is to explain the decision to the customer. We give each route a notice agent that writes the reply from the case data. ADK passes the dictionary in </span><code style=\"vertical-align: baseline;\">Event(output=case, ...)</code><span style=\"vertical-align: baseline;\"> to that agent as a JSON user message:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;approve_notice = Agent(\\r\\n    name=&quot;approve_notice&quot;, model=MODEL,\\r\\n    instruction=&quot;Tell the customer their refund is approved and when to expect the &quot;\\r\\n                &quot;money, using the case JSON you receive. Short email, warm, no fluff.&quot;,\\r\\n)\\r\\ndenial_notice = Agent(\\r\\n    name=&quot;denial_notice&quot;, model=MODEL,\\r\\n    instruction=&quot;Tell the customer their refund was declined and exactly why, based &quot;\\r\\n                &quot;on the case JSON you receive. If it carries a reviewer_note, that is &quot;\\r\\n                &quot;the reason. Short email, direct and kind. Do not invent policy.&quot;,\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67885f5910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>The refund workflow now has a path from the initial lookups to a decision and a reply, with a third branch for cases that need a person:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;workflow = Workflow(\\r\\n    name=&quot;refund_decision&quot;,\\r\\n    edges=[\\r\\n        (START, (fetch_order, fetch_payment, fetch_history),\\r\\n         join_case, route_refund),\\r\\n        (route_refund, {&quot;AUTO_APPROVE&quot;:  approve_notice,\\r\\n                        &quot;MANUAL_REVIEW&quot;: escalate_to_human,\\r\\n                        &quot;DENY&quot;:          denial_notice}),\\r\\n    ],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67885f4490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The first chain fetches the records, joins them, and applies the policy. The second maps the router's decision to a destination. Automatic decisions go straight to a notice agent; </span><code style=\"vertical-align: baseline;\">MANUAL_REVIEW</code><span style=\"vertical-align: baseline;\"> goes to the human-review node we'll define next.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"graph-workflows-in-adk-everything-you-need-to-know-03-refund-graph\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/graph-workflows-in-adk-everything-you-need.max-1000x1000_9lNpFLs.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">That third branch needs more than another function call. A reviewer may take minutes or days to answer, so the workflow must pause with the case pending and continue once the person decides.</span></p>\n<p><span style=\"vertical-align: baseline;\">The review node yields RequestInput, which records the pending request and pauses the run. On resume, </span><code style=\"vertical-align: baseline;\">rerun_on_resume=True</code><span style=\"vertical-align: baseline;\"> runs the node again, with the answer available in </span><code style=\"vertical-align: baseline;\">ctx.resume_inputs</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;REVIEW = &quot;refund:review&quot;\\r\\n\\r\\nclass ReviewDecision(BaseModel):\\r\\n    approve: bool = Field(description=&quot;True to refund, False to decline.&quot;)\\r\\n    note: str = Field(&quot;&quot;, description=&quot;Why, in the reviewer\\&#x27;s words.&quot;)\\r\\n\\r\\n@node(rerun_on_resume=True)\\r\\nasync def escalate_to_human(ctx: Context, node_input: dict):\\r\\n    answer = ctx.resume_inputs.get(REVIEW)\\r\\n    if answer is None:                       # first pass: ask, then stop\\r\\n        yield RequestInput(\\r\\n            interrupt_id=REVIEW,\\r\\n            message=f&quot;Refund ${node_input[\\&#x27;amount_usd\\&#x27;]} on order &quot;\\r\\n                    f&quot;{node_input[\\&#x27;order_id\\&#x27;]}?&quot;,\\r\\n            payload=node_input,              # what the reviewer is shown\\r\\n            response_schema=ReviewDecision,\\r\\n        )\\r\\n        return\\r\\n    # second pass: the answer is here, so route on it\\r\\n    yield Event(output={**node_input, &quot;reviewer_note&quot;: answer.get(&quot;note&quot;, &quot;&quot;)},\\r\\n                route=&quot;AUTO_APPROVE&quot; if answer[&quot;approve&quot;] else &quot;DENY&quot;)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67885f69d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The response schema gives the node an </span><code style=\"vertical-align: baseline;\">approve</code><span style=\"vertical-align: baseline;\"> value to route on and a note to carry forward. If the reviewer declines, the notice agent receives their reason with the case. One more edge connects the review decision to the reply:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;edges=[\\r\\n    ...,\\r\\n    (escalate_to_human, {&quot;AUTO_APPROVE&quot;: approve_notice,\\r\\n                         &quot;DENY&quot;:         denial_notice}),\\r\\n]&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67885f4050&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ADK ships two variants of this. The one above is the single-node pattern: the node reruns and reads </span><code style=\"vertical-align: baseline;\">ctx.resume_inputs</code><span style=\"vertical-align: baseline;\">, as in the </span><a href=\"https://github.com/google/adk-python/blob/main/contributing/samples/workflows/request_input_rerun/agent.py\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">request_input_rerun</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> sample</span></a><span style=\"vertical-align: baseline;\">. The </span><a href=\"https://github.com/google/adk-python/blob/main/contributing/samples/workflows/request_input/agent.py\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">request_input</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> sample</span></a><span style=\"vertical-align: baseline;\"> shows the two-node variant, where one node yields </span><code style=\"vertical-align: baseline;\">RequestInput</code><span style=\"vertical-align: baseline;\"> and the reviewer's answer arrives as the next node's </span><code style=\"vertical-align: baseline;\">node_input</code><span style=\"vertical-align: baseline;\"> — so there is no </span><code style=\"vertical-align: baseline;\">ctx.resume_inputs</code><span style=\"vertical-align: baseline;\"> to find in that file. The companion scripts linked below include the code that sends the reviewer's answer back to the run.</span></p>\n<p><span style=\"vertical-align: baseline;\">A </span><code style=\"vertical-align: baseline;\">Workflow</code><span style=\"vertical-align: baseline;\"> is also a node. This whole refund process can become one step in a larger customer-service workflow.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Apply the same step to a batch of cases</strong></h2>\n<p><span style=\"vertical-align: baseline;\">We now have a process for one refund. Suppose a batch of cases arrives with the records already collected. Each needs the same policy check, and the number of cases changes from batch to batch. We can apply one node to every item using a </span><strong style=\"vertical-align: baseline;\">parallel worker</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">In ADK, </span><code style=\"vertical-align: baseline;\">parallel_worker=True</code><span style=\"vertical-align: baseline;\"> runs a node once per item in an input list and collects the results in the original order. We can reuse our policy function:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;@node(parallel_worker=True)\\r\\ndef review_case(node_input):\\r\\n    # Each worker receives one case from the input list.\\r\\n    case = node_input\\r\\n    decision = refund_policy(\\r\\n        case[&quot;amount_usd&quot;], case[&quot;placed_days_ago&quot;],\\r\\n        case[&quot;chargeback_open&quot;], case[&quot;prior_refunds_12mo&quot;],\\r\\n    )\\r\\n    return {&quot;order_id&quot;: case[&quot;order_id&quot;], &quot;decision&quot;: decision}\\r\\n\\r\\ndef collect_decisions(node_input):\\r\\n    # This node receives the list of worker results.\\r\\n    return {&quot;decisions&quot;: node_input}\\r\\n\\r\\nbatch_review = Workflow(\\r\\n    name=&quot;batch_review&quot;,\\r\\n    edges=[(START, review_case, collect_decisions)],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67884c5790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Each worker receives one case, and </span><code style=\"vertical-align: baseline;\">collect_decisions</code><span style=\"vertical-align: baseline;\"> receives the results as a list. No separate </span><code style=\"vertical-align: baseline;\">JoinNode</code><span style=\"vertical-align: baseline;\"> is needed. The flag also works on agents—for example, to write an explanation for each case. The </span><a href=\"https://github.com/google/adk-python/blob/main/contributing/samples/workflows/parallel_worker/agent.py\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">parallel_worker</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> sample</span></a><span style=\"vertical-align: baseline;\"> shows both forms.</span></p>\n<p><span style=\"vertical-align: baseline;\">The policy calculation here is small. Concurrency is more useful when each item waits on an API or model call, but the way inputs and results move stays the same.</span></p>\n<p> </p>\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table border=\"1\" style=\"border-collapse: collapse; width: 100%;\">\n<thead>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Pattern</strong></td>\n<td style=\"width: 31.4907%;\"><strong>Work distributed</strong></td>\n<td style=\"width: 31.4907%;\"><strong>Collected output</strong></td>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Fan-out with <code>JoinNode</code></strong></td>\n<td style=\"width: 31.4907%;\">Different notes doing independent jobs</td>\n<td style=\"width: 31.4907%;\">Dictionary keyed by node name</td>\n</tr>\n<tr>\n<td style=\"width: 31.4907%;\"><strong>Parallel worker</strong></td>\n<td style=\"width: 31.4907%;\">The same node for every item</td>\n<td style=\"width: 31.4907%;\">List in input order</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"> </div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">The batch size can change without changing the graph. A variable amount of work still fits inside a fixed process. See the <a href=\"https://github.com/google/adk-python/blob/main/docs/guides/workflow/parallel_worker/index.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">parallel worker guide</span></a></span><span style=\"vertical-align: baseline;\"> for execution details.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Let results shape the next step</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Our refund process has known paths, even when a batch contains more cases or a reviewer takes longer to answer. But some work only becomes clear as we investigate.</span></p>\n<p><span style=\"vertical-align: baseline;\">Suppose a disputed refund reveals a second transaction. Checking it raises a delivery question that needs further investigation. Now each result can create follow-up work. A </span><strong style=\"vertical-align: baseline;\">dynamic node</strong><span style=\"vertical-align: baseline;\"> can examine those results and schedule the next checks in Python.</span></p>\n<p><span style=\"vertical-align: baseline;\">ADK provides </span><code style=\"vertical-align: baseline;\">ctx.run_node</code><span style=\"vertical-align: baseline;\"> to run another node and await its result. To see how that changes orchestration, let's first express our existing refund flow this way:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;HANDLERS = {\\r\\n    &quot;AUTO_APPROVE&quot;: approve_notice,\\r\\n    &quot;MANUAL_REVIEW&quot;: escalate_to_human,\\r\\n    &quot;DENY&quot;: denial_notice,\\r\\n}\\r\\n\\r\\n@node(rerun_on_resume=True)\\r\\nasync def refund_flow(ctx, node_input):\\r\\n    # Step 1: fetch all three records at once.\\r\\n    order, payment, history = await asyncio.gather(\\r\\n        ctx.run_node(fetch_order,   node_input, use_sub_branch=True),\\r\\n        ctx.run_node(fetch_payment, node_input, use_sub_branch=True),\\r\\n        ctx.run_node(fetch_history, node_input, use_sub_branch=True),\\r\\n    )\\r\\n    case = order | payment | history\\r\\n\\r\\n    # Step 2: apply the refund policy — the same pure function, 0 LLM calls.\\r\\n    decision = refund_policy(\\r\\n        amount=case[&quot;amount_usd&quot;],\\r\\n        days_ago=case[&quot;placed_days_ago&quot;],\\r\\n        chargeback_open=case[&quot;chargeback_open&quot;],\\r\\n        priors=case[&quot;prior_refunds_12mo&quot;],\\r\\n    )\\r\\n\\r\\n    # Step 3: run the chosen handler, and use its output as this node\\&#x27;s output.\\r\\n    await ctx.run_node(HANDLERS[decision], case, use_as_output=True)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67885f61d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">asyncio.gather</code><span style=\"vertical-align: baseline;\"> runs the lookups together. Python combines their results, applies the policy, and runs the selected </span><code style=\"vertical-align: baseline;\">handler. use_as_output=True</code><span style=\"vertical-align: baseline;\"> makes the handler's result the parent node's output without emitting it twice.</span></p>\n<p><span style=\"vertical-align: baseline;\">The dynamic version also adjusts the human-review node: after the answer arrives, it calls the chosen notice agent through </span><code style=\"vertical-align: baseline;\">ctx.run_node</code><span style=\"vertical-align: baseline;\">. The complete dynamic script (</span><code style=\"vertical-align: baseline;\">refund_dynamic.py</code><span style=\"vertical-align: baseline;\">) includes that variation.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"graph-workflows-in-adk-everything-you-need-to-know-04-dynamic\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/graph-workflows-in-adk-everything-you-need.max-1000x1000_XydYu0o.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>The outer graph only needs an entry point:</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;workflow = Workflow(\\r\\n    name=&quot;refund_dynamic&quot;,\\r\\n    edges=[(START, refund_flow)],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f67885f75d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In the static version, the edge list shows the branches and destinations. In this version, we read </span><code style=\"vertical-align: baseline;\">refund_flow</code><span style=\"vertical-align: baseline;\"> to see them. The </span><a href=\"https://github.com/google/adk-python/blob/main/docs/guides/workflow/dynamic_nodes/index.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dynamic node guide</span></a><span style=\"vertical-align: baseline;\"> covers this approach.</span></p>\n<p><span style=\"vertical-align: baseline;\">The human-review pause still works here. When the answer arrives, </span><code style=\"vertical-align: baseline;\">refund_flow</code><span style=\"vertical-align: baseline;\"> runs again from the top, but completed </span><code style=\"vertical-align: baseline;\">ctx.run_node</code><span style=\"vertical-align: baseline;\"> calls return their recorded outputs from session history. The lookups do not repeat, as direct function calls would. Keeping side effects inside child nodes lets completed calls replay their results when the parent resumes. Each child also gets its own trace span, and </span><code style=\"vertical-align: baseline;\">use_sub_branch=True</code><span style=\"vertical-align: baseline;\"> keeps concurrent children's events on separate branches.</span></p>\n<p><span style=\"vertical-align: baseline;\">For this fixed refund process, the edge list remains easy to inspect. The Python version gives us a place to add the investigation logic described above: inspect a result, choose a follow-up node, and run independent checks together. A model might suggest what to investigate, while code limits the work—for example, three follow-ups per finding and two levels of investigation before human review.</span></p>\n<p><span style=\"vertical-align: baseline;\">Loops can still fit in a static graph. A fixed draft → check → revise process can use a conditional back-edge and a router that limits revisions. “Static” describes the possible connections; the actual path and iteration count can vary. The </span><a href=\"https://github.com/google/adk-python/blob/main/docs/guides/workflow/graph/index.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">graph guide</span></a><span style=\"vertical-align: baseline;\"> covers conditional cycles.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can also place a dynamic node inside a static workflow, using Python for a stage that needs it while keeping the surrounding process visible.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Choose who decides what runs next</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Start with a question: </span><strong style=\"vertical-align: baseline;\">can you draw the possible workflow before the input arrives?</strong><span style=\"vertical-align: baseline;\"> Include branches, loops, and repeated stages. You do not need to predict the path each request will take.</span></p>\n<p> </p>\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table border=\"1\" style=\"border-collapse: collapse; width: 100%;\">\n<tbody>\n<tr>\n<td style=\"width: 48.1356%;\">\n<p><strong>What you need</strong></p>\n</td>\n<td style=\"width: 48.1356%;\"><strong>Pattern</strong></td>\n</tr>\n<tr>\n<td style=\"width: 48.1356%;\">Independent jobs, then all their results</td>\n<td style=\"width: 48.1356%;\">Fan-out and fan-in</td>\n</tr>\n<tr>\n<td style=\"width: 48.1356%;\">A branch chosen by fixed rules</td>\n<td style=\"width: 48.1356%;\">Deterministic router</td>\n</tr>\n<tr>\n<td style=\"width: 48.1356%;\">A branch chosen by interpreting meaning</td>\n<td style=\"width: 48.1356%;\">Agent router</td>\n</tr>\n<tr>\n<td style=\"width: 48.1356%;\">A person's decision before continuing</td>\n<td style=\"width: 48.1356%;\"><code>RequestInput</code></td>\n</tr>\n<tr>\n<td style=\"width: 48.1356%;\">The same step across a list</td>\n<td style=\"width: 48.1356%;\">Parallel worker</td>\n</tr>\n<tr>\n<td style=\"width: 48.1356%;\">Code that schedules work as results arrive</td>\n<td style=\"width: 48.1356%;\">Dynamic node</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"> </div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Use an edge list when it makes those connections clear. Use dynamic orchestration when results create further work or Python expresses the control more naturally. A small, open-ended task may need only one agent and its tools.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our refund workflow, the graph coordinates the lookups, code applies the policy, a person handles exceptions, and a model writes the reply. Graph engineering gives each a clear responsibility—and makes it easier to see how the process works.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Get started</strong></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read:</strong><span style=\"vertical-align: baseline;\"> the </span><a href=\"https://github.com/google/adk-python/blob/main/docs/guides/workflow/workflow/index.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">workflow guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore:</strong><span style=\"vertical-align: baseline;\"> the </span><a href=\"https://github.com/google/adk-python/tree/main/contributing/samples/workflows\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">workflow samples</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build:</strong><span style=\"vertical-align: baseline;\"> the </span><a href=\"https://codelabs.developers.google.com/adk2/instructions#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">hands-on codelab</span></a><span style=\"vertical-align: baseline;\">, which applies these patterns to a marathon race-day coach.</span></p>\n</li>\n</ul></div>"
  "635bc625f46e8eec3bd5b90f6a246bb6":
    "id": "635bc625f46e8eec3bd5b90f6a246bb6"
    "title": "Vulnerability Discovery and Exploitation Trends in the AI Era"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/vulnerability-discovery-and-exploitation-trends-in-the-ai-era/"
    "published": "2026-09-30 23:00:00"
    "fetched": "2026-10-01 00:38:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Written by: Robin Grunewald, Supriya Mazumdar, Kelli Vanderlee</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Introduction</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google Threat Intelligence Group (GTIG) examines vulnerability disclosure and exploitation statistics to evaluate the impact of artificial intelligence (AI) on the vulnerability threat landscape. We found that AI is measurably changing not just the pace of vulnerability discovery and exploitation, but also the types and typical risk profiles of vulnerabilities that are being discovered.</span></p>\n<p><span style=\"vertical-align: baseline;\">Key findings: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Vulnerability disclosures doubled: </strong><span style=\"vertical-align: baseline;\">the number of vulnerabilities disclosed per month doubled, rising from 5,045 in January 2026 to 10,477 in July and continuing to climb to 10,740 in August 2026.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Vulnerability exploitation nearly doubled:</strong><span style=\"vertical-align: baseline;\"> the number of vulnerabilities exploited increased from an average of 10.5 per month in 2025 to an average of 18 per month from January 2026 to August 2026.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero-day exploitation increased marginally:</strong><span style=\"vertical-align: baseline;\"> zero-day vulnerability exploitation grew from an average of 8 per month in 2025 to an average of 11 per month from January 2026 to August 2026.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI finds more consequential vulnerabilities: </strong><span style=\"vertical-align: baseline;\">AI-assisted discovery found proportionally fewer Low-Risk vulnerabilities, more Moderate-Risk vulnerabilities, and more vulnerabilities leading to remote code execution (RCE).</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">GTIG expects that vulnerability discovery and exploitation will continue to grow in the short to medium term. To counter the increased risk from rapid vulnerability discovery and exploitation, organizations must transition from unprioritized mass-patching to threat-intelligence-driven triage, combining targeted edge-defense with automated, agentic remediation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Scope &amp; Methodology</span></h3>\n<p><span style=\"vertical-align: baseline;\">This GTIG analysis examines trends in vulnerabilities disclosed from January 1, 2025 through August 31, 2026. The dataset tracks the vulnerabilities alongside critical operational dimensions, including exploitation consequences and </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/separating-signal-noise-how-mandiant-intelligence-rates-vulnerabilities-intelligence\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GTIG Vulnerability Risk Ratings</span></a><span style=\"vertical-align: baseline;\">, and in-the-wild exploitation. When we refer to risk ratings in this blog, we are using GTIG vulnerability risk ratings, not </span><a href=\"https://nvd.nist.gov/vuln-metrics/cvss\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVSS severity</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">While the baseline monitoring encompasses the full 20-month window (January 2025–August 2026), this report specifically focuses on growth velocity and emerging threat vectors.</span></p>\n<p><span style=\"vertical-align: baseline;\">The research seeks to evaluate the impact of AI across the cybersecurity landscape both in terms of rates of Common Vulnerabilities and Exposures (CVE) disclosure and rates of exploitation. We also examine vulnerabilities targeting the AI/large language model (LLM) operational stack.</span></p>\n<h3><span style=\"vertical-align: baseline;\">CVE Disclosure Doubled in 2026 </span></h3>\n<p><span style=\"vertical-align: baseline;\">Vulnerability disclosures doubled from 5,045 in January 2026 to 10,477 in July, with the count of disclosed vulnerabilities reaching a peak of 10,740 in August (Figure 1). </span></p>\n<h4><span style=\"vertical-align: baseline;\">Distinguishing Threat Risk from CVE Inflation</span></h4>\n<p><span style=\"vertical-align: baseline;\">However, raw disclosure volume throughout 2026 can be misleading without threat intelligence context. Automated CVE Numbering Authority (CNA) assignment policies across open-source ecosystems can inflate baseline figures; for instance, vulnerabilities with a description containing “Linux Kernel” alone generated approximately 5,000 CVEs between January 2026 and August 2026 with zero observed exploited in-the-wild zero-days. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities disclosed, January 2025 - August 2026 (Source: GTIG)\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Count_of_vulnerabilities_disclose.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Count of vulnerabilities disclosed, January 2025 - August 2026 (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In terms of risk ratings, the most interesting increase occurred in High-Risk vulnerabilities, which surged from 131 disclosures in January 2026 to 350 in August 2026, a 167% growth (Figure 2). High-Risk vulnerabilities remain a small proportion (3% in August 2026) of all vulnerabilities disclosed. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities disclosed by GTIG vulnerability risk rating, January 2025 - August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_Count_of_vulnerabilities_disclose.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: Count of vulnerabilities disclosed by GTIG vulnerability risk rating, January 2025 - August 2026 (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The increase in High-Risk vulnerabilities throughout 2026 was driven by two compounding dynamics: a widening pool of affected vendors and concentrated vendor disclosure cycles. Across the broader software ecosystem, baseline High-Risk disclosures more than doubled over the past year, rising from ~65/month in mid-2025 to ~135/month in mid-2026 (Figure 3). On top of this elevated baseline, Figure 3 highlights two time frames in which particular vendors reported exceptionally high quantities of CVEs,  pushing monthly volumes to historic peaks:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TOTOLINK:</strong><span style=\"vertical-align: baseline;\"> In April and May, mass research disclosures against consumer router firmware added 75 High-Risk flaws, driving the mid-year spike in Command Execution vulnerabilities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle &amp; Linux: </strong><span style=\"vertical-align: baseline;\">In June, July, and August Oracle’s quarterly Critical Patch Update (CPU) across middleware like WebLogic and Coherence combined with Linux kernel network driver advisories to contribute 128 High-Risk vulnerabilities in August alone (nearly 37% of all High-Risk disclosures), directly fueling growth in Remote Code Execution vulnerabilities.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities High Risk disclosed by Vendor, January 2025 to August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3_Count_of_vulnerabilities_High_Ris.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Count of vulnerabilities High Risk disclosed by Vendor, January 2025 to August 2026 (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">In-the-Wild Exploitation</span></h3>\n<p><span style=\"vertical-align: baseline;\">From January 2026 to August 2026, GTIG recorded 141 distinct vulnerabilities disclosed and exploited, surpassing the total number of vulnerabilities exploited for the full year of 2025 (127). In-the-wild exploitation increased from an average of 10.5 per month in 2025 to 18 per month in 2026. However, it is important to note that the proportion of vulnerabilities exploited versus disclosed remains vanishingly small: only 0.23% of all disclosed vulnerabilities in 2026 (roughly 1 in 431) were ever observed in active exploitation, or on the order of tens versus thousands per month. This means that monthly exploitation counts can more easily be influenced by other factors such as vendor disclosure cycles and threat actor campaign spikes. Since May 2026, a shift has emerged, with the expansion of CVE exploitation (+127% indexed growth) closely mirroring disclosure growth (+128% indexed growth), scaling in tandem with the overall vulnerability landscape rather than outpacing it. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of all vulnerabilities exploited, by n-days and zero-days, January 2025 to August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_5_Count_of_all_vulnerabilities_expl.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 4: Count of all vulnerabilities exploited, by n-days and zero-days, January 2025 to August 2026 (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Zero-Day Exploitation Remains Stable</span></h2>\n<p><span style=\"vertical-align: baseline;\">The count of zero-days exploited increased marginally from an average of 8 per month in 2025 to an average of 11 per month in 2026. While the number of zero-days identified per month remained near baseline levels (between 8 and 12) through mid-2026, in August, the count jumped to 22  (Figure 4). Zero-day exploitation also continues to represent a very small proportion of all vulnerabilities disclosed, though it still constitutes the majority (62%) of all observed exploited vulnerabilities from January 2026 to August 2026. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Are Threat Actors Finding More Success with Exploiting N-Days?</span></h4>\n<p><span style=\"vertical-align: baseline;\">It is possible that threat actors are finding it more accessible or efficient to use LLMs and AI tools to automate analysis of differences between product versions, patches, vulnerability disclosure announcements, and Proof-of-Concept (POC) code to rapidly weaponize n-days, rather than to discover new zero-days. </span></p>\n<h4><span style=\"vertical-align: baseline;\">CVE Exploitation Trends Toward Higher Risk Vulnerabilities</span></h4>\n<p><span style=\"vertical-align: baseline;\">With zero-day exploitation rates increasing only marginally, we suggest that the primary source of growth in vulnerability exploitation from January 2026 to August 2026 has been concentrated in the rapid weaponization of n-days. Significantly, exploitation of High-Risk vulnerabilities more than doubled from 28 in 2025 to 75 from January 2026 to August 2026.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Count of vulnerabilities exploited in the wild by GTIG vulnerability risk rating, January 2025 - August 2026\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_6_Count_of_vulnerabilities_exploite.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 5: Count of vulnerabilities exploited in the wild by GTIG vulnerability risk rating, January 2025 - August 2026 (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2 style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Exploitation by Attack Surface</span></h2>\n<p><span style=\"vertical-align: baseline;\">Vulnerabilities affecting Edge and Security Appliances represented 14% of vulnerabilities exploited from January 2026 to August 2026, while 11% affected Enterprise Directory &amp; Collaboration hubs. Edge gateways represent a premier initial-access vector: over 65% of edge flaws exploited from January 2026 to August 2026 met High/Critical Threat Risk ratings, with adversaries aggressively targeting unauthenticated public management interfaces to capitalize on enterprise EDR agent blind spots.</span></p>\n<p><span style=\"vertical-align: baseline;\">While CVE discovery volume metrics surge, adversary exploitation activity remains concentrated in perimeter appliances and exposed enterprise services.</span></p>\n<h1 style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Comparing Growth Rates For Specified Categories</strong></h1>\n<p><span style=\"vertical-align: baseline;\">Plotting raw monthly counts hides relative momentum due to the vast disparity between single-digit zero-day discoveries and more than 10,000 vulnerabilities disclosed in the month of August, for example. To enable a direct comparison of growth rates across vulnerability tiers, Figure 7 indexes four metrics to a baseline of 0 in January 2025 and provides a trendline of the three month rolling average growth rate:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #1a73e8;\"><strong style=\"vertical-align: baseline;\">Overall CVE Disclosure (128%)</strong></span><span style=\"vertical-align: baseline;\">: As previously stated, raw counts of CVE disclosures doubled from January 2026 to August 2026. The three month rolling average growth rate suggests that CVE disclosures have steadily accelerated in 2026. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #f9ab00;\"><strong style=\"vertical-align: baseline;\">High-Risk Vulnerabilities Disclosed (241%)</strong></span><span style=\"vertical-align: baseline;\">: Demonstrated the steepest growth across the dataset, climbing to almost a 3.5x its initial baseline (a +241% increase) by  August 2026. Excluding Linux, Oracle, and Totolink, the rate of increase was just 128% from January 2025 to August 2026. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #1e8e3e;\"><strong style=\"vertical-align: baseline;\">CVE Exploitation in the Wild (127%)</strong></span><span style=\"vertical-align: baseline;\">: From January to August 2026, CVE exploitation has increased at approximately the same rate as overall CVE disclosure, though the three month rolling average trendline suggests that growth in exploitation did not begin to pick up until the second quarter of 2026. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"color: #d93025;\"><strong style=\"vertical-align: baseline;\">Zero-Days Exploited (59%)</strong></span><span style=\"vertical-align: baseline;\">: While remaining near baseline levels (between 8 and 12 zero-days per month) through mid-2026, in August, the count reached 22. This increase is reflected in the three month rolling average growth rate, which began to reveal an upward trend in the summer of 2026. </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">This clear visual divergence underscores that the moderate increase in vulnerability exploitation in 2026 is driven by the rapid, targeted weaponization of high-risk exploits in the wild vulnerabilities rather than a flood of new zero-days.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 Month Rolling Average of % Growth, Indexed to 0% at January 2025 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_6_-3_Month_Rolling_Average_of__Grow.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 6: 3 Month Rolling Average of % Growth, Indexed to 0% at January 2025 (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">AI as the Hunter: AI-Assisted Vulnerability Discovery</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Detection Methodology &amp; Attribution Realities</span></h4>\n<p><span style=\"vertical-align: baseline;\">Current public data significantly undercount vulnerabilities discovered by AI due to two structural dynamics:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Absence of Standardized Metadata</strong><span style=\"vertical-align: baseline;\">: Public CVE repositories do not yet feature uniform metadata tags for AI attribution, requiring manual heuristic tracking.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Silent First-Party &amp; Cloud Patching</strong><span style=\"vertical-align: baseline;\">: Major cloud and SaaS providers routinely remediate AI-surfaced vulnerabilities directly in production without requesting formal CVE IDs, as CVE assignments are typically reserved for on-premise or third-party software requiring customer patching coordination. Many findings also remain embargoed for a period during established Coordinated Vulnerability Disclosure (CVD) windows.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">However, we can identify vulnerabilities likely surfaced by autonomous agents using a multi-tier verification process:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verified Lab &amp; Vendor Ledgers</strong><span style=\"vertical-align: baseline;\">: Directly ingesting confirmed disclosures from frontier AI research programs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Advisory &amp; Release Parsing: </strong><span style=\"vertical-align: baseline;\">Programmatically monitoring Cybersecurity and Infrastructure Security Agency (CISA) advisories, MITRE records, and vendor security bulletins for explicit acknowledgments attributing root-cause discovery or PoC synthesis to autonomous AI agents (e.g., Hacktron AI, AISLE).</span></p>\n</li>\n</ol>\n<h4><span style=\"vertical-align: baseline;\">Risk Profile Divergence: AI vs. Conventional Discovery</span></h4>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">Analyzing disclosed vulnerabilities we were able to identify as likely AI discovered suggests a structural divergence from conventional human and scanner discoveries. AI agents have been used to surface proportionally fewer Low-Risk vulnerabilities, and proportionally more Medium- and High-Risk vulnerabilities.</span></p></div>\n<div class=\"block-paragraph_advanced\"><div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: left;\"><strong style=\"vertical-align: baseline;\">GTIG CVE Risk Rating</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">CVE Not Discovered  by AI</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">CVE DIscovered by AI</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Low</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">69%</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">39%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Medium</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">28%</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">58%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">High</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3%</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4%</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Table 1: Share of vulnerabilities per risk rating  - AI vs. Non AI discovery - Jan to August 2026 (Source: GTIG)</span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Conventional CVE disclosures are dominated by low-severity findings (69% Low Threat Risk, 28% Medium). In contrast, AI-discovered vulnerabilities invert this distribution: 58% qualify for Medium Threat Risk (more than double the baseline), while low-risk findings drop to 39%.</span></p>\n<p><span style=\"vertical-align: baseline;\">This distribution largely likely reflects how research programs scope and deploy these systems. Rather than running broad, automated scans for cosmetic flaws or compliance warnings, researchers deliberately prompt and task autonomous agents with auditing critical infrastructure and sensitive privilege boundaries, focusing on high-impact findings. Mandiant has described similar findings when using a specialized </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Vulnerability Discovery Harness</span></a><span style=\"vertical-align: baseline;\"> (AVDH) in point-in-time assessments of client codebases.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Share of vulnerabilities per exploitation consequence - AI vs. Non AI discovery\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_8_Share_of_vulnerabilities_per_expl.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 7: Share of vulnerabilities per exploitation consequence - AI vs. Non AI discovery (Source: GTIG)</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Divergence between AI-discovered vulnerabilities and vulnerabilities not discovered by AI is also apparent in terms of exploitation consequences. Exactly 50% of all AI-discovered vulnerabilities result in Remote Code Execution (RCE), compared to just 26% across the broader CVE ecosystem. Conversely, AI agents under-index in lower-impact categories, surfacing less than half the rate of Information Disclosure (8% vs. 18%) and Data Manipulation (5% vs. 9%) as vulnerabilities not identified as discovered by AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">This concentration on code execution likely stems from how frontier agents operate. Autonomous systems are engineered to navigate complex, multi-step semantic code paths across core C/C++ libraries, runtimes, and hypervisors. By synthesizing fuzzing harnesses, modeling memory states, and chaining obscure edge-case logic, AI models excel at identifying memory corruption (buffer overflows, use-after-free) and logic bypasses that consistently elude traditional static</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> analyzers</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">While currently an early indicator rather than an established trend, confirmed exploitation of AI-discovered vulnerabilities demonstrates that increased risk from AI-discovered flaws is not purely theoretical.</span></p>\n<p><span style=\"vertical-align: baseline;\">A notable case is </span><a href=\"https://www.hacktron.ai/blog/cve-2026-1731-beyondtrust-remote-support-rce\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-1731</span></a><span style=\"vertical-align: baseline;\">, an unauthenticated OS command injection flaw in BeyondTrust Privileged Remote Access (PRA) and Remote Support that was discovered autonomously by a third-party research agent (Hacktron AI). Following public disclosure, GTIG observed threat actors weaponize this vulnerability in targeted initial-access campaigns to bypass enterprise perimeters. More specifically, within four days of public disclosure, GTIG observed a threat cluster exploiting this vulnerability, followed by five additional threat clusters within seven days of public disclosure. GTIG observed these threat actors collectively conduct a variety of post-exploitation activities, including privilege escalation, data exfiltration, and dropping secondary payloads including SNOWLIGHT, SPARKRAT, and cryptominers. This operational collision highlights that defensive AI agents are uncovering high-impact vulnerabilities that threat actors actively seek to exploit.</span></p>\n<h3><span style=\"vertical-align: baseline;\">AI as the Hunted: Vulnerabilities Targeting the AI/LLM Operational Stack</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Architectural Breakdown of AI Stack Vulnerabilities</span></h4>\n<p><span style=\"vertical-align: baseline;\">As enterprise adoption of generative AI accelerates, security research and adversary interest have also focused on vulnerabilities in the underlying AI operational stack. Across the January 2025–August 2026 monitoring window, GTIG tracked 2,076 cumulative AI-related CVE disclosures, with over 1,500 vulnerabilities identified from January 2026 to August 2026 alone across eight core architectural layers:</span></p></div>\n<div class=\"block-paragraph_advanced\"><div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Layer / Architectural Category</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Key Technologies &amp; Frameworks</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Primary Vulnerability Vectors</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">2026</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AI Orchestration &amp; Agent Frameworks</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Flowise, Langflow, LangChain, Dify, LlamaIndex, AutoGen, CrewAI, Semantic Kernel, Letta, MCP, Pydantic-AI</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Arbitrary Code Execution (RCE) &amp; Command Injection via untrusted workflow serialization, insecure Python tool calling, and Server-Side Template Injection (SSTI).</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">782</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AI Web Apps &amp; Portals</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Open-WebUI, AnythingLLM, FastGPT, LibreChat, RAGFlow, Gradio, Streamlit, LobeChat, Chainlit, GPT4All</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Server-Side Request Forgery (SSRF) via chat proxying, Stored XSS in markdown rendering, and local file inclusion (LFI) via document upload handlers.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">230</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Inference &amp; Serving Infrastructure</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">vLLM, Ollama, LiteLLM, Llama.cpp, Triton (NVIDIA), Ray, TGI, SGLang, TensorRT-LLM, BentoML, LocalAI</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Unauthenticated Administrative APIs, model checkpoint deserialization, memory corruption in tensor backends, and multi-tenant resource exhaustion.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">212</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Model Security Advisories</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Foundation Model Weights, System Prompts, Guardrails, Evaluators (Garak, Lakera, Promptfoo)</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Direct &amp; Indirect Prompt Injection, system prompt exfiltration, guardrail bypasses, training data poisoning, and excessive agent autonomy.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">106</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ML Frameworks &amp; Hubs</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">PyTorch, Hugging Face (Hub/Datasets), Transformers, ONNX Runtime, TensorFlow, Diffusers, DeepSpeed, Safetensors, Keras</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Memory safety violations (heap overflows, out-of-bounds reads in C++ tensor operators) and arbitrary file overwrites via malicious model/dataset archive extraction.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">99</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Frontier Models</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Anthropic, Gemini, OpenAI</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Arbitrary Code Execution (RCE) and Command Injection via unvalidated CLI shell interpolation and implicit execution of untrusted workspace configs, Sandbox Escape via Git worktree directory confusion and memory tool symlink traversal; and Covert Data Exfiltration via indirect prompt injection-induced Markdown image rendering and permissive network fetch allowlists.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">97</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">MLOps &amp; Experiment Tracking</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">MLflow, ClearML, Weights &amp; Biases (W&amp;B), Kubeflow, Langfuse, Langsmith, Arize, Phoenix, Helicone</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Arbitrary File Overwrites (LFI/RFI), unauthenticated remote tracking server takeovers, and artifact deletion in shared experiment registries.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">39</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Vector Databases &amp; Search</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Milvus, Qdrant, ChromaDB, Weaviate, Pinecone, FAISS, LanceDB, PGVector, Marqo, Vespa</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Unauthenticated collection manipulation, Remote Code Execution via clustering/indexing plugins, and metadata SQL/JSON query injection.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: right;\"><span style=\"vertical-align: baseline;\">19</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Table 2: Break down of vulnerabilities targeting AI systems (Source: GTIG)</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Emerging Battlegrounds: Orchestration &amp; Inference</span></h3>\n<p><span style=\"vertical-align: baseline;\">From January 2026 through August 2026, disclosures of AI application vulnerabilities were heavily concentrated in three core areas: agent orchestration frameworks, backend serving infrastructure, and enterprise AI gateways:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agent Orchestration as the Primary Chokepoint</strong><span style=\"vertical-align: baseline;\">: Orchestration middleware accounts for 50% of all AI-related flaws, experiencing a +347% surge in disclosures in 2026. Visual workflow builders (e.g., Flowise, Langflow) and autonomous frameworks often deploy dynamic code execution nodes to facilitate environment interaction. Attackers exploit these nodes via prompt injection or crafted workflow JSONs to hijack execution loops, turning natural language prompts into unauthenticated Remote Code Execution.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Centralized AI Gateways and Lateral Cloud Movement</strong><span style=\"vertical-align: baseline;\">: Enterprise AI gateways represent a catastrophic dual-threat vector. At the application layer, compromised gateways expose third-party application programming interface (API) keys and private prompt streams containing personally identifiable information (PII) or proprietary source code. At the infrastructure layer, they act as initial footholds for adversaries to harvest database credentials and pivot laterally into internal cloud environments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inference Gateways as the New Perimeter</strong><span style=\"vertical-align: baseline;\">: Disclosures across backend serving infrastructure (e.g., vLLM, Triton, LiteLLM, Ollama) reached 212 vulnerabilities in 2026. Nearly a quarter (24%) of these flaws stem directly from unauthenticated API endpoints or Server-Side Request Forgery (SSRF), providing remote adversaries with direct entry points to bypass perimeter firewalls, exhaust expensive GPU compute resources, or extract proprietary model checkpoints.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Active In-the-Wild Exploitation of AI Middleware</span></h3>\n<p><span style=\"vertical-align: baseline;\">While zero-day exploitation of AI infrastructure has not yet been observed, threat actors are actively weaponizing newly disclosed vulnerabilities in exposed middleware. However, out of 2,076 cumulative disclosures, only a handful of vulnerabilities have been confirmed as exploited in-the-wild. Among the examples, we identified several that we rated High Threat Risk and provide unauthenticated RCE, command injection, or arbitrary file writes:<br /></span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://labs.cloudsecurityalliance.org/research/csa-research-note-litellm-cve-2026-42271-ai-gateway-exploita/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-42271 (BerriAI LiteLLM)</strong></a><span style=\"vertical-align: baseline;\">: Command injection in Model Context Protocol (MCP) server preview endpoints (</span><code style=\"vertical-align: baseline;\">POST /mcp-rest/test/connection</code><span style=\"vertical-align: baseline;\">), resulting in host takeover and API credential theft.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://labs.cloudsecurityalliance.org/research/csa-research-note-langflow-cve-2026-5027-active-exploitation/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-5027 (Langflow)</strong></a><span style=\"vertical-align: baseline;\">: Path traversal file write in the </span><code style=\"vertical-align: baseline;\">POST /api/v2/files</code><span style=\"vertical-align: baseline;\"> upload handler, allowing remote threat actors to drop unauthorized files (e.g., cron jobs, Secure Shell (SSH) keys) onto the host.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.cisa.gov/news-events/alerts/2025/05/05/cisa-adds-one-known-exploited-vulnerability-catalog\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2025-3248 (Langflow)</strong></a><span style=\"vertical-align: baseline;\">: Unauthenticated Python code injection via </span><code style=\"vertical-align: baseline;\">exec()</code><span style=\"vertical-align: baseline;\"> in </span><code style=\"vertical-align: baseline;\">/api/v1/validate/code</code><span style=\"vertical-align: baseline;\">, permitting immediate RCE.</span></p>\n</li>\n</ol></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Outlook</span></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG expects that rates of vulnerability discovery and exploitation are likely to continue to increase in the short to medium term. In other research, such as our </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access\"><span style=\"text-decoration: underline; vertical-align: baseline;\">May AI Threat Tracker</span></a><span style=\"vertical-align: baseline;\">, we reported the first known case of a threat actor in possession of a zero-day exploit script developed with generative AI. While intercepted during operational planning before in-the-wild execution, analysis of the exploit's structural artifacts revealed high-confidence LLM generation markers. In our </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">September AI Threat Tracker</span></a><span style=\"vertical-align: baseline;\">, we further noted threat actors sharing resources and prototyping agentic vulnerability discovery tooling.</span></p>\n<p><span style=\"vertical-align: baseline;\">We are still in the early days of publicly available data on both AI-augmented vulnerability discovery and vulnerabilities targeting AI infrastructure and technologies. Nonetheless, we can see emerging signals that AI is contributing to vulnerability discovery. When directed at critical attack surfaces, autonomous research agents demonstrate a formidable capacity to uncover high-severity flaws. By reasoning through complex semantic code paths and synthesizing dynamic proof harnesses, agentic workflows excel at identifying memory corruption and logic bypasses in core libraries and runtimes, surfacing the exact types of flaws that sophisticated adversaries actively seek to exploit.</span></p>\n<p><span style=\"vertical-align: baseline;\">As threat actors begin to exploit vulnerabilities in AI systems in the wild, organizations cannot afford to treat AI security as an afterthought. Securing this landscape demands immediate containment strategies, sandboxing autonomous agentic workloads, and implementing risk-based vulnerability management to defend the new perimeter.</span></p>\n<p><span style=\"vertical-align: baseline;\">At this moment, the cybersecurity community has a window of opportunity to bolster defenses on two fronts before threat actors are able to scale up zero-day and n-day exploitation. First, organizations must modernize how they triage and remediate disclosed vulnerabilities. In a </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/ai-assisted-vulnerability-management\"><span style=\"text-decoration: underline; vertical-align: baseline;\">separate blog post</span></a><span style=\"vertical-align: baseline;\">, Mandiant laid out a blueprint for implementing AI-Assisted Vulnerability Management to help defenders counter compressed adversary timelines. Second, organizations that provide software or services to other enterprises and consumers, should proactively run AI-enhanced code review internally to identify and fix flaws before they are shipped to production and become exploitable vulnerabilities. Leveraging agentic defensive capabilities, such as </span><a href=\"https://cloud.google.com/security/codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\">, integrated into </span><a href=\"https://cloud.google.com/security/ai-threat-defense\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Threat Defense</span></a><span style=\"vertical-align: baseline;\">, to continuously audit and patch code across developer workflows will be vital. If pre-release AI code review becomes standard best practice, the rate of growth in public vulnerability disclosures could eventually slow.</span></p></div>"
  "a8fd2fb9155ea89431a84dd0492eb117":
    "id": "a8fd2fb9155ea89431a84dd0492eb117"
    "title": "Data Agent Kit is now GA: Bring Google Data Cloud to any coding agent"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent/"
    "published": "2026-09-30 22:00:00"
    "fetched": "2026-10-01 00:38:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, </span><a href=\"https://cloud.google.com/products/data-agent-kit?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> is generally available. Data Agent Kit is a free set of Model Context Protocol (MCP) tools and agent skills that lets the coding agent you already use work directly with your Google Cloud data products, whether you're using Antigravity, Claude Code, Codex, or other popular tools.</span></p>\n<p><span style=\"vertical-align: baseline;\">With GA, we are adding support for </span><a href=\"https://cloud.google.com/bigquery/docs/graph-overview?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/bigtable?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/dataproc-serverless/docs/overview?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> access to your open Lakehouse, along with dozens of quality-of-life improvements that make everyday work faster and smoother.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"00-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent-dak-promo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/00-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent-da.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">What is Data Agent Kit?</span></h2>\n<p><span style=\"vertical-align: baseline;\">Coding agents have become remarkably good at writing SQL, PySpark, and pipeline code. What they don't have by default is context about your environment: which tables exist, how they're partitioned, which ones your team trusts, or why last night's job failed. Without that, even a strong agent has to work from assumptions, and you end up pasting schemas and error logs into the chat to fill in the gaps.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit fills that gap with two things:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">MCP tools:</strong><span style=\"vertical-align: baseline;\"> Connections to more than 15 Google Data Cloud services, so your agent can inspect schemas, run queries, read job logs, and manage resources in your live environment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google-authored skills:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open-source instructions</span></a><span style=\"vertical-align: baseline;\"> from Google Cloud engineers that teach your agent data best practices, like optimizing BigQuery SQL, designing Bigtable row keys, and building dbt (</span><a href=\"https://www.getdbt.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">data build tool</span></a><span style=\"vertical-align: baseline;\">) pipelines.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">You can use Data Agent Kit wherever you already work: as an IDE extension for VS Code, Antigravity IDE, Cursor, and other VS Code-compatible editors; as a plugin for Antigravity 2.0, Antigravity CLI, Claude Code, and Codex; or in </span><a href=\"https://cloud.google.com/shell?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Shell</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/workstations?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Workstations</span></a><span style=\"vertical-align: baseline;\">, where it comes pre-installed. The IDE extension also brings a lightweight version of the Google Cloud console into your editor, so you can browse data, run queries, and review your agent's work without switching windows.</span></p>\n<h2><span style=\"vertical-align: baseline;\">How it works</span></h2>\n<p><span style=\"vertical-align: baseline;\">Say you ask your agent, \"Forecast next month's demand for our top-selling products and check whether we have enough inventory to meet it.\" Data Agent Kit loads the relevant skills, so the agent follows Google's best practices for the task. It searches </span><a href=\"https://cloud.google.com/dataplex/docs/introduction?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> to find the sales and inventory tables your team trusts. It then uses MCP tools to run a forecast in </span><a href=\"https://cloud.google.com/bigquery?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">, check current stock levels in AlloyDB for PostgreSQL, and bring the combined answer back to your editor or terminal. Every step runs with your own IAM permissions.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"01-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_how_it_works\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/01-data-agent-kit-is-now-ga-bring-google-d.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>How Data Agent Kit connects to data.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">What you can build</span></h2>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit covers analytics, operational databases, the Lakehouse, and pipelines. Here's what that looks like in practice, starting with what's new at GA.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Analytics and graph: BigQuery and BigQuery Graph (New in GA)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Graphs are a natural way to explore relationships, like which products people buy together or how suppliers connect to your inventory. Building one usually means hand-writing </span><code style=\"vertical-align: baseline;\">CREATE PROPERTY GRAPH</code><span style=\"vertical-align: baseline;\"> DDL, learning GQL, and working out which keys actually form edges.</span></p>\n<p><span style=\"vertical-align: baseline;\">Instead, you describe the graph you want and your agent builds it. The </span><code style=\"vertical-align: baseline;\">bigquery-graph-author</code><span style=\"vertical-align: baseline;\"> skill maps your tables to nodes and edges, checks each proposed relationship against the actual data, and shows you a plan to approve before creating anything. It can even start from an ER diagram or data model you already have. The </span><code style=\"vertical-align: baseline;\">bigquery-graph-query</code><span style=\"vertical-align: baseline;\"> skill then writes the GQL, and the graph visualizer in the IDE lets you click through the results.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"02-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_bqgraph\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/02-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_bq.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Building and visualizing a BigQuery property graph.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Operational and real-time databases: Spanner, AlloyDB, Cloud SQL, and Bigtable (New in GA)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Some features have to load instantly, like a personalized feed, a live counter, or a \"recently viewed\" rail on your storefront. Bigtable is built for exactly that, and it rewards a well-designed row key.</span></p>\n<p><span style=\"vertical-align: baseline;\">With GA, Bigtable joins </span><a href=\"https://cloud.google.com/spanner?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/alloydb?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/sql?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\"> as a fully supported database in Data Agent Kit. The new </span><code style=\"vertical-align: baseline;\">bigtable-basics</code><span style=\"vertical-align: baseline;\"> skill designs your schema around how the data will be read and flags hotspots and full table scans before you create anything. Your agent can then create the table and query it with GoogleSQL, with column families flattened into readable columns. In the IDE, you can browse Bigtable instances and tables in the catalog explorer and run queries from the SQL editor.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"03-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_bigtable\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/03-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_bi.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Agent-guided Bigtable schema design and querying.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Lakehouse and Spark: Managed Service for Apache Spark and Lakehouse for Apache Iceberg (New in GA)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Your agent could already query the Apache Iceberg tables in your Lakehouse through BigQuery. Now it can also work with those same tables using serverless Spark on </span><a href=\"https://cloud.google.com/dataproc-serverless/docs/overview?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\">, with no cluster to manage. Each session keeps its state, so temporary views carry across statements, and you get Iceberg's full feature set, including branching, time travel, and schema evolution.</span></p>\n<p><span style=\"vertical-align: baseline;\">Your tables don't all have to live on Google Cloud, either. The </span><code style=\"vertical-align: baseline;\">federate-lakehouse-catalog</code><span style=\"vertical-align: baseline;\"> skill connects your Lakehouse to AWS Glue and Databricks Unity Catalog, so your agent can query that data in place without building an ingestion pipeline first.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"04-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_lakehouse\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/04-data-agent-kit-is-now-ga-bring-google-d.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Branching and querying Iceberg tables with Managed Service for Apache Spark.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Pipelines and orchestration: dbt, Dataform, and Managed Service for Apache Airflow</span></h3>\n<p><span style=\"vertical-align: baseline;\">Once your logic works, your agent can turn it into a pipeline that runs on its own. It writes dbt or </span><a href=\"https://cloud.google.com/dataform?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataform</span></a><span style=\"vertical-align: baseline;\"> models, then the </span><code style=\"vertical-align: baseline;\">gcp-pipeline-orchestration</code><span style=\"vertical-align: baseline;\"> skill schedules them together with your notebooks as an Orchestration Pipeline on </span><a href=\"https://cloud.google.com/composer?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Airflow</span></a><span style=\"vertical-align: baseline;\">. Pipelines can also include Gemini Enterprise Agent Platform steps, like uploading a model or running batch inference.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the IDE, you can follow each run on a visual pipeline canvas. If a task needs attention, click </span><strong style=\"vertical-align: baseline;\">Diagnose</strong><span style=\"vertical-align: baseline;\"> to hand its logs to your agent. Troubleshooting skills for Airflow and Spark trace the root cause and propose a fix for you to approve.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"05-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_pipelines\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/05-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_pi.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Troubleshooting a failed Airflow DAG with an agent.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Improving the developer experience</span></h2>\n<p><span style=\"vertical-align: baseline;\">GA also streamlines setup and day-to-day workflows. When you get started, you simply sign in once and select the Google Cloud services you use. Data Agent Kit automatically enables the required APIs, installs the matching skills, and configures your MCP servers with no manual setup files. Inside the IDE, the SQL editor and notebooks now support inline code generation, </span><code style=\"vertical-align: baseline;\">@</code><span style=\"vertical-align: baseline;\"> references to tables, and diff views for suggested changes. The extension also shares your active project, open file, and the error from the query you just ran with your agent, so asking it to \"fix this query\" just works.</span></p>\n<p><span style=\"vertical-align: baseline;\">We also made the core tools faster and more responsive. New Spark notebooks automatically create and select a Spark Connect runtime, and Spark SQL queries in the editor run in isolated sessions with built-in execution metrics. </span><span style=\"vertical-align: baseline;\">The catalog explorer now loads faster and includes BigQuery public datasets in the sidebar. Tuned notebook skills help your agent finish notebook tasks more quickly while using fewer tokens. </span></p>\n<h2><span style=\"vertical-align: baseline;\">Ready for the enterprise</span></h2>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit is included at no additional cost; you pay standard pricing only for the Google Cloud services your agent uses. Skills also steer the agent toward cost-aware query patterns, like checking partition keys and running a dry run before executing a BigQuery query to avoid accidental full-table scans. And because the skills are open source on GitHub, your team can audit them, fork them, or write custom skills for your own internal standards.</span></p>\n<p><span style=\"vertical-align: baseline;\">For access control, the agent connects as you or as a service account you impersonate, so row- and column-level security policies apply automatically. Admins can also govern MCP access with Identity and Access Management (IAM), screen MCP traffic with </span><a href=\"https://cloud.google.com/security-command-center/docs/model-armor-overview?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</span></a><span style=\"vertical-align: baseline;\">, and scope agents with </span><a href=\"https://cloud.google.com/vpc-service-controls?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC Service Controls</span></a><span style=\"vertical-align: baseline;\"> and Principal Access Boundary policies.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Install and get started</span></h2>\n<p><span style=\"vertical-align: baseline;\">You can set up Data Agent Kit in under a minute in either your IDE or your terminal.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Option 1: Install the IDE Extension</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">IDE extension:</strong><span style=\"vertical-align: baseline;\"> Search for \"Google Cloud Data Agent Kit\" in the Extensions panel of VS Code, Antigravity IDE, Cursor, or any VS Code-compatible editor. You can also install it from the </span><a href=\"https://marketplace.visualstudio.com/items?itemName=googlecloudtools.datacloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VS Code Marketplace</span></a><span style=\"vertical-align: baseline;\"> or </span><a href=\"https://open-vsx.org/extension/googlecloudtools/datacloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open VSX</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Antigravity 2.0:</strong><span style=\"vertical-align: baseline;\"> Go to </span><strong style=\"vertical-align: baseline;\">Settings &gt; Customizations &gt; Build with Google Plugins</strong><span style=\"vertical-align: baseline;\">, then download Data Agent Kit.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Shell and Cloud Workstations:</strong><span style=\"vertical-align: baseline;\"> Already installed by default; just open the editor and sign in.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Option 2: Install the CLI Plugin</span></h3>\n<p><span style=\"vertical-align: baseline;\">Run the command for your preferred coding agent using the official </span><a href=\"https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">GoogleCloudPlatform/data-agent-kit-plugin</code></a><span style=\"vertical-align: baseline;\"> repository:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Antigravity CLI\\r\\nagy plugin install https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\\r\\n\\r\\n# Claude Code\\r\\nclaude plugin install data-agent-kit-starter-pack@claude-plugins-official\\r\\n\\r\\n# Codex CLI\\r\\ncodex plugin marketplace add GoogleCloudPlatform/data-agent-kit-plugin\\r\\ncodex plugin add dak@dak-marketplace&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f52828b7bd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Then try a first prompt:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;What are this week&#x27;s fastest rising search terms in the US that weren&#x27;t in the last week&#x27;s top 10? Use the BigQuery public Google Trends dataset.&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f52829ad490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"06-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_cli\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/06-data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent_cl.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Data Agent Kit plugin running in Claude Code.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Next steps &amp; hands-on resources</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read the docs:</strong><span style=\"vertical-align: baseline;\"> Explore the </span><a href=\"https://docs.cloud.google.com/data-agent-kit?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit documentation</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/products/data-agent-kit?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">product overview page</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the skills:</strong><span style=\"vertical-align: baseline;\"> Browse, star, and contribute on </span><a href=\"https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build an analytics workflow:</strong><span style=\"vertical-align: baseline;\"> Try the </span><a href=\"https://codelabs.developers.google.com/dak-analytics-eng-antigravity-ide?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Analytics with Data Agent Kit and Antigravity IDE</span></a><span style=\"vertical-align: baseline;\"> codelab, and read the companion blog, </span><a href=\"https://cloud.google.com/blog/products/data-analytics/agentic-analytics-with-the-data-agent-kit?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic analytics with the Data Agent Kit</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a data science pipeline:</strong><span style=\"vertical-align: baseline;\"> Try the </span><a href=\"https://codelabs.developers.google.com/dak-data-science-antigravity-ide?utm_campaign=CDR_0xaea1deef_default_b566338695&amp;utm_medium=external&amp;utm_source=blog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Fraud detection pipeline with Data Agent Kit and Antigravity IDE</span></a><span style=\"vertical-align: baseline;\"> codelab.</span></p>\n</li>\n</ul></div>"
