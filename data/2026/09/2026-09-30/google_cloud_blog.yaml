  "ec925202cdd2865851a350009f18c87a":
    "id": "ec925202cdd2865851a350009f18c87a"
    "title": "Accelerating agentic RL and evaluation research velocity with 45x faster GKE Agent Sandbox"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/accelerate-agentic-rl-with-gke-agent-sandbox/"
    "published": "2026-09-30 02:00:00"
    "fetched": "2026-09-30 02:40:43"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When scaling up agentic reinforcement learning (RL) and evaluation across massive parallel rollouts, frontier AI labs inevitably hit a bottleneck: Expensive GPU clusters sit idle, waiting minutes for CPU sandbox cold-starts, plus thousands of multi-gigabyte </span><a href=\"https://www.swebench.com/original.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SWE-bench</span></a><span style=\"vertical-align: baseline;\">-style image pulls and scheduling backlogs. It’s a sandbox infrastructure problem that silently slows down your research and burns your training budget.</span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this fundamental infrastructure bottleneck, </span><strong style=\"vertical-align: baseline;\">today we are introducing</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</strong></a><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">optimized for RL</strong><span style=\"vertical-align: baseline;\"> along with the </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/agent-sandbox-rl\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox RL orchestration SDK</strong></a><span style=\"vertical-align: baseline;\">, plus native </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">integrations</span></a><span style=\"vertical-align: baseline;\"> for popular RL gyms and harnesses, now generally available.</span></p>\n<p><span style=\"vertical-align: baseline;\">As the operating system for modern AI, Kubernetes has evolved to power massive GPU/TPU training clusters and distributed inference. Now Kubernetes is expanding to drive the next AI compute frontier: agents. But unlike static workloads, agentic workloads evolve rapidly, so infrastructure must evolve just as fast. Rather than guessing at what RL researchers needed, </span><strong style=\"vertical-align: baseline;\">we placed Kubernetes itself on an</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">auto-research and verification loop driven by performance benchmarks and evaluations</strong><span style=\"vertical-align: baseline;\">. We used heavy agentic benchmarks like </span><a href=\"https://www.swebench.com/verified.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SWE-bench</span></a><span style=\"vertical-align: baseline;\"> to intentionally stress-test and break our own clusters. Every bottleneck that surfaced — from etcd timeouts to GPU idle spikes — was fed back into our development cycle to refine GKE’s core primitives.</span></p>\n<p><span style=\"vertical-align: baseline;\">This resulted in a purpose-built sandbox layer for agentic RL and eval workloads that features:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">10x - 45x faster time-to-first-command:</strong><span style=\"vertical-align: baseline;\"> GKE can spin up a sandbox environment in 1–9 seconds instead of 45–85 seconds, keeping your expensive GPUs fully in use.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Reduced tail latency: </strong><span style=\"vertical-align: baseline;\">We reduced the worst-case sandbox wait times from 7.5 minutes down to under 10 seconds.</span></li>\n<li><strong style=\"vertical-align: baseline;\">3x less control-plane churn:</strong><span style=\"vertical-align: baseline;\"> Each RL training step triggers a rollout burst, where thousands of sandboxes are requested at once. The SDK has an in-place recycling strategy that reuses pods across rollouts instead of deleting and re-creating them. That means 3x fewer pods being created, which keeps the Kubernetes API server stable under the churn.</span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">With this new primitive, AI labs and agent-native startups can now reliably run large scale agentic RL trajectories and evals simultaneously, minimizing accelerator idle time and drastically accelerating their research velocity.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The real-world challenges of agentic RL infrastructure</span></h3>\n<p><span style=\"vertical-align: baseline;\">Before we talk about the solution, let’s be precise about what makes agentic RL so demanding for infrastructure in the first place. In a standard agentic RL loop, an LLM policy generates actions like code snippets on GPUs and executes them inside isolated CPU sandboxes to observe a reward signal. However, when scaling up this loop to support tens of thousands of parallel rollouts, three critical infrastructure bottlenecks emerge:</span></p>\n<ol>\n<li><strong style=\"vertical-align: baseline;\">Accelerator idle costs, i.e., time-to-first-command (TTFC) and the tail latency trap:</strong><span style=\"vertical-align: baseline;\"> Agentic RL is a batch workload, and in a synchronous RL step, training cannot proceed until the slowest sandbox in the batch is ready. If standing up CPU sandboxes takes minutes to provision, pull images, and execute initial startup scripts, expensive accelerator capacity sits wasted.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Massive image cardinality:</strong><span style=\"vertical-align: baseline;\"> Standard container caching assumes a handful of static base images. However, in agentic RL, every single task (like thousands of GitHub repositories in SWE-bench or </span><a href=\"https://huggingface.co/datasets/R2E-Gym/R2E-Gym-Subset\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">R2E-Gym</span></a><span style=\"vertical-align: baseline;\">) often requires a completely distinct OCI container image. Managing thousands of unique, large images per run can lead to severe image-pulling bottlenecks and storage friction.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Control-plane saturation:</strong><span style=\"vertical-align: baseline;\"> As a bursty batch workload, agentic RL typically executes batch-size image tasks and multiple rollouts per task (e.g. 4, 8, 16 rollouts per task), pushing an already large number of images to the extreme. For instance, one public dataset we tested against has 4,578 </span><a href=\"https://huggingface.co/R2E-Gym/datasets\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">R2E</span></a><span style=\"vertical-align: baseline;\"> images. Assuming four rollouts per image, that means 18,312 tasks, which require 18,312 sandboxes simultaneously. Standard Kubernetes control planes degrade significantly under these burst loads. Churning tens of thousands of ephemeral pods per minute creates API-server queue bottlenecks, pod state errors and triggers false node-health evictions.</span></li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">These are not hypothetical problems. They are the daily reality for frontier AI labs training state-of-the-art agents. </span></p>\n<h3><span style=\"vertical-align: baseline;\">GKE Agent Sandbox optimized for RL</span></h3>\n<p><span style=\"vertical-align: baseline;\">To fan-out the code execution sandboxes, we set up a relatively modest cluster — a 10-node gVisor sandbox pool with GKE image streaming enabled, the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> controller, and an in-cluster </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/agent-sandbox-rl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SDK</span></a><span style=\"vertical-align: baseline;\"> driver to claim warm pods. We tested various strategies and setups including a large number of images and high cardinality.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_0wDJijd.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">The infrastructure layer</span></h4>\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> is the open Kubernetes primitive for secure agent execution, featuring built-in SandboxWarmPool capabilities that eliminate cold-start overhead by maintaining pre-initialized, healthy environments. By integrating SandboxWarmPool with </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/image-streaming\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Image Streaming</span></a><span style=\"vertical-align: baseline;\">, we effectively support RL and eval workloads that demand high image cardinality — even with thousands of large images (&gt;1.2GB), while delivering the exceptionally low TTFC required for responsive agentic training. Its </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox-pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">snapshot, suspend and resume</span></a><span style=\"vertical-align: baseline;\"> capabilities support checkpointing for error recovery, and sandbox forking for parallel agent branching logic to explore multiple trails.</span></p>\n<p><span style=\"vertical-align: baseline;\">This GKE primitive is already powering the agentic RL training infrastructure at Mistral AI, a frontier AI lab:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“To push the boundaries of reinforcement learning, you need infrastructure that can instantly scale to handle unpredictable demand. By leveraging GKE's high-performance Agent Sandbox for RL, we can seamlessly orchestrate hundreds of thousands of secure environments across clusters and handle spikes of over 30,000 sandboxes on a single cluster. It provides the reliable foundation we need to accelerate our model training and iteration cycles.” -</span><span style=\"vertical-align: baseline;\"> Jean-Malo Delignon, Research Engineer, Mistral AI</span></p>\n<h4><span style=\"vertical-align: baseline;\">Orchestration SDK and RL tool integrations</span></h4>\n<p><span style=\"vertical-align: baseline;\">To help researchers harness this power without writing Kubernetes YAML or embedding custom daemons into container images, we built the </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/agent-sandbox-rl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox RL orchestration SDK</span></a><span style=\"vertical-align: baseline;\">. It exposes a clean, async Python API with pluggable warm-pooling strategies tailored to your specific evaluation or RL training pattern. </span><span style=\"vertical-align: baseline;\">We also built native </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">integrations</span></a><span style=\"vertical-align: baseline;\"> for RL tools like </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations/gymnasium\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gymnasium</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations/nemo-gym\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA NeMo Gym</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations/openhands\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenHands</span></a><span style=\"vertical-align: baseline;\">, with more to come.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Benchmarks: Reducing idle accelerator waste</span></h3>\n<p><span style=\"vertical-align: baseline;\">We ran this on a 10-node gVisor sandbox pool against two workloads: a 500-image </span><a href=\"https://www.swebench.com/verified.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SWE-bench</span></a><span style=\"vertical-align: baseline;\"> environment, and a harsher 4,578-image </span><a href=\"https://huggingface.co/R2E-Gym/datasets\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">R2E</span></a><span style=\"vertical-align: baseline;\"> corpus that does not fit in local disk.</span></p>\n<p><strong style=\"vertical-align: baseline;\">1.TTFC and tail latency: 10x–45x faster<br /><br /></strong></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Core metric</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Why it matters</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Raw K8s pod baseline</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Agent Sandbox SDK</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Benchmark gains</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">TTFC, average</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Determines GPU idle time</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">44s – 85s (average)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1.1s – 8.8s (average)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">10x faster</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Tail latency — max TTFC (worst case)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">The bottleneck for the batch</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">7.5 mins (450 seconds)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Strictly under 10 seconds</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">45x faster</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Concurrency ranged from 500 simultaneous tasks and sandboxes up to 18,312 (4,578 R2E images × 4 rollouts). The gain held across every setup.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_Q9hhUIh.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">How we got here.</strong><span style=\"vertical-align: baseline;\"> We instrumented the controller, the SDK, and the RL fleet, then ran hundreds of comparison runs against that fixed 10-node budget. Two changes produced nearly all of the gain:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Image hydration moved off the critical path.</strong><span style=\"vertical-align: baseline;\"> A high-cardinality corpus far exceeds local disk, so pulling cold images mid-training creates I/O contention and multi-minute tails. The SDK plans image placement across nodes, and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/image-streaming\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Image Streaming</span></a><span style=\"vertical-align: baseline;\"> plus upfront warm-pooling handle the rest — hydration finishes before the rollout ever asks for it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The control plane is paced.</strong><span style=\"vertical-align: baseline;\"> High-concurrency rollouts trigger API-server thundering herds. </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/releases/tag/v1.0.0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox Controller v1.0.0</span></a><span style=\"vertical-align: baseline;\"> adds rate controls that bound how fast warm pools refill, keeping etcd and the API server stable through the burst.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The tuning knobs, the benchmark harness, and the load tests behind these numbers all ship in the </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/agent-sandbox-rl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agent-sandbox-rl</span></a><span style=\"vertical-align: baseline;\"> example, which emits human-readable and JSON reports so you can reproduce the comparison on your own cluster.</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. 3x less control-plane and pod lifecycle churn during multi-trajectory rollouts<br /><br /></strong></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong><span style=\"vertical-align: baseline;\">Core metric</span></strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Why it matters</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Raw K8s pod baseline</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">GKE Agent Sandbox SDK</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Benchmark gains</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Control-plane churn</strong><span style=\"vertical-align: baseline;\"> (4,578 images × 4 rollouts run)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Control-plane saturation</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">18,312</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">5,869</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">3.1x less churn</strong></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Raw Kubernetes recreates a pod for every trajectory step. At 18,312 tasks that inflates scheduling overhead, wastes disk I/O, and — in our large-scale tests — triggered unbounded garbage-collection loops. The SDK's in-place </span><code style=\"vertical-align: baseline;\">recycle</code><span style=\"vertical-align: baseline;\"> strategy keeps the pod alive instead, running an in-pod </span><code style=\"vertical-align: baseline;\">git reset</code><span style=\"vertical-align: baseline;\"> and repository checkout between rollout episodes. Pod creations drop 3.1x and the control plane stays flat through the burst.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The trade-off</span></h3>\n<p><span style=\"vertical-align: baseline;\">Warming environments up front spends inexpensive CPU and background cluster time so that image streaming and readiness checks never land on the critical path. For an RL fleet that’s a straightforward trade: Accelerator idle time is the expensive resource, and this approach eliminates it.</span></p>\n<p><span style=\"vertical-align: baseline;\">One detail matters at training scale: The SDK counts and surfaces every failed sandbox as retriable rather than silently dropping it. An untracked drop is not just a lost rollout — it is reward bias.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Build today:</strong><span style=\"vertical-align: baseline;\"> Explore the </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox repository</span></a><span style=\"vertical-align: baseline;\"> or the </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/examples/agent-sandbox-rl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox RL repository</span></a><span style=\"vertical-align: baseline;\"> for the Python SDK and native </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">integrations</span></a><span style=\"vertical-align: baseline;\"> for RL tools including </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations/gymnasium\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gymnasium</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations/nemo-gym\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA NeMo Gym</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://github.com/kubernetes-sigs/agent-sandbox/tree/main/clients/integrations/openhands\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenHands</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Push accelerator utilization further:</strong><span style=\"vertical-align: baseline;\"> Explore the </span><a href=\"https://github.com/llm-d-incubation/llm-d-rl-time-slicing/tree/main\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d co-operative time-slicing repository</span></a><span style=\"vertical-align: baseline;\"> and its </span><a href=\"https://github.com/llm-d-incubation/llm-d-rl-time-slicing/blob/main/guides/snapshot-agent/README.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Snapshot Agent guide</span></a><span style=\"vertical-align: baseline;\"> to dynamically interleave independent RL jobs onto shared physical hardware.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Learn more:</strong><span style=\"vertical-align: baseline;\"> Read the official documentation on deploying secure execution environments with </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/machine-learning/agent-sandbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\">.</span></li>\n</ul></div>"
