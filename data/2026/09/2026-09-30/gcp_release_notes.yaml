    "summary": "<h2 class=\"release-note-product-title\">Apigee API hub</h2>\n<h3>Feature</h3>\n<p><strong>AI performance and Tool performance dashboards in API insights</strong></p>\n<p>API insights in API hub now includes two dashboards for AI and agent traffic:</p>\n<ul>\n<li><strong>AI performance</strong> reports token usage and model latency for the large language models called through your gateways, with filters for model and provider.</li>\n<li><strong>Tool performance</strong> reports traffic, throughput, payload sizes, and latency for your Model Context Protocol (MCP) tools, with filters for MCP server, deployment, and tool name.</li>\n</ul>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/apigee/docs/apihub/api-insights-dashboard\">API insights dashboards</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Tasks</h2>\n<h3>Feature</h3>\n<p>Cloud Tasks support for the following is generally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>):</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/tasks/docs/configure-retry-task\">Set retry parameters when creating a task</a>\nand override the queue-level retry configuration for the task.</li>\n<li><a href=\"https://docs.cloud.google.com/tasks/docs/create-tasks#create-batch-tasks\">Create a batch of tasks</a>\nand add the batch to an existing queue.</li>\n<li><a href=\"https://docs.cloud.google.com/tasks/docs/manage-queues-and-tasks#delete-batch-tasks\">Delete a batch of tasks</a>\nfrom a queue.</li>\n</ul>\n<h2 class=\"release-note-product-title\">Datastream</h2>\n<h3>Feature</h3>\n<p>Datastream now supports partial backfill for SQL Server,\nSpanner, Oracle, PostgreSQL, and MySQL sources. Partial backfill lets\nyou load a specific subset of data from the source into the destination by\nproviding a SQL <code>WHERE</code> clause as a custom filter.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/datastream/docs/manage-backfill-for-the-objects-of-a-stream#initiatepartialbackfill\">Initiate partial\nbackfill</a>.</p>\n<h2 class=\"release-note-product-title\">VPC Service Controls</h2>\n<h3>Feature</h3>\n<p><strong>VPC Service Controls feature:</strong> Support for using Google Cloud folders and\norganizations as resources in ingress and egress rules is <a href=\"https://cloud.google.com/products#product-launch-stages\">generally\navailable</a>.</p>\n<p>With this update, you can create rules that allow access to and from the\nresources protected by service perimeters and bypass common resource size\nlimitations.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/ingress-egress-rules\">Ingress and egress rules</a>.</p>\n<h3>Feature</h3>\n<p><strong>VPC Service Controls feature</strong>: Folder membership support in\nVPC Service Controls service perimeters is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>.\nYou can configure Google Cloud folders as members in service perimeters to\nautomatically protect all projects and subfolders within that folder hierarchy.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/folder-membership\">Folder support in service perimeters</a>\nand\n<a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/configure-folder\">Configure folders in service perimeters</a>.</p>\n<h3>Feature</h3>\n<p><a href=\"https://cloud.google.com/products#product-launch-stages\">Preview stage</a> support for the following integration:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/supported-products#table_universal_ledger\">Universal Ledger</a></li>\n</ul>"
