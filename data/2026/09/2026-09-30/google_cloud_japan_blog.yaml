    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 25 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-3-8-live-with-live-avatar-is-now-generally-available?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">先週の Gemini 3.8 Live と Gemini 3.8 Live Extended Thinking の</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-gemini-3-8-live-extended-thinking/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">発表</span></a><span style=\"vertical-align: baseline;\">に続き、</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-with-live-avatar/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar</span></a><span style=\"vertical-align: baseline;\"> が </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> で一般提供されることになりました。Google Cloud Next 2026 で初めてプレビューされたこのテクノロジーは、企業の本番環境に正式に対応しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業の音声 AI が基本的な速度やコストの指標を超えて進化するにつれ、Google の優先事項は、各インタラクションの品質をさらに高めることに移っています。Gemini 3.8 Live は、ネイティブの音声間基盤により、流暢で応答性の高い会話を実現しています。Live Avatar 機能は、ウェブ、モバイル、インタラクティブ キオスクなどの会話型動画エージェントに、視覚的なインタラクションと確かな存在感をもたらします。これにより、以下の機能を利用できます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">動画アバター: </strong><span style=\"vertical-align: baseline;\">Live Avatar 機能を使用した会話型動画では、リップシンクが同期された動画アバターを生成できます。注: カスタム アバター機能は、許可リストに登録されている場合にのみ利用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">流暢な対話: </strong><span style=\"vertical-align: baseline;\">ネイティブな音声間対応により、会話の文脈やバックエンドの処理を途切れさせることなく、ユーザーからの割り込みにもより自然に対応できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ツール呼び出し: </strong><span style=\"vertical-align: baseline;\">会話を続けながら、バックグラウンドでツールと API 呼び出しを実行します。これにより、モデルはリクエストを認識し、バックグラウンドでタスクが完了するまでチャットを続けることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">言語の壁を打破: </strong><span style=\"vertical-align: baseline;\">Gemini 3.8 Live は 97 の言語を理解して話すことができ、言語の自動検出にも対応しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ユーザーの視界をエージェントと手軽に共有: </strong><span style=\"vertical-align: baseline;\">Live の視覚理解機能により、ライブカメラのフィードや画面共有を、音声と同時にすべてリアルタイムで処理できます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Gemini 3.8 Live Extended Thinking は限定公開プレビュー版のままですが、</span><strong style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar が利用可能になりました</strong><span style=\"vertical-align: baseline;\">。米国と EU のエンドポイントで提供され、プロビジョンド スループット、エンタープライズ コンプライアンス、厳格なデータ ガバナンスを備えています。</span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> でモデルとその機能をお試しいただき、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API</span></a><span style=\"vertical-align: baseline;\"> を使用して今すぐ構築を始めましょう。</span></p>\n<p><strong style=\"vertical-align: baseline;\">信頼と透明性を重視</strong></p>\n<p><span style=\"vertical-align: baseline;\">アイデンティティの保護と不正利用の防止のため、お客様は厳選された事前構築済みアバターのライブラリからデプロイできます。一方、カスタム アバターの作成には、厳格なエンタープライズ許可リストへの登録と身元確認プロセスが必要となります。さらに、生成されたすべての音声ストリームと動画ストリームには、人間には感知できない SynthID の透かしが埋め込まれており、AI 生成コンテンツの透明性と検証可能性が確保されています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini 3.8 Live と Live Avatar の 3 つのデモ</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">1: インタラクティブなカスタム アバター</strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=oVG-5BF-dWo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 3.8 Live with Live Avatar</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=oVG-5BF-dWo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">インタラクティブなカスタム アバターを段階的に作成</span></span></span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">Gemini 3.8 Live で、システム指示を追加し、参照用の写真と音声ファイルのサンプルを 1 つずつアップロードすることで、カスタム アバターを作成する方法をご覧ください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2: 音声優先の保険金請求受付におけるライブ動画の理解</strong></p>\n<p><strong style=\"vertical-align: baseline;\"> </strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=QXiJfxdcSgo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini 3.8 Live demo for insurance claim agent</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=QXiJfxdcSgo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Gemini 3.8 Live を使用したライブ動画の理解により、請求の受付を効率化</span></span></span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">このデモでは、Gemini 3.8 Live を使用して、一般的なユースケースである受付エージェントを実際に作成します。このシナリオでは、保険金請求の受付エージェントを想定しています。カメラに向かって話し、損傷を映すだけで、請求ノートブックが自動的に入力されていきます。バックグラウンドでは、ADK エージェント チームがポリシーを確認し、受付ルールを適用して、アジャスター パケットを作成します。詳細については、</span><a href=\"https://github.com/Shubhamsaboo/awesome-llm-apps/tree/main/voice_ai_agents/insurance_claim_live_agent_team\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">オープンソース コード</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">3: Google ADK と Gemini Live API を使用したリアルタイム音声 AI エージェント</strong></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=yQEKMsCtsmE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Build a real-time voice AI agent with Google ADK and Gemini Live API</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=yQEKMsCtsmE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\"><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Google ADK と Gemini Live API を使用してライブ音声エージェントを構築</span></span></span></em></sup></p>\n<p><span style=\"vertical-align: baseline;\">デベロッパーが </span><a href=\"https://adk.dev/live/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit</span></a><span style=\"vertical-align: baseline;\">（ADK）を使用して、エージェントの定義、ランナーとセッション メモリの管理を行い、従来の音声文字変換パイプラインを介さずに、リアルタイム音声を Gemini Live API へ直接ストリーミングする方法をご覧ください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar を活用したイノベーションの事例</strong></h3></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"4 autotrader\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_autotrader.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Cox Automotive は、Autotrader 向けに AI を活用したショッピング アシスタントを構築しました。このアシスタントは、ライブ画面ハイライト機能とツール呼び出し機能を活用し、自然な会話を通じて、車両の検索から比較、さらには融資の手続きまで、自動車購入者をリアルタイムで案内します。</p><p>「買い物客は、フィルタやメニューをたどるのではなく、自分の言葉で必要なものを伝えて探すことを、ますます望むようになっています。Autotrader の新しい会話型 AI アバターは、自然な会話を適切な在庫にマッチングさせることで、車両検索にそのエクスペリエンスをもたらします。これは、すべての消費者とのやり取りで Cox Automotive のデータを最大限に活用するという、コネクテッド インテリジェンスのビジョンに向けた新たな一歩です。」- Cox Automotive、EVP 兼最高プロダクト責任者、Marianne Johnson 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=0pS0I7mhv10\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Autotrader AI-powered shopping assistant | Gemini 3.8 Live with Live Avatar</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=0pS0I7mhv10\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"6 equal ai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/6_equal_ai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「当社は、ユーザーをよく理解し、ユーザーの言語を話し、常にユーザーに寄り添うパーソナル AI を構築しています。現在、インドの 9 つの言語で、1 日に 100 万件を超えるライブ通話を処理しています。Gemini 3.8 Live によって、割り込みへの対応、多言語での会話、そしてツール呼び出しの信頼性が向上しました。この AI は電話に応答するだけでなく、ユーザーに代わって作業を完了してくれます。」- Equal AI、CEO、Akhilesh Damaraju 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"7 salesforce\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/7_salesforce.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「Gemini 3.8 Live と Agentforce が連携することで、インテリジェント サービスの可能性を再定義できることを大変嬉しく思います。Salesforce AI Research と Google のコラボレーションにより、リアルタイムのマルチモーダル機能とエージェント型 AI を組み合わせ、最初の問い合わせから解決に至るまで、より豊かで直感的なカスタマー エクスペリエンスを創出する新たなアプローチを追求しています。- Salesforce、Agentforce 担当プロダクト バイス プレジデント、Bob Van Osten 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=1x8UAK9demI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Salesforce&#x27;s Agentforce and Gemini 3.8 Live</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=1x8UAK9demI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"9 specs\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/9_specs.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「テストとベンチマークを通じて、Gemini 3.8 Live には非常に感銘を受けました。音声検出のアップデートと全体的なレイテンシの改善は大きな前進であり、SPECS プラットフォームで最高品質の AI アシスタントを提供する能力をさらに高めてくれます。」- Specs、ソフトウェア エンジニア、Eric Walsh 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">今すぐ開発に着手しましょう</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini 3.8 Live with Live Avatar は、企業のお客様向けに提供が開始されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal-live\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> でモデルを試す</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini Live API の</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/live-api\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">で統合ガイドを確認する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">料金ページ</span></a><span style=\"vertical-align: baseline;\">で料金を確認する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini Live API を使用してリアルタイムの双方向ストリーミング アプリを構築する</span><a href=\"https://github.com/google-gemini/gemini-skills/blob/main/skills/gemini-live-api-dev/SKILL.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">スキル</span></a></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">アプリケーションに特殊なモジュール式の音声機能が必要な場合は、他の音声モデルもご確認ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-5-transcribe/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Transcribe</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-live-3-5-translate/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Live Translate</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-text-to-speech/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash-Lite TTS と Gemini 3.8 Flash TTS</span></a></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">プロビジョンド スループットの有効化、カスタマイズされたデプロイ アーキテクチャ、カスタム アバターの許可リストへの登録については、Google Cloud の営業担当者にお問い合わせください。</span></p>\n<p><em><strong style=\"vertical-align: baseline;\">- Gemini Live、グループ プロダクト マネージャー、Fabien Blanc-paques</strong></em></p></div>"
  "7ab44448df30194e38cf19db76b115a7":
    "id": "7ab44448df30194e38cf19db76b115a7"
    "title": "千葉大学：LMS の Google Cloud 移行で「止まらない教育インフラ」を実現。運用負荷の大幅軽減とデータ駆動型教育への挑戦"
    "link": "https://cloud.google.com/blog/ja/products/gcp/chiba-university-realizes-an-uninterrupted-educational-infrastructure/"
    "published": "2026-09-30 02:00:00"
    "fetched": "2026-09-30 17:01:06"
    "summary": "<div class=\"block-paragraph\"><p><b>2020 年に発足した「スマートオフィス」を中核に、千葉大学は全学的な教育 DX を加速させています。オンプレミスから他社クラウド、そして Google Cloud へ。その歩みは、単なるサーバーの移設ではなく、大学が自ら IT インフラの最適解を見極めながら、Google Cloud とともに教育の質を向上させてきた挑戦の記録でした。</b></p><p>千葉大学では、学習管理システム（LMS）として Moodle を運用し、教育活動の基盤としています。この不可欠なインフラをいかにして「持続可能で高品質なもの」へと進化させたのか。実際にこの取り組みに携わった理事（総括・教育・国際）の小澤 弘明 氏、当時のスマートオフィス長・副学長（学修支援）の竹内 比呂也 氏、およびスマートオフィスの皆様にお話を伺いました。</p><h3><b>【背景】コロナ禍で露呈したオンプレミスの限界と IaaS の課題</b></h3><p>コロナ禍以前、千葉大学の LMS はオンプレミス環境で運用されていました。当時は物理的な機器トラブルやネットワーク障害、さらには停電への対応に追われる日々でした 。</p><p>「物理的なトラブルに加え、これらに対応できる専門知識を持つ職員が少なく、運用負荷やセキュリティ面での不安が大きな課題でした」と担当者は語ります 。</p><p>2020 年、コロナ禍によるアクセス急増を受け、まずは他社クラウドへの移行を断行しました。しかし、そこでの構成はすべて IaaS（仮想マシン）であったため、物理的なトラブルからは解放されたものの、OS の管理やパッチ当てといった運用負荷は依然として残ったままでした 。</p><p>Google Cloud を検討したきっかけは、教育現場での Google Workspace の浸透でした。学生のメールをGmail に移行したり、同時双方向のオンライン授業のためのツールとして Google Meet などの活用が進んだりする中、アカウント認証を統合できるメリットは運用上極めて大きいものでした 。</p><p>さらに、学術情報ネットワーク（SINET）とのプライベート接続におけるコストパフォーマンスが優れていたため、教育系システムを全面的に移行することになりました。</p><h3><b>【プロセス】組織の壁と技術的ハードルを乗り越えた「三者連携」</b></h3><p>移行プロジェクトは、事務補佐員を含め約 10 名の職員と 4 名の教員で構成される「スマートオフィス」が主導しました 。しかし、当時は学内にクラウドに深い知見を持つ人材が不足しており、大きな壁にぶつかります。</p><ol><li><b>組織内の合意形成：</b> ISMAP などの評価基準が定まる前だったこともあり、機微な学生情報をクラウドへ移行することに対し、学内のセキュリティ面でのすり合わせに苦心しました 。</li><li><b>技術的難所（SINET 接続）：</b> セキュリティを担保するため、商用ネットを介さず SINET から直結する構成を目指しましたが、ベンダーとの調整が難航しました 。</li></ol><p>技術的なハードルの克服に向けては、コンサルタントとして参画していた早稲田大学アカデミックソリューション（WAS）が各者の橋渡し役を担いました 。千葉大学、Google Cloud、運用ベンダーの三者間に立ち、Google Cloud の知見も取り入れながら実務レベルの調整を積み重ねることで、難航していたシステム実装を実現しました。</p><h3><b>【アーキテクチャ】安定性と先進性を両立する「クラウドネイティブへの道筋」</b></h3><p>現在のシステム構成は、単なる「リフト＆シフト（そのまま移行）」ではありません。将来的なサーバーレス化を見据えつつ、現時点での安定性を最大化する工夫が施されています。</p><ul><li><b>安定稼働の追求：</b> 多くの学生が一斉にアクセスするピーク時のパフォーマンスを確保するため、アプリケーションサーバーは Compute Engine（VM）による 3 台構成を採用しています 。</li><li><b>PaaS への積極移行：</b> データベースは Cloud SQL (MySQL)、キャッシュ層は Memorystore (Redis) へと PaaS 化。これにより、管理者を苦しめていた OS の管理工数から解放されました 。</li><li><b>先進的な試行：</b> Cloud Run を活用したフロントエンド構築も開始しており、「使った分だけ支払う」というクラウドのメリットを最大限に享受しています 。</li><li><b>強固な防御：</b> WAF として Cloud Armor を、ファイアウォールとして Cloud Firewall（Cloud NGFW） を活用し、機密性の高い学生データを守っています 。</li></ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_nGyf6GS.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>【導入効果】管理工数の削減が、教員と学生の「自由」を生む</b></h3><p>導入前に課題となっていた、停電、負荷増大による処理停止や、証明書更新のためのシステム停止等の懸念点については、Google Cloud に移行し、マネージド証明書を利用することによって解決することができました。</p><p>システム運用における具体的な効果は以下の通りです。</p><ul><li><b>運用の自動化：</b> SSL 証明書の更新はマネージド証明書で自動化。サーバーごとの個別監視も、ログを BigQuery へ転送して一括管理することで不要になりました 。</li><li><b>教育の質の向上：</b> 「課題締切直前にサーバーが落ちるかもしれない」という不安から学生が解放されたことは、学習体験に大きなプラスとなりました。教員側も、小テストの自動採点やオンライングループワークといった LMS の機能をフル活用した、より高度な教育設計に躊躇なく挑戦できるようになっています 。</li><li><b>運用工数とコストの削減：</b> 全体で約 20~30 ％の工数削減を達成し、コスト削減と運用効率化の両方を実現しました。</li></ul><p>「LMS は、あって当たり前のインフラとして機能することに意味があります。学習の本質とは無関係なストレスを取り除くことで、初めてデータに基づいた教育改善が可能になるのです」</p><h3><b>【展望】AI とデータ分析で「次世代の学び」へ</b></h3><p>同大は今後、API を利用した学内向け RAG（検索拡張生成）の構築や、LMS の利用ログを BigQuery で蓄積し、Looker で可視化・分析する「ラーニング・アナリティクス」の計画を検討しています。</p><h3><b>【メッセージ】「IT に関する判断」をベンダーに委ねない</b></h3><p>「クラウドは、ベンダーの報告を自分たちで直接確認し、判断することを可能にします。少ない学習コストで自ら利活用できるからこそ、ベンダー主導では実現しにくい、教育現場に根差した仕組みを構築することができる。IT に関する判断を自らに取り戻すこと。これこそが、クラウド移行で最も重要な視点です。」</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_t6L0Gk5.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>プロフィール（敬称略）</b></p><p><b>国立大学法人 千葉大学</b></p><ul><li>理事（総括・教育・国際）：小澤 弘明</li><li>副学長（教育改革・学修支援）（※2023 年度～2025 年度）：竹内 比呂也</li><li>スマートオフィスの皆様</li></ul><p><b>利用サービス：</b> Compute Engine, Cloud Run, Cloud SQL, Memorystore, Cloud Storage, Filestore, Cloud Armor, Cloud Load Balancing, BigQuery, Google Workspace, Looker</p></div>"
