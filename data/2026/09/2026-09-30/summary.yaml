"overview": |
  この日は 3 件で、エージェント向けのサンドボックス基盤と、セキュリティエージェントの拡充、そしてエージェント開発の設計論でした。まず、強化学習 (RL) 向けに最適化した GKE Agent Sandbox と、Agent Sandbox RL オーケストレーション SDK、そして主要な RL の gym とハーネスへのネイティブ統合が一般提供となりました。エージェント型の強化学習や評価を大量の並列ロールアウトへ広げようとすると、高価な GPU クラスターが CPU サンドボックスのコールドスタートを数分待って遊んでしまい、そこに数千件のマルチギガバイト級の SWE-bench 相当のイメージ取得とスケジューリングの滞留が重なる、というサンドボックス基盤のボトルネックに突き当たります。これが研究の速度を静かに落とし、学習の予算を燃やしてしまうという問題意識に対し、RL 研究者が何を必要としているかを推測するのではなく、Kubernetes 自体を性能ベンチマークと評価による自動的な調査・検証のループに乗せ、SWE-bench のような重いエージェントベンチマークで自らのクラスターを意図的に限界まで追い込んで、etcd のタイムアウトから GPU のアイドル時のスパイクまで、浮かび上がったボトルネックを開発サイクルへ戻して GKE の基本機能を磨いた結果として、サンドボックスが 45 倍高速になったとしています。セキュリティでは、Gemini Enterprise のエコシステムにおいてパートナーが提供するセキュリティ関連の品揃えが拡大しました。エンタープライズのサイバー防御は ID・ネットワーク・エンドポイント・データ・クラウド・アプリケーションの各層にまたがり、十数以上の製品にそれぞれの文脈が分散しがちですが、Google Cloud Next でパートナー製のエージェントを Gemini Enterprise に取り込んだのに続き、今回はセキュリティ分野を広げています。追加されたのは、チームが Gemini Enterprise から直接呼び出すパートナー製のセキュリティエージェントと、AI およびエージェント型ワークロードの保護の 2 種類で、たとえば Acalvio の ShadowPlex デセプションエージェントは Gemini Enterprise から使えて、おとりやハニートークンの配置を自動化します。これらを取り込むことで、多段のセキュリティワークフローを Gemini Enterprise の環境内で組み立てられるようになります。エージェント開発では、Agent Development Kit (ADK) の Graph Workflows が詳しく解説されました。タスクをノードに分け、エッジでつなぎ、次の一手をコード・モデル・人間のどれが決めるかを設計するのがグラフエンジニアリングで、ADK の Workflow はその設計を、関数とエージェントが実際に処理を担う実行可能なプロセスに変えます。返金処理の例を通して、fan-out と fan-in、決定論的なルーターとエージェントによるルーター、人間のレビューのための一時停止、並列ワーカー、動的なオーケストレーションを扱い、経路を静的なグラフとして宣言すべき場面と、結果が届くのに合わせて Python に次の処理を決めさせるべき場面の違いも説明されています。
