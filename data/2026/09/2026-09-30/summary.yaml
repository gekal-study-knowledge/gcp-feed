"overview": |
  この日は 9 件で、エージェント向けのサンドボックス基盤と、セキュリティエージェントの拡充、そしてエージェント開発の設計論でした。まず、強化学習 (RL) 向けに最適化した GKE Agent Sandbox と、Agent Sandbox RL オーケストレーション SDK、そして主要な RL の gym とハーネスへのネイティブ統合が一般提供となりました。エージェント型の強化学習や評価を大量の並列ロールアウトへ広げようとすると、高価な GPU クラスターが CPU サンドボックスのコールドスタートを数分待って遊んでしまい、そこに数千件のマルチギガバイト級の SWE-bench 相当のイメージ取得とスケジューリングの滞留が重なる、というサンドボックス基盤のボトルネックに突き当たります。これが研究の速度を静かに落とし、学習の予算を燃やしてしまうという問題意識に対し、RL 研究者が何を必要としているかを推測するのではなく、Kubernetes 自体を性能ベンチマークと評価による自動的な調査・検証のループに乗せ、SWE-bench のような重いエージェントベンチマークで自らのクラスターを意図的に限界まで追い込んで、etcd のタイムアウトから GPU のアイドル時のスパイクまで、浮かび上がったボトルネックを開発サイクルへ戻して GKE の基本機能を磨いた結果として、サンドボックスが 45 倍高速になったとしています。セキュリティでは、Gemini Enterprise のエコシステムにおいてパートナーが提供するセキュリティ関連の品揃えが拡大しました。エンタープライズのサイバー防御は ID・ネットワーク・エンドポイント・データ・クラウド・アプリケーションの各層にまたがり、十数以上の製品にそれぞれの文脈が分散しがちですが、Google Cloud Next でパートナー製のエージェントを Gemini Enterprise に取り込んだのに続き、今回はセキュリティ分野を広げています。追加されたのは、チームが Gemini Enterprise から直接呼び出すパートナー製のセキュリティエージェントと、AI およびエージェント型ワークロードの保護の 2 種類で、たとえば Acalvio の ShadowPlex デセプションエージェントは Gemini Enterprise から使えて、おとりやハニートークンの配置を自動化します。これらを取り込むことで、多段のセキュリティワークフローを Gemini Enterprise の環境内で組み立てられるようになります。エージェント開発では、Agent Development Kit (ADK) の Graph Workflows が詳しく解説されました。タスクをノードに分け、エッジでつなぎ、次の一手をコード・モデル・人間のどれが決めるかを設計するのがグラフエンジニアリングで、ADK の Workflow はその設計を、関数とエージェントが実際に処理を担う実行可能なプロセスに変えます。返金処理の例を通して、fan-out と fan-in、決定論的なルーターとエージェントによるルーター、人間のレビューのための一時停止、並列ワーカー、動的なオーケストレーションを扱い、経路を静的なグラフとして宣言すべき場面と、結果が届くのに合わせて Python に次の処理を決めさせるべき場面の違いも説明されています。セキュリティでは、AI 時代における脆弱性の発見と悪用の傾向が Google Threat Intelligence Group (GTIG) から報告されました。AI は脆弱性の発見と悪用のペースだけでなく、見つかる脆弱性の種類やリスクのかたちまで測定可能なかたちで変えているとして、月あたりの脆弱性の公開数が 2026 年 1 月の 5,045 件から 7 月には 10,477 件へと倍増し、8 月も 10,740 件と増え続けていること、悪用された脆弱性の数が 2025 年の月平均 10.5 件から 2026 年 1〜8 月の月平均 18 件へとほぼ倍増したこと、ゼロデイの悪用も 2025 年の月平均 8 件から同期間の月平均 11 件へと小幅に増えたことが示されています。データ基盤では、Data Agent Kit が一般提供となりました。Model Context Protocol (MCP) のツールとエージェントスキルを無償でまとめたもので、Antigravity・Claude Code・Codex など、すでに使っているコーディングエージェントから Google Cloud のデータ製品を直接扱えます。コーディングエージェントは SQL や PySpark、パイプラインのコードを書くのは相当に上手くなった一方、どのテーブルがあるのか、どう分割されているのか、チームがどれを信頼しているのか、前夜のジョブがなぜ失敗したのかといった環境の文脈は既定では持たないため、スキーマやエラーログをチャットに貼って補う必要があったという課題に応えるものです。GA にあわせて、BigQuery Graph・Bigtable・Managed Service for Apache Spark 経由でのオープンなレイクハウスへのアクセスに対応し、日々の作業を速く滑らかにする細かな改善も多数入りました。リリースノートでは、Apigee API hub の API insights に AI 向けとエージェント向けの 2 つのダッシュボードが加わりました。AI performance はゲートウェイ経由で呼ばれた大規模言語モデルのトークン使用量とモデルのレイテンシーを、モデルとプロバイダーで絞り込んで報告し、Tool performance は MCP ツールのトラフィック・スループット・ペイロードサイズ・レイテンシーを、MCP サーバー・デプロイ・ツール名で絞り込んで報告します。Cloud Tasks では、タスク作成時にリトライのパラメーターを指定してキュー単位の設定を上書きすること、タスクをまとめて作成して既存のキューに追加すること、キューからタスクをまとめて削除することが一般提供となりました。Datastream は SQL Server・Spanner・Oracle・PostgreSQL・MySQL のソースで部分バックフィルに対応し、SQL の WHERE 句をカスタムの条件として与えることで、ソースから特定の部分集合だけを宛先に取り込めるようになりました。日本語ブログでは、通信業界が人手による運用から完全な自律型ネットワーク運用へ移る中で、グラフニューラルネットワーク (GNN) を AI エージェントと統合して根本原因分析・キャパシティプランニング・トラフィック予測・What-If 分析・リアルタイムの異常検出を行い、TM Forum の定義するレベル 5 の自律性へ安全に進める考え方が、Distributed GraphFlow とともに紹介されました。あわせて Gemini 3.8 Live with Live Avatar の一般提供の翻訳記事が公開され、97 言語の理解と発話と自動言語検出、会話を続けながら背後でツールや API を呼ぶこと、ライブカメラの映像や画面共有を音声と同時にリアルタイムで処理することといった機能が挙げられています (米国と EU のエンドポイントで、プロビジョンドスループット、エンタープライズコンプライアンス、厳格なデータガバナンス付き。Gemini 3.8 Live Extended Thinking は限定公開プレビューのまま)。事例では、千葉大学が学習管理システム (LMS) の Moodle を Google Cloud へ移行した取り組みが紹介されました。コロナ禍以前はオンプレミスで物理機器のトラブルやネットワーク障害、停電への対応に追われ、対応できる専門知識を持つ職員が少ないことが課題で、2020 年にまず他社クラウドへ移りましたが、すべて IaaS 構成だったため OS の管理やパッチ当ての負荷は残りました。教育現場で Google Workspace が浸透しアカウント認証を統合できる利点が大きかったこと、学術情報ネットワーク (SINET) とのプライベート接続のコストパフォーマンスが優れていたことが、教育系システムの全面移行につながっています。
