    "title": "Best practices guide for customizing Gemini models via Reinforcement Learning (RL)"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/best-practices-guide-for-customizing-gemini-models/"
    "published": "2026-09-26 01:00:00"
    "fetched": "2026-09-26 01:35:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Reinforcement learning (RL) has been a keystone of modern LLM post-training, but it demands large training clusters and access to model internals that external customers can't have with proprietary models like Gemini. So here at Google Cloud, we packaged it into </span><strong style=\"vertical-align: baseline;\">a managed RL fine-tuning service (RLFT service) </strong><span style=\"vertical-align: baseline;\">— you bring prompts and a reward function; we handle the infrastructure and the proprietary model internals. </span></p>\n<p><span style=\"vertical-align: baseline;\">Now, you can adapt Gemini with the service — teaching the model from a reward signal you define, rather than from a fixed set of labeled answers. This unlocks a class of problems that supervised fine-tuning (SFT) struggles with: tasks that are hard to demonstrate but easy to score.  </span></p>\n<p><span style=\"vertical-align: baseline;\">In this guide, we will walk through practical best practices for using RL fine-tuning service. We'll start with a short tour of the RL training loop, how to decide if and when to use RL, and introduce how to get the most value from this approach.</span></p>\n<h3><span style=\"vertical-align: baseline;\">What is RLFT? </span></h3>\n<p><span style=\"vertical-align: baseline;\">RLFT adapts Gemini from a </span><strong style=\"vertical-align: baseline;\">reward signal you define</strong><span style=\"vertical-align: baseline;\"> rather than labeled answers. Instead of authoring a large set of gold examples, you write one program that </span><span style=\"font-style: italic; vertical-align: baseline;\">scores</span><span style=\"vertical-align: baseline;\"> a response and the service improves the model against it — unlocking tasks that are hard to </span><span style=\"font-style: italic; vertical-align: baseline;\">demonstrate</span><span style=\"vertical-align: baseline;\"> but easy to </span><span style=\"font-style: italic; vertical-align: baseline;\">verify</span><span style=\"vertical-align: baseline;\">: you can't hand-write the ideal SQL for every schema, but you can run the query and check the result.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Single-Step RL Training Loop\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Single-Step_RL_Training_Loop.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At each training step the service generates multiple candidate responses to your prompts, scores them with your reward, and improves the model so that higher-scoring responses become more likely while it stays close to the original Gemini. The reinforcement learning that makes this work is fully managed — you never configure it. The one thing you own, and the thing that most determines your results, is the reward.</span></p>\n<p><span style=\"vertical-align: baseline;\">Three properties define what RLFT can and can't do:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">It </span><strong style=\"vertical-align: baseline;\">learns from the model's own outputs:</strong><span style=\"vertical-align: baseline;\"> It refines what the model already produces rather than copying an external target, so it tends to disturb unrelated capabilities less than SFT. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">It </span><strong style=\"vertical-align: baseline;\">rewards outcomes, not paths:</strong><span style=\"vertical-align: baseline;\">   Any response that reaches a good result earns reward, which fits open-ended tasks with many valid solutions. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">It </span><strong style=\"vertical-align: baseline;\">amplifies existing competence: </strong><span style=\"vertical-align: baseline;\">  It makes </span><span style=\"font-style: italic; vertical-align: baseline;\">occasional</span><span style=\"vertical-align: baseline;\"> success </span><span style=\"font-style: italic; vertical-align: baseline;\">reliable</span><span style=\"vertical-align: baseline;\">, but it can't teach a skill the model never demonstrates.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">When to use RLFT</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - RLFT Approaches - Direct RL or SFT Warmup to Continuous RLFT\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_RLFT_Approaches_-_Direct_RL_or_SFT_War.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Prompting and SFT handle most adaptation; exhaust them first. RLFT earns its keep when you can </span><strong style=\"vertical-align: baseline;\">grade a response but can't cheaply author it</strong><span style=\"vertical-align: baseline;\">, when </span><strong style=\"vertical-align: baseline;\">SFT has plateaued</strong><span style=\"vertical-align: baseline;\"> on the metric that matters (faithfulness, schema validity, tone), or when the task has </span><strong style=\"vertical-align: baseline;\">many equally valid answers</strong><span style=\"vertical-align: baseline;\"> a single reference target would wrongly penalize. </span></p>\n<p><span style=\"vertical-align: baseline;\">SFT and RLFT are complementary, not competing:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct RLFT</strong><span style=\"vertical-align: baseline;\"> when the base model already succeeds part of the time — enough for the reward to tell better answers from worse ones.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Two-stage SFT → RLFT</strong><span style=\"vertical-align: baseline;\"> when you have SFT data or the base success rate is too low for RL to gain traction. Use SFT as a short, cheap warm start — kept light, since over-fitting the demonstrations leaves less room for RL to improve — then continue into RL via </span><strong style=\"vertical-align: baseline;\">Continuous Tuning</strong><span style=\"vertical-align: baseline;\">, which initializes RL from the SFT checkpoint.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Across early adopters, these patterns show where RLFT delivers the most value — each scoring an outcome the business cares about but could never cheaply demonstrate.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Use cases for RLFT</span></h3>\n<p><strong style=\"vertical-align: baseline;\">AI-powered NPCs in games</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What:</strong><span style=\"vertical-align: baseline;\"> In-character, on-brand dialogue held across long, multilingual, multi-turn conversations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Problem:</strong><span style=\"vertical-align: baseline;\"> Off-the-shelf models break immersion — wrong language, hallucinated items, ignored players, repetitive loops.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Objective and reward:</strong><span style=\"vertical-align: baseline;\"> A </span><strong style=\"vertical-align: baseline;\">Gemini autorater (LLM-as-a-judge)</strong><span style=\"vertical-align: baseline;\"> scores each turn on persona, flow, and game-state syntax, penalizing format and language errors.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Results:</strong><span style=\"vertical-align: baseline;\"> Loops and language drift disappeared and state syntax held, making shippable in-game characters viable at scale.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Structured entity extraction</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What:</strong><span style=\"vertical-align: baseline;\"> Pulling a set of items from unstructured documents, such as supplier invoices and shipping manifests, into structured records automatically</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Problem:</strong><span style=\"vertical-align: baseline;\"> The long tail where SFT plateaus — missing required fields (recall) or inventing ones that aren't there (precision).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Objective and reward:</strong><span style=\"vertical-align: baseline;\"> A </span><strong style=\"vertical-align: baseline;\">rule-based precision/recall reward</strong><span style=\"vertical-align: baseline;\"> forces every field to be grounded in the source text, not imitated from one gold answer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Results:</strong><span style=\"vertical-align: baseline;\"> Field-level accuracy rose on noisy real-world documents where tuning had stalled, turning a manual review step into an automated one.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Content moderation</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What:</strong><span style=\"vertical-align: baseline;\"> Applying intricate policies and decision trees at scale.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Problem:</strong><span style=\"vertical-align: baseline;\"> Models hallucinate false positives or reward-hack with invalid formats to dodge evaluation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Objective and reward:</strong><span style=\"vertical-align: baseline;\"> A </span><strong style=\"vertical-align: baseline;\">Cloud Run reward</strong><span style=\"vertical-align: baseline;\"> pairs format validation with a deterministic grader to enforce multi-step policy adherence.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Results:</strong><span style=\"vertical-align: baseline;\"> The model handled complex exemption carve-outs, sharply cut false positives, and stopped reward hacking — reducing the human-escalation volume that makes moderation expensive.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Code measured by execution</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What:</strong><span style=\"vertical-align: baseline;\"> SQL or API calls graded on whether they actually run against customer data.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Problem:</strong><span style=\"vertical-align: baseline;\"> SFT mimics one reference query and breaks on unseen proprietary schemas.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Objective &amp; Reward:</strong><span style=\"vertical-align: baseline;\"> A </span><strong style=\"vertical-align: baseline;\">code-execution reward</strong><span style=\"vertical-align: baseline;\"> runs the code in a secure sandbox and pays out only if it compiles, executes, and returns the correct result.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Results:</strong><span style=\"vertical-align: baseline;\"> The model produced first-attempt executable queries at closed-frontier quality and lower inference cost, letting non-technical users query proprietary data in natural language.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Presentation slide generation via HTML</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What:</strong><span style=\"vertical-align: baseline;\"> Multi-slide decks authored as HTML/CSS.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Problem:</strong><span style=\"vertical-align: baseline;\"> Training on text alone is blind to visual quality — overflows, clipped elements, and inconsistent styling slip through unnoticed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Objective &amp; Reward:</strong><span style=\"vertical-align: baseline;\"> A </span><strong style=\"vertical-align: baseline;\">code-execution reward</strong><span style=\"vertical-align: baseline;\"> renders the slides and scores visual design, layout integrity, structural completeness, and rubric adherence.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Results:</strong><span style=\"vertical-align: baseline;\"> The model emitted modular, well-styled decks with cohesive themes and no layout overflow.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Where to start?</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A dataset.</strong><span style=\"vertical-align: baseline;\"> A diverse set of prompts with a held-out validation split is enough for a first run — confirm the loop converges and reward moves the right way, then scale. Keep train and eval strictly separated; a contaminated eval hides overfitting.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A reward function.</strong><span style=\"vertical-align: baseline;\"> Your task specification as code or configs, and the dominant driver of quality. A good reward correlates with human preference, is robust to malformed output (catch the failed parse and return a clearly negative score rather than crashing), and resists reward hacking — ensemble judges, penalize length, floor degenerate outputs, and prefer a verifiable check over a model's opinion. Validate it offline before launch.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The service handles the rest; start from the defaults, watch reward and eval curves in the console, and take the checkpoint where validation reward saturates rather than the last step.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - rlft_tutorial\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_-_rlft_tutorial.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">What will you build? The tools are ready and waiting. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/reinforcement-tuning\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Documentation: Reinforcement Learning Fine-Tuning</span></a></p>\n</li>\n</ul></div>"
