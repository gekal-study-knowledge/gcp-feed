"overview": |
  この日は 4 件 (重複を除くと 3 件) で、Gemini のカスタマイズと、データ基盤の性能・運用の話題でした。まず、強化学習 (RL) で Gemini をカスタマイズするためのベストプラクティスガイドが公開されました。RL は現代の LLM のポストトレーニングの要ですが、大規模な学習クラスターと、Gemini のようなプロプライエタリなモデルでは外部の利用者が触れられないモデル内部へのアクセスを必要とします。Google Cloud はこれをマネージドな RL ファインチューニングサービス (RLFT) として提供しており、利用者はプロンプトと報酬関数を用意するだけで、インフラとモデル内部の扱いはサービス側が担います。ラベル付きの正解例を大量に用意する代わりに、応答を採点するプログラムを 1 つ書けばモデルがそれに向けて改善されるため、教師ありファインチューニングが苦手とする「やってみせるのは難しいが採点は簡単な」種類の課題に対応できます。ガイドでは RL の学習ループの概観と、RL を使うべきかどうかの判断、価値を引き出すための実践的な勘所が扱われています。データベースでは、Memorystore for Valkey 9.1 が一般提供となりました。Memorystore for Redis Cluster と比べてマイクロ秒のレイテンシーのまま最大 3 倍の QPS を実現します。Valkey は、2024 年に Redis Inc. が寛容なオープンソースライセンスからデュアルライセンスへ移行したことを受けて、Google Cloud をはじめとする各社が支援して生まれた Linux Foundation 管理のオープンソースで、AI やマイクロサービスを数百万の同時ユーザー規模に広げる組織に向いているとされています。ストレージでは、Storage Intelligence advisor の一般提供と、ストレージのバッチ操作の機能拡張が発表されました。大規模に運用しているチームの多くは、異常なアクセスパターンが請求書の明細に現れて初めて問題に気づき、そのころには何週間も続いてしまっているという状況に対し、advisor が「ストレージ資産で何が変わったのか、それに対して何をすべきか」を示し、バッチ操作がその判断を数百万オブジェクトに対して実行します。インベントリをエクスポートしてアクセスログと突き合わせ、どのサービスアカウントがどのジョブのものか誰かが覚えていることを祈る、という従来の流れは、AI の学習・推論パイプラインがガバナンスの分類速度を超えてデータを生み、読み取りのパターンも週ごとに変わる今では成り立たなくなっている、という問題意識が語られています。いずれの機能も Storage Intelligence の利用者はすぐに使えます。
