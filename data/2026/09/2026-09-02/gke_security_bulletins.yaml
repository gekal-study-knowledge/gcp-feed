    "id": "db11c307a7c20a86345795bb6d15991e"
    "title": "GCP-2026-058"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-058"
    "published": "2026-09-02 09:00:00"
    "fetched": "2026-09-03 04:42:34"
    "summary": "<p><strong>Published: </strong>2026-09-02</p><table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A missing project permission check in GKE Multi-Cloud <code dir=\"ltr\">(CreateAttachedCluster, CreateAwsCluster, CreateAzureCluster)</code> APIs allowed an attacker to register an attached cluster into an arbitrary target project's Workload Identity Federation for GKE. This registration allowed unauthorized creation of Workload Identity tokens and impersonation of Kubernetes Service Accounts that have bindings in the target project through the Workload Identity Federation for GKE configuration. The attack would have required both of the following characteristics to be known:</p>\n<ul>\n<li>Knowledge of the target project number (not project ID); and</li>\n<li>Knowledge of at least one target namespace and Kubernetes service account pair that has been bound with <code dir=\"ltr\">roles/iam.workloadIdentityUser</code></li>\n</ul>\n<p> We have verified that there was no exploitation of this vulnerability. This issue was reported through our <a href=\"https://bughunters.google.com/about\">Vulnerability Reward Program</a>.</p>\n<h4 id=\"what-should-i-do\" tabindex=\"-1\">What should I do?</h4>\n<p>All GKE clusters were patched by adding the missing authorization check to the server. No action is required.</p>\n</td>\n<td>Critical</td>\n</tr>\n</tbody>\n</table>"
"last_updated": "2026-09-03 04:42:34 JST"
