  "e517b184e6a73676b9cf86e4294ecf45":
    "id": "e517b184e6a73676b9cf86e4294ecf45"
    "title": "AI エージェントの構築を基礎から始めるチャンス"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/your-chance-to-start-building-ai-agents-from-the-absolute-basics/"
    "published": "2026-09-02 11:00:00"
    "fetched": "2026-09-02 11:59:35"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 27 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/your-chance-to-start-building-ai-agents-from-the-absolute-basics?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">最近「AI エージェント」についてよく耳にするものの、実際に構築し始める方法がわからずお困りではありませんか？学び始めるのに、ML の知識や長年のソフトウェア開発経験は必要ありません。習得への近道は、実際にやってみることです。そのために開発されたのが、</span><strong style=\"vertical-align: baseline;\">Agent Valley</strong><span style=\"vertical-align: baseline;\"> です。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Agent Valley</strong><span style=\"vertical-align: baseline;\"> は、5 週間の無料ライブ学習シリーズです。ゼロから始めて、独自のハンズオン エージェント システムを構築できる内容になっています。退屈なターミナル画面を眺める代わりに、小さなローポリの仮想世界の中で構築してゲームのように楽しめます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">インストラクター紹介</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google のトップ DevRel エンジニアである Annie Wang から直接学ぶことができます。完全なハンズオン形式で、インタラクティブに初心者でも無理なく学べるよう、彼女がこのコースをゼロから設計しました。Google で実際に AI システムを設計しているエンジニアから、その構築方法を学ぶチャンスです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">学習方法</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ノートパソコンの分割画面上で、実際に構築しながら学習します。1 日目は、プレイ キャラクター兼セーブファイルとなる、ローポリのカスタム コンパニオンを言葉で表現して召喚します。谷の 5 つの地区をコンパニオンと巡っていくゲームのすぐ横に表示されるリアルタイムのランタイム インスペクタで、AI が何を考え、何を決定し、どのくらいのコストがかかっているのかをリアルタイムで正確に把握できます。完全にストレスフリーでセットアップでき、演習用の環境も Google がご用意するため、すぐに構築作業を始められます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント入門ガイド ライブ（5 つのモジュール セッション、いつでも参加可能）</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">第 1 週: 召喚の森（コントロール）</strong><span style=\"vertical-align: baseline;\">· まずコンパニオンを召喚し、会話全体でその記憶と個性を一貫して保つための方法を学びます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">第 2 週: ビルドヤード（分解）</strong><span style=\"vertical-align: baseline;\">· 大規模なプロジェクトを細かく分解し、複数の AI アシスタントが互いに邪魔することなく並行して作業できるようにする方法を学びます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">第 3 週: マーケット ストリート（コーディネート）</strong><span style=\"vertical-align: baseline;\">· バーチャル ショップを開店します。取引や返品がクラッシュすることなくスムーズに行われるよう、信頼性の高いコードを記述する方法を学びます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">第 4 週: アーカイブ（記憶）</strong><span style=\"vertical-align: baseline;\">· コンパニオンに記憶を与えます。エージェントが混乱したり、でたらめを言ったりすることなく、過去のやり取りを記憶できるようにする方法を学びます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">第 5 週: ナイトマーケット（ライブ）</strong><span style=\"vertical-align: baseline;\">· グランド フィナーレ。システムを高速かつ低コストに保ちながら、エージェントが花火や舞台照明などの仮想世界のイベントにリアルタイムでリアクションできるようにする方法を学びます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"agent-valley-roadmap-2160x2700\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/agent-valley-roadmap-2160x2700.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">ライブ配信に参加する    </strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">9 月 1 日から 毎週火曜、全 5 回 · 午前 10 時（太平洋時間）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">コーディングとプレイを通じて AI エージェントを学びたい初心者向け。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">参加お申し込み: </span><a href=\"https://goo.gle/agent101\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">goo.gle/agent101</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">デベロッパーリレーションズ エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Christina Lin</strong></p></div>"
  "011a98b2009508f107a5fc934b32fc95":
    "id": "011a98b2009508f107a5fc934b32fc95"
    "title": "Google Cloud Partner Top Engineer 2027 アワードプログラム 申し込みを開始"
    "link": "https://cloud.google.com/blog/ja/topics/partners/google-cloud-partner-top-engineer-2027/"
    "published": "2026-09-02 10:00:00"
    "fetched": "2026-09-02 11:59:35"
    "summary": "<div class=\"block-paragraph\"><p>2026 年 6 月 11 日に本ブログにて発表させていただきましたアワードプログラム 「Google Cloud Partner Top Engineer 2027」 の申し込みを本日より開始しましたのでお知らせいたします。</p><p>本プログラムへの自薦・他薦によるお申し込みを <a href=\"https://rsvp.withgoogle.com/events/google-cloud-partner-top-engineer/home\" target=\"_blank\">Google Cloud Partner Top Engineer のサイト</a>にて受付開始いたします。内容をご確認の上、サイト内のフォームよりお申し込み下さい。</p><p>申し込み期間は本ブログのアナウンスより 2026 年 10 月 9 日 迄となります。また結果発表は2026 年 11 月 25 日 Google Cloud Japan ブログにて、また表彰式を 2026 年 11 月 26 日に行われる Partner Forum にて開催します。</p><p>本プログラム概要については <a href=\"https://rsvp.withgoogle.com/events/google-cloud-partner-top-engineer/home\" target=\"_blank\">Google Cloud Partner Top Engineer のサイト</a>にてご確認ください。</p><p>たくさんのパートナーの皆様からのご応募をお待ちしております。</p><p>お問合せ先：gcj-partner-top-engineer@google.com (Google Cloud Partner Top Engineer 事務局)</p></div>"
  "7dc4f6c14f379de08e05273a9b1d85a9":
    "id": "7dc4f6c14f379de08e05273a9b1d85a9"
    "title": "Statiq: Places UI キットでユーザー エクスペリエンスを改善し、EV アプリの使用を促進"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/statiq-improving-user-experience-and-increasing-ev-app-usage-with-places-ui-kit/"
    "published": "2026-09-02 11:00:00"
    "fetched": "2026-09-02 16:50:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 21 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/statiq-improving-user-experience-and-increasing-ev-app-usage-with-places-ui-kit/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回のブログ記事は、Statiq の最高技術責任者である Raghav Arora 氏によるものです。Statiq が Places UI キットを使用して Google マップを Statiq アプリのインターフェースに直接統合し、ユーザー エクスペリエンスを改善して、収益の増加に直接つなげた方法について、Raghav 氏が説明します。</span></p>\n<hr />\n<p><a href=\"https://www.statiq.in/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Statiq</span></a><span style=\"vertical-align: baseline;\"> が販売しているものは「電子」です。1 ミリ秒あたり数百京個の電子です。</span></p>\n<p><span style=\"vertical-align: baseline;\">インドではクリーン エネルギーが国家的な優先事項ですが、ガソリン スタンドはどこにでもあり、電気自動車（EV）の充電スタンドよりもはるかに多く存在します。電気自動車のオーナーにとって最も大きな不安は「航続距離の不安」です。私自身も EV のオーナーとして経験しましたが、「必要なときに近くに充電スタンドが見つかるだろうか？」という不安があります。これは、EV 購入の決定を左右する重要な心理的ハードルです。</span></p>\n<p><span style=\"vertical-align: baseline;\">2019 年に、「ガソリン スタンドと同じくらい簡単に充電スタンドを見つけられるようにすることで、インドでの EV の急速な普及を支援する」という明快なミッションを掲げて、Statiq を共同設立しました。そしてわずか 6 年で、当社はインド最大の充電ネットワークになりました。当社のアプリは、国内の充電スタンドの 80% を網羅しています。そのうち 2,000 か所以上は Statiq が所有および運営しており、これはインドのすべての充電スタンドの 20% に相当します。Statiq アプリは、インドの EV ドライバーの 80% が利用するアプリとなり、これまでに 100 万回以上ダウンロードされています。</span></p>\n<p><span style=\"vertical-align: baseline;\">当初から、</span><a href=\"https://mapsplatform.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform</span></a><span style=\"vertical-align: baseline;\"> により、ユーザーは充電スタンドをすばやく見つけ、そこまで簡単に移動できています。地図に依存するスタートアップである当社にとって、Google を選ぶことに迷いはありませんでした。Google は、シームレスな位置情報サービスを実現する世界最大かつ最高クラスのデータセットを備えています。このデータセットは、当社が 800 以上の都市に迅速に展開するうえで重要な役割を果たしました。また、Google マップを使用することで、リアルタイムの位置情報とナビゲーション データの精度がすべて向上することもわかっていました。さらに、エンドユーザーはすでにそのインターフェースに慣れていたため、アプリの信頼性はすぐに高まりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">EV の早期導入から、このテクノロジーが広く受け入れられる状態へと移行するにつれ、インド全土の EV ドライバーは、サービスを提供するインフラストラクチャを簡単に見つけられるだけでは満足しなくなりました。充電スタンドの検索や車両の充電に使用するアプリに、スムーズなエクスペリエンスを求めていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">充電スタンドが増えれば、ガソリン車から電気自動車に乗り換えるドライバーも増えます。充電スタンドが見つけやすくなれば、それを繰り返し利用する人も増えます。しかし、車両の充電には時間がかかり、場合によっては 1 時間ほどかかることもあります。そのため、親戚を訪ねる途中の家族であれ、300 台の車両を保有するタクシー会社の運転手であれ、ドライバーは充電スタンドの場所だけでなく、充電中に食事や買い物ができるかどうかを知りたいと思うようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">そのためには、単なるナビゲーション ツール以上の地図が必要です。だからこそ、Google Maps Platform の </span><a href=\"https://developers.google.com/maps/documentation/javascript/places-ui-kit/overview?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places UI キット</span></a><span style=\"vertical-align: baseline;\">がリリースされたとき、当社はすぐに導入しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"statiq-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/statiq-1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">インフラストラクチャからインテリジェンスへ</span></h3>\n<p><span style=\"vertical-align: baseline;\">Places UI キットを使用することで、Google マップを Statiq アプリのインターフェースに直接統合できました。以前は、Statiq アプリで充電スタンドを見つけてから、Google マップを開き、そこまでのルートを検索して移動する必要がありました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今では、Statiq アプリは EV 充電のエンドツーエンドのユーザー エクスペリエンスを提供するようになりました。ユーザーはアプリを使って充電スタンドを見つけ、Google のプレイスデータにすでに含まれているユーザー提供のレビューや写真とともに、トイレ、駐車場、カフェなどの周辺施設を確認できます。その後、Statiq のユーザー インターフェースから、選択した充電スタンドまでナビゲーションの案内に従って移動し、車を充電して、その料金を支払うことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、プロジェクトの開始からプロダクトのリリースまで 3 週間と、非常にスムーズに進みました。Google Maps Platform チームは、当社のユースケースを深く理解し、最初から最後までサポートしてくれました。Places UI キットには既製のコンポーネントが用意されているため、実装のために新たに開発する必要があるものは最小限で済みました。Places UI キットのわかりやすいドキュメントのおかげで、デザイナーは当社のブランディングに合わせて UI を簡単にカスタマイズできました。</span></p>\n<p><span style=\"vertical-align: baseline;\">各施設の名前、ユーザーが投稿した画像、充電スタンドからの距離（</span><a href=\"https://developers.google.com/maps/documentation/directions?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Directions API</span></a><span style=\"vertical-align: baseline;\"> で計算）などのプレイスデータを表示するために、カード形式の横スクロール ビューを選択しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Places UI キットを実装したことで、Statiq アプリは機能的なユーティリティから、ユーザー フレンドリーな位置情報インテリジェンス プラットフォームへと変貌を遂げ、競合他社との差別化を明確に図ることができました。それにより、Statiq の戦略的転換が可能になりました。インフラストラクチャ主導の成長からエクスペリエンス主導の成長へ、単なる充電器の空き状況の一覧表示から充電器のインテリジェントな発見へ、そして最終的には、トランザクション セッションから、ユーザーの維持を重視した、ユーザー エクスペリエンス ベースのエンゲージメントへと転換できたのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">このエンゲージメントと成長はすでに、測定可能な結果を生み出す大きな競争上の優位性となっています。</span></p>\n<h3><span style=\"vertical-align: baseline;\">周辺施設情報で利用率とエンゲージメントが向上</span></h3>\n<p><span style=\"vertical-align: baseline;\">2026 年 1 月に、Places UI で一新されたアプリをリリースした後、すぐにプロダクト主導の成長を実感しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">わずか 3 か月で、ナビゲーションの開始回数（ドライバーがアプリを開いて充電スタンドの検索を開始した回数）が 13% 増加しました。また、ドライバーが Statiq アプリを開いてから充電セッションが正常に完了するまでの時間が 15% 短縮されました。これらの重要な統計データは、アプリのユーザー エクスペリエンスとコンテキストに応じた場所データが改善され、その結果としてドライバーが自信を持って充電スタンドを見つけて選択できるようになったことに起因しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、「充電器発見インタラクション」、つまり充電セッション中に周辺施設のアイコンを見てクリックしたユーザーが 7% 増加しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの改善は、収益の増加に直接つながりました。リピート充電セッション（1 回限りのユーザーがリピーターになった回数）は 9% 増加し、充電セッション頻度（既存のユーザーが車両を充電した回数を測定）は 8% 増加しました。また、検索放棄（ドライバーが充電スタンドを探したものの車両を充電しなかった回数）は 8% 減少し、アプリのダウンロードから最初の充電セッションまでのコンバージョンは 3% 増加しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">最も重要な点として、アプリ内評価とセッション後のフィードバックで測定した全体的なユーザー満足度が 10% 向上しました。要するに、Places UI キットでアプリを改善したことで、Statiq のお客様は全体的に優れたユーザー エクスペリエンスを得ることができ、その結果、利用率と収益が向上しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今後の機能強化としては、Google ストリートビューとの統合が挙げられます。これにより、ドライバーが到着前に充電スタンドとその周辺エリアをバーチャルにプレビューできるようになります。場所をストリートビューで表示することで、ユーザーは充電器の配置、駐車場のレイアウト、アクセス ルート、近くのランドマークをよりよく理解できるため、充電スタンドを確実に見つけて、たどり着くことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Statiq は単なる充電サービス事業者ではなく、電気自動車とサステナブルなエネルギーの普及を推進しています。Google Maps Platform および Places UI キットの継続的な利用により、Statiq は EV 充電だけでなく、発見プロセス全体でも、可能な限り最高のエクスペリエンスを提供するという取り組みをさらに強化します。なぜなら、当社の目標を達成する唯一の方法は、車での移動の質を高めることだからです。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Statiq、最高技術責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Raghav Arora 氏</strong></p></div>"
  "e4e53dce9f1c0c2325a04a3311ef9a9b":
    "id": "e4e53dce9f1c0c2325a04a3311ef9a9b"
    "title": "新しいルート検索機能: Gemini Enterprise Agent Platform の Google マップによるグラウンディング"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/introducing-new-routing-features-in-grounding-with-google-maps/"
    "published": "2026-09-02 10:10:00"
    "fetched": "2026-09-02 16:50:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 20 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/intl/ja_jp/resources/blog/introducing-new-routing-features-in-grounding-with-google-maps/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">大規模言語モデル（LLM）は、ユーザーによる地図の活用方法を一変させた一方で、依然として静的なデータを使用しているのが現状です。リアルタイム交通情報や突然の通行止めなど、現実世界の状況を反映することはできません。ユーザーが求めている正確で信頼性の高い AI エクスペリエンスを構築するには、エージェントとアプリケーションが推論を物理的世界にグラウンディングするための「信頼できる情報のレイヤ」が必要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"https://mapsplatform.google.com/maps-products/grounding/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google マップによるグラウンディング</span></a><span style=\"vertical-align: baseline;\">機能を拡張し、エージェントやユーザーによる経路案内やルート沿いのスポット検索をサポートする新しいルート検索機能を追加しました。併せて、より深いロケーション コンテキストを提供する新しい豊富な場所属性も追加しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの機能は一般提供を開始しており、移動時間、距離、道路状況、ルート沿いの注目スポット、場所に関する豊富な情報を </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/grounding/grounding-with-google-maps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> を介して AI アプリケーションに直接統合することができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ルート検索機能を使用すると、リアルタイムの交通状況に基づいて、車、徒歩、公共交通機関、自転車などのさまざまな移動手段に合わせた最適なルートを求めることができます。また、最大 13 か所の経由地を設定したルートの計画が可能なほか、ルート沿い検索を使用してホテルへのドライブ中に立ち寄れる夕食の場所を探す、給油のための立ち寄り先を提案してもらうなど、道中のスポットも簡単に見つけることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google マップによるグラウンディングでは、複数の API を手動で順序付けするのではなく、場所検索機能とルート検索機能を自動的に組み合わせます。これにより、「ユーザーの通勤経路上にある特定の雰囲気のカクテルバーを探す」といった複雑なセマンティック クエリを 1 回のリクエストで解決できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"Grounding with Google Maps-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Grounding_with_Google_Maps-1_JnzALu7.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">現実世界の複雑な推論の課題を解決</span></h3>\n<p><a href=\"https://realtor.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Realtor.com</span></a><span style=\"vertical-align: baseline;\"> と </span><a href=\"https://www.neurun.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Neurun</span></a><span style=\"vertical-align: baseline;\"> は、これらのグラウンディング機能を活用したカスタマー エクスペリエンスの向上が、ビジネスの主要指標の改善にいかに寄与するかを示す好例です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Realtor.com は、ネイティブの AI アシスタントである RealAssist™ AI でルート検索機能を活用して、購入者が正確な通勤時間やルート沿いの周辺施設を確認しながら物件を検討できるようにしています。Google マップによるグラウンディングが最初から統合されている RealAssist™ エクスペリエンスをリリースして以降、非ユーザーと比較して、ユーザーがプラットフォーム上で過ごすセッション時間は 4 倍、一意の見込み顧客の獲得数は 15 倍になったことが確認されています*。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">地理的コンテキストを別のタブに表示したり、後から追加したりしたくないと考えていました。Google マップによるグラウンディングを RealAssist™ AI と連携させたことで、空間インテリジェンスを会話にネイティブに組み込むことができました。ユーザーが物件について質問すると、RealAssist™ AI は朝の通勤から近隣の施設に至るまで、地域に則したコンテキストを自動的に考慮して回答します。これにより、検索プロセスが単なるデータベースの照会から、地理的条件を反映した直感的なエクスペリエンスへと一変しました。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Dave Herman 氏</strong><br />\n                \n                \n                  Realtor.com®、プロダクトおよび AI イノベーション担当シニア バイス プレジデント\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"Grounding with Google Maps-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Grounding_with_Google_Maps-2.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Google マップによるグラウンディングを活用した Realtor.com の RealAssist™ AI による会話型の通勤ルート計画機能。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">デジタル イベント ガイド プラットフォームの Neurun は、ニューヨーク / ニュージャージー ワールドカップ ホスト委員会の</span><a href=\"https://nynj.neurun.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">バーチャル コンシェルジュ</span></a><span style=\"vertical-align: baseline;\">に Google マップによるグラウンディングを統合しました。これにより、サッカーファンたちは数十か所の会場と交通拠点（「ブルックリン ファンゾーンから最寄りのピザ店までの道順」など）を結ぶリアルタイムかつマルチモーダルなルート案内をリクエストできるようになりました。このアシスタントは大会期間中、10 万人以上のユニーク ユーザーとやり取りし、交通やナビゲーションに関する質問はファンからの全問い合わせの 23% を占めました**。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">ワールドカップは、土地勘のない約 100 万人もの訪問者を地域に呼び込みます。NYNJ World Cup Concierge を利用すれば、目的地への行き方を尋ねるだけで、その日の現地の状況を反映した回答をワンストップで得ることができます。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Bruce Revman 氏</strong><br />\n                \n                \n                  FIFA ワールドカップ 26 ニューヨーク / ニュージャージー開催委員会、共同開催都市マネージャー\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Grounding with Google Maps-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Grounding_with_Google_Maps-3_ucLP6Rd.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">より迅速で正確なエージェント エクスペリエンスを構築</span></h3>\n<p><span style=\"vertical-align: baseline;\">お客様からのフィードバックに基づいて、Google マップによるグラウンディングのルート検索ツールの速度と精度を向上させ、これまで以上に使いやすくなるようアップデートしました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">高精度な運転ルートの算出: 最大 13 か所の経由地を設定した複雑なルートを計画し、出発時刻や到着時刻をカスタマイズして（「午後 5 時出発でロンドンからリッチモンドまで運転する場合の所要時間は？」など）、リアルタイムの交通情報を反映したより正確な運転時間を確認できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">詳細な場所属性による回答の充実: 非常に具体的なコンテキストから分析情報を取得し、場所に関する複雑なクエリへの回答や、混雑状況の傾向、雰囲気のラベル、設備のより詳細な説明、リアルタイムの EV / ガソリン価格といった詳細情報を提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini 3.7 Flash を使用して、よりスマートでセマンティックなルート検索機能を構築: 推論機能が向上し、曖昧な会話形式のクエリを解決できるようになりました（ロサンゼルス空港から出発する場合、「ユニオン駅」はロサンゼルス ユニオン駅を指すことを識別するなど）。</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">使ってみる</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google マップによるグラウンディングの新しいルート検索機能（経路案内とルート沿い検索）は、Agent Platform API と </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/grounding/grounding-with-google-maps\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</strong></a><span style=\"vertical-align: baseline;\"> の Agent Studio で今すぐご利用いただけます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://mapsplatform.google.com/demos/grounding-with-google-maps/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">インタラクティブなデモ</strong></a><span style=\"vertical-align: baseline;\">で機能を視覚的に確認できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/grounding/grounding-with-google-maps\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</strong></a><span style=\"vertical-align: baseline;\">の手順に沿って、Gemini Enterprise Agent Platform でルート検索機能の実装を開始できます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Grounding with Google Maps-4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Grounding_with_Google_Maps-4.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Agent Studio コンソールで Google マップのグラウンディング ソースとルート検索サブツールを構成する様子。（<a href=\"https://storage.googleapis.com/gweb-mobius-cdn/mapsplatform/uploads/706bbce601d2022233c7aa56a843bf162b1d4e26.mp4\">動画</a>）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">動的な旅行アシスタント、地域のショッピング ガイド、複雑なロジスティクス ルーティング ワークフローなど、Google マップによるグラウンディングを活用して皆様が構築するエージェント エクスペリエンスを拝見するのを楽しみにしています。</span></p>\n<p><sup><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">* Realtor.com 内部データ、2026 年</span></span></sup></p>\n<p><sup><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">** Neurun 内部データ、2026 年 8 月</span></span></sup></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">画面はシミュレーションです。機能と提供状況は異なる場合があります。ルートと場所の詳細は必ず個別に確認してください。</span></span></sup></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform 担当プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ju Tan</strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Google Cloud、シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Guangsha Shi</strong></p></div>"
  "efa8a64718abd00ece3ec81d36a76d4d":
    "id": "efa8a64718abd00ece3ec81d36a76d4d"
    "title": "デザインの自律性を実現: Navigation SDK のレイアウト カスタマイズ フレームワークについて"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/unlocking-design-autonomy-announcing-the-layout-customization-framework-for-navigation-sdk/"
    "published": "2026-09-02 10:00:00"
    "fetched": "2026-09-02 16:50:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 20 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/intl/ja_jp/resources/blog/unlocking-design-autonomy-announcing-the-layout-customization-framework-for-navigation-sdk/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">世界中のプロドライバーは、ハンドルを握るその一瞬一秒に迅速な判断を求められています。さまざまな地域の商用車を対象とした UX リサーチの結果、多くのデベロッパーが求めているのは、ブランドを反映しつつドライバー エクスペリエンスを向上させることができる、画一的なレイアウトではない柔軟なデザイン システムであることがわかりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">柔軟な UI フレームワークのニーズにお応えするため、このたび Navigation SDK にレイアウト カスタマイズ フレームワークを導入しました。このフレームワークが提供する革新的なレイアウト管理 UX パラダイムにより、開発チームは創造性を存分に発揮して、コンテキストに応じた最適なドライバー エクスペリエンスを構築できるようになります。このレイアウト カスタマイズ フレームワークの試験運用版の提供が、Android Navigation SDK で開始されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これまで、 Navigation SDK の UI フレームワークには、静的なアプリケーション ビューの中でしか動作しないという制約がありました。このたび導入した新しいフレームワークでは、Google のコア マッピング インターフェースと、デベロッパー アプリ独自のビジネス ワークフローという 2 つの異なるビジュアル レイヤをリアルタイムでオーケストレートすることができます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"Navigation SDK-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Navigation_SDK-1.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p><a href=\"https://storage.googleapis.com/gweb-mobius-cdn/mapsplatform/uploads/ad8ca1b5f4e2a4de8314180b906c53e85c041974.mp4\">デモ画面例</a></p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">ドライバーの認知負荷を軽減する</span></h3>\n<p><span style=\"vertical-align: baseline;\">運転中のドライバーの意識は、高速道路の案内や交通状況のトラブル、目的地への到着など、状況の変化に応じてめまぐるしく移り変わります。この新しいフレームワークは、一連のデジタル「ビルディング ブロック」を提供します。これにより、コンテンツ カード、制限速度インジケーター、フローティング コントロールなどをデベロッパーが自在に配置できるようになります。道路上の危険が検知されたときは、安全アラートが最優先で表示されます。一方、ドライバーが配達先に接近したらカスタムの配達確認シートを表示させ、次の配達を受け付けられるようにするといったスムーズなインターフェースの切り替えは、デベロッパーが自由にカスタマイズできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした主要なナビゲーション要素をモジュール化することで、デザインの自律性を実現しました。これにより、モバイルチームは独自のブランド アイデンティティを維持しながら、ドライバーが使い慣れている信頼性の高いターンバイターン方式の案内はそのままに、情報豊富な複数レイヤのレイアウトを構築できるようになりました。ドライバー ワークスペースの未来は、よりダイナミックでレスポンシブ、そして完全に統合されたものになります。Google は、この Navigation SDK のレイアウト カスタマイズ フレームワークにより、世界中のドライバーがわかりやすく、安全で、効率的な移動を実現できる機能を提供します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"Navigation SDK-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Navigation_SDK-2.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">レイアウト カスタマイズ フレームワークを使用すると、UI コンポーネントの位置をカメラの動きに連動させて、地図のビューポートを動的に調整することができます。画面に表示される UI 要素に合わせたカスタム制約を設定すれば、地図の視覚的中心を動的に調整可能です。これにより、ナビゲーション条件の変化に適応してインターフェースが調整されても、車両マーカーを常にフレーム内に収めてドライバーの視界から隠れないようにできます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">使ってみる</span></h3>\n<p><span style=\"vertical-align: baseline;\">Navigation SDK のレイアウト カスタマイズ フレームワークについて詳しくは、</span><a href=\"https://developers.google.com/maps/documentation/navigation/android-sdk/customize-layout?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android</span></a><span style=\"vertical-align: baseline;\"> 向けデベロッパー ドキュメントをご覧ください。サンプル デザイン テンプレートとレイアウト実装は、</span><a href=\"https://github.com/googlemaps-samples/android-navigation-samples/tree/main/navigation-sample\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\"> でお試しいただけます。また、Discord の </span><a href=\"https://discord.gg/GEVk7rnh5\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform デベロッパー フォーラム</span></a><span style=\"vertical-align: baseline;\">でのプロダクト チームや UX チームとの意見交換にぜひご参加ください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform、UX リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Rakhi Parekh</strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform、UX リサーチ、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Aakanksha Parameshwar</strong></p></div>"
