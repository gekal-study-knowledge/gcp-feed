    "title": "UPDATE: Multiple products in us-central1-b are experiencing network service degradation."
    "link": "https://status.cloud.google.com/incidents/J5ia5t9p3g9Q5Wi7r8Ev"
    "published": "2026-09-02 01:19:12"
    "fetched": "2026-09-02 02:09:36"
    "summary": "<p> Incident began at <strong>2026-09-01 07:44</strong> <span>(all times are <strong>US/Pacific</strong>).</span></p><div class=\"cBIRi14aVDP__status-update-text\"><p><strong>Summary</strong></p>\n<p>Multiple products in us-central1-b are experiencing network service degradation. </p>\n<p><strong>Description</strong></p>\n<p>We are experiencing a networking issue starting Tuesday, 2026-09-01 07:41 US/Pacific.</p>\n<p>The issue is affecting a portion of the us-central1-b zone. The remaining zones in the region are unaffected.</p>\n<p>Our network engineering team has put in mitigations and we are seeing services starting to recover.</p>\n<p>We will provide more information by Tuesday, 2026-09-01 09:30 US/Pacific with current details.</p>\n<p>We apologize to all who are affected by the disruption.</p>\n<p><strong>Customer Symptoms</strong></p>\n<p>Customers are experiencing elevated packet loss and errors.</p>\n<ul>\n<li>BigQuery</li>\n<li>Cloud Dataflow</li>\n<li>Cloud SQL</li>\n<li>App Engine</li>\n<li>Cloud Run</li>\n<li>AlloyDB</li>\n<li>Cloud Bigtable</li>\n<li>Cloud Spanner</li>\n<li>Compute Engine</li>\n<li>Cloud VPN</li>\n<li>Cloud Interconnect</li>\n<li>Cloud NAT</li>\n<li>Cloud Filestore</li>\n<li>Cloud Hybrid Connectivity</li>\n<li>Virtual Private Cloud</li>\n<li>Google Kubernetes Engine</li>\n<li>Looker (Google Cloud core)</li>\n</ul>\n<p><strong>Workaround</strong></p>\n<ul>\n<li>Customers with service layer retries may see successful completions as only a portion of the zone is affected.</li>\n<li>Customers that are severely affected and have services available in alternate zones can failover to alternate zones.</li>\n</ul>\n</div><hr /><p>Affected products: Google BigQuery, Google Cloud Dataflow, Google Cloud SQL, Hybrid Connectivity, Virtual Private Cloud (VPC)</p><p>Affected locations: Iowa (us-central1)</p>"
"last_updated": "2026-09-02 02:09:36 JST"
