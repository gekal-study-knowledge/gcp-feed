"entries":
  "4e167eacf3afb112758c9ef5778ea81e":
    "id": "4e167eacf3afb112758c9ef5778ea81e"
    "title": "Simplify pipelines with new BigQuery identity columns"
    "link": "https://cloud.google.com/blog/products/data-analytics/bigquery-identity-columns-to-auto-generate-sequential-integers/"
    "published": "2026-09-03 01:00:00"
    "fetched": "2026-09-03 02:00:15"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To further empower our customers in their data journey, we are excited to announce the launch of identity columns in BigQuery. This new feature allows users to define columns that automatically generate sequential 64-bit integer values, simplifying the way you manage unique identifiers within your tables.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data engineers are always looking for ways to make data ingestion smoother and more reliable. BigQuery identity columns offer a powerful, built-in mechanism to automatically generate unique numerical values for your tables. By shifting the responsibility of ID generation to BigQuery, you can significantly reduce the complexity of your data pipelines and focus on delivering insights.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key benefits for your data pipelines</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Implementing identity columns provides several advantages that help streamline the development and maintenance of your data architecture.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Streamlined ingestion</strong><span style=\"vertical-align: baseline;\">: You can now ingest data without needing to pre-calculate unique keys in your application logic or ETL tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduced boilerplate</strong><span style=\"vertical-align: baseline;\">: By using auto-generated sequences, your SQL code becomes cleaner and easier to maintain, as the database handles key management natively.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Integrated automation</strong><span style=\"vertical-align: baseline;\">: Identity columns work harmoniously with standard DML operations, ensuring that every new row receives a unique identifier automatically.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flexible integration</strong><span style=\"vertical-align: baseline;\">: Whether you are using </span><code style=\"vertical-align: baseline;\">INSERT</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">MERGE</code><span style=\"vertical-align: baseline;\"> statements, identity columns adapt to your existing workflow.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">How to implement identity columns</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Setting up an identity column is simple and can be done directly within your </span><code style=\"vertical-align: baseline;\">CREATE TABLE</code><span style=\"vertical-align: baseline;\"> statement. You have two primary ways to define how these values are handled.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Definition options</strong></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Clause</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Description</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">GENERATED ALWAYS AS IDENTITY</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery automatically manages and ensures the uniqueness of the values.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">GENERATED BY DEFAULT AS IDENTITY</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Provides an automatic value but still allows for manual overrides when necessary.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><strong style=\"vertical-align: baseline;\">Example usage<br /></strong><span style=\"vertical-align: baseline;\">The following SQL statement demonstrates how to create a table that automatically increments IDs, starting at 1 and increasing by one for each new entry.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE TABLE my_project.my_dataset.orders (\\r\\n  order_id INT64 GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1),\\r\\n  customer_name STRING,\\r\\n  order_date DATE\\r\\n);\\r\\n\\r\\n-- Ingesting data is now simpler:\\r\\nINSERT INTO my_project.my_dataset.orders (customer_name, order_date)\\r\\nVALUES (&#x27;Joe Doe&#x27;, CURRENT_DATE());&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fdffbd8b3a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Identity columns represent our ongoing commitment to providing a flexible, high-performance, and standards-compliant data platform. By automating the generation of surrogate keys, we are making it easier for you to build scalable and maintainable data architecture.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about how to implement this feature in your projects, please visit the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/identity-columns\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery identity columns documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "29e281eb90c76513c969f64337c0ebec":
    "id": "29e281eb90c76513c969f64337c0ebec"
    "title": "Getting started with Mantis, our open-source bug finding-and-fixing harness"
    "link": "https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs/"
    "published": "2026-09-03 01:00:00"
    "fetched": "2026-09-03 02:00:15"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI models have clearly proven their ability to discover and exploit vulnerabilities without much, if any, human assistance. To help defenders gain the advantage with AI, we built the Mantis harness to automate the discovery, triage, reproduction, and patching of software vulnerabilities. </span></p>\n<p><span style=\"vertical-align: baseline;\">Available to all as an open-source framework, Mantis is part of Google’s internal approach to find and fix vulnerabilities at machine-speed. It creates a more effective scalable, context-aware repository analysis. </span></p>\n<p><span style=\"vertical-align: baseline;\">While sloppiness in AI code scanning frequently leads to hallucinated bugs and weak true-positive rates under 7%, we designed Mantis to be effective by combining industry-standard agentic techniques like critic and review agents with sandboxed reproduction of vulnerabilities for grounding. </span></p>\n<p><span style=\"vertical-align: baseline;\">As we </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally/?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">detailed in June</span></a><span style=\"vertical-align: baseline;\">, it examines the history of the repository to learn from past security fixes and automatically builds up architectural and threat model documentation, even if these are not provided. </span></p>\n<p><span style=\"vertical-align: baseline;\">It constructs a hierarchical security summary tree, condensing individual files into directory and root-level summaries. This technique reduced token overhead by over 85%, while preserving critical structural context across massive repositories.</span></p>\n<p><span style=\"vertical-align: baseline;\">Mantis distills decades of cybersecurity expertise across a wide spectrum of codebases, and is </span><a href=\"https://github.com/google/mantis\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">available on GitHub</span></a><span style=\"vertical-align: baseline;\">. Here’s how you can get started using Mantis.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">First</strong><span style=\"vertical-align: baseline;\">, clone the Mantis repo locally using:</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;git clone https://github.com/google/mantis.git&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fdffba899d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Second</strong><span style=\"vertical-align: baseline;\">, open your </span><a href=\"https://antigravity.google/docs/enterprise/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">favorite coding agent</span></a><span style=\"vertical-align: baseline;\"> and use the prompt, “I would like to use Mantis framework in </span><code style=\"vertical-align: baseline;\">path/to/mantis</code><span style=\"vertical-align: baseline;\"> to review my code in </span><code style=\"vertical-align: baseline;\">path/to/your/code</code><span style=\"vertical-align: baseline;\">, can you help me get started?” </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Internally at Google, this exact prompt has been used to find real vulnerabilities across our many code repositories. As part of the Mantis repository on GitHub, we’ve included sample sandboxing options. You can also implement your own sandbox to match your own workflow.</span></p>\n<p><span style=\"vertical-align: baseline;\">Mantis is intended to be an easy place to start with vulnerability discovery, true positive filtering, and patching. Once you've got a handle on AI-discovered vulnerabilities, you can use the new </span><a href=\"https://github.com/google/mantis/blob/main/mantis-advise/SKILL.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">mantis-advise skill</span></a><span style=\"vertical-align: baseline;\"> to make use of the accumulated knowledge and get your coding agents to write secure code the first time.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get the most out of AI-driven vulnerability discovery and modernize your development practices, we strongly recommend two essential practices:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Feed your tools the right context</strong><span style=\"vertical-align: baseline;\">: While Mantis automatically analyzes commit history and code to build documentation for itself, human-curated knowledge often can dramatically improve the quality of your results. For example, if you would never waste time fixing bugs where the user can crash their own program, this is critical information for a scanning pipeline to ensure that those types of bugs are never surfaced.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a cyber sandbox with vulnerability acceptance criteria</strong><span style=\"vertical-align: baseline;\">. Safe, sandboxed environments where you can reproduce vulnerabilities with clear vulnerability-reproduction criteria will give you better results for surfacing only the things you need to know and also for ensuring that your fixes are correct.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">You can </span><a href=\"https://github.com/google/mantis/issues\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn more about Mantis here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "bdb46cc26144422785b15628421481dc":
    "id": "bdb46cc26144422785b15628421481dc"
    "title": "Google named a Leader in 2026 Gartner® Magic Quadrant™ for Strategic Cloud Platform Services"
    "link": "https://cloud.google.com/blog/products/compute/google-named-a-leader-in-2026-gartner-magic-quadrant-for-scps/"
    "published": "2026-09-03 16:30:00"
    "fetched": "2026-09-04 03:21:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For the ninth consecutive year, Gartner® has named Google a Leader in the </span><a href=\"https://cloud.google.com/resources/content/2026-gartner-magic-quadrant-strategic-cloud-platform-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gartner Magic Quadrant™ for Strategic Cloud Platform Services</span></a><span style=\"vertical-align: baseline;\">, positioned furthest for Completeness of Vision. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"scps-26\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/scps-26.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We believe this recognition reflects our longstanding dedication to helping customers build and scale their most demanding workloads reliably and securely on Google Cloud. As we enter the agentic era, we're accelerating their journeys with a dynamic infrastructure, and connecting enterprise apps, data and agents on a single, flexible platform for predictable cost and performance.</span></p>\n<p><strong style=\"vertical-align: baseline;\">What’s driving this momentum?</strong><span style=\"vertical-align: baseline;\"> There are three major advantages that we feel set Google Cloud apart:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A co-designed, unified technology stack</strong><span style=\"vertical-align: baseline;\"> across custom silicon and hardware systems, open software and orchestration, frontier models and agentic applications.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A dynamic infrastructure</strong><span style=\"vertical-align: baseline;\"> that helps you securely connect and scale your users, data, apps, and agents everywhere.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Digital sovereignty with genuine choice</strong><span style=\"vertical-align: baseline;\">, giving organizations total control over their data without sacrificing essential cloud functionality.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">We are committed to helping our customers innovate and deliver at scale while giving them the flexibility, performance, and control they need. Let’s dive into three design principles that Google Cloud lives by as we continue to build and enhance our infrastructure:</span></p>\n<h3><strong style=\"vertical-align: baseline;\">1. Accelerate AI with a co-designed stack without lock-in</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud is the only provider to deliver a complete, first-party AI stack that is deeply co-designed from silicon to agentic applications. Our infrastructure team works with Google DeepMind researchers to co-design and optimize every layer of our technology stack. From custom silicon, like Google TPUs and Arm-based Google Axion processors, to Google Kubernetes Engine (GKE) and Gemini models, our system delivers exceptional performance and predictable costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Co-designing hardware and software creates massive operational efficiency, but it doesn't mean creating a closed ecosystem. We remain deeply committed to open source and open standards across every layer of the stack including frameworks like llm-d for distributed inference, benchmarking for open models with GKE Prism, and eliminating hardware lock-in with TorchTPU for PyTorch compatibility across TPUs and GPUs. You get the full power of a vertically co-designed stack while maintaining complete freedom across models, frameworks, and silicon. Combining all of these deeply integrated components means building an </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\">, capable of exceptional scale, performance, and efficiency. This is the same infrastructure foundation chosen by nine of the top ten AI labs globally. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">2. Scale quickly and economically with a dynamic infrastructure</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Today, demand for AI resources is skyrocketing. Internally at Google, our data centers now process 3.2 quadrillion tokens monthly, roughly 7x more than last year<sup>1</sup></span><span style=\"vertical-align: baseline;\">. For enterprise leaders navigating this shift, scaling AI systems are notoriously difficult to architect, resource-intensive, and bursty, which can lead to scaling bottlenecks and large pools of underutilized compute. </span></p>\n<p><span style=\"vertical-align: baseline;\">Organizations need a dynamic infrastructure to automate capacity management, modernize business applications at their own pace, and securely connect data, apps, and agents to drive optimized global experiences. </span></p>\n<p><span style=\"vertical-align: baseline;\">To thrive at an agentic scale, you need infrastructure capable of operating as a single system. With Google Cloud, you can:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Kick-start your AI transformation </strong><span style=\"vertical-align: baseline;\">using Gemini-powered tools to intelligently </span><a href=\"https://docs.cloud.google.com/migration-center/docs/app-modernization-assessment\"><span style=\"text-decoration: underline; vertical-align: baseline;\">map and modernize core apps</span></a><span style=\"vertical-align: baseline;\">, turning static legacy systems into dynamic foundations for AI and agents.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Choose from a wide range of workload-optimized</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">compute</strong><span style=\"vertical-align: baseline;\"> types and configurations. You can combine predefined and custom CPU shapes, NVIDIA GPUs, and Google custom silicon (TPUs and Axion CPUs), which are designed to deliver exceptional performance-per-dollar for AI and Enterprise workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Connect your enterprise and AI infrastructure</strong><span style=\"vertical-align: baseline;\"> on a single, flexible control plane with Google Kubernetes Engine. This includes </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management\"><span style=\"text-decoration: underline; vertical-align: baseline;\">capacity management</span></a><span style=\"vertical-align: baseline;\"> capabilities like</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Dynamic Workload Scheduler to preschedule capacity for planned events and dynamic resource allocation to define advanced rules that dictate how resources are consumed, helping to maximize utilization and reduce costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simplify day two operations</strong><span style=\"vertical-align: baseline;\"> using </span><a href=\"https://cloud.google.com/products/gemini/cloud-assis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Cloud Assist</span></a><span style=\"vertical-align: baseline;\"> to proactively identify, troubleshoot, and resolve operational issues for your new agent-based workflows.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">And finally, run your workloads across hybrid and multicloud environments</strong><span style=\"vertical-align: baseline;\"> with </span><a href=\"https://cloud.google.com/solutions/cross-cloud-network\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cross-Cloud Interconnect</span></a><span style=\"vertical-align: baseline;\">, leveraging Google’s 10+ million kilometer private fiber backbone to deliver up to 40% higher performance than public internet routing and automated delivery in minutes<sup>2</sup>.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By adopting a unified foundation of dynamic infrastructure, adaptive applications, and responsive systems, organizations can establish the resilient, high-performance infrastructure necessary to lead in this new technological frontier.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">3. Embrace digital sovereignty with more choice and security</strong></h3>\n<p><span style=\"vertical-align: baseline;\">You shouldn’t have to compromise between modernization, frontier AI capabilities, and regulatory control. Sovereign Cloud from Google gives you access to Gemini and open-weight models across sovereign platforms with three flexible deployment options:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data sovereignty and control:</strong><span style=\"vertical-align: baseline;\"> Retain complete control over your data’s location and cryptographic authority with </span><strong style=\"vertical-align: baseline;\">Google Cloud Data Boundary</strong><span style=\"vertical-align: baseline;\">. Manage your encryption keys outside Google infrastructure using External Key Management (EKM) with Key Access Justifications (KAJ), while enforcing precise geographic processing and storage boundaries across both Google Cloud and Google Workspace.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Local compliance and regional operations:</strong><span style=\"vertical-align: baseline;\"> Run your applications on physically and logically separated regional clouds operated exclusively by local partners, built on </span><strong style=\"vertical-align: baseline;\">Google Cloud dedicated</strong><span style=\"vertical-align: baseline;\"> for European customers. In France, S3NS delivers PREMI3NS, providing a standalone sovereign cloud that has achieved the SecNumCloud 3.2 qualification from the French National Agency for the Security of Information Systems (ANSSI)</span><span style=\"vertical-align: baseline;\">. Dedicated sovereign cloud operations operated by Thales are also coming soon to Germany.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">On-premises and air-gapped flexibility:</strong><span style=\"vertical-align: baseline;\"> Bring Google Cloud capabilities directly to your on-premises environment via </span><strong style=\"vertical-align: baseline;\">Google Distributed Cloud (GDC)</strong><span style=\"vertical-align: baseline;\">. GDC offers two distinct deployment modes: </span><strong style=\"vertical-align: baseline;\">air-gapped</strong><span style=\"vertical-align: baseline;\">, a fully-managed, self-contained environment operating with zero connectivity to the public internet for public sector, defense, and regulated enterprise workloads; and connected, allowing you to run workloads on your hardware locally while leveraging Google Cloud’s centralized control plane for unified management. </span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Accelerate your Cloud journey</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you're modernizing core enterprise systems, managing complex compliance requirements, or deploying autonomous AI agents, Google Cloud gives you the performance, scale, and freedom of choice to succeed.</span></p>\n<p><span style=\"vertical-align: baseline;\">Read the full </span><a href=\"https://cloud.google.com/resources/content/2026-gartner-magic-quadrant-strategic-cloud-platform-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 Gartner Magic Quadrant for Strategic Cloud Platform Services</span></a><span style=\"vertical-align: baseline;\"> or explore our </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> page to learn more.</span></p>\n<hr />\n<p><sup><em>1. <span style=\"vertical-align: baseline;\">Pichai, Sundar. \"</span><a href=\"http://blog.google/innovation-and-ai/sundar-pichai-io-2026/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">I/O 2026: Welcome to the Agentic Gemini Era</span></a><span style=\"vertical-align: baseline;\">.\" The Keyword, Google, 19 May 2026 <br />2. <span style=\"vertical-align: baseline;\">During testing, network latency was more than 40% lower when traffic to a target traveled over the Cross-Cloud Network compared to when traffic to the same target traveled across the public internet.</span></span></em></sup></p></div>"
  "8ab9b9af44dd9499b31f8dfb7c09c4d6":
    "id": "8ab9b9af44dd9499b31f8dfb7c09c4d6"
    "title": "Announcing the Google Gen AI SDK for Kotlin 1.0: Idiomatic multiplatform access to Gemini"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/announcing-the-google-gen-ai-sdk-for-kotlin-10-idiomatic-multiplatform-access-to-gemini/"
    "published": "2026-09-03 09:00:00"
    "fetched": "2026-09-04 03:21:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Integrating modern generative AI capabilities into Kotlin applications shouldn't require juggling raw HTTP clients or bridging disparate Java libraries. Today, we're excited to announce the </span><strong style=\"vertical-align: baseline;\">1.0 release of the Google Gen AI SDK for Kotlin</strong><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">google-genai-kotlin</code><span style=\"vertical-align: baseline;\">). You can dive right into the code, explore runnable samples, and star the project today on </span><a href=\"https://github.com/googleapis/kotlin-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub at </span><code style=\"text-decoration: underline; vertical-align: baseline;\">googleapis/kotlin-genai</code></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Built from the ground up as a </span><strong style=\"vertical-align: baseline;\">Kotlin Multiplatform (KMP)</strong><span style=\"vertical-align: baseline;\"> library, the SDK brings idiomatic Kotlin paradigms (including first-class </span><strong style=\"vertical-align: baseline;\">Coroutines</strong><span style=\"vertical-align: baseline;\">, asynchronous </span><code style=\"vertical-align: baseline;\">Flow</code><span style=\"vertical-align: baseline;\"> streaming, and immutable data classes with named and default parameters) to developers targeting both the </span><strong style=\"vertical-align: baseline;\">JVM</strong><span style=\"vertical-align: baseline;\"> (backend services, serverless functions, desktop) and </span><strong style=\"vertical-align: baseline;\">Android</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">The SDK provides a unified surface to interact with both the </span><strong style=\"vertical-align: baseline;\">Gemini Developer API</strong><span style=\"vertical-align: baseline;\"> (Google AI Studio) and the </span><strong style=\"vertical-align: baseline;\">Gemini Enterprise Agent Platform</strong><span style=\"vertical-align: baseline;\"> (on Google Cloud) with minimal configuration tweaks.</span></p>\n<h2><span style=\"vertical-align: baseline;\">1. Getting started: Adding the dependency</span></h2>\n<p><span style=\"vertical-align: baseline;\">The SDK is published to Maven Central under </span><code style=\"vertical-align: baseline;\">com.google.genai:google-genai-kotlin</code><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Kotlin Multiplatform (KMP)</span></h3>\n<p><span style=\"vertical-align: baseline;\">For multiplatform applications, add the dependency to your </span><code style=\"vertical-align: baseline;\">commonMain</code><span style=\"vertical-align: baseline;\"> source set:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// build.gradle.kts\\r\\nkotlin {\\r\\n    sourceSets {\\r\\n        commonMain.dependencies {\\r\\n            implementation(&quot;com.google.genai:google-genai-kotlin:1.0.0&quot;)\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3242c040&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Standard JVM or Android projects</span></h3>\n<p><span style=\"vertical-align: baseline;\">For single-platform Kotlin projects, Gradle automatically selects the optimal variant via Gradle Module Metadata:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// build.gradle.kts\\r\\ndependencies {\\r\\n    implementation(&quot;com.google.genai:google-genai-kotlin:1.0.0&quot;)\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3242c6a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">2. Unary and streaming text generation and chat</span></h2>\n<p><span style=\"vertical-align: baseline;\">The primary entry point is the </span><code style=\"vertical-align: baseline;\">Client</code><span style=\"vertical-align: baseline;\"> class. It manages HTTP connections and authentication automatically based on your environment variables (</span><code style=\"vertical-align: baseline;\">GEMINI_API_KEY</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">GOOGLE_API_KEY</code><span style=\"vertical-align: baseline;\"> for Google AI Studio, and </span><code style=\"vertical-align: baseline;\">GOOGLE_GENAI_USE_ENTERPRISE=true</code><span style=\"vertical-align: baseline;\"> with standard Google Cloud Application Default Credentials).</span></p>\n<h3><span style=\"vertical-align: baseline;\">Single prompt request with Gemini Flash</span></h3>\n<p><span style=\"vertical-align: baseline;\">Using Kotlin's </span><code style=\"vertical-align: baseline;\">use</code><span style=\"vertical-align: baseline;\"> extension ensures the client's underlying network engine and HTTP connections are released cleanly:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val response = client.models.generateContent(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            text = &quot;Explain quantum entanglement in two sentences.&quot;\\r\\n        )\\r\\n\\r\\n        println(response.text)\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016cbe0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Low-latency streaming with Coroutines </span><code style=\"vertical-align: baseline;\">Flow</code></h3>\n<p><span style=\"vertical-align: baseline;\">For interactive UIs and responsive CLI tools, </span><code style=\"vertical-align: baseline;\">generateContentStream</code><span style=\"vertical-align: baseline;\"> returns a cold Kotlin Coroutine </span><code style=\"vertical-align: baseline;\">Flow&lt;GenerateContentResponse&gt;</code><span style=\"vertical-align: baseline;\">, delivering token chunks in real time:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val responseFlow = client.models.generateContentStream(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            text = &quot;Outline the key architectural patterns for microservices on Google Cloud.&quot;\\r\\n        )\\r\\n\\r\\n        responseFlow.collect { chunk -&gt;\\r\\n            chunk.text?.let { print(it) }\\r\\n        }\\r\\n        println()\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016ce20&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Multi-turn conversations (chat)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Managing conversation history manually across request turns can become tedious. The SDK includes a dedicated </span><code style=\"vertical-align: baseline;\">chats</code><span style=\"vertical-align: baseline;\"> service that automatically maintains context, appends turns, formats conversation history, and handles function calling:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport com.google.genai.kotlin.types.Content\\r\\nimport com.google.genai.kotlin.types.GenerateContentConfig\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val config = GenerateContentConfig(\\r\\n            systemInstruction = Content.fromText(&quot;You are an expert Google Cloud Solutions Architect.&quot;)\\r\\n        )\\r\\n\\r\\n        // Create a multi-turn chat session\\r\\n        val chat = client.chats.create(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            config = config\\r\\n        )\\r\\n\\r\\n        // Turn 1\\r\\n        val firstResponse = chat.sendMessage(&quot;We are designing an event-driven ingestion pipeline on Google Cloud.&quot;)\\r\\n        println(&quot;Gemini: ${firstResponse.text}\\\\n&quot;)\\r\\n\\r\\n        // Turn 2: context from the first turn is included automatically\\r\\n        val secondResponse = chat.sendMessage(&quot;Which managed messaging service should we choose: Pub/Sub or Kafka?&quot;)\\r\\n        println(&quot;Gemini: ${secondResponse.text}\\\\n&quot;)\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016cd30&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">You can also use </span><code style=\"vertical-align: baseline;\">chat.sendMessageStream(...)</code><span style=\"vertical-align: baseline;\"> for streaming multi-turn chat responses.</span></p>\n<h2><span style=\"vertical-align: baseline;\">3. Multimodal analysis grounded with Google Search</span></h2>\n<p><span style=\"vertical-align: baseline;\">Gemini's multimodal reasoning is especially effective when combined with external verification. For instance, when analyzing technical, medical, or scientific diagrams, you can attach </span><strong style=\"vertical-align: baseline;\">Google Search Grounding</strong><span style=\"vertical-align: baseline;\"> to cross-check factual claims against live web sources.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport com.google.genai.kotlin.types.*\\r\\nimport java.io.File\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val imageBytes = File(&quot;src/main/resources/medical_diagram.png&quot;).readBytes()\\r\\n\\r\\n        val content = Content(\\r\\n            parts = listOf(\\r\\n                Part(inlineData = Blob(mimeType = &quot;image/png&quot;, data = imageBytes)),\\r\\n                Part(text = &quot;Is this anatomical diagram accurate? Verify labels against authoritative medical sources.&quot;)\\r\\n            )\\r\\n        )\\r\\n\\r\\n        // Enable Google Search as a grounding tool\\r\\n        val config = GenerateContentConfig(\\r\\n            tools = listOf(Tool(googleSearch = GoogleSearch()))\\r\\n        )\\r\\n\\r\\n        val response = client.models.generateContent(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            content = content,\\r\\n            config = config\\r\\n        )\\r\\n\\r\\n        println(&quot;=== Analysis ===&quot;)\\r\\n        println(response.text)\\r\\n\\r\\n        // Inspect citations and search queries\\r\\n        val grounding = response.groundingMetadata\\r\\n        println(&quot;\\\\n=== Search Queries Executed ===&quot;)\\r\\n        grounding?.webSearchQueries?.forEach { println(&quot;- $it&quot;) }\\r\\n\\r\\n        println(&quot;\\\\n=== Grounding Sources ===&quot;)\\r\\n        grounding?.groundingChunks?.mapNotNull { it.web }?.forEach { source -&gt;\\r\\n            println(&quot;- ${source.title}: ${source.uri}&quot;)\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016cc10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">4. Visual generation and conversational editing: The Gemini 3 image family</span></h2>\n<p><span style=\"vertical-align: baseline;\">The SDK provides full support for Google's latest image generation models (popularly known as the </span><span style=\"font-style: italic; vertical-align: baseline;\">Nano Banana</span><span style=\"vertical-align: baseline;\"> series of models on leaderboards).</span></p>\n<h3><span style=\"vertical-align: baseline;\">Generating and Saving an Image</span></h3>\n<p><span style=\"vertical-align: baseline;\">Generated image bytes are delivered directly in the response parts as a </span><code style=\"vertical-align: baseline;\">Blob</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport java.io.File\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val response = client.models.generateContent(\\r\\n            model = &quot;gemini-3.1-flash-image&quot;, // Nano Banana 2\\r\\n            text = &quot;A photorealistic blueprint of an eco-friendly modern datacenter, isometric view, 4k&quot;\\r\\n        )\\r\\n\\r\\n        val imagePart = response.parts?.firstOrNull { it.inlineData != null }\\r\\n        imagePart?.inlineData?.data?.let { bytes -&gt;\\r\\n            File(&quot;datacenter_blueprint.png&quot;).writeBytes(bytes)\\r\\n            println(&quot;Image generated and saved successfully.&quot;)\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016c3a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Conversational image-to-image editing</span></h3>\n<p><span style=\"vertical-align: baseline;\">You can pass existing images and conversational edit instructions in the same request:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;val originalImage = File(&quot;input.png&quot;).readBytes()\\r\\n\\r\\nval editPrompt = Content(\\r\\n    parts = listOf(\\r\\n        Part(inlineData = Blob(mimeType = &quot;image/png&quot;, data = originalImage)),\\r\\n        Part(text = &quot;Change the daylight illumination to a dramatic twilight skyline with illuminated windows.&quot;)\\r\\n    )\\r\\n)\\r\\n\\r\\nval editResponse = client.models.generateContent(\\r\\n    model = &quot;gemini-3-pro-image&quot;, // Nano Banana Pro\\r\\n    content = editPrompt\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016c5b0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">5. Real-time bidirectional interaction with Gemini Live</span></h2>\n<p><span style=\"vertical-align: baseline;\">For low-latency voice, audio, and live multimodal interactions, the SDK supports the </span><strong style=\"vertical-align: baseline;\">Gemini Live API</strong><span style=\"vertical-align: baseline;\"> via persistent WebSocket connections using </span><code style=\"vertical-align: baseline;\">client.live.connect(...)</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport com.google.genai.kotlin.types.AudioTranscriptionConfig\\r\\nimport com.google.genai.kotlin.types.LiveConnectConfig\\r\\nimport kotlinx.coroutines.launch\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val model = if (client.enterprise) &quot;gemini-live-2.5-flash-native-audio&quot;\\r\\n                    else &quot;gemini-3.1-flash-live-preview&quot;\\r\\n\\r\\n        val config = LiveConnectConfig(\\r\\n            outputAudioTranscription = AudioTranscriptionConfig()\\r\\n        )\\r\\n\\r\\n        // Establish real-time bidirectional WebSocket session\\r\\n        client.live.connect(model, config).use { session -&gt;\\r\\n            println(&quot;Connected to Gemini Live session!&quot;)\\r\\n\\r\\n            // Launch collector for server messages (audio and text transcriptions)\\r\\n            val receiveJob = launch {\\r\\n                session.receive().collect { serverMessage -&gt;\\r\\n                    serverMessage.serverContent?.outputTranscription?.text?.let { text -&gt;\\r\\n                        print(text)\\r\\n                    }\\r\\n                }\\r\\n            }\\r\\n\\r\\n            // Stream real-time text (or raw PCM audio blobs via session.sendRealtimeInput(audio = ...))\\r\\n            session.sendRealtimeInput(text = &quot;Hello Gemini! Give me a 5-second motivational quote.&quot;)\\r\\n\\r\\n            // When finished, clean up\\r\\n            receiveJob.cancel()\\r\\n            session.closeSession()\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016c2e0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">6. Structured tool and function calling</span></h2>\n<p><span style=\"vertical-align: baseline;\">When building agentic workflows or bridging LLMs with backend microservices, developers can pass structured JSON schemas via </span><code style=\"vertical-align: baseline;\">FunctionDeclaration</code><span style=\"vertical-align: baseline;\">. The model will intelligently select when to invoke the tool:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;val telemetryTool = FunctionDeclaration(\\r\\n    name = &quot;getDatacenterMetrics&quot;,\\r\\n    description = &quot;Fetch real-time CPU and thermal telemetry for a Google Cloud region&quot;,\\r\\n    parameters = Schema(\\r\\n        type = Type.OBJECT,\\r\\n        properties = mapOf(&quot;region&quot; to Schema(type = Type.STRING)),\\r\\n        required = listOf(&quot;region&quot;)\\r\\n    )\\r\\n)\\r\\n\\r\\nval response = client.models.generateContent(\\r\\n    model = &quot;gemini-flash-latest&quot;,\\r\\n    text = &quot;Check telemetry for europe-west1&quot;,\\r\\n    config = GenerateContentConfig(\\r\\n        tools = listOf(Tool(functionDeclarations = listOf(telemetryTool)))\\r\\n    )\\r\\n)\\r\\n\\r\\nresponse.functionCalls?.firstOrNull()?.let { call -&gt;\\r\\n    println(&quot;Model triggered tool: ${call.name} with arguments: ${call.args}&quot;)\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016c6a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Additionally, when using the chats service, you can take advantage of Automatic Function Calling (AFC), which means that functions declared in the chat conversation can be invoked automatically and transparently by the SDK on your behalf, as you can see in the following example:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;fun main() = runBlocking {\\r\\n    // A mocked function\\r\\n    val getWeather = callableFunction(&quot;get_weather&quot;, paramName = &quot;city&quot;) { city: String -&gt;\\r\\n        &quot;18 degrees and sunny in $city&quot;\\r\\n    }\\r\\n\\r\\n    Client().use { client -&gt;\\r\\n        val chat = client.chats.create(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            automaticFunctionCalling = AutomaticFunctionCalling(getWeather),\\r\\n        )\\r\\n\\r\\n        // SDK calls get_weather if needed in this conversation\\r\\n        println(chat.sendMessage(&quot;What is the weather in Zurich?&quot;).text)\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1f3016cca0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">What's next?</span></h2>\n<p><span style=\"vertical-align: baseline;\">With the 1.0 release of the Google Gen AI SDK for Kotlin, Kotlin developers across backend server ecosystems (Ktor, Spring Boot, Quarkus, Micronaut) and mobile applications now have a clean, multiplatform foundation for building generative AI applications.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more and get started, check out the following resources:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GitHub Repository:</strong><span style=\"vertical-align: baseline;\"> Check out the source, stars, and discussions at </span><a href=\"https://github.com/googleapis/kotlin-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">github.com/googleapis/kotlin-genai</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Documentation and Samples:</strong><span style=\"vertical-align: baseline;\"> Explore the </span><a href=\"https://github.com/googleapis/kotlin-genai/tree/main/examples\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kotlin Gen AI sample suite</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Feedback:</strong><span style=\"vertical-align: baseline;\"> File issues, suggest features, or submit pull requests directly on </span><a href=\"https://github.com/googleapis/kotlin-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">We look forward to seeing what you build with Kotlin and Gemini!</span></p></div>"
