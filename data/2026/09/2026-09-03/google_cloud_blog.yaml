  "4e167eacf3afb112758c9ef5778ea81e":
    "id": "4e167eacf3afb112758c9ef5778ea81e"
    "title": "Simplify pipelines with new BigQuery identity columns"
    "link": "https://cloud.google.com/blog/products/data-analytics/bigquery-identity-columns-to-auto-generate-sequential-integers/"
    "published": "2026-09-03 01:00:00"
    "fetched": "2026-09-03 02:00:15"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To further empower our customers in their data journey, we are excited to announce the launch of identity columns in BigQuery. This new feature allows users to define columns that automatically generate sequential 64-bit integer values, simplifying the way you manage unique identifiers within your tables.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data engineers are always looking for ways to make data ingestion smoother and more reliable. BigQuery identity columns offer a powerful, built-in mechanism to automatically generate unique numerical values for your tables. By shifting the responsibility of ID generation to BigQuery, you can significantly reduce the complexity of your data pipelines and focus on delivering insights.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key benefits for your data pipelines</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Implementing identity columns provides several advantages that help streamline the development and maintenance of your data architecture.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Streamlined ingestion</strong><span style=\"vertical-align: baseline;\">: You can now ingest data without needing to pre-calculate unique keys in your application logic or ETL tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduced boilerplate</strong><span style=\"vertical-align: baseline;\">: By using auto-generated sequences, your SQL code becomes cleaner and easier to maintain, as the database handles key management natively.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Integrated automation</strong><span style=\"vertical-align: baseline;\">: Identity columns work harmoniously with standard DML operations, ensuring that every new row receives a unique identifier automatically.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flexible integration</strong><span style=\"vertical-align: baseline;\">: Whether you are using </span><code style=\"vertical-align: baseline;\">INSERT</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">MERGE</code><span style=\"vertical-align: baseline;\"> statements, identity columns adapt to your existing workflow.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">How to implement identity columns</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Setting up an identity column is simple and can be done directly within your </span><code style=\"vertical-align: baseline;\">CREATE TABLE</code><span style=\"vertical-align: baseline;\"> statement. You have two primary ways to define how these values are handled.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Definition options</strong></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Clause</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Description</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">GENERATED ALWAYS AS IDENTITY</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery automatically manages and ensures the uniqueness of the values.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">GENERATED BY DEFAULT AS IDENTITY</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Provides an automatic value but still allows for manual overrides when necessary.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><strong style=\"vertical-align: baseline;\">Example usage<br /></strong><span style=\"vertical-align: baseline;\">The following SQL statement demonstrates how to create a table that automatically increments IDs, starting at 1 and increasing by one for each new entry.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE TABLE my_project.my_dataset.orders (\\r\\n  order_id INT64 GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1),\\r\\n  customer_name STRING,\\r\\n  order_date DATE\\r\\n);\\r\\n\\r\\n-- Ingesting data is now simpler:\\r\\nINSERT INTO my_project.my_dataset.orders (customer_name, order_date)\\r\\nVALUES (&#x27;Joe Doe&#x27;, CURRENT_DATE());&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fdffbd8b3a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Identity columns represent our ongoing commitment to providing a flexible, high-performance, and standards-compliant data platform. By automating the generation of surrogate keys, we are making it easier for you to build scalable and maintainable data architecture.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about how to implement this feature in your projects, please visit the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/identity-columns\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery identity columns documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "29e281eb90c76513c969f64337c0ebec":
    "id": "29e281eb90c76513c969f64337c0ebec"
    "title": "Getting started with Mantis, our open-source bug finding-and-fixing harness"
    "link": "https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs/"
    "published": "2026-09-03 01:00:00"
    "fetched": "2026-09-03 02:00:15"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI models have clearly proven their ability to discover and exploit vulnerabilities without much, if any, human assistance. To help defenders gain the advantage with AI, we built the Mantis harness to automate the discovery, triage, reproduction, and patching of software vulnerabilities. </span></p>\n<p><span style=\"vertical-align: baseline;\">Available to all as an open-source framework, Mantis is part of Google’s internal approach to find and fix vulnerabilities at machine-speed. It creates a more effective scalable, context-aware repository analysis. </span></p>\n<p><span style=\"vertical-align: baseline;\">While sloppiness in AI code scanning frequently leads to hallucinated bugs and weak true-positive rates under 7%, we designed Mantis to be effective by combining industry-standard agentic techniques like critic and review agents with sandboxed reproduction of vulnerabilities for grounding. </span></p>\n<p><span style=\"vertical-align: baseline;\">As we </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally/?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">detailed in June</span></a><span style=\"vertical-align: baseline;\">, it examines the history of the repository to learn from past security fixes and automatically builds up architectural and threat model documentation, even if these are not provided. </span></p>\n<p><span style=\"vertical-align: baseline;\">It constructs a hierarchical security summary tree, condensing individual files into directory and root-level summaries. This technique reduced token overhead by over 85%, while preserving critical structural context across massive repositories.</span></p>\n<p><span style=\"vertical-align: baseline;\">Mantis distills decades of cybersecurity expertise across a wide spectrum of codebases, and is </span><a href=\"https://github.com/google/mantis\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">available on GitHub</span></a><span style=\"vertical-align: baseline;\">. Here’s how you can get started using Mantis.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">First</strong><span style=\"vertical-align: baseline;\">, clone the Mantis repo locally using:</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;git clone https://github.com/google/mantis.git&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fdffba899d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Second</strong><span style=\"vertical-align: baseline;\">, open your </span><a href=\"https://antigravity.google/docs/enterprise/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">favorite coding agent</span></a><span style=\"vertical-align: baseline;\"> and use the prompt, “I would like to use Mantis framework in </span><code style=\"vertical-align: baseline;\">path/to/mantis</code><span style=\"vertical-align: baseline;\"> to review my code in </span><code style=\"vertical-align: baseline;\">path/to/your/code</code><span style=\"vertical-align: baseline;\">, can you help me get started?” </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Internally at Google, this exact prompt has been used to find real vulnerabilities across our many code repositories. As part of the Mantis repository on GitHub, we’ve included sample sandboxing options. You can also implement your own sandbox to match your own workflow.</span></p>\n<p><span style=\"vertical-align: baseline;\">Mantis is intended to be an easy place to start with vulnerability discovery, true positive filtering, and patching. Once you've got a handle on AI-discovered vulnerabilities, you can use the new </span><a href=\"https://github.com/google/mantis/blob/main/mantis-advise/SKILL.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">mantis-advise skill</span></a><span style=\"vertical-align: baseline;\"> to make use of the accumulated knowledge and get your coding agents to write secure code the first time.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get the most out of AI-driven vulnerability discovery and modernize your development practices, we strongly recommend two essential practices:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Feed your tools the right context</strong><span style=\"vertical-align: baseline;\">: While Mantis automatically analyzes commit history and code to build documentation for itself, human-curated knowledge often can dramatically improve the quality of your results. For example, if you would never waste time fixing bugs where the user can crash their own program, this is critical information for a scanning pipeline to ensure that those types of bugs are never surfaced.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a cyber sandbox with vulnerability acceptance criteria</strong><span style=\"vertical-align: baseline;\">. Safe, sandboxed environments where you can reproduce vulnerabilities with clear vulnerability-reproduction criteria will give you better results for surfacing only the things you need to know and also for ensuring that your fixes are correct.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">You can </span><a href=\"https://github.com/google/mantis/issues\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn more about Mantis here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
