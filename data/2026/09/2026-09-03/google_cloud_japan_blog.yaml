"entries":
  "13afabce5384301d91e182f0974852bc":
    "id": "13afabce5384301d91e182f0974852bc"
    "title": "Cloud Run インスタンスを使用したパーソナル AI エージェントのデプロイ"
    "link": "https://cloud.google.com/blog/ja/products/serverless/introducing-cloud-run-instances/"
    "published": "2026-09-03 11:30:00"
    "fetched": "2026-09-03 14:35:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 28 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/serverless/introducing-cloud-run-instances?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントなどの長期稼働型ステートフル ワークロードを、低コストかつ高パフォーマンスで実行する方法をお探しですか？このたび、Cloud Run インスタンスが導入され、まさにそれが可能になりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">個人開発者や個人利用を想定した </span><a href=\"https://github.com/openclaw/openclaw\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenClaw</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"https://github.com/nousresearch/hermes-agent\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hermes</span></a><span style=\"vertical-align: baseline;\"> などの AI エージェントについて考えてみてください。これらのエージェントは多くの場合、常時稼働し、一度に 1 人のユーザーのみに対応する傾向があります。そのため、Cloud Run サービスで一般的に実行されるステートレスで高スループットなウェブサービスとは、インフラストラクチャ要件が大きく異なります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Run サービスはリクエストが止まるとゼロにスケールされるため、常に 1 つのインスタンスを継続的に稼働させる必要がある長期稼働型エージェントには適していません。一方、専用 VM を実行するという代替手段では、24 時間 365 日フルでコンピューティング料金が発生するほか、オペレーティング システムのアップデート管理、ファイアウォール ポートの開放、独自の HTTPS エンドポイントのプロビジョニングなども自分で行う必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Run インスタンスは、Cloud Run 上に専用のシングルトン コンピューティング ランタイムを提供します。次のような特徴があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">自動スケーリングなしで 1 つのインスタンスのみを実行</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">最大 7 日間の連続稼働が可能（デフォルトで自動再起動ポリシーを構成済み）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">すべてのインスタンスに HTTPS URL が割り当てられ、更新や再起動を行っても変更されない</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">各インスタンスは、使用していないときは停止し、必要なときにいつでも再開できる</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">1 個の vCPU と 1 GiB のメモリを備えた Cloud Run インスタンスを 30 日間継続して実行する費用は </span><strong style=\"vertical-align: baseline;\">$5.70</strong><span style=\"vertical-align: baseline;\"> です。Cloud Run インスタンスは、vCPU バースト予算を備えた共有 vCPU を使用することで、予測可能な低料金で継続的に稼働します。このモデルは、常に高いコンピューティング負荷がかかるわけではなく、タスク実行時のみ使用量が急増するような、長期稼働型エージェントにも最適です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">例: Cloud Run インスタンスに OpenClaw をデプロイする</strong></h4>\n<p><span style=\"vertical-align: baseline;\">OpenClaw は、ユーザーに代わってさまざまなタスクを実行し、時間の経過とともにさらに優れたアシスタントへと成長する、オープンソースのパーソナル AI エージェントです。OpenClaw ユーザーの多くは、最初は自分のノートパソコンで使い始めますが、パソコンがスリープ状態になるたびに OpenClaw が終了してしまわないよう、別の実行場所が必要であることにやがて気づきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">OpenClaw を Cloud Run インスタンスにデプロイするのは簡単です。OpenClaw の構成ファイルを Cloud Storage バケットにアップロードしたら、1 つのコマンドだけで OpenClaw エージェントを Cloud Run インスタンスにデプロイできます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud beta run instances create openclaw-instance \\\\\\r\\n  --image ghcr.io/openclaw/openclaw:latest \\\\\\r\\n  --port 18789 \\\\\\r\\n  --public \\\\\\r\\n  --add-volume mount-path=/home/node/.openclaw,type=cloud-storage,mount-options=&quot;uid=1000;gid=1000;file-mode=0700;dir-mode=0700&quot;,bucket=${BUCKET} \\\\\\r\\n  --set-env-vars &quot;OPENCLAW_GATEWAY_PASSWORD=${PASSWORD},GEMINI_API_KEY=${GEMINI_API_KEY}&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fa45e24f6a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">デプロイ後は、この OpenClaw インスタンスを好きなだけ実行し続けることができます。Telegram、WhatsApp、お好みのソーシャル メディア プラットフォームを介してやり取りでき、使用したいツールに接続することもできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">OpenClaw をデプロイする方法の詳細については、</span><a href=\"https://codelabs.developers.google.com/codelabs/cloud-run/deploy-openclaw-cloud-run-instances\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらの Codelab</span></a><span style=\"vertical-align: baseline;\"> をご覧ください。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Run インスタンスと Cloud Run サービスの両方で、SSH アクセスの提供も近日中に開始される予定です。限定公開アクセスには</span><a href=\"https://forms.gle/cX12NZqie3f7kNjh7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">からご登録いただけます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">お客様の声</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Cloud Run インスタンスを活用することで、Google Cloud ユーザーは AI エージェントなどの長期稼働型ワークロードを、低コストかつ高パフォーマンスで運用できるようになります。</span></p>\n<p><a href=\"https://offdeal.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OffDeal</span></a><span style=\"vertical-align: baseline;\"> は、小規模企業向けの AI を活用した投資銀行で、Cloud Run インスタンス上で長期稼働型エージェントを運用しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「現在、長時間実行されるエージェントの主要なインフラストラクチャとして Cloud Run インスタンスを使用しており、コールド スタートを 88% 削減できました。すべてが非常に簡単に実装でき、信頼性も極めて安定しています。」- OffDeal、技術スタッフ メンバー、Luis Ruiz Morel 氏</span></p>\n<h4><strong style=\"vertical-align: baseline;\">詳細</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現在プレビュー版の Cloud Run インスタンスは、パフォーマンスを犠牲にすることなく新しい種類のワークロードを実行できる費用対効果の高い方法です。Cloud Run インスタンスの詳細については、次のリソースをご覧ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/codelabs/cloud-run/deploy-openclaw-cloud-run-instances\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenClaw を Cloud Run インスタンスにデプロイする方法</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/run/docs/instances/create-and-manage-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run インスタンスのドキュメント</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ryan Pei</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Matthew Robertson</strong></p></div>"
  "68516017265bc8131eb060b59271e4ae":
    "id": "68516017265bc8131eb060b59271e4ae"
    "title": "AI インフラストラクチャの動的容量管理"
    "link": "https://cloud.google.com/blog/ja/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management/"
    "published": "2026-09-03 11:00:00"
    "fetched": "2026-09-03 14:35:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 27 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">インターネットによって数十億の人々とモバイル デバイスがつながり、今や誰もがコンピュータを手にしています。現在、私たちは次なる大きなテクノロジー シフトの真っ只中にいます。そこでは、何百万もの自律型 AI エージェントがデプロイされ、従業員やエンドユーザーとともに働くようになっています。このたび、Google は組織がプロジェクト レベルで AI 費用を管理し、トークン ショックを解消できるよう、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise の新しい FinOps コントロール</span></a><span style=\"vertical-align: baseline;\">を発表しました。しかし、エージェント時代の圧倒的なスケールは、インフラストラクチャを含むスタックのあらゆるレイヤに新たな制約をもたらしています。AI ワークロードは、設計の難しさ、リソース消費の激しさ、そしてバースト性があることで知られています。これらはスケーリングのボトルネックを招くだけでなく、十分に活用されない（または誤用される）コンピューティング リソースを大量に発生させる原因にもなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">組織は、インフラストラクチャへの投資からさらなる価値を引き出すための分析情報を必要としています。</span><strong style=\"vertical-align: baseline;\">このブログ記事では、動的容量管理</strong><span style=\"vertical-align: baseline;\">のベスト プラクティスについて説明します。これは、コストとパフォーマンスの予測可能性を維持しながら、単一の柔軟な基盤上でエンタープライズ アプリケーションと AI アプリケーションを実行できるようにするための、スケジューリングと利用の戦略です。これらの機能は、オンデマンド、Spot、確約利用割引（CUD）といった使用量モデルを強化するように設計されており、ワークロードに応じた柔軟な料金設定と割引を提供します。それでは詳しく見ていきましょう。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">概要</strong></h4>\n<p><span style=\"vertical-align: baseline;\">動的容量管理を実装する 3 つの方法:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">計画されたイベントの容量をスケジュールする。</strong><span style=\"vertical-align: baseline;\">Dynamic Workload Scheduler の</span><a href=\"https://docs.cloud.google.com/compute/docs/instances/future-reservations-calendar-mode-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">カレンダー モード</span></a><span style=\"vertical-align: baseline;\">を使用して、計画されたイベントに先立ってミッション クリティカルなリソース（GPU、TPU、特定の VM ファミリー）をスケジュールしたり、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dws\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Flex Start</span></a><span style=\"vertical-align: baseline;\"> モードを使用して、開始時間が柔軟なバッチジョブの費用を最適化したりできます。容量が確保されると、指定した期間、それらのリソースが保証されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">すべてのアプリケーションのフォールバック計画を作成して、サービスの継続性を維持する。</strong><a href=\"https://docs.cloud.google.com/compute/docs/instance-groups/about-instance-flexibility\"><span style=\"text-decoration: underline; vertical-align: baseline;\">マネージド インスタンス グループ</span></a><span style=\"vertical-align: baseline;\">（MIG）を使用して、優先順位に基づいたハードウェアの自動フォールバック リストを定義します。これにより、希望するオプションが利用できない場合でも、アプリが次の承認済みコンピューティング オプションに自動的に切り替わるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">単一の適応型コントロール プレーンで、容量管理のライフサイクル全体を自動化する。</strong><span style=\"vertical-align: baseline;\">Google Kubernetes Engine（GKE）は、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-custom-compute-classes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">カスタム ComputeClass</span></a><span style=\"vertical-align: baseline;\"> を使用したフォールバック リストから、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-dynamic-resource-allocation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">動的リソース割り当て</span></a><span style=\"vertical-align: baseline;\">を通じたきめ細かいハードウェア スライスまで、プロセス全体をオーケストレートするエージェント ネイティブ環境を提供します。これにより、リソースを即座に再割り当てしながら、安全なサンドボックスやコンテナ内でエージェントを迅速にスピンアップすることが可能になります。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">アーキテクチャの柔軟性が重要な理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">企業の 90% が今後 3 年以内にエージェントを導入したいと考えていますが、現在の IT 環境でその負荷を処理できると確信している IT リーダーはわずか 17% に留まっています。これらのワークロードには独自のパフォーマンス ニーズがあるため、各組織はアクセラレータ（GPU、TPU）や、コンピューティング・メモリ・ストレージの比率をカスタマイズした CPU といった専用インフラストラクチャの導入を急ピッチで進めています。しかし、エージェントはエンタープライズ アプリケーションやデータベースにもアクセスする必要があります。しかもそのアクセス量やスケールは、人間による通常の使用をはるかに凌駕することが少なくありません。エージェントとエージェントがやり取りするアプリケーションの両方からの大きな需要に対応するには、動的なインフラストラクチャが必要です。インフラストラクチャ チームは、Google の Axion のようなカスタム設計のプロセッサを活用してこれらのニーズを満たすことができますが、ハードウェアだけでは完全なソリューションにはなりません。そのインフラストラクチャを賢く利用し、実行の非効率性を解決して、スタック全体でより柔軟性を高める方法も必要です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">インフラストラクチャの制約を克服する方法</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このような柔軟性を実現するには、2 つのアプローチが必要です。予測できる需要に対してリソースを確保することと、予測できない需要に対応するための自動化を構築することです。この 2 つを組み合わせることで、計画されたイベントの容量を事前にスケジュールし、手動による介入なしにインフラストラクチャを予期しない変更に適応させることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">計画されたイベントの容量をスケジュールする</strong></p>\n<p><strong style=\"vertical-align: baseline;\">Dynamic Workload Scheduler</strong><span style=\"vertical-align: baseline;\"> を使用すると、予定されているマイルストーン、オフライン トレーニング、予想される需要の急増に先立って、ミッション クリティカルな容量を確保できます。必要なリソースを事前にスケジュールすることで、費用を最適化し、必要なコンピューティング リソースに確実にアクセスできます。Dynamic Workload Scheduler は、ハードウェア アクセラレータ（TPU と GPU）と一部の CPU をサポートしており、次の 2 つのモードがあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flex Start モード</strong><span style=\"vertical-align: baseline;\">: バッチ処理、モデル トレーニング、オフライン ファインチューニングなど、レイテンシを許容できるワークロードに使用します。リソースをすぐに要求するのではなく、期間を定義したリクエストを送信することで、システムがジョブをインテリジェントにキューに入れ、容量が利用可能になり次第、リソースをプロビジョニングします。これにより、コスト効率を最大化し、需要の高いアクセラレータを確保できる可能性を大幅に高めることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">カレンダー モード</strong><span style=\"vertical-align: baseline;\">: 主要なプロダクトのリリース、予定されている移行、季節的なトラフィックの急増など、ミッション クリティカルで時間制限のあるイベントに使用します。イベントの正確な開始日と終了日を指定することで、将来の予約を作成します。これにより、イベントの開始時に、リクエストされた容量が確実に利用可能になります。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_SEuNvWu.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">すべてのアプリケーションのフォールバック計画を作成して、サービスの継続性を維持する</strong></p>\n<p><span style=\"vertical-align: baseline;\">トラフィックの急増は、必ずしも予測できるものではありません。また、ニュース速報や市場の急激な変化などによってユーザー アクティビティが急増し、予期しないトラフィックが発生した場合に備えて計画を立てる必要もあります。サービスが必要なリソースを中断なく取得できるようにするには、フォールバック計画（許容可能なハードウェア構成の優先順位を付けた自動シーケンス）が必要です。この戦略により、以下のことが可能になります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ワークロードを単一の VM シェイプ、サイズ、構成から切り離します。これにより、希望するオプションが利用できない場合でも、手動介入なしで実行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">最新世代の VM を第一の選択肢として採用し、旧世代の VM を自動フェイルバック オプションとして保持することで、段階的な技術更新を実行できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google Compute Engine でコンテナ化されていないワークロードを実行する場合は、マネージド インスタンス グループ（MIG）の</span><a href=\"https://docs.cloud.google.com/compute/docs/instance-groups/about-instance-flexibility\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">インスタンスの柔軟性</strong></a><strong style=\"vertical-align: baseline;\">と </strong><a href=\"https://docs.cloud.google.com/compute/docs/instances/multiple/create-in-bulk-with-instance-flexibility\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">VM の一括作成</strong></a><span style=\"vertical-align: baseline;\">を使用して、容量を動的に管理できます。インスタンスの柔軟性により、単一のマシンタイプに制限されることなく、VM インスタンスに複数のマシンタイプを指定できます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">仕組み:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">希望するマシンタイプが一時的に利用できない場合、MIG はリアルタイムの容量に基づいて、リストから互換性のある代替マシンタイプを自動的にプロビジョニングします。これをロケーションの柔軟性と組み合わせる（MIG がリージョン内で検索できる複数のゾーンを指定する）ことで、プロビジョニングの成功率を大幅に向上させることができます。MIG が Spot VM を使用している場合、Compute Engine は Spot 容量シグナルと自動的に統合し、推定稼働時間が長く、プリエンプションのリスクが低いマシンタイプを優先します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_lW2ljtl.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">さらに、ベースライン ディスクのデフォルト設定とディスク オーバーライドの構成により、</span><strong style=\"vertical-align: baseline;\">インスタンスの柔軟性をブロック ストレージ レイヤまで拡張</strong><span style=\"vertical-align: baseline;\">することが可能です。これにより、VM が別のマシンタイプにフォールバックした際、ストレージもそれに応じて自動的に適応します。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">仕組み:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">ほとんどの場合、</span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks#machine-type-support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">デフォルトのオプション</span></a><span style=\"vertical-align: baseline;\">を使用するだけで十分です。インスタンス テンプレートから「ディスクタイプ」を完全に省略できます。ただし、関連付けられた VM よりも長く存続するデータディスクについては、複数の VM 世代にわたって高速で耐久性に優れた </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> を有効にできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Compute Engine は仮想マシンを使用する組織にインスタンスの柔軟性を提供しますが、</span><strong style=\"vertical-align: baseline;\">GKE はさらに一歩進んで、単一のコントロール プレーンから容量のライフサイクル全体を自動化します</strong><span style=\"vertical-align: baseline;\">。GKE カスタム </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-compute-classes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ComputeClass</span></a><span style=\"vertical-align: baseline;\"> を活用することで、プラットフォーム チームは多次元のフォールバック リストを設計できるようになります。異なる VM マシン ファミリーやサイズ、構成比の自動的な組み合わせ、複数ゾーンにわたるスケーリング、さらにはオンデマンド VM とスポット VM の切り替えまで、柔軟な運用が可能です。Dynamic Workload Scheduler を容量ターゲットとして使用し、カスタム ComputeClass を使用してポリシーと優先度を定義することで、容量管理のライフサイクルを完全に自動化できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">仕組み: </strong><span style=\"vertical-align: baseline;\">ComputeClass を設定すると、GKE は希望するノード構成が利用できない状況を自動的に検出し、優先順位に従って事前に承認された代替オプションにフォールバックします。アクティブな移行が有効になっている場合、GKE は容量が利用可能になると、ワークロードを優先度の高いノード構成に正常に移行します。ブートディスクなどの一時的なディスクの場合、GKE はインスタンス ファミリーに基づいて適切な</span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks#machine-type-support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">デフォルト設定</span></a><span style=\"vertical-align: baseline;\">を動的に選択します。ただし、VM よりも長時間存続するディスクには、Hyperdisk を使用できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_bBzgKas.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">GKE のもう一つの機能である</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-dynamic-resource-allocation\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">動的リソース割り当て</strong></a><span style=\"vertical-align: baseline;\">は、リソースの消費方法を指示する高度なルールをデベロッパーが定義できるようにすることで、「全か無か」といった無駄の多いハードウェア割り当てを解消するのに役立ちます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">仕組み:</strong><span style=\"vertical-align: baseline;\"> GPU や TPU 全体を要求するのではなく、アプリケーションが合計メモリやコア数などの正確なパラメータを指定します。それに基づき、システムが最適なハードウェア スライスを割り当てるため、使用率を最大化し、費用を削減できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_RtJb1xh.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">動的インフラストラクチャへの次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI をスケールしても、インフラストラクチャの予算が比例して増大したり、技術的負債が蓄積したりするわけではありません。これらの例が示すように、適切なツールを使用することで、制約を克服し、コンピューティングへの投資から得られる価値を劇的に変えることができます。利用を開始するには、次の 3 つのステップを実行します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードを監査して、すぐにコストを削減する:</strong><span style=\"vertical-align: baseline;\"> 現在、単一の VM ファミリー、マシンタイプ、またはアベイラビリティ ゾーンに緊密に結合されているアプリケーションを特定し、実行可能な代替ハードウェア シェイプをマッピングします。既存の構成だけでなく、ワークロード レベルの目標に基づいて、より適しているか、代替として機能する可能性のある</span><a href=\"https://cloud.google.com/products/compute?e=48754805&amp;hl=ja#choose-the-right-vm\"><span style=\"text-decoration: underline; vertical-align: baseline;\">新しいコンピューティング オプション</span></a><span style=\"vertical-align: baseline;\">を評価します。次に、Compute Engine </span><a href=\"https://docs.cloud.google.com/compute/docs/instance-groups/about-instance-flexibility?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MIG</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/compute/docs/instances/multiple/create-in-bulk-with-instance-flexibility\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VM の一括作成</span></a><span style=\"vertical-align: baseline;\">、または GKE カスタム ComputeClasses を使用して自動的に採用し、フォールバック リストに統合します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最小利用額を確約して大幅な割引を受ける:</strong><span style=\"vertical-align: baseline;\"> 継続利用による自動割引に加え、</span><a href=\"https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview?hl=ja#spend_based\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コンピューティング フレキシブル確約利用割引</span></a><span style=\"vertical-align: baseline;\">を利用すれば、最大 63% の割引が適用されます。この割引は、特定のマシンタイプやロケーションに関係なく、使用するリソースに関連付けられます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アカウント チームに問い合わせる:</strong><span style=\"vertical-align: baseline;\"> Google Cloud アカウント チームに連絡して、カスタマイズされた容量管理戦略を策定し、自動フォールバック リストを構成します。</span></p>\n</li>\n</ol>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">オーケストレーションおよび Kubernetes プロダクト担当シニア ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Drew Bradstock</strong></p></div>"
  "a3f79571f50a375ec14cb709e6a51a6b":
    "id": "a3f79571f50a375ec14cb709e6a51a6b"
    "title": "業務の再定義: Pythian の社内 AI ハンドブックがもたらす顧客の ROI"
    "link": "https://cloud.google.com/blog/ja/topics/startups/how-pythians-internal-ai-playbook-delivers-customer-roi/"
    "published": "2026-09-03 11:00:00"
    "fetched": "2026-09-03 14:35:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 28 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/startups/how-pythians-internal-ai-playbook-delivers-customer-roi?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><a href=\"https://www.pythian.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pythian</span></a><span style=\"vertical-align: baseline;\"> が 27 か国に展開する 500 人規模の自社全体に Google Cloud の </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> を導入した際、その目的は明快でした。それは、自社を実証の場として、エンタープライズ AI が実際にどのように ROI をもたらすのかを見極めることでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">そこで得られた知見が、私たちの戦略を根本から変えました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise のロールアウトや、それ以前のエンタープライズ AI のデプロイを通じて、Pythian は、なぜこれほど多くの AI プロジェクトが停滞や失敗に終わるのかを、実体験として目の当たりにしてきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ほとんどの組織は、ツール中心の考え方の罠に陥っています。ライセンスを購入してツールを広く展開しさえすれば、価値は自ずとついてくると信じ込んでいるのです。ユーザーあたり 5 分の節約といった些細な効率化を追い求めるあまり、構造的で ROI の高いワークフローの変革を見逃してしまいます。さらに厄介なことに、カスタム エージェントを構築したとしても、AI モデルドリフト、エージェントのライフサイクル、継続的なオブザーバビリティを管理する運用能力がチームに不足しているため、試験運用の段階で停滞したり、本番環境で破綻したりすることが少なくありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">この課題を解決するために、Pythian は Pythian AI オペレーティング モデルを構築しました。これは、エンタープライズ AI を大局的な戦略策定から持続的な本番運用へと導くために設計された、多面的かつエンドツーエンドのフレームワークです。デュアル センター オブ エクセレンス（COE）が実行の原動力を担う一方で、一貫して数百万ドル規模の成果を引き出しているのは、フィールド CTO 戦略やツールのデプロイからデュアル COE、XOps に至るまで、フレームワーク全体を適用することにほかなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">この完全なモデルをまず社内で実証することで、Pythian はアクティブ ユーザー エンゲージメントを</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">3</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">倍に急増させ、データベース インシデントの解決時間を 80% 短縮しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Pythian AI オペレーティング モデルの 4 つの柱</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ AI の一般的な失敗要因を克服するために、Pythian のフレームワークでは、戦略、実行、運用を 1 つの継続的なループに統合しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">フィールド CTO 戦略  ──&gt;  ツールのデプロイ  ──&gt;  デュアル COE の実行  ──&gt;  本番環境 XOps</strong></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フィールド CTO 戦略とガバナンス:</strong><span style=\"vertical-align: baseline;\"> 生成 AI は、IT の歴史において、理論的にも最も難易度の高いアーキテクチャの転換であると言えるでしょう。役員出身の技術リーダー陣が率いるフィールド CTO プラクティスは、経営幹部向けのアドバイザリーを通じて、運営委員会の設立や明確な価値指標の策定を支援します。チームは、16 個の水平方向のエージェント型パターン（ドキュメント処理の自動化やランブックの作成など）を使用して運用を監査し、開発が開始される</span><span style=\"font-style: italic; vertical-align: baseline;\">前に</span><span style=\"vertical-align: baseline;\">、費用対効果の高いユースケースの優先順位付けされたバックログを構築します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ツールとプラットフォームのデプロイ:</strong><span style=\"vertical-align: baseline;\"> チームは、Gemini Enterprise などのプラットフォーム上に本番環境グレードのセキュアな基盤を確立し、AI を CRM、ERP、データベース資産に直接接続して、実際の企業コンテキストにモデルをグラウンディングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デュアル COE:</strong><span style=\"vertical-align: baseline;\"> この実行エンジンは、2 つの専門エンジンに分かれています。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">従業員の生産性 COE:</strong><span style=\"vertical-align: baseline;\"> このグループは、導入とチェンジ マネジメントを担当します。技術部門以外のチーム（人事や調達など）が独自のエージェントを構築することを期待するのではなく、この COE は、イネーブルメントに完全に焦点を当てて、これらのチーム</span><span style=\"font-style: italic; vertical-align: baseline;\">向け</span><span style=\"vertical-align: baseline;\">にノーコード エージェントを構築します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プロセス生産性 COE:</strong><span style=\"vertical-align: baseline;\"> このチームは、自律的な運用のためにコアデータ プラットフォームに統合される、高度なカスタムコード AI エージェントと複雑なエージェント ワークフローを設計します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">XOps（AI 本番環境管理）:</strong><span style=\"vertical-align: baseline;\"> エージェントのデプロイは取り組みの 20% にすぎず、本番環境での精度を</span><span style=\"font-style: italic; vertical-align: baseline;\">維持</span><span style=\"vertical-align: baseline;\">することが 80% を占めます。AI モデルとプロンプト構造は時間の経過とともに自然に変化するため、この XOps プラクティスは、コア ワークフローを中断することなくエージェントのパフォーマンスを維持するために必要な継続的なモニタリング、プロンプト チューニング、モデルのオブザーバビリティを提供します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">散発的な小さい効率化を追求することと、構造的な企業 ROI を推進することの違いは、オペレーティング戦略をどのように調整するかによって決まります。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">アライメント要素</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ツール中心のアプローチ</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Pythian AI オペレーティング モデル</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">主要な指標</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ユーザー 1 人あたりの節約時間</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">インパクトの大きいワークフローの再定義と ROI</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">運用の重点</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">指針のない広範なツール提供</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">16 のエージェント パターンによる優先順位付けされたバックログ</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行力</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーによるアドホックなテスト</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">デュアル COE（人材とプロセスの生産性）</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">本番環境のライフサイクル</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">モニタリングされていない静的デプロイ</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">アクティブ XOps（継続的な精度とドリフトの管理）</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">実際の導入効果: データベース運用からグローバル サプライ チェーンまで</strong></h4>\n<p><span style=\"vertical-align: baseline;\">70 か所の製造プラント管理であれ、30,000 個のエンタープライズ データベース管理であれ、AI は構造的で価値の高いワークフローに結びついたときに成果を発揮します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">「自らが顧客となる」Pythian の事例:</strong><span style=\"vertical-align: baseline;\"> 月間 15,000 件に及ぶデータベース チケットに対し、プロセス COE は、エンジニアが着手する前にチケットの読み取り、ナレッジベースの検索、ミニランブックの自動生成を行うエージェント型ワークフローをデプロイしました。その結果、平均解決時間が 80% 短縮され、アクティブ ユーザー エンゲージメントが 3 倍になりました</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ナレッジ マネジメント企業の顧客:</strong><span style=\"vertical-align: baseline;\"> 10,000 人のコンサルタントに自律型 IT サポート エージェントをデプロイしました。その結果、年間 20,000 件の IT チケットの 10% を「ノータッチ」で解決できるようになり、100 万時間以上の運用時間を節約できました</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サプライ チェーン企業の顧客:</strong><span style=\"vertical-align: baseline;\"> Gemini Enterprise でカスタムのエージェント サプライ チェーン ツールを構築することで、世界 70 か所の製造拠点で予測マッチング サイクルを数週間から 2～3 日に短縮できました</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">小売企業の顧客:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/gemini-enterprise/agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェント型 AI</span></a><span style=\"vertical-align: baseline;\"> とコンピュータ ビジョンを組み合わせて、店舗の商品オンボーディングを自動化しました。その結果、20 分かかっていた手動タスクを数秒のフローに変換できました</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">AI オペレーティング モデルを構築する準備はできましたか？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI をスケールするには、ツールレベルのテストだけでは不十分です。エンドツーエンドの AI オペレーティング モデルも必要になります。Pythian が Google Cloud と連携して戦略を体系化し、XOps を合理化して、Gemini Enterprise 導入への道のりをどのように加速させるか、ぜひ詳細をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Pythian、最高技術責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Paul Lewis 氏</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Pythian、ビジネス開発担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vanessa Simmons 氏</strong></p></div>"
