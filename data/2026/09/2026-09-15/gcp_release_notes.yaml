    "summary": "<h2 class=\"release-note-product-title\">Batch</h2>\n<h3>Issue</h3>\n<p>A workaround has been added for the known issue that\n<a href=\"https://docs.cloud.google.com/batch/docs/known-issues#jobs-fail-specify-compute-images-outdated-kernels\">jobs might fail when specifying Compute Engine (or custom) VM OS images with outdated kernels</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Feature</h3>\n<p><strong>Reinforcement learning fine-tuning in the Google Cloud console (Preview)</strong></p>\n<p>You can create, monitor, and test reinforcement learning fine-tuning jobs\nfor Gemini models in the Google Cloud console\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>). From the\n<strong>Models &gt; Tuning</strong> page, you can configure Python code or model-based reward\nfunctions, test reward logic against sample prompts before launching a job,\ntrack training and evaluation metrics in real time, and test tuned checkpoints\nin Agent Studio.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/tuning/reinforcement-tuning/quick-start-console\">Quick start: Reinforcement learning fine-tuning using the console</a>.</p>\n<h2 class=\"release-note-product-title\">Policy Intelligence</h2>\n<h3>Feature</h3>\n<p>Policy Troubleshooter now supports troubleshooting access for <a href=\"https://docs.cloud.google.com/iam/docs/agent-identity-overview\">agent identities</a>. You can troubleshoot IAM allow policies, deny policies, and principal access boundary policies for agents acting under their own authority by entering the agent's principal identifier or by troubleshooting with an error ID from an access\ndenial event. To learn more, see <a href=\"https://docs.cloud.google.com/policy-intelligence/docs/troubleshoot-access#troubleshoot-access\">Troubleshooting access</a>.</p>"
