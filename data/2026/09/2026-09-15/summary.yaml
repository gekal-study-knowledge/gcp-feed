"overview": |
  この日は 6 件で、BigQuery の拡張分析機能、Dataflow の性能改善、Forrester による評価に加え、エージェント向けのガバナンス機能拡充が目立ちました。BigQuery には、複雑なデータ分析を自動化する拡張分析用のテーブル値関数 (TVF) が 6 種類新たに加わりました。AI・ML・統計的手法を組み合わせて指標の変化理由の診断、データ全体の傾向や関係性の発見、ビジネス上の意思決定が及ぼした真の影響の切り分けまでを行え、データのある場所で直接実行されるため外部ツールへのエクスポートが要りません。ML.DETECT_CHANGE_POINTS・AI.KEY_DRIVERS・AI.CAUSAL_EFFECT のようにチェーンでき、出力が構造化された SQL であることから AI エージェントのスキルとして組み込みやすく、会話形式のデータ調査ワークフローを自動化できます。Dataflow では、バッチジョブの Pause/Resume が一般提供となり、失敗前にすでに処理済みのデータへアクセスできず全体をやり直していた無駄な計算を回避できるようになったほか、NVIDIA RTX PRO 6000 Blackwell Server Edition GPU を搭載した G4 VM がサポートされ、AI ワークロード向けの推論性能が強化されました。評価では、Google Cloud が Forrester Wave: Public Cloud Platforms, Q3 2026 でリーダーに選出され、現行製品部門で最高スコア、30 の評価基準のうち 23 で最高評価を獲得しました。エージェントのガバナンス面では、Gemini モデルの強化学習ファインチューニングを Google Cloud コンソール上で作成・監視・テストできる機能がプレビューで提供され、Python コードやモデルベースの報酬関数を設定し、ジョブ起動前にサンプルプロンプトで報酬ロジックを検証できます。Policy Troubleshooter は、エージェントの ID がそれ自身の権限で行動する際の IAM 許可・拒否ポリシーや主体アクセス境界ポリシーのトラブルシューティングに対応し、エージェントのプリンシパル識別子やアクセス拒否イベントのエラー ID から調査できるようになりました。日本語ブログ (抄訳) では、表形式データの回帰・分類に対応した事前学習済み基盤モデル BigQuery TabFM がプレビューで紹介され、コンテキスト内学習により学習・チューニング・デプロイの手順なしに単一の SQL ステートメントから高精度な予測を即座に得られます。Yahoo が Managed Service for Apache Spark のフレキシブル VM でリージョンの容量制約を自動的に吸収している事例の抄訳も改めて掲載されました (前週にすでに紹介済みの記事です)。
