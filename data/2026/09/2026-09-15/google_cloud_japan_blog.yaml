    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 2 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/tabfm-adds-predictive-ml-to-bigquery?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">これまで、チャーン、購入意向、不正行為スコアの予測といった企業の予測分析タスクでは、XGBoost、ランダム フォレスト、ディープ ニューラル ネットワーク（DNN）などのライブラリを使用してカスタムモデルを構築する必要がありました。トレーニング、チューニング、デプロイ、再トレーニングという従来のサイクルは効果的ですが、複雑で時間がかかる場合があります。さらに、手動での特徴量エンジニアリング、ハイパーパラメータ チューニング、時間と費用のかかるトレーニングといったオーバーヘッドに加え、専門的なデータ サイエンス スキルが必要となることから、企業は意思決定において予測モデルを十分に活用できていない可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、BigQuery の TabFM モデルについてお知らせします。Google Research が開発した TabFM は、表形式データの回帰と分類に対応した、最先端の事前トレーニング済み基盤モデルです。コンテキスト内学習（ICL）を使用し、単一の SQL ステートメントを介して、表形式のデータセットに対する高精度な予測を瞬時に提供し、独立したトレーニングとデプロイの手順を不要にします。BigQuery の TabFM は現在プレビュー版です。</span></p>\n<p><span style=\"vertical-align: baseline;\">TabFM は、以下のようなメリットを BigQuery 分析にもたらします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ゼロショット予測</strong><span style=\"vertical-align: baseline;\">: モデルのトレーニング、チューニング、アーティファクトのデプロイをスキップします。ラベル付きの過去データと新しい予測テーブルを単一の SQL 関数に渡すだけで、高品質な予測を即座に取得できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェント アプリケーション向けの予測 ML</strong><span style=\"vertical-align: baseline;\">: ビジネス用途のエージェントを構築する場合、TabFM と </span><a href=\"https://docs.cloud.google.com/bigquery/docs/use-bigquery-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery MCP サーバー</span></a><span style=\"vertical-align: baseline;\">を組み合わせることで、予測機能を追加できます。ランタイムやインフラストラクチャを管理する必要はありません。データを入力するだけで予測結果が得られます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最先端の精度</strong><span style=\"vertical-align: baseline;\">: 複雑なデータセットにおいて、カスタム トレーニングされた既成の従来モデルを上回り、業種別ベンチマークで優れた精度スコアを達成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">シンプルなデベロッパー エクスペリエンス</strong><span style=\"vertical-align: baseline;\">: BigQuery 上でネイティブに実行され、シンプルな SQL 構文でアクセスできます。欠損値やカテゴリ エンコードなどの特徴量化タスクを自動的に処理するため、複雑な特徴量エンジニアリング パイプラインを管理する必要がありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スケーラビリティ:</strong><span style=\"vertical-align: baseline;\"> BigQuery の分散推論アーキテクチャを使用して、大規模な推論テーブル（最大数百万行）を数分で処理します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">表形式の予測のための主要なモデル</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google の TabFM は、幅広い表形式データにわたり業界トップクラスの精度を実現しています。</span><a href=\"https://huggingface.co/spaces/TabArena/leaderboard\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TabArena</span></a><span style=\"vertical-align: baseline;\"> ベンチマークの評価において、TabFM のパフォーマンスは、従来の ML モデルと他の表形式基盤モデルの両方を一貫して上回っています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_vsRpJjZ.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>TabArena の分類（上）と回帰（下）における上位 10 モデルの ELO 評価（↑）。（D）= デフォルト、（T+E）= チューニング + アンサンブル。スコアが高いほど、パフォーマンスが優れていることを示します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">TabFM モデルについて詳しくは、</span><a href=\"https://research.google/blog/introducing-tabfm-a-zero-shot-foundation-model-for-tabular-data/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">BigQuery で TabFM を使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">TabFM の使い方は簡単です。新しい組み込みの SQL 関数である AI.PREDICT と AI.EVALUATE を通じて、直接利用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. AI.PREDICT で即座に予測結果を取得する</span><span style=\"vertical-align: baseline;\">予測を行うには、トレーニング データと予測データを渡す単一のクエリを記述します。モデルは、ターゲット ラベルのデータ型に基づいて、タスクが分類問題か回帰問題かを自動的に推論します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- トランザクションが不正かどうかを分類する\\r\\nSELECT *\\r\\nFROM AI.PREDICT(\\r\\n TABLE `my_project.my_dataset.historical_transactions`, -- トレーニング データ（コンテキスト内の例）\\r\\n TABLE `my_project.my_dataset.new_transactions`, -- 予測データ\\r\\n label_col =&gt; &#x27;is_fraud&#x27;-- 予測するターゲット列\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fc6f84f78d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この例の出力には、予測テーブルの元の列すべてに加えて、予測ラベルと確率の列（predicted_is_fraud など）が含まれます。手動での特徴量エンジニアリングやモデルの作成は不要でした。</span></p>\n<p><span style=\"vertical-align: baseline;\">2. AI.EVALUATE でモデルを評価する</span><span style=\"vertical-align: baseline;\">AI.EVALUATE 関数を使用すると、テストセットに対する予測パフォーマンスをすばやく確認できます。これにより、標準的な評価指標を 1 ステップで生成できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- 顧客のライフタイム バリュー（LTV）の回帰評価\\r\\nSELECT *\\r\\nFROM AI.EVALUATE(\\r\\n TABLE `my_project.my_dataset.historical_customer_ltv`,\\r\\n TABLE `my_project.my_dataset.test_customer_ltv`,\\r\\n label_col =&gt; &#x27;ltv&#x27;\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fc6f84f5090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AI.EVALUATE は、回帰問題に対しては r2_score、mean_absolute_error などの堅牢な指標セットを、分類問題に対しては適合率、再現率、f1 などの指標を返します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">BigQuery の TabFM の仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">従来の ML では、モデル パラメータをトレーニング データセットに適合させる必要があります。これに対し、TabFM ではコンテキスト内学習を使用します。大規模言語モデル（LLM）が少数ショットのプロンプト例からタスクを学習するのと同様に、TabFM はトレーニング テーブルをコンテキスト内の例として読み取り、1 回のフォワードパスでターゲット テーブルに対する予測を生成します。</span></p>\n<p><span style=\"vertical-align: baseline;\">表形式基盤モデルの演算の複雑さとメモリ使用量に対応するため、BigQuery はデータに対して分散並列推論を実行します。さらに、インテリジェントなトレーニング データ サンプリングと分散実行を使用して、パフォーマンスとリソース使用率を最適化します。これにより、BigQuery はトレーニング データとして大規模な入力行を処理しながら、数百万行の推論データに対して迅速かつ効率的に予測を実行できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ジョブに適したツールを選択</strong></h4>\n<p><span style=\"vertical-align: baseline;\">TabFM は、BigQuery に画期的なゼロショット機能を導入し、XGBoost モデルなどの既存のサービスを補完します。TabFM と他のモデルのどちらを選択すべきかは、以下の基準で判断します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">TabFM は、ML の専門知識がなくても迅速かつ高品質な予測分析情報が必要な場合や、過去のデータセットが小規模から中規模である場合、データが頻繁に変更される場合、そして精度を維持するためにモデルを頻繁に再トレーニングする必要がある場合に使用します。また、オンデマンドでの予測分析を必要とする会話型ワークフローやエージェント ワークフローにも適しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">XGBoost のような従来のモデルは、非常に大規模な過去のデータセットがある場合、カスタム ハイパーパラメータ チューニングを完全に制御する必要がある場合、TabFM の現在の制限を超えるほど特徴量が多い場合、または特徴量の重要度の説明可能性（例: どの入力特徴量が予測に最も貢献したか）が必要な場合に使用します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">予測 ML が簡単に</strong></h4>\n<p><span style=\"vertical-align: baseline;\">TabFM が BigQuery にネイティブに統合されたことで、予測 ML は標準の SELECT クエリを実行するのと同じくらい簡単になりました。TabFM により、モデルのトレーニング、チューニング、管理に伴う手作業のオーバーヘッドが排除され、デベロッパー、データ サイエンティスト、アナリストは、元データから豊富な予測分析情報を数秒で取得できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">今すぐ利用を開始するには、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-predict\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一般公開ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。ご質問やご意見がございましたら、</span><span style=\"text-decoration: underline; vertical-align: baseline;\">bqml_feedback@google.com</span><span style=\"vertical-align: baseline;\"> までお知らせください。皆様がどのようなものを構築されるのか、楽しみにしております。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vaibhav Sethi</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Xi Cheng</strong></p></div>"
