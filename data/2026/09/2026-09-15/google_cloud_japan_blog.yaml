  "eb2d55f1186a8d72a19d8f51576beae0":
    "id": "eb2d55f1186a8d72a19d8f51576beae0"
    "title": "Yahoo が Managed Service for Apache Spark のフレキシブル VM でリソースを最適化している方法"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/how-yahoo-optimizes-apache-spark-with-flexible-vms/"
    "published": "2026-09-15 12:00:00"
    "fetched": "2026-09-15 14:50:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 5 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/how-yahoo-optimizes-apache-spark-with-flexible-vms?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Yahoo は、数億人のユーザーを金融、スポーツ、エンターテイメントのプラットフォームに接続するグローバルなメディアおよびテクノロジー企業として、分析ワークロードを高速で継続的に実行する必要がある大規模なデータ インフラストラクチャを運用しています。期限が重視されるデータ環境では、固定の仮想マシン（VM）構成に依存すると、システムが脆弱になります。特定のマシンシェイプがリージョンの容量制限に直面すると、</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\">（旧称 Dataproc）でのクラスタ プロビジョニングが遅延し、重要なデータ パイプラインが停止する可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Yahoo は、</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> クラスタで</span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">フレキシブル VM</span></a><span style=\"vertical-align: baseline;\"> を利用し、許容可能な VM シェイプのランク付けされたリストを定義することで、これらのリソースの変動に自動的に対応しています。これにより、システムはリージョン ゾーンを動的に検索し、手動による介入なしでパイプラインの実行を維持できます。リージョン全体で容量を検索するには、</span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">自動ゾーン プレースメント</span></a><span style=\"vertical-align: baseline;\">も有効にする必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">この最適化は、</span><a href=\"https://www.youtube.com/watch?v=_7Oz1V1-ZiE\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">オンプレミスの Hadoop とビッグデータ資産を Google Cloud に直接移行</span></a><span style=\"vertical-align: baseline;\">する、Yahoo のより広範なデータ モダナイゼーションの取り組みを基盤としています。これらのレガシー ワークロードを移行することで、チームは動的なリソースの柔軟性を備えた、大規模なバッチ分析とストリーミング分析を実行できるクラウド基盤を確立しました。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=_7Oz1V1-ZiE\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Hadoop pioneer to cloud innovator: Yahoo’s data lake modernization journey</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=_7Oz1V1-ZiE\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この投稿では、</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> でフレキシブル VM インスタンスのランキングを構成し、容量の制約を自動的に管理してパイプラインの実行を維持するための技術的なブループリントをご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">静的構成の運用上のトレードオフ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">特定のゾーンで固定された単一のマシンタイプを使用してクラスタを構成すると、リージョン ゾーンの容量が変動した場合に制約が生じ、クラスタのプロビジョニングに影響する可能性があります。カスタムの再試行ロジックや手動による介入によってこれらの容量の変動を管理するのではなく、柔軟な構成を使用することで、インフラストラクチャを自動的に適応させることができます。柔軟な構成により、複数の VM シェイプを受け入れ、選択したリージョン内のゾーン全体で検索を行うことで、プロビジョニングを合理化し、大規模な分析ワークロードをより適切にサポートできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">柔軟なクラスタを構成するためのルール</strong></h4>\n<p><span style=\"vertical-align: baseline;\">柔軟な構成をデプロイするには、一連の設計上の選択を調整する必要があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自動ゾーン プレースメントを有効にする:</strong><span style=\"vertical-align: baseline;\"> Managed Spark がリージョン全体で利用可能な容量を検索できるように、リージョン（--region=${REGION}）または空のゾーン文字列（--zone=\"\"）を渡す必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コアとメモリの均一性を維持する:</strong><span style=\"vertical-align: baseline;\"> Managed Spark クラスタで</span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/autoscaling\"><span style=\"text-decoration: underline; vertical-align: baseline;\">自動スケーリング</span></a><span style=\"vertical-align: baseline;\">を使用する場合、フレキシブル リスト内のすべてのマシンタイプは、異なる VM ファミリーのものであっても、同様のコア数とメモリサイズを共有する必要があります。プライマリ ワーカーとセカンダリ ワーカーで CPU とメモリの比率を統一すると、最小の比率によって有効なコンテナのサイズが決まるため、パフォーマンスの低下を防ぐことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンポーネント プロパティを調整する:</strong><span style=\"vertical-align: baseline;\"> Managed Spark は、VM のコアとメモリに基づいてシステム プロパティを計算します。マシンシェイプを混在させる場合、YARN と Spark のリソース割り当てをワーカーの想定される動作に合わせるために、プロパティの明示的なオーバーライドが必要になることがあります。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">フレキシブル VM が大規模なワークロードをサポートする 2 つの方法</strong></h4>\n<p><span style=\"vertical-align: baseline;\">大規模なデータ環境の場合、柔軟な構成は次の 2 つの方法で運用をサポートします。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クラスタ作成の成功率の向上:</strong><span style=\"vertical-align: baseline;\"> 優先 VM タイプが利用不可の場合に失敗せず、Managed Spark がランク付けされたリストから代替の VM タイプを選択してプロビジョニングを継続します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">リージョン リソースの使用効率の向上:</strong><span style=\"vertical-align: baseline;\"> 自動ゾーン プレースメントでは、リージョン全体が検索され、容量が検出されるため、需要が高い期間のプロビジョニングの摩擦が軽減されます。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">gcloud の例</strong></h4></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud dataproc clusters create analytics-cluster \\\\\\r\\n  --region=us-central1 \\\\\\r\\n  --zone=&quot;&quot; \\\\\\r\\n  --num-workers=10 \\\\\\r\\n  --master-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;e2-standard-8&quot;],&quot;rank&quot;:0}\\&#x27; \\\\\\r\\n  --master-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n2-standard-8&quot;],&quot;rank&quot;:1}\\&#x27; \\\\\\r\\n  --worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;e2-standard-8&quot;],&quot;rank&quot;:0}\\&#x27; \\\\\\r\\n  --worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n2-standard-8&quot;],&quot;rank&quot;:1}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fc6f84c0d90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">API の例</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この容量ポリシーは、Dataproc API の instanceFlexibilityPolicy フィールドを使用して、自動化されたパイプラインまたは </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-airflow\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Airflow</span></a><span style=\"vertical-align: baseline;\"> DAG に組み込むこともできます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;projectId&quot;: &quot;PROJECT_ID&quot;,\\r\\n  &quot;clusterName&quot;: &quot;analytics-cluster&quot;,\\r\\n  &quot;config&quot;: {\\r\\n    &quot;gceClusterConfig&quot;: {\\r\\n      &quot;zoneUri&quot;: &quot;&quot;\\r\\n    },\\r\\n    &quot;secondaryWorkerConfig&quot;: {\\r\\n      &quot;numInstances&quot;: 8,\\r\\n      &quot;instanceFlexibilityPolicy&quot;: {\\r\\n        &quot;instanceSelectionList&quot;: [\\r\\n          {\\r\\n            &quot;machineTypes&quot;: [&quot;n2-standard-8&quot;],\\r\\n            &quot;rank&quot;: 0\\r\\n          },\\r\\n          {\\r\\n            &quot;machineTypes&quot;: [&quot;e2-standard-8&quot;, &quot;t2d-standard-8&quot;],\\r\\n            &quot;rank&quot;: 1\\r\\n          }\\r\\n        ]\\r\\n      }\\r\\n    }\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fc6f8315590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この API ポリシーは、同じ目標を達成します。つまり、優先するシェイプを確立し、有効なフォールバックを文書化し、自動化スクリプトを中断することなく、Managed Spark がリソースの制約を解決できるようにします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">インフラストラクチャ ポリシーの確立</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この規模のデータを管理するには、固定された単一のマシンタイプに依存するのではなく、明確なリソース ポリシーを標準化する必要があります。構成基準では、以下を規定する必要があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">セカンダリ ワーカーの優先 VM ファミリーとフォールバック VM ファミリー。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">柔軟なプロビジョニングを可能にするためのデフォルトの自動ゾーン プレースメント。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">自動スケーリングを使用する場合のコアとメモリの同一構成。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">コンテナのサイズを予測可能に保つためにすべてのワーカー グループで統一された CPU とメモリの比率。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">異なるマシンライン間で一貫したランタイム動作を保証するための、YARN または Spark プロパティの明示的なオーバーライド。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Spot または弾力性の高い容量で実行される Spark ワークロード向けのシャッフル セーフ パターン。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">柔軟な構成を採用することで、インフラストラクチャのリソース不足が解消され、予測可能なフォールバック プランが適用されるため、重要なデータ パイプラインを稼働させ続けることができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Yahoo の影響と結果</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Yahoo は、Managed Service for Apache Spark にフレキシブル VM を実装することで、リージョンの容量不足が原因で発生していたクラスタ プロビジョニングの失敗を 85% 削減することに成功しました。この柔軟な構成により、データ インフラストラクチャは容量の制約に自動的に対処し、手動による介入を必要とせずにリソースを正常にプロビジョニングできます。その結果、Yahoo はワークロードを継続的に実行できるようになり、大規模なデータ パイプライン全体でダウンストリーム処理の遅延を防止しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Yahoo で大規模なデータ分析を管理するには、復元力のある自動化されたインフラストラクチャが必要です。Managed Service for Apache Spark のフレキシブル VM に移行したことで、当社のアプローチは一変しました。特定のマシンシェイプが容量の制約に直面したときに処理が停止するのではなく、クラスタがランク付けされたフォールバック オプションに自動的に切り替わるようになりました。これにより、プロビジョニングの失敗を 85% 削減し、グローバル メディア プラットフォームをスムーズに運用し続けるために必要な信頼性を確保できました。」- Yahoo!、シニア ソフトウェア デベロッパー エンジニア、Akshay Jain 氏</span></p>\n<h4><strong style=\"vertical-align: baseline;\">柔軟なインフラストラクチャの戦略上のメリット</strong></h4>\n<p><span style=\"vertical-align: baseline;\">柔軟なコンピューティング スタックを採用することで、環境を運用ニーズに適応する動的なリソースプールへと変革できます。固定された単一のマシンタイプ構成に縛られないため、供給の変動に関係なく、ワークロードが必要なコンピューティングに確実にアクセスできるようになります。この移行により、ワークロードの入手可能性と信頼性が最大限に高まるだけでなく、古いタイプの VM を信頼性の高いフォールバック オプションとして維持しながら、新しい世代の VM を優先できるため、シームレスなハードウェアのモダナイゼーションが促進されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">復元力のあるデータ パイプラインを構築する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">流動的なコンピューティング戦略に移行することで、リージョン リソースが変化しても、重要な分析を継続できます。インフラストラクチャの最適化を今すぐ始める方法を以下に示します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードを検証する: </strong><span style=\"vertical-align: baseline;\">特定の VM ファミリーやゾーンに緊密に結合されているアプリケーションを特定し、実行可能な代替ハードウェア シェイプをマッピングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">リソース ポリシーを標準化する: </strong><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Spark のフレキシブル VM のドキュメント</span></a><span style=\"vertical-align: baseline;\">を読んで、優先 VM ファミリーとフォールバック VM ファミリーを確立します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">財務戦略を調整する: </strong><span style=\"vertical-align: baseline;\">ワークロードが代替マシンタイプに動的に移行する場合に、フレキシブル確約利用割引（フレキシブル CUD）を利用して費用の予測可能性を維持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クレジットを獲得する: </strong><span style=\"vertical-align: baseline;\">新規のお客様は、Managed Service for Apache Spark や他の Google Cloud プロダクトを無料で試すことができる </span><a href=\"https://cloud.google.com/free\"><span style=\"text-decoration: underline; vertical-align: baseline;\">$300 分のクレジット</span></a><span style=\"vertical-align: baseline;\">を獲得できます。</span></p>\n</li>\n</ol>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Yahoo、シニア ソフトウェア エンジニア</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Akshay Jain 氏</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、データ / AI エンジニア</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Surjit Singh</strong></p></div>"
