  "d5498041b267e30fd123876a36ea913c":
    "id": "d5498041b267e30fd123876a36ea913c"
    "title": "Storage-optimized Z4D machine family, now GA, is designed for IO-intensive workloads"
    "link": "https://cloud.google.com/blog/products/compute/storage-optimized-z4d-vm-and-bare-metal-instances/"
    "published": "2026-09-28 16:00:00"
    "fetched": "2026-09-29 03:27:48"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we’re excited to announce the general availability of our next-generation </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage-optimized Z4D machine</span></a><span style=\"vertical-align: baseline;\"> series in Google Compute Engine with both Virtual Machine (VM) and bare-metal instances. </span></p>\n<p><span style=\"vertical-align: baseline;\">We built Z4D for IO-intensive and business-critical workloads that require large local storage capacity and high storage performance, including SQL, NoSQL, KVrocks and vector databases, data analytics and data search. Powered by 5th Gen AMD EPYC processors (Turin) and paired with the latest enhancements in </span><a href=\"https://cloud.google.com/titanium?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\">, Z4D provides up to 84,000 GiB of Local SSD (LSSD) storage. It improves the performance of these demanding workloads by up to 40% compared to the prior-generation Z3 instances, so you can increase your applications throughput while right-sizing your cloud investment. Z4D’s large LSSD capacity also makes it a strong storage solution for AI/ML training and inference workloads and running distributed parallel file systems at scale.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Z4D VMs and bare-metal instances</span></h3>\n<p><span style=\"vertical-align: baseline;\">The Z4D VM portfolio lets you rightsize your infrastructure and scale your clusters to meet workloads requirements by providing large total local SSD capacity and high local SSD capacity per vCPU. Z4D offers two different VM types: the </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Z4D-highmem-standardlssd</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">VM type, which includes seven VM shapes and offers 219 GiB of LSSD per vCPU. These VMs are optimized for data analytics (OLAP), and SQL databases like MySQL and Postgres. The </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Z4D-highmem-highlssd</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">VM type</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">includes</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">seven different VM shapes, with 438 GiB of LSSD per vCPU and is optimized for distributed databases, data streaming, large parallel file systems and data search. In addition, you can easily scale your existing Z3-based workloads by expanding into Z4D clusters.</span></p>\n<p><span style=\"vertical-align: baseline;\">Z4D bare metal instances give you direct access to the physical hardware without a virtualization layer. This reduces latency for latency-sensitive workloads, custom hypervisors and workloads with specific licensing needs. Further, Z4D bare metal will be the very first AMD-based instance to support Nutanix Cloud Clusters (NC2), a hybrid multi-cloud platform that works across several cloud providers. Z4D bare-metal instances deliver the LSSD capacity and low latency that agentic AI architectures using microVMs require, allowing developers to run thousands of isolated sandboxes per host with native performance and efficiency. </span></p>\n<p><span style=\"vertical-align: baseline;\">In addition to 84,000 GiB of local SSD storage, Z4D VMs and bare metal instances offer up to 384 vCPUs and up to 3,072 GiB of memory. Z4D instances are based on </span><a href=\"https://cloud.google.com/compute/docs/disks/local-ssd\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium SSDs</span></a><span style=\"vertical-align: baseline;\">, which </span><span style=\"vertical-align: baseline;\">offload local storage processing from CPU resources</span><span style=\"vertical-align: baseline;\"> to deliver real-time data processing, low-latency, high-throughput storage performance and </span><span style=\"vertical-align: baseline;\">enhanced storage security. Z4D delivers up to 15,600K random read IOPS and up to 75,600 MiB/s sequential read throughput, improving the LSSD storage performance by up to 70% compared to Z3. Z4D also reduces write latency by up to 25% and improves mixed read-write IOPS by up to 30% without increasing the IO latency vs Z3. At the same time, Z4D instances provide the connectivity and storage performance that enterprise and AI/ML workloads need by doubling the networking throughput compared to Z3 and offering up to 400 Gbps of standard networking bandwidth.</span></p>\n<h3><span style=\"vertical-align: baseline;\">What customers and partners are saying</span></h3></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"elastic\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/elastic.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>“Elastic is committed to delivering best-in-class performance with the Elasticsearch Platform that powers observability, security, search, and AI solutions. Performance and cost efficiency are critical for teams running these workloads at scale and our initial testing of the new Z4D virtual machines shows up to 50% better indexing throughput compared to previous generation Z3 VMs. We look forward to bringing these benefits to Elasticsearch users deploying on Google Cloud.” -</i> Yuvraj Gupta, Principal Product Manager, Elastic</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"immunai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/immunai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Migrating to the Z4D instance reduced our processing runtime by ~70% while reducing overall costs. This improvement enables Immunai to process large-scale immune data significantly faster and turn it into biological insights that support pharma companies in making better-informed decisions throughout drug discovery and development.\" -</i> Guy Yachdav, Senior Director of Software Engineering, immumeai</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"nutanix\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/nutanix.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"We are thrilled to expand our technical collaboration with Google Cloud and to deepen our strategic partnership with AMD to bring Nutanix Cloud Clusters (NC2) to the new Z4D bare metal instances. This marks a significant milestone for our customers, as NC2 on Z4D will be a first-of-its-kind offering — the very first AMD metal instance on which NC2 is supported. By uniting AMD's cutting-edge compute performance with Google Cloud's robust infrastructure and the Nutanix hybrid cloud platform, we are delivering unprecedented flexibility, scale, and choice to empower enterprise workloads.\"</i> - Saveen Pakala, Vice President of Product Management, Nutanix</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"redis\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/redis.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Redis powers real-time data infrastructure and AI workloads for thousands of organizations worldwide. Flex extends that to larger datasets without all-RAM economics — local SSD handles the scale while memory provides the speed. We compared Google Cloud's new Z4D storage-optimized VMs to our current generation C3D instances using our Flex benchmark suite on the same flash-heavy workloads. The results were impressive: up to 4.3 times higher throughput and up to 77% lower latency on our smaller shapes. Z4D also sustained nearly 1.8 million operations per second at full RAM hit ratio. The more data we served from flash, the more that advantage grew — which is exactly the profile Flex is built for. Z4D gives us a clear path to deliver the same performance tier on a smaller footprint, and we're looking forward to expanding our testing as Z4D moves toward GA.”</i> - Benjamin Renaud, CTO, Redis</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"shopify\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/shopify_QpwhKbh.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>“Shopify looks at what's best for our fleet, and Z4D gives us high CPU density alongside fast locally attached storage and fast networking. Shopify's user experience depends on how fast data can be served, and AI shopping agents query storefronts far more aggressively than people do. These shapes give us the throughput to keep up. We saw roughly 20% better throughput on Z4D than on Z3.”</i> - Brad Dietrich, Distinguished Engineer, Shopify</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"silk\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/silk_RM9R0Ve.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Google's Z4D VMs are a significant leap forward. In our testing we observed up to 60% better performance than previous Gen 2 VMs, and up to 36% better performance than Z3 VMs. With high local SSD density and strong cost-efficiency together with improved system reliability, Z4D gives Silk customers faster, more predictable performance for their most demanding workloads.\" -</i> Adik Sokolovski, Chief R&amp;D Officer, Silk</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"turbopuffer\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/turbopuffer.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Connecting AI with petabytes of fresh data means we're searching more than ever before. We're excited about the new Z4D instance types. Compared to Z3, they gave us a 40% throughput improvement on real query and indexing workloads — which directly translates to faster and cheaper web-scale search for our customers\"</i> - Ben Linsay, Engineer, turbopuffer</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Enhanced maintenance experience</span></h3>\n<p><span style=\"vertical-align: baseline;\">Both Z4D VMs and bare-metal instances make it easier for you to plan ahead and schedule maintenance operations at a time of your choosing by providing notice from the system several days in advance of a required maintenance. Z4D VMs further enhance the maintenance experience by allowing you to live-migrate an instance during maintenance events for VMs with 42,000 GiB or less of local SSD storage. Z4D VMs with 84,000 GiB of local SSD and Z4D bare metal instances are terminated and restarted while preserving your data through the planned maintenance events.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Support for Hyperdisk</span></h3>\n<p><span style=\"vertical-align: baseline;\">Z4D VMs and bare metal support </span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</strong></a><span style=\"vertical-align: baseline;\">, Google Cloud’s workload-optimized block storage that lets you optimize the performance for each workload by independently tuning the storage performance and capacity for each instance.</span></p>\n<p><span style=\"vertical-align: baseline;\">Specifically, they are compatible </span><span style=\"vertical-align: baseline;\">with </span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-balanced\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Balanced</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Throughput</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-extreme\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Extreme</span></a><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> storage for scalable, high-performance network-attached storage</span><span style=\"vertical-align: baseline;\">, supporting up to 512 TiB of capacity per instance. For general-purpose workloads, Hyperdisk Balanced, with up to 320K IOPS per instance, offers a mix of performance and cost-efficiency. Hyperdisk Extreme delivers ultra-low latency and supports up to 500K IOPS and 12,500 MiB/s throughput per Z4D VM and bare metal instance, making it well-suited for demanding database workloads. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started with Z4D today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Z4D VMs are available today in select regions worldwide and  Z4D bare metal instances are in preview - reach out to your account team for additional information and access. To start using Z4D instances, select Z4D under the Storage-Optimized machine family when creating a new VM or GKE node pool in the Google Cloud console. Learn more at the </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4D machine series</span></a><span style=\"vertical-align: baseline;\"> page. Contact your </span><a href=\"https://cloud.google.com/contact?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud sales</span></a><span style=\"vertical-align: baseline;\"> representative for more information on regional availability.</span></p></div>"
