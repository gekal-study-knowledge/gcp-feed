    "id": "bb701024ec1b2870443f4fc68fdc182a"
    "title": "JR東日本: Spanner と Cloud Run で「タッチトリガー」を実現し、改札データを起点に新たなコミュニケーションと価値を創出"
    "link": "https://cloud.google.com/blog/ja/topics/customers/jr-east-implements-touch-trigger-using-spanner-and-cloud-run/"
    "published": "2026-09-28 11:00:00"
    "fetched": "2026-09-28 12:47:14"
    "summary": "<div class=\"block-paragraph\"><p><b>利用しているサービス:</b><br /><a href=\"https://cloud.google.com/spanner\">Spanner</a>, <a href=\"https://cloud.google.com/run?hl=ja\">Cloud Run</a>, <a href=\"https://cloud.google.com/logging?hl=ja\">Cloud Logging</a>, <a href=\"https://docs.cloud.google.com/tasks/docs?hl=ja\">Cloud Tasks</a>, <a href=\"https://docs.cloud.google.com/scheduler/docs/overview?hl=ja\">Cloud Scheduler</a>, <a href=\"https://cloud.google.com/bigquery?\">BigQuery</a></p><p>東日本旅客鉄道株式会社（以下、JR東日本）が開発した「タッチトリガー」は、Suica の改札タッチをトリガー（起点）として、乗客のスマートフォンへタイムリーに情報を届ける新世代のコミュニケーション サービスです。この実現に向け、膨大なデータ トラフィックを支えるインフラとして選ばれたのが、Google Cloud の Spanner と Cloud Run でした。開発の背景から、Google Cloud の製品が選ばれた理由、そして活用事例まで、マーケティング本部でプロジェクトを推進する 4 名に話を伺いました。</p><h3><b>改札というリアルな接点から生まれる、生活に密着したデータ</b></h3><p>日本最大の鉄道事業者として、乗客の移動を支える JR東日本。同社が発行する交通系 IC カード Suica は、2001 年のサービス開始以来、累計発行枚数が 1 億 2,000 万枚を超え、移動・決済のインフラとして、私たちの生活に欠かせないものとなっています。今、同社は Suica の利便性をより高め、活用範囲を広げる「Suica Renaissance」構想を進めています。その核となる技術のひとつが、乗客の改札通過データをもとに、さまざまな情報を提供する「タッチトリガー」です。マーケティング本部の戦略・プラットフォーム部門で副部門長を務める廣瀬 道輝氏は、開発の背景にはコロナ禍があったと振り返ります。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"DSC07309final_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DSC07309final_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「コロナ禍の最中、人々が通勤・通学や外出を控えざるをえなくなり、鉄道の利用者が大きく減るという事態に直面しました。『人の移動』という弊社事業の前提が揺らいだのです。その危機感のなかで、単に移動のインフラを提供するだけでなく、お客様の生活に寄り添い、一人ひとりに新しい価値を提案していく必要があると強く感じました。そこで生まれたのが『タッチトリガー』です。Suica に紐づく改札データを集約し、利用駅や時間帯、行動の文脈などに基づいて分析していけば、パーソナライズされた情報やサービスをお届けできます。私たちは改札タッチのタイミングをお客様とのコミュニケーションのきっかけにしたいと考えています。そのため『タッチトリガー』を、お客様の生活の利便性や快適さを上げていくための『コミュニケーション機能』として位置づけています。」</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p>このような発想を根底で支えるのが、リアルなネットワークです。JR東日本の鉄道網は関東や東北、北陸に広がり、乗降客数は 1 日約 1,600 万人に上ります。ところが従来は、改札を通過した際に発生するデータはオンプレミスを軸にした社内システムで処理されており、巨大なポテンシャルをフルに活かしきれずにいました。この方法は、0.2 秒という超高速処理を実現するうえでは理にかなっていました。しかしマーケティングを担当するデジタルビジネスユニットの村上 洋輔氏は、全社横断的なデータ活用が急務だったと振り返ります。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"DSC07397final_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DSC07397final_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「改札ゲートはお客様の生活に密着したタッチポイントで、物理的な数の多さや、そこから得られるデータは、鉄道事業者ならではの強みだと考えています。また、あらゆる地域には駅を中心に商圏や生活圏が広がり、弊社のグループでもさまざまな部署が事業を展開していますので、データを横断的に活用すれば、大きなシナジーを生み出すことができます。そのためにも、運用基盤をクラウド化していくことが重要になっていました。折しも、Suica 全体をクラウド化していくという動きが全社的に進んでいましたので、『タッチトリガー』も、その流れと足並みをそろえることになりました。」</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Spanner と Cloud Run で厳しいトラフィック処理の要件をクリア</b></h3><p>ただし、データ処理のシステムをクラウドに移行するためには、厳しい技術要件がありました。まず 1 日のタッチ数は、山手線内の駅だけでも数百万回にのぼり、ラッシュ時には平常時の 10 倍にも跳ね上がります。無数の改札から送られてくるデータを、クラウド上のサーバーで処理するためには、トラフィックの急増に対応するスケーラビリティと、データを瞬時に記録する書き込み性能が鍵を握ります。これを満たすことができるのは、Google Cloud の製品だけだったといいます。</p><p>「ほぼすべてのクラウド型データベースで検証したところ、一般的な RDB（リレーショナル データベース）では処理能力に上限があり、要件を満たせないことがわかりました。しかし Spanner だけは違いました。データを自動で振り分けながら、高い整合性を保つことができますし、Cloud Run と組み合わせることで、乗客の増減に応じてほぼタイムラグなくオートスケールできることもわかりました。テスト実装の段階で、想定どおりのスペックが出たことに開発チームは驚いていました。Spanner と Cloud Run がなければ、『タッチトリガー』を今の形で実現させることは難しかったでしょう。」（廣瀬氏）</p><p>実装の際には、いくつかの工夫もなされています。データ活用を行うには、年代や利用駅、購買履歴といった属性と、マーケティングの目標を瞬時に掛け合わせる作業が不可欠となります。ただし Spanner はデータの整合性を維持するために、独自のインデックス設計を採用しており、データ加工が必要となります。そこで技術的な支援を行ったのが、Google Cloud のサポートチームでした。</p><p>「本格的に Spanner を使うのは初めてでしたが、あまり試行錯誤することなく、最適解にたどり着くことができたと感じています。現場のエンジニアたちも、処理スピードやコスト最適化の方法や、Data Boost を活用した分析クエリに対するリソースの競合の回避方法など、多くのノウハウを吸収しました。Google Cloud と協働しながら改札システムのクラウド化を進めていけば、改札を抜けてホームに向かう間に、パーソナルな通知が届くような環境も構築していけると思います。」（廣瀬氏）</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"【構成図案】タッチトリガー_アーキテクチャ図v4_簡易版_for blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GouChengTuAntatsuchitorika_akitekuchiyaTuv.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>「タッチトリガー」が活性化させていく、毎日の暮らしと地域コミュニティ</b></h3><p>「タッチトリガー」は 2024 年に山手線内の全駅に実装され、その後、JR東日本管内の新幹線停車駅や大井町などへ対象を広げています。最初に活用されたのは、同社が毎年開催している「山手線謎めぐり」というイベントでした。「タッチトリガー」のシステムやオペレーションを担当する、デジタルビジネスユニットの新名 恵里佳氏は、盛り上がりを鮮明に覚えていました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"DSC07436final_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DSC07436final_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「これは沿線の街を散策しながら、謎解きをしていく体験型のイベントで、毎年多くの方にご参加いただいています。2024 年は Suica をタッチすると、駅に応じたコンテンツが配信される仕組みを採り入れました。参加した方からは『Suica でこんなことができるんだ！』という驚きの声があがっていました。その後、2025年には『みんなのトレインタウン』というスマホゲームでも、ミッションの達成条件に『改札タッチ』を組み込み、アイテムを獲得できるようにする施策なども行っています。」</p><p>また、JR東日本が推進する「まちづくり」との連携も進んでいます。同社は駅と接続する大型複合施設<b>「</b>TAKANAWA GATEWAY CITY」を 2025 年にオープン。その「まちびらき」に伴い、実証実験が行われました。同本部 まちづくり部門 品川ユニットチーフの小坂 和広氏は、反響の大きさが想像以上だったと説明します。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"DSC07357final_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DSC07357final_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「弊社のオフィスでは入館管理に Suica を使っており、この方法を他の用途に活用できないかという声は以前からありました。ちょうど全社的に『タッチトリガー』のプロジェクトが始まっていましたので、アプリと Suica を連携していただいたユーザーの方を対象に、改札を出ると施設内のお店でドリップ コーヒーをプレゼントするクーポンを配信しました。アプリはローンチしたばかりでしたが、用意した 800 袋を 4 日間で配り終えるなど、想像以上の効果が得られました。提案する情報や通知のタイミングを含め、テストを重ねてより良い方法を探っていければと考えています。<b>」</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2026 年 3 月には大井町駅で、コンビニエンス ストアの NewDays と連携し、おすすめ情報やクーポンを配信する施策が開始されています。一方、新幹線では、より踏み込んだ取り組みが行われてきました。村上氏によれば、2025 年には「GunMaaS」（群馬県内のさまざまな交通手段をシームレスに結びつけるスマートフォン向けサービス）と連携し、高崎駅で降りる乗客にタクシーを配車する試みが始まりました。</span><span style=\"vertical-align: baseline;\">「新幹線は『タッチトリガー』の展開という点で、非常にわかりやすいケースになっています。お客様が利用される便の時間や目的地、車内での滞在時間はあらかじめ把握できますので、乗車中はドラマや漫画などのコンテンツをご案内し、現地についたときには地元のタクシー会社がすでにお待ちしている。観光や宿泊情報のご提案なども、その方のニーズや志向に合わせて実施することができます。これを重ねていくことで、お客様と各事業者双方にとって Win-Win の関係を構築できます。」</span><span style=\"vertical-align: baseline;\">現在、同社は JRE ID の一本化に取り組んでおり、2028 年に Suica アプリ（仮称）が新たにリリースされれば、本格的な 1 to 1 コミュニケーションも可能になる見込みです。改札ゲートを起点に、データ活用の在り方が変わり、地域社会が変わり、毎日の生活が変わっていく。「タッチトリガー」と JR東日本の挑戦は、さらに加速していきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">「『タッチトリガー』は、駅商圏を中心にサービスを展開する事業と特に相性が良いので、グループ外の企業とも実証実験を進めていく予定です。むろんお客様に安心してご利用いただけることが何よりも大切ですので、各種アプリと連携する際にはお客様の同意を得たうえで、情報を必要な範囲に限り、適切かつ安全に取り扱います。そのうえで『タッチトリガー』を軸にコミュニケーションを充実させ、すべての駅を、クオリティ オブ ライフの充実や新たな事業展開、そして地域活性化を推進するハブにしていければと考えています。」（廣瀬氏）</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"DSC05145final02_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DSC05145final02_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><a href=\"https://www.jreast.co.jp/\" target=\"_blank\"><b>東日本旅客鉄道株式会社（JR東日本）</b></a><br />1987 年に日本国有鉄道（国鉄）の分割民営化により設立。首都圏を中心に関東甲信越から東北までの東日本エリアの鉄道網を管轄し、営業キロは 7,418.7 km、輸送人員は 1 日あたり約 1,600 万人を誇る世界最大級の旅客鉄道会社。従来の交通事業に加え、Suica を核とするデジタル トランスフォーメーション、駅ビルや商業施設を中心としたまちづくりを推進。国際交流拠点「TAKANAWA GATEWAY CITY」、都市生活共創拠点「OIMACHI TRACKS」を中心とした「広域品川圏」の都市開発にも取り組む。</p><p><b>インタビュイー（写真右から）:</b><br />マーケティング本部<br />・戦略・プラットフォーム部門 副部門長　廣瀬 道輝 氏<br />・戦略・プラットフォーム部門 デジタルビジネスユニット　村上 洋輔 氏<br />・戦略・プラットフォーム部門 デジタルビジネスユニット　新名 恵里佳 氏<br />・まちづくり部門 品川ユニット TAKANAWA GATEWAY CITY（デジタルサービス戦略）チーフ　小坂 和広 氏</p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※文中の組織名・役職名は取材当時のものです。</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">その他の導入事例は</span><a href=\"https://cloud.google.com/customers?hl=ja&amp;e=48754805#/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p></div>"
