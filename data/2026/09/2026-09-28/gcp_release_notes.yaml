    "summary": "<h2 class=\"release-note-product-title\">Application Integration</h2>\n<h3>Security</h3>\n<p>A Confused Deputy vulnerability was discovered in the Email Task component in \nApplication Integration versions prior to June 30, 2026.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/application-integration/docs/security-bulletins#gcp-2026-066\">GCP-2026-066</a>\nsecurity bulletin.</p>\n<h3>Security</h3>\n<p>A Deserialization of Untrusted Data vulnerability was discovered in\nthe JavaScript Task in Application Integration versions prior\nto June 28, 2026. For more information, see the\n<a href=\"https://docs.cloud.google.com/application-integration/docs/security-bulletins#gcp-2026-065\">GCP-2026-065</a>\nsecurity bulletin.</p>\n<h3>Security</h3>\n<p>An Incorrect Authorization vulnerability was discovered in the task\nconfiguration in Application Integration versions prior to June 17, 2026.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/application-integration/docs/security-bulletins#gcp-2026-064\">GCP-2026-064</a>\nsecurity bulletin.</p>\n<h2 class=\"release-note-product-title\">Cloud Load Balancing</h2>\n<h3>Feature</h3>\n<p>Zonal network endpoint groups (NEGs) with <code>GCE_VM_IP</code> and <code>GCE_VM_IP_PORT</code>\nendpoints support IPv6-only endpoints that reference IPv6-only or dual-stack\nCompute Engine VM network interfaces.</p>\n<p>This feature is available in <strong>Preview</strong>.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/load-balancing/docs/negs/zonal-neg-concepts\">Zonal network endpoint groups overview</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Logging</h2>\n<h3>Breaking</h3>\n<p>Only platform services can write log entries to billing accounts.\nThese logs have names with the format\n<code>billingAccounts/[BILLING_ACCOUNT_ID]/logs/[LOG_ID]</code>.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/entries/write\"><code>entries.write</code></a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Monitoring</h2>\n<h3>Deprecated</h3>\n<p>The legacy Monitoring agent has officially reached its end of support. All\nstandard maintenance and regular bug fixes for the agent have ceased. We\nrecommend migrating to one of the <a href=\"https://docs.cloud.google.com/monitoring/agent/index\">supported\nalternatives</a>. For more information about this\ndeprecation, see <a href=\"https://docs.cloud.google.com/stackdriver/docs/deprecations/logging-agent\">Legacy Monitoring and Logging agent end of\nsupport</a>.</p>\n<h2 class=\"release-note-product-title\">Compute Engine</h2>\n<h3>Feature</h3>\n<p><strong>Allowlisted GA</strong>: You can expose the host ID of a Compute Engine\ninstance to verify its physical location in relation to other compute instances\nin your Google Cloud organization. Use compute instance proximity in a\nzone to optimize latency-sensitive workloads or improve the reliability of your\napplications. For more information, see\n<a href=\"https://docs.cloud.google.com/compute/docs/instances/view-instance-topology\">View the physical location of a Compute Engine instance</a>.</p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Template-specific exclusion rules are available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>. This\nfeature lets you configure dictionary (word and phrase lists) and regular\nexpression rules to mitigate false-positive detections for prompt injection and\njailbreak detection and responsible AI filters.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/configure-exclusion-rules\">Configure template-specific exclusion\nrules</a>.</p>"
