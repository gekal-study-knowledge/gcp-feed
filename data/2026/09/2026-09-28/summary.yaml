"overview": |
  この日は 3 件で、ストレージ最適化インスタンスの一般提供と、セキュリティ速報を含むリリースノートが中心でした。コンピュートでは、ストレージ最適化の Z4D マシンシリーズが仮想マシンとベアメタルの両方で一般提供となりました。SQL・NoSQL・KVrocks・ベクトルデータベース、データ分析、データ検索のように、大容量のローカルストレージと高いストレージ性能を必要とする IO 集約型かつビジネスクリティカルなワークロード向けです。第 5 世代 AMD EPYC (Turin) と最新の Titanium の強化を組み合わせ、最大 84,000 GiB のローカル SSD を備え、前世代の Z3 と比べてこうしたワークロードの性能を最大 40% 改善します。VM は 2 種類で、vCPU あたり 219 GiB のローカル SSD を持つ Z4D-highmem-standardlssd (7 つのシェイプ。OLAP のデータ分析や MySQL・Postgres 向けに最適化) と、vCPU あたり 438 GiB の Z4D-highmem-highlssd (7 つのシェイプ。分散データベース、データストリーミング、大規模な並列ファイルシステム向け) が用意されます。大容量のローカル SSD は AI / ML の学習・推論や、分散並列ファイルシステムを大規模に動かす用途にも向くとされています。リリースノートでは Application Integration のセキュリティ速報が 3 件公開されました。Email Task コンポーネントの Confused Deputy 脆弱性 (2026 年 6 月 30 日より前のバージョン、GCP-2026-066)、JavaScript Task の信頼できないデータのデシリアライズ脆弱性 (2026 年 6 月 28 日より前、GCP-2026-065)、タスク設定における不適切な認可の脆弱性 (2026 年 6 月 17 日より前、GCP-2026-064) です。あわせて、Cloud Monitoring のレガシー Monitoring エージェントが正式にサポート終了となり、通常の保守とバグ修正が停止したため、サポートされている代替への移行が推奨されています。Cloud Logging では破壊的変更として、請求先アカウントへのログエントリの書き込みがプラットフォームサービスに限定されました。このほか、Cloud Load Balancing のゾーン NEG (GCE_VM_IP / GCE_VM_IP_PORT エンドポイント) が IPv6 専用エンドポイントに対応 (プレビュー)、Compute Engine でインスタンスのホスト ID を公開して同一ゾーン内の物理的な近接性を確認できる機能が許可リスト付きで GA (レイテンシーに敏感なワークロードの最適化や可用性の改善に利用)、Model Armor でテンプレート単位の除外ルールがプレビュー (辞書と正規表現のルールを設定して、プロンプトインジェクション / ジェイルブレイク検出と Responsible AI フィルターの誤検知を抑える) が届いています。事例では、JR東日本が Suica の改札タッチを起点に乗客のスマートフォンへタイムリーに情報を届ける「タッチトリガー」を Spanner と Cloud Run で実現した取り組みが紹介されました。累計発行枚数 1 億 2,000 万枚を超える Suica と、1 日約 1,600 万人の乗降客という規模のデータトラフィックを支える基盤として Google Cloud が選ばれています。従来は改札通過時のデータをオンプレミス中心の社内システムで処理しており、0.2 秒という超高速処理には合っていたものの、全社横断のデータ活用が進めにくかったという背景が語られています。
