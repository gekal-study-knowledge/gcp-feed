"overview": |
  この日は 4 件で、AI インフラの利用効率をどう引き上げるかという話題が並びました。マルチクラスターの GKE Inference Gateway では、世界各地に散らばったアクセラレーターを単一の入口の裏で 1 つのプールのように扱う階層型ルーティングが紹介され、エッジ側のゲートウェイがグローバル・マルチリージョンのトラフィック分散と高可用性を担い、その下で LLM-d ルーターがメモリを考慮したスケジューリングで使用率を保ちます。この構成はランタイム・モデル・アクセラレーターのいずれにも依存せず、オーバーヘッドは 1% 未満とされています。GKE Pod スナップショットは、CPU と GPU のメモリを含む実行中の状態を保存して必要なときに復元する新機能で、AI 推論の起動を最大 89% 短縮し、700 億パラメータのモデルを 37 秒、80 億パラメータのモデルを 15 秒で読み込めるため、需要に合わせた拡張のために過剰にプロビジョニングする必要が減ります。データ処理では、Managed Service for Apache Spark のフレキシブル VM が取り上げられ、クラスターを特定のインスタンスタイプに固定する代わりに許容できるマシンファミリーを優先順位付きで指定することで、ゾーンやリージョンの在庫切れ (キャパシティストックアウト) でもパイプラインを動かし続けられる方法が解説されています。セキュリティでは、Secure Source Manager に 2 つの機能が一般提供として加わりました。社内ネットワークが侵害された場合でも CI/CD システムへの不正アクセスを遮断できるようになり、新しい Code Owners でファイル単位・ブランチ単位にプルリクエストの承認者を管理できます。2026 年上半期のサプライチェーン攻撃が 2025 年下半期比で 2 倍以上に増えたという Wiz のレポートが背景として挙げられています。
