  "f7251f3ac2ecbb2791ae325284a2d216":
    "id": "f7251f3ac2ecbb2791ae325284a2d216"
    "title": "Global AI routing with <1% overhead on multi-cluster GKE Inference Gateway"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gpu-and-tpu-utilization-with-multi-cluster-gke-inference-gateway/"
    "published": "2026-09-22 01:00:00"
    "fetched": "2026-09-22 04:51:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Demand for AI infrastructure is at an all-time high. Global accelerator shortages mean engineering teams can rarely get all the compute they need from just one data center — capacity comes a cluster here, a cluster there, often an ocean apart. At the same time, workloads are getting hungrier: Today’s long-running agentic workloads often have context windows of 100k to 800k+ tokens, which consume accelerator memory faster than any previous generation of AI traffic.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this environment, the goal is to maximize \"intelligence per dollar.\" Fragmented, poorly balanced infrastructure is rarely up to the task though, allowing expensive accelerators to sit idle, while requests queue up somewhere else.</span></p>\n<p><span style=\"vertical-align: baseline;\">To close that gap, we built a layered routing architecture that makes globally scattered capacity behave like a single pool behind a single entry point. At the edge, the </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/multi-cluster-gke-inference-gateway-helps-scale-ai-workloads\"><span style=\"text-decoration: underline; vertical-align: baseline;\">multi-cluster GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\"> focuses on global, multi-region traffic distribution and high availability. Beneath that, the LLM-d router handles the complex, memory-aware scheduling algorithms that keep utilization high. </span></p>\n<p><span style=\"vertical-align: baseline;\">This architecture is deliberately runtime-, model-, and accelerator-agnostic — it works across serving frameworks, model families, and GPU or TPU hardware. To make the results concrete rather than abstract, we recently benchmarked managing production-level global request routing at scale across a multi-region GKE deployment of 17,000 compute nodes spread across the US and Europe. The deployment served a leading Mixture of Experts (MoE) foundation model using SGLang. </span></p>\n<p><span style=\"vertical-align: baseline;\">The results: Scaling to three clusters achieved a near-linear throughput boost while maintaining a 99.9% success rate under heavy multi-client concurrency. Additionally, routing traffic through the multi-cluster GKE Inference Gateway added less than 1% overhead, delivering 99.5% of the throughput of a direct, local cluster call.</span></p>\n<p><span style=\"vertical-align: baseline;\">Read on to learn how it works, more on the benchmark results, and what it means for your own distributed inference deployment.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Three regions, one endpoint</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The deployment spanned three GKE clusters in three geographic regions: us-east5 (the config cluster), us-west8, and europe-west4. However, from the client’s perspective, none of that geography exists. Requests hit a single global virtual IP, and the gateway decides — in real time — which cluster should serve each one</span><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">What makes that decision smart rather than blind is telemetry. Instead of traditional round-robin routing at the network layer, the multi-cluster load balancer is configured to route traffic based on live application signals. Specifically, the Endpoint Picker Proxy (EPP) reads the KV-cache token utilization natively exposed by the underlying inference engines and emits it as a metric for the load balancer. When the load balancer sees a region running hot based on this emitted metric, it spills traffic to the next healthy region.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_Ab2Qxsv.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Multi-cluster GKE Inference Gateway topology. The config cluster holds routing configuration but sits outside the request path; each target cluster runs its own EPP and reports KV-cache utilization back to the load balancer.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Distributed LLM engines also operate differently than standard web apps. In a typical inference engine's distributed mode (such as tensor parallelism across multiple nodes), only the master (rank-0) pod serves the API. GKE already handles local routing using standard Service selectors and LeaderWorkerSet (LWS) to direct traffic exclusively to leader pods. The multi-cluster Inference Gateway also integrates with this foundation: It routes global traffic to the correct regional services, helping your cross-region load balancing respects your underlying multi-node topologies out of the box.</span></p>\n<p><span style=\"vertical-align: baseline;\">The net effect: Three isolated regional data centers start behaving like one cohesive global accelerator fleet, with failover and load balancing driven by what the models are actually doing. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Measuring the routing overhead </strong></h3>\n<p><span style=\"vertical-align: baseline;\">The first question every team asks about a global routing tier is almost always, ‘How much throughput am I giving up for cross-region capability?’ </span></p>\n<p><span style=\"vertical-align: baseline;\">The benchmarks answer this directly: Deploying the multi-cluster GKE Inference Gateway to maximize your accelerator fleet doesn't have to come at the cost of throughput. Routing traffic through the Gateway added less than 1% overhead, delivering 99.5% of the throughput of a direct, local cluster call.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_EHxlS3Z.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">That’s the whole trade-off. All the benefits of global load balancing, essentially for free.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Linear scaling across regions </strong></h3>\n<p><span style=\"vertical-align: baseline;\">A</span><span style=\"vertical-align: baseline;\"> bigger test is scale. In our test, growing the fleet from one cluster to three, spanning the US and Europe, while every client request originated from a single region (us-east5), put real pressure on the Gateway: If it couldn’t distribute load efficiently across those distances, throughput would flatten as hardware was added. </span></p>\n<p><span style=\"vertical-align: baseline;\">Instead, throughput multiplied almost exactly in line with capacity: <br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 99.3473%;\"><colgroup><col style=\"width: 43.2125%;\" /><col style=\"width: 20.0334%;\" /><col style=\"width: 20.0334%;\" /><col style=\"width: 16.8876%;\" /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Fleet topology </strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Request </strong></p>\n<p><strong style=\"vertical-align: baseline;\">throughput</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Token </strong></p>\n<p><strong style=\"vertical-align: baseline;\">throughput</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Success </strong></p>\n<p><strong style=\"vertical-align: baseline;\">rate</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1 cluster (us-east5-a) </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">0.72 req/s </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2,898 tok/s </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">99.87%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2 clusters (+ us-west8-a) </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1.40 req/s </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">6,380 tok/s </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">99.95%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3 clusters (+ europe-west4- b) </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2.10 req/s </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">8,457 tok/s </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">99.90%</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_iKOndNB.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Scaling to three clusters achieved a near-linear throughput boost while maintaining a 99.9% success rate under heavy multi-client concurrency.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Memory-aware routing in action </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Round-robin load balancing is inadequate for serving LLMs because it treats every request as equal. They aren’t. Heavy prompts saturate GPU compute cores, long generations stress memory bandwidth, and long-context conversations quietly eat VRAM until the engine can’t schedule anything new. </span></p>\n<p><span style=\"vertical-align: baseline;\">Here, the pressure on memory bandwidth came from the routing signal chosen for this deployment. By mapping Inference Engine's native token-usage metric onto the Gateway’s KV-cache signal, the routing plane gained a real-time view of memory pressure across the entire 17,000 fleet. (Depending on the workload, the Gateway can route on other signals too, like queue depth or running concurrency.) </span></p>\n<p><span style=\"vertical-align: baseline;\">Under live production loads, as the primary region climbed toward its high-bandwidth memory (HBM) limits, the Gateway detected the saturation the moment the cluster crossed its 40% KV-cache utilization threshold; it then automatically began routing the overflow to the next healthy region. No operator intervention was needed. The complexity of running in multiple regions simply never reached the user. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The payoff</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By routing traffic based on live KV-cache utilization, this GKE Inference Gateway setup effectively pools globally scattered compute capacity into one unified engine. For this deployment, the result was a near-linear throughput boost across three global regions, with virtually zero routing overhead.</span></p>\n<p><span style=\"vertical-align: baseline;\">This translates directly into maximizing 'intelligence per dollar,' extracting near-perfect proportional performance out of every accelerator you add to your fleet, rather than letting capital go to waste.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What this means for your team </strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">If you’re planning your own distributed inference deployment, five lessons from this work stand out:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Smarter load balancing pays for itself</strong><span style=\"vertical-align: baseline;\">. Round-robin routing wastes expensive GPU capacity because it can’t see memory or compute pressure. Routing on real-time application signals turns fragmented regional clusters into one efficient fleet — the difference between stranded hardware and 90%+ utilization of scarce compute.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Agentic workloads change the bottleneck</strong><span style=\"vertical-align: baseline;\">. Long-running agents with extreme context windows exhaust memory long before there’s no more compute. If your routing layer can’t see memory pressure, your compute will strand compute behind full VRAM. Make KV-cache utilization a first-class routing signal.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">AI traffic breaks web-era assumptions</strong><span style=\"vertical-align: baseline;\">. Traditional load balancers are tuned for sub-second transactions; LLM requests can run for minutes. Plan connection limits and timeouts for AI-scale latency early, or expect aborted connections in production.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Your routing layer must integrate with native serving patterns</strong><span style=\"vertical-align: baseline;\">. Distributed LLM engines have master-worker topologies where only certain pods can serve traffic. By pairing your Gateway with native Kubernetes constructs like LeaderWorkerSet (LWS), your global routing respects local pod topologies out of the box, saving your team from building custom proxy infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">For large foundation model builders, bet on an open, portable stack.</strong><span style=\"vertical-align: baseline;\"> Teams operating at frontier scale face the most acute capacity fragmentation, forcing them to hunt for compute resources across whichever regions have availability capacity. An open, portable inference stack such as LLM-d on GKE lets you absorb that capacity wherever it lands, rather than hard-wiring your serving architecture to any single cluster, region, or bespoke infrastructure.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Next steps </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ready to maximize your distributed accelerator efficiency and set up global cross-region load balancing with multi-cluster GKE Inference Gateway? </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Deploy it yourself: </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/setup-multicluster-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Set up the multi-cluster GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Understand the architecture: </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-multi-cluster-inference-gateway\"><span style=\"text-decoration: underline; vertical-align: baseline;\">About multi-cluster GKE Inference Gateway</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn about the cross-region spillover behavior featured in this post: </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-elastic-cross-region-high-availability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">About elastic cross-region high availability</span></a><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/configure-elastic-cross-region-high-availability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Configure elastic cross-region high availability</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n</ol></div>"
  "f77655833daead7e3ca27899b8456a98":
    "id": "f77655833daead7e3ca27899b8456a98"
    "title": "Maximizing Apache Spark availability: Mitigating compute stockouts with flexible VMs and other best practices"
    "link": "https://cloud.google.com/blog/products/data-analytics/maximize-apache-spark-availability-with-flexible-vms/"
    "published": "2026-09-22 01:00:00"
    "fetched": "2026-09-22 04:51:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The surge in AI development has created unprecedented demand for compute capacity around the globe. This can have negative implications for data processing and pipelines with Apache Spark. Whether you are managing your own Spark infrastructure or using a managed service, you can face availability constraints. However, a significant advantage of using Google’s </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> is the availability of </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">flexible VMs,</span></a><span style=\"vertical-align: baseline;\"> which provide a targeted mechanism to adopt a dynamic, resource-agnostic philosophy and ensure your pipelines remain operational, even during regional or zonal capacity stockouts.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Understanding capacity stockouts</span></h3>\n<p><span style=\"vertical-align: baseline;\">Capacity stockouts occur when demand for a specific machine family (such as N2 or N2D) exceeds available capacity in a target zone or region. For time-sensitive analytics pipelines, rigid single-VM requirements transform standard provisioning into a single point of failure which can result in cluster creation delays, failed executions, and potentially compromised business SLAs.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Flexible VMs</span></h3>\n<p><span style=\"vertical-align: baseline;\">Flexible VMs fundamentally overhaul how a Managed Spark cluster requests compute resources. Rather than binding a cluster to a rigid instance type, flexible VMs allow teams to establish an ordered list of acceptable machine families for master, primary worker, and secondary worker nodes.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Key features</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-family blending:</strong><span style=\"vertical-align: baseline;\"> Mix nodes across diverse machine types and generations, combining Gen2 families (e.g., N2, N2D) with Gen4 families (e.g., N4, C4) in a single configuration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mixed storage support:</strong><span style=\"vertical-align: baseline;\"> Broaden available capacity pools by allowing storage options to dynamically adapt to the underlying host family's supported disk types.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Comprehensive cluster coverage:</strong><span style=\"vertical-align: baseline;\"> Apply flexible rules to primary workers, secondary (preemptible/spot) workers, and master nodes to guarantee cluster provisioning end-to-end.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Ranked configuration: A strategy for success</span></h3>\n<p><span style=\"vertical-align: baseline;\">A successful flexible VM implementation relies on intentional ranking. By defining a clear hierarchy of options, Managed Spark clusters automatically attempt provisioning, systematically mitigating stockout risks without requiring manual intervention. To improve the availability of  suitable VMs, we recommend specifying at least two machine families in the highest priority (Rank 0) flexible VM list.</span></p>\n<p><span style=\"vertical-align: baseline;\">As an example, for production pipelines standardizing on </span><strong style=\"vertical-align: baseline;\">n2d-standard-16</strong><span style=\"vertical-align: baseline;\"> shapes, the following tiering strategy provides robust resilience against capacity constraints:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 98.9556%;\"><colgroup><col style=\"width: 23.9583%;\" /><col style=\"width: 41.0156%;\" /><col style=\"width: 35.026%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Machine family examples</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Storage recommendation</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 0 (Primary)</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">n2d-standard-16, n2-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Standard Local SSD or PD</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 1</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">n4-standard-16, n4d-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Hyperdisk Balanced</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 2</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">c4-standard-16, c3-standard-22</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Hyperdisk Balanced</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 3 </strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">e2-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Standard PD</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud dataproc clusters create $CLUSTER_NAME \\\\\\r\\n--num-workers=10 \\\\\\r\\n--zone=&quot;&quot; \\\\\\r\\n--region=us-east1 \\\\\\r\\n--worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n2d-standard-16&quot;,&quot;n2-standard-16&quot;],&quot;rank&quot;:0,&quot;diskConfig&quot;:{&quot;bootDiskType&quot;:&quot;pd-standard&quot;,&quot;bootDiskSizeGb&quot;:400}}\\&#x27; \\\\\\r\\n--worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n4-standard-16&quot;,&quot;n4d-standard-16&quot;],&quot;rank&quot;:1,&quot;diskConfig&quot;:{&quot;bootDiskType&quot;:&quot;hyperdisk-balanced&quot;,&quot;bootDiskSizeGb&quot;:400}}\\&#x27; \\\\\\r\\n--worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;c4-standard-16&quot;,&quot;c3-standard-22&quot;],&quot;rank&quot;:2,&quot;diskConfig&quot;:{&quot;bootDiskType&quot;:&quot;hyperdisk-balanced&quot;,&quot;bootDiskSizeGb&quot;:400}}\\&#x27; \\\\\\r\\n--worker-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;e2-standard-16&quot;],&quot;rank&quot;:3, &quot;diskConfig&quot;:{&quot;bootDiskType&quot;:&quot;pd-ssd&quot;,&quot;bootDiskSizeGb&quot;:400}}\\&#x27; \\\\\\r\\n--master-instance-selection=\\&#x27;{&quot;machineTypes&quot;:[&quot;n4-standard-16&quot;,&quot;n4d-standard-16&quot;],&quot;rank&quot;:0,&quot;diskConfig&quot;:{&quot;bootDiskType&quot;:&quot;hyperdisk-balanced&quot;,&quot;bootDiskSizeGb&quot;:400}}\\&#x27;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7faf5d1b6790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For pipelines standardizing on legacy </span><strong style=\"vertical-align: baseline;\">n1-standard-16</strong><span style=\"vertical-align: baseline;\"> shapes, the following tiering strategy helps transition workloads toward newer, more available architectures while preserving operational stability:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 99.7389%;\"><colgroup><col style=\"width: 25.625%;\" /><col style=\"width: 36.875%;\" /><col style=\"width: 37.3438%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Machine family examples</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Storage recommendation</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 0 (Primary)</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">n1-standard-16</span></p>\n<p><span style=\"vertical-align: baseline;\">n2-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Standard Local SSD or PD</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 1</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">n2d-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Standard Local SSD or PD</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 2</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">n4-standard-16</span></p>\n<p><span style=\"vertical-align: baseline;\">n4d-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Hyperdisk Balanced</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Rank 3</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">e2-standard-16</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Standard PD</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">Leveraging Hyperdisk Balanced</span></h3>\n<p><span style=\"vertical-align: baseline;\">Unlocking maximum availability with flexible VMs often requires adopting modern storage architectures like </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hd-types/hyperdisk-balanced\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Balanced</span></a><span style=\"vertical-align: baseline;\">. Newer instance families (including N4 and C4) rely on Hyperdisk to deliver predictable performance across variable VM sizes. Starting with default IOPS and throughput settings typically provides a reliable baseline for the majority of distributed Spark jobs.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Trade-offs and key considerations</span></h3>\n<p><span style=\"vertical-align: baseline;\">While flexible VMs  dramatically improve cluster provisioning success, aligning them with enterprise requirements involves evaluating several architectural and financial factors:</span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Resource quotas</span></h4>\n<p><span style=\"vertical-align: baseline;\">It is no longer enough to have one specific machine (e.g., N2) quota. You need to ensure you have sufficient compute and disk quotas allocated for all specific machine types and disks (including Hyperdisk) defined in their flexible VM lists.</span></p>\n<h4><span style=\"vertical-align: baseline;\">2. Compute flexible Committed Use Discounts (CUDs)</span></h4>\n<p><span style=\"vertical-align: baseline;\">Traditional, resource-based CUDs are tied to specific machine families, which limits flexibility. Adopt </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview#spend_based\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute flexible Committed Use Discounts (CUDs)</span></a><span style=\"vertical-align: baseline;\"> to apply savings across multiple VM families and regions.</span></p>\n<h4><span style=\"vertical-align: baseline;\">3. Performance Characteristics</span></h4>\n<p><span style=\"vertical-align: baseline;\">Performance can vary between machine generations, as well as between Local SSD and Hyperdisk. While the Managed Spark team maintains </span><a href=\"https://docs.cloud.google.com/compute/docs/machine-resource\"><span style=\"text-decoration: underline; vertical-align: baseline;\">internal benchmarks for these comparisons</span></a><span style=\"vertical-align: baseline;\">, actual outcomes are workload-dependent. Testing your specific Spark jobs across these families is essential for understanding SLA impacts.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Additional recommendations</span></h3>\n<p><span style=\"vertical-align: baseline;\">In addition to implementing flexible VMs, there are several other key architectural and scheduling strategies to improve resource availability and workload stability:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AutoZone:</strong><span style=\"vertical-align: baseline;\"> Implement </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/auto-zone\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AutoZone</span></a><span style=\"vertical-align: baseline;\"> routing to allow Managed Spark to automatically select the zone best suited to execute the job based on current capacity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Smaller machine shapes:</strong><span style=\"vertical-align: baseline;\"> Avoid high in demand, large-core shapes. Design workloads and YARN containers to utilize </span><a href=\"https://docs.cloud.google.com/compute/docs/general-purpose-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">smaller machine shapes</span></a><span style=\"vertical-align: baseline;\"> (such as 4, 8, or 16 cores). These smaller shapes are much easier to fulfill from the available GCE on-demand pool.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Autoscaling:</strong><span style=\"vertical-align: baseline;\"> Deploy cluster </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/autoscaling\"><span style=\"text-decoration: underline; vertical-align: baseline;\">autoscaling</span></a><span style=\"vertical-align: baseline;\"> with reasonable </span><code style=\"vertical-align: baseline;\">maxInstances</code><span style=\"vertical-align: baseline;\"> to manage capacity effectively for bursty or unpredictable workloads without relying on rigid, massive upfront provisioning.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/managed-spark/docs/guides/create-partial-cluster\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Partial cluster creation</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Configure a minimum acceptable number of primary workers. This allows clusters to spin up under resource constraints and begin executing, while autoscaling can dynamically add remaining workers as resources become available.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Establish regional fallbacks:</strong><span style=\"vertical-align: baseline;\"> Some regions, such as </span><code style=\"vertical-align: baseline;\">us-central1,</code><span style=\"vertical-align: baseline;\"> can experience  high demand. Setting up fallbacks to other regions reduces capacity stockout risks.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Keep your Spark jobs running with flexible VMs</span></h3>\n<p><span style=\"vertical-align: baseline;\">Managing your own Apache Spark infrastructure can be complex, especially when capacity stockouts disrupt your data processing. Utilizing a managed service like Managed Service for Apache Spark provides unique advantages — including built-in platform resilience and access to flexible VMs. By adopting a prioritized fallback strategy with flexible VMs, you can protect your workloads from regional hardware shortages and keep your critical pipelines running.</span></p>\n<p><span style=\"vertical-align: baseline;\">Ready to improve your Spark workload resilience? Start configuring</span> <a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/configuring-clusters/flexible-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">flexible VMs</span></a><span style=\"vertical-align: baseline;\"> for your Managed Spark clusters today.</span></p></div>"
  "85e37bf9fdea5552f64a6c16b1b319d3":
    "id": "85e37bf9fdea5552f64a6c16b1b319d3"
    "title": "Scale your AI workloads faster and more efficiently with GKE Pod snapshots"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gke-pod-snapshots/"
    "published": "2026-09-22 01:00:00"
    "fetched": "2026-09-22 04:51:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When running modern AI workloads, there’s often a conflict between performance and cost. Workloads like large language models (LLMs) load massive files, and may serve thousands of AI agents that need to execute code instantly. If each component is starting “cold” with a full data-load process, all this provisioning takes time, often forcing organizations to overprovision their infrastructure just to meet scaling requirements.</span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this, we introduced Google Kubernetes Engine (GKE) Pod snapshots, a new feature that lets you save the running state of your workload, including CPU and GPU memory, and restore it on demand.</span></p>\n<p><span style=\"vertical-align: baseline;\">GKE Pod snapshots reduce AI inference start-up by as much as 89%, loading 70B parameter models in just 37 seconds and 8B parameters models in just 15 seconds. This speed allows your infrastructure to scale as fast as your demand, significantly reducing the need for overprovisioning.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_7paztIh.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">The high cost of cold starts — resuming instead of restarting</span></h3>\n<p><span style=\"vertical-align: baseline;\">The cold start problem isn't unique to AI; it’s a challenge for any application that requires significant initialization time — from game servers to complex Java monoliths. However, the cold start problem is particularly acute in AI workloads. Inference servers must initialize, then download and load gigabytes of model weights into GPU memory — a process that can take several minutes. Further, many agentic AI workloads, including code execution and computer use tools, require isolated sandboxes for each request, and they need to be started quickly and suspended when idle.</span></p>\n<p><span style=\"vertical-align: baseline;\">In both scenarios, startup latency degrades the user experience and prevents rapid auto-scaling during traffic spikes. Consequently, engineers often resort to overprovisioning expensive infrastructure, or building sophisticated, custom systems to quickly restore state at the application level.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Scaling AI inference without the wait</span></h3>\n<p><span style=\"vertical-align: baseline;\">For generative AI, GKE Pod snapshots solves the linear scaling penalty of model loading. Typically, every new replica you add to a cluster must independently download model weights and load them into accelerator memory. For models with tens of billions of parameters, this step alone often accounts for the majority of the startup time.</span></p>\n<p><span style=\"vertical-align: baseline;\">With Pod snapshots, you perform this initialization once to create the initial snapshot. GKE captures the fully loaded state including the CPU and GPU memory and persists it in high-throughput Cloud Storage. When the workload needs to scale up, new replicas restore directly from this state, bypassing the initialization phase entirely. In our benchmarks this approach reduced startup latency by as much as 89% for large models like llama3-70b. This speed allows platform teams to shift from expensive overprovisioning strategies to on-demand autoscaling, to help you meet service level objectives while significantly reducing idle GPU costs.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_prQa1Yb.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Optimizing agentic workflows and sandboxes</span></h3>\n<p><span style=\"vertical-align: baseline;\">GKE Pod snapshots also provide distinct advantages for agentic workflows where agents delegate code execution and computer use to isolated sandboxes. Isolating untrusted, LLM-generated code and commands means one sandbox per user or discrete workflow. In these scenarios, both startup latency and idle sandboxes can result in significant overprovisioning and underutilization. </span></p>\n<p><span style=\"vertical-align: baseline;\">Pod snapshots addresses both of these challenges:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">To improve startup latency,</strong><span style=\"vertical-align: baseline;\"> a snapshot can be captured once of the initial agent sandbox environment, and later used to quickly initialize new sandboxes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">To reduce idle sandboxes,</strong><span style=\"vertical-align: baseline;\"> a sandbox can be suspended when idle, capturing its entire compute resources. Later it can be resumed nearly instantly when the environment is needed.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">This approach is showing significant success by our customers. For instance, </span><span style=\"vertical-align: baseline;\">Retake, an AI-powered photo editing platform built by Codeway, faced a significant performance bottleneck with its GPU workloads. By adopting Pod snapshots, they were able to replace a complex custom caching layer and reduce startup time to seconds</span><span style=\"vertical-align: baseline;\">.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"At Retake, serving personalized models to millions of users requires a massive, unified pipeline for both fine-tuning training and real-time inference on A3 H100 GPUs. We initially engineered a complex custom caching layer for compiled artifacts, which reduced startup time to 1 minute. However, this solution added significant maintenance overhead and still limited our ability to autoscale aggressively. We resolved this by replacing that complexity with GKE Pod snapshots, </span><strong style=\"font-style: italic; vertical-align: baseline;\">slashing startup latency to just 8 seconds</strong><span style=\"font-style: italic; vertical-align: baseline;\">. By eliminating the initialization penalty, we can now dynamically spin up H100s for specific fine-tuning or inference jobs instantly and shut them down immediately after, drastically reducing idle GPU costs and simplifying our codebase.\"</span><span style=\"vertical-align: baseline;\"> - Ahmet Furkan Çomak, Lead DevOps Engineer, Codeway</span></p>\n<h3><span style=\"vertical-align: baseline;\">Flexible configuration for any workload</span></h3>\n<p><span style=\"vertical-align: baseline;\">We designed Pod snapshots to improve startup performance and fit naturally into existing Kubernetes workflows. Adopting Pod snapshots to your workload is easy: just define a new declarative policy using </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/reference/crds/podsnapshot\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pod snapshot CRDs</span></a><span style=\"vertical-align: baseline;\">. The policy allows you to define which Pods to snapshot and where to store the data, and handles the end-to-end storage lifecycle and management. </span></p>\n<p><span style=\"vertical-align: baseline;\">You can take snapshots at any stage of the workload — either at workload startup using a workload signal, or during the lifecycle of the Pod using an on-demand trigger. You can further control storage and  restore behavior, setting snapshots retention for cost optimization, choosing between the default behaviour of restoring from the last taken snapshot, or specifying an explicit snapshot during a new Pod deployment.</span></p>\n<p><span style=\"vertical-align: baseline;\">While the primary use cases for GKE Pod snapshots are AI inference and agent sandboxes, this feature is workload-agnostic. You can use it to speed up any application with a long initialization phase, such as complex Java applications, game servers, or legacy monoliths.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">You can begin optimizing your startup latency today with GKE Pod snapshots. Check out </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/agent-sandbox-pod-snapshots\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the documentation</span></a><span style=\"vertical-align: baseline;\"> to learn how to get started and we look forward to your feedback.</span></p></div>"
  "fb802a9a1f1a7d69c91e980598d80a81":
    "id": "fb802a9a1f1a7d69c91e980598d80a81"
    "title": "Strengthen your CI/CD pipeline with new Secure Source Manager capabilities"
    "link": "https://cloud.google.com/blog/products/identity-security/strengthen-your-cicd-pipeline-with-new-secure-source-manager-capabilities/"
    "published": "2026-09-22 01:00:00"
    "fetched": "2026-09-22 04:51:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A resilient software supply chain is the foundation of modern delivery, and securing your continuous integration and continuous delivery (CI/CD) pipeline is what keeps innovation moving safely.</span></p>\n<p><span style=\"vertical-align: baseline;\">Notable supply chain attacks more than doubled in the first half of 2026 compared to the second half of 2025, according to Wiz’s recent </span><a href=\"https://www.wiz.io/blog/cloud-threat-highlights-h1-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Threat Highlights report</span></a><span style=\"vertical-align: baseline;\">.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">It’s crucial that your source code not be the weakest link in your private cloud. To help you better address software supply chain threats, Google Cloud Secure Source Manager (SSM) lets you manage your source and CI/CD systems with unified authentication and authorization mechanisms. </span></p>\n<p><span style=\"vertical-align: baseline;\">We now offer two new capabilities, both generally available, that can simplify and secure your development and CI/CD workflows:  </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unauthorized access to CI/CD systems</strong><span style=\"vertical-align: baseline;\">: Attackers only need to alter a single deployment script to turn your CI/CD pipeline into a vehicle for malware. To help mitigate this risk, from the version control system to the build and artifact systems, to deployment tools, SSM can now block unauthorized access to your CI/CD systems even if your corporate network has been compromised.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unauthorized changes to code by authorized users</strong><span style=\"vertical-align: baseline;\">: The new Code Owners system manages pull request approver sets at a per-file and per-branch level to help provide more granular identity and access management (IAM). Code Owners helps engineers who need to write, edit, and review code. It adds additional guards to files and directories in your repository at a per-file or per-branch level.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Key capabilities</span></h3>\n<p><span style=\"vertical-align: baseline;\">Beginning with source code changes to your CI/CD pipeline, the new code owners feature gives you granular merge guards: Check in CODEOWNERS files to your repository to specify required approvers highly granularly:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Per-path approver sets</strong><span style=\"vertical-align: baseline;\">: Using flexible glob-style path specifiers, you can require that changes to matching files be approved by one or more of given sets of users.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Branch-specific governance</strong><span style=\"vertical-align: baseline;\">: Manage security and deployment rules across branches without friction. You can define different owners for main or dev in the same file, eliminating the merge conflicts that occur with existing CODEOWNERS solutions. See our </span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/codeowners#branch-specific_ownership\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation for more details</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Nestable multi-file ownership</strong><span style=\"vertical-align: baseline;\">: You aren't limited to one giant, 5,000-line root file. You can nest CODEOWNERS files in sub-directories. SSM uses a \"more local wins\" logic, allowing sub-teams to own their folders while the root admin maintains veto power over the entire repo.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Independent approval sections</strong><span style=\"vertical-align: baseline;\">: Using the [SectionName][count] </span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/codeowners#sections-for-multiple-approval-sets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">syntax</span></a><span style=\"vertical-align: baseline;\"> (e.g., [Security Team][2]), a single pull request (PR) can require independent sign-offs from multiple departments. A PR might be reviewed by a peer, but it won't merge until two members of the security team also approve.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">With your source code ready, SSM’s new </span><a href=\"https://docs.cloud.google.com/developer-connect/docs/connect-secure-source-manager\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Developer Connect</span></a><span style=\"vertical-align: baseline;\"> integration makes it easy to connect your CI/CD system and runtimes securely, even when they are in different private networks.</span></p>\n<p><span style=\"vertical-align: baseline;\">The private CI/CD blueprint </span><a href=\"https://docs.cloud.google.com/secure-source-manager/docs/private-network-integrations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">architecture</span></a><span style=\"vertical-align: baseline;\"> follows a secure path: Secure Source Manager connects to Private Service Connect, which connects to Cloud Build. The repository, the build pools, and the artifact storage all reside in a private network, with </span><a href=\"https://docs.cloud.google.com/vpc-service-controls/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC Service Controls</span></a><span style=\"vertical-align: baseline;\"> (VPC-SC) providing defense-in-depth to limit access to proxy endpoints.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Next steps</span></h3>\n<p><span style=\"vertical-align: baseline;\">To secure your network, follow our new</span> <a href=\"https://docs.cloud.google.com/secure-source-manager/docs/private-network-integrations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Private Network Integrations guide</span></a><span style=\"vertical-align: baseline;\"> to connect SSM to Cloud Build with Developer Connect. </span></p>\n<p><span style=\"vertical-align: baseline;\">To secure your pull request approvals, create a root CODEOWNERS file to replace blunt IAM \"Approver\" roles with file-specific ownership.</span></p></div>"
