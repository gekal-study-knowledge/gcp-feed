  "229cd3750395a7476e83f7bb8654ab16":
    "id": "229cd3750395a7476e83f7bb8654ab16"
    "title": "Scale your own way, using HPA with built-in support for PromQL metrics queries in GKE"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/native-support-for-prometheus-metrics-in-gke/"
    "published": "2026-09-24 01:00:00"
    "fetched": "2026-09-24 03:51:30"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Earlier this year, </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-now-supports-custom-metrics-natively\"><span style=\"text-decoration: underline; vertical-align: baseline;\">we announced</span></a><span style=\"vertical-align: baseline;\"> native support for Google Kubernetes Engine (GKE) custom metrics. This milestone allowed you to scrap external adapters and instead collect autoscaling metrics directly from your pods. By routing these metrics straight to the Horizontal Pod Autoscaler (HPA), we cut metrics reading latency down to 5 seconds.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are excited to introduce built-in support for processing Prometheus metrics, allowing you to use expressive PromQL queries to customize autoscaling triggers. With this update, HPA can now directly process autoscaling metrics present in Cloud Monitoring using Google Managed Service for Prometheus. Reading metrics from these backends will not require third-party adapters, leveraging the AutoscalingMetric integration used to support pod-level metrics. After the preview, we plan to support self-hosted Prometheus servers as we move to general availability. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The challenge: Setting up Cloud Monitoring metrics</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Support for custom pod-level metrics made autoscaling more straightforward, but production workloads often need to scale on multiple, complex infrastructure metrics. Common examples include scaling:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">a worker pool based on the number of unacknowledged messages in a Pub/Sub topic</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">an inference service based on query-per-second (QPS) metrics stored in Cloud Monitoring / Prometheus</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">a webserver farm based on the 95th percentile of their measured response time</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">To achieve this, you used to need to deploy an external adapter like the Stackdriver Custom Metrics Adapter or the Prometheus adapter to retrieve the metrics from an external logging environment. While this sounds straightforward at first, these adapters introduce a lot of operational friction:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Management overhead:</strong><span style=\"vertical-align: baseline;\"> Platform teams have to install, configure, patch, and monitor these third-party components.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reliability and inefficiency:</strong><span style=\"vertical-align: baseline;\"> Intermediate adapter pods reading from external systems introduce failure points in critical autoscaling loops. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">IAM complexity:</strong><span style=\"vertical-align: baseline;\"> Enabling secure cross-component communication requires setting up Kubernetes service account mappings to Cloud service accounts including their permissions.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">And while setting up this system and maintaining it not impossible, it’s complex and features a complicated architecture:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_zycrwiE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">How processing Prometheus Metrics in GKE can help</span></h3>\n<p><span style=\"vertical-align: baseline;\">E</span><span style=\"vertical-align: baseline;\">xtending the AutoscalingMetric object drastically simplifies this setup. Now you can read metrics from monitoring directly via PromQL and provide them to HPA via a high-performance, low-latency autoscaling pipeline, resulting in a simplified environment.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_5IffDdj.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To prevent inefficiencies, we built this feature with minimal resource consumption in mind. The controller runs on the GKE control plane. It monitors your </span><code style=\"vertical-align: baseline;\">AutoscalingMetric</code><span style=\"vertical-align: baseline;\"> custom resources and only deploys the system pod on your user nodes when a PromQL metric is actively requested. If no Prometheus metrics are configured, the controller is shut down, so there’s no resource overhead.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Configuring built-in Prometheus metrics</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Configuring GKE to use PromQLl metrics is easy; here’s a sample configuration file providing PubSubs message queue depth as scaling metric:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling.gke.io/v1beta1\\r\\nkind: AutoscalingMetric\\r\\nmetadata:\\r\\n  name: gmp-metric\\r\\nspec:\\r\\n  metrics:\\r\\n  - promql:\\r\\n      name: pubsub-queue-depth\\r\\n      query: |\\r\\n        {\\r\\n          &quot;pubsub.googleapis.com/subscription/num_undelivered_messages&quot;,\\r\\n          subscription_id=&quot;my-subscription&quot;\\r\\n        }&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe45ccc45d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Linking Prometheus metrics to your HPA</span></h3>\n<p><span style=\"vertical-align: baseline;\">Once defined in your </span><code style=\"vertical-align: baseline;\">AutoscalingMetric</code><span style=\"vertical-align: baseline;\"> resource, you can reference the metric in your standard </span><code style=\"vertical-align: baseline;\">HorizontalPodAutoscaler</code><span style=\"vertical-align: baseline;\"> using the same intuitive format as raw custom metrics: </span><code style=\"vertical-align: baseline;\">autoscaling.gke.io|&lt;custom-resource-name&gt;|&lt;metric-name&gt;</code><span style=\"vertical-align: baseline;\">.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Scaling globally (Prometheus metric)</span></h4>\n<p><span style=\"vertical-align: baseline;\">For global metrics like a queue size that returns a single aggregate value:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling/v2\\r\\nkind: HorizontalPodAutoscaler\\r\\nmetadata:\\r\\n  name: worker-hpa\\r\\nspec:\\r\\n  scaleTargetRef:\\r\\n    apiVersion: apps/v1\\r\\n    kind: Deployment\\r\\n    name: worker-deployment\\r\\n  maxReplicas: 10\\r\\n  metrics:\\r\\n  - type: External\\r\\n    external:\\r\\n      metric:\\r\\n        name: autoscaling.gke.io|gmp-metric|pubsub-queue-depth\\r\\n      target:\\r\\n        type: AverageValue\\r\\n        averageValue: 100 # maintain queue size at ~100 per pod&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe45d28a4d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Scaling on Cloud Monitoring per-Pod metrics</span></h4>\n<p><span style=\"vertical-align: baseline;\">GKE </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-now-supports-custom-metrics-natively\"><span style=\"text-decoration: underline; vertical-align: baseline;\">natively supports</span></a><span style=\"vertical-align: baseline;\"> scale based on the most recent gauge metric values, but PromQL offers greater flexibility, allowing you to scale across time windows and calculate rates or histogram percentiles.</span></p>\n<p><span style=\"vertical-align: baseline;\">To use this capability, configure your PromQL metric to include a label for the pod name, then assign </span><code style=\"vertical-align: baseline;\">type: Pods</code><span style=\"vertical-align: baseline;\"> within your </span><code style=\"vertical-align: baseline;\">AutoscalingMetric</code><span style=\"vertical-align: baseline;\"> manifest. Below is an example that calculates a Pod's average memory usage over a five-minute rolling window.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling.gke.io/v1beta1\\r\\nkind: AutoscalingMetric\\r\\nmetadata:\\r\\n  name: per-pod-stored-metric\\r\\nspec:\\r\\n  metrics:\\r\\n  - promql:\\r\\n      name: container-memory-metric\\r\\n      query: |\\r\\n        sum by (&quot;pod&quot;)\\r\\n        (avg_over_time({&quot;container_memory_working_set_bytes&quot;}[5m]))\\r\\n      type: Pods # The promql query returns per-pod metrics&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe45d2d14d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Key benefits</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No adapter maintenance:</strong><span style=\"vertical-align: baseline;\"> No pods to install, configure, or upgrade. The entire lifecycle is fully managed within GKE.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Streamlined security: </strong><span style=\"vertical-align: baseline;\">Out of the box, the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/service-accounts#default-node-service-agent\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kubernetes Default Node Service Agent</span></a><span style=\"vertical-align: baseline;\"> has read permissions to Cloud Monitoring and Google Managed Prometheus in the same project. No extra IAM service accounts, keys, or federation parameters are required.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Low latency and fast scalability:</strong><span style=\"vertical-align: baseline;\"> The new Autoscaling Metric system polls the backend every 15 seconds, helping ensure fast scaling reactions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rich query capabilities:</strong><span style=\"vertical-align: baseline;\"> Leverage the full power of PromQL (including rate calculations, averages, and percentiles) to translate high-level business and user-experience objectives directly into scaling.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Support for the new </strong><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">HPA scale-to-zero capability</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Utilize it for scaling workloads to zero replicas when demand hits zero (e.g., Pub/Sub queue size) and, more crucially, back up from zero replicas quickly using </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-standby-buffers-speed-up-autoscaling-for-less-spend\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CapacityBuffers API</span><span style=\"vertical-align: baseline;\">.</span></a></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Try it today </strong></h3>\n<p><span style=\"vertical-align: baseline;\">By natively supporting both custom container metrics and Prometheus metrics, GKE now  offers a more robust, performant, and low-friction autoscaling experience. Built-in support for Prometheus Metrics is in preview now. To learn more about setting up your first </span><code style=\"vertical-align: baseline;\">AutoscalingMetric</code><span style=\"vertical-align: baseline;\"> resource, check out the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/autoscale-using-metrics#define-custom-metrics-promql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">latest GKE autoscaling documentation</span></a><span style=\"vertical-align: baseline;\">. </span></p></div>"
  "af130aee9e227f177cf667421f906f5d":
    "id": "af130aee9e227f177cf667421f906f5d"
    "title": "GKE becomes more elastic: Scale to zero, save costs, and keep workloads responsive"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gke-adds-native-scale-to-zero-capabilities/"
    "published": "2026-09-24 01:00:00"
    "fetched": "2026-09-24 03:51:30"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">True elasticity has long been the holy grail of cloud-native engineering. And while Kubernetes has revolutionized resource management, workloads that run sporadically (e.g., batch processors, event-driven workers, and development environments) still consume compute resources while they wait for work, driving up costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">We’re addressing this head-on in Google Kubernetes Engine (GKE) 1.37 with a native way to </span><strong style=\"vertical-align: baseline;\">scale to and from zero</strong><span style=\"vertical-align: baseline;\">. A new collection of</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">features allows you to scale down your workloads completely to zero replicas so that they stop consuming resources. At the same time, you can quickly and easily restart these workloads on GKE capacity buffers when demand returns, so you waste less infrastructure. This isn't just about saving money, but about decoupling the cost of always-on infrastructure from workload readiness.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=t4g6l4s1L1s\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Scale To &amp; From Zero on GKE using HPA</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=t4g6l4s1L1s\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">The evolution: HPA-based scale-to-zero vs. KEDA</strong></h3>\n<p><span style=\"vertical-align: baseline;\">For years, </span><a href=\"https://keda.sh/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kubernetes Event-Driven Autoscaling (KEDA)</span></a><span style=\"vertical-align: baseline;\">, an optional Kubernetes component, was the go-to solution for scaling to zero. While powerful, KEDA adds complexity to an environment. <br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Feature</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">GKE scale-to-zero</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">KEDA-based setups</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Operational toil</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Managed service; no extra components.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Requires management of </span><code style=\"vertical-align: baseline;\">ScaledObject</code><span style=\"vertical-align: baseline;\"> CRDs &amp; operators.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Configuration</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Native HPA &amp; CRDs (minimal YAML).</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Can exceed 10,000 lines of YAML for large fleets.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Latency</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Internalized signal path reduces reaction time.</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Polling intervals and hop-counts increase cold-start delays.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">By baking scale-to-zero directly into the GKE control plane, we eliminate the need for add-on operators and thousands of lines of configuration. The logic moves from \"sidecar management\" to a native attribute of the workload.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Under the hood: </strong><strong style=\"vertical-align: baseline;\">HPA with AutoscalingMetric</strong><strong style=\"vertical-align: baseline;\"> and KEP-2021</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The magic behind scaling to zero within GKE lies in the integration of two critical components:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">HPA with AutoscalingMetric</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> This is the managed metrics signal pipeline that now supports direct reading of external signals from Google Cloud Managed Service for Prometheus. </span><span style=\"vertical-align: baseline;\">HorizontalPodAutoscaler (HPA) with AutoscalingMetric</span><span style=\"vertical-align: baseline;\"> provides a unified, high-performance path for metrics from Pub/Sub, Cloud Monitoring, or Load Balancer signals to reach the autoscaler, without the complexity of an adapter.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KEP-2021:</strong><span style=\"vertical-align: baseline;\"> Built on the </span><a href=\"https://kubernetes.io/blog/2026/09/02/kubernetes-v1-37-hpa-scale-to-zero-beta/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kubernetes Enhancement Proposal</span></a><span style=\"vertical-align: baseline;\"> that enables </span><code style=\"vertical-align: baseline;\">minReplicas: 0</code><span style=\"vertical-align: baseline;\"> in the HPA, this mechanism allows the HPA to stop all pods when metrics fall below a threshold. It also ensures the HPA can \"wake up\" the deployment as soon as the metric indicates pending work.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Configuring your first scale-to-zero workload</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To implement native scale-to-zero, you need two primary objects: a metric definition and an HPA. In the following example, we scale a worker based on the number of undelivered messages in a Pub/Sub subscription.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Define the metric source</span></h4>\n<p><span style=\"vertical-align: baseline;\">Use the </span><code style=\"vertical-align: baseline;\">AutoscalingMetric</code><span style=\"vertical-align: baseline;\"> CRD to map an external Cloud Monitoring metric to your cluster.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling.gke.io/v1beta1\\r\\nkind: AutoscalingMetric\\r\\nmetadata:\\r\\n  name: my-autoscalingmetric\\r\\nspec:\\r\\n  metrics:\\r\\n  - promql:\\r\\n      name: pubsub-undelivered\\r\\n       query: &gt;\\r\\n          {\\r\\n            &quot;pubsub.googleapis.com/subscription/num_undelivered_messages&quot;,\\r\\n            subscription_id=&quot;my-subscription&quot;\\r\\n          }&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe45dc905d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Configure the HPA with minReplicas: 0</span></h4>\n<p><span style=\"vertical-align: baseline;\">Reference the metric in your HPA and explicitly set the minimum replicas to zero.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: autoscaling/v2\\r\\nkind: HorizontalPodAutoscaler\\r\\nmetadata:\\r\\n  name: worker-hpa\\r\\nspec:\\r\\n  scaleTargetRef:\\r\\n    apiVersion: apps/v1\\r\\n    kind: Deployment\\r\\n    name: worker-deployment\\r\\n  minReplicas: 0\\r\\n  maxReplicas: 50\\r\\n  metrics:\\r\\n  - type: External\\r\\n    pods:\\r\\n      metric:\\r\\n        name: autoscaling.gke.io|my-autoscalingmetric|pubsub-undelivered\\r\\n      target:\\r\\n        type: AverageValue\\r\\n        averageValue: 10&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe45d990b10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">There you go — you’ve allowed your workload to scale to and from zero based on an external metric.</span></p>\n<p><span style=\"vertical-align: baseline;\">Scale-to-zero capabilities are made possible by support in GKE for external metrics from Cloud Monitoring. By extending the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/autoscale-using-metrics#define-custom-metrics-promql\"><code style=\"text-decoration: underline; vertical-align: baseline;\">AutoscalingMetric</code></a><span style=\"vertical-align: baseline;\"> custom resource, you can now query metrics from Google Managed Service for Prometheus, without complex, third-party adapters. This reduces latency, simplifies security, and serves as a key foundation for configuring native scale-to-zero workloads. To learn more about this integration, read our companion blog post on </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/native-support-for-prometheus-metrics-in-gke\"><span style=\"text-decoration: underline; vertical-align: baseline;\">native support for external metrics in GKE</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Managing startup latency with capacity buffers</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The biggest challenge with scaling from zero is the so-called cold start — the time it takes for GKE to provision a node and for the container to pull it and start it. This is where </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-standby-buffers-speed-up-autoscaling-for-less-spend\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE capacity buffers</span></a><span style=\"vertical-align: baseline;\"> come in.</span></p>\n<p><span style=\"vertical-align: baseline;\">Capacity buffers act as pooled warm capacity. By maintaining a small amount of warm compute resources that can be shared by multiple workloads that can all scale to zero, GKE ensures that when your HPA jumps from 0 to 1, the pod has resources that it can claim immediately. This eliminates the 60-90 second wait for a new GKE node to spin up, reducing startup latency from minutes to an instant, all while maintaining zero cost for the workload. </span></p>\n<p><span style=\"vertical-align: baseline;\">Capacity buffers come in two flavors: active and standby. A small active buffer can serve hundreds of workloads that are scaled to zero; instead of each of the workloads maintaining a replica, the active buffer acts as wildcard capacity that serves the whole cluster. A larger standby buffer, which costs a fraction of an active buffer, quickly refills the active buffer for any sustained load encountered by the cluster. By using them together, you get both instant scaling and can maintain low costs. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">What’s ahead</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We continue to expand our roadmap for GKE elasticity. For example, imagine you want your development environments to scale to zero at 8:00 PM and scale back up at 7:00 AM. Be on the lookout for methods to exert finer-grained control over recurring scaling, so you can proactively define your scale-to-zero windows. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started with scaling-to-zero today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The days of paying for idle resources are numbered. By enabling GKE's native scale-to-zero capabilities for event-driven and sporadic workloads, you can slash costs without sacrificing startup performance. To get started with scale-to-zero, follow these steps:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/optimize-workload-resource-utilization\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Identify a workload</span></a><span style=\"vertical-align: baseline;\"> with fluctuating demand that has periods of idleness.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Configure your </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/autoscale-using-metrics#define-custom-metrics-promql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AutoscalingMetric</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/scale-to-from-zero-hpa\"><span style=\"text-decoration: underline; vertical-align: baseline;\">set your minReplicas to zero</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Add </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/capacity-buffer\"><span style=\"text-decoration: underline; vertical-align: baseline;\">capacity buffers</span></a><span style=\"vertical-align: baseline;\"> to your cluster or workload to keep response times snappy.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">For more, check out the documentation on </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/tutorials/scale-to-from-zero-hpa\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scaling GKE workloads to and from zero using HPA</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "a18b2021211bc2fc9f8be75fba3eca2a":
    "id": "a18b2021211bc2fc9f8be75fba3eca2a"
    "title": "A guide to speeding up your video processing with AlphaEvolve"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/how-to-speed-up-your-video-processing-with-alphaevolve/"
    "published": "2026-09-24 01:00:00"
    "fetched": "2026-09-24 03:51:30"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In real-time streaming, every millisecond counts. </span></p>\n<p><span style=\"vertical-align: baseline;\">For example, at 30 frames per second (fps), developers have a strict frame budget of just 33.3 ms (and only 16.6 ms at 60 fps) to ingest camera frames, run neural segmentation, apply shaders, and composite output. Exceeding that budget by even a fraction of a millisecond leads to dropped frames and stuttering. </span></p>\n<p><span style=\"vertical-align: baseline;\">Manual optimization is notoriously tedious — requiring weeks of analyzing flame graphs and hand-tuning low-level code in Swift, C++, or Metal. While standard AI coding assistants can generate boilerplate, they can’t optimize  against target hardware, benchmark real-world latency, or ensure optimizations preserve visual fidelity.</span></p>\n<p><span style=\"vertical-align: baseline;\">Autonomous, closed-loop evolutionary optimization changes this paradigm. Tools like</span> <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/alphaevolve-is-available-for-everyone?e=0&amp;utm_source=gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve</span></a><span style=\"vertical-align: baseline;\"> pair cloud-scale model reasoning with local hardware execution, and we’re already seeing real-world impact. In partnership with Google,</span> <a href=\"https://www.doit.com/about?utm_source=gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DoIt</span></a><span style=\"vertical-align: baseline;\"> used AlphaEvolve to autonomously optimize production Swift code in a live macOS streaming app, uncovering performance headroom that manual profiling missed (read the full</span><a href=\"https://medium.com/google-cloud/running-alphaevolve-on-your-own-code-f8aeebceb4d0?utm_source=gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">technical writeup</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n<p><span style=\"vertical-align: baseline;\">While this post focuses on video pipelines, the split-loop pattern applies anywhere performance matters — from microservice throughput and database queries to ML tensor pipelines and embedded systems. In every case, the formula is the same: pair Gemini code generation in the cloud with your domain-specific benchmark harness and automated quality gates.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we’ll show you how to use AlphaEvolve to speed up video processing—and apply these principles to your own performance bottlenecks:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Understanding the split-loop architecture: </strong><span style=\"vertical-align: baseline;\">How AlphaEvolve decouples managed cloud generation (Gemini model ensemble on Google Cloud) from local evaluation (e.g. compiling and timing native Swift/Metal code).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evaluator craft and quality gates:</strong><span style=\"vertical-align: baseline;\"> How to construct scoring functions using metrics like Structural Similarity Index (SSIM) to prevent evolutionary loops from gaming the benchmark (e.g., skipping rendering entirely to go fast).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Autonomous algorithmic discovery:</strong><span style=\"vertical-align: baseline;\"> How Gemini-driven evolutionary search can autonomously discover unprompted framework APIs and make intelligent engineering trade-offs (e.g., frame-caching limits).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Setting realistic performance boundaries: </strong><span style=\"vertical-align: baseline;\">How to measure code optimization against physical hardware floors.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">1. Understanding AlphaEvolve’s split-loop architecture </span></h3>\n<p><span style=\"vertical-align: baseline;\">AlphaEvolve runs a closed-loop evolutionary process: given a seed program and a custom scoring function, a mixture of Gemini models proposes code variations, executes the scoring function against each candidate, keeps the highest-performing code, and iteratively climbs toward an optimal solution over multiple generations.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_OsAwmXL.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A core architectural advantage of AlphaEvolve is its clean separation into two halves:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The generation half (Google Cloud managed service):</strong><span style=\"vertical-align: baseline;\"> Contains the prompt sampler, Gemini model ensemble, and program database. Google Cloud handles the scale, prompt orchestration, and generation mechanics.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The evaluation half (customer managed compute):</strong><span style=\"vertical-align: baseline;\"> Scoring code quality is strictly domain-specific. You own the evaluator module entirely, running it on your own hardware or target architecture (in this case, macOS running native Swift code).</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">While AlphaEvolve is Python-first on the cloud generation side, evaluation can be written in any language. The custom evaluator compiles each Swift candidate using swift and executes it against a standard reference webcam clip.</span></p>\n<h3><span style=\"vertical-align: baseline;\">2. Evaluator craft and quality gates</span></h3>\n<p><span style=\"vertical-align: baseline;\">An automated optimization loop like AlphaEvolve never actually \"sees\" your video stream. It only sees the numeric fitness score your evaluator returns. If your evaluation metric has a blind spot, evolutionary code generation will aggressively exploit it.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our early runs, a naive fitness score weighted toward raw latency produced an astonishing speedup: the model simply bypassed blur rendering entirely and returned unmodified frames in 0 ms.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Structural Similarity Index Measure (SSIM)</strong><span style=\"vertical-align: baseline;\">:</span></p>\n<p><span style=\"vertical-align: baseline;\">To prevent the model from gaming your benchmark, try building a two-tiered scoring function that pairs throughput with structural fidelity metrics like </span><strong style=\"vertical-align: baseline;\">Structural Similarity Index (SSIM)</strong><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;speedup = baseline_ms_per_frame / candidate_ms_per_frame\\r\\nssim    = mean_ssim_vs_golden\\r\\n\\r\\n#Disqualify any candidate falling below visual threshold\\r\\n\\r\\n\\r\\nif ssim &lt; 0.98 or worst_frame_ssim &lt; 0.95:\\r\\n    return {&quot;speedup&quot;: -1e12}   # Disqualified\\r\\n\\r\\nreturn {&quot;speedup&quot;: speedup, &quot;ssim&quot;: ssim}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe45dbb38d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">What does this give you?</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The ability to test against worst-case clips:</strong><span style=\"vertical-align: baseline;\"> Never benchmark on static frames or blank cameras. Candidate code can easily pass an average SSIM gate on static backgrounds while failing completely during quick head turns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">You can track the minimum, not just the mean:</strong><span style=\"vertical-align: baseline;\"> Enforce both an average threshold and a per-frame floor to catch dropped frames or delayed mask updates.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Autonomous algorithmic discovery:</strong><span style=\"vertical-align: baseline;\"> </span></h3>\n<p><span style=\"vertical-align: baseline;\">Most developers use generative AI for local micro-optimizations (e.g., inlining helper functions, unrolling loops, or tweaking memory pools). But when given architectural room, the evolutionary loop can discover systemic optimizations on its own.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Engineering lessons:</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Provide framework context, not isolated loops:</strong><span style=\"vertical-align: baseline;\"> Include public SDK headers, interface definitions, or API reference symbols in the prompt or retrieval harness. An LLM cannot adopt a sequence-aware subsystem if its context window only contains an isolated frame-processing callback.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Expose multi-frame lifecycle hooks:</strong><span style=\"vertical-align: baseline;\"> Let your candidate code maintain a bounded state across executions (e.g., historical masks or cache timestamps) rather than enforcing pure, stateless functions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Let quality gates police the trade-offs:</strong><span style=\"vertical-align: baseline;\"> When AlphaEvolve introduced temporal mask caching, it initially cached masks too aggressively, causing noticeable trailing artifacts. Because our SSIM gate penalized drift during motion, the search converged on a production-ready cache window without manual parameter tuning.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Setting realistic performance boundaries</strong></h3>\n<p><span style=\"vertical-align: baseline;\">A common pitfall in performance engineering is optimizing in the dark. If you achieve a 2x speedup, is that an incredible achievement, or did you leave another 3x on the table?</span></p>\n<p><span style=\"vertical-align: baseline;\">In real-time media, total frame time splits into two distinct categories:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mutable software overhead:</strong><span style=\"vertical-align: baseline;\"> Memory allocations, buffer format conversions, thread context switches, and API dispatch friction.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Immutable hardware floors:</strong><span style=\"vertical-align: baseline;\"> Raw Neural Engine inference latency, GPU shader compute time, and hardware display synchronization.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">To make the most of AlphaEvolve, developers should measure against theoretical maximum headroom</span></h3>\n<p><span style=\"vertical-align: baseline;\">Before running optimization loops, here’s a few principles to keep in mind: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build a \"no-op\" pipeline:</strong><span style=\"vertical-align: baseline;\"> Strip out Swift/C++ orchestration, data marshalling, and frame conversions. Dispatch only the pre-warmed ML model and bare GPU pass on a dummy buffer. The resulting time is your physical hardware lower bound.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Calculate your addressable ceiling:</strong><span style=\"vertical-align: baseline;\"> Your total possible optimization potential is:</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_u73NadS.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. </span><strong style=\"vertical-align: baseline;\">Score against the hardware gap:</strong><span style=\"vertical-align: baseline;\"> Instead of arbitrary speedup multiples, measure optimization efficiency:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_Y7cUASN.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Get started </span></h3>\n<p><span style=\"vertical-align: baseline;\">All benchmark code, test clips, evaluation scripts, and raw candidate logs are open source:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GitHub repository:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/SaschaHeyer/gen-ai-livestream/tree/main/alphaevolve/examples/camera-background-blur\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve Camera Background Blur Example</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Detailed technical write-up of our case study with DoIt:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://medium.com/google-cloud/running-alphaevolve-on-your-own-code-f8aeebceb4d0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Running AlphaEvolve on Your Own Code</span></a></p>\n</li>\n</ul></div>"
  "eb14e8c2e9d640dddbec7b56c169421f":
    "id": "eb14e8c2e9d640dddbec7b56c169421f"
    "title": "How Google Cloud Networking Supports Your Fluid Compute Choices for AI Workloads"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/how-google-cloud-networking-supports-your-fluid-compute-choices-for-ai-workloads/"
    "published": "2026-09-24 22:00:00"
    "fetched": "2026-09-24 22:14:00"
    "summary": "<div class=\"block-paragraph\"><p>The availability of resources for AI workloads can be challenging across the industry, especially accelerators. This can slow your AI workload deployment if it’s built around a specific type of accelerator. The concept of <b>fluid compute</b> allows you to design your AI deployment with several options based on available resources that can fit your use case.</p><p>In this blog, we will explore how Google Cloud networking supports your AI workloads and considerations that are relevant to your choice of accelerator (GPU or TPU), as the backend networking component configuration is not exactly the same.</p><h2>The resource options</h2><p>After deciding the type of work you want to achieve with your AI deployment, another important component is the actual hardware to get this done. In this case, we want to run inference for a private LLM, and the target is the NVIDIA B200 GPU family which is available in the <a href=\"https://cloud.google.com/compute/docs/gpus\">A4 VMs</a> (a4-highgpu-8g).</p><p>Now we have identified what we want to get done and a possible compute option, but the challenge is: is this available?</p><p>To get access to resources, there are several options which include:</p><ul><li><a href=\"https://docs.cloud.google.com/compute/docs/instances/about-flex-start-vms\">Dynamic Workload Scheduler (Flex-start VM)</a>: Queues workloads until all required accelerator nodes are available at the same time, provisioning them together and running non-preemptibly for up to seven days.</li><li><a href=\"https://docs.cloud.google.com/compute/docs/instances/future-reservations-calendar-mode-overview\">Dynamic Workload Scheduler (calendar mode)</a>: Enables reserving accelerator capacity 1 to 90 days in advance with guaranteed start and end times, ideal for scheduled pre-training runs and benchmarking.</li><li><a href=\"https://docs.cloud.google.com/compute/docs/instances/future-reservations-overview\">Future reservations</a>: Guarantees access to committed hardware in a specified zone beginning at a specific future date.</li><li><a href=\"https://cloud.google.com/compute/docs/instances/reservations-overview\">Flex reservations</a>: Offers short-term commitment windows to secure scarce accelerator nodes without multi-year lock-in.</li><li><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/node-auto-provisioning#enable-workload-level\">Dynamic node auto-provisioning and ComputeClasses</a>: In Google Kubernetes Engine (GKE), defining multi-family fallback lists within ComputeClasses allows the cluster to automatically attempt provisioning alternative accelerator types if primary pools face regional constraints.</li><li><a href=\"https://cloud.google.com/compute/docs/instances/spot\">Spot VMs</a>: Delivers surplus compute at substantial discounts for fault-tolerant, checkpointed batch jobs.</li></ul><p>Read more on this in the blog <a href=\"https://medium.com/google-cloud/never-run-out-of-compute-a-practical-guide-to-gke-resource-obtainability-eab4dea059ca\" target=\"_blank\"><i>Never Run Out of Compute: A Practical Guide to GKE Resource Obtainability</i></a>.</p><h2>Networking your choices</h2><p>The networking component of the accelerator varies based on your choice, so let's explore four configurations: standard networking, accelerated GPU networking (<a href=\"https://docs.cloud.google.com/compute/docs/gpus/gpudirect\">TCPX/TCPXO</a> and <a href=\"https://cloud.google.com/blog/products/networking/rdma-rocev2-for-ai-workloads-on-google-cloud?e=48754805\">RoCEv2</a>), TPU networking, and Cloud Run.</p><h3><b>Standard networking</b></h3><ul><li><b>Supported accelerators:</b> NVIDIA T4 (<a href=\"https://docs.cloud.google.com/compute/docs/gpus#n1-gpus\">N1 series</a>), NVIDIA L4 (<a href=\"https://docs.cloud.google.com/compute/docs/gpus#l4-gpus\">G2 series</a>), NVIDIA A100 (<a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a2-vms\">A2 machine series</a> single-node and multi-node), Cloud TPU v3, and <a href=\"https://cloud.google.com/tpu/docs/v5e\">Cloud TPU v5e</a> (single-host/standalone slices).</li><li><b>Architecture:</b> Nodes communicate over the primary <a href=\"https://cloud.google.com/vpc/docs/vpc\">Virtual Private Cloud (VPC)</a> network using the <a href=\"https://cloud.google.com/compute/docs/networking/using-gvnic\">Google Virtual NIC (gVNIC)</a> over standard TCP/IP.</li><li><b>Workload fit:</b> Provides straightforward portability across Google Cloud compute environments, supporting distributed data preprocessing, decoupled pipeline stages, independent inference replicas, and computer vision workloads using standard VPC routing and network policies.</li></ul><h3><b>Accelerated GPU Networking (TCPX/TCPXO and RoCEv2)</b></h3><p>Distributed training and multi-node inference require specialized multi-rail network fabrics to handle massive parameter exchanges and collective communications.</p><p><b>GPUDirect-TCPX and TCPXO Fabrics</b></p><ul><li><b>Supported accelerators</b>: NVIDIA H100 (<a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a3-high-vms\">A3 High VMs</a> with 4 rails) and NVIDIA H100 Mega (<a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a3-mega-vms\">A3 Mega VMs</a> with 8 rails).</li><li><b>Architecture:</b> Uses custom <a href=\"https://docs.cloud.google.com/compute/docs/gpus/gpudirect#a3-high-and-a3-edge\">GPUDirect-TCPX</a> (4 dedicated VPCs) and <a href=\"https://docs.cloud.google.com/compute/docs/gpus/gpudirect#a3-mega\">GPUDirect-TCPXO</a> (8 dedicated VPCs) offload engines to achieve high-throughput multi-rail GPU communication over standard Ethernet infrastructure without requiring native RDMA hardware.</li><li><b>Deployment blueprints:</b> These multi-VPC topologies can be deployed in many ways including using pre-built blueprints from the <a href=\"https://docs.cloud.google.com/cluster-toolkit/docs/setup/cluster-blueprint\">Cluster Toolkit</a>.</li></ul><p><b>RoCEv2 Fabrics (VM and Bare Metal)</b></p><ul><li><b>Supported accelerators</b>: NVIDIA H200 (<a href=\"https://docs.cloud.google.com/compute/docs/gpus#h200-gpus\">A3 Ultra VMs</a>), NVIDIA B200 (<a href=\"https://docs.cloud.google.com/compute/docs/gpus#b200-gpus\">A4 VMs</a>), NVIDIA GB200 NVL72 (<a href=\"https://docs.cloud.google.com/compute/docs/gpus#gb200-gpus\">A4X VMs</a>), and NVIDIA GB300 (<a href=\"https://docs.cloud.google.com/compute/docs/gpus#gb300-gpus\">A4X Max Bare Metal</a>).</li><li><b>Zonal network profiles:</b> RoCEv2 operates over a dedicated RDMA VPC attached to a specialized zonal network profile: VM instances (A3 Ultra, A4, A4X) use the <a href=\"https://docs.cloud.google.com/vpc/docs/rdma-network-profiles#roce-supported-features\">ZONE-vpc-roce</a> profile, while Bare Metal instances (such as A4X Max) utilize the dedicated <a href=\"https://docs.cloud.google.com/vpc/docs/rdma-network-profiles#roce-metal-supported-features\">ZONE-vpc-roce-metal</a> bare-metal profile.</li><li><b>Rail-aligned fabrics:</b> This dedicated VPC is isolated strictly for GPU communication and contains subnets mapped directly to the accelerator NICs. The backend is rail-aligned, with support for Jumbo Frames (<a href=\"https://cloud.google.com/vpc/docs/mtu\">MTU 8896</a>), delivering non-blocking multi-terabit bandwidth with minimal cross-rail interference.</li><li><b>Automated plumbing with GKE</b> <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/allocate-network-resources-dra\"><b>Dynamic Resource Allocation Network (DRANET)</b></a>: When deploying these GPUs on GKE, the GKE managed DRANET can be used to automatically provision additional networks and assign drivers that map the RDMA network interfaces to the GPU. These can then be assigned and consumed directly in your workload pods using standard Kubernetes resource claims.</li><li><b>Turnkey deployment</b>: You can deploy this entire end-to-end stack—including RDMA VPCs, MTU tuning, and DRA drivers—using automated blueprints from the <a href=\"https://cloud.google.com/cluster-toolkit/docs/overview\">Cluster Toolkit</a>.</li></ul><h3><b>TPU Networking</b></h3><ul><li><b>Supported accelerators</b>: <a href=\"https://cloud.google.com/tpu/docs/v4\">Cloud TPU v4</a>, <a href=\"https://cloud.google.com/tpu/docs/v5p\">Cloud TPU v5p</a>, <a href=\"https://cloud.google.com/tpu/docs/v5e\">Cloud TPU v5e</a> (multi-host Pod slices), <a href=\"https://cloud.google.com/tpu/docs/v6e\">Cloud TPU v6e</a> (Trillium), and <a href=\"https://docs.cloud.google.com/tpu/docs/tpu7x\">TPU7x</a> (Ironwood).</li><li><b>Inter-chip interconnect (ICI)</b>: Inside a TPU Pod or slice, chips communicate directly over dedicated, ultra-low-latency optical links organized in 2D or 3D torus meshes, bypassing traditional network stacks entirely.</li><li><b>Optical circuit switches</b> (OCS): In TPU v4 and TPU v5p SuperPods, software-reconfigurable OCS units dynamically change physical network topologies, route around faulty trays, and provision custom-sized accelerator slices without manual recabling.</li><li><b>Multi-NIC architecture</b> (TPU v6e and Higher): While earlier TPU generations relied on ICI within a slice and single-NIC for host traffic, Cloud TPU v6e (Trillium) and TPU7x introduce a native multi-NIC architecture where worker nodes isolate standard Kubernetes management traffic onto a primary VPC while using secondary dedicated VPCs configured for high-throughput TPU data and cross-slice communication.</li><li><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/allocate-network-resources-dra#use-non-rdma-interfaces-tpu\"><b>DRANET for TPU</b></a><b> deployments</b>: When deploying these TPUs on GKE, the GKE managed DRANET can be used to automatically provision additional networks and assign drivers for TPU communication. These can then be assigned and consumed directly in your workload pods using standard Kubernetes resource claims.</li><li><b>Data-center network (DCN) Multislice</b>: For models scaling beyond an individual TPU slice, <a href=\"https://docs.cloud.google.com/tpu/docs/multislice-introduction\">Cloud TPU Multislice</a> connects multiple independent ICI meshes over Google's high-speed Jupiter Data Center Network utilizing these dedicated multi-NIC paths.</li></ul><h3><b>Cloud Run</b></h3><ul><li><b>Supported accelerators:</b> NVIDIA L4 (G2 series) and NVIDIA RTX PRO 6000 (Blackwell) on <a href=\"https://cloud.google.com/run/docs/configuring/services/gpu\">Cloud Run GPU services</a>.</li><li><b>Direct VPC egress</b>: Binds serverless containers directly to your private VPC network using sub-minute IP allocation via <a href=\"https://cloud.google.com/run/docs/configuring/vpc-direct-vpc\">Direct VPC Egress</a>, enabling secure, low-latency access to internal data lakes, databases, and private APIs without traversing the public internet or requiring legacy connector VMs.<br /></li></ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"how-google-cloud-networking-supports-your-fluid-compute-choices-networks\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/how-google-cloud-networking-supports-your-.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2><b>Summary</b></h2><p>Google Cloud networking options support various accelerator types. When using fluid compute you can adjust your network setup to support the best design to optimise your workloads performance.</p><h2><b>Next Steps</b></h2><p>Take a deeper dive into Google Cloud AI infrastructure and networking architectures with these resources:</p><ul><li>Blog: <a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=48754805\">Dynamic capacity management for AI infrastructure</a></li><li>Tutorial: <a href=\"https://discuss.google.dev/t/how-to-build-an-elastic-scalable-llm-inference-platform-on-gke-using-fluid-compute/388108\" target=\"_blank\">How to build an elastic, scalable LLM Inference Platform on GKE using Fluid Compute</a></li><li>Blog: <a href=\"https://cloud.google.com/blog/products/networking/how-google-cloud-networking-supports-your-ai-workloads\">How Google Cloud Networking Supports Your AI Workloads</a></li></ul><p>Want to ask a question, find out more, or share a thought? Please connect with me on <a href=\"https://www.linkedin.com/in/ammett/\" target=\"_blank\">LinkedIn</a>.</p></div>"
  "ff71e3403315a113ebb770aa36b4f33f":
    "id": "ff71e3403315a113ebb770aa36b4f33f"
    "title": "The three things today's hottest startups are looking for in their AI stack"
    "link": "https://cloud.google.com/blog/topics/startups/the-three-things-todays-hottest-startups-are-looking-for-in-their-ai-stack/"
    "published": "2026-09-24 22:00:00"
    "fetched": "2026-09-24 22:14:00"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Cloud has become </span><a href=\"https://cloud.google.com/blog/topics/startups/startup-news-from-io-and-what-it-means-to-founders?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the platform of choice for startups</span></a><span style=\"vertical-align: baseline;\"> building AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">Our uniquely complete stack — including a choice of first- and third-party </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">compute</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/model-garden?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">models</span></a><span style=\"vertical-align: baseline;\">; </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our platform</span></a><span style=\"vertical-align: baseline;\"> for building and managing agents; and our products for </span><a href=\"https://cloud.google.com/security/ai?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">securing AI workloads</span></a><span style=\"vertical-align: baseline;\"> — has emerged as the single most important driver of this growth and it is powering AI development for many of the most exciting and innovative startups in the world.</span></p>\n<p><span style=\"vertical-align: baseline;\">As a result, startups are choosing to build and run on Google Cloud at a higher rate than they were three years ago, at the start of the AI era.</span></p>\n<p><span style=\"vertical-align: baseline;\">Given how quickly the technology industry moves in the AI era, the choices startups make can be notable. As we’ve worked together and watch many of these leaders scale, we’ve observed  a few important trends emerging over the past several months. We expect these decisions will continue to shape the choices startups make about the platforms and technology they use: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise</strong><span style=\"vertical-align: baseline;\">, which includes our tools for managing TPU and GPU clusters, services for building and managing agents, and APIs to access both first- and third-party models, is growing significantly with startups. And when startups use Gemini Enterprise, they also tend to use our “core cloud” services like Storage, BigQuery, or GKE.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini models</strong><span style=\"vertical-align: baseline;\"> — as well as several of the third-party models available through Gemini Enterprise — are providing very strong price-performance for startups. These customers are increasingly deploying both our frontier models and “workhorse” models as their AI to power workloads as diverse as scientific research, generative media creation, and financial analysis. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Access to compute on </span><strong style=\"vertical-align: baseline;\">GPUs</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">TPUs</strong><span style=\"vertical-align: baseline;\"> is critical for AI and the ability to choose one — or both — is unique to Google Cloud. But importantly, startups almost always use additional products from our stack alongside these chips, like models, tools for building agents, or services like BigQuery or GKE. These additional technologies illustrate how the needs of startups are rarely singular, and just how much value they find in having ready access to a strong suite of second-, third-, and fourth-level technologies beyond just compute.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">We can see the demand for these technologies first-hand in some of the recent deals we have struck in the past 60 days with a number of leading startups across sectors:</span></p>\n<ul>\n<li><a href=\"https://www.artificial.agency/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Artificial Agency</strong></a><span style=\"vertical-align: baseline;\">, a startup focused on generative behavior in games, is running critical AI workloads and research on Google Cloud, where it is using NVIDIA GPUs for model training and inference, as well as Gemini models and Cloud Storage.</span></li>\n<li><a href=\"https://www.aryahealth.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Arya</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Health</strong></a><span style=\"vertical-align: baseline;\"> is building the AI workforce for healthcare, deploying agentic AI to perform the non-clinical administrative work that limits providers’ ability to deliver and expand care. Arya’s AI agents work across scheduling, intake, recruiting, onboarding, compliance, after-hours operations, and other critical workflows, interacting through voice, text, email, and providers’ existing systems. Arya uses a range of Gemini models across its agentic infrastructure, including Gemini 2.5 Pro, 3.1 Flash, and 3.5 Flash Lite, selecting models based on the reasoning, speed, and cost requirements of each workflow. </span></li>\n<li><a href=\"https://casco.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Casco</strong></a><span style=\"vertical-align: baseline;\"> is a cybersecurity startup whose autonomous agent swarms execute sophisticated, multi-step attacks to uncover vulnerabilities across enterprise applications, cloud environments, and infrastructure. Its architecture combines advanced reasoning models for complex, long-running tasks with fast models such as Gemini 3.5 Flash for focused subagent work. Google Cloud’s model portfolio and infrastructure, including Provisioned Throughput, help Casco match each workload with the right combination of intelligence, speed, and capacity.</span></li>\n<li><span style=\"vertical-align: baseline;\"><a href=\"https://www.coderabbit.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CodeRabbit</strong></a><span style=\"vertical-align: baseline;\"> has been a pioneer in independent AI code review and has expanded that layer into Agentic Change Management, the control plane for agentic software development. They use our Cloud Run and Storage products to underpin their application, and are now beginning to leverage Gemini 3.1 Pro and other Gemini models to power use cases like analyzing how a single code change impacts an entire project, writing clear and contextual review comments to explain logic bugs, and instantly generating one-click fixes for developers.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><a href=\"http://www.comfy.org\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Comfy</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">offers a platform for creatives to build brand-consistent content and media with generative AI. They are utilizing a mix of NVIDIA systems and Google media generation models, like Veo and Nano Banana, in their platform.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.microagi.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">MicroAGI</strong></a><span style=\"vertical-align: baseline;\">, a German AI robotics startup, recently </span><a href=\"https://www.googlecloudpresscorner.com/2026-07-22-Microagi-to-Build-Future-of-AI-Robotics-on-Google-Cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> they would access NVIDIA Blackwell systems for model training through Google Cloud. They will also use Gemini Enterprise Agent Platform and AI models on Google Cloud to help robotics process multimodal information like video.</span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.ineffable.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Ineffable</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Intelligence</strong></a><span style=\"vertical-align: baseline;\">, the London-based superintelligence startup, recently </span><a href=\"https://www.googlecloudpresscorner.com/2026-06-16-Ineffable-Intelligence-Selects-Google-Cloud-To-Power-Its-Superintelligence-Mission?linkId=62345713\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> a partnership with Google Cloud to access NVIDIA Vera Rubin systems as well as high-efficiency AI networking and storage.</span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://pearhealthlabs.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">PEAR Health Labs</strong></a><span style=\"vertical-align: baseline;\"> built and runs its AI health and fitness companion and agentic health platform entirely on Google Cloud, using our Gemini 3.5 Flash model as well as our data cloud products.</span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.roboforce.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Roboforce</strong></a><span style=\"vertical-align: baseline;\"> is a physical AI company building scalable robots for industrial environments. They recently signed a new agreement with Google Cloud to utilize our GPU-powered VMs, which will be used to train and serve their custom and post-trained physical AI models.</span></span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://xfigura.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">xFigura</strong></a><span style=\"vertical-align: baseline;\"> offers a platform that gives architecture teams a single, secure canvas that brings generative models into one place for AI-driven design. Built on Google Cloud, xFigura uses models like Nano Banana and Omni to help designers generate and refine concepts in plain language, with authorship staying with the architect.</span></span></span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://scifin.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">SciFin</strong></a><span style=\"vertical-align: baseline;\"> is a startup that helps revenue teams uncover \"revenue reality\" by converging fragmented sales context across CRM systems, documents, emails, and other sources. They are utilizing Gemini models, infrastructure, and Gemini Enterprise to build and run their platform.</span></span></span></span></span></span></span></span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">These new and expanding customers represent some of the most exciting names in AI and are demonstrative of the type of successes that startups are having with Google Cloud’s uniquely complete stack for building AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about Google Cloud’s work with leading AI startups, or to get started building with us, visit </span><a href=\"https://cloud.google.com/startup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
