"overview": |
  この日は 3 件で、GKE のオートスケーリング強化が中心でした。HPA が PromQL クエリを直接扱えるようになり、Google Managed Service for Prometheus 経由で Cloud Monitoring にあるメトリクスをサードパーティのアダプターなしに処理できます。今年すでに導入されていた Pod レベルのカスタムメトリクス対応 (外部アダプターを廃してメトリクス読み取りのレイテンシを 5 秒に短縮) を踏まえたもので、Pub/Sub トピックの未確認メッセージ数でワーカープールをスケールさせる、QPS で推論サービスをスケールさせるといった、複数の複雑なインフラメトリクスに基づく運用に対応します。プレビュー後にはセルフホストの Prometheus サーバーのサポートも予定されています。あわせて GKE 1.37 では、ワークロードをゼロレプリカまで縮退させ、需要が戻ったときに GKE のキャパシティバッファ上ですばやく再開できるネイティブな scale-to-zero が導入されました。これまでゼロスケールの定番だった KEDA と異なり、GKE のコントロールプレーンに直接組み込むことでアドオンのオペレーターや大量の設定が不要になります。このほか、AlphaEvolve を使って動画処理を高速化する解説が公開されました。30 fps ではフレームあたり 33.3 ms、60 fps では 16.6 ms という厳しい予算の中で、クラウド規模のモデル推論とローカルハードウェアでの実行を組み合わせた自律的な最適化ループにより、DoIt が Google と協力して macOS のライブ配信アプリの本番 Swift コードを最適化し、手作業のプロファイリングでは見つからなかった性能の余地を見つけた事例が紹介されています。
