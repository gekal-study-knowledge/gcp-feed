"overview": |
  この日は 12 件で、GKE のオートスケーリング強化が中心でした。HPA が PromQL クエリを直接扱えるようになり、Google Managed Service for Prometheus 経由で Cloud Monitoring にあるメトリクスをサードパーティのアダプターなしに処理できます。今年すでに導入されていた Pod レベルのカスタムメトリクス対応 (外部アダプターを廃してメトリクス読み取りのレイテンシを 5 秒に短縮) を踏まえたもので、Pub/Sub トピックの未確認メッセージ数でワーカープールをスケールさせる、QPS で推論サービスをスケールさせるといった、複数の複雑なインフラメトリクスに基づく運用に対応します。プレビュー後にはセルフホストの Prometheus サーバーのサポートも予定されています。あわせて GKE 1.37 では、ワークロードをゼロレプリカまで縮退させ、需要が戻ったときに GKE のキャパシティバッファ上ですばやく再開できるネイティブな scale-to-zero が導入されました。これまでゼロスケールの定番だった KEDA と異なり、GKE のコントロールプレーンに直接組み込むことでアドオンのオペレーターや大量の設定が不要になります。このほか、AlphaEvolve を使って動画処理を高速化する解説が公開されました。30 fps ではフレームあたり 33.3 ms、60 fps では 16.6 ms という厳しい予算の中で、クラウド規模のモデル推論とローカルハードウェアでの実行を組み合わせた自律的な最適化ループにより、DoIt が Google と協力して macOS のライブ配信アプリの本番 Swift コードを最適化し、手作業のプロファイリングでは見つからなかった性能の余地を見つけた事例が紹介されています。データベースでは、AlloyDB がエージェント向けの PostgreSQL を提供することが発表されました (プレビュー)。数個のエージェントでも密な推論ループを回すとクエリが予測しづらく急増し、従来のアーキテクチャでは基幹の運用データベースが押し負けてしまうという問題に対し、AlloyDB は数秒でサンドボックス化されたデータベースインスタンスを払い出してワークロードを完全に分離します。これらのインスタンスは本番データへの秒単位で最新な読み取り専用アクセスを持ちながら、プライマリ・スタンバイ・リードプールからは完全に切り離されており、エージェントの処理が終わると自動的に縮退するため、数個から数百万規模のエージェントまでコスト効率よく動かせます。あわせて、エージェント時代に向けた「妥協のない」データベースアーキテクチャの解説が公開され、Exadata・Azure SQL Hyperscale・Aurora・オブジェクトストレージ + キャッシュ層といった既存の設計が、規模・レイテンシー・分離のうち少なくとも 1 つを必ず犠牲にしてきたことが整理されています。ネットワークでは、AI ワークロードにおける「フルイドコンピュート」の考え方 (利用できるリソースに応じて複数の選択肢を前提に設計する) を Google Cloud のネットワーキングがどう支えるかが解説され、アクセラレーターとして GPU を選ぶか TPU を選ぶかでバックエンドネットワークの構成が異なる点が、NVIDIA B200 を搭載する A4 VM (a4-highgpu-8g) でプライベート LLM の推論を動かす例とともに示されました。セキュリティでは、コードパイプラインと CI/CD 基盤を堅牢化する解説が公開されました。攻撃者が信頼されたセキュリティスキャナーやユーティリティライブラリ、AI 開発ツールを標的にしてビルドパイプライン内の強い権限を悪用すること、開発者のワークステーションや IDE を狙った巧妙なソーシャルエンジニアリング・悪意ある拡張機能・タイポスクワットされたローカル依存関係によって秘密鍵や API トークン、セッション認証情報を直接盗み出すこと、さらに GitHub Actions のキャッシュ汚染や OpenID Connect (OIDC) の悪用といった高度なパイプライン操作へと手口が進化していることが指摘されています。リリースノートでは、Model Armor のプロンプトインジェクション / ジェイルブレイク検出と Responsible AI のフィルターが、データレジデンシーを有効にしたメルボルン (australia-southeast2) で利用できるようになりました。このほか、Google Cloud が AI を手がけるスタートアップの選択肢として選ばれている理由を 3 点にまとめた記事と、ラテンアメリカの中堅企業が AI 時代にどう作っているかを扱った記事が公開されています。後者では、同地域の中小企業が国連推計で域内雇用の 60% 以上を占めることに触れ、日々のメール要約には高速で低コストなモデルを、複雑なデータ分析には高性能なモデルをと、用途と予算に応じて使い分けられる選択肢の幅が選ばれる理由になっていると述べられています。
