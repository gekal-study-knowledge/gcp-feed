    "title": "The three things today's hottest startups are looking for in their AI stack"
    "link": "https://cloud.google.com/blog/topics/startups/the-three-things-todays-hottest-startups-are-looking-for-in-their-ai-stack/"
    "published": "2026-09-24 22:00:00"
    "fetched": "2026-09-24 22:14:03"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Cloud has become </span><a href=\"https://cloud.google.com/blog/topics/startups/startup-news-from-io-and-what-it-means-to-founders?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the platform of choice for startups</span></a><span style=\"vertical-align: baseline;\"> building AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">Our uniquely complete stack — including a choice of first- and third-party </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">compute</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/model-garden?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">models</span></a><span style=\"vertical-align: baseline;\">; </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our platform</span></a><span style=\"vertical-align: baseline;\"> for building and managing agents; and our products for </span><a href=\"https://cloud.google.com/security/ai?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">securing AI workloads</span></a><span style=\"vertical-align: baseline;\"> — has emerged as the single most important driver of this growth and it is powering AI development for many of the most exciting and innovative startups in the world.</span></p>\n<p><span style=\"vertical-align: baseline;\">As a result, startups are choosing to build and run on Google Cloud at a higher rate than they were three years ago, at the start of the AI era.</span></p>\n<p><span style=\"vertical-align: baseline;\">Given how quickly the technology industry moves in the AI era, the choices startups make can be notable. As we’ve worked together and watch many of these leaders scale, we’ve observed  a few important trends emerging over the past several months. We expect these decisions will continue to shape the choices startups make about the platforms and technology they use: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise</strong><span style=\"vertical-align: baseline;\">, which includes our tools for managing TPU and GPU clusters, services for building and managing agents, and APIs to access both first- and third-party models, is growing significantly with startups. And when startups use Gemini Enterprise, they also tend to use our “core cloud” services like Storage, BigQuery, or GKE.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini models</strong><span style=\"vertical-align: baseline;\"> — as well as several of the third-party models available through Gemini Enterprise — are providing very strong price-performance for startups. These customers are increasingly deploying both our frontier models and “workhorse” models as their AI to power workloads as diverse as scientific research, generative media creation, and financial analysis. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Access to compute on </span><strong style=\"vertical-align: baseline;\">GPUs</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">TPUs</strong><span style=\"vertical-align: baseline;\"> is critical for AI and the ability to choose one — or both — is unique to Google Cloud. But importantly, startups almost always use additional products from our stack alongside these chips, like models, tools for building agents, or services like BigQuery or GKE. These additional technologies illustrate how the needs of startups are rarely singular, and just how much value they find in having ready access to a strong suite of second-, third-, and fourth-level technologies beyond just compute.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">We can see the demand for these technologies first-hand in some of the recent deals we have struck in the past 60 days with a number of leading startups across sectors:</span></p>\n<ul>\n<li><a href=\"https://www.artificial.agency/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Artificial Agency</strong></a><span style=\"vertical-align: baseline;\">, a startup focused on generative behavior in games, is running critical AI workloads and research on Google Cloud, where it is using NVIDIA GPUs for model training and inference, as well as Gemini models and Cloud Storage.</span></li>\n<li><a href=\"https://www.aryahealth.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Arya</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Health</strong></a><span style=\"vertical-align: baseline;\"> is building the AI workforce for healthcare, deploying agentic AI to perform the non-clinical administrative work that limits providers’ ability to deliver and expand care. Arya’s AI agents work across scheduling, intake, recruiting, onboarding, compliance, after-hours operations, and other critical workflows, interacting through voice, text, email, and providers’ existing systems. Arya uses a range of Gemini models across its agentic infrastructure, including Gemini 2.5 Pro, 3.1 Flash, and 3.5 Flash Lite, selecting models based on the reasoning, speed, and cost requirements of each workflow. </span></li>\n<li><a href=\"https://casco.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Casco</strong></a><span style=\"vertical-align: baseline;\"> is a cybersecurity startup whose autonomous agent swarms execute sophisticated, multi-step attacks to uncover vulnerabilities across enterprise applications, cloud environments, and infrastructure. Its architecture combines advanced reasoning models for complex, long-running tasks with fast models such as Gemini 3.5 Flash for focused subagent work. Google Cloud’s model portfolio and infrastructure, including Provisioned Throughput, help Casco match each workload with the right combination of intelligence, speed, and capacity.</span></li>\n<li><span style=\"vertical-align: baseline;\"><a href=\"https://www.coderabbit.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CodeRabbit</strong></a><span style=\"vertical-align: baseline;\"> has been a pioneer in independent AI code review and has expanded that layer into Agentic Change Management, the control plane for agentic software development. They use our Cloud Run and Storage products to underpin their application, and are now beginning to leverage Gemini 3.1 Pro and other Gemini models to power use cases like analyzing how a single code change impacts an entire project, writing clear and contextual review comments to explain logic bugs, and instantly generating one-click fixes for developers.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><a href=\"http://www.comfy.org\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Comfy</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">offers a platform for creatives to build brand-consistent content and media with generative AI. They are utilizing a mix of NVIDIA systems and Google media generation models, like Veo and Nano Banana, in their platform.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.microagi.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">MicroAGI</strong></a><span style=\"vertical-align: baseline;\">, a German AI robotics startup, recently </span><a href=\"https://www.googlecloudpresscorner.com/2026-07-22-Microagi-to-Build-Future-of-AI-Robotics-on-Google-Cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> they would access NVIDIA Blackwell systems for model training through Google Cloud. They will also use Gemini Enterprise Agent Platform and AI models on Google Cloud to help robotics process multimodal information like video.</span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.ineffable.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Ineffable</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Intelligence</strong></a><span style=\"vertical-align: baseline;\">, the London-based superintelligence startup, recently </span><a href=\"https://www.googlecloudpresscorner.com/2026-06-16-Ineffable-Intelligence-Selects-Google-Cloud-To-Power-Its-Superintelligence-Mission?linkId=62345713\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> a partnership with Google Cloud to access NVIDIA Vera Rubin systems as well as high-efficiency AI networking and storage.</span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://pearhealthlabs.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">PEAR Health Labs</strong></a><span style=\"vertical-align: baseline;\"> built and runs its AI health and fitness companion and agentic health platform entirely on Google Cloud, using our Gemini 3.5 Flash model as well as our data cloud products.</span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.roboforce.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Roboforce</strong></a><span style=\"vertical-align: baseline;\"> is a physical AI company building scalable robots for industrial environments. They recently signed a new agreement with Google Cloud to utilize our GPU-powered VMs, which will be used to train and serve their custom and post-trained physical AI models.</span></span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://xfigura.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">xFigura</strong></a><span style=\"vertical-align: baseline;\"> offers a platform that gives architecture teams a single, secure canvas that brings generative models into one place for AI-driven design. Built on Google Cloud, xFigura uses models like Nano Banana and Omni to help designers generate and refine concepts in plain language, with authorship staying with the architect.</span></span></span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://scifin.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">SciFin</strong></a><span style=\"vertical-align: baseline;\"> is a startup that helps revenue teams uncover \"revenue reality\" by converging fragmented sales context across CRM systems, documents, emails, and other sources. They are utilizing Gemini models, infrastructure, and Gemini Enterprise to build and run their platform.</span></span></span></span></span></span></span></span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">These new and expanding customers represent some of the most exciting names in AI and are demonstrative of the type of successes that startups are having with Google Cloud’s uniquely complete stack for building AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about Google Cloud’s work with leading AI startups, or to get started building with us, visit </span><a href=\"https://cloud.google.com/startup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
