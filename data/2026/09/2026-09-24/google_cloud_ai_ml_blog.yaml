  "ff71e3403315a113ebb770aa36b4f33f":
    "id": "ff71e3403315a113ebb770aa36b4f33f"
    "title": "The three things today's hottest startups are looking for in their AI stack"
    "link": "https://cloud.google.com/blog/topics/startups/the-three-things-todays-hottest-startups-are-looking-for-in-their-ai-stack/"
    "published": "2026-09-24 22:00:00"
    "fetched": "2026-09-24 22:14:03"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Cloud has become </span><a href=\"https://cloud.google.com/blog/topics/startups/startup-news-from-io-and-what-it-means-to-founders?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the platform of choice for startups</span></a><span style=\"vertical-align: baseline;\"> building AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">Our uniquely complete stack — including a choice of first- and third-party </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">compute</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/model-garden?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">models</span></a><span style=\"vertical-align: baseline;\">; </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our platform</span></a><span style=\"vertical-align: baseline;\"> for building and managing agents; and our products for </span><a href=\"https://cloud.google.com/security/ai?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">securing AI workloads</span></a><span style=\"vertical-align: baseline;\"> — has emerged as the single most important driver of this growth and it is powering AI development for many of the most exciting and innovative startups in the world.</span></p>\n<p><span style=\"vertical-align: baseline;\">As a result, startups are choosing to build and run on Google Cloud at a higher rate than they were three years ago, at the start of the AI era.</span></p>\n<p><span style=\"vertical-align: baseline;\">Given how quickly the technology industry moves in the AI era, the choices startups make can be notable. As we’ve worked together and watch many of these leaders scale, we’ve observed  a few important trends emerging over the past several months. We expect these decisions will continue to shape the choices startups make about the platforms and technology they use: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise</strong><span style=\"vertical-align: baseline;\">, which includes our tools for managing TPU and GPU clusters, services for building and managing agents, and APIs to access both first- and third-party models, is growing significantly with startups. And when startups use Gemini Enterprise, they also tend to use our “core cloud” services like Storage, BigQuery, or GKE.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini models</strong><span style=\"vertical-align: baseline;\"> — as well as several of the third-party models available through Gemini Enterprise — are providing very strong price-performance for startups. These customers are increasingly deploying both our frontier models and “workhorse” models as their AI to power workloads as diverse as scientific research, generative media creation, and financial analysis. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Access to compute on </span><strong style=\"vertical-align: baseline;\">GPUs</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">TPUs</strong><span style=\"vertical-align: baseline;\"> is critical for AI and the ability to choose one — or both — is unique to Google Cloud. But importantly, startups almost always use additional products from our stack alongside these chips, like models, tools for building agents, or services like BigQuery or GKE. These additional technologies illustrate how the needs of startups are rarely singular, and just how much value they find in having ready access to a strong suite of second-, third-, and fourth-level technologies beyond just compute.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">We can see the demand for these technologies first-hand in some of the recent deals we have struck in the past 60 days with a number of leading startups across sectors:</span></p>\n<ul>\n<li><a href=\"https://www.artificial.agency/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Artificial Agency</strong></a><span style=\"vertical-align: baseline;\">, a startup focused on generative behavior in games, is running critical AI workloads and research on Google Cloud, where it is using NVIDIA GPUs for model training and inference, as well as Gemini models and Cloud Storage.</span></li>\n<li><a href=\"https://www.aryahealth.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Arya</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Health</strong></a><span style=\"vertical-align: baseline;\"> is building the AI workforce for healthcare, deploying agentic AI to perform the non-clinical administrative work that limits providers’ ability to deliver and expand care. Arya’s AI agents work across scheduling, intake, recruiting, onboarding, compliance, after-hours operations, and other critical workflows, interacting through voice, text, email, and providers’ existing systems. Arya uses a range of Gemini models across its agentic infrastructure, including Gemini 2.5 Pro, 3.1 Flash, and 3.5 Flash Lite, selecting models based on the reasoning, speed, and cost requirements of each workflow. </span></li>\n<li><a href=\"https://casco.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Casco</strong></a><span style=\"vertical-align: baseline;\"> is a cybersecurity startup whose autonomous agent swarms execute sophisticated, multi-step attacks to uncover vulnerabilities across enterprise applications, cloud environments, and infrastructure. Its architecture combines advanced reasoning models for complex, long-running tasks with fast models such as Gemini 3.5 Flash for focused subagent work. Google Cloud’s model portfolio and infrastructure, including Provisioned Throughput, help Casco match each workload with the right combination of intelligence, speed, and capacity.</span></li>\n<li><span style=\"vertical-align: baseline;\"><a href=\"https://www.coderabbit.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CodeRabbit</strong></a><span style=\"vertical-align: baseline;\"> has been a pioneer in independent AI code review and has expanded that layer into Agentic Change Management, the control plane for agentic software development. They use our Cloud Run and Storage products to underpin their application, and are now beginning to leverage Gemini 3.1 Pro and other Gemini models to power use cases like analyzing how a single code change impacts an entire project, writing clear and contextual review comments to explain logic bugs, and instantly generating one-click fixes for developers.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><a href=\"http://www.comfy.org\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Comfy</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">offers a platform for creatives to build brand-consistent content and media with generative AI. They are utilizing a mix of NVIDIA systems and Google media generation models, like Veo and Nano Banana, in their platform.</span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.microagi.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">MicroAGI</strong></a><span style=\"vertical-align: baseline;\">, a German AI robotics startup, recently </span><a href=\"https://www.googlecloudpresscorner.com/2026-07-22-Microagi-to-Build-Future-of-AI-Robotics-on-Google-Cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> they would access NVIDIA Blackwell systems for model training through Google Cloud. They will also use Gemini Enterprise Agent Platform and AI models on Google Cloud to help robotics process multimodal information like video.</span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.ineffable.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Ineffable</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Intelligence</strong></a><span style=\"vertical-align: baseline;\">, the London-based superintelligence startup, recently </span><a href=\"https://www.googlecloudpresscorner.com/2026-06-16-Ineffable-Intelligence-Selects-Google-Cloud-To-Power-Its-Superintelligence-Mission?linkId=62345713\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announced</span></a><span style=\"vertical-align: baseline;\"> a partnership with Google Cloud to access NVIDIA Vera Rubin systems as well as high-efficiency AI networking and storage.</span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://pearhealthlabs.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">PEAR Health Labs</strong></a><span style=\"vertical-align: baseline;\"> built and runs its AI health and fitness companion and agentic health platform entirely on Google Cloud, using our Gemini 3.5 Flash model as well as our data cloud products.</span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://www.roboforce.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Roboforce</strong></a><span style=\"vertical-align: baseline;\"> is a physical AI company building scalable robots for industrial environments. They recently signed a new agreement with Google Cloud to utilize our GPU-powered VMs, which will be used to train and serve their custom and post-trained physical AI models.</span></span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://xfigura.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">xFigura</strong></a><span style=\"vertical-align: baseline;\"> offers a platform that gives architecture teams a single, secure canvas that brings generative models into one place for AI-driven design. Built on Google Cloud, xFigura uses models like Nano Banana and Omni to help designers generate and refine concepts in plain language, with authorship staying with the architect.</span></span></span></span></span></span></span></li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><a href=\"https://scifin.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">SciFin</strong></a><span style=\"vertical-align: baseline;\"> is a startup that helps revenue teams uncover \"revenue reality\" by converging fragmented sales context across CRM systems, documents, emails, and other sources. They are utilizing Gemini models, infrastructure, and Gemini Enterprise to build and run their platform.</span></span></span></span></span></span></span></span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">These new and expanding customers represent some of the most exciting names in AI and are demonstrative of the type of successes that startups are having with Google Cloud’s uniquely complete stack for building AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about Google Cloud’s work with leading AI startups, or to get started building with us, visit </span><a href=\"https://cloud.google.com/startup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "c33181c9ecb80e03be9901676f114fb2":
    "id": "c33181c9ecb80e03be9901676f114fb2"
    "title": "How growing Latin American midsize businesses are building in the AI era"
    "link": "https://cloud.google.com/blog/topics/customers/how-midsize-latam-companies-build-with-ai/"
    "published": "2026-09-24 23:30:00"
    "fetched": "2026-09-25 03:12:25"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Latin America’s small and medium-sized businesses are the heartbeat of the region's economy — accounting for more than </span><a href=\"https://www.undp.org/latin-america/blog/yes-there-hope-msmes-region-and-beyond\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">60% of total employment</span></a><span style=\"vertical-align: baseline;\"> in the region, according to United Nations estimates. And just like their enterprise peers, everywhere you look, ambitious teams are moving fast to embrace AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">Many have already transitioned from experimenting with generative tools and agentic workflows to using them every day to work smarter, save time, and deliver exceptional customer experiences. These growing businesses are particularly focused on maximizing the benefit they get from their investments in AI, whether that’s using a fast, low-cost model to summarize daily emails or deploying an advanced model for complex data analysis, teams can match the right AI capability to their exact task and budget. </span></p>\n<p><span style=\"vertical-align: baseline;\">It’s this range of options, and a familiarity with the broader suite of Google business, media, and advertising tools that has led many SMBs to choose Google Cloud, and </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> in particular, as their AI platform of choice. By doing so, they’re able to build custom AI agents, streamline daily tasks and paperwork, and offer customers instant support with the speed and reach needed to compete on a global scale. </span></p>\n<p><span style=\"vertical-align: baseline;\">With our unique front row seat, we’ve seen the benefit SMBs are getting from leveraging Gemini Enterprise, not only for generative AI, but as a catalyst for adopting other essential cloud tools like </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> for complete end-to-end modernization. The number of Latin American-based small and medium businesses using Google Cloud AI tools has grown 8x year-over-year and the number of Brazil based small and medium businesses using Google Cloud AI tools has grown 9x year-over-year.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">This rapid adoption spans our Gemini models, Gemini Enterprise, and core </span><a href=\"https://cloud.google.com/infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud infrastructure</span></a><span style=\"vertical-align: baseline;\">, and are helping businesses to:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Roll out better customer support systems to help escalate and resolve customer support calls more quickly.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Automate repetitive actions in areas like payroll and accounting.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Help more employees understand and leverage data at work — even those not trained as data analysts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Rapidly create and implement new designs for marketing collateral.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Help more people build their own AI agents to help them in their everyday jobs.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">As we head into today’s </span><a href=\"https://www.wiz.io/events/gcp-summit-brasil-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Summit in Brazil</span></a><span style=\"vertical-align: baseline;\">, we were proud to showcase nearly 20 of our newest Latin American SMB customers using Google AI to reduce busywork, serve their customers faster, and grow their businesses.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Announcing new Latin American customers putting Google AI to work</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://adgoat.io/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AdGoat</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">an Argentina-based adtech company processing more than 10 billion annual ad requests across more than 100 global websites. It uses </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\">, the </span><a href=\"https://ai.google.dev/gemini-api/docs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini API</span></a><span style=\"vertical-align: baseline;\">, and Gemini Enterprise to automate content analysis, ad bidding, and audience targeting to help e-commerce brands drive higher campaign returns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://angelus.ind.br/en/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Angelus</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">a Brazilian dental and healthcare manufacturing company, uses Gemini Enterprise to streamline project management across its research and development department. This enables its teams to automatically pull technical project data into pre-approved templates aligned with the company’s brand identity and regulatory requirements.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://bunkerdb.com/en\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BunkerDB</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">a marketing science company operating across Latin America, uses Gemini Enterprise, Cloud Run, and </span><a href=\"https://cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> to power an AI platform that organizes marketing assets, checks brand compliance, generates or adapts multimodal content, and predicts ad performance before launch. All of this helps it reduce creative turnaround times from weeks to hours and cut cost per lead by up to 25%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://caffeinearmy.com/?utm_source=google&amp;utm_medium=paid&amp;utm_campaign=20275358873&amp;utm_content=158789549988&amp;utm_term=caffeine+army&amp;gadid=662356321422&amp;tw_source=google&amp;tw_adid=662356321422&amp;tw_campaign=20275358873&amp;gad_source=1&amp;gad_campaignid=20275358873&amp;gbraid=0AAAAAo2729bPtRTinWcSsz7rH5K6skQRG&amp;gclid=CjwKCAjwn67VBhBnEiwAXUIN1ScGTlY2qUbv_w2LDvbf-Gaz5p0VbmhcB1AUgyVMODM8Ww5an4PGSBoChw4QAvD_BwE\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Caffeine Army</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">a Brazilian wellness and high-performance company that connects people with solutions in nutrition, sports, and well-being, deployed BigQuery and Gemini Enterprise on Google Cloud to unify customer purchase insights, enabling faster creative campaign turnarounds and boosting team productivity across the organization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://convertperforma.com.br/\" target=\"_blank\"><strong style=\"vertical-align: baseline;\">Convert</strong></a><span style=\"vertical-align: baseline;\">, a Brazilian marketing and analytics provider, uses </span><a href=\"https://cloud.google.com/looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker</span></a><span style=\"vertical-align: baseline;\">, BigQuery, and Cloud Run to power five specialized AI agents that answer complex business questions in natural language, speeding up report deliveries by 65% and reducing operational costs by 32%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.growthdigital.biz/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Growth Digital</strong></a><span style=\"vertical-align: baseline;\">, a Google Ad sales rep operating across 13 Latin American countries, used BigQuery and Gemini Enterprise to build over 113 AI agents, enabling teams to build proposals 5x faster, cut campaign reporting time by 80%, and reduce financial error rates to under 0.01%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"http://grupotusmaquinas.com\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GrupoTusMaquinas.com</strong></a><span style=\"vertical-align: baseline;\">, an equipment management platform based in Chile, deployed </span><a href=\"https://cloud.google.com/products/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud AI</span></a><span style=\"vertical-align: baseline;\"> tools and Gemini models to create digital tracking profiles for trucks and machinery, allowing businesses to query fleet status in plain language and manage vehicles regardless of brand or location.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.healthatom.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">HealthAtom</strong></a><span style=\"vertical-align: baseline;\">, a healthcare technology company, uses the Gemini API, </span><a href=\"https://cloud.google.com/products/firestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Firestore</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/functions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Functions</span></a><span style=\"vertical-align: baseline;\"> to power AI assistants across its clinical platforms, automating appointment scheduling and medical record reviews while supporting 80 million annual patient interactions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"http://klog.co\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">KLog.co</strong></a><span style=\"vertical-align: baseline;\">, a Chilean logistics technology company digitizing freight forwarding across Latin America, uses Gemini Enterprise, BigQuery, and </span><a href=\"https://workspace.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Workspace</span></a><span style=\"vertical-align: baseline;\"> to automate cargo tracking and shipping paperwork, cutting manual data entry errors by over 90% and increasing document processing capacity tenfold.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://neooh.com.br/\" rel=\"noopener\" target=\"_blank\"><strong style=\"vertical-align: baseline;\">NEEOH</strong></a><span style=\"vertical-align: baseline;\">, a leading Brazilian out-of-home advertising communication platform, uses Gemini Enterprise to standardize secure AI usage across its organization, enabling teams to generate campaign copy and build pitch proposals faster while keeping corporate client data secure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://luxiaagro.com/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Luxia Agro</strong></a><span style=\"vertical-align: baseline;\">, an Argentinian foreign trade supplier of crop protection products, uses </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/3-5-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.5 Flash</span></a><span style=\"vertical-align: baseline;\"> and Gemini Enterprise to automatically pull key details from complicated shipping emails and update their central business systems. This allows it to automate 80% of foreign trade operations and cut manual processing errors in half.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://macal.cl/venta\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Macal</strong></a><span style=\"vertical-align: baseline;\">, a Chilean auction company, uses the Gemini Enterprise, Cloud Run, BigQuery, and </span><a href=\"https://cloud.google.com/security/products/security-command-center\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</span></a><span style=\"vertical-align: baseline;\"> to automatically verify property records and modernize its technology systems, cutting software development times from weeks to days and lowering infrastructure costs by up to 30%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.ninecon.com.br/en/home/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Ninecon</strong></a><span style=\"vertical-align: baseline;\">, a Brazilian tech consulting firm, deployed Gemini Enterprise to integrate AI directly into employee workflows, allowing managers to track usage patterns and optimize project turnaround times with real-time insights.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.novagne.com.br/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Nova Gestões</strong></a><span style=\"vertical-align: baseline;\">, a customer service and operations provider in Brazil, uses </span><a href=\"https://cloud.google.com/speech-to-text\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Speech-to-Text</span></a><span style=\"vertical-align: baseline;\"> and Gemini Enterprise to translate and analyze 100% of customer calls in real time, reducing post-call manual data entry and boosting team productivity by 30%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.romi.com/en/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Romi</strong></a><span style=\"vertical-align: baseline;\">, a Brazilian industrial machinery manufacturer, uses the Gemini API and Gemini Enterprise to power an interactive chat assistant directly on CNC machine HMI (human machine iInterface), giving factory operators instant answers grounded in official manuals and generating QR codes for step-by-step instructional videos.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.eldorado.com.uy/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Supermercados El Dorado</strong></a><span style=\"vertical-align: baseline;\">, a leading supermarket chain in Uruguay, leverages </span><a href=\"https://cloud.google.com/products/compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Compute Engine</span></a><span style=\"vertical-align: baseline;\"> and Gemini Enterprise to modernize legacy testing infrastructure and connect custom AI agents within their daily workflows, boosting team productivity across departments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://tryvia.com.br/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Tryvia</strong></a><span style=\"vertical-align: baseline;\">, a Brazilian IT and business solutions provider, uses Google Cloud, Looker, and Gemini Enterprise to move off legacy physical servers, giving teams real-time reporting dashboards and AI tools that speed up software development and daily tasks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.vinci-concessions.com/en/infrastructure/via-cristais\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Via Cristais</strong></a><span style=\"vertical-align: baseline;\">, a major highway operator in Brazil, leverages </span><a href=\"https://docs.cloud.google.com/contact-center/ccai-platform/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Contact Center as a Service</span></a><span style=\"vertical-align: baseline;\"> to speed up emergency routing for highway accidents, reducing caller wait times, improving driver satisfaction, and mitigating the impact of call center staff turnover.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.wespeak.pro/en/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">WeSpeak</strong></a><span style=\"vertical-align: baseline;\">, an AI conversational platform for the hospitality industry in Latin America, uses Cloud Run, </span><a href=\"https://deepmind.google/models/gemini/pro/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Pro</span></a><span style=\"vertical-align: baseline;\">, and Gemini Flash to automate end-to-end guest interactions across messaging channels like WhatsApp and Instagram. This has helped it achieve an 85% resolution rate and a 2x increase in overall sales volume for hotel clients.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Helping your team build AI skills</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To help growing teams get the absolute most out of AI, we’ve created easy, no-cost learning programs that anyone can use:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Programs for small and medium businesses:</strong><span style=\"vertical-align: baseline;\"> Explore beginner-friendly training paths or join specialized programs to learn how to build custom AI assistants for your day-to-day work.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google skills for organizations:</strong><span style=\"vertical-align: baseline;\"> Access thousands of free, on-demand AI courses and hands-on practice labs designed by experts at Google Cloud and Google DeepMind.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Get certified:</strong><span style=\"vertical-align: baseline;\"> Help your staff gain industry-recognized AI certificates through guided courses, expert mentoring, and skill badges.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By offering easy-to-use tools and free training — from everyday office apps in Workspace to advanced AI on Google Cloud — Google is here to help Latin American businesses thrive today and in the future.</span></p></div>"
