    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>You can use the <a href=\"https://docs.cloud.google.com/bigquery/docs/migration/migration-lineage\">migration lineage service</a> to\nvisualize the data flow and connections in your source database and\nhelp you plan a BigQuery data warehouse migration. This feature is in\n<a href=\"https://cloud.google.com/products/#product-launch-stages\">Preview</a>.</p>\n<h2 class=\"release-note-product-title\">Datastream</h2>\n<h3>Feature</h3>\n<p>Datastream now supports MongoDB extended JSON canonical mode as the\ndefault format for new streams from MongoDB sources to BigQuery\ndestinations.</p>\n<p>Canonical mode provides higher data fidelity by explicitly labeling every\nBSON type to prevent precision loss during data exchange.</p>\n<p>For more information, see the following:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/datastream/docs/sources-mongodb\">Stream data from MongoDB databases</a></li>\n<li><a href=\"https://docs.cloud.google.com/datastream/docs/bq-map-data-types#mongodb-data-types\">MongoDB data types in\nBigQuery</a></li>\n</ul>\n<h2 class=\"release-note-product-title\">Filestore</h2>\n<h3>Feature</h3>\n<p>Small capacity Filestore instances for the Regional service tier are <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>. Small capacity instances start at 100 GiB and scale in 1 GiB increments, providing an option for development, testing, and applications with low traffic or basic storage needs.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/filestore/docs/service-tiers#small-instances\">Small capacity instances</a>.</p>"
