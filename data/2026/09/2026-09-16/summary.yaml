"overview": |
  この日は 7 件で、AI エージェント実行基盤としての GKE の強化が際立ちました。GKE 向けに Agent Substrate が公開され、標準的なコンテナランタイムの 10 倍の密度で数百万のサンドボックスを実行できるオープンソースのセキュアバイデフォルトなエージェント実行ランタイムとして、ネイティブなゼロトラストカーネルとネットワーク分離を備え、1 秒あたり 500 回超の suspend/resume 操作を 500 ミリ秒未満のレジューム時間で行えます。OpenRouter 利用実績で世界 1 位の AI エージェント Hermes を開発する Nous Research がすでに採用しています。あわせて、エージェントのワークスペース向けに設計されたフルマネージドのストレージ Filestore agent volumes も発表され、数千から数百万規模の同時セッションへスケールするエージェントサンドボックスに、厳密なワークスペース分離・瞬時のセッション再開・従量課金の弾力性・複数エージェント間のスムーズな連携を提供します。通信業界向けには、Graph Neural Network (GNN) と分散処理基盤 GraphFlow を組み合わせ、根本原因分析・容量計画・トラフィック予測・What-If シミュレーション・リアルタイム異常検知といった高度な診断を AI エージェントと統合して自律型ネットワーク運用を実現する取り組みが紹介されました。信頼性運用では、Google Cloud の障害発生時に「検証→調査→報告→解決→レビュー」の構造化されたワークフローに沿って対応するベストプラクティスが解説されています。セッション管理では、資格情報の窃取やアカウント乗っ取りリスクを抑えるための既定 16 時間のセッション長のグローバル展開が完了し、Terraform・gcloud CLI・REST API によるプログラムでのセッションポリシー管理が一般提供となりました。リリースノートでは、BigQuery のマイグレーションリネージサービスによるデータフロー可視化 (プレビュー)、Datastream の MongoDB 拡張 JSON 正準モードのデフォルト化、Filestore のリージョナルサービスティア向け小容量インスタンス (100 GiB から 1 GiB 刻み) の GA が案内されています。日本語ブログ (抄訳) では、Google が新設の 2026 年 Gartner Magic Quadrant エンタープライズ AI アシスタント部門でリーダーに選出されたことが紹介されました。
