  "79a80555615454e8a9f7b6a0e78b236f":
    "id": "79a80555615454e8a9f7b6a0e78b236f"
    "title": "Scaling Telco Autonomy: Leveraging GNNs with Distributed GraphFlow"
    "link": "https://cloud.google.com/blog/products/databases/run-gnns-at-scale-with-ease-introducing-distributed-graphflow/"
    "published": "2026-09-16 01:00:00"
    "fetched": "2026-09-16 01:18:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The telecommunications industry is currently undergoing a paradigm shift, moving from traditional manual human-driven operations to fully </span><a href=\"https://cloud.google.com/blog/topics/telecommunications/the-autonomous-network-operations-framework-for-csps?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Autonomous Network Operations.</span></a><span style=\"vertical-align: baseline;\"> Modern networks have grown increasingly complex, heterogeneous, and large-scale, making handcrafted rules-based methods and traditional Machine Learning (ML) approaches alone insufficient to automate network operations. While ML methods can identify subtle patterns and make fine predictions from large amounts of structured data, they lack the ability to understand, reason about the data and the system it represents, and ultimately make the kind of decision a human operator would.</span></p>\n<p><span style=\"vertical-align: baseline;\">The growth of AI agents and their ability to reason is a promising solution to this shortcoming. However, in the same way a human operator is not capable of directly ingesting the statistical information spread across the billions of data points created in a large network, AI agents also lack the ability to operate at this scale. To address this challenge, telecommunications companies are adopting Graph Neural Networks (GNNs), a modern form of machine learning designed to operate natively on massive volumes of temporal and relational data. By integrating GNNs with AI agents, operators can combine advanced diagnostics such as root cause analysis, capacity planning, traffic forecasting, what-if simulations, and real-time anomaly detection with the reasoning power required to interpret these insights and execute justified actions. This powerful combination enables networks to safely move towards Level 5 Autonomy as </span><a href=\"https://www.tmforum.org/missions/autonomous-networks\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">defined by TM Forum</span></a><span style=\"vertical-align: baseline;\">, where the system operates autonomously. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we present the three components (Data, ML, and AI) that will power Google Cloud’s Autonomous Network Operations framework.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_qK2rt5p.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_rvvQ1TV.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Google Autonomous Network Operations framework architecture</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">Foundation: Digital Twin on Spanner Graph</strong></h2>\n<p><span style=\"vertical-align: baseline;\">At the heart of Google Cloud’s Autonomous Network Operations framework is the network digital twin: a highly detailed, virtual replica that continuously mirrors its living telecommunications network in real time. Rather than being a static model, it is represented as a dynamic, temporal network graph that captures the evolving state and relations of its components over time. This architectural approach allows operators to \"go back\" in time to train and evaluate ML models on historical data, while providing AI agents with the foundational operational knowledge required to achieve Level 5 Autonomy. By simulating the impact of proposed network changes within this digital environment, the Digital Twin establishes a critical layer of trust, enabling AI agents to confidently design future states and automatically resolve network issues.</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud’s </span><a href=\"https://cloud.google.com/products/spanner/graph?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Graph</span></a><span style=\"vertical-align: baseline;\"> is well suited to host this digital twin:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scalability and Availability</strong><span style=\"vertical-align: baseline;\">: Spanner Graph provides a no compromise foundation for modern applications, offering virtually unlimited scaling that grows as the network grows, along with 0-RPO/0-RTO and five 9s of availability.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-Model Support</strong><span style=\"vertical-align: baseline;\">: Supports multiple data models (Relational, Graph, Vector, and Full-Text Search) in a single platform allowing developers to build complex compositions such as graph transversals combined with nearest neighbor vector search.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Global Consistency</strong><span style=\"vertical-align: baseline;\">: Spanner provides a globally consistent view of the network, simplifying system development.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The next figure illustrates a network topology with four node types: routers, interfaces (the physical ports), VPNs (L3VPN service instances), and flows (active traffic sessions). These are connected by directed edge types capturing the full network stack: physical containment (router-interface), physical links (interface-interface), control-plane peering (router-router via OSPF/iBGP), service membership (router-VPN), and traffic anchoring (flow-interface, flow-VPN).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_E5yMTVW.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>High Level network topology</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">The ML layer: Distributed Graph Flow (DGF)</strong></h2>\n<p><span style=\"vertical-align: baseline;\">To predict how a network will behave and react, the digital twin leverages an ML layer powered by </span><a href=\"https://dgf.readthedocs.io/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Distributed Graph Flow</strong></a><strong style=\"vertical-align: baseline;\"> (DGF)</strong><span style=\"vertical-align: baseline;\">. By training on the vast volumes of structured historical data hosted within Spanner Graph, this layer uncovers critical predictive insights that enable human operators and AI agents to manage networks proactively rather than reactively.</span></p>\n<p><span style=\"vertical-align: baseline;\">DGF is a recently open-sourced Python library designed to manage the entire end-to-end lifecycle of GNN modeling. Developed by Google CoreML and Google Research, it brings a decade of internal Google-scale tools and expertise directly to Google Cloud enterprise clients. To accommodate different engineering needs, the library offers high-performance, composable, low-level primitives for advanced teams, alongside a simple API for rapid development that requires no prior GNN expertise.</span></p>\n<p><span style=\"vertical-align: baseline;\">For instance, training and evaluate a GNN model in GraphFlow with the high level API can be as simple as writing 5 lines of code:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import dgf\\r\\n\\r\\n# Fetch the data from Spanner Graph\\r\\ngraph, schema = dgf.io.read_spanner_graph(...)\\r\\n\\r\\n# Train a node attribute prediction model\\r\\nmodel = dgf.learning.train_node_model(graph, schema, target_column=&quot;risk_score&quot;)\\r\\n\\r\\n# Evaluate the model\\r\\nmodel.evaluate()\\r\\n# Make predictions\\r\\nmodel.predict(graph, seed_node_idxs=[0, 1, 2])\\r\\n\\r\\n# Save the model for later\\r\\nmodel.save(&quot;/tmp/model&quot;)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5d1148d390&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The DGF provides high-level concepts that map directly to Autonomous Network Operations requirements:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_87R4Pjc.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">Use cases</strong></h2>\n<p><span style=\"vertical-align: baseline;\">By leveraging DGF and GNNs, telcos can move from reactive maintenance to proactive prevention through several advanced use cases:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Anomaly detection</strong><span style=\"vertical-align: baseline;\">: GNNs generate node and edge embeddings that encapsulate historical patterns and current health. Any anomalous embeddings are flagged for review before they lead to service degradation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Root cause analysis (RCA)</strong><span style=\"vertical-align: baseline;\">: DGF can output specific subgraphs containing only the relevant network instances related to an incident, such as \"Attach Failures\" in a specific ZIP code. This allows troubleshooting agents to perform high-speed analysis without scanning the entire global network.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Predictive maintenance</strong><span style=\"vertical-align: baseline;\">: The system can predict the likelihood of device failures or edge breaks, such as \"handover failures\" for fast-moving equipment, enabling proactive load balancing or rerouting. Furthermore, by combining agents, remedial actions can be automated by adopting a ‘human-on-the-loop’/’human-in-the-loop’.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What-if analysis</strong><span style=\"vertical-align: baseline;\">: GNNs enable Telcos to simulate scenarios like fiber cuts,  or traffic surges or device configuration changes. By modeling topological dependencies, GNNs can predict how these local changes propagate across the entire network, allowing engineers to test resilience and evaluate mitigation strategies in a risk-free digital environment.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Scenario: Root cause analysis with GNNs and DGF</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Once you have created a digital twin (</span><a href=\"https://github.com/GoogleCloudPlatform/cloud-spanner-samples/tree/main/telco-and-csp/ano-gnn\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">example code</span></a><span style=\"vertical-align: baseline;\">), a straight-forward 5-step process can be used to implement Root Cause Analysis(RCA) detection using GNNs and DGF. </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Connect to the Digital Twin</strong><span style=\"vertical-align: baseline;\">: Use the DGF Spanner Graph connector (</span><span style=\"font-style: italic; vertical-align: baseline;\">dgf.io.read_spanner_graph</span><span style=\"vertical-align: baseline;\">) to load the network topology directly from Spanner Graph's Digital Twin into the DGF environment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Train a Supervised Node (or Edge) Prediction model</strong><span style=\"vertical-align: baseline;\">: Depending on the training data and objective, you will train a supervised node prediction model to predict a target node feature or an edge prediction model to predict an edge between the root cause entity node and the affected entity node. For the given sample data you will use the high-level </span><code style=\"font-style: italic; vertical-align: baseline;\">dgf.learning.train_node_model</code><span style=\"vertical-align: baseline;\"> API to train a supervised node prediction model.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Use the node prediction model to predict root cause node</strong><span style=\"vertical-align: baseline;\">: The node prediction model can be directly used to predict the impact score on the node with the anomaly. Entity nodes affected by the anomaly with highest predicted impact score will be the top candidates for root cause.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deploy to </strong><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-gemini-enterprise-agent-platform\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</strong></a><strong style=\"vertical-align: baseline;\"> (formerly Vertex AI)</strong><span style=\"vertical-align: baseline;\">: Export the model and host it on a Gemini Enterprise endpoint to enable scalable, low-latency predictions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Real-time Inference</strong><span style=\"vertical-align: baseline;\">: Make prediction calls to the inference endpoint with the anomaly date as input. The endpoint will return the predicted root cause Entity nodes. </span></p>\n</li>\n</ol>\n<h2><strong style=\"vertical-align: baseline;\">Get started today</strong></h2>\n<p><span style=\"vertical-align: baseline;\">The integration of GNN using Distributed Graph Flow into network operations is more than just a technical upgrade; it is a critical evolution for the telco industry. By moving towards a GNN-powered autonomous framework, operators can significantly shorten outage times, optimize capacity in real-time, and ultimately deliver a superior customer experience through improved operational efficiency.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">To start building your own intelligent network applications, check out the </span><a href=\"https://github.com/google-research/distributed_graph_flow\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Distributed GraphFlow (DGF)</span></a><span style=\"vertical-align: baseline;\"> library, which provides the essential primitives for scalable GNN training and inference. For a hands-on experience, follow our step-by-step </span><a href=\"https://github.com/GoogleCloudPlatform/cloud-spanner-samples/tree/main/telco-and-csp/ano-gnn\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">code sample</span></a><span style=\"vertical-align: baseline;\">. You can also explore our recent award-</span><a href=\"https://www.tmforum.org/catalysts/awards?moonshotsOnly=false\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">winning Moonshot project</span></a> <span style=\"vertical-align: baseline;\">on </span><a href=\"https://www.tmforum.org/catalysts/projects/C26.0.965/businessaware-gnnhealing-networks\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Business-aware GNN-healing networks</span></a><span style=\"vertical-align: baseline;\">, and dive deeper into our approach on self-optimizing autonomous networks by </span><a href=\"https://services.google.com/fh/files/misc/self_optimizing_autonomous_networks_white_paper.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">reviewing this whitepaper.</span></a><span style=\"vertical-align: baseline;\"> </span></p></div>"
  "bbe70edd74ddcf0f9096902d674c4aba":
    "id": "bbe70edd74ddcf0f9096902d674c4aba"
    "title": "Agent Substrate brings high-density, scalable, trusted infrastructure to GKE"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/agent-substrate-available-on-gke/"
    "published": "2026-09-16 01:00:00"
    "fetched": "2026-09-16 01:18:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Today, we are announcing the availability of Agent Substrate on Google Kubernetes Engine (GKE). </strong><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> is an open-source, secure-by-default agent execution runtime engineered to run millions of sandboxes with </span><strong style=\"vertical-align: baseline;\">10x higher density than standard container runtimes</strong><span style=\"vertical-align: baseline;\">. Purpose-built for the era of autonomous agents, Substrate delivers </span><strong style=\"vertical-align: baseline;\">sub-500ms resume operations</strong><span style=\"vertical-align: baseline;\"> at over </span><strong style=\"vertical-align: baseline;\">500 suspend/resume activations per second</strong><span style=\"vertical-align: baseline;\"> with a native zero-trust kernel and network isolation.</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate is available as an open-source solution that runs on any Kubernetes infrastructure and is optimized for GKE. Leading AI teams are already building on it: </span><strong style=\"vertical-align: baseline;\">Nous Research</strong><span style=\"vertical-align: baseline;\">, the team behind the </span><strong style=\"vertical-align: baseline;\">Hermes Agent</strong><span style=\"vertical-align: baseline;\">, is actively building on top of Agent Substrate. </span><strong style=\"vertical-align: baseline;\">Hermes</strong><span style=\"vertical-align: baseline;\"> is currently ranked the #1 AI agent globally by OpenRouter usage across productivity, coding, CLI, and personal agents.</span></p>\n<h3><span style=\"vertical-align: baseline;\">From local to 1M-agent scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">Developers already run Antigravity, Claude Code, Codex, OpenClaw, Hermes, and other harnesses locally but that’s fundamentally than running hundreds of thousands of concurrent, long-lived agents that generate code, interact with tools, and drive automated execution — challenges that existing architectures often struggle to meet.</span></p>\n<p><span style=\"vertical-align: baseline;\">Scaling an agent platform from a local prototype to running agents at scale fundamentally changes your infrastructure constraints, which can include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Opaque trust boundaries: </strong><span style=\"vertical-align: baseline;\">Models can generate and run arbitrary code on the fly. Without kernel-level isolation and dynamic network controls, running untrusted code </span><span style=\"font-style: italic; vertical-align: baseline;\">that no human has ever looked at</span><span style=\"vertical-align: baseline;\"> risks host escape, credential theft and data exfiltration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tool access friction:</strong><span style=\"vertical-align: baseline;\"> Agents need full computer environments to invoke command-line tools, headless browsers, and filesystem workspaces. Running these safely needs to be fast and easy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Massive bursts: </strong><span style=\"vertical-align: baseline;\">Agent harnesses, benchmarks, and reinforcement learning rollouts can generate thousands of sandboxes per minute. General-purpose schedulers struggle under this churn, and repeatedly decompressing container images can cause severe disk contention.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Idle compute: </strong><span style=\"vertical-align: baseline;\">Autonomous agents spend the vast majority of their time dormant while waiting on model inference, tool responses, or human feedback. Reserving dedicated CPU and RAM for idle containers wastes valuable resources</span><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">A substrate purpose-built for agents</span></h3>\n<p><span style=\"vertical-align: baseline;\">When platform teams hit these challenges, they face an unacceptable trade-off: sacrifice control and isolation, or deal with the high latency and inefficiency of VMs. We believe that teams shouldn’t have to choose. </span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate avoids this by decoupling agent execution from machine management. Built on top of cloud-native Kubernetes infrastructure, Agent Substrate offers a new execution layer that’s purpose-built for agentic workloads. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_2dtrRM6.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">From there, the execution layer directly manages the lifecycle of sandboxed agent environments with:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Security by default: </strong><span style=\"vertical-align: baseline;\">Hardware-isolated Cloud Hypervisor microVMs or gVisor sandboxes, paired with egress proxies that enforce granular network policies and inject credentials outside the reach of the agents themselves, preventing credential theft.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-second activation: </strong><span style=\"vertical-align: baseline;\">Millisecond dispatch of activated agents onto pre-warmed workers, on demand, without container boot delays.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">High efficiency</strong><span style=\"vertical-align: baseline;\">: Idle actors are suspended and unscheduled in hundreds of milliseconds, freeing up compute resources.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Open source and portable: </strong><span style=\"vertical-align: baseline;\">Runs on any Kubernetes cluster in any compute environment and works with any agent framework or harness, including Claude Code, OpenClaw, and Hermes</span><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Core architectural principles</span></h3>\n<p><span style=\"vertical-align: baseline;\">We adhere to four core architectural principles to guide how Agent Substrate solves these challenges:</span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Secure by default at the kernel and the network</span></h4>\n<p><span style=\"vertical-align: baseline;\">AI agents generate and run untrusted code and terminal commands as a core function. Running that code on a shared server creates serious risks for breakouts and unintended data leakage either at the shared kernel or network level.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_zC5wfpY.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Agent Substrate takes a secure by default position for both the host kernel and network layers. Teams can choose between hardware-isolated Cloud Hypervisor microVMs, which provides full Linux kernel compatibility, or gVisor sandboxing, with even lower-overhead kernel isolation. Agent Substrate’s integrated gateway manages all egress and ingress requests, enabling fine-grained and extensible control over network access.</span></p>\n<h4><span style=\"vertical-align: baseline;\">2. A control plane and data plane built for low-latency activation</span></h4>\n<p><span style=\"vertical-align: baseline;\">To optimize density for isolated, long-running agent workloads, you need a purpose-built control plane and data plane that enables the lowest possible latency and the highest possible rate of suspend and resume operations. Agent Substrate introduces a dedicated control plane that handles data-aware scheduling with minimal latency. Meanwhile, the data plane handles hundreds of suspend/resume operations per second directly on pre-warmed workers, reducing the overhead of preparing the environment. Snapshots are written to local disk and Google Cloud Storage for durable state persistence. In less than 500ms, a sandboxed environment can be resumed to its previous state, and immediately re-suspended once it’s idle again.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_AQ7nEJ0.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">3. High-density and active-only compute economics</span></h4>\n<p><span style=\"vertical-align: baseline;\">Agents spend most of their time waiting on model inference, tool responses, or user input. Reserving physical CPUs and RAM for idle containers can lock up expensive and scarce capacity and make running agent fleets at scale unsustainable.</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate can release resources the moment an agent pauses. It snapshots the guest hypervisor’s state to the local disk and Cloud Storage, freeing up RAM and CPU to run other agents, while keeping the state intact. When the next turn or tool call arrives, Agent Substrate resumes the snapshotted session in milliseconds. This zero-idle model can pack over 1,000 dormant agents per host, delivering 10x higher compute density than traditional compute. For workloads that need shared filesystems across turns, an optional </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore</span></a><span style=\"vertical-align: baseline;\"> agent volume controller provides persistent NFS storage — more on that below.</span></p>\n<h4><span style=\"vertical-align: baseline;\">4. Kubernetes as a foundation: scale and reliability</span></h4>\n<p><span style=\"vertical-align: baseline;\">Building a custom sandbox orchestrator on standard VMs forces teams to maintain tedious operational tooling: node recovery, autoscaling, multi-zone scheduling, and network policy. But routing each sub-second tool invocation through the standard Kubernetes Pod lifecycle adds seconds of delay to each request.</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate combines both approaches. The high-frequency suspend-resume runs directly on local workers through a purpose-built data plane. Meanwhile, Kubernetes manages the machines, handling self-healing nodes, fleet autoscaling, and cluster reliability, as well as drives the lifecycle of the worker pods themselves. For workloads that need standard Pod semantics, existing primitives like Agent Sandbox and kernel-isolated Pods continue to work side by side.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Optimized for Google Cloud infrastructure</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Building an agent platform that can achieve 1M agent scale depends on having the right underlying compute and storage infrastructure. Agent Substrate on GKE maximizes machine obtainability and flexibility with </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-custom-compute-classes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">custom ComputeClasses</span></a><span style=\"vertical-align: baseline;\"> to dynamically manage machine pools across shapes and families, including spot and on-demand pools. This includes native support for Google Axion, our custom Arm-based processors, which deliver up to 30% better price-performance for sandbox workloads compared to competitive cloud offerings. For stateful workspaces, Agent Substrate on GKE can be optionally integrated with </span><a href=\"https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore agent volumes</span></a><span style=\"vertical-align: baseline;\">, a new offering that attaches and detaches NFS mounts in milliseconds, allowing agents to start/resume near-instantaneously, along with native Read-Write-Many (RWX) access and POSIX-compliant file locking to enable safe multi-agent collaboration without write collisions. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Build your agent platform on a scalable foundation</span></h3>\n<p><span style=\"vertical-align: baseline;\">When building production agent applications, you shouldn’t have to compromise between strong security, low latency, and operational scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">Nous Research builds Hermes, the number-one AI agent in the world by usage according to OpenRouter, where it also ranks first in productivity, coding, personal and CLI agents. Nous Research has been an early design partner on Agent Substrate, evaluating how the runtime handles the isolation and identity requirements that agent workloads introduce.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“We built Hermes Enterprise to enable customers to deploy into their existing infrastructure, while handling per-agent isolation and extensible access control. Agent Substrate addresses both at the platform layer in a way that also preserves valuable compute resources. Our experience with Agent Substrate gives us confidence the architecture can scale efficiently as agent workloads grow.”</span><span style=\"vertical-align: baseline;\"> - Hervé Bizira, Chief Business Officer, Nous Research</span></p>\n<p><span style=\"vertical-align: baseline;\">By pairing the machine resilience, self-healing nodes, and declarative management of Kubernetes with an agent-native data plane built for kernel isolation, active-only compute, and sub-second execution, Agent Substrate gives engineering teams a clear path to scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate is open source and available to all GKE customers for non-production workloads. GA support for production is available via allowlist. To deploy it on your GKE clusters, see </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/install-overview-substrate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate on GKE documentation</span></a><span style=\"vertical-align: baseline;\">. To learn more, see About Agent Substrate or visit the </span><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source repository</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "cb3dfe62a0ec2a08bc8315d96d6c836c":
    "id": "cb3dfe62a0ec2a08bc8315d96d6c836c"
    "title": "Introducing Filestore agent volumes: fully managed storage for agent workspaces"
    "link": "https://cloud.google.com/blog/products/storage-data-transfer/filestore-agent-volumes/"
    "published": "2026-09-16 01:00:00"
    "fetched": "2026-09-16 01:18:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">From running build tools, to data analysis pipelines, to collaborative research, executing data-driven tasks is essential for any enterprise agent. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, platform teams often stitch together custom workarounds to address agent storage requirements, which could include shuttling state back and forth between agent sandboxes and centralized storage or manually managing local disks and/or self-hosted file systems. However, as agent fleets scale, these approaches force difficult trade-offs between cold-start latency, operational complexity, and the cost of idle, pre-allocated storage.</span></p>\n<p><span style=\"vertical-align: baseline;\">As organizations scale agent sandboxes to thousands or even millions of concurrent sessions, storage must evolve to overcome these trade-offs and meet the needs of these dynamic workloads, which require strict workspace isolation, instant session resumption, elastic pay-per-use economics, and fluid multi-agent collaboration.</span></p>\n<p><span style=\"vertical-align: baseline;\">To meet these emerging demands, we’re expanding our AI storage portfolio and announcing availability of </span><strong style=\"vertical-align: baseline;\">Filestore agent volumes</strong><span style=\"vertical-align: baseline;\">, a new, fully managed capability purpose-built to deliver high-performance, elastic file storage for scaling agentic workloads on Google Cloud.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Purpose-built storage for AI agent workspaces</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Autonomous agents require isolated runtime environments to safely execute dynamic code, install third-party packages, and run tools without putting host infrastructure or tenant data at risk. While </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/agent-substrate-available-on-gke\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate on GKE</span></a><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">and GKE Agent Sandbox provide the dedicated compute environments needed to run high-density agent fleets, those sandboxes also need dedicated persistent workspaces to operate on.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Filestore agent volumes</strong><span style=\"vertical-align: baseline;\"> within </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Filestore</span></a><span style=\"vertical-align: baseline;\">,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">give you purpose-built agentic storage to complement your agentic compute via a dynamic provisioning architecture designed specifically for the scale and elasticity of AI agent fleets. Co-designed with Agent Substrate to support agentic fleets at scale, Filestore agent volumes provide GKE sandboxes with instantaneous access to isolated, persistent file storage. When configured to leverage Filestore, GKE storage management happens behind the scenes: Every time GKE launches a sandbox for a new agent task, Filestore automatically allocates and attaches a dedicated, isolated file workspace to that environment in milliseconds. Platform teams don't need to manually create, attach, or tear down storage volumes for individual agent runs; instead, the system handles the entire volume lifecycle automatically as your agent fleet scales up and down. The result is an efficient, end-to-end infrastructure solution for cost-effective agent management that provides: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Granular isolation and enterprise guardrails</strong><span style=\"vertical-align: baseline;\">: Agent platforms face security and data leakage risks when running untrusted, autonomous code. Filestore agent volumes enforce strict boundary controls and granular access permissions per workspace, ensuring agents operate exclusively within their designated directories and keeping dynamic toolchains strictly isolated across tenants.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-second session resumption</strong><span style=\"vertical-align: baseline;\">: Traditional storage provisioning approaches can introduce cold-start latency that stalls interactive agent sessions. Agent volumes attach and detach in milliseconds, making it possible for orchestrators to aggressively suspend idle sandboxes to save compute costs, and resume instantly when new tasks or user inputs arrive.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Smart lifecycle economics and pay-per-use pricing</strong><span style=\"vertical-align: baseline;\">: <span style=\"vertical-align: baseline;\">Pre-allocating fixed-size, high-performance storage for thousands of short-lived or intermittent agent tasks can create massive storage waste. With agent volumes, platforms pay only for the storage capacity consumed and benefit from automatic lifecycle tiering. This means you get high performance without wasted spend: When your agents aren’t actively reading/modifying code or analyzing datasets, you can automatically shift idle workspace state to lower-cost storage.</span></span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-agent collaboration</strong><span style=\"vertical-align: baseline;\">: Coordinating multi-agent swarms can result in brittle data-passing pipelines and risk of file collisions. Built with native Read-Write-Many (RWX) support and POSIX file locking, agent volumes allow orchestrators to attach a single shared workspace across multiple agents. Collaborating agents can safely co-author, test, and review project files concurrently with file-level consistency and protection against write conflicts.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Powering next-generation agentic workloads</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By providing an elastic, high-performance, and isolated file tier, Filestore agent volumes unlock a wide spectrum of agentic workloads and use cases in production:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Software engineering and coding sandboxes</strong><span style=\"vertical-align: baseline;\">: Agentic coding platforms can spin up thousands of isolated workspaces where agents safely install libraries, write multi-file patches, run build tools, and execute unit tests, all leveraging standard POSIX file semantics with no need for storage-specific customization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Collaborative multi-agent swarms</strong><span style=\"vertical-align: baseline;\">: Complex workflows, such as a lead orchestrator delegating tasks to dedicated research, code generation, and validation sub-agents, can directly share a unified file tree. RWX support allows agents to co-author and review project files concurrently without write conflicts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Interactive long-horizon workflows</strong><span style=\"vertical-align: baseline;\">: For user-in-the-loop applications (such as agents that require asynchronous user approval or run multi-hour data analysis pipelines), platforms can suspend idle agent sandboxes to minimize compute waste, then resume execution on demand with sub-second responsiveness.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started today </strong></h3>\n<p><span style=\"vertical-align: baseline;\">If you are building an Agent-as-a-Service platform, scaling coding assistants, or deploying enterprise agent fleets, your storage tier should accelerate your innovation — not hinder it.</span></p>\n<p><span style=\"vertical-align: baseline;\">Filestore agent volumes are now available to all Google Cloud customers for non-production workloads. GA support for production workloads is available via allowlist. This new offering features out-of-the-box integrations with </span><strong style=\"vertical-align: baseline;\">Agent Substrate on GKE</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">GKE Agent Sandbox</strong><span style=\"vertical-align: baseline;\"> to help you build responsive, scalable, and cost-efficient agent platforms today.</span></p>\n<p><span style=\"vertical-align: baseline;\">To request access to Filestore agent volumes, submit </span><a href=\"https://forms.gle/vYPkcFiZVoTjf7Ah7\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this form</span></a><span style=\"vertical-align: baseline;\"> and visit the </span><a href=\"https://cloud.google.com/filestore\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Filestore documentation</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE documentation</span></a><span style=\"vertical-align: baseline;\"> to learn more.</span></p></div>"
  "2a64d056ff88ac5f487dce6a87d05ba6":
    "id": "2a64d056ff88ac5f487dce6a87d05ba6"
    "title": "Best practices for handling cloud reliability incidents"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/cloud-reliability-incident-handling-best-practices/"
    "published": "2026-09-16 01:00:00"
    "fetched": "2026-09-16 01:18:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Cloud outages can range from global service disruptions to issues isolated to a specific region, zone, or even just your project, workload or application. If you suspect a Google Cloud Platform outage is impacting your services, we recommend you follow a structured “Verify→ Investigate→Report→Resolve→Review\" workflow to resolve it. And before that outage occurs, you should also have </span><span style=\"font-style: italic; vertical-align: baseline;\">prepared</span><span style=\"vertical-align: baseline;\"> your environment for an eventual disruption by designing for failure, and actively practicing the steps you need to take to restore service. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this blog, we summarize the key reliability incident handling best practices to help you design and practice your reliability incident response capabilities and minimize impact. Rather than an exhaustive guide, this is meant as a primer on only the most important practices for advisory purposes. Please note that we do not cover additional practices specific to security incidents here. </span></p>\n<p><span style=\"vertical-align: baseline;\">Beyond the base steps covered here, you may want to also </span><span style=\"vertical-align: baseline;\">explore how AI agents and tools are starting to transform incident handling. Check out </span><a href=\"https://sre.google/prodcast/transcripts/sre-prodcast-04-09/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">this episode of the Prodcast</span></a><span style=\"vertical-align: baseline;\">, where Googlers explore the latest trends of </span><a href=\"https://sre.google/prodcast/transcripts/sre-prodcast-04-09/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">leveraging agentic AI in Site Reliability Engineering</span></a><span style=\"vertical-align: baseline;\"> (SRE) to detect issues early and prevent disruptions. Try</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/cloud-assist/investigations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Assist investigations</span></a><span style=\"vertical-align: baseline;\">, or explore </span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Skills</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/mcp/supported-products\"><span style=\"text-decoration: underline; vertical-align: baseline;\">remote managed MCP servers</span></a><span style=\"vertical-align: baseline;\"> to give you another set of tools for quickly pinpointing an issue. Before getting into these advanced techniques, we focus below on the foundational steps to good incident handling.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">1. Prepare</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Long before things start to go sideways, you should have spent significant time preparing for an outage along at least four dimensions: design, data, playbooks and training.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Design</strong><span style=\"vertical-align: baseline;\">: Think ahead and mitigate future incidents by designing automated response actions, like a load balancer shifting traffic away from slow or unresponsive instances, or by automating as much of your incident response playbook as possible. Review </span><a href=\"https://docs.cloud.google.com/architecture/framework\"><span style=\"text-decoration: underline; vertical-align: baseline;\">designs</span></a><span style=\"vertical-align: baseline;\"> of all critical applications to automate as many actions as possible to accelerate response and recovery.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data</strong><span style=\"vertical-align: baseline;\">: When a disruption occurs, having meaningful data at your fingertips vastly improves response capabilities. Use </span><a href=\"https://docs.cloud.google.com/logging/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Logging</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/trace/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Trace</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/monitoring/docs/monitoring-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Monitoring</span></a><span style=\"vertical-align: baseline;\">, or other third-party observability tools, and replicate that data to a redundant stack in a separate location from the systems being observed. Make sure, in advance of any incident, that time stamps are synced across your observability streams for easy correlation, or know how to do that on-demand during an outage, when time is of the essence.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Playbook</strong><span style=\"vertical-align: baseline;\">: A well-thought-out playbook documenting your incident response processes, including crystal clear role and responsibility definitions for all personas, is paramount to efficient incident response. Who is responsible to do what? Who needs to be notified or mobilized for each type of disruption? How can they be reached? What tools and data are available? How are results communicated? How do teams hand over to the next shift during long running incidents? etc. Conduct a simulated incident response and critically review every step to find where your playbook needs clarification. Without clear responsibilities, mitigation inevitably takes longer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Training</strong><span style=\"vertical-align: baseline;\">: Hopefully, service disruptions are rare events. To ensure your staff knows and remembers how to react, they need to retrain on the process several times per year</span><span style=\"vertical-align: baseline;\"> by running simulated cross-team incident response drills. A retrospective</span><span style=\"vertical-align: baseline;\"> on the simulated exercise will help identify warranted improvements.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">2. Verify</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Despite your best efforts, sooner or later, a service disruption will occur, which you can detect via any number of mechanisms:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Observability tools (</span><a href=\"https://docs.cloud.google.com/docs/observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google tools</span></a><span style=\"vertical-align: baseline;\"> or third-party tools)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/unified-maintenance/docs/overview?_gl=1*1028q22*_ga*ODU2MjY4NzUyLjE3NzM0MTg2Mjk.*_ga_WH2QY8WWF5*czE3NzM2ODQ4MTckbzQkZzEkdDE3NzM2ODUwMjUkajEyJGwwJGgw\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Unified Maintenance Management</span></a><span style=\"vertical-align: baseline;\"> notifications for planned maintenance</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.google.com/search?q=https://console.cloud.google.com/service-health\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Personalized Service Health</span></a><span style=\"vertical-align: baseline;\"> notifications managed with alert policies</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Proactive customer monitoring by Google</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Now, you need to determine what broke and who should ultimately fix the problem:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google, e.g., a bug, code roll-out, hardware failure, etc.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You, e.g., a configuration change, elevated load, quota ceiling, etc.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Third party, e.g., a directory hosted by a different cloud provider</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If Google has declared an incident and started working to fix the problem, estimate whether you can possibly reestablish service sooner, for example by failing over to a secondary stack (see the ‘Typical Causes’ table below). You can determine whether Google has declared an incident and will provide a fix by consulting:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/service-health\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Personalized Service Health</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Check this first.</strong><span style=\"vertical-align: baseline;\"> Personalized Service Health shows incidents specifically relevant to your projects and regions, distinguishing between incident types:. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Emerging Incidents: Google has received an alert, on-callers are investigating, impact is yet unknown</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Confirmed Incidents: Google has investigated and found customers are impacted</span></p>\n</li>\n</ul>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Located within the Google Cloud console, Personalized Service Health often displays limited-scope incidents that don't appear on the public dashboard. Personalized Service Health also offers a mobile client for Android and iOS smartphones, assuming you can use your work ID and credentials on the phone.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://g.co/kgs/j2BVWVE\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Cloud Assist</strong></a><span style=\"vertical-align: baseline;\">, which is </span><a href=\"https://cloud.google.com/blog/products/devops-sre/gemini-cloud-assist-integrated-with-personalized-service-health?e=4875480\"><span style=\"text-decoration: underline; vertical-align: baseline;\">integrated with Personalized Service Health</span></a><span style=\"vertical-align: baseline;\">, so you can use it to query that information in natural language.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://status.cloud.google.com/\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Service Health dashboard</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> This is the public-facing non-authenticated web page for broad, severe incidents affecting many customers. Limited blast radius disruptions are </span><span style=\"font-style: italic; vertical-align: baseline;\">not</span><span style=\"vertical-align: baseline;\"> externalized to the public. All its content is available in Personalized Service Health as well. If ever Personalized Service Health goes down, Cloud Service Health serves as an alternative channel built on a separate infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Known Issues:</strong><span style=\"vertical-align: baseline;\"> In the console, navigate to </span><strong style=\"vertical-align: baseline;\">Support &gt; Cases</strong><span style=\"vertical-align: baseline;\">, view a case, and u</span><span style=\"vertical-align: baseline;\">se the resource selector on the console toolbar to find the specific cloud resource you’re interested in. Then click </span><strong style=\"vertical-align: baseline;\">Known issues</strong><span style=\"vertical-align: baseline;\">.</span><span style=\"vertical-align: baseline;\"> If your issue matches one listed here, you can link a support case to it, so you will receive automatic updates in your case record. If you don’t find a match, open a new support case. Google will automatically match the case to a related incident, as soon as one is declared.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google declared incidents are updated as new information becomes available, so check back regularly, or set up a Personalized Service Health alert policy to be notified each time new information becomes available.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If you host cloud resources in multiple clouds, a good practice is to check early on whether the problem occurs for multiple cloud providers. If so, the problem is likely external to the providers and caused either by you or by a third-party service that your application interacts with.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">3. Investigate</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To determine the blast radius within your cloud footprint of Google-declared reliability incidents, first check Personalized Service Health updates for a description of the technical problem. Knowing what to look for will allow you to map your blast radius and decide on suitable contingency actions quicker.</span></p>\n<p><span style=\"vertical-align: baseline;\">If Google hasn’t declared an incident, try to rule out configuration errors or issues within your environment by checking:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Monitoring:</strong><span style=\"vertical-align: baseline;\"> Look for spikes in error rates (e.g. 5xx errors), increased latency, or drops in traffic in your dashboards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Logs:</strong><span style=\"vertical-align: baseline;\"> Use </span><strong style=\"vertical-align: baseline;\">Log Explorer</strong><span style=\"vertical-align: baseline;\"> to look for specific error messages like </span><span style=\"vertical-align: baseline;\">DEADLINE_EXCEEDED</span><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">SERVICE_UNAVAILABLE</span><span style=\"vertical-align: baseline;\">, or specific API errors.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Quotas:</strong><span style=\"vertical-align: baseline;\"> Ensure you haven't hit a project quota (e.g., CPU, API rate limits), which can often mimic the behavior of an outage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Change history:</strong><span style=\"vertical-align: baseline;\"> Check your log of recently applied changes. Not all problems manifest immediately, but proximity on a timeline can be a powerful indicator of causality, even if it’s not proof. Also check whether Google rolled out any updates just before the symptoms started. See the </span><a href=\"https://docs.cloud.google.com/unified-maintenance/docs/overview?_gl=1*1028q22*_ga*ODU2MjY4NzUyLjE3NzM0MTg2Mjk.*_ga_WH2QY8WWF5*czE3NzM2ODQ4MTckbzQkZzEkdDE3NzM2ODUwMjUkajEyJGwwJGgw\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Unified Maintenance Management</span></a><span style=\"vertical-align: baseline;\"> interface in Cloud Hub.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Absent a clear culprit, such as a traffic spike or a DDOS attack, and if symptoms manifested immediately after rolling out a change, a good strategy is to back out that change and attempt to return to a last known good configuration. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">4. Report</strong></h3>\n<p><span style=\"vertical-align: baseline;\">If the Cloud Service Health and Personalized Service Health dashboards are green but your metrics show a failure, you must report it to Google. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Determine priority:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">P1 (Critical):</strong><span style=\"vertical-align: baseline;\"> Your production service is unusable or severely impacted with no workaround.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">P2 (High):</strong><span style=\"vertical-align: baseline;\"> Significant impact or degradation, but a workaround may exist.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">See </span><a href=\"https://docs.cloud.google.com/support/docs/best-practices#setting_the_priority_and_escalating\"><span style=\"text-decoration: underline; vertical-align: baseline;\">guidance on setting priority</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/support/docs/best-practices#describing_your_issue\"><span style=\"text-decoration: underline; vertical-align: baseline;\">guidance on describing your issue</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">File a case:</strong><span style=\"vertical-align: baseline;\"> Go to </span><strong style=\"vertical-align: baseline;\">Support &gt; Cases &gt; Create Case</strong><span style=\"vertical-align: baseline;\"> in the console.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explain</strong><span style=\"vertical-align: baseline;\"> quantifiable business impact to rationalize the submitted priority and prevent it from being reset when Cloud Support prioritizes cases. A clear and accurate rationale helps!</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Essential information to include:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Project ID</strong><span style=\"vertical-align: baseline;\"> and affected </span><strong style=\"vertical-align: baseline;\">region/zone</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Timestamps</strong><span style=\"vertical-align: baseline;\"> (when it started and if it's ongoing) with a clearly labeled timezone</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Specific error messages</strong><span style=\"vertical-align: baseline;\"> or log snippets</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scope:</strong><span style=\"vertical-align: baseline;\"> Is it affecting all users/systems, or a specific subset/location?</span></p>\n</li>\n</ul>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Escalation for Premium/Enhanced support</span></h4>\n<p><span style=\"vertical-align: baseline;\">If you have a </span><strong style=\"vertical-align: baseline;\">Premium</strong><span style=\"vertical-align: baseline;\"> or </span><strong style=\"vertical-align: baseline;\">Enhanced</strong><span style=\"vertical-align: baseline;\"> support plan and a P1 case is not receiving the attention it requires, use the </span><a href=\"https://docs.cloud.google.com/support/docs/best-practices#escalating\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Escalate</strong></a><span style=\"vertical-align: baseline;\"> button within the support case in the console. This alerts a support manager to investigate and rectify the situation.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">5. Resolve</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By taking these steps, you are well on your way to resolving the outage. In the meantime, here are some ways to mitigate the impact of the outage and communicate with impacted stakeholders.</span></p>\n<p><span style=\"vertical-align: baseline;\">While waiting for a resolution:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Communicate:</strong><span style=\"vertical-align: baseline;\"> Notify your stakeholders and customers. Transparency helps manage expectations and reduces duplicate internal reports.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fail over:</strong><span style=\"vertical-align: baseline;\"> If you have a multi-regional architecture, consider shifting traffic to a healthy region. As a best practice, first </span><span style=\"vertical-align: baseline;\">ensure that the disruption is at the infrastructure level and not at your workload level.</span><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Check for workarounds:</strong><span style=\"vertical-align: baseline;\"> While working on a permanent fix, Google often posts temporary workarounds in the Service Health Dashboard updates, or in Personalized Service Health updates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Consider your regulatory reporting requirements</strong><span style=\"vertical-align: baseline;\">: Know whether your organization is subject to regulatory reporting requirements, and what the required deadlines are for both initial and follow-up reporting. Google Cloud prepares Incident Reports for incidents that meet certain criteria — see details </span><a href=\"https://docs.cloud.google.com/service-health/docs/get-incident-reports\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\"> for how to get those reports. Premium Support customers can also request an Incident Summary, which is an Incident Report customized to your account’s specific hosting location, time stamps, etc.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">De-escalation and closure</span></h4>\n<p><span style=\"vertical-align: baseline;\">Once systems are stable, Google downgrades the severity levels and deactivates the active on-call escalation chain. Google only closes an incident in Personalized Service Health when it has taken all the mitigation steps covering all impacted customers. Your specific services might be restored sooner than the incident closure time, if other customers are restored later than you. The incident is officially closed on the Google Cloud Status Dashboard when systems have run stably for a designated auto-close duration. Verify that your services are operating normally at this point. And if your incident responders aren’t compensated for extra time spent on the incident, find a way to thank them.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">6. Review</strong></h3>\n<p><span style=\"vertical-align: baseline;\">After the problem has been fixed and operations have returned to a normal, steady state, it’s time to conduct a </span><a href=\"https://docs.cloud.google.com/architecture/framework/reliability/conduct-postmortems\"><span style=\"text-decoration: underline; vertical-align: baseline;\">post-mortem analysis</span></a><span style=\"vertical-align: baseline;\"> to identify how your team can respond better in future service disruptions. A “blameless” approach is essential to surfacing meaningful and impactful improvements that can be made to your incident response process. Ask questions like:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">What went well?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">What could we have done better?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Where did we get lucky?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Where did we get unlucky?</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Then decide what changes can be made to improve your playbook, tools and training.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google, we often publish a </span><strong style=\"vertical-align: baseline;\">post-mortem</strong><span style=\"vertical-align: baseline;\"> or </span><strong style=\"vertical-align: baseline;\">Incident Report</strong><span style=\"vertical-align: baseline;\"> for major outages, available via Personalized Service Health. Review this to understand the root cause and adjust your own disaster recovery plans to prevent or reduce future impact. Customers with a Premium Support plan can request an </span><strong style=\"vertical-align: baseline;\">Incident Summary</strong><span style=\"vertical-align: baseline;\"> for a Google-caused incident they were impacted by and for which they opened a P1 case. An Incident Summary is an Incident Report customized for </span><span style=\"font-style: italic; vertical-align: baseline;\">your</span><span style=\"vertical-align: baseline;\"> environment (e.g., start and end times of impact).</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Typical causes, comms and prevention strategies</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To help you prepare and plan ahead, here’s an overview of some typical incidents based</span><span style=\"vertical-align: baseline;\"> on the symptoms reported in Cloud Service Health and Personalized Service Health along with guidance on what Google communications to expect, and some generic mitigation or prevention strategies you can build into your playbooks.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Blast radius</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Typical cause</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Comms</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Strategy</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Single zone or region.</span><span style=\"vertical-align: baseline;\">Subset of products.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Typical of a software problem triggered by a rollout. Learning points:</span></p>\n<p><span style=\"vertical-align: baseline;\">- Understand the location scope (zones and regions) of your workload</span></p>\n<p><span style=\"vertical-align: baseline;\">- Products can depend on other products</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Major incidents are communicated via Cloud Service Health.</span><span style=\"vertical-align: baseline;\">Major and Minor (by number of customers, not severity) incidents are communicated via Personalized Service Health.</span></p>\n<p><span style=\"vertical-align: baseline;\">Highly localized incidents are not communicated via Cloud Service Health or Personalized Service Health.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Fail over, if so configured, but verify the health of the secondary stack first.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Single zone.</span><span style=\"vertical-align: baseline;\">Most or all products.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Typical of a power or cooling issue.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Check Cloud Service Health and Personalized Service Health.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Fail over to a different zone, if so configured.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Single region.</span></p>\n<p><span style=\"vertical-align: baseline;\">Most or all products.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Typical of a backbone networking infrastructure issue </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Check Cloud Service Health and Personalized Service Health.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Fail over to a different region, if so configured.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Control plane issue for a product</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Typical of a late detected issue</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Communicated via Personalized Service Health if significant customer impact is verified.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Look for workarounds. Wait for Google to fix. Fail over, if so configured.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multi-regional issue with a global product</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Rare but possible, typically detected quickly. Learnings: Mitigation options can be limited. Try regional variants, alternative products with similar functionality</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Check Cloud Service Health and Personalized Service Health.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Wait for Google to fix. In the meantime, verify via Google Comms and your own investigation that this is truly Google’s problem to fix.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Capacity / Stockout issue</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">System-level demand exceeding capacity in the product/location/model. (Cloud is designed to scale, but limits always exist, so proper planning is advised)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Error message. No incident will be declared.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Place reservations for predicted capacity needs (if cost is acceptable). Flexibility in zone placement can also help.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Quota exhaustion</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Difficult / inaccurate prediction of traffic</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Error message. No incident will be declared.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Review consumption trends against ceiling regularly.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">Go deeper</strong></h3>\n<p><span style=\"vertical-align: baseline;\">This document offers only a condensed summary of key points. If you have an active Premium Support contract with Google Cloud, reach out to your account team for a deeper review of your response plans. For a comprehensive treatise on how to build reliable services and how to respond to incidents, we strongly recommend Google’s </span><a href=\"https://sre.google/sre-book/table-of-contents/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SRE Book</span></a><span style=\"vertical-align: baseline;\">, which is available as a free download. A new version of the SRE book is releasing ~Oct 2026 and will be available for purchase on O’Reilly Media. We’re also working on a future primer that explores AI-supported incident handling in-depth — stay tuned!</span></p></div>"
"last_updated": "2026-09-16 01:18:31 JST"
