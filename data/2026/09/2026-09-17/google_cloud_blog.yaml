  "f34e8e46f1dbc06ae9d81e6dc16748cd":
    "id": "f34e8e46f1dbc06ae9d81e6dc16748cd"
    "title": "For SeaVerse, GKE Agent Sandbox reduces infrastructure costs by 60%"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/seaverse-chooses-gke-agent-sandbox/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-17 02:58:24"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong style=\"font-style: italic; vertical-align: baseline;\">Editor’s note:</strong><span style=\"font-style: italic; vertical-align: baseline;\"> Today we hear from </span><a href=\"https://seaverse.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">SeaVerse</span></a><span style=\"font-style: italic; vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">a gaming startup from </span><a href=\"https://www.seaart.ai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SeaArt</span></a><span style=\"vertical-align: baseline;\"> that is building a platform for playable AI experiences</span><span style=\"font-style: italic; vertical-align: baseline;\">, where users can open lightweight games, character chats, and interactive apps, or create their own experiences from a prompt. To support that creative loop, SeaVerse needed infrastructure that could run dynamic, multi-tenant sandbox workloads with strong isolation, low latency, better observability, and more flexible costs. </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE)</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/bringing-you-agent-sandbox-on-gke-and-agent-substrate\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">GKE Agent Sandbox</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> gave SeaVerse the managed foundation from which to execute these AI workloads, helping the team reduce their infrastructure costs by up to 60%, while giving creators a faster path from idea to playable experiences.</span><span style=\"font-style: italic; vertical-align: baseline;\"> Read on to learn more.</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">What if AI were a playground? Welcome to SeaVerse, a creation-first platform for playable AI experiences. Here, an AI creation can be as peaceful as drawing a path for a snake to follow, or as chaotic as a music-backed stickman simulation. Some people come to play lightweight games. Others come to chat with AI characters, try interactive apps, create visual patterns, share what they made, or remix an idea into something new.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">We built SeaVerse around a simple promise: Every experience should feel immediate and easy to share. A creator should be able to describe an idea in plain language, refine the result, and publish it in moments, without a traditional coding workflow.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">Delivering that simplicity requires serious infrastructure. Every creation that users make moves through the same chain: generate, run, preview, debug, publish, remix. If any part of that chain is slow, unstable, or poorly isolated, users feel it immediately. That’s why we turned to GKE and GKE Agent Sandbox. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The infrastructure challenge of instant interaction</strong><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">What looks effortless to a user is anything but on our end. Every creation on SeaVerse runs as a distinct workload and is expected to behave reliably from the first interaction.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">Because each workload runs in its own environment, we needed clear security boundaries between users, creations, and sandboxes. But overly strict isolation could slow the very creative loop we were trying to protect, and when something went wrong, diagnosing it was costly. Our engineers had to trace problems across multiple parts of the execution chain with little visibility into what was happening inside the environment.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">We explored existing sandbox approaches, but needed deeper kernel-level isolation and native observability at scale to support fast diagnosis across multi-tenant environments. Something had to change.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Building on GKE and GKE Agent Sandbox</strong><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">We chose </span><span style=\"vertical-align: baseline;\">GKE</span><span style=\"vertical-align: baseline;\"> because we needed a reliable, secure way to operate Kubernetes without turning our engineering team into a cluster maintenance team. GKE brought together the proven ecosystem and operational tooling we needed, freeing us to focus on building the platform rather than managing the infrastructure beneath it.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">As a Kubernetes primitive designed for agent code execution and computer use, </span><span style=\"vertical-align: baseline;\">GKE Agent Sandbox</span><span style=\"vertical-align: baseline;\"> addressed our requirement for strong isolation, enforcing strong security boundaries without slowing down the creation experience. By utilizing GKE Agent Sandbox with Kata Containers+Cloudhypervisor (microVM), we’ve achieved the perfect balance of multi-cloud flexibility and robust security, option to switch isolation runtime between microVM and gVisor, running our AI sandboxes safely. GKE empowers us to scale toward our long-term vision of supporting over a million sandboxes. Built on gVisor, it provides kernel-level isolation for dynamic sandbox workloads while preserving the Kubernetes orchestration model, so that they can be managed through the same scheduling, monitoring, and operations as the rest of the cluster. </span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">With SeaVerse, users can generate interactive experiences from a single prompt. After an experience is generated, GKE Agent Sandbox supports the run, test, integration, and verification steps needed to make it ready to preview, refine, and publish. At general availability, it supports allocating up to 300 sandboxes per second, per cluster, with 90% of allocations completing in 200 milliseconds. Together, GKE and GKE Agent Sandbox gave us a reliable foundation for AI-generated interactive workloads that helped keep our team focused on the product experience.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><strong style=\"vertical-align: baseline;\">From black box to glass box</strong><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Before GKE Agent Sandbox, a failed sandbox workload could feel like flying blind. We could often see that something had gone wrong, but didn’t have enough runtime status, metrics, or failure signals to understand why.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">Now, Google Cloud’s native logging and monitoring reach directly into those sandboxed environments, giving us a clearer view of workload behavior, faster issue resolution, and a stronger foundation for managing multi-tenant workloads.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">That visibility matters to developers, but it also matters to the platform’s users: A creator never sees the logs, the cluster, or the orchestration layer. They see whether an experience opens quickly, whether it responds when they draw, click, chat, or share, and whether they can keep building without friction. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Flexibility that translates to savings</strong></h3>\n<p><span style=\"vertical-align: baseline;\">GKE Agent Sandbox also changed how we think about cost. Previously, running secure sandboxed environments meant stronger dependencies on specific server types, which limited how precisely we could match resources to each workload. With GKE Agent Sandbox, we can run secure, isolated workloads on appropriately sized cloud VMs. This gives us greater flexibility in resource allocation and helped us cut our infrastructure costs by up to 60%.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">That same flexibility extended to storage. Not all SeaVerse creations are built in a single session. Some evolve over time as creators return to refine them, build on earlier ideas, or invite others to remix what they’ve made. Our previous architecture didn’t support the persistent file-system capabilities those more complex use cases demanded, but that gap is gone now. We can attach persistent storage where workloads require it while maintaining the isolation boundaries that multi-tenant AI experiences need. For creators, that means experiences that are fast to open and easier to refine, revisit, and build on over time.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The next remix</strong><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Supporting creations that can evolve and deepen is central to what we’re building. It’s still early in what playable AI can become. As the platform grows, we need to keep strengthening what matters most: stability, observability, elastic scaling, and cost efficiency, all in service of a creator experience that stays fast, reliable, and expressive.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">We’re also exploring additional Google Cloud tools to support smarter analytics and creation assistance. Gemini and agent models could help operators and creators better understand how experiences perform. </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> AI and ML capabilities can support use cases such as churn prediction, LTV and ROI prediction, and user segmentation. Multimodal tools such as Imagen and Veo on </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> open up new possibilities for material analysis, creative generation, and AI interactive content production.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">Our goal is to make AI experiences feel immediate, expressive, and connected. With </span><span style=\"vertical-align: baseline;\">GKE</span><span style=\"vertical-align: baseline;\"> and </span><span style=\"vertical-align: baseline;\">GKE Agent Sandbox</span><span style=\"vertical-align: baseline;\">, we have a stronger foundation for the next generation of playable AI.</span></p></div>"
  "f34b1d3aef6972b03871e38b08fc352e":
    "id": "f34b1d3aef6972b03871e38b08fc352e"
    "title": "M4N VM family, now GA: Highest per-core IOPS and throughput for I/O and memory-bound workloads"
    "link": "https://cloud.google.com/blog/products/compute/compute-engine-m4n-vms/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-17 02:58:24"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As enterprise organizations scale mission-critical applications, storage I/O and memory access can become severe operational bottlenecks. Whether its Oracle databases, in-memory databases like SAP HANA, or high-throughput SQL Server clusters, EHR systems, and real-time big data analytics, memory-bound databases often force enterprises to over-provision compute cores (vCPUs) to get the RAM capacity and storage bandwidth they need, driving up costly third-party software licensing fees.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are thrilled to announce the </span><strong style=\"vertical-align: baseline;\">general availability</strong><span style=\"vertical-align: baseline;\"> of the </span><strong style=\"vertical-align: baseline;\">M4N</strong><span style=\"vertical-align: baseline;\"> machine series in Google Compute Engine, purpose-built for I/O intensive, high-memory workloads, the second offering in our network- and block-storage optimized VM family.</span><span style=\"vertical-align: baseline;\"> Compared to similar offerings from other hyperscalers</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">M4N provides the highest per-core IOPS and throughput for high-memory instances, and </span><span style=\"vertical-align: baseline;\">over 20% TCO reduction for Oracle databases.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_gZSsHxy.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">M4N is also the </span><strong style=\"vertical-align: baseline;\">industry’s first</strong><span style=\"vertical-align: baseline;\"> instance of network and block storage optimized with higher memory ratios (up to 26:1) and size (6TB). Powered by 5th Gen Intel® Xeon® Scalable processors and built on Google Cloud's custom</span><a href=\"https://cloud.google.com/titanium\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\"> offload architecture, M4N instances deliver up to 25,000 MiB/s (25 GiB/s) of aggregate host storage performance and up to 1 million IOPS when paired with</span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Extreme</span></a><span style=\"vertical-align: baseline;\"> — doubling the block storage performance of current M4 instances.</span></p>\n<p><span style=\"vertical-align: baseline;\">M4N targets workloads that demand both extreme high-density RAM and uncompromising I/O performance, complementing our existing memory-optimized families (such as M1, M2, M3, M4, and X4) by solving specific storage and network bottlenecks for high-throughput enterprise applications.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Built for demanding workloads</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Workload Category</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Typical Applications</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Why M4N Wins</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Mission-critical enterprise DBs</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Oracle, SAP HANA, SQL Server, IBM DB2, MySQL, PostgreSQL</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Memory-to-core ratios (up to 26.57 GB/vCPU) paired with 25 GiB/s storage for rapid data ingestion, transaction logging, and zero-stall backup cycles.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Generative AI and RAG data layers</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Milvus, Pinecone, Qdrant, Vespa, Redis, In-Memory Context Caching</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Sub-millisecond similarity search across massive vector indexes in RAM, combined with 400 Gbps network bandwidth for distributed model retrieval.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise healthcare and ERP</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Epic Systems (Operational Database), SAP ECC, SAP S/4HANA</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Sustained I/O headroom that prevents query latency spikes during peak clinical/transactional hours.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Real-time analytics and EDA</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Electronic Design Automation, Genomic Modeling, In-Memory OLAP</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">High memory capacity to load massive datasets entirely in RAM with maximum storage bandwidth for checkpoint dumps.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">Optimizing </span><span style=\"vertical-align: baseline;\">Oracle</span><span style=\"vertical-align: baseline;\"> licensing costs</span></h3>\n<p><span style=\"vertical-align: baseline;\">E</span><span style=\"vertical-align: baseline;\">nterprise IT departments struggle with the rising cost of core-based software licensing. For workloads like Oracle database, licensing fees are typically calculated based on the number of vCPUs or physical cores assigned to the instance. Historically, this has forced a difficult trade-off: paying for more compute cores than necessary just to obtain the required amount of RAM and storage performance.</span></p>\n<p><span style=\"vertical-align: baseline;\">M4N changes this paradigm with its industry-leading high memory-to-vCPU ratio. By providing the highest per-core IOPS and throughput for high-memory instances of all the leading hyperscalers, M4N allows database administrators to:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduce TCO and licensing overhead: </strong><span style=\"vertical-align: baseline;\">Stop over-provisioning of cores while meeting Oracle database performance density requirements, </span><strong style=\"vertical-align: baseline;\">resulting in over 20% TCO reduction</strong><span style=\"vertical-align: baseline;\"> compared to similar offerings from leading hyperscalers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Right-size infrastructure:</strong><span style=\"vertical-align: baseline;\"> Allocate the exact amount of compute power needed for the workload while still accessing massive memory pools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Improve cache-hit ratios:</strong><span style=\"vertical-align: baseline;\"> With more memory available per core, larger portions of the database can reside in the system global area (SGA), reducing expensive I/O operations and further boosting efficiency.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">What customers are saying</span></h3>\n<p><span style=\"vertical-align: baseline;\">Early experiences with M4N show </span><span style=\"vertical-align: baseline;\">that workload-optimized infrastructure is the engine for transformation</span><strong style=\"vertical-align: baseline;\">.</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Before M4N, meeting our demanding I/O requirements on Google Cloud often required over-provisioning our compute to achieve the necessary performance density. The new M4N instances solve this by delivering high throughput across the smaller to larger shapes.”</span><span style=\"vertical-align: baseline;\"> - Sherri Trojan, Sr Principal Solution Architect, Sabre</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"sabre\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sabre_jNZmgxf.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"We are delighted to see Google Cloud introduce this next-generation high-performance infrastructure for mission-critical database workloads. The new compute platform demonstrates tremendous potential for enterprise Oracle deployments requiring scalability, resiliency, and performance. We are excited about what this innovation means for customers running Oracle workloads on Google Cloud.” </span><span style=\"vertical-align: baseline;\">- Bala Kuchibhotla, Co-Founder and CEO, Tessell</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"tessel\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/tessel.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"With M4N, Google Cloud continues to push the boundaries of platform co-design. By combining 5th Gen Intel Xeon Scalable processors with Google's custom Titanium offload architecture, M4N delivers the extreme memory capacity, high memory bandwidth, and uncompromising I/O throughput required for the world’s most demanding mission-critical data environments.\"</span><span style=\"vertical-align: baseline;\"> -  Intel</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"intel\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/intel_iwN65co.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">What’s new: Scaling extreme data layers with M4N</span></h3>\n<p><span style=\"vertical-align: baseline;\">M4N bridges two previously separate paradigms in cloud infrastructure: </span><strong style=\"vertical-align: baseline;\">large memory footprints</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">extreme I/O performance</strong><span style=\"vertical-align: baseline;\">. Engineered with custom Titanium offloads, M4N minimizes I/O bottlenecks without requiring infrastructure add-ons or compromises on memory density. Let’s take a look at how M4N fits into these environments. </span></p>\n<h4><span style=\"vertical-align: baseline;\">1. Enabling high bandwidth data transfer</span></h4>\n<p><span style=\"vertical-align: baseline;\">For workloads with large memory footprints, M4N provides: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Superior VM-to-VM bandwidth:</strong><span style=\"vertical-align: baseline;\"> Delivers up to </span><strong style=\"vertical-align: baseline;\">400 Gbps aggregate VM-to-VM network bandwidth</strong><span style=\"vertical-align: baseline;\"> and up to </span><strong style=\"vertical-align: baseline;\">50 Gbps single-flow bandwidth</strong><span style=\"vertical-align: baseline;\"> within the same VPC, unlocking non-blocking data exchange for distributed database clusters and real-time streaming data layers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enhanced internet and egress throughput:</strong><span style=\"vertical-align: baseline;\"> Enjoy up to </span><strong style=\"vertical-align: baseline;\">200 Gbps internet egress bandwidth</strong><span style=\"vertical-align: baseline;\"> and up to </span><strong style=\"vertical-align: baseline;\">48 MPPS</strong><span style=\"vertical-align: baseline;\"> packet processing performance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">High bandwidth out-of-the-box:</strong><span style=\"vertical-align: baseline;\"> Achieve full performance without needing to purchase or configure premium Tier_1 networking add-ons.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">2. Dynamic storage performance with Hyperdisk</span></h4>\n<p><span style=\"vertical-align: baseline;\">Paired with Google Cloud's next-generation storage portfolio, M4N with Hyperdisk lets you independently tune IOPS, throughput, and capacity:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hyperdisk Extreme (HdX):</strong><span style=\"vertical-align: baseline;\"> Delivers up to </span><strong style=\"vertical-align: baseline;\">25 GiB/s aggregate block storage throughput and 1,000,000 IOPS</strong><span style=\"vertical-align: baseline;\">—double the storage performance of standard M4. This is great for rapid database recovery, transactional checkpointing, and instant in-memory index reloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hyperdisk Balanced (HdB):</strong><span style=\"vertical-align: baseline;\"> Scales up to </span><strong style=\"vertical-align: baseline;\">20 GiB/s throughput and 640,000 IOPS</strong><span style=\"vertical-align: baseline;\"> for cost-effective enterprise storage at scale.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">M4N machine types and specifications</span></h3>\n<p><span style=\"vertical-align: baseline;\">M4N instances are offered across three distinct memory-to-vCPU ratio tiers, scaling from 16 to 224 vCPUs and up to 5,952 GB of DDR5 RAM. </span><span style=\"vertical-align: baseline;\">M4N also offers predefined VM shapes across three distinct memory-to-vCPU ratios to match specific workload requirements, with support for Resource-based Committed Use Discounts (CUDs).  Details </span><a href=\"https://docs.cloud.google.com/compute/docs/memory-optimized-machines#m4n_machine_types\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">The M4N instances are now available in select regions around the globe. To learn more about how the M4N family can enhance your memory- and I/O-bound applications and reduce your licensing costs, contact your account representative or explore the </span><a href=\"https://cloud.google.com/compute/docs/memory-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "34793abf8202c4fd4ac61827c108dadb":
    "id": "34793abf8202c4fd4ac61827c108dadb"
    "title": "How Orange uses agents to make FinOps everyone's responsibility"
    "link": "https://cloud.google.com/blog/topics/telecommunications/how-orange-uses-agents-to-make-finops-everyones-responsibility/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-17 02:58:24"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At </span><a href=\"https://cloud.google.com/customers/orange\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orange</span></a><span style=\"vertical-align: baseline;\">, the leading France-based multinational telecom provider, there are days when engineering teams set aside their delivery backlogs and spend the day cleaning up cloud spend together. There's a leaderboard. There are goodies on the line. Experienced practitioners guide the newcomers, so people learn the work while doing it. By the end of the day, sponsors can see the results.</span></p>\n<p><span style=\"vertical-align: baseline;\">Orange calls these FinOps Clean Days. Together with gamified hackathons, they've earned the company's 100-plus person FinOps community a Net Promoter Score within the organization that’s above 70.</span></p>\n<p><span style=\"vertical-align: baseline;\">Those numbers point at something the wider industry is wrestling with. Recent State of FinOps reports identify getting engineers to take action as one of the top challenges organizations face. Moving from awareness to action means finding ways to build FinOps accountability, and to get teams to genuinely care.</span></p>\n<p><span style=\"vertical-align: baseline;\">That makes FinOps a business change problem. And business change problems have known solutions. We spoke with Camille Marini, the FinOps lead at Orange, to get a deeper understanding of how the company overcame these hurdles to accelerate AI adoption and ROI, and how your organization might follow the same course.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Why the Clean Days work</span></h2>\n<p><span style=\"vertical-align: baseline;\">Orange has held two principles since it set up its FinOps team. First, Cloud FinOps is a shared responsibility, with every stakeholder in a project involved in their own way. And the only path to that shared responsibility runs through communication and a deliberate change effort. </span></p>\n<p><span style=\"vertical-align: baseline;\">“We insisted on the concept of shared responsibility across the organization for our FinOps practices,” Marini told us. “It’s very similar to how we approach cloud security. We needed to make teams understand that every single stakeholder in a project is involved in FinOps, each in their own way, if we are going to achieve responsible and impactful AI spending and usage.”</span></p>\n<p><span style=\"vertical-align: baseline;\">Those principles led Orange to create a FinOps Community of Practice, with support from Google Cloud Consulting. The team ran it on standardized communication channels so the methodology reached well beyond the central group, and kept the meetings actionable, sharing optimizations and billing updates so every session provided value.</span></p>\n<p><span style=\"vertical-align: baseline;\">The Clean Days came from a clear-eyed reading of how agile teams actually operate. In agile environments with deployment running constantly, optimization work rarely wins against the sprint. Delivery priorities, backlogs, and daily operations take the available time first. So Orange created protected time, made it collaborative, and made it fun.</span></p>\n<p><span style=\"vertical-align: baseline;\">McKinsey's four building blocks of change explain why this approach lands. Any large organizational change, the framework holds, requires action across four areas:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Conviction and understanding: \"I know what is expected of me and I agree with it.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Formal mechanisms: \"The structures, processes, and systems reinforce the change.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Role modeling: \"I see my leaders and colleagues behaving differently.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Talent and skills: \"I have the skills and opportunities to behave in a new way.\"</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Map Orange's practice onto those blocks and the pattern is visible. Gamification and rewards give engineers colleagues to emulate: The leaderboard makes different behavior visible, and sponsors see the quick wins for themselves. Experienced practitioners guiding novices builds talent and skills through the community itself. The regular sessions, sharing optimizations and billing updates, build the conviction that comes from knowing where the money goes.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_m5giQlH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>FinOps activities mapped to the four building blocks of change, with the points where AI agents can reinforce them.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">What happens beyond 100 people</span></h2>\n<p><span style=\"vertical-align: baseline;\">A community of 100 engaged people is an achievement. But in an organization with thousands of engineers, no central FinOps team can reach everyone directly. The question for leaders is how to extend what a community like Orange's creates — the awareness, the shared ownership, the habit of acting — to people the FinOps team will never meet.</span></p>\n<p><span style=\"vertical-align: baseline;\">This is where AI agents extend the capabilities of a FinOps team with two core benefits. They take on complex, time-intensive activities that previously needed a human, and they reduce friction around FinOps for individuals across the business.</span></p>\n<p><span style=\"vertical-align: baseline;\">Getting teams to adopt them takes a strategy aimed at your own organization's pain points, which often come from high cognitive load, unclear accountability, or competing priorities. Start by finding where engagement drops off in your FinOps lifecycle:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">An awareness gap: If teams are unsure of their spend impact, an insight agent can push real-time cost data into their daily tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A bandwidth gap: If engineers are too busy with backlogs, a remediation agent can identify quick wins and present them as ready-to-merge code changes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A complexity gap: If reporting feels like a manual chore, an orchestration agent can gather the data and simplify the process.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Start with trust, then add autonomy</span></h2>\n<p><span style=\"vertical-align: baseline;\">The sensible path runs in sequence. Establish the community practice, the way Orange did. Then introduce read-only agents that inform and suggest. Only once those are established across the community should you build agents that execute changes. Direct action carries operational risk, so manage it carefully. It's also where significant wins often sit.</span></p>\n<p><span style=\"vertical-align: baseline;\">How you build depends on who's building. For teams that want to deploy quickly with minimal code, the </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise App</span></a><span style=\"vertical-align: baseline;\"> provides a no-code environment for creating agents. For developers who need granular control, the </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> (formerly Vertex AI) offers advanced tools for launching and governing agents built with frameworks like the Agent Development Kit (ADK).</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud FinOps is moving beyond centralized reporting toward action that happens where the work does. The organizations getting there start with the culture, then use agents to carry it further than any one team could reach. </span></p>\n<p><span style=\"vertical-align: baseline;\">Orange's numbers came out of the community work. Building that foundation is the part worth copying first. When you're ready to extend it, </span><a href=\"https://cloud.google.com/consulting\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Consulting</span></a><span style=\"vertical-align: baseline;\"> can help you shape the community practice, and the Gemini Enterprise App is a low-lift way to put your first read-only agent in front of your teams.</span></p></div>"
  "e74567851bd302388ac9e1c2f49d5404":
    "id": "e74567851bd302388ac9e1c2f49d5404"
    "title": "Cloud CISO Perspectives: How Google monitors AI threats and advances AI defenses"
    "link": "https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-monitors-ai-threats-advances-ai-defenses/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-17 02:58:24"
    "summary": "<div class=\"block-paragraph\"><p>Welcome to the first Cloud CISO Perspectives for September 2026. Today, Sandra Joyce shares the latest details on Google’s visibility into how attackers are using AI, and how we’re using AI to stop them.</p><p>As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the <a href=\"https://cloud.google.com/blog/products/identity-security/\">Google Cloud blog</a>. If you’re reading this on the website and you’d like to receive the email version, you can <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">subscribe here</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7feed6a63290&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>‘Spellcheck for cybersecurity’ and beyond: How Google monitors AI threats and advances AI defenses</b></h3><p><i>By Sandra Joyce, VP, Google Threat Intelligence</i></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Sandra Joyce\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2022_S_Joyce_Headshot.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Sandra Joyce, VP, Google Threat Intelligence</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Anyone operating in security knows that speculation is a major liability during periods of technological disruption. While there is plenty of hype and understandable concern around how threats might use and target AI, a CISO’s AI security strategy has to be anchored in ground truth.</p><p>Google operates at a rare intersection as both a frontier AI lab and a security company with a frontline view of global incidents. This dual vantage point allows us to understand how AI is built, and exactly how AI is being targeted in the wild. To provide the operational realities that security and business leaders need in the AI era, Google Threat Intelligence Group (GTIG) recently released our <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\">latest AI Threat Tracker</a>.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When we strip away the noise and look at the telemetry, the real threat landscape boils down to three structural shifts that CISOs must address:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI is reshaping how software is built. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI is expanding the attack surface.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI is enhancing threat capabilities. </span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Today, we’re sharing details on Google’s visibility into these three challenges, and our approach for solving them.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Building securely in the AI era </strong></p>\n<p><span style=\"vertical-align: baseline;\">AI has fundamentally altered software development velocity. Across the industry, autonomous agents and AI workflows now push code into production at unprecedented speed. This creates exciting opportunities for innovation, yet CISOs are faced with the difficult task of mitigating enterprise risk while maintaining business momentum. </span></p>\n<p><span style=\"vertical-align: baseline;\">We’re seeing threat actors turn our greatest engineering shortcut against us by contaminating upstream packages that AI assistants are trained to suggest and trust. GTIG believes that malicious contamination of AI-assisted coding practices has been contributing to the significant growth in large-scale, open-source software supply chain compromises we </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">observed in 2025 and early 2026</span></a><span style=\"vertical-align: baseline;\">. </span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">The solution to a machine-speed threat landscape isn&#x27;t slowing developers down — it’s building security natively into the AI pipeline. Part of this process involves in-editor guardrails for developers that create a real-time &#x27;spellcheck for cybersecurity.&#x27;</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We’re also monitoring adversaries targeting agents. The financially-motivated threat actor TeamPCP (UNC6780) has implemented more than half a dozen methods to exploit AI tools and open-source software development practices, including hijacking AI toolkits, prompt injection, and blinding AI scanners with toxic prompts to obfuscate malicious payloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">The solution to a machine-speed threat landscape isn't slowing developers down — it’s building security natively into the AI pipeline. Part of this process involves in-editor guardrails for developers that create a real-time “spellcheck for cybersecurity.” </span></p>\n<p><span style=\"vertical-align: baseline;\">Just as word processors underline typos without forcing the writer to stop, security controls must sit natively inside the developer’s editor and agentic workflows, instantly flagging poisoned packages, toxic prompts, and misconfigured toolkits. </span></p>\n<p><span style=\"vertical-align: baseline;\">Crucially, this can’t stop at the editor. Traditional security suffers from context blindness: Code editors can’t see cloud configurations, delivery pipelines miss runtime exposure, and production teams can’t easily patch root-cause blueprints. </span></p>\n<p><span style=\"vertical-align: baseline;\">Bridging this gap requires an integrated code-to-cloud approach — the exact design principle behind platforms like </span><a href=\"https://www.wiz.io/platform/wiz-code\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Code</span></a><span style=\"vertical-align: baseline;\">. The underlying approach is to ensure code is continuously verified against live cloud realities before it ships.</span></p>\n<p><span style=\"vertical-align: baseline;\">When organizations think about AI-driven code analysis, the default assumption is to pick one frontier model and point it at their repository. However, our research and telemetry show that single-model security creates a dangerous monoculture: No single AI model can discover every vulnerability, and threat actors are already testing inputs that can blind specific LLM safety filters and scanners. </span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">To secure this expanding attack surface, CISOs should avoid the trap of managing AI through disconnected silos... The future of cloud and AI defense needs to be built on a unified and dynamic graph that connects your code, your models, your data lineage, and your runtime identities into a single living map.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To solve this, Google takes a </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-next-26-why-we-re-multicloud-and-multi-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">deliberate multi-model approach</span></a><span style=\"vertical-align: baseline;\">. By orchestrating several foundation models — including Gemini, commercial, and open-source — we cross-validate findings, strip out false positives, remediate code, and identify complex logic flaws that a single model misses. We’re smarter with more than one “brain.”</span></p>\n<p><strong style=\"vertical-align: baseline;\">Securing AI </strong></p>\n<p><span style=\"vertical-align: baseline;\">Securing the development lifecycle is only half the battle. We also need to prevent adversaries from exploiting AI attack surfaces and weaponizing over-privileged agents. Threat actors are targeting AI workloads with techniques that include: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">LLMJacking</strong><span style=\"vertical-align: baseline;\">: Cybercriminals and state-sponsored groups target GPU access to support running their AI models and agentic workflows. In one notable intrusion Mandiant investigated in April, a threat actor gained initial access to a victim’s cloud environment from an exposed personal access token, and used it to deploy unauthorized AI infrastructure and scale high-performance compute resources, leaving the victim to absorb the hardware and platform costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Targeting of AI data and access</strong><span style=\"vertical-align: baseline;\">: Cybercriminals now recognize that your custom prompts, agent instructions, and fine-tuned models represent high-value crown jewels. In Q2 2026, Mandiant investigated multiple data theft extortion operations where threat actors stole proprietary AI data, including models, skills, prompts, source code, and related research. Demand is also surging for AI account credentials in underground marketplace forums, with some sellers offering steep discounts for consumer accounts at up to 99% off retail prices.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">To secure this expanding attack surface, CISOs should avoid the trap of managing AI through disconnected silos. Don’t treat agent access policies, model inventories (AI-BOMs) and shadow AI as separate challenges because these risks are deeply connected. The future of cloud and AI defense needs to be built on a unified and dynamic graph that connects your code, your models, your data lineage, and your runtime identities into a single living map. </span></p>\n<p><span style=\"vertical-align: baseline;\">Pioneered by the </span><a href=\"https://www.wiz.io/lp/wiz-security-graph\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Security Graph</span></a><span style=\"vertical-align: baseline;\">, this approach serves as the contextual engine for </span><a href=\"https://cloud.google.com/security/ai-threat-defense\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Threat Defense</span></a><span style=\"vertical-align: baseline;\"> (AITD) — our broader autonomous security framework that fuses the reasoning power of Gemini and other frontier models, the contextual risk prioritization of Wiz, the code remediation capabilities of CodeMender, and the frontline expertise of Mandiant to stay ahead of AI-driven attacks. Crucially, this context is not siloed; it directly feeds </span><a href=\"https://cloud.google.com/security/products/security-operations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Security Operations</span></a><span style=\"vertical-align: baseline;\">, ensuring that security operations teams can continuously identify, prioritize, and sever toxic attack paths at machine speed.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Defending against AI threats</strong></p>\n<p><span style=\"vertical-align: baseline;\">Threat actors are rapidly moving beyond simple prompt generation toward fully-automated, multi-agent attack pipelines.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">To take advantage of your deep context, it’s imperative to shift from manual, human-scale incident response to machine-speed security operations. We can no longer rely on human analysts manually triaging endless backlogs of static alerts.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In one notable intrusion investigated by Mandiant, a financially-motivated actor compromised an organization's cloud infrastructure and deployed an autonomous agent framework. The threat actor used an AI coding chatbot, a prompt, and a set of agent instructions to plan, build, and execute a mass credential harvesting campaign in less than six hours.</span></p>\n<p><span style=\"vertical-align: baseline;\">We’re also tracking adversaries using AI as an intelligent orchestrator across the entire attack lifecycle. GTIG recently observed a PRC-nexus espionage group experimenting with a tool called CC Switch to cycle across multiple accounts and swap AI models — like Claude, Codex, and Gemini — picking the best model for specific tasks, such as writing exploit scripts and drafting lures. While the underlying hacking tools aren’t new, AI turned what had been a disjointed manual process into a smooth and automated workflow.</span></p>\n<p><span style=\"vertical-align: baseline;\">While these machine-speed attacks sound daunting, defenders actually hold an asymmetric advantage. Even when armed with autonomous AI, an attacker operates from the outside with limited context — probing in the dark, guessing connections, and hoping a compromised credential leads to a useful asset. </span></p>\n<p><span style=\"vertical-align: baseline;\">Defenders, on the other hand, </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-ai-leverages-deep-context-defenders-advantage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">possess deep context</span></a><span style=\"vertical-align: baseline;\"> that attackers don’t have. You know your code, cloud configurations, user identities, deployment realities, and internal architecture better than anyone. When you feed this rich, multi-dimensional internal observability into security models, AI defense becomes inherently faster and more accurate than AI offense.</span></p>\n<p><span style=\"vertical-align: baseline;\">To take advantage of your deep context, it’s imperative to shift from manual, human-scale incident response to machine-speed security operations. We can no longer rely on human analysts manually triaging endless backlogs of static alerts. </span></p>\n<p><span style=\"vertical-align: baseline;\">By codifying our frontline threat intelligence directly into these AI models, these autonomous agents can continuously monitor for, investigate, prioritize, and remediate attacks.</span></p>\n<p><strong style=\"vertical-align: baseline;\">How Google is helping defend the ecosystem</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">As adversaries adopt AI, we have a unique opportunity to disrupt them at the source. As a major security and AI provider, we take this responsibility seriously, using multiple levers to stay ahead.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Disabling malicious infrastructure</strong><span style=\"vertical-align: baseline;\">. If you use Google tools to facilitate an attack, you lose access to those tools. We proactively disable the projects, accounts, and assets of known bad actors.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hardening our AI models and classifiers</strong><span style=\"vertical-align: baseline;\">. We operate a continuous feedback loop for our AI models. By feeding threat intelligence directly back into product development, our models learn to recognize and refuse malicious requests before an attack can even be generated.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automating vulnerability hunting and patching also disrupt adversaries</strong><span style=\"vertical-align: baseline;\">. We are moving from manual patching to AI-driven hunting. Tools like </span><a href=\"https://cloud.google.com/blog/products/identity-security/find-and-fix-software-vulnerabilities-with-codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender automatically fix critical vulnerabilities</span></a><span style=\"vertical-align: baseline;\"> in the code itself.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Developing advanced defenses and threat models</strong><span style=\"vertical-align: baseline;\">. Our teams at Google DeepMind are building specialized defenses for generative AI — deploying active monitoring across our entire ecosystem to identify misuse in real-time.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Securing the AI era can’t be achieved with the disconnected, manual tools of the past, and you can only defend against an AI-powered threat with an AI-powered defense. To tip the scales back in favor of defenders, we must transition to a continuous, machine-speed model of protection — and at Google, we are committed to building that secure future alongside you.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about our approach to securing the AI era, please check out our new </span><a href=\"https://cloud.google.com/security/resources/ai-risk-and-resilience-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mandiant AI Risk and Resilience report</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7feefc290b10&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://x.com/googlecloud/status/2090213589558698309?s=20&#x27;), (&#x27;image&#x27;, &lt;GAEImage: Cloud-CISO-Perspectives-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>In case you missed it</b></h3><p>Here are the latest updates, products, services, and resources from our security teams so far this month:</p><ul><li><b>A manufacturing blueprint for secure agentic AI</b>: AI and agents have arrived on the factory floor. Today’s CISOs and business leaders must balance innovation with precision, physical safety, and operational resilience. <a href=\"https://cloud.google.com/transform/a-manufacturing-blueprint-for-secure-agentic-ai\"><b>Read more</b></a>.</li><li><b>Proactive cyber defense for governments and enterprises</b>: Our new Fairwind Program is a limited access program for governments and trusted partners to use our most advanced cyber defense capabilities. <a href=\"https://blog.google/innovation-and-ai/technology/safety-security/fairwind-program/\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Getting started with the Mantis harness to find and fix bugs</b>: Mantis is part of how Google finds and fixes vulnerabilities at machine-speed. The open-source AI harness creates a more effective repository analysis. <a href=\"https://cloud.google.com/blog/products/identity-security/getting-started-with-the-mantis-harness-to-find-and-fix-bugs\"><b>Read more</b></a>.</li><li><b>Breaking into Google's GFile for $100,000</b>: Learn about how a vulnerability — that was not exploited and has now been patched — could have allowed attackers to chain unauthenticated, undocumented internal APIs with overly-permissive shared file libraries to achieve unrestricted data access across core infrastructure. <a href=\"https://bughunters.google.com/blog/breaking-into-googles-gfile-for-100k\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Introducing new session management tools with native, granular controls</b>: New Google Cloud session controls are deeply integrated and a granular feature of Context-Aware Access. Here’s what you need to know. <a href=\"https://cloud.google.com/blog/products/identity-security/introducing-new-session-management-tools-with-native-granular-controls\"><b>Read more</b></a>.</li><li><b>How Blackline prevents data exfiltration with VPC Service Controls</b>: We’re excited to share new policy intelligence capabilities in VPC-SC that help drive operational simplicity: Violation analyzer and violation dashboard. <a href=\"https://cloud.google.com/blog/topics/customers/how-blackline-prevents-data-exfiltration-with-vpc-service-controls\"><b>Read more</b></a>.</li><li><b>Introducing Continuous Vulnerability Assessment</b>: You can detect exposure to new vulnerabilities the moment they’re published with Wiz CVA. <a href=\"https://www.wiz.io/blog/introducing-cva\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>How developers prevent production risk at the source</b>: Fixing security vulnerabilities in code takes seconds, while patching in production creates high operational costs and risk. Discover how empowering developers as your first line of defense eliminates exposure across every phase of your software pipeline. <a href=\"https://www.wiz.io/blog/prevent-production-risk-at-code-stage\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Wiz achieves GovRAMP High authorization</b>: Delivering unified cloud security and accelerating secure modernization to protect citizen data and critical infrastructure. <a href=\"https://www.wiz.io/blog/wiz-govramp-high\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more security stories <a href=\"https://cloud.google.com/blog/products/identity-security\">published this month</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7feed6cb2610&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Threat Intelligence news</b></h3><ul><li><b>AI Threat Tracker: From prompting to autonomy</b>: In the newest Google Threat Intelligence Group (GTIG) report on the adversarial misuse of AI, we’ve observed adversaries transition from basic prompting to agentic AI workflows and AI-enabled automation, including threat actors compromise a cloud resource, then plan, build, and execute an agent-enabled mass credential harvesting campaign in under six hours. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><b>Read more</b></a>.</li><li><b>Financially-motivated threat actor BREEZE COMET targets Brazil</b>: Learn about BREEZE COMET’s tactics and toolkit, and our mitigation recommendations and detections to support organizations in defending against this active and developing threat. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/financially-motivated-threat-actor-breeze-comet-targets-brazil\"><b>Read more</b></a>.</li><li><b>JFrog Artifactory under attack</b>: Wiz Research has identified active, in-the-wild exploitation of three critical and high-severity vulnerabilities impacting JFrog Artifactory. Attackers are chaining these vulnerabilities to bypass authentication and gain administrative control. <a href=\"https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more threat intelligence stories <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\">published this month</a>.</p></div>\n<div class=\"block-paragraph\"><h3><b>Now hear this: Podcasts from Google Cloud</b></h3><ul><li><b>Cloud Security Podcast: Patching browsers with AI, agents, Rust, and your tabs</b>: Jasika Bawa and Doug Turner of Chrome Security explore how Google Chrome now uses AI agents to autonomously identify and patch security vulnerabilities at an unprecedented scale, significantly accelerating the browser's update cadence. <a href=\"https://www.youtube.com/watch?v=pCXT8lQqg_U\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: All about Project Atlas, Wiz's AI vulnerability research</b>: Nir Orfeld, head of vulnerability research, Wiz, discusses how his team uses multi-agent AI systems for discovering high-impact zero-day vulnerabilities in cloud infrastructure. <a href=\"https://www.youtube.com/watch?v=qRJJ9ekpuVg\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: How Google eliminates classes of vulnerabilities at scale</b>: How do you build the foundations for a secure Google-scale enterprise that stays secure even if an AI is writing the code and nobody has time to review it? Christoph Kern, principal security engineer, Google, explores what secure-by-design really means in the AI era. <a href=\"https://www.youtube.com/watch?v=43imRRfgLgc\" target=\"_blank\"><b>Listen here</b></a>.</li></ul><p>To have our Cloud CISO Perspectives post delivered twice a month to your inbox, <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">sign up for our newsletter</a>. We’ll be back in a few weeks with more security-related updates from Google Cloud.</p></div>"
  "7f8def442c7a851dc2c3146d7959ec96":
    "id": "7f8def442c7a851dc2c3146d7959ec96"
    "title": "How Orange built FinOps accountability, and why agents are next"
    "link": "https://cloud.google.com/blog/topics/telecommunications/how-orange-uses-agents-to-make-finops-everyones-responsibility/"
    "published": "2026-09-17 01:00:00"
    "fetched": "2026-09-17 09:06:12"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At </span><a href=\"https://cloud.google.com/customers/orange\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orange</span></a><span style=\"vertical-align: baseline;\">, the leading France-based multinational telecom provider, there are days when engineering teams set aside their delivery backlogs and spend the day cleaning up cloud spend together. There's a leaderboard. There are goodies on the line. Experienced practitioners guide the newcomers, so people learn the work while doing it. By the end of the day, sponsors can see the results.</span></p>\n<p><span style=\"vertical-align: baseline;\">Orange calls these FinOps Clean Days. Together with gamified hackathons, they've earned the company's 100-plus person FinOps community a Net Promoter Score within the organization that’s above 70.</span></p>\n<p><span style=\"vertical-align: baseline;\">Those numbers point at something the wider industry is wrestling with. Recent State of FinOps reports identify getting engineers to take action as one of the top challenges organizations face. Moving from awareness to action means finding ways to build FinOps accountability, and to get teams to genuinely care.</span></p>\n<p><span style=\"vertical-align: baseline;\">That makes FinOps a business change problem. And business change problems have known solutions. We spoke with Camille Marini, the FinOps lead at Orange, to get a deeper understanding of how the company overcame these hurdles to accelerate AI adoption and ROI, and how your organization might follow the same course.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Why the Clean Days work</span></h2>\n<p><span style=\"vertical-align: baseline;\">Orange has held two principles since it set up its FinOps team. First, Cloud FinOps is a shared responsibility, with every stakeholder in a project involved in their own way. And the only path to that shared responsibility runs through communication and a deliberate change effort. </span></p>\n<p><span style=\"vertical-align: baseline;\">“We insisted on the concept of shared responsibility across the organization for our FinOps practices,” Marini told us. “It’s very similar to how we approach cloud security. We needed to make teams understand that every single stakeholder in a project is involved in FinOps, each in their own way, if we are going to achieve responsible and impactful AI spending and usage.”</span></p>\n<p><span style=\"vertical-align: baseline;\">Those principles led Orange to create a FinOps Community of Practice, with support from Google Cloud Consulting. The team ran it on standardized communication channels so the methodology reached well beyond the central group, and kept the meetings actionable, sharing optimizations and billing updates so every session provided value.</span></p>\n<p><span style=\"vertical-align: baseline;\">The Clean Days came from a clear-eyed reading of how agile teams actually operate. In agile environments with deployment running constantly, optimization work rarely wins against the sprint. Delivery priorities, backlogs, and daily operations take the available time first. So Orange created protected time, made it collaborative, and made it fun.</span></p>\n<p><span style=\"vertical-align: baseline;\">McKinsey's four building blocks of change explain why this approach lands. Any large organizational change, the framework holds, requires action across four areas:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Conviction and understanding: \"I know what is expected of me and I agree with it.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Formal mechanisms: \"The structures, processes, and systems reinforce the change.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Role modeling: \"I see my leaders and colleagues behaving differently.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Talent and skills: \"I have the skills and opportunities to behave in a new way.\"</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Map Orange's practice onto those blocks and the pattern is visible. Gamification and rewards give engineers colleagues to emulate: The leaderboard makes different behavior visible, and sponsors see the quick wins for themselves. Experienced practitioners guiding novices builds talent and skills through the community itself. The regular sessions, sharing optimizations and billing updates, build the conviction that comes from knowing where the money goes.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_m5giQlH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>FinOps activities mapped to the four building blocks of change, with the points where AI agents can reinforce them.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">What happens beyond 100 people</span></h2>\n<p><span style=\"vertical-align: baseline;\">A community of 100 engaged people is an achievement. But in an organization with thousands of engineers, no central FinOps team can reach everyone directly. The question for leaders is how to extend what a community like Orange's creates — the awareness, the shared ownership, the habit of acting — to people the FinOps team will never meet.</span></p>\n<p><span style=\"vertical-align: baseline;\">This is where AI agents extend the capabilities of a FinOps team with two core benefits. They take on complex, time-intensive activities that previously needed a human, and they reduce friction around FinOps for individuals across the business.</span></p>\n<p><span style=\"vertical-align: baseline;\">Getting teams to adopt them takes a strategy aimed at your own organization's pain points, which often come from high cognitive load, unclear accountability, or competing priorities. Start by finding where engagement drops off in your FinOps lifecycle:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">An awareness gap: If teams are unsure of their spend impact, an insight agent can push real-time cost data into their daily tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A bandwidth gap: If engineers are too busy with backlogs, a remediation agent can identify quick wins and present them as ready-to-merge code changes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A complexity gap: If reporting feels like a manual chore, an orchestration agent can gather the data and simplify the process.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Start with trust, then add autonomy</span></h2>\n<p><span style=\"vertical-align: baseline;\">The sensible path runs in sequence. Establish the community practice, the way Orange did. Then introduce read-only agents that inform and suggest. Only once those are established across the community should you build agents that execute changes. Direct action carries operational risk, so manage it carefully. It's also where significant wins often sit.</span></p>\n<p><span style=\"vertical-align: baseline;\">How you build depends on who's building. For teams that want to deploy quickly with minimal code, the </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise App</span></a><span style=\"vertical-align: baseline;\"> provides a no-code environment for creating agents. For developers who need granular control, the </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> (formerly Vertex AI) offers advanced tools for launching and governing agents built with frameworks like the Agent Development Kit (ADK).</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud FinOps is moving beyond centralized reporting toward action that happens where the work does. The organizations getting there start with the culture, then use agents to carry it further than any one team could reach. </span></p>\n<p><span style=\"vertical-align: baseline;\">Orange's numbers came out of the community work. Building that foundation is the part worth copying first. When you're ready to extend it, </span><a href=\"https://cloud.google.com/consulting\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Consulting</span></a><span style=\"vertical-align: baseline;\"> can help you shape the community practice, and the Gemini Enterprise App is a low-lift way to put your first read-only agent in front of your teams.</span></p></div>"
"last_updated": "2026-09-17 09:06:12 JST"
