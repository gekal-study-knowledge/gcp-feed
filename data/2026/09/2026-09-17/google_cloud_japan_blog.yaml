  "a455c7dbbfe1e6925c2f26667d78bea8":
    "id": "a455c7dbbfe1e6925c2f26667d78bea8"
    "title": "AI コーディング エージェント向け Google Cloud Developer プラグインのご紹介"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/introducing-the-google-cloud-developer-plugin-for-ai-coding-agents/"
    "published": "2026-09-17 12:00:00"
    "fetched": "2026-09-17 14:45:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 11 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/introducing-the-google-cloud-developer-plugin-for-ai-coding-agents?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント スキルをドキュメントやリモート MCP サーバーと組み合わせて使用することは、AI ワークフローを成功させるための有効な手段となります。特定のユースケースではコンテキスト ウィンドウの使用量を削減する効果もあり、インストールも簡単です。しかし、個々のスキルの管理は煩雑になりがちであり、スキルによっては他のスキルや MCP サーバーと連携して同じ目標に向かって動作するときに最も効果を発揮するものもあります。こうした場合に役立つのがプラグインです。</span></p>\n<p><span style=\"vertical-align: baseline;\">そこでこのたび、AI コーディング エージェント向けの新しい Google Cloud プラグインをリリースしました。これらのエージェント プラグインは、インストール可能なバンドルとして設計されており、Google Cloud 上でより効果的に動作するためのスキルとツールを任意の AI エージェントに提供します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ツールの連動に関する問題を解決</strong></h4>\n<p><span style=\"vertical-align: baseline;\">コーディング エージェントの使用を拡大していくと、関連するスキルを組み合わせて使用したり、補完的なコンテキストやツールと併用したりすることで、その能力が大幅に向上する場合があります。たとえば、インフラストラクチャを分析するエージェントは、ドメインの知識、ワークフローの推奨事項、ライブ環境とやり取りする機能と組み合わせることで、効果が向上します。</span></p>\n<p><span style=\"vertical-align: baseline;\">プラグインは、関連する機能をまとまりのあるインストール可能なバンドルにパッケージ化することで、「ツールを連動させる」という課題を解決します。これにより、複雑な依存関係を管理することなく、幅広い基本機能とプロダクト固有の高度なツールの両方を活用できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このリリースではまず、すべての Google Cloud ユーザーのエージェント機能に対応できる基本的なプラグインを提供します。エージェントが Google Cloud 関連のスキルを簡単に取得し、公式ドキュメントを活用して、Google Cloud とのプログラマティックなやり取りを処理できるようにすることに重点を置いています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">オープン スタンダードを基盤に構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">また、Google のプラグインは、エージェント スキルと Model Context Protocol（MCP）サーバーをポータブルで相互運用可能なユニットにパッケージ化するための、オープンかつベンダーに依存しない標準である </span><a href=\"https://g.dev/cloud/agent-plugins-specification\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Plugins 仕様</span></a><span style=\"vertical-align: baseline;\">に準拠して構築されています。Agent Plugins 標準は、開発者が AI アシスタントごとに異なる構成やラッパーを管理する必要をなくし、統合されたマニフェストとディレクトリ構造を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud のプラグインは、この標準を採用することで、さまざまな AI コーディング環境を利用するデベロッパーが Google Cloud での成功を支援するツールにアクセスする際の一貫性と品質を確保しています。この標準は、本日ご紹介するプラグインだけでなく、Google Agent Skills リポジトリに公開されている他のすべてのプラグインにも適用されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、Google Agent Skills リポジトリに公開したばかりのフラッグシップ プラグインである </span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> について見ていきます。このプラグインは、エージェントが Google Cloud を操作する際の基本事項（認証、認可、プロジェクトの管理、gcloud CLI オペレーションのガードレールなど）を適切に処理できるようにするためのものです。このプラグインには、</span><a href=\"https://g.dev/cloud/dk-mcp-connect\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Developer Knowledge MCP サーバー</span></a><span style=\"vertical-align: baseline;\">の構成もバンドルされています。そのため、エージェントは Google のデベロッパー向け公式ドキュメントを最新のグラウンディングとして利用できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">プラグインの動作: プロジェクトのオンボーディングと ID の認証</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このプラグインの仕組みを理解するため、スクリプト作成作業の一環として新しいプロジェクトをブートストラップする場合を考えてみましょう。</span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> プラグインをインストールすると、エージェントに次のようなプロンプトを送信できます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">このプラットフォームを初めて使用するので、アカウントを取得して、課金を設定した最初のプロジェクトを作成する必要があります。次に、作成中のスクリプトが自分自身としてではなく、サービス ID として API を呼び出せるように、ローカルマシンを認証する必要があります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">環境の把握:</strong><span style=\"vertical-align: baseline;\"> エージェントは、CLI が利用可能か、既存のプロジェクトや組織があるかといった前提条件を確認するため、実際の環境に対してバックグラウンドでサイレントにチェックを実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レビュー:</strong><span style=\"vertical-align: baseline;\"> エージェントは、プロンプトの内容に起因して発生しうるリスク（誤って鍵を漏洩する、Git への commit など）を考慮します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ガードレールとのやり取り:</strong><span style=\"vertical-align: baseline;\"> エージェントはワークフローのロードマップを提示し、リソースを変更する前に、それらのステップを実行するかどうかをユーザーに確認します。</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"screenshot_plugin_blog_post\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/screenshot_plugin_blog_post.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Google Cloud プラグインのインストール</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud プラグインは、オープンな </span><a href=\"https://g.dev/cloud/agent-plugins\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Skills</span></a><span style=\"vertical-align: baseline;\"> リポジトリから入手可能です。標準の Agent Plugins レイアウトに準拠しているため、簡単にご利用の環境に追加できます。たとえば、</span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> プラグインは以下の方法でインストールできます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Antigravity CLI</strong></p>\n<p><span style=\"vertical-align: baseline;\">Google Agent Skills リポジトリ内のパスを使用して、CLI からプラグインを直接インストールします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;agy plugin install https://github.com/google/skills/plugins/cloud/google-cloud-developer&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff113ef8a10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Claude Code</strong></p>\n<p><span style=\"vertical-align: baseline;\">Google プラグイン マーケットプレイスを追加してから、プラグインをインストールします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;claude plugin marketplace add google/skills\\r\\nclaude plugin install google-cloud-developer@google-plugins&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff113efa7d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Codex CLI</strong></p>\n<p><span style=\"vertical-align: baseline;\">Google プラグイン マーケットプレイスを追加してから、プラグインをインストールします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;codex plugin marketplace add google/skills\\r\\ncodex plugin add google-cloud-developer@google-plugins&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff113ef83d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">すでに Google Cloud を利用している場合は、上記の手順に沿ってインストールし、エージェントを成功へ導けるよう設定してみてください。皆様にその効果を実感していただけるものと確信しております。詳細なガイド付きの手法をご希望の方向けに、新しい </span><a href=\"https://g.dev/cloud/agent-plugins-codelab-agy\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Codelab</span></a><span style=\"vertical-align: baseline;\"> では Antigravity でのプラグインのインストールと初期探索の方法について説明しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud を初めてご利用になる場合は、</span><a href=\"https://g.dev/cloud/dev-setup\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google のドキュメント</span></a><span style=\"vertical-align: baseline;\">の手順に沿ってローカル開発環境をセットアップすることもできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに詳しく知りたい方は、</span><a href=\"https://g.dev/cloud/agent-plugins\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Skills</span></a><span style=\"vertical-align: baseline;\"> リポジトリで、現在利用可能なプラグインとエージェント スキルの詳細をご確認ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- コンテンツ ストラテジスト、</strong><span style=\"font-style: italic; vertical-align: baseline;\">Jonathan Lee</span></p></div>"
  "444e2f729629f0f5951c8608196c8d6f":
    "id": "444e2f729629f0f5951c8608196c8d6f"
    "title": "Spanner: DML トランザクションの累積ミューテーション上限を撤廃"
    "link": "https://cloud.google.com/blog/ja/products/databases/spanner-removes-dml-mutation-limits/"
    "published": "2026-09-17 11:00:00"
    "fetched": "2026-09-17 14:45:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/spanner-removes-dml-mutation-limits?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Spanner は、Google Cloud の妥協のない業務データベースです。水平スケーリングや常時稼働の可用性といった最新の分散型システムの利点に加え、豊富な機能セットや使い慣れたエコシステムといったリレーショナル データベースの利点を兼ね備えています。現在、銀行、小売、メディア、エンターテイメント、AI インフラストラクチャなどの業界のイノベーターが、最も重要なワークロードに Spanner を利用しています。この Spanner において、このたび、より大規模かつ複雑なトランザクションを柔軟に処理する新しい方法が導入されたことをお知らせします。これにより、最高レベルのデータ整合性を必要とするアプリケーションを簡素化できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">一般に、業務のワークロードは、リアルタイムの意思決定ときめ細かい更新の組み合わせです。たとえば、e コマースアプリで複数ステップの購入手続き中に不正行為を特定する場合を考えてみましょう。このような変更はトランザクション単位、つまり、すべてが成功するか、すべてが失敗するかのどちらかである必要があります。また、後続のリクエストが正しいデータを参照できる必要があります。Spanner の ACID トランザクションに対する今回のアップデートにより、アプリケーションは使い慣れた DML を使用して、整合性、スケーラビリティ、可用性を損なうことなく、更新時により多くのデータを処理できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">高い上限で柔軟性が向上</strong></h3>\n<p><span style=\"vertical-align: baseline;\">これまで Spanner では、クエリが 1 回のトランザクションで実行できる変更（DML を使用する場合など）の上限が 80,000 件でした。これは、更新する行数と列数の積に、依存するインデックスを加えたものとして大まかに計算されていました。アプリケーションは、時間の経過とともに、より多くのデータを処理し、新しい機能を提供できるように進化します。こうした進化に伴い、トランザクションのサイズが拡大すると、以前は小さかったトランザクションがこの上限に達する可能性が生じます。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回のアップデートでは、80,000 件というミューテーション数の上限がトランザクションから個々の DML ステートメントに移行されます。DML ステートメントは、トランザクション レベルの全体的なミューテーション数の上限に影響しなくなります。INSERT、UPDATE、DELETE など、個々の DML ステートメントが生成するミューテーション数が 80,000 件未満である限り、1 つのトランザクションにいくつでも DML ステートメントを含められるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">主なメリット</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">大規模なトランザクション:</strong><span style=\"vertical-align: baseline;\"> 累積ミューテーション数の上限に準拠するために、DML ステートメントを人為的に分割するのではなく、ビジネス要件に基づいて論理的にグループ化できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">シームレスな移行:</strong><span style=\"vertical-align: baseline;\"> 今回の変更は、既存のすべての Spanner クライアント ライブラリと互換性があるため、アプリケーション コードの更新は不要です。</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">技術的な考慮事項</strong></h3>\n<h4><span style=\"vertical-align: baseline;\">ロックと中止</span></h4>\n<p><span style=\"vertical-align: baseline;\">1 つのトランザクションに含めることができる DML ステートメントの数が増えた一方で、トランザクションの規模が拡大して実行時間が長くなると、ロックが保持される時間も長くなることに注意が必要です。これにより、</span><strong style=\"vertical-align: baseline;\">ロックの競合</strong><span style=\"vertical-align: baseline;\">や</span><strong style=\"vertical-align: baseline;\">トランザクションの中止</strong><span style=\"vertical-align: baseline;\">が発生する可能性が高まります。トランザクションを簡潔に保つことで、高いパフォーマンスを維持し、リソースの競合を最小限に抑えることができます。</span></p>\n<h4><span style=\"vertical-align: baseline;\">DML と Mutation API</span></h4>\n<p><span style=\"vertical-align: baseline;\">上限の適用は、データを変更する方法によって異なります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">DML ステートメント:</strong><span style=\"vertical-align: baseline;\"> 各ステートメント（executeUpdate など）がミューテーション数の上限 80,000 件に対して個別に評価されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Mutation API:</strong><span style=\"vertical-align: baseline;\"> insert() や update() など、クライアント ライブラリのメソッドを使用する場合、ミューテーションは Commit 呼び出し中に提供されます。80,000 件の上限は引き続き、その 1 回の呼び出しに含まれるミューテーションの</span><strong style=\"vertical-align: baseline;\">セット全体</strong><span style=\"vertical-align: baseline;\">に適用されます。</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">ミューテーション数について</span></h4>\n<p><span style=\"vertical-align: baseline;\">Spanner では、変更されたセル、主キー、セカンダリ インデックスの更新を含め、変更の複雑さに基づいてミューテーション数が数えられます。ミューテーションの数え方について詳しくは、</span><a href=\"https://cloud.google.com/blog/products/databases/cloud-spanner-doubles-the-number-of-updates-per-transaction\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">のブログをご覧ください。commit されたトランザクションの合計ミューテーション数は、CommitStats の mutation_count を使用して確認できます。mutation_count には、すべての DML ステートメントと commit 呼び出しにわたって、トランザクションの一部であるすべてのミューテーションが含まれます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Java の実装例</strong></h3>\n<p><span style=\"vertical-align: baseline;\">次の例は、新しい上限のロジックで、1 つのトランザクション内で複数の DML ステートメントを実行する方法を示しています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.cloud.spanner.DatabaseClient;\\r\\nimport com.google.cloud.spanner.Statement;\\r\\nimport com.google.cloud.spanner.TransactionContext;\\r\\nimport com.google.cloud.spanner.TransactionRunner.Work;\\r\\n\\r\\n// Assuming dbClient is your initialized DatabaseClient\\r\\ndbClient\\r\\n    .readWriteTransaction()\\r\\n    .run(\\r\\n        new Work&lt;Void&gt;() {\\r\\n          @Override\\r\\n          public Void doWork(TransactionContext transaction) throws Exception {\\r\\n            // Each executeUpdate call is evaluated separately against the 80k mod limit.\\r\\n\\r\\n            // Example 1: Updating specific products\\r\\n            Statement stmt1 = Statement.newBuilder(\\r\\n                        &quot;UPDATE Products SET InStock = FALSE WHERE ProductId = @productId&quot;)\\r\\n                    .bind(&quot;productId&quot;).to(1L)\\r\\n                    .build();\\r\\n            transaction.executeUpdate(stmt1); // Verified against 80k limit\\r\\n\\r\\n            Statement stmt2 = Statement.newBuilder(\\r\\n                        &quot;UPDATE Products SET InStock = FALSE WHERE ProductId = @productId&quot;)\\r\\n                    .bind(&quot;productId&quot;).to(2L)\\r\\n                    .build();\\r\\n            transaction.executeUpdate(stmt2); // Verified against 80k limit separately\\r\\n\\r\\n            // Example 2: Inserting related order data\\r\\n            Statement stmt3 = Statement.newBuilder(\\r\\n                        &quot;INSERT INTO OrderItems (OrderId, ItemId, Quantity) VALUES (@orderId, @itemId, @qty)&quot;)\\r\\n                    .bind(&quot;orderId&quot;).to(100L)\\r\\n                    .bind(&quot;itemId&quot;).to(1L)\\r\\n                    .bind(&quot;qty&quot;).to(2)\\r\\n                    .build();\\r\\n            transaction.executeUpdate(stmt3); \\r\\n\\r\\n            Statement stmt4 = Statement.newBuilder(\\r\\n                        &quot;UPDATE Orders SET LastUpdated = PENDING_COMMIT_TIMESTAMP() WHERE OrderId = @orderId&quot;)\\r\\n                    .bind(&quot;orderId&quot;).to(100L)\\r\\n                    .build();\\r\\n            transaction.executeUpdate(stmt4); \\r\\n\\r\\n            return null;\\r\\n          }\\r\\n        });&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff118ac02d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">変更がない点</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">個々のステートメントの上限:</strong><span style=\"vertical-align: baseline;\"> 1 つの DML ステートメントが生成するミューテーション数が 80,000 件を超える場合は、現在と同じエラーが返されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">その他のトランザクション上限:</strong><span style=\"vertical-align: baseline;\"> 最大トランザクション サイズ（バイト単位）など、その他の制約は引き続き有効です。詳細については、</span><a href=\"https://docs.cloud.google.com/spanner/quotas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">ベスト プラクティス</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CommitStats をモニタリングする:</strong><span style=\"vertical-align: baseline;\"> CommitStats で返される mutation_count を利用して、処理によって生成される負荷を把握します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">大規模な処理を最適化する:</strong><span style=\"vertical-align: baseline;\"> 1 つのステートメント（一括更新など）が上限を超える場合は、</span><strong style=\"vertical-align: baseline;\">パーティション化 DML</strong><span style=\"vertical-align: baseline;\"> の使用や、キーによるページ分けを検討します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Spanner は、ダウンタイムなしでスケールする必要がある業務アプリケーションの選択肢として、信頼性に優れています。ミューテーション数の上限が引き上げられたことで、デベロッパーは Spanner のグローバル規模での整合性を活用して、より大規模なトランザクションを柔軟に実行できるようになります。Spanner を使用して、リスクを抑えつつイノベーションを推進する方法を</span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ご確認</span></a><span style=\"vertical-align: baseline;\">ください。また、</span><a href=\"https://docs.cloud.google.com/spanner/docs/free-trial-instance\"><span style=\"text-decoration: underline; vertical-align: baseline;\">無料トライアル</span></a><span style=\"vertical-align: baseline;\">や、月額わずか 54 ドルから利用できる本番環境インスタンスで、実際にお試しいただくこともできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">外部の関連資料</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/spanner/quotas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">割り当てと上限  |  Spanner  |  Google Cloud ドキュメント</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/spanner/docs/dml-versus-mutations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DML とミューテーションを比較する  |  Spanner  |  Google Cloud ドキュメント</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"http://go/cspanner-docs/commit-statistics\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">トランザクションの commit に関する統計情報を取得する  |  Spanner  |  Google Cloud ドキュメント</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">スタッフ ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Rajeshwar Vanka</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Justin Makeig</strong></p></div>"
