    "summary": "<h2 class=\"release-note-product-title\">Access Context Manager</h2>\n<h3>Feature</h3>\n<p>Access Context Manager supports extended session length for Workforce Identity\nFederation. This feature is in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a> for Looker\n(Google Cloud core) customers. For more information, see\n<a href=\"https://docs.cloud.google.com/access-context-manager/docs/extended-session-length-for-workforce-identity-federation\">Configure extended session length for Workforce Identity Federation</a>.</p>\n<h2 class=\"release-note-product-title\">Agent Platform Workbench</h2>\n<h3>Change</h3>\n<h3 id=\"2026092000_p0_release\">20260920.00_p0 Release</h3>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Feature</h3>\n<p>JupyterLab now forwards client-side logs (console errors, uncaught exceptions, unhandled promise rejections, and failed network requests) to the instance backend, where they surface in Cloud Logging for easier debugging.</p>\n<h3>Change</h3>\n<h3 id=\"2026092000_p0_release\">20260920.00_p0 Release</h3>\n<h3>Change</h3>\n<p>Installed latest packages from upstream dependencies.</p>\n<h3>Feature</h3>\n<p>JupyterLab now forwards client-side logs (console errors, uncaught exceptions, unhandled promise rejections, and failed network requests) to the instance backend, where they surface in Cloud Logging for easier debugging.</p>\n<h2 class=\"release-note-product-title\">Apigee X</h2>\n<h3>Announcement</h3>\n<p>On September 21st, 2026, we began maintenance updates of Apigee instances <a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/system-administration/maintenance-windows\">configured for maintenance windows</a>.</p>\n<p>If you set a preferred window for maintenance for your instance, and your instance version is\nbelow <strong>1-18-0-apigee-4</strong>, your instance will be updated to <strong>1-18-0-apigee-4</strong> within the\nnext seven to 21 days. A notification containing the expected date of upgrade will be sent within the next two business days.</p>\n<aside class=\"note\">Note: Instances that meet either of the following two criteria will <b>not</b> be updated:\n<ul>\n<li>Your instance has a DNS misconfiguration, as described in <a href=\"https://docs.cloud.google.com/apigee/docs/release/known-issues\">Known Issue 445936920</a>.</li>\n<li>Your instance uses an Apigee Java Library that has been removed, as described in <a href=\"https://docs.cloud.google.com/apigee/docs/release/release-notes#October_16_2025\">Apigee release notes dated October 16, 2025</a>.</li>\n</ul></aside>\n<p>For more information on participating in scheduled maintenance windows, see <a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/system-administration/maintenance\">Maintenance overview</a> and <a href=\"https://docs.cloud.google.com/apigee/docs/api-platform/system-administration/maintenance-windows\">Manage Apigee instance maintenance windows</a>.</p>\n<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>BigQuery <a href=\"https://docs.cloud.google.com/bigquery/docs/generative-ai-overview#locations\">generative AI functions</a>\nnow support the <code>gemini-3.8-flash</code> Gemini model.</p>\n<h2 class=\"release-note-product-title\">Dataform</h2>\n<h3>Feature</h3>\n<p>The Dataform remote Model Context Protocol (MCP) server now supports pipeline\nauthoring in development workspaces and Git repository operations. AI agents can\ncreate and list workspaces, search and edit files, commit changes and push\ncommits to remote Git providers, update repository settings, and organize\nrepositories in folders. For more information, see\n<a href=\"https://docs.cloud.google.com/dataform/docs/use-dataform-mcp\">Use the Dataform remote MCP server</a>\nand the\n<a href=\"https://docs.cloud.google.com/dataform/docs/reference/mcp\">Dataform MCP reference</a>.\nThis feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>"
