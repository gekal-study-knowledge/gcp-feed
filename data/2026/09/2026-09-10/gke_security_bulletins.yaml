    "title": "GCP-2026-061"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-061"
    "published": "2026-09-10 05:00:00"
    "fetched": "2026-09-10 05:27:49"
    "summary": "<p><strong>Published: </strong>2026-09-09</p><p><strong>Reference: </strong> <a href=\"https://github.com/containerd/containerd/security/advisories/GHSA-p7v4-vr35-mj6f\">GHSA-p7v4-vr35-mj6f</a></p><table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A security vulnerability <a href=\"https://github.com/containerd/containerd/security/advisories/GHSA-p7v4-vr35-mj6f\">GHSA-p7v4-vr35-mj6f</a> (CVE assignment pending) in containerd's CRI implementation allows a container restored from an untrusted checkpoint through the <code>CreateContainer</code> API to bypass the destination security context and execute with elevated privileges. When restoring a container from a checkpoint archive or annotated OCI image, CRIU restores process credentials, Linux capabilities, <code>no_new_privs</code>, and <code>seccomp</code> state directly from checkpoint data rather than enforcing the destination CRI <code>ContainerConfig</code>. An attacker who can run a container with a crafted checkpoint image can execute processes as the root user with full capabilities and no enforced <code>seccomp</code> filters despite restrictive security policies requested by the orchestrator. Additionally, containerd's CRI status reporting reflects the requested configuration rather than the actual restored process state, masking the privilege discrepancy from orchestrators.</p>\n<p><strong>GKE clusters are not vulnerable by default.</strong> GKE node images do not include the <code>criu</code> tool. Implicit container restore is not supported without <code>criu</code> installed on the node. Standard container creation operations in GKE Standard and GKE Autopilot remain unaffected. GKE Autopilot clusters do not support custom runtime configuration and are not impacted.</p>\n<p>Additionally, <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/pod-snapshots\">Pod snapshots in GKE</a> do not exercise the vulnerable implicit restore codepath.</p>\n<p>In updated containerd versions (2.3.4 and later, or 2.2.7 and later), implicit restore is disabled by default through the <code>enable_experimental_restore_via_create</code> configuration option. Version 2.4 of containerd will remove this codepath completely in favor of the explicit Pod-level restore API (KEP-5823).</p>\n<aside class=\"warning\"><strong>Warning:</strong> Administrators can manually re-enable the feature in containerd (2.3.4 and later, or 2.2.7 and later) by setting the <code>enable_experimental_restore_via_create</code> configuration option. However, doing so leaves this vulnerability present because containerd cannot enforce destination security policy while it restores the <code>criu</code> process.</aside>\n<h4 id=\"what-should-i-do\" tabindex=\"-1\">What should I do?</h4>\n<p>Because GKE does not include the <code>criu</code> binary on default node images, no immediate cluster upgrades or configuration changes are required for default workloads.</p>\n<p>If you install custom runtime software or node tools on your nodes that include the <code>criu</code> binary, consider taking the following actions as appropriate for your environment:</p>\n<ul>\n<li><strong>Re-create existing restored containers:</strong> Stop, delete, and re-create any running containers that were restored from untrusted checkpoints.</li>\n<li><strong>Disable experimental restore (containerd 2.3.4 and later, or 2.2.7 and later):</strong> If operating nodes with containerd (2.3.4 and later, or 2.2.7 and later) and custom <code>criu</code> installations, ensure the <code>enable_experimental_restore_via_create</code> configuration option remains set to <code>false</code> in your containerd node configuration.</li>\n<li><strong>Audit containerd logs:</strong> If <code>criu</code> is installed, inspect node logs for implicit restore log entries containing search strings such as <code>\"Found checkpoint of container\"</code>, <code>\"Prepared &lt;id&gt; for restore\"</code>, or <code>\"Restored container &lt;id&gt; successfully\"</code>.</li>\n<li><strong>Monitor deprecation warnings for containerd:</strong> Look for the following deprecation warning event: <code>io.containerd.deprecation/cri-create-container-checkpoint-restore</code>.</li>\n<li><strong>Restrict Pod creation permissions:</strong> Ensure Kubernetes RBAC restricts Pod creation permissions (<code>create pods</code>) strictly to trusted users and service accounts.</li>\n<li><strong>Enforce trusted image registries:</strong> Ensure that the values for the Pod's <code>image:</code> field reference verified image repositories.</li>\n<li><strong>Prepare for KEP-5823:</strong> Update operational procedures to rely on explicit Pod-level Checkpoint or Restore APIs after they are available in future Kubernetes releases.</li>\n</ul>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>"
