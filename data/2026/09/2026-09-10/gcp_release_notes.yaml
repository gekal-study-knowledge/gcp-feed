    "summary": "<h2 class=\"release-note-product-title\">Cloud Storage</h2>\n<h3>Feature</h3>\n<p>Storage Intelligence advisor\nis now <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>.\nStorage Intelligence advisor lets you monitor and manage your\nCloud Storage environment at scale across organizations, folders, and\nprojects.\nFor more information, see <a href=\"https://docs.cloud.google.com/storage/docs/storage-intelligence/advisor-overview\">About Storage Intelligence advisor</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Enterprise: Support for channel mentions and multi-turn conversations in the Gemini Enterprise app for Slack</strong></p>\n<p>The Gemini Enterprise app for Slack has the following new capabilities:</p>\n<ul>\n<li><strong>Channel mentions:</strong> You can <code>@mention</code> the Gemini Enterprise app directly in Slack channels and conversational threads. The app returns responses privately so you can review them before choosing to share.</li>\n<li><strong>Multi-turn conversations:</strong> The Gemini Enterprise app remembers the context of your current session in direct messages. You can ask follow-up questions and refine previous responses. You can clear the context and start over by clicking <strong>New chat</strong>.</li>\n</ul>\n<p>To enable these features, your Slack administrator must reinstall the Gemini Enterprise app. For more information, see <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/configure-slack-app#install-app\">Install the Gemini Enterprise app for Slack in your Slack workspace</a>. After the administrator reinstalls the app, end users must authorize the Slack connector. For more information, see <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-existing-data-store#user_authorization\">User authorization</a>. If you don't reinstall and re-authorize the Gemini Enterprise app, your Slack workspace retains the legacy experience.</p>\n<p>These features are generally available (GA). For more information, see <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/configure-slack-app#use-app\">Configure the Gemini Enterprise app for Slack</a>.</p>\n<h2 class=\"release-note-product-title\">Google Cloud Managed Service for Apache Kafka</h2>\n<h3>Feature</h3>\n<p>You can configure a Managed Service for Apache Kafka cluster as a public cluster to let client applications connect over the public internet. For more information, see <a href=\"https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/networking-kafka#connect-clients-to-a-public-cluster\">Connect clients to a public cluster</a>.</p>"
