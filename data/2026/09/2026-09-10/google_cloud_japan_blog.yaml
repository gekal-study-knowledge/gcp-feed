    "title": "近畿大学と Google Cloud が包括連携協定を締結 - 約 2 万人超へ「Google AI Pro for Education」を導入し、「AI ネイティブ大学」の実現を支援"
    "link": "https://cloud.google.com/blog/ja/products/gcp/kinki-uni-and-google-cloud-sign-a-comprehensive-partnership-agreement/"
    "published": "2026-09-10 10:00:00"
    "fetched": "2026-09-10 09:53:44"
    "summary": "<div class=\"block-paragraph\"><p>Google Cloud は、近畿大学（大阪府東大阪市）と、AI 人材育成モデルの確立ならびに生成 AI を活用した大学運営、学生支援、研究支援の高度化に向け、包括連携協定を締結しました。</p><p>本協定に基づく具体的な取り組みとして、全 16 学部の 1・2 年生 19,033 人および教職員 2,105 人、合わせて 21,138 人を対象に、教育機関向け Gemini アプリケーションの有償版である「Google AI Pro for Education」のライセンス導入を Google Cloud がサポートします。また、2026 年度後期の授業開始に合わせて近畿大学が進める、生成 AI 技術を活用した学生支援窓口のオンライン化に向けたトライアルも、Google Cloud が技術面から後押しします。</p><p>近畿大学の大規模かつ多様な教育・研究環境と、Google Cloud が提供する生成 AI、クラウド、データ分析などの技術を組み合わせ、AI 人材育成、大学運営、学生支援、研究支援の各領域を横断した「AI ネイティブ大学」の実現を強力に支援してまいります。</p><p><b>【本協定のポイント】</b></p><p>● Google Cloud が近畿大学との包括連携協定を通じて、生成 AI 活用による大学全体の変革を支援</p><p>● 全 16 学部の 1・2 年生および教職員合わせて約 2 万人を対象に、「Google AI Pro for Education」のライセンス導入をサポート</p><p>● 「AI ネイティブ大学」の実現に向け、AI 人材育成、大学運営、学生支援、研究支援の 4 領域で取り組みを推進</p><p><b>【本件の内容】</b></p><p>近畿大学ではこれまで、従来の教育向け生成 AI サービスの試験導入などを通じて、学生および教職員による生成 AI の活用方法や導入効果を検証してきました。学生の学修支援に加え、教職員による文書作成、要点整理、議事録作成、規程・マニュアルの検索・要約など、さまざまな場面で生成 AI の活用を進めています。</p><p>また、学生支援においては、チャットボットやオンライン問い合わせフォームを活用し、対面とオンラインを組み合わせた相談・問い合わせ体制の検証にも取り組んできました。</p><p>近畿大学は本協定を機に、これまで培ってきた実績を Google Cloud の技術支援を通じて大学全体の変革へとつなげていきます。</p><p>Google Cloud が支援する「AI ネイティブ大学」とは、単に生成 AI サービスを導入するだけではなく、学生と教職員が生成 AI を日常的かつ適切に活用し、AI 人材育成、大学運営、学生支援、研究支援の仕組みそのものを継続的に改善していく大学です。</p><p>本協定を通じて、近畿大学は 4 領域で生成 AI を活用した具体的な取り組みを進めます。Google Cloud は、その取り組みを技術面から支えるとともに、そこで得られた知見が国内の高等教育における新たな生成 AI 活用モデルとなることを期待しています。</p><p><b>【近畿大学がめざす 4 つの領域への Google Cloud の支援】</b></p><p><b>◼︎ AI 人材育成モデルの確立</b><br />近畿大学は、自身の持つ多様な教育環境と Google Cloud の生成 AI・クラウド技術を掛け合わせ、全学的な AI 人材育成モデルの確立を目指します。具体的には、全 16 学部の 1・2 年生および教職員の約 2 万人を対象に、「Google AI Pro for Education」のライセンスを導入します。さらに、近畿大学では 2027 年 4 月から全学部で情報リテラシー関連科目を必修化する予定です。Google for Education の協力を得て、生成 AI の仕組み、ファクトチェック、著作権、情報セキュリティ、学術公正などを学ぶこの教育を技術・コンテンツの両面から支援し、学生が専門教育や研究・制作活動において Gemini などの生成 AI を目的に応じて適切に活用できる力の育成を後押しします。</p><p><b>◼︎ AI ネイティブ大学運営モデルの共同構築</b><br />近畿大学は、既存業務に生成 AI を追加するにとどまらず、問い合わせ、申請、決裁、文書作成、情報検索、会議運営などの大学業務を生成 AI 活用前提で再設計し、次世代の大学運営モデルの構築を推進します。また、複数のシステムやデータを横断して処理する業務や、複雑な判断・手順を伴う業務、学内 LMS の活用などについて、Gemini Enterprise の AI エージェント機能を活用した自動化・高度化の可能性を Google Cloud とともに検証していきます。</p><p><b>◼︎ AI を活用した「24 時間学生支援モデル」の構築（学生支援窓口のオンライン化）</b><br />近畿大学は、2026 年度後期の授業開始に合わせて、AI チャットボット、オンライン問い合わせフォーム、予約制相談を組み合わせた学生支援窓口のオンライン化に向けた移行トライアルを開始します。</p><p>学生が時間や場所を問わず必要な情報にアクセスできる環境を目指し、FAQ、学内規程、手続案内、シラバスなどを活用した検索・回答支援の充実に向けた取り組みを、Google Cloud が技術面から後押しします。</p><p><b>◼︎ 研究者と AI が協働する「次世代研究支援基盤」の構築</b><br />近畿大学は、論文・研究情報の収集、先行研究の整理、研究データの分析、共同研究者の探索などを支える全学的な研究支援基盤の構築に取り組みます。Google Cloud は、Gemini Enterprise や BigQuery などのサービス提供および技術支援を通じて、研究者と AI が協働する新たな研究環境の創出を支えます。</p><p><b>【近畿大学長 松村 到のコメント】</b></p><p>生成 AI は、知識を得るためのツールにとどまらず、私たちの思考を広げ、学びを深め、新たな価値を生み出す大きな可能性を持っています。一方で、AI が示す答えをそのまま受け入れるのではなく、情報の正確性を確かめ、自ら考え、判断し、責任を持って活用する力が、これまで以上に重要になります。</p><p>今回の Google Cloud との包括連携は、単に新しい AI サービスを導入するものではありません。Google Cloud が持つ生成 AI やクラウド、データ活用に関する技術・知見と、本学の大規模かつ多様な教育・研究環境を掛け合わせ、両者が共に新しい大学のあり方を創り上げていく取り組みです。約 2 万人の学生・教職員への「Google AI Pro for Education」の導入を一つの起点として、教育、学生支援、大学運営、研究の各分野において、生成 AI の活用を前提とした「AI ネイティブ大学」の実現をめざします。</p><p>近畿大学はこれまで、社会の変化を先取りし、実社会の課題に向き合う「実学教育」を大切にしてきました。生成 AI が社会に広く浸透する時代だからこそ、学生には AI に使われるのではなく、AI を使いこなし、人にしかできない発想や判断、対話を通じて、新しい価値を生み出せる人材へと成長してほしいと考えています。</p><p>令和 9 年（2027 年）4 月から全学部で必修化する情報リテラシー関連科目などを通じて、AI の可能性とリスクの双方を正しく理解し、実践的に活用する力を育んでまいります。さらに、学生支援や大学業務、研究支援にも AI 活用を広げ、大学全体の仕組みそのものを進化させていきます。</p><p>Google Cloud との共創を通じて、学生、教職員、研究者が安心・安全に AI を活用し、新しい価値を生み出し続ける大学へ。近畿大学はこれからも、実学教育を進化させながら、これからの高等教育の新しい姿を切り拓いてまいります。</p><p><b>【グーグル・クラウド・ジャパン合同会社 執行役員 パブリックセクター &amp; ヘルスケア・ライフサイエンス 事業本部長 和泉 綾志のコメント】</b></p><p>先進的な教育を牽引される近畿大学様との包括連携協定の締結を、大変光栄に思います。</p><p>Google Cloud は最先端の AI 技術である Gemini、クラウド基盤そしてセキュアなデータ基盤などを提供することで、学生の皆様がこれからの時代に求められる AI スキルを実践的に学べる教育・研究環境づくりを全面的に支援いたします。</p><p>また、教職員の皆様の校務、教務等の業務環境 DX、AX 推進を支え、より質の高い学習体験を提供できる基盤づくりに貢献してまいります。</p><p>Google Cloud の技術を活用いただくことで、近畿大学様の実学教育による次世代の AI 人材の育成に貢献してまいります。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image3_unhmMqN.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>"
