  "ed1d30e546d475d860bffc8352badd29":
    "id": "ed1d30e546d475d860bffc8352badd29"
    "title": "Introducing the Google Cloud Developer Plugin for AI Coding Agents"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/introducing-the-google-cloud-developer-plugin-for-ai-coding-agents/"
    "published": "2026-09-11 04:53:00"
    "fetched": "2026-09-11 03:06:32"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Agent skills fit well alongside documentation and remote MCP servers as ways of enabling the success of your AI workflows. They reduce context window usage for certain use cases, and they're straightforward to install. However, you might have noticed that managing individual skills can be unwieldy, or that some skills are most useful when they act alongside other skills or MCP servers toward the same goal. That's where plugins come in to help.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we're thrilled to announce a new Google Cloud plugin for AI coding agents! Designed as installable bundles, agent plugins equip the AI agent of your choice with skills and tools to be more effective on Google Cloud.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Solving the tool coupling problem</span></h2>\n<p><span style=\"vertical-align: baseline;\">As you expand your usage of coding agents, you might find that they become significantly more capable when they use related skills in tandem or with complementary context and tooling. For example, an agent analyzing infrastructure is more effective when combining domain knowledge, workflow recommendations, and the ability to interact with a live environment together.</span></p>\n<p><span style=\"vertical-align: baseline;\">Plugins solve this coupling challenge by packaging related capabilities into cohesive, installable bundles. This allows you to take advantage of both broad foundational capabilities and deep, product-specific tools without managing complex dependencies. </span></p>\n<p><span style=\"vertical-align: baseline;\">For this release, we've started with a foundational plugin that supports agent functionality for all Google Cloud users, focusing on making it easier for agents to retrieve Google Cloud-related skills, make use of official documentation, and handle programmatic interactions with Google Cloud.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Built on an open standard</span></h2>\n<p><span style=\"vertical-align: baseline;\">We've also built our plugin in compliance with the </span><a href=\"https://g.dev/cloud/agent-plugins-specification\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Plugins specification</span></a><span style=\"vertical-align: baseline;\">, an open, vendor-neutral standard for packaging Agent Skills and Model Context Protocol (MCP) servers into portable, interoperable units. Rather than requiring developers to maintain different configurations and wrappers for every AI assistant, the Agent Plugins standard provides a unified manifest and directory structure.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our Google Cloud plugin adopts this standard to ensure that developers across a variety of AI coding environments get consistent, high-quality access to tools that help them succeed with Google Cloud. That includes not only the plugins we talk about today, but all other plugins published to the Google Agent Skills repository as well.</span></p>\n<p><span style=\"vertical-align: baseline;\">Let's take a look at the flagship plugin that we've just published in the Google Agent Skills repository: </span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\">. This plugin exists to help agents successfully navigate the fundamentals of interacting with Google Cloud: things like authentication, authorization, managing projects, and guardrails for gcloud CLI operations. This plugin also bundles configuration for the </span><a href=\"https://g.dev/cloud/dk-mcp-connect\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Developer Knowledge MCP server</span></a><span style=\"vertical-align: baseline;\">, which gives agents up-to-date grounding in Google's official developer documentation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Plugin in action: Project onboarding and identity authentication</span></h3>\n<p><span style=\"vertical-align: baseline;\">To see how this plugin works, consider a situation where you're bootstrapping a new project as part of working on a script. With the </span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> plugin installed, you can prompt your agent:</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">I'm brand new to this platform, and I need to get an account and a first project with billing set up. Then, I need my local machine authenticated so a script that I'm writing can call the APIs as a service identity instead of as me.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Environment awareness:</strong><span style=\"vertical-align: baseline;\"> The agent silently runs background checks against your live environment for prerequisites like CLI availability and potential existing projects or organizations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review:</strong><span style=\"vertical-align: baseline;\"> The agent considers IAM best practices to avoid risks that might be assumed as part of the prompt, like accidental key leaks or git commits.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Interaction with guardrails:</strong><span style=\"vertical-align: baseline;\"> The agent outlines a workflow roadmap and offers to act on those steps before modifying any resources.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"screenshot_plugin_blog_post\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/screenshot_plugin_blog_post.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Installing Google Cloud plugins</span></h2>\n<p><span style=\"vertical-align: baseline;\">Because Google Cloud plugins are available from the open </span><a href=\"https://g.dev/cloud/agent-plugins\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Skills</span></a><span style=\"vertical-align: baseline;\"> repository and adhere to the standard Agent Plugins layout, adding them to your environment is straightforward. For example, here's how you'd install the </span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> plugin:</span></p>\n<h3><span style=\"vertical-align: baseline;\">Antigravity CLI</span></h3>\n<p><span style=\"vertical-align: baseline;\">Install the plugin directly via the CLI using its path in the Google Agent Skills repository:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;agy plugin install https://github.com/google/skills/plugins/cloud/google-cloud-developer&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7890c94670&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Claude Code</span></h3>\n<p><span style=\"vertical-align: baseline;\">Add the Google plugins marketplace, then install the plugin:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;claude plugin marketplace add google/skills\\r\\nclaude plugin install google-cloud-developer@google-plugins&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7890c94130&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Codex CLI</span></h3>\n<p><span style=\"vertical-align: baseline;\">Add the Google plugins marketplace, then install the plugin:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;codex plugin marketplace add google/skills\\r\\ncodex plugin add google-cloud-developer@google-plugins&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7890c946a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Next Steps</span></h2>\n<p><span style=\"vertical-align: baseline;\">If you're already a Google Cloud user, try the above installation steps to set up your agent for success. We think you'll like what you see! For those who want a more guided approach, our new </span><a href=\"https://g.dev/cloud/agent-plugins-codelab-agy\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">codelab</span></a><span style=\"vertical-align: baseline;\"> will walk you through the installation and initial exploration of the plugin in Antigravity.</span></p>\n<p><span style=\"vertical-align: baseline;\">If you're new to Google Cloud, you can also get started with instructions </span><a href=\"https://g.dev/cloud/dev-setup\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">in our documentation</span></a><span style=\"vertical-align: baseline;\"> to set yourself up for local development.</span></p>\n<p><span style=\"vertical-align: baseline;\">The most curious readers can also take a deeper look at the plugins and agent skills available to use today in the </span><a href=\"https://g.dev/cloud/agent-plugins\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Skills</span></a><span style=\"vertical-align: baseline;\"> repository.</span></p></div>"
  "93dc12ea5231be3a0b385815ca799d11":
    "id": "93dc12ea5231be3a0b385815ca799d11"
    "title": "3 Highlights from Thomas Kurian’s Keynote at the Goldman Sachs Communicopia & Technology Conference"
    "link": "https://cloud.google.com/blog/topics/inside-google-cloud/highlights-from-the-goldman-sachs-communicopia-and-technology-conference/"
    "published": "2026-09-11 18:00:00"
    "fetched": "2026-09-12 05:29:20"
    "summary": "<div class=\"block-paragraph\"><p>On Tuesday, September 8, Thomas Kurian participated in the Goldman Sachs Tech Conference, providing an update on Google Cloud’s business and strategy. Here are the highlights:</p><ol><li><b>Full Stack Approach:</b> Google Cloud is the only provider to offer solutions across the entire AI stack, which expands our total addressable market, differentiates our products from the point of view of performance, cost and quality; and enables us to diversify our revenue streams as the market grows. We have 17 product lines with more than $1 billion in revenues and our customers on average exceeded their commitments by more than 50%. We have also seen more than 2x quarter-over-quarter and year-over-year growth in the number and value of $100 million to $1 billion deals. And we have more than 300 customers each with $100 million-plus contractual commitments.</li><li><b>Benefits of Google Cloud’s AI Infrastructure:</b> Our AI Infrastructure is built on highly differentiated products in a large expanding market which helps us lower cost and improve performance and margins for our AI models. We have a 2-year AI server payback period, and TPUs have a much faster expected payback period than GPUs. The majority of our AI infrastructure total contract value is from committed five-year contracts.</li><li><b>Benefits of Google Cloud’s broad AI solutions:</b> We have seen strong adoption of Gemini Enterprise, which provides customers with insight across their businesses in a highly cost efficient manner with enterprise control and governance. We have also seen that Google Cloud customers that use our AI products use 1.8 times as many products as those who do not.</li></ol><p>For more information, please refer to the <a href=\"https://s206.q4cdn.com/479360582/files/doc_events/2026/Sep/08/Thomas-Kurian-Goldman-Sachs-Slides-09-08-26.pdf\" target=\"_blank\">slide presentation</a> and <a href=\"https://abc.xyz/investor/events/event-details/2026/Thomas-Kurian-CEO-of-Google-Cloud-at-the-Goldman-Sachs-Communacopia--Technology-Conference-on-Sep-8-2026-2026-GCjPPdDfmS/default.aspx\" target=\"_blank\">transcript</a> from the event. This blog post includes statements that could be considered forward-looking. These statements involve a number of risks and uncertainties that could cause actual results to differ materially. Any forward-looking statements in the presentation are based on assumptions as of September 8, 2026, and Alphabet undertakes no obligation to update them.</p></div>"
