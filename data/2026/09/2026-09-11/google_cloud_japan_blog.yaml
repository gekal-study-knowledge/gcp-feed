"entries":
  "e25a55bd3da2c4789802d3479510f9b0":
    "id": "e25a55bd3da2c4789802d3479510f9b0"
    "title": "Google Gen AI SDK for Kotlin 1.0 の発表: Gemini への慣用的なマルチプラットフォーム アクセス"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/announcing-the-google-gen-ai-sdk-for-kotlin-10-idiomatic-multiplatform-access-to-gemini/"
    "published": "2026-09-11 11:00:00"
    "fetched": "2026-09-11 12:07:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 4 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/announcing-the-google-gen-ai-sdk-for-kotlin-10-idiomatic-multiplatform-access-to-gemini?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Kotlin アプリケーションに最新の生成 AI 機能を統合するのに、低レベルな HTTP クライアントを操作したり、異なる Java ライブラリを連携させたりする必要はありません。このたび、</span><strong style=\"vertical-align: baseline;\">Google Gen AI SDK for Kotlin</strong><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">google-genai-kotlin</code><span style=\"vertical-align: baseline;\">）のリリース 1.0 が公開されました。</span><a href=\"https://github.com/googleapis/kotlin-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub の </span><code style=\"text-decoration: underline; vertical-align: baseline;\">googleapis/kotlin-genai</code></a><span style=\"vertical-align: baseline;\"> で、コードを詳しく調べ、実行可能なサンプルを試し、プロジェクトにスターを付けることができるようになっています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Kotlin マルチプラットフォーム（KMP）</strong><span style=\"vertical-align: baseline;\">ライブラリとしてゼロから構築されたこの SDK は、</span><strong style=\"vertical-align: baseline;\">JVM</strong><span style=\"vertical-align: baseline;\">（バックエンド サービス、サーバーレス関数、デスクトップ）と </span><strong style=\"vertical-align: baseline;\">Android</strong><span style=\"vertical-align: baseline;\"> の両方をターゲットとするデベロッパーに、慣用的な Kotlin パラダイム（ファースト クラスの</span><strong style=\"vertical-align: baseline;\">コルーチン</strong><span style=\"vertical-align: baseline;\">、非同期 </span><code style=\"vertical-align: baseline;\">Flow</code><span style=\"vertical-align: baseline;\"> ストリーミング、名前付きパラメータとデフォルト パラメータを持つ不変データクラスなど）を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この SDK では、</span><strong style=\"vertical-align: baseline;\">Gemini Developer API</strong><span style=\"vertical-align: baseline;\">（Google AI Studio）と </span><strong style=\"vertical-align: baseline;\">Gemini Enterprise Agent Platform</strong><span style=\"vertical-align: baseline;\">（Google Cloud）の両方を操作するための統合サーフェスが提供され、構成の調整は最小限で済みます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. はじめに: 依存関係を追加する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">SDK は、Maven Central の </span><code style=\"vertical-align: baseline;\">com.google.genai:google-genai-kotlin</code><span style=\"vertical-align: baseline;\"> で公開されています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Kotlin マルチプラットフォーム（KMP）</strong></p>\n<p><span style=\"vertical-align: baseline;\">マルチプラットフォーム アプリケーションの場合は、</span><code style=\"vertical-align: baseline;\">commonMain</code><span style=\"vertical-align: baseline;\"> ソースセットに依存関係を追加します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// build.gradle.kts\\r\\nkotlin {\\r\\n    sourceSets {\\r\\n        commonMain.dependencies {\\r\\n            implementation(&quot;com.google.genai:google-genai-kotlin:1.0.0&quot;)\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d14170a0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">標準の JVM プロジェクト</strong></p>\n<p><span style=\"vertical-align: baseline;\">単一プラットフォームの Kotlin プロジェクトの場合、Gradle は Gradle Module Metadata を介して最適なバリアントを自動的に選択します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;// build.gradle.kts\\r\\ndependencies {\\r\\n    implementation(&quot;com.google.genai:google-genai-kotlin:1.0.0&quot;)\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417d00&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">2. 単項およびストリーミングのテキスト生成とチャット</strong></h4>\n<p><span style=\"vertical-align: baseline;\">プライマリ エントリ ポイントは </span><code style=\"vertical-align: baseline;\">Client</code><span style=\"vertical-align: baseline;\"> クラスです。環境変数（Google AI Studio の場合は </span><code style=\"vertical-align: baseline;\">GEMINI_API_KEY</code><span style=\"vertical-align: baseline;\"> または </span><code style=\"vertical-align: baseline;\">GOOGLE_API_KEY</code><span style=\"vertical-align: baseline;\">、標準の Google Cloud アプリケーションのデフォルト認証情報の場合は </span><code style=\"vertical-align: baseline;\">GOOGLE_GENAI_USE_ENTERPRISE=true</code><span style=\"vertical-align: baseline;\">）に基づいて、HTTP 接続と認証を自動的に管理します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Gemini Flash を使用した単一プロンプト リクエスト</strong></p>\n<p><span style=\"vertical-align: baseline;\">Kotlin の </span><code style=\"vertical-align: baseline;\">use</code><span style=\"vertical-align: baseline;\"> 拡張機能を使用すると、クライアントの基盤となるネットワーク エンジンと HTTP 接続が確実に解放されます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val response = client.models.generateContent(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            text = &quot;Explain quantum entanglement in two sentences.&quot;\\r\\n        )\\r\\n\\r\\n        println(response.text)\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417ca0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">コルーチン Flow による低レイテンシ ストリーミング</strong></p>\n<p><span style=\"vertical-align: baseline;\">インタラクティブな UI やレスポンシブな CLI ツールの場合、</span><code style=\"vertical-align: baseline;\">generateContentStream</code><span style=\"vertical-align: baseline;\"> はコールド Kotlin コルーチン </span><code style=\"vertical-align: baseline;\">Flow&lt;GenerateContentResponse&gt;</code><span style=\"vertical-align: baseline;\"> を返し、トークン チャンクをリアルタイムで提供します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val responseFlow = client.models.generateContentStream(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            text = &quot;Outline the key architectural patterns for microservices on Google Cloud.&quot;\\r\\n        )\\r\\n\\r\\n        responseFlow.collect { chunk -&gt;\\r\\n            chunk.text?.let { print(it) }\\r\\n        }\\r\\n        println()\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417f10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">マルチターンの会話（チャット）</strong></p>\n<p><span style=\"vertical-align: baseline;\">リクエスト ターンをまたいで会話履歴を手動で管理するのは煩雑な作業になることがあります。SDK には、コンテキストの維持、ターンの追加、会話履歴のフォーマット、関数呼び出しの処理を自動的に行う専用の </span><code style=\"vertical-align: baseline;\">chats</code><span style=\"vertical-align: baseline;\"> サービスが含まれています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport com.google.genai.kotlin.types.Content\\r\\nimport com.google.genai.kotlin.types.GenerateContentConfig\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val config = GenerateContentConfig(\\r\\n            systemInstruction = Content.fromText(&quot;You are an expert Google Cloud Solutions Architect.&quot;)\\r\\n        )\\r\\n\\r\\n        // Create a multi-turn chat session\\r\\n        val chat = client.chats.create(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            config = config\\r\\n        )\\r\\n\\r\\n        // Turn 1\\r\\n        val firstResponse = chat.sendMessage(&quot;We are designing an event-driven ingestion pipeline on Google Cloud.&quot;)\\r\\n        println(&quot;Gemini: ${firstResponse.text}\\\\n&quot;)\\r\\n\\r\\n        // Turn 2: context from the first turn is included automatically\\r\\n        val secondResponse = chat.sendMessage(&quot;Which managed messaging service should we choose: Pub/Sub or Kafka?&quot;)\\r\\n        println(&quot;Gemini: ${secondResponse.text}\\\\n&quot;)\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417ac0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">chat.sendMessageStream(...)</code><span style=\"vertical-align: baseline;\"> を使用して、マルチターン チャット レスポンスをストリーミングすることもできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">3. Google 検索でグラウンディングされたマルチモーダル分析</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini のマルチモーダル推論は、外部検証と組み合わせると特に効果的です。たとえば、技術、医療、科学に関する図を分析する場合、</span><strong style=\"vertical-align: baseline;\">Google 検索のグラウンディング</strong><span style=\"vertical-align: baseline;\">をアタッチして、事実に基づく主張をライブのウェブソースと照合できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport com.google.genai.kotlin.types.*\\r\\nimport java.io.File\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val imageBytes = File(&quot;src/main/resources/medical_diagram.png&quot;).readBytes()\\r\\n\\r\\n        val content = Content(\\r\\n            parts = listOf(\\r\\n                Part(inlineData = Blob(mimeType = &quot;image/png&quot;, data = imageBytes)),\\r\\n                Part(text = &quot;Is this anatomical diagram accurate? Verify labels against authoritative medical sources.&quot;)\\r\\n            )\\r\\n        )\\r\\n\\r\\n        // Enable Google Search as a grounding tool\\r\\n        val config = GenerateContentConfig(\\r\\n            tools = listOf(Tool(googleSearch = GoogleSearch()))\\r\\n        )\\r\\n\\r\\n        val response = client.models.generateContent(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            content = content,\\r\\n            config = config\\r\\n        )\\r\\n\\r\\n        println(&quot;=== Analysis ===&quot;)\\r\\n        println(response.text)\\r\\n\\r\\n        // Inspect citations and search queries\\r\\n        val grounding = response.groundingMetadata\\r\\n        println(&quot;\\\\n=== Search Queries Executed ===&quot;)\\r\\n        grounding?.webSearchQueries?.forEach { println(&quot;- $it&quot;) }\\r\\n\\r\\n        println(&quot;\\\\n=== Grounding Sources ===&quot;)\\r\\n        grounding?.groundingChunks?.mapNotNull { it.web }?.forEach { source -&gt;\\r\\n            println(&quot;- ${source.title}: ${source.uri}&quot;)\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417bb0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">4. ビジュアル生成と会話型編集: Gemini 3 画像ファミリー</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この SDK は、Google の最新の画像生成モデル（リーダーボードでは </span><span style=\"font-style: italic; vertical-align: baseline;\">Nano Banana</span><span style=\"vertical-align: baseline;\"> シリーズのモデルとして広く知られています）を完全にサポートしています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">画像の生成と保存</strong></p>\n<p><span style=\"vertical-align: baseline;\">生成された画像バイトは、レスポンスの一部で </span><code style=\"vertical-align: baseline;\">Blob</code><span style=\"vertical-align: baseline;\"> として直接提供されます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport java.io.File\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val response = client.models.generateContent(\\r\\n            model = &quot;gemini-3.1-flash-image&quot;, // Nano Banana 2\\r\\n            text = &quot;A photorealistic blueprint of an eco-friendly modern datacenter, isometric view, 4k&quot;\\r\\n        )\\r\\n\\r\\n        val imagePart = response.parts?.firstOrNull { it.inlineData != null }\\r\\n        imagePart?.inlineData?.data?.let { bytes -&gt;\\r\\n            File(&quot;datacenter_blueprint.png&quot;).writeBytes(bytes)\\r\\n            println(&quot;Image generated and saved successfully.&quot;)\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417340&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">画像から画像への会話型編集</strong></p>\n<p><span style=\"vertical-align: baseline;\">同じリクエストで、既存の画像と会話型の編集指示を渡すことができます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;val originalImage = File(&quot;input.png&quot;).readBytes()\\r\\n\\r\\nval editPrompt = Content(\\r\\n    parts = listOf(\\r\\n        Part(inlineData = Blob(mimeType = &quot;image/png&quot;, data = originalImage)),\\r\\n        Part(text = &quot;Change the daylight illumination to a dramatic twilight skyline with illuminated windows.&quot;)\\r\\n    )\\r\\n)\\r\\n\\r\\nval editResponse = client.models.generateContent(\\r\\n    model = &quot;gemini-3-pro-image&quot;, // Nano Banana Pro\\r\\n    content = editPrompt\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417130&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">5. Gemini Live とのリアルタイムの双方向インタラクション</strong></h4>\n<p><span style=\"vertical-align: baseline;\">低レイテンシの音声、オーディオ、ライブのマルチモーダル インタラクションの場合、SDK は </span><code style=\"vertical-align: baseline;\">client.live.connect(...)</code><span style=\"vertical-align: baseline;\"> を使用した永続的な WebSocket 接続を介して </span><strong style=\"vertical-align: baseline;\">Gemini Live API</strong><span style=\"vertical-align: baseline;\"> をサポートします。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import com.google.genai.kotlin.Client\\r\\nimport com.google.genai.kotlin.types.AudioTranscriptionConfig\\r\\nimport com.google.genai.kotlin.types.LiveConnectConfig\\r\\nimport kotlinx.coroutines.launch\\r\\nimport kotlinx.coroutines.runBlocking\\r\\n\\r\\nfun main() = runBlocking {\\r\\n    Client().use { client -&gt;\\r\\n        val model = if (client.enterprise) &quot;gemini-live-2.5-flash-native-audio&quot;\\r\\n                    else &quot;gemini-3.1-flash-live-preview&quot;\\r\\n\\r\\n        val config = LiveConnectConfig(\\r\\n            outputAudioTranscription = AudioTranscriptionConfig()\\r\\n        )\\r\\n\\r\\n        // Establish real-time bidirectional WebSocket session\\r\\n        client.live.connect(model, config).use { session -&gt;\\r\\n            println(&quot;Connected to Gemini Live session!&quot;)\\r\\n\\r\\n            // Launch collector for server messages (audio and text transcriptions)\\r\\n            val receiveJob = launch {\\r\\n                session.receive().collect { serverMessage -&gt;\\r\\n                    serverMessage.serverContent?.outputTranscription?.text?.let { text -&gt;\\r\\n                        print(text)\\r\\n                    }\\r\\n                }\\r\\n            }\\r\\n\\r\\n            // Stream real-time text (or raw PCM audio blobs via session.sendRealtimeInput(audio = ...))\\r\\n            session.sendRealtimeInput(text = &quot;Hello Gemini! Give me a 5-second motivational quote.&quot;)\\r\\n\\r\\n            // When finished, clean up\\r\\n            receiveJob.cancel()\\r\\n            session.closeSession()\\r\\n        }\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417970&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">6. 構造化されたツールと関数呼び出し</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェント ワークフローを構築する場合や、LLM をバックエンド マイクロサービスと連携させる場合、デベロッパーは </span><code style=\"vertical-align: baseline;\">FunctionDeclaration</code><span style=\"vertical-align: baseline;\"> を介して構造化 JSON スキーマを渡すことができます。モデルは、ツールを呼び出すタイミングをインテリジェントに選択します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;val telemetryTool = FunctionDeclaration(\\r\\n    name = &quot;getDatacenterMetrics&quot;,\\r\\n    description = &quot;Fetch real-time CPU and thermal telemetry for a Google Cloud region&quot;,\\r\\n    parameters = Schema(\\r\\n        type = Type.OBJECT,\\r\\n        properties = mapOf(&quot;region&quot; to Schema(type = Type.STRING)),\\r\\n        required = listOf(&quot;region&quot;)\\r\\n    )\\r\\n)\\r\\n\\r\\nval response = client.models.generateContent(\\r\\n    model = &quot;gemini-flash-latest&quot;,\\r\\n    text = &quot;Check telemetry for europe-west1&quot;,\\r\\n    config = GenerateContentConfig(\\r\\n        tools = listOf(Tool(functionDeclarations = listOf(telemetryTool)))\\r\\n    )\\r\\n)\\r\\n\\r\\nresponse.functionCalls?.firstOrNull()?.let { call -&gt;\\r\\n    println(&quot;Model triggered tool: ${call.name} with arguments: ${call.args}&quot;)\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d14172b0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">さらに、チャット サービスを使用する場合は、自動関数呼び出し（AFC）を利用できます。つまり、次の例に示すように、チャットの会話で宣言された関数を、SDK がユーザーに代わって自動的かつ透過的に呼び出すことができます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;fun main() = runBlocking {\\r\\n    // A mocked function\\r\\n    val getWeather = callableFunction(&quot;get_weather&quot;, paramName = &quot;city&quot;) { city: String -&gt;\\r\\n        &quot;18 degrees and sunny in $city&quot;\\r\\n    }\\r\\n\\r\\n    Client().use { client -&gt;\\r\\n        val chat = client.chats.create(\\r\\n            model = &quot;gemini-flash-latest&quot;,\\r\\n            automaticFunctionCalling = AutomaticFunctionCalling(getWeather),\\r\\n        )\\r\\n\\r\\n        // SDK calls get_weather if needed in this conversation\\r\\n        println(chat.sendMessage(&quot;What is the weather in Zurich?&quot;).text)\\r\\n    }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff3d1417910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Gen AI SDK for Kotlin のリリース 1.0 により、バックエンド サーバー エコシステム（Ktor、Spring Boot、Quarkus、Micronaut）とモバイル アプリケーションの Kotlin デベロッパーは、生成 AI アプリケーションを構築するためのクリーンなマルチプラットフォーム基盤を手に入れました。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳細と利用方法については、以下のリソースをご覧ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GitHub リポジトリ:</strong><span style=\"vertical-align: baseline;\"> ソース、スター、ディスカッションは </span><a href=\"https://github.com/googleapis/kotlin-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">github.com/googleapis/kotlin-genai</span></a><span style=\"vertical-align: baseline;\"> でご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドキュメントとサンプル:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/googleapis/kotlin-genai/tree/main/examples\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kotlin 生成 AI サンプル スイート</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フィードバック:</strong><span style=\"vertical-align: baseline;\"> 問題の報告、機能の提案、pull リクエストの送信を </span><a href=\"https://github.com/googleapis/kotlin-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\"> で直接行っていただけます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Kotlin と Gemini を使用して、皆様がどのようなものを構築されるか楽しみにしております。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">デベロッパー アドボケイト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Guillaume Laforge</strong></p></div>"
  "bd828bcfe0c6ba4ca59e531efde98e75":
    "id": "bd828bcfe0c6ba4ca59e531efde98e75"
    "title": "BigQuery の新しい ID 列でパイプラインを簡素化"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/bigquery-identity-columns-to-auto-generate-sequential-integers/"
    "published": "2026-09-11 11:00:00"
    "fetched": "2026-09-11 17:35:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 3 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/bigquery-identity-columns-to-auto-generate-sequential-integers?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">お客様のデータ ジャーニーをさらに支援するため、このたび、BigQuery の ID 列のリリースを発表いたしました。この新機能により、ユーザーは連続する 64 ビット整数値を自動的に生成する列を定義できるため、テーブル内の一意の識別子の管理方法を簡素化できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">データ エンジニアは、データの取り込みをよりスムーズかつ信頼性の高いものにする方法を常に模索しています。BigQuery の ID 列は、テーブルに一意の数値を自動的に生成する強力な組み込みメカニズムを提供します。ID 生成の責任を BigQuery に移すことで、データ パイプラインの複雑さを大幅に軽減し、分析情報の提供に集中できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">データ パイプラインにとっての主なメリット</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ID 列を実装すると、データ アーキテクチャの開発とメンテナンスの効率化に役立つ、いくつかの利点が得られます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">取り込みの合理化</strong><span style=\"vertical-align: baseline;\">: アプリケーション ロジックや ETL ツールで一意のキーを事前に計算する必要なく、データを取り込めるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ボイラープレートの削減</strong><span style=\"vertical-align: baseline;\">: 自動生成されたシーケンスを使用することで、データベースでキー管理がネイティブに処理されるため、SQL コードがよりクリーンになり、メンテナンスしやすくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自動化の統合</strong><span style=\"vertical-align: baseline;\">: ID 列は標準の DML オペレーションとスムーズに連動し、新しい行ごとに一意の識別子が自動的に割り当てられます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">柔軟な統合</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">INSERT</code><span style=\"vertical-align: baseline;\"> ステートメントと </span><code style=\"vertical-align: baseline;\">MERGE</code><span style=\"vertical-align: baseline;\"> ステートメントのどちらを使用している場合でも、ID 列は既存のワークフローに適応します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">ID 列を実装する方法</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ID 列の設定は簡単で、</span><code style=\"vertical-align: baseline;\">CREATE TABLE</code><span style=\"vertical-align: baseline;\"> ステートメント内で直接行うことができます。これらの値の処理方法を定義するには、主に 2 つの方法があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">定義のオプション</strong></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">句</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">説明</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">GENERATED ALWAYS AS IDENTITY</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery が値の一意性を自動的に管理、保証します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">GENERATED BY DEFAULT AS IDENTITY</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">自動生成された値が提供されますが、必要に応じて手動でオーバーライドすることもできます。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><strong style=\"vertical-align: baseline;\">使用例</strong><span style=\"vertical-align: baseline;\">次の SQL ステートメントは、ID を自動的にインクリメントするテーブルを作成する方法を示しています。ID は 1 から始まり、新しいエントリごとに 1 ずつ大きい値になります。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE TABLE my_project.my_dataset.orders (\\r\\n  order_id INT64 GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1),\\r\\n  customer_name STRING,\\r\\n  order_date DATE\\r\\n);\\r\\n\\r\\n-- Ingesting data is now simpler:\\r\\nINSERT INTO my_project.my_dataset.orders (customer_name, order_date)\\r\\nVALUES (&#x27;Joe Doe&#x27;, CURRENT_DATE());&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f093861d650&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ID 列は、柔軟性とパフォーマンスが高く、標準に準拠したデータ プラットフォームを提供するという Google の継続的な取り組みを象徴するものです。サロゲートキーの生成を自動化することで、スケーラブルでメンテナンスしやすいデータ アーキテクチャを簡単に構築できるようにしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">プロジェクトにこの機能を実装する方法の詳細については、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/identity-columns\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery の ID 列に関するドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Wawrzek Hyska</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア エンジニア</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Aayush Bhatnagar</strong></p></div>"
  "1382c617ea0534a235d8628b2cc03051":
    "id": "1382c617ea0534a235d8628b2cc03051"
    "title": "Google、2026 年 Gartner® Magic Quadrant™ で戦略的クラウド プラットフォーム サービス部門のリーダーに選出"
    "link": "https://cloud.google.com/blog/ja/products/compute/google-named-a-leader-in-2026-gartner-magic-quadrant-for-scps/"
    "published": "2026-09-11 02:00:00"
    "fetched": "2026-09-11 17:35:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 3 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/compute/google-named-a-leader-in-2026-gartner-magic-quadrant-for-scps?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gartner® は、</span><a href=\"https://cloud.google.com/resources/content/2026-gartner-magic-quadrant-strategic-cloud-platform-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gartner Magic Quadrant™ で戦略的クラウド プラットフォーム サービス部門</span></a><span style=\"vertical-align: baseline;\">のリーダーとして Google を選出しました。これで、Google は 9 年連続で選出されたことになります。また、Google は「ビジョンの完全性」において最高評価を獲得しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"scps-26\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/scps-26.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この評価は、お客様が Google Cloud 上で極めて要求の厳しいワークロードを確実かつセキュアに構築、スケールできるよう支援してきた、Google の長年にわたる取り組みが認められたものだと考えています。エージェントの時代を迎え、Google は動的なインフラストラクチャで企業の取り組みを加速させ、エンタープライズ アプリ、データ、エージェントを単一の柔軟なプラットフォーム上で接続して、予測可能な費用とパフォーマンスを実現しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">この勢いを後押ししているものは何でしょうか。</strong><span style=\"vertical-align: baseline;\">Google Cloud を際立たせている、3 つの大きな利点があります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">共同設計された統合技術スタック</strong><span style=\"vertical-align: baseline;\">: カスタム シリコンとハードウェア システム、オープン ソフトウェアとオーケストレーション、フロンティア モデルとエージェント アプリケーションにわたる技術スタックです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">動的なインフラストラクチャ</strong><span style=\"vertical-align: baseline;\">: あらゆる場所でユーザー、データ、アプリ、エージェントをセキュアに接続し、スケールできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">真の選択肢があるデジタル主権</strong><span style=\"vertical-align: baseline;\">: 組織はクラウドの重要な機能を犠牲にすることなく、データを完全に制御できます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Google は、お客様が必要とする柔軟性、パフォーマンス、制御を提供しながら、大規模なイノベーションとデリバリーを実現できるよう支援しています。Google Cloud がインフラストラクチャを構築、強化し続けるうえで重視している 3 つの設計原則を詳しくご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. ロックインのない共同設計スタックで AI を加速</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、シリコンからエージェント アプリケーションまで、綿密に共同設計された完全なファースト パーティ AI スタックを提供する唯一のプロバイダです。Google のインフラストラクチャ チームは、Google DeepMind の研究者と協力して、技術スタックのあらゆるレイヤを共同設計し、最適化しています。Google TPU や Arm ベースの Google Axion プロセッサなどのカスタム シリコンから、Google Kubernetes Engine（GKE）や Gemini モデルまで、Google のシステムは優れたパフォーマンスと予測可能な費用を実現しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ハードウェアとソフトウェアを共同設計することで、運用効率が大幅に向上しますが、これは閉じたエコシステムを構築することを意味するものではありません。Google は、分散推論用の llm-d などのフレームワーク、GKE Prism によるオープンモデルのベンチマーク、TPU と GPU の間で PyTorch 互換を実現する TorchTPU によるハードウェア ロックインの排除など、スタックのあらゆるレイヤでオープンソースとオープン スタンダードに深く取り組んでいます。モデル、フレームワーク、シリコンを完全に自由に選択しながら、垂直方向に共同設計されたスタックの機能を最大限に活用できます。これらの緊密に統合されたすべてのコンポーネントを組み合わせることは、優れたスケール、パフォーマンス、効率性を可能にする </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> を構築することを意味します。これは、世界の AI ラボの上位 10 社中 9 社が選んだインフラストラクチャ基盤と同じものです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">2. 動的なインフラストラクチャで迅速かつ経済的にスケーリング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現在、AI リソースの需要は急増しています。Google 内では、データセンターで毎月 3,200 兆個のトークンが処理されており、これは昨年の約 7 倍に相当します</span><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">1</span></span><span style=\"vertical-align: baseline;\">。この変化を乗り切ろうとする企業のリーダーにとって、AI システムのスケーリングは、設計が難しく、リソースを大量に消費し、バースト性があることで知られています。そのため、スケーリングのボトルネックや、十分に活用されていないコンピューティング プールの肥大化につながる可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">組織は、容量管理を自動化し、独自のペースでビジネス アプリケーションをモダナイズし、データ、アプリ、エージェントを安全に接続して、最適化されたグローバル エクスペリエンスを推進するための動的なインフラストラクチャを必要としています。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント規模で成功するには、単一のシステムとして運用できるインフラストラクチャが必要です。Google Cloud のメリットは以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini を活用したツールを使用して、</span><a href=\"https://docs.cloud.google.com/migration-center/docs/app-modernization-assessment\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コアアプリのマッピングとモダナイゼーション</span></a><span style=\"vertical-align: baseline;\">をインテリジェントに行い、静的なレガシー システムを AI とエージェントの動的な基盤に変換することで、</span><strong style=\"vertical-align: baseline;\">AI 変革を推進 </strong><span style=\"vertical-align: baseline;\">できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードに最適化された幅広いコンピューティング</strong><span style=\"vertical-align: baseline;\">の種類と構成から選択できます。事前定義されたカスタムの CPU シェイプ、NVIDIA GPU、Google カスタム シリコン（TPU と Axion CPU）を組み合わせることができます。これらは、AI ワークロードとエンタープライズ ワークロードで優れた費用対効果をもたらすように設計されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Kubernetes Engine を使用して、単一の柔軟なコントロール プレーンで</span><strong style=\"vertical-align: baseline;\">エンタープライズと AI インフラストラクチャを接続</strong><span style=\"vertical-align: baseline;\">できます。これには、計画されたイベントの容量を事前にスケジュールする</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Dynamic Workload Scheduler や、リソースの消費方法を指示する高度なルールを定義する動的リソース割り当てなどの</span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">容量管理</span></a><span style=\"vertical-align: baseline;\">機能が含まれ、使用率の最大化と費用の削減に役立ちます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/products/gemini/cloud-assis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Cloud Assist</span></a><span style=\"vertical-align: baseline;\"> を使用して、新しいエージェント ベースのワークフローの運用上の問題をプロアクティブに特定、トラブルシューティング、解決することで、</span><strong style=\"vertical-align: baseline;\">Day 2（2 日目からの）運用を簡素化</strong><span style=\"vertical-align: baseline;\">できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">最後に、</span><a href=\"https://cloud.google.com/solutions/cross-cloud-network\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cross-Cloud Interconnect</span></a><span style=\"vertical-align: baseline;\"> を使用して、</span><strong style=\"vertical-align: baseline;\">ハイブリッド環境とマルチクラウド環境でワークロードを実行</strong><span style=\"vertical-align: baseline;\">できます。Google の 1,000 万キロメートルを超えるプライベート ファイバー バックボーンを活用することで、パブリック インターネット ルーティングよりも最大 40% 高いパフォーマンスがもたらされます。また、自動化されたデリバリーが数分で行われます</span><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">2</span></span><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">動的なインフラストラクチャ、適応型アプリケーション、応答性の高いシステムの統合された基盤を採用することで、組織は、この新しいテクノロジーの最前線をリードするために必要な、復元力に優れた高パフォーマンスのインフラストラクチャを確立できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">3. 選択肢の拡大とセキュリティの強化でデジタル主権を確立</strong></h4>\n<p><span style=\"vertical-align: baseline;\">モダナイゼーション、最先端の AI 機能、規制管理のいずれも妥協すべきではありません。Google の Sovereign Cloud では、3 つの柔軟なデプロイ オプションにより、ソブリン プラットフォーム間で Gemini とオープン ウェイト モデルにアクセスできます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データ主権と制御:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Google Cloud Data Boundary</strong><span style=\"vertical-align: baseline;\"> を使用して、データの場所と暗号化権限を完全に制御できます。Key Access Justifications（KAJ）とともに外部鍵管理（EKM）を使用して、Google インフラストラクチャの外部で暗号鍵を管理しながら、Google Cloud と Google Workspace の両方で地理的な処理とストレージの境界を正確に適用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">地域のコンプライアンスとリージョン オペレーション:</strong><span style=\"vertical-align: baseline;\"> 欧州のお客様向けに </span><strong style=\"vertical-align: baseline;\">Google Cloud Dedicated</strong><span style=\"vertical-align: baseline;\"> で構築され、地域のパートナーが独占的に運用する物理的および論理的に分離されたリージョン クラウドでアプリケーションを実行します。フランスでは、S3NS が PREMI3NS を提供しています。これは、フランス情報システムセキュリティ庁（ANSSI）から SecNumCloud 3.2 認証を取得したスタンドアロン ソブリン クラウドです。Thales が運用する専用のソブリン クラウド オペレーションも、ドイツで近日中に提供される予定です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オンプレミスとエアギャップの柔軟性:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Google Distributed Cloud（GDC）</strong><span style=\"vertical-align: baseline;\">を介して、Google Cloud の機能をオンプレミス環境に直接導入できます。GDC には、2 つの異なるデプロイモードがあります。</span><strong style=\"vertical-align: baseline;\">エアギャップ</strong><span style=\"vertical-align: baseline;\"> モードは、公共部門、防衛、規制対象企業のワークロード向けに、公共のインターネットに接続せずに運用される、フルマネージドの自己完結型環境です。接続モードでは、Google Cloud の一元化されたコントロール プレーンを活用して統合管理を行いながら、独自のハードウェア上でワークロードをローカルに実行できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">クラウドへの移行を加速する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">コア エンタープライズ システムのモダナイズから、複雑なコンプライアンス要件の管理、自律型 AI エージェントのデプロイまで、Google Cloud は、成功に必要なパフォーマンス、スケール、選択の自由を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳しくは、</span><a href=\"https://cloud.google.com/resources/content/2026-gartner-magic-quadrant-strategic-cloud-platform-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 年 Gartner Magic Quadrant 戦略的クラウド プラットフォーム サービス部門</span></a><span style=\"vertical-align: baseline;\"> の全文をご覧いただくか、</span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> のページをご確認ください。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">1. Sundar Pichai、</span></span><a href=\"http://blog.google/innovation-and-ai/sundar-pichai-io-2026/\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\"><span style=\"vertical-align: super;\">I/O 2026: Welcome to the agentic Gemini era（I/O 2026: エージェント型 Gemini の時代へようこそ）</span></span></a><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">The Keyword、Google、2026 年 5 月 19 日</span></span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">2. テストでは、ターゲットへのトラフィックがクロスクラウド ネットワークを経由した場合、パブリック インターネットを経由した場合と比較して、同じターゲットへのトラフィックのネットワーク レイテンシが 40% 以上短縮されました。</span></span></sup></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud Platform、バイス プレジデント兼ゼネラル マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Brad Calder</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">AI およびコンピューティング インフラストラクチャ担当バイス プレジデント兼ゼネラル マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Mark Lohmeyer</strong></p></div>"
  "5bacba571493ef8fd4e1c3a3017cbf6b":
    "id": "5bacba571493ef8fd4e1c3a3017cbf6b"
    "title": "数週間から数分へ: データ パイプラインの新たなエージェント時代"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/build-data-pipelines-in-less-time-with-data-agent-kit/"
    "published": "2026-09-11 01:00:00"
    "fetched": "2026-09-11 17:35:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 9 月 1 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/build-data-pipelines-in-less-time-with-data-agent-kit?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データ パイプラインは現代の企業のバックボーンですが、オーケストレーションには参入障壁があり、多くのデータ専門家がこの重要な機能を利用できない状況にあります。</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/managed-apache-airflow-scaling-data-and-ai-workloads?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud NEXT ’26 での発表</span></a><span style=\"vertical-align: baseline;\">で Orchestration Pipelines フレームワークを紹介したことで、この状況は根本的に変わろうとしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">この強力なフレームワークを実務担当者に直接提供するため、Google は </span><a href=\"https://docs.cloud.google.com/data-cloud-extension\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> を提供しています。これは、データ エンジニアリングとデータ サイエンスのツールを統合した、自由に利用できるオープンソースのコレクションで、お好みの IDE や CLI（VS Code、Claude Code、Codex など）に直接統合できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Data Agent Kit は、</span><a href=\"https://docs.cloud.google.com/orchestration-pipelines/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines</span></a><span style=\"vertical-align: baseline;\"> フレームワークを 2 つの異なる方法でワークフローにシームレスに組み込みます。まず、包括的なパイプライン管理のための専用の [</span><a href=\"https://docs.cloud.google.com/data-agent-kit/build-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">データ エンジニアリング</span></a><span style=\"vertical-align: baseline;\">] タブが用意されています。2 つ目は、自然言語を使用して本番環境グレードの </span><a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Airflow® DAG</span></a><span style=\"vertical-align: baseline;\"> を作成、デプロイ、トラブルシューティングできるように設計された、専門的なエージェント スキルです。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの専門的なエージェント スキルを宣言型の YAML DSL と組み合わせることで、アナリストから ML エンジニアまで、あらゆるデータ担当者が複雑な Python Airflow ボイラープレートを回避できます。このフレームワークは、高レベルのオーケストレーション ロジックを基盤となるコンピューティング実行から切り離し、データ組織全体で強力な MLOps 機能へのアクセスを民主化します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、MLOps の模範的なユースケースを例に、これを簡単に実現する方法を説明します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">環境設定</strong></h4>\n<p><span style=\"vertical-align: baseline;\">最初のオーケストレーション パイプラインを作成する前に、ローカル開発環境を設定する必要があります。2 分もかからずに開始できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 拡張機能をインストールして構成する</strong></p>\n<p><span style=\"vertical-align: baseline;\">VS Code、VS Code フォーク、Antigravity、Claude Code、Antigravity CLI、Codex など、お好みの IDE または CLI に拡張機能をインストールし、Google Cloud アカウントで認証するには、公式ドキュメントの </span><a href=\"https://docs.cloud.google.com/data-cloud-extension/vs-code/install\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Agent Kit インストール ガイド</strong></a><span style=\"vertical-align: baseline;\">に記載されている手順に沿って設定します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. オーケストレーション パイプラインのスキルを確認する</strong></p>\n<p><span style=\"vertical-align: baseline;\">インストールしたら、必要なエージェント スキルが有効になっていることを確認します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">VS Code アクティビティ バーで [</span><strong style=\"vertical-align: baseline;\">Google Cloud Data Agent Kit</strong><span style=\"vertical-align: baseline;\">] パネルを開きます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">設定</strong><span style=\"vertical-align: baseline;\">] &gt; [</span><strong style=\"vertical-align: baseline;\">スキル</strong><span style=\"vertical-align: baseline;\">] の順に移動します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">「</span><strong style=\"vertical-align: baseline;\">gcp-pipelines-orchestration</strong><span style=\"vertical-align: baseline;\">」スキルが有効になっていることを確認します。</span></p>\n</li>\n</ol>\n<p><a href=\"https://github.com/gemini-cli-extensions/data-agent-kit-starter-pack/tree/main/skills/gcp-pipeline-orchestration\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">このスキル</span></a><span style=\"vertical-align: baseline;\">により、エージェントは、パイプライン構文、変数置換、シークレット管理、Airflow 実行の自動インシデント診断に関する深い背景知識を得ることができます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. 最初のパイプラインを構築する</strong></p>\n<p><span style=\"vertical-align: baseline;\">自然言語プロンプトを使用して、VS Code 互換の IDE 内で直接オーケストレーション パイプラインの作成、構築、検証を開始するには、公式の構築ガイド（</span><a href=\"https://docs.cloud.google.com/data-cloud-extension/vs-code/build-pipelines\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">パイプライン構築ガイド</strong></a><span style=\"vertical-align: baseline;\">）をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ビジネス上の問題の例: プロアクティブなサプライ チェーン管理</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ビジネス上の問題の例を見ていきましょう。物流および小売業界では、顧客満足度は正確な配達予定に左右されます。注文が予告なく遅延すると、顧客離れが急増し、サポート費用が膨らむ可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これに対処するため、倉庫の場所、顧客の場所、注文の特性に基づいて正確な配送日数（日数単位）を予測するエンドツーエンドの MLOps アーキテクチャを構築しています。出荷前にこうした遅延を予測することで、運用チームはサービスレベル契約（SLA）に違反する前に、顧客に事前に通知したり、配送レベルを自動的にアップグレードしたりできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このアーキテクチャを完全に再現可能にするため、</span><a href=\"https://docs.cloud.google.com/bigquery/public-data?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery の一般公開データセット</span></a><span style=\"vertical-align: baseline;\">である </span><code style=\"vertical-align: baseline;\">bigquery-public-data.thelook_ecommerce</code><span style=\"vertical-align: baseline;\"> を使用します。デモの目的上、この静的データセットをトレーニング セットと推論セットに分割します。実際のシナリオでは、推論は新たに入ってくるデータに対して行われます。このデータセットは、実際の運用上の複雑さを提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">地理データ:</strong><span style=\"vertical-align: baseline;\"> 顧客の住所（</span><code style=\"vertical-align: baseline;\">users</code><span style=\"vertical-align: baseline;\">）と配送センター（</span><code style=\"vertical-align: baseline;\">distribution_centers</code><span style=\"vertical-align: baseline;\">）の緯度と経度。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">時間データ:</strong><span style=\"vertical-align: baseline;\"> 注文ライフサイクルの詳細なタイムスタンプ（</span><code style=\"vertical-align: baseline;\">created_at</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">shipped_at</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">delivered_at</code><span style=\"vertical-align: baseline;\">）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">注文属性:</strong><span style=\"vertical-align: baseline;\"> 商品カテゴリ、価格、フルフィルメント ステータス（</span><code style=\"vertical-align: baseline;\">orders</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">order_items</code><span style=\"vertical-align: baseline;\">）。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">このデータセットを BigQuery、</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> サーバーレス、</span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.getdbt.com/product/what-is-dbt\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dbt</span></a><span style=\"vertical-align: baseline;\"> と組み合わせることで、トレーニング、毎日のバッチ推論、モデルドリフト評価を処理する、自動化された自己修復型の MLOps ループを構築する方法を実証します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント ワークフロー: プロンプトからパイプラインまで、わずか数分で</strong></h4>\n<p><span style=\"vertical-align: baseline;\">拡張機能を構成すると、DAG 作成用のボイラープレート Python を完全にバイパスできます。VS Code 内で Data Agent Kit チャットを開き、単一の自然言語プロンプトを入力するだけで、継続的な MLOps フィードバック ループを定義しました。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">注:</strong><span style=\"font-style: italic; vertical-align: baseline;\"> 詳細なプロンプトは、このブログ投稿のために、再現性を考慮して作成されました。実際のシナリオでは、パイプラインごとに、より会話調で同じ結果を達成できます。完全なプロンプトと生成されたすべてのファイルは、</span><a href=\"https://github.com/GoogleCloudPlatform/orchestration-pipelines/tree/main/examples/blogpost-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Orchestration-pipelines GitHub リポジトリ</span></a><span style=\"font-style: italic; vertical-align: baseline;\">で入手できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">注:</strong><span style=\"vertical-align: baseline;\"> Orchestration Pipelines スキルを備えたフロンティア モデルは、多くの場合、1 ステップで完全なワークフローを骨組みを作成できますが、LLM のレスポンスは、モデルのバージョン、ワークスペースのコンテキスト、トークンの深さによって当然異なります。最初のパスで特定のパラメータ、データセット パス、依存関係が省略された場合は、短いフォローアップ プロンプトを入力します。</span></p>\n<p><span style=\"vertical-align: baseline;\">数分以内で、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/data-engineering-agent-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> が、基盤となる PySpark スクリプト、dbt 構成、3 つの宣言型 YAML パイプラインを生成しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">生成された YAML パイプラインと、その視覚的な図を以下に示します。このパイプラインは、Orchestration Pipelines の機能を説明するために簡略化した例です。実際には、本番環境の MLOps の推奨設定は、具体的なユースケースや運用上のニーズによって異なります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_XMQ1O65.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">パイプライン 1: トレーニング エンジン</strong></p>\n<p><span style=\"vertical-align: baseline;\">このパイプラインは、高負荷のコンピューティング エンジンとして機能します。エージェントは、まず BigQuery にクエリを実行して過去に完了した注文を抽出する YAML 定義を生成しました。その後、Managed Spark サーバーレス クラスタを動的にプロビジョニングして、地理的な距離を計算し、本番環境で使用するモデルをトレーニングします。最後に、トレーニング済みモデルを Gemini Enterprise Agent Platform Model Registry に push します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;modelVersion: &quot;1.0&quot;\\r\\npipelineId: &quot;training-pipeline&quot;\\r\\nrunner: airflow\\r\\nowner: &quot;mlops&quot;\\r\\ntags:\\r\\n  - &quot;job:datacloud:antigravity&quot;\\r\\ndefaults:\\r\\n  projectId: &quot;your-project-id&quot;\\r\\n  location: &quot;us-central1&quot;\\r\\n  executionConfig:\\r\\n    retries: 0\\r\\n\\r\\nactions:\\r\\n  - sql:\\r\\n      name: &quot;extract_training_data&quot;\\r\\n      engine:\\r\\n        bigquery:\\r\\n          location: &quot;US&quot;\\r\\n          destinationTable: &quot;your-project-id.mlops.training_dataset&quot;\\r\\n      query:\\r\\n        path: &quot;blogpostdemo/training_query.sql&quot;\\r\\n\\r\\n  - pyspark:\\r\\n      name: &quot;train_model_dataproc&quot;\\r\\n      dependsOn:\\r\\n        - &quot;extract_training_data&quot;\\r\\n      engine:\\r\\n        dataprocServerless:\\r\\n          location: &quot;us-central1&quot;\\r\\n          resourceProfile:\\r\\n            inline:\\r\\n              runtimeConfig:\\r\\n                version: &quot;2.3&quot;\\r\\n                properties:\\r\\n                  &quot;spark.dataproc.driverEnv.PYTHONPATH&quot;: &quot;./libs/lib/python3.11/site-packages&quot;\\r\\n                  &quot;spark.executorEnv.PYTHONPATH&quot;: &quot;./libs/lib/python3.11/site-packages&quot;\\r\\n      mainFilePath: &quot;blogpostdemo/train_model.py&quot;\\r\\n      environment:\\r\\n        requirements:\\r\\n          inline:\\r\\n            list:\\r\\n              - &quot;tensorflow==2.14.1&quot;\\r\\n              - &quot;numpy&lt;2.0.0&quot;\\r\\n              - &quot;protobuf&lt;5.0.0dev&quot;\\r\\n              - &quot;google-cloud-storage&quot;\\r\\n\\r\\n  - ai:\\r\\n      name: &quot;upload_model_vertex&quot;\\r\\n      dependsOn:\\r\\n        - &quot;train_model_dataproc&quot;\\r\\n      agentPlatform:\\r\\n        projectId: &quot;your-project-id&quot;\\r\\n        location: &quot;us-central1&quot;\\r\\n        modelUpload:\\r\\n          modelName: &quot;transit_days_predictor&quot;\\r\\n          modelArtifactUri: &quot;gs://your-bucket-name/models/tf_transit_days_model&quot;\\r\\n          servingContainerImageUri: &quot;us-docker.pkg.dev/vertex-ai/prediction/tf2-cpu.2-14:latest&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0929205150&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">パイプライン 2: 日次推論</strong></p>\n<p><span style=\"vertical-align: baseline;\">日々の運用ワークフローでは、この軽量なパイプラインが、トレーニング済みのモデルを現在配送中のすべての注文に適用します。BigQuery ジョブを介してデータセットをクエリし、Gemini Enterprise Agent Platform を介して推論ジョブを実行し、結果を BigQuery テーブルに書き戻して、カスタマー サポート チームに SLA 違反の可能性を通知します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;modelVersion: &quot;1.0&quot;\\r\\npipelineId: &quot;inference-pipeline&quot;\\r\\nrunner: airflow\\r\\nowner: &quot;mlops&quot;\\r\\ntags:\\r\\n  - &quot;job:datacloud:antigravity&quot;\\r\\ndefaults:\\r\\n  projectId: &quot;your-project-id&quot;\\r\\n  location: &quot;us-central1&quot;\\r\\n  executionConfig:\\r\\n    retries: 0\\r\\n\\r\\nactions:\\r\\n  - sql:\\r\\n      name: &quot;extract_inference_data&quot;\\r\\n      engine:\\r\\n        bigquery:\\r\\n          location: &quot;US&quot;\\r\\n          destinationTable: &quot;your-project-id.mlops.inference_dataset&quot;\\r\\n      query:\\r\\n        path: &quot;blogpostdemo/inference_query.sql&quot;\\r\\n\\r\\n  - ai:\\r\\n      name: &quot;run_vertex_batch_prediction&quot;\\r\\n      dependsOn:\\r\\n        - &quot;extract_inference_data&quot;\\r\\n      agentPlatform:\\r\\n        projectId: &quot;your-project-id&quot;\\r\\n        location: &quot;us-central1&quot;\\r\\n        batchInference:\\r\\n          jobDisplayName: &quot;inference_job&quot;\\r\\n          modelName: &quot;projects/your-project-id/locations/us-central1/models/your-model-id&quot;\\r\\n          bigquerySource: &quot;bq://your-project-id.mlops.inference_dataset&quot;\\r\\n          bigqueryDestinationPrefix: &quot;bq://your-project-id.mlops&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0938485e90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">パイプライン 3: 自動評価と分岐</strong></p>\n<p><span style=\"vertical-align: baseline;\">日次評価パイプラインは、自動品質ゲートとして機能します。dbt モデルをトリガーして予測を実際の配送タイムスタンプと結合し、絶対誤差と SLA 違反を計算します。</span></p>\n<p><span style=\"vertical-align: baseline;\">パイプラインは、組み込みのロジックを使用して、これらの指標を自動的に評価します。モデルのエラー率が許容しきい値を超えた場合、条件に応じて「training-pipeline」がトリガーされ、新しいモデルが生成されます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;modelVersion: &quot;1.0&quot;\\r\\npipelineId: &quot;evaluation-pipeline&quot;\\r\\nrunner: airflow\\r\\nowner: &quot;mlops&quot;\\r\\ntags:\\r\\n  - &quot;job:datacloud:antigravity&quot;\\r\\ndefaults:\\r\\n  projectId: &quot;your-project-id&quot;\\r\\n  location: &quot;us-central1&quot;\\r\\n  executionConfig:\\r\\n    retries: 0\\r\\n\\r\\nactions:\\r\\n  - pipeline:\\r\\n      name: &quot;run_dbt_models&quot;\\r\\n      framework:\\r\\n        dbt:\\r\\n          airflowWorker:\\r\\n            projectDirectoryPath: &quot;blogpostdemo/dbt_project&quot;\\r\\n\\r\\n  - python:\\r\\n      name: &quot;check_retraining_condition&quot;\\r\\n      dependsOn:\\r\\n        - &quot;run_dbt_models&quot;\\r\\n      mainFilePath: &quot;blogpostdemo/evaluate_drift.py&quot;\\r\\n      pythonCallable: &quot;check_drift&quot;\\r\\n      engine:\\r\\n        local: {}\\r\\n\\r\\n  - orchestrationPipeline:\\r\\n      name: &quot;trigger_retraining_pipeline&quot;\\r\\n      dependsOn:\\r\\n        - &quot;check_retraining_condition&quot;\\r\\n      pipelineId: &quot;training-pipeline&quot;\\r\\n      bundleId: &quot;my-first-bundle&quot;\\r\\n      waitForCompletion: false&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0938487e10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Managed Service for Apache Airflow への自動デプロイ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">パイプライン ロジックの作成は、作業の半分にすぎません。本番環境に安全かつ確実にデプロイする段階で、データチームはこれまで貴重な時間を失ってきました。</span></p>\n<p><a href=\"https://docs.cloud.google.com/orchestration-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines</span></a><span style=\"vertical-align: baseline;\"> を使用すると、標準的な CI / CD プラクティスを通じてデプロイが合理化されます。デプロイ スクリプトを手動で作成したり、複雑な環境境界を構成したりする必要はありません。Data Agent Kit が、ワークスペースに必要な継続的インテグレーション ワークフロー（GitHub Actions など）を自動的に生成します。</span></p>\n<p><span style=\"vertical-align: baseline;\">つまり、commit をクリックするだけで、フレームワークが Orchestration Pipelines Bundle をシームレスにパッケージ化し、Managed Airflow 環境に直接デプロイします。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの自動化されたワークフローを既存の CI / CD パイプラインに統合するための包括的なガイドについては、公式ガイド「</span><a href=\"https://docs.cloud.google.com/orchestration-pipelines/deploy-orchestration-pipelines#deploy-run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines のデプロイ</span></a><span style=\"vertical-align: baseline;\">」をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Day 2（2 日目からの）運用: モニタリングとエージェントによるトラブルシューティング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これらのパイプラインのメンテナンスは、構築と同じくらい直感的に行えます。Data Agent Kit は、オーケストレーション コントロール プレーンを IDE に直接組み込むことで、ブラウザタブを頻繁に切り替えることなく、Managed Airflow の実行をリアルタイムでモニタリングできるようにします。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_6wcKwIA.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Data Agent Kit を使用すると、IDE 内で直接、Managed Airflow の実行をリアルタイムでモニタリングできます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_qAVdnpZ.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Data Agent Kit が、作成されたパイプラインを可視化します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">インフラストラクチャやデータの問題は避けられません。たとえば、季節的なデータの急増により Managed Spark クラスタでメモリ不足の例外が発生したり、BigQuery の割り当ての上限に達したりすることがあります。これらの問題を解決するために、何千行もの未加工の実行ログを調べる必要はもうありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">パイプラインが失敗した場合、Data Agent Kit はすぐに使えるエージェント型トラブルシューティングを提供します。IDE で [トラブルシューティング] ボタンをクリックするだけで、データ エンジニアリング エージェントが失敗のコンテキストを分析します。インフラストラクチャの割り当て上限とコードレベルのバグを正確に区別し、根本原因の概要を即座に提供して、インライン修正（コンピューティング テンプレートのスケールアップなど）を提案します。</span></p>\n<p> </p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_tCCNsgc.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>エージェント型トラブルシューティングにより、パイプラインの障害を即座に診断し、インフラストラクチャのボトルネックを特定して、インライン修正を提案します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">まとめ: 価値創出までの時間を短縮</strong></h4>\n<p><span style=\"vertical-align: baseline;\">レジリエントな MLOps アーキテクチャの構築（過去のデータの抽出、dbt 変換の実行、Managed Spark ML コンピューティングのプロビジョニング、モデル レジストリと推論のための Gemini Enterprise Agent Platform のインテグレーション、DAG 間の条件付きトリガーの構成）には、従来、プラットフォーム エンジニアリング チームが複雑な Python Operator ロジックを記述するのに数週間かかっていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Orchestration Pipelines と Data Agent Kit を使用することで、このライフサイクル全体を数分で作成、デプロイ、簡単にメンテナンスできました。ボイラープレート インフラストラクチャ コードを、宣言型の、エージェント対応の標準に置き換えることで、データ組織がパイプラインのオーケストレーションに費やす時間を減らし、具体的なビジネス価値の創出に多くの時間を割けるようにしています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">使ってみる:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/orchestration-pipelines/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Orchestration Pipelines のドキュメント</span></a><span style=\"vertical-align: baseline;\">を確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">お好みの IDE または CLI に </span><a href=\"https://docs.cloud.google.com/data-agent-kit\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> をインストールし、ワークスペースを構成する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エコシステム全体の詳細については、最近のブログ投稿「</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/data-agent-kit-brings-data-skills-and-tools-to-your-ide-or-cli?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit は IDE または CLI にデータ処理のスキルとツールを提供</span></a><span style=\"vertical-align: baseline;\">」を確認する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/data-cloud-extension/vs-code/train-models\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit のドキュメント</span></a><span style=\"vertical-align: baseline;\">でリファレンス アーキテクチャを確認する。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">リード プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Piotr Wieczorek</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Alexandre Moueddene</strong></p></div>"
