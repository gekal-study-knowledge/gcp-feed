"overview": |
  この日は 7 件で、API とデータ基盤の機能拡張、経営陣による事業戦略の説明、そして Gartner による評価が並びました。リリースノートでは、API Gateway がリモートの Model Context Protocol (MCP) サーバーとして振る舞えるようになり (パブリックプレビュー)、OpenAPI 3.x 仕様を Google 独自の拡張でアノテーションするだけで、バックエンドを変更せずに既存の REST API を AI エージェント向けのツールとして公開できます。AlloyDB for PostgreSQL では、インスタンスとノードの監査ログパイプラインの状態・スループット・バックログを Cloud Monitoring で監視できるようになりました。Cluster Toolkit に影響する Slurm の複数の脆弱性も修正されています。Google Cloud ブログでは、Thomas Kurian が Goldman Sachs のテクノロジーカンファレンスで Google Cloud の事業戦略を語り、AI スタック全体を提供する唯一のプロバイダーとしての立ち位置、10 億ドル超の売上を持つ製品ラインが 17、AI サーバーの投資回収期間が 2 年で TPU は GPU より速く回収できること、1 億〜10 億ドル規模の契約が四半期・前年比ともに 2 倍以上に伸びていることなどが紹介されました。日本語ブログ (抄訳) では、Google が 2026 年 Gartner Magic Quadrant の戦略的クラウドプラットフォームサービス部門で 9 年連続のリーダーに選出され、「ビジョンの完全性」で最高評価を獲得したことが報告されています。開発者向けには、JVM と Android の両方をターゲットにした Kotlin マルチプラットフォームの Google Gen AI SDK for Kotlin が 1.0 に到達し、Gemini Developer API と Gemini Enterprise Agent Platform を統一したインターフェースで扱えるようになりました。BigQuery では、連続する 64 ビット整数を自動生成する ID 列が発表され、取り込み前にアプリケーション側で一意キーを計算する必要がなくなり、データパイプラインの複雑さを軽減します。前週に紹介された Data Agent Kit によるデータパイプラインのエージェント化についても、日本語訳記事として改めて掲載されました。
