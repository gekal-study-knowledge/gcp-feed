    "id": "079a39d778931cedebc0ea6d89754329"
    "title": "Bringing Rust to the Pixel Baseband"
    "link": "http://security.googleblog.com/2026/04/bringing-rust-to-pixel-baseband.html"
    "published": "2026-04-11 00:12:00"
    "fetched": "2026-08-27 21:31:32"
    "summary": "<span class=\"byline-author\">Posted by Jiacheng Lu, Software Engineer, Google Pixel Team</span>\n\n<p>Google is continuously advancing the security of Pixel devices. We have been focusing on hardening the cellular baseband modem against exploitation. <a href=\"https://security.googleblog.com/2023/12/hardening-cellular-basebands-in-android.html\">Recognizing the risks</a> associated within the complex modem firmware, Pixel 9 shipped with <a href=\"https://security.googleblog.com/2024/10/pixel-proactive-security-cellular-modems.html\">mitigations</a> against a range of memory-safety vulnerabilities. For Pixel 10, Google is advancing its proactive security measures further. Following our previous discussion on <a href=\"https://security.googleblog.com/2024/09/deploying-rust-in-existing-firmware.html\">\"Deploying Rust in Existing Firmware Codebases\"</a>, this post shares a concrete application: integrating a memory-safe Rust DNS(Domain Name System) parser into the modem firmware. The new Rust-based DNS parser significantly reduces our security risk by mitigating an entire class of vulnerabilities in a risky area, while also laying the foundation for broader adoption of memory-safe code in other areas.</p>\n\n<p>Here we share our experience of working on it, and hope it can inspire the use of more memory safe languages in low-level environments.</p>\n\n<h3>Why Modem Memory Safety Can’t Wait</h3>\n<p>In recent years, we have seen increasing interest in the cellular modem from attackers and security researchers. For example, Google's Project Zero <a href=\"https://googleprojectzero.blogspot.com/2023/03/multiple-internet-to-baseband-remote-rce.html\">gained remote code execution</a> on Pixel modems over the Internet. Pixel modem has tens of Megabytes of executable code. Given the complexity and remote attack surface of the modem, other critical memory safety vulnerabilities may remain in the predominantly memory-unsafe firmware code.</p>\n\n<h3>Why DNS?</h3>\n<p>The DNS protocol is most commonly known in the context of browsers finding websites. With the evolution of cellular technology, modern cellular communications have migrated to digital data networks; consequently, even basic operations such as call forwarding rely on DNS services.</p>\n\n<p>DNS is a complex protocol and requires parsing of untrusted data, which can lead to vulnerabilities, particularly when implemented in a memory-unsafe language (example: <a href=\"https://nvd.nist.gov/vuln/detail/cve-2024-27227\">CVE-2024-27227</a>). Implementing the DNS parser in Rust offers value by decreasing the attack surfaces associated with memory unsafety.</p>\n\n<h3>Picking a DNS library</h3>\n<p>DNS already has a level of support in the open-source Rust community. We evaluated multiple open source crates that implement DNS. Based on <a href=\"https://security.googleblog.com/2024/09/deploying-rust-in-existing-firmware.html#:~:text=Existing%20Crate\">criteria shared in earlier posts</a>, we identified <a href=\"https://crates.io/crates/hickory-proto\">hickory-proto</a> as the best candidate. It has excellent maintenance, over 75% test coverage, and widespread adoption in the Rust community. Its pervasiveness shows its potential as the de-facto DNS choice and long term support. Although hickory-proto initially lacked <code>no_std</code> support, which is needed for Bare-metal environments (see our <a href=\"https://security.googleblog.com/2024/09/deploying-rust-in-existing-firmware.html#:~:text=Bare%2Dmetal%20Environments\">previous post</a> on this topic), we were able to add support to it and its dependencies.</p>\n\n<h2>Adding <code>no_std</code> support</h2>\n<p>The work to enable <code>no_std</code> for hickory-proto is mostly mechanical. We shared the process <a href=\"https://security.googleblog.com/2024/09/deploying-rust-in-existing-firmware.html#:~:text=Porting%20a%20std%20Library%20to%20no_std\">in a previous post</a>. We undertook modifications to hickory_proto and its dependencies to enable <code>no_std</code> support. The upstream <code>no_std</code> work also results in a <code>no_std</code> URL parser, beneficial to other projects.</p>\n\n<ul>\n  <li><a href=\"https://github.com/hickory-dns/hickory-dns/pull/2104\">https://github.com/hickory-dns/hickory-dns/pull/2104</a></li>\n  <li><a href=\"https://github.com/servo/rust-url/pull/831\">https://github.com/servo/rust-url/pull/831</a></li>\n  <li><a href=\"https://github.com/krisprice/ipnet/pull/58\">https://github.com/krisprice/ipnet/pull/58</a></li>\n</ul>\n\n<p>The above PRs are great examples of how to extend <code>no_std</code> support to existing std-only crates.</p>\n\n<h2>Code size study</h2>\n<p>Code size is the one of the factors that we evaluated when picking the DNS library to use.</p>\n\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse: collapse; width: 100%;\">\n  <tbody>\n    <tr>\n      <td rowspan=\"3\" style=\"width: 25%;\">Code size<br />by category</td>\n      <td>Rust implemented Shim that calls Hickory-proto on receiving a DNS response</td>\n      <td style=\"width: 15%;\">4KB</td>\n    </tr>\n    <tr>\n      <td>core, alloc, compiler_builtins<br />(reusable, one-time cost)</td>\n      <td>17KB</td>\n    </tr>\n    <tr>\n      <td>Hickory-proto library and dependencies</td>\n      <td>350KB</td>\n    </tr>\n  </tbody>\n</table>\n\n<br />\n<hr style=\"border: 0; border-top: 2px solid #f0f0f0;\" />\n<br />\n\n<table border=\"1\" cellpadding=\"8\" cellspacing=\"0\" style=\"border-collapse: collapse; width: 100%;\">\n  <tbody>\n    <tr>\n      <td style=\"width: 25%;\">Sum</td>\n      <td></td>\n      <td style=\"width: 15%;\">371KB</td>\n    </tr>\n  </tbody>\n</table>\n\n\n<p>We built prototypes and measured size with <a href=\"https://security.googleblog.com/2024/09/deploying-rust-in-existing-firmware.html#:~:text=Build%20Optimizations\">size-optimized settings</a>. Expectedly, <code>hickory_proto</code> is not designed with embedded use in mind, and is not optimized for size. As the Pixel modem is not tightly memory constrained, we prioritized community support and code quality, leaving code size optimizations as future work.</p>\n\n<p>However, the additional code size may be a blocker for other embedded systems. This could be addressed in the future by adding additional feature flags to conditionally compile only required functionality. Implementing this modularity would be a valuable future work.</p>\n\n<h3>Hook-up Rust to modem firmware</h3>\n<p>Before building the Rust DNS library, we defined several Rust unit tests to cover basic arithmetic, dynamic allocations, and <a href=\"https://doc.rust-lang.org/nomicon/ffi.html\"><code>FFI</code></a> to verify the integration of Rust with the existing modem firmware code base.</p>\n\n<h2>Compile Rust code to staticlib</h2>\n<p>While using <code>cargo</code> is the default choice for compilation in the Rust ecosystem, it <a href=\"https://security.googleblog.com/2021/05/integrating-rust-into-android-open.html#:~:text=No%20nested%20build%20systems\">presents challenges</a> when integrating it into existing build systems. We evaluated two options:</p>\n\n<ol>\n  <li>Using <code>cargo</code> to build a <a href=\"https://doc.rust-lang.org/beta/rustc/command-line-arguments.html#--crate-type-a-list-of-types-of-crates-for-the-compiler-to-emit\"><code>staticlib</code></a> before the modem builds. Then add the produced staticlib into the linking step.</li>\n  <li>Directly work with <code>rustc</code> and integrate the Rust compilation steps into the existing modem build system.</li>\n</ol>\n\n<p>Option #1 does not scale if we are going to add more Rust components in the future, as linking multiple staticlibs may cause <a href=\"https://github.com/rust-lang/rust/issues/44322\">duplicated symbol errors</a>. We chose option #2 as it scales more easily and allows tighter integration into our existing build system. Our existing C/C++ codebase uses <a href=\"https://pigweed.dev/\">Pigweed</a> to drive the primary build system. Pigweed supports Rust targets (<a href=\"https://cs.opensource.google/pigweed/pigweed/+/main:pw_build/rust_library.gni;drc=87f7abc323e345dd2729d5039a7ee0ee49c2fd56\">example</a>) with direct calls to <a href=\"https://cs.opensource.google/pigweed/pigweed/+/main:pw_toolchain/generate_toolchain.gni;l=415;drc=e194c83f1d063833745f49da8f85b583be9774bb\"><code>rustc</code></a> through <a href=\"https://gn.googlesource.com/gn/+/main/docs/reference.md#buildfile-functions-tool_specify-arguments-to-a-toolchain-tool_back-to-top-usage\"><code>rust tools</code> defined in <code>GN</code></a>.</p>\n\n<p>We compiled all the Rust crates, including hickory-proto, its dependencies, and core, compiler_builtin, alloc, to <a href=\"https://doc.rust-lang.org/reference/linkage.html#r-link.rlib\"><code>rlib</code></a>. Then, we created a <code>staticlib</code> target with a single lib.rs file which references all the <a href=\"https://doc.rust-lang.org/reference/linkage.html#r-link.rlib\"><code>rlib</code></a> crates using <a href=\"https://doc.rust-lang.org/std/keyword.crate.html\"><code>extern crate</code></a> keywords.</p>\n\n<h2>Build core, alloc, and compiler_builtins</h2>\n<p><a href=\"https://android.googlesource.com/toolchain/android_rust/+/mirror-goog-main-rust-toolchain-source\">Android’s Rust Toolchain</a> distributes source code of <code>core</code>, <code>alloc</code>, and <code>compiler_builtins</code>, and we leveraged this for the modem. They can be included to the build graph by adding a <code>GN</code> target with <a href=\"https://gn.googlesource.com/gn/+/main/docs/reference.md#var_crate_root\"><code>crate_root</code></a> pointing to the root <code>lib.rs</code> of each crate.</p>\n\n<p>Pixel modem firmware already has a well-tested and specialized global memory allocation system to support some dynamic memory allocations. <code>alloc</code> support was added by implementing the <a href=\"https://doc.rust-lang.org/alloc/alloc/trait.GlobalAlloc.html\">GlobalAlloc</a> with <a href=\"https://doc.rust-lang.org/nomicon/ffi.html\">FFI</a> calls to the allocators C APIs:</p>\n\n<pre><code class=\"language-rust\">use core::alloc::{GlobalAlloc, Layout};\n\nextern \"C\" {\n    fn mem_malloc(size: usize, alignment: usize) -&gt; *mut u8;\n    fn mem_free(ptr: *mut u8, alignment: usize);\n}\n\nstruct MemAllocator;\n\nunsafe impl GlobalAlloc for MemAllocator {\n    unsafe fn alloc(&amp;self, layout: Layout) -&gt; *mut u8 {\n        mem_malloc(layout.size(), layout.align())\n    }\n\n    unsafe fn dealloc(&amp;self, ptr: *mut u8, layout: Layout) {\n        mem_free(ptr, layout.align());\n    }\n}\n\n#[global_allocator]\nstatic ALLOCATOR: MemAllocator = MemAllocator;\n</code></pre>\n\n<p>Pixel modem firmware already implements a backend for the Pigweed <a href=\"https://pigweed.dev/pw_assert/#backend-api\">crash facade</a> as the global crash handler. Exposing it into Rust <code>panic_handler</code> through FFI unifies the crash handling for both Rust and C/C++ code.</p>\n\n<pre><code class=\"language-rust\">#![no_std]\nuse core::panic::PanicInfo;\n\nextern \"C\" {\n    pub fn PwCrashBackend(sigature: *const i8, file_name: *const i8, line: u32);\n}\n\n#[panic_handler]\nfn panic(panic_info: &amp;PanicInfo) -&gt; ! {\n    let mut filename = \"\";\n    let mut line_number: u32 = 0;\n\n    if let Some(location) = panic_info.location() {\n        filename = location.file();\n        line_number = location.line();\n    }\n\n    let mut cstr_buffer = [0u8; 128];\n    // Never writes to the last byte to make sure `cstr_buffer` is always zero\n    // terminated.\n    let (_, writer) = cstr_buffer.split_last_mut().unwrap();\n    for (place, ch) in writer.iter_mut().zip(filename.bytes()) {\n        *place = ch;\n    }\n\n    unsafe {\n        PwCrashBackend(\n            \"Rust panic\\0\".as_ptr() as *const i8,\n            cstr_buffer.as_ptr() as *const i8,\n            line_number,\n        );\n    }\n\n    loop {}\n}\n</code></pre>\n\n<h2>Link Rust staticlib</h2>\n<p>The Pixel modem firmware linking has a step that calls the linker to link all the objects generated from C/C++ code. By using <code>llvm-ar -x</code> to extract object files from the Rust combined staticlib and supplying them to the linker, the Rust code appears in the final modem image.</p>\n\n<p>There was a performance issue we experienced due to weak symbols during linking. The inclusion of Rust <code>core</code> and <code>compiler-builtin</code> caused unexpected power and performance regressions on various tests. Upon analysis, we realized that modem optimized implementations of <code>memset</code> and <code>memcpy</code> provided by the modem firmware are accidentally replaced by those defined in <code>compiler_builtin</code>. It seems to happen because both <code>compiler_builtin</code> crate and the existing codebase defines symbols as weak, linker has no way to figure out which one is weaker. We fixed the regression by stripping the <code>compiler_builtin</code> crate before linking using a one line shell script.</p>\n\n<pre><code class=\"language-bash\">llvm-ar -t &lt;rust staticlib&gt; | grep compiler_builtins | xargs llvm-ar -d &lt;rust staticlib&gt;\n</code></pre>\n\n<h3>Integrating hickory-proto</h3>\n\n<h2>Expose Rust API and calling back to C++</h2>\n<p>For the DNS parser, we declared the DNS response parsing API in C and then implemented <a href=\"https://security.googleblog.com/2024/09/deploying-rust-in-existing-firmware.html#:~:text=Exposing%20the%20Same%20API\">the same API</a> in Rust.</p>\n\n<pre><code class=\"language-c\">int32_t process_dns_response(uint8_t*, int32_t);\n</code></pre>\n\n<p>The Rust function returns an integer standing for the error code. The received DNS answers in the DNS response are required to be updated to in-memory data structures that are coupled with the original C implementation, therefore, we use existing C functions to do it. The existing C functions are dispatched from the Rust implementation.</p>\n\n<pre><code class=\"language-rust\">pub unsafe extern \"C\" fn process_dns_response(\n    dns_response: *const u8,\n    response_len: i32,\n) -&gt; i32 {\n    //... validate inputs `dns_response` and `response_len`.\n\n\n    // SAFETY:\n    // It is safe because `dns_response` is null checked above. `response_len`\n    // is passed in, safe as long as it is set correctly by vendor code.\n    match process_response(unsafe {\n        slice::from_raw_parts(dns_response, response_len)\n    }) {\n         Ok(()) =&gt; 0,\n         Err(err) =&gt; err.into(),\n    }\n}\n\nfn process_response(response: &amp;[u8]) -&gt; Result&lt;()&gt; {\n    let response = hickory_proto::op::Message::from_bytes(response)?;\n    let response = hickory_proto::xfer::DnsResponse::from_message(response)?;\n\n   \n    for answer in response.answers() {  \n        match answer.record_type() {\n            hickory_proto::RecordType:... =&gt; {\n                // SAFETY:\n                // It is safe because the callback function does not store\n                // reference of the inputs or their members.\n                unsafe {\n                    callback_to_c_function(...)?;\n                }\n            }\n            \n            // ... more match arms omitted.\n        }    \n    }\n\n    Ok(())\n}\n</code></pre>\n\n<p>In our case, the DNS responding parsing function API is simple enough for us to hand write, while the callbacks back to C functions for handling the response have complex data type conversions. Therefore, we leveraged bindgen to generate FFI code for the callbacks.</p>\n\n<h2>Build third-party crates</h2>\n<p>Even with all features disabled, hickory-proto introduces more than 30 dependent crates. Manually written build rules are difficult to ensure correctness and scale poorly when upgrading dependencies into new versions.</p>\n\n<p>Fuchsia has developed <a href=\"https://fuchsia.googlesource.com/fuchsia/+/master/tools/cargo-gnaw/\"><code>cargo-gnaw</code></a> to support building their third party Rust crates. <code>Cargo-gnaw</code> works by invoking <code>cargo metadata</code> to resolve dependencies, then parse and generate GN build rules. This ensures correctness and ease of maintenance.</p>\n\n<h3>Conclusion</h3>\n<p>The Pixel 10 series of phones marks a pivotal moment, being the first Pixel device to integrate a memory-safe language into its modem.</p>\n\n<p>While replacing one piece of risky attack surface is itself valuable, this project lays the foundation for future integration of memory-safe parsers and code into the cellular baseband, ensuring the baseband’s security posture will <a href=\"https://security.googleblog.com/2024/09/eliminating-memory-safety-vulnerabilities-Android.html#:~:text=Final%20thoughts\">continue to improve</a> as development continues.</p>\n\n\n<i>Special thanks to Armando Montanez, Bjorn Mellem, Boky Chen, Cheng-Yu Tsai, Dominik Maier, Erik Gilling, Ever Rosales, Hungyen Weng, Ivan Lozano, James Farrell, Jeffrey Vander Stoep, Jiacheng Lu, Jingjing Bu, Min Xu, Murphy Stein, Ray Weng, Shawn Yang, Sherk Chung, Stephan Chen, Stephen Hines.</i>"
