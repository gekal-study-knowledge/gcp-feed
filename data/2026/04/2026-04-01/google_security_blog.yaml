    "id": "48c757ffeaeb5a4f85dd54f3a9ddea8b"
    "title": "VRP 2025 Year in Review"
    "link": "http://security.googleblog.com/2026/03/vrp-2025-year-in-review.html"
    "published": "2026-04-01 01:55:00"
    "fetched": "2026-08-27 21:31:32"
    "summary": "<span class=\"byline-author\">Posted by Dirk G<span id=\"docs-internal-guid-d358e087-7fff-fbc1-ad5b-f4611deb13fd\"><span>ö</span></span>hmann, Tony Mendez, and the Vulnerability Rewards Program Team</span><div><br /></div><div><span id=\"docs-internal-guid-e5678dfe-7fff-d249-7b65-54368d4d1d26\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">2025 marked a special year in the history of vulnerability rewards and bug bounty programs at Google: our 15th anniversary \U0001F389\U0001F389\U0001F389! Originally </span><a href=\"https://security.googleblog.com/2010/11/rewarding-web-application-security.html\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">started in 2010</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">, our vulnerability reward program (VRP) has seen constant additions and expansions over the past decade and a half, clearly indicating the value the programs under this umbrella contribute to the safety and security of Google and its users, but also highlighting their acceptance by the external research community, without which such programs cannot function.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Coming back to 2025 specifically, </span><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">our VRP once again confirmed the ongoing value of engaging with the external security research community to make Google and its products safer. This was more evident than ever as we awarded over $17 million (an all-time high and more than 40% increase compared to 2024!) to over 700 researchers based in countries around the globe – across all of our </span><a href=\"https://bughunters.google.com/about/rules/6744710187712512\"><span face=\"Roboto, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">programs</span></a><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">Vulnerability Reward Program 2025 in Numbers</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 325px; overflow: hidden; width: 624px;\"><img height=\"325\" src=\"https://blogger.googleusercontent.com/img/a/AVvXsEh4f4eq7KpfHZxrNvb08fx7A4iJ3tFNiswEbM2-JTtXnRO9qvfX9dFt90AssIvZOKptg0SQ-VX-OumTdUN-CHh14404zFzVVbmefnhtlhAxOZznVpiJqSs8bE6jSPZTNKQvXynkRfEBCPVIjZBCLxNv8B9mSNaVyk-hkiBwAGctb3zdNYvMuYspYYYELV94\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"624\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><span style=\"border: none; display: inline-block; height: 325px; overflow: hidden; width: 624px;\"><img height=\"325\" src=\"https://blogger.googleusercontent.com/img/a/AVvXsEgGtC4Y3A9XYgEgcADot1ctILon6Ttq0xNlFcY4esoeeGNTxkjwUDfuZEfy4fNip4Q2BHqBvOgKmGXAZ_QRrJGNZ7nl6KV7VcfJPnXdpFRAABCugHNpfb4dgU1z4b4UOdBdjAZpw_NlOe5IQdNMEWPTGbM0VvTj__WZMyH4jhPyGymX-OIrfPTqx2Nc2686\" style=\"margin-left: 0px; margin-top: 0px;\" width=\"624\" /></span></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Want to learn more about who’s reporting to the VRP? Check out our </span><a href=\"https://bughunters.google.com/leaderboard\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Leaderboard</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> on the </span><a href=\"https://bughunters.google.com/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Google Bug Hunters site</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">VRP Highlights in 2025</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">In 2025 we made a series of changes and improvements to our VRP and related initiatives, and continued to invest in the security research community through a series of focused events:</span></p><br /><ul style=\"margin-bottom: 0px; margin-top: 0px; padding-inline-start: 48px;\"><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">The new, dedicated AI VRP was </span><a href=\"https://bughunters.google.com/blog/6116887259840512/announcing-google-s-new-ai-vulnerability-reward-program\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">launched</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\">, underscoring the importance of this space to Google and its relevance for external researchers. Previously organized as a part of the Abuse VRP, moving into a dedicated VRP has gone hand in hand with improvements to the rules, offering researchers more clarity on scope and reward amounts.</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">Similarly, the Chrome VRP now also includes reward categories for problems found in </span><a href=\"https://bughunters.google.com/about/rules/chrome-friends/5745167867576320/chrome-vulnerability-reward-program-rules#gemini-ai-vulnerabilities\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">AI features</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\">.</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">We </span><a href=\"https://bughunters.google.com/blog/6551590643040256/new-patch-rewards-program-for-osv-scalibr\"><span style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">launched</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\"> a patch rewards program for OSV-SCALIBR, Google's open source tool for finding vulnerabilities in software dependencies. Contributors are rewarded for providing novel OSV-SCALIBR plugins for inventory, vulnerability, or secret detection that expand the tool’s scanning capabilities. Besides strengthening the tool’s capabilities for all users, user submissions already helped us uncover and remediate a number of leaked secrets internally!</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">As part of Google's Cybersecurity Awareness Month campaign in October, we hosted our very own </span><a href=\"https://bughunters.google.com/blog/6489680025550848/escal8-2025-gathering-cybersecurity-expertise-in-mexico-city\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">security conference in Mexico City, ESCAL8</span></a><span style=\"font-size: 11pt; vertical-align: baseline;\">. The conference included init.g(mexico), our cybersecurity workshop for students, HACKCELER8, Google’s CTF finals, and a </span><span style=\"font-size: 11pt; font-style: italic; vertical-align: baseline;\">Safer with Google</span><span style=\"font-size: 11pt; vertical-align: baseline;\"> seminar, sharing technical thought leadership with Mexican government officials.&nbsp;</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span style=\"font-size: 11pt; vertical-align: baseline;\">bugSWAT, </span><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">our special invite-only live hacking event, saw several editions in 2025 and</span><span style=\"font-size: 11pt; vertical-align: baseline;\"> </span><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">delivered some outstanding findings across different areas:</span></p></li><ul style=\"margin-bottom: 0px; margin-top: 0px; padding-inline-start: 48px;\"><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">We hosted our first dedicated </span><a href=\"https://bughunters.google.com/blog/5753079171252224/ai-bugswat-in-tokyo-2025-hacker-roadshow\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">AI bugSWAT (Tokyo) in April</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> which yielded a whopping 70+ reports filed and over $400,000 in rewards issued.&nbsp;</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">We continued the momentum in early summer with </span><a href=\"https://bughunters.google.com/blog/hardening-google-cloud-insights-from-the-latest-cloud-vrp-bugswat\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Cloud bugSWAT (Sunnyvale) in June</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> resulting in 130 reports, with $1,600,000 in rewards paid out.</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Next in line was bugSWAT Las Vegas in August, leading to 77 reports and rewards of $380,000.&nbsp;</span></p></li><li dir=\"ltr\" style=\"font-family: Roboto, sans-serif; font-size: 11pt; vertical-align: baseline; white-space: pre;\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">And finally, as part of ESCAL8 in Mexico City, </span><a href=\"https://bughunters.google.com/blog/6489680025550848/escal8-2025-gathering-cybersecurity-expertise-in-mexico-city#bugswat-hacking-for-a-safer-internet\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">bugSWAT Mexico</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> focused on many different targets and spaces including AI, Android, and Cloud, and resulted in the filing of 107 reports, totalling $566,000 in rewards to date.&nbsp;</span></p></li></ul></ul><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; font-weight: 700; vertical-align: baseline;\">Looking for more details?</span><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> See the </span><a href=\"https://bughunters.google.com/blog/google-vrps-in-review-2025\"><span face=\"Roboto, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">extended version of this post</span></a><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> on the Security Engineering blog for reports from individual VRPs such as Android, Abuse, AI, Cloud, Chrome, and OSS, including specifics concerning high-impact bug reports and focus areas of security research.&nbsp;</span></p><h3 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 16pt;\"><span face=\"Arial, sans-serif\" style=\"color: #434343; font-size: 14pt; vertical-align: baseline;\">What’s coming in 2026</span></h3><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">In 2026, we remain fully committed to fostering collaboration, innovation, and transparency with the security community by hosting several bugSWAT events throughout the year, and following up with the next edition of our cybersecurity conference, ESCAL8. More broadly, our goal remains to stay ahead of emerging threats, adapt to evolving technologies, and continue to strengthen the security posture of Google’s products and services – all of which is only possible in collaboration with the external community of researchers we are so lucky to collaborate with!&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">In this spirit, we’d like to extend a huge thank you to our bug hunter community for helping us make Google products and platforms more safe and secure for our users around the world – and invite researchers not yet engaged with the Vulnerability Reward Program to join us in our mission to keep Google safe (check out our </span><a href=\"https://bughunters.google.com/about/rules/6744710187712512\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">programs</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> for inspiration \U0001F642)!</span></p><br /><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; font-style: italic; vertical-align: baseline;\">Thank you to Tony Mendez, Dirk Göhmann, Alissa Scherchen, Krzysztof Kotowicz, Martin Straka, Michael Cote, Sam Erb, Jason Parsons, Alex Gough, and Mihai Maruseac.&nbsp;</span></p><br /><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Tip: Want to be informed of new developments and events around our Vulnerability Reward Program? Follow the</span><a href=\"https://x.com/GoogleVRP\"><span face=\"Roboto, sans-serif\" style=\"color: black; font-size: 11pt; vertical-align: baseline;\"> </span><span face=\"Roboto, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Google VRP channel</span></a><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> on X to stay in the loop and be sure to check out the</span><a href=\"https://bughunters.google.com/blog\"><span face=\"Roboto, sans-serif\" style=\"color: black; font-size: 11pt; vertical-align: baseline;\"> </span><span face=\"Roboto, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Security Engineering blog,</span></a><span face=\"Roboto, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> which covers topics ranging from VRP updates to security practices and vulnerability descriptions!</span></p><br /><br /></span></div>"
"last_updated": "2026-08-27 21:31:32 JST"
