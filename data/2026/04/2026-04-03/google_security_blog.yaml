  "80064b7d51678e7f6dca41ea1d4cde84":
    "id": "80064b7d51678e7f6dca41ea1d4cde84"
    "title": "Google Workspace’s continuous approach to mitigating indirect prompt injections"
    "link": "http://security.googleblog.com/2026/04/google-workspaces-continuous-approach.html"
    "published": "2026-04-03 01:00:00"
    "fetched": "2026-08-27 21:31:32"
    "summary": "<span class=\"byline-author\">Posted by Adam Gavish, Google GenAI Security Team</span><div><br /></div><div><span id=\"docs-internal-guid-963e2379-7fff-2c42-f377-675bf409d663\"><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Indirect prompt injection (IPI) is an evolving threat vector targeting users of complex AI applications with multiple data sources, such as Workspace with Gemini. This technique enables the attacker to influence the behavior of an LLM by injecting malicious instructions into the data or tools used by the LLM as it completes the user’s query. This may even be possible without any input directly from the user.</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">IPI is not the kind of technical problem you “solve” and move on. Sophisticated LLMs with increasing use of agentic automation combined with a wide range of content create an ultra-dynamic and evolving playground for adversarial attacks. That’s why Google takes a sophisticated and comprehensive approach to these attacks. We’re continuously improving LLM resistance to IPI attacks and launching AI application capabilities with ever-improving defenses. </span><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Staying ahead of the latest indirect prompt injection attacks is critical to our mission of securing Workspace with Gemini.&nbsp;</span></p><br /><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">In our previous blog “</span><a href=\"https://security.googleblog.com/2025/06/mitigating-prompt-injection-attacks.html\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Mitigating prompt injection attacks with a layered defense strategy</span></a><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">”, we reviewed the layered architecture of our IPI defenses. In this blog, we’ll share more detail on the continuous approach we take to improve these defenses and to solve for new attacks.</span></p><h2 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 6pt; margin-top: 18pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 16pt; vertical-align: baseline;\">New attack discovery</span></h2><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">By proactively discovering and cataloging new attack vectors through internal and external programs, we can identify vulnerabilities and deploy robust defenses ahead of adversarial activity.&nbsp;</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Human Red-Teaming</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Human </span><a href=\"https://cloud.google.com/transform/how-google-does-it-building-an-effective-ai-red-team?utm_campaign=644972bd5b9473000116d347&amp;utm_content=69b98c1e13c0120001542de7&amp;utm_medium=smarpshare&amp;utm_source=linkedin\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Red-Teaming</span></a><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> uses adversarial simulations to uncover security and safety vulnerabilities. Specialized teams execute attacks based on realistic user profiles to exploit weaknesses, coordinating with product teams to resolve identified issues.</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Automated Red-Teaming</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Automated Red-Teaming is done via dynamic, machine-learning-driven frameworks to stress-test environments. By algorithmically generating and iterating on attack payloads, we can mimic the behavior of sophisticated threats at scale. This allows us to map complex attack paths and validate the effectiveness of our security controls across a much wider range of edge cases than manual testing could achieve on its own.</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Google AI Vulnerability Rewards Program (VRP)</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">The </span><a href=\"https://bughunters.google.com/about/rules/google-friends/ai-vulnerability-reward-program-rules\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Google AI Vulnerability Rewards Program (VRP)</span></a><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> is a critical tool for enabling collaboration between Google and external security researchers who discover new attacks leveraging IPI. Through this VRP, we recognize and reward contributors for their research.&nbsp; We also host regular, live hacking events where we provide invited researchers access to pre-release features, proactively uncovering novel vulnerabilities. These partnerships enable Google to quickly validate, reproduce, and resolve externally-discovered issues.</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Publicly disclosed AI attacks&nbsp;</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Google utilizes open-source intelligence feeds to stay on top of the latest publicly disclosed IPI attacks, across social media, press releases, blogs, and more. From there, new AI vulnerabilities are sourced, reproduced, and catalogued internally to ensure our products are not impacted.&nbsp;</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Vulnerability catalog&nbsp;</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">All newly discovered vulnerabilities go through a comprehensive analysis process performed by the Google Trust, Security, &amp; Safety teams. Each new vulnerability is reproduced, checked for duplications, mapped into attack technique / impact category, and assigned to relevant owners. The combination of new attack discovery sources and vulnerability catalog process helps Google stay on top of the latest attacks in an actionable manner.&nbsp;</span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"><br /></span></p><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"></p><div class=\"separator\" style=\"clear: both; text-align: center;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiQW2DFy08BHE1u92K8MiOGld7PIVOPqXkC_ACb2tJTcHhA4nG84w5spynWi-W9KcgJWW9mMfyDB1bvdwr-64mtYkkvKPPocpxVUI3pyB-QHXcBgJMXpfYRneCA14pqgDFs9e14xGJGIFOGVAUUrH2up-rju3CwMPjLsl7HtIhGSgrqPRlElqYt4G2af6Dc/s1306/Screenshot%202026-03-31%20at%2010.15.44%E2%80%AFAM.png\" style=\"margin-left: 1em; margin-right: 1em;\"><img border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiQW2DFy08BHE1u92K8MiOGld7PIVOPqXkC_ACb2tJTcHhA4nG84w5spynWi-W9KcgJWW9mMfyDB1bvdwr-64mtYkkvKPPocpxVUI3pyB-QHXcBgJMXpfYRneCA14pqgDFs9e14xGJGIFOGVAUUrH2up-rju3CwMPjLsl7HtIhGSgrqPRlElqYt4G2af6Dc/s16000/Screenshot%202026-03-31%20at%2010.15.44%E2%80%AFAM.png\" /></a></div><p></p><h2 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 6pt; margin-top: 18pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 16pt; vertical-align: baseline;\">Synthetic data generation&nbsp;</span></h2><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">After we discover, curate, and catalog new attacks, we use </span><a href=\"https://openreview.net/pdf?id=VOoeogZbMb\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">Simula</span></a><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\"> to generate synthetic data expanding these new attacks. This process is essential because it allows the team to develop attack variants for completeness and coverage, and to prepare new training and validation data sets. This accelerated workflow has boosted synthetic data generation by 75%, supporting large-scale defense model evaluation and retraining, as well as updating the data set used for calculating and reporting on defense effectiveness.</span></p><br /><div class=\"separator\" style=\"clear: both; text-align: center;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEghY30BDTqV9cG1siMIPHCah6tX1wVhw9WEWHx3cB9tlnm0UlAFHcRF74jzgdWRNamv2B29EpnI1sB4Ztijj9w0Y9-V82JVjSIKoZXaeKxbP_ptOzdRbTWe0W9sfHXlznjAnid0QjGleKvilFV46qk7qjbcNFFBu07HiEbBSZADgpnpZlnuHICHpUNe6Xzv/s1310/Screenshot%202026-03-31%20at%2010.16.24%E2%80%AFAM.png\" style=\"margin-left: 1em; margin-right: 1em;\"><img border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEghY30BDTqV9cG1siMIPHCah6tX1wVhw9WEWHx3cB9tlnm0UlAFHcRF74jzgdWRNamv2B29EpnI1sB4Ztijj9w0Y9-V82JVjSIKoZXaeKxbP_ptOzdRbTWe0W9sfHXlznjAnid0QjGleKvilFV46qk7qjbcNFFBu07HiEbBSZADgpnpZlnuHICHpUNe6Xzv/s16000/Screenshot%202026-03-31%20at%2010.16.24%E2%80%AFAM.png\" /></a></div><h2 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 6pt; margin-top: 18pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 16pt; vertical-align: baseline;\">Ongoing defense refinement&nbsp;</span></h2><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Continually updating and enhancing our defense mechanisms allows us to address a broader range of attack techniques, effectively reducing the overall attack surface. Updating each defense type requires different tasks, from config updates, to prompt engineering and ML model retraining.&nbsp;</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Deterministic Defenses</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Deterministic </span><a href=\"https://saif.google/focus-on-agents\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">defenses</span></a><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">, including user confirmation, URL sanitization, and tool chaining policies, are designed for rapid response against new or emerging prompt injection attacks by relying on simple configuration updates. These defenses are governed by a centralized Policy Engine, with configurations for policies like baseline tool calls, URL sanitization, and tool chaining. For immediate threats, this configuration-based system facilitates a streamlined process for \"point fixes,\" such as regex takedowns, providing an agile defense layer that acts faster than traditional ML/LLM model refresh cycles.</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">ML-Based Defenses</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">After generating synthetic data that expands new attacks into variants, the next step is to retrain our ML-based defenses to mitigate these new attacks. We partition the synthetic data described above into separate training and validation sets to ensure performance is evaluated against held-out examples. This approach ensures repeatability, data consistency for fixed training/testing, and establishes a scalable architecture to support future extensions towards fully automated model refresh.</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">LLM-Based Defenses</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Using the new synthetic data examples, our LLM-based defenses go through prompt engineering with refined system instructions. The goal is to iteratively optimize these prompts against agreed-upon defense effectiveness metrics, ensuring the models remain resilient against evolving threat vectors.</span></p><h4 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 4pt; margin-top: 14pt;\"><span face=\"Arial, sans-serif\" style=\"color: #666666; font-size: 12pt; vertical-align: baseline;\">Gemini Model Hardening&nbsp;</span></h4><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Beyond system-level guardrails and application-level defenses, we prioritize </span><a href=\"https://deepmind.google/blog/advancing-geminis-security-safeguards/\"><span face=\"Arial, sans-serif\" style=\"color: #1155cc; font-size: 11pt; vertical-align: baseline;\">‘model hardening’</span></a><span face=\"Arial, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">, a process that improves the Gemini model's internal capability to identify and ignore harmful instructions within data. By utilizing synthetic datasets and fresh attack patterns, we can model various threat iterations. This enables us to strengthen the Gemini model's ability to disregard harmful embedded commands while following the user's intended request. Through this process of model hardening, Gemini has become significantly more adept at detecting and disregarding injected instructions. This has led to a reduction in the success rate of attacks without compromising the model's efficiency during routine operations.</span></p><h2 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 6pt; margin-top: 18pt;\"><span face=\"Arial, sans-serif\" style=\"font-size: 16pt; vertical-align: baseline;\">Defense effectiveness&nbsp;</span></h2><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">To measure the real-world impact of defense improvements, we simulate attacks against many Workspace features. This process leverages the newly generated synthetic attack data described on this blog, to create a robust, end-to-end evaluation. The simulation is run against multiple Workspace apps, such as Gmail and Docs, using a standardized set of assets to ensure reliable results. To determine the exact impact of a defense improvement (e.g., an updated ML model or a new LLM prompt optimization), the end-to-end evaluation is run with and without the defense enabled. This comparative testing provides the essential \"before and after\" metrics needed to validate defense efficacy and drive continuous improvement.</span></p><br /><div class=\"separator\" style=\"clear: both; text-align: center;\"><a href=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj7Ue0_cO2rj4eBwCNMuiNJWHGPlw51p7ZPcSj8C0InvE64MHO3p8BJmGtG9OVg9560Se7zdGN5Pej0ZBa1qKIkzJ6r3IzDmtbNiAxpB4cA6pvX3mKngHvsr1OBgcpmPDyvFVPNRIJyUcnztSPIqLZiDVrI7-okFUz0nfeW5xvbivXAPSsyuuYIiG0rGkzn/s1308/Screenshot%202026-03-31%20at%2010.17.11%E2%80%AFAM.png\" style=\"margin-left: 1em; margin-right: 1em;\"><img border=\"0\" src=\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj7Ue0_cO2rj4eBwCNMuiNJWHGPlw51p7ZPcSj8C0InvE64MHO3p8BJmGtG9OVg9560Se7zdGN5Pej0ZBa1qKIkzJ6r3IzDmtbNiAxpB4cA6pvX3mKngHvsr1OBgcpmPDyvFVPNRIJyUcnztSPIqLZiDVrI7-okFUz0nfeW5xvbivXAPSsyuuYIiG0rGkzn/s16000/Screenshot%202026-03-31%20at%2010.17.11%E2%80%AFAM.png\" /></a></div><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><br /></p><h2 dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 6pt; margin-top: 18pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 16pt; vertical-align: baseline;\">Moving forward&nbsp;</span></h2><p dir=\"ltr\" style=\"line-height: 1.38; margin-bottom: 0pt; margin-top: 0pt;\"><span face=\"&quot;Google Sans Text&quot;, sans-serif\" style=\"font-size: 11pt; vertical-align: baseline;\">Our commitment to AI security is rooted in the principle that every day you’re safer with Google. While the threat landscape of indirect prompt injection evolves, we are building Workspace with Gemini to be a secure and trustworthy platform for AI-first work. IPI is a complex security challenge, which requires a defense-in-depth strategy and continuous mitigation approach. To get there, we’re combining world-class security research, automated pipelines, and advanced ML/LLM-based models. This robust and iterative framework helps to ensure we not only stay ahead of evolving threats but also provide a powerful, secure experience for both our users and customers.</span></p><br /></span></div>"
