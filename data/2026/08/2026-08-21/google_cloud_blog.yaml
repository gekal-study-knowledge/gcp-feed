  "9aa9f415eccd102698760b6fc01d0f06":
    "id": "9aa9f415eccd102698760b6fc01d0f06"
    "title": "Expanding Google Antigravity for enterprise customers"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers/"
    "published": "2026-08-21 02:30:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Since announcing Google Antigravity in Gemini Enterprise Agent Platform at I/O in May, we’ve heard helpful feedback from our customers. Your developers want easy access to coding agents across surfaces. Your enterprise governance team wants security controls and license management. And your finance team wants pooled usage so that no prepaid token ever goes unused. Now, everybody finally gets what they want:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Antigravity is available now as part of </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">eligible</span></a><span style=\"vertical-align: baseline;\"> Gemini Enterprise app subscriptions, including out-of-the-box administrative and spend controls.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">New </span><a href=\"https://antigravity.google/blog/antigravity-ide-extensions\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IDE extensions</span></a><span style=\"vertical-align: baseline;\"> let developers use Antigravity in the IDEs of their choice, including <a href=\"https://marketplace.visualstudio.com/items?itemName=Google.google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VS Code</span></a><span style=\"vertical-align: baseline;\">.</span></span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Unify AI developer tools and enterprise-grade controls in one subscription</span></h3>\n<p><span style=\"vertical-align: baseline;\">Equipping your developers with advanced agentic tools shouldn't mean managing separate add-on licenses, invoices, billing consoles or security settings. With AI developer tools included i</span><span style=\"vertical-align: baseline;\">n Gemini Enterprise subscriptions, administrators can easily </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">enable</span></a><span style=\"vertical-align: baseline;\"> Antigravity and </span><a href=\"http://d.android.com/gemini-in-android\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</span></a><span style=\"vertical-align: baseline;\"> for users with </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">eligible</span></a><span style=\"vertical-align: baseline;\"> Gemini Enterprise Standard, Plus, and Standard Emerging Market licenses, and maintain full governance with spend, security, observability and usage metrics consolidated in the Gemini Enterprise admin console.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Unblock your developers while controlling spend</span></h3>\n<p><span style=\"vertical-align: baseline;\">With billing flexibility and cost management tools in Gemini Enterprise, you can ensure your developers have the resources they need while managing costs:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Granular spend thresholds</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Administrators can set monthly project-level budget caps directly in the Billing console, with additional per-user and team controls rolling out later this year.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/quotas-and-overages\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Pooled quotas</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Shared token pools provide flexibility to high-demand teams, preventing purchased quota from sitting idle across the organization. </span></span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/configure-overages\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Overage enablement</strong></a><span style=\"vertical-align: baseline;\">: To maintain continuous developer workflows when pooled quotas are met, administrators can opt into overages with monthly spend caps, smoothly transitioning excess usage to standard consumption-based rates. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-metrics\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Usage metrics</strong></a><span style=\"vertical-align: baseline;\">: Centralized usage tracking provides visibility into token consumption, API calls, and developer activity, enabling organizations to continuously optimize their AI investments.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Gif 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Gif_1_vK8C2Nf.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Safeguard your organization’s code and data with built-in privacy and security</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise subscriptions bring Google Antigravity under Google Cloud’s standard security and compliance protections. Administrators and IT teams can set clear boundaries around workspace access, enable full audit logging, and enforce data privacy from a single console:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Configurable security policies</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> <span style=\"vertical-align: baseline;\">Enforce security and compliance controls, such as workspace sandboxing, and browser and MCP server access, to help ensure AI agents operate safely within authorized enterprise environments.</span></span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-settings\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Central audit logging</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Enable comprehensive audit logging with a single toggle, capturing prompts, agent responses, and metadata for compliance reporting.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/privacy?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Data privacy</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Maintain data ownership under Google Cloud’s Terms of Service, ensuring all agent activity executes strictly within your secure cloud boundary.</span></p>\n</li>\n</ul></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=CJnchBVryCQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Antigravity in Gemini Enterprise - AI Developer Tools Settings</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=CJnchBVryCQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Bring agentic coding directly into your team’s preferred development environments </span></h3>\n<p><span style=\"vertical-align: baseline;\">Starting today your developers can use Antigravity across the surfaces they already know and use — including </span><a href=\"https://marketplace.visualstudio.com/items?itemName=Google.google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visual Studio Code</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://marketplace.visualstudio.com/items?itemName=Google.GoogleAntigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visual Studio</span></a><span style=\"vertical-align: baseline;\"> (preview), Jetbrains (preview) and Zed IDEs (preview)  via the </span><a href=\"https://antigravity.google/blog/antigravity-ide-extensions\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new IDE extensions</span></a><span style=\"vertical-align: baseline;\"> as well as the Antigravity 2.0 desktop app, and the Antigravity CLI. </span></p>\n<p><span style=\"vertical-align: baseline;\">Throughout all surfaces, administrators can enforce corporate identity standards while removing setup friction for technical teams via native support for Workforce Identity Federation (WIF) and Application Default Credentials (ADC).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"VSCode IDE Plugin\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/VSCode_IDE_Plugin_gif_v3_720p.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AGY IDE extension demo</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">What our customers are saying</span></h3>\n<p><span style=\"vertical-align: baseline;\">From rapid code generation to end-to-end task automation, Google Antigravity is giving engineering teams the momentum of cutting edge AI development backed by the stability, governance, and scale of Google Cloud. Here is how leading enterprise customers and partners are driving measurable outcomes in production:</span></p>\n<p><span style=\"vertical-align: baseline;\">“Deploying Antigravity in Gemini Enterprise allows Accenture to arm our engineers with Google DeepMind’s premier technology on the secure, trusted foundation of Google Cloud. Abstracting away operational complexity ensures our teams don't have to choose between developer speed and enterprise-grade governance — freeing them to deliver high-velocity engineering and transformative value for our clients.” — Chetna Sehgal, Global Practice Lead, </span><strong style=\"vertical-align: baseline;\">Accenture Google Business Group</strong></p>\n<p><span style=\"vertical-align: baseline;\">“At AirAsia and across the Group, we’re all about empowering our people. Bringing highly capable Gemini models directly into our daily workflows with Antigravity 2.0 does exactly that. We are putting the most advanced AI capabilities into the hands of our entire workforce, from software engineering to finance, marketing, legal, HR and much more. This empowers both our developers and critical back-office teams to innovate at an unprecedented pace and drive proven time-savings across the board.” — Nikunj Shanti, CTO, </span><strong style=\"vertical-align: baseline;\">AirAsia Next</strong></p>\n<p><span style=\"vertical-align: baseline;\">“Enterprises are moving beyond AI experimentation and expecting measurable business outcomes. With Gemini Enterprise and next-generation developer tools like Antigravity 2.0 and Antigravity CLI, we see significant opportunities to further embed agentic AI, particularly the advanced reasoning capabilities of Gemini models, directly into software delivery workflows. This goes beyond productivity as it enables faster decision-making, higher code quality, and reduced technical debt at scale. What stands out is how these capabilities are helping our teams evolve from writing code to orchestrating outcomes, strengthening every phase of the software development lifecycle while scaling innovation securely and responsibly.” — Rakesh Aerath, President, Asia Pacific Global Delivery Centers of Excellence, </span><strong style=\"vertical-align: baseline;\">CGI</strong></p>\n<p><span style=\"vertical-align: baseline;\">“Every developer workflow is unique, and agentic AI should adapt to the engineer, not the other way around. With Google Antigravity supported across developers' preferred IDEs, the desktop app, and the CLI, Cognizant can seamlessly embed agentic engineering across our global delivery centers. It gives our teams the freedom to choose their preferred surface while delivering high-velocity, secure software for our clients.”— Rajesh Varrier, President, Global Operations and Chairman &amp; Managing Director, </span><strong style=\"vertical-align: baseline;\">Cognizant India</strong></p>\n<p><span style=\"vertical-align: baseline;\">“Antigravity has played a key role in advancing our AI-first strategy at Datamatics. Over the last few months, our teams have used it to rapidly build and deploy multiple applications, accelerate solution development, and embed AI into core business processes. From AI Impact Hub to analytics and sales enablement solutions, it has helped us move beyond experimentation to real execution, delivering measurable business outcomes while enabling teams to innovate faster and at scale.”— Vijay Venkatachalam, Vice President, Information Systems Group (ISG), </span><strong style=\"vertical-align: baseline;\">Datamatics</strong></p>\n<p><span style=\"vertical-align: baseline;\">\"Embedding Google Antigravity's autonomous capabilities directly into Gemini Enterprise development environments allows our internal and Forward Deployed Engineering teams to automate complex tasks. Supported by the platform’s new FinOps and governance controls, our teams can confidently focus on orchestrating high-value, secure and cost-efficient outcomes for our clients at scale.\"  — Faruk Muratovic, US AI &amp; Engineering Strategy and Services Leader,</span><strong style=\"vertical-align: baseline;\"> Deloitte</strong></p>\n<p><span style=\"vertical-align: baseline;\">“Adopting Antigravity places Wipro at the leading edge of the AI-driven software development lifecycle. Combining Antigravity 2.0, CLI, and the new IDE extensions with a seamless developer experience and superior code accuracy fits naturally into our AI-first engineering strategy. Working with Google Cloud allows us to accelerate software delivery and bring next-generation value to our global enterprise clients.”  — Debashish Ghosh, Vice President and Global Head, Google Partnership, </span><strong style=\"vertical-align: baseline;\">Wipro</strong></p>\n<h3><span style=\"vertical-align: baseline;\">Get started with Antigravity in Gemini Enterprise</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google Antigravity in Gemini Enterprise is available today for </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">eligible</span></a><span style=\"vertical-align: baseline;\"> Gemini Enterprise Standard, Plus, and Standard Emerging Market licenses, with broader support coming soon.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For administrators:</strong><span style=\"vertical-align: baseline;\"> Visit the </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">enterprise setup guide</span></a><span style=\"vertical-align: baseline;\"> to enable AI Developer tools for Google Antigravity and Android Studio. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For developers: </strong><span style=\"vertical-align: baseline;\">Start </span><a href=\"https://antigravity.google/docs/home\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">building</span></a> <span style=\"vertical-align: baseline;\">with Antigravity 2.0, the Antigravity CLI, or your preferred IDEs via Antigravity IDE extensions.</span></p>\n</li>\n</ul></div>"
  "7591fa1daaaa8da01b30ed4fd430200c":
    "id": "7591fa1daaaa8da01b30ed4fd430200c"
    "title": "Google is a Leader in the 2026 Gartner® Magic Quadrant™ for Cloud-Native Application Platforms"
    "link": "https://cloud.google.com/blog/products/application-development/2026-gartner-mq-for-cloud-native-application-platforms/"
    "published": "2026-08-21 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We are thrilled to announce that Google has been recognized as </span><strong style=\"vertical-align: baseline;\">a Leader</strong><span style=\"vertical-align: baseline;\"> for the third year in a row in the </span><strong style=\"vertical-align: baseline;\">2026 Gartner® Magic Quadrant™ for Cloud-Native Application Platforms (CNAP)</strong><span style=\"vertical-align: baseline;\">. We believe this placement in the Leaders quadrant validates our commitment to providing an accessible, developer-centric platform that accelerates onboarding and supports rapid prototyping across modern workloads.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Figure_1_Magic_Quadrant_for_CloudNative_Application_Platforms\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Magic_Quadrant_for_CloudNative_Ap.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Our vision for an application-centric cloud focuses on enabling developers to prioritize writing code and building agents or traditional apps by removing infrastructure complexity. Google Cloud provides a unified execution environment supporting </span><span style=\"vertical-align: baseline;\">serverless, containerized, and agentic deployment o</span><span style=\"vertical-align: baseline;\">ptions. We believe our placement highlights Google's unique readiness to power both standard enterprise microservices and the next generation of autonomous AI applications.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Some key features and capabilities of our platform are highlighted below. </span></p>\n<h2><strong style=\"vertical-align: baseline;\">From idea to implementation</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Generative AI has ushered in a wave of vibe coding, allowing anyone to go from an idea to a deployed application in a fraction of the time it used to take. To make this even smoother, Google Cloud integrates its serverless infrastructure with AI vibe-coding and prototyping tools. We also simplify access to Google Cloud resources with tools like </span><a href=\"https://docs.cloud.google.com/mcp/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">managed MCP servers</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"http://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agentic skills</span></a><span style=\"vertical-align: baseline;\"> — packaged sets of instructions, scripts, and resources to teach an AI how to complete specialized, multi-step workflow. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">One-click prototyping in Google AI Studio: </strong><span style=\"vertical-align: baseline;\">Developers can build and deploy </span><a href=\"https://cloud.google.com/blog/products/databases/vibe-coded-ai-studio-apps-with-firestore-firebase-cloud-sql?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">full-stack applications</span></a><span style=\"vertical-align: baseline;\"> directly within Google AI Studio, making it a great environment for prototyping and experimentation. With a single click, you can instantly package and publish your vibe-coded applications to </span><a href=\"https://cloud.google.com/run?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google-managed MCP servers:</strong><span style=\"vertical-align: baseline;\"> To enable AI agents to interact with cloud resources, we support official, fully managed </span><a href=\"https://docs.cloud.google.com/mcp/supported-products\"><span style=\"text-decoration: underline; vertical-align: baseline;\">remote MCP servers</span></a><span style=\"vertical-align: baseline;\">. An example is the Cloud Run MCP server (via </span><span style=\"vertical-align: baseline;\">run.googleapis.com/mcp</span><span style=\"vertical-align: baseline;\">), which allows developers to easily launch endpoints and deploy server-side logic. The MCP tools are deployed with a simple config, skipping cloud builds to launch code in seconds, saving valuable developer time. These fully managed servers are integrated with IAM and VPC Service Controls, and they leverage Model Armor for content security.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google's official Skills Repository</strong><span style=\"vertical-align: baseline;\">: Level up your agents with additional, condensed expertise on various Google Cloud technologies. Published and available in Agent Registry, the repository includes </span><a href=\"https://github.com/google/skills/tree/main/skills/cloud/cloud-run-basics\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">skills for Cloud Run</span></a><span style=\"vertical-align: baseline;\">, the Well-Architected Pillar (security, reliability, and cost optimization), and more.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Ready to try vibe coding yourself? </span><span style=\"vertical-align: baseline;\">Get hands on with this codelab to </span><a href=\"https://codelabs.developers.google.com/deploy-from-aistudio-to-run#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">build a vibe-coded app and deploy it to Cloud Run</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">From implementation to enterprise-ready</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Translating prototypes into production-grade, secure, and cost-effective enterprise software is where Google Cloud excels, with a full suite of developer, architect, and platform engineering tools. From designing your application to optimizing day 2 operations, we offer the services and tools to help you </span><span style=\"font-style: italic; vertical-align: baseline;\">build</span><span style=\"vertical-align: baseline;\">, </span><span style=\"font-style: italic; vertical-align: baseline;\">operate</span><span style=\"vertical-align: baseline;\">, and </span><span style=\"font-style: italic; vertical-align: baseline;\">deploy</span><span style=\"vertical-align: baseline;\"> applications across their entire lifecycle, and you have the freedom to build with any language, any library, and any framework.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Build</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build with </strong><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">At Google, we’re simplifying and expanding our development ecosystem behind the Antigravity harness, collapsing developer silos into a unified orchestration layer. By integrating multi-step AI reasoning directly into the developer workflow, Antigravity natively brings local codebase development to our cloud-native application platforms (e.g., Cloud Run).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Design and deploy with </strong><a href=\"https://docs.cloud.google.com/application-design-center/docs/overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Application Design Center</strong></a><strong style=\"vertical-align: baseline;\"> (ADC): </strong><span style=\"vertical-align: baseline;\">Now, you can bridge the gap between developer velocity and enterprise control, using Application Design Center to eliminate manual Terraform and YAML configuration. This platform engineering component helps teams design, standardize, and deploy template-driven applications on Google Cloud. It is also integrated as part of Gemini Cloud Assist design agent and published as an MCP server. With ADC, you can visually design your architecture using Cloud Run services, databases, and event brokers backed by automated Gemini Cloud Assist security templates. Beyond human-guided design, ADC enables programmatic orchestration at the time of no HITL (Human-in-the-Loop), allowing automated pipelines to provision policy-governed Terraform configurations directly and autonomously.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Operate </strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Intelligent investigations: </strong><span style=\"vertical-align: baseline;\">Integrating </span><a href=\"https://cloud.google.com/products/gemini/cloud-assist?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Cloud Assist</span></a><span style=\"vertical-align: baseline;\"> with native telemetry creates an AI-driven framework for Day-2 incidents. When alerts fire, operators engage Gemini Cloud Assist to instantly synthesize logs and metrics, pinpoint root causes, and generate remediations — context that can be handed off to accelerate support escalations. Crucially, IAM permissions strictly govern all AI recommendations, and help to ensure explicit human-in-the-loop approval are required before any infrastructure changes occur.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cost analysis and optimizations: </strong><span style=\"vertical-align: baseline;\">Machine learning algorithms learn natural seasonal traffic cycles to detect cost anomalies within minutes, triggering notifications to protect your bottom line without risking destructive infrastructure shutdown.  </span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Deploy</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reliability and high availability: </strong><span style=\"vertical-align: baseline;\">Cloud Run is a regional service by default, but you can deploy an app to multiple regions via a single gcloud command. Integrated with </span><a href=\"https://docs.cloud.google.com/run/docs/configuring/configure-service-health\"><span style=\"text-decoration: underline; vertical-align: baseline;\">service health</span></a><span style=\"vertical-align: baseline;\">, Cloud Run automates cross-region failover and failback. If a service in one region becomes unhealthy, traffic is automatically routed to the next-closest healthy region, failing back once the issue is resolved.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">An open platform: </strong><span style=\"vertical-align: baseline;\">As a long-time and top contributor to the Cloud Native Computing Foundation (</span><a href=\"https://www.cncf.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CNCF</span></a><span style=\"vertical-align: baseline;\">), we operate with an open-source-first strategy. By integrating foundational, community-driven technologies, we help enable application portability for enterprise customers who are increasingly demanding multi-cloud flexibility</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Ready to start deploying your apps to Google Cloud? Get hands on with these codelabs:  </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/build-and-deploy-gcp-with-antigravity#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Build an app with Antigravity on Cloud Run</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/next26/adc-apps#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deploy a Cloud Run app via Application Design Center</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://codelabs.developers.google.com/next26/gemini-cloud-assist-cost-optimization#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Optimize application costs with Gemini Cloud Assist</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">From enterprise-ready to autonomous</strong></h2>\n<p><span style=\"vertical-align: baseline;\">AI agents are software’s next frontier. They offer more than just increased productivity and efficiency; they can unlock exponential growth. To provide enterprises with robust agentic deployment options, Google Cloud provides a dedicated infrastructure stack tailored specifically to host, govern, and secure autonomous agent fleets. This stack seamlessly integrates with our Agent Development Kit (</span><a href=\"https://adk.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ADK</span></a><span style=\"vertical-align: baseline;\">) as well as other leading agentic frameworks to give developers maximum flexibility.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise Agent Runtime<br /></strong><span style=\"vertical-align: baseline;\">At the core of this stack is Gemini Enterprise Agent Platform and its dedicated </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Runtime</span></a><span style=\"vertical-align: baseline;\">, which delivers the serverless and containerized deployment options you need for enterprise-scale agent development, including the following capabilities:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Native personalization:</strong><span style=\"vertical-align: baseline;\"> Built-in sessions and memory banks manage context and long-term state, preventing costs from ballooning.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agent observability and tracing:</strong><span style=\"vertical-align: baseline;\"> Built on OpenTelemetry (OTel) standards and </span><a href=\"https://opentelemetry.io/blog/2026/genai-observability/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agentic schemas</span></a><span style=\"vertical-align: baseline;\">, turnkey dashboards feature agent topology graphs and interactive trace logs that detail sessions, tool calls, and reasoning paths.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agent evaluation and simulation:</strong><span style=\"vertical-align: baseline;\"> Automated simulation tools allow developers to test agents against golden sets with side-by-side comparisons and simulate thousands of interactions to test edge cases.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Hosting agents on Cloud Run<br /></strong><span style=\"vertical-align: baseline;\">For customers requiring additional flexibility, granular control, or specific regulatory compliance, Cloud Run serves as an excellent serverless alternative to host your agents. Some of its latest features include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run instances </strong><span style=\"vertical-align: baseline;\">(coming soon)</span><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">This primitive manages individual, addressable, long-running singleton resources with integrated Cloud Storage volume mounts, allowing persistent background agents to be deployed cost-effectively.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Run </strong><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-run-sandboxes-are-in-public-preview?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">sandboxes</strong></a><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Hard-isolated environments spin up in under 500 milliseconds to safely execute untrusted, model-generated code, protecting the host system from unauthorized access.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Agent security, governance, and auditability<br /></strong><span style=\"vertical-align: baseline;\">To securely deploy AI agents and prevent unmanaged shadow AI, enterprises need an ironclad governance framework. Google Cloud delivers this through </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Identity</span></a><span style=\"vertical-align: baseline;\"> (non-human IAM with cryptographic IDs) to provide an auditable trail of all actions and reasoning; a centralized </span><a href=\"https://docs.cloud.google.com/agent-registry/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Registry</span></a><span style=\"vertical-align: baseline;\"> to manage approved agents, skills, tools and application artifacts,  and prevent unauthorized tool integrations; and an </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Gateway</span></a><span style=\"vertical-align: baseline;\"> to proxy traffic, enforce Model Armor policies, and actively block destructive actions. These features are available on </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Runtime</span></a><span style=\"vertical-align: baseline;\"> today and will be available soon on Cloud Run and Google Kubernetes Engine (GKE).</span></p>\n<p><span style=\"vertical-align: baseline;\">Ready to start deploying agents? Check out various codelabs featuring Gemini Enterprise Agent Platform </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/13-demos-on-gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Build the future of cloud-native applications</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Whether you’re a vibe coder deploying your first full-stack application, a software architect standardizing production microservices, or an enterprise team scaling a fleet of secure AI agents, Google Cloud delivers the simplicity, elasticity, and security you need. </span><strong style=\"vertical-align: baseline;\">Read the full report:</strong><span style=\"vertical-align: baseline;\"> Download your complimentary copy of the</span> <a href=\"https://cloud.google.com/resources/content/gartner-cloud-native-application-platforms-magic-quadrant-report-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 Gartner® Magic Quadrant™ for Cloud-Native Application Platforms (CNAP)</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<hr />\n<p><sub><span style=\"font-style: italic; vertical-align: baseline;\">Magic Quadrant for Cloud-Native Application Platforms, By Mukul Saha, Alex Coqueiro, Prasanna Lakshmi Narasimha, Richard Watson, 3 August 2026</span></sub></p>\n<p><sub><span style=\"font-style: italic; vertical-align: baseline;\">Gartner and Magic Quadrant are trademarks of Gartner, Inc. and/or its affiliates. This graphic was published by Gartner, Inc. as part of a larger research document and should be evaluated in the context of the entire document. The Gartner document is available upon request from Google. </span></sub></p>\n<p><sub><span style=\"font-style: italic; vertical-align: baseline;\">Gartner does not endorse any company, vendor, product or service depicted in its publications, and does not advise technology users to select only those vendors with the highest ratings or other designation. Gartner publications consist of the opinions of Gartner’s business and technology insights organization and should not be construed as statements of fact. Gartner disclaims all warranties, expressed or implied, with respect to this publication, including any warranties of merchantability or fitness for a particular purpose.</span></sub></p></div>"
  "f77f7dda58612af8920a02593179e1b3":
    "id": "f77f7dda58612af8920a02593179e1b3"
    "title": "How AlloyDB ScaNN scales vector search to 10 billion vectors"
    "link": "https://cloud.google.com/blog/products/databases/alloydb-scann-index-four-level-tree-improves-vector-search/"
    "published": "2026-08-21 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To satisfy the demands of enterprise-grade agentic AI applications, underlying vector databases often struggle to scale effectively as modern use cases can scale to billions of vectors.</span></p>\n<p><span style=\"vertical-align: baseline;\">As a fully managed PostgreSQL-compatible database service, </span><a href=\"https://docs.cloud.google.com/alloydb/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB</span></a><span style=\"vertical-align: baseline;\"> is engineered to handle demanding enterprise workloads. Combining Google's infrastructure with the reliability of commercial databases, it delivers high availability, scalability, and includes a cutting-edge analytical engine, optimal for agentic AI use cases. A key part of this is its </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ScaNN index</span></a><span style=\"vertical-align: baseline;\">, which now operates efficiently </span><span style=\"font-style: italic; vertical-align: baseline;\">at a scale of 10 billion vectors</span><span style=\"vertical-align: baseline;\">. This was achieved through a major architectural enhancement: an innovative </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#four-level-tree-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">four-level tree (preview)</span></a><span style=\"vertical-align: baseline;\"> paired with efficient memory usage</span><strong style=\"vertical-align: baseline;\">.</strong></p>\n<h3><strong style=\"vertical-align: baseline;\">The 10 billion vector scale challenge</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Scaling to a 10 billion vector workload presents significant memory and computational challenges. Previous AlloyDB ScaNN tree-based index was limited to </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#two-level-tree-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">two</span></a><span style=\"vertical-align: baseline;\">- or </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#three-level-tree-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">three</span></a><span style=\"vertical-align: baseline;\">-level tree configurations, and attempting to scale those structures led to several bottlenecks:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Increased compute intensity:</strong><span style=\"vertical-align: baseline;\"> Larger tree structures demand significantly more operations for both index construction and query traversal.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Memory constraints:</strong><span style=\"vertical-align: baseline;\"> The sampling processes required for 10 billion vectors can easily exceed the system's available memory capacity.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Solution: Four-level architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The introduction of a </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#four-level-tree-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">four-level tree (preview)</span></a><span style=\"vertical-align: baseline;\"> is the primary innovation in the recent AlloyDB ScaNN release. This architecture, illustrated in Figure 1, employs a top-down strategy to optimize the balance between accuracy and build efficiency. To maintain high performance and mitigate recall loss, the system integrates key enhancements such as Top-K branch, </span><a href=\"https://research.google/blog/soar-new-algorithms-for-even-faster-vector-search-with-scann/#:~:text=ScaNN%20is%20open%2Dsourced%20on%20GitHub%20and%20can%20be%20easily%20installed%20via%20Pip.\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAR</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://arxiv.org/abs/1908.10396\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">centroid adjustment</span></a><span style=\"vertical-align: baseline;\"> and balanced tree shape.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_fpfICUj.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1. AlloyDB ScaNN four-level tree architecture</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This design has two primary benefits:</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. Reduced compute intensity via hierarchical partitioning</strong></p>\n<p><span style=\"vertical-align: baseline;\">The four-level architecture drastically reduces compute intensity by using hierarchical partitioning to restrict the volume of vectors scanned during a query. Instead of traversing a flat or poorly segmented space, the multi-layered hierarchy narrows down the search path exponentially. Figure 2 illustrates the search spaces across different tree levels, demonstrating how structural layering optimizes traversal efficiency:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_LWwXC70.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2. Search space for two-, three- and four-level trees</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Two-level:</strong><span style=\"vertical-align: baseline;\"> Utilizes coarse partitioning to guide queries, resulting in a basic search complexity of </span><em><span style=\"vertical-align: baseline;\">O(</span><span style=\"vertical-align: baseline;\">N</span><sup><span style=\"vertical-align: baseline;\">1/2</span></sup></em><span style=\"vertical-align: baseline;\"><em>)</em></span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Three-level:</strong><span style=\"vertical-align: baseline;\"> Introduces an intermediate layer to further subdivide clusters, narrowing exploration to </span><em><span style=\"vertical-align: baseline;\">O(</span><span style=\"vertical-align: baseline;\">N</span><sup><span style=\"vertical-align: baseline;\">1/3</span></sup></em><span style=\"vertical-align: baseline;\"><em>)</em></span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Four-level:</strong><span style=\"vertical-align: baseline;\"> Implements refined, highly granular partitions that optimize traversal efficiency down to </span><em><span style=\"vertical-align: baseline;\">O(</span><span style=\"vertical-align: baseline;\">N</span><sup><span style=\"vertical-align: baseline;\">1/4</span></sup></em><span style=\"vertical-align: baseline;\"><em>)</em></span><span style=\"vertical-align: baseline;\">, sufficiently allowing for more than 10-billion vectors.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By dynamically expanding hierarchical layers as the dataset expands, AlloyDB ScaNN maintains ultra-low query latency and avoids computational scale walls from impacting performance.</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. Efficient memory usage</strong></p>\n<p><span style=\"vertical-align: baseline;\">Achieving a 10 billion vector scale requires high memory efficiency. AlloyDB ScaNN uses these strategies to maximize memory management performance:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Balanced tree shape construction:</strong><span style=\"vertical-align: baseline;\"> The four-level tree utilizes a </span><span style=\"font-style: italic; vertical-align: baseline;\">balanced</span><span style=\"vertical-align: baseline;\"> configuration to circumvent memory limitations that restrict the size of training datasets. This balanced architecture effectively leverages reduced sampling sizes to construct high-fidelity tree partitions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sampling optimization:</strong><span style=\"vertical-align: baseline;\"> When the system encounters memory limitations, it generates a condensed sampling set that considers performance and accuracy. </span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Performance test results</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By leveraging the innovative four-level tree architecture in our internal tests, we are able to achieve the following performance results:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB can scale to over 10 billion vectors with its ScaNN index.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AlloyDB can deliver &lt;= 51 ms p95 latency and 95% recall at 10 billion vectors with its ScaNN index.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Experience AlloyDB ScaNN's </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index#four-level-tree-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">four-level tree (preview)</span></a><span style=\"vertical-align: baseline;\"> architecture today. You can deploy ScaNN for AlloyDB by following our </span><a href=\"https://cloud.google.com/alloydb/docs/quickstart/create-and-connect\"><span style=\"text-decoration: underline; vertical-align: baseline;\">quickstart guide</span></a><span style=\"vertical-align: baseline;\"> to set up an instance. For optimized, high-speed vector search, refer to the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai/create-scann-index\"><span style=\"text-decoration: underline; vertical-align: baseline;\">official ScaNN documentation</span></a><span style=\"vertical-align: baseline;\">. New users can also </span><a href=\"https://console.cloud.google.com/alloydb/create-trial-cluster?_gl=1*qsd2cd*_up*MQ..&amp;gclid=CjwKCAjwooq3BhB3EiwAYqYoEh91xxGzv4xrmyMJJ_BPfF4X8cv-I3kINwvnMI2pADozFQPsrHnaOhoCbioQAvD_BwE&amp;gclsrc=aw.ds\"><span style=\"text-decoration: underline; vertical-align: baseline;\">explore AlloyDB</span></a><span style=\"vertical-align: baseline;\"> through our </span><a href=\"https://cloud.google.com/blog/products/databases/run-your-postgresql-database-in-an-alloydb-free-trial-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">30-day free trial</span></a><span style=\"vertical-align: baseline;\"> program. We can’t wait to hear about what you build!</span></p></div>"
  "7e6491660bbe71755b5677d3abfdf0c9":
    "id": "7e6491660bbe71755b5677d3abfdf0c9"
    "title": "10 questions every startup should answer before moving to production with their AI prototype"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/10-questions-for-your-startup-developers/"
    "published": "2026-08-21 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">It’s never been easier to start an AI-powered startup on Google Cloud. </span></p>\n<p><span style=\"vertical-align: baseline;\">You grab an API key from </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\"> at breakfast, paste it into Antigravity, and by lunch you’ll have a nascent prototype of your product.</span></p>\n<p><span style=\"vertical-align: baseline;\">But it’s not all one straight line to progress. It's common to bump into these three challenges as you build out your stack:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A leaked API key racks up a</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">large bill in 48 hours</span><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A \"quick\" migration from AI Studio to </span><a href=\"https://cloud.google.com/vertex-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> stalls the roadmap for weeks because nobody on the team owns Identity and Access Management (IAM).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The launch works, until the app starts returning </span><span style=\"vertical-align: baseline;\">HTTP 429 Too Many Requests</span><span style=\"vertical-align: baseline;\"> because of default per-project quotas, and there's no clean path to more capacity without paying a premium.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">None of these are unique edge cases. . They're  default failure modes of moving fast without a plan, and we've all done it at least once.</span></p>\n<p><span style=\"vertical-align: baseline;\">Below are the 10 questions every startup should be ready to answer </span><span style=\"font-style: italic; vertical-align: baseline;\">before</span><span style=\"vertical-align: baseline;\"> they scale,  grouped into the three phases where decisions can shape your future: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Onboard</strong><span style=\"vertical-align: baseline;\"> (setting up your own projects and identities right)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale</strong><span style=\"vertical-align: baseline;\"> (getting more throughput without breaking the bank) </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Govern</strong><span style=\"vertical-align: baseline;\"> (keeping costs, keys, and agents from running away). </span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">These ten are scoped to the prototype-to-production transition itself. Each question ends with a short, runnable snippet you can copy into your own project today. Adjacent decisions that matter just as much but aren't specific to that move, your data layer and RAG architecture, CI/CD, network design, are deliberately out of frame here. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Onboard: get the foundation right (in the first hour).</span></h3>\n<h3><span style=\"vertical-align: baseline;\">#1 Where should I start: Google AI Studio or Gemini Enterprise Agent Platform?</span></h3>\n<p><span style=\"vertical-align: baseline;\">Both surfaces expose the same Gemini family of models, but they solve different problems.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google AI Studio</strong><span style=\"vertical-align: baseline;\"> (with the Gemini Developer API) is the fastest path from an idea to working code. A browser IDE, an API key, a generous free tier, and no cloud project to configure. It's where most ideas should start, and Google's own guidance says as much.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise Agent Platform </strong><span style=\"vertical-align: baseline;\">(formerly Vertex AI) has the same Gemini models (plus 3rd party and OSS ones)  with enterprise controls around them: IAM and service-account auth instead of raw keys, VPC Service Controls, Cloud Logging and Monitoring, reserved capacity, regional endpoints, and the compliance surface your first enterprise customer's security review will ask about.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The right answer for most startups is </span><span style=\"font-style: italic; vertical-align: baseline;\">both</span><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">sequenced deliberately</strong><span style=\"vertical-align: baseline;\">: </span><span style=\"font-style: italic; vertical-align: baseline;\">first</span><span style=\"vertical-align: baseline;\"> prototype in AI Studio, </span><span style=\"font-style: italic; vertical-align: baseline;\">then</span><span style=\"vertical-align: baseline;\"> migrate </span><strong style=\"vertical-align: baseline;\">before</strong><span style=\"vertical-align: baseline;\"> you have real users. The danger for startups is treating them as interchangeable solutions, AI Studio's simple key model does not translate to enterprise controls, and Agent Platform's IAM model might look like overkill until the day it saves you from a stolen-credential incident.</span></p>\n<p><span style=\"vertical-align: baseline;\">It's less work than it sounds like.</span></p>\n<p><span style=\"vertical-align: baseline;\">The unified </span><a href=\"https://github.com/googleapis/python-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">google-genai</span></a><span style=\"vertical-align: baseline;\"> SDK targets both:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Prototype: Google AI Studio, raw API key\\r\\nfrom google import genai\\r\\nclient = genai.Client(api_key=&quot;YOUR_AI_STUDIO_KEY&quot;)\\r\\n\\r\\n# Production: GEAP, no key — uses Application Default Credentials (ADC)\\r\\nfrom google import genai\\r\\nclient = genai.Client(\\r\\n    vertexai=True,\\r\\n    project=&quot;my-startup-prod&quot;,\\r\\n    location=&quot;us-central1&quot;,\\r\\n)\\r\\n\\r\\nresp = client.models.generate_content(\\r\\n    model=&quot;gemini-2.5-pro&quot;,\\r\\n    contents=&quot;Summarize this contract in three bullets.&quot;,\\r\\n)\\r\\nprint(resp.text)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5933ee42d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">#2  How do I set up a Google Cloud project without becoming an IAM expert?</span></h3>\n<p><span style=\"vertical-align: baseline;\">The biggest reason startups stall on the migration to Agent Platform isn't the code, it's the operational leap from \"here's an API key\" to a cloud project with folders, service accounts, org policies, logging, and IAM bindings. If your team doesn't have a dedicated cloud admin, that first project setup can eat a week of engineering time. </span></p>\n<p><span style=\"vertical-align: baseline;\">Three moves cut that dramatically:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Use an opinionated project template instead of clicking through the console.</strong><span style=\"vertical-align: baseline;\"> The </span><a href=\"https://console.cloud.google.com/cloud-setup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Setup checklist</span></a><span style=\"vertical-align: baseline;\"> and the </span><a href=\"https://cloud.google.com/architecture/framework\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Architecture Framework</span></a><span style=\"vertical-align: baseline;\"> give you a production-grade folder hierarchy (prod / non-prod / dev), a central logging + monitoring project, </span><a href=\"https://cloud.google.com/security-command-center\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</span></a><span style=\"vertical-align: baseline;\"> turned on, and baseline org policies, without you having to design them from scratch.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable the APIs you'll actually use, once.</strong><span style=\"vertical-align: baseline;\"> Batch it so you're not doing it project-by-project when you need it. The billing-link step is not optional. Every paid API you're about to enable will refuse to activate on a project with no billing account attached, so we handle that first.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Let </span><a href=\"https://cloud.google.com/iam/docs/role-picker-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini pick the roles</span></a><span style=\"vertical-align: baseline;\">, but ask it for the narrow ones. You don't have to memorize the roles reference. In the Grant access dialog, Help me choose roles lets you describe the task in plain language, \"this service account needs to call Gemini models and read one Cloud Storage bucket\", and get predefined roles back with the reasoning shown. </span><span>One catch worth knowing on day one: by default it suggests roles that cover common journeys, which usually means a service's Admin, Editor, or Viewer. Those are broader than you want. Say \"least privileged\" or \"narrowest access\" in the prompt and it returns granular roles instead. Same amount of typing, considerably smaller blast radius when a credential leaks.<br /><br /></span><span style=\"vertical-align: baseline;\">Sources: </span><a href=\"https://cloud.google.com/iam/docs/role-picker-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get predefined role suggestions with Gemini assistance</span></a></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# One-shot: create a Vertex-ready project and turn on the services a\\r\\n# typical AI startup uses.\\r\\ngcloud projects create my-startup-prod --name=&quot;My Startup (prod)&quot;\\r\\ngcloud config set project my-startup-prod\\r\\n\\r\\n# REQUIRED before enabling billing-dependent APIs (aiplatform, run, etc.).\\r\\n# Use `gcloud billing accounts list` to find your billing account ID.\\r\\ngcloud billing projects link my-startup-prod --billing-account=012345-6789AB-CDEF01\\r\\n\\r\\ngcloud services enable \\\\\\r\\n  aiplatform.googleapis.com \\\\\\r\\n  run.googleapis.com \\\\\\r\\n  artifactregistry.googleapis.com \\\\\\r\\n  logging.googleapis.com \\\\\\r\\n  monitoring.googleapis.com \\\\\\r\\n  secretmanager.googleapis.com \\\\\\r\\n  cloudbilling.googleapis.com&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025d4d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Sources: </span><a href=\"https://cloud.google.com/sdk/gcloud/reference/services/enable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud services enable reference</span></a><span style=\"vertical-align: baseline;\">, · </span><a href=\"https://cloud.google.com/sdk/gcloud/reference/billing/projects/link\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud billing projects link (GA)</span></a><span style=\"vertical-align: baseline;\">,  </span><a href=\"https://cloud.google.com/vertex-ai/docs/start/cloud-environment\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GE Agent Platform environment setup</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">If you're a solo founder, resist the urge to build in your personal GCP account. Create a proper organization or self-owned org first, then create the project </span><span style=\"font-style: italic; vertical-align: baseline;\">inside</span><span style=\"vertical-align: baseline;\"> it. That single decision can make everything else, fromIAM to billing and audit, dramatically easier.</span></p>\n<h3><span style=\"vertical-align: baseline;\">#3 I'm on Google Cloud, how should my code actually authenticate: API keys, service accounts, or user credentials?</span></h3>\n<p><span style=\"vertical-align: baseline;\">There's a hierarchy of safety here, and the easiest option is rarely the right one in production.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Raw API keys</strong><span style=\"vertical-align: baseline;\"> are fine for local prototyping. They are dangerous in production because they are long-lived, easy to leak into a client bundle or a public repo, and grant unbounded access until you notice.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">User credentials via OAuth (application default credentials)</strong><span style=\"vertical-align: baseline;\"> are best for interactive tools, CLIs, and any code that runs on a developer's laptop.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Service accounts with least-privilege IAM roles</strong><span style=\"vertical-align: baseline;\"> are the right answer for anything running on a server, in a container, or in a scheduled job.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The pattern you're aiming for is one where your </span><span style=\"font-style: italic; vertical-align: baseline;\">code never sees a key at all</span><span style=\"vertical-align: baseline;\">. It just calls the </span><a href=\"https://google-auth.readthedocs.io/en/latest/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Auth library</span></a><span style=\"vertical-align: baseline;\">, which quietly reads Application Default Credentials (ADC) from the environment,  a short-lived token minted for whichever service account is attached to your Cloud Run service, GKE workload, or Compute Engine VM. You get enterprise-grade auth without writing any auth code.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# On a developer laptop\\r\\ngcloud auth application-default login\\r\\n\\r\\n# On a server (Cloud Run, GKE, etc.) — no login, no key file.\\r\\n# Attach a service account with just the roles the app needs.\\r\\ngcloud run deploy my-agent \\\\\\r\\n  --image=us-docker.pkg.dev/my-startup-prod/agents/api:v1 \\\\\\r\\n  --service-account=agent-runtime@my-startup-prod.iam.gserviceaccount.com \\\\\\r\\n  --region=us-central1&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025cf50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Application code — notice: no keys, no secrets.\\r\\nfrom google import genai\\r\\n\\r\\nclient = genai.Client(\\r\\n    vertexai=True,\\r\\n    project=&quot;my-startup-prod&quot;,\\r\\n    location=&quot;us-central1&quot;,\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025f990&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Do one last favor to your future self: give that service account the </span><span style=\"font-style: italic; vertical-align: baseline;\">minimum</span><span style=\"vertical-align: baseline;\"> IAM role your workload actually needs,  usually </span><a href=\"https://cloud.google.com/vertex-ai/docs/general/access-control\"><span style=\"text-decoration: underline; vertical-align: baseline;\">roles/aiplatform.user</span></a><span style=\"vertical-align: baseline;\"> for calling models, not the broader admin roles. It takes an extra 30 seconds and prevents the credential from becoming a master key if it leaks.</span></p>\n<h3><span style=\"vertical-align: baseline;\">#4 When should I actually stop procrastinating and migrate from AI Studio's API key to Agent Platform's IAM model?</span></h3>\n<p><span style=\"vertical-align: baseline;\">Sooner than you'd like,  and the correct trigger is </span><strong style=\"vertical-align: baseline;\">not</strong><span style=\"vertical-align: baseline;\"> when it breaks. It's when any of these is true:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Your key has left your laptop (checked into a repo, pasted into a Slack, shipped in a mobile app).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You have more than one person on the team who needs to call the API.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You're spending more than a few hundred dollars a month.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You're about to onboard paying customers.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">A potential pitfall that can catch growing startups off guard is simple: a leaked Gemini API key on an account that normally spends $180 a month gets scraped from a public repo and used to run distillation attacks,  accumulating tens of thousands of dollars in charges before the owner even sees the first billing alert. The </span><a href=\"https://cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Shared Responsibility Model</span></a><span style=\"vertical-align: baseline;\"> is unambiguous: the customer is liable for charges incurred with their own valid credentials.</span></p>\n<p><span style=\"vertical-align: baseline;\">The migration itself is genuinely smaller than the anxiety around it. In </span><strong style=\"vertical-align: baseline;\">google-genai</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">it's the two-line change shown in #1. What takes real time is the </span><span style=\"font-style: italic; vertical-align: baseline;\">project setup</span><span style=\"vertical-align: baseline;\"> around it, which is exactly why #2 exists.</span></p>\n<p><span style=\"vertical-align: baseline;\">Practical checklist for cutover day:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# 1. Revoke every existing AI Studio key that has ever left a laptop.\\r\\n#    (Go to https://aistudio.google.com/apikey and delete them.)\\r\\n\\r\\n# 2. Confirm your production code has no api_key= arguments.\\r\\ngrep -rn &quot;api_key&quot; src/\\r\\n\\r\\n# 3. Enable GEAP and confirm ADC works locally.\\r\\ngcloud services enable aiplatform.googleapis.com\\r\\ngcloud auth application-default login\\r\\npython -c &quot;\\r\\nfrom google import genai\\r\\nc = genai.Client(vertexai=True, project=\\&#x27;my-startup-prod\\&#x27;, location=\\&#x27;us-central1\\&#x27;)\\r\\nprint(c.models.generate_content(model=\\&#x27;gemini-2.5-flash\\&#x27;, contents=\\&#x27;ping\\&#x27;).text)\\r\\n&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025cb10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If step 3 prints a response, you're on Agent Platform.</span></p>\n<h3><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Scale: get more capacity without paying a premium.</span></span></h3>\n<h3><span style=\"vertical-align: baseline;\">#5 Now that I'm shipping, why on earth am I getting all these </span><span style=\"vertical-align: baseline;\">HTTP 429</span><span style=\"vertical-align: baseline;\"> errors, and how do I make them stop?</span></h3>\n<p><span style=\"vertical-align: baseline;\">429 Too Many Requests</span><span style=\"vertical-align: baseline;\"> from Agent Platform almost always means one of two things:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You've hit the </span><strong style=\"vertical-align: baseline;\">Dynamic Shared Quota (DSQ)</strong><span style=\"vertical-align: baseline;\"> ceiling for your project's tier. DSQ is a shared pool sized against your project's history,  new projects start with modest limits by design, to prevent abuse across the platform.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You're calling a </span><strong style=\"vertical-align: baseline;\">global endpoint</strong><span style=\"vertical-align: baseline;\"> during a global demand spike, competing with worldwide traffic for shared capacity.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">The instinctive reaction is to file a quota-increase ticket. You can do that if you must,  but two architectural moves usually solve the problem faster and cheaper.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Pin to a regional endpoint.</strong><span style=\"vertical-align: baseline;\"> Over half of startup traffic on Agent Platform defaults to global routing. Pinning to a specific region (say </span><strong style=\"vertical-align: baseline;\">us-central1</strong><span style=\"vertical-align: baseline;\">) sidesteps global contention and typically improves latency at the same time. (One narrow exception, which we'll get to in the next question: if you specifically want Priority PayGo, that feature currently only ships on the `global` endpoint. For everything else, pin regionally.):</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google import genai\\r\\n\\r\\n# Global (default): competes against worldwide demand.\\r\\n# Regional: routes only to the regional cluster, less contention.\\r\\nclient = genai.Client(\\r\\n    vertexai=True,\\r\\n    project=&quot;my-startup-prod&quot;,\\r\\n    location=&quot;us-central1&quot;,   # &lt;-- this is the one-line fix\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025db90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Add real retry and backoff.</strong><span style=\"vertical-align: baseline;\"> A 429 is a retryable signal, not a fatal error. Any production client should have exponential backoff with jitter. The modern google-genai SDK </span><a href=\"https://cloud.google.com/vertex-ai/docs/reference/rest#retry_settings\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ships this behavior</span></a><span style=\"vertical-align: baseline;\"> built in, but only if you actually enable it. This is easy to overlook. Don't reach for the classic `google.api_core.retry.if_transient_error` decorator you may have seen on older Vertex code. It's designed for the legacy exception classes and does not recognize the new `google.genai.errors.APIError,  so it will silently pass 429s through without retrying. Use the SDK's built-in retry options instead:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(\\r\\n    vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;us-central1&quot;,\\r\\n    http_options=types.HttpOptions(retry_options=types.HttpRetryOptions(\\r\\n        attempts=5, initial_delay=1.0, max_delay=60.0, exp_base=2.0, jitter=1.0,\\r\\n        http_status_codes=[408, 429, 500, 502, 503, 504],\\r\\n    ))\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025f790&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">How do you see this coming?  </strong><span style=\"vertical-align: baseline;\">Preferably not from a user telling you. Agent Platform publishes serving metrics to Cloud Monitoring, and there is a prebuilt dashboard you don't have to assemble: Console → Agent Platform → Dashboard → Model observability. It gives you requests per second, token throughput, first-token latency, and error rates out of the box.</span></p>\n<p><span style=\"vertical-align: baseline;\">The metric to actually alert on is </span><code style=\"vertical-align: baseline;\">aiplatform.googleapis.com/publisher/online_serving/model_invocation_count</code><span style=\"vertical-align: baseline;\">. It carries an </span><code style=\"vertical-align: baseline;\">error_category</code><span style=\"vertical-align: baseline;\"> label with values of </span><code style=\"vertical-align: baseline;\">user</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">system</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">capacity</code><span style=\"vertical-align: baseline;\">. Alerting on </span><code style=\"vertical-align: baseline;\">capacity</code><span style=\"vertical-align: baseline;\"> isolates genuine throttling from your own bad requests, which a raw 429 count won't do.</span></p>\n<p><span style=\"vertical-align: baseline;\">One thing worth internalizing, because it trips people up: you cannot build a \"warn me at 80% of my quota\" alert for Standard PayGo. Under Dynamic Shared Quota there is no fixed per-project number to be at 80% of. A 429 means transient contention for shared capacity, not that you crossed a line. Percent-of-limit alerting only becomes meaningful once you're on Provisioned Throughput, which does expose real limit metrics.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud monitoring policies create --policy-from-file=capacity-alert.yaml&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025c4d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Sources: </span><a href=\"https://cloud.google.com/monitoring/api/metrics_gcp_a_b\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform metrics list</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model observability dashboard</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/googleapis/python-genai/blob/main/google/genai/types.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RetryOptions source</span></a><span style=\"vertical-align: baseline;\">,  </span><a href=\"https://github.com/googleapis/google-cloud-python/blob/main/packages/google-api-core/google/api_core/retry/retry_base.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">core retry_base.py</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/googleapis/python-genai/blob/main/google/genai/errors.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">genai </span></a><a href=\"http://errors.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">errors.py</span></a><span style=\"vertical-align: baseline;\">,  </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/reduce-429-errors-on-vertex-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">reduce 429 errors</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/sdk/gcloud/reference/monitoring/policies/create\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud monitoring policies create</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/dynamic-shared-quota\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dynamic Shared Quota</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Follow the </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/quotas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform rate limits documentation</span></a><span style=\"vertical-align: baseline;\"> to understand what</span><span style=\"font-style: italic; vertical-align: baseline;\"> your</span><span style=\"vertical-align: baseline;\"> project's current ceiling actually is before you assume you've outgrown it. </span></p>\n<h3><span style=\"vertical-align: baseline;\">#6 Which consumption mode do I pay for: Standard PayGo, Priority PayGo, or Provisioned Throughput? </span></h3>\n<p><span style=\"vertical-align: baseline;\">Three consumption models, three completely different workload shapes, and three completely different ways to proceed. Picking the right one can help startups see meaningful savings on AI bills. First let’s define them and then see when they are, or aren’t, a good fit: </span></p>\n<p><strong style=\"vertical-align: baseline;\">Standard PayGo (DSQ)</strong><span style=\"vertical-align: baseline;\">: Pay per token from a shared pool; cheap, no guarantees.<br /></span><strong style=\"vertical-align: baseline;\">Priority PayGo</strong><span style=\"vertical-align: baseline;\">: Pay per token at a premium to jump the queue.<br /></span><strong style=\"vertical-align: baseline;\">Provisioned Throughput (PT)</strong><span style=\"vertical-align: baseline;\">: Prepay for reserved capacity; predictable, use it or lose it.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Consumption type</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Best for</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Watch out for</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Standard PayGo (DSQ)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Early-stage, low-QPS, spiky prototype traffic</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">429s during spikes; no reliability SLO</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Priority PayGo</strong></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Bursty, revenue-critical traffic that can't tolerate 429s</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Roughly 1.8x the standard token price</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/provisioned-throughput\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Provisioned Throughput (PT)</strong></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Steady, predictable, high-volume production traffic</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Wasted spend if utilization is under ~40%; overflow to PayGo on spikes</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">The dominant startup mistake is buying PT too early. Usually  this happens the  week after a big launch when it feels like traffic will only ever go up. PT is </span><span style=\"font-style: italic; vertical-align: baseline;\">reserved</span><span style=\"vertical-align: baseline;\"> capacity. You  pay whether you use it or not, and it only starts paying you back once your baseline is genuinely predictable, not just aspirational.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here’s a pragmatic sequence:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Weeks one through four on Standard PayGo.</strong><span style=\"vertical-align: baseline;\"> Use it to measure your real request shape (tokens per minute at p50 and p99, request bursts, batchable vs. real-time split).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">When you get your first bad 429 storm,</strong><span style=\"vertical-align: baseline;\"> flip on Priority PayGo for the traffic that actually matters. It's a config change, not a purchase order,  nobody in procurement needs to be involved:</span></p>\n</li>\n</ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Priority PayGo request: use the global endpoint + two extra headers.\\r\\nfrom google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;global&quot;)\\r\\nresp = client.models.generate_content(\\r\\n    model=&quot;gemini-2.5-pro&quot;,\\r\\n    contents=&quot;Rank these support tickets by urgency: ...&quot;,\\r\\n    config=types.GenerateContentConfig(\\r\\n        # Priority PayGo headers, per current GEAP docs.\\r\\n        http_options=types.HttpOptions(headers={&quot;X-Vertex-AI-LLM-Request-Type&quot;: &quot;shared&quot;, &quot;X-Vertex-AI-LLM-Shared-Request-Type&quot;: &quot;priority&quot;}),\\r\\n    ),\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025f110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. </span><strong style=\"vertical-align: baseline;\">Once you can predict your baseline TPM,</strong><span style=\"vertical-align: baseline;\"> buy PT to cover the flat baseline and let anything above it overflow to PayGo. That's the </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/provisioned-throughput-on-vertex-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">combined pattern Google recommends</span></a><span style=\"vertical-align: baseline;\"> for exactly this reason. Best of both worlds, not marketing spin.</span></p>\n<p><span style=\"vertical-align: baseline;\"> Sources: </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/priority-paygo\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Priority PayGo docs</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://github.com/googleapis/python-genai/blob/main/google/genai/types.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">google-genai HttpOptions source</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/reference/rest\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GEAP REST reference</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<h3><span style=\"vertical-align: baseline;\">#7 Which of my requests actually need to be live, and which should be batch jobs?</span></h3>\n<p><span style=\"vertical-align: baseline;\">Most startup workloads are secretly batch jobs pretending to be real-time. Every one you move off the interactive path frees up DSQ headroom for the traffic that genuinely needs to be fast,  the traffic where a user is actually watching a spinner.</span></p>\n<p><span style=\"vertical-align: baseline;\">Three questions to help you sort your traffic:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Does a human have to see the result within a second? That means:  </span><strong style=\"vertical-align: baseline;\">Live inference.</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Can the user wait a few seconds and see a spinner? That means:  Still live, but a candidate for streaming.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Would the user tolerate \"we'll email you when it's ready\" or \"check back in a bit\"?  That means: </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/multimodal/batch-prediction\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Batch prediction</strong></a><strong style=\"vertical-align: baseline;\">.</strong></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Batch prediction on Agent Platform runs in a completely separate queue, does not consume your interactive DSQ, and is typically about half the price of on-demand inference. That's a rare double win: faster live traffic </span><span style=\"font-style: italic; vertical-align: baseline;\">and</span><span style=\"vertical-align: baseline;\"> a lower bill.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Kick off a batch prediction job from a JSONL file in Cloud Storage.\\r\\n# Each line is one prompt; results land in another Cloud Storage prefix.\\r\\nfrom google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;us-central1&quot;)\\r\\n\\r\\njob = client.batches.create(\\r\\n    model=&quot;gemini-2.5-flash&quot;,\\r\\n    src=&quot;gs://my-startup-prod-batch/inputs/nightly-summaries.jsonl&quot;,\\r\\n    config=types.CreateBatchJobConfig(\\r\\n        dest=&quot;gs://my-startup-prod-batch/outputs/&quot;,\\r\\n    ),\\r\\n)\\r\\nprint(job.name, job.state)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025e1d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Common candidates: nightly document summarization, background classification of new signups, bulk translation, embedding backfills, evaluation runs against your test set. If any of those are on your live path today, moving them is often the single highest-leverage change you can make this week.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Govern: Keep costs, keys, and agents under control.</span></h3>\n<h3><span style=\"vertical-align: baseline;\">#8 How do I set spend caps that actually reduce cost, and not just send me polite emails while my bill triples?</span></h3>\n<p><span style=\"vertical-align: baseline;\">Until recently the honest answer was that budgets only notify, and you had to build your own brake pedal. That changed in July. There are now three mechanisms, and you should think of them as layers.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">spend cap budget</span></a><span style=\"vertical-align: baseline;\"> (Preview). Cloud Billing budgets can now enforce rather than just email. Set a spend cap on a project and, when usage costs cross 100% of the budget, Google pauses the service until you manually lift it. Agent Platform is explicitly on the eligible list, alongside the Gemini API, Cloud Run, and Cloud Run functions. Alerts still fire at 50% and 80%, so the pause isn't a surprise.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Three things to know before you rely on it:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Each cap covers one project and one eligible service. It is not account-wide protection. If you want Agent Platform and Cloud Run both capped, that's two caps. </span></p>\n</li>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enforcement is not instant and is based on estimated costs. Overages past the cap are billed as normal, so set the number below your real ceiling. Lifting it is manual, and service resumption can take up to an hour. It also pauses Provisioned Throughput usage, so if you've prepaid for capacity, a cap hit stops that too.</span></p>\n</li>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">It's in Preview as of publication, and the eligible-service list is documented as growing. Check the current list before you design around it.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">A billing budget with a Pub/Sub trigger that disables billing</strong><span style=\"vertical-align: baseline;\">. Still the right tool when you need blast radius the spend cap can't give you: multiple services at once, an entire project, or a service that isn't eligible yet. When the budget hits a threshold, Pub/Sub fires a Cloud Function that detaches the billing account, which stops all billable activity within minutes. Blunter and more dangerous than the native cap — it can leave resources unrecoverable — so reach for it second, not first. </span><span style=\"vertical-align: baseline;\">Full walkthrough: </span><a href=\"https://cloud.google.com/billing/docs/how-to/notify\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Automatically respond to budget notifications</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Sketch: create a budget SCOPED TO ONE PROJECT that publishes to Pub/Sub at 50%, 90%, 100%.\\r\\ngcloud billing budgets create \\\\\\r\\n  --billing-account=012345-6789AB-CDEF01 \\\\\\r\\n  --display-name=&quot;my-startup-prod hard stop&quot; \\\\\\r\\n  --budget-amount=2000USD \\\\\\r\\n  --filter-projects=projects/my-startup-prod \\\\\\r\\n  --threshold-rule=percent=0.5 \\\\\\r\\n  --threshold-rule=percent=0.9 \\\\\\r\\n  --threshold-rule=percent=1.0,basis=current-spend \\\\\\r\\n  --notifications-rule-pubsub-topic=projects/my-startup-prod/topics/budget-alerts&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025f910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Sources: </span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Manage spend cap budgets</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-programmatic-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Set up programmatic notifications</span></a><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/sdk/gcloud/reference/billing/budgets/create\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcloud billing budgets create reference</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Billing budgets concepts</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/billing/docs/how-to/disable-billing-with-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Disable billing with notifications walkthrough</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-programmatic-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Programmatic notification payload schema</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Two things to get ahead of  for, as the defaults can cause unexpected issues: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Limit your budget scope: Without --filter-projects, your budget applies to your entire billing account. A spike in any project will trigger the kill switch for everything. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Deploy locally: The budget notification doesn't specify which project is affected. To ensure the kill switch only affects the intended project, deploy your Cloud Function in the same project you're protecting (e.g., my-startup-prod).</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Then wire up a tiny Cloud Function to that topic that calls </span><strong style=\"vertical-align: baseline;\">projects.updateBillingInfo</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">to unlink the billing account when the 100% threshold fires. That is your circuit breaker.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Mechanical ceilings via quota overrides.</strong><span style=\"vertical-align: baseline;\"> Even if you never set up the above kill switch, you can cap the </span><span style=\"font-style: italic; vertical-align: baseline;\">rate</span><span style=\"vertical-align: baseline;\"> at which cost can accumulate by setting explicit per-model, per-region quotas below the platform default. If your app never legitimately needs more than 500 requests per minute for </span><strong style=\"vertical-align: baseline;\">gemini-2.5-pro</strong><span style=\"vertical-align: baseline;\">, cap it there in the </span><a href=\"https://cloud.google.com/docs/quotas/view-manage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Quotas console</span></a><span style=\"vertical-align: baseline;\">; a leaked key can't burn what the quota flatly refuses to serve.</span></p>\n<h3><span style=\"vertical-align: baseline;\">#9 Where should I actually keep secrets? (Not in .env files!)</span></h3>\n<p><span style=\"vertical-align: baseline;\">The short answer is: </span><a href=\"https://cloud.google.com/secret-manager\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager</span></a><span style=\"vertical-align: baseline;\">. Not  in environment variables, not in </span><strong style=\"vertical-align: baseline;\">.env</strong><span style=\"vertical-align: baseline;\"> files, and never in your repo. Grant read access via IAM only to the service account that needs it.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Store a third-party API key (Stripe, OpenAI, whatever).\\r\\necho -n &quot;sk_live_xxx&quot; | gcloud secrets create stripe-live-key --data-file=-\\r\\n\\r\\n# Grant only the runtime service account access to read it.\\r\\ngcloud secrets add-iam-policy-binding stripe-live-key \\\\\\r\\n  --member=serviceAccount:agent-runtime@my-startup-prod.iam.gserviceaccount.com \\\\\\r\\n  --role=roles/secretmanager.secretAccessor&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025f9d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Application code fetches it at startup; nothing lives on disk.\\r\\nfrom google.cloud import secretmanager\\r\\nsm = secretmanager.SecretManagerServiceClient()\\r\\nresp = sm.access_secret_version(\\r\\n    name=&quot;projects/my-startup-prod/secrets/stripe-live-key/versions/latest&quot;\\r\\n)\\r\\nstripe_key = resp.payload.data.decode(&quot;utf-8&quot;)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025e9d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Then two little disciplines that pay for themselves the first time you need them:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rotation on a schedule and on suspicion.</strong><span style=\"vertical-align: baseline;\"> Secret Manager versions are cheap; treat them as immutable and roll forward. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Detection when a secret leaks.</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/secret-manager/docs/event-notifications\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager notifications</span></a><span style=\"vertical-align: baseline;\"> and Google Cloud's </span><a href=\"https://cloud.google.com/sensitive-data-protection\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sensitive Data Protection</span></a><span style=\"vertical-align: baseline;\"> can catch keys checked into a repo or pasted into a log stream,  before an attacker does.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For any AI application that acts on a user's behalf, calls Gmail on their behalf, reads a Drive folder, hits a third-party SaaS with the user's credentials, do </span><span style=\"font-style: italic; vertical-align: baseline;\">not</span><span style=\"vertical-align: baseline;\"> store a long-lived token. Use OAuth 2.0 with short-lived access tokens and a refresh flow, so that when a user rage-quits or a compromised account gets revoked, the agent loses access at the same time. </span></p>\n<h3><span style=\"vertical-align: baseline;\">#10  How do I stop my brand new AI agent from doing something it absolutely shouldn't?</span></h3>\n<p><span style=\"vertical-align: baseline;\">An agent that can call tools, browse the web, or execute code needs the same defense-in-depth thinking as any other production service, arguably more, because it makes decisions that neither you nor the model can fully predict in advance.</span></p>\n<p><span style=\"vertical-align: baseline;\">Four layers, none optional once you have real users:</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. Identity for the agent itself.</strong><span style=\"vertical-align: baseline;\"> Give the agent its own service account, scoped only to the resources and tools it genuinely needs,  the exact same least-privilege principle as any other workload. Agent Engine supports first-class </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/agent-engine/identity\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agent identity</span></a><span style=\"vertical-align: baseline;\"> so every action can be attributed to a specific agent instance in your audit logs.</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. Sandboxed code execution.</strong><span style=\"vertical-align: baseline;\"> If your agent runs generated code,  a common pattern for data-analysis or \"run this Python for me\" flows, do not run it in your application process. Use an </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/code-execution\"><span style=\"text-decoration: underline; vertical-align: baseline;\">isolated sandbox</span></a><span style=\"vertical-align: baseline;\"> so a bad combination can't touch your production data.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Enable server-side code execution inside a sandbox for a request.\\r\\nfrom google import genai\\r\\nfrom google.genai import types\\r\\n\\r\\nclient = genai.Client(vertexai=True, project=&quot;my-startup-prod&quot;, location=&quot;us-central1&quot;)\\r\\nresp = client.models.generate_content(\\r\\n    model=&quot;gemini-2.5-pro&quot;,\\r\\n    contents=&quot;Compute the correlation between these two columns: ...&quot;,\\r\\n    config=types.GenerateContentConfig(\\r\\n        tools=[types.Tool(code_execution=types.ToolCodeExecution())],\\r\\n    ),\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593025e890&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. Prompt and response filtering.</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/security-command-center/docs/model-armor-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</span></a><span style=\"vertical-align: baseline;\"> sits in front of your model calls and screens for prompt injection, jailbreaks, sensitive-data exfiltration, and off-brand output,  all of which are essentially guaranteed the moment you have real users being real users.</span></p>\n<p><strong style=\"vertical-align: baseline;\">4. Behavioral monitoring.</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/security-command-center\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</span></a><span style=\"vertical-align: baseline;\"> with </span><a href=\"https://cloud.google.com/security-command-center/docs/concepts-security-sources\"><span style=\"text-decoration: underline; vertical-align: baseline;\">threat detection</span></a><span style=\"vertical-align: baseline;\"> flags anomalies in agent behavior,  a service account suddenly calling an API it's never touched before, an agent reaching out to an unfamiliar external host, an unexpected spike in privileged operations. In near-real-time.</span></p>\n<p><span style=\"vertical-align: baseline;\">None of these are optional once your agent is acting on behalf of a real user or handling real money.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Your homework, so to speak:</span></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Audit for raw API keys in your repo, your notebooks, and your production runtime. Rotate anything that shouldn't be there.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Move any workload that doesn't need a synchronous response to the Batch API.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Turn on the Model observability dashboard and put one alert on capacity errors, so the next 429 reaches you before it reaches a customer.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Set a spend cap on the project, and keep an eye out for 50% and 80% alerts. If usage crosses 100% of the budget, Google will pause the service until you manually lift it.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Do those four things this week and you're already ahead of most startups shipping AI features. </span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Have a scenario you'd like us to cover next? Reach us at </span><a href=\"https://cloud.google.com/startup\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Google Cloud for Startups</span></a><span style=\"font-style: italic; vertical-align: baseline;\">.</span></p></div>"
  "d88667e15a52d5d1fc3b61f71b882283":
    "id": "d88667e15a52d5d1fc3b61f71b882283"
    "title": "Announcing quantum-safe key import in Cloud KMS"
    "link": "https://cloud.google.com/blog/products/identity-security/announcing-quantum-safe-key-import-in-cloud-kms/"
    "published": "2026-08-21 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As enterprises increasingly adopt multicloud architectures, bring your own key (BYOK) has become a fundamental pillar for maintaining data sovereignty and helping protect critical cloud workloads. At the same time, quantum computing has rapidly advanced, and security teams need to re-evaluate how they securely transfer encryption keys across networks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Following our previous announcements of </span><a href=\"https://cloud.google.com/blog/products/identity-security/announcing-quantum-safe-digital-signatures-in-cloud-kms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">quantum-safe digital signatures</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/blog/products/identity-security/announcing-quantum-safe-key-encapsulation-mechanisms-in-cloud-kms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">quantum-safe key encapsulation mechanisms</span></a><span style=\"vertical-align: baseline;\"> (KEMs)</span><span style=\"vertical-align: baseline;\"> in Cloud Key Management Service (Cloud KMS), we are excited to announce the preview of </span><a href=\"https://docs.cloud.google.com/kms/docs/quantum-safe-key-import\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">quantum-safe key import in Cloud KMS</strong></a><span style=\"vertical-align: baseline;\"> for software-based cryptographic keys.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our updated quantum-safe BYOK capability, the first step of the next phase of our </span><a href=\"https://cloud.google.com/blog/products/identity-security/pqc-in-plaintext-google-clouds-post-quantum-cryptography-roadmap\"><span style=\"text-decoration: underline; vertical-align: baseline;\">post-quantum cryptography (PQC) migration timeline</span></a><span style=\"vertical-align: baseline;\">, can help you protect your sensitive keys before a cryptographically-relevant quantum computer (CRQC) emerges.</span></p>\n<p><span style=\"vertical-align: baseline;\">As you adopt quantum-safe key import to help protect your keys in transit, you can also monitor your overall post-quantum posture with</span> <a href=\"https://docs.cloud.google.com/kms/docs/view-pqc-insights\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud KMS PQC insights</strong></a><span style=\"vertical-align: baseline;\">, now generally available. This high-level visual illustrates your asymmetric keys based on the categorization of the algorithms they use, and can help you plan for future modernization and support long-term resilience.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The threat: Store Now, Decrypt Later attacks</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Traditional key import methods rely on classical asymmetric encryption standards to wrap keys during transit. While these algorithms successfully defend against today’s threats, they will become fundamentally insecure when a viable quantum computer emerges that can potentially decrypt keys that adversaries have intercepted and stored. </span></p>\n<p><span style=\"vertical-align: baseline;\">Quantum-safe key import helps mitigate these </span><a href=\"https://www.ietf.org/archive/id/draft-reddy-uta-pqc-app-03.html#name-timeline-for-transition\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">store now, decrypt later</span></a><span style=\"vertical-align: baseline;\"> (SNDL) attacks by wrapping your keys in a quantum-resistant envelope from day one.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Building a quantum-resistant envelope for keys</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The post-quantum transit mechanism now available in Cloud KMS uses </span><a href=\"https://datatracker.ietf.org/doc/rfc9180/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">hybrid public key encryption</span></a><span style=\"vertical-align: baseline;\"> (HPKE). Our new import method wraps your sensitive software key material in a quantum-resistant transit envelope. The process integrates into the existing Cloud KMS API workflow to minimize your work:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Initiating the job</strong><span style=\"vertical-align: baseline;\">: The client creates a new import job through the Cloud KMS API, requesting a post-quantum HPKE import method.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Key generation</strong><span style=\"vertical-align: baseline;\">: The Cloud KMS server generates a post-quantum KEM private key and exposes the corresponding public key to the client.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Client-side wrapping</strong><span style=\"vertical-align: baseline;\">: Using a supported cryptographic library (such as Tink or OpenSSL), the client executes an HPKE </span><code style=\"vertical-align: baseline;\">Seal()</code><span style=\"vertical-align: baseline;\"> operation. This encapsulates the public key to establish a shared secret, derives an ephemeral AES key using HKDF-SHA256, and encrypts the target key material.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Submission</strong><span style=\"vertical-align: baseline;\">: The client transmits the encapsulated ciphertext concatenated directly with the encrypted key material back to the Cloud KMS endpoint, which already has quantum-safe data-in-transit protection built-in.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unwrapping</strong><span style=\"vertical-align: baseline;\">: The Cloud KMS server executes an HPKE </span><code style=\"vertical-align: baseline;\">Open()</code><span style=\"vertical-align: baseline;\"> operation using its private portion of the wrapping key to safely decrypt and help protect the key material within the Cloud KMS boundary.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For the KEM layer, you can choose between </span><a href=\"https://datatracker.ietf.org/doc/draft-connolly-cfrg-xwing-kem/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">X-Wing</strong></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://csrc.nist.gov/pubs/fips/203/final\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ML-KEM-768</strong></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://csrc.nist.gov/pubs/fips/203/final\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ML-KEM-1024</strong></a><span style=\"vertical-align: baseline;\">. The key derivation layer utilizes </span><strong style=\"vertical-align: baseline;\">HKDF-SHA-256</strong><span style=\"vertical-align: baseline;\">, and the final symmetric wrapper employs </span><strong style=\"vertical-align: baseline;\">AES-256-GCM</strong><span style=\"vertical-align: baseline;\"> with standard 12-byte nonces.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about setting up your import jobs, preparing your local key material using external cryptographic libraries, and managing quantum-safe solutions, check out our </span><a href=\"https://docs.cloud.google.com/kms/docs/quantum-safe-key-import\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud KMS quantum safe key import documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">A critical milestone in Google Cloud's PQC journey</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The global migration to post-quantum cryptography is a marathon that you take one milestone at a time. Today, you can create your first </span><a href=\"https://docs.cloud.google.com/kms/docs/quantum-safe-key-import\"><span style=\"text-decoration: underline; vertical-align: baseline;\">quantum safe key import job</span></a><span style=\"vertical-align: baseline;\"> and begin the process of helping make your applications quantum-safe. </span></p>\n<p><span style=\"vertical-align: baseline;\">We </span><a href=\"mailto:cloudkms-feedback@google.com\"><span style=\"text-decoration: underline; vertical-align: baseline;\">welcome your feedback</span></a><span style=\"vertical-align: baseline;\"> and invite you to reach out to explore how we can support your organization's post-quantum strategy.</span></p></div>"
"last_updated": "2026-08-27 21:31:27 JST"
