  "bc60e639368ccb3ac301024616b196f3":
    "id": "bc60e639368ccb3ac301024616b196f3"
    "title": "Gemini in Database Migration Service を使用した PostgreSQL への移行の迅速化"
    "link": "https://cloud.google.com/blog/ja/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms/"
    "published": "2026-08-21 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 12 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">次のようなシナリオを考えてみましょう。Oracle や SQL Server などの既存の商用データベースから、オープンソースの PostgreSQL や </span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> などのフルマネージド サービスにコア アプリケーションを移行するとします。</span></p>\n<p><span style=\"vertical-align: baseline;\">最初のフェーズは順調に進みます。スキーマが変換され、テーブルにデータが入力され、データ移行パイプラインが数テラバイトのデータを数時間で転送します。プロジェクトは予定より早く進んでいるようです。</span></p>\n<p><span style=\"vertical-align: baseline;\">そのとき、チームはボトルネックに直面します。</span></p>\n<p><span style=\"vertical-align: baseline;\">既存のデータベースには、何百ものストアド プロシージャ、複雑なトリガー、そして PL/SQL や T-SQL など独自の SQL 言語で記述されたカスタム関数が埋め込まれています。これらのルーチンには、トランザクションの検証、注文処理、カスタム レポートの処理など、長年にわたる重要なビジネス ロジックが含まれています。</span></p>\n<p><span style=\"vertical-align: baseline;\">モダナイゼーション プロジェクトは急に行き詰まります。数千行に及ぶ手続き型ロジックの変換には、2 つの言語に関する専門知識、数か月にわたる手作業での書き換えが必要となり、高確率で変換エラーが伴います。このコード変換は、データベース移行の「ラスト ワンマイル」のボトルネックであり、移行における最も複雑な部分です。</span></p>\n<p><span style=\"vertical-align: baseline;\">幸いなことに、このラスト ワンマイル問題は、最近の AI の進歩によって解決できます。</span><a href=\"https://cloud.google.com/database-migration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Database Migration Service</span></a><span style=\"vertical-align: baseline;\">（DMS）には、Gemini を活用した AI によるコード変換が含まれています。移行ワークフローに生成 AI を直接組み込むことで、ストアド プロシージャ、トリガー、カスタム関数を、より高速かつ正確に PostgreSQL PL/pgSQL コードに変換できます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ストアド プロシージャの変換に関する課題</strong></h3>\n<p><span style=\"vertical-align: baseline;\">商用データベース エンジンでは、ストアド プロシージャ、ユーザー定義関数、パッケージ本体、条件付きロジックに、ベンダー固有の構文が使用されています。このロジックを PostgreSQL PL/pgSQL に変換するには、変数の定義、例外処理ブロック、カーソルループ、組み込み関数のマッピングが必要になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">何百ものストアド プロシージャを含む複雑なエンタープライズ スキーマを移行する場合、たいていは手動でのコード変換に数か月のエンジニアリング作業が必要になります。データベース チームは、以前のロジックを 1 行ずつ解析し、条件分岐を実装し直して、エンジン間のデータ型変換を検証する必要があります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">DMS での AI によるコード変換</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini in Database Migration Service は、Google Cloud コンソール内で直接、この変換作業を迅速化します。DMS は、スキーマを自動的に変換するとともに、AI 生成のコードを提案して、ソース言語と PostgreSQL の構造上の違いを説明します。</span></p>\n<p><span style=\"vertical-align: baseline;\">PL/pgSQL に変換されたコードは、元のソースコードと並べて表示されます。データベース チームは提案内容をリアルタイムで確認、編集、検証できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - DMS_Code_Conversion_Console\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_DMS_Code_Conversion_Console.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: Database Migration Service のインターフェースに、変換前後のコードと Gemini によるインラインの説明が表示されている。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">AI の統合が重要である理由</strong></h3>\n<p><span style=\"vertical-align: baseline;\">主要ベンダーのほとんどの AI アプリや AI ツールには、SQL コードなどのコードを生成、変換する機能があります。しかし、汎用の AI チャットツールが提供するスニペットの変換機能では、エンタープライズ データベースの変換には不十分です。Gemini in Database Migration Service には、以下の重要な利点があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スキーマの完全なコンテキスト:</strong><span style=\"vertical-align: baseline;\"> Gemini in DMS は、コード スニペットを個別に評価するのではなく、移行プロジェクト全体にわたり、テーブルの関係、データ型、依存ビュー、プロシージャ間参照などのデータベース コンテキストを総合的に分析します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンタープライズ向けのセキュリティとプライバシー:</strong><span style=\"vertical-align: baseline;\"> コード変換は、厳密に Google Cloud プロジェクトの境界と IAM ガバナンスの範囲内で実行されるため、独自のビジネス ロジックと知的財産を保護できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">統合された実行ワークスペース:</strong><span style=\"vertical-align: baseline;\"> DMS を使用すると、何百ものファイルにわたる手動でのコピーと貼り付けが不要になります。単一のコンソール内で、並べて表示されたコードの違いと AI によるインラインの説明を確認し、必要に応じてコードを編集したうえで、検証済みの PL/pgSQL ルーティンをターゲット データベースに直接デプロイできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">決定論的な精度と AI コンパイル</strong><span style=\"vertical-align: baseline;\">: DMS は決定論的なコンパイラ ルールによる 1 対 1 のマッピング（標準的な DDL 変換、スカラー関数、明確に定義された構文変換など）と、複雑な手続き型ブロックのための Gemini の文脈的統合を組み合わせることで、モデルのドリフトを防ぎ、正確で予測可能な変換を保証します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Oracle PL/SQL から PostgreSQL への変換</strong></h3>\n<p><span style=\"vertical-align: baseline;\">顧客の合計注文額を算出し、独自の NVL 関数と DECODE 関数を使用して段階別の割引を適用する Oracle PL/SQL ストアド プロシージャを考えてみましょう。当初のワークフローでは、NVL を COALESCE に手動でマッピングし、DECODE ステートメントを標準の CASE 式に書き換え、WHEN NO_DATA_FOUND THEN などの例外ブロックを調整する必要がありました。</span></p>\n<p><span style=\"vertical-align: baseline;\">DMS で移行評価を実行すると、Gemini がソース プロシージャを分析し、ネイティブの PostgreSQL PL/pgSQL コードを生成します。</span></p>\n<p><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">ソース: Oracle PL/SQL</strong></span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE OR REPLACE PROCEDURE calculate_discount (\\r\\n  p_customer_id IN NUMBER,\\r\\n  p_discount OUT NUMBER\\r\\n) AS\\r\\n  v_total NUMBER := 0;\\r\\nBEGIN\\r\\n  SELECT NVL(SUM(amount), 0) INTO v_total\\r\\n  FROM orders WHERE customer_id = p_customer_id;\\r\\n  \\r\\n  p_discount := DECODE(TRUE, v_total &gt; 10000, 0.15, v_total &gt; 5000, 0.10, 0.05);\\r\\nEXCEPTION\\r\\n  WHEN NO_DATA_FOUND THEN\\r\\n    p_discount := 0;\\r\\nEND;\\r\\n/&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e92cda190&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">ターゲット: PostgreSQL PL/pgSQL（Gemini in DMS で変換）</strong></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;CREATE OR REPLACE FUNCTION calculate_discount (\\r\\n  p_customer_id NUMERIC,\\r\\n  OUT p_discount NUMERIC\\r\\n) RETURNS NUMERIC AS $$\\r\\nDECLARE\\r\\n  v_total NUMERIC := 0;\\r\\nBEGIN\\r\\n  SELECT COALESCE(SUM(amount), 0) INTO v_total\\r\\n  FROM orders WHERE customer_id = p_customer_id;\\r\\n\\r\\n  p_discount := CASE\\r\\n    WHEN v_total &gt; 10000 THEN 0.15\\r\\n    WHEN v_total &gt; 5000 THEN 0.10\\r\\n    ELSE 0.05\\r\\n  END;\\r\\nEND;\\r\\n$$ LANGUAGE plpgsql;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e93f34210&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Gemini は、生成された SQL とともに、NVL が COALESCE に変換された理由と、Oracle の DECODE 関数が PostgreSQL で明示的な CASE ブロックに変換された方法について、詳しい説明をインラインで表示します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Migration_Workflow_Diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Migration_Workflow_Diagram.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 2: Gemini in DMS を活用したエンドツーエンドのデータベース コード変換パイプライン。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">スキーマの完全な管理と検証の維持</strong></h3>\n<p><span style=\"vertical-align: baseline;\">セキュリティ、透明性、コードの精度は、データベースのモダナイゼーションにおいて依然として中心的な要素です。Gemini in DMS は、厳密に Google Cloud の確立されたセキュリティ境界内で動作し、コードをプロジェクト内に限定して公開します。</span></p>\n<p><span style=\"vertical-align: baseline;\">変換と検証のプロセスは、信頼性を保証するため、構造化されたワークフローに沿って行われます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スキーマ コンテキストの自動取得:</strong><span style=\"vertical-align: baseline;\"> DMS 変換ワークスペースを設定すると、テーブル スキーマ、データ型、外部キー制約、プロシージャ間の依存関係など、ソース データベースの全メタデータが自動的に解析されます。Gemini では、このプロジェクト全体のコンテキストを参照してコードが生成されるため、依存オブジェクトの定義を手動で指定する必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">構文と依存関係の自動検証:</strong><span style=\"vertical-align: baseline;\"> コードの生成時、DMS はターゲットとなる PostgreSQL の構文ルールに照らして検証パーサーを実行します。検証ステータス インジケーター（変換済み、警告、要対応など）が各オブジェクトに割り当てられるため、手動での確認が必要なルーティンはすぐにわかります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インタラクティブな評価状態:</strong><span style=\"vertical-align: baseline;\"> スキーマの変更はすべて完全に管理できます。変換ワークスペース内で、ターゲット データベースに変更を適用する前に、コードを並べて違いを確認したり、AI によるインラインの説明を確認したり、PL/pgSQL コードを直接編集したりできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デプロイと検証のステージング:</strong><span style=\"vertical-align: baseline;\"> コードがワークスペース検証に合格したら、変換されたスキーマと関数をターゲットのステージング インスタンス（</span><a href=\"https://cloud.google.com/sql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\"> や AlloyDB など）に適用し、本番環境への切り替え前に機能の実行とパフォーマンス テストを行うことができます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">データベースのモダナイゼーションの効率化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Database Migration Service の AI によるコード変換により、データベース チームは以前のデータベース ロジックを数か月ではなく数日で変換できます。データベース管理者とアプリケーション開発者は、貴重な時間を費やしてコードを最初から書き直す代わりに、新しい機能の追加、パフォーマンスのテスト、アプリケーションのモダナイゼーションに注力できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Oracle と SQL Server の一般的な変換シナリオと、DMS がそれらを PostgreSQL に変換する方法の代表的な例については、新しい </span><a href=\"https://www.youtube.com/watch?v=MGNPQZiUl6c\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini に習う PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> 動画シリーズをご覧ください。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=MGNPQZiUl6c\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">SQL Server コードを PostgreSQL に変換する</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">SQL Server コードを PostgreSQL に変換する</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=MGNPQZiUl6c\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">データベース移行に関する悩みを解消し、以前のデータベース ロジックをシームレスに変換する方法を Gemini に教えてもらいましょう。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Database Migration Service を使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">データベースの変換を始めるには、Database Migration Service コンソール（</span><a href=\"https://console.cloud.google.com/dms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://console.cloud.google.com/dms</span></a><span style=\"vertical-align: baseline;\">）で移行評価を実行するか、異種間移行ガイド（</span><a href=\"https://cloud.google.com/database-migration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://cloud.google.com/database-migration</span></a><span style=\"vertical-align: baseline;\">）をお読みください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、戦略的クラウド エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Tanya Sharma</strong></p></div>"
