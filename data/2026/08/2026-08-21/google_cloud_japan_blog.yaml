    "published": "2026-08-21 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 6 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/solving-the-noisy-neighbor-with-sharded-architecture?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">マルチテナントの SaaS プロバイダ、社内データ プラットフォームを管理する大企業、混合ワークロードのデータ処理を扱う企業のいずれであっても、共有インフラストラクチャ環境を管理するということは、「ノイジー ネイバー」という共通の脅威に直面することを意味します。単一のテナントで大量のデータバーストやデータベース インスタンスの障害が発生した場合、環境内の他のテナントをダウンさせ、複数の重要なデータ パイプラインにわたって大幅なバックログの蓄積やグローバル規模でのサービスレベル契約（SLA）違反を引き起こす可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">モノリシック アーキテクチャから、シャーディングを取り入れたハブ アンド スポーク パターンに移行して、プラットフォームの復元力を確保する方法をご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">課題: モノリシックのボトルネック</strong></h4>\n<p><span style=\"vertical-align: baseline;\">従来の一般的なアーキテクチャでは、すべてのテナントとビジネス ドメインのデータを 1 つの巨大なストリームで処理します。パイプラインが統合されているため、特定のデータベース テナント インスタンスでパフォーマンスの問題が発生すると、バック プレッシャーが発生し、プラットフォーム上の他のすべてのテナントのパフォーマンスが低下します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">痛手となる影響:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">100% の影響範囲: 1 つのデータベース障害で、すべての処理が停止する可能性があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">非効率的なスケーリング: 多くの場合、「最悪のケース」のテナントに合わせてリソースをスケールする必要があるため、無駄な支出が多くなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SLA の不安定性: 1 つの大規模なテナントがシステム全体を遅延させる可能性がある場合、グローバル規模の SLA を維持することはほぼ不可能です。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">解決策: シャーディングによるハブ アンド スポーク アーキテクチャ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この課題を解決するには、処理をルーティング用の「ハブ」と、分離された実行用の「スポーク」に分けます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_AstMUiw.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">1. ハブ: ルーター パイプライン</strong></p>\n<p><span style=\"vertical-align: baseline;\">ハブは、トラフィック コントローラとして機能する軽量の Dataflow ジョブです。統合されたソーストピックから読み取り、テナント ID またはビジネス ドメインを解析して、データを分離されたバッファにファンアウトします。これにより、エントリー ポイントがシンプルかつ堅牢になります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. バッファ: 永続的な分離</strong></p>\n<p><span style=\"vertical-align: baseline;\">ハブとスポークの間に </span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pub/Sub</span></a><span style=\"vertical-align: baseline;\"> トピックを導入します。これらは永続的な緩衝器として機能し、低速なダウンストリーム シンクが元のソースをバックアップするのを防ぎます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. スポーク: 分離された実行</strong></p>\n<p><span style=\"vertical-align: baseline;\">1 本の巨大なパイプラインではなく、複数の小規模な </span><a href=\"https://cloud.google.com/products/dataflow\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataflow</span></a><span style=\"vertical-align: baseline;\"> インスタンスをデプロイして、ワークロードごとに分類します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ティア 1（優先度高）: 重要なテナント向けにリソース割り当てを多くした専用パイプライン。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">共有ティア: 小規模なテナント向けにパイプラインをグループ化して費用を最適化。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ドメイン固有: コードの複雑さを分離するために、複雑なロジック（異なるビジネス ドメインの分離など）に特化したパイプライン。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">メリットの比較</strong></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">機能</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">モノリシック（従来）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ハブ アンド スポーク</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">フォールト トレランス</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1 つの DB の障害ですべてが停止</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">障害は特定のスポークに限定</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">影響範囲</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">100%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">5% 未満（1 つのスポークに限定）</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リソースのスケーリング</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">「最悪のケース」を想定してスケーリング</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">テナントの負荷ごとに独立したスケーリング</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">メンテナンス</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">グローバルなアップデートが全体に影響</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">他のドメインに影響を与えずに 1 つのドメインを更新</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">実装に関する活用のヒント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このアーキテクチャへの移行は、単に構成図の中でボックスを移動するだけではありません。最大限の安定性を確保するためには、追加で「スポーク」レベルを最適化することが推奨されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">デッドレター キュー（DLQ）の実装: 単一の SQL 例外によってパイプラインが停止しないようにします。失敗したレコードをストレージ（BigQuery や Google Cloud Storage など）にルーティングして、後で調査します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">厳格な接続プール: データベースには接続制限があります。スレッドセーフなシングルトン パターンを使用し、ワーカーあたりの MaximumPoolSize を低く（1～2 などに）設定して、自動スケーリング中にデータベースを使い果たさないようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">非同期 I/O: GroupIntoBatches 変換を使用して書き込みをバッファリングすることで、データベースに起因するレイテンシのトリガーとなることが多い接続オーバーヘッドを削減します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">シャーディングのアプローチを採用することで、プラットフォームは「ノイジー ネイバー」が近隣の脅威にならないことを保証できます。このアーキテクチャは、厳格な SLA を維持するために必要な分離を実現すると同時に、独立したスケーリングと、より安全なデプロイを可能にします。</span></p>\n<p><span style=\"vertical-align: baseline;\">シャーディングによるハブ アンド スポーク アーキテクチャの実装について詳しくは、</span><a href=\"https://docs.cloud.google.com/dataflow/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataflow のドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、クラウド データ エンジニア</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Sri Harshini Donthineni</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、クラウド データ コンサルタント</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Abdullateef Abdulsalam</strong></p></div>"
  "353575a552b948a21f934fdda53c86bb":
    "id": "353575a552b948a21f934fdda53c86bb"
    "title": "プライバシー重視の AI で脳腫瘍研究を後押し"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/privacy-first-medical-ai-with-medperf-and-google-cloud/"
    "published": "2026-08-21 10:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/privacy-first-medical-ai-with-medperf-and-google-cloud?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">医療と AI の融合は、目覚ましいイノベーションをもたらしています。しかし現在、開発者は患者のプライバシー保護と、実世界の多様なデータに基づく検証と評価を両立させた、信頼性の高い医療 AI ツールを構築するという難題に直面しています。Google Cloud は、戦略的なコラボレーションと Confidential Computing を組み合わせてこの難題にアプローチしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">検証プロセスにおいて患者のプライバシーと AI モデルの両方を保護するために、Google は </span><a href=\"https://www.medperf.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MedPerf イニシアチブ</span></a><span style=\"vertical-align: baseline;\">を通じて </span><a href=\"https://mlcommons.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MLCommons</span></a><span style=\"vertical-align: baseline;\"> と連携しています。今年の Google Cloud Next で初めて発表されたこのパートナーシップは、</span><a href=\"https://cloud.google.com/security/products/confidential-computing?e=0&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> を活用して、実際の環境で AI モデルをベンチマークするための安全なデータ クリーンルームを確立するものです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">課題: データを見ることなく AI を評価する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">テクノロジー業界と学術界に 125 以上のメンバーを擁するグローバル コミュニティである MLCommons は、医療 AI の評価を標準化するため、2023 年に </span><a href=\"https://mlcommons.org/medical/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MedPerf</span></a><span style=\"vertical-align: baseline;\"> を立ち上げました。AI モデルのベンチマーク用オープンソース プラットフォームである MedPerf は、</span><a href=\"https://en.wikipedia.org/wiki/Federated_learning\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">連携評価</span></a><span style=\"vertical-align: baseline;\">によるモデルテストを通じて臨床研究を推進しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud </span><a href=\"https://docs.cloud.google.com/confidential-computing/confidential-space/docs/confidential-space-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Space</span></a><span style=\"vertical-align: baseline;\"> を使用すると、ハードウェアで分離された高信頼実行環境（TEE）内で独自の AI モデルを評価できます。この特別な仮想マシンは、実行中のメモリを暗号化し、オペレーティング システムを強化するため、病院や研究機関、その他の参加者、さらには Google であっても、評価中にモデルコードや患者データを閲覧することはできません。</span></p>\n<p><span style=\"vertical-align: baseline;\">医療 AI のベンチマークには高いコンピューティング負荷がかかるため、Confidential VM は CPU だけでなく GPU にも拡張されています。GPU 加速推論時においてもモデルの重みと患者データを保護するため、MedPerf は NVIDIA H100 GPU を搭載した Google Cloud の A3 マシンシリーズ上で稼働します。このシステムは、CPU の Intel TDX テクノロジーと GPU の </span><a href=\"https://www.nvidia.com/en-us/data-center/solutions/confidential-computing/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> を組み合わせた構成となっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">患者データがワークロードに投入される前に、システムは、承認されたコードのみが正規の Confidential Computing ハードウェアで実行されていること、および環境が適切にセキュリティ強化されていることを暗号によって証明します。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=HG6bZzSwBjk\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">実世界における医療 AI の評価: MedPerf と GCP Confidential Computing のデモ</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">実世界における医療 AI の評価: MedPerf と GCP Confidential Computing のデモ</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=HG6bZzSwBjk\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ML Commons MedPerf が Google Cloud Confidential Computing と連携し、医療 AI モデルの安全な実環境評価を実現する仕組みをご紹介しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">理論を大きな成果へ: 脳腫瘍研究のさらなる進展</strong></h3>\n<p><span style=\"vertical-align: baseline;\">このテクノロジーは、</span><a href=\"https://www.med.upenn.edu/cbica/fets/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Federated Tumor Segmentation</span></a><span style=\"vertical-align: baseline;\">（FeTS）イニシアチブを通じて、すでに極めて重要な研究を推進する原動力となっています。膠芽腫などの脳腫瘍は症例数が少ないため、単一の病院だけで AI トレーニングの精度を高めるのに十分なデータを収集することは困難です。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに厄介なことに、ある病院では完璧に機能するモデルが、患者の属性、データの取得手法、さらには機器の差異により、別の病院では十分な性能を発揮できないケースがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">インディアナ大学の </span><a href=\"https://medicine.iu.edu/faculty/64865/bakas-spyridon\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spyridon Bakas 博士</span></a><span style=\"vertical-align: baseline;\">、ノースウェスタン大学の </span><a href=\"https://www.feinberg.northwestern.edu/faculty-profiles/az/profile.html?xid=30630\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Yury Velichko 博士</span></a><span style=\"vertical-align: baseline;\">、カナダのアルバータ大学の </span><a href=\"https://apps.ualberta.ca/directory/person/asimpso4\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Amber Simpson 博士</span></a><span style=\"vertical-align: baseline;\">といった先見の明のある研究者の協力を得て、Google Cloud 上の MedPerf は世界各地の脳 MRI の非公開データで AI モデルを検証し、潜在的なパフォーマンス ギャップを特定しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">たとえば、あるサイトでは 95% の精度を発揮するモデルが、別のサイトでは 63% の精度しか達成できない場合があります。Google の協働的アプローチは、臨床現場に届く AI ツールが、特定の層に偏らない真に代表的な患者集団で機能することを保証するものです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">臨床現場での信頼確立と検証</strong></h3>\n<p><span style=\"vertical-align: baseline;\">このコラボレーションによる成果は、臨床研究の最前線にいる方々の言葉に最もよく表れています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ノースウェスタン大学放射線科准教授の Yury Velichko 博士は次のように述べています。「Google Cloud でのフェデレーション ラーニングのテストを通じて、医療 AI の未来は、安全かつスケーラブルな、共同研究に適したクラウド環境にあることがわかりました。管理された研究室レベルの環境から一歩踏み出し、本番環境対応のインフラストラクチャでこれらのワークフローを検証できたことは、実際の臨床アプリケーションにおけるフェデレーション ラーニングのパフォーマンスとセキュリティを評価する、またとない機会となりました。」</span></p>\n<p><span style=\"vertical-align: baseline;\">MLCommons の MedPerf リードである Alexandros Karargyris 氏は次のように語っています。「医療 AI は世界中の患者に多大な恩恵をもたらす可能性を秘めています。しかしそれを実現するには、評価に用いるベンチマークが臨床医、研究者、規制当局から信頼されるものでなければなりません。MedPerf を Google Cloud の Confidential Computing インフラストラクチャ上に構築することで、プライバシー、知的財産、ベンチマークの整合性を損なうことなく、実際の患者データで AI モデルを厳密にテストできる未来に向けた大きな一歩を踏み出せました。」</span></p>\n<h3><strong style=\"vertical-align: baseline;\">未来：安全な医療のブレークスルーを普及させる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">MLCommons と Google Cloud のコラボレーションは、医療 AI における「プライバシー バイ デザイン」への根本的な転換を示すものです。Google は、データとモデルを安全に共有、評価しやすくすることで、より迅速かつ安全で公平性の高い医療イノベーションの実現を後押ししています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud 上での MedPerf プラットフォームの活用にご関心のある研究機関や医療モデル開発者の方は、</span><span style=\"text-decoration: underline; vertical-align: baseline;\">medical@mlcommons.org</span><span style=\"vertical-align: baseline;\"> または担当の Google Cloud アカウント チームまでお問い合わせください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、シニア クラウド セキュリティ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Rene Kolga</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Peter Mattson</strong></p></div>"
  "d3a788be5b45504fb2fc07c967edeca0":
    "id": "d3a788be5b45504fb2fc07c967edeca0"
    "title": "AI 時代のデジタル主権: 制御とイノベーションの二者択一が不要に"
    "link": "https://cloud.google.com/blog/ja/topics/hybrid-cloud/state-of-ai-infrastructure-report-on-hybrid-cloud-and-gdc/"
    "published": "2026-08-21 10:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/state-of-ai-infrastructure-report-on-hybrid-cloud-and-gdc?e=0&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">コンプライアンスと主権に関する厳格な要件を持つ企業や政府機関は、機密データをオンプレミスに保持しているがために最新の AI を利用できないことがよくあります。こうした組織は、次の 3 つの大きなリスクを管理しています。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">管轄権のリスク:</strong><span style=\"vertical-align: baseline;\"> 現地の規制の変化や、知的財産（権）保護の必要性、国外からのデータアクセス要求といった要因により国内でのデータ管理が不可欠となっています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">経済的自立: </strong><span style=\"vertical-align: baseline;\">海外のインフラストラクチャ プロバイダに依存すると、重要なサービスの脆弱化を招くおそれがあります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">地政学的リスク:</strong><span style=\"vertical-align: baseline;\"> 予測不可能な世界情勢の混乱から重要な国内サービスを保護する必要があります。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Google が「</span><a href=\"https://services.google.com/fh/files/misc/state_of_infra_in_agentic_ai_era_2026_report.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI インフラストラクチャの現状</span></a><span style=\"vertical-align: baseline;\">」レポート作成のため最近実施した調査では、対象となった 1,400 人を超えるシニア IT リーダーの 48% が、現地のデータ セキュリティ法を遵守するため、データ所在地の管理機能を備えたインフラストラクチャを優先していると回答しています。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_0SuEihC.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>しかし、オンプレミス環境にとどまることは、もはや最新のイノベーションから取り残されることを意味しません。このギャップを埋める手段として、オンプレミスとマルチクラウドを組み合わせたハイブリッド ソリューションを導入する組織が増えてきています。Google の調査によると、現在 52% の組織が AI 活用のためにハイブリッド クラウドのアプローチを採用しています。</p><p>このアプローチでは、パブリック クラウドの圧倒的な処理能力を活用しながら、主権やコンプライアンス維持といったローカル環境のメリットも享受でき、データの所在地やアクセス権を自ら完全に制御することが可能です。これまで、こうした厳格なデータルール規制下にある組織は、高度な AI を簡単に取り入れることはできませんでした。独自の AI システムの構築も、スピードとコストの両面で現実的ではありませんでした。</p><p>そこで登場したのが、Google の <a href=\"https://cloud.google.com/distributed-cloud\">Google Distributed Cloud（GDC）</a>です。GDC を使用すると、データセンターやエッジなど、お客様が必要とする場所で Google Cloud を利用できるようになります。AI ワークロードの主権要件を満たすために、次の 2 つのデプロイモデルが用意されています。</p><ul><li><b>エアギャップ:</b> Google Cloud やパブリック インターネットから完全に遮断された環境で動作する、外部接続を必要としないソリューション。Google がリモートでシャットダウンすることはできません。</li><li><b>コネクテッド:</b> 既存のハードウェア上で直接実行される、Google がソフトウェア ライフサイクルを統合的に管理するモデル。</li></ul><p>GDC は、AI ワークロード向けに最適化されたインフラストラクチャ、Gemini またはオープンモデルの選択肢、費用対効果の高い推論サービスを備えた、オンプレミスの完全な AI ソリューションを提供します。この基盤を活用すれば、データを完全に制御しながらセキュアな AI エージェントを構築して実行できます。</p><p><b>オンプレミスでソブリン AI のニーズを満たす</b></p><p>データ管理か、AI イノベーションかの二者択一を迫られることはもうありません。Google Distributed Cloud なら、データの主権を完全に維持しながら世界をリードする AI を自社の環境に直接導入できます。</p><p>大手企業のハイブリッド戦略の詳細を紹介した「<a href=\"https://cloud.google.com/resources/content/state-of-infrastructure-in-the-agentic-ai-era?e=48754805\">AI インフラストラクチャの現状</a>」レポートを、ぜひご一読ください。</p><p><b><i>-</i></b> <i>Google Cloud、Distributed &amp; Sovereign Cloud 担当バイス プレジデント兼ゼネラル マネージャー</i><b><i>、Ankur Mehrotra</i></b></p>\n    </div>\n  </div>\n</div>\n\n</div>"
