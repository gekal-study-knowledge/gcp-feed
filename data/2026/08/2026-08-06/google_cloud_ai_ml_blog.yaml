    "title": "Mirendil taps AI Hypercomputer TPUs and GPUs for pre- and post-training applications"
    "link": "https://cloud.google.com/blog/topics/startups/mirendil-selects-ai-hypercomputer/"
    "published": "2026-08-06 22:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Nearly every major AI lab uses Google Cloud infrastructure, including for training of models, inference for agents, and new frontier research. Google Cloud also continues to be the platform of choice for new, high-growth AI startups who are driving much of the industry’s research and innovation.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we’re announcing that </span><a href=\"https://mirendil.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mirendil</span></a><span style=\"vertical-align: baseline;\">, an exciting frontier AI lab focused on accelerating AI development, will also utilize Google Cloud’s </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\">. This includes using a mix of Google’s TPU AI accelerators and full-stack NVIDIA AI infrastructure running on Google Cloud; this purpose-built AI infrastructure will support model pre-training and post-training applications for Mirendil. </span></p>\n<p><span style=\"vertical-align: baseline;\">The Mirendil team is building new AI systems that can help accelerate and democratize AI research and development. This means managing complex, end-to-end training workflows from initial model pre-training through post-training, and powering reinforcement learning on a massive scale. The ability to choose a mix of both TPU and NVIDIA’s full-stack accelerated computing platform through Google Cloud meant that Mirendil could access critical compute very quickly, and continue to match its workloads to the architecture best-suited to it over time.</span></p>\n<p><span style=\"vertical-align: baseline;\">We closely partnered with Mirendil on end-to-end design and deployment of combined TPU and NVIDIA AI infrastructure across compute, storage, networking, and control planes. We also collaborated on a system that uses </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/training-clusters/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">managed training clusters running in Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\">, which effectively streamlines the provisioning and management of both TPU and GPU environments for Mirendil. Mirendil is already live with a cluster of TPU v5P chips, with NVIDIA AI accelerated computing systems coming online soon.</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">\"Progress in AI has been bounded by how fast humans can run the research loop - designing experiments, evaluating results, and iterating,\" said Behnam Neyshabur, cofounder and CEO of Mirendil. \"We're building AI systems that can accelerate and improve that loop itself. Expanding on Google Cloud gives us the scale and flexibility to push those systems further and put frontier AI research capabilities in the hands of many more scientists and engineers to run that loop faster and at a greater scale.\"</span></span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">You can read more about our partnership on Mirendil’s </span><a href=\"https://mirendil.com/news/scaling-self-accelerating-ai-with-google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\">.</span></span></span></p></div>"
"last_updated": "2026-08-27 21:31:31 JST"
