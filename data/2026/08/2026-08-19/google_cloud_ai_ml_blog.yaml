  "8fa9b3fc7d727bf9eba01c298722b08f":
    "id": "8fa9b3fc7d727bf9eba01c298722b08f"
    "title": "How Box is unlocking multimodal enterprise agents with Gemini Embeddings 2"
    "link": "https://cloud.google.com/blog/topics/partners/box-ai-agents-gemini-embeddings-multimodal-enterprise-ai/"
    "published": "2026-08-19 01:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Enterprise content management is experiencing its biggest architectural shift since the cloud migration era. </span></p>\n<p><span style=\"vertical-align: baseline;\">For years, enterprises have stored trillions of gigabytes of critical data in Box: financial models, clinical trial protocols, M&amp;A due diligence rooms, engineering schematics, and legal compliance playbooks. Up to this point, text-based search and retrieval-augmented generation (RAG) have successfully unlocked the vast narrative knowledge within these repositories, establishing a powerful and highly effective baseline for enterprise AI intelligence.</span></p>\n<p><span style=\"vertical-align: baseline;\">Traditional RAG architectures have mastered text processing, but the agentic era demands more. The next logical evolution is to extend this framework to capture the</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">inherently multimodal, deeply spatial, and highly structured elements that exist alongside text. While text embeddings excel at indexing prose, multimodal architectures unlock a major new capability: For example, they preserve the strict row-column semantics of financial tables, interpret visual evidence like clinical data, and map the logic of multi-page flowcharts without losing their spatial layout.</span></p>\n<p><span style=\"vertical-align: baseline;\">To deliver next-generation capabilities that can handle the vast universe of digital content, Google Cloud and Box are </span><strong style=\"vertical-align: baseline;\">integrating advanced multimodal capabilities into Box's Agentic Platform</strong><span style=\"vertical-align: baseline;\">, powered by </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/embedding-2\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Multimodal Embeddings 2</span></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">merging Box’s industry-leading Intelligent Content Management platform with Google Cloud’s advanced AI embeddings.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Benefits of improved embedding: Extending the dimensions of document content</strong></h2>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Preserving visual and spatial geometry</strong><span style=\"vertical-align: baseline;\">: Complex document elements like multi-column tables or financial matrices rely on their spatial layout to convey meaning. Converting these elements into a flat string of text can disassociate column headers from their corresponding data points. Multimodal embeddings allow systems to interpret the document exactly as a human does, maintaining the integrity of spatial relationships.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Illuminating the visual modality</strong><span style=\"vertical-align: baseline;\">: Enterprise documents are filled with visual indicators: technical charts, process flowcharts, branding assets, and product photography. Multimodal capabilities ensure that these elements are no longer invisible to search systems, allowing users to query images and text simultaneously.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Connecting hybrid file formats</strong><span style=\"vertical-align: baseline;\">: Real-world business workflows rarely live in a single document format. An agent may need to cross-reference a PDF policy, a spreadsheet tracking log, and a presentation deck. Extending RAG with multimodal embeddings creates a unified understanding across these varied formats.</span></p>\n</li>\n</ol>\n<h2><strong style=\"vertical-align: baseline;\">The Architectural Solution: Gemini Multimodal Embeddings 2</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Google Cloud’s </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/embedding-2\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Multimodal Embeddings 2</span></a><span style=\"vertical-align: baseline;\"> introduces a unified, multimodal vector space capable of embedding text, raster images, document pages, rendered spreadsheet tables, and visual charts into the same semantic representation space.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GIF_1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/image_bu28HMu.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Key product capabilities unlocked by gemini-embeddings-2:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Crossmodal retrieval (text-to-visual / visual-to-text)</strong><span style=\"vertical-align: baseline;\">: Enables natural language queries to retrieve highly specific visual components, such as locating a target chart or diagram within a massive library of slides, without requiring manual tagging.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layout-aware document embedding</strong><span style=\"vertical-align: baseline;\">: Rather than breaking files into arbitrary text blocks, the system can embed document page renderings directly, preserving visual hierarchies, callout boxes, and structural context.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Heterogeneous format bridging</strong><span style=\"vertical-align: baseline;\">: Native support for seamlessly bridging content across .docx, .xlsx, .pdf, .pptx, .png, and .csv without losing modality-specific structural information.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Three core patterns of multimodal enterprise agents</strong></h2>\n<p><span style=\"vertical-align: baseline;\">By leveraging multimodal embeddings within Box, we have identified three uniqueprimary design patterns that illustrate how organizations can extend traditional RAG to support complex, visual workflows.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Pattern 1: Complex financial &amp; analytical reporting</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">The challenge</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Corporate finance, research, and audit teams analyze highly structured documents where vital data resides in embedded tables, growth charts, and footnote annotations. Text-only indexing can separate these numbers from their context, making automated analysis challenging.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">The multimodal advantage</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Structural alignment</strong><span style=\"vertical-align: baseline;\">: The embedding model captures the physical structure of tables and charts, allowing financial agents to understand that a column header applies to a specific row of metrics.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Visual trend analysis</strong><span style=\"vertical-align: baseline;\">: Agents can cross-reference written summaries with visual trends in accompanying bar or line charts, identifying and pointing out discrepancies between written claims and source data.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Contextual sourcing</strong><span style=\"vertical-align: baseline;\">: Users can query complex portfolios and instantly retrieve the exact page, table, or chart supporting a specific metric.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_9rTykxw.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Pattern 2: Multimodal clinical decision support &amp; assisted diagnosis</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">The challenge</strong></h4>\n<p><span style=\"vertical-align: baseline;\">In healthcare and clinical environments, critical patient data is fragmented across vastly different, unstructured visual and textual formats — ranging from external physical photos (visual evidence) and microscopic pathology slides (lab reports) to structured risk matrices (triage grids). Traditional text-based systems or isolated analysis tools cannot synthesize these cross-modal relationships simultaneously, which can delay critical diagnoses or risk missing immediate, life-threatening procedural complications.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">The multimodal advantage</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cross-modal clinical synthesis</strong><span style=\"vertical-align: baseline;\">: Evaluates physical symptoms alongside cellular-level laboratory evidence simultaneously by indexing clinical photos, histopathology imagery, and triage grids into a single space.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Granular anomaly identification</strong><span style=\"vertical-align: baseline;\">: Connects niche visual patterns under a microscope (like parasitic cyst walls) with medical knowledge to rapidly isolate rare conditions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Risk-aware decision support</strong><span style=\"vertical-align: baseline;\">: Cross-references findings against triage frameworks to deliver instant warnings about immediate patient risks, such as life-threatening anaphylactic shock.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_ZPNWwdP.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Pattern 3: Cross-document multimodal synthesis &amp; data reconciliation</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">The challenge</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Enterprise information is fragmented across disconnected files and formats (e.g., PDF minutes, Excel charts, PNG flyers, and email threads). Traditional tools analyze these files in isolation, failing to connect the dots when verifying details or resolving data contradictions across independent documents.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">The multimodal advantage</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cross-file synthesis</strong><span style=\"vertical-align: baseline;\">: Connects information across entirely different formats (PDFs, spreadsheets, images, emails) simultaneously to answer complex business queries.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Conflict resolution</strong><span style=\"vertical-align: baseline;\">: Flags and resolves contradictions between assets, such as catching outdated pricing on an image by cross-checking it against the latest financial spreadsheets.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Visual-to-text auditing</strong><span style=\"vertical-align: baseline;\">: Audits visual or scanned files against text-based records (e.g., verifying a signed PDF contract against a legal review email) to catch missing clauses or changes.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_IAwu96l.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">The future of agentic enterprise content management</strong></h2>\n<p><span style=\"vertical-align: baseline;\">The integration of gemini-embeddings-2 into Box’s Agentic Platform is an important new capability to improve the next era of content intelligence. Multimodal embeddings help Box to move beyond basic search to active, intelligent collaboration.</span><span style=\"vertical-align: baseline;\">Box's Intelligent Content Management platform represents a fundamental shift in enterprise AI infrastructure — moving beyond passive document storage to deliver a governed, semantically indexed reasoning layer where AI agents can interrogate, cross-reference, and act on content with full compliance and security controls already in place. </span></p>\n<p><span style=\"vertical-align: baseline;\">Powered by multimodal embeddings and a suite of native AI agents spanning search, metadata extraction, research, analysis, and composition, Box enables organizations to proactively surface insights such as flagging stale pricing data, expiring contract clauses, or cross-document contradictions before they become business risks. For high-complexity industries like financial services, life sciences, and legal operations, Box's ability to reason across text, tables, charts, and images makes multimodal understanding a competitive requirement. </span></p>\n<p><span style=\"vertical-align: baseline;\">Designed to interoperate with the broader enterprise AI ecosystem, Box serves as the single governed content foundation that ensures every AI-driven workflow is grounded in authorized, auditable enterprise data.</span></p>\n<p><span style=\"vertical-align: baseline;\">When you think about it, the enterprise data landscape was always multimodal. Now we have the technology to make the most of it. By integrating gemini-embeddings-2, Box helps its users unlock unprecedented value from unstructured enterprise content. Product leaders who embrace multimodal-first architectures, rigorous precision benchmarking, and audit-ready grounding will lead the next wave of enterprise productivity and innovation.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">The team would like to thank Ken Ikeda, Afshaan Mazagonwalla, and Samip Thakkar for their work on this project.</span></p></div>"
  "0f03f2ea8d4b9fef8bc97d4e0a0ccab7":
    "id": "0f03f2ea8d4b9fef8bc97d4e0a0ccab7"
    "title": "Building cost-effective, high-throughput gen AI workflows in Google Dataflow"
    "link": "https://cloud.google.com/blog/products/data-analytics/cost-effective-genai-workflows-in-google-dataflow/"
    "published": "2026-08-19 01:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Real-time streaming pipelines are the operational backbone of modern enterprises, continuously processing everything from customer support interactions to transaction logs. Traditionally, streaming DAGs are static; once deployed, their processing logic and execution paths are fixed. However, by integrating generative AI agents, we can move beyond static logic to adaptive execution. This allows streaming workflows to dynamically construct plans, query databases, and trigger custom remediation paths at runtime depending on the content of the data.</span></p>\n<p><span style=\"vertical-align: baseline;\">For example, when a customer sends an angry message about a damaged order, a pipeline shouldn't just log the error or flag a dashboard. It should look up the order in the database that holds customer order and inventory records, decide on a remediation action (like shipping a replacement or issuing a refund), email the customer, and log the final resolution.</span></p>\n<p><span style=\"vertical-align: baseline;\">However, streaming systems face a fundamental engineering hurdle when executing gen AI workflows: scale, latency, and cost. Sending every raw event directly to a heavyweight model or multi-step agent equipped with external database and email tools is prohibitively expensive, introduces high latency, and quickly exhausts API rate limits.</span></p>\n<p><span style=\"vertical-align: baseline;\">This pattern addresses the scale and complexity challenge by combining </span><a href=\"https://cloud.google.com/products/dataflow\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Dataflow</span></a><span style=\"vertical-align: baseline;\">, Google Cloud's fully managed, serverless execution service for </span><a href=\"https://beam.apache.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Beam</span></a><span style=\"vertical-align: baseline;\">, and the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit</span></a><span style=\"vertical-align: baseline;\"> (ADK) to build a hybrid streaming pipeline. By using a lightweight, CPU-bound machine learning model upstream to filter and qualify events, we keep the pipeline highly cost-effective, routing only the complex cases to the downstream agent. There, the agent dynamically decides what actions to take, introducing dynamic branching to the stream without hardcoding thousands of conditional steps into the pipeline's static DAG.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">A universal blueprint for high-volume streams</strong></h3>\n<p><span style=\"vertical-align: baseline;\">While we use a customer support triage scenario below, this pre-filter + agentic action pattern is a universal paradigm. It applies to any stream where a high volume (&gt;9X%) of events are routine, and only a small number require complex, contextual reasoning.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">IT Operations &amp; DevOps: Filtering millions of routine system logs on CPU, and triggering an agent to run diagnostics and open bug tickets only when a critical anomaly is flagged.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Financial Fraud Triaging: Passing millions of transactions through lightweight, local rules, and calling an agent to execute multi-database lookup tools only for highly suspicious patterns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Industrial IoT: Monitoring normal telemetry on the edge, and routing erratic spikes to an agent to coordinate equipment shutdowns and email field engineers.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">The architecture: Why pre-filter streaming events?</strong></h2>\n<p><span style=\"vertical-align: baseline;\">In a high-throughput stream, the vast majority of messages do not require complex reasoning or remediation. They might be positive feedback, neutral inquiries, or simple queries.</span></p>\n<p><span style=\"vertical-align: baseline;\">Routing every single event to a heavyweight LLM workflow creates three primary bottlenecks:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">API cost:</strong><span style=\"vertical-align: baseline;\"> Frontier models charge per token. Under high throughput, cost scales linearly with stream volume.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Latency:</strong><span style=\"vertical-align: baseline;\"> Multi-step workflows (which involve database lookups and external API calls) take seconds, creating a bottleneck in streaming DAGs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Quotas:</strong><span style=\"vertical-align: baseline;\"> External APIs have strict rate limits that streaming workers can easily exhaust.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">To prevent this, we build a pre-filtered pipeline in Apache Beam/Dataflow:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_XYX8VCT.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Pipeline flow</span></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ingestion:</strong><span style=\"vertical-align: baseline;\"> Read raw customer messages from </span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Pub/Sub</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lightweight sentiment classifier (CPU):</strong><span style=\"vertical-align: baseline;\"> Run all messages through a lightweight, CPU-based Hugging Face model (</span><code style=\"vertical-align: baseline;\">distilbert-base-uncased-finetuned-sst-2-english</code><span style=\"vertical-align: baseline;\">) using Apache Beam’s </span><code style=\"vertical-align: baseline;\">RunInference</code><span style=\"vertical-align: baseline;\"> transform. This executes locally on the Dataflow worker CPUs, avoiding external API costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pre-qualification Gate:</strong><span style=\"vertical-align: baseline;\"> A simple </span><code style=\"vertical-align: baseline;\">DoFn</code><span style=\"vertical-align: baseline;\"> filters the stream. Messages with </span><code style=\"vertical-align: baseline;\">POSITIVE</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">NEUTRAL</code><span style=\"vertical-align: baseline;\"> sentiment are acknowledged and dropped.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated Remediation (ADK):</strong><span style=\"vertical-align: baseline;\"> If and only if a message is classified as </span><code style=\"vertical-align: baseline;\">NEGATIVE</code><span style=\"vertical-align: baseline;\">, we trigger the gen AI agent backed by </span><code style=\"vertical-align: baseline;\">gemini-3.5-flash</code><span style=\"vertical-align: baseline;\"> using the </span><code style=\"vertical-align: baseline;\">ADKAgentModelHandler</code><span style=\"vertical-align: baseline;\">. The agent uses tools to look up the user in </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">, fetch orders, choose a remediation plan, and send a notification email via the Gmail API.</span></p>\n</li>\n</ol>\n<h2><strong style=\"vertical-align: baseline;\">Adaptive execution: Making the Beam DAG dynamic</strong></h2>\n<p><span style=\"vertical-align: baseline;\">In traditional streaming architectures, the pipeline's Directed Acyclic Graph (DAG) is rigid. Once deployed to Dataflow, the sequence of transforms is set. If you need to handle new types of alerts or change how specific events are routed, you have to modify, test, and redeploy the entire pipeline.</span></p>\n<p><span style=\"vertical-align: baseline;\">By placing a gen AI agent downstream of our sentiment pre-filter, we introduce a dynamic, adaptive node inside the static DAG.</span></p>\n<p><span style=\"vertical-align: baseline;\">For the 95% of records that are positive or neutral, the pipeline runs along a fast, static path. But when the filter gates a negative record, the agent evaluates the payload and dynamically selects the correct sequence of API tools (e.g., database query, inventory check, or email notification) at runtime. This allows the pipeline to execute complex decision trees dynamically, eliminating the need to build and maintain thousands of hardcoded conditional branches in the static Apache Beam code.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Implementing the pipeline</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Here is an example implementation in Apache Beam using the Google Agent Development Kit (ADK) and the </span><code style=\"vertical-align: baseline;\">RunInference</code><span style=\"vertical-align: baseline;\"> framework.</span></p>\n<h3><span style=\"vertical-align: baseline;\">1. Defining the lightweight sentiment model</span></h3>\n<p><span style=\"vertical-align: baseline;\">We define the upstream CPU model using </span><code style=\"vertical-align: baseline;\">HuggingFacePipelineModelHandler</code><span style=\"vertical-align: baseline;\">. This model classifies sentiment into </span><code style=\"vertical-align: baseline;\">POSITIVE</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">NEUTRAL</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">NEGATIVE</code><span style=\"vertical-align: baseline;\"> on the worker instance.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;model_handler = HuggingFacePipelineModelHandler(\\r\\n    task=&quot;sentiment-analysis&quot;,\\r\\n    model=&quot;distilbert-base-uncased-finetuned-sst-2-english&quot;\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff5dd6cc8d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">2. Building the heavyweight ADK agent</span></h3>\n<p><span style=\"vertical-align: baseline;\">The ADK agent acts as our remediation assistant. We equip it with three tools:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">lookup_user</code><span style=\"vertical-align: baseline;\">: Queries BigQuery for the customer's email.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">lookup_orders</code><span style=\"vertical-align: baseline;\">: Queries BigQuery for the customer's orders and current product inventory.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">send_email</code><span style=\"vertical-align: baseline;\">: Sends a remediation email to the customer using the </span><a href=\"https://developers.google.com/workspace/gmail/api/guides\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gmail API</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;def make_adk_tools(project: str, dataset: str = &quot;sentiment_demo&quot;):\\r\\n    def lookup_user(user_id: int) -&gt; dict:\\r\\n        &quot;&quot;&quot;Look up user information (email address) from BigQuery by user ID.&quot;&quot;&quot;\\r\\n        from google.cloud import bigquery\\r\\n\\r\\n        client = bigquery.Client(project=project)\\r\\n        query = (\\r\\n            f&quot;SELECT user_id, user_email &quot;\\r\\n            f&quot;FROM `{project}.{dataset}.users` &quot;\\r\\n            f&quot;WHERE user_id = @user_id&quot;\\r\\n        )\\r\\n        job_config = bigquery.QueryJobConfig(\\r\\n            query_parameters=[bigquery.ScalarQueryParameter(&quot;user_id&quot;, &quot;INT64&quot;, user_id)]\\r\\n        )\\r\\n        try:\\r\\n            results = list(client.query(query, job_config=job_config).result())\\r\\n            if results:\\r\\n                row = results[0]\\r\\n                return {&quot;user_id&quot;: row.user_id, &quot;user_email&quot;: row.user_email}\\r\\n            return {&quot;error&quot;: f&quot;No user found with user_id={user_id}&quot;}\\r\\n        except Exception as exc:\\r\\n            return {&quot;error&quot;: str(exc)}\\r\\n\\r\\n    def lookup_orders(user_id: int) -&gt; dict:\\r\\n        &quot;&quot;&quot;Look up a user\\&#x27;s orders and current product inventory from BigQuery.&quot;&quot;&quot;\\r\\n        from google.cloud import bigquery\\r\\n\\r\\n        client = bigquery.Client(project=project)\\r\\n        query = (\\r\\n            f&quot;SELECT p.order_id, p.product_id, pr.remaining_inventory, pr.price &quot;\\r\\n            f&quot;FROM `{project}.{dataset}.purchases` p &quot;\\r\\n            f&quot;JOIN `{project}.{dataset}.products` pr ON p.product_id = pr.product_id &quot;\\r\\n            f&quot;WHERE p.user_id = @user_id&quot;\\r\\n        )\\r\\n        job_config = bigquery.QueryJobConfig(\\r\\n            query_parameters=[bigquery.ScalarQueryParameter(&quot;user_id&quot;, &quot;INT64&quot;, user_id)]\\r\\n        )\\r\\n        try:\\r\\n            results = list(client.query(query, job_config=job_config).result())\\r\\n            orders = [\\r\\n                {\\r\\n                    &quot;order_id&quot;: row.order_id,\\r\\n                    &quot;product_id&quot;: row.product_id,\\r\\n                    &quot;remaining_inventory&quot;: row.remaining_inventory,\\r\\n                    &quot;price&quot;: float(row.price),\\r\\n                }\\r\\n                for row in results\\r\\n            ]\\r\\n            return {&quot;orders&quot;: orders}\\r\\n        except Exception as exc:\\r\\n            return {&quot;error&quot;: str(exc)}\\r\\n\\r\\n    def send_email(to_address: str, subject: str, body: str) -&gt; str:\\r\\n        &quot;&quot;&quot;Send a plain-text email to the customer via the Gmail API.&quot;&quot;&quot;\\r\\n        import google.auth\\r\\n        import googleapiclient.discovery\\r\\n        import email.mime.text\\r\\n        import base64\\r\\n\\r\\n        try:\\r\\n            creds, _ = google.auth.default(\\r\\n                scopes=[&quot;https://www.googleapis.com/auth/gmail.send&quot;]\\r\\n            )\\r\\n            service = googleapiclient.discovery.build(&quot;gmail&quot;, &quot;v1&quot;, credentials=creds)\\r\\n\\r\\n            mime_msg = email.mime.text.MIMEText(body)\\r\\n            mime_msg[&quot;to&quot;] = to_address\\r\\n            mime_msg[&quot;subject&quot;] = subject\\r\\n            raw = base64.urlsafe_b64encode(mime_msg.as_bytes()).decode(&quot;utf-8&quot;)\\r\\n            service.users().messages().send(userId=&quot;me&quot;, body={&quot;raw&quot;: raw}).execute()\\r\\n            return &quot;Email sent successfully&quot;\\r\\n        except Exception as exc:\\r\\n            return f&quot;Failed to send email: {exc}&quot;\\r\\n\\r\\n    return [lookup_user, lookup_orders, send_email]&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff5dd536bd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We configure the </span><code style=\"vertical-align: baseline;\">LlmAgent</code><span style=\"vertical-align: baseline;\"> and package it in the </span><code style=\"vertical-align: baseline;\">ADKAgentModelHandler</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;adk_agent = LlmAgent(\\r\\n    name=&quot;remediation_agent&quot;,\\r\\n    model=&quot;gemini-3.5-flash&quot;,\\r\\n    instruction=(\\r\\n        &quot;You are a customer service remediation assistant with access to &quot;\\r\\n        &quot;BigQuery lookup tools and an email sending tool. &quot;\\r\\n        &quot;When given a prompt describing a customer situation, follow the &quot;\\r\\n        &quot;numbered steps exactly and use your tools to complete the task.&quot;\\r\\n    ),\\r\\n    tools=adk_tools,\\r\\n)\\r\\n\\r\\n# RunInference handler for the ADK agent\\r\\nadk_handler = ADKAgentModelHandler(agent=adk_agent)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff5dd536250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">3. Assembling the Dataflow DAG</span></h3>\n<p><span style=\"vertical-align: baseline;\">The entire pipeline is declared cleanly. The upstream sentiment inference feeds directly into the filtering step (</span><code style=\"vertical-align: baseline;\">FilterNegativeADK</code><span style=\"vertical-align: baseline;\">), which then conditionally executes the downstream </span><code style=\"vertical-align: baseline;\">ADKInference</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;with beam.Pipeline(options=pipeline_options) as p:\\r\\n    # 1. Read from Pub/Sub and classify sentiment on CPU\\r\\n    sentiment_results = (\\r\\n        p\\r\\n        | &quot;ReadFromPubSub&quot; &gt;&gt; beam.io.ReadFromPubSub(topic=known_args.input_topic)\\r\\n        | &quot;DecodeMessages&quot; &gt;&gt; beam.Map(lambda x: x.decode(\\&#x27;utf-8\\&#x27;))\\r\\n        | &quot;SentimentInference&quot; &gt;&gt; RunInference(model_handler)\\r\\n    )\\r\\n\\r\\n    # 2. Filter out non-negative sentiment and invoke the ADK Agent\\r\\n    _ = (\\r\\n        sentiment_results\\r\\n        | &quot;FilterNegativeADK&quot; &gt;&gt; beam.ParDo(FilterNegativeAndPromptADK())\\r\\n        | &quot;ADKInference&quot; &gt;&gt; RunInference(adk_handler)\\r\\n        | &quot;LogADKResults&quot; &gt;&gt; beam.ParDo(LogADKResponse())\\r\\n    )&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff5e418ddd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">Cost and performance advantages</strong></h2>\n<p><span style=\"vertical-align: baseline;\">By introducing this filtering step, we gain major engineering and operational advantages:</span></p>\n<h3><span style=\"vertical-align: baseline;\">1. Significant cost reductions</span></h3>\n<p><span style=\"vertical-align: baseline;\">Instead of paying for </span><a href=\"https://ai.google.dev/gemini-api/docs/tokens\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini input/output tokens</span></a><span style=\"vertical-align: baseline;\"> on 100% of incoming events, we pay only for the fraction that represent negative customer sentiment (typically &lt; 5% of messages). The other 95% are classified locally on CPU instances at zero incremental API cost.</span></p>\n<h3><span style=\"vertical-align: baseline;\">2. High streaming throughput</span></h3>\n<p><span style=\"vertical-align: baseline;\">Dataflow distributes the CPU classification workload across many instances. Since CPU inference takes milliseconds, the pipeline scales horizontally to handle high-throughput event streams. The heavyweight LLM agent, which can take seconds per request due to tool execution, is called sparingly, preventing backlog.</span></p>\n<h3><span style=\"vertical-align: baseline;\">3. Native Apache Beam integration</span></h3>\n<p><span style=\"vertical-align: baseline;\">Adding the agent into the DAG requires no complex orchestration logic or manual thread pools. Using </span><code style=\"vertical-align: baseline;\">ADKAgentModelHandler</code><span style=\"vertical-align: baseline;\"> with Beam's native </span><code style=\"vertical-align: baseline;\">RunInference</code><span style=\"vertical-align: baseline;\"> transform handles parallel worker threads, batching, and integration automatically, keeping the codebase maintainable and clean.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Key takeaways</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Streaming data is fast and high-volume, while heavyweight generative AI reasoning is slow and costly.</span></p>\n<p><span style=\"vertical-align: baseline;\">By building a pre-filtered pipeline with Google Dataflow and the ADK, you get the best of both worlds: the cost and speed of local CPU-based models, and the deep, automated capabilities of Gemini-backed agents.</span></p>\n<p><span style=\"vertical-align: baseline;\">To see the complete codebase and deploy this yourself, check out the </span><a href=\"https://github.com/damccorm/next-2026-demo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">next-2026-demo GitHub repository</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<hr />\n<p><sub><em><span style=\"vertical-align: baseline;\">Apache Beam is a trademark of the </span><a href=\"https://www.apache.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Software Foundation</span></a></em></sub></p></div>"
