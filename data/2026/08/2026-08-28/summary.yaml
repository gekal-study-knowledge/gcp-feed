"overview": |
  この日は Cloud Run インスタンスの活用と BigQuery の刷新が中心でした。前日にプレビュー提供が案内された Cloud Run インスタンスを使い、OpenClaw や Hermes のような個人開発者向けの AI エージェントを、長期稼働かつステートフルなワークロードとして低コストかつ高性能に動かす方法が紹介されています。日本語ブログでは BigQuery まわりの記事が 2 本公開され、1 つは非構造化データ (PDF・音声・画像) のインサイトを構造化データと統合する BigQuery 検索の刷新、もう 1 つはノーコードのフルマネージドなデータ移動である BigQuery Data Transfer Service の新機能です。後者は、脆弱な社内 ETL パイプラインの構築や修正に週 100 時間以上をかけている状況を解消することを狙いとしています。あわせて、EU のデジタルオペレーショナルレジリエンス法 (DORA) を踏まえた金融サービスのエージェント型 AI によるレジリエンス構築 (Deutsche Bank の事例を含む) も日本語で公開されました。事例では Pythian が 27 か国 500 人規模の自社に Gemini Enterprise を展開し、AI の ROI を検証した結果、当初の戦略を見直すことになったと報告しています。リリースノートでは Application Integration の実行 ID の扱いが変わる予定が告知されました。今後すべての実行は起動した本人か、設定した run-as サービスアカウントとして動作し、実行にはそのサービスアカウントとして動作する権限が必要になります。スケジュールやイベントで起動する無人の連携には run-as サービスアカウントの明示的な設定が必要で、変更前の対応が要ります。このほか Cloud Build で第 2 世代の Bitbucket / GitLab ホスト接続のアクセストークンを接続詳細ページから更新できるようになり、Gemini Enterprise には Campfire、Clay、CourtListener、Daloopa、MSCI のデータストアがパブリックプレビューで追加されています。
