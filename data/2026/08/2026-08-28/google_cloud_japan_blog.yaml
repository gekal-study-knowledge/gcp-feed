  "ea7443a718c4184e72c72810dc4a0e02":
    "id": "ea7443a718c4184e72c72810dc4a0e02"
    "title": "金融サービスにおけるエージェント型 AI を活用したオペレーショナル レジリエンスの構築"
    "link": "https://cloud.google.com/blog/ja/topics/financial-services/building-operational-resilience-with-agentic-ai-in-financial-services/"
    "published": "2026-08-28 10:00:00"
    "fetched": "2026-08-28 15:46:05"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 19 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/financial-services/building-operational-resilience-with-agentic-ai-in-financial-services?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">金融機関にとって、オペレーショナル レジリエンスは、消費者の高い期待はもとより、規制当局や監督当局の期待事項として長年織り込まれてきました。欧州連合の</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/the-eus-dora-has-arrived-google-cloud-is-ready-to-help?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">デジタル オペレーショナル レジリエンス法</span></a><span style=\"vertical-align: baseline;\">（DORA）の施行により、こうした期待は一段と厳格なものとなり、より明確で整合性が取れた、エビデンス重視の要件が課されるようになりました。企業は、重要なビジネス サービスとそれを支えるデジタル インフラストラクチャが、業務の中断に耐え、連携した対応を可能にし、統制を保った状態で復旧できることを実証しなければなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの条件を満たすために、</span><a href=\"https://www.db.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deutsche Bank</span></a><span style=\"vertical-align: baseline;\"> は AI 搭載のエージェント型レジリエンス プラットフォームを開発しました。これにより、規制に関する</span><a href=\"https://cloud.google.com/transform/tabletopping-the-tabletop-new-perspectives-cybersecurity-favorite-role-playing-game\"><span style=\"text-decoration: underline; vertical-align: baseline;\">机上レジリエンス演習</span></a><span style=\"vertical-align: baseline;\">を大規模にモダナイズし、手動で行っていた準備作業を、実際の運用データに基づいたコンテキスト アウェアで、かつ即座にエビデンスとして活用可能なシミュレーションへと刷新しました。このプラットフォームは、アーキテクチャ、データフロー、ログ、インシデント履歴、アラート シグナル、運用テレメトリーからエンタープライズ コンテキストを構築し、シナリオ、シミュレートされた運用エビデンス、構造化されたセッション レコード、規制当局に対応したアーティファクトを生成します。</span></p>\n<p><span style=\"vertical-align: baseline;\">相互に依存するアプリケーション、データフロー、サードパーティ サービスにまたがる業務を抱える多くの大手銀行にとって、これは重要かつ不可欠な変化です。金融サービス全体で監督当局の期待が高度化するなか、銀行の机上演習においても、本番環境の依存関係や実際の運用条件、そして一貫したエビデンス基準への準拠を、より直接的に反映させることが求められています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Deutsche Bank は、この移行を大規模かつ効率的に成功させる方法を検討するにあたり、</span><a href=\"https://www.db.com/news/detail/20201204-deutsche-bank-and-google-cloud-sign-pioneering-cloud-and-innovation-partnership?language_id=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">長年のパートナーである Google Cloud</span></a><span style=\"vertical-align: baseline;\"> と、その拡大するエージェント型 AI ツールのスイートに注目しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">机上演習からレジリエンス インテリジェンスへ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Deutsche Bank は、エージェント型レジリエンス プラットフォームを活用することで、従来の手動による準備を伴う机上演習を、継続的なインテリジェンス モデルへと進化させました。さらに、実際の運用コンテキストが必要な場合には、この同じエージェント レイヤを根本原因分析にまで拡張して活用できるようになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">つまり、実行されるすべてのシナリオが、実際のエンタープライズ シグナルに基づいたものとなっています。これにより、リアルタイムのインサイトよりも推測に陥りがちな「静的な入力」に頼るのではなく、実際のシステム依存関係や障害パターン、ビジネスへの影響を正確に反映できるようになります。</span></p>\n<p><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> を使用することで、Deutsche Bank はこの運用コンテキストを、明確なタイムライン、意思決定ポイント、予想される回答を含む構造化されたシナリオに移行できました。これにより、各演習は実際のシステム動作に基づいたものとなり、規制当局の期待に応える、一貫性のある監査対応のエビデンスを確実に生成できるようになっています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">制御と柔軟性を実現するデュアル オーケストレーション</strong></h4>\n<p><span style=\"vertical-align: baseline;\">規制当局レベルの制御と運用の柔軟性を両立させるため、Deutsche Bank のプラットフォームには、ワークフローを 2 つの補完的な実行モデルに分離するデュアル オーケストレーション アーキテクチャが採用されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">まず、規制に準拠した実行を実現するため、同行は </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-a-langgraph-agent\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LangGraph</span></a><span style=\"vertical-align: baseline;\"> を活用しています。これにより、入力コンテキストから出力まで明確なリネージを備えた、追跡可能かつ決定論的なプロセスを通じてすべてのシナリオを生成し、監督審査で求められる監査可能性を担保しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">次に、適応型シナリオと調査型シナリオについては、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Development Kit</span></a><span style=\"vertical-align: baseline;\">（ADK）を使用してエージェント主導の連携を実現しています。このアプローチにより、同行のプラットフォームは、あらかじめ実行パスを定義しておく必要がなく、状況を動的に分析して回答を生成できるようになります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_dbc2MvR.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1. コンテキスト アセンブリ、オーケストレーション、シナリオ生成のアーキテクチャ。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このアーキテクチャ上の分離により、プラットフォームは共通のインテリジェンス レイヤを維持しながら、統制された実行と適応型の調査を組み合わせることができます。同一のエージェントとツールを使用して、机上演習シナリオの生成から関連するインシデント分析ワークフローに至るまで、アーキテクチャ、データフロー図、ログ、コード アーティファクトを横断的に推論できます。重要なのは、計画された演習と実際の運用イベントの両方で</span><a href=\"https://cloud.google.com/blog/products/identity-security/cyber-snapshot-report-enterprise-resilience-key-to-toolchain-success\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一貫したレジリエンス モデル</span></a><span style=\"vertical-align: baseline;\">がサポートされることです。</span></p>\n<p><span style=\"vertical-align: baseline;\">「</span><span style=\"font-style: italic; vertical-align: baseline;\">Deutsche Bank</span><span style=\"vertical-align: baseline;\"> がこの</span><span style=\"font-style: italic; vertical-align: baseline;\">プラットフォーム</span><span style=\"vertical-align: baseline;\">で目指したのは、極めて複雑な分散環境においても、規制当局の期待に応える重要金融システム向けのレジリエンス モデルを構築することでした。動的に生成されたシナリオを実際のビジネス コンテキストに結びつけ、統制されたオーケストレーションと適応型の分析を組み合わせることで、このプラットフォームは、オペレーショナル レジリエンスのためのインテリジェントで継続的に適応可能なモデルを当行にもたらしました。」- </span><span style=\"font-style: italic; vertical-align: baseline;\">Deutsche Bank、マネージング ディレクター、監視テクノロジーおよびコンプライアンス クラウド担当グローバル責任者、AI トランスフォーメーション リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sanjay Tripathi 氏</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">Google Cloud で生成とガバナンスを強化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud のエージェント ツール スイートは、Deutsche Bank のプラットフォームを、管理されたエンタープライズ グレードのレジリエンス ワークフロー全体にスケールするための基盤を提供しています。その仕組みは次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> が、シナリオおよびエビデンス生成サービスの弾力的な実行をサポートします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> が、運用コンテキストを構造化されたレジリエンス シナリオに変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google ADK</span></a><span style=\"vertical-align: baseline;\"> が、適応型エージェントの連携を可能にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/sql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\"> が、シナリオ、セッション アーティファクト、レビュー記録に対して、高い耐久性と永続性を提供します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらのサービスを組み合わせることで、コンプライアンス レビューと継続的な改善に不可欠な、追跡可能な生成、制御された実行、永続的なエビデンス記録の保持を、Deutsche Bank が実現できるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">スケーラブルでエビデンス対応のレジリエンス テスト</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Deutsche Bank のプラットフォームで生成されるあらゆるシナリオは、対応、エスカレーション、復旧を担うチームの構造化された机上演習セッションを推進します。これらの演習は実際のエンタープライズ コンテキストに基づいているため、運用の実態を反映すると同時に、チーム間の一貫性を強化し、規制当局の期待に応える監査対応のエビデンスを生成します。これにより、DORA や同様のフレームワークの規制下にある金融機関にとって、統制され、連携の取れた、規律ある対応を大規模に実証することが容易になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このモデルは現在、Deutsche Bank の複数のポートフォリオに適用されており、同行がより一貫性のあるスケーラブルなレジリエンス パラダイムを確立し、金融セクター全体で活用できる再現可能なブループリントを構築する一助となっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このモデルでは、根本原因分析が実際のインシデントと将来のレジリエンス テストの間のフィードバック ループとして機能します。本番環境のイベントから得られたインサイトは、将来の机上演習シナリオに反映させることができます。また、演習の結果は、対応ハンドブック、エスカレーション パス、復旧準備の強化に役立てられます。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした一連の取り組みにより、シナリオベースのレジリエンス テストを主なユースケースとして維持しつつ、計画的なレジリエンス演習から実際の運用イベントに至るまで、プラットフォームの価値が拡張されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">導入が拡大するにつれて、このプラットフォームはコンテキスト アウェアなレジリエンスに関する Google Cloud の手法を組み込むことで、運用の一貫性をもたらします。また、断片的な手動アプローチを解消し、同行全体で部門横断的な AI 活用型運用モデルを確立します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">レジリエンス インテリジェンスに向けて</strong></h4>\n<p><span style=\"vertical-align: baseline;\">同行の次のステップは、このアプローチをより広範なレジリエンス インテリジェンス レイヤへと拡張することです。同じパターンを展開することで、ハンドブックの改良、復旧準備の評価、そして刻々と変化するシステム状況に対する制御の継続的検証が可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">金融機関にとって、これは戦略的な転換です。システムの分散化が進み、規制当局からの要求が厳しさを増すなか、銀行は定期的なレジリエンス テストから、インテリジェンス主導の継続的な対応能力へと移行する必要があります。Deutsche Bank では、Google Cloud によって組織全体でこの移行を簡単に行うことができています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">コンテキスト アウェアなレジリエンスに関する Google Cloud の手法について詳しくは、こちらの</span><a href=\"https://cloud.google.com/blog/ja/topics/financial-services/improve-financial-resilience-with-google-cloud?e=0&amp;hl=ja\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">記事</span></a><span style=\"font-style: italic; vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Deutsche Bank、エージェント型レジリエンス プラットフォーム - ディレクター兼リード アーキテクト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Pankaj Ojha 氏</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud コンサルティング、スタッフ ソリューション コンサルタント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Florian Graf</strong></p></div>"
  "aef30393df0392e7cd5779169a46998f":
    "id": "aef30393df0392e7cd5779169a46998f"
    "title": "構造化データと非構造化データのインサイトを統合する BigQuery 検索のイノベーション"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/bigquery-search-innovations-unify-structured-unstructured-data/"
    "published": "2026-08-28 09:10:00"
    "fetched": "2026-08-28 15:46:05"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 8 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/bigquery-search-innovations-unify-structured-unstructured-data?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">現代の企業は膨大な量の非構造化データを保有しており、その管理や価値の抽出において大きな課題に直面することがよくあります。これまで、PDF、音声ファイル、画像、非構造化テキストに埋もれたインサイトを引き出すには、ウェアハウスからのデータ移動、複雑な LLM パイプラインの統合、散在する検索インデックスの管理といった、断片化されたアーキテクチャを前提とする必要がありました。</span></p>\n<p><span style=\"vertical-align: baseline;\">BigQuery は、こうした非構造化データを理解するために多くの企業で活用されています。たとえば、</span><strong style=\"vertical-align: baseline;\">数千件に及ぶ臨床試験ドキュメント（PDF）を管理</strong><span style=\"vertical-align: baseline;\">する</span><strong style=\"vertical-align: baseline;\">先進的なヘルスケア企業</strong><span style=\"vertical-align: baseline;\">では、BigQuery を使用することで、</span><strong style=\"vertical-align: baseline;\">アクセス、処理、グラウンディング、関連付け、活用</strong><span style=\"vertical-align: baseline;\">というシンプルな 5 段階のライフサイクルを通じて、これらのドキュメントから価値あるインサイトを抽出できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、このフレームワークの</span><strong style=\"vertical-align: baseline;\">「グラウンディング」</strong><span style=\"vertical-align: baseline;\">のフェーズに重点を置いた 3 つの主要なマイルストーンを紹介します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自律型エンベディング生成（一般提供版）</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">単一クエリのパフォーマンスが大幅に向上する AI.SEARCH（一般提供版）</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド検索（公開プレビュー版）</strong></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">これらの機能が連携して AI アーキテクチャを簡素化する仕組みを、実際の臨床試験研究プラットフォームを例に詳しく見ていきましょう。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">パイプラインを簡素化する「自律型エンベディング生成」（一般提供版）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">検索拡張生成（RAG）パイプラインや検索アプリケーションを構築するには、通常、複雑で非同期なエンベディング インフラストラクチャの管理が必要であり、新しいレコードが到着するたびに、再試行、エラーロギング、パイプラインのオーケストレーションを自分で行わなければなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><strong style=\"vertical-align: baseline;\">自律型エンベディング生成</strong><span style=\"vertical-align: baseline;\">の一般提供が開始されたことで、BigQuery がユーザーに代わってこれらをすべて管理できるようになりました。スキーマで列を定義するだけで、新しいデータが取り込まれるたびに BigQuery が非同期かつ継続的にエンベディングを生成します。外部モデル（Vertex AI テキスト エンベディングなど）を選択することも、BigQuery 内で </span><strong style=\"vertical-align: baseline;\">Gemma エンベディング モデル</strong><span style=\"vertical-align: baseline;\">をネイティブに直接利用することもできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">実際の活用例</strong></h4>\n<p><span style=\"vertical-align: baseline;\">たとえば、Google Cloud Storage に保存されている臨床試験の PDF を分析する研究プラットフォームを構築しているとします。研究のタイトルや疾患領域をテーブルに抽出すると、そのタイトルを自動的に埋め込むことができます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE OR REPLACE TABLE mydataset.clinical_trials\\r\\n(\\r\\n  trial_id STRING,\\r\\n  study_title STRING,\\r\\n  study_embedding STRUCT&lt;result ARRAY&lt;FLOAT64&gt;, status STRING&gt;\\r\\n   GENERATED ALWAYS AS (AI.EMBED(\\r\\n     study_title,\\r\\n     connection_id =&gt; &#x27;myconnection&#x27;,\\r\\n     endpoint =&gt; &#x27;text-embedding-005&#x27;\\r\\n   ))\\r\\n   STORED\\r\\n   OPTIONS( asynchronous = TRUE )\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd47b2c6290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">BigQuery は、1 つの構成でエンタープライズ規模の処理を管理することで、複雑なサードパーティのベクトル データベースを不要にします。この自律的なエンベディング生成により、ソーステキストの変更に合わせてデータが自動的に同期されるため、手動による ML パイプラインが不要になります。この統合アプローチにより、動的なデータセットのワークフローが効率化され、カスタムデータ スクリプトの維持管理にかかる運用上の負担が軽減されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、この一般提供の開始に伴い、自律型エンベディング生成では </span><a href=\"https://cloud.google.com/bigquery/docs/object-tables\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ObjectRefs</span></a><span style=\"vertical-align: baseline;\"> を使用して画像からネイティブにエンベディングを生成できるようになり、真のマルチモーダル検索と分析が可能になりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">大規模な自然言語検索を可能にする「AI.SEARCH」（一般提供版）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">会話型分析エージェントや快適なユーザー エクスペリエンスを真に実現するには、基盤となる検索インフラストラクチャが直感的かつ高性能である必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">データをシームレスに埋め込むことができたら、次は、それらを効率的にクエリする手段が必要となります。このたび一般提供が開始された </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-search\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AI.SEARCH()</strong></a><span style=\"vertical-align: baseline;\"> は、自然言語に焦点を当てた合理的な検索エクスペリエンスを提供するもので、これにより、検索パスでエンべディングを生成することなく、意味的に関連するレコードを簡単に見つけることができます。また、自律型エンベディング生成と組み合わせることで、データセットで使用しているエンベディング モデルをそのまま検索にも利用できるため、利便性がさらに高まります。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、昨年実施した効率化への投資の一環として、AI.SEARCH を単一クエリの実行向けに大幅に最適化しました。その結果、オンライン アプリケーションや単一クエリ検索（エージェント検索で最も一般的なもの）において、</span><strong style=\"vertical-align: baseline;\">スロット効率が最大 133 倍向上</strong><span style=\"vertical-align: baseline;\">したことが確認されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このことは、BigQuery 上のデータに対して、ユーザー向けの自然言語検索を高い同時実行性で処理しつつ、従来よりも高速かつ費用対効果の高い方法で提供できることを意味しています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT base.trial_id, base.study_title, distance\\r\\nFROM\\r\\n  AI.SEARCH(\\r\\n    TABLE mydataset.clinical_trials,\\r\\n    \\&#x27;study_title\\&#x27;,\\r\\n    &quot;What treatments are available for advanced tumors?&quot;\\r\\n  );&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd47ba11cd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">キーワードとベクトルを統合する「ハイブリッド検索」（公開プレビュー版）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">セマンティック（ベクトル）検索は非常に強力です。たとえば、上記のクエリでは、「化学療法」のような概念的に関連する用語も適切に返すことができます。しかし、セマンティック検索だけでは十分でない場合もあります。たとえば、研究者が、非常に専門的な免疫療法薬の具体的な名称（「MK3475」など）を検索した場合はどうなるでしょうか。この英数字の文字列には広い意味的な文脈がないため、純粋なベクトル検索だけでは正しく順位付けすることが難しい場合があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">BigQuery の</span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/search_functions#hybrid-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ハイブリッド検索</span></a><span style=\"vertical-align: baseline;\">は、語彙検索と既存のセマンティック機能を統合することで、キーワードの類似性とその根底にある意味の両方に基づいてデータを取得できます。このアプローチは、セマンティック ベクトル検索の概念的な深さと、語彙マッチングの高い精度を統合するものであり、Reciprocal Rank Fusion や BM25 などのアルゴリズムを利用しています。これにより、検索結果の精度が大きく向上するほか、キーワードの出現頻度や意味的な関連性に基づく再ランキングを通じて、LLM のハルシネーションに伴う費用を抑えることができます。ユーザーは、AI.SEARCH 関数や VECTOR_SEARCH 関数で </span><code style=\"vertical-align: baseline;\">HYBRID モード</code><span style=\"vertical-align: baseline;\">や </span><code style=\"vertical-align: baseline;\">lexical_search_columns</code><span style=\"vertical-align: baseline;\"> パラメータを利用することで、この仕組みを実装できます。さらに、ベクトル インデックスを拡張してキーワード データを含めることで、パフォーマンスを最適化し、語彙検索プロセスを高速化できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">以下のように、AI.SEARCH() 関数のモードを HYBRID に設定するだけで、ハイブリッド検索を簡単に実行できるようになりました。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SELECT base.trial_id, base.study_title, distance\\r\\nFROM\\r\\n  AI.SEARCH(\\r\\n    TABLE mydataset.clinical_trials,\\r\\n    \\&#x27;study_title\\&#x27;,\\r\\n    &quot;Cancer treated by MK-3475&quot;,\\r\\n    mode =&gt; \\&#x27;HYBRID\\&#x27;\\r\\n  );&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fd47ba10950&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これらのハイブリッド クエリを大規模に高速化するには、検索の語彙部分で使用するキーワード列を含めるように </span><a href=\"https://docs.cloud.google.com/bigquery/docs/vector-index#use_vector_indexes_with_hybrid_search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CREATE VECTOR INDEX DDL を拡張</span></a><span style=\"vertical-align: baseline;\">するだけで、インデックスをネイティブに統合できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エンドツーエンドの非構造化データ分析プラットフォームの構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ここで紹介した検索機能とエンベディング機能は、より大きなビジョンの一部にすぎません。Google は、エンドツーエンドの非構造化データ分析プラットフォームを構築しています。非構造化データの代表例のひとつがドキュメントであり、BigQuery は、以下のようなワークフローをエンドツーエンドで管理するための完全なツールセットを提供しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/image1_bQnyG2Q.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクセス:</strong><span style=\"vertical-align: baseline;\"> オブジェクト テーブルを使用して、Google Cloud Storage に保存されている非構造化 PDF やドキュメントを直接クエリすることで、ゼロ ETL のワークフローを実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">処理:</strong><span style=\"vertical-align: baseline;\"> レイアウト対応のチャンキング（RAG に最適）には AI.PARSE や AI.CHUNK_DOC（近日リリース予定）などの組み込み AI 機能を利用するほか、エンティティ抽出 / 要約には </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-generate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI.GENERATE</span></a><span style=\"vertical-align: baseline;\">を、SQL パイプラインで基盤モデルを直接使用してレコードを即座に分類するには </span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-classify\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI.CLASSIFY</span></a><span style=\"vertical-align: baseline;\"> を利用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">グラウンディング:</strong><span style=\"vertical-align: baseline;\"> 自律型エンベディングとハイブリッド検索を使用して、精度の高いコンテキストを構築します。ハイブリッド検索は、セマンティック ベクトル検索による概念的な理解と、語彙的なキーワード マッチングによる高い精度を組み合わせたものです。意味的な関連性とキーワードの出現頻度の両方に基づいて結果を再ランキングすることで、検索結果の精度が大きく向上するほか、LLM のハルシネーションも抑制できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">関連付け:</strong><span style=\"vertical-align: baseline;\"> 抽出されたエンティティ（スポンサー、臨床試験、医薬品など）を </span><a href=\"https://docs.cloud.google.com/bigquery/docs/graph-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</span></a><span style=\"vertical-align: baseline;\"> にマッピングすることで、隠れたマルチホップのインサイトを発見できます。特別なグラフ データベースは必要ありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">活用:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/bigquery/docs/conversational-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery の会話型分析</span></a><span style=\"vertical-align: baseline;\">エージェントを活用して、これらすべてを統合します。</span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-agg\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI.AGG</span></a><span style=\"vertical-align: baseline;\"> などの関数を使用すると、複雑なデータと直接やり取りしたり、可視化を生成したり、大規模なトレンド分析を実行したりできます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">BigQuery において非構造化データが第一級のデータとして扱われるようになったことで、未加工のドキュメントと会話型 AI との間のギャップを埋めることが可能になりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">準備ができたら</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コードを確認する:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/GoogleCloudPlatform/document-analytics-on-bigquery\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery のドキュメント分析 GitHub リポジトリ</span></a><span style=\"vertical-align: baseline;\">で、臨床試験に関するエンドツーエンドのデモの完全版をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドキュメントを読む:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/bigquery/docs/autonomous-embedding-generation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">自律型エンベディング</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/search_functions#hybrid-search\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ハイブリッド検索</span></a><span style=\"vertical-align: baseline;\">の公式ドキュメントを読み、独自の統合データ パイプラインの構築を今すぐ始めましょう。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Joe Malone</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Francis Lan</strong></p></div>"
