    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 8 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/new-bigquery-data-transfer-service-capabilities?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">急速に変化するデジタル エコノミーにおいて、データは最も重要なエンジンです。しかし、多くの企業は、脆弱な社内 ETL パイプラインの構築や修正に週 100 時間以上をかけたり、予測不可能なサードパーティ ツールと格闘したりといった犠牲を払う逆説的な状況に陥っています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">毎日、数千社のお客様</strong><span style=\"vertical-align: baseline;\">が信頼して利用する </span><strong style=\"vertical-align: baseline;\">BigQuery Data Transfer Service（DTS）</strong><span style=\"vertical-align: baseline;\">は、このようなエンジニアリングの負担を解消します。フルマネージドのノーコード データ移動ソリューションである BigQuery DTS は、BigQuery へのデータの取り込みを自動化し、チームがパイプラインのメンテナンスから戦略的なデータ サイエンスへと数分で移行できるようにします。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">エコシステムの拡大: 新しいコネクタと機能</strong></h3>\n<p><span style=\"vertical-align: baseline;\">BigQuery DTS は、データベース、広告、マーケティング プラットフォームにわたりデータサイロを排除するために、統合環境を急速に拡大しています。最新の追加機能と拡張機能は以下のとおりです。</span></p>\n<p><strong style=\"vertical-align: baseline;\">オープン レイクハウスの取り込み</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/iceberg-ingestion\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Apache Iceberg マネージド テーブルへの直接取り込み（プレビュー版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Google Cloud Storage、Amazon S3、Azure Blob Storage などの一般的なソースから Iceberg マネージド テーブルにデータを直接取り込めるようになりました。これにより、BigQuery のトップレベルのパフォーマンス チューニングを活用しながら、マルチクラウド ストレージと他のクエリエンジンとの完全な相互互換性を維持できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">次世代のエージェント型アーキテクチャ</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/datatransfer/mcp\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">フルマネージドのリモート Model Context Protocol（MCP）サーバー（プレビュー版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> これにより、開発者は AI アプリケーションや AI エージェントを DTS に接続し、プログラムを使ってデータソースを検出したり、ユーザーに代わって転送を構成、実行したりできます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ データベースとリレーショナル データベース（完全転送と増分転送の両方をサポート）</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/sqlserver-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Microsoft SQL Server（プレビュー版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> トランザクション テーブル、スキーマ、運用データを BigQuery 内の分析環境に直接転送し、簡単に一元化できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/postgresql-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">PostgreSQL（一般提供版）</strong></a><strong style=\"vertical-align: baseline;\">と </strong><a href=\"https://docs.cloud.google.com/bigquery/docs/mysql-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">MySQL（一般提供版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> データ配信を自動化し、大量のウェブ ワークロードやアプリケーション ワークロードを一元的なデータ ウェアハウスに数分で簡単にレプリケートできます。オンプレミス環境、Cloud SQL、その他のクラウドからのデータ レプリケーションに対応しています。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">e コマースとグロース マーケティング</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/shopify-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Shopify（プレビュー版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> 粒度の高い注文履歴、在庫ログ、顧客プロファイルを分析スキーマに直接抽出するプロセスを自動化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/klaviyo-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Klaviyo（プレビュー版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> 詳細なメールと SMS のエンゲージメント ログ（クリック、送信、開封など）を抽出して、正確なマルチチャネル ライフサイクル属性を構築します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/hubspot-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">HubSpot（プレビュー版）</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> パイプライン、連絡先のトラッキング、インバウンド マーケティングの指標を同期して、収益オペレーション チームの連携を維持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/mailchimp-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mailchimp（プレビュー版）:</strong></a><span style=\"vertical-align: baseline;\"> キャンペーンのパフォーマンスとオーディエンス リストの属性をデータ ウェアハウスに直接、自動的に移動します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">移行コネクタ</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/migration/snowflake-migration-intro\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Snowflake（一般提供版）</strong><span style=\"text-decoration: underline; vertical-align: baseline;\">:</span></a><span style=\"vertical-align: baseline;\"> 増分転送、スキーマの自動検出、プライベート接続、3 つの主要クラウド（Google Cloud、AWS、Azure）に保存されているデータの移行サポートなどの機能を使用して、Snowflake からデータを移行できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\"> 主要なコネクタの機能強化</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/servicenow-transfer#data-ingestion\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ServiceNow</strong></a><strong style=\"vertical-align: baseline;\">、</strong><a href=\"https://docs.cloud.google.com/bigquery/docs/salesforce-transfer-intro#full-incremental-transfers\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Salesforce</strong></a><strong style=\"vertical-align: baseline;\">、</strong><a href=\"https://docs.cloud.google.com/bigquery/docs/oracle-transfer-intro#full-incremental-transfers\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Oracle</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">ネイティブの増分更新サポート</strong><span style=\"vertical-align: baseline;\">が強化され、エンタープライズ規模の CRM、ITSM、財務ワークフローの大規模なパイプライン更新が高速化されました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">BigQuery Data Transfer Service を選ぶ理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ アーキテクチャ内でデータを移動する際に、費用、管理オーバーヘッド、パイプラインの健全性の間で複雑な妥協を求められるべきではありません。BigQuery DTS は、次の 3 本の柱にわたって独自のメリットを提供します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 比類のないコスト効率</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/bigquery/pricing#data-transfer-service-pricing\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">主要なソースの取り込み費用はゼロ:</strong></a><span style=\"vertical-align: baseline;\"> Google 広告、Google アナリティクス 4、キャンペーン マネージャー、YouTube、Google Cloud Storage など、Google Play を除く Google のソースすべてのデータの取り込みが</span><strong style=\"vertical-align: baseline;\">無料</strong><span style=\"vertical-align: baseline;\">です。Amazon S3、Azure Blob Storage、Amazon Redshift、Teradata の取り込み費用も無料です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サードパーティ SaaS は使用量ベースの低料金:</strong><span style=\"vertical-align: baseline;\"> サードパーティ ソースからの取り込みは、すべて柔軟な使用量モデルに基づきます。コンピューティング料金は、主要なリージョンで</span><a href=\"https://cloud.google.com/bigquery/pricing#data-transfer-service-pricing\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">スロット時間あたり 6 セント未満</strong></a><span style=\"vertical-align: baseline;\">です。料金は行数ではなくコンピューティング フットプリントに応じて変動するため、ソースデータの圧縮形式と利用可能なネットワーク帯域幅によっては、</span><strong style=\"vertical-align: baseline;\">大量のデータを効率的に転送</strong><span style=\"vertical-align: baseline;\">できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">2. スムーズなセキュリティとネイティブ管理</strong></p>\n<p><span style=\"vertical-align: baseline;\">中継サーバーや、外部のセキュリティと API の構成が不要になります。BigQuery DTS は Cloud IAM と完全に統合されています。データ転送は、追加の構成オーバーヘッドなしで、宛先データセットの列レベルのセキュリティ、行レベルのセキュリティ、顧客管理の暗号鍵（CMEK）を即座に継承します。ストリームは、ネイティブの Google Cloud 境界内で安全に流れます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. 業界トップクラスのパフォーマンスとレジリエンス</strong></p>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ規模でデータを管理する場合、ダウンタイムはビジネスの機会損失を意味します。BigQuery DTS は、高い復元力を持つ取り込みフットプリントを提供し、これは厳格な Google Cloud サービスレベル契約（SLA）に裏付けられています。システムは</span><strong style=\"vertical-align: baseline;\">月間稼働率 99.99% 以上</strong><span style=\"vertical-align: baseline;\">を実現し、分析、自動化されたパイプライン、運用ダッシュボードの更新を確実に保証します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">データ運用の変革を始めましょう</strong></h4>\n<p><span style=\"vertical-align: baseline;\">手動の取り込みスクリプトにビジネスの成長を制限される状況はもう終わりにしましょう。Google のネイティブ クラウド レイクハウス データ移動アーキテクチャを利用して、最新のスケーラブルなデータスタックを構築している数千社もの企業の仲間に加わってください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">今すぐプラットフォームをお試しください。BigQuery Data Transfer Service コンソール</strong><span style=\"vertical-align: baseline;\">に移動し、コネクタを選択して、数回クリックするだけで最初の自動転送をデプロイできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">次に構築すべきコネクタは？</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、お客様のビジネスニーズに基づいて、ネイティブ統合ライブラリを常に拡大しています。</span><strong style=\"vertical-align: baseline;\">現在、手動で抽出せざるを得ないソースはあるでしょうか。</strong><span style=\"vertical-align: baseline;\">次にレプリケートする必要がある特定のリレーショナル データベース、NoSQL エンジン、リージョン SaaS プラットフォームについて、機能リクエストでお知らせください。</span></p>\n<p><span style=\"vertical-align: baseline;\">機能リクエストは、</span><a href=\"https://b.corp.google.com/issues/new?component=187149&amp;template=1162659&amp;pli=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">公開 Issue Tracker</span></a><span style=\"vertical-align: baseline;\"> からお送りいただけます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vignesh Rajamani</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Pallavi Palleti</strong></p></div>"
