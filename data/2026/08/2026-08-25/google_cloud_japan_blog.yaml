    "summary": "<div class=\"block-paragraph\"><p><b>Google Cloud Next Tokyo 26 の Day 1 基調講演</b>では、自ら考えて業務を進める AI エージェントが、日本企業の現場を動かし始めた姿がくっきりと見えてきました。変革の全体像から、Gemini Enterprise の進化、NTTデータや ＳＯＭＰＯホールディングス、Ｓｋｙ、スクウェア・エニックスの実践、そして Google Workspace とセキュリティまで。最前線で今何が起きているのか、注目のトピックを分かりやすくお届けします！</p><p><b>見逃した方はぜひ</b><a href=\"https://www.googlecloudevents.com/next-tokyo/v/s-4303514?i=-tcQ5g2ZKifIaC2uzppIvJeK1RMseFPi\" target=\"_blank\"><b>こちら</b></a><b>からご覧ください。</b></p><h3><b>「電気で 30 年」を、AI なら何年で？</b></h3><p>最初に立った Google Cloud の三上は、今の AI による変化を工場の電化になぞらえました。工場に電気が通っても、生産性が上がるまでには約 30 年。中央の蒸気機関を大きなモーターに替えただけでは変わらず、機械の一台ごとに小さなモーターを載せ、作業の流れごと作り直したときに一気に伸びました。AI エージェントも、業務の一つひとつに組み込んでこそ力を発揮します。しかも今回は、3 年、3 か月で景色が変わります。</p><p>世界では Google Cloud のお客様の約 75% が AI を活用し、多くが本番運用へ進んでいます。一方、日本市場の独自調査では、対象の 70% が AI エージェントをまだ使えておらず、利用者の約半数は会社非公認の「シャドー AI」に頼っています。ここに、日本企業の伸びしろがあります。</p><p>Google 自身は、検索や YouTube など月間のべ 150 億人以上のサービスに AI を組み込んでいます。その規模を支える力をお客様に届けるのが Google Cloud で、AI ハイパーコンピュータ からモデル、データ基盤、Agent Platform まで、変革に必要なフルスタックを自社で持ちます。AI 専用チップの TPU は第 8 世代となり、学習用と推論用に最適化した 2 種類をそろえました。このフルスタックの上で、働く人が実際に触れるのが Gemini Enterprise です。日立製作所やファナックでもすでに導入が進んでいるといいます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"tomoko\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/tomoko.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>NTTデータ：自らが Client Zero となって</b></h3><p>NTTデータの西村氏は、機微データを守りガバナンスを効かせつつ AI を速く届ける難しさを挙げ、その答えが、自社を実践の場にする Client Zero だと説明しました。同社は 2026 年 6 月に Google Cloud と包括契約を結び、Google Workspace と Gemini Enterprise を大規模に活用する基盤を整備。業務にAIエージェントを組み込んで働き方を見直し、得た知見をお客様への提案につなげるといいます。</p><p>NTTデータの西村氏は、機密データを守りガバナンスを効かせつつ AI を速く届ける難しさを挙げ、その答えが、自社を実践の場にする Client Zero だと説明しました。同社は 2026 年 6 月に Google Cloud と包括契約を結び、Google Workspace と Gemini Enterprise を大規模に導入。業務にエージェントを組み込んで働き方を見直し、得た知見をお客様への提案につなげるといいます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"nttdata\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/nttdata.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Gemini Enterprise の進化と、小売の現場デモ</b></h3><p>Google Cloud の Lilly McNealus は、Gemini Enterprise を、企業で働く人が AI を利用する入口だと位置づけました。複雑なツールやトークン課金の悩みに対し、シンプルさ、安全性、コスト効率の 3 つの価値を届けると話します。コードなしで使える 24 時間 365 日のスーパー エージェント、一つの管理画面でのガバナンス、目的に合わせてモデルを選べるコスト最適化がそろい、単一のアーキテクチャで統合されています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"lilly\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/lilly.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>続いて、Google Cloud の岡本によるデモです。店舗を担当する社員が店舗巡回アシスタント エージェントに相談すると、ミネラルウォーターの陳列スペースが足りない点や、古い POP を指摘します。音声メモと写真を渡せば、報告書 PDF が作られ Teams や Outlook へ連携されます。本部の担当者が Gemini Enterprise の Spark に POS や気象データを渡すと、翌朝には熱中症対策商品を目立つ位置に置く棚割り案が届きました。デモのあと Lilly は、目的を伝えれば動く Gemini Spark や、ノーコードで作れる Agent Designer など、Gemini Enterprise の新機能も紹介しました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"mitch\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/mitch.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>開発者に向けたアップデート</b></h3><p>さらに Lilly からは、Gemini Enterprise から直接アクセスできる Antigravity、日本リージョン対応の Gemini Enterprise app、国内で処理を完結できる Gemini 3.5 Flash の一般提供、Anthropic や Mistral なども選べる Model Garden、コード最適化の AlphaEvolve などが紹介されました。</p><h3><b>SOMPOホールディングス：グループ 3 万 4,000 人が使う「SOMPO AI エージェント」</b></h3><p>ＳＯＭＰＯホールディングスの中島氏は、SOMPOグループの AI 戦略を紹介しました。同グループは今年 1 月、全社員が使う汎用型 AI を従来のチャット型 AI から Gemini Enterprise へ切り替え、3 万 4,000 人へ「SOMPO AI エージェント」として提供しています。決め手は、約款やマニュアルなどの社内ナレッジと相性の良い Gemini Notebook。</p><p>ユースケースを拡大するために、会議の録音を自動共有する「SOMPO 音声メモアプリ」を個別開発したほか、レッカー費用を一次チェックする「レカみる」など市民開発では、数か月で 1 万件超のエージェントが生まれ、週 1 回以上使う社員は 80% 超、部長以上では 98% に達しました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"sompo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sompo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Ｓｋｙ：5 か月で 2 万個のエージェントを自作</b></h3><p>Ｓｋｙ株式会社の太田氏は、処理精度と検索、ガバナンスの強さから Gemini Enterprise を全社導入しました。社員が業務に合う独自エージェントを自作し、単一の用途に分類するのが難しい、複合的なプロンプトが約 48% を占めます。AI への総リクエストは 1 日 1 万 5,000 回から 3 万回へ倍増し、エージェント数は 5 か月で 20,000 個に。作る過程で個人の暗黙知が集まり、可視化されるのも効果的です。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"sky\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sky.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>スクウェア・エニックス：見て、考えて、動く AI</b></h3><p>スクウェア・エニックスの荒牧氏は、音や画面を理解するマルチモーダル AI の活用を目指し、Gemini Enterprise Agent Platform を採用しました。今年 8 月に 14 周年を迎えた『ドラゴンクエストX オンライン』において、期間限定のクローズド ベータテストとして開発・提供していた対話型AIバディ「おしゃべりスラミィ」の取り組みが紹介されました。「おしゃべりスラミィ」は、プレイヤーと音声で会話し、プレイ状況に応じて自ら話しかける機能を備えています。</p><p>さらに会場では、ゲーム QA 作業の自動化デモ動画として、「船を見たい」という指示に応じて Gemini が地図を開き、コントローラーを操作して QA を進める様子も紹介されました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"squre\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/squre.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Google Workspace で変わる、ある一日</b></h3><p>Google Workspace の Yulie Kwon Kim は、相手の必要を先に汲む「おもてなし」を AI に込めたいと話しました。朝は Google Chat の「デイリーブリーフ」が要点を届け、Sheets Canvas がデータからダッシュボードを作り、Google Meet の Gemini 3.5 Live Translate が 70 以上の言語をつなぎます。さらに、Microsoft 365 からの移行も、従来と比べて最大 5 倍速くなったと紹介されました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"yuly\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/yuly.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>Google Cloud の服部によるデモでは、Google Workspace に標準搭載される Google Pics で写真のスパークリング ワインをビール ジョッキに差し替え、必要な情報をサイドパネルから呼び込み、AI でスライドの体裁を整えるなど、顧客への案内スライドを数分で仕上げました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"junjun\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/junjun.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>AI の脅威に AI で備える、そして次の一歩</b></h3><p>三上が最後に強調したのは、エージェント時代に欠かせないサイバーセキュリティでした。攻撃者も AI を使う今、脆弱性の悪用までの時間は、この数年で 1.3 年から 1.6 日へと縮まりました。こうした脅威には AI で自律的に立ち向かう必要があります。</p><p>Google 自身も月に数万件の脅威レポートを処理し、エージェントで対応時間を 90% 以上短くしました。5 月発表の Google AI Threat Defense を、準備・スキャン・修復・監視の 4 ステップで、NTTデータや NEC、日立製作所、富士通などと日本でも展開します。</p><p>電気で 30 年かかった変化を、AI ではどこまで短くできるか。この問いかけとともに、DAY 1 基調講演は幕を閉じました。</p><p><a href=\"https://www.googlecloudevents.com/next-tokyo/\" target=\"_blank\">Google Cloud Next Tokyo 公式サイト</a>にて基調講演を含むセッションをアーカイブ公開中です。現地 / ライブ配信での視聴が出来なかったという方も、ぜひアーカイブ配信にてセッションの復習や新たな学びのきっかけに、ぜひご活用ください。</p></div>"
