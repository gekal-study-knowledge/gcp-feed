  "75415ac9262df3533f85e7a21f027da3":
    "id": "75415ac9262df3533f85e7a21f027da3"
    "title": "【Google Cloud Next Tokyo 26】DAY 2 基調講演まとめ：インフラからセキュリティまで、フルスタックで支える AI エージェント"
    "link": "https://cloud.google.com/blog/ja/topics/next-tokyo/google-cloud-next-tokyo-26-day-2-keynote-summary/"
    "published": "2026-08-25 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph\"><p><b>Google Cloud Next Tokyo 26 の Day 2 基調講演では、</b>AI エージェントの実用化をフルスタックで支える最新テクノロジーが勢ぞろいしました。インフラの進化から、エージェント開発、データ基盤、そしてセキュリティまで。GovTech東京 や NTTドコモなど先進企業の実践も交えて、最前線で今何が起きているのか、注目のトピックを分かりやすくお届けします！</p><p><b>見逃した方はぜひ</b><a href=\"https://www.googlecloudevents.com/next-tokyo/v/s-4322764\" target=\"_blank\"><b>こちら</b></a><b>からご覧ください。</b></p><h3><b>AI を支えるインフラ</b></h3><p>幕開けは Google Cloud の渕野の挨拶から。AI コンピューティングへの需要が急速に高まるなか、ハードウェアからモデル、プラットフォームまで全レイヤーを自ら手がけてきたことが強みだと語りました。その象徴が、クリーン エネルギーや専用インフラを 1 つのエンジンにまとめた AI Hypercomputer です。学習と推論それぞれの要求に合わせた第 8 世代 TPU を用意し、新しいネットワーク Virgo Network は 134,000 個のチップを束ねて 170 万エクサ FLOPS を生み出します。運用の面では、Google Kubernetes Engine（GKE）が 256,000 ノードを 1 つのクラスタにまとめ、大規模な学習も支えます。すでに Woven by Toyota が時空間理解の視覚言語モデルの学習を高速化するなど、多くの企業がこの基盤で成果を上げています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"dk\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/dk.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>エージェントを本番で動かすプラットフォーム</b></h3><p>続いて登壇したのは Google Cloud の Brad Calder。エージェントを本番で動かすための Gemini Enterprise Agent Platform を紹介しました。作る出発点はオープンソースの Agent Development Kit (ADK) で、Google Cloud の全サービスが標準で MCP に対応し、エージェント同士は Agent2Agent プロトコル (A2A) で協調します。動かす Agent Runtime、守る Agent Identity や Agent Gateway、Model Armor まで、本番運用に必要な部品が一式そろいました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"brad\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/brad.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>デモでは、Google Cloud の塚越が、Antigravity CLI で作った購買エージェントを動かして見せました。「ノート PC が 3 台ほしい」と頼むと、A2UI が申請ボタンやフォームをその場で組み立て、在庫を確かめて発注を 2 台へ調整します。不正な指示や未登録の MCP への通信は、ポリシーがブロック。開発者が向き合うのは業務ロジックだけです。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"gossy\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/gossy.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>データにコンテキストを与える Agentic Data Cloud</b></h3><p>続いて、データの活かし方を語ったのは Google Cloud の Sirish Chandrasekaran です。これまでのデータ基盤は、人が問いかけて初めて答える受け身のものでした。Sirish はこうした仕組みを System of Intelligence と呼びます。これからは、AI が自分で判断して動く System of Action が要ります。そのためには、文書や画像のまま眠っている 9 割の非構造化データにも意味を持たせ、いつでも引き出せるようにしておかなければなりません。これを実現するのが Agentic Data Cloud です。データを動かさずに扱う Borderless Lakehouse、AIエージェントや分析基盤に信頼できるコンテキスト（文脈）を提供する「Knowledge Catalog」、自然言語で分析・実行できる Intent-Driven Outcomes という 3 つの柱で支えます。国内でも、メルカリが「Socrates」を BigQuery や Looker の Semantic Layerを使って、NTT データが決済サービス「ADAPTIS」を AlloyDB 上で動かしています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"sirish\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sirish.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>デモでは、Google Cloud の山田が、架空の食品会社のマーケターとして腕を振るいます。話題の「お濃茶ジェラート」を海外に広げるべきか。その判断までふだんは 5 週間かかるところを、5 分に縮めました。PDF に埋もれた原材料の情報を Gemini が読み解き、AWS にある購買データを動かさず BigQuery につなぎ、組み上げたデータエージェントが売上や ROI を予測して、報告スライドまで用意しました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"yamada\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/yamada.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>1,000万人の都民が使う共通の入り口を目指して</b></h3><p>ここで紹介されたのが、GovTech東京 の井原氏です。きっかけは 2024 年 1 月 1 日、能登半島での地震でした。災害のさなかに行政サービスにアクセスできない不安を自ら経験し、行政のデジタル化に飛び込んだといいます。GovTech東京 は東京都と 62 の市区町村と連携し、デジタルサービスを内製する組織です。現在、600 万ダウンロードを超えた東京都公式アプリを、1,000 万人の都民が使う共通の入り口とすることを目指しています。災害時等の集中アクセスでも安定して動き、情報が矛盾なく整合すること。この要件を満たす基盤に Google Cloud を選び、大規模な書き込みと強い整合性を両立できる Spanner を採用しました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"govtech\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/govtech.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>NTTドコモが目指すフル AI マーケティング</b></h3><p>NTTドコモの鈴木氏が語ったのは、フル AI マーケティングの構想です。1 億を超える dポイントのユーザーと 2,000 種類以上の顧客データを前に、一人ひとりに最適な体験を届けるには膨大な検討が欠かせません。着目したのは、社内の資産。5,000 人以上の社員が使うデータ活用アプリのソースコードや利用ログに眠る現場の知識を、AI が読み取れるナレッジに変えました。基盤の Google Cloud なら、月 160 億通の顧客アプローチも、お客様の声や営業社員の日報も、BigQuery でまとめて扱えます。施策設計エージェントは、100 パターンを超えるセグメントへ自動で分け、立案から生成、審査までを自律的に進めます。目指すのは、2027 年のマーケティング フル AI 化です。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"nttdocomo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/nttdocomo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>AI の脅威に AI で立ち向かうセキュリティ</b></h3><p>渕野が最後に取り上げたのは、エージェント時代に欠かせないセキュリティでした。攻撃側も AI を使いこなす今、Google は共同プロジェクト Big Sleep で未知のゼロデイ脆弱性を AI 単独で見つけ、脆弱性を自動で直す CodeMender も投入しました。CodeMender では、Gemini 3.5 Flash をセキュリティ用途に特化させたカスタムモデル Gemini 3.5 Flash Cyber も選べます。渕野が掲げたのは、可視化から優先順位付け、修復、監視までを AI で連携させる AI Threat Defense です。</p><p>デモでは、Wiz Cloud Japan の大井が、公開状態の Python 製チャットボットに潜む認証回避の脆弱性をレッド エージェントで突き止め、グリーン エージェントが対策を提案するところを見せました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ooi\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/ooi.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>修復役の CodeMender は、Google Cloud の高橋が cm find・cm verify・cm fix で、脆弱性の発見からパッチ作成までを実演しました。防御を人間のスピードからマシンのスピードへ。渕野はそう締めくくりました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"satoshi\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/satoshi.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>まとめ</b></h3><p>2 日間の基調講演で見えてきたのは、AI エージェントを業務に取り入れる技術が、事例とともに整いつつある姿です。ハードウェアからアプリケーションまで、Google Cloud が一貫してそろえます。最後に、渕野が紹介したのは、手を動かして試せるハンズオンイベント<a href=\"https://cloudonair.withgoogle.com/events/build-with-gemini26q3\" target=\"_blank\">「Build with Gemini Tokyo」</a>や、<a href=\"https://cloudonair.withgoogle.com/events/gcgenai-innovation-awards\" target=\"_blank\">「第 6 回 AI エージェント事例アワード」</a>。次にこの基盤を活かすのは、みなさんです。来年の Next Tokyo は 8 月 5 日と 6 日。また会場でお会いしましょう。</p><p><a href=\"https://www.googlecloudevents.com/next-tokyo/\" target=\"_blank\">Google Cloud Next Tokyo 公式サイト</a>にて基調講演を含むセッションをアーカイブ公開中です。現地 / ライブ配信での視聴が出来なかったという方も、ぜひアーカイブ配信にてセッションの復習や新たな学びのきっかけに、ぜひご活用ください。</p></div>"
  "1383821aa6f1af74933563ef5857dc91":
    "id": "1383821aa6f1af74933563ef5857dc91"
    "title": "メジャーがサポートされるようになった BigQuery Graph を使用して、信頼できるエージェント ワークロードを実現"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/bigquery-graphs-with-measures-for-trusted-agentic-workloads/"
    "published": "2026-08-25 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 14 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/bigquery-graphs-with-measures-for-trusted-agentic-workloads?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業が単純なチャット アシスタントの使用から自律型のエージェント ワークロードに移行すると、すぐに厳しい現実に直面します。それは、エージェントが元テーブルを直接使用する際に、不正確な分析情報を生成する傾向があるということです。</span></p>\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/graph-measures\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</strong></a><span style=\"vertical-align: baseline;\"> は、組織がフラットで静的なテーブルから脱却し、現実世界に存在する企業を正確に表現できるように、つまり、現実世界の依存関係を持つ、相互に接続された事業体として表現できるようにします。BigQuery Graph（プレビュー版）でメジャーがサポートされるようになったことで、管理された指標と関係マッピングが統合されます。これにより、エージェントはグラフで収集された複雑な依存関係全体について、メジャーの精度に基づいて推論できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">関係が重要な理由</span></p>\n<p><span style=\"vertical-align: baseline;\">従来のデータ構造では、マルチホップのビジネス コンテキストが考慮されないため、次のように、AI エージェントが運用上誤った意思決定を行うことがあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">具体的な問題:</strong><span style=\"vertical-align: baseline;\"> 小売業者のエージェントが、シアトルでの冬用ジャケットの売り上げが 12% 減少した理由を尋ねられた場合、フラット テーブルをクエリして、「事実」（12% の減少）を報告することはできますが、「シアトルの注文 ➔ 配送センター ➔ 地域の嵐によるサプライヤーの遅延」という関係パスを追跡できないため、「理由」を特定することはできません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">分断されたシステムのリスク:</strong><span style=\"vertical-align: baseline;\"> 関係のコンテキストがないため、エージェントが関連性のない 15% オフのキャンペーンを提案し、不必要に利益率を低下させます。さらに、あるチームがサプライヤーの関係を別のグラフ データベースにマッピングし、別のチームが SQL 指標を維持するというように、別々のシステムを維持すると、エージェントは実行時にこれらのスタックを結合せざるを得なくなります。このプロセスは時間がかかり、費用もかさみ、KPI の計算に一貫性がなくなります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">BigQuery Graph のメジャーは、</span><strong style=\"vertical-align: baseline;\">既存のテーブルをプロパティ グラフにインプレースでマッピングし、ETL を不要にする</strong><span style=\"vertical-align: baseline;\">ことで、この問題を解決します。この統合された設定により、次のような問い合わせの論理的な進化が可能になります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">メタデータのグラウンディング</strong><span style=\"vertical-align: baseline;\">は、存在する</span><span style=\"font-style: italic; vertical-align: baseline;\">データ</span><span style=\"vertical-align: baseline;\">を確立します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ビジネス指標（メジャー）</strong><span style=\"vertical-align: baseline;\">は、ビジネスの</span><span style=\"font-style: italic; vertical-align: baseline;\">パフォーマンス</span><span style=\"vertical-align: baseline;\">を計算します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">関係マッピング（グラフ）</strong><span style=\"vertical-align: baseline;\">は、それが起こった</span><span style=\"font-style: italic; vertical-align: baseline;\">理由</span><span style=\"vertical-align: baseline;\">を明らかにします。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">従来、グラフ走査中の標準 SQL の結合では行が重複し、集計計算が不正確になっていました。BigQuery Graph は、これをネイティブに解決します。</span></p>\n<p><span style=\"vertical-align: baseline;\">データモデラーは、プロパティ グラフ DDL 内で直接 </span><code style=\"vertical-align: baseline;\">MEASURE</code><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">SUM</code><span style=\"vertical-align: baseline;\"> や </span><code style=\"vertical-align: baseline;\">AVG</code><span style=\"vertical-align: baseline;\"> など）を定義します。エンジンは </span><code style=\"vertical-align: baseline;\">GRAPH_EXPAND</code><span style=\"vertical-align: baseline;\"> 関数と </span><code style=\"vertical-align: baseline;\">AGG</code><span style=\"vertical-align: baseline;\"> アグリゲータを介して標準 SQL を使用して、指標を評価する前に構造グラフのパスを解決します。これにより、エージェントは</span><strong style=\"vertical-align: baseline;\">計算機（SQL）</strong><span style=\"vertical-align: baseline;\">が必要なときと</span><strong style=\"vertical-align: baseline;\">地図（グラフ）</strong><span style=\"vertical-align: baseline;\">が必要なときを認識できるほどスマートになります。</span></p>\n<p><code style=\"vertical-align: baseline;\">bigquery-public-data</code><span style=\"vertical-align: baseline;\"> のような一般公開プロジェクトは厳密に読み取り専用であるため、読み取り専用の一般公開テーブルをノードおよびエッジとして直接参照しながら、プレースホルダ変数（</span><code style=\"vertical-align: baseline;\">YOUR_PROJECT_ID</code><span style=\"vertical-align: baseline;\">）を使用して独自のプロジェクト内で論理プロパティ グラフをマッピングする必要があります。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- 1. Map the graph inside YOUR project \\r\\n\\r\\n\\r\\nCREATE OR REPLACE PROPERTY GRAPH `YOUR_PROJECT_ID.YOUR_DATASET.thelook_ecommerce_graph`\\r\\nNODE TABLES(\\r\\n  `bigquery-public-data.thelook_ecommerce.users` AS User\\r\\n    KEY(id)\\r\\n    LABEL User PROPERTIES(id, city, country),\\r\\n  `bigquery-public-data.thelook_ecommerce.orders` AS Order\\r\\n    KEY(order_id)\\r\\n    LABEL Order PROPERTIES(\\r\\n      order_id, \\r\\n      MEASURE(AVG(num_of_item)) AS avg_items_per_order,\\r\\n      MEASURE(SUM(num_of_item)) AS total_items\\r\\n    )\\r\\n)\\r\\nEDGE TABLES(\\r\\n  `bigquery-public-data.thelook_ecommerce.orders` AS OrderedBy\\r\\n    SOURCE KEY(order_id) REFERENCES Order(order_id)\\r\\n    DESTINATION KEY(user_id) REFERENCES User(id)\\r\\n    LABEL ORDERED_BY\\r\\n);\\r\\n\\r\\n-- 2. Query your new graph with standard SQL—using standard {Label}_{Property} column outputs\\r\\nSELECT\\r\\n  User_city AS city,\\r\\n  ROUND(AGG(Order_avg_items_per_order), 2) AS agg_avg_items,\\r\\n  ROUND(AGG(Order_total_items), 2) AS agg_total_items\\r\\nFROM GRAPH_EXPAND(&quot;YOUR_PROJECT_ID.YOUR_DATASET.thelook_ecommerce_graph&quot;)\\r\\nGROUP BY User_city\\r\\nORDER BY agg_total_items DESC\\r\\nLIMIT 10;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e933865d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">BigQuery Studio でグラフ インテリジェンスを民主化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">デベロッパーとビジネス ユーザーの双方が、これらの関係ネットワークをスムーズに管理、デプロイできるように、直感的なネイティブ運用ツールを BigQuery Studio に直接組み込みました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">視覚的なグラフモデラー:</strong><span style=\"vertical-align: baseline;\"> BigQuery Studio 内のノーコードのドラッグ＆ドロップ インターフェースで、複雑な DDL スクリプトを手動で記述することなく、プロパティ グラフ、ノード、エッジを視覚的に構築、編集、マッピングできます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_CXQhslw.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">会話型分析（CA）のインテグレーション:</strong><span style=\"vertical-align: baseline;\"> </span></strong><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">ユーザーはグラフと自然にやり取りできます。会話型分析エージェントは、テーブル結合を推測するのではなく、グラフの決定論的な関係認識マップをナビゲートし、自然言語の質問を、境界が制約された正確な GoogleSQL クエリまたは ISO GQL クエリに変換します。これにより、モデルのハルシネーションを防ぎ、セマンティックな一貫性を確保します。</span></span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_23oI53E.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">統合されたセマンティクス: Looker とのネイティブなインテグレーション</strong></h4>\n<p><span style=\"vertical-align: baseline;\">断片化されたロジック スタックの維持を避けるために、ビジネス指標はデータレイヤに存在する必要があります。</span><strong style=\"vertical-align: baseline;\">Looker（LookML）</strong><span style=\"vertical-align: baseline;\">を、</span><a href=\"https://docs.cloud.google.com/looker/docs/analytic-models\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">データベース内分析モデル</strong></a><span style=\"vertical-align: baseline;\">としての BigQuery Graphs とネイティブに統合することで、コアでロジックを一度定義するだけで済みます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データベース管理モデル（sql_analytic_model_name）:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">sql_analytic_model_name</code><span style=\"vertical-align: baseline;\"> を使用して、Looker にデータベース定義の BigQuery Graph を直接参照させ、標準の LookML のディメンションとメジャーをグラフ プロパティに直接マッピングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Looker 管理モデル（derived_analytic_model）:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">derived_analytic_model</code><span style=\"vertical-align: baseline;\"> を使用して、LookML ビュー内で BigQuery Graph スキーマを直接定義します。Looker は、SQL DDL ステートメントを動的に生成して実行し、BigQuery 内のグラフを維持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンタープライズ DevOps ワークフロー:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Looker IDE、Git ベースのバージョン管理、継続的インテグレーション（CI）</strong><span style=\"vertical-align: baseline;\">を使用して、グラフのライフサイクル全体を管理します。主要な KPI（離脱率など）は、検証済みで、信頼できる、まったく同じものが維持されます。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Deepak Dayama</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア開発マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Yun Zhang</strong></p></div>"
  "8355459d8291a1740c23cdc61dba6f6d":
    "id": "8355459d8291a1740c23cdc61dba6f6d"
    "title": "TelevisaUnivision が Google Cloud を利用して FIFA ワールドカップを数百万人にストリーミング配信"
    "link": "https://cloud.google.com/blog/ja/products/networking/streaming-the-fifa-world-cup-with-televisaunivision/"
    "published": "2026-08-25 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 8 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/networking/streaming-the-fifa-world-cup-with-televisaunivision?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">スポーツのライブ配信は、デジタル メディア インフラストラクチャにとって究極のストレステストとなります。運営面の成否はミリ秒単位で評価され、何百万人もの視聴者が生で同時に目にします。2026 FIFA ワールドカップ開催期間中、スペイン語メディアの大手コングロマリットである TelevisaUnivision は、大きな課題に直面しました。メキシコは主要な開催国であると同時に、代表チームが有力な優勝候補であったため、ファンの関心は高く、ラテンアメリカ全域と TelevisaUnivision の ViX ストリーミング プラットフォームで前例のない需要が発生しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">TelevisaUnivision のような大手放送局にとって、重要なイベントはブランドと評判に直接的かつ長期的な影響を及ぼします。視聴者は、試合の重要な瞬間を、途切れることなく、鮮明に視聴することを求めています。決定的なゴールシーンでの映像の中断、キックオフ時のログイン遅延、ストリーミング解像度の低下は、顧客満足度に直接影響し、サブスクライバーの離脱やブランドの希薄化を招くリスクがあります。トップレベルの世界的スポーツ イベントをストリーミング配信する場合、技術面の運用が消費者の信頼に直接影響するため、プロバイダはダウンタイムなしの可用性と完璧なパフォーマンスを絶対に確保する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">TelevisaUnivision が Google Cloud を選んだ理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ISP の細分化が激しく、国境を越えた中継のボトルネックが目立つラテンアメリカの複雑なネットワーキング エコシステムに対応するには、標準的なベンダー関係以上のものが必要でした。TelevisaUnivision は、ネットワーク容量、インフラストラクチャの復元力、カスタム機能の開発に共同で取り組んでくれる戦略的パートナーを必要としていました。TelevisaUnivision が Google Cloud の </span><a href=\"https://docs.cloud.google.com/media-cdn/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Media CDN</span></a><span style=\"vertical-align: baseline;\"> を選んだ理由は、Google Cloud のアーキテクチャと顧客重視の姿勢という 2 つの基本的な差別化要因でした。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">プラットフォーム アーキテクチャ </strong></h4>\n<p><span style=\"vertical-align: baseline;\">Media CDN は、送信元インフラストラクチャを保護しながら、ライブ配信のトラフィックの急増を吸収するために特別に構築された、グローバルに分散された復元力のあるインフラストラクチャを提供しました。このアーキテクチャがもたらした主なメリットは次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ISP 内のディープ エッジ キャッシング:</strong><span style=\"vertical-align: baseline;\"> メキシコ、中南米のローカル ISP ネットワーク内に深く埋め込まれた Media CDN のキャッシュ ノードにより、視聴者から 1 ネットワーク ホップ以内の場所に動画セグメントが配置されました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ISP とのダイレクト ピアリング:</strong><span style=\"vertical-align: baseline;\"> América Móvil や Telefônica などの主要な地域通信事業者とのダイレクト ピアリング接続を確立することで、混雑した多国間の中継ルートを完全に回避するアーキテクチャが実現しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">専用容量の予約:</strong><span style=\"vertical-align: baseline;\"> TelevisaUnivision は、リージョン内で専用のヘッドルームを割り当ててライブイベントの容量を予約しました。この方法により、ライブ配信のトラフィックが「ノイジー ネイバー」のリスクから隔離され、ピーク時のトラフィック急増を無理なく吸収できました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Valkey 9.0 によるミリ秒未満のセッション:</strong><span style=\"vertical-align: baseline;\"> ワールドカップ期間中の大規模なトラフィック急増に対処するため、TelevisaUnivision はセッション ストアを Memorystore for Valkey 9.0 に移行し、エッジ コンピューティング上のサーバーレス マイクロサービスとして稼働させました。このアーキテクチャにより、重要な認証と権限チェックの応答時間が 1 ミリ秒未満になり、手動で容量を予約しなくても、ピーク時の API トラフィックを自動スケーリングで処理できるようになりました。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Worldcup diagram\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/ArchDiagram-highres.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">カスタマー サクセスへのこだわり</strong></h4>\n<p><span style=\"vertical-align: baseline;\">TelevisaUnivision が Google Cloud を選んだのには、技術的な能力だけでなく、共同エンジニアリング モデルや運用面での緊密な連携といった理由もありました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">24 時間 365 日の共同ウォールーム:</strong><span style=\"vertical-align: baseline;\"> 104 試合すべてで、TelevisaUnivision のエンジニアと Google Cloud のスペシャリストが統合コマンド センターで並んで作業しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サービスとしてのプロアクティブなモニタリング:</strong><span style=\"vertical-align: baseline;\"> Google Cloud の顧客信頼性エンジニアリング チームが、24 時間体制でプロアクティブなモニタリングと自動アラートを提供しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">運用面の共同権限:</strong><span style=\"vertical-align: baseline;\"> 大会前に、両チームが合同で、広範なストレステストとフェイルオーバーのシミュレーションを実施しました。試合のライブ配信中は、統合されたテレメトリーにより、共同リーダーがトラフィックを動的にルーティングし、地域の ISP で輻輳が発生したときに CDN 構成を即座に調整することができました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">2026 FIFA ワールドカップにおける TelevisaUnivision と Google Cloud の戦略的パートナーシップは、世界のスポーツ放送の新たな基準を確立しました。TelevisaUnivision は、39 日間にわたるトーナメントの実施期間中、共同インフラストラクチャが以下の成果を上げたと報告しています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">放送された試合の総数</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">104 試合をライブ配信</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">プラットフォームの可用性</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">プラットフォームの可用性 100%（ダウンタイム 0）</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">累積視聴回数</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">TelevisaUnivision と ViX で 6 億 7,500 万回視聴</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">TelevisaUnivision と Google Cloud は、ローカライズされたエッジ配信、ミリ秒未満のサーバーレス コンピューティング、運用における専任の共同エンジニアリングを統合することで、過去最高の世界的規模でライブ ストリーミング イベントを実施するための、実証済みのブループリントを確立しました。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">TelevisaUnivision、プロダクトおよびエンジニアリング担当シニア バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Alexandro David Campos Vega 氏</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、ネットワーキング、プロダクト管理担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Kevin Hutchins</strong></p></div>"
  "c95729fa714f27435e72a2934c3a072a":
    "id": "c95729fa714f27435e72a2934c3a072a"
    "title": "エージェント型モバイルアプリ開発のためのデベロッパー デバイス プラットフォームのご紹介"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/announcing-developer-device-platform-on-google-cloud/"
    "published": "2026-08-25 10:30:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 11 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/announcing-developer-device-platform-on-google-cloud?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">ほとんどの企業は、デバイスを通じて顧客と接点を持っています。モバイルアプリを使用した商品の注文、カスタマー サービスへの問い合わせ、コンテンツの閲覧、アカウント管理など、どのような操作においても、カスタマー エクスペリエンスはアプリが顧客のデバイス上でいかにスムーズに動作するかに左右されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このため、ローカルで動作するコンポーネントを含むあらゆるエンタープライズ リリースにおいて、多種多様なデバイスでアプリケーションを構築・テストすることは極めて重要です。しかし、デバイスを大規模に調達してホストするには費用がかかり、複雑な作業が必要になります。また、テストは不安定で、判定不能だったり、デバッグが難しかったりすることがよくあります。そのため、多くのデベロッパーは、手元の実機でリリース前のテストを行い、その結果が他のほとんどのデバイスでも通用することを願うしかありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">この課題を解決するため、このたび Google Cloud において </span><strong style=\"vertical-align: baseline;\">Developer Device Platform（DDP）</strong><span style=\"vertical-align: baseline;\">の公開プレビュー版の提供開始を発表いたしました。DDP は、実機と高並行仮想エミュレータにわたる複数のハードウェア プロファイルに、オンデマンドで即座にアクセスできるフルマネージド クラウド プラットフォームです。DDP は、クラウド デベロッパー向けの Firebase Test Lab の進化版であり、エージェント型開発向けに構築された初のデバイス プラットフォームでもあります。DDP を使用すると、デベロッパーは好みのエージェントを利用して、さまざまなデバイスにわたってアプリのバイブ コーディング、テストの実行、デバッグ、パフォーマンスの最適化を効率的かつ迅速に行うことができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">アプリを構築してテストし、パフォーマンスを保証する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">標準的なモバイル開発ライフサイクルでは、デベロッパーは新しい機能を反復的に開発し、さまざまな対象デバイスでパフォーマンスを保証するために QA テストを実行し、最適化およびデバッグ済みの機能をユーザー向けに本番環境へリリースします。デベロッパー デバイス プラットフォームには、このサイクルを加速させる 2 つの主な機能があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">デバイス ストリーミングによるインタラクティブなデバッグ: </strong><span style=\"vertical-align: baseline;\">Device Streaming API を使用すると、デベロッパーは選択したエミュレータや実機に直接アクセスし、バイブ コーディング、反復テスト、デバッグ、アプリとのインタラクションをリモートで行うことができます。デバイス ストリーミングを使用すれば、実機のハードウェアでパフォーマンスをモニタリングしながら、カスタマー エクスペリエンスを直接体験し、リアルタイムでスクロールやクリックといった操作を簡単に行うことができます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">デバイスランによる並列テスト: </strong><span style=\"vertical-align: baseline;\">Google の Device Run API を使用すると、デベロッパーは CI / CD パイプラインの一部としてテストを作成し、一度に数百もの異なるデバイスで並列実行できます。得られた結果をもとに、デベロッパーは特定のデバイスに固有の問題をピンポイントで特定してデバッグでき、あらゆる層のデバイスで動作するという確信を持ってコードを本番環境にリリースできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">DDP エージェント スキルと効率的なテストでモバイルアプリ開発を加速させる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">モバイル開発におけるコーディング エージェントの台頭は、特に実機と組み合わせることで新たな可能性を切り開きます。コーディング エージェントは、実機のハードウェアを操作してテストできるため、独自のスマートフォン画面サイズ（折りたたみ式スマートフォンの UI など）や特殊なハードウェア（CPU や GPU など）を活用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Developer Device Platform はまもなく Android Studio と Android CLI に統合され、Device Streaming API を介して実機に直接アクセスできるようになります。DDP エージェント スキルを使用すると、選択した AI コーディング エージェントと連携して開発を加速することもできます。</span><a href=\"https://docs.cloud.google.com/developer-device-platform/agent-skill\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DDP エージェント スキル</span></a><span style=\"vertical-align: baseline;\">を使用すると、コーディング エージェントは次のことができます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">複数のステップから成るユーザー ジャーニーを単独で実行する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">視覚的なアーティファクトを検出する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">オンデバイスでチップのパフォーマンスをリアルタイムで分析する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ハードウェア固有のバグの修正を検証し、デバイス固有の機能に合わせて最適化する</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらのエージェント機能に加えて、DDP ではアプリのパッケージ化や、スマート シャーディングによる並列テストの実行も可能です。これにより、数百台のデバイスにわたるテスト結果をわずか数分で確認できるようになります。スマート自動再試行により、DDP はシャード内で失敗した特定のテストを再試行するため、テストスイート全体を再実行することなく、エラーをより迅速に解決できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">デベロッパー デバイス プラットフォームで今すぐ開発を始めましょう</strong></h4>\n<p><span style=\"vertical-align: baseline;\">8 月 12 日より、Developer Device Platform がすべての Google Cloud ユーザー向けに公開プレビュー版として提供されます。公開プレビュー期間中は、1 分単位の従量課金制モデルに基づいて料金が請求されるため、実際にテストに使用した時間（分）に対してのみ料金が発生します。なお、料金はエミュレータと実機でそれぞれ異なります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud を利用するモバイル デベロッパーが、Developer Device Platform を活用して開発を加速し、増え続ける独自のデバイス機能やオンデバイス AI の可能性を最大限に引き出すことを楽しみにしています。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Derek Bekebrede</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト戦略およびオペレーション担当、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jason Nager</strong></p></div>"
