    "title": "RESOLVED: We are investigating an issue where customers may experience timeouts, service degradations, errors, and elevated latencies across multiple products in the us-west1 region."
    "link": "https://status.cloud.google.com/incidents/utF3FMFdQfwBzJcGG6vf"
    "published": "2026-08-25 15:20:03"
    "fetched": "2026-08-27 21:31:34"
    "summary": "<p> Incident began at <strong>2026-08-20 08:40</strong> and ended at <strong>2026-08-20 12:20</strong> <span>(all times are <strong>US/Pacific</strong>).</span></p><div class=\"cBIRi14aVDP__status-update-text\"><h1>Preliminary Incident Report</h1>\n<p>We sincerely apologize for the disruption this incident caused to your business operations. Recognizing your reliance on Google Cloud, we express our sincere regrets for any operational impact experienced. Our engineering teams are actively addressing the underlying root cause to prevent future recurrences.</p>\n<p>Please note that the information provided herein reflects our current understanding as of the time of publication and remains subject to revision as the investigation progresses. A comprehensive Incident Report detailing preventive measures will be issued upon conclusion of our inquiry.</p>\n<p>If you have experienced impact outside of what is listed below, please reach out to Google Cloud Support using <a href=\"https://cloud.google.com/support\">https://cloud.google.com/support</a>.</p>\n<h2>Date/Time of the Issue (All time US/Pacific)</h2>\n<ul>\n<li>Incident Start: 20 August 2026 08:00</li>\n<li>Incident End: 20 August 2026 10:22</li>\n<li>Duration: 2 hours, 22 minutes</li>\n</ul>\n<h2>Summary</h2>\n<p>On Thursday, 20 August 2026, multiple Google Cloud services encountered elevated latency, provisioning failures, increased error rates, and service degradations lasting for a duration of 2 hours and 22 minutes.</p>\n<h2>Preliminary Root Cause</h2>\n<p>The disruption originated during scheduled fiber optic maintenance, which unexpectedly compromised network capacity between data centers within the us-west1 region. Automated rerouting mechanisms failed to properly redistribute traffic to alternate capacity, resulting in network congestion as volumes exceeded available bandwidth in the affected area.</p>\n<p>This underlying network degradation subsequently impacted higher-level service components through request throttling, increased latency, and cascading retries. Consequently, both control plane operations and data plane requests failed to execute successfully across several dependent Google Cloud services, producing the observed latency and elevated error rates.</p>\n<h2>Remediation</h2>\n<p>Internal monitoring alerted Google engineers to the incident, confirming that multiple services across us-west1 were affected. To mitigate the immediate operational impact, engineers initiated traffic draining protocols, re-routing service workloads away from the degraded network infrastructure. Following the restoration of inter-campus network capacity and the resolution of the core issue, engineers systematically restored traffic to the us-west1 region and confirmed service normalization.\nLong-term engineering solutions are currently being finalized and assigned to address the root cause and strengthen system resilience regarding fiber maintenance procedures.</p>\n<h2>Description of Impact</h2>\n<p>On Thursday, August 20, between 08:00 and 10:22 US/Pacific, Google Cloud customers in the us-west1 region encountered elevated latency, provisioning failures, and increased error rates.</p>\n<ul>\n<li>Proportionate Impact / Error Rates: The precise scope of impact—including the proportion of affected projects and applications—and detailed error metrics will be published in the comprehensive Root Cause Analysis, as the reduced capacity caused request throttling, latency spikes, and increased retry volume.</li>\n<li>Scope Exclusion: Services and workloads operating in regions other than us-west1 remained fully operational and unaffected.</li>\n</ul>\n<p><strong>Affected Services and Features</strong></p>\n<p>The following services experienced elevated latencies and/or increased error rates, across their respective data planes and control planes:</p>\n<ul>\n<li>AlloyDB</li>\n<li>Apache Kafka</li>\n<li>Apigee Edge Public Cloud</li>\n<li>Apigee X</li>\n<li>Artifact Registry</li>\n<li>BigQuery &amp; BigQuery Data Transfer Service</li>\n<li>Cloud Build</li>\n<li>Cloud Data Fusion</li>\n<li>Cloud Dataflow</li>\n<li>Cloud Filestore</li>\n<li>Cloud Key Management Service (KMS)</li>\n<li>Cloud Monitoring</li>\n<li>Cloud Run</li>\n<li>Cloud SQL</li>\n<li>Contact Center AI Platform</li>\n<li>Dataproc Metastore</li>\n<li>Google App Engine</li>\n<li>Google Cloud Bigtable</li>\n<li>Google Cloud Pub/Sub</li>\n<li>Google Cloud Storage (GCS)</li>\n<li>Google Compute Engine (GCE)</li>\n<li>Google Kubernetes Engine (GKE)</li>\n<li>Identity and Access Management (IAM)</li>\n<li>Managed Airflow (Cloud Composer)\n*Managed Service for Apache Spark (Dataproc)\nPersistent Disk</li>\n</ul>\n</div><hr /><p>Affected products: AlloyDB for PostgreSQL, Apigee Edge Public Cloud, Apigee X, Artifact Registry, BigQuery Data Transfer Service, Cloud Build, Cloud Data Fusion, Cloud Filestore, Cloud Key Management Service, Cloud Monitoring, Cloud Run, Contact Center AI Platform, Dataproc Metastore, Google App Engine, Google BigQuery, Google Cloud Bigtable, Google Cloud Composer, Google Cloud Dataflow, Google Cloud Dataproc, Google Cloud Pub/Sub, Google Cloud SQL, Google Cloud Storage, Google Compute Engine, Google Kubernetes Engine, Identity and Access Management, Managed Service for Apache Kafka, Persistent Disk</p><p>Affected locations: Global, Oregon (us-west1)</p>"
