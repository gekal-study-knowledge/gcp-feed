  "5230f8d4518ebb3e136d780d19d81c2b":
    "id": "5230f8d4518ebb3e136d780d19d81c2b"
    "title": "PQC をわかりやすく解説: Google Cloud のポスト量子暗号ロードマップ"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/pqc-in-plaintext-google-clouds-post-quantum-cryptography-roadmap/"
    "published": "2026-08-20 12:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 12 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/pqc-in-plaintext-google-clouds-post-quantum-cryptography-roadmap?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">暗号解読に有効な量子コンピュータが将来登場することに備え、インフラストラクチャとサービスを保護することは、Google が 10 年前から目標としてきたことです。Google は、すべての人にメリットをもたらすオープン スタンダードを推進することで、開発者を支援することに取り組んできました。ポスト量子暗号（PQC）が成熟するにつれて、Google は社内サービスとお客様向けサービスの両方で、インフラストラクチャへの PQC のロールアウトを進めてきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回は、</span><a href=\"https://blog.google/innovation-and-ai/technology/safety-security/cryptography-migration-timeline/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2029 年までの PQC 移行</span></a><span style=\"vertical-align: baseline;\">に向けた Google Cloud の最新ロードマップをご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Google の戦略: 安全性を重視した設計</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google の PQC 移行戦略は、</span><a href=\"https://bughunters.google.com/blog/googles-threat-model-for-post-quantum-cryptography\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google 量子脅威モデル</span></a><span style=\"vertical-align: baseline;\">に基づいており、3 つの主要なドメイン全体で保護を優先しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Store Now, Decrypt Later（SNDL）リスクの軽減</strong><span style=\"vertical-align: baseline;\">: 現在の暗号化されたデータが将来の量子コンピュータによって収集、復号されるのを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">偽造に対する完全性の確保</strong><span style=\"vertical-align: baseline;\">: 攻撃者がデータの内容を改ざんしたり ID を偽造したりするのを防ぐために、デジタル署名を強化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">暗号アジリティの基盤となる機能の強化</strong><span style=\"vertical-align: baseline;\">: 暗号化標準の進化に合わせて、最小限のエンジニアリング作業で新しい暗号化標準を簡単に採用できる柔軟なシステムを構築します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google は、規制の期限をはるかに先取りして、社内インフラストラクチャとお客様向けサービスの両方で PQC アルゴリズムへの移行を積極的に進めています。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、パートナーと協力して、Google Cloud Dedicated（GCD）や Google Distributed Cloud（GDC）などの</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/delivering-a-secure-open-sovereign-digital-world?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Sovereign Cloud イニシアチブ</span></a><span style=\"vertical-align: baseline;\">全体で PQC ソリューションのデプロイを進めています。同様に、Google の戦略により、AI サービス全体へのポスト量子保護の統合を進めることが可能になり、次世代のクラウド ワークロードの安全性を確保できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの取り組みは、Google Cloud 全体でポスト量子暗号への完全な対応を実現するという Google の包括的な戦略の基本となる柱です。この情勢が変化するにつれて、Google はデプロイ スケジュールを継続的に見直し、更新していきます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_584dqua.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Google Cloud PQC ロードマップの図解。Google の取り組みは 2029 年に収束し、それ以降も継続されます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google は、取り組みが収束する 2029 年までに PQC への完全な対応を達成する予定です。Google は、より幅広い業界のガイダンスと進化するグローバル スタンダードをサポートするため、これらの取り組みを 2030 年代にかけて継続することを見込んでいます。これらの標準には、</span><a href=\"https://www.nsa.gov/Press-Room/News-Highlights/Article/Article/3148990/nsa-releases-future-quantum-resistant-qr-algorithm-requirements-for-national-se/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CNSA 2.0</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"https://csrc.nist.gov/pubs/ir/8547/ipd\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NIST IR 8547</span></a><span style=\"vertical-align: baseline;\"> で定義された移行パスが含まれており、2030 年から 2035 年の間に、量子脆弱性のあるレガシー アルゴリズムが最終的に廃止されることが予想されています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">直近の進捗: 2026 年のマイルストーン</strong></h4>\n<p><a href=\"https://cloud.google.com/blog/ja/products/identity-security/cloud-ciso-perspectives-prepare-early-for-PQC-resilient-cryptographic-threats/?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">量子時代のリーダーシップ</span></a><span style=\"vertical-align: baseline;\">には、グローバル規模でのデプロイが必要です。Google は、お客様に即時の保護を提供する基盤となるマイルストーンを達成しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">API エンドポイントの対応</strong><span style=\"vertical-align: baseline;\">: Google Cloud API エンドポイントで耐量子鍵交換が提供されるようになり、将来の復号から受信トラフィックを保護できるようになりました。これらのエンドポイントには google.com と *.googleapis.com が含まれ、いずれも NIST で標準化された ML-KEM（FIPS 203）をハイブリッド モードで実装済みです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ロードバランサの PQC サポート</strong><span style=\"vertical-align: baseline;\">: アプリケーション ロードバランサとプロキシ ロードバランサで、TLS 1.3 の</span><a href=\"https://docs.cloud.google.com/load-balancing/docs/post-quantum-tls\"><span style=\"text-decoration: underline; vertical-align: baseline;\">耐量子ハイブリッド鍵交換</span></a><span style=\"vertical-align: baseline;\">（X25519MLKEM768）がサポートされるようになりました。当初はオプトイン方式で提供されるため、お客様は既存のアプリケーションへの影響を最小限に抑えつつ、検証を行うことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">大規模な耐量子証明書の試験運用</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://datatracker.ietf.org/wg/plants/about/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IETF PLANTS ワーキング グループ</span></a><span style=\"vertical-align: baseline;\">と協力し、運用チームへの影響を最小限に抑える公開鍵基盤（PKI）の標準を策定しています。Chrome と Cloudflare は、WebPKI で PQC 署名を使用する際の課題に対処するため、</span><a href=\"https://security.googleblog.com/2026/02/cultivating-robust-and-efficient.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Merkle Tree 証明書の試験運用</span></a><span style=\"vertical-align: baseline;\">を開始しました。Google は、これらの活動から得られた知見を標準化ワーキング グループと共有しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud KMS PQC アルゴリズム</strong><span style=\"vertical-align: baseline;\">: 暗号化鍵と署名鍵に使用する NIST で標準化された </span><a href=\"https://docs.cloud.google.com/kms/docs/algorithms#pqc_signing_algorithms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">PQC アルゴリズム</span></a><span style=\"vertical-align: baseline;\">（ML-KEM、ML-DSA、SLH-DSA）の一般提供が開始されました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">2029 年までのロードマップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud では、量子コンピューティングへの対応準備を実現するため、お客様中心の具体的なジャーニーを策定しました。これにより、耐量子イニシアチブの優先順位付けが可能になります。このリスクベースのアプローチを採用することで、セキュリティ エキスパートが量子コンピューティングの潜在的な影響を最も受けやすいと特定したコア ジャーニーに焦点を当てます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_Bg6TVDW.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>量子コンピューティングへの対応準備に向けたコア ユーザー ジャーニーのリスクベースの優先順位付け</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これらのシナリオは、Google のサービス全体でグローバルなイネーブルメントを確保し、お客様の現在の状況に合わせてサポートを提供できるよう、さまざまなプラットフォームの視点を提供するものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">各リスクドメインについて、主要なプロダクトとサービスのロードマップをドメイン別に提供します。なお、ここで取り上げているサービスはすべてを網羅したものではありません。ほとんどのサービスは、それぞれのドメインの目標完了日を達成する見込みです。ただし、エンジニアリング要件の進展やサードパーティの依存関係を考慮し、必要に応じて特定のプロダクトのスケジュールが調整される場合があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ドメイン 1: Store Now Decrypt Later（SNDL）の軽減</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このドメインは、将来の暗号解読に有効な量子コンピュータ（CRQC）が、現在キャプチャされたデータを復号できる可能性があるという、非対称暗号の脆弱性に対処することに重点を置いています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、お客様の一般的なジャーニーに基づき、段階的な進展を支援しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お客様の顧客のワークロードを保護する</strong><span style=\"vertical-align: baseline;\">: Google Cloud サービスと構成済みのロードバランサに量子コンフィデンシャル TLS 1.3 ハンドシェイクを提供し、ユーザー セッションを保護します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">管理者と開発者のフローを保護する</strong><span style=\"vertical-align: baseline;\">: クラウド環境の管理に使用される管理パスウェイを SNDL から保護します。これには、Cloud VPN や Interconnect などのサービスが含まれます。開発者向けには、クライアント ライブラリ、SDK、Google のオープンソース暗号ライブラリである </span><a href=\"https://developers.google.com/tink\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Tink</span></a><span style=\"vertical-align: baseline;\"> などが含まれます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データ パイプラインを保護する</strong><span style=\"vertical-align: baseline;\">: Google の分析プラットフォームとストレージ プラットフォームのデータ転送の機密性を確保します。PQC は、これらのシステムを流れる機密性の高い知的財産や顧客データが、現在キャプチャされ、将来的に量子コンピューティング能力を持つ攻撃者によって復号されるのを防ぐために不可欠です。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ロードマップ</strong><span style=\"vertical-align: baseline;\">以下の変更は 2027 年の実施を目標としています。</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ジャーニー</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">利点</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">代表的なサービス</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Store Now, Decrypt Later の軽減（2027 年末）</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">お客様の顧客のワークロードを保護する</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">耐量子 Ingress: </strong><span style=\"vertical-align: baseline;\">標準化されたポスト量子アルゴリズムを使用してクラウド境界を保護します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">アプリケーションとプロキシのロード バランシング</span><span style=\"vertical-align: baseline;\">[2026 年（</span><a href=\"https://docs.cloud.google.com/load-balancing/docs/post-quantum-tls?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">完了</span></a><span style=\"vertical-align: baseline;\">）]</span></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">管理者と開発者のフローを保護する</span></p>\n</td>\n<td rowspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">安全な運用</strong><span style=\"vertical-align: baseline;\">: 管理とデプロイのスタックが新たな暗号化規格を満たしていることを検証します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">量子コンフィデンシャル ALTS</span><span style=\"vertical-align: baseline;\">[2025 年（</span><a href=\"https://docs.cloud.google.com/docs/security/encryption-in-transit?hl=ja#application-layer\"><span style=\"text-decoration: underline; vertical-align: baseline;\">完了</span></a><span style=\"vertical-align: baseline;\">）]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">API エンドポイント</span><span style=\"vertical-align: baseline;\">[2026 年（</span><a href=\"https://cloud.google.com/blog/products/networking/whats-new-in-cloud-networking-at-next26\"><span style=\"text-decoration: underline; vertical-align: baseline;\">完了</span></a><span style=\"vertical-align: baseline;\">）]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Cloud VPN、Cloud Interconnect、GCE OS Login、Cloud SDK、gCloud CLI、GKE サービス メッシュ、クライアント ライブラリ</span><span style=\"vertical-align: baseline;\">[2026 年 / 2027 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">データ パイプラインを保護する</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">機密データの転送保護</strong><span style=\"vertical-align: baseline;\">: 量子攻撃者から、機密性の高い知的財産や顧客データを保護します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Cloud Storage SDK、Storage Transfer Service、BigQuery CLI、Data Transfer Service</span><span style=\"vertical-align: baseline;\">[2026 年 / 2027 年]</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">ドメイン 2: 完全性と否認防止</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このドメインでは、データの完全性と真正性を損なう可能性のある偽造から保護するために、デジタル署名と証明書の耐量子化に取り組みます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ソフトウェア サプライ チェーンの保護</strong><span style=\"vertical-align: baseline;\">: 量子耐性のある証明書が付与された、信頼できる改ざんされていないイメージのみが本番環境で実行されるようにすることで、量子攻撃者によるビルドの改ざんを防ぎます。これには、</span><a href=\"https://cloud.google.com/transform/how-google-does-it-using-binary-authorization-to-boost-supply-chain-security\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Binary Authorization</span></a><span style=\"vertical-align: baseline;\">、Cloud Build、Assured Open Source Software などのサービスが含まれます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">耐量子証明書の発行</strong><span style=\"vertical-align: baseline;\">: 内部および外部の認証局（CA）を含む公開鍵基盤（PKI）を移行して、</span><a href=\"https://csrc.nist.gov/pubs/fips/204/final\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ML-DSA</span></a><span style=\"vertical-align: baseline;\"> 証明書と、有用な場合は </span><a href=\"https://csrc.nist.gov/pubs/fips/205/final\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SLH-DSA</span></a><span style=\"vertical-align: baseline;\"> 証明書をサポートします。この移行は、現在策定中の </span><a href=\"https://www.ietf.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Internet Engineering Task Force</span></a><span style=\"vertical-align: baseline;\">（IETF）の標準化の取り組みに沿って行われます。Google はこうした取り組みに積極的に貢献しており、次のような大規模な実験もいくつか実施しています。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Web PKI 向けの Merkle Tree Certificates などの新たな手法を通じて、証明書チェーンの検証パフォーマンスに影響を及ぼす可能性がある PQC 署名サイズの増大に対処します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Certificate Authority Service（CAS）などのプライベート CA ソリューションで、ML-DSA / SLH-DSA（純粋な PQC）ベースの証明書をサポートします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">機密保持を目的として、</span><a href=\"https://docs.cloud.google.com/docs/security/encryption-in-transit#application-layer\"><span style=\"text-decoration: underline; vertical-align: baseline;\">すでに PQC をサポートしている内部トラフィック プロトコル ALTS</span></a><span style=\"vertical-align: baseline;\"> に加えて、量子認証を追加します。デジタル署名と公開鍵基盤に対する Google のアプローチについて、技術的な詳細を</span><a href=\"https://bughunters.google.com/blog/next-with-quantum-safe-certificates\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">でご確認いただけます。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ID とアクセスの保護</strong><span style=\"vertical-align: baseline;\">: サービス アカウント キーやトークン（JWT / OAuth）などの認証メカニズムが量子偽造に対する耐性を備えるようにします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ロードマップ</strong><span style=\"vertical-align: baseline;\">Google は、2028 年までに以下のマイルストーン達成を目標としています。また、特に証明書の分野で進行中の標準化の取り組みについても注視しています。Google は、耐量子証明書の標準に積極的に貢献しており、業界全体がこれらの期限に対応できるよう支援することに尽力しています。</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ドメイン / ジャーニー</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">メリット</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">代表的なサービス</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">完全性と否認防止（2028 年末）</strong></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア サプライ チェーンと署名サービスの保護</span></p>\n</td>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">耐量子ソフトウェア証明書</strong><span style=\"vertical-align: baseline;\">: 信頼できるイメージのみが本番環境で実行されるようにすることで、不正なビルドの改ざんを防止します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Binary Authorization、Access Approval（AXA）</span><span style=\"vertical-align: baseline;\">[2026 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Assured OSS</span><span style=\"vertical-align: baseline;\">[2027 年]</span></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"4\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">耐量子証明書の発行</span></p>\n</td>\n<td rowspan=\"4\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">標準化された耐量子トラスト</strong><span style=\"vertical-align: baseline;\">: 量子計算による証明書の偽造から、社内外の通信の真正性を保護します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">量子認証 ALTS</span><span style=\"vertical-align: baseline;\">[2026 年 / 2027 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Private CA（Certificate Authority Service）</span><span style=\"vertical-align: baseline;\">[2027 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Google Trust Service: Merkle Tree Certificates</span><span style=\"vertical-align: baseline;\">[2028 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud のプロダクトとインフラストラクチャ全体に PQC 証明書をロールアウト</span><span style=\"vertical-align: baseline;\">[2027 年 / 2028 年]</span></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">ID とアクセスの保護</span></p>\n</td>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">管理された ID: </strong><span style=\"vertical-align: baseline;\">監査可能な完全性を確保するため、NIST 標準の署名を使用して、攻撃者による認証情報の偽造リスクを排除します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Cloud IAM</span><span style=\"vertical-align: baseline;\">[2028 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">インフラストラクチャ全体への耐量子認証とアクセスのロールアウト</span><span style=\"vertical-align: baseline;\">[2027 年 / 2028 年]</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">ドメイン 3: 基盤と鍵管理</strong></h4>\n<p><a href=\"https://bughunters.google.com/blog/cryptographic-agility-and-key-rotation\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">暗号アジリティ</span></a><span style=\"vertical-align: baseline;\">は、PQC 移行の基盤です。Google は、この分野への継続的な投資により、鍵管理、ライブラリ、インフラストラクチャの変更に関するエンドツーエンドの戦略を推進しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">基盤となる鍵管理とライブラリ</strong><span style=\"vertical-align: baseline;\">: Cloud KMS と、BoringSSL や Tink などのライブラリを通じて、NIST 承認済みのアルゴリズムを有効にします。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">なお、Cloud KMS は、NIST 標準化 PQC アルゴリズム（ML-KEM、ML-DSA、SLH-DSA）の一般提供（GA）を開始しており、現在は耐量子鍵のインポートの有効化を進めています。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハードウェア ベースの暗号サービス</strong><span style=\"vertical-align: baseline;\">: 量子耐性ルート オブ トラストを使用した安全な物理基盤。これには、</span><a href=\"https://cloud.google.com/security/products/confidential-computing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing サービス</span></a><span style=\"vertical-align: baseline;\">の一部としての PQC や Cloud Hardware Security Module（HSM）が含まれます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">鍵の主権とパートナー ソリューション</strong><span style=\"vertical-align: baseline;\">: Google Workspace クライアントサイド暗号化（CSE）と External Key Manager（EKM）で PQC オーケストレーションを有効にします。パートナーと連携して、PQC オンプレミス鍵プロバイダをサポートします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ロードマップ</strong><span style=\"vertical-align: baseline;\">Google は、2028 年までに以下マイルストーン達成を目標としています。</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ドメイン / ジャーニー</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">メリット</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">代表的なサービス</strong></p>\n</td>\n</tr>\n<tr>\n<td colspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">基盤と鍵管理（2028 年末）</strong></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">基盤となる鍵管理とライブラリ</span></p>\n</td>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">標準化された耐量子鍵</strong><span style=\"vertical-align: baseline;\">: NIST 承認済みの構成要素を提供し、アプリケーションの移行を支援します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">KMS の ML-DSA と SLH-DSA、KMS の ML-KEM とハイブリッド</span><span style=\"vertical-align: baseline;\">[2025 年（</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/announcing-quantum-safe-key-encapsulation-mechanisms-in-cloud-kms?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">完了</span></a><span style=\"vertical-align: baseline;\">）]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">耐量子鍵のインポート（BYOK）</span><span style=\"vertical-align: baseline;\">[2026 年]</span></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ハードウェア ベースの暗号サービス</span></p>\n</td>\n<td rowspan=\"3\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">シリコンに根ざしたハードウェア</strong><span style=\"vertical-align: baseline;\">: 耐量子ハードウェアのルート オブ トラストをセキュリティのアンカーとします。</span></p>\n</td>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Confidential Compute（証明書と vTPM を含む）</span><span style=\"vertical-align: baseline;\">[2028 年]</span></p>\n</td>\n</tr>\n<tr></tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">耐量子 Cloud HSM（FIPS 140-3 L3）</span><span style=\"vertical-align: baseline;\">[2028 年]</span></p>\n</td>\n</tr>\n<tr>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">鍵の主権とパートナー ソリューション</span></p>\n</td>\n<td rowspan=\"2\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">暗号の来歴</strong><span style=\"vertical-align: baseline;\">: 必要な場所で鍵の制御と来歴を提供します。</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">外部鍵管理</span><span style=\"vertical-align: baseline;\">[2028 年]</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">パートナーのイネーブルメント（鍵プロバイダとソブリン ソリューション）</span><span style=\"vertical-align: baseline;\">[2028 年]</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\"> </span></p>\n<h4><strong style=\"vertical-align: baseline;\">量子安全における責任の共有</strong></h4>\n<p><span style=\"vertical-align: baseline;\">セキュリティは長年にわたり、</span><a href=\"https://cloud.google.com/blog/products/identity-security/how-were-helping-customers-prepare-for-a-quantum-safe-future\"><span style=\"text-decoration: underline; vertical-align: baseline;\">お客様との共同パートナーシップ</span></a><span style=\"vertical-align: baseline;\">として取り組んできました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Google の責任 - クラウドのセキュリティ</strong><span style=\"vertical-align: baseline;\">: Google は、ネットワーク、</span><a href=\"https://docs.cloud.google.com/docs/security/encryption-in-transit\"><span style=\"text-decoration: underline; vertical-align: baseline;\">転送中の暗号化</span></a><span style=\"vertical-align: baseline;\">、グローバル フロントエンド、</span><a href=\"https://docs.cloud.google.com/docs/security/encryption-in-transit/application-layer-transport-security\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ALTS プロトコル</span></a><span style=\"vertical-align: baseline;\">など、耐量子インフラストラクチャへの移行を管理します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この責任は、サーバーの PQC 移行をエンドツーエンドで網羅するものであり、基盤となるハードウェアとオペレーティング システムが量子の脅威から確実に保護されるようにします。Google は、</span><a href=\"https://www.chipsalliance.org/news/caliptra2-1/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Caliptra v2.1</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://trustedcomputinggroup.org/new-computing-specification-implements-pqc-measures-to-protect-users-from-quantum-attacks/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPM 2.0 v185</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://opensource.googleblog.com/2026/03/opentitan-shipping-in-production.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenTitan</span></a><span style=\"vertical-align: baseline;\"> などの耐量子オープンソースのシリコン基盤を通じて、ハードウェアの完全性を維持しています。後者は、初のオープンソース シリコン ルート オブ トラストであり、すでに</span><a href=\"https://opensource.googleblog.com/2025/02/fabrication-begins-for-production-opentitan-silicon.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">耐量子セキュアブート</span></a><span style=\"vertical-align: baseline;\">をサポートしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">2029 年の目標達成に向けて取り組む中、ハードウェアの PQC への移行は、可能な場合は積極的なリプレースと、自然な機器リプレース サイクルの両方を通じて行われます。段階的なアプローチにより安定性を確保していますが、一部の物理コンポーネントのタイムラインは 2029 年以降に延びる可能性があります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">お客様の責任 - クラウドにおけるセキュリティ</strong><span style=\"vertical-align: baseline;\">: 組織は、PQC ハンドシェイクをネゴシエートするためのクライアントサイド ソフトウェアの更新や、非対称鍵のライフサイクルの管理など、独自のアプリケーションを管理する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、Google Cloud サービス構成を耐量子設定とポリシーで更新する必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">共に進むこれからの道のり</strong></h4>\n<p><span style=\"vertical-align: baseline;\">量子への対応に向けた機運を高めるには、即座に実践的な行動を起こす必要があります。まずは、次の 3 つのステップから始めることをおすすめします。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インベントリ</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://docs.cloud.google.com/asset-inventory/docs/asset-inventory-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Asset Inventory</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"https://www.wiz.io/blog/wiz-for-pqc-readiness\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz の暗号化と PQC への対応状況</span></a><span style=\"vertical-align: baseline;\">などのソリューションを使用して、暗号リソース（鍵や証明書など）を特定します。組織全体で暗号リソースの使用状況を可視化すると、移行バックログをより正確に定義し、優先順位を付けることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">更新</strong><span style=\"vertical-align: baseline;\">: 開発チームとサイト信頼性エンジニアリング チームが、BoringSSL、Chrome、SDK など、</span><a href=\"https://developers.cloudflare.com/ssl/post-quantum-cryptography/pqc-support/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">PQC アルゴリズムをサポート</span></a><span style=\"vertical-align: baseline;\">するソフトウェアを使用していることを確認します。この更新により、エッジで耐量子接続が有効になった際、内部ワークフローがデフォルトでその接続をネゴシエートできるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">検証</strong><span style=\"vertical-align: baseline;\">: Google の耐量子 API とロードバランサを使用して、既存のアプリケーションの動作をテストします。今すぐワークフローを検証することで、主要な本番環境に影響が及ぶ前にアーキテクチャのボトルネックを見つけ出すことができます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、この移行の複雑なプロセスを引き受けることで、お客様がイノベーションに注力しながら、規制とコンプライアンスの要件を達成できるよう取り組んでいます。ポスト量子の環境でお客様が主導権を握れるよう、Google は取り組みの進捗状況を共有し始めたばかりです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の PQC アプローチについて詳しくは、</span><a href=\"https://cloud.google.com/security/resources/post-quantum-cryptography\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ポスト量子暗号（PQC）ハブ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">規制対象および Sovereign Cloud 担当 VP 兼 GM、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jai Haridas</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Cloud Foundations 担当バイス プレジデント兼ゼネラル マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Michael Bachman</strong></p></div>"
