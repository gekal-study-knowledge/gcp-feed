  "84cf34ea34c533ac48d5ed49c2635711":
    "id": "84cf34ea34c533ac48d5ed49c2635711"
    "title": "How Uber improves network reliability while unblocking cloud migration"
    "link": "https://cloud.google.com/blog/products/networking/uber-de-risks-hybrid-ai-with-cloud-interconnect/"
    "published": "2026-08-27 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Uber has a lot in common with the cities it serves. Both are always changing and growing, both must carefully manage the resulting traffic to prevent congestion and sprawl.</span></p>\n<p><span style=\"vertical-align: baseline;\">Uber has continuously evolved its technical strategies to manage its expanding network, and this careful planning and constant evolution helps ensure that application traffic across its entire platform runs smoothly. Ultimately, maintaining a reliable, high-scale platform that operates seamlessly at any given time is key to preserving user trust.</span></p>\n<p><span style=\"vertical-align: baseline;\">One important solution in this effort has been </span><a href=\"https://cloud.google.com/blog/products/networking/cross-cloud-network-enhancements-for-distributed-workloads/?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">application awareness on Cloud Interconnect</span></a><span style=\"vertical-align: baseline;\">. An industry-first tool for application prioritization across hybrid networks, application awareness on Cloud Interconnect has helped Uber prioritize critical traffic to ensure business continuity during potential network congestion events. </span></p>\n<p><span style=\"vertical-align: baseline;\">Uber acted as an early design partner for application awareness on Cloud Interconnect, helping ensure that this capability met the demands of Uber’s global-scale operations. It not only improved Uber’s daily operations, it also gave Uber the confidence to move forward with a Google Cloud migration, with confidence that there would be less risk of service interruptions during switchovers. </span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we’ll explain the features Uber most sought and why, the inner workings of application awareness on Cloud Interconnect, and how it can help other organizations as well.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Prioritizing critical traffic</span></h2>\n<p><span style=\"vertical-align: baseline;\">When migrating distributed, hybrid, or multicloud applications at a global scale, network reliability becomes a primary concern. Even the most worthwhile migrations may not seem worth it if such migrations interrupt ongoing service. For organizations like Uber, moving vast amounts of data to support large data analytics workload — including emerging AI use cases — can saturate network links, resulting in increased reliability risk for their critical application traffic. </span></p>\n<p><span style=\"vertical-align: baseline;\">With standard cloud interconnect approaches, enterprises typically apply simple bandwidth overprovisioning to meet extreme infrastructure needs. But with today's hybrid cloud demands, and given the size of an organization like Uber, overprovisioning network capacity for peak usage is often too costly and unreliable. </span></p>\n<p><span style=\"vertical-align: baseline;\">The shortcomings of overprovisioning only become magnified with the integration of cutting-edge AI innovations. Uber needs systems in place that can take on massive data transfers without congesting its network and protecting the performance of business-critical applications.</span></p>\n<p><span style=\"vertical-align: baseline;\">With the benefit of application awareness on Cloud Interconnect, including the four major features of application awareness — traffic handling, congestion response, latency management, and cost efficiency — Uber was able to achieve the networking optimization its modern tech stack requires.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"aai concept value prop with_without picture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/aai_concept_value_prop_with_without_pictur.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Starting with a private preview, Uber deployed this feature across its infrastructure, beginning with Google Cloud Interconnect deployments in Phoenix, Arizona, and Ashburn, Virginia. Application awareness on Cloud Interconnect allows Uber to classify and prioritize end-user application traffic over less time-sensitive data using DSCP marking and configured queuing profiles.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the following chart, we look at the four key features of application awareness on Cloud Interconnect, how they differ from legacy approaches, and how they help provide better operational continuity for organizations like Uber. <br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Feature</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Standard interconnect solutions</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Application awareness on Cloud Interconnect</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Traffic handling</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">All traffic treated equally (first-in, first-out)</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Traffic classified into six distinct traffic classes</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Congestion response</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">High-priority application traffic may be dropped during bursts</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Business-critical traffic is protected via strict priority or bandwidth sharing policies</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Latency management</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Unpredictable latency for high priority applications</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Predictable and consistent low-latency for time-sensitive workloads</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Cost efficiency</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Requires expensive overprovisioning to absorb peaks</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Efficient bandwidth utilization and lower TCO</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h2><span style=\"vertical-align: baseline;\">Uber's key takeaways</span></h2>\n<p><span style=\"vertical-align: baseline;\">For Uber, the business value of being able to prioritize business-critical traffic on its networks by deploying application awareness on Cloud Interconnect was immediate. And in doing so, Uber has also created a blueprint that other enterprises with similar hybrid cloud challenges can replicate. The core elements of that blueprint include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ensuring business continuity</strong><span style=\"vertical-align: baseline;\">: Uber can decide in real time which application traffic to prioritize during major, high-traffic events. This means that mission critical applications stay up and running during even extreme events (both planned and unplanned). Uber leadership has called application awareness on Cloud Interconnect important for its global operations. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Efficient bandwidth utilization</strong><span style=\"vertical-align: baseline;\">: Instead of blindly overprovisioning bandwidth to prevent congestion, application awareness allows Uber to better utilize their existing Cloud Interconnect capacity aligned with their expected network bandwidth needs. The result is lower total cost of ownership for network infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unblocked workload migration</strong><span style=\"vertical-align: baseline;\">: By protecting critical applications from network congestion, Uber was able to migrate significant workloads to Google Cloud and, in the process, dramatically reduce operational overhead.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">\"Application awareness on Cloud Interconnect was the key that unlocked our ability to migrate more strategic workloads to Google Cloud and is critical for maintaining service reliability during peak global demand. By allowing us to intelligently prioritize traffic, it helps us ensure that we can protect our higher priority services and make our infrastructure more efficient, lowering our total cost of ownership. This wasn't just a feature deployment; it was a deep engineering partnership that delivered a solution critical to our business.\" </span><span style=\"font-style: italic; vertical-align: baseline;\">– </span><strong style=\"font-style: italic; vertical-align: baseline;\">Harry Liu</strong><span style=\"font-style: italic; vertical-align: baseline;\">, Director of Engineering, Uber</span></p>\n<h2><span style=\"vertical-align: baseline;\">Securing network reliability for AI and beyond</span></h2>\n<p><span style=\"vertical-align: baseline;\">As more enterprises integrate cloud-based AI models, distributed applications, and data analytics, it's becoming a business imperative to be ready to handle the massive data transfers that follow. But in doing so, they also have to ensure they never compromise the reliability of their critical applications. </span></p>\n<p><span style=\"vertical-align: baseline;\">With application awareness on Cloud Interconnect, Uber demonstrated that moving beyond simple bandwidth overprovisioning to protect business-critical traffic was an essential step to building the stability required to embrace modern hybrid and multicloud strategies.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">You can read our blog about </span><a href=\"https://cloud.google.com/blog/products/networking/cross-cloud-network-enhancements-for-distributed-workloads/\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">the potential of Cloud Interconnect across industries</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> to learn more about what the service can bring to your organization, and if you’re ready to explore more, our team of networking and industry </span><a href=\"https://cloud.google.com/contact/form?e=48754805\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">experts are ready to help</span></a><span style=\"font-style: italic; vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-related_article_tout\">\n\n\n\n\n\n<div class=\"uni-related-article-tout h-c-page\">\n  <section class=\"h-c-grid\">\n    <a class=\"uni-related-article-tout__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n        h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3 uni-click-tracker\" href=\"https://cloud.google.com/blog/topics/telecommunications/vodafone-gen-ai-enhances-network-lifecycle/\">\n      <div class=\"uni-related-article-tout__inner-wrapper\">\n        <p class=\"uni-related-article-tout__eyebrow h-c-eyebrow\">Related Article</p>\n\n        <div class=\"uni-related-article-tout__content-wrapper\">\n          <div class=\"uni-related-article-tout__image-wrapper\">\n            <div class=\"uni-related-article-tout__image\"></div>\n          </div>\n          <div class=\"uni-related-article-tout__content\">\n            <h4 class=\"uni-related-article-tout__header h-has-bottom-margin\">How Vodafone is using gen AI to enhance network life cycle</h4>\n            <p class=\"uni-related-article-tout__body\">Vodafone and Google Cloud deployed generative AI to unlock new levels of efficiency, creativity, and customer satisfaction through networ...</p>\n            <div class=\"cta module-cta h-c-copy  uni-related-article-tout__cta muted\">\n              <span class=\"nowrap\">Read Article\n                <svg class=\"icon h-c-icon\" xmlns=\"http://www.w3.org/2000/svg\">\n                  <use xlink:href=\"#mi-arrow-forward\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n                </svg>\n              </span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </a>\n  </section>\n</div>\n\n</div>"
  "4c79efe3b42fb51112c5867740b29119":
    "id": "4c79efe3b42fb51112c5867740b29119"
    "title": "Simplify your resilience testing strategy with Fault Injection Testing"
    "link": "https://cloud.google.com/blog/products/networking/introducing-google-cloud-fault-injection-testing-in-preview/"
    "published": "2026-08-27 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When databases fail and network paths falter, you still need your mission-critical cloud services to stay online. Yet guaranteeing high availability has become increasingly difficult because of the complexity of modern distributed systems. </span></p>\n<p><span style=\"vertical-align: baseline;\">To help you maintain availability and reliability during adverse events, we’re announcing Fault Injection Testing in preview. Fault Injection Testing is designed to help developers and architects automate failure testing to ensure predictable behavior during disruptions. </span></p>\n<p><span style=\"vertical-align: baseline;\">By deliberately introducing faults into your environment, you can verify your safety mechanisms </span><span style=\"font-style: italic; vertical-align: baseline;\">before</span><span style=\"vertical-align: baseline;\"> an actual outage impacts your customers.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why native resilience testing matters</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Unlike in self-hosted data centers, cloud applications offer less direct access to underlying infrastructure to facilitate failover testing.</span></p>\n<p><span style=\"vertical-align: baseline;\">Without native tools to prove your application can survive a failure, you risk a critical gap in your reliability strategy that exposes you to several risks:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Damaged trust and reputation</strong><span style=\"vertical-align: baseline;\">: Frequent failures or poor performance lead to customer dissatisfaction and long-term damage to your brand's image.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Compliance and regulatory penalties</strong><span style=\"vertical-align: baseline;\">: For many industries, particularly financial institutions, failing to prove disaster recovery capabilities can lead to non-compliance, audits, and fines.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Migration delays</strong><span style=\"vertical-align: baseline;\">: Large-scale migrations often stop when teams cannot verify that critical applications will remain stable during a zone failure.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">How Fault Injection Testing works</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Fault Injection Testing allows you to run experiments by creating experiment templates. These templates act as blueprints, defining the specific fault to be injected and the resources that will be targeted for the experiment.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this public preview, you can test two primary failure scenarios:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Failover Cloud SQL</strong><span style=\"vertical-align: baseline;\">: This fault triggers a failover of a high availability Cloud SQL instance from the primary zone to a standby zone.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Degrade application traffic</strong><span style=\"vertical-align: baseline;\">: This allows you to selectively add latency and HTTP error codes through a Layer 7 load balancer.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Before any fault is injected, Fault Injection Testing performs an automated dry run. This read-only simulation checks your permissions and provides an up-to-date list of every resource that will be affected. </span></p>\n<p><span style=\"vertical-align: baseline;\">Once you verify the scope, you can manually start the injection. The duration you defined in the template will run its course, and the faults will be reverted at the expiration of the timer.  </span></p>\n<p><span style=\"vertical-align: baseline;\">During the experiment, you can verify that your application is behaving as you planned.  If things do not go as planned, you can use the stop and revert capability to immediately halt the experiment and begin restoring resources to their normal state.</span></p>\n<p><span style=\"vertical-align: baseline;\">During preview, we recommend as a best practice to use FIT in a non-production environment. Preview is an opportunity to get early access to learn how the service fits and complements your existing testing practices, and to provide us with your feedback to improve the product as well!</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Built for the enterprise</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Partners like KeyBank and Servier are already using Fault Injection Testing to validate their deployments. By using native fault injection, these organizations can approximate demanding failure scenarios — such as zonal outages — to help ensure their services remain stable.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started with Fault Injection Testing</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Fault Injection Testing is available through the Google Cloud console, the gcloud CLI, and REST APIs.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Request preview access</strong><span style=\"vertical-align: baseline;\">:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Talk to your Google Cloud Account Team to add your project to the preview.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable the API</strong><span style=\"vertical-align: baseline;\">: Search for \"Fault Testing API\" in your Google Cloud console and select enable.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Assign roles</strong><span style=\"vertical-align: baseline;\">: Ensure your team has the </span><span style=\"vertical-align: baseline;\">roles/faulttesting.operator</span><span style=\"vertical-align: baseline;\"> role to configure and run experiments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Run your first dry run</strong><span style=\"vertical-align: baseline;\">: Create a template for a Cloud SQL or load balancer resource in a non-production environment and execute a dry run to see the potential impact.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">For more details on implementation, talk to your account team, or view the </span><a href=\"https://docs.cloud.google.com/fault-injection-testing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">User Guide for Fault Injection Testing</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "2bd9ac6a86b1ce2f9fc4ddd5d80f398a":
    "id": "2bd9ac6a86b1ce2f9fc4ddd5d80f398a"
    "title": "Using OKF with Knowledge Catalog to serve context for agents"
    "link": "https://cloud.google.com/blog/products/data-analytics/scale-okf-bundles-across-an-organization-with-knowledge-catalog/"
    "published": "2026-08-27 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We continue to iterate on the </span><a href=\"https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Knowledge Format</span></a><span style=\"vertical-align: baseline;\"> (OKF), an open specification that formalizes the </span><a href=\"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLM-wiki pattern</span></a><span style=\"vertical-align: baseline;\"> into a portable, interoperable format. But a big question remains: How can you share and govern access to an OKF bundle across an organization?</span></p>\n<p><span style=\"vertical-align: baseline;\">OKF v0.1 established a portable format for the context agents need: markdown files with YAML frontmatter, one required field, and five conventions. Then, </span><a href=\"https://cloud.google.com/blog/products/data-analytics/okf-v0-2-adds-trust-signals\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OKF v0.2</span></a><span style=\"vertical-align: baseline;\"> added the trust signals (provenance, verification, freshness, attestation) that a machine-authored bundle requires to be relied on, allowing a team to publish a trustworthy bundle for its own agents. </span></p>\n<p><span style=\"vertical-align: baseline;\">However, what OKF does not answer is how teams share their bundles across an organization. A git repo per bundle is portable, but it is not searchable alongside the data it describes, it cannot be secured and governed using the same organizational identity and compliance policies, and it does not sit next to the technical metadata (schemas, lineage, ownership) that data teams already work in. Every downstream agent must know where each bundle resides, and that does not scale beyond a small number of bundles.</span></p>\n<p><span style=\"vertical-align: baseline;\">To scale an OKF bundle across an organization, you can use </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\">, Google Cloud's context engine for agents. By mapping the bundle onto </span><a href=\"https://docs.cloud.google.com/dataplex/docs/catalog-overview#terminology\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog's existing types</span></a><span style=\"vertical-align: baseline;\">, every concept becomes discoverable, governed, and reachable by any agent already reading from the catalog.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Knowledge Catalog is the context engine for agents</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Every agent that queries Knowledge Catalog reads from one governed index over what the organization already has in BigQuery, Cloud Storage, operational databases, and applications. Each entry carries schema, lineage, ownership, and tags, and can be extended with typed aspects that add domain-specific fields. The same catalog exposes search and cross-project lookup to retrieve optimized context for each agentic query. The context retrieval is secure and governed by IAM controls, so agents can only see the entries they have access to based on IAM identity. </span></p>\n<p><span style=\"vertical-align: baseline;\">Publishing an OKF bundle into Knowledge Catalog takes a one-time setup and a single push. Both use the OKF </span><a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/toolbox/mdcode/demo/okf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sample code</span></a><span style=\"vertical-align: baseline;\"> in the Knowledge Catalog repository, whose wrappers call </span><code style=\"vertical-align: baseline;\">gcloud dataplex</code><span style=\"vertical-align: baseline;\"> for setup and delegate push to </span><code style=\"vertical-align: baseline;\">kcmd</code><span style=\"vertical-align: baseline;\"> (the Metadata-as-Code CLI in the same repository).</span></p>\n<p><span style=\"vertical-align: baseline;\">The setup registers three Knowledge Catalog resources: an EntryGroup to hold the bundle, an EntryType named </span><code style=\"vertical-align: baseline;\">okf-bundle</code><span style=\"vertical-align: baseline;\"> for its concepts, and an AspectType named </span><code style=\"vertical-align: baseline;\">okf</code><span style=\"vertical-align: baseline;\"> that carries the OKF signal fields (from the </span><code style=\"vertical-align: baseline;\">okf-aspect.json</code><span style=\"vertical-align: baseline;\"> schema in the </span><a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/toolbox/mdcode/demo/okf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sample code</span></a><span style=\"vertical-align: baseline;\">). The push then creates one </span><code style=\"vertical-align: baseline;\">okf-bundle</code><span style=\"vertical-align: baseline;\"> Entry per concept, each with two Aspects: an </span><code style=\"vertical-align: baseline;\">overview</code><span style=\"vertical-align: baseline;\"> Aspect for the markdown body, and an </span><code style=\"vertical-align: baseline;\">okf</code><span style=\"vertical-align: baseline;\"> Aspect for the structured signals. Display name, description, and tags live on the Entry itself. The bundle's </span><code style=\"vertical-align: baseline;\">index.md</code><span style=\"vertical-align: baseline;\"> navigation files and its root </span><code style=\"vertical-align: baseline;\">log.md</code><span style=\"vertical-align: baseline;\"> are also published as Entries: index files carry only the </span><code style=\"vertical-align: baseline;\">overview</code><span style=\"vertical-align: baseline;\"> Aspect (no OKF frontmatter), and </span><code style=\"vertical-align: baseline;\">log.md</code><span style=\"vertical-align: baseline;\"> carries both Aspects with </span><code style=\"vertical-align: baseline;\">okf_type: Log</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Everything Knowledge Catalog already does for technical metadata (search, IAM, lineage, cross-project discovery) applies equally to OKF bundles, alongside the data they describe.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The </strong><strong style=\"vertical-align: baseline;\">okf</strong><strong style=\"vertical-align: baseline;\"> AspectType</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/toolbox/mdcode/demo/okf/okf-aspect.json\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">okf-aspect.json</code></a><span style=\"vertical-align: baseline;\"> schema in the sample code defines the AspectType. It carries 13 fields covering the full </span><a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OKF v0.2 spec</span></a><span style=\"vertical-align: baseline;\">:<br /><br /></span></p>\n<div align=\"center\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">#</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Field</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Type</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Purpose</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">1</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">okf_type</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">string</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">The OKF document type (freeform, e.g. </span><code style=\"vertical-align: baseline;\">BigQuery Table</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">Metric</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">Attested Computation</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">generated</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">record </span><code style=\"vertical-align: baseline;\">{by, at}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Actor and timestamp for the last meaningful change.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">3</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">sources</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">array of </span><code style=\"vertical-align: baseline;\">{id, resource, title, author, usage_count, last_modified}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Materials the concept derives from, with credibility signals.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">verified</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">array of </span><code style=\"vertical-align: baseline;\">{by, at}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Verification events. A </span><code style=\"vertical-align: baseline;\">human:</code><span style=\"vertical-align: baseline;\"> actor marks the highest trust tier.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">5</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">status</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">string</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Lifecycle state: </span><code style=\"vertical-align: baseline;\">draft</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">stable</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">deprecated</code><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">6</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">stale_after</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">datetime</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Absolute point in time (RFC3339 with an explicit offset) on or after which the content is stale.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">7</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">usage_window</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">record </span><code style=\"vertical-align: baseline;\">{from, to}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Period the source usage counts were measured over.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">8</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">runtime</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">string</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">How an Attested Computation runs (e.g., </span><code style=\"vertical-align: baseline;\">bigquery</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">9</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">parameters</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">array of </span><code style=\"vertical-align: baseline;\">{name, type, required}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Typed named holes a caller may fill. The only surface a caller may vary.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">10</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">computation</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">string</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Path to a file holding the computation body.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">11</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">executor</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">record </span><code style=\"vertical-align: baseline;\">{resource, receipt[]}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">How the computation runs and what evidence it must return.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">12</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">attester</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">record </span><code style=\"vertical-align: baseline;\">{resource}</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Deterministic code that takes a receipt and returns a verdict.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">13</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">extra</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">string</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Producer-defined frontmatter the template does not model, as JSON </span><code style=\"vertical-align: baseline;\">[path, value]</code><span style=\"vertical-align: baseline;\"> pairs. Keeps the round-trip lossless.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\">Every field is annotated with a display name, a description, and a mandatory index. Any top-level scalar field in the </span><code style=\"vertical-align: baseline;\">okf</code><span style=\"vertical-align: baseline;\"> Aspect (</span><code style=\"vertical-align: baseline;\">okf_type</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">status</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">stale_after</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">runtime</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">computation</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">extra</code><span style=\"vertical-align: baseline;\">) can drive Knowledge Catalog search predicates directly, so </span><code style=\"vertical-align: baseline;\">aspect:acme-analytics.us-central1.okf.okf_type=Metric</code><span style=\"vertical-align: baseline;\"> returns every OKF Metric in scope. Scalar subfields of record fields (</span><code style=\"vertical-align: baseline;\">generated.by</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">usage_window.from</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">executor.resource</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">attester.resource</code><span style=\"vertical-align: baseline;\">) also drive predicates. The array fields (</span><code style=\"vertical-align: baseline;\">sources</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">verified</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">parameters</code><span style=\"vertical-align: baseline;\">) are not server-side searchable on their subfields; agents narrow on them client-side after </span><code style=\"vertical-align: baseline;\">entries.get</code><span style=\"vertical-align: baseline;\"> with </span><code style=\"vertical-align: baseline;\">view=ALL</code><span style=\"vertical-align: baseline;\">. One caveat for search predicates on </span><code style=\"vertical-align: baseline;\">datetime</code><span style=\"vertical-align: baseline;\">-typed fields (</span><code style=\"vertical-align: baseline;\">stale_after</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">generated.at</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">usage_window.from</code><span style=\"vertical-align: baseline;\">/</span><code style=\"vertical-align: baseline;\">.to</code><span style=\"vertical-align: baseline;\">), use a bare date (</span><code style=\"vertical-align: baseline;\">stale_after=2026-12-31</code><span style=\"vertical-align: baseline;\">) or a range comparison (</span><code style=\"vertical-align: baseline;\">stale_after&gt;2026-01-01</code><span style=\"vertical-align: baseline;\">), not the full RFC3339 timestamp.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Pushing a bundle</strong></h3>\n<p><code style=\"vertical-align: baseline;\">kcmd push</code><span style=\"vertical-align: baseline;\"> reads an OKF bundle from git and writes each concept as an Entry in the target Knowledge Catalog EntryGroup. </span><code style=\"vertical-align: baseline;\">index.md</code><span style=\"vertical-align: baseline;\"> files become Entries too, and each concept is parented to the index above it, so the bundle's directory structure survives as a browsable hierarchy.</span></p>\n<p><code style=\"vertical-align: baseline;\">kcmd</code><span style=\"vertical-align: baseline;\"> expects a bundle in the Documents Layout: markdown files under a </span><code style=\"vertical-align: baseline;\">catalog/</code><span style=\"vertical-align: baseline;\"> subdirectory, and a </span><code style=\"vertical-align: baseline;\">catalog.yaml</code><span style=\"vertical-align: baseline;\"> at the bundle root that lists the snapshot's entry and aspect types. The </span><a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/toolbox/mdcode/demo/okf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sample code</span></a><span style=\"vertical-align: baseline;\">'s </span><code style=\"vertical-align: baseline;\">setup.ts</code><span style=\"vertical-align: baseline;\"> generates </span><code style=\"vertical-align: baseline;\">catalog.yaml</code><span style=\"vertical-align: baseline;\"> from its </span><code style=\"vertical-align: baseline;\">--entry-group</code><span style=\"vertical-align: baseline;\"> flag (default </span><code style=\"vertical-align: baseline;\">okf_demo</code><span style=\"vertical-align: baseline;\">), so a reader wiring the sample to a new bundle passes the flag rather than editing </span><code style=\"vertical-align: baseline;\">catalog.yaml</code><span style=\"vertical-align: baseline;\"> by hand.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here is an end-to-end workflow for the </span><a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/tree/main/bundles/acme_retail\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Acme Retail bundle</span></a><span style=\"vertical-align: baseline;\"> that we introduced in the </span><a href=\"https://cloud.google.com/blog/products/data-analytics/okf-v0-2-adds-trust-signals?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OKF v0.2 blog</span></a><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# One-time setup (if required): install bun, clone the repo, build kcmd, configure gcloud\\r\\ncurl -fsSL https://bun.sh/install | bash\\r\\nexport BUN_INSTALL=&quot;$HOME/.bun&quot; &amp;&amp; export PATH=&quot;$BUN_INSTALL/bin:$PATH&quot;\\r\\ngit clone https://github.com/GoogleCloudPlatform/knowledge-catalog\\r\\ncd knowledge-catalog/toolbox/mdcode &amp;&amp; npm install &amp;&amp; npm run build\\r\\n\\r\\n# Authenticate, set project and enable dataplex apis\\r\\ngcloud auth login\\r\\ngcloud config set project &lt;your-project&gt;\\r\\ngcloud config set compute/region &lt;your-location&gt;\\r\\ngcloud services enable dataplex.googleapis.com\\r\\ngcloud auth application-default login\\r\\n\\r\\n# Push the Acme Retail bundle\\r\\ncd demo/okf\\r\\nbun run setup.ts   # creates the EG (default \\&#x27;okf_demo\\&#x27;)\\r\\nbun run push.ts    # pushes okf/bundles/acme_retail into the EG setup created&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f590bb508d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To pick a different EntryGroup name or push a different bundle, pass </span><code style=\"vertical-align: baseline;\">--entry-group your-name</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">setup.ts</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">--bundle path/to/your/bundle</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">push.ts</code><span style=\"vertical-align: baseline;\">. For example: </span><code style=\"vertical-align: baseline;\">bun run setup.ts --entry-group acme-bundle</code><span style=\"vertical-align: baseline;\"> followed by </span><code style=\"vertical-align: baseline;\">bun run push.ts</code><span style=\"vertical-align: baseline;\">. This regenerates the manifest, so subsequent </span><code style=\"vertical-align: baseline;\">push</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">pull</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">cleanup</code><span style=\"vertical-align: baseline;\"> all target the new EG; delete earlier EGs manually with </span><code style=\"vertical-align: baseline;\">gcloud dataplex entry-groups delete &lt;name&gt; --project &lt;your-project&gt; --location &lt;your-location&gt;</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/tree/main/bundles/acme_retail\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Acme Retail bundle</span></a><span style=\"vertical-align: baseline;\"> is a synthetic OKF bundle for a US retailer's BigQuery estate. It contains nine leaf concepts across six directories (</span><code style=\"vertical-align: baseline;\">attesters</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">tables</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">metrics</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">computations</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">policies</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">skills</code><span style=\"vertical-align: baseline;\">), each with its own </span><code style=\"vertical-align: baseline;\">index.md</code><span style=\"vertical-align: baseline;\">, plus a bundle root with its own </span><code style=\"vertical-align: baseline;\">index.md</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">log.md</code><span style=\"vertical-align: baseline;\">. That's 17 pushed Entries in total; Dataplex auto-creates one </span><code style=\"vertical-align: baseline;\">&lt;eg&gt;_entry</code><span style=\"vertical-align: baseline;\"> alongside, so </span><code style=\"vertical-align: baseline;\">gcloud dataplex entries list</code><span style=\"vertical-align: baseline;\"> returns 18 rows.</span></p>\n<p><span style=\"vertical-align: baseline;\">After the push completes:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Every concept markdown file is a Knowledge Catalog Entry, discoverable by search across the whole project or organization, depending on IAM configuration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">revenue-ytd</code><span style=\"vertical-align: baseline;\"> Attested Computation appears in the console with its sanctioned SQL, its executor, its attester, its verification history, and the full concept body.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">An analyst searching Knowledge Catalog for \"revenue\" finds Acme Retail's business definition alongside the BigQuery table it computes from, both under one permission model.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A downstream agent that already calls LookupContext for BigQuery table Entries retrieves the bundle's context by adding the OKF entry names to its </span><code style=\"vertical-align: baseline;\">resources</code><span style=\"vertical-align: baseline;\"> list.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Further, </span><code style=\"vertical-align: baseline;\">metrics/revenue.md</code><span style=\"vertical-align: baseline;\"> becomes an Entry with two Aspects. The full </span><code style=\"vertical-align: baseline;\">entries.get</code><span style=\"vertical-align: baseline;\"> response (with </span><code style=\"vertical-align: baseline;\">view=ALL</code><span style=\"vertical-align: baseline;\">) looks like:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;{\\r\\n  &quot;name&quot;: &quot;projects/acme-analytics/locations/us-central1/entryGroups/acme-retail/entries/metrics/revenue&quot;,\\r\\n  &quot;entryType&quot;: &quot;projects/acme-analytics/locations/us-central1/entryTypes/okf-bundle&quot;,\\r\\n  &quot;createTime&quot;: &quot;2026-08-15T00:48:39.123456Z&quot;,\\r\\n  &quot;updateTime&quot;: &quot;2026-08-15T00:48:57.234567Z&quot;,\\r\\n  &quot;parentEntry&quot;: &quot;projects/acme-analytics/locations/us-central1/entryGroups/acme-retail/entries/metrics/index&quot;,\\r\\n  &quot;entrySource&quot;: {\\r\\n    &quot;displayName&quot;: &quot;Revenue&quot;,\\r\\n    &quot;description&quot;: &quot;Recognized revenue for a period, per Acme\\&#x27;s FY2026 revenue-recognition policy. Backed by an Attested Computation.&quot;,\\r\\n    &quot;labels&quot;: {\\r\\n      &quot;finance&quot;: &quot;true&quot;,\\r\\n      &quot;revenue&quot;: &quot;true&quot;,\\r\\n      &quot;headline-metric&quot;: &quot;true&quot;\\r\\n    },\\r\\n    &quot;location&quot;: &quot;us-central1&quot;\\r\\n  },\\r\\n  &quot;aspects&quot;: {\\r\\n    &quot;dataplex-types.global.overview&quot;: {\\r\\n      &quot;aspectType&quot;: &quot;projects/dataplex-types/locations/global/aspectTypes/overview&quot;,\\r\\n      &quot;createTime&quot;: &quot;2026-08-15T00:48:57.111111Z&quot;,\\r\\n      &quot;updateTime&quot;: &quot;2026-08-15T00:48:57.111111Z&quot;,\\r\\n      &quot;aspectSource&quot;: {},\\r\\n      &quot;data&quot;: {\\r\\n        &quot;content&quot;: &quot;# Definition\\\\n\\\\nRevenue for a fiscal year is the sum of `net_amount` over orders that (a) reached `order_status = \\&#x27;delivered\\&#x27;`, (b) completed the 30-day return window, and (c) fall in the fiscal year by `order_ts`. Multi-currency orders are converted to USD at the `order_ts` daily reference rate. [^revenue-policy]\\\\n\\\\nThe sanctioned computation is [`computations/revenue-ytd.md`](../computations/revenue-ytd.md). Consumers MUST run and attest that computation rather than composing their own SUM. The attester rejects any receipt whose executed SQL does not match the sanctioned form.\\\\n\\\\n# Reporting cuts\\\\n\\\\n- **By fiscal year:** the sanctioned computation takes `year` as its sole parameter.\\\\n- **By channel or category:** these are approved narrations, not new metrics. Join the receipt\\&#x27;s row-level result to `orders.channel` or to `order_lines` × `products.category` client-side. Do NOT rewrite the sanctioned SQL.\\\\n\\\\n# Trust and freshness\\\\n\\\\n- **Verified:** VP Finance sign-off on 2026-07-01, against the FY2026 policy.\\\\n- **Stale after 2026-12-31:** Finance re-issues the revenue recognition policy each January. Consumers of this concept after 2027-01-01 MUST re-verify the definition against the new policy before serving.\\\\n\\\\n[^revenue-policy]: Revenue Recognition Policy (FY2026)&quot;,\\r\\n        &quot;contentType&quot;: &quot;MARKDOWN&quot;\\r\\n      }\\r\\n    },\\r\\n    &quot;acme-analytics.us-central1.okf&quot;: {\\r\\n      &quot;aspectType&quot;: &quot;projects/acme-analytics/locations/us-central1/aspectTypes/okf&quot;,\\r\\n      &quot;createTime&quot;: &quot;2026-08-15T00:48:57.222222Z&quot;,\\r\\n      &quot;updateTime&quot;: &quot;2026-08-15T00:48:57.222222Z&quot;,\\r\\n      &quot;aspectSource&quot;: {},\\r\\n      &quot;data&quot;: {\\r\\n        &quot;okf_type&quot;: &quot;Metric&quot;,\\r\\n        &quot;generated&quot;: { &quot;by&quot;: &quot;reference_agent/gemini-2.5-pro&quot;, &quot;at&quot;: &quot;2026-06-30T14:00:00Z&quot; },\\r\\n        &quot;verified&quot;: [ { &quot;by&quot;: &quot;human:jsmith@acme&quot;, &quot;at&quot;: &quot;2026-07-01T09:00:00Z&quot; } ],\\r\\n        &quot;status&quot;: &quot;stable&quot;,\\r\\n        &quot;stale_after&quot;: &quot;2026-12-31T00:00:00Z&quot;,\\r\\n        &quot;sources&quot;: [\\r\\n          {\\r\\n            &quot;id&quot;: &quot;revenue-policy&quot;,\\r\\n            &quot;resource&quot;: &quot;policies/revenue-recognition.md&quot;,\\r\\n            &quot;title&quot;: &quot;Revenue Recognition Policy (FY2026)&quot;,\\r\\n            &quot;author&quot;: &quot;human:jsmith@acme&quot;,\\r\\n            &quot;last_modified&quot;: &quot;2026-06-15T00:00:00Z&quot;\\r\\n          }\\r\\n        ]\\r\\n      }\\r\\n    }\\r\\n  }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f590bbb7990&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">overview</code><span style=\"vertical-align: baseline;\"> Aspect holds the full body of </span><code style=\"vertical-align: baseline;\">revenue.md</code><span style=\"vertical-align: baseline;\">. The </span><code style=\"vertical-align: baseline;\">okf</code><span style=\"vertical-align: baseline;\"> Aspect carries the structured signal fields, so agents get provenance, source, and OKF type in a form they can filter on directly instead of parsing markdown. Server-side searchEntries filters on the top-level scalar fields and on the scalar subfields of record fields; agents narrow further on the array-element subfields client-side after entries.get. (Aspects and EntryTypes are keyed by project number in real API responses and search predicates; the </span><code style=\"vertical-align: baseline;\">acme-analytics</code><span style=\"vertical-align: baseline;\"> project ID is shown throughout for readability.)</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What pushing your OKF to Knowledge Catalog enables</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Once the bundle is in Knowledge Catalog, it provides two capabilities to any agent that reads from the catalog:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Discoverability across the organization.</strong><span style=\"vertical-align: baseline;\"> Agents find bundle concepts through the same searchEntries and LookupContext APIs they already use for cataloged data, so an OKF bundle appears alongside BigQuery tables and other resources in every query it matches.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Governance.</strong><span style=\"vertical-align: baseline;\"> Bundle Entries inherit IAM from the EntryGroup, so a single agent call returns exactly what the caller is permitted to read, with no parallel permission model to maintain.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Discoverability across the organization<br /></strong><span style=\"vertical-align: baseline;\">OKF bundle Entries appear in searchEntries results alongside BigQuery tables and other cataloged resources, so an agent already querying the catalog picks up new bundles automatically. To retrieve a concept's body, trust signals, or linked concepts from a match, the agent moves to LookupContext and </span><code style=\"vertical-align: baseline;\">entries.get</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">A LookupContext call looks like this:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;POST https://dataplex.googleapis.com/v1/projects/acme-analytics/locations/us-central1:lookupContext\\r\\n{\\r\\n  &quot;resources&quot;: [\\r\\n    &quot;projects/acme-analytics/locations/us-central1/entryGroups/acme-retail/entries/metrics/revenue&quot;\\r\\n  ],\\r\\n  &quot;options&quot;: { &quot;format&quot;: &quot;yaml&quot;, &quot;context_budget&quot;: &quot;8000&quot; }\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f590bbb7dd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The response is a single </span><code style=\"vertical-align: baseline;\">context</code><span style=\"vertical-align: baseline;\"> field containing a pre-formatted YAML block. The block carries the entry's </span><code style=\"vertical-align: baseline;\">catalogEntry</code><span style=\"vertical-align: baseline;\">, its type, its description, its tags as labels, and its </span><code style=\"vertical-align: baseline;\">overview</code><span style=\"vertical-align: baseline;\">: the full markdown body of the concept, including its trust and freshness section. LookupContext does not render custom Aspects, so an agent that needs the structured OKF signal fields (</span><code style=\"vertical-align: baseline;\">okf_type</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">generated</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">sources</code><span style=\"vertical-align: baseline;\">, and the other ten) reads them with </span><code style=\"vertical-align: baseline;\">entries.get</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">view=ALL</code><span style=\"vertical-align: baseline;\"> alongside the LookupContext call.</span></p>\n<p><span style=\"vertical-align: baseline;\">There is no repository clone, no manual Aspect merging, and no re-parse of frontmatter. The agent uses the same API call any Knowledge Catalog client already makes.</span></p>\n<p><span style=\"vertical-align: baseline;\">An agent traversing an OKF bundle typically follows a three-step flow. An agent that already knows the specific Entry names it needs skips step 1. An agent that already knows the target EntryGroup and wants to enumerate the bundle exhaustively substitutes </span><code style=\"vertical-align: baseline;\">entryGroups.entries.list</code><span style=\"vertical-align: baseline;\"> for step 1.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">searchEntries returns candidate Entry names and descriptions. Its </span><code style=\"vertical-align: baseline;\">scope</code><span style=\"vertical-align: baseline;\"> accepts a project or organization; narrowing within that scope happens through query terms, including aspect predicates like </span><code style=\"vertical-align: baseline;\">aspect:acme-analytics.us-central1.okf.okf_type=Metric</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">LookupContext on the top few Entry names (up to ten per call) returns the full concept body as pre-formatted YAML; </span><code style=\"vertical-align: baseline;\">context_budget</code><span style=\"vertical-align: baseline;\"> caps the response size.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">entries.get</code><span style=\"vertical-align: baseline;\"> with </span><code style=\"vertical-align: baseline;\">view=ALL</code><span style=\"vertical-align: baseline;\"> on any Entry returns its structured OKF signals (</span><code style=\"vertical-align: baseline;\">okf_type</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">generated</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">sources</code><span style=\"vertical-align: baseline;\">, and the other ten) directly, which the agent can then filter or attest on.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">When a concept's </span><code style=\"vertical-align: baseline;\">sources[]</code><span style=\"vertical-align: baseline;\"> references another concept by path, the agent calls LookupContext on that Entry name to walk the reference.</span></p>\n<p><span style=\"vertical-align: baseline;\">The full response for the Revenue Entry:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;resources:\\r\\n -\\r\\n  catalogEntry: projects/acme-analytics/locations/us-central1/entryGroups/acme-retail/entries/metrics/revenue\\r\\n  type: OKF Document\\r\\n  description: Recognized revenue for a period, per Acme&#x27;s FY2026 revenue-recognition\\r\\n    policy. Backed by an Attested Computation.\\r\\n  overview: |-\\r\\n    # Definition\\r\\n\\r\\n    Revenue for a fiscal year is the sum of `net_amount` over orders that (a) reached `order_status = &#x27;delivered&#x27;`, (b) completed the 30-day return window, and (c) fall in the fiscal year by `order_ts`. Multi-currency orders are converted to USD at the `order_ts` daily reference rate. [^revenue-policy]\\r\\n\\r\\n    The sanctioned computation is [`computations/revenue-ytd.md`](../computations/revenue-ytd.md). Consumers MUST run and attest that computation rather than composing their own SUM. The attester rejects any receipt whose executed SQL does not match the sanctioned form.\\r\\n\\r\\n    # Reporting cuts\\r\\n\\r\\n    - **By fiscal year:** the sanctioned computation takes `year` as its sole parameter.\\r\\n    - **By channel or category:** these are approved narrations, not new metrics. Join the receipt&#x27;s row-level result to `orders.channel` or to `order_lines` × `products.category` client-side. Do NOT rewrite the sanctioned SQL.\\r\\n\\r\\n    # Trust and freshness\\r\\n\\r\\n    - **Verified:** VP Finance sign-off on 2026-07-01, against the FY2026 policy.\\r\\n    - **Stale after 2026-12-31:** Finance re-issues the revenue recognition policy each January. Consumers of this concept after 2027-01-01 MUST re-verify the definition against the new policy before serving.\\r\\n\\r\\n    [^revenue-policy]: Revenue Recognition Policy (FY2026)\\r\\n  labels:\\r\\n    finance: &#x27;true&#x27;\\r\\n    revenue: &#x27;true&#x27;\\r\\n    headline-metric: &#x27;true&#x27;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f590bbb7e50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Governance<br /></strong><span style=\"vertical-align: baseline;\">Permissions on the EntryGroup use standard Knowledge Catalog IAM. An agent that names both a bundle concept and the BigQuery table it grounds against in one call receives both, each subject to its own existing access control list (ACL), so the response carries only what the caller is already permitted to read. There is no parallel permission model to maintain.</span></p>\n<p><span style=\"vertical-align: baseline;\">Reading agents use </span><code style=\"vertical-align: baseline;\">roles/dataplex.catalogViewer</code><span style=\"vertical-align: baseline;\">, which grants the read paths: </span><code style=\"vertical-align: baseline;\">entries.get</code><span style=\"vertical-align: baseline;\">, LookupContext, and searchEntries. The identity that runs </span><code style=\"vertical-align: baseline;\">kcmd push</code><span style=\"vertical-align: baseline;\"> uses </span><code style=\"vertical-align: baseline;\">roles/dataplex.catalogEditor</code><span style=\"vertical-align: baseline;\">, which grants the write paths: </span><code style=\"vertical-align: baseline;\">entries.create</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">entries.patch</code><span style=\"vertical-align: baseline;\">. One EntryGroup per bundle-owning team is the multi-team pattern, and IAM on the EntryGroup cascades to its Entries.</span></p>\n<p><span style=\"vertical-align: baseline;\">LookupContext resolves the entry names it is given, up to ten per call, within a single location. It does not follow links out of a concept's body, so an agent that wants a referenced concept must name it explicitly. Place the bundle's EntryGroup in the same location as the data it describes to fetch both in one call.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Lifecycle</strong></h3>\n<p><code style=\"vertical-align: baseline;\">kcmd push</code><span style=\"vertical-align: baseline;\"> is an idempotent upsert. Re-running is safe (no duplicates, no error), but every push writes every Entry. Concept deletes require an explicit </span><code style=\"vertical-align: baseline;\">kcmd delete</code><span style=\"vertical-align: baseline;\"> on the Entry, or </span><code style=\"vertical-align: baseline;\">cleanup.ts</code><span style=\"vertical-align: baseline;\"> to remove the whole EntryGroup at once; </span><code style=\"vertical-align: baseline;\">cleanup.ts</code><span style=\"vertical-align: baseline;\"> deletes only the EntryGroup and its Entries, so the shared </span><code style=\"vertical-align: baseline;\">okf</code><span style=\"vertical-align: baseline;\"> AspectType and </span><code style=\"vertical-align: baseline;\">okf-bundle</code><span style=\"vertical-align: baseline;\"> EntryType stay in place for other bundles that reference them. For continuous ingestion in production, wire a CI job to </span><code style=\"vertical-align: baseline;\">kcmd push</code><span style=\"vertical-align: baseline;\"> on every commit to the bundle repository, using a service-account credential with </span><code style=\"vertical-align: baseline;\">roles/dataplex.catalogEditor</code><span style=\"vertical-align: baseline;\"> on the target EntryGroup.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">OKF defines what a trustworthy bundle looks like. Knowledge Catalog makes it reachable across the organization. To get started, check out the following resources:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Read the </span><a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OKF v0.2 spec</span></a><span style=\"vertical-align: baseline;\"> and browse the </span><a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/tree/main/bundles/acme_retail\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Acme Retail bundle</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Author a small bundle for one domain your team owns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sync it into your Knowledge Catalog project using the </span><a href=\"https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/toolbox/mdcode/demo/okf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sample code</span></a><span style=\"vertical-align: baseline;\">'s </span><code style=\"vertical-align: baseline;\">setup.ts</code><span style=\"vertical-align: baseline;\"> (which registers the resources) and </span><code style=\"vertical-align: baseline;\">push.ts</code><span style=\"vertical-align: baseline;\"> (which delegates to </span><code style=\"vertical-align: baseline;\">kcmd</code><span style=\"vertical-align: baseline;\">).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Point your existing agents at Knowledge Catalog. New context becomes reachable through the same LookupContext and searchEntries calls they already use.</span></p>\n</li>\n</ol></div>"
"last_updated": "2026-08-27 21:31:27 JST"
