  この日はネットワーク信頼性とレジリエンス検証が中心でした。Uber がクラウド移行を止めずにネットワークの信頼性を高めた取り組みが紹介され、拡大し続けるネットワークのトラフィックをどう捌くかという、同社が都市と共有する課題が語られています。Fault Injection Testing がプレビューで発表され、データベースの障害やネットワーク経路の不調が起きても基幹サービスを維持できるかを検証できるようになりました。Open Knowledge Format (OKF) については、エージェントに渡すコンテキストのポータブルな形式を Knowledge Catalog と組み合わせ、組織横断で共有・統制する方法が示されています。リリースノートでは、リージョン外部パススルー型 Network Load Balancer において BYOIP の IPv6 アドレスをロードバランサー作成前に予約したり、使用中のエフェメラルアドレスを予約済み静的アドレスへ昇格したりできるようになりました。日本語ブログでは Malachyte のコールドスタート問題の解決、Dataflow での生成 AI ワークフロー、AI 時代の FinOps の翻訳記事が公開されています。
