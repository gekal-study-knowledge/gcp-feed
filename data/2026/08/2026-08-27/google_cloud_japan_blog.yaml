"entries":
  "0d27f4fc25bc10602668367fd54c84a4":
    "id": "0d27f4fc25bc10602668367fd54c84a4"
    "title": "Google Dataflow で費用対効果に優れた高スループットな生成 AI ワークフローを構築する"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/cost-effective-genai-workflows-in-google-dataflow/"
    "published": "2026-08-27 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 19 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/cost-effective-genai-workflows-in-google-dataflow?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">リアルタイム ストリーミング パイプラインは現代の企業において運用のバックボーンとなっており、カスタマー サポートでのやり取りからトランザクション ログまで、あらゆるデータを処理し続けています。従来のストリーミング DAG は静的なものであり、一度デプロイされると、その処理ロジックや実行パスは変更できなくなります。しかし、生成 AI エージェントを統合すれば、静的なロジックから適応型の実行へと移行することが可能です。これにより、データの内容に応じてストリーミング ワークフローが実行時にプランを動的に立案し、データベースへのクエリや独自の修復処理を自律的に開始できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">たとえば、注文品の破損について顧客から不満を示すメッセージが届いた際、パイプラインの役割は単なるエラーログの記録や、ダッシュボードへのフラグ立てにとどまるべきではありません。顧客の注文と在庫の記録を保持するデータベースで注文情報を検索し、修復アクション（交換品の発送や払い戻しなど）を自ら判断して、顧客へのメール送信から最終的な対応結果の記録までを一貫して行うべきです。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、生成 AI ワークフローをストリーミング システムに実行しようとすると、スケール、レイテンシ、コストという、エンジニアリング上の根本的な障壁に直面することになります。すべての未加工イベントを、外部データベースとメールツールを備えた高負荷なモデルやマルチステップ エージェントに直接送信すると、コストが跳ね上がり、レイテンシも増大します。また、API のレート制限もすぐに使い果たしてしまいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここで紹介するパターンは、</span><a href=\"https://cloud.google.com/products/dataflow\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Dataflow</span></a><span style=\"vertical-align: baseline;\">（Google Cloud が提供する </span><a href=\"https://beam.apache.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Beam</span></a><span style=\"vertical-align: baseline;\"> のフルマネージド サーバーレス実行サービス）と </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit</span></a><span style=\"vertical-align: baseline;\">（ADK）を組み合わせてハイブリッド ストリーミング パイプラインを構築することで、スケーラビリティと複雑さという課題に対処します。軽量で CPU バウンドな ML モデルをアップストリームで使用してイベントをフィルタリングし、評価することで、パイプラインの費用対効果を高く保ち、複雑なケースのみをダウンストリーム エージェントにルーティングします。ケースを受け取ったエージェントは、実行するアクションを動的に決定し、パイプラインの静的 DAG に膨大な数の条件付きステップをハードコードすることなく、ストリームに動的分岐を導入します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">大規模ストリーム向けのユニバーサルなブループリント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">以下ではカスタマー サポートにおけるトリアージのシナリオを例にしていますが、この「事前フィルタ + エージェントによるアクション」というパターンは、幅広い分野に適用できる普遍的モデルです。このパターンは、イベントの大多数（90% 超）が定型的であり、複雑なコンテキスト推論を必要とするイベントはごくわずかである、以下のようなストリームに適用できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">IT 運用と DevOps: 数百万件の定型的なシステムログを CPU 上でフィルタリングし、重大な異常が検知された場合にのみエージェントをトリガーして診断を実行し、バグチケットを開く。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">金融詐欺のトリアージ: 数百万件のトランザクションを軽量なローカルルールでスクリーニングし、疑わしいパターンが検出された場合にのみエージェントを呼び出してマルチデータベース検索ツールを実行する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">産業用 IoT: エッジで定常的なテレメトリーをモニタリングし、突発的な異常をエージェントにルーティングして、機器のシャットダウンやフィールド エンジニアへの通知など一連の対応を調整する。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">アーキテクチャ: ストリーミング イベントを事前にフィルタする理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">高スループットなストリームの場合、メッセージの大部分は複雑な推論や修復を必要としません。その多くは、肯定的なフィードバック、中立的な問い合わせ、単純な質問などです。</span></p>\n<p><span style=\"vertical-align: baseline;\">すべてのイベントを高負荷な LLM ワークフローにルーティングすると、主に 3 つのボトルネックが発生します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">API のコスト:</strong><span style=\"vertical-align: baseline;\"> フロンティア モデルはトークン単位で課金されます。高スループットの場合、コストはストリームのボリュームに比例して増加します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レイテンシ:</strong><span style=\"vertical-align: baseline;\"> データベース参照や外部 API 呼び出しを含むマルチステップ ワークフローには数秒かかるため、ストリーミング DAG のボトルネックになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">割り当て:</strong><span style=\"vertical-align: baseline;\"> 外部 API には厳格なレート制限があり、ストリーミング ワーカーがその枠をすぐに使い切ってしまうおそれがあります。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">これを防ぐため、Apache Beam と Dataflow を使用して、事前フィルタリングされたパイプラインを構築します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_XYX8VCT.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">パイプライン フロー</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">取り込み:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Pub/Sub</span></a><span style=\"vertical-align: baseline;\"> から未加工の顧客メッセージを読み取ります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">軽量の感情分類器（CPU）:</strong><span style=\"vertical-align: baseline;\"> Apache Beam の </span><code style=\"vertical-align: baseline;\">RunInference</code><span style=\"vertical-align: baseline;\"> 変換を使用して、軽量の CPU ベースの Hugging Face モデル（</span><code style=\"vertical-align: baseline;\">distilbert-base-uncased-finetuned-sst-2-english</code><span style=\"vertical-align: baseline;\">）ですべてのメッセージを処理します。これは Dataflow ワーカーの CPU でローカルに実行されるため、外部 API の費用は発生しません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">事前審査ゲート:</strong><span style=\"vertical-align: baseline;\"> シンプルな </span><code style=\"vertical-align: baseline;\">DoFn</code><span style=\"vertical-align: baseline;\"> でストリームをフィルタします。感情が </span><code style=\"vertical-align: baseline;\">POSITIVE</code><span style=\"vertical-align: baseline;\"> または </span><code style=\"vertical-align: baseline;\">NEUTRAL</code><span style=\"vertical-align: baseline;\"> と判定されたメッセージは、確認応答を返したうえで破棄されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自動修復（ADK）:</strong><span style=\"vertical-align: baseline;\"> メッセージが </span><code style=\"vertical-align: baseline;\">NEGATIVE</code><span style=\"vertical-align: baseline;\"> に分類された場合にのみ、</span><code style=\"vertical-align: baseline;\">ADKAgentModelHandler</code><span style=\"vertical-align: baseline;\"> を介して </span><code style=\"vertical-align: baseline;\">gemini-3.5-flash</code><span style=\"vertical-align: baseline;\"> を基盤とする生成 AI エージェントをトリガーします。エージェントは各種ツールを活用して、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> でのユーザー検索、注文情報の取得、対応策の選定、Gmail API を介した通知メールの送信までを自律的に実行します。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">適応的実行: Beam DAG の動的な構成</strong></h4>\n<p><span style=\"vertical-align: baseline;\">従来のストリーミング アーキテクチャでは、パイプラインの有向非巡回グラフ（DAG）は固定されています。Dataflow にデプロイされると変換のシーケンスが固定されるため、新しいタイプのアラートを処理したり、特定のイベントのルーティング方法を変更したりする必要が生じた場合はパイプライン全体を変更、テスト、再デプロイする必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">感情の事前フィルタのダウンストリームに生成 AI エージェントを配置することで、静的な DAG 内に動的で適応性のあるノードを導入できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">全レコードの 95% を占める肯定的または中立的なデータは、パイプライン上の高速な静的パスに沿って処理されます。しかし、フィルタがネガティブなレコードを検知すると、エージェントはペイロードを評価し、実行時に API ツールの適切な実行順序（データベースへのクエリ、在庫確認、メール通知など）を動的に選択します。これにより、パイプラインで複雑な決定木を動的に実行できるようになり、静的な Apache Beam コードに膨大な数の条件分岐をハードコードして構築、保守し続けるといった煩雑な作業が不要になります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">パイプラインの実装</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Agent Development Kit（ADK）と </span><code style=\"vertical-align: baseline;\">RunInference</code><span style=\"vertical-align: baseline;\"> フレームワークを活用した Apache Beam での実装例を以下に示します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 軽量な感情モデルの定義</strong></p>\n<p><span style=\"vertical-align: baseline;\"><code style=\"vertical-align: baseline;\">HuggingFacePipelineModelHandler</code><span style=\"vertical-align: baseline;\"> を使用して、アップストリームの CPU モデルを定義します。このモデルは、ワーカー インスタンス上で感情を </span><code style=\"vertical-align: baseline;\">POSITIVE</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">NEUTRAL</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">NEGATIVE</code><span style=\"vertical-align: baseline;\"> に分類します。</span></span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;model_handler = HuggingFacePipelineModelHandler(\\r\\n    task=&quot;sentiment-analysis&quot;,\\r\\n    model=&quot;distilbert-base-uncased-finetuned-sst-2-english&quot;\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e934e2590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">2. 高負荷な ADK エージェントの構築</strong></p>\n<p><span style=\"vertical-align: baseline;\">ADK エージェントは修復アシスタントとして機能します。このエージェントに、次の 3 つのツールを実装します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">lookup_user</code><span style=\"vertical-align: baseline;\">: BigQuery に顧客のメールアドレスをクエリします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">lookup_orders</code><span style=\"vertical-align: baseline;\">: BigQuery に顧客の注文と現在の商品在庫をクエリします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">send_email</code><span style=\"vertical-align: baseline;\">: </span><a href=\"https://developers.google.com/workspace/gmail/api/guides\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gmail API</span></a><span style=\"vertical-align: baseline;\"> を使用して対応メールを顧客に送信します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;def make_adk_tools(project: str, dataset: str = &quot;sentiment_demo&quot;):\\r\\n    def lookup_user(user_id: int) -&gt; dict:\\r\\n        &quot;&quot;&quot;Look up user information (email address) from BigQuery by user ID.&quot;&quot;&quot;\\r\\n        from google.cloud import bigquery\\r\\n\\r\\n        client = bigquery.Client(project=project)\\r\\n        query = (\\r\\n            f&quot;SELECT user_id, user_email &quot;\\r\\n            f&quot;FROM `{project}.{dataset}.users` &quot;\\r\\n            f&quot;WHERE user_id = @user_id&quot;\\r\\n        )\\r\\n        job_config = bigquery.QueryJobConfig(\\r\\n            query_parameters=[bigquery.ScalarQueryParameter(&quot;user_id&quot;, &quot;INT64&quot;, user_id)]\\r\\n        )\\r\\n        try:\\r\\n            results = list(client.query(query, job_config=job_config).result())\\r\\n            if results:\\r\\n                row = results[0]\\r\\n                return {&quot;user_id&quot;: row.user_id, &quot;user_email&quot;: row.user_email}\\r\\n            return {&quot;error&quot;: f&quot;No user found with user_id={user_id}&quot;}\\r\\n        except Exception as exc:\\r\\n            return {&quot;error&quot;: str(exc)}\\r\\n\\r\\n    def lookup_orders(user_id: int) -&gt; dict:\\r\\n        &quot;&quot;&quot;Look up a user\\&#x27;s orders and current product inventory from BigQuery.&quot;&quot;&quot;\\r\\n        from google.cloud import bigquery\\r\\n\\r\\n        client = bigquery.Client(project=project)\\r\\n        query = (\\r\\n            f&quot;SELECT p.order_id, p.product_id, pr.remaining_inventory, pr.price &quot;\\r\\n            f&quot;FROM `{project}.{dataset}.purchases` p &quot;\\r\\n            f&quot;JOIN `{project}.{dataset}.products` pr ON p.product_id = pr.product_id &quot;\\r\\n            f&quot;WHERE p.user_id = @user_id&quot;\\r\\n        )\\r\\n        job_config = bigquery.QueryJobConfig(\\r\\n            query_parameters=[bigquery.ScalarQueryParameter(&quot;user_id&quot;, &quot;INT64&quot;, user_id)]\\r\\n        )\\r\\n        try:\\r\\n            results = list(client.query(query, job_config=job_config).result())\\r\\n            orders = [\\r\\n                {\\r\\n                    &quot;order_id&quot;: row.order_id,\\r\\n                    &quot;product_id&quot;: row.product_id,\\r\\n                    &quot;remaining_inventory&quot;: row.remaining_inventory,\\r\\n                    &quot;price&quot;: float(row.price),\\r\\n                }\\r\\n                for row in results\\r\\n            ]\\r\\n            return {&quot;orders&quot;: orders}\\r\\n        except Exception as exc:\\r\\n            return {&quot;error&quot;: str(exc)}\\r\\n\\r\\n    def send_email(to_address: str, subject: str, body: str) -&gt; str:\\r\\n        &quot;&quot;&quot;Send a plain-text email to the customer via the Gmail API.&quot;&quot;&quot;\\r\\n        import google.auth\\r\\n        import googleapiclient.discovery\\r\\n        import email.mime.text\\r\\n        import base64\\r\\n\\r\\n        try:\\r\\n            creds, _ = google.auth.default(\\r\\n                scopes=[&quot;https://www.googleapis.com/auth/gmail.send&quot;]\\r\\n            )\\r\\n            service = googleapiclient.discovery.build(&quot;gmail&quot;, &quot;v1&quot;, credentials=creds)\\r\\n\\r\\n            mime_msg = email.mime.text.MIMEText(body)\\r\\n            mime_msg[&quot;to&quot;] = to_address\\r\\n            mime_msg[&quot;subject&quot;] = subject\\r\\n            raw = base64.urlsafe_b64encode(mime_msg.as_bytes()).decode(&quot;utf-8&quot;)\\r\\n            service.users().messages().send(userId=&quot;me&quot;, body={&quot;raw&quot;: raw}).execute()\\r\\n            return &quot;Email sent successfully&quot;\\r\\n        except Exception as exc:\\r\\n            return f&quot;Failed to send email: {exc}&quot;\\r\\n\\r\\n    return [lookup_user, lookup_orders, send_email]&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e93db0f10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">LlmAgent</code><span style=\"vertical-align: baseline;\"> を構成し、</span><code style=\"vertical-align: baseline;\">ADKAgentModelHandler</code><span style=\"vertical-align: baseline;\"> に組み込みます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;adk_agent = LlmAgent(\\r\\n    name=&quot;remediation_agent&quot;,\\r\\n    model=&quot;gemini-3.5-flash&quot;,\\r\\n    instruction=(\\r\\n        &quot;You are a customer service remediation assistant with access to &quot;\\r\\n        &quot;BigQuery lookup tools and an email sending tool. &quot;\\r\\n        &quot;When given a prompt describing a customer situation, follow the &quot;\\r\\n        &quot;numbered steps exactly and use your tools to complete the task.&quot;\\r\\n    ),\\r\\n    tools=adk_tools,\\r\\n)\\r\\n\\r\\n# RunInference handler for the ADK agent\\r\\nadk_handler = ADKAgentModelHandler(agent=adk_agent)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e93db3590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. Dataflow DAG の組み立て</strong></p>\n<p><span style=\"vertical-align: baseline;\">パイプライン全体を明確に定義します。アップストリームの感情推論の結果はフィルタリング ステップ（</span><code style=\"vertical-align: baseline;\">FilterNegativeADK</code><span style=\"vertical-align: baseline;\">）に直接渡され、フィルタリング ステップはダウンストリームの </span><code style=\"vertical-align: baseline;\">ADKInference</code><span style=\"vertical-align: baseline;\"> を条件付きで実行します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;with beam.Pipeline(options=pipeline_options) as p:\\r\\n    # 1. Read from Pub/Sub and classify sentiment on CPU\\r\\n    sentiment_results = (\\r\\n        p\\r\\n        | &quot;ReadFromPubSub&quot; &gt;&gt; beam.io.ReadFromPubSub(topic=known_args.input_topic)\\r\\n        | &quot;DecodeMessages&quot; &gt;&gt; beam.Map(lambda x: x.decode(\\&#x27;utf-8\\&#x27;))\\r\\n        | &quot;SentimentInference&quot; &gt;&gt; RunInference(model_handler)\\r\\n    )\\r\\n\\r\\n    # 2. Filter out non-negative sentiment and invoke the ADK Agent\\r\\n    _ = (\\r\\n        sentiment_results\\r\\n        | &quot;FilterNegativeADK&quot; &gt;&gt; beam.ParDo(FilterNegativeAndPromptADK())\\r\\n        | &quot;ADKInference&quot; &gt;&gt; RunInference(adk_handler)\\r\\n        | &quot;LogADKResults&quot; &gt;&gt; beam.ParDo(LogADKResponse())\\r\\n    )&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f0e932d1810&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">コストとパフォーマンスのメリット</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このフィルタリング ステップを導入すると、エンジニアリング面と運用面の両方で大きなメリットがあります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 大幅なコスト削減</strong></p>\n<p><span style=\"vertical-align: baseline;\">すべての受信イベントに対して料金を支払うのではなく、顧客のネガティブな感情が含まれる一部のメッセージ（通常は 5% 未満）に対してのみ </span><a href=\"https://ai.google.dev/gemini-api/docs/tokens\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini の入出力トークン</span></a><span style=\"vertical-align: baseline;\">の料金を支払うだけで済みます。残りの 95% は CPU インスタンスでローカルに分類されるため、API の追加費用はかかりません。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. 高いストリーミング スループット</strong></p>\n<p><span style=\"vertical-align: baseline;\">Dataflow は、CPU による分類ワークロードを多数のインスタンスに分散して処理します。CPU 推論はミリ秒単位で完了するため、パイプラインを水平方向にスケールして高スループットのイベント ストリームを処理できます。ツール実行のためにリクエストごとに数秒を要する高負荷な LLM エージェントは、呼び出し回数を最小限に抑えることで、バックログの発生を防いでいます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. ネイティブな Apache Beam 統合</strong></p>\n<p><span style=\"vertical-align: baseline;\">DAG にエージェントを追加するのに、複雑なオーケストレーション ロジックや手動のスレッドプールは一切必要ありません。</span><code style=\"vertical-align: baseline;\">ADKAgentModelHandler</code><span style=\"vertical-align: baseline;\"> を Beam ネイティブの </span><code style=\"vertical-align: baseline;\">RunInference</code><span style=\"vertical-align: baseline;\"> 変換と併用することで、並列ワーカー スレッド、バッチ処理、統合の処理が自動化され、コードベースをクリーンでメンテナンスしやすい状態に保てます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">重要ポイント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ストリーミング データは高速かつ大量であるのに対し、高負荷な生成 AI 推論は低速でコストがかかります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Dataflow と ADK を使用して事前フィルタリングを組み込んだパイプラインを構築することで、ローカルの CPU ベースのモデルが持つ「低コストとスピード」、そして Gemini を活用したエージェントの「高度な自動化機能」という両方の長所を最大限に引き出すことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">完全なコードベースを参照してご自身でデプロイしてみる場合は、</span><a href=\"https://github.com/damccorm/next-2026-demo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">next-2026-demo GitHub リポジトリ</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Apache Beam は </span></span><a href=\"https://www.apache.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Apache Software Foundation</span></span></a><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\"> の商標です。</span></span></sup></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Reza Rokni</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Danny McCormick</strong></p></div>"
  "78fec78e50dd0af976437a637218de58":
    "id": "78fec78e50dd0af976437a637218de58"
    "title": "AI 時代の FinOps：エージェント向けの新しい柔軟な請求と費用管理"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud/"
    "published": "2026-08-27 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 27 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></span></p>\n<p><span style=\"vertical-align: baseline;\">AI がより複雑な業務を担うようになる中、ビジネスリーダーは、利益率と予算を守りながら、エージェントを活用して迅速なイノベーションを可能にするという新しい課題に直面しています。AI から投資対効果を得るには、技術の進化にあわせて 財務運用 (FinOps) とともに費用管理も進化させる必要があります。これにより、明確なコストの可視化、プロアクティブなコスト統制、ニーズに合った柔軟な支払いモデルの実現が可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">本日、Gemini Enterprise 全体にわたるエージェント ワークロード、ならびに </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity in Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"http://d.android.com/gemini-in-android\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</span></a><span style=\"vertical-align: baseline;\"> といったデベロッパー ツール向けに、</span><strong style=\"vertical-align: baseline;\">請求を柔軟にする支払いオプションと新しい費用管理ツール</strong><span style=\"vertical-align: baseline;\">を発表します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">柔軟な支払いオプション</strong><span style=\"vertical-align: baseline;\">：既存の予測可能なユーザー単位のシート サブスクリプションと、Gemini Enterprise app の</span><a href=\"https://cloud.google.com/gemini-enterprise#gemini-enterprise-app-editions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">新しい従量課金オプション</span></a><span style=\"vertical-align: baseline;\">を組み合わせることができます。これにより、タスクの途中で制限に達することなく、エージェント ワークロードを実行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デベロッパーへのアクセス権と AI の一括管理</strong><span style=\"vertical-align: baseline;\">：Google Antigravity および Android Studio での AI 利用が Gemini Enterprise のサブスクリプションに含まれるようになりました（一部のお客様に提供中、他のお客様には順次提供予定）。これにより、管理負担を増やすことなくデベロッパーにより多くの機能を提供できます。Google Antigravity、プラットフォーム、アプリにわたる利用状況は、個別ライセンスや請求でサイロ化されず、単一のビューに集約されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">用量の増加に応じた割引</strong><span style=\"vertical-align: baseline;\">：AI ワークロードが安定している、または増加している場合、 </span><a href=\"https://docs.cloud.google.com/docs/cuds-flexible-savings-plans\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Flexible Savings Plans</span></a><span style=\"vertical-align: baseline;\"> を利用することで、許容できる月額支出にコミットし、トークン費用を 10〜20% 削減できます。最低額や上限額の条件はなく、新しい請求サイロの管理も発生しません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">統合された支出ガードレール</strong><span style=\"vertical-align: baseline;\">：AI 支出やプロジェクトに月額の上限を設定し、エージェントの実行費用を見積もり、請求書に反映される前に予期しない予算の急増を検知できるようになりました。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Enterprise の支出をコントロールしながらチームに柔軟性を提供</strong></h3>\n<p><span style=\"vertical-align: baseline;\">企業ごとに組織運営の方法は異なります。また同じ企業内であっても、AI の利用方法はチームによって様々です。ビジネス ユーザーは日常的な生産性ツールを継続的に使用する傾向にある一方で、技術チームは AI エージェント ワークロードを短期間に集中して実行することがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">実際の業務の進め方に費用を適合させるため、以下の支払いおよびライセンスの選択肢を Gemini Enterprise の各機能と組み合わせることができます。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">オプション</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">仕組み</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">費用最適化に役立つ理由</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise app のユーザー単位シート サブスクリプション</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーごとに一定の月額料金を支払います。これにはプロジェクト全体で共有される毎日の割り当てプールが含まれます。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">予測可能な予算</strong><span style=\"vertical-align: baseline;\">：日々安定した生産性ニーズを持つチーム向け。財務経理部に明確な月額費用を提供します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">【新機能】 従量課金制 Gemini Enterprise app </strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">*一部のお客様に提供中、他のお客様には順次提供予定</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">前払い契約や基本サブスクリプション料金はなく、標準モデル API レートに基づき、チームが消費したコンピューティングとトークンの分のみを厳密に支払います。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">使用した分のみ支払い</strong><span style=\"vertical-align: baseline;\">：支出は実際の利用状況に応じて自動的に増減するため、プロジェクトの需要が低下したときに利用されていない社員の料金を支払う必要がありません。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">【Google Antigravity in Gemini Enterprise の 向け新機能】統合されたプール割り当て</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">日々の利用上限はプロジェクト全体でプールされ、ビジネスアプリ、デベロッパー ツール、カスタム エージェントはこの共有枠から消費します。プールされた割り当てが常に優先して消費されますが、管理者は超過利用を許可するかどうかを制御でき、許可した場合の超過分は従量課金レートで請求されます。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">リソース利用の効率化</strong><span style=\"vertical-align: baseline;\">：ビジネス ユーザーの未使用の制限枠を、デベロッパーやカスタム API エージェントの負荷の高いワークロードに自動的に、割り当てられるため、日々の制限枠が無駄になりません。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">【今後提供開始】遅延実行価格</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">*一部のワークロード向けに提供予定</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">対象となるエージェント ワークロードを遅延実行として指定すると、Gemini Enterprise Agent Platform のインテリジェント スケジューラがオフピーク時間帯のキャパシティで実行します。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">急がない業務の大幅な割引</strong><span style=\"vertical-align: baseline;\">：AI ワークロードを分離されたオフピーク容量で実行できるため、推論コストを半額程度に抑えつつ、標準の割り当てを使わずにすむため、同じ予算内で大幅に多くのエージェント ワークロードを実行できます。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">単一の Gemini Enterprise サブスクリプションで高度なエージェント ツールをデベロッパーに提供</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、</span><strong style=\"vertical-align: baseline;\">Google Antigravity in Gemini Enterprise</strong><span style=\"vertical-align: baseline;\"> を提供開始しています。Google Antigravity in Gemini Enterpriseは</span><strong style=\"vertical-align: baseline;\">、</strong><span style=\"vertical-align: baseline;\">高度なエージェント コーディングおよびエージェント構築機能を技術チームにもたらすエージェント ファーストのデベロッパー プラットフォームで、</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">対象となるお客様</span></a><span style=\"vertical-align: baseline;\">の Gemini Enterprise サブスクリプションに含まれます。さらに、Android デベロッパーは、プロフェッショナルな Android 開発向けのエージェント IDE である </span><a href=\"http://d.android.com\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</strong></a><span style=\"vertical-align: baseline;\"> 内で、 Gemini Enterprise サブスクリプションに含まれる Google Antigravity の割り当てをネイティブに活用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント コーディングの費用効率を高めるため、各 Gemini Enterprise サブスクリプションに含まれるデベロッパー ツールの割り当てをプール化し、Google Cloud プロジェクト全体で利用できるようにしています。これにより、チームは購入済みのキャパシティを無駄なく活用できます。一元化されたガバナンスと管理を維持しながら、デベロッパーに高度なエージェント ツールを提供できます。</span><span style=\"vertical-align: baseline;\">Google Antigravity in Gemini Enterprise の新機能や、お客様による本番環境での活用事例の詳細については、</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">（英語）をご覧ください。</span><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Enterprise Flexible Savings Plans（FSPs）でよりスマートに予算を管理</strong></h3>\n<p><span style=\"vertical-align: baseline;\">企業の AI ワークロードが安定または増加している場合、Gemini Enterprise Flexible Savings Plans（FSPs）は、Gemini Enterprise 全体の利用に対してシンプルな利用額ベースのモデルを提供します。FSPs は、予算の柔軟性を維持しながらトークン費用を削減するように設計されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プログラムによる割引</strong><span style=\"vertical-align: baseline;\">：Gemini Enterprise 全体の月額利用額に対し、1 年間の約定で 10% 割引、3 年間の約定で 20% 割引を受けられます。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ペースに合わせて調整</strong><span style=\"vertical-align: baseline;\">：最低利用額や上限額の条件がないため、現在のトラフィックに合った月額コミットメントを決め、利用量の増加に合わせて調整できます。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise Agreement（EA）に対応</strong><span style=\"vertical-align: baseline;\">： FSPs の利用額は、既存の Google Cloud EA の枠からシームレスに消化されるため、全体的なクラウドの約定枠を細分化することなく、各事業部門専用の予算管理が可能です。 </span></p>\n</li>\n</ul>\n<p><a href=\"https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Flexible Savings Plans</span></a><span style=\"vertical-align: baseline;\"> は、セルフサービスのお客様およびエンタープライズ契約をご利用のお客様に提供を開始しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">財政規律を維持しながらチームに構築の自由を提供</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ビジネスリーダーとしての目標は、AI の潜在的な価値を制限することではなく、管理されていない AI 費用によって発生する財務上および運用上のリスクを取り除くことです。エンジニアリング、マーケティング、運用の各チームにエージェントを活用したイノベーションの自由を与えつつ、それらのエージェントの挙動を信頼できる可視性と、予算を保護するセーフティネットを確保する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このギャップを埋めるため、Google Cloud Billing Console 内に 3 つの明確な目標に基づいた堅牢なネイティブ ガバナンス ツールを構築しました。 </span></p>\n<ol>\n<li><strong style=\"vertical-align: baseline;\">プロジェクト開始前に費用試算</strong><span style=\"vertical-align: baseline;\">：</span><a href=\"https://cloud.google.com/products/calculator\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Pricing Calculator</span></a><span style=\"vertical-align: baseline;\"> を使用すると、ユーザー単位のライセンス、デベロッパー ツール、バックグラウンド エージェントのランタイム全体にわたる Gemini Enterprise の見込み費用を試算できます。プロジェクト業務の開始前に、必要な予算を確認できます。 </span></li>\n<li><strong style=\"vertical-align: baseline;\">支出を細かく管理せずにしきい値を設定</strong><span style=\"vertical-align: baseline;\">：プロジェクトチーム全体の日々の利用変動を管理するため、以下のツールにモニタリングを依頼することができます。 </span>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">早期の異常検知</strong><span style=\"vertical-align: baseline;\">：プロジェクトの AI 支出が通常より高くなる傾向を示した場合、システムは根本原因分析とともに異常値をフラグ付けし、増加の原因となっている上位 3 つの SKU を特定します。これにより、何が変化したのかを正確に把握できます。</span></li>\n</ul>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 Jul22_Anomalies_Image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_Jul22_Anomalies_Image1.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Billing Console に表示された初期異常アラートと、原因の主なSKUを強調表示した根本原因分析（RCA: the Root Cause Analysis）の内訳</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">プロジェクト レベルの支出上限</strong><span style=\"vertical-align: baseline;\">：プロジェクトで明確な予算上の制限が必要な場合、Google Cloud Billing Console で直接、確実な月額支出上限を設定できます。プロジェクトが上限に達すると、エージェントの API 呼び出しが一時停止し、本番インフラストラクチャに影響を与えることなく予算を保護します。また、予算の 50%、80%、100% に達した際に送信される自動メールアラートにより、支出上限に対する進捗状況を把握できます。 </span></li>\n<li><strong style=\"vertical-align: baseline;\">超過利用コントロール</strong><span style=\"vertical-align: baseline;\">：支出上限に達し処理が停止した場合でも、コンソールで 1 クリックで業務を再開できます。継続的な運用を優先する場合は、超過利用を有効にして超過利用分を従量課金レートへとスムーズに移行させることができます。この超過分は FSPs から直接引き落とされるため、超過単価には大幅な割引価格を維持できます。</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 PAYG Overage Enabled\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_PAYG_Overage_Enabled.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>プロジェクトの従量課金による超過利用の有効化</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. <strong style=\"vertical-align: baseline;\">ビジネス価値の可視化</strong><span style=\"vertical-align: baseline;\">：</span></strong><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">統合された請求レポートを FinOps エージェントと組み合わせて使用することで、予算の支出先に関するインサイトを自然言語で生成し、経営陣に ROI を簡単に提示できます。</span></span><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"> </span></span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Cost overview FinOps\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Billing_overage_-_dashboard_-_new_afternoo.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Google Cloud Console における AI 支出レポート</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">AI 費用の最適化をさらに深めるには</strong></h3>\n<p><span style=\"vertical-align: baseline;\">モデルとインフラストラクチャの費用、レイテンシ、パフォーマンスを最適化するフルスタックの FinOps 戦略を構築するには、詳細なアーキテクチャ仕様とフレームワークをご覧ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">動的な容量管理によりインフラストラクチャの制約を克服する方法</strong></a><span style=\"vertical-align: baseline;\">： Google Kubernetes Engine および Google Compute Engine の機能を活用してコンピューティング投資を最適化する方法をご紹介します。これらの機能は、リソースを自動的にスケジュールおよび再割り当てし、中断、過剰なプロビジョニング、特定のハードウェア構成への過度な依存を回避します。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">エンタープライズのお客様向けに Google Antigravity を拡張</strong></a><span style=\"vertical-align: baseline;\">：技術チームがエージェント ファーストのワークフローによってソフトウェアのデリバリーをどのように加速しているか、デベロッパー ツールに関する詳細解説ををご確認ください。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/transform/gemini-enterprise-optimize-ai-token-spend\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">スポーツカーから学ぶ AI 支出最適化</strong></a><span style=\"vertical-align: baseline;\">：トークン数が多ければ常に優れた AI になるとは限りません。Gemini Enterprise Agent Platform プロダクト マネジメント ディレクターである Mike Clark との対談で、馬力と効率のバランスをとり、AI への投資からより高いリターンを得る方法をご覧ください。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">利用スパイク時の保護</strong></a><span style=\"vertical-align: baseline;\">：負荷の大きいワークロードは、それ以外の時間にアイドル状態となる高価な専用インフラストラクチャの料金を支払うことなく、ピーク時に急増させることができます。AI の利用が拡大しても、Gemini モデルは人工的なレート制限に達することなくオンデマンドで自動的にスケーリングし、1 分あたり最大 5,000 万トークンを処理できます。プロビジョンド スループットの詳細をご覧ください。 </span></p>\n</li>\n</ul></div>"
  "7ab28dee2057a86cc3ce18ac10dc2fed":
    "id": "7ab28dee2057a86cc3ce18ac10dc2fed"
    "title": "Malachyte がマネージド リアルタイム AI で小売業のコールド スタート問題を解決した方法"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention/"
    "published": "2026-08-27 10:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 11 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">未知の潜在顧客に商品をすすめるには、どのような方法が最適なのでしょうか。</span></p>\n<p><span style=\"vertical-align: baseline;\">私たちは、Spotify や Priceline などの大手企業とともに、長年この問題の解決に取り組んできました。そして、Sidd Motwani を中心に、AI を活用した e コマースのレコメンデーション プラットフォーム </span><a href=\"https://www.malachyte.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Malachyte</span></a><span style=\"vertical-align: baseline;\"> を創設したのも、まさにこの問題を解決するためでした。最近では、消費者はパーソナライズされて関連性の高いコンテンツを期待するようになり、オンライン サービスは消費者の関心を集めるために競わねばならず、その結果がビジネスの成否を左右するまでになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Malachyte は、高度な AI モデル、特に大規模言語モデルを、パーソナライズやレコメンデーションといった従来の課題に新しい方法で適用する独自のインサイトを見い出し、それが革新を生むきっかけとなりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、潜在顧客の獲得を目指すうえで、Malachyte が常に思い描いていたビジョンを実現し、パーソナライズ アルゴリズムを構築し続けるには、セキュアかつスケーラブルで信頼性が高く、何よりも最先端の AI インフラストラクチャが必要でした。そこで、</span><a href=\"https://cloud.google.com/bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-kafka\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Kafka</span></a><span style=\"vertical-align: baseline;\"> などの Google Cloud ツールを活用することで、Malachyte は小売業者の売上を </span><a href=\"https://www.malachyte.com/case-studies\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2 倍、場合によっては 3 倍</span></a><span style=\"vertical-align: baseline;\">に増やすことに成功したのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、Malachyte がそのプラットフォームをいかにして構築したか、そして、企業家の皆様がこのようなサービスを利用して AI 基盤モデルのデプロイを新しい方法で開始するにはどうすればよいか、ご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Malachyte はお客様の売り上げをどのように伸ばしたのか</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Malachyte には、アテンション メカニズムを備えたニューラル ネットワーク（大規模言語モデルを支えるのと同じコンセプト）を使用して、小売検索と商品ページをパーソナライズできることを発見したときがひらめきの瞬間でした。このアプローチは、大規模言語モデル（LLM）でシーケンス内のアイテムの相対的な順序から意味を引き出すために使用されています。この場合、シーケンスは文中の単語と音節の順序です。Malachyte は、これを小売業のウェブサイトやアプリに応用し、顧客がサイトを操作する際の一連の行動の把握に努めました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Malachyte blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Malachyte_blog_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>LLM が文の次の単語を予測するように、e コマースサイトでユーザーが次に何を求めているかを予測できたらどうでしょうか。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">GPT 以前の言語モデルでも、単語や単語の断片（現在ではトークンとして知られているもの）の特定の並びを調べることは可能でした。しかし、それらの初期のモデルでは、単語が同等の順序で並んでいても、連続していなかったり、並べ替えられていたりした場合にどうなるかを調べることはできませんでした。この状況が打破されたのは、LLM がアイテムのシーケンス内の複雑で広い範囲の依存関係を理解できるようになったときでした。これには、Google の Transformer に関する取り組みも部分的に貢献しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このより洗練された手法は、生成 AI の一般的な普及はもちろん、Malachyte によるこのテクノロジーの応用という点でも、劇的な成果をもたらしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">これを実践で機能させるために、Malachyte はユーザーがサイトにアクセスしたときに、そのユーザーについて知り得るすべての情報をベクトル化しています。ほとんどのユーザーは初めてサイトを訪れるため、ユーザーに関する情報はほぼありません。これが、いわゆる「コールド スタート」問題です。これに対応するには、ユーザーとのあらゆるやり取りをすべて活用して、このベクトルを改良する必要があります。たとえば、クリックやクエリなど、ベクトルに新しい要素が追加されるたびに、ユーザーが次に何を求めているかの予測が促進され、ユーザーに関する情報がさらに提供されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Malachyte のプラットフォームでは、その際にユーザー ベクトルと予測を同時に更新します。これにより、個々のユーザーとその好みをより深く理解できるだけでなく、匿名化されたユーザーデータを使用してモデル全体を改善することができます。推論を行うたびに、平均的な買い物客と特定の買い物客の両方のコンテキストが拡大する仕組みです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Malachyte は、アテンションベースのニューラル ネットワークを使用するだけでなく、ユーザー プロファイルを 100 ミリ秒ごとに更新することで、さらなるイノベーションを実現しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Malachyte Blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Malachyte_Blog.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Malachyte のレコメンデーション エージェントと検索エージェントは、ユーザーが前のページでクリックした内容に基づいて、次のページの検索結果やレコメンデーション カルーセルにデータを入力します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">正確には、このコンセプト自体は新しいものではありません。小売業者は長年にわたり、コラボレーション フィルタリング レコメンデーション システムを使用して、類似するユーザーとアイテムを特定してきました。ただし、これには膨大な量のインタラクション履歴が必要でした。これらのモデルでは通常、サードパーティ Cookie ベースのプロファイルやユーザー属性など、大量のデータを必要とします。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、セッション内のインタラクションのシーケンスに焦点を当てることで、小売業者はユーザーのプロファイルのみに焦点を当てるよりも、必要なデータや費用を抑えながら、はるかに多くのパーソナライズを実現できるようになります。また、長期的な Cookie データに依存しないことで、ユーザーのプライバシーをより尊重できる利点もあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは、モデルの構造と、ブラウザデータ、クリック履歴、検索など、ユーザーに関するあらゆる情報をエンコードするマルチモーダル ベクトルによって実現されます。出力もマルチモーダルです。同じモデルを、サイト内検索の商品ページ、カテゴリページ、「カートに追加」カルーセルに適用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この仕組みは、カタログ内の各商品がユーザー ベクトルと同じ空間に埋め込まれることで機能します。それにより、ユーザー ベクトルが更新されて、関連する商品に近づき、関連しない商品からは遠ざかるようになります。エンベディングを計算するニューラル ネットワークは、Malachyte と連携する小売業者全体で継続的にトレーニングされ、すべてのユーザーの品質を向上させています。このシステムは事実上、データ協同組合として機能し、各小売業者のユーザーがモデルをさらにスマート化させながら、それが全ユーザーに役立つ仕組みになっています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - Malachyte blog vector space - high res\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_-_Malachyte_blog_vector_space_-_high_res.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>商品の空間でベクトルとして表されるユーザー セッション。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">この仕組みをすべてのユーザーに対して推論ごとに 100 ミリ秒で実現するために、Malachyte は Google Cloud のリアルタイム AI スタックを基盤とすることに大きなメリットを見出しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このシステムでは、すべての行動イベントが Managed Service for Apache Kafka クラスタにストリーミングされます。各イベントは、将来のトレーニング ジョブのためにキューに入れられるのではなく、Bigtable で直ちにユーザー プロファイルの更新に使用されます。Kafka クラスタにより、お客様のフロントエンドが永続化されるため、ユーザー セッションのシグナルをユーザー ベクトルにどのように適合させるかをあまり心配することなく、迅速に処理できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Bigtable によって、Malachyte のサービスは適切なユーザー ベクトルを検索して更新できるようになります。Bigtable と Kafka はステップごとに 10 ミリ秒のオーダーで動作するため、レコメンデーション ループ全体が、ユーザー エクスペリエンスを中断することなく完了します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4 - Malachyte Blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_-_Malachyte_Blog.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>小売業者のウェブサイト、Malachyte の AI モデルとサービング フロントエンド、コンテキスト管理インフラストラクチャから成る 3 層のリアルタイム AI アーキテクチャ。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">高速コアの機能に加え、商品カタログの更新事項、在庫シグナル、小売店固有のディメンション データから成る第 2 レイヤには、商品データを最新の状態に保つ働きがあります。このデータは </span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pub/Sub</span></a><span style=\"vertical-align: baseline;\"> 経由で送信されます。Cloud Pub/Sub は、グローバル アクセスが可能な REST API を提供するため、小売業者は緻密な統合作業なしで接続を利用できます。Malachyte エージェントは </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine </span></a><span style=\"vertical-align: baseline;\">（GKE）で実行され、モデル推論は </span><a href=\"https://cloud.google.com/products/compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Compute Engine</span></a><span style=\"vertical-align: baseline;\">（GCE）で行われます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5 Malachyte blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5_Malachyte_blog.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>商品カタログの更新事項などの外部データの継続的な取り込みは、Pub/Sub のグローバル メッセージング システムを通じて行われます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Google Cloud AI アーキテクチャに移行したことで、Malachyte は本番環境の AI 推論とトレーニングが GPU とストレージだけでは決まらないことを実証しました。高速な Key-Value ストア、ストリーミング レイヤ、マネージド メッセージング システムを含むリアルタイムの継続的学習インフラストラクチャが必要であり、これらすべてが基盤モデル アーキテクチャと統合されていることが重要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このアプローチは、Malachyte のような小規模なチームでも業界に多大な影響を与えることができることを示しています。必要なのは、強力なインフラストラクチャとコア AI マネージド サービスへのアクセスです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる </strong></h4>\n<p><span style=\"vertical-align: baseline;\">Malachyte のように業界に革新をもたらしたり、他社に先駆けて業界をリードしたりすることを目指すなら、</span><a href=\"https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Kafka</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pub/Sub</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\"> をお試しください。新規のお客様は、</span><a href=\"https://cloud.google.com/free\"><span style=\"text-decoration: underline; vertical-align: baseline;\">$300 分の Google Cloud クレジット</span></a><span style=\"vertical-align: baseline;\">を利用できます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Malachyte、CEO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sidd Motwani 氏</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Malachyte、スタッフ ML エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Vicki Boykis 氏</strong></p></div>"
