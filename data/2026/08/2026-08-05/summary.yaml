  この日はリリースノートに加えて AI & ML ブログの事例 2 件がありました。Cloud Monitoring のメトリクス取り込み向け Telemetry API が一般提供となり、OpenTelemetry Collector と OTLP エクスポーターを使って OTLP メトリクスを取り込めます。Cloud Run はジョブやワーカープールを含むすべてのリソースでサンドボックスをプレビュー対応し、Cloud SQL for MySQL のパフォーマンスキャプチャは一般提供となって、データベースと OS のメトリクスのスナップショットを Cloud Logging へ送って原因分析に使えます。事例では Target が Spanner Graph により小売の商品発見体験を強化しデータベース保守を 50% 削減したこと、Deutsche Bank が Apigee を API 管理基盤として選び API 中心のエコシステムで俊敏性を獲得したことが紹介されました。
