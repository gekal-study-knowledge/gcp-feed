"overview": |
  この日はストレージ基盤の刷新が目立ちました。Google Cloud のファーストパーティ NFS サービスである Filestore に、Google の分散ストレージシステム Colossus の上に直接構築されたクラウドネイティブなバックエンドストレージレイヤが組み込まれました。YouTube、Gmail、Gemini を支えるインフラの系譜を引き継ぐことで、従来の VM ベースのアーキテクチャを上回るスケーラビリティと運用効率が得られます。特に重要なのは容量と性能の分離で、IOPS を個別にプロビジョニングできるため、容量を過剰に確保せずにワークロードの需要へ合わせられます。Filestore CSI ドライバを介して GKE ワークロードへ高性能な永続ストレージを提供でき、GKE 向け Filestore マルチシェアを使えば単一インスタンスを最小 10GiB の共有へ分割できるため、大規模インスタンスをプロジェクト単位の小さな共有に割って数千の同時コンテナを支えられます。これが、複数の自律型 AI エージェントが並行して共通データセットを読み書きする「AI エージェント スウォーム」の共有ストレージという新しい用途につながります。リリースノートでは Datastream が Cloud SQL インスタンスの概要ページから自動フローでストリームを直接作成できるようになりました。事例では、SOC を 24 時間 365 日体制で運用する JBサービスが、SOAR に Google Threat Intelligence を組み込み、VirusTotal・Mandiant・Google Cloud のデータを統合した脅威情報でプロアクティブな阻止体制を実現したことが紹介されています。同社は SOC 業務に約 80 名、セキュリティ事業部全体で約 200 名を擁します。
