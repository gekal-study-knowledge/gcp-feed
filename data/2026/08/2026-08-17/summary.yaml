"overview": |
  この日はリリースノートのみでした。AlloyDB for PostgreSQL では MCP Toolbox for Databases を使って、可観測性の機能と高度なクエリインサイトを IDE から直接扱えるようになりました。Backup and DR では 2026 年 11 月 1 日から、強制保持で保護されたバックアップを含むバックアップボールトがあるプロジェクトに対して、プロジェクトレベルの lien が自動適用されることが告知されています。lien の不正な削除を防ぐため、Privileged Access Manager による多者承認を構成できます。Cloud CDN は RFC 9213 の CDN-Cache-Control レスポンスヘッダーをサポートし、ブラウザ側のキャッシュに影響を与えずにエッジキャッシュ向けのディレクティブを指定できるようになりました。
