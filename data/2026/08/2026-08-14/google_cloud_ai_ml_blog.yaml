    "id": "b9306c0cfe4dbfcf0f736564bfa1b749"
    "title": "Using BigQuery Graphs with measures for trusted agentic workloads"
    "link": "https://cloud.google.com/blog/products/data-analytics/bigquery-graphs-with-measures-for-trusted-agentic-workloads/"
    "published": "2026-08-14 02:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When enterprises transition from using simple chat assistants to autonomous, agentic workloads, they quickly run into a hard truth: Agents are prone to inaccurate insights when working with directly raw tables. </span></p>\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/graph-measures\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</strong></a><span style=\"vertical-align: baseline;\"> helps organizations move beyond flat, static tables to represent enterprises exactly how they exist in the physical world: as interconnected business entities with real-world dependencies. With the support of measures in BigQuery Graph (preview), we are unifying governed metrics with relationship mapping. This allows your agents to reason across complex dependencies captured in graphs with precision of measures.</span></p>\n<p><span style=\"vertical-align: baseline;\">Why relationships matter</span></p>\n<p><span style=\"vertical-align: baseline;\">Traditional data structures are blind to multi-hop business context, causing AI agents to make incorrect operational decisions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The concrete problem:</strong><span style=\"vertical-align: baseline;\"> If a retailer has an agent who is asked why winter jacket sales dropped 12% in Seattle, it can query flat tables to report the </span><span style=\"font-style: italic; vertical-align: baseline;\">what</span><span style=\"vertical-align: baseline;\"> (the 12% dip). But it fails at the </span><span style=\"font-style: italic; vertical-align: baseline;\">why</span><span style=\"vertical-align: baseline;\"> because it cannot trace the relational path: </span><span style=\"font-style: italic; vertical-align: baseline;\">Seattle orders</span><span style=\"vertical-align: baseline;\"> ➔ </span><span style=\"font-style: italic; vertical-align: baseline;\">distribution centers</span><span style=\"vertical-align: baseline;\"> ➔ </span><span style=\"font-style: italic; vertical-align: baseline;\">suppliers delayed by regional storms</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The risk of disjointed systems:</strong><span style=\"vertical-align: baseline;\"> Lacking relationship context, the agent suggests an irrelevant 15% markdown campaign, needlessly eroding margins. Furthermore, maintaining separate systems - where one team maps supplier relationships in a separate graph database while another maintains SQL metrics - forces your agent to stitch these stacks together at runtime. This process is slow, expensive, and leads to inconsistent KPI calculations.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Measures in BigQuery Graph solves this by letting you </span><strong style=\"vertical-align: baseline;\">map existing tables to a property graph in-place with zero ETL</strong><span style=\"vertical-align: baseline;\">. This unified setup enables a logical evolution of inquiry:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Metadata grounding</strong><span style=\"vertical-align: baseline;\"> establishes </span><span style=\"font-style: italic; vertical-align: baseline;\">what</span><span style=\"vertical-align: baseline;\"> data you have.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Business metrics (measures)</strong><span style=\"vertical-align: baseline;\"> calculate </span><span style=\"font-style: italic; vertical-align: baseline;\">how</span><span style=\"vertical-align: baseline;\"> your business performed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Relationship mapping (graph)</strong><span style=\"vertical-align: baseline;\"> uncovers </span><span style=\"font-style: italic; vertical-align: baseline;\">why</span><span style=\"vertical-align: baseline;\"> it happened.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Under the hood</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Historically, standard SQL joins during graph traversals duplicate rows, leading to incorrect aggregation calculations. BigQuery Graph solves this natively.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data modelers define a </span><code style=\"vertical-align: baseline;\">MEASURE</code><span style=\"vertical-align: baseline;\"> (like </span><code style=\"vertical-align: baseline;\">SUM</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">AVG</code><span style=\"vertical-align: baseline;\">) directly within the Property Graph DDL. Using standard SQL via the </span><code style=\"vertical-align: baseline;\">GRAPH_EXPAND</code><span style=\"vertical-align: baseline;\"> function and the </span><code style=\"vertical-align: baseline;\">AGG</code><span style=\"vertical-align: baseline;\"> aggregator, the engine resolves the structural graph paths </span><span style=\"font-style: italic; vertical-align: baseline;\">before</span><span style=\"vertical-align: baseline;\"> evaluating metrics. This ensures your agent is smart enough to know when it needs a </span><strong style=\"vertical-align: baseline;\">calculator (SQL)</strong><span style=\"vertical-align: baseline;\"> and when it needs a </span><strong style=\"vertical-align: baseline;\">map (graph)</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because public projects like </span><code style=\"vertical-align: baseline;\">bigquery-public-data</code><span style=\"vertical-align: baseline;\"> are strictly read-only, you must map the logical property graph inside your own project using a placeholder variable (</span><code style=\"vertical-align: baseline;\">YOUR_PROJECT_ID</code><span style=\"vertical-align: baseline;\">), while directly referencing the read-only public tables as nodes and edges.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- 1. Map the graph inside YOUR project \\r\\n\\r\\n\\r\\nCREATE OR REPLACE PROPERTY GRAPH `YOUR_PROJECT_ID.YOUR_DATASET.thelook_ecommerce_graph`\\r\\nNODE TABLES(\\r\\n  `bigquery-public-data.thelook_ecommerce.users` AS User\\r\\n    KEY(id)\\r\\n    LABEL User PROPERTIES(id, city, country),\\r\\n  `bigquery-public-data.thelook_ecommerce.orders` AS Order\\r\\n    KEY(order_id)\\r\\n    LABEL Order PROPERTIES(\\r\\n      order_id, \\r\\n      MEASURE(AVG(num_of_item)) AS avg_items_per_order,\\r\\n      MEASURE(SUM(num_of_item)) AS total_items\\r\\n    )\\r\\n)\\r\\nEDGE TABLES(\\r\\n  `bigquery-public-data.thelook_ecommerce.orders` AS OrderedBy\\r\\n    SOURCE KEY(order_id) REFERENCES Order(order_id)\\r\\n    DESTINATION KEY(user_id) REFERENCES User(id)\\r\\n    LABEL ORDERED_BY\\r\\n);\\r\\n\\r\\n-- 2. Query your new graph with standard SQL—using standard {Label}_{Property} column outputs\\r\\nSELECT\\r\\n  User_city AS city,\\r\\n  ROUND(AGG(Order_avg_items_per_order), 2) AS agg_avg_items,\\r\\n  ROUND(AGG(Order_total_items), 2) AS agg_total_items\\r\\nFROM GRAPH_EXPAND(&quot;YOUR_PROJECT_ID.YOUR_DATASET.thelook_ecommerce_graph&quot;)\\r\\nGROUP BY User_city\\r\\nORDER BY agg_total_items DESC\\r\\nLIMIT 10;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff5dd464410&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Democratizing graph intelligence in BigQuery Studio</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To make managing and deploying these relationship networks frictionless for both developers and business users, we have built native, intuitive operational tools directly into BigQuery Studio:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Visual graph modeler:</strong><span style=\"vertical-align: baseline;\"> A no-code, drag-and-drop interface inside BigQuery Studio that lets you visually build, edit, and map property graphs, nodes, and edges without writing complex DDL scripts manually.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_CXQhslw.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Conversational Analytics (CA) integration:</strong><span style=\"vertical-align: baseline;\"> Users can interact with the graph naturally. Instead of guessing table joins, Conversational Analytics agents navigate the deterministic, relationship-aware map of the graph, converting natural language questions into precise, boundary-constrained GoogleSQL or ISO GQL queries. This prevents model hallucinations and enforces semantic consistency.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_23oI53E.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Unified semantics: Native Looker integration</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To avoid maintaining fragmented logic stacks, business metrics must live at the data layer. By integrating </span><strong style=\"vertical-align: baseline;\">Looker (LookML)</strong><span style=\"vertical-align: baseline;\"> natively with BigQuery Graphs as</span><a href=\"https://docs.cloud.google.com/looker/docs/analytic-models\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">in-database analytic models</strong></a><span style=\"vertical-align: baseline;\">, you define logic once at the core:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Database-managed models (sql_analytic_model_name):</strong><span style=\"vertical-align: baseline;\"> Point Looker directly to your database-defined BigQuery Graph using </span><code style=\"vertical-align: baseline;\">sql_analytic_model_name</code><span style=\"vertical-align: baseline;\"> to map standard LookML dimensions and measures directly to your graph properties.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Looker-managed models (derived_analytic_model):</strong><span style=\"vertical-align: baseline;\"> Define your BigQuery Graph schema directly inside your LookML view using </span><code style=\"vertical-align: baseline;\">derived_analytic_model</code><span style=\"vertical-align: baseline;\">. Looker will dynamically generate and execute the SQL DDL statements to maintain the graph inside BigQuery.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Enterprise DevOps workflows:</strong><span style=\"vertical-align: baseline;\"> Manage your graph's entire lifecycle using the </span><strong style=\"vertical-align: baseline;\">Looker IDE, Git-based version control, and Continuous Integration (CI)</strong><span style=\"vertical-align: baseline;\">. Core KPIs (like Churn Rate) remain completely identical, verified, and trusted.</span></li>\n</ul></div>"
