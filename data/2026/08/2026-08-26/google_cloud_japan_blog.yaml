  "dd2e6926a10459d7ffdbddf4c5963cb1":
    "id": "dd2e6926a10459d7ffdbddf4c5963cb1"
    "title": "Gemini Enterprise、業界特化型ソリューション向けに進化"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/introducing-gemini-enterprise-for-financial-services/"
    "published": "2026-08-26 12:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 26 日に、Google Cloud blog に投稿された</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-gemini-enterprise-for-financial-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise for Financial Services</span></a><span style=\"vertical-align: baseline;\"> および </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-gemini-enterprise-for-legal\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise for Legal</span></a><span style=\"vertical-align: baseline;\"> の抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は本日、金融サービス</span><a href=\"https://cloud.google.com/ai/legal\"><span style=\"vertical-align: baseline;\">向け AI </span></a><a href=\"https://cloud.google.com/ai/financial-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise for Financial Services</span></a><span style=\"vertical-align: baseline;\"> および法務向け AI </span><a href=\"https://cloud.google.com/ai/legal\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise for Legal</span></a><span style=\"vertical-align: baseline;\"> の提供開始を発表しました。あらゆる専門家が日々の業務プロセスに合わせて Google AI を活用できるようにネイティブ設計し、安全でガバナンスの行き届いた Gemini Enterprise プラットフォーム上に構築した、業界特化型のパッケージ ソリューションのシリーズの第一弾です。 </span></p>\n<p><span style=\"vertical-align: baseline;\">各業界向けソリューションは、すぐに導入可能な領域特化型の AI 機能を備えています。これには調整済みのエージェント、多様なワークフローの管理を簡素化する専用の「スキル」、データコネクタ、特定業界向けに最適化したモデルなどが含まれます。 Google Cloud のインフラストラクチャと Gemini Enterprise プラットフォーム上に構築したこれらのソリューションは、エンタープライズ プラットフォームに求められるセキュリティ、ガバナンス、コンプライアンス、コスト マネジメント機能を提供します。顧客データ、ビジネス ルール、知的財産、カスタム エージェント、モデルの出力結果は組織固有のプライベートな状態を維持し、リスクマネジメント、監査ログ、ガバナンスをプラットフォーム アーキテクチャに直接組み込んでいます。さらに、インフラストラクチャやモデルからアプリケーション レイヤーに至る Google Cloud のフルスタック アプローチにより、組織はパフォーマンスとコストを最適化し、AI 投資の価値を最大限に引き出せます。 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Enterprise for Financial Services によるイノベーション、セキュリティ、コンプライアンスの融合 </strong></h3>\n<p><span style=\"vertical-align: baseline;\">資産の保護にスピードが求められる現在の市場において、汎用的な AI ツールには規制対象となる金融機関が求めるセキュリティ、リアルタイムな精度、データリネージが不足しています。また、手作業によるレポート作成によって、アナリストは迅速なインサイトの抽出ではなく、定型的なデータ収集に貴重な時間を費やしています。エージェンティック AI が業界標準となりつつある中、従来のマニュアル作業に依存したままの機関は、提案、価格設定、市場変化への対応において不利な状況に直面します。 </span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise for Financial Services は、モデルと金融サービス業界に必要なデータ、システム、専門知識、統制機能を統合するプラットフォームを提供し、これらの課題を解決します。 </span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の CEO である Thomas Kurian は次のように述べています。「金融分野の専門家は、特定のモデルやエコシステムにロックインされることなく、日常的に使用する IT システムと接続し、高度なセキュリティとコンプライアンスを備えた AI プラットフォームを求めています。 Gemini Enterprise for Financial Services により、検証可能なデータの説得力を備えた金融ワークフロー向けのエージェント機能を提供し、金融機関が AI イノベーションを確実な競合優位性へと変えられるよう支援します。」 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Enterprise for Financial Services の主な構成要素: </strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Financial Research エージェント:</strong><span style=\"vertical-align: baseline;\"> Google が管理するこのエージェントは、完全な説明可能性を備えたエンドツーエンドのリサーチを自動化します。50 以上の基礎的なスキルを備え、確信度スコア、明示的な手法、監査を容易にするデータ スナップショット、確実な検証を可能にする正確な情報源の引用を通じて、推論プロセスの透明性を提供します。ユーザーは Gemini Enterprise app から直接エージェントにアクセスできるほか、 Agent2Agent (A2A) API を介して既存のエージェント ワークフローに接続できます。エージェントは Model Context Protocol (MCP) 統合を介して多種多様なエンタープライズ データソースに直接接続し、個別のニーズに合わせたカスタマイズ可能なレポートやドキュメントを生成します。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">業界特化型金融スキル:</strong><span style=\"vertical-align: baseline;\"> 業界特化型スキルにより、ブランド ガイドラインの適用からレポートのフォーマット作成、特定データへのアクセスに至るまで、反復的な作業のショートカットを作成できます。プライベート エクイティの専門家、資産運用担当者、コンプライアンス チームのいずれが使用する場合でも、本ソリューションは信用リスク評価、ポートフォリオ モニタリング、市場ニュースの要約、調査型財務リサーチなど、多様なワークフローに適応します。スキルは Financial Research エージェント内で利用できるほか、お客様が自社で構築するエージェントからもアクセス可能です。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コネクタ:</strong><span style=\"vertical-align: baseline;\"> 本ソリューションは、CoinDesk Data &amp; Indices、Daloopa、Dun &amp; Bradstreet、FactSet、Finnhub、Fiscal.ai、Guidepoint、LSEG、Moody’s、MSCI、PitchBook、S&amp;P Global、SEC Edgar などのライセンス取得済みデータソースに対する 13 のセキュアな統合を提供し、顧客環境内で直接設定できます。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サードパーティ エージェントおよびパートナー エコシステム:</strong><span style=\"vertical-align: baseline;\"> Gemini Enterprise for Financial Services は、法人顧客のオンボーディング加速と Know Your Customer (KYC) コンプライアンス強化を実現する </span><a href=\"https://pantheon.corp.google.com/marketplace/product/prod-dnb-mp-saas-publicae85678/business-verification-a2a\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">D&amp;B Business Verification エージェント</span></a><span style=\"vertical-align: baseline;\">、ローン パックの完全性確認、書類抽出、キャピタル マーケット向けのデータ照合を行う </span><a href=\"https://pantheon.corp.google.com/marketplace/browse?filter=category:ai-agent&amp;_gl=1*2z2irk*_ga*MTEwMzUzMTQ0My4xNzg3NDIzOTQ2*_ga_WH2QY8WWF5*czE3ODc1NTI0OTMkbzIkZzEkdDE3ODc1NTI1MDMkajUwJGwwJGgw&amp;q=Flowx%20AI\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">FlowX エージェント</span></a><span style=\"vertical-align: baseline;\">、プライベート マーケットや法人融資チームによる複雑な財務分析の加速を支援する </span><a href=\"https://pantheon.corp.google.com/marketplace/product/obin-public/obin-financial-agent\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Obin Financial エージェント</span></a><span style=\"vertical-align: baseline;\">、多段階の分析、レポート作成、リサーチ ワークフローに対応する </span><a href=\"https://pantheon.corp.google.com/marketplace/product/kensho-groundings-poc/sp-global-data-retrieval-agent\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">S&amp;P Global Data Retrieval エージェント</span></a><span style=\"vertical-align: baseline;\">、複雑なエネルギーやサステナビリティに関するデータを財務ワークフロー向けの迅速なインサイトに変換する </span><a href=\"https://www.spglobal.com/sustainable1/en/solutions/horizons-agents\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">S&amp;P Global Energy Horizons エージェント</span></a><span style=\"vertical-align: baseline;\">など、 Google Cloud のパートナー エコシステムが提供する複数のサードパーティ エージェントへ簡単にアクセスできます。 </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise for Financial Services は、すでに CME Group や、 Financial Research エージェントの主要な設計パートナーである Deutsche Bank をはじめとするグローバル金融機関が導入しています。 </span><a href=\"https://www.googlecloudpresscorner.com/2025-12-08-BNY-Collaborates-with-Google-Cloud-to-Advance-its-Eliza-AI-Platform-with-Gemini-Enterprise\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BNY</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.citigroup.com/global/news/press-release/2026/citi-wealth-unveils-citi-sky-ai-powered-member-google-cloud-deepmind-technologies\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Citi Wealth</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/customers/lloydsbankinggroup?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lloyds Banking Group</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.googlecloudpresscorner.com/2025-10-09-Macquarie-Bank-Democratizes-Agentic-AI,-Scaling-Customer-Innovation-with-Gemini-Enterprise\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Macquarie Bank</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.googlecloudpresscorner.com/2025-10-09-SIGNAL-IDUNA-Rolls-Out-Gemini-Enterprise-for-over-10,000-Employees\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Signal Iduna</span></a><span style=\"vertical-align: baseline;\"> などの多くの大手金融機関が、生産性と効率性を向上させる先進的なエージェンティック ワークフロー ツールとして利用を進めており、 Gemini Enterprise の導入の勢いは急速に高まっています。 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">法務実務向けに特化した AI である Gemini Enterprise for Legal </strong></h3>\n<p><span style=\"vertical-align: baseline;\">企業が複雑なエンドツーエンド プロセスの自動化を進める一方で、汎用ツールには厳格な機密保持、倫理的障壁（エシカル ウォール）、検証済みの法的根拠、完全なデータ隔離など、法務作業が求める統制機能が欠けています。分断されたポイント ソリューションや単体のモデルを組み合わせてこの問題に対処しようとすると、システム統合にかかるコストが増大し、脆弱なワークフローにつながります。 </span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise for Legal は、これらの要件に焦点を当てて設計しており、契約レビュー、デュー デリジェンス、規制モニタリング、プライバシー リクエストなどの法務ワークフロー全体を実行する特化型スキル、パートナー エージェント、コネクタを提供します。主要なドキュメントおよび案件管理システムへのセキュアなコネクタを通じて、組織のエシカル ウォールを自動的に引き継ぎます。リサーチ出力はモデルの学習データだけでなく一次法源に基づき、組織のデータ、プレイブック、クライアント ファイル、交渉ポジションは常にプライベートな領域内に保護します。 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Enterprise for Legal の主な構成要素: </strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">法務エージェント向け特化型スキル:</strong><span style=\"vertical-align: baseline;\"> Gemini Enterprise for Legal には、準備書面の作成、引用の検証、コントラクト ライフサイクル マネジメント、規制動向の監視、データ 主体 アクセス リクエスト (DSAR) への対応など、複雑で高度な法務業務で AI エージェントを導く特化型スキルが含まれています。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コネクタ:</strong><span style=\"vertical-align: baseline;\"> 本ソリューションは、 Docusign、Everlaw、Harvey、iManage、Legora、NetDocuments、RelativityOne、Solve Intelligence、Thomson Reuters など、主要な法務業界プラットフォームへのセキュアな Model Context Protocol (MCP) 統合を提供します。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サードパーティ エージェントおよびパートナー エコシステム:</strong><span style=\"vertical-align: baseline;\"> Gemini Enterprise for Legal は、本プラットフォーム上で開発を行う法務技術プロバイダーのネットワークに加え、Accenture、Deloitte、Devoteam、Eudia、Factor Law、KPMG、Tribe AI、Valtech、Zazmic、Zencore、66degrees などの大手コンサルティングパートナーやシステム インテグレータへのスムーズなアクセスを提供します。 </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の CEO である Thomas Kurian は次のように述べています。「エージェンティック AI により、法務の専門家は過去の判例のリサーチ、複雑な論理展開の構築、定型作業の自動化を実現し、クライアントに大きな価値を提供できるようになります。一方で、これらのエージェンティック ワークフローのすべての側面が正確かつ事実に基づき、法的根拠に裏付けられていることが非常に重要です。 Gemini Enterprise for Legal は、現代の法務における複雑な実務に対応しながら、チームが自信を持って戦略的なアドバイスに集中できるよう、重要な根拠付けとガバナンス機能を提供します。」 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">提供時期 </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise for Financial Services および Gemini Enterprise for Legal は、本日より世界中の Google Cloud をご利用のお客様向けにプレビュー版として提供を開始します。ソリューションの詳細については、 Gemini Enterprise for Financial Services </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-gemini-enterprise-for-financial-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ</span></a><span style=\"vertical-align: baseline;\">および Gemini Enterprise for Legal </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-gemini-enterprise-for-legal\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。 </span></p>\n<p><strong style=\"vertical-align: baseline;\">Google Cloud について</strong></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、AI インフラストラクチャ、Gemini をはじめとする先進的なモデル、データ管理、マルチクラウド セキュリティ、開発ツール、さらにエージェントやアプリなど、強力で最適化された AI スタックを提供し、エージェント時代に向けた組織の変革を支援します。200 以上の国と地域で、信頼されるテクノロジー パートナーとして選ばれています。</span></p></div>"
  "3f6e1eca34cca9e5f8e164f937226550":
    "id": "3f6e1eca34cca9e5f8e164f937226550"
    "title": "Box が Gemini Embeddings 2 でマルチモーダル エンタープライズ エージェントを実現"
    "link": "https://cloud.google.com/blog/ja/topics/partners/box-ai-agents-gemini-embeddings-multimodal-enterprise-ai/"
    "published": "2026-08-26 11:00:00"
    "fetched": "2026-08-27 21:31:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 8 月 19 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/partners/box-ai-agents-gemini-embeddings-multimodal-enterprise-ai?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ コンテンツ管理は、クラウド移行の時代以来、最も大きなアーキテクチャの転換期を迎えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">長年にわたり、企業は財務モデル、臨床試験プロトコル、M&amp;A デュー デリジェンス ルーム、エンジニアリング スキーマ、法令遵守ハンドブックなど、数兆ギガバイトに及ぶ重要なデータを Box に保存してきました。これまでは、テキストベースの検索と検索拡張生成（RAG）によって、これらのリポジトリ内の膨大なナラティブ ナレッジが効果的に活用され、エンタープライズ AI インテリジェンスの強力かつ非常に効果的なベースラインが確立されてきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">従来の RAG アーキテクチャはテキスト処理に優れていますが、エージェントの時代にはそれ以上のものが求められます。次なる論理的な進化は、このフレームワークを拡張して、テキストと並存する本質的にマルチモーダルで、高度な空間情報や構造を持つ要素を捉えることです。テキスト エンベディングは文章のインデックス作成に優れていますが、マルチモーダル アーキテクチャは、これまでにない画期的な機能を実現します。たとえば、財務表における厳密な行と列のセマンティクスを保持したり、臨床データのような視覚的情報を解釈したり、複数ページにわたるフローチャートのロジックを空間レイアウトを維持したままマッピングしたりすることが可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">あらゆるデジタル コンテンツに対応する次世代の機能を提供するため、Google Cloud と Box は </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/embedding-2\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Multimodal Embeddings 2</span></a><span style=\"vertical-align: baseline;\"> を活用して</span><strong style=\"vertical-align: baseline;\">高度なマルチモーダル機能を Box の Agentic Platform に統合</strong><span style=\"vertical-align: baseline;\">し、業界をリードする Box のインテリジェント コンテンツ管理プラットフォームと Google Cloud の高度な AI エンべディングを融合させています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エンベディングの改善によるメリット: ドキュメント コンテンツの次元の拡張</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">視覚的および空間的なジオメトリの保持</strong><span style=\"vertical-align: baseline;\">: 複数列の表や財務マトリックスなどの複雑なドキュメント要素は、その空間的なレイアウトによって意味を成しています。これらの要素をフラットなテキスト文字列に変換すると、列ヘッダーと対応するデータポイントとの関連付けが失われてしまうおそれがあります。マルチモーダル エンベディングにより、システムは人間とまったく同じようにドキュメントを解釈できるようになり、空間的な位置関係の整合性が維持されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">視覚的なモダリティの解明</strong><span style=\"vertical-align: baseline;\">: 企業のドキュメントには、技術的な図表、プロセス フローチャート、ブランディング アセット、製品写真などの視覚的なインジケーターが多数含まれています。マルチモーダル機能により、これらの要素は検索システムにとって不可視なものではなくなり、ユーザーは画像とテキストを組み合わせた同時検索が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド ファイル形式の接続</strong><span style=\"vertical-align: baseline;\">: 実際のビジネス ワークフローが、単一のドキュメント形式で完結することはほとんどありません。エージェントは、PDF ポリシー、ログを追跡するスプレッドシート、プレゼンテーション資料を相互参照する必要がある場合があります。マルチモーダル エンベディングによって RAG を拡張することで、これら多様な形式を横断した統一的な理解が可能になります。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">アーキテクチャ ソリューション: Gemini Multimodal Embeddings 2</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/embedding-2\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Multimodal Embeddings 2</span></a><span style=\"vertical-align: baseline;\"> は、テキスト、ラスター画像、ドキュメント ページ、レンダリングされたスプレッドシートの表、ビジュアル チャートを同一のセマンティック表現空間に埋め込むことができる、統合されたマルチモーダル ベクトル空間を実現します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GIF_1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/image_bu28HMu.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">gemini-embeddings-2 によって実現される主なプロダクト機能:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クロスモーダル検索（テキストからビジュアル / ビジュアルからテキスト）</strong><span style=\"vertical-align: baseline;\">: 自然言語クエリにより、手動のタグ付けをすることなく、膨大なスライド ライブラリから特定のチャートや図解といったピンポイントなビジュアル要素を検索および抽出できるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レイアウトを考慮したドキュメント エンベディング</strong><span style=\"vertical-align: baseline;\">: ファイルを任意のテキスト ブロックに分割するのではなく、ドキュメント ページのレンダリングを直接埋め込むことで、視覚的な階層構造、コールアウト ボックス、構造的なコンテキストをそのまま保持できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">異種形式のブリッジ</strong><span style=\"vertical-align: baseline;\">: モダリティ固有の構造情報を損なうことなく、.docx、.xlsx、.pdf、.pptx、.png、.csv 間のコンテンツをシームレスにつなぐネイティブ サポート。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">マルチモーダル エンタープライズ エージェントの 3 つのコアパターン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Box 内でマルチモーダル エンベディングを活用することで、従来の RAG を拡張して複雑なビジュアル ワークフローをサポートするための、主要な 3 つの独自デザイン パターンを見出しました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">パターン 1: 複雑な財務レポートと分析レポート</strong></p>\n<p><strong style=\"vertical-align: baseline;\">課題</strong></p>\n<p><span style=\"vertical-align: baseline;\">企業の財務、調査、監査の各チームは、高度に構造化されたドキュメントを分析します。こうしたドキュメントでは、埋め込みの表、成長チャート、脚注アノテーションの中に重要なデータが存在しています。テキストのみのインデックス登録では、これらの数字がコンテキストから分離されるため、自動分析が困難になります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">マルチモーダルの利点</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">構造の整合性</strong><span style=\"vertical-align: baseline;\">: エンベディング モデルは表やグラフの物理的な構造を捉えるため、財務エージェントは、どの列ヘッダーが特定の指標の行に対応しているのかを正確に理解できるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">視覚的な傾向分析</strong><span style=\"vertical-align: baseline;\">: エージェントは、記述された要約と、付随する棒グラフや折れ線グラフの視覚的な傾向を相互参照し、文書内の主張とソースデータとの不一致を特定して指摘できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンテキストに応じたソースの特定</strong><span style=\"vertical-align: baseline;\">: ユーザーは複雑なポートフォリオに対してクエリを実行し、特定の指標を裏付ける正確なページ、表、グラフを即座に取得できます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_9rTykxw.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">パターン 2: マルチモーダルによる臨床意思決定支援と診断補助</strong></p>\n<p><strong style=\"vertical-align: baseline;\">課題</strong></p>\n<p><span style=\"vertical-align: baseline;\">医療および臨床環境では、重要な患者データが、外部の外観写真（視覚的証拠）、顕微鏡の病理スライド（検査レポート）、構造化されたリスク マトリクス（トリアージ グリッド）など、さまざまな非構造化の視覚およびテキスト形式に断片化されています。従来のテキストベースのシステムや個別の分析ツールでは、こうしたクロスモーダルな関係性を同時に統合して理解することはできません。その結果、重要な診断の遅れを招いたり、生命に直結する処置上の合併症を見逃したりするリスクが生じます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">マルチモーダルの利点</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クロスモーダルな臨床情報の統合</strong><span style=\"vertical-align: baseline;\">: 臨床写真、組織病理画像、トリアージ グリッドを同一のスペースにインデックス化することで、身体症状と細胞レベルの検査エビデンスを同時に評価します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">微細な異常の特定</strong><span style=\"vertical-align: baseline;\">: 顕微鏡下で観察される微細な視覚パターン（寄生虫の嚢胞壁など）を医学的知識と結び付け、希少な疾患を迅速に特定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">リスクを考慮した意思決定支援</strong><span style=\"vertical-align: baseline;\">: 得られた所見をトリアージ フレームワークと照合し、生命を脅かすアナフィラキシー ショックなど、患者の差し迫ったリスクについて即座に警告を発します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_ZPNWwdP.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">パターン 3: ドキュメント間のマルチモーダル統合とデータ調整</strong></p>\n<p><strong style=\"vertical-align: baseline;\">課題</strong></p>\n<p><span style=\"vertical-align: baseline;\">企業内の情報は、接続されていないファイルや形式（PDF の議事録、Excel のグラフ、PNG のチラシ、メールスレッドなど）に断片化されています。従来のツールはこれらのファイルを個別に分析するため、独立したドキュメントを横断して詳細を確認したり、データの矛盾を解消したりする際に、情報を結びつけて全体像を把握することができません。</span></p>\n<p><strong style=\"vertical-align: baseline;\">マルチモーダルの利点</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ファイル間の統合</strong><span style=\"vertical-align: baseline;\">: 完全に異なる形式（PDF、スプレッドシート、画像、メール）の情報を同時に結び付けて、複雑なビジネス クエリに回答します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">不整合の解決</strong><span style=\"vertical-align: baseline;\">: アセット間の不整合を特定して解消します。たとえば、最新の財務スプレッドシートと照合することで、画像内に記載された古い価格情報を見つけ出すといったことが可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">画像とテキストの照合監査</strong><span style=\"vertical-align: baseline;\">: 画像やスキャンされたファイルをテキストベースの記録と照らし合わせ（署名済みの PDF 契約書を法的レビューのメールで検証するなど）、条項の欠落や変更箇所を特定します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_IAwu96l.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">エージェント型エンタープライズ コンテンツ管理の未来</strong></h4>\n<p><span style=\"vertical-align: baseline;\">gemini-embeddings-2 と Box のエージェント プラットフォームのインテグレーションは、次世代のコンテンツ インテリジェンスを向上させる重要な新機能です。マルチモーダル エンベディングにより、Box は従来の検索の枠を超え、能動的かつインテリジェントなコラボレーションへと進化します。Box のインテリジェント コンテンツ管理プラットフォームは、エンタープライズ AI インフラストラクチャの根本的な転換を体現するものです。単なる受動的なドキュメント ストレージから、ガバナンスの効いたセマンティック インデックスによる推論レイヤに移行することで、AI エージェントは、既存のコンプライアンスとセキュリティ管理を維持したまま、コンテンツの照会や相互参照、アクションの実行を自在に行えるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">マルチモーダル エンベディングと、検索、メタデータ抽出、調査、分析、作成にわたるネイティブ AI エージェント スイートを搭載した Box により、組織は、古い価格データの特定、契約条項の期限切れ、ドキュメント間の矛盾といったインサイトを、ビジネスリスクが顕在化する前にプロアクティブに抽出できるようになります。金融サービス、ライフ サイエンス、法務業務といった複雑性の高い業界では、マルチモーダル理解が競争上の必須要件となっています。Box なら、テキスト、表、グラフ、画像を横断して推論することが可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">より広範なエンタープライズ AI エコシステムとの相互運用を前提に設計された Box は、ガバナンスの効いた一元的なコンテンツ基盤として機能します。これにより、AI を活用したあらゆるワークフローが、承認済みで監査可能な企業データに基づいていることが保証されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">考えてみれば、企業のデータ環境はもともとマルチモーダルなものでした。そして今、それを最大限に活用するためのテクノロジーが現実のものとなりました。gemini-embeddings-2 とのインテグレーションにより、Box は、ユーザーが非構造化エンタープライズ コンテンツからこれまでにない価値を引き出せるよう支援します。マルチモーダル ファーストのアーキテクチャ、厳格な精度ベンチマーク、そして監査対応のグラウンディングを積極的に取り入れるプロダクト リーダーが、企業の生産性とイノベーションにおける次なる波を牽引することになるでしょう。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">このプロジェクトに携わってくださった Ken Ikeda、Afshaan Mazagonwalla、Samip Thakkar の各氏に感謝いたします。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、エージェント プロダクト コンサルティング リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sandhya Patil</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Box、スタッフ AI プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Darryl Sladden 氏</strong></p></div>"
