  "204bb5352fa6db602a2c408b9073815e":
    "id": "204bb5352fa6db602a2c408b9073815e"
    "title": "Dynamic capacity management for AI infrastructure"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management/"
    "published": "2026-08-26 22:30:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The internet connected billions of people and mobile devices, putting computers in every hand. Now, we’re in the middle of the next big technology shift, deploying millions of autonomous AI agents to work alongside employees and end users. Today, we announced </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new FinOps controls for Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> to help organizations manage project-level AI spend and eliminate token shock. But the sheer scale of the agentic era is placing new constraints at every layer of the stack, including infrastructure. AI workloads are notoriously difficult to architect, resource-intensive, and bursty, which can also lead to scaling bottlenecks and large pools of underutilized — or misutilized — compute resources. </span></p>\n<p><span style=\"vertical-align: baseline;\">Organizations need insights to help them extract more value from their infrastructure investments. </span><strong style=\"vertical-align: baseline;\">In this blog, we outline best practices for </strong><strong style=\"font-style: italic; vertical-align: baseline;\">dynamic capacity management </strong><span style=\"vertical-align: baseline;\">— scheduling and utilization strategies to help you run enterprise and AI applications on a single, flexible foundation with predictable cost and performance. These capabilities are designed to augment our on-demand, Spot and committed use discount (CUD) consumption models, which provide flexible pricing and discounting for your workloads. Let’s jump in.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Here's a quick summary</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Three ways you can implement dynamic capacity management:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Schedule capacity for planned events.</strong><span style=\"vertical-align: baseline;\"> Schedule mission-critical resources (GPUs, TPUs and select VM families) ahead of planned events using </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/future-reservations-calendar-mode-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">calendar mode</span></a><span style=\"vertical-align: baseline;\">, or optimize costs for batch jobs with flexible start times using </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dws\"><span style=\"text-decoration: underline; vertical-align: baseline;\">flex-start</span></a><span style=\"vertical-align: baseline;\"> mode in Dynamic Workload Scheduler. Once you obtain the capacity, those resources are guaranteed for the specified duration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Maintain service continuity by creating a fallback plan for every application.</strong><span style=\"vertical-align: baseline;\"> Define automated, prioritized hardware fallback lists using </span><a href=\"https://docs.cloud.google.com/compute/docs/instance-groups/about-instance-flexibility\"><span style=\"text-decoration: underline; vertical-align: baseline;\">managed instance groups</span></a><span style=\"vertical-align: baseline;\"> (MIGs) so your apps automatically pivot to the next approved compute option when your preferred option isn’t available.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automate your entire capacity management lifecycle on a single, adaptive control plane.</strong><span style=\"vertical-align: baseline;\"> Google Kubernetes Engine (GKE) provides an agent-native environment to orchestrate the entire process — from fallback lists using </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-custom-compute-classes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Custom ComputeClasses</span></a><span style=\"vertical-align: baseline;\">, to granular hardware slicing with </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-dynamic-resource-allocation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dynamic resource allocation</span></a><span style=\"vertical-align: baseline;\">, so agents can rapidly spin up in secure sandboxes and containers while it dynamically reallocating resources on the fly.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Why architectural flexibility matters</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ninety percent of enterprises want to deploy agents within the next three years, but only 17% of IT leaders feel confident their current IT setup can handle the load.</span><span style=\"vertical-align: baseline;\"> Because these workloads have unique performance needs, organizations are racing to adopt specialized infrastructure, including accelerators (GPUs, TPUs) and CPUs with customized compute, memory, and storage ratios. However, agents also require access to enterprise applications and databases — often at a volume and scale that vastly exceeds typical human usage. Handling the intense demands of both agents and the applications they interact with requires a dynamic infrastructure. Infrastructure teams can leverage custom-designed processors like Google’s Axion to meet these needs, but hardware isn’t a complete solution. They also need ways to use that infrastructure wisely, solving execution inefficiencies to enable more flexibility across the stack.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How to overcome infrastructure constraints</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Achieving this kind of flexibility </span><span style=\"vertical-align: baseline;\">requires a two-pronged approach: securing resources for the demand you can predict, and building automation to respond to the demand you can't. Combining the two, you can preschedule capacity for planned events and your infrastructure can adapt to unexpected changes without manual intervention.</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Schedule capacity for planned events</strong></p>\n<p><span style=\"vertical-align: baseline;\">You can secure mission-critical capacity ahead of scheduled milestones, offline training, or anticipated demand surges using </span><strong style=\"vertical-align: baseline;\">Dynamic Workload Scheduler</strong><span style=\"vertical-align: baseline;\">. By scheduling the resources you need up front, you optimize your spend and ensure you get access to the compute resources you need. Dynamic Workload Scheduler supports hardware accelerators (TPUs and GPUs) and select CPUs with two distinct modes:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flex-start mode</strong><span style=\"vertical-align: baseline;\">: Use this for latency-tolerant workloads like batch processing, model training, or offline fine-tuning. Instead of requiring resources immediately, you submit a defined duration request and the system intelligently queues your job, provisioning the resources as soon as capacity becomes available. This maximizes cost-efficiency and drastically improves your ability to obtain high-demand accelerators.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Calendar mode</strong><span style=\"vertical-align: baseline;\">: Use this for mission-critical, time-bound events like a major product launch, a scheduled migration, or a seasonal traffic surge. By specifying the exact start and end dates of your event, you create a future reservation. This guarantees the requested capacity will be available when the event begins.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_SEuNvWu.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">Maintain service continuity by creating a fallback plan for every application</strong></p>\n<p><span style=\"vertical-align: baseline;\">Not every spike in traffic is predictable. You also need to plan for unexpected traffic from, say, a breaking news cycle or a sudden market shift that drives a surge in user activity. To help your services get the resources they need without interruption, you need a fallback plan — an automated, prioritized sequence of acceptable hardware configurations. This strategy:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Decouples your workloads from a single VM shape, size, or configuration. This allows them to run without manual intervention if your preferred option is unavailable</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Allows you to execute a progressive tech refresh by adopting the newest VM generations as your primary choice while keeping older generations as an automatic fallback option.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If you run non-containerized workloads on Google Compute Engine, you can dynamically manage capacity with </span><a href=\"https://docs.cloud.google.com/compute/docs/instance-groups/about-instance-flexibility\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">instance flexibility</strong></a><strong style=\"vertical-align: baseline;\"> in managed instance groups (MIGs) and </strong><a href=\"https://docs.cloud.google.com/compute/docs/instances/multiple/create-in-bulk-with-instance-flexibility\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">bulk VM creation</strong></a><span style=\"vertical-align: baseline;\">. Instance flexibility lets you specify multiple machine types for your VM instances rather than being limited to a single machine type.</span></p>\n<p style=\"padding-left: 40px;\"><strong style=\"font-style: italic; vertical-align: baseline;\">How it works:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">If your preferred machine type is temporarily unavailable, the MIG automatically provisions a compatible alternative from your list based on real-time capacity. When combined with location flexibility — by specifying multiple zones your MIGs can search within a region — you can drastically improve your provisioning success rate. If your MIGs use Spot VMs, Compute Engine automatically integrates with Spot capacity signals to prioritize machine types that offer longer estimated uptimes and lower risk of pre-emption.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_lW2ljtl.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">You can also </span><strong style=\"vertical-align: baseline;\">extend instance flexibility to your block storage layer </strong><span style=\"vertical-align: baseline;\">by setting baseline disk defaults and configuring disk overrides so your storage adapts when a VM falls back to a different machine type. </span></p>\n<p style=\"padding-left: 40px;\"><strong style=\"font-style: italic; vertical-align: baseline;\">How it works:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Most of the time you can simply rely on our </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks#machine-type-support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">default options</span></a><span style=\"vertical-align: baseline;\">, omitting ‘disk type’ from the instance template entirely. However, for data disks that will outlive their associated VMs, it’s possible to enable a fast, durable </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> across multiple VM generations.</span></p>\n<p><span style=\"vertical-align: baseline;\">While Compute Engine provides instance flexibility for organizations working with virtual machines, </span><strong style=\"vertical-align: baseline;\">GKE goes a step further and automates the entire capacity lifecycle from a single control plane</strong><span style=\"vertical-align: baseline;\">. With GKE custom </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-compute-classes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ComputeClasses</span></a><span style=\"vertical-align: baseline;\">, platform teams can design multi-dimensional fallback lists, automatically combine different VM machine families, sizes, and ratios, scale across multiple zones, and shift between on-demand and Spot VMs. By using Dynamic Workload Scheduler as a capacity target, and custom ComputeClasses to define the policy and priority, you can fully automate the capacity management lifecycle.</span></p>\n<p style=\"padding-left: 40px;\"><strong style=\"vertical-align: baseline;\">How it works: </strong><span style=\"vertical-align: baseline;\">Once you’ve set up ComputeClasses, GKE automatically detects when a preferred node configuration is unavailable and falls back to your pre-approved alternative options in order of priority. When active migration is enabled, GKE gracefully migrates workloads back to higher-priority node configurations as capacity becomes available. For short-lived disks such as boot disks, GKE dynamically picks the right </span><a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks#machine-type-support\"><span style=\"text-decoration: underline; vertical-align: baseline;\">defaults</span></a><span style=\"vertical-align: baseline;\"> based on the instance family. However, for long-term disks that will outlive the VM, you can use Hyperdisk.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_bBzgKas.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Another GKE feature, </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-dynamic-resource-allocation\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">dynamic resource allocation</strong></a><span style=\"vertical-align: baseline;\">, helps eliminate wasteful, all-or-nothing hardware assignments by letting developers define advanced rules that dictate how resources are consumed.</span></p>\n<p style=\"padding-left: 40px;\"><strong style=\"vertical-align: baseline;\">How it works:</strong><span style=\"vertical-align: baseline;\"> Instead of claiming an entire GPU or TPU, your application specifies its exact parameters — such as total memory or number of cores — and the system allocates the perfect slice of hardware, helping to maximize utilization and reduce costs. </span></p>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\"> </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_RtJb1xh.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Take the next step toward dynamic infrastructure</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Scaling AI shouldn’t mean linearly scaling your infrastructure budget or accumulating more tech debt. As these examples show, the right tools can help you overcome constraints and dramatically alter the value you get from your compute investments. Here are three steps to get started:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Audit your workloads for immediate cost-savings:</strong><span style=\"vertical-align: baseline;\"> Identify any applications currently tightly coupled to a single VM family, machine type, or availability zone, and map out viable alternative hardware shapes. Look beyond your existing configurations to evaluate </span><a href=\"https://cloud.google.com/products/compute?e=48754805&amp;hl=en#choose-the-right-vm\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new compute options</span></a><span style=\"vertical-align: baseline;\"> that might better serve or act as alternatives based on your workload-level objectives. Then use Compute Engine </span><a href=\"https://docs.cloud.google.com/compute/docs/instance-groups/about-instance-flexibility\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MIGs</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/multiple/create-in-bulk-with-instance-flexibility\"><span style=\"text-decoration: underline; vertical-align: baseline;\">bulk VM creation</span></a><span style=\"vertical-align: baseline;\"> or GKE Custom ComputeClasses to adopt them automatically, integrating them into your fallback lists.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Commit to a minimum spend for deeply discounted prices:</strong><span style=\"vertical-align: baseline;\"> Receive automatic discounts for sustained use, or up to 63% off when you sign up for </span><a href=\"https://docs.cloud.google.com/compute/docs/instances/committed-use-discounts-overview#spend_based\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute flexible committed use discounts</span></a><span style=\"vertical-align: baseline;\">, where your discount is tied to the resources you use regardless of the specific machine type or location.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Engage your account team:</strong><span style=\"vertical-align: baseline;\"> Reach out to your Google Cloud account team to craft a tailored capacity management strategy and configure your automated fallback lists.</span></p>\n</li>\n</ol></div>"
  "75a227eaeb71942b4f77747c6a49e9bc":
    "id": "75a227eaeb71942b4f77747c6a49e9bc"
    "title": "FinOps for the AI era: New flexible billing and cost controls for agents"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/flexible-billing-and-cost-controls-for-agents-on-google-cloud/"
    "published": "2026-08-26 22:30:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong><span style=\"vertical-align: baseline;\">Editor's note:</span></strong><em><span style=\"vertical-align: baseline;\"> A product image was updated after initial publication.</span></em></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">As AI takes on more complex work, business leaders face a new challenge: enabling rapid innovation using agents while protecting their margins and budgets. To get a real return on AI, financial operations (FinOps) and cost management must evolve alongside technology, giving you clear visibility, proactive cost controls, and flexible payment models that fit your needs. </span></p>\n<p><span style=\"vertical-align: baseline;\">That’s why today we’re introducing </span><strong style=\"vertical-align: baseline;\">expanded billing flexibility and new cost management tools for agent workloads </strong><span style=\"vertical-align: baseline;\">across Gemini Enterprise and developer tools like </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity in Gemini Enterprise </span></a><span style=\"vertical-align: baseline;\">and </span><a href=\"http://d.android.com/gemini-in-android\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flexible payment options:</strong><span style=\"vertical-align: baseline;\"> You can mix our existing, predictable per-user seat subscriptions with a </span><a href=\"https://cloud.google.com/gemini-enterprise#gemini-enterprise-app-editions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new pay-as-you-go option</span></a><span style=\"vertical-align: baseline;\"> in Gemini Enterprise app that lets you run agent workloads without hitting quota limits mid-task.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Developer access, one place to manage your AI: </strong><span style=\"vertical-align: baseline;\">Google Antigravity and Android Studio AI use is now included in your Gemini Enterprise subscription (available for select customers and rolling out broadly soon), giving your developers more without giving you more to manage. Usage across Antigravity, the platform, and the app rolls up into a single view instead of separate licenses and billing silos.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pay less as your usage grows:</strong><span style=\"vertical-align: baseline;\"> If your AI workloads are steady or climbing, </span><a href=\"https://docs.cloud.google.com/docs/cuds-flexible-savings-plans\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Flexible Savings Plans</span></a><span style=\"vertical-align: baseline;\"> let you commit to a monthly spend you're comfortable with and take 10–20% off your token costs — no minimums, no maximums, and no new billing silo to manage.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Consolidated spend guardrails: </strong><span style=\"vertical-align: baseline;\">You can now set hard monthly caps on AI spend and projects, estimate agent runtime costs, and catch sudden budget spikes before they hit your invoice.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Give your teams flexibility without losing control over spend in Gemini Enterprise</span></h2>\n<p><span style=\"vertical-align: baseline;\">Every organization operates differently. Even within the same business, no two teams consume AI </span><span style=\"vertical-align: baseline;\">in the same way</span><span style=\"vertical-align: baseline;\">. Your business users might rely on steady, everyday productivity tools. Meanwhile, your technical teams might run AI agent workloads in bursts. </span></p>\n<p><span style=\"vertical-align: baseline;\">To help align costs with how work actually gets done, you can combine these payment and licensing choices and features across Gemini Enterprise:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Option</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">How it works</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Why it helps optimize spend</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini Enterprise app per-user seat subscription</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">You pay a fixed monthly fee per user, which includes daily quota pools that are shared across your entire project.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Predictable budgeting.</strong><span style=\"vertical-align: baseline;\"> It provides finance teams with a clear, steady monthly baseline for teams with consistent daily productivity needs.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">[New] Gemini Enterprise app pay-as-you-go consumption edition</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">*available for select customers and rolling out broadly soon</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">There is no upfront commitment or base subscription fee, meaning you pay strictly for the compute and tokens your teams consume at standard model API rates.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Only pay for what you use.</strong><span style=\"vertical-align: baseline;\"> Your spend scales up and down automatically with real usage, ensuring you never pay for empty seats when project demand dips.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">[New for Antigravity in Gemini Enterprise] Consolidated pooled quotas</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Daily usage allowances are pooled project-wide, letting business apps, developer tools, and custom agents draw from the same shared quota. Pooled quota is always exhausted first, and admins can control if overages are allowed, at which point it’s charged at pay-as-you-go rates. </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Maximized resource usage:</strong><span style=\"vertical-align: baseline;\"> Unused daily allowances from business users automatically absorb heavy developer or custom API agent demands, so no quota allowance goes to waste.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">[Coming soon] </strong><strong style=\"vertical-align: baseline;\">Deferred execution pricing</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">*available for select workloads soon</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Mark eligible agent workloads as deferred, and our intelligent scheduler in the Gemini Enterprise Agent Platform runs them during off-peak capacity windows.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Substantial discounts for work that can wait: </strong><span style=\"vertical-align: baseline;\">AI workloads can run on separate, off-peak capacity, you pay up to half the inference cost and bypass standard quota limits entirely – letting you run substantially more agentic volume under the same budget.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">Equip developers with advanced agentic tooling under a single Gemini Enterprise subscription</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We’re rolling out access to </span><strong style=\"vertical-align: baseline;\">Google Antigravity in Gemini Enterprise</strong><span style=\"vertical-align: baseline;\">, an agent-first developer platform that brings powerful agentic coding and agent-building capabilities to technical teams, included with Gemini Enterprise subscriptions for </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/ai-developer-tools-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">eligible customers</span></a><span style=\"vertical-align: baseline;\">. In addition, Android developers can leverage the Google Antigravity quota included in their Gemini Enterprise subscriptions natively in </span><a href=\"http://d.android.com\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</strong></a><span style=\"vertical-align: baseline;\">, the agentic IDE for professional Android development.</span></p>\n<p><span style=\"vertical-align: baseline;\">To be more efficient with agentic coding costs, we are pooling developer tools quota included in each Gemini Enterprise subscription and making it available across the whole Google Cloud project so your teams can benefit from the capacity you’re already purchasing. Your developers get access to advanced agentic tools, while you maintain centralized governance and control.</span></p>\n<p><span style=\"vertical-align: baseline;\">For a closer look into what’s new with Antigravity in Gemini Enterprise and how customers are putting it to work in production, take a look at our </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">deep-dive</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Budget smarter with Gemini Enterprise Flexible Savings Plans (FSPs) </strong></h3>\n<p><span style=\"vertical-align: baseline;\">If your organization has steady or growing AI workloads, Gemini Enterprise Flexible Savings Plans offer a simple, spend-based commitment model across Gemini Enterprise usage. FSPs are designed to lower token costs while keeping budgets flexible:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Programmatic savings: </strong><span style=\"vertical-align: baseline;\">Receive 10% off for 1-year or 20% off for 3-year commitments for monthly spending across Gemini Enterprise.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tailored to your pace</strong><span style=\"vertical-align: baseline;\">: With no minimum or maximum spend requirements, you can determine a monthly commitment that fits your current traffic and make adjustments as your usage increases over time. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise Agreement (EA) friendly:</strong><span style=\"vertical-align: baseline;\"> FSP spend seamlessly draws down against your existing Google Cloud EA, giving lines of business dedicated budget control without fragmenting your broader cloud commitments.</span></p>\n</li>\n</ul>\n<p><a href=\"https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Flexible Savings Plans</span></a><span style=\"vertical-align: baseline;\"> are already available for self-serve customers and customers on enterprise agreements.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Give your teams the freedom to build while maintaining financial discipline</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As a leader, your goal isn't to restrict the potential value of AI  – it's to remove the financial and operational risk that you face without managed AI costs. You should be able to give engineering, marketing, and operational teams the freedom to innovate with agents, but you should also have the visibility to trust what those agents are doing and the safety nets to protect your budget.</span></p>\n<p><span style=\"vertical-align: baseline;\">To bridge this gap, we've built robust, native governance tooling directly into the Google Cloud Billing Console around three simple goals:</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. Plan before you scale: </strong><span style=\"vertical-align: baseline;\">The </span><a href=\"https://cloud.google.com/products/calculator\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Pricing Calculator</span></a><span style=\"vertical-align: baseline;\"> lets you estimate anticipated costs in Gemini Enterprise across per-user licenses, developer tools, and background agent runtimes. It gives you the numbers you need to build clear business cases upfront before project work begins</span><strong style=\"vertical-align: baseline;\">.</strong></p>\n<p><strong style=\"vertical-align: baseline;\">2. Enforce boundaries without micromanaging spend: </strong><span style=\"vertical-align: baseline;\">Instead of spending time tracking daily usage variations across project teams, let these tools do the monitoring for you:</span></p>\n<ol start=\"2\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Early anomaly detection: </strong><span style=\"vertical-align: baseline;\">If a project’s AI spending trends higher than normal, the system flags the deviation with root cause analysis and pinpoints the top 3 SKUs driving the increase so you can see exactly what changed.</span></p>\n</li>\n</ul>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 Jul22_Anomalies_Image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_Jul22_Anomalies_Image1.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Billing Console showing an Early Anomaly alert with the Root Cause Analysis (RCA) breakdown highlighting the driving SKUs</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Project-level spend caps:</strong><span style=\"vertical-align: baseline;\"> When a project needs defined financial boundaries, you can set a firm monthly spend limit directly in the Google Cloud Billing Console. If a project hits its limit, the agent's API calls temporarily pause – protecting your budget without affecting the rest of your production infrastructure. Automated email alerts at 50%, 80% and 100% of the budget keep you informed of your progress against the spend limit. </span></li>\n</ul>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Overage controls:</strong><span style=\"vertical-align: baseline;\"> If a spend cap triggers, you can choose to resume work with a single click in the console. Alternatively, if your priority is continuous operation, you can turn on overages so excess usage smoothly transitions to consumption rates, which can draw directly against your FSP to keep overage unit costs heavily discounted.</span></li>\n</ul>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 PAYG Overage Enabled\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_PAYG_Overage_Enabled.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Enabling overage pay-as-you-go for a project.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">3. Get visibility into business value:</strong><span style=\"vertical-align: baseline;\"> Use centralized billing reports paired with the FinOps agent to generate natural-language cost insight summaries of where your budget went, making it simple to show ROI to leadership.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Cost overview FinOps\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Billing_overage_-_dashboard_-_new_afternoo.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AI spending reporting in Google Cloud Console</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Go deeper with AI cost optimization</span></h3>\n<p><span style=\"vertical-align: baseline;\">To build a full-stack FinOps strategy that optimizes the cost, latency, and performance of your models and infrastructure, explore our detailed architecture specifications and frameworks:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\"><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/best-practices-for-dynamic-capacity-management\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">How to outsmart infrastructure constraints with dynamic capacity management</strong></a><strong><span style=\"vertical-align: baseline;\">:</span></strong> Discover how to optimize your compute investments with capabilities in Google Kubernetes Engine and Google Compute Engine that automatically schedule and reallocate resources to avoid interruptions, over-provisioning, and over-reliance on any one hardware configuration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/expanding-google-antigravity-for-enterprise-customers\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Expanding Google Antigravity for Enterprise Customers</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Read our developer tooling deep-dive to see how technical teams are accelerating software delivery with agent-first workflows.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\"><a href=\"https://cloud.google.com/transform/gemini-enterprise-optimize-ai-token-spend\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">What sports cars can teach us about optimizing AI spend</strong></a><strong style=\"vertical-align: baseline;\">: </strong></strong><span style=\"vertical-align: baseline;\">More tokens doesn't always mean better AI. Read our conversation with Mike Clark, Director of Product Management for Gemini Enterprise Agent Platform, on how to balance horsepower with efficiency and get the highest return out of every dollar you spend on AI. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Protection during usage spikes</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Your heavy workloads can surge during peak hours without forcing you to pay for expensive, dedicated infrastructure that sits idle the rest of the time. As your AI usage grows, Gemini models can automatically scale on demand without hitting artificial rate limits – processing up to 50 million tokens per minute. Read more about Provisioned Throughput.</span></p>\n</li>\n</ul></div>"
  "f025ea8cd93f4036819c9bc35bb7a8d2":
    "id": "f025ea8cd93f4036819c9bc35bb7a8d2"
    "title": "Your chance to start building AI agents from the absolute basics"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/your-chance-to-start-building-ai-agents-from-the-absolute-basics/"
    "published": "2026-08-26 18:07:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Have you been hearing a lot about \"AI agents\" lately but aren't sure how to actually start building them? You don't need a background in machine learning or years of software experience to get started. The best way to learn is by doing, which is why we built </span><strong style=\"vertical-align: baseline;\">Agent Valley</strong><span style=\"vertical-align: baseline;\">.   </span></p>\n<p><strong style=\"vertical-align: baseline;\">Agent Valley</strong><span style=\"vertical-align: baseline;\"> is a free, 5-week live learning series designed to take you from scratch to building your very own hands-on agent systems. And instead of staring at boring terminal lines, you’ll be building and playing inside a tiny, low-poly virtual world!</span></p>\n<h2><span style=\"vertical-align: baseline;\">Meet your instructor</span></h2>\n<p><span style=\"vertical-align: baseline;\">You’ll be learning directly from Annie Wang, one of our top Google DevRel Engineers. She designed this course from the ground up to be fully hands-on, interactive, and beginner-friendly. If you want to learn how AI systems are built by the people actually designing them at Google, this is your chance.</span></p>\n<h2><span style=\"vertical-align: baseline;\">How we'll learn together</span></h2>\n<p><span style=\"vertical-align: baseline;\">You’ll learn by building in a split-screen workspace on your laptop. On Day 1, you'll describe and summon a custom low-poly companion that serves as your play character and save file. As you guide your companion through the valley's five districts, a live Runtime Inspector sits right beside the game, showing you exactly what the AI is thinking, deciding, and costing in real-time. Setup is completely zero-stress. Google will provide the environment for running these exercises, so you can dive straight into building.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Agent 101 Live with 5 modular sessions (Jump in anytime!) </span></h2>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Week 1: The Summoning Grove (CONTROL)</strong><span style=\"vertical-align: baseline;\"> · Get started by summoning your companion and learning how to keep its memory and traits consistent across a conversation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Week 2: The Buildyard (DECOMPOSE)</strong><span style=\"vertical-align: baseline;\"> · Learn how to break a big project down so multiple AI assistants can work together in parallel without stepping on each other's toes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Week 3: Market Street (COORDINATE)</strong><span style=\"vertical-align: baseline;\"> · Open up a virtual shop! You'll learn how to write reliable code so transactions and returns go smoothly without crashing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Week 4: The Archive (REMEMBER)</strong><span style=\"vertical-align: baseline;\"> · Give your companion a memory. Learn how to help your agent remember past details without getting confused or making things up.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Week 5: The Night Market (LIVE)</strong><span style=\"vertical-align: baseline;\"> · The grand finale. Learn how to make your agent react live to events in the world (like fireworks or stage lights) while keeping the system fast and affordable.              </span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"agent-valley-roadmap-2160x2700\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/agent-valley-roadmap-2160x2700.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Join the livestream    </span></h2>\n<ul>\n<li><span style=\"vertical-align: baseline;\">5 Tue starting Sep 1 · 10:00 AM (Pacific Time)</span></li>\n<li>Anyone new to AI agents who wants to learn by coding and playing.                                                       </li>\n<li>RSVP Here: <a href=\"https://goo.gle/agent101\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">goo.gle/agent101</span></a></li>\n</ul></div>"
  "13d11d69c980b00293b927e779721887":
    "id": "13d11d69c980b00293b927e779721887"
    "title": "Bringing gVisor sandboxes to distributed Ray clusters"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gvisor-sandboxes-for-ray-clusters-on-gke/"
    "published": "2026-08-26 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The reinforcement learning (RL) ecosystem is rapidly adopting Ray as the unified compute runtime for complex post-training workflows. Across Google Cloud, we see customers using Ray for workloads ranging from multimodal data pipelines to frontier RL. But as agentic and reasoning models evolve, a critical bottleneck has emerged: orchestrating secure, isolated sandboxes at scale to safely execute dynamic rollouts, code generation, and multi-turn tool interactions. Today, </span><a href=\"https://www.anyscale.com/blog/announcing-native-sandboxing-in-ray\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">in partnership with Anyscale</span></a><span style=\"vertical-align: baseline;\">, we are excited to introduce an experimental library for Ray that leverages agentic AI technologies being developed at Google to bring native, high-performance sandboxing directly into distributed Ray clusters.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Sandboxes as Ray Primitives</span></h2>\n<p><span style=\"vertical-align: baseline;\">Ray has become a common runtime for orchestrating post-training workloads. Frameworks including veRL, NeMo-RL, SLIME, MILES, and SkyRL already use Ray to coordinate distributed trainers, inference engines, rollout workers, and other components.</span></p>\n<p><span style=\"vertical-align: baseline;\">When we designed Ray Sandboxing, an important goal was to make it fit naturally into the existing Ray programming model rather than introduce a separate abstraction for isolated execution. A sandbox has many of the same properties as other resources managed by Ray: it needs to be placed on a machine, assigned resources, created and destroyed, recovered from failures, and scaled with the surrounding workload. This led us to represent each high-level sandbox through a Ray Actor:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_SrQumpQ.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The Ray scheduler decides which node should run a sandbox and reserves the corresponding CPU and memory resources. The sandbox Actor manages its lifecycle, while gVisor provides the isolated execution environment on that node.</span></p>\n<p><span style=\"vertical-align: baseline;\">Starting in Ray 2.58, framework authors and researchers can manage sandboxed environments using the same Ray APIs and patterns they already use for the rest of their workload. For example:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import ray\\r\\nfrom ray.experimental import sandbox\\r\\n\\r\\nray.init()\\r\\n# Create a gVisor sandbox environment and return an actor handle for a proxy actor\\r\\nsb = sandbox.create(\\r\\n    cpu=1.0,\\r\\n    memory=&quot;512Mi&quot;,\\r\\n    image=&quot;python:3.12-slim&quot;\\r\\n)\\r\\n# Execute code inside the sandbox\\r\\nresult = ray.get(sb.exec.remote(&quot;python -c \\&#x27;import sys; print(sys.version)\\&#x27;&quot;))\\r\\nprint(result.stdout)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f59306cce50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This creates a gVisor sandbox from an OCI-compatible image and returns a Ray Actor handle. Calls to </span><code style=\"vertical-align: baseline;\">exec</code><span style=\"vertical-align: baseline;\"> are normal Ray Actor calls, so the sandbox can live anywhere in the cluster. The created actor is a proxy that will forward the operations to gVisor.</span></p>\n<p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://docs.ray.io/en/master/ray-core/api/sandboxes.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sandbox API</span></a><span style=\"vertical-align: baseline;\"> covers the basic lifecycle needed by agentic workloads:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Create environments from OCI container images</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Set CPU and memory limits</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Configure environment variables, working directories, and networking</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Execute commands</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Read, write, upload, and download files</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Inspect sandbox state</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Terminate or delete environments.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For lower-level use cases, </span><code style=\"vertical-align: baseline;\">SandboxRuntime</code><span style=\"vertical-align: baseline;\"> provides direct access to local gVisor sandboxes and lets users modify the OCI specification before it is handed to gVisor. Here is an example how this API can be used to build a pool of local sandboxes inside of an actor:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import ray\\r\\nfrom ray.experimental.sandbox.runtime import SandboxRuntime\\r\\n\\r\\n@ray.remote\\r\\nclass SandboxPool:\\r\\n    def __init__(self, size: int = 3, image: str = &quot;python:3.10-slim&quot;):\\r\\n        self.runtime = SandboxRuntime()\\r\\n        self.sandboxes = [\\r\\n            self.runtime.create(image=image, memory=&quot;512Mi&quot;)\\r\\n            for _ in range(size)\\r\\n        ]\\r\\n\\r\\n    def run_command(self, index: int, command: str):\\r\\n        return self.runtime.exec(self.sandboxes[index], command)\\r\\n\\r\\n    def close(self):\\r\\n        for sb_id in self.sandboxes:\\r\\n            self.runtime.delete(sb_id)\\r\\n\\r\\n# Deploy an actor managing a pool of local sandboxes\\r\\npool = SandboxPool.remote(size=3)\\r\\nresult = ray.get(pool.run_command.remote(0, &quot;python3 -c \\&#x27;print(\\\\&quot;Hello from pool!\\\\&quot;)\\&#x27;&quot;))\\r\\nprint(result.stdout)\\r\\nray.get(pool.close.remote())&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5930883950&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Why gVisor?</span></h4>\n<p><span style=\"vertical-align: baseline;\">Running model-generated code means treating the code inside the environment as untrusted. Ray Sandboxing uses </span><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor</span></a><span style=\"vertical-align: baseline;\">, Google's open-source application kernel, as its initial sandbox runtime. gVisor implements a substantial portion of the Linux system-call interface in userspace, putting an additional isolation boundary between workloads and the host kernel. It is OCI-compatible, works with standard container images, and does not require exposing a Docker daemon or host Docker socket to the sandbox.</span></p>\n<p><span style=\"vertical-align: baseline;\">This combination is particularly useful for agentic workloads: environments remain lightweight enough to create dynamically while providing stronger isolation than executing generated code directly in ordinary containers. gVisor also provides sub-second sandbox startup and low per-sandbox memory overhead, making it possible to use sandboxes as relatively fine-grained distributed resources.</span></p>\n<p><span style=\"vertical-align: baseline;\">In future versions of Ray, we plan to extend support to other sandboxing runtimes such as </span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</span></a><span style=\"vertical-align: baseline;\"> or Kata Containers.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Try Ray sandboxing on GKE</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Check out the Ray documentation to learn more about </span><a href=\"https://docs.ray.io/en/master/ray-core/sandboxes.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray Sandboxes</span></a><span style=\"vertical-align: baseline;\">. To try out these sandboxing capabilities on GKE, head over to the </span><a href=\"https://docs.ray.io/en/master/cluster/kubernetes/examples/ray-sandboxing.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray sandboxing User Guide</span></a><span style=\"vertical-align: baseline;\">. Have feedback or ideas? Join the discussion on the </span><a href=\"https://github.com/ray-project/ray/issues/65352\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\"> issue to collaborate on the future of Ray for reinforcement learning.</span></p></div>"
