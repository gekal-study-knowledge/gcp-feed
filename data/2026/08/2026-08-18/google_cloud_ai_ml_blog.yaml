    "title": "Building operational resilience with agentic AI in financial services"
    "link": "https://cloud.google.com/blog/topics/financial-services/building-operational-resilience-with-agentic-ai-in-financial-services/"
    "published": "2026-08-18 23:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span><span style=\"vertical-align: baseline;\">For financial institutions, operational resilience has long been embedded in regulatory and supervisory expectations — to say nothing of the high expectations of consumers. With the implementation of the European Union’s </span><a href=\"https://cloud.google.com/blog/products/identity-security/the-eus-dora-has-arrived-google-cloud-is-ready-to-help\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Digital Operational Resiliency Act</span></a><span style=\"vertical-align: baseline;\"> (DORA), those expectations have become even more stringent, with more explicit, harmonized, and evidence-driven requirements. Firms must now demonstrate that their critical business services and supporting digital infrastructures can withstand disruption, support coordinated response, and recover with control.</span></span></p>\n<p><span><span style=\"vertical-align: baseline;\">To meet these conditions, </span><a href=\"https://www.db.com/\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deutsche Bank</span></a><span style=\"vertical-align: baseline;\"> developed an AI-powered agentic resilience platform that modernized its regulatory </span><a href=\"https://cloud.google.com/transform/tabletopping-the-tabletop-new-perspectives-cybersecurity-favorite-role-playing-game\"><span style=\"text-decoration: underline; vertical-align: baseline;\">tabletop resilience exercises</span></a><span style=\"vertical-align: baseline;\"> at scale and turned manual preparation into context-aware and evidence-ready simulations grounded in actual operational data. The platform builds enterprise context from architecture, data flows, logs, incident history, alerting signals, and operational telemetry to generate scenarios, simulated operational evidence, structured session records, and regulator-ready artifacts.</span></span></p>\n<p><span style=\"vertical-align: baseline;\">At many large banks with operations that span interdependent applications, data flows, and third-party services, this is a critical and even existential shift. Across financial services, supervisory expectations are evolving and as they do, banks’ tabletop exercises must reflect their production dependencies, real operating conditions, and compliance with consistent evidence standards more directly.</span></p>\n<p><span style=\"vertical-align: baseline;\">As Deutsche Bank considered how to successfully and efficiently make this shift at scale, it looked to </span><a href=\"https://www.db.com/news/detail/20201204-deutsche-bank-and-google-cloud-sign-pioneering-cloud-and-innovation-partnership?language_id=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">its long-time partner, Google Cloud</span></a><span style=\"vertical-align: baseline;\">, and its growing suite of agentic AI tools.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">From tabletop exercises to resilience intelligence</strong></h3>\n<p><span><span style=\"vertical-align: baseline;\">With its agentic resilience platform, DB has been able to transform its tabletop exercises from manual preparation to a continuous intelligence model. And it’s been able to extend the same agentic layer to root-cause analysis when real operational context is needed.</span></span></p>\n<p><span style=\"vertical-align: baseline;\">This means that every scenario it runs is based on real enterprise signals. The platform can then reflect true system dependencies, failure patterns, and business impact instead of relying on static inputs that are more likely to return assumptions than real-time insights.</span></p>\n<p><span style=\"vertical-align: baseline;\">By using </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\">, DB has been able to migrate this operational context into structured scenarios with clear timelines, decision points, and expected responses. This has ensured that each exercise is grounded in real system behavior that produces consistent, audit-ready evidence that meets regulatory expectations.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Dual orchestration for control and flexibility</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In order to deliver both regulator-grade control and operational flexibility, DB’s platform introduced a dual-orchestration architecture that separates workflows into two complementary execution models.</span></p>\n<p><span style=\"vertical-align: baseline;\">First, for regulator-aligned execution, the bank is using </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/use-a-langgraph-agent\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LangGraph</span></a><span style=\"vertical-align: baseline;\"> to ensure that it generates every scenario through a traceable, deterministic process — with clear lineage from input context to output — that supports the auditability required for supervisory review.</span></p>\n<p><span style=\"vertical-align: baseline;\">Next, for its adaptive and investigative scenarios, DB is using </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Agent Development Kit</span></a><span style=\"vertical-align: baseline;\"> (ADK) to enable agent-driven coordination. This approach allows the bank’s platform to dynamically analyze conditions and generate responses without predefined execution paths.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_dbc2MvR.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1. Architecture for context assembly, orchestration, and scenario generation.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span><span style=\"vertical-align: baseline;\">With this architectural separation, the platform can combine governed execution with adaptive investigation while preserving a common intelligence layer. The same agents and tools can reason over architecture, data-flow diagrams, logs, and code artifacts across tabletop scenario generation and related incident-analysis workflows. Importantly, this supports a </span><a href=\"https://cloud.google.com/blog/products/identity-security/cyber-snapshot-report-enterprise-resilience-key-to-toolchain-success\"><span style=\"text-decoration: underline; vertical-align: baseline;\">consistent resilience model</span></a><span style=\"vertical-align: baseline;\"> across both planned exercises and real operational events.</span></span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Deutsche Bank’s</span><span style=\"vertical-align: baseline;\"> objective with this </span><span style=\"font-style: italic; vertical-align: baseline;\">platform</span><span style=\"vertical-align: baseline;\"> was to engineer a resilience model for critical financial systems that meets regulatory expectations — even within highly complex, distributed environments. By linking dynamically generated scenarios to real business context and combining governed orchestration with adaptive analysis, the platform has given us an intelligent, continuously adaptive model for operational resilience.”</span><span style=\"vertical-align: baseline;\"> – </span><strong style=\"font-style: italic; vertical-align: baseline;\">Sanjay Tripathi</strong><span style=\"font-style: italic; vertical-align: baseline;\">, Managing Director, Global Head of Surveillance Technology &amp; Compliance Cloud &amp; AI Transformation Lead, Deutsche Bank</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Powering generation and governance with Google Cloud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud’s suite of agentic tools is providing the foundation for scaling Deutsche Bank’s platform across its many governed, enterprise-grade resilience workflows. Here’s how:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> supports elastic execution of scenario and evidence-generation services. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a><span style=\"vertical-align: baseline;\"> transforms operational context into structured resilience scenarios.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google ADK</span></a><span style=\"vertical-align: baseline;\"> enables adaptive agent coordination.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/sql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\"> provides durable persistence for scenarios, session artifacts, and review records.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Collectively, these services give DB support for the traceable generation, controlled execution, and persistent evidence record required for compliance review and continuous improvement.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Scalable, evidence-ready resilience testing</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Every scenario generated by Deutsche Bank’s platform drives a structured tabletop session for the teams that run response, escalation, and recovery. Because these exercises are grounded in real enterprise context, they reflect operational reality while also strengthening consistency across teams and creating audit-ready evidence that meets regulatory expectations. For institutions that operate under DORA or similar frameworks, this makes it easier to demonstrate controlled, coordinated, and disciplined response at scale. </span></p>\n<p><span style=\"vertical-align: baseline;\">This model is now being applied across multiple DB portfolios, which is helping the bank establish more consistent and scalable resilience paradigms and a replicable blueprint for the broader financial sector.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this model, root-cause analysis acts as the feedback loop between real incidents and future resilience testing. The resulting insights from production events can inform future tabletop scenarios, while exercise outcomes can strengthen response playbooks, escalation paths, and recovery readiness.</span></p>\n<p><span style=\"vertical-align: baseline;\">All of this extends the platform’s value from planned resilience exercises to real operational events while keeping scenario-based resilience testing as the primary use case.</span></p>\n<p><span style=\"vertical-align: baseline;\">As adoption expands, this platform brings consistency by embedding Google Cloud’s methodology for context-aware resilience. It eliminates fragmented manual approaches and establishes a cross-functional, AI-informed operating model across the bank.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Toward resilience intelligence</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The bank’s next step is to extend this approach into a broader resilience intelligence layer, which is possible because it can deploy the same patterns to support playbook refinement, recovery-readiness assessments, and continuous validation of controls against evolving system conditions.</span></p>\n<p><span style=\"vertical-align: baseline;\">For financial institutions, this is a strategic shift. As systems become more distributed and regulatory expectations more demanding, banks must move from periodic resilience testing to continuous, intelligence-driven capabilities. At Deutsche Bank, Google Cloud is making that transition simple across the organization.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Learn more about Google Cloud’s methodology for context-aware resilience in this </span><a href=\"https://cloud.google.com/blog/topics/financial-services/improve-financial-resilience-with-google-cloud?e=0\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">article</span></a><span style=\"font-style: italic; vertical-align: baseline;\">.</span></p></div>"
