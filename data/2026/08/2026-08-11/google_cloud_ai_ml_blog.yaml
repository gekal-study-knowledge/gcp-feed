  "32a4267b3f7604f67d249aa01539a55a":
    "id": "32a4267b3f7604f67d249aa01539a55a"
    "title": "How WPP operationalizes platform and data engineering for AI marketing"
    "link": "https://cloud.google.com/blog/products/media-entertainment/how-wpp-operationalizes-platform-and-data-engineering-for-ai-marketing/"
    "published": "2026-08-11 01:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Between chaotic levels of market fragmentation and economic volatility, marketing and communications agencies can no longer rely on the human intuition they’ve traditionally used to win clients and optimize their ad spend. WPP is replacing that guesswork with an AI-powered view of shifting market dynamics, giving brands predictive certainty that lets them invest with confidence while moving at the speed of the market. That’s the value of </span><a href=\"https://www.wpp.com/en/open\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">WPP Open</span></a><span style=\"vertical-align: baseline;\">, its agentic marketing system.</span></p>\n<p><span style=\"vertical-align: baseline;\">But before it could begin applying sophisticated AI models to power those insights, </span><span style=\"vertical-align: baseline;\">WPP had to overcome a critical engineering challenge: the marketing data that made up the models was fragmented across hundreds of global agencies. While this dynamic made it nearly impossible to deploy AI tools efficiently and securely, access to models was only part of the equation. And  until it built a reliable way to ingest, clean, and serve data to those models, WPP couldn’t unlock the true potential of generative AI.</span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this, WPP partnered with Google Cloud to construct a unified data backbone and  custom platform engineering path. Now, by standardizing its serverless compute patterns and data processing workflows, WPP is able to  securely deploy targeted marketing campaigns in days instead of months.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Architecting a centralized, service-based data foundation </strong></p>\n<p><span style=\"vertical-align: baseline;\">An important part of this effort was accelerating data availability and centralizing management. To do this, WPP adopted a service-based project structure for its current production environment. Rather than isolating every workload into separate silos, its engineering team centralized </span><a href=\"https://cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Storage</span></a><span style=\"vertical-align: baseline;\"> (GCS) and </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> into dedicated, shared data projects, while also segregating the compute and processing workloads into distinct processing projects.</span></p>\n<p><span style=\"vertical-align: baseline;\">This structure simplified the core team’s user experience and ensured that all data consumers interacted with a unified source of truth. Because data from WPP’s various product lines lives in shared infrastructure, it was essential that security be strictly enforced at a granular level. By directly applying identity and access management (IAM) controls at the individual GCS bucket and BigQuery dataset levels, the company’s teams only see the data they’re  authorized to access.</span></p>\n<p><span style=\"vertical-align: baseline;\">At the same time, raw data from various partners lands in dedicated GCS buckets in order to keep the raw inputs organized and isolated. From there, </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> executes custom Apache Spark jobs to cleanse, normalize, and canonicalize information into standardized cohort definitions (SCDs). By utilizing a serverless architecture combined with </span><a href=\"https://www.kubeflow.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kubeflow</span></a><span style=\"vertical-align: baseline;\"> for pipeline orchestration, WPP’s data engineering team avoided the overhead that often results from managing cluster infrastructure. This allowed them to focus entirely on the data transformation logic fueling the downstream GCS and BigQuery layers  that ultimately feed the company’s audience &amp; performance AI models.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 WPP Data Pipeline Architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/wpp_data_flow_architecture.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><code style=\"font-style: italic; vertical-align: baseline;\">What made our collaboration with Google Cloud successful was the balance they struck between uncompromising professionalism when it comes to best practices and timely delivery of incredibly pragmatic, real-world solutions.<br /></code><code style=\"font-style: italic; vertical-align: baseline;\">- Jonas Dahlbaek<br /></code><code style=\"font-style: italic; vertical-align: baseline;\">Senior Data Engineering Lead, WPP</code></p>\n<p><strong style=\"vertical-align: baseline;\">Standardizing data into unified cohorts</strong></p>\n<p><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">When raw data enters WPP’s processing zone, its platform converts it into SCDs that become core concepts used throughout the framework for keying purposes. These are based on five keys: age, gender, geo, product, and interest. But these underlying data definitions are fluid and continuously canonicalized to reflect evolving marketing concepts. As a result, this uniform structure allows WPP to join and aggregate data on a global scale without exposing sensitive underlying particulars or relying on shared identifiers.</span></p>\n<p><span style=\"vertical-align: baseline;\">The platform's core processing engine was built in type-safe Scala to ensure comprehensive visibility and compliance This custom framework tightly controls how data is transformed, and it inherently supports full source traceability while guaranteeing that every data point within the curated datasets can be traced back to its origin. This is a crucial level of traceability when building enterprise AI applications, as data scientists and auditors must understand exactly what information feeds into the models, even as WPP concurrently prepares to transition to Google Cloud </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> for automated, enterprise-wide data governance in the future.</span></p>\n<p style=\"padding-left: 40px;\"><code style=\"font-style: italic; vertical-align: baseline;\">Working with Google Cloud has been instrumental in accelerating and standardizing our engineering efforts. In a world where massive volumes of fragmented data present a daily challenge, having the right infrastructure is paramount to thriving in the AI age and helps our developers and AI marketers alike.</code><br /><code style=\"font-style: italic; vertical-align: baseline;\">-Suleman Khan<br /></code><code style=\"font-style: italic; vertical-align: baseline;\">Product Manager for OI &amp; Google Partnerships, WPP</code></p>\n<p><strong style=\"vertical-align: baseline;\">Standardizing the enterprise software lifecycle</strong></p>\n<p><span style=\"vertical-align: baseline;\">For WPP, even with all these steps in place, processing data is only half the battle. To serve applications and manage the underlying infrastructure, the company’s platform engineering team developed a suite of reusable and centralized GitLab continuous integration and continuous deployment (CI/CD) templates. With this, WPP reduced the cognitive load on individual development teams and ensured that all deployments met strict corporate security standards.</span></p>\n<p><span style=\"vertical-align: baseline;\">These templates manage various enterprise workloads autonomously. The suite includes universal </span><a href=\"https://cloud.google.com/run\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run</span></a><span style=\"vertical-align: baseline;\"> templates for full-stack web applications and  batch data processing and scheduled pipelines. It also includes a deploy-only template for multi-stage workflows and a </span><a href=\"https://cloud.google.com/functions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run functions</span></a><span style=\"vertical-align: baseline;\"> deployment template for event-driven microservices.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 WPP Cloud Platform Engineering\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_WPP_Cloud_Platform_Engineering.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Implementing zero-rebuild promotion</strong></p>\n<p><span style=\"vertical-align: baseline;\">Rebuilding container images in a production environment can introduce unnecessary risk and the potential for configuration drift. In order to maintain environmental consistency, WPP embraced a \"build once, deploy many\" methodology that applied cross-project IAM logic and </span><a href=\"https://docs.cloud.google.com/artifact-registry/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Artifact Registry</span></a><span style=\"vertical-align: baseline;\"> configurations.</span></p>\n<p><span style=\"vertical-align: baseline;\">As part of this process, developers build and test container images in the development environment. Once those exact, immutable container images are validated, they’re promote  directly to production. This zero-rebuild promotion ensures total parity across deployment stages and eliminates unexpected production behaviors. The CI/CD templates also facilitate progressive traffic migration, which allowed teams to route a small percentage of traffic to new revisions before initiating a full rollout.</span></p>\n<p style=\"padding-left: 40px;\"><code style=\"font-style: italic; vertical-align: baseline;\">Immutable deployments. Traceable data. Unshakable trust. When you know exactly what goes into your AI, you can ship at the speed of light.</code><br /><code style=\"font-style: italic; vertical-align: baseline;\">- Ranjith K Poldas<br /></code><code style=\"font-style: italic; vertical-align: baseline;\">Associate Director , Devops (I&amp;P), WPP Media</code></p>\n<p><strong style=\"vertical-align: baseline;\">Automating security and intelligent networking</strong></p>\n<p><span style=\"vertical-align: baseline;\">With this modern architecture, enterprise security acts as a foundational enabler for WPP, so it integrated </span><a href=\"https://cloud.google.com/wiz\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz</span></a><span style=\"vertical-align: baseline;\"> security scanning directly into the pre-push phase of the CI/CD pipeline to catch vulnerabilities before code merges. The company also utilized </span><a href=\"https://cloud.google.com/security/products/iap\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Identity-Aware Proxy</span></a><span style=\"vertical-align: baseline;\"> to enforce zero-trust access across its  internal applications.</span></p>\n<p><span style=\"vertical-align: baseline;\">To further simplify operations, WPP adopted templates with intelligent virtual private cloud (VPC) logic. This configuration automatically identifies and resolves networking conflicts between legacy VPC connectors and modern </span><a href=\"https://docs.cloud.google.com/run/docs/configuring/vpc-direct-vpc\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Direct VPC</span></a><span style=\"vertical-align: baseline;\"> access. This automated networking prevents deployment failures and accelerates the release cycle.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Monitoring operational health and driving ROI</strong></p>\n<p><span style=\"vertical-align: baseline;\">Because a resilient platform foundation requires deep observability, WPP’s engineering team now monitors strict operational metrics instead of relying solely on deployment frequency. The team tracks request latency across p50, p95, and p99 percentiles, alongside 4xx and 5xx error rates. It  also monitors container startup times to mitigate cold starts, while tracking overall CPU and memory utilization. This granularity ensures that both data pipelines and serverless infrastructure always remain highly available.</span></p>\n<p style=\"padding-left: 40px;\"><code style=\"font-style: italic; vertical-align: baseline;\">\"Navigating a transformation of this scale across multiple complex workstreams—spanning data engineering, platform infrastructure, and AI integration—required more than just alignment; it demanded deep, mutual trust. Working as true partners, Google Cloud and WPP moved in lockstep to deliver production-ready platform capabilities on time.\"<br /></code><code style=\"font-style: italic; vertical-align: baseline;\">Yang Yue , Program Manager , Google Cloud</code></p>\n<p><span style=\"vertical-align: baseline;\">For WPP, operationalizing its data and AI stacks at this velocity provided the necessary infrastructure for its advanced workloads, and the business impact was clear and quantifiable. By building this dual foundation, the company reduced creative and strategy time from four weeks to just three hours. It also saw a 70% gain in production efficiency, a 33x increase in content volume, and  a 2.8x increase in campaign return on investment. In short, by partnering with Google Cloud and implementing a broad suite of products and tools, WPP was able to quickly realize a significant ROI and boost productivity, efficiency, reliability, and security across the company.</span></p></div>"
  "926974a349ceec133a576359a1de88d2":
    "id": "926974a349ceec133a576359a1de88d2"
    "title": "How Malachyte solves retail’s cold-start problem with managed real-time AI"
    "link": "https://cloud.google.com/blog/products/data-analytics/solving-retails-cold-start-problem-malachytes-recommendation-reinvention/"
    "published": "2026-08-11 01:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">What’s the best way to recommend products to little-known users? </span></p>\n<p><span style=\"vertical-align: baseline;\">We’ve spent our careers trying to solve this problem for major companies like Spotify and Priceline, and it’s why Sidd founded </span><a href=\"https://www.malachyte.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Malachyte</span></a><span style=\"vertical-align: baseline;\">, an AI-powered ecommerce recommendation platform. These days, consumers have come to expect content that feels personalized and relevant, and online services competing for their attention have no choice but to do this exceptionally well.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Malachyte was inspired by some unique insights into how advanced AI models, and large language models in particular, could be applied in new ways to old challenges like personalization and recommendations. </span></p>\n<p><span style=\"vertical-align: baseline;\">As Malachyte set out to win potential customers’ business, we needed secure, scalable, reliable and, above all, leading-edge AI infrastructure to continue building the personalization algorithm we had always envisioned. By utilizing Google Cloud tools like </span><a href=\"https://cloud.google.com/bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-kafka\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Kafka</span></a><span style=\"vertical-align: baseline;\">, Malachyte has been able to help some of its retailers </span><a href=\"https://www.malachyte.com/case-studies\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">double and sometimes even triple</span></a><span style=\"vertical-align: baseline;\"> their sales. </span></p>\n<p><span style=\"vertical-align: baseline;\">This is the story of how we built it, and the ways any founder can use services like these to start deploying AI foundation models in new ways.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How Malachyte lifted sales for their users </strong></h3>\n<p><span style=\"vertical-align: baseline;\">For Malachyte, the aha moment was discovering that it could use neural networks with attention mechanisms — the same concept powering large language models — to personalize retail search and product pages. This approach is what enables LLMs to derive meaning from the relative order of items in a sequence, in their case the order of words and syllables in a sentence. When it comes to a retail website or app, what Malachyte wanted to capture was the sequence of customer interactions with the site.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Malachyte blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Malachyte_blog_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>What if we predicted the next thing a user wants on an ecommerce website just like LLMs predict the next word in a sentence?</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A pre-GPT language model might have tried to look at a specific sequence of words or even fragments of words (what we now know of as tokens), but those earlier models wouldn’t examine what happens if the words were in the comparable order but weren’t contiguous or were re-arranged. The breakthrough came — in part through Google’s work on transformers — when LLMs gained the ability to understand complex and long-range dependencies within a sequence of items. </span></p>\n<p><span style=\"vertical-align: baseline;\">This more sophisticated method has delivered dramatic results — both for the proliferation of gen AI in general, and for Malachyte’s application of the technology.</span></p>\n<p><span style=\"vertical-align: baseline;\">To make this work in practice, Malachyte creates a vector of everything known about a visitor when they arrive on a site.  Most users are visiting for the first time, so little is known about them. This is what’s known as the  “cold start” problem. The trick is to use every interaction with a user to refine this vector. Each new addition to the vector, like a click or a query, does two things: it drives a prediction about the next thing the user wants, and it provides more information about the user.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Malachyte’s platform then updates the user vector and the prediction at the same time. This not only enhances the understanding of the individual user and their preferences, it also improves the overall model with the anonymized user data. With every inference, the context of both the average and the specific shopper grows. </span></p>\n<p><span style=\"vertical-align: baseline;\">The company further innovates by not just using attention-based neural networks but combining that with updating user profiles 100 milliseconds at time. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Malachyte Blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Malachyte_Blog.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Malachyte’s recommendation and search agents populate the next page’s search results or recommendation carousels based on what users clicked on previous pages.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To be sure, this idea isn’t in itself new. Retailers have long used collaborative filtering recommendations systems to identify similar users and items that required massive sets of interaction history. These models typically required a lot of data, including third-party cookie-based profiles and demographics. </span></p>\n<p><span style=\"vertical-align: baseline;\">By focusing on the sequence of interactions in a session, retailers can achieve far more personalization — with less required data or spend — than by focusing only on a user’s profile. As a bonus, retailers can now offer their users more privacy by not relying on long-term cookie data.</span></p>\n<p><span style=\"vertical-align: baseline;\">This works because of the model structure and multimodal vectors that encode everything they know about a user, including browser data, click history and searches. The output, too, is multimodal: The same model can be applied to on-site search product pages, category pages, and add-to-cart carousels.  </span></p>\n<p><span style=\"vertical-align: baseline;\">To make this work, each product in the catalog is embedded into the same space as the user vector, which gets updated and subsequently moves the vector closer to relevant products and further from those that aren’t. The neural network computing the embedding is being continuously trained across retailers who work with Malachyte, improving the quality for everyone. The </span><span style=\"vertical-align: baseline;\">system effectively becomes a data cooperative with each retailer's user helping make the model smarter for everyone.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - Malachyte blog vector space - high res\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_-_Malachyte_blog_vector_space_-_high_res.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>A user session represented as a vector in a space of products.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To make this delivery for every user at every inference in 100 milliseconds, Malachite found real benefits in building onGoogle Cloud’s real-time AI stack.   </span></p>\n<p><span style=\"vertical-align: baseline;\">With this system, every behavioral event streams into a Managed Service for Apache Kafka cluster. Rather than queuing for a future training job, each event immediately becomes an update to the user’s profile in Bigtable. The Kafka cluster allows the customer’s front-end to persist, so the user session signals quickly with little worry about how they fit into the user vector.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Bigtable allows Malachyte’s services to look up and update the right user vectors, and it and Kafka operate at the order of 10 milliseconds per step, which allows the entire recommendation loop to complete with no disruption to the user experience.  </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4 - Malachyte Blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_-_Malachyte_Blog.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>The three layer real-time AI architecture: a retailer’s website, Malachyte’s AI models and serving front ends, and context management infrastructure.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In addition to a fast core, a second layer of product catalog updates, inventory signals, and retailer-specific dimensional data keeps product data up to date. This flows through </span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pub/Sub</span></a><span style=\"vertical-align: baseline;\">, which offers globally accessible REST APIs that enable connections retailers can use without deep integration work. Malachyte agents run on </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine </span></a><span style=\"vertical-align: baseline;\">(GKE), with model inference on </span><a href=\"https://cloud.google.com/products/compute\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Compute Engine</span></a><span style=\"vertical-align: baseline;\"> (GCE).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5 Malachyte blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5_Malachyte_blog.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Continuous ingestion of external data, such as product catalog updates, operates through Pub/Sub’s global messaging system.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">With its migration to Google Cloud’s AI architecture, Malachyte demonstrated that production AI inference and training are about more than GPUs and storage. They require real-time continuous learning infrastructure that includes a fast key-value store, a streaming layer, and a managed messaging system, all integrated with the foundation model architecture. </span></p>\n<p><span style=\"vertical-align: baseline;\">This approach also shows that even a small team like Malachyte’s can have a big impact in an industry. It just needs access to powerful infrastructure and core AI managed services.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Try it for yourself </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Looking to shake up your industry or stay ahead of the competition like Malachyte? Try </span><a href=\"https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Kafka</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pub/Sub</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\">. New customers can receive </span><a href=\"https://cloud.google.com/free\"><span style=\"text-decoration: underline; vertical-align: baseline;\">$300 in Google Cloud credits</span></a><span style=\"vertical-align: baseline;\">. </span></p></div>"
  "57b65eea2251bbcad6dac1c7ff62c5cf":
    "id": "57b65eea2251bbcad6dac1c7ff62c5cf"
    "title": "Google named a Leader in The Forrester Wave™: AI Platforms, Q3 2026"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/google-named-a-leader-in-the-forrester-wave-ai-platforms/"
    "published": "2026-08-11 01:00:00"
