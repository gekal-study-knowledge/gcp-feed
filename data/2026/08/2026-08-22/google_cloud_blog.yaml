    "summary": "<div class=\"block-paragraph\"><p>Welcome to the first Cloud CISO Perspectives for August 2026. Today, Chris Betz explains why the AI era makes it more important than ever to lean into security fundamentals.</p><p>As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the <a href=\"https://cloud.google.com/blog/products/identity-security/\">Google Cloud blog</a>. If you’re reading this on the website and you’d like to receive the email version, you can <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">subscribe here</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f593058f410&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>How to stay strong with security fundamentals in the AI era</b></h3><p><i>By Chris Betz, CISO, Google Cloud</i></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Chris Betz Google-9779\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Chris_Betz_Google-9779.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Chris Betz, CISO, Google Cloud</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>As AI accelerates the capabilities of adversaries, foundational strength becomes the primary differentiator between resilience and vulnerability. It’s a dangerous and unfortunately common misconception that traditional security fundamentals are becoming obsolete. For CISOs, the challenge is to adopt new AI technology securely while scaling essential, effective defensive practices to move at the speed of the adversary.</p><p>For both attackers and defenders, AI has been a catalyst for optimization and innovation. While traditional automation has allowed us to perform repetitive tasks at scale, AI enables both sides to execute highly-specific, customized actions at massive scale and unprecedented speed.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Collectively, these technologies reduce the attack surface and contribute to the deep context that defensive AI needs to be a business enabler — and create the necessary conditions for successful AI-powered defenses.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">We can see the threat developing almost in real-time. Adversaries are </span><a href=\"https://cloud.google.com/security/resources/ai-risk-and-resilience\"><span style=\"text-decoration: underline; vertical-align: baseline;\">deploying new malware</span></a><span style=\"vertical-align: baseline;\"> with just-in-time AI that dynamically generates malicious scripts and obfuscates code mid-execution to evade detection. They use sophisticated vishing and deepfakes for identity theft and business email compromise. We even see unauthorized AI tools lead to the rise of shadow agents. </span></p>\n<p><span style=\"vertical-align: baseline;\">Defending against AI powered security threats requires more than accelerating current security practices; it means stepping back and beginning with the security foundation and layered defenses. It’s critically important to build and use a layered defense with the right guardrails — foundational cybersecurity building blocks that we’ve been investing in for years.</span></p>\n<p><span style=\"vertical-align: baseline;\">Doubling down on this foundation: technologies like multi-factor authentication (MFA), </span><a href=\"https://blog.google/security/going-beyond-zero-a-new-paradigm-for-enterprise-security/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Zero Trust frameworks</span></a><span style=\"vertical-align: baseline;\">, consistent system patching, and comprehensive detection and response. Collectively, these technologies reduce the attack surface and contribute to the </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-ai-leverages-deep-context-defenders-advantage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">deep context that defensive AI needs</span></a><span style=\"vertical-align: baseline;\"> to be a business enabler — and create the necessary conditions for successful AI-powered defenses.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Revolutionizing vulnerability management</strong></p>\n<p><span style=\"vertical-align: baseline;\">In just a few short years, identifying and fixing vulnerabilities has evolved from a mostly laborious, manual process to one driven by AI tools discovering vulnerabilities at volumes never seen before. Further, the time to exploit window has essentially been eliminated.</span></p>\n<p><span style=\"vertical-align: baseline;\">However, it’s not enough to merely discover vulnerabilities, especially at today’s volumes. You still need to prioritize fixing those that have the most critical impact on your systems and networks first, and that necessitates an equally-rapid response in smart mitigation. </span></p>\n<p><span style=\"vertical-align: baseline;\">Organizations use multiple models to scan for flaws and then suggest high-quality code fixes that engineers can quickly move into production, leveraging capabilities like </span><a href=\"https://cloud.google.com/security/ai-threat-defense\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Threat Defense</span></a><span style=\"vertical-align: baseline;\">. AI allows us to automate the entire software development lifecycle, from discovery to testing and deployment, ensuring that our defensive posture evolves faster than the threats targeting us.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Enhancing threat modeling</strong></p>\n<p><span style=\"vertical-align: baseline;\">We’re also seeing the fundamental concept of threat modeling have an outsized impact. Doing threat modeling well requires bringing context together from your code, your cloud architecture, system design, and network pathways. </span></p>\n<p><span style=\"vertical-align: baseline;\">While it isn’t easy, using AI can scale our ability to bring that data together into a coherent picture. Teams have been experimenting with multi-AI models to collect system information and enumerate threats. </span></p>\n<p><span style=\"vertical-align: baseline;\">As I noted in June, </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-how-google-cloud-security-uses-ai-internally/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">engineering teams at Google Cloud</span></a><span style=\"vertical-align: baseline;\"> now route product launches through an agent-based security review pipeline. High-risk indicators automatically get flagged for human review, while we’ve replaced static threat models with dynamic product dossiers that update in real-time.</span></p>\n<p><strong style=\"vertical-align: baseline;\">The CISO as a strategic business leader</strong></p>\n<p><span style=\"vertical-align: baseline;\">The most effective security leaders that I know today are more than just technologists: They are strategic business leaders. The intense global focus on AI vulnerabilities has brought cybersecurity to the </span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-why-ai-threat-defense-is-the-new-boardroom-baseline\"><span style=\"text-decoration: underline; vertical-align: baseline;\">forefront of boardroom and executive attention</span></a><span style=\"vertical-align: baseline;\"> like never before.</span></p>\n<p><span style=\"vertical-align: baseline;\">This visibility is an opportunity to lead. We CISOs are expected to communicate with clarity, from the board to the C-suite to the security teams who look to them on a daily basis, demonstrating their ability as capable strategists who can navigate the complexities of AI while safeguarding the organization's growth. </span></p>\n<p><span style=\"vertical-align: baseline;\">By aligning security fundamentals with business objectives and using AI to enhance defense, we can lead our organizations securely into the future.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about building and maintaining strong security foundations in the AI era, read our newest </span><a href=\"https://cloud.google.com/security/resources/cyber-snapshot-reports\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Defender’s Advantage: Cyber Snapshot Report</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5930aa5850&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://www.youtube.com/watch?v=CmGWIwgHR60&#x27;), (&#x27;image&#x27;, &lt;GAEImage: Cloud-CISO-Perspectives-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>In case you missed it</b></h3><p>Here are the latest updates, products, services, and resources from our security teams so far this month:</p><ul><li><b>Driving AI threat readiness with Wiz</b>: Announcing new Wiz capabilities that can help organizations prepare for the AI era by expanding visibility and accelerating response, so your security teams can defend at machine speed. <a href=\"https://www.wiz.io/blog/wiz-at-black-hat-2026\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>PQC in Plaintext: Google Cloud’s post-quantum cryptography roadmap</b>: We’ve long been actively working on and rolling out post-quantum cryptography in our infrastructure. Here’s our updated Google Cloud roadmap to migrate to PQC by 2029. <a href=\"https://cloud.google.com/blog/products/identity-security/pqc-in-plaintext-google-clouds-post-quantum-cryptography-roadmap\"><b>Read more</b></a>.</li><li><b>How Google Cloud detects, contains, and protects against emerging threats</b>: Learn more about how Google Cloud empowers you with the tools, governance, and infrastructure you need to securely deploy workloads and maintain long-term trust. <a href=\"https://cloud.google.com/blog/products/identity-security/how-google-cloud-detects-contains-and-protects-against-emerging-threats\"><b>Read more</b></a>.</li><li><b>Privacy-first medical AI with MedPerf and Google Cloud</b>: Discover how Google Cloud and MedPerf use Confidential Computing to enable secure, privacy-first collaborative medical AI evaluation. <a href=\"https://cloud.google.com/blog/products/identity-security/privacy-first-medical-ai-with-medperf-and-google-cloud\"><b>Read more</b></a>.</li><li><b>More cryptanalysis makes us all safer</b>: Recent advances in frontier AI models do not signal the downfall of cryptography. Here’s why they’re best viewed as additional cryptanalysts. <a href=\"https://bughunters.google.com/blog/more-cryptanalysis-makes-us-all-safer\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>How layered defenses harden Chrome against abusive notifications</b>: Learn how Chrome Security has collaborated with Firebase Cloud Messaging (FCM) and Safe Browsing to significantly reduce notification abuse, and improve the security and quality of the web ecosystem for everyone. <a href=\"https://blog.google/security/the-multi-layered-defenses-that-harden-chrome-against-abusive-notifications/\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more security stories <a href=\"https://cloud.google.com/blog/products/identity-security\">published this month</a>.</p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f5930aa5250&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, &lt;GAEImage: GCAT-replacement-logo-A&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><h3><b>Threat Intelligence news</b></h3><ul><li><b>Staying ahead of adversarial AI through agentic source code review</b>: To help defenders implement agentic approaches similar to our approach at Google Cloud, we are sharing the details of our Agentic Vulnerability Discovery Harness architecture for the first time. AVDH can also be used alongside CodeMender’s ongoing scanning to create a two-layered defense strategy. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/staying-ahead-of-adversarial-ai-through-agentic-source-code-review\"><b>Read more</b></a>.</li><li><b>Cloud threat highlights from the first half of 2026</b>: In the first half of 2026, Wiz's Research and CIRT teams tracked threats affecting thousands of cloud environments. We saw a notable increase in the volume of activity, with supply-chain attacks running at a previously unseen scale and developer toolchains and AI infrastructure drawing serious attention. <a href=\"https://www.wiz.io/blog/cloud-threat-highlights-h1-2026\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Batten down your packages: Mitigation guidance for supply chain compromise</b>: GTIG and Mandiant have tracked ongoing and increasing open source software supply chain compromise campaigns over the past several years. Here are our mitigation and hardening recommendations to secure software supply chains, including insights we have developed as a result of supporting customers. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise\"><b>Read more</b></a>.</li><li><b>Multi-brand vishing extortion targets financial services and enterprise cloud environments</b>: Telemetry and infrastructure analysis reveal that UNC6671 has not disbanded. Instead, the threat group has diversified its operations across multiple extortion fronts including Redact, Pink, Helix, and Falcon and continues to rely on voice phishing to target enterprise employees. <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments\"><b>Read more</b></a>.</li><li><b>Keyv and cacheable npm package hijacked in supply chain attack</b>: Wiz Research is actively investigating an ongoing software supply chain attack affecting multiple keyv/cacheable npm packages. <a href=\"https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack\" target=\"_blank\"><b>Read more</b></a>.</li><li><b>Inside the Metabase SQLi: Exploited in the wild</b>: Wiz has reverse engineered Metabase CVE-2026-72898 with AI to accelerate defense. Here’s what we learned. <a href=\"https://www.wiz.io/blog/inside-the-metabase-sqli-exploited-in-the-wild\" target=\"_blank\"><b>Read more</b></a>.</li></ul><p>Please visit the Google Cloud blog for more threat intelligence stories <a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\">published this month</a>.</p></div>\n<div class=\"block-paragraph\"><h3><b>Now hear this: Podcasts from Google Cloud</b></h3><ul><li><b>Cloud Security Podcast: All about Project Atlas, Wiz's AI vulnerability research</b>: Near Orfeld, head of vulnerability research, Wiz, discusses how his team uses multi-agent AI systems for discovering high-impact zero-day vulnerabilities in cloud infrastructure. <a href=\"https://www.youtube.com/watch?v=qRJJ9ekpuVg\" target=\"_blank\"><b>Listen here</b></a>.</li><li><b>Cloud Security Podcast: How Google eliminates classes of vulnerabilities at scale</b>: How do you build the foundations for a secure Google-scale enterprise that stays secure even if an AI is writing the code and nobody has time to review it? Christoph Kern, principal security engineer, Google, explores what secure-by-design really means in the AI era. <a href=\"https://www.youtube.com/watch?v=43imRRfgLgc\" target=\"_blank\"><b>Listen here</b></a>.</li></ul><p>To have our Cloud CISO Perspectives post delivered twice a month to your inbox, <a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\">sign up for our newsletter</a>. We’ll be back in a few weeks with more security-related updates from Google Cloud.</p></div>"
  "bedb939a3653bded9800758022a765c4":
    "id": "bedb939a3653bded9800758022a765c4"
    "title": "How agents can delegate better"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/how-agents-can-delegate-better/"
    "published": "2026-08-22 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In any organizational behavior class, students will learn that effective delegation is among the most important skills for a seasoned leader. Getting meaningful work done involves careful coordination, starting with a subdivision of projects into manageable tasks, mapped onto the skills of the team, and assigned to the right people.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google Cloud, we’re learning a similar lesson when it comes to building and deploying AI agents in enterprise workflows. These workflows are best approached by multi-agent systems that can break apart and execute complex tasks. To do so, AI agents need to become good delegators. </span></p>\n<p><span style=\"vertical-align: baseline;\">To learn how, we turned to research from Google DeepMind. In their recent study titled </span><a href=\"https://arxiv.org/abs/2602.11865\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intelligent AI Delegation</span></a><span style=\"vertical-align: baseline;\">, they prove how delegation itself involves intelligence: adaptive negotiations, aligning on formal contracts, and security guardrails. </span></p>\n<p><span style=\"vertical-align: baseline;\">This work opens up new opportunities for customers building AI agents that can communicate, share tasks, and coordinate towards set objectives. Today, we’ll share four principles that emerged from that work, and how you might apply them to your own workflows. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Principle 1: Verify delegated work </strong></h3>\n<p><span style=\"vertical-align: baseline;\">If we are to permit AI to delegate tasks, we want it to do more than arbitrarily assign work. Agents should intelligently break down work into tasks that can be reliably verified. In our research, we call this \"contract-first decomposition.\" </span></p>\n<p><span style=\"vertical-align: baseline;\">Like human delegation, this takes thoughtful deliberation. With people, this might mean a leader understanding their team’s strengths, and perhaps checking their work before it’s completed. For AI, there’s a similar learning curve. The orchestrating AI (the manager that sits atop a multi-agentic system) may consider multiple plans for how best to decompose and assign work, and keep decomposing sub-goals into smaller and smaller chunks until they become sufficiently simple to monitor and verify. Ideally, this should result in a plan where everything can be reliably graded. In reality, however, this may not always be possible to achieve. </span></p>\n<p><span style=\"vertical-align: baseline;\">Sometimes, it may be necessary to involve subjective assessment of whether work has been completed successfully, in line with expectations. Rather than being a problem, identifying such components helps us determine where human time is best spent, and how best to involve human expert judgement in oversight of agentic systems.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Principle 2: Be smart about cost</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The research framework helps us answer a question that keeps coming up with customers: Can this particular task be handled by a smaller, cheaper model? Enterprises are increasingly attentive to cost, and rightly so. </span></p>\n<p><span style=\"vertical-align: baseline;\">Finding the right balance between performance and budget is tricky. Taking a complex problem, like payroll, and handing it off to a lightweight model, might not be powerful enough for the results you want. On the other hand, it’s unnecessary to route simple tasks, like reformatting a spreadsheet, to a strong reasoning model. </span></p>\n<p><span style=\"vertical-align: baseline;\">According to the research, an agent that is intelligent about delegation would learn to recognize these scenarios, and match each task to the right tool or endpoint, to achieve the desired result and maximum reliability at a minimum cost. Use of model routing capabilities within API gateways is becoming a popular choice among customers, in addition to the alternative for using client-side proxies (such as LiteLLM). </span></p>\n<p><span style=\"vertical-align: baseline;\">You can learn more about model routing </span><a href=\"https://docs.cloud.google.com/api-gateway/docs/model-routing-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Principle #3: Respect sensitive data </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Many workflows handle private, sensitive data, and AI agents need to respect those boundaries and permissions. For example, if you’re deploying your orchestrator agent for payroll data, you know that agent should never pass along its full set of information to a sub-agent. This not only compromises security, but also bloats the context window for agents and degrades performance. An agent should grant the absolute minimum permissions required to complete that specific assignment, and nothing more. </span></p>\n<p><span style=\"vertical-align: baseline;\">The challenging part arises when needing to demonstrate, according to our first principle, that work has been reliably completed, without revealing private information. According to the research , advanced cryptography can help address this, via techniques such as zero-knowledge proofs. Zero-knowledge proofs enable one AI agent to prove to the other AI agent that a planned computation was performed correctly, without revealing the data itself. For example, an agent tasked with analyzing a sensitive dataset can generate a succinct non-interactive argument of knowledge that proves a specific property of the result. This enables the delegator to instantly verify the validity of the proof.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Principles #4: Beware the zone of indifference</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The zone of indifference is a term coined by Chester Barnard, an American business executive, in his 1938 book called </span><span style=\"font-style: italic; vertical-align: baseline;\">The Function of the Executive. </span><span style=\"vertical-align: baseline;\">The zone is the space in which an employee will accept a task without questioning it. The task usually falls within their scope, so they unconsciously accept it. For example, if you’re a sales rep and your manager asks you to attend an upcoming pitch with a valued client, you probably wouldn’t push back or think too deeply about it.</span></p>\n<p><span style=\"vertical-align: baseline;\">As expressed in the research, current AI systems are defined by post-training safety filters and system instructions. As long as a request does not trigger a hard violation, the model complies. But when considering the emerging agentic web, this compliance might actually create a systemic risk. As mentioned in the research, “As delegation chains lengthen (? → ? → ?), a broad zone of indifference allows subtle intent mismatches or context-dependent harms to propagate rapidly downstream, with each agent acting as an unthinking router rather than a responsible actor.”</span></p>\n<p><span style=\"vertical-align: baseline;\">This has serious implications, because it means intelligent delegation requires “dynamic cognitive friction.” This means validating the information provided to agents to ensure that they are accurate, relevant, controlled and efficient. </span></p>\n<p><span style=\"vertical-align: baseline;\">This way, an agent can recognize when a request is ambiguous enough to warrant stepping outside their zone of indifference to challenge the delegator, or request human verification. Human participation and oversight similarly presume a degree of cognitive friction and active engagement, though this must be carefully managed, so as not to over-burden the users of the system. Human time is valuable and should only be invoked when necessary.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Looking ahead</strong></h3>\n<p><span style=\"vertical-align: baseline;\">At Google Cloud, our long-term goal is to integrate agents naturally and efficiently into organizations, which will mean delegating to and from human experts and respecting boundaries. Together, we believe this will deliver business value beyond what individual agents can handle. </span></p>\n<p><span style=\"vertical-align: baseline;\">Ready to navigate the agentic web? Read Google DeepMind’s report paper, </span><a href=\"https://arxiv.org/abs/2602.11865\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Intelligent AI Delegation</span></a><span style=\"vertical-align: baseline;\">, on arXiv. </span></p>\n<hr />\n<p><sub><span style=\"font-style: italic; vertical-align: baseline;\">Note: A special thanks to Matija Franklin, Simon Osindero from Google DeepMind, and Vishal Agarwal, Andrea Morange from Google Cloud, for their contributions.</span></sub></p></div>"
