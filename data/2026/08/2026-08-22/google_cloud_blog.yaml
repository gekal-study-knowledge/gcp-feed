    "title": "What’s new with Google Cloud"
    "link": "https://cloud.google.com/blog/topics/inside-google-cloud/whats-new-google-cloud/"
    "published": "2026-08-22 01:00:00"
    "fetched": "2026-08-27 21:31:27"
    "summary": "<div class=\"block-paragraph\"><p>Want to know the latest from Google Cloud? Find it here in one handy location. Check back regularly for our newest updates, announcements, resources, events, learning opportunities, and more. </p><hr /><p><b>Tip</b>: Not sure where to find what you’re looking for on the Google Cloud blog? Start here: <a href=\"https://cloud.google.com/blog/topics/inside-google-cloud/complete-list-google-cloud-blog-links-2021\">Google Cloud blog 101: Full list of topics, links, and resources</a>.</p><hr /><p></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: []&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3>Aug 17 - Aug 21</h3>\n<ul>\n<li><strong>Webinar: Agent Identity as the backbone for secure AI innovation</strong><br />An AI agent with a stolen API key looks identical to a legitimate one. As autonomous agents scale across enterprise systems, static credentials and legacy IAM policies can no longer keep up with machine-speed execution. Join Shaun Liu, Product Manager at Google Cloud, on August 27 at 1 PM ET to explore Google Cloud’s vision for unifying agent, human, and nonhuman identity into a workload-centric platform using verifiable cryptographic identities (SPIFFE, ID-JAG, OAuth).<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://www.brighttalk.com/webcast/18282/673389?utm_source=Social\" rel=\"noreferrer noopener\" target=\"_blank\">Register for the webinar now</a></li>\n</ul>\n<h3>Aug 10 - Aug 14</h3>\n<ul>\n<li><strong>Diagnosing Apigee Hybrid Cassandra Read Latency for Peak Performance<br /></strong>Diagnose real-time Cassandra read latency and resolve API key verification bottlenecks in Apigee Hybrid with this step-by-step troubleshooting guide. Learn how to deploy a debugging client and query performance tables to maintain sub-millisecond response times. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4bXcW4w\" rel=\"noreferrer noopener\" target=\"_blank\"><em>Read the Apigee Hybrid Cassandra Troubleshooting Guide</em></a></li>\n<li><strong>Keep moving with agents! The All Things Agentic Hackathon is officially live.<br /></strong>We're challenging builders to build next-generation agents that take on the busy work and handle the heavy lifting in the background using Gemini 3.5 and Google Cloud. Compete for your share of $190,000 in prizes, cash, and Google Cloud credits! Submissions are open from August 3, 2026, to August 31, 2026.<br /><br /><a href=\"https://cloudblog.withgoogle.com/rss/allthingsagentichackathon.devpost.com\" rel=\"noopener\" target=\"_blank\">Learn more and register</a>. <a href=\"https://cloudblog.withgoogle.com/rss/g.dev/cloud/all-things-agentic\" rel=\"noopener\" target=\"_blank\">Sign up</a> for GEAR to get exclusive updates and your badge. #AllThingsAgenticHackathon</li>\n<li><strong>Accelerate PostgreSQL migrations using Gemini in Database Migration Service<br /></strong>Enterprise database migrations often stall during the \"last mile\" of translating legacy stored procedures, triggers, and custom functions from Oracle or SQL Server. Database Migration Service (DMS) now provides AI-assisted code conversion powered by Gemini in Databases. By combining deterministic compiler rules for 1:1 syntax with Gemini contextual synthesis for complex procedural blocks, DMS converts legacy code into native PostgreSQL and AlloyDB with full schema awareness and side-by-side validation.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/products/databases/accelerate-postgresql-migrations-with-gemini-in-dms\" rel=\"noreferrer noopener\" target=\"_blank\">Read the full blog post</a> to learn how to streamline your database code conversion.</li>\n<li><strong>Compute Flex CUDs now available for G2 and G4 GPU VMs<br /></strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/compute/docs/instances/committed-use-discounts-overview#spend_based\" rel=\"noreferrer noopener\" target=\"_blank\">Compute Flexible Committed Use Discounts (Flex CUDs)</a> are now available for <strong>G2 (NVIDIA L4) </strong>and <strong>G4 (NVIDIA RTX Pro 6000) VMs</strong>. You can now lock in predictable savings while retaining the flexibility to adapt across VM families, migrate between regions, and combine general-purpose compute, GKE, Cloud Run, and G2 &amp; G4 GPU VMs under a single spend commitment. Flex CUDs for G-series VMs let you lock in savings today while preserving the agility to upgrade to latest hardware without disruption!<br /><br />Explore<a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/compute/vm-instance-pricing\" rel=\"noreferrer noopener\" target=\"_blank\"> VM instance pricing</a> or learn more about <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/compute/docs/instances/committed-use-discounts-overview#spend_based\" rel=\"noreferrer noopener\" target=\"_blank\">Flex CUDs</a>.</li>\n<li><strong>Rapid Bucket accelerates the training and checkpoint performance in PyTorch Ecosystem via GCSFS<br /></strong>With the release of GCSFS <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://github.com/fsspec/gcsfs/releases/tag/2026.8.0\" rel=\"noreferrer noopener\" target=\"_blank\">2026.8.0</a>, organisations can now unlock maximum ROI from their AI/ML infrastructure by eliminating data starvation on GPUs in PyTorch ecosystem when they are using Frameworks like Dask, Pandas, PyTorch , PyTorch Lightning, Hugging Face Datasets, Ray dataetc. By making adaptive concurrent prefetching the default, GCSFS dynamically predicts and background-fetches sequential read patterns—boosting single-file throughput by 5x, and scaling up to 21 GiB/s , saturating the NIC when paired with <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/storage/docs/rapid/rapid-bucket\" rel=\"noreferrer noopener\" target=\"_blank\">Rapid Bucket</a>. Saturating the NIC translates to significantly improved <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/products/ai-machine-learning/goodput-metric-as-measure-of-ml-productivity\" rel=\"noreferrer noopener\" target=\"_blank\">accelerator goodput</a> and reduced training wait times with zero integration friction. Training and checkpoint restore workflows benefit from intelligent memory management that automatically drains the buffer during random reads to completely avoid bandwidth or memory penalties.</li>\n</ul>\n<h3>Aug 3 - Aug 7</h3>\n<ul>\n<li><strong>Navigate data sovereignty and AI innovation with hybrid cloud</strong><br />For enterprises facing strict compliance rules, keeping sensitive data on-premises often means missing out on cutting-edge AI. Data from the 2026 State of AI Infrastructure report reveals that 52% of IT leaders are adopting hybrid cloud strategies to bridge this gap. Our latest blog post explores how Google Distributed Cloud (GDC) helps organizations deploy connected or air-gapped models to run advanced AI entirely within secure environments—mitigating geopolitical risks without sacrificing innovation. <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/topics/hybrid-cloud/state-of-ai-infrastructure-report-on-hybrid-cloud-and-gdc\" rel=\"noreferrer noopener\" target=\"_blank\">Read more</a>.</li>\n<li><strong>SAP and Google Cloud Launch BDC Connect for BigQuery<br /></strong>For years, enterprises have struggled with the cost, risk, and complexity of moving mission-critical SAP data into advanced analytics platforms. The general availability of SAP Business Data Cloud (BDC) Connect for BigQuery marks a turning point. By introducing revolutionary zero-copy, bi-directional data sharing, this new capability seamlessly bridges SAP systems with Google Cloud's powerful data and AI ecosystem. Instead of wrestling with manual data duplication and lost business context, organizations can now eliminate silos, dramatically lower their analytics costs, and rapidly deploy trustworthy, agentic AI solutions grounded in real-time operational reality. <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/products/sap-google-cloud/sap-and-google-cloud-launch-bdc-connect-for-bigquery?e=48754805\" rel=\"noreferrer noopener\" target=\"_blank\">Read the full announcement to learn how to transform your data strategy</a>.</li>\n<li><strong>Google Cloud Cortex Framework version 7 is now generally available!<br /></strong>This release helps you modernize your data architecture for AI agent readiness, enabling you to quickly deploy, customize, and extend robust data products while simplifying orchestration and reducing infrastructure overhead. It provides <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/cortex/docs/data-product#available_data_products\" rel=\"noreferrer noopener\" target=\"_blank\">data product accelerators</a> for SAP-sourced data to build trusted, high-quality <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/cortex/docs/data-product\" rel=\"noreferrer noopener\" target=\"_blank\">data products</a> ready for advanced analytics and agentic use cases. The Framework integrates with Google Cloud products including <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/bigquery/docs\" rel=\"noreferrer noopener\" target=\"_blank\">BigQuery</a>, <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/dataform/docs\" rel=\"noreferrer noopener\" target=\"_blank\">Dataform</a>, <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/dataplex/docs\" rel=\"noreferrer noopener\" target=\"_blank\">Knowledge Catalog</a>, and <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\" rel=\"noreferrer noopener\" target=\"_blank\">Gemini Enterprise Agent Platform</a>. Learn more in our <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/products/sap-google-cloud/cortex-framework-v7-power-ai-agents-with-sap-data-faster?e=48754805\" rel=\"noreferrer noopener\" target=\"_blank\">announcement blog</a>, <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/cortex/docs/overview\" rel=\"noreferrer noopener\" target=\"_blank\">technical documentation</a>, or try a <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/cortex/docs/demo-deployment\" rel=\"noreferrer noopener\" target=\"_blank\">demo deployment</a> today. </li>\n<li><strong>From API Management to AI Gateway with Apigee<br /></strong>Massive LLM adoption unlocked automation but exposed critical vulnerabilities, from unpredictable token costs to security risks like prompt injection. Without central management, organizations face accelerated technical debt. Learn how to transform Apigee into an enterprise AI Gateway to centralize governance. This architectural roadmap details how to utilize semantic cache to optimize token costs, implement prompt protection policies for security, and productize tools using the emerging MCP standard.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/44PIO7p\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Read the full architectural roadmap on the Apigee Community Hub</strong></a></li>\n<li><strong>Centrally govern enterprise AI traffic with Apigee AI Gateway<br /></strong>Manage, track, and secure model communication across your entire infrastructure from a single pane of glass. In a new video walkthrough, Principal Architect Tyler Ayers demonstrates how Apigee AI Gateway simplifies agentic governance. Learn how to transparently proxy model traffic, log real-time token counts, and apply runtime security quotas without impacting your developer workflow.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/44bBi6q\" rel=\"noreferrer noopener\" target=\"_blank\">Watch the Apigee AI Gateway demo</a></li>\n<li><strong>Maximize Provisioned Throughput Utilization<br /></strong>Sudden traffic micro-spikes can exceed per-second quotas, triggering 429 errors or forcing overflow into shared resource pools. A new architectural guide demonstrates how to build a serverless \"shock absorber\" using Cloud Run and Google Cloud Tasks. By decoupling request ingestion from execution, this queue-based pattern flattens volatile traffic bursts and smoothly drips requests to Gemini at your exact quota rate, maximizing Provisioned Throughput utilization while eliminating job failures during peak usage. <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://medium.com/google-cloud/smoothing-spiky-llm-traffic-maximize-provisioned-throughput-utilization-with-a-queuing-176753d96818\" rel=\"noreferrer noopener\" target=\"_blank\">Read the step-by-step setup guide</a>.</li>\n<li><strong>Eliminate security blindspots in agentic tool interactions<br /></strong>Unmonitored agentic tool calls via the Model Context Protocol (MCP) can introduce critical security risks to your enterprise architecture. Join our technical deep dive on Thursday, August 13, to discover how to position Apigee as a centralized security gateway. Featuring the new ParsePayload policy and payload operations groups in API Products, this session demonstrates how to enforce granular tool filtering, manage execution quotas, and scale secure agent ecosystems without impeding developer velocity. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4y4j44A\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register for the August 13 Community TechTalk</strong></a></li>\n</ul>\n<h3>Jul 27 - Jul 31</h3>\n<ul>\n<li><strong>Data Cloud and Apigee CDMX: The AI Agent Evolution | August 12, 2026<br /></strong>Enterprise AI demands evolution beyond basic conversational assistants. To generate real value, AI models must connect with the organization's core systems and live data sources. Join us this August 12 at <strong>Google CDMX </strong>for the exclusive event <strong>AI Evolution: Powering Tomorrow's Enterprise</strong>. Learn how to design an agile and secure ecosystem by unifying the power of Gemini, Apigee, and data agent technologies through practical demonstrations led by Google Cloud engineers.<br /><br />Secure your spot for the in-person session in Mexico City <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/3TyS9hg\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register now!</strong></a></li>\n<li><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://vastedge.com/\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Vast Edge</strong></a>, built on GCP, launches the first live recovery interface for cloud backups, enabling IT teams to inspect backup contents in real time. This transforms backups from a blind, log-based process into an interactive platform where teams can <strong>instantly search, preview, and validate the exact data available for restore</strong>.<br /><br />This platform protects Google Workspace, NetSuite, Salesforce, Workday and many SaaS environments, providing complete visibility and enterprise-grade oversight.<br /><br />Visit<strong> </strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://vastedge.com/backup-and-disaster-recovery\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Vast Edge Backup &amp; Disaster Recovery</strong></a> and get a free trial of their backup solutions on the GCP Marketplace for<strong> </strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://console.cloud.google.com/marketplace/product/vastedge-public/google-workspace-backup-restore?hl=en\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Google Workspace Backup</strong></a>,<strong> </strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://console.cloud.google.com/marketplace/product/vastedge-public/netsuite-backup-restore?hl=en\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>NetSuite Backup</strong></a>,<strong> </strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://console.cloud.google.com/marketplace/product/vastedge-public/salesforce-backup-restore-vastedge?hl=en\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Salesforce Backup</strong></a>,<strong> </strong>and<strong> </strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://console.cloud.google.com/marketplace/product/vastedge-public/workday-backup-restore-vastedge?hl=en\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Workday Backup</strong></a><strong>.</strong></li>\n</ul>\n<h3>Jul 20 - Jul 24</h3>\n<ul>\n<li><strong>Claude Opus 5, Anthropic’s latest model, is now available on Agent Platform.</strong> It brings performance improvements over Opus 4.8 across coding, long-running agents, and knowledge work.The model is Zero Data Retention (ZDR) compatible. For safety, high-risk workflows — such as penetration testing or exploit generation — it will notify you and fall back to Opus 4.8.We’re excited to continue to offer enterprise customers options across frontier models to build, deploy, and scale AI securely. Try it <a href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-opus-5\">here</a>. </li>\n<li><strong>Apigee Northam Roadshow 2026 | The AI Agent Evolution: Powering Tomorrow's Enterprise<br /></strong>AI is evolving. As your organization deploys autonomous agents, the integration between APIs and models becomes critical. Join Google Cloud specialists for an exclusive day of deep-dive sessions and live demos. Discover how the unified power of Apigee and the Google Cloud Agent Platform allows you to build, govern, and scale high-performance AI agents with complete control.  Call to Action: <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4gOIblK\" rel=\"noreferrer noopener\" target=\"_blank\">Register for Sunnyvale</a> | <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/3TLCPhi\" rel=\"noreferrer noopener\" target=\"_blank\">Register for NYC</a> | <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/45e67I0\" rel=\"noreferrer noopener\" target=\"_blank\">Register for Chicago</a></li>\n<li><strong>Deploy an Apigee Proxy for MCP Registry Discovery  <br /></strong>Learn how to deploy an Apigee X proxy to format Apigee API Hub data into the Model Context Protocol (MCP) Registry format. This tutorial by Tyler Ayers guides developers through cloning the sample repository, deploying using the Apigee Feature Templater (aft), and testing the endpoint to make API data easily discoverable by coding agents. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/3RTus2N\" rel=\"noreferrer noopener\" target=\"_blank\">Read the full community tutorial to get started.</a></li>\n<li><strong>Simplify AI Infrastructure: Getting Started with Apigee AI Gateway<br /></strong>Managing a complex AI landscape with multiple backend environments can present significant operational and governance challenges. A new tutorial walks you through how to build a unified API proxy using Apigee AI Gateway. By establishing a single, secure entry point for all model traffic, teams gain access to real-time analytics, comprehensive tracing, and financial operations auditing—completely seamlessly, and with absolutely no modifications required to client environments or user configurations. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4wI5Por\" rel=\"noreferrer noopener\" target=\"_blank\">Read the step-by-step setup guide</a></li>\n<li><strong>Your AI agents are ready. Is your data?<br /></strong>The biggest bottleneck to scaling AI isn't the models—it's giving them access to business context. As enterprises move to proactive systems of action, legacy infrastructure often buckles under the nonlinear speed of AI agents. Google Cloud’s new Agentic Data Cloud, built on AI-native infrastructure, solves this by unifying data, AI models, and operational databases. Discover how a borderless Lakehouse and active Knowledge Catalog can empower your AI agents with trusted, real-time context without unnecessary engineering overhead. <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/topics/ai-infrastructure/state-of-ai-infrastructure-report-and-the-agentic-data-cloud\" rel=\"noopener\" target=\"_blank\">Read more</a>.</li>\n<li><strong>Secure and govern your AI at Apigee AI Horizon in London<br /></strong>Moving AI from basic prompts to complex agentic workflows requires trust and control. Join us on Tuesday, 1st September 2026 at Google London for our 5th edition of Apigee AI Horizon. Discover how Google Cloud product leaders and architects are using Apigee and Model Armor to secure LLM APIs, implement policy controls, and manage token consumption. Do not miss this one—register soon!<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4b8XamT\" rel=\"noreferrer noopener\" target=\"_blank\">Secure your spot for AI Horizon London</a></li>\n</ul>\n<h3>Jul 13 - Jul 17</h3>\n<ul>\n<li><strong>Resource-Based CUD Sharing is Now Enabled by Default</strong><br />Starting <strong>June 16, 2026</strong>, the default setting for Google Cloud <strong>Resource-based Committed Use Discount (CUD)</strong> sharing will change from disabled to <strong>enabled</strong> for new billing accounts and eligible existing accounts without active CUDs. This update automatically maximizes your savings by pooling underutilized discounts across your resources.<br /><br />You retain full control and can adjust your CUD sharing preferences at any time by changing your CUD scope configuration. For instructions, see <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/compute/docs/committed-use-discounts/share-resource-cuds-across-projects#turning-on-committed-use-discount-sharing\" rel=\"noreferrer noopener\" target=\"_blank\">Enable CUD sharing</a> or <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/compute/docs/committed-use-discounts/share-resource-cuds-across-projects#turning-off-committed-use-discount-sharing\" rel=\"noreferrer noopener\" target=\"_blank\">Disable CUD sharing</a>.</li>\n<li><strong>Webinar for India: Google Cloud for EdTech: Optimizing Traffic and Token Governance at Scale<br /></strong>API traffic surges and AI model integration are reshaping the EdTech landscape. Join Satyam Maloo for the webinar<strong> Google Cloud for EdTech: Optimizing Traffic and Token Governance at Scale </strong>on July 23, 2026. Learn to implement advanced rate limiting, gain granular token visibility, and leverage real-time analytics to govern your platform effectively. Whether you’re scaling for peak academic seasons or integrating complex AI workflows, this session provides the infrastructure blueprint you need.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4yqrKm0\" rel=\"noreferrer noopener\" target=\"_blank\">Register Now</a></li>\n<li><strong>Scaling AI Agents: Treat prompts like software artifacts<br /></strong>As AI agents move into production, monolithic system prompts often result in configuration drift, merge conflicts, and silent runtime failures. The solution is adopting a <em>Prompts-as-Code</em> architecture. By breaking prompts into modular skill files and using a build-time transpiler, engineering teams can introduce dependency resolution, static validation, and CI/CD rigor to their agent's control plane. Stop manually editing massive text files and start building deterministic, reliable agent infrastructure.<br /><br />Read more <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://developers.googleblog.com/building-scalable-ai-agents-with-modular-prompt-transpilation/\" rel=\"noreferrer noopener\" target=\"_blank\">here</a>.</li>\n</ul>\n<h3>Jul 6 - Jul 10</h3>\n<ul>\n<li><strong>Webinar: Introducing Google Cloud NGFW Enterprise advanced malware protection - powered by Palo Alto Networks<br /></strong>Discover the new Cloud NGFW advanced malware sandbox, arriving in preview later this year. Powered by Palo Alto Networks Advanced Wildfire, it leverages data from 70,000+ customers to help defeat advanced malware. Join us on July 16 at 11 AM EDT to learn how to build a resilient, zero-trust cloud infrastructure that protects your apps and data, wherever they reside.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://www.brighttalk.com/webcast/18282/668861?utm_source=GCBlog\" rel=\"noreferrer noopener\" target=\"_blank\">Register for the webinar now</a></li>\n<li><strong>Safely run AI-generated code in Cloud Run sandboxes<br /></strong>Cloud Run sandboxes, now in public preview, are lightweight, isolated execution boundaries that you can spawn near-instantly <strong>within your existing Cloud Run service instances</strong>.<br /><br />Whether you need to let an LLM run a dynamically generated Python script to calculate business margins or spin up a headless browser to perform web research, Cloud Run sandboxes give you a secure, isolated sandbox to run these tasks without leaving your serverless environment.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-run-sandboxes-are-in-public-preview\" rel=\"noreferrer noopener\" target=\"_blank\">Read the blog</a><span> to learn more and get started today.</span></li>\n<li><strong>Australia API Horizon: Scaling Enterprise Governed AI Agents<br /></strong>The transition from AI chatbots to autonomous agents is the most critical integration point for your business. Join Google Cloud at our upcoming events to explore exclusive deep-dive sessions on architecting for the agentic era.<br /><br />Discover how to use Apigee as an intelligent AI Gateway to govern, secure, and scale high-performance architectures. You will learn to seamlessly build AI tools from your existing APIs and maintain control over your entire ecosystem.<br /><br />Join us in your preferred city:\n<ul>\n<li><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4voh18S\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Sydney:</strong> July 28, 2026, at Google Sydney, One Darling Island.</a></li>\n<li><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4h2x0FS\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Canberra:</strong> July 29, 2026, at Hotel Realm.</a></li>\n<li><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4yisb1F\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Melbourne:</strong> August 4, 2026, at Google Melbourne.</a></li>\n</ul>\n</li>\n<li><strong>Build highly available, multi-region services on Cloud Run<br /></strong>Maintaining uptime for business-critical applications just got a lot easier on Cloud Run. Service health, now Generally Available, automates cross-region failover by leveraging readiness probes for instance-level health checks with a simple, two-click setup. You can configure service health with global external Application Load Balancers for public-facing applications or cross-region internal Application Load Balancers for private networking traffic.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/run/docs/configuring/configure-service-health\" rel=\"noreferrer noopener\" target=\"_blank\">Learn how to configure service health for Cloud Run.</a></li>\n<li><strong>Report: 83% of organizations need infrastructure upgrades for agentic AI<br /></strong>The shift from conversational bots to autonomous agents is breaking legacy systems. Our new <em>State of AI Infrastructure</em> report details how engineering leaders are adapting to these massive new workloads. To eliminate inference bottlenecks, control hidden scaling costs, and manage agent sprawl, the industry is rapidly moving toward fluid compute, centralized governance, and unified, co-designed architectures.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/products/compute/state-of-ai-infrastructure-report-overview?e=48754805\" rel=\"noreferrer noopener\" target=\"_blank\">Explore our key infrastructure insights</a></li>\n<li><strong>Stop tinkering, start scaling: the industrialized AI Playbook<br /></strong>Did you know that only 5% of custom AI investments actually return measurable business value? The problem isn’t the technology—it’s how organizations are wired to run it.<br /><br />In this compelling read, Google Cloud Consulting breaks down the operational blueprint that bridges the stark gap between \"cool tech experiments\" and real, P&amp;L-impacting enterprise ROI.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://www.google.com/url?q=https%3A%2F%2Fmedium.com%2F%40kjouannigot_73547%2Fscaling-trusted-ai-google-cloud-insights-to-capture-enterprise-roi-aa6c9b308adb\" rel=\"noreferrer noopener\" target=\"_blank\">Read the full article on Medium</a></li>\n<li><strong>AI Agent Clinic: Slashing App Latency by 80%<br /></strong>Prototyping an AI agent is easy, but scaling for live traffic presents unique challenges. In the latest AI Agent Clinic, our technical experts partner with a developer to optimize PlaybackIQ, a live football analysis agent. This session demonstrates how to use OpenTelemetry to trace bottlenecks in the Gemini Enterprise Agent Platform and deploy to Cloud Run for high-concurrency scaling, achieving an 80% reduction in response time. Learn production-grade debugging strategies to optimize your own LLM applications.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://www.google.com/search?q=https://youtu.be/G7olcqETSn8\" rel=\"noreferrer noopener\" target=\"_blank\">Watch the 60-minute teardown</a></li>\n</ul>\n<h3>Jun 29 - Jul 3</h3>\n<ul>\n<li><strong>Claude Sonnet 5, Anthropic’s latest model, is now available on Agent Platform</strong>. <br />This addition serves as a drop-in replacement for Sonnet 4.6, giving organizations expanded choice for task completion across enterprise workflows. It features enhanced reasoning, cleaner code generation, and computer use capabilities for desktop and browser workflows.<br /><br />By continuing to rapidly bring frontier models to our platform, Google Cloud offers an uncompromised choice of the industry's best technology to build, test, and scale enterprise-grade AI.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://console.cloud.google.com/agent-platform/publishers/anthropic/model-garden/claude-sonnet-5?hl=en\" rel=\"noreferrer noopener\" target=\"_blank\"><em>Get started today.</em></a></li>\n<li>\n<p><strong>Automate your AI governance with Apigee and YAML<br /></strong><span>Manual API gateway configurations can quickly slow down your AI engineering velocity. Join the Apigee community on Thursday, July 16, to discover an automated, declarative blueprint for model garden management. Learn how a simple, repeatable YAML pattern lets your AI practitioners instantly spin up secure, policy-backed enterprise configurations  without friction. Bring your questions and connect during our live Q&amp;A session. </span></p>\n<p><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4y4j44A\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register for the July 16 Community TechTalk</strong></a></p>\n</li>\n<li>\n<p><strong>Build next-generation AI portals for autonomous agents<br /></strong><span>Standard developer portals were designed for human developers to subscribe to static APIs. Today, autonomous agents, LLM toolkits, and dynamic runtimes demand a central nervous system for governance. Join our technical deep dive on Thursday, July 23, to explore Apigee's new AI Portals solution. You will see exactly how to deploy full-service, MCP powered hubs to safely manage enterprise self-service for models, tools, and agents. </span></p>\n<p><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4y4j44A\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register for the July 23 Community TechTalk</strong></a></p>\n</li>\n<li><strong>Protect your infrastructure from advanced cyberattacks at the API layer (Presented in Portuguese)<br /></strong>In an era of increasingly sophisticated threats, relying solely on traditional firewalls leaves critical data gaps. Join our technical community TechTalk on Thursday, July 30—conducted in Portuguese—to learn how to proactively mitigate risks directly at the gateway layer. This session demonstrates how to configure and govern essential Apigee security policies to build a robust line of defense, ensuring maximum availability and complete integrity for your enterprise microservices. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4y4j44A\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register for the July 30 Portuguese Community TechTalk</strong></a></li>\n</ul>\n<h3>Jun 22 - Jun 26</h3>\n<ul>\n<li><strong>Accelerate TPU model loading while saving RAM on GKE.<br /></strong>Large model cold starts often stall scaling and leave high-value TPUs idle. The open-source <strong>Run:ai Model Streamer</strong> now natively supports TPUs with Google Cloud Storage in<strong> </strong><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://github.com/vllm-project/tpu-inference\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>TPU vLLM 0.18.0</strong>.</a> This integration accelerates inference pipelines on GKE by streaming tensors directly into CPU memory, bypassing local disk bottlenecks and the \"double-buffering\" trap. In benchmarks, loading a 480B parameter model was <strong>over 2x faster</strong> while cutting peak host memory usage by half. <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://discuss.google.dev/t/accelerate-tpu-model-loading-while-saving-ram-on-gke/374835\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Read the full guide and get started today</strong></a>.</li>\n<li><strong>Stop Training Blind: Scaling AI with the New OpenTelemetry-Based TPU AI Telemetry Collector Agent<br /></strong>Google Cloud’s new AI Telemetry Collector agent standardizes TPU monitoring using OpenTelemetry. It optimizes enterprise ML workloads by identifying silent failures and providing zero-cost operational metrics without draining host CPU cycles. The agent seamlessly routes telemetry to Google Cloud Monitoring or Prometheus and custom Grafana setups. Pre-installed on Google-optimized Ubuntu images or available via Docker, it tracks memory, network latency, and core utilization to maximize multi-node training efficiency.<br /><br />You can read more of this capability by clicking this <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://discuss.google.dev/t/stop-training-blind-scaling-ai-with-the-new-opentelemetry-based-tpu-ai-telemetry-collector-agent/375210\" rel=\"noreferrer noopener\" target=\"_blank\">link</a>.</li>\n</ul>\n<h3>Jun 15 - Jun 19</h3>\n<ul>\n<li><strong>Join us for a deep dive into agentic AI control with AppyThings<br /></strong>Your integrations aren’t failing—they are evolving. When users interact with AI agents, they no longer arrive directly at your site, resulting in experiences stripped of your context, expertise, and intended experience. Join us on Thursday, June 25, for a community tech talk in partnership with AppyThings to learn how to solve this new gateway challenge. We will explore how MTN laid an integration foundation with the Model Context Protocol (MCP) to deliver accurate, consistent experiences. Our technical experts will demonstrate how to leverage Apigee as a centralized tools management solution to govern agent access. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/3Sfle0y\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register for the session</strong></a></li>\n<li><strong>Optimize Spot VM Deployments with Capacity Advisor for Spot, Now in Public Preview<br /></strong>Google Compute Engine has launched <strong>Capacity Advisor for Spot</strong> to Public Preview, now open to all customers. This tool turns Spot capacity discovery into a data-driven process by providing real-time deployment recommendations to maximize obtainability and minimize preemption risks. Query the <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/compute/docs/instances/view-vm-availability\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Capacity Advisor API</strong></a> for obtainability and minimum estimated uptimes, or use the new <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://console.cloud.google.com/compute/capacityAdvisor\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Console UI</strong></a> featuring a global availability map, spot price lookups, and historical preemption rate trends to visually find the most cost-efficient compute capacity.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/compute/docs/instances/view-vm-availability\" rel=\"noreferrer noopener\" target=\"_blank\">Get started today</a> to start optimizing your Spot VM deployments!</li>\n<li><strong>Build a multi-tenant agentic AI system<br /></strong>When scaling generative AI across different business units, your teams need specialized AI agents with unique operational rules and tools. Our new reference architecture helps you build a centralized multi-tenant platform to prevent fragmented silos, eliminate data exposure risks, and maintain unified compliance. Read the guide to <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://docs.cloud.google.com/architecture/multi-tenant-agentic-ai-system\" rel=\"noreferrer noopener\" target=\"_blank\">design and deploy a multi-tenant agentic AI system</a> in Google Cloud.</li>\n<li><strong>How to Configure Gemini Enterprise to Connect to a Custom MCP Server<br /></strong>The Gemini Enterprise MCP Connector was a big announcement at Google Cloud Next because it introduces the ability to connect Gemini Enterprise to MCP servers. This blog <a href=\"https://medium.com/google-cloud/how-to-configure-gemini-enterprise-to-connect-to-a-custom-mcp-server-2e28adc96420\" rel=\"noopener\" target=\"_blank\">post</a> provides a step-by-step guide on how to configure your first Custom MCP Server connector using the Google Maps Ground Lite MCP server as an example. Once you understand this flow, you can configure multiple MCP servers with Gemini Enterprise to bring all the context you need.</li>\n</ul>\n<h3>Jun 8 - Jun 12</h3>\n<ul>\n<li><strong>Simplify Multi-Cloud Planning with Cloud Location Finder, now Generally Available</strong> <br />Cloud Location Finder provides up-to-date data on public regions, zones, and Google Distributed Cloud Connected locations across Google Cloud, AWS, Azure, and OCI. You can now programmatically discover locations based on provider, proximity, territory, and carbon footprint to optimize your global infrastructure strategy for performance, compliance, and sustainability. <br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/location-finder/docs\" rel=\"noreferrer noopener\" target=\"_blank\">Get started for free today</a></li>\n</ul>\n<h3>Jun 1 - Jun 5</h3>\n<ul>\n<li><strong>Modeling the physical world with BigQuery Graph</strong><br />Managing complex supply chains requires more than just spreadsheets; it requires a digital replica of the physical world. In this <a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://cloud.google.com/blog/products/data-analytics/modeling-a-digital-twin-using-bigquery-graph\" rel=\"noreferrer noopener\" target=\"_blank\">post</a>, Guru Rangavittal and Candice Chen explore how BigQuery Graph enables organizations to build a digital twin by turning physical assets into an interconnected map of nodes and edges. By moving beyond traditional relational databases, businesses gain real-time clarity into operations—from executing surgical ingredient recalls to analyzing weather-driven logistics risks. Discover how BigQuery Graph transforms reactive firefighting into proactive, precision modeling, allowing you to see critical connections in seconds and future-proof your supply chain.</li>\n<li><strong>Apigee for AI: Govern LLMs and MCP Servers (Presented in Spanish)<br /></strong>Learn how to securely transition your AI initiatives from experimental prototypes to enterprise-ready deployments. Join Luis Cuellar on June 18 for a technical deep dive (presented in Spanish) exploring Apigee’s latest AI gateway capabilities. Discover how to centralize governance over Model Context Protocol (MCP) servers, protect Large Language Models (LLMs) with robust API gateway security policies, and manage token-based quotas.<br /><br /><a class=\"colors-hyperlink-primary underline focus-visible outline-offset-0 rounded\" href=\"https://goo.gle/4dyC2Ie\" rel=\"noreferrer noopener\" target=\"_blank\"><strong>Register for the June 18 Spanish Community TechTalk</strong></a></li>\n</ul>\n<h3>May 25 - May 29</h3>\n<ul>\n<li>\n<p><strong><a href=\"https://www.anthropic.com/news/claude-opus-4-8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Anthropic’s Claude Opus 4.8</span></a><span style=\"vertical-align: baseline;\"> is now available on </span><a href=\"https://console.cloud.google.com/vertex-ai/publishers/anthropic/model-garden/claude-opus-4-8\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform</span></a></strong><span style=\"vertical-align: baseline;\"><strong>. </strong></span><span style=\"vertical-align: baseline;\">As we continue to expand our platform's model offerings, this addition gives organizations more options for handling complex, multi-stage enterprise workflows. Claude Opus 4.8 brings strong capabilities in agentic coding, allowing developers to manage extensive refactors and tracking dependencies over extended sessions.</span></p>\n</li>\n<li><strong>API Horizon Munich July 6, 2026: Orchestrating the Next Era of AI and APIs <br /></strong>Master the orchestration of next-gen AI and digital ecosystems. Join Google Cloud experts and DACH tech leaders on July 6 for an exclusive look at the Apigee roadmap, Agent Management, and Model Context Protocol (MCP). Gain real-world insights and connect with the regional integration community.<strong><br /><br /><a href=\"https://goo.gle/4dTxQmo\" rel=\"noopener\" target=\"_blank\">Register now</a></strong></li>\n<li><strong>Securing AI Agents: The Extended Agent Gateway Pattern<br /></strong>Learn how to prevent autonomous AI agents from invoking unauthorized APIs. Join Apigee Specialist Joel Gauci on June 4 for a technical deep dive into the Extended Agent Gateway pattern. This session covers enforcing Fine-Grained Authorization (FGA), implementing secure token exchange, and establishing Model Context Protocol (MCP) governance at the API gateway layer to protect enterprise backend services.<br /><br /><a href=\"https://goo.gle/4fbAsxg\" rel=\"noopener\" target=\"_blank\"><strong>Register for the June 4 Community TechTalk</strong></a></li>\n<li><strong>API-to-Agent Security: Exposing REST APIs to Gemini Enterprise via MCP<br /></strong>Connect Gemini Enterprise agents to core data without creating security hazards. Join Google Cloud Specialist Nigel Walters on June 11 to learn how to instantly transform legacy REST APIs into secure Model Context Protocol (MCP) servers. We’ll cover how to safely register tools with Gemini while enforcing gateway-level guardrails like rate limiting and access control policies.<br /><br /><a href=\"https://goo.gle/4nVyjIr\" rel=\"noopener\" target=\"_blank\"><strong>Register for the June 11 Community TechTalk</strong></a></li>\n</ul>\n<h3>May 18 - May 22</h3>\n<ul>\n<li><strong>Chinese Webinar | June 4: AI Command and Control<br /></strong>As AI agents move from experimental pilots to core enterprise functions, governance has become a critical next step. Join Google Cloud on June 4th at 10:00 AM (Beijing Time) to learn how to build a secure AI management layer architecture. We'll explore how to develop governed MCP (Model Context Protocol) endpoints, manage tool access to enterprise data, and leverage robust audit logs to operationalize AI. This session also includes a practical demonstration of these governance frameworks on Google Cloud.<br /><br /><a href=\"https://goo.gle/4dx4Lf5\" rel=\"noopener\" target=\"_blank\">Register here</a></li>\n<li><strong>GCP Announces New Features to Benchmark and Optimize LLMs for On-Device Use Cases<br /></strong>Deploying fine-tuned LLMs from GCP to edge devices like smartphones is complex due to fragmented hardware. Google AI Edge Portal bridges this gap, giving GCP developers the ability to test AI performance on 120+ Android devices, representing the full diversity of high, medium, and low tier smartphones on the market today. This week at I/O, we announced brand new <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/benchmark-llms-on-device-with-ai-edge-portal\" rel=\"noopener\" target=\"_blank\">capabilities</a> to benchmark and debug LLM performance across these devices. <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSfTcGPycQve8TLAsfH46pBlXBZe9FrgJAClwbF7DeL1LgVn4Q/viewform\" rel=\"noopener\" target=\"_blank\">Sign-up</a> to utilize these new features in private preview today.</li>\n</ul>\n<h3>May 11 - May 15</h3>\n<ul>\n<li><strong>Build Your AI &amp; MCP Control Tower for Universal Governance<br /></strong>Master the future of agentic security with Apigee. Join our Community TechTalk on May 21 to discover how Apigee serves as a central \"Control Tower\" for the Model Context Protocol (MCP). We will explore how new JSON-RPC tool authorization enables fine-grained access policies across your organization, ensuring secure and scalable AI deployments. Whether managing internal tools or external users, learn to govern your agentic ecosystem with absolute precision. This session is designed for global coverage across EMEA and AMER regions.<br /><br /><a href=\"https://goo.gle/4u9slWF\" rel=\"noopener\" target=\"_blank\">Register for the May 21 Community TechTalk</a></li>\n</ul>\n<h3>Apr 27 - May 1</h3>\n<ul>\n<li><strong>Master Your Launch: The Apigee Production Go-Live Checklist<br /></strong>Ensure a secure launch with the Apigee production guide. Join Nicola Cardace on May 28 to explore security guardrails, including IAM roles, mTLS configurations, and encrypted KVM migrations. Scheduled at 11 AM EDT / 5 PM CEST to support EMEA and AMER teams, this TechTalk provides the technical roadmap you need to flip the switch with absolute confidence.<br /><br /><strong><a href=\"https://goo.gle/4elMCTI\" rel=\"noopener\" target=\"_blank\">Register for the May 28 Community TechTalk</a></strong></li>\n<li>\n<p><strong>Transforming APIs into Governed Agentic Tools on the Google Cloud Agentic Platform<br /></strong><span>Turn your APIs into secure, governed agentic tools on the Google Cloud Agentic Platform. Join Specialist Christophe Lalevée on May 7 for a technical deep dive into AI productization. Scheduled at 5 PM CEST / 11 AM EDT to maximize coverage for developers across EMEA and AMER, this session explores the integration and governance frameworks required to scale enterprise-ready AI with confidence.</span></p>\n<p><a href=\"https://goo.gle/3PfWm7M\" rel=\"noopener\" target=\"_blank\">Register for the May 7 Community TechTalk</a></p>\n</li>\n<li><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-machine-types\" rel=\"noopener\" target=\"_blank\">Fractional G4 VMs</a> are Generaly Available, providing a highly efficient and cost-effective entry point for AI and graphics workloads. These new configurations, using NVIDIA virtual GPU (vGPU) technology, allow you to leverage the power of the NVIDIA RTX PRO 6000 Blackwell Server Edition GPUs in flexible, smaller increments, so you can right-size your infrastructure to match the specific demands of your applications. By providing more granular access to advanced hardware, fractional G4 VMs let you optimize resource allocation and reduce overhead without sacrificing performance. You can now select from additional GPU slice sizes for your specific needs:\n<ul>\n<li><strong>1/2 GPU:</strong> Ideal for more intensive tasks such as LLM inference, robotics sensor simulation, and high-fidelity 3D rendering.</li>\n<li><strong>1/4 GPU:</strong> Optimized for mainstream workloads, including mid-range creative design, video transcoding, and real-time data visualization.</li>\n<li><strong>1/8 GPU:</strong> Great for lightweight applications such as remote desktops, productivity tools, and entry-level streaming services.</li>\n</ul>\n</li>\n<li>\n<p>Transitioning AI from a sandbox prototype to an enterprise-grade system is a major hurdle. A monolithic script won't suffice for widespread deployment. To achieve true scale and reliability with Gemini, organizations must adopt service-oriented micro-agent architectures, establish Zero-Trust security, and implement rigorous EvalOps. Master the \"Agentic Maturity Ladder\" to ensure your AI &amp; Agentic solutions are robust, secure, and ready for the real world.</p>\n<p><a href=\"https://lnkd.in/gHBH8cTv\" rel=\"noopener\" target=\"_blank\">Watch the deep dive</a> and <a href=\"https://discuss.google.dev/t/beyond-the-prototype-scaling-production-grade-agents-with-gemini/356140\" rel=\"noopener\" target=\"_blank\">read the developer blog</a> to learn more.</p>\n</li>\n<li><strong>ML Development in VS Code with Google Cloud Power: Workbench Extension Now Available<br /></strong>Data scientists and developers can now combine the local productivity of VS Code with the scalable infrastructure of Google Cloud. The new Google Cloud Workbench Notebooks extension allows you to connect to and run notebooks on managed cloud environments directly within your local IDE. This integration streamlines the ML lifecycle by eliminating context switching and providing high-performance compute for complex workloads in a familiar interface. As part of our commitment to the developer ecosystem, the extension is fully open-sourced to support community-driven innovation.\n<ul>\n<li><strong>Install from Marketplace:</strong> <a href=\"https://marketplace.visualstudio.com/items?itemName=GoogleCloudTools.workbench-notebooks\" rel=\"noopener\" target=\"_blank\">GoogleCloudTools.workbench-notebooks</a></li>\n<li><strong>Contribute on GitHub:</strong> <a href=\"https://github.com/GoogleCloudPlatform/colab-enterprise-vscode\" rel=\"noopener\" target=\"_blank\">colab-enterprise-vscode</a></li>\n</ul>\n</li>\n</ul>\n<h3>Apr 20 - Apr 24</h3>\n<ul>\n<li><strong>Announcing the 2026 Google Cloud Partners of the Year<br /></strong>Google Cloud is honored to celebrate the winners of the 2026 Partner of the Year awards! These awards recognize an exceptional group of partners across AI, Security, Infrastructure, and more, who have demonstrated a commitment to customer success. From global system integrators to specialized startups, these winners are leveraging the power of Google Cloud to solve complex challenges and drive digital transformation worldwide. Join us in congratulating these organizations for their innovation, collaboration, and impactful results over the past year.<br /><br />See the <a href=\"https://cloud.google.com/blog/topics/partners/2026-partners-of-the-year-winners-next26\">2026 Partner Award winners</a></li>\n</ul>\n<h3>Apr 13 - Apr 17</h3>\n<ul>\n<li>We're excited to announce the <strong>Public Preview of Datastream’s metadata integration with Knowledge Catalog</strong>. This is the first step in our vision to provide a centralized, \"single pane of glass\" for all Datastream assets. The enhancement automatically synchronizes Streams, Connection Profiles, and Private Connections, eliminating data silos. It enhances discoverability, allowing you to search for Datastream assets using the same interface as BigQuery tables. Centralized governance is also provided, making your real-time data estate more transparent and easier to manage.</li>\n<li><strong>Upgrading Apigee OPDK to 4.53 with OS Modernization<br /></strong>Modernize your infrastructure using Google’s official, sequential upgrade path. Our Technical expert, Rakesh Talanki outlines how to upgrade Apigee OPDK to v4.53 while migrating to a supported OS (RHEL 8.x/9.x). This guide covers the \"build-out\" methodology, including multi-data center syncing, to ensure a stable, zero-downtime transition<br /><br /><a href=\"https://goo.gle/3Oa8uqy\" rel=\"noopener\" target=\"_blank\">Read the guide</a></li>\n<li><strong>Cloud Run Worker Pools and CREMA: Powering Serverless AI at Scale<br /></strong>Google Cloud has announced the General Availability of <strong>Cloud Run worker pools</strong>, a new resource type designed specifically for pull-based, non-HTTP workloads. Unlike traditional Cloud Run services that scale based on request traffic, worker pools provide an \"always-on\" environment for background tasks like processing message queues or running large-scale AI inference. To support this, Google Cloud also open-sourced the <strong>Cloud Run External Metrics Autoscaler (CREMA)</strong>. Built on KEDA, CREMA enables queue-aware autoscaling for worker pools, allowing them to dynamically scale based on external signals like Pub/Sub backlog or Kafka lag.</li>\n<li><strong>Apigee Model Context Protocol (MCP) now Generally Available<br /></strong>Expose enterprise APIs as MCP tools for agentic AI applications with the General Availability of MCP in Apigee. This update allows developers to transform APIs into AI-ready tools using OpenAPI Specifications, removing the need for local MCP servers or additional infrastructure. With managed endpoints and semantic search in API hub, you can now provide AI agents with secure, governed access to enterprise data at scale.<br /><br /><a href=\"https://goo.gle/3QfoEQ4\" rel=\"noopener\" target=\"_blank\"><em>Explore the MCP overview</em></a></li>\n</ul>\n<h3>Apr 6 - Apr 10</h3>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Community TechTalk: Powering Retail Agents with ADK, UCP &amp; Apigee X<br /></strong>Move beyond basic chatbots to secure, transactional AI experiences. Join our Community TechTalk on April 16 to learn how Apigee X and Gemini build a \"Trust Layer\" for AI shopping assistants using UCP standards. We’ll demonstrate how to block prompt injections with Model Armor and implement cost governance via token limits to secure the path from discovery to purchase.<br /><br /><a href=\"https://goo.gle/41ocUgq\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">Register for the TechTalk</span></a></li>\n<li><strong style=\"vertical-align: baseline;\">Implement multimodal capabilities in your AI agents<br /></strong>Explore three new reference architectures for building sophisticated multi-agent AI systems that can process and analyze multimodal data. To analyze disparate multimodal data and produce a high-confidence classification, see <a href=\"https://docs.cloud.google.com/architecture/agentic-ai-classify-multimodal-data\"><span style=\"vertical-align: baseline;\">Classify multimodal data</span></a><span style=\"vertical-align: baseline;\">. To create a fluid conversational AI that processes audio and video streams in real time, see</span> <a href=\"https://docs.cloud.google.com/architecture/agentic-ai-bidirectional-multimodal-streaming\"><span style=\"vertical-align: baseline;\">Enable live bidirectional multimodal streaming</span></a><span style=\"vertical-align: baseline;\">. To consolidate fragmented multimodal data into a searchable knowledge graph, see</span> <a href=\"https://docs.cloud.google.com/architecture/agentic-ai-multimodal-graph-rag-resource-orchestration\"><span style=\"vertical-align: baseline;\">Multimodal GraphRAG resource orchestration</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Automate SecOps workflows with an agentic AI system<br /></strong>To accelerate incident response and reduce manual toil for your security team, you need a system that can automate remediation playbooks. Our new reference architecture helps you build an AI agent that orchestrates complex triage and investigation workflows across disparate security tools, such as SIEM, CSPM, and EDR, from a single interface. See the full guide to <a href=\"https://docs.cloud.google.com/architecture/agentic-ai-orchestrate-security-ops-workflows\"><span style=\"vertical-align: baseline;\">orchestrate security operations workflows</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n</ul>\n<h3>Mar 30 - Apr 3</h3>\n<ul>\n<li><strong>ASEAN Webinar | April 30: Mastering Agentic Governance at Scale with GCP<br /></strong>As AI agents move from experimental pilots to core enterprise functions, governance is the critical next step. Join Google Cloud experts <strong>Shilpi Puri &amp; Wely Lau</strong> for a <strong>webinar</strong> on <strong>April 30th at 11:00 AM SGT</strong> to learn how to architect a secure AI Management layer. We’ll explore developing governed MCP endpoints, managing tool access to enterprise data, and operationalizing AI with robust audit logs. The session includes a live demo of these frameworks in action on Google Cloud.<br /><br /><a href=\"https://goo.gle/47FX1Wn\" rel=\"noopener\" target=\"_blank\"><strong>RSVP here.</strong></a></li>\n</ul>\n<h3>Mar 23 - Mar 27</h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Turn your API sprawl into an agent-ready catalog<br /></strong><span style=\"vertical-align: baseline;\">As organizations scale, APIs often become scattered across multiple gateways, creating \"blind spots\" that hinder AI adoption. To solve this, we’ve introduced two new capabilities for Apigee API hub: a new integration with API Gateway to automatically centralize API metadata into a single control plane, and a specification boost add-on (now in public preview). This add-on uses AI to enhance your API documentation with the precise examples and error codes that AI agents need to function reliably.<br /><br /></span><a href=\"https://goo.gle/47dEYqc\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the full blog post to get started.</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Webinar | April 16: AI Command &amp; Control<br /></strong><span style=\"vertical-align: baseline;\">As AI agents move from experimental pilots to core enterprise functions, governance is the critical next step. Join Google Cloud expert Satyam Maloo for a webinar on April 16th at 11:00 AM IST to learn how to architect a secure AI Management layer. We’ll explore developing governed MCP endpoints, managing tool access to enterprise data, and operationalizing AI with robust audit logs. The session includes a live demo of these frameworks in action on Google Cloud.<br /><br /></span><a href=\"https://goo.gle/4t43Vg4\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RSVP here.</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Modernizing and Decoupling Event Ingestion with Apigee<br /></strong><span style=\"vertical-align: baseline;\">In modern cloud-native architectures, decoupling producers from consumers is critical for building resilient systems. While Google Cloud Pub/Sub provides a scalable backbone, exposing it directly to external clients can introduce security and management overhead. This new guide explores how to leverage Apigee as an intelligent HTTP ingestion point. Learn how to handle security, mediation, and traffic control before messages reach your internal bus using the PublishMessage policy or Pub/Sub API.</span><br /><br /><a href=\"https://goo.gle/3POgsWF\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Read the full guide.</span></a></p>\n</li>\n</ul>\n<h3>Mar 16 - Mar 20</h3>\n<ul>\n<li><strong>Gemini-powered Assistant in BigQuery Studio Gets Context-Aware Upgrades<br /></strong>The Gemini-powered assistant in BigQuery Studio has been transformed into a fully context-aware analytics partner, supporting your entire data lifecycle. The new capabilities include intelligent resource discovery, which uses Dataplex Universal Catalog search to find resources across projects and deep dive into metadata using natural language. You can now automate tasks, such as scheduling production-grade queries directly through the chat interface, and instantly troubleshoot long-running or failed jobs with root cause analysis and cost control auditing.<br /><br /><a href=\"https://docs.cloud.google.com/bigquery/docs/use-cloud-assist\">Explore</a> the full range of what the assistant can do.</li>\n</ul>\n<h3>Mar 9 - Mar 13</h3>\n<ul>\n<li>\n<div><strong>Want to use Gemini to develop code and don't know where to start?</strong><br />This <a href=\"https://medium.com/google-cloud/supercharge-your-spark-development-with-gemini-1540f1cb47d4\" rel=\"noopener\" target=\"_blank\">article</a> includes a couple of examples of developing code with Gemini prompts; it identified changes that were needed to be made to get the code working. The article also refers to other examples that are available on github. </div>\n</li>\n</ul>\n<h3>Mar 2 - Mar 6</h3>\n<ul>\n<li>\n<p><span style=\"vertical-align: baseline;\"><strong>Introducing Gemini 3.1 Flash-Lite, our fastest and most cost-efficient Gemini 3 series model.</strong> Built for high-volume developer workloads at scale, 3.1 Flash-Lite delivers high quality for its price and model tier. Gemini 3.1 Flash-Lite can tackle tasks at scale, like high-volume translation and content moderation, where cost is a priority. And it can also handle more complex workloads where more in-depth reasoning is needed, like generating user interfaces and dashboards, creating simulations or following instructions.</span></p>\n<p><span style=\"vertical-align: baseline;\">Starting today, 3.1 Flash-Lite is rolling out in preview to enterprises via </span><a href=\"https://console.cloud.google.com/vertex-ai/studio/multimodal?mode=prompt&amp;model=gemini-3.1-flash-lite-preview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Vertex AI</span></a><span style=\"vertical-align: baseline;\"> and </span><span style=\"vertical-align: baseline;\">developers via the Gemini API in </span><a href=\"https://aistudio.google.com/prompts/new_chat?model=gemini-3.1-flash-lite-preview\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li>\n<div>\n<p><strong>TechTalk: Implementing Device Authorization Grant (RFC 8628) for Apigee</strong><br />Learn how to authorize \"headless\" devices like Smart TVs or AI agents that lack keyboards and browsers. Join our Community TechTalk on March 19 (5PM CET / 12PM EDT) to go under the hood of Apigee X/Hybrid. We’ll cover the real-world mechanics of state management, polling, and human-in-the-loop security patterns for devices and autonomous agents.</p>\n<p><a href=\"https://goo.gle/4r6o6Zi\" rel=\"noopener\" target=\"_blank\">Register for the TechTalk</a></p>\n</div>\n</li>\n</ul>\n<h3>Feb 23 - Feb 27</h3>\n<ul>\n<li>\n<p><span style=\"vertical-align: baseline;\"><strong>Pro-level image generation gets faster and more accessible with Nano Banana 2<br /></strong></span><span style=\"vertical-align: baseline;\">Nano Banana 2 is our state-of-the-art image generation and editing model. It delivers Pro-level image generation and editing at the speed you expect from Flash — making the quality, reasoning, and world knowledge you loved about Nano Banana Pro more accessible. Learn more about the model </span><a href=\"https://blog.google/innovation-and-ai/technology/ai/nano-banana-2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<ul>\n<li>\n<p><strong style=\"vertical-align: baseline;\">The Intelligent Path to Compliance: Transforming Regulatory QC with Google Cloud<br /></strong><span style=\"vertical-align: baseline;\">Reducing \"Refuse to File\" (RTF) risks and submission cycle times is critical for life sciences leaders. Google Cloud’s Regulatory Submission Semantic QC Auditor leverages Gemini and RAG architecture to transform Quality Control from a manual burden into an active, intelligent workflow.</span></p>\n<p><span style=\"vertical-align: baseline;\">By automating semantic cross-referencing, narrative coherence checks, and dynamic guidance-based auditing, this solution ensures rigorous accuracy and auditability. Operating within a secure GxP-ready environment, it empowers teams to detect subtle inconsistencies and generate remediation plans without sacrificing data privacy. <br /><br /></span><a href=\"https://discuss.google.dev/t/the-intelligent-path-to-compliance-transforming-regulatory-quality-control-with-google-cloud/335276\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn more</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Stop typing, start interacting! <strong>The Gemini Live Agent Challenge is here</strong>. Build immersive agents that can help you see, hear, and speak using Gemini and Google Cloud. Compete for your share of $80,000+ in prizes and a trip to Google Cloud Next '26!<br /><br /></span><span style=\"vertical-align: baseline;\">Submissions are open from February 16, 2026 to March 16, 2026. Learn more and register at </span><a href=\"http://geminiliveagentchallenge.devpost.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">geminiliveagentchallenge.devpost.com</span></a></span></li>\n</ul>\n<h3>Feb 9 - Feb 13</h3>\n<ul>\n<li>\n<p><strong><span style=\"vertical-align: baseline;\">Introducing Gemini 3.1 Pro on Google Cloud. </span></strong></p>\n<span style=\"vertical-align: baseline;\">3.1 Pro is a noticeably smarter, more capable baseline for complex problem-solving. We’re shipping 3.1 Pro at scale, building upon our </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-3-is-available-for-enterprise?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">goal</span></a><span style=\"vertical-align: baseline;\"> to help you transform your business for the agentic future. Learn more about the model’s capabilities </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-1-pro\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">. Gemini 3.1 Pro is available starting today in preview in </span><a href=\"https://cloud.google.com/vertex-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Vertex AI</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/gemini-enterprise?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\">. Developers can access the model in preview via the Gemini API in </span><a href=\"https://aistudio.google.com/prompts/new_chat?model=gemini-3.1-pro-preview\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://developer.android.com/studio\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android Studio</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://antigravity.google/blog/gemini-3-1-in-google-antigravity\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://geminicli.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini CLI</span></a><span style=\"vertical-align: baseline;\">.<br /><br /></span></li>\n<li><strong>Automate Storage Compatibility with GKE Dynamic Default Storage Classes<br /></strong>Managing storage across mixed-generation VM clusters in GKE just got easier. With the new <strong>Dynamic Default Storage Class</strong>, Google Kubernetes Engine automatically selects between Persistent Disk (PD) and Hyperdisk based on a node's specific hardware compatibility. This abstraction eliminates the need for complex scheduling rules and manual pairing, ensuring your volumes \"just work\" regardless of the underlying infrastructure. By defining both variants in a single class, you reduce operational overhead while maintaining peak performance and cost-efficiency across your entire cluster.<br /><br /><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/hyperdisk#automated_disk_type_selection\" rel=\"noopener\" target=\"_blank\">Explore automated disk type selection</a></li>\n<li>\n<p><strong style=\"vertical-align: baseline;\">Community TechTalk: AI-Powered Apigee Development with strofa.io<br /></strong><strong style=\"vertical-align: baseline;\">Join the Apigee community on February 26</strong><span style=\"vertical-align: baseline;\"> for a deep dive into</span> <a href=\"https://www.google.com/search?q=http://strofa.io\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">strofa.io</span></a><span style=\"vertical-align: baseline;\">. Guest speaker Denis Kalitviansky will demonstrate how this new AI-powered tool automates and orchestrates Apigee development, from local emulators to large-scale hybrid environments. Discover how to scale your API management and streamline team collaboration using the latest in AI-driven automation.</span></p>\n<p><a href=\"https://goo.gle/3Oerns3\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Register now to reserve your spot.</span></a></p>\n</li>\n</ul>\n<h3>Jan 26 - Jan 30</h3>\n<ul>\n<li><strong><span style=\"vertical-align: baseline;\">Simplify API Governance with Native OpenAPI v3 Support<br /></span></strong>Eliminate integration debt and accelerate deployment velocity with the General Availability of OpenAPI v3 (OASv3) support for API Gateway and Cloud Endpoints. You no longer need to downgrade modern specifications to OASv2. Instead, you can now define API contracts and enforce critical policies—including telemetry, quotas, and security—using native Google-specific extensions directly within your OASv3 files. This update ensures your APIs are secure by design while remaining fully compatible with the modern developer ecosystem and Google Cloud’s AI services.<br /><br /><a href=\"https://goo.gle/49Wx58Z\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get started with OpenAPI v3 on API Gateway and Cloud Endpoints.</span></a></li>\n</ul>\n<ul>\n<li><strong><span style=\"vertical-align: baseline;\">Accelerate API Testing with the New Open Source API Tester<br /></span></strong>Start validating your APIs with API Tester, a simple, YAML-based Test Driven Development (TDD) framework. Designed for the Apigee community, this tool allows you to write human-readable tests, run them instantly via a web client or CLI, and perform deep unit testing on Apigee proxies. With native support for JSONPath assertions and Apigee shared flows, you can verify everything from payload data to internal variables like <code style=\"vertical-align: baseline;\">proxy.basepath</code><span style=\"vertical-align: baseline;\"> without leaving your terminal.<br /><br /></span><a href=\"https://goo.gle/4q5WDGK\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Explore the API Tester guide and start testing your proxies today.</span></a></li>\n<li><strong><span style=\"vertical-align: baseline;\">Secure Sensitive Data with Kubernetes Secrets in Apigee hybrid<br /></span></strong>Enhance security in Apigee hybrid by accessing Kubernetes Secrets directly within your API proxies. This hybrid-exclusive feature keeps sensitive credentials within your cluster boundary and prevents replication to the management plane. It supports strict separation of duties: operators manage secrets via <code style=\"vertical-align: baseline;\">kubectl</code><span style=\"vertical-align: baseline;\">, while developers reference them as secure flow variables—ideal for high-compliance and GitOps workflows.<br /><br /></span><a href=\"https://goo.gle/4qEVffo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Implement Kubernetes Secrets in your hybrid proxies.</span></a></li>\n<li><strong><span style=\"vertical-align: baseline;\">See the Console in a Whole New Light: Dark Mode is Now Generally Available in Google Cloud<br /></span></strong>Elevate your cloud management workflow with Dark Mode, now generally available in the Google Cloud console. We have delivered a modern, cohesive, and accessible experience reimagined for maximum comfort and productivity—especially during extended working hours and low-light environments. Dark Mode can be enabled automatically based on your operating system's preference, or manually through the Settings  -&gt; Appearance menu.<br /><br /><a href=\"https://docs.cloud.google.com/docs/get-started/console-appearance\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Switch to Dark Mode today to enjoy a modern, comfortable, and productive environment!</span></a></li>\n<li><strong><span style=\"vertical-align: baseline;\">Apigee X Networking: PSC or VPC Peering?<br /></span></strong>Deciding how to connect Apigee X? Watch this video to compare Private Service Connect and VPC Peering. We break down northbound and southbound routing, IP consumption, and how to reach targets on-prem or in the cloud. Learn to simplify your architecture and avoid common networking \"gotchas\" for a smoother deployment.<br /><br /><a href=\"https://goo.gle/4bWBGdV\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Watch the video.</span></a></li>\n</ul>\n<h3>Jan 19 - Jan 23</h3>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Bridge the Gap: Excel-to-API Conversion in Apigee Portals<br /></strong><span style=\"vertical-align: baseline;\">Give your customers more ways to connect! This new article by Tyler Ayers explores how to extend the Apigee Integrated Portal to support direct Excel file uploads. By leveraging SheetJS and custom portal scripts, you can enable users to upload spreadsheets, preview data, and submit it directly to your APIs, all without writing a single line of integration code themselves. It’s a powerful way to simplify onboarding for those who aren't yet API-ready.<br /><br /></span><a href=\"https://goo.gle/3Nq3Pjo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn how to build it</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Elevate your applications with Firestore’s new advanced query engine<br /></strong><span style=\"vertical-align: baseline;\">We have fundamentally reimagined Firestore with pipeline operations for Enterprise edition. Experience a powerful new engine featuring over a hundred new query features, index-less queries, new index types, and observability tooling to improve query performance. Seamlessly migrate using built-in tools and leverage Firestore’s existing differentiated serverless foundation, virtually unlimited scale, and industry-leading SLA. Join a community of 600K developers to craft expressive applications that maximize the benefits of rich queryability, real-time listen queries, robust offline caching, and cutting-edge AI-assistive coding integrations.<br /><br /></span><a href=\"https://cloud.google.com/blog/products/data-analytics/new-firestore-query-engine-enables-pipelines?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Learn more about Firestore pipeline operations.</span></a></li>\n</ul></div>"
