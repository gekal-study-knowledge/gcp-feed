  この日はエージェント関連の統制機能が目立ちました。Access Approval と Access Transparency で Agent Identity が一般提供となっています。Apigee API hub では gcloud CLI から MCP サーバーを構成・デプロイできるようになり、MCP ツールをインラインまたは YAML / JSON 仕様ファイルの参照で定義して、API hub の操作をエージェント連携向けに公開できます。Bigtable ではパラメータ化ビューが GA となり、アプリケーションのコンテキストに応じて論理ビューのデータ範囲を動的に絞り込みつつ SQL インジェクションのリスクを抑えられます。ブログでは Looker のガバナンス付きセマンティックレイヤーが Gemini Enterprise の構造化データの信頼できる基盤となり、NL2SQL がスキーマの関係を推測することで生じる不安定なクエリやハルシネーションを防ぐ構成が紹介されました。
