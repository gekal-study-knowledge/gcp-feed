    "title": "Looker’s semantic layer governs Gemini Enterprise data for user trust"
    "link": "https://cloud.google.com/blog/products/business-intelligence/integrating-looker-and-gemini-enterprise/"
    "published": "2026-08-12 01:00:00"
    "fetched": "2026-08-27 21:31:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For organizations deploying AI agents at scale, there’s often a critical divide between structured and unstructured data. While large language models (LLMs) excel at parsing text documents, emails, and PDFs, they can struggle when presented with raw enterprise databases. Meanwhile, standard natural-language-to-SQL (NL2SQL) models often guess how database schemas fit together, which can lead to unpredictable queries, inconsistent metrics, and AI hallucinations that erode user trust. </span></p>\n<p><a href=\"https://cloud.google.com/gemini-enterprise?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=1713704-Workspace-DR-APAC-IN-en-Google-BKWS-MIX-Hybrid-GeminiEnterprise&amp;utm_content=c-Hybrid+%7C+BKWS+-+EXA+%7C+Txt-Gemini+Enterprise-Generic-435278751514&amp;utm_term=gemini+enterprise&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=23381004221&amp;gclid=Cj0KCQjwlqTRBhCBARIsANrkrxgdte2Ry_iXPSiT0N7_AEygV0lPiuKDnLLm9uPdxiQKE39HhLfoQsgaAgdmEALw_wcB&amp;e=0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> brings the best of Google AI to every employee through an intuitive chat interface that acts as a single front door for AI in the workplace. And now, Looker’s governed semantic layer serves as the trusted foundation for structured data within Gemini Enterprise, enabling trusted self-service business intelligence for all Gemini Enterprise users. With this integration, Looker analysts and admins can publish conversational agents natively into their Gemini Enterprise environments via the Agent-to-Agent (A2A) protocol. Now, organizations can provide their AI-accelerated taskforce with robust and trusted tools, powered by real-time analytics, that they can explore in natural language in addition to their daily workspace workflows. Making it easy to offer conversational agents in Gemini Enterprise expands discoverability and promotes a data-driven culture, while reducing friction to adoption.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Bringing a semantic foundation to structured and unstructured data</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By combining Looker’s semantic layer with Gemini Enterprise, you can query both structured databases and unstructured documents in plain English, all in one place. Instead of jumping between dashboards and other tools to understand your numbers, teams can instantly connect hard metrics with real-world context to solve problems and make decisions faster.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_Ei9b2UE.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Publishing Looker agents for consumption in Gemini Enterprise</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Minimize AI hallucinations</strong></h3>\n<p><span style=\"vertical-align: baseline;\">If you ask the typical AI chatbot to calculate \"revenue\" or \"churn rate\" against an unstructured cloud database, it has to guess which tables to join, which filters to apply, and which timestamps to trust. This can result in different people asking the same question, only to get completely different answers.</span></p>\n<p><span style=\"vertical-align: baseline;\">Looker’s semantic layer eliminates this guesswork, serving critical context to Gemini Enterprise in the form of codified data, allowing the agent to give deterministic, predictable responses.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;[ Gemini Enterprise Chat UI ] \\r\\n               │\\r\\n      (A2A Protocol / NLP)\\r\\n               ▼\\r\\n   [ Looker Governed Agent ]  ──► Generates Deterministic SQL\\r\\n               │\\r\\n   [ Looker Semantic Layer ]  ──► Business-Approved Definitions &amp; Logic\\r\\n               │\\r\\n               ▼\\r\\n     [ Enterprise Data Cloud ]  ──► (BigQuery, AlloyDB, Spanner, etc.)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff5dd534d90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When a Gemini Enterprise user requests a business KPI in Gemini Enterprise, the request is routed directly to a Looker agent. The semantic layer generates deterministic, precise SQL based on version-controlled business logic. This helps ensure when an executive asks for \"Revenue,\" they get the exact, governed enterprise metric — not a guess.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Robust governance and secure access management</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Data governance and security are critical when introducing AI to enterprise data warehouses. Organizations can’t risk corporate information being loosely ingested, indexed, or exposed outside of strict permissions.</span></p>\n<p><span style=\"vertical-align: baseline;\">Looker’s integration with Gemini Enterprise is built on a zero-risk pass-through architecture, processing the data, but not writing to persistent storage. Gemini Enterprise does </span><span style=\"font-style: italic; vertical-align: baseline;\">not</span><span style=\"vertical-align: baseline;\"> ingest, replicate, or store your underlying database records. Instead, the integration operates safely and securely over the A2A protocol, following these core tenets:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">OAuth authorization:</strong><span style=\"vertical-align: baseline;\"> In order to interact with a Looker agent within Gemini Enterprise, end users provide a secure, one-time OAuth consent. This binds their Gemini session to their specific Looker credentials.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strong governance enforcement:</strong><span style=\"vertical-align: baseline;\"> Because the architecture relies on live pass-through queries, Looker’s existing row-level and column-level access controls are maintained.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strict security isolation:</strong><span style=\"vertical-align: baseline;\"> If a user does not have permission to view, say, sensitive regional payroll or financial rows within the Looker platform, the Looker agent actively restricts that data in the Gemini environment. Should an agent be published to the Agent Gallery to simplify discovery, it still does not bypass the security controls that you established.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Technical capabilities and enterprise readiness</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Deploying Looker agents natively into Gemini Enterprise via the </span><a href=\"https://docs.cloud.google.com/gemini/data-agents/conversational-analytics-api/integration-patterns#a2a-orchestration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A2A protocol</span></a><span style=\"vertical-align: baseline;\"> doesn't just make it smarter — it makes it more interactive and interoperable, without sacrificing security. Here are some of the features you’ll find in this release.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Rich visual interactivity: support for charts</strong></p>\n<p><span style=\"vertical-align: baseline;\">They say a picture is worth a thousand words. </span><span style=\"vertical-align: baseline;\">When users interact with Looker agents inside Gemini Enterprise, the platform goes beyond textual explanations and provides native, interactive data charts. If a user asks for a visual trend—such as monthly sales performance or regional distribution—the Looker agent maps the database response with rich, presentation-ready visualizations directly inside the universal chat box.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Note:</strong><span style=\"vertical-align: baseline;\"> If you published Looker agents in Gemini Enterprise prior to Looker release 26.12, we recommend </span><a href=\"https://docs.cloud.google.com/looker/docs/conversational-analytics-looker-data-agents#republish-agent-ge\"><span style=\"text-decoration: underline; vertical-align: baseline;\">updating or refreshing</span></a><span style=\"vertical-align: baseline;\"> them to take advantage of these enhanced visualization capabilities.</span></p>\n<p><span style=\"vertical-align: baseline;\"><strong>I</strong></span><strong style=\"vertical-align: baseline;\">nteroperability with first- and third-party agents</strong></p>\n<p><span style=\"vertical-align: baseline;\">Looker agents published to Gemini Enterprise can understand context across different agents and data sources. Leveraging standard communication frameworks, these agents can securely share structured, governed insights with other first-party Google Cloud agents like the </span><a href=\"https://ai.google.dev/gemini-api/docs/deep-research\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Deep Research Agent</span></a><span style=\"vertical-align: baseline;\"> or external third-party agents to create structured workflows. This enables complex multi-agent orchestration, where an enterprise operational agent can pull data from a Looker agent to feed into a separate productivity or supply-chain workflow.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Looker-based user authentication</strong></p>\n<p><span style=\"vertical-align: baseline;\">To preserve enterprise governance, this integration implements a robust, identity-centric authentication model. Users are required to provide a one-time OAuth consent, binding their active Gemini Enterprise session securely to their underlying Looker credentials. This helps ensure that every conversational query hitting your databases is authenticated at the user level, enforcing pre-existing Looker permission structures, row-level data access filters, and column-level masking rules — no exceptions.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Trusted data in Gemini Enterprise</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The future of work is agentic. Gemini Enterprise provides a single, secure architecture to deploy a global digital task force,empowering your business with the best of Google AI for developers, employees, and customers.</span></p>\n<p><span style=\"vertical-align: baseline;\">The integration of Looker with Gemini Enterprise not only brings trusted data analytics to business users but also adds rich interactivity, visual charts, and data storytelling directly into their everyday workspace. As business users embrace this agentic new way of working, they aren't just getting text answers; they are getting presentation-ready visualizations that bring operational metrics to life and deliver complex insights. </span></p>\n<p><span style=\"vertical-align: baseline;\">To get started, </span><a href=\"https://docs.cloud.google.com/looker/docs/conversational-analytics-looker-data-agents#publish-data-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learn how to publish your data agents in Gemini Enterprise</span></a><span style=\"vertical-align: baseline;\"> to make your agent’s predefined context and analytics available to your entire organization.</span></p></div>"
