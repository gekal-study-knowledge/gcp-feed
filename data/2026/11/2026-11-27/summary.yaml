  この日は 1 ソースから 3 本で、いずれも日本語ブログです。日立グループが、約 600 社・28 万人超のグループ内で使うシンクライアント端末を ChromeOS 端末へ大規模にリプレースした事例が紹介されました。導入から 6〜7 年が経って老朽化し維持管理の工数も膨らんでいた端末に対し、既存と同等のセキュリティ、高い可用性によるユーザーのメンテナンス負担の軽減、IT 部門の工数削減の 3 条件を PoC で確かめ、ボトムアップの提案で採用を決めたもので、配信リードタイムが 4〜5 カ月から 1 カ月に短縮し、年間 4.8 億円のコスト削減を実現したとしています。また、2026 年 11 月 13 日に Google 渋谷オフィスとオンラインで開かれた第 2 回「KDDI AI Agent Day with Google 2026」のレポートでは、AI を「使う」段階の企業が 80% なのに対し「変える」段階は 6% にとどまるという 74% の溝を埋める「循環型 AI 活用」のビジョン、Google Cloud による Gemini の最新アップデートと Augmented Engineering のセッション、101 件のエントリーから選ばれた 10 組による KDDI AI ハッカソンのピッチなどが紹介されました。さらに、Google Cloud が 2026 年 Gartner Magic Quadrant の AI アプリケーション開発プラットフォーム部門で 3 年連続のリーダーに選ばれ、実行能力の評価軸で最高評価を得たことが報告され (11 月 18 日の英語記事の抄訳)、約 500 社の顧客がそれぞれ 1 兆を超えるトークンを処理したこと、統合された Gemini エクスペリエンスや、英国の決済機関 Dojo の非技術部門が 2 か月で 600 以上のカスタムエージェントを作った例が挙げられています。
