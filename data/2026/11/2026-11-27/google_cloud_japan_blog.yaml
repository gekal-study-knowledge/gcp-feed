"entries":
  "0330f14448f2abf3910cd599fc64f7d2":
    "id": "0330f14448f2abf3910cd599fc64f7d2"
    "title": "Google Cloud、2026 年 Gartner Magic Quadrant の AI アプリケーション開発プラットフォーム部門でリーダーに選出"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/google-cloud-is-a-leader-in-the-2026-gartner-magic-quadrant/"
    "published": "2026-11-27 11:00:00"
    "fetched": "2026-11-27 12:32:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 18 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-is-a-leader-in-the-2026-gartner-magic-quadrant?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、</span><strong style=\"vertical-align: baseline;\">2026 年 Gartner Magic Quadrant の AI アプリケーション開発プラットフォーム部門</strong><span style=\"vertical-align: baseline;\">において 3 年連続でリーダーに選出され、実行する能力（Ability to Execute）の評価軸全体で最高評価を獲得しました</span><sup><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">1</span></span></sup><span style=\"vertical-align: baseline;\">。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_sot3w8r.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">昨今、実際の日常業務の処理や、コンプライアンス ガードレールの厳格な遵守、測定可能な ROI の実現を AI に求める企業がますます増えています。昨年、Google Cloud の約 500 社のお客様がそれぞれ処理したトークン数は </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">1 兆個を超えました</span></a><span style=\"vertical-align: baseline;\">。その多くは、グローバルに業務を展開する銀行、医療、通信など、規制の厳しい分野からのものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini が多くのお客様から選ばれているのは、このようなレベルの本番環境規模に対応できるオープンなエンタープライズ プラットフォームを提供しているからです。これは、次のように実現されます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">日常的なワークフロー全体でエージェント エクスペリエンスを統合する</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ベンダー ロックインなしで、モデルを自由に選択できる</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">請求額が膨らむ前の段階から費用管理を徹底できる</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">一元化された単一のコントロール プレーンでエージェントを管理できる</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">1. 企業全体で使える単一のユニバーサル エージェントを Gemini が提供</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は 10 月に、統合された Gemini エクスペリエンスを発表しました。毎日利用している Gemini が、実際の業務を進めるエンタープライズ エージェントになります。デベロッパー コンソール、一般ユーザー向けツール、職場で使用しているアドオンといった連携していない環境を行き来する必要はありません。Google Workspace、Microsoft 365、社内チャット、ウェブ、モバイルといったプラットフォーム内でネイティブに連携し、普段の業務が行われている場所でそのまま機能します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini には、詳細な指示ではなく、大まかなビジネス目標を伝えます。すると、Gemini が必要なツール、コンテキスト、コワーカー エージェントをオーケストレートして、完成した成果物を提供します。従業員がエージェントとやり取りする際、エージェントは永続メモリを保持し、特定のビジネス用語を理解し、すべてのデバイスで企業の権限設定を尊重します。複雑な手順を自動化したら、それを共有スキルとしてパッケージ化し、あるグループが持つ業務ノウハウを、組織全体の誰もが使用できる機能へと広げられます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このような共通の基盤があることで、エージェントの構築が、孤立したエンジニアリング バックログに留まることなく、組織全体の能力へと変わります。英国の大手決済機関である </span><strong style=\"vertical-align: baseline;\">Dojo</strong><span style=\"vertical-align: baseline;\"> では、非技術部門のチームがこの環境を活用し、わずか 2 か月で 600 以上のカスタム エージェントを立ち上げました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「自然言語を使用できるため、人事から営業まで、誰もが独自の業務経験をわずか数分でカスタム AI エージェントという形に転換できます。2 か月で 600 以上のエージェントを作成しましたが、その大半は現場のビジネスチームが Gemini 上で直接構築したもので、開発者はより複雑な課題に集中できるようになりました。」- Dojo、最高技術責任者、Robert Howes 氏</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Cvo0XV5Z47c\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Dojo、Gemini を活用して 2 か月で 680 以上のエージェントを展開し、AI ネイティブな未来を推進</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Dojo、Gemini を活用して 2 か月で 680 以上のエージェントを展開し、AI ネイティブな未来を推進</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Cvo0XV5Z47c\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">2. 最先端のフロンティア モデルを 1 か所に集約</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、Google、Anthropic、OpenAI という 3 つの主要なフロンティア モデル ファミリーのすべてに、統合されたエンタープライズ プラットフォーム上でアクセスできる唯一のハイパースケール クラウド プロバイダです。Antigravity のデベロッパー ツールから、ウェブ、モバイル、デスクトップ向けの Gemini による日常業務の生産性向上まで、あらゆる場面で利用できます。Model Garden を通じて 200 以上のモデルにアクセスできるため、個別に契約を締結する必要はありません。既存のクラウド契約を削減し、単一の請求としてまとめることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google にとって、Google DeepMind が生み出すイノベーションのスピードも大きな誇りです。この 1 か月だけでも、Google は特定の用途に特化したモデルを一挙にリリースしました。複雑なソフトウェア エンジニアリング、法律、金融、サイバー防御において優れたパフォーマンスを発揮する</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</strong></a><span style=\"vertical-align: baseline;\">、サイバーセキュリティ機能と長期的なエージェント ワークフローにおいて最先端のパフォーマンスを発揮する</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Carbon</strong></a><span style=\"vertical-align: baseline;\">、そしてスピードと効率性を確保しながら日常的なコーディングやエージェント実行に最先端のインテリジェンスをもたらす</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Hydrogen</strong></a><span style=\"vertical-align: baseline;\"> です。</span></p>\n<p><span style=\"vertical-align: baseline;\">モデルを多様なポートフォリオとして扱うことで、お客様はあらゆるタスクにおいて速度、精度、費用のバランスを柔軟に取りながら最適化できるようになります。</span><strong style=\"vertical-align: baseline;\">PayPal</strong><span style=\"vertical-align: baseline;\"> にとって、この柔軟性は戦略の中核を担っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「当社は統合 LLM スタックを構築しました。つまり、GKE の推論スタック上でオープンソース モデルを実行し、Gemini プラットフォーム上でクローズド ソース モデルを実行したのです。開発者は、一貫したガバナンス アクセス レイヤを通じて、Claude、Gemini、オープンソースから好きなモデルを選択できます。当社が Model Garden を高く評価している理由はまさにそこにあります。」- PayPal、AI / ML プラットフォーム担当ディレクター、Srinivasan Manoharan 氏</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=2oStsmDeYv8\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">PayPal、Google Cloud でエージェント型コマースの未来を切り開く</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">PayPal、Google Cloud でエージェント型コマースの未来を切り開く</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=2oStsmDeYv8\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">3. スタックのあらゆるレイヤで費用を最適化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI の請求額が予測しづらいという声は、企業のリーダーから繰り返し寄せられる懸念の一つです。チームがエージェントの規模を拡大し始めると、従量課金制は上限のない付け払いのように感じられるかもしれません。そのため、Google はスタックのあらゆるレイヤで費用を最適化しています。カスタム TPU シリコン、クラスタ ネットワーキング、基盤モデルを単一のシステムとして統合設計することで、ベースライン費用を削減しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">業務を執行するレベルにおいては、利益率を損なうことなくイノベーションを推進できるよう、財務チームとエンジニアリング チームに適切な手段を提供します。Gemini は、タスクごとに最も費用対効果の高いモデルを動的に割り当て、大量のタスクを効率的なモデルで処理します。そして複雑な問題解決が必要な場合にのみ、フロンティア推論モデルにエスカレーションします。プロジェクト レベルの月額費用の上限、異常検出、Flexible Savings Plan などのネイティブな FinOps 管理機能と組み合わせることで、リーダーは厳格な財務上の境界線と明確な可視性を得ることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">大量のデータを処理する企業にとって、このアプローチは大きな違いを生みます。</span><strong style=\"vertical-align: baseline;\">Imgix </strong><span style=\"vertical-align: baseline;\">のエンジニアリング チームは、ビジュアル処理の規模を拡大するにあたり、このアーキテクチャの原則を優先しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「毎回最も高価なモデルを使用すると、お客様にとって多額の請求につながってしまいます。そこで、パイプラインの次の工程へルーティングする前に、Gemini Flash のような低コストのモデルを使って『この画像や動画にそもそもこの AI 機能が必要か』を判断しています。」- Imgix、エンジニアリング責任者、Alfonso Acosta 氏</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=yPlhUlnf4dc\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">今こそ新たな方法を: Imgix、Google Cloud の G4 VM で 1 日 80 億件のメディア リクエストを 50% 高速に処理</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=yPlhUlnf4dc\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">4. 管理されたエンタープライズ コンテキストを実現する単一のコントロール プレーン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">組織が、エージェントを大規模に構築してデプロイする権限を従業員に与える場合、ガバナンスを後回しにすることはできません。エージェントが稼働する環境には、不可欠な要素として組み込まれている必要があります。Gemini では、すべてのエージェントに専用の Agent Identity が割り当てられ、データベース クエリ、ツール アクション、状態遷移のすべてについて、承認されたロールに直接関連付けられた監査可能なレコードが生成されます。実行は隔離されたランタイム サンドボックス内で行われ、Agent Gateway と Model Armor が機密データの自動スクラブやポリシー違反のブロックを行うほか、企業のコンプライアンスをリアルタイムで適用します。</span></p>\n<p><span style=\"vertical-align: baseline;\">このコントロール プレーンの仕組みは、エージェントと企業インテリジェンスとのやり取りにも適用されます。Gemini は、機密性の高いレコードを別の外部リポジトリに移動、複製、重複保存するよう求めることなく、稼働中のエンタープライズ システムに直接接続します。エージェントは、BigQuery、Cloud Storage、SAP、Salesforce、S3、Azure にまたがるデータを根拠として推論を行い、既存のユーザー アクセス制御を引き継ぎながら、専有データを元の境界内に厳密に保持します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ガバナンスの効いたコンテキストと一元管理により、全社的なエージェントの導入が可能になります。Gemini のセキュリティ、ガバナンス、評価の制御機能を利用して、基盤をゼロから構築する手間を省いたのが </span><strong style=\"vertical-align: baseline;\">UKG </strong><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Gemini プラットフォームは、エージェントのホスティングから、エージェントのセキュリティ、エージェントに関するガバナンス、さらにはエージェントが正しく動作していることを確認するための評価まで、私たちが解決を試みていた重要な課題のいくつかを解決してくれています。すぐに使用できるので、価値の創出に専念できます。」- UKG、クラウドおよびエンジニアリング担当責任者、Thomas Newton 氏</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Xo388qKE7mM\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">UKG、Google Cloud AI で「Bryte」を強化し、数千万人の従業員の働き方を改革</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">UKG、Google Cloud AI で「Bryte」を強化し、数千万人の従業員の働き方を改革</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Xo388qKE7mM\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">実際の働き方に合わせて設計された Gemini</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gartner から実行する能力（Ability to Execute）の面で最上位のリーダーとして選出されたことは、企業の現在の業務環境に合わせて価値を届けるという Google Cloud の姿勢が評価された結果といえます。Gemini は、最先端のインテリジェンス、日常的なツールにわたるユニバーサル エージェント オーケストレーション、予測可能な経済性、エンタープライズ ガバナンスを組み合わせることで、開発者とビジネス リーダーがスピード感を持って構築し、安心して運用できる基盤を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">今すぐレポートを</span><a href=\"https://cloud.google.com/resources/content/gartneraiapplicationanddevelopment\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ダウンロード</span></a><span style=\"vertical-align: baseline;\">してください。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">1. Gartner® Magic Quadrant™ for AI Application Development Platforms - Cary Pillers、Keith Holloway、Luke Parker、Pamela Katz、2026 年 11 月 3 日</span></span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Gartner は、発行物に掲載されている特定の企業、ベンダー、製品、サービスを推奨するものではありません。また、最高の格付けまたはその他の評価を得たベンダーのみを選択するように助言するものでもありません。Gartner の発行物は、Gartner のビジネスおよびテクノロジー インサイト組織の見解を表したものであり、事実を表現したものではありません。Gartner は、明示または黙示を問わず、商品性や特定の目的への適合性を含め、本出版物に関連したいかなる保証も行いません。</span></span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Gartner および Magic Quadrant は、Gartner, Inc. および / またはその関係会社の商標です。</span></span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">上の図は、リサーチ ドキュメントの一部として Gartner, Inc. より公開されているもので、ドキュメント全体の文脈に即して評価する必要があります。この Gartner のドキュメントをご希望の方は、Google までご請求ください。</span></span></sup></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">-プロダクト マネジメント担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Mike Clark</strong></p></div>"
  "34460042a9c48ce7f574c03dc01d0794":
    "id": "34460042a9c48ce7f574c03dc01d0794"
    "title": "KDDI と Google Cloud、AI の祭典「KDDI AI Agent Day」を今年も開催：自律型 AI エージェントの社会実装と「循環型イノベーション」への挑戦"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/kddi-and-google-cloud-host-kddi-ai-agent-day-again-in-2026/"
    "published": "2026-11-27 10:30:00"
    "fetched": "2026-11-27 12:32:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2026 年 11 月 13 日、Google Cloud と KDDI は、KDDI グループ内での AI 活用と人材育成を加速させるための大規模イベント「KDDI AI Agent Day with Google 2026」を共同開催しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">2025 年 12 月に開催された第 1 回から約 1 年。生成 AI は「技術を試す」段階から、ビジネスの根幹や現場の業務プロセスを自律的に変革する「社会実装」のフェーズへと大きく進化を遂げました。第 2 回となる今回のテーマは、単に AI を「使う」ことから、業務や組織そのものを「変える」ことへのステップアップです。</span></p>\n<p><span style=\"vertical-align: baseline;\">会場となった Google 渋谷オフィスおよびオンライン配信には、KDDI グループ各社から集結。両社リーダーによる戦略的ビジョンの共有、Google Cloud による最先端の「Augmented Engineering（拡張エンジニアリング）」セッション、101 件のエントリーから勝ち上がった 10 組による熱気あふれる「KDDI AI ハッカソン」ピッチ大会、前年優勝作の実務導入レポート、最新 AI サービスの開発秘話、そして営業現場の変革を語るパネルディスカッションまで、熱狂に包まれた 1 日の様子をお届けします。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_x3CzNfp.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">オープニング：AI の社会実装へ。「使う」から「変える」への挑戦</strong></h3>\n<p><span style=\"vertical-align: baseline;\">オープニングのステージに登壇したのは、</span><strong style=\"vertical-align: baseline;\">KDDI株式会社 執行役員 ビジネスグロース事業本部長 木村 隆 氏</strong><span style=\"vertical-align: baseline;\">です。木村氏は、2025 年 10 月の Google Cloud との包括的戦略提携発表からの 1 年間を振り返り、従業員向け（toE）、消費者向け（toC）、法人顧客向け（toB）の全領域で AI の社会実装を着実に推進してきた手応えを語りました。</span></p>\n<p><span style=\"vertical-align: baseline;\">そのうえで木村氏は、多くの企業が現在直面している課題として、AIを「使う」段階にある企業が回答の80%に上る一方、AIによって事業を「変える」段階にあると答えた企業は6%にとどまることを挙げ、「使う」と「変える」の間に74%もの深い溝があると指摘。個人の業務効率化に閉じた「部分最適の壁」や、組織間の受け渡しで知見が失われる「組織分断の壁」を打ち破る必要があると訴えました。その解決策として提示されたのが、事業構想から現場の顧客接点までをデータで一本の循環として結ぶ「循環型 AI 活用」です。AI 駆動型経営とアジャイル型組織を車の両輪とし、現場の小さな成功体験を事業全体の構造改革へとつなげていくビジョンが力強く示されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">続いて、</span><strong style=\"vertical-align: baseline;\">Google Cloud 執行役員 渕上 和寿</strong><span style=\"vertical-align: baseline;\">が登壇。KDDI とのパートナーシップが強固な信頼関係のもとで深化していることへの感謝を述べるとともに、「現場の切実な課題から生まれる AI エージェントこそが、真の業務変革をもたらす。本日のハッカソンやセッションを通じて、未来のビジネスを動かす新たな芽が生まれることを期待している」と激励の言葉を贈りました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image8\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image8_x8dwJiq.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">AI Deep Dive：Google Cloud の最新 AI アップデートと「Augmented Engineering」の未来</strong></h3>\n<p><span style=\"vertical-align: baseline;\">技術セッションの前半では、</span><strong style=\"vertical-align: baseline;\">Google Cloud 坂井 俊介</strong><span style=\"vertical-align: baseline;\">が「Gemini 最新アップデート」と題して登壇。マルチモーダル理解の飛躍的な進化や、100 万〜200 万トークンにおよぶ長大なコンテキストウィンドウの活用法、そして Vertex AI 上で自律型エージェントを素早く構築・連携させる最新機能を紹介しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">続いて、Google Cloud  Richard Seroter（リチャード・セローター）が「The agents are here. Now what?」をテーマに登壇しました。Seroter は、AI エージェントが実用段階に入った今、ソフトウェアエンジニアリングや業務プロセスがどう進化するかを解説。「Augmented Engineering（拡張エンジニアリング）」という概念を提唱し、単なるコード補完にとどまらず、要件定義からアーキテクチャ設計、テスト、デバッグ、運用監視に至るまで、複数の専門エージェントが協調して人間を自律支援する未来像を示しました。人間がより本質的で創造的な意思決定に集中できる環境を整えることの重要性を熱く語り、会場の大きな関心を集めました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">KDDI AI ハッカソン ファイナリスト ピッチ大会：現場の熱量が生んだ 10 の自律型エージェント</strong></h3>\n<p><span style=\"vertical-align: baseline;\">本イベントの目玉プログラムである「KDDI AI ハッカソン ファイナリスト ピッチ大会」では、KDDI グループ全体から集まった 101 件の応募の中から、書類選考を勝ち抜いた 10 組のファイナリストが登壇しました。今年はより多様な挑戦を促進するため、「ノーコード部門」と「AI 駆動開発部門」の 2 コース制を導入。会場とオンラインの参加者によるリアルタイム投票と審査員による厳正な審査が行われました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_UEAjp76.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">【ノーコード部門】</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KDDI株式会社 パーソナルコア事業本部 新出 健介 氏 </strong><span style=\"vertical-align: baseline;\">：マニュアル作成の常識を『逆流』する！ ゴールから逆算して元ネタを獲る「K-Naviサケノボリ・エージェント」</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KDDI株式会社 渉外コミュニケーション統括本部 土井 章嗣 氏</strong><span style=\"vertical-align: baseline;\">：Alter Ego アルターエゴ ～自分の分身エージェント～</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KDDI株式会社 経営戦略本部 山口 颯斗 氏</strong><span style=\"vertical-align: baseline;\">：「分析の巨人」 〜巨人の肩の上に立ち、分析を自走させる〜</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">株式会社KDDIテクノロジー 先端技術統括本部 グエン スアン クイン チー 氏</strong><span style=\"vertical-align: baseline;\">：AI PM Secretary</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KDDI Biz Edge株式会社 営業推進統括本部 田邉 将寛 氏 / 共同登壇：安永 昂史 氏</strong><span style=\"vertical-align: baseline;\">：全国の企業を災害リスクから守る “Biz Edge BCP Connect”</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image3_V4P596D.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">【AI 駆動開発部門】</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">　</strong><span style=\"vertical-align: baseline;\">6.</span><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">KDDI株式会社 事業創造本部 米川 慧 氏</strong><span style=\"vertical-align: baseline;\">：おすみつき 承認は、押すものから、書いておくものへ。上長のお墨付きで、エージェントが申請を裁く</span></p>\n<p><span style=\"vertical-align: baseline;\">　7. </span><strong style=\"vertical-align: baseline;\">KDDI株式会社 先端技術統括本部 矢羽田 大揮 氏 </strong><span style=\"vertical-align: baseline;\">：「SAIさんと一緒に採算管理を大改革」～AIエージェントを中心とした採算管理を目指して～</span></p>\n<p><span style=\"vertical-align: baseline;\">　8.  </span><strong style=\"vertical-align: baseline;\">株式会社ARISE analytics先行開発検証チーム 小菅 数馬 氏</strong><span style=\"vertical-align: baseline;\">：「デジタル従業員」必要な情報を自ら集め、任された範囲で仕事を進める、部署の一員</span></p>\n<p><span style=\"vertical-align: baseline;\">　9.  </span><strong style=\"vertical-align: baseline;\">KDDI株式会社 コーポレート統括本部 藤井 亮次 氏</strong><span style=\"vertical-align: baseline;\">：「Manuca（マニュカ）」 撮るだけで、AIが読めるマニュアルに。～プロンプト不要！ 動画を与えるだけでマニュアル完成～</span></p>\n<p><span style=\"vertical-align: baseline;\">　10.  </span><strong style=\"vertical-align: baseline;\">KDDI株式会社 先端技術統括本部 井藤 七穂 氏</strong><span style=\"vertical-align: baseline;\">：いっこ～ひとりで泣かなくていい、くらしの道しるべ～</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image6\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image6_wisyR1h.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">審査の結果、栄えある</span><strong style=\"vertical-align: baseline;\">最優秀賞</strong><span style=\"vertical-align: baseline;\">に輝いたのは、ノーコード部門の </span><strong style=\"vertical-align: baseline;\">「K-Naviサケノボリ・エージェント」（KDDI株式会社 パーソナルコア事業本部 新出 健介 氏）</strong><span style=\"vertical-align: baseline;\"> でした。</span></p>\n<p><span style=\"vertical-align: baseline;\">KDDI 社内の総合ナレッジベース「K-Navi」には、月間 600 件以上もの掲載依頼が寄せられます。これまでは依頼資料の読み解きや社内ルールに合わせた整形、HTML 作成に多大な時間がかかっていました。新出氏は、川を上る鮭のように「完成形（ゴール）から逆算して元ネタ資料へさかのぼり、根拠を二重チェックする」という逆転の発想を Gemini Enterprise 上で構築。さらに、現場の知見を落とし込み、「作り話をしない」「迷った箇所は色分け（紫文字）で確認事項として提示する」といった徹底した実用設計を施しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この仕組みにより、1 件あたり 40 分の作業時間を短縮し、年間約 4,832 時間の削減が見込めるだけでなく、担当者が「作る仕事から、確かめる仕事へ」とシフトできる点が高く評価されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、各部門賞および審査員特別賞には以下のチームが選ばれました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ノーコード賞</strong><span style=\"vertical-align: baseline;\">：</span><strong style=\"vertical-align: baseline;\">「Biz Edge BCP Connect」（KDDI Biz Edge株式会社 営業推進統括本部 田邉 将寛 氏 / 安永 昂史 氏）</strong><span style=\"vertical-align: baseline;\"> 全国の企業を災害リスクから守るため、ハザードマップや BCP 対策の提案シナリオをノーコードで自動生成する実践的な営業支援エージェント。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI 駆動開発賞</strong><span style=\"vertical-align: baseline;\">：</span><strong style=\"vertical-align: baseline;\">「Manuca（マニュカ）」（KDDI株式会社 コーポレート統括本部 藤井 亮次 氏）</strong><span style=\"vertical-align: baseline;\"> 業務の様子をスマートフォンなどで撮影するだけで、AI が作業手順を解析し、プロンプト不要で高品質なマニュアルを自動生成する革新的なエージェント。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">審査員特別賞</strong><span style=\"vertical-align: baseline;\">：</span><strong style=\"vertical-align: baseline;\">「SAIさんと一緒に採算管理を大改革」（KDDI株式会社 先端技術統括本部 矢羽田 大揮 氏）</strong><span style=\"vertical-align: baseline;\"> 複雑で属人化しやすい採算管理業務において、エージェントが自律的にデータ集計と差異分析を行う業務直結型ソリューション。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">KDDI 実践セッション：ハッカソンの実務実装と新サービス開発ストーリー</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ハッカソンの熱気冷めやらぬ後半のセッションでは、KDDI 社内における具体的な AI 実装事例と、サービス開発のリアルな舞台裏が明かされました。</span></p>\n<p><span style=\"vertical-align: baseline;\">まず登壇したのは、昨年のハッカソン最優秀賞チームである </span><strong style=\"vertical-align: baseline;\">KDDI株式会社 広報部 手塚 隆二 氏 と先端技術統括本部 近岡 英明 氏</strong><span style=\"vertical-align: baseline;\">です。「ハッカソン優勝から実業務へ！『KoDama PRism』が起こす業務変革と全社貢献」と題し、アイデアを本番環境へ定着させるまでの軌跡を語りました。</span></p>\n<p><span style=\"vertical-align: baseline;\">年間約 47 万件にのぼる記事露出チェックと PR 効果測定を自動化するにあたり、チームは「鬼の 100 本ノック」と呼ばれるプロンプト修正と精度検証を愚直に反復。その結果、広報業務の大幅な省力化を達成しただけでなく、浮いた時間をメディアリレーションの強化や PR 戦略の立案といった「価値創出領域」へシフトさせることに成功しました。現在は社内の他部署からの相談も受け付け、全社的な業務変革モデルとして広がりを見せています。</span></p>\n<p><span style=\"vertical-align: baseline;\">続いて、</span><strong style=\"vertical-align: baseline;\">KDDI株式会社 事業創造本部 AIプロダクト部 小野田 隼也 氏</strong><span style=\"vertical-align: baseline;\">が登壇。「苦労の先にあったリリース ― Buffmee 開発ストーリー」と題し、2026 年 9 月にリリースされた対話型 AI サービス「Buffmee」の開発秘話を公開しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Buffmee は「AI に委ねる手軽さ」と「自分で考える豊かさ」をつなぐことを目指したサービスです。小野田氏は、開発プロセスにおいてプロンプト、コンテキスト、ハーネス（テストやガードレール）、ループを回す「AI 駆動開発」を全面的に導入した経験を共有。「疑似定性調査やモック作成、データ分析は AI に任せ、何を世に出すかという評価の物差しは人間が決める」という明確な役割分担のもと、2 か月ごとに新機能をリリースし続けるアジャイルな開発体制を確立した過程を紹介しました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_b02QiTW.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">パネルディスカッション：「もっとお客さまに向き合いたい」を、AI でかなえる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">続いて行われたパネルディスカッションでは、「『もっとお客さまに向き合いたい』を、AI でかなえる ～AI 時代の営業活動の秘訣〜」をテーマに、現場で営業改革をリードするパネリストたちが熱い議論を交わしました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パネリスト</strong><span style=\"vertical-align: baseline;\">：</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KDDI Biz Edge株式会社 営業推進統括本部 営業企画部 部長 鈴木 裕生 氏</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KDDI株式会社 経営戦略本部 Data&amp;AI センター グループリーダー 吉田 晃司 氏</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">auコマース＆ライフ株式会社 MD 推進本部ストア営業推進部 安森 早見 氏</strong></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">モデレーター</strong><span style=\"vertical-align: baseline;\">：</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud 青木 路衣</strong></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ディスカッションでは、auコマース＆ライフにおける劇的な成果が共有されました。AI エージェントが店舗データを迅速に分析して潜在課題を可視化したことで、前任者から引き継いだばかりの重要店舗への対面出張を即断。現地で店主と膝を突き合わせた提案を行った結果、わずか 2 週間で CVR（購買転換率）の V 字回復を達成したという具体的なエピソードが語られました。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、営業支援 AI モデル「BESDA」を通じて、商談記録や日報の自動生成が営業活動の負担を減らすだけでなく、自然に良質なデータを蓄積し、マネージャーによる指導・育成の時間を創出するという「好循環サイクル」が紹介されました。「AI を活用することで業務を効率化し、人にしかできない対話や信頼関係づくりにより多くの時間を注ぎ込めるようになる」というメッセージは、多くの参加者の共感を呼びました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image5\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image5_fMCoALS.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">まとめ：AI とともに歩む「循環型イノベーション」へ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">イベントの締めくくりとなるクロージングには、</span><strong style=\"vertical-align: baseline;\">KDDI株式会社 執行役員 先端技術統括本部長兼 先端技術企画本部長 藤井 彰人 氏</strong><span style=\"vertical-align: baseline;\">が登壇しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">藤井氏は、ハッカソンや実践セッションで見られた社員の熱量に対し、「AI は私たちの仕事を奪うライバルではなく、自分たちの可能性を何倍にも広げてくれる頼もしいパートナー。今日ここで生まれた素晴らしいアイデアや熱気を、KDDI グループ全体、そして社会の変革へとつなげていきましょう」と力強く呼びかけました。</span></p>\n<p><span style=\"vertical-align: baseline;\">セッション終了後に開催された懇親会では、登壇者、ハッカソン参加者、審査員、来場者が一堂に会し、尽きることのない熱いディスカッションが繰り広げられました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「KDDI AI Agent Day 」は、自律型 AI エージェントが構想の域を脱し、現場の創意工夫によってビジネスと働き方を根底から変え始めていることを鮮やかに証明しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud はこれからも、KDDI との強力なパートナーシップを通じて、AI の力で日本の明日を明るく照らす挑戦を続けてまいります。</span></p></div>"
  "84aa58ea122399ef47ee180f49d24b5d":
    "id": "84aa58ea122399ef47ee180f49d24b5d"
    "title": "日立グループが ChromeOS 端末で描く、新しい働き方"
    "link": "https://cloud.google.com/blog/ja/topics/customers/the-hitachi-groups-vision-for-a-new-way-of-working-with-chrome-os-devices/"
    "published": "2026-11-27 10:00:00"
    "fetched": "2026-11-27 12:32:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エネルギー、鉄道、デジタルの 3 分野を軸に、世界約 140 カ国で事業を展開する日立グループ。約 600 社、28 万人超が働く企業グループが、グループ内で利用するシンクライアント端末を ChromeOS 端末へと大規模にリプレースしました。その背景と導入効果について、同プロジェクトに関わったメンバーの皆さんに話を伺いました。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Zb8kEn82yaM\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">日立グループが ChromeOS 端末で描く、新しい働き方</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">日立グループが ChromeOS 端末で描く、新しい働き方</h4>\n        \n        \n          <p>日立グループが ChromeOS 端末で描く、新しい働き方</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Zb8kEn82yaM\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">シンクライアント端末の老朽化と維持管理の工数増大に課題</strong></h3>\n<p><span style=\"vertical-align: baseline;\">「優れた自主技術・製品の開発を通じて社会に貢献する」。創業から 110 年以上たった今もなお脈々と受け継がれる社是のもと、世界中で社会インフラを支え続けている日立グループ。その従業員が日々使用するパソコンやスマートデバイスの提供を統括しているのがＩＴデジタル統括本部部長の高橋 幸喜さんです。グループ全体で約 95% の従業員のデバイスを管理しており、国内向けにはおよそ 30 万台のデバイスを提供していると言います。</span></p>\n<p><span style=\"vertical-align: baseline;\">「今日のビジネスにおいては、パソコンやスマート デバイスがなければ業務は成り立ちません。多くの社会インフラを支える日立の業務が止まることは、社会の動きを止めること。適切なデバイスの提供は非常に責任のある仕事として世の中に貢献できていると実感しています」（高橋 幸喜さん）</span></p>\n<p><span style=\"vertical-align: baseline;\">この日立を支えるデバイスとして長らく使われてきたのが、手元にデータを残さないシン クライアント端末でした。導入の背景について、サービスの取りまとめを担うＩＴデジタル統括本部部長代理の柴田 勝也さんは「過去に端末の紛失が情報セキュリティ事故につながったことが、グループ全体の大きな反省事項としてありました」と振り返ります。一方で、長年使用してきたシン クライアント端末には課題もありました。導入から6〜7 年が経過して老朽化が目立ち始めていたことに加え、端末を維持管理する工数も無視できない規模に膨らんでいたのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">「次のリプレースでは、維持管理の手間が掛からない端末をユーザーに提供したいと考えていました。そう考えたときに、白羽の矢が立ったのが ChromeOS でした」（柴田さん）</span></p>\n<p><span style=\"vertical-align: baseline;\">同社が端末に求めた前提条件は 3 つ。既存のシンクライアント端末と同等のセキュリティ レベルを担保できること。高い可用性を持ち、ユーザーのメンテナンス負担を軽減できること。そして、IT 部門側の業務工数も低減できること。PoC（概念実証）の段階からこれらを満たせる見通しが得られたことが決め手となり、ChromeOS 端末の採用が決まりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">注目すべきは、この大きな判断がトップダウンではなかったことです。「上層部から ChromeOS を使えと言われたわけではなく、『こうした効果が期待できるので検証させてほしい』というボトムアップで提案しました」と高橋さん。実際に検証を重ねて「これはやれる」という確証を得たうえで、最終的な導入を決断したと言います。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">配信リードタイムは 4〜5 カ月から 1 カ月へ。年間 4.8 億円のコスト削減を実現</strong></h3>\n<p><span style=\"vertical-align: baseline;\">導入効果は、まず運用現場に現れました。象徴的なのがキッティング作業です。</span></p>\n<p><span style=\"vertical-align: baseline;\">「実は ChromeOS のキッティング作業はほとんどありません。ふたを開けて電源を入れたあと、明示的に行うのはネットワークに接続することくらいです。必要なポリシーは管理コンソールから自動的に端末に適用され、業務に使用するアプリケーションも自動でインストールされます。『これなら IT 部門がいなくても自分たちで対応できる』とユーザーの皆さんに言っていただけるサービスを実現できました」（柴田さん）</span></p>\n<p><span style=\"vertical-align: baseline;\">セキュリティ面では、サインアウトや電源オフのタイミングで端末内のキャッシュ データが削除される「管理対象ゲスト セッション」機能を活用。手元にデータを残さないというシンクライアントの要件を、ChromeOS の標準機能で満たすことができました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ソフトウェアの配信プロセスも一変しました。従来は配信用サーバーの構築や配信パッケージの設計を自前で行っており、配信決定からユーザーに届けるまで 4〜5 カ月を要していましたが、現在は約 1 カ月サイクルにまで短縮。設計やレビューにかかる時間が減ったことで、チームメンバーの負担も軽くなったと言います。こうした効果を積み上げた結果、IT 部門とエンドユーザー双方のコストを合算して、年間 4.8 億円を超える削減効果を達成しました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">1 人ひとりのスイッチが入るデバイスへ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">今回のリプレースは、業務を妨げないスムーズな移行によってデバイスを使うユーザーにも歓迎されました。海外グループ会社へのデバイス提供に携わるＩＴデジタル統括本部技師の高橋 梓さんは、自らもユーザーとして使い勝手を実感した 1 人です。「ChromeOS であれば、クラウドベースで設定が済んだ状態で手元に届くので、リプレースの際も、ほんの少し設定するだけでいつもの業務に戻ることができます」と振り返ります。</span><span style=\"vertical-align: baseline;\">（高橋 梓さん）</span></p>\n<p><span style=\"vertical-align: baseline;\">ChromeOS 端末へのリプレース後、同社で行われた従業員への IT 満足度調査では、「生産性の向上に最も貢献した IT サービス」の第 1 位にクライアント デバイスが選ばれたこともあるそうです。</span></p>\n<p><span style=\"vertical-align: baseline;\">「クライアントも AI も進化していくのは間違いありませんが、結局、それを使うのは従業員 1 人ひとりです。朝、パソコンの電源を入れるとき、それがその人自身のやる気のスイッチが入ることにつながる。そのようにモチベーションが上がってくれることが、生産性向上につながるはずだと思っています。社員だけでなく IT 担当も含め、双方が簡単にベスト パフォーマンスを発揮できる。安全な ChromeOS 端末という Google の最新テクノロジーを活用したからこそ、これほど短い期間で達成できたのだと感じています。この好循環が、新しい AI 時代へと進んでいくための私たちの大きなミッションの達成につながると期待しています」（高橋 幸喜さん）</span></p>\n<hr />\n<p><strong style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">株式会社日立製作所</strong><br /></strong><span style=\"vertical-align: baseline;\">1910 年に創業。以来、「優れた自主技術・製品の開発を通じて社会に貢献する」という企業理念のもと、電力、鉄道、産業機械から家電、IT に至るまで、社会と暮らしを支えるさまざまな製品・システムを世に送り出し、日本を代表する総合電機メーカーとして業界を牽引する存在に。近年では、IT と社会インフラ技術、そして蓄積したデータを掛け合わせる「社会イノベーション事業」に注力し、エネルギー、鉄道、デジタルの 3 分野を軸に、世界約 140 カ国でカーボンニュートラルやデジタル変革といった社会課題の解決にも積極的に取り組んでいる。</span></p>\n<p><strong style=\"vertical-align: baseline;\">株式会社日立製作所<br /></strong><span style=\"vertical-align: baseline;\">ＩＴデジタル統括本部部長 高橋 幸喜さん<br /></span><span style=\"vertical-align: baseline;\">ＩＴデジタル統括本部部長代理 柴田 勝也さん<br /></span><span style=\"vertical-align: baseline;\">ＩＴデジタル統括本部技師 高橋 梓さん</span></p></div>"
