    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>You can use <a href=\"https://docs.cloud.google.com/bigquery/docs/cross-cloud-connections\">cross-cloud connections</a> to\nquery data in AWS, Azure, and Salesforce Data 360 from all BigQuery regions with\nmore feature availability than standard connections that use BigQuery Omni. This\nfeature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h3>Deprecated</h3>\n<p>The BigQuery Storage API v1beta1 is deprecated and will be shut down on August 31, 2027.</p>\n<p>Key milestone dates:</p>\n<ul>\n<li><strong>Nov 20, 2026:</strong> Access to the BigQuery Storage API v1beta1 is restricted to projects that recorded active usage between March 1, 2026, and August 31, 2026.</li>\n<li><strong>August 31, 2027:</strong> The BigQuery Storage API v1beta1 will be fully shut down. After this date, calls to the v1beta1 endpoint will fail with a <code>NOT_FOUND</code> error.</li>\n</ul>\n<p><strong>What you need to do:</strong></p>\n<p>To prevent service disruption, migrate your workloads from <code>v1beta1</code> to the generally available <a href=\"https://docs.cloud.google.com/bigquery/docs/reference/storage/rpc/google.cloud.bigquery.storage.v1\">BigQuery Storage API v1</a>. The <code>v1</code> API is backward-compatible with <code>v1beta1</code>.</p>\n<ul>\n<li><strong>SDKs and connectors:</strong> If you use connectors or client libraries, update them to the latest versions to ensure they default to the <code>v1</code> API:\n<ul>\n<li><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/odbc-jdbc-drivers\">Simba ODBC/JDBC for BigQuery</a></li>\n<li><a href=\"https://docs.cloud.google.com/bigquery/docs/odbc-for-bigquery\">Google BigQuery ODBC</a> / <a href=\"https://docs.cloud.google.com/bigquery/docs/jdbc-for-bigquery\">JDBC driver</a></li>\n<li><a href=\"https://trino.io/docs/current/connector/bigquery.html\">Trino BigQuery plugin</a></li>\n<li><a href=\"https://beam.apache.org/documentation/io/built-in/google-bigquery/\">Apache Beam BigQuery connector</a></li>\n<li><a href=\"https://github.com/GoogleCloudDataproc/spark-bigquery-connector\">Spark BigQuery connector</a></li>\n<li><a href=\"https://spotify.github.io/scio/io/BigQuery.html\">Scio BigQuery plugin</a></li>\n</ul></li>\n<li><strong>Custom code:</strong> If your applications call the <code>v1beta1</code> API directly (for example, using gRPC), update your code to target the <code>v1</code> API endpoint (<code>google.cloud.bigquery.storage.v1</code>).</li>\n</ul>\n<p>For more information, see the <a href=\"https://docs.cloud.google.com/bigquery/docs/reference/storage\">BigQuery Storage API reference</a>.</p>\n<p>If you are using <code>v1beta1</code> and have concerns with this deprecation schedule, please contact us via a support case.</p>"
