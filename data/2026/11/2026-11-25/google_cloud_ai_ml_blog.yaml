    "title": "Built for trust and control: Powering the next wave of AI agents across Google Workspace and Google Cloud"
    "link": "https://cloud.google.com/blog/products/identity-security/deploying-agents-safely-in-your-enterprise/"
    "published": "2026-11-25 02:00:00"
    "fetched": "2026-11-25 09:22:02"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For over 20 years, we have protected 4 billion users and 13 million organizations in Workspace, and critical enterprise and government systems on Google Cloud. From personal and financial records to board materials, regulated workloads, applications, and AI models, those safeguards protect what matters most. Blocking &gt;99.9% of spam, phishing, and malware, alongside encryption and data residency, follows one principle: your data is yours, and you should always know and decide who can access it.</span></p>\n<p><span style=\"vertical-align: baseline;\">That trust has powered one of the world’s largest developer ecosystems. Workspace APIs now handle more than 2.8 trillion calls a month, and public Google Drive API traffic alone is more than two-and-a-half times the volume of 2022. More than 18 billion reads from Drive each day come from API callers. Traditional REST APIs were built for human-paced apps where a valid OAuth token implied user intent. As AI agents shift from reading information to acting autonomously at machine speed across email, documents, datasets, and cloud infrastructure, a valid token is no longer enough. Policy checks, data boundaries, and human confirmation have to live in the request path. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, Workspace MCP servers and the Workspace CLI are generally available alongside Google Cloud Agent Gateway and unified protections across Workspace and Google Cloud. Builders get modern, agent-ready interfaces, and organizations get the visibility and control to adopt AI agents with confidence.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Purpose-built interfaces: Workspace MCP servers, Workspace CLI, and Cloud Agent Gateway</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To help developers build reliable agents faster without forcing security teams to compromise, we are bringing agent-native interfaces to Workspace and Google Cloud:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/workspace/guides/configure-mcp-servers#support-products\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Workspace MCP servers</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Now generally available, dedicated remote servers for Gmail, Google Drive, Docs, Sheets, Slides, Calendar, Chat, and Tasks. Builders get one standard interface with built-in permission and DLP checks, and native human-in-the-loop (HITL) confirmations for sensitive actions. They also reject non-agent OAuth clients and work with Model Armor, Google Cloud’s prompt-injection screening service.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/workspace/guides/workspace-cli\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Workspace CLI</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Now generally available for local agents, terminal workflows, and automation, providing structured JSON outputs and scoped OAuth sign-in across Workspace services.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Agent Gateway</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> A protocol-native gateway for LLM, MCP, and Agent2Agent (A2A) traffic on Google Cloud. It verifies Agent Identities against Agent Registry, enforces IAM policies and default-deny outbound rules, and screens requests with Model Armor.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Together, these interfaces give AI agents open, protocol-native paths built on standards like MCP and A2A. Permissions, confirmations, prompt screening, and audit logging happen automatically, while traditional apps continue to run on existing REST APIs.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Consistent controls across every agent workflow</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Those interfaces sit on a unified security model across Workspace and Google Cloud, with core controls shipping today:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Policy checks on every request:</strong><span style=\"vertical-align: baseline;\"> Under our new </span><a href=\"https://workspace.google.com/terms/ai-tools\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Workspace AI Tools Addendum</span></a><span style=\"vertical-align: baseline;\">, AI agents must use Workspace MCP servers or the Workspace CLI rather than existing REST APIs. Technical enforcement begins on February 1, 2027, giving builders time to transition. Every call is checked against your organization’s Workspace permissions, DLP rules, and classification labels. On Google Cloud, Agent Gateway enforces IAM and default-deny outbound rules at the protocol layer and routes custom checks through Service Extensions to Identity-Aware Proxy, your own policy engine, or third-party security tools.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Separate agent identities and limits:</strong><span style=\"vertical-align: baseline;\"> Admins and users need to tell an AI agent apart from a traditional app or a person, and cap what it can do. Agents connecting to Workspace must use dedicated </span><a href=\"https://support.google.com/cloud/answer/15549257#agentic-client\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OAuth client IDs</span></a><span style=\"vertical-align: baseline;\">, paired with least-privilege scopes, time-limited approvals (coming soon), and </span><a href=\"https://developers.google.com/workspace/guides/quota-usage-tiers\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">usage quotas</span></a><span style=\"vertical-align: baseline;\"> (billing begins on April 1, 2027). On Google Cloud, agents receive their own Agent Identity in Agent Registry with no shared or long-lived keys, bounded by IAM policies and organization, folder, and project quotas. Those identities can also carry user-delegated authorization into Workspace when accessing mail or files.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">People stay in charge of high-impact actions:</strong><span style=\"vertical-align: baseline;\"> Routine work like creating drafts or summarizing documents runs autonomously, while critical changes require a person to sign off. In Workspace, MCP servers and the CLI enforce explicit user confirmation before agents send email, change Drive sharing permissions, or make bulk edits. On Google Cloud, policy can require multi-factor authentication or human approval before reading sensitive Cloud Storage buckets, changing IAM permissions, or modifying production infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Clear visibility and revocation:</strong><span style=\"vertical-align: baseline;\"> A one-time consent screen is not enough when agents run continuously. Workspace administrators can view, audit, and revoke AI agents in the </span><a href=\"https://support.google.com/a/answer/7281227\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">admin console</span></a><span style=\"vertical-align: baseline;\">, and users will soon be able to view agent activity and revoke access to their emails and files. On Google Cloud, Security Command Center, Agent Observability, Cloud Audit Logs, and Wiz surface unusual behavior. Revoking a Cloud Agent Identity or OAuth grant stops access immediately.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Boundaries for your most sensitive data:</strong><span style=\"vertical-align: baseline;\"> Coming soon in Workspace, AI access restrictions extend Workspace DLP and client-side encryption protections to agents. This will allow admins and users to block agents from accessing messages in Gmail and specific files and folders in Drive. On Google Cloud, VPC Service Controls, Principal Access Boundaries, and Context-Aware Access keep sensitive data inside designated perimeters and verified devices.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strict rules on your data afterward:</strong><span style=\"vertical-align: baseline;\"> Our new </span><a href=\"https://workspace.google.com/terms/ai-tools\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Workspace AI Tools Addendum</span></a><span style=\"vertical-align: baseline;\"> sets clear boundaries for AI tools using Workspace APIs. It does not allow permanent raw storage, model training, extended retention of derived data, or API scraping. Derived and user data are removed within a defined window and when a user disconnects. On Google Cloud, Sensitive Data Protection masks sensitive fields before data leaves, and customer-managed or external encryption keys let you cut off access to Cloud agent memory stores immediately.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Workspace developers:</strong><span style=\"vertical-align: baseline;\"> Start building with the </span><a href=\"https://developers.google.com/workspace/guides/configure-mcp-servers\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Workspace MCP and CLI configuration guide</span></a><span style=\"vertical-align: baseline;\">, implement </span><a href=\"https://developers.google.com/workspace/guides/mcp-elicitation\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">user confirmations via MCP</span></a><span style=\"vertical-align: baseline;\"> and prompt-injection protection such as Model Armor, and review the </span><a href=\"https://workspace.google.com/terms/ai-tools\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Workspace AI Tools Addendum</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Workspace administrators:</strong><span style=\"vertical-align: baseline;\"> Review connected apps and agents, configure DLP policies for your users, and monitor OAuth activity logs in the </span><a href=\"https://support.google.com/a/answer/7281227\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">admin console</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud customers:</strong><span style=\"vertical-align: baseline;\"> Register Agent Identities in Agent Registry, place Agent Gateway and Model Armor in front of agents and MCP servers, configure MFA or human approval for sensitive actions, and review IAM, VPC Service Controls, and quota limits.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">With Workspace MCP servers and the Workspace CLI generally available alongside Google Cloud’s agent protections, developers have an open, modern platform to build on. Organizations get the visibility and control to scale AI agents with confidence.</span></p></div>"
