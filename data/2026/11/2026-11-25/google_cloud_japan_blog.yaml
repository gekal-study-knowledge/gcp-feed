">\n<p><span style=\"vertical-align: baseline;\">株式会社G-gen</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">武井祐介</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Security and Networking</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">株式会社野村総合研究所</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">山田康博</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Data Analytics</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">株式会社MBKデジタル</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">岩尾一優</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Data Analytics</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">株式会社DataCurrent</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">田中裕章</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Data Analytics</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">株式会社電算システム</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">新直哉</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Serverless App Development</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">クラウドエース株式会社</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">髙橋和真</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Serverless App Development</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">クラウドエース株式会社</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Nozomi Koborinai</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Modern Architecture</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">クラウドエース株式会社</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">妹尾登茂木</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Modern Architecture</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">株式会社D.Force</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">川上明久</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Databases</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">株式会社スリーシェイク</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">中楯直希</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">受賞された皆様には、この一年の輝かしい実績への感謝と敬意を込めて、</span><strong style=\"vertical-align: baseline;\">トロフィーとデジタルバッジ、Google Cloud Partner Top Engineer の特製バッジ、ステッカー</strong><span style=\"vertical-align: baseline;\">を贈呈いたします。また、11 月 26 日（木）開催の Partner Forum にて表彰式を行うほか、今後 Google Cloud Japan チームとの交流を深める企画や、受賞された皆様のさらなる飛躍を支援する施策を検討しています。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--small\n      \n      \n        h-c-grid__col\n        \n        \n        h-c-grid__col--2 h-c-grid__col--offset-5\n      \">\n\n      \n      \n        \n        <img alt=\"image3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image3_VYZuLwh.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>（写真はイメージです）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">改めまして、「Google Cloud Partner Top Engineer 2027」を受賞された皆様、誠におめでとうございます。</span></p>\n<p><span style=\"vertical-align: baseline;\">皆様が現場で灯してくださる技術への情熱と探究心が、所属パートナー企業様、お客様、そして日本のクラウド・AI コミュニティ全体を明るく照らす大きな原動力となっています。あわせて、皆様の日々の挑戦を温かく支えてこられた所属パートナー企業様やチームの皆様にも、心より御礼申し上げます。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、今回惜しくも受賞には届かなかった皆様におかれましても、この一年の挑戦の軌跡を共有しご応募くださったことに、</span><span style=\"vertical-align: baseline;\">改めて深く感謝申し上げます。皆様が積み重ねてこられた学びや経験の一つひとつが確かな力であり、Google Cloud にとっても大きな支えです。</span><span style=\"vertical-align: baseline;\">皆様の今後ますますのご活躍を心よりお祈り申し上げます。</span></p>\n<p><span style=\"vertical-align: baseline;\">進化を続けるテクノロジーの世界で、来年はさらに多くのエンジニアの皆様に受賞の栄誉をお届けし、また新たな挑戦や素晴らしい才能に出会えることを、Google Cloud Japan 一同、心よりお待ちしております。。この一年間 Google Cloud とともに歩んでくださったすべてのパートナー エンジニアの皆様、本当にありがとうございました。来年も、より多くの方々にご応募いただけることを心より楽しみにしております。</span></p></div>"
  "6414ca25b41a27914fcdc45e2601e065":
    "id": "6414ca25b41a27914fcdc45e2601e065"
    "title": "ヨーロッパにおけるソブリン AI: AI スタックを制御する新しい方法"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/sovereign-ai-on-your-terms-made-with-europe/"
    "published": "2026-11-25 10:30:00"
    "fetched": "2026-11-25 18:33:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 18 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/sovereign-ai-on-your-terms-made-with-europe?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回ブリュッセルで開催された Sovereign AI Summit では、公共部門のリーダー、政策立案者、パートナー各社が集まり、ヨーロッパによる管理のもとで AI を活用して今後 10 年間のヨーロッパの公共サービス、ヘルスケア、金融をどのように構築していくかを議論しています。Google は、ヨーロッパのパートナーとともに、その実現を支援します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この目標を達成するには、データの保存場所を決めるだけでは不十分です。ヨーロッパの組織との対話では、次のような 4 つの共通する疑問をよく耳にします。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">制御を強化すると、AI の性能や機能面で妥協することを意味するのか？</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">誰がデータにアクセスできるのか、また制御が機能していることを規制当局に証明できるのか？</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">組織が AI で生み出す価値はヨーロッパにとどまるか？</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI を安定して稼働させ続けるにはどうすればよいか？</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">2025 年 5 月 Google は、ワークロードごとに必要な制御レベルに合わせて選択できるソブリン クラウド サービスの</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/google-advances-sovereignty-choice-and-security-in-the-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ポートフォリオを発表</span></a><span style=\"vertical-align: baseline;\">しました。さらに 2 月には、このポートフォリオを支える</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/delivering-a-secure-open-sovereign-digital-world?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コミットメントを策定し</span></a><span style=\"vertical-align: baseline;\">、地域への投資、運用の継続性、お客様によるデータの管理、オープン テクノロジーを対象としました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回、Google はこれらの取り組みをさらに強化します。パートナーが運用するクラウドである Google Cloud Dedicated に Gemini モデルが導入されます。これにより、Model Garden ですでに提供されているオープンモデルにとどまらず、モデルの選択肢が広がることになります。また、暗号鍵の管理とコンプライアンス対応に向けた新機能や、ヨーロッパのソフトウェア企業やスタートアップとの新たな取り組みについても発表しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Google AI をソブリン ポートフォリオ全体に導入</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ソブリン（主権、管理性）のあり方は一律ではないため、</span><a href=\"https://cloud.google.com/sovereign-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google の Sovereign Cloud</span></a><span style=\"vertical-align: baseline;\"> では、ワークロードを実行する 3 つの方法を提供しています。1 つ目は Google Cloud Data Boundary であり、Google のパブリック クラウドにデータ所在地、アクセス、暗号化の制御を適用します。2 つ目のオプションは Google Cloud Dedicated です。これは、独立した現地パートナーが隔離されたインフラストラクチャ上で運用します。そして 3 つ目が Google Distributed Cloud であり、接続型または完全エアギャップ型のお客様独自のデータセンターで実行されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">一部の Gemini モデルはすでに Google Cloud で利用可能であり、EU 域内を含む対象リージョンにおいて顧客データの ML 処理を実行することを</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/data-residency\"><span style=\"text-decoration: underline; vertical-align: baseline;\">確約</span></a><span style=\"vertical-align: baseline;\">しています。また、Google Distributed Cloud でも</span><a href=\"https://cloud.google.com/blog/ja/topics/hybrid-cloud/gemini-is-now-available-anywhere?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">利用できます</span></a><span style=\"vertical-align: baseline;\">。そして、今回発表された Google Cloud Dedicated への Gemini の導入により、ローカル運用のクラウドを必要とする組織でも Gemini を利用できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">多くのチームは、オープンモデルや、独自にチューニングしたモデルの利用も求めています。フランスでは、S3NS が Google Cloud Dedicated を基盤とするクラウド PREMI3NS において、マネージドのモデル提供と推論を</span><a href=\"https://www.s3ns.io/en/news/ai-PREMI3NS-model\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一般提供</span></a><span style=\"vertical-align: baseline;\">として開始しました。各チームは、Mistral や Google などのプロバイダが提供するオープンモデルを Model Garden からデプロイしたり、独自のモデルを導入したりできます。S3NS が環境を運用し、デプロイされたモデルとプロンプトが S3NS の管理下にある PREMI3NS 環境内に留まるように設計されています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">お客様がアクセスと鍵を管理</strong></h4>\n<p><span style=\"vertical-align: baseline;\">多くのヨーロッパの組織にとって、データアクセス、暗号鍵へのアクセス、サービスへのアクセスが主権体制の基準となります。Google のパブリック クラウドでは、</span><a href=\"https://cloud.google.com/assured-workloads/access-transparency/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アクセスの透明性</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/assured-workloads/access-approval/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アクセス承認</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/assured-workloads/key-access-justifications/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Key Access Justifications</span></a><span style=\"vertical-align: baseline;\"> を使用して Google の担当者がいつ、なぜデータにアクセスしたかを確認し、そのアクセスを承認または拒否できます。より詳細な制御が必要な場合は、</span><a href=\"https://cloud.google.com/kms/docs/ekm\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud の外部</span></a><span style=\"vertical-align: baseline;\">で暗号鍵を保持することで、理由を問わずデータへのアクセスを拒否できます。こうした制御を組み合わせることで、お客様自身があらゆるデータへのアクセスを制御できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud の外部で鍵を保持する場合、鍵のリクエストごとに外部システムへの通信が発生するため、レイテンシと可用性のリスクが増大する可能性があります。現在プレビュー版として提供されている Confidential External Key Management（cEKM）は、このトレードオフを解消するように設計されています。お客様またはお客様が選択した現地パートナーが、Google Cloud の外部でルートキーを保持し、アクセスを制御します。一方、鍵の操作は、ハードウェアで証明された </span><a href=\"https://cloud.google.com/confidential-computing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> 環境内で実行されます。この環境は、AI をはじめとするデータ集約型のワークロードで求められる低レイテンシと信頼性を両立できるように設計されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">信頼できる現地パートナーに、Google インフラストラクチャの外部で鍵を保持するよう依頼することもできます。スペインの Telefónica との新たなパートナーシップ（現在はプレビュー版）により、フランス、ドイツ、イタリア、スペインにおける既存のヨーロッパのパートナーシップに加えて、お客様の選択肢が広がります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">お客様が規制当局にコンプライアンスを実証できるよう支援</strong></h4>\n<p><span style=\"vertical-align: baseline;\">主権管理と要件の監査は困難なだけでなく、多くの場合、エンジニアリング面の負担も大きくなります。監査を円滑に進めるために、Google は</span><a href=\"https://cloud.google.com/blog/products/identity-security/inside-the-new-data-boundary-experience\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Boundary</span></a><span style=\"vertical-align: baseline;\"> フレームワークを導入しています。このフレームワークは、地域や国ごとの規制要件を、強制適用される監査可能な管理策にマッピングします。</span><a href=\"https://docs.cloud.google.com/assured-workloads/docs/control-packages/switzerland-data-boundary\"><span style=\"text-decoration: underline; vertical-align: baseline;\">スイス</span></a><span style=\"vertical-align: baseline;\">向けのフレームワークは提供開始されました。EU のデジタル オペレーショナル レジリエンス法（DORA）に対応したフレームワークも金融サービス組織向けに計画されています。</span></p>\n<p><a href=\"https://cloud.google.com/products/audit-manager/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Audit Manager</span></a><span style=\"vertical-align: baseline;\"> を使用すると、お客様は既製のフレームワークをベースに、それを自社のポリシーに適合させ、継続的かつ機械で読み取り可能な証拠を監査者に提供できます。これは、顧客データを指定された境界内に保持するように設計されています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ヨーロッパの通信事業者、ソフトウェア ベンダー、スタートアップとの連携</strong></h4>\n<p><span style=\"vertical-align: baseline;\">主権は、テクノロジーを運用する主体や、生み出された価値が地域に留まるかどうかにも左右されます。そのため Google は、クラウドを運用する企業、クラウド用のソフトウェアを構築する企業、そして次世代を担うスタートアップなど、あらゆる立場のヨーロッパ企業と連携しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Dedicated は、現地パートナーが環境を制御し、例外的な状況においてはソフトウェア アップデートをブロックできるように設計されています。また、Dedicated インスタンスと Google の接続が切断されるという万が一の事態が発生した場合でも、最大 12 か月間運用を継続できます。こうした設計上の選択は、2 月に発表した</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/delivering-a-secure-open-sovereign-digital-world?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コミットメント</span></a><span style=\"vertical-align: baseline;\">に沿ったものです。このコミットメントには、Google がいずれかの国から提供される Google Cloud の運用の提供を停止または終了するよう政府から命令を受けた場合、利用可能なあらゆる法的手段を講じて、そのような命令を制限、修正、または異議を申し立てるよう努めるという内容も含まれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">フランスでは、S3NS 社の PREMI3NS が、フランスの国家サイバーセキュリティ機関である ANSSI から SecNumCloud 3.2 認証を取得しています。また、Thales 社とともに Google Cloud Dedicated をドイツに拡張し（現在はプレビュー版）、EU 全域で主権ハイパースケール機能を実現します。</span></p>\n<p><span style=\"vertical-align: baseline;\">規制対象のワークロードは、チームが利用しているセキュリティ、ID、モニタリング ツールが主権環境で利用できないために導入が滞ることが少なくありません。現在は Memority や Tsuga などのヨーロッパのプロバイダをはじめ、</span><a href=\"https://cloud.google.com/blog/products/identity-security/how-isvs-are-unlocking-european-workloads-on-google-cloud-dedicated\"><span style=\"text-decoration: underline; vertical-align: baseline;\">10 社以上のソフトウェア ベンダーが、Google Cloud Dedicated 上で自社製品の検証を完了</span></a><span style=\"vertical-align: baseline;\">しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、AI が生み出す新しい企業やスキルがヨーロッパに根付くよう支援したいと考えています。新設の </span><a href=\"https://startup.google.com/programs/accelerator/sovereign-ai/europe-israel/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator: Sovereign AI</span></a><span style=\"vertical-align: baseline;\"> は、規制対象セクターのスタートアップに対して Google エンジニアによるサポート、メンターシップ、地域のクラウド プロバイダへのアクセスを提供する、エクイティフリーのプログラムです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">今後の展開</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、2025 年に設定した戦略を継続的に強化しています。その戦略とは、お客様が検証できる制御、クラウドでの運用方法や環境を運用する主体の選択、デプロイの形態にかかわらず高度な AI へのアクセスを提供することです。Google は、パートナーが運用する環境やオンプレミス環境に AI プラットフォームをさらに導入し、より多くのサービスにアクセス制御や鍵管理を拡張し、より多くの規制に対応したフレームワークを追加していきます。これは、これらのサービスを運用するヨーロッパのパートナーと協力して取り組んでいきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳しくは、</span><a href=\"https://cloud.google.com/sovereign-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google の Sovereign Cloud</span></a><span style=\"vertical-align: baseline;\"> をご覧いただくか、</span><a href=\"https://cloud.google.com/contact\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ソブリンのスペシャリストにご相談ください</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">規制対象およびソブリン クラウド担当 VP 兼 GM、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jai Haridas</strong></p></div>"
  "1b537bf0bcc83b19d5f58d4fb11a2c47":
    "id": "1b537bf0bcc83b19d5f58d4fb11a2c47"
    "title": "ヨーロッパで、ヨーロッパとともに創るソブリン AI: 新しいスタートアップ アクセラレータ"
    "link": "https://cloud.google.com/blog/ja/topics/startups/sovereign-ai-on-your-terms-our-new-startup-accelerator-is-open/"
    "published": "2026-11-25 10:00:00"
    "fetched": "2026-11-25 18:33:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 18 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/startups/sovereign-ai-on-your-terms-our-new-startup-accelerator-is-open?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"http://startup.google.com/programs/accelerator/sovereign-ai/europe-israel/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator: ソブリン AI</span></a><span style=\"vertical-align: baseline;\"> の参加者募集を開始する運びとなりました。ヨーロッパとイスラエルで展開されるこのイニシアチブは、ヨーロッパの規制環境に対応する最先端 AI ソリューションを構築中のスタートアップを支援するものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI は、</span><a href=\"https://cms.implementconsultinggroup.com/media/uploads/articles/2024/The-economic-opportunity-of-generative-AI-in-the-EU/The-economic-opportunity-of-AI-in-the-EU.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ヨーロッパに推定 1 兆 2,000 億ユーロの経済的機会</span></a><span style=\"vertical-align: baseline;\">をもたらすと試算されています。この可能性を実現するには、ヨーロッパの企業や公共機関は高度な AI を導入するだけでなく、重要なデータ ガバナンス要件も満たす必要があります。これには、</span><a href=\"https://artificialintelligenceact.eu/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">EU AI 規則</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.nis-2-directive.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NIS2</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.eiopa.europa.eu/digital-operational-resilience-act-dora_en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DORA</span></a><span style=\"vertical-align: baseline;\">、さらには </span><a href=\"https://www.lsti-certification.fr/en/Company-offers/Cybersecurity/SecNumCloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SecNumCloud</span></a><span style=\"vertical-align: baseline;\"> や </span><a href=\"https://www.bsi.bund.de/EN/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/Kriterienkatalog-C5/kriterienkatalog-c5_node.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BSI のクラウド セキュリティおよび主権原則</span></a><span style=\"vertical-align: baseline;\">といった各国のフレームワークも含まれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google が目指すのは、志のある創業者がヨーロッパで、そしてヨーロッパ主導のソリューションを使用して事業を展開することです。スタートアップにとってのデジタル主権とは、質の劣るツールで妥協することでも、単一の硬直したスタックに縛り付けられることでもありません。それは、ヨーロッパのテクノロジー エコシステムと共同開発を行うことで、創業者が初日から自分たちの主導権で事業をスケールできるようにすることを意味します。たとえば、最先端の Gemini モデル、Gemma や Mistral などのオープンウェイト モデル、さらにはヨーロッパ現地のソブリン パートナーが提供する検証可能なデータ所在地や暗号化管理を自由に組み合わせることが可能です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エクイティフリーのこのプログラムは、15 週間にわたるハイブリッド形式で実施され、オンラインおよび対面セッションを通じて、創業者と Google エンジニア、規制の専門家、地域のパートナーを結び付けます。選定されたスタートアップは、アーキテクチャに関する実践的なメンターシップ、Google Cloud エンジニアとの 1 対 1 の個別サポート、EU AI 規則の規制サンドボックスに備えるためのアドバイザリー サポートを受けることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">参加者は、Google Cloud の階層型ソブリン ポートフォリオ全体へのデプロイに向け、直接的な支援を受けられます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ソブリン クラウド インフラストラクチャ</strong><span style=\"vertical-align: baseline;\">: リージョン単位のデータ管理や外部鍵管理（データ境界）から、パートナー運営のクラウド（フランスの S3NS やドイツの Thales など）、さらには完全にエアギャップのある Google Distributed Cloud 環境まで幅広く対応。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">監査可能なプライベート AI</strong><span style=\"vertical-align: baseline;\">: Gemma ファミリー（MedGemma を含む）などのオープン ウェイト モデルをソブリン環境でファインチューニングしてデプロイし、データと運用を検証可能な形で制御できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エコシステムと投資家へのアクセス</strong><span style=\"vertical-align: baseline;\">: ヨーロッパのソブリン クラウド事業者、システム インテグレーター、機関投資家と直接連携し、エンタープライズ向けセールスサイクルを短縮します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">対象者</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ヨーロッパまたはイスラエルに本社を置き、シード後期からシリーズ A 以降のステージにある、高い成長実績を備えたスタートアップから、少人数制の手厚いコホートを選定します。機密性の高い規制対象ワークロードの処理に AI を活用している企業が対象です。</span></p>\n<p><span style=\"vertical-align: baseline;\">特に、以下の分野に注力しているスタートアップを募集しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">政府および公共サービス テクノロジー:</strong><span style=\"vertical-align: baseline;\"> ソブリン ドキュメント処理、市民サービス ポータル、自治体運営、スマート ユーティリティ、市民緊急グリッドなど（防衛用途は除く）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ヘルスケアとライフ サイエンス:</strong><span style=\"vertical-align: baseline;\"> 臨床試験分析、電子医療記録（EHR / EHDS）、診断コパイロット、病院運営など、GDPR と</span><a href=\"https://health.ec.europa.eu/ehealth-digital-health-and-care/european-health-data-space-regulation-ehds_en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">欧州健康データ空間</span></a><span style=\"vertical-align: baseline;\">のコンプライアンス要件を満たすもの。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">規制対象の金融サービス:</strong><span style=\"vertical-align: baseline;\"> 信用リスク モデリング、マネー ロンダリング防止パイプライン、不正行為検出、与信審査パイプライン、請求処理など。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サイバーセキュリティとデータ信頼性:</strong><span style=\"vertical-align: baseline;\"> 企業向けの脅威の検出と対応、サプライ チェーン セキュリティ、脆弱性スキャン、民間 IT インフラストラクチャの保護など。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ヨーロッパのデジタル自律性を推進するソブリン AI を構築している創業者の皆様、その効果をさらに拡大できるよう、ぜひ Google の支援をご活用ください。</span><a href=\"http://startup.google.com/programs/accelerator/sovereign-ai/europe-israel/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator のページ</span></a><span style=\"vertical-align: baseline;\">からお申し込みいただけます。お申し込みの締め切りは 2027 年 1 月 15 日です。</span></p>\n<p><span style=\"vertical-align: baseline;\">本アクセラレータ プログラムがプロダクトの飛躍的な進化にどう貢献したか、過去の参加者の声をご紹介します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Denise_Williams_Managing_Director_Dysp.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「ソブリン環境や規制環境では、技術が機能することを証明するだけでは不十分です。こうした制約を熟知した Google Cloud のエンジニアに直接相談できる環境は、創業間もない企業にとって膨大な時間の節約につながります。」</span></p>\n<p><span style=\"vertical-align: baseline;\">Dysplasia、マネージング ディレクター、Denise Williams 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_79uocp3.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「規制対象市場やソブリン市場向けにディープテックを開発する場合、自力だけで閉じこもって構築する余裕はありません。アクセラレータを通じて得られる高度な技術的知見、メンターシップ、そして検証機会は、何年分もの試行錯誤を一気にショートカットしてくれます。」</span></p>\n<p><span style=\"vertical-align: baseline;\">Malloc、共同創業者兼 CEO、Maria Terzi 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_1FPVKSW.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「規制の厳しい分野で事業を構築するには、隠れたハードルをあらかじめ指摘してくれる専門家のガイダンスが必要です。このコホートに参加することで、厳格なコンプライアンスを最大の競争優位性に変えるために欠かせない、明確な技術的指針と専門家への相談機会が得られます。」</span></p>\n<p><span style=\"vertical-align: baseline;\">Good With、共同創業者兼 CEO、Gabriela Isas 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_-_Comply_Stream.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「規制のある市場では、お客様はデータの保存場所や AI が意思決定を行うプロセスを尋ねてきます。アクセラレータ プログラムは、開発の初日からアーキテクチャにそれらの答えを組み込むのに役立ちます。」</span></p>\n<p><span style=\"vertical-align: baseline;\">ComplyStream、創業者兼最高経営責任者、Kartik Dabbiru 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5_aG2xAFA.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「規制のある市場で事業を展開しているからといって、最先端の AI を使えないわけではありません。要は、開発の初日から自社でコントロールできるよう設計しておけばよいのです。アクセラレータ プログラムは、そのバランスを効果的に取るのに役立ちました。」</span></p>\n<p><span style=\"vertical-align: baseline;\">Connect by Circular-Lab、プロダクト ディレクター、Juan Mir de Leonardo 氏</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud ヨーロッパ、中東、アフリカ、政府関連業務および公共政策責任者</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Giorgia Abeltino</strong></p></div>"
