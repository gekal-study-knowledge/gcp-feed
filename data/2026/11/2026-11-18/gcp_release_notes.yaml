    "summary": "<h2 class=\"release-note-product-title\">Application Integration</h2>\n<h3>Security</h3>\n<p>A Deserialization of Untrusted Data vulnerability was discovered\nin integration execution parameter handling in Application Integration\nversions prior to September 22, 2026.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/application-integration/docs/security-bulletins#gcp-2026-083\">GCP-2026-083</a>\nsecurity bulletin.</p>"
