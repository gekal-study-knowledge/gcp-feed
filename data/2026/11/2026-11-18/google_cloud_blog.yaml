  "3f165581cfc2a343cf029cdaa39b95cf":
    "id": "3f165581cfc2a343cf029cdaa39b95cf"
    "title": "Simplifying multicloud networking to Azure with partner Cross-Cloud Interconnect"
    "link": "https://cloud.google.com/blog/products/networking/cross-cloud-interconnect-for-microsoft-azure/"
    "published": "2026-11-18 03:35:00"
    "fetched": "2026-11-18 08:44:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As AI changes how businesses build and run applications, more enterprises are spreading their models, data and applications across multiple clouds. To make that work, they need fast, private connections between those environments. Historically, connecting multiple clouds has meant ordering physical connections from each provider, setting up networking on both sides, and coordinating across multiple teams. That process could take weeks or even months. </span></p>\n<p><span style=\"vertical-align: baseline;\">We wanted to make that much simpler. Today, we're extending partner Cross-Cloud Interconnect to Microsoft Azure, now available in preview. The service is jointly supported by Google Cloud and Microsoft, and gives you a private, high-bandwidth connection between your Google Cloud and Azure environments that’s set up programmatically in minutes, with no physical infrastructure to manage.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Google Cloud partner Cross-Cloud Interconnect simplifies multi-cloud networking with a direct cloud-native approach. By removing traditional infrastructure complexity, it provides a reliable, scalable foundation for connecting workloads across different cloud environments.\"</span><span style=\"vertical-align: baseline;\"> - Ralf Huebenthal, Global Head of IT &amp; Digital Platforms, Nestlé </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“Walmart runs a seamless platform across multiple cloud providers to accelerate innovations. We partner with Google Cloud to leverage their global network for hybrid and multicloud networking. With Cross-Cloud Interconnect, we were able to simplify connectivity between cloud providers, shorten time to production, and reduce overall costs.” </span><span style=\"vertical-align: baseline;\">- Gerald Bothello, Group Director of Software Engineering, Walmart</span><span style=\"font-style: italic; vertical-align: baseline;\"> </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_JZez7Jh.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect benefits</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">On-demand connectivity in minutes, not weeks. </strong><span style=\"vertical-align: baseline;\">Set up your connection from the Google Cloud console or API, pick the bandwidth you need, and both clouds handle the rest — no hardware to order, no manual network configuration, and no back and forth between providers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Built-in reliability. </strong><span style=\"vertical-align: baseline;\">Your connection runs across physically separate locations for redundancy. Google Cloud and Azure jointly monitor the connection and handle maintenance and recovery for you.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Private and secure. </strong><span style=\"vertical-align: baseline;\">Your traffic stays off the public internet, and is automatically encrypted between the Google Cloud and Azure edge routers,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">with no customer configuration required.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Predictable pricing.</strong><span style=\"vertical-align: baseline;\"> You pay a fixed price for the connection's bandwidth, so your Google Cloud costs are easy to plan and manage.</span></p>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Customers are building applications, data platforms and AI across more than one cloud, and they want the network between those clouds to just work. Azure Multicloud Interconnect with Google Cloud gives customers a private, managed path between Azure and Google Cloud, and we're excited to work with Google Cloud to bring it to customers in public preview.\" -</span><span style=\"vertical-align: baseline;\"> Sudha Mahajan, Partner, Product Management, Azure Networking, Microsoft</span></p>\n<p><span style=\"vertical-align: baseline;\">Our Cross-Cloud Interconnect ecosystem continues to expand:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect for Microsoft Azure is available in preview today in us-east4 (N. Virginia), us-west2 (Los Angeles), and europe-west3 (Frankfurt), alongside the generally available </span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-csp-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-oci-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OCI</span></a><span style=\"vertical-align: baseline;\"> offerings. We'll add more regions as the Azure offering moves to general availability.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/products/networking/partner-cross-cloud-interconnect-for-last-mile-delivered-by-lumen/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Partner Cross-Cloud Interconnect for last mile with Lumen</span></a><span style=\"vertical-align: baseline;\"> is available in preview, for customers connecting their private clouds, on-premises sites, and neocloud environments to Google Cloud.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect is built on an</span> <a href=\"https://github.com/aws/Interconnect\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open specification</span></a><span style=\"vertical-align: baseline;\"> for network interoperability. Google Cloud </span><a href=\"https://cloud.google.com/blog/products/networking/aws-and-google-cloud-collaborate-on-multicloud-networking?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">collaborated</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/products/networking/aws-and-google-cloud-collaborate-on-multicloud-networking?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">with AWS</span></a><span style=\"vertical-align: baseline;\"> and published it last year, and any provider can adopt it.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">To learn more, visit the partner Cross-Cloud Interconnect </span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-csp-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">, read Microsoft's </span><a href=\"https://aka.ms/AMIIgnite_Blog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">announcement</span></a><span style=\"vertical-align: baseline;\">, or contact your Google Cloud account team.</span></p></div>"
  "24dcee9c20ffbf9867b0f3828682fbe0":
    "id": "24dcee9c20ffbf9867b0f3828682fbe0"
    "title": "Google Cloud is a Leader in the 2026 Gartner Magic Quadrant for AI Application Development Platforms"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-is-a-leader-in-the-2026-gartner-magic-quadrant/"
    "published": "2026-11-18 02:00:00"
    "fetched": "2026-11-18 08:44:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For the third time in a row, Google Cloud is recognized as a Leader in the </span><strong style=\"vertical-align: baseline;\">2026 Gartner Magic Quadrant for AI Application Development Platforms</strong><span style=\"vertical-align: baseline;\">, positioned highest overall on the Ability to Execute axis.</span><sup><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: super;\">1</span></span></sup></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_sot3w8r.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">These days, it’s very clear to us that organizations are looking for AI to handle actual day-to-day work, stay strictly within compliance guardrails, and deliver measurable ROI. In the last year, nearly 500 Google Cloud customers each processed </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">more than one trillion tokens</span></a><span style=\"vertical-align: baseline;\">. And a lot of that volume came from heavily regulated sectors like global banking, healthcare, and telecommunications.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our customers choose Gemini because it delivers an open enterprise platform built for this level of production scale, by:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Unifying the agent experience across everyday workflows</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Providing unrestricted model choice without vendor lock-in</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Practicing cost discipline before bills spiral, not after</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Governing agents through a single, centralized control plane</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">1. Gemini delivers one universal agent across the enterprise</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In October, we announced a unified Gemini experience. The same Gemini you collaborate with every day is now your enterprise agent to get real work done. Instead of navigating disconnected developer consoles, consumer tools, and workplace add-ons, Gemini meets work wherever it already happens – collaborating natively inside surfaces like Google Workspace, Microsoft 365, internal chats, web, and mobile.</span></p>\n<p><span style=\"vertical-align: baseline;\">You give Gemini high-level business objectives rather than step-by-step instructions, and it orchestrates the necessary tools, context, and coworker agents to deliver a finished result. As employees engage it, the agent retains persistent memory, understands your specific business language, and respects enterprise permissions across every device. When a team automates a complex procedure, they can package it into a shared skill, turning one group’s procedural knowledge into a capability anyone across the organization can use.</span></p>\n<p><span style=\"vertical-align: baseline;\">That shared foundation is what transforms agent building from an isolated engineering backlog into an organization-wide capability. At </span><strong style=\"vertical-align: baseline;\">Dojo</strong><span style=\"vertical-align: baseline;\">, one of UK’s leading payment providers, non-technical teams used this exact environment to stand up over 600 custom agents in just two months:</span></p>\n<p><span style=\"vertical-align: baseline;\">“When you can use natural language, anyone from HR to sales can turn their unique business experience into a custom AI agent in minutes. In two months, we created over 600 agents. The majority were built by our frontline business teams right inside Gemini, leaving our developers to focus on more complex challenges.” – Robert Howes, Chief Technology Officer, Dojo.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Cvo0XV5Z47c\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Dojo fuels an AI-native future, delivers 680+ agents in two months with Gemini</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Dojo fuels an AI-native future, delivers 680+ agents in two months with Gemini</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Cvo0XV5Z47c\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">2. We bring the leading frontier models under one roof</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud is now the only hyperscale cloud provider offering access to all three leading frontier model families, from Google, Anthropic and OpenAI, on a unified enterprise platform – and across every surface, from developer tooling in Antigravity to everyday productivity in Gemini for web, mobile, and desktop. Through the model garden, organizations can access over 200 models, drawing down existing cloud commitments on a single invoice without having to negotiate separate contracts.</span></p>\n<p><span style=\"vertical-align: baseline;\">At the same time, we are deeply proud of the pace of innovation coming out of Google DeepMind. Over the past month alone, we’ve rolled out a full generation of specialized models: </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-argon/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</strong></a><span style=\"vertical-align: baseline;\"> for strong performance across complex software engineering, law, finance, and cyber defense; </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Carbon</strong></a><span style=\"vertical-align: baseline;\"> for frontier performance in cybersecurity capabilities and long-horizon agentic workflows; and now </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Hydrogen</strong></a><span style=\"vertical-align: baseline;\">, bringing cutting-edge intelligence with speed and efficiency to everyday coding and agentic execution.</span></p>\n<p><span style=\"vertical-align: baseline;\">By treating models as a diversified portfolio, we give our customers the freedom to optimize for speed, precision, and cost across every task. For </span><strong style=\"vertical-align: baseline;\">PayPal</strong><span style=\"vertical-align: baseline;\">, this flexibility is central to their strategy:</span></p>\n<p><span style=\"vertical-align: baseline;\">“We built a unified LLM stack. That meant we ran our open source models on top of our inferencing stack on GKE, and we ran our close-sourced models on top of the Gemini platform. Developers get choice – Claude, Gemini, Open Source – through one consistent governed access layer. That’s why we love the model garden.” — Srinivasan Manoharan, Director of AI/ML Platform, PayPal.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=2oStsmDeYv8\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">PayPal paves the way for the future of agentic commerce with Google Cloud</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">PayPal paves the way for the future of agentic commerce with Google Cloud</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=2oStsmDeYv8\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">3. Optimizing spend at every layer of the stack</strong></h3>\n<p><span style=\"vertical-align: baseline;\">A recurring concern we hear from enterprise leaders is the unpredictability of AI billing. When teams start scaling agents, pay-as-you-go pricing can feel like an open tab with no ceiling. That is why we optimize cost across every layer of the stack – co-designing custom TPU silicon, cluster networking, and foundation models as a single system to drive down baseline costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">At the execution level, we give finance and engineering teams the right levers to innovate without risking their margins. Gemini dynamically matches every task to the most cost-effective model, handling high-volume tasks with efficient models, only escalating to frontier reasoning models for complex problem-solving. Paired with native FinOps controls – including project-level monthly spend caps, anomaly detection, and Flexible Savings Plans – leaders get hard financial boundaries and clear visibility.</span></p>\n<p><span style=\"vertical-align: baseline;\">For companies processing massive volumes of data, this approach makes all the difference. At </span><strong style=\"vertical-align: baseline;\">Imgix</strong><span style=\"vertical-align: baseline;\">, the engineering team prioritized this architectural discipline as they scaled visual processing:</span></p>\n<p><span style=\"vertical-align: baseline;\">“If we're using the most expensive model every single time, that's going to be a big bill for our customers. So we use a cheaper model like Gemini Flash to figure out, ‘Does this image or video even need this AI feature?’ before routing further down the pipeline.” – Alfonso Acosta, Head of Engineering, Imgix.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=yPlhUlnf4dc\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Imgix processes 8 billion daily media requests 50% faster with Google Cloud</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Imgix processes 8 billion daily media requests 50% faster with Google Cloud</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=yPlhUlnf4dc\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">4. A single control plane for governed enterprise context</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When organizations empower employees to build and deploy agents at scale, governance cannot be an afterthought. It must be an inherent part of the environment in which those agents operate. With Gemini, every agent is assigned a dedicated Agent Identity, ensuring that all database queries, tool actions, and state transitions generate an auditable record tied directly to authorized roles. Execution occurs inside isolated runtime sandboxes, where Agent Gateway and Model Armor automatically scrub sensitive data, block policy violations, and enforce corporate compliance in real time.</span></p>\n<p><span style=\"vertical-align: baseline;\">That same control plane extends to how agents interact with corporate intelligence. Rather than requiring organizations to move, replicate, or duplicate sensitive records into yet another external repository, Gemini connects directly to live enterprise systems. Agents ground their reasoning in data across BigQuery, Cloud Storage, SAP, Salesforce, S3, and Azure – inheriting existing user access controls and keeping proprietary data strictly within its original perimeter. </span></p>\n<p><span style=\"vertical-align: baseline;\">Governed context and centralized control are what make company-wide agent adoption possible. </span><strong style=\"vertical-align: baseline;\">UKG</strong><span style=\"vertical-align: baseline;\"> relied on Gemini’s security, governance, and evaluation controls to skip building that foundation from scratch:</span></p>\n<p><span style=\"vertical-align: baseline;\">“The Gemini platform, it’s solving some of these key problems that we already were trying to solve — from hosting agents to securing them to the governance around them, evals to make sure they’re behaving correctly. I can just use these things out of the box and get back to creating value.” – Thomas Newton, Head of Cloud and Engineering, UKG.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Xo388qKE7mM\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">UKG builds a Bryter future for tens of millions of employees with Google Cloud AI</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">UKG builds a Bryter future for tens of millions of employees with Google Cloud AI</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Xo388qKE7mM\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Gemini is built for the way you work</span></h3>\n<p><span style=\"vertical-align: baseline;\">Being recognized by Gartner as a Leader positioned highest in Ability to Execute reflects our commitment to meeting enterprises where they operate today. By combining frontier intelligence, universal agent orchestration across everyday tools, predictable economics, and enterprise governance, Gemini gives developers and business leaders the foundation to build with velocity and operate with confidence.</span></p>\n<p><span style=\"vertical-align: baseline;\"><a href=\"https://cloud.google.com/resources/content/gartneraiapplicationanddevelopment\">Download</a> the report today.</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">1. Gartner® Magic Quadrant™ for AI Application Development Platforms  - Cary Pillers, Keith Holloway, Luke Parker, Pamela Katz, November 3, 2026<br /></span><span style=\"font-style: italic; vertical-align: baseline;\">Gartner does not endorse any company, vendor, product or service depicted in its publications, and does not advise technology users to select only those vendors with the highest ratings or other designation. Gartner publications consist of the opinions of Gartner’s business and technology insights organization and should not be construed as statements of fact. Gartner disclaims all warranties, expressed or implied, with respect to this publication, including any warranties of merchantability for a particular purpose. <br /></span><span style=\"font-style: italic; vertical-align: baseline;\">Gartner and Magic Quadrant are trademarks of Gartner, Inc., and/or its affiliates. <br /></span><span style=\"font-style: italic; vertical-align: baseline;\">This graphic was published by Gartner, Inc. as part of a larger research document and should be evaluated in the context of the entire document. The Gartner document is available upon request from Google. </span></sup></p></div>"
  "efda0956b287b50259e338e17e989e85":
    "id": "efda0956b287b50259e338e17e989e85"
    "title": "Congratulations to our 2026 Google Cloud Partner All-stars"
    "link": "https://cloud.google.com/blog/topics/partners/2026-google-cloud-partner-all-stars-winners/"
    "published": "2026-11-18 02:00:00"
    "fetched": "2026-11-18 08:44:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The Google Cloud partner ecosystem plays an essential role in driving customer success. As we enter a transformative new era, our partners are instrumental in helping move AI from early pilots into true production-grade deployment. Closing that gap takes far more than technology alone. It requires skilled practitioners who can rethink workflows, navigate organizational change, and deliver impact. Operating across every industry and region, the Google Cloud partner ecosystem is driving this transformation forward. </span></p>\n<p><span style=\"vertical-align: baseline;\">At the end of each year, we are honored to celebrate our Partner All-stars who consistently go above and beyond for our customers. The Google Cloud Partner All-stars program recognizes outstanding talent across five distinct disciplines:</span></p>\n<p><strong style=\"vertical-align: baseline;\">AI Leadership (New for 2026)<br /></strong><span style=\"vertical-align: baseline;\">Our AI Leadership All-stars are the trusted experts leading the transition to an AI-driven workplace. They help businesses completely rethink their operations from top to bottom. By guiding enterprise-wide transformations, they make it easier for organizations to adapt, innovate, and successfully adopt these new tools.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Sales<br /></strong><span style=\"vertical-align: baseline;\">This year’s Sales All-stars are at the cutting edge of customer change. These individuals embody Google Cloud’s commitment to the customer transformation journey–consistently meeting and exceeding sales targets and delivering exceptional end-to-end customer experiences. They prioritize long-term customer relationships over short-term sales, helping deliver return on investment.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Marketing<br /></strong><span style=\"vertical-align: baseline;\">Our Marketing All-stars are the individuals driving strategic programs and key events that address our customer’s most pressing concerns and highest priorities. They work with cross-functional teams to ensure the success of campaigns and events. They take a data-driven approach to marketing, investing resources and time in programs that drive the biggest impact. These All-stars are curious and innovative, consistently exploring areas of opportunity to improve future work.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Solutions Engineering<br /></strong><span style=\"vertical-align: baseline;\">This year’s Solutions Engineering All-stars have delivered superior customer experiences throughout 2026. In order to meet complex customer needs in innovative ways, these individuals take full responsibility for end-to-end solutioning and collaborate across product areas. These experts maintain this high standard while continuously sharpening their professional skills and holding active Google technical certifications.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Delivery Excellence<br /></strong><span style=\"vertical-align: baseline;\">Delivery Excellence All-stars are the highest-performing technical practitioners in Google Cloud's Delivery Readiness program. Proving their expertise in the field, these individuals drive successful customer projects while completing advanced delivery skill badges. By embracing Google Cloud’s rapid-delivery methodologies, they accelerate secure migrations, execute 4-to-6-week iterative AI sprints, and ensure verified production deployments.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Celebrating Excellence in 2026<br /></strong><span style=\"vertical-align: baseline;\">Our ecosystem is made up of exceptional organizations full of extraordinary individuals. On behalf of the entire Google Cloud organization, we extend our sincere congratulations and our thanks to the 2026 Partner All-stars. Your technical expertise, strategic leadership, and commitment to customer outcomes set the standard across our global partner network.</span></p>\n<p><span style=\"vertical-align: baseline;\">To discover this year’s honorees, search #PartnerAllstars on social media. Please join us in congratulating these leaders, who are shaping the future of enterprise cloud and AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">Learn more about </span><a href=\"https://cloud.google.com/partners\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Partners</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "25ebc93e99c664482362266e207432e4":
    "id": "25ebc93e99c664482362266e207432e4"
    "title": "The visual evolution of Looker: Modern design for enterprise data storytelling"
    "link": "https://cloud.google.com/blog/products/business-intelligence/modern-data-visualizations-and-custom-charts-in-looker/"
    "published": "2026-11-18 02:00:00"
    "fetched": "2026-11-18 08:44:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Over the past year, we’ve focused on making </span><a href=\"http://cloud.google.com/looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker</span></a><span style=\"vertical-align: baseline;\"> easier to use for every business user. We started by redesigning the exploration experience with </span><a href=\"https://cloud.google.com/blog/products/business-intelligence/looker-explore-ai-and-interface-updates\"><span style=\"text-decoration: underline; vertical-align: baseline;\">drag-and-drop workspaces</span></a><span style=\"vertical-align: baseline;\">, streamlined field pickers, and conversational analytics to make it easier to start from a blank canvas.</span></p>\n<p><span style=\"vertical-align: baseline;\">The next step is elevating how your data is seen and interpreted.</span></p>\n<p><span style=\"vertical-align: baseline;\">This November, we are rolling out a major update for Looker’s visual language that brings new native chart types and dashboard controls to your dashboards, Explores, and feeds into your generative </span><a href=\"https://cloud.google.com/blog/products/business-intelligence/introducing-looker-data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Apps</span></a><span style=\"vertical-align: baseline;\">. Everything runs on </span><a href=\"https://cloud.google.com/blog/products/business-intelligence/lookml-metadata-indexing-in-knowledge-catalog-is-now-ga\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker's governed semantic foundation and context from Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">Here's what's new:</span></p>\n<h3><strong style=\"vertical-align: baseline;\">See the state of the business at a glance</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KPI visualizations:</strong><span style=\"vertical-align: baseline;\"> Display core metrics with explicit period-over-period delta indicators, percentage trends, and directional status at a glance.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - KPI Visualization in Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_KPI_Visualization_in_Looker.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Displaying core business metrics and period-over-period trends with a KPI visualization.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Bullet charts and gauges:</strong><span style=\"vertical-align: baseline;\"> Stack actual performance against targets, quotas, and qualitative threshold bands in space-efficient layouts.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Radial Gauge Chart in Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Radial_Gauge_Chart_in_Looker.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Tracking actual performance against targets with a Radial gauge chart.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Compact numbers:</strong><span style=\"vertical-align: baseline;\"> Automatically render high-volume numbers into clean, human-readable formats ($2.4M instead of $2,400,000) that stay readable across any screen size.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Showcase the data behind the numbers</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sankey diagrams:</strong><span style=\"vertical-align: baseline;\"> Map multi-stage conversion funnels, user drop-offs, budget allocations, and material flows with native Sankey diagrams.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - Native Sankey Diagram in Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_-_Native_Sankey_Diagram_in_Looker.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Mapping multi-stage conversion flows with a native Sankey diagram.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Hierarchical tables:</strong><span style=\"vertical-align: baseline;\"> Drill into multi-level, nested data trees (such as category rollups or departmental cost centers) within a single structured tabular view.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4 - Hierarchical Table in Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_-_Hierarchical_Table_in_Looker.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Drilling into multi-level nested data within a Hierarchical table.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Histograms:</strong><span style=\"vertical-align: baseline;\"> Plot frequency distributions and spot data skew and outliers across numeric variables without writing table calculations.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5 - Histogram Chart in Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5_-_Histogram_Chart_in_Looker.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Plotting frequency distributions and outliers across numeric variables with a Histogram.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Network charts:</strong><span style=\"vertical-align: baseline;\"> Visualize interdependencies, entity relationships, and interconnected graph nodes to uncover clusters and bottlenecks.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"6 - Network Chart in Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/6_-_Network_Chart_in_Looker.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Visualizing entity relationships, clusters, and bottlenecks with a Network chart.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Modernized dashboards and in-context controls</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Keep stakeholders engaged with a boardroom-ready design and faster, more focused interactivity:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A modernized dashboard:</strong><span style=\"vertical-align: baseline;\"> More modern typography, refined spacing, cleaner table padding, and upgraded palettes give every dashboard a contemporary, polished look right out of the box.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Filters on visualizations (Preview):</strong><span style=\"vertical-align: baseline;\"> Apply and adjust filters directly on individual dashboard tiles, so viewers can isolate specific cuts of data without reloading the entire page.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"7 - Modernized Looker Dashboard with Tile-Level Filters\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/7_-_Modernized_Looker_Dashboard_with_Tile-Level_Filters.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Applying and adjusting chart-level filters directly on a modernized Looker dashboard tile.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Agent-assisted custom visualizations</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Several of the new charts in this release started as custom visualization plugins in the </span><a href=\"https://marketplace.looker.com/marketplace/directory?Type=visualizations\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Marketplace</span></a><span style=\"vertical-align: baseline;\">. Because they are now supported natively in Looker, we are retiring the associated plugins from the Marketplace. Existing dashboards that use those Marketplace plugins will continue to work.</span></p>\n<p><span style=\"vertical-align: baseline;\">While Looker’s large native library covers most everyday analytics, every industry has specialized visualization requirements. A chipmaker may need to plot defect density across a silicon wafer map, a logistics team may want to overlay warehouse floor plans onto live shipping metrics, and a finance team might ask for a multi-step variance bridge that follows internal accounting rules. These cases come up often. Previously, building one of these custom charts against Looker's </span><a href=\"https://github.com/looker-open-source/custom_visualizations_v2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Visualization API</span></a><span style=\"vertical-align: baseline;\"> meant either writing JavaScript yourself or waiting for a front-end developer to help. Looker's agentic BI changes that.</span></p>\n<p><span style=\"vertical-align: baseline;\">To support these domain-specific builds, we are launching a new custom visualization skill in the open-source </span><a href=\"https://github.com/looker-open-source/looker-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">looker-skills repository</span></a><span style=\"vertical-align: baseline;\">. This skill lets you use your AI coding agent of choice, such as Antigravity, Claude or Codex, to develop, test, iterate, and deploy your own custom visualizations. Describe the chart in natural language, and the agent writes the code against Looker's Visualization API. You can refine the design conversationally until the chart looks right, and then have the agent deploy it for you.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"8 - Custom Visualizations Generated with Looker Skill\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/8_-_Custom_Visualizations_Generated_with_L.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Sunburst, KPI radar, and calendar heatmap charts generated with the Looker custom visualization skill.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Nobody on your team needs to know JavaScript. Still, if you prefer a specific JavaScript library, you can ask for D3, Vega-Lite, ECharts, Chart.js, or React, or have the agent draw the chart from scratch in SVG. Whatever approach you pick, the chart receives the underlying data from your LookML model and inherits native drill menus, cross-filtering, and dashboard controls alongside your standard tiles.</span></p>\n<p><span style=\"vertical-align: baseline;\">This same visual system and agent-driven workflow also powers </span><a href=\"https://cloud.google.com/blog/products/business-intelligence/introducing-looker-data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps</span></a><span style=\"vertical-align: baseline;\"> ( in preview). When your use case grows beyond a single custom chart tile into a multi-step operational workflow, you can use your AI agent to assemble a full data app that shares Looker's modernized typography, palettes, and governed LookML metrics. Whether you’re adding a bespoke chart to an existing dashboard or building a standalone application, every view stays consistent and grounded in the same semantic model.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore the new native visualizations and modernized dashboard controls in your Looker environment today, or visit the </span><a href=\"https://cloud.google.com/looker/docs/creating-visualizations-and-graphs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker documentation</span></a><span style=\"vertical-align: baseline;\"> to learn more.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Try the custom visualization skill in your own Looker project by visiting the open-source </span><a href=\"https://github.com/looker-open-source/looker-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">looker-skills repository</span></a><span style=\"vertical-align: baseline;\"> on GitHub.</span></p>\n</li>\n</ol></div>"
  "7998fb888b960452eadd37937db20449":
    "id": "7998fb888b960452eadd37937db20449"
    "title": "How to Build Durable Agentic Systems with Google Antigravity: From Instructions to Loops"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/how-to-build-durable-agentic-systems-with-google-antigravity-from-instructions-to-loops/"
    "published": "2026-11-18 09:11:00"
    "fetched": "2026-11-18 14:58:37"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">I watched the discussion on agentic loops grow louder over the past few months. But for me, the reality is simpler: prompt engineering has shifted from individual tasks to systems design, and the harness around the model (not the model itself) is now my primary constraint in software engineering. In this article, I'll show you how to build and verify those harnesses so you can move from single-turn instructions to durable agentic loops in </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Not all tasks are equal</span></h2>\n<p><span style=\"vertical-align: baseline;\">You can categorize the work that we give to our agents into five distinct tiers, scaling from a quick question up through Agile tasks, stories, and epics to a continuous system:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A simple </span><strong style=\"vertical-align: baseline;\">question</strong><span style=\"vertical-align: baseline;\">: This does not require an agent; an assistant can answer it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A </span><strong style=\"vertical-align: baseline;\">task</strong><span style=\"vertical-align: baseline;\"> / idea: This is one where a single prompt can zero-shot it. Use </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\"> to quickly transform ideas to functional prototypes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">An app / larger </span><strong style=\"vertical-align: baseline;\">feature</strong><span style=\"vertical-align: baseline;\"> / story: The kind of work that required weekly planning and splitting into subtasks before AI. Use loops for execution and full-featured agents, like Google Antigravity. This tier is also where your steering moves upstream: You lock in the spec, the plan, and the executable tests before any loop runs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A </span><strong style=\"vertical-align: baseline;\">project</strong><span style=\"vertical-align: baseline;\"> / epic: A few features that make a cohesive story when connected. Loops here might help with planning too. This is also where one needs to go beyond simple turn-based prompting.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A </span><strong style=\"vertical-align: baseline;\">system</strong><span style=\"vertical-align: baseline;\">: An overview of all of the projects and tasks. This is where you write </span><code style=\"vertical-align: baseline;\">AGENTS.md</code><span style=\"vertical-align: baseline;\"> project instructions, create </span><a href=\"https://antigravity.google/docs/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">skills</span></a><span style=\"vertical-align: baseline;\">, set up </span><a href=\"https://antigravity.google/docs/sidecars\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sidecars</span></a><span style=\"vertical-align: baseline;\">, wire up verification gates, and configure an instrument cluster to keep themselves on top of everything. Loops at this level make the biggest difference and come with similarly higher risks.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"how-to-build-durable-agentic-systems-with-google-antigravity-from-instructions-to-loops_fig1-five-tiers-to-loops\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/how-to-build-durable-agentic-systems-with-.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Five tiers of engineering work, from single prompts to verified agentic loops.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Why the loop?</span></h2>\n<p><span style=\"vertical-align: baseline;\">The baseline of software development is shifting. This shift represents a basic law of human nature: we seek the highest leverage possible, moving from manual labor to delegation, and finally to orchestration. Because attention is the new bottleneck, anything that lets the work continue with less interruption could make a move in the right direction. By early 2026, empirical research of open-source projects estimated that coding agent adoption had reached </span><a href=\"https://arxiv.org/abs/2601.18341\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">between 22% and 29%</span></a><span style=\"vertical-align: baseline;\"> of more than 128,000 active repositories on GitHub. Those who become proficient in agentic workflows now operate with a level of leverage that elevates their entire team's productivity. However, it also increases the cognitive load on everyone who is taking responsibility at the systemic level.</span></p>\n<p><span style=\"vertical-align: baseline;\">To understand this shift, let's trace the technical lineage of loops and set some high level expectations.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Academic foundations</span></h3>\n<p><span style=\"vertical-align: baseline;\">The academic seed was Yao et al.'s ReAct paper in October 2022, which interleaved reasoning traces with tool calls. ReAct beat reinforcement learning baselines by </span><a href=\"https://arxiv.org/abs/2210.03629\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">34% on ALFWorld and 10% on WebShop</span></a><span style=\"vertical-align: baseline;\"> by reasoning before acting, mirroring human nature: we perform better when verbalizing plans. Then came AutoGPT in early 2023, raising millions in venture funding. While early iterations of ReAct frequently spun in infinite loops, it proved developers wanted hands-off automation, highlighting the need for structural guardrails.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Stateless experimentation</span></h3>\n<p><span style=\"vertical-align: baseline;\">In mid-2025, developers ran stateless bash loops that piped prompts into command-line agents and reset context files on every tick. Resetting context prevents cognitive bloat and acknowledges that human memory limits also apply to models. Stateless bash loops worked only because the durable state lived outside the model: in Git history, in progress files, and in the test suite. It successfully built self-hosting compilers over months of automated runs. By spring 2026, major tool environments absorbed this pattern, shipping native commands like </span><code style=\"vertical-align: baseline;\">/goal</code><span style=\"vertical-align: baseline;\"> to let agents run unattended loops.</span></p>\n<h3><span style=\"vertical-align: baseline;\">The mathematics of autonomy</span></h3>\n<p><span style=\"vertical-align: baseline;\">Consider a theoretical example:</span></p>\n<p><span style=\"vertical-align: baseline;\">If you put your agent in a flat sequential chain to complete multiple tasks in a row, the agent's success rate degrades exponentially. When each of its individual steps operates as an independent probability event, a sequence of </span><span style=\"font-style: italic; vertical-align: baseline;\">N</span><span style=\"vertical-align: baseline;\"> steps has a cumulative success rate of </span><span style=\"font-style: italic; vertical-align: baseline;\">p</span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">N</span></span><span style=\"vertical-align: baseline;\">. For instance, if you run a task requiring 20 consecutive file modifications with a model that has </span><span style=\"font-style: italic; vertical-align: baseline;\">p = 0.95</span><span style=\"vertical-align: baseline;\"> accuracy, then you face a success rate of only </span><span style=\"font-style: italic; vertical-align: baseline;\">36%</span><span style=\"vertical-align: baseline;\">. Without your structural interventions, they will fail almost certainly.</span></p>\n<p><span style=\"vertical-align: baseline;\">Is </span><span style=\"font-style: italic; vertical-align: baseline;\">0.95</span><span style=\"vertical-align: baseline;\"> a real number? Treat it as an illustrative per-step reliability, not as a benchmark result. Even a frontier model reaches reliable multi-step outcomes only when it runs inside a verified harness. If your own per-step reliability sits closer to 75%, then the raw chain is already under 6% by step 10. The verification around the model sets the ceiling, which is why the loop matters.</span></p>\n<p><span style=\"vertical-align: baseline;\">This is why you need evaluation loops. A verification gate should not force your agent to retry indefinitely (which causes infinite spinning runaways). Instead, it should pinpoint where the error occurred and allow the model exactly one targeted retry to fix it. If your agent has a </span><span style=\"font-style: italic; vertical-align: baseline;\">95%</span><span style=\"vertical-align: baseline;\"> base accuracy, and your evaluation loop has a </span><span style=\"font-style: italic; vertical-align: baseline;\">95%</span><span style=\"vertical-align: baseline;\"> chance of spotting and fixing the error on that single retry, the effective step success probability rises to </span><span style=\"font-style: italic; vertical-align: baseline;\">0.95 + (0.05 x 0.95) = 99.75%</span><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">That arithmetic assumes the check is independent of the worker, so the gate has to be an outside check. Compilers, test suites, and linters give you that for free, and </span><a href=\"https://developers.googleblog.com/the-anatomy-of-harness-engineering-how-to-evaluate-iterate-and-guard-ai-coding-agents/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">behavioral evaluations</span></a><span style=\"vertical-align: baseline;\"> let you assert on discrete tool calls and intermediate actions in seconds instead of waiting on a full end-to-end benchmark. For semantic judgments that a deterministic test cannot make, I pair models from different families so the reviewer does not share the worker's blind spot.</span></p>\n<p><span style=\"vertical-align: baseline;\">Even if fixing fails, just spotting the error with a </span><span style=\"font-style: italic; vertical-align: baseline;\">95%</span><span style=\"vertical-align: baseline;\"> accuracy, lets you jump in and manually realign the system while keeping the same </span><span style=\"font-style: italic; vertical-align: baseline;\">99.75%</span><span style=\"vertical-align: baseline;\"> subagent accuracy and only paying the cost of human-in-the-loop intervention.</span></p>\n<p><span style=\"vertical-align: baseline;\">The table below shows the probability of completion across different chain lengths, comparing raw models to this single-retry course-correction topology:</span></p>\n<div align=\"center\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table border=\"1px\" cellpadding=\"10px\" style=\"border-collapse: collapse;\"><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Chain Length</strong></p>\n</td>\n<td style=\"border: 1px solid #000000; padding: 16px; text-align: center; vertical-align: top;\">\n<p><strong style=\"vertical-align: baseline;\">95% Accuracy</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">95% x 95% Loop</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">3 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">86%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">99%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">5 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">77%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">99%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">10 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">60%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">98%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">15 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">46%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">96%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">20 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><strong style=\"vertical-align: baseline;\">36%</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><strong style=\"vertical-align: baseline;\">95%</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">30 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">21%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">93%</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">50 Steps</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">8%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px; text-align: center;\">\n<p><span style=\"vertical-align: baseline;\">88%</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">What about context bloat?</span></h3>\n<p><span style=\"vertical-align: baseline;\">If each step in a chain adds approximately </span><strong style=\"vertical-align: baseline;\">1%</strong><span style=\"vertical-align: baseline;\"> of context in tokens, you end up with a chain that is not much longer than </span><strong style=\"vertical-align: baseline;\">50</strong><span style=\"vertical-align: baseline;\"> steps before we require compression. A 95% base accuracy that can be evaluated (and course corrected with 95% accuracy for each dimension that we care about) should keep you at good success rates for such individual running agents. If you establish a scalable way to divide and conquer problems, you can apply similar principles to drive your subagents. As we can see, at </span><strong style=\"vertical-align: baseline;\">20</strong><span style=\"vertical-align: baseline;\"> steps, a 95% accuracy paired with a single-retry corrective loop yields a 95% end-to-end success rate (assuming the correction itself stays under our 20 steps soft limit) while keeping context size reasonable. Note that there is no explicit requirement for the correction to be AI or human driven, but rather it needs to produce accurate and verifiable results.</span></p>\n<p><span style=\"vertical-align: baseline;\">This is where you divide problems into tasks that require a small number of steps each. If a problem is more complex, it remains approachable, but it must be divided into smaller subproblems, and so on. For our example, this means allocating up to </span><strong style=\"vertical-align: baseline;\">20</strong><span style=\"vertical-align: baseline;\"> steps for each level agent, task, and trajectory and another </span><strong style=\"vertical-align: baseline;\">20</strong><span style=\"vertical-align: baseline;\"> steps for the next level supervisory agent to consolidate contributions. To prevent drift, establish separate evaluations at all subagent and supervisory levels with a final acceptance criteria.</span></p>\n<p><span style=\"vertical-align: baseline;\">Lastly, you must evaluate these metrics </span><strong style=\"vertical-align: baseline;\">at least once</strong><span style=\"vertical-align: baseline;\"> for each level to verify that they measure the right target before running automation at a higher level. These are general estimations, but help you quickly decide whether you should split a problem, repeat a step, or commit results and move on.</span></p>\n<p><span style=\"vertical-align: baseline;\">In practice, your numbers will look different, but the scaling laws will be similar.</span></p>\n<h2><span style=\"vertical-align: baseline;\">How to build a durable system</span></h2>\n<p><span style=\"vertical-align: baseline;\">What started as a source of friction has now become one of my primary driving curiosities: how do we build automation when we still have a lot to learn about the craft itself? I have a few ideas.</span></p>\n<p><span style=\"vertical-align: baseline;\">To build a loop that does not run off a cliff, you must establish core guardrails that will keep accuracy high and will allow us to debug and intervene whenever necessary. Specifically, these are the pillars I identified:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Durable state</strong><span style=\"vertical-align: baseline;\">: Git-backed checkpoints ensure that your agent can resume work after a crash.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verification gates</strong><span style=\"vertical-align: baseline;\">: Automated test suites and compilers deterministically check that the changes are correct. Write the acceptance criteria and the tests upstream, before implementation starts, and make one rule explicit in your project instructions: an agent cannot pass a gate by deleting or weakening a test. When done properly, gates can have &gt;95% accuracy. However, you should be on the lookout for edge cases you might have forgotten about. Especially if verification, evaluation, or manual validation success rates diverge for any of your features.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evals</strong><span style=\"vertical-align: baseline;\">: Anything that cannot be deterministically verified but is important should have an evaluation or benchmark which you can later inspect for accuracy. Try to write them in a way that will keep answers to a simple yes or no and accuracy high, ideally over 95%. If you're getting results that point to confusion or unexpected failures, you probably need to split the criteria into simpler ones.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Halt conditions</strong><span style=\"vertical-align: baseline;\">: Turn limits (as we saw above, </span><strong style=\"vertical-align: baseline;\">20</strong><span style=\"vertical-align: baseline;\"> seems to be the sweet spot) and token or dollar cost ceilings stop runs before API budgets get out of control.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Standardized </strong><a href=\"https://antigravity.google/docs/skills\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">skills</strong></a><strong style=\"vertical-align: baseline;\"> and instructions</strong><span style=\"vertical-align: baseline;\">: Reusable utilities, documented in the </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> format, preferably bundled with code and source of truth references. Pair them with an </span><code style=\"vertical-align: baseline;\">AGENTS.md</code><span style=\"vertical-align: baseline;\"> that holds the project invariants every run load. Skills stay on disk until their description matches the task, so they do not eat into the 20-step context window.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">These pillars don't name a model version, but rather a model family. Individual model leads last only weeks. The asset that survives each release is the harness and its processes: the </span><code style=\"vertical-align: baseline;\">AGENTS.md</code><span style=\"vertical-align: baseline;\"> instructions every run loads, the </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> modules loaded only when relevant, the isolated Cloud Run sandbox where the loop runs around the clock, the deterministic checks, and the cross-model review. When a run fails or you have to intervene, patch your harness along with the code: a new test, a line in </span><code style=\"vertical-align: baseline;\">AGENTS.md</code><span style=\"vertical-align: baseline;\">, a note in the skill. The next run inherits the lesson even though its context starts from zero.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Platform built-in systems</span></h3>\n<p><span style=\"vertical-align: baseline;\">Platforms like Google Antigravity have codified these patterns (</span><code style=\"vertical-align: baseline;\">/grill-me</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">/goal</code><span style=\"vertical-align: baseline;\">) into built-in primitives, shifting the work from custom scripts to platform capabilities for most straightforward use cases. The same harness files travel with the repository whether you run Google Antigravity 2.0, the </span><code style=\"vertical-align: baseline;\">agy</code><span style=\"vertical-align: baseline;\"> CLI, or Antigravity inside VS Code, JetBrains, or Cursor. I would encourage you to give these a try. Do remember, however, to keep an eye on trajectory lengths and look for model confusion.</span></p>\n<p><span style=\"vertical-align: baseline;\">I myself frequently rely on the </span><code style=\"vertical-align: baseline;\">/goal</code><span style=\"vertical-align: baseline;\"> primitives in Google Antigravity 2.0 when coordinating multi-turn tasks that require extensive validation and measurements before completion. To anchor this execution, use the </span><code style=\"vertical-align: baseline;\">/grill-me</code><span style=\"vertical-align: baseline;\"> command for an interactive interview to lock in design constraints, invariants, and the tests that decide success before running </span><code style=\"vertical-align: baseline;\">/goal</code><span style=\"vertical-align: baseline;\"> loops.</span></p>\n<p><span style=\"vertical-align: baseline;\">Constructing the metrics for this technical article and then editing it is just one example of how I use these execution loops.</span></p>\n<p><span style=\"vertical-align: baseline;\">By pairing </span><code style=\"vertical-align: baseline;\">/goal</code><span style=\"vertical-align: baseline;\"> with </span><code style=\"vertical-align: baseline;\">/grill-me</code><span style=\"vertical-align: baseline;\">, you can establish an effective pair-programming dynamic: alignment on intent, followed by autonomy in execution.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Custom DIY loops</span></h3>\n<p><span style=\"vertical-align: baseline;\">To understand the evolution of loops, compare two distinct architectures for DIY agentic loops:</span></p>\n<h4><span style=\"vertical-align: baseline;\">Stateless five-liner</span></h4>\n<p><span style=\"vertical-align: baseline;\">Geoffrey Huntley's \"Ralph\" loop is a prime example of stateless architecture. Here's the simplest working version of an Antigravity CLI loop:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;limit=20\\r\\nfor ((i=1; i&lt;=limit; i++)); do\\r\\n  agy -p &quot;$(cat prompt.md)&quot; --sandbox || break\\r\\n  ./commit-and-test &amp;&amp; break\\r\\ndone&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fab45e12950&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">While simple, the stateless loop is fragile for multi-file coordination because resetting context discards thinking logs.</span></p>\n<p><span style=\"vertical-align: baseline;\">A good agent skill could fix much of this limitation by instructing the model to output relevant progress reports in wiki-like markdown files and track changes by looking at git logs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Still, this complexity has led to developer challenges in larger multi-agent environments, for which custom loops seem to hold the promise.</span></p>\n<h3><span style=\"vertical-align: baseline;\">So what if you want to go to the deep end?</span></h3>\n<p><span style=\"vertical-align: baseline;\">If you want to write a custom loop from scratch, here is a practical Python implementation using the </span><a href=\"https://antigravity.google/docs/sdk/overview\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity SDK</span></a><span style=\"vertical-align: baseline;\">. Specifically, this loop does the following actions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Initializes a supervisor session.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Executes a task.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Verifies the output with the real test suite.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Feeds the actual failure output back for exactly one targeted retry.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enforces strict call and token budgets.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Not every task inside it is equal, so neither is the model. The supervisor and the implementer run on Gemini 4 Carbon because orchestration, architecture, and the complex fixes need frontier reasoning, codebase search goes to Gemini 4 Hydrogen, and verification goes to a deterministic script that costs no tokens at all. The </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/guide-to-ai-tokenomics-eleven-principles-for-token-efficient-software-engineering/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Guide to AI Tokenomics</span></a><span style=\"vertical-align: baseline;\"> covers the budgeting side of this split. Far from being a production-ready solution, this is an experimental starting point that you can adapt to suit your individual needs:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"how-to-build-durable-agentic-systems-with-google-antigravity-from-instructions-to-loops_fig2-supervisory-harness-loop\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/how-to-build-durable-agentic-systems-with-.max-1000x1000_Jmc0iBc.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: Budgeted supervisory verification loop in the Google Antigravity SDK.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import asyncio\\r\\nimport subprocess\\r\\n\\r\\nfrom google.antigravity import Agent, LocalAgentConfig, types\\r\\nfrom google.antigravity.hooks import policy\\r\\n\\r\\ndef verify_output(workspace_path: str) -&gt; tuple[bool, str]:\\r\\n    &quot;&quot;&quot;Verification gate: run the test suite and keep the real failure output.&quot;&quot;&quot;\\r\\n    result = subprocess.run(\\r\\n        [&quot;go&quot;, &quot;test&quot;, &quot;./...&quot;], cwd=workspace_path, capture_output=True, text=True\\r\\n    )\\r\\n    output = (result.stdout + &quot;\\\\n&quot; + result.stderr).strip()\\r\\n    return result.returncode == 0, output\\r\\n\\r\\n# 1. Define subagents with scoped tools and a model that fits each job\\r\\nresearcher = types.SubagentConfig(\\r\\n    name=&quot;researcher&quot;,\\r\\n    description=&quot;Searches the codebase and summarizes implementation paths.&quot;,\\r\\n    system_instructions=(\\r\\n        &quot;You are a research subagent. Analyze the codebase, find implementation &quot;\\r\\n        &quot;paths, and report back without modifying any files.&quot;\\r\\n    ),\\r\\n    model=&quot;gemini-4-hydrogen&quot;,\\r\\n    capabilities=types.SubagentCapabilities(\\r\\n        enabled_tools=[\\r\\n            types.BuiltinTools.VIEW_FILE,\\r\\n            types.BuiltinTools.SEARCH_DIR,\\r\\n            types.BuiltinTools.FIND_FILE,\\r\\n        ],\\r\\n    ),\\r\\n)\\r\\n\\r\\nfeature_implementer = types.SubagentConfig(\\r\\n    name=&quot;feature_implementer&quot;,\\r\\n    description=&quot;Implements a scoped code change and keeps the tests passing.&quot;,\\r\\n    system_instructions=(\\r\\n        &quot;You are a feature implementation subagent. Follow AGENTS.md, write &quot;\\r\\n        &quot;clean code, run the tests, and fix compiler errors. Never delete or &quot;\\r\\n        &quot;weaken a test to make it pass.&quot;\\r\\n    ),\\r\\n    model=&quot;gemini-4-carbon&quot;,\\r\\n    capabilities=types.SubagentCapabilities(\\r\\n        enabled_tools=[\\r\\n            types.BuiltinTools.VIEW_FILE,\\r\\n            types.BuiltinTools.EDIT_FILE,\\r\\n            types.BuiltinTools.CREATE_FILE,\\r\\n            types.BuiltinTools.RUN_COMMAND,\\r\\n        ],\\r\\n    ),\\r\\n)\\r\\n\\r\\n# 2. Expose both subagents to the supervisor, with a 20-call and token budget\\r\\nsupervisor_config = LocalAgentConfig(\\r\\n    model=&quot;gemini-4-carbon&quot;,\\r\\n    workspaces=[&quot;./workspace&quot;],\\r\\n    subagents=[researcher, feature_implementer],\\r\\n    policies=[policy.allow_all()],\\r\\n    budget_config=types.BudgetConfig(\\r\\n        max_model_calls=20,\\r\\n        max_total_tokens=200_000,\\r\\n    ),\\r\\n    system_instructions=(\\r\\n        &quot;You are a supervisor agent. Delegate codebase exploration to &quot;\\r\\n        &quot;@researcher and code changes to @feature_implementer. Summarize each &quot;\\r\\n        &quot;completed step before moving on.&quot;\\r\\n    ),\\r\\n)\\r\\n\\r\\nasync def run_agentic_loop(prompt: str, max_retries: int = 1) -&gt; bool:\\r\\n    &quot;&quot;&quot;Supervisory loop. We only instantiate and run the supervisor explicitly.&quot;&quot;&quot;\\r\\n    async with Agent(supervisor_config) as supervisor:\\r\\n        for attempt in range(1, max_retries + 2):\\r\\n            print(f&quot;[Supervisor Loop] Attempt {attempt}/{max_retries + 1}...&quot;)\\r\\n\\r\\n            # Send prompt to the supervisor; it spawns subagents autonomously as needed\\r\\n            response = await supervisor.chat(prompt)\\r\\n            await response.text()  # Drain the stream before reading the stop reason\\r\\n\\r\\n            # Halt condition: the SDK stops the turn when a budget is exceeded\\r\\n            if response.stop_reason in (\\r\\n                types.StopReason.MAX_MODEL_CALLS_EXCEEDED,\\r\\n                types.StopReason.MAX_TOTAL_TOKENS_EXCEEDED,\\r\\n            ):\\r\\n                print(f&quot;Loop halted: budget exceeded ({response.stop_reason}).&quot;)\\r\\n                return False\\r\\n\\r\\n            usage = supervisor.conversation.total_usage\\r\\n            print(f&quot;Tokens used so far: {usage.total_token_count or 0:,} / 200,000&quot;)\\r\\n\\r\\n            # Verification gate: deterministic, and independent of the worker\\r\\n            success, error_msg = verify_output(&quot;./workspace&quot;)\\r\\n            if success:\\r\\n                print(&quot;Goal completed: verification gate passed.&quot;)\\r\\n                return True\\r\\n\\r\\n            # Exactly one targeted retry, with the real failure output\\r\\n            prompt = (\\r\\n                &quot;The previous attempt failed verification with the following output:\\\\n&quot;\\r\\n                f&quot;{error_msg}\\\\n&quot;\\r\\n                &quot;Delegate a targeted fix to @feature_implementer and run the tests again.&quot;\\r\\n            )\\r\\n\\r\\n        print(&quot;Verification still failing after the retry. Handing over to a human.&quot;)\\r\\n        return False\\r\\n\\r\\nif __name__ == &quot;__main__&quot;:\\r\\n    asyncio.run(run_agentic_loop(&quot;Refactor types.go to use explicit interfaces.&quot;))&#x27;), (&#x27;language&#x27;, &#x27;lang-py&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fab45d83550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The preceding implementation defines the following budgets: </span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">max_model_calls=20</code><span style=\"vertical-align: baseline;\">, a soft limit, counted across the supervisor's whole session</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">max_total_tokens=200_000</code><span style=\"vertical-align: baseline;\"> as the cost ceiling</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">The SDK stops the turn and reports a </span><code style=\"vertical-align: baseline;\">stop_reason</code><span style=\"vertical-align: baseline;\"> when either one trips. </span><code style=\"vertical-align: baseline;\">max_retries=1</code><span style=\"vertical-align: baseline;\"> limits each section: the first attempt plus one fix. If the verification still fails after that, the loop returns </span><code style=\"vertical-align: baseline;\">False</code><span style=\"vertical-align: baseline;\"> and a human takes the seat instead of the model spinning until the budget runs out.</span></p>\n<p><span style=\"vertical-align: baseline;\">If you prefer not to build and host your own custom SDK loops from scratch, use </span><a href=\"https://ai.google.dev/gemini-api/docs/antigravity-agent\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity Agent</span></a><span style=\"vertical-align: baseline;\">, an autonomous, asynchronous coding agent. Antigravity Agent operates in a secure, isolated Google Cloud sandbox. This way you can create similar agentic loops by using </span><a href=\"https://ai.google.dev/gemini-api/docs/custom-agents\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">managed agents</span></a><span style=\"vertical-align: baseline;\"> to orchestrate execution plans under Google managed infrastructure. Alternatively, you can run the preceding loop inside a long-lived Cloud Run sandbox so that the loop keeps working after you close your laptop.</span></p>\n<h2><span style=\"vertical-align: baseline;\">No one size fits all</span></h2>\n<p><span style=\"vertical-align: baseline;\">You must establish a clear boundary for each of your validation systems that lets you  stay in control. No matter how perfect your loop, if </span><span style=\"font-style: italic; vertical-align: baseline;\">you</span><span style=\"vertical-align: baseline;\">, as the responsible human, cannot sign off on your agent's output, there is minimal value in any of the artifacts it is producing. The good news is that building a quality evaluation scorecard or a loop algorithm uses a similar process to producing any other type of software artifact. So, much of the execution will be automated.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, to make a sound judgment, you should observe each loop from the inside. As you see things working out, with this acquired confidence you step one level up. This is the only way to learn where the agent struggles and how to improve the process itself. </span></p></div>"
