"overview": |
  この日は Google Cloud ブログ 5 本 (うち 1 本は AI & ML ブログにも掲載)、日本語ブログ 3 本、リリースノート 1 本で、マルチクラウド接続とエージェント開発が中心でした。リリースノートでは、Application Integration の 2026 年 9 月 22 日より前のバージョンで、統合の実行パラメータの処理に信頼できないデータのデシリアライズの脆弱性が見つかったことがセキュリティ情報 GCP-2026-083 として公開されています。Google Cloud は AI アプリケーション開発プラットフォーム部門の 2026 年 Gartner Magic Quadrant で 3 年連続のリーダーに選ばれ、実行能力の軸で最も高い位置に置かれたと発表し、過去 1 年で約 500 社の顧客がそれぞれ 1 兆トークン超を処理したことや、10 月に発表した統合された Gemini の体験などを紹介しました。ネットワークでは、partner Cross-Cloud Interconnect が Microsoft Azure に対応してプレビューとなり、Google Cloud と Microsoft の共同サポートのもと、物理インフラの管理なしに Google Cloud と Azure の間の高帯域なプライベート接続を数分でプログラムから構成できるようになりました。Looker は 11 月に、期間比較付きの KPI 表示、ブレットチャートとゲージ、数値の短縮表示、サンキーダイアグラムなど新しいネイティブのグラフ種別とダッシュボードコントロールを含むビジュアルの大幅な更新を展開します。開発者向けには、Google Antigravity で単発の指示から耐久性のあるエージェントのループへ移るためのハーネスの組み立て方と検証方法が解説されました。日本語ブログでは、SOAP アーキテクチャの 4 つ目の要素「届ける / 共有する」として、LLM が導いた分析結果をファイルやスクリーンショットではなく、Looker MCP サーバーや Looker Data Apps (いずれもプレビュー) を使ってガバナンスの効いた Looker 上のコンテンツとして共有するリファレンスアーキテクチャが紹介されました。そのほか、AI リーダーシップ部門を新設した 2026 年の Google Cloud Partner All-stars が発表されています。日本語ブログではほかに、Google 発のオープンソースプロジェクト Agent Substrate・gVisor・OpenRL を CNCF に寄贈し (先月 CNCF サンドボックスに採択)、Agent Substrate が 1.0 に到達して Agent Substrate on GKE として一般提供になったこと (アイドル状態のエージェントをスナップショットにして 500 ミリ秒未満で復元し、コンテナ密度を 10 倍に高める) と、BigQuery で数百万行のテキストやマルチモーダルデータを 1 つの SQL クエリで意味的に集計するマルチレベルのセマンティック集計関数 AI.AGG (プレビュー、10 MiB を超える行は破棄またはエラー) が紹介されました。
