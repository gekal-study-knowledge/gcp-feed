  "be76e80e0954072b813e4380b729150f":
    "id": "be76e80e0954072b813e4380b729150f"
    "title": "Delivery: SOAP を用いて LLM が導いた発見を、ガバナンスの下で「届ける」"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/delivering-the-insights-derived-by-llms-using-soap-under-a-governance-framework/"
    "published": "2026-11-18 09:00:00"
    "fetched": "2026-11-18 14:58:40"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">利用している主なサービス・ソリューション</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Products Used:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker / LookML</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバー（プレビュー版）</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/looker/docs/connect-ide-to-looker-using-mcp-toolbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps（プレビュー版）</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/gemini/docs/conversational-analytics-api/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics API</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Solutions Used:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAP Architecture</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/solutions/data-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Analytics &amp; AI Platform</span></a></p>\n</li>\n</ul>\n<hr />\n<p><span style=\"vertical-align: baseline;\">「9 月と 10 月の F1層 と F2層 の売上を比べて、差が生まれた理由を教えて」。こう問いかければ、LLM は数分で集計を終え、グラフまで描いてくれます。LLM を使ったデータ分析は、いまや当たり前になりつつあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">ところが、その発見を誰かに届けようとした瞬間、話は変わります。手元に残るのは、データが埋め込まれた HTML ファイルや PNG 画像、チャットに貼り付けたスクリーンショットです。せっかくの発見は 1 人のチャット履歴に埋もれるか、本来の権限を離れて社内を漂流していきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">本稿では、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAP Architecture</span></a><span style=\"vertical-align: baseline;\"> で示した「つなぐ」「意味を与える」「働かせる」に続く 4 つ目の要素として、</span><strong style=\"vertical-align: baseline;\">「届ける/共有する」</strong><span style=\"vertical-align: baseline;\"> をご紹介します。AI エージェントが導いた発見を、ファイルではなく Looker 上のガバナンスされたコンテンツとして届ける。そのためのリファレンス アーキテクチャです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_WBEKm2j.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">共有は、まだ「ファイル」のまま</span></h3>\n<p><span style=\"vertical-align: baseline;\">LLM による分析が広がるほど、共有の課題は 2 つの立場から表面化しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">分析する人にとっての課題</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">深掘りできない - 受け取った画像は固定されています。「では地域別には？」と思っても、受け手はゼロから自分で問い直すしかありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">数字を信頼できない - どのデータを、どの「売上」の定義で集計したのか。出所の記録はファイルに残りません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">すぐに古くなる - ファイルはその時点のスナップショットです。来月には、誰かが同じ分析をやり直すことになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">誰に見せてよいか分からない - 判断に迷った結果、無造作に共有してしまうか、共有そのものをあきらめてしまいます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">データを守る人にとっての課題</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データがファイルに埋め込まれる - HTML や画像が保持しているのは、クエリではなくデータそのものです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アクセス制御が引き継がれない - 行レベルや列レベルのセキュリティ、データ マスキングは、コピーされた時点で効力を失います。多くの場合、本人に悪意はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">回収も監査もできない - メール、チャット、共有ドライブに広がったコピーは、異動や退職のタイミングで取り消すことができず、誰が閲覧したかの記録も残りません。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">いま利用者の前にある選択肢は、ファイルやスクリーンショットで「簡単だが危険」に共有するか、データ チームにダッシュボードを依頼して「安全だが遅い」道を選ぶか、の二択です。そして、日々生まれる問いの大半は、後者にたどり着く前に消えていきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">必要なのは、その間にある 3 つ目の選択肢、「簡単で、しかも安全」 な共有です。</span></p>\n<h3><span style=\"vertical-align: baseline;\">原則：可視化を「データ」として共有しない</span></h3>\n<p><span style=\"vertical-align: baseline;\">「届ける/共有する」の考え方は、1 つの原則に集約されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">可視化を「データ」として共有しない。ガバナンスされた「定義」として共有する。</strong></p>\n<p><span style=\"vertical-align: baseline;\">Looker のダッシュボードが保存しているのは、データの行ではなく、クエリとチャートの定義です。データは閲覧者がダッシュボードを開いた瞬間に、その閲覧者の権限で取得されます。そのため、共有する人が「この人に見せてよいか」を判断する必要はありません。システムが閲覧者ごとに判断します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ガバナンスは、共有を妨げるものではありません。共有を簡単にするものです。</span></p>\n<h3><span style=\"vertical-align: baseline;\">リファレンス アーキテクチャ：エージェントは、ファイルではなく Looker に届ける</span></h3>\n<p><span style=\"vertical-align: baseline;\">「届ける/共有する」では、AI エージェントが分析の最後に HTML ファイルを書き出す代わりに、Looker のコンテンツを作成します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_KQYwbOA.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">入口はどのエージェントでも - Gemini Enterprise 上のデータ エージェントでも、Antigravity や Claude Code などのコーディング エージェントでもかまいません。SOAP で整理した「アドホック分析」と「エンジニアリング分析」のペルソナが、そのまま対象になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Looker MCP サーバーで接続 - エージェントは </span><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバー</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）や </span><a href=\"https://docs.cloud.google.com/looker/docs/connect-ide-to-looker-using-mcp-toolbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases</span></a><span style=\"vertical-align: baseline;\"> を通じて Looker に接続し、LookML のセマンティック レイヤを経由してクエリを実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">成果物は Looker コンテンツ - </span><code style=\"vertical-align: baseline;\">make_dashboard</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">add_dashboard_element</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">add_dashboard_filter</code><span style=\"vertical-align: baseline;\"> といったツールでダッシュボードを組み立てます。エージェントが受け手に渡すのは、ファイルではなくリンクです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">受け手は、自分の権限で見る - リンクを開いた受け手には、その人がアクセスできるデータだけが表示されます。フィルタを変えて深掘りしたり、同じ Explore に対して追加の質問を投げかけたりすることもできます。</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">ウォークスルー：「F1層 と F2層 の売上差の理由は？」</span></h3>\n<p><span style=\"vertical-align: baseline;\">冒頭の問いを例に、エージェントの動きを追ってみます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">比較する - Looker のクエリで月ごとにピボットし、表計算で差額と増減率を求めます。使われるのは、LookML で一元管理された「売上」の定義です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">深掘りする - カテゴリ、チャネル、地域、注文数と平均単価といった切り口で、複数のクエリを実行して差を分解します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">理由を見つける - 例えば、BigQuery ML の</span><a href=\"https://docs.cloud.google.com/bigquery/docs/contribution-analysis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">貢献度分析（Contribution Analysis）</span></a><span style=\"vertical-align: baseline;\">を使えば、差を最もよく説明するセグメントの組み合わせを自動的に順位付けできます。結果は、ガバナンスされた BigQuery のデータセットに書き込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">届ける - KPI、推移、要因、インサイトの一覧を並べたダッシュボードを Looker 上に作成し、リンクを共有します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">上司や同僚がそのリンクを開くと、同じ定義に基づく数字を、それぞれ自分の権限で確認できます。発見は、届いた先でも生き続けます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">LookML がなくても始められる：3 つのパターン</span></h3>\n<p><span style=\"vertical-align: baseline;\">「LookML が整備されていないと、この仕組みは使えないのでは」という疑問もあるでしょう。「届ける/共有する」は、セマンティック レイヤの整備状況に応じて、3 つのパターンを使い分けられるよう設計しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">パターン B：結果ストア - あらかじめ汎用的な LookML ビューを 1 つ用意し、固定スキーマの BigQuery テーブルを参照させます。エージェントは分析結果をこのテーブルに書き込むだけで、分析ごとに LookML を変更する必要はありません。既存の LookML がゼロでも、初日から使えます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">パターン A：エージェントが書く LookML - エージェントが Knowledge Catalog や </span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Knowledge Format（OKF）</span></a><span style=\"vertical-align: baseline;\">のナレッジを手がかりに、サンドボックスのプロジェクトにビューと Explore を生成します。検証とレビューを経てデプロイすれば、ライブなデータで深掘りできるダッシュボードになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Looker Data Apps（プレビュー版） - 定型のダッシュボードでは表現しきれない可視化は、</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps</span></a><span style=\"vertical-align: baseline;\"> で実現できます。コーディング エージェントが自由なレイアウトのアプリを作成し、Looker 上で公開します。クエリは LookML を経由し、閲覧者の権限で実行されます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">まずはパターン B で始め、繰り返し使われる分析をパターン A へ、さらに公式の LookML へと昇格させていく。アドホックな発見が、組織のセマンティック レイヤを育てていくライフサイクルです。</span></p>\n<p><span style=\"vertical-align: baseline;\">かつては熟練した開発者が必要だった LookML も、エージェントが書き、人が Git でレビューする時代になりました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">権限は、新しく作らない</span></h3>\n<p><span style=\"vertical-align: baseline;\">SOAP では「権限はエージェントのために新設するものではなく、既存のアクセス制御がそのまま適用される」と述べました。「届ける/共有する」でも、この考え方は変わりません。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェントから Looker まで - Looker MCP サーバーは OAuth 2.1 による認証を採用しており、エージェントは認証したユーザーの Looker のロールと権限を引き継ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Looker から BigQuery まで - BigQuery 接続で OAuth を利用すれば、クエリは閲覧者本人の ID で実行されます。BigQuery の</span><a href=\"https://docs.cloud.google.com/bigquery/docs/row-level-security-intro\"><span style=\"text-decoration: underline; vertical-align: baseline;\">行レベルのセキュリティ</span></a><span style=\"vertical-align: baseline;\">、ポリシータグ、データ マスキングは、エージェントが生成した LookML に対してもそのまま適用されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">管理者による統制 - Looker MCP サーバーのツールは管理者が 1 つずつ有効化でき、利用状況は System Activity や Cloud Audit Logs で確認できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">エージェントのために共有の管理者キーを用意する必要はありません。AI に強い権限を渡すのではなく、ユーザー本人として動かすことが、安全な共有の前提になります。</span></p>\n<h3><span style=\"vertical-align: baseline;\">「届ける/共有する」がもたらすもの</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">分析する人には - 発見をリンク 1 つで共有でき、受け手はそこから深掘りを続けられます。「誰に見せてよいか」に悩む必要もありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データを守る人には - データはファイルとして持ち出されず、閲覧のたびに権限が評価されます。コンテンツの所在、取り消し、監査を一元的に管理できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">組織には - 個人のチャット履歴に埋もれていた発見が、共有され、検証され、やがて公式の指標へと育っていきます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">S3 に置いたままのデータを BigQuery でゼロコピーで分析し、Looker を通じて閲覧者のもとに届ける。データは、権限を持つ人の目に触れるまで動きません。</span></p>\n<h3><span style=\"vertical-align: baseline;\">次のステップ</span></h3>\n<p><span style=\"vertical-align: baseline;\">最初の一歩は、エージェントの出力先を「ファイル」から「Looker」に変えることです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SOAP Architecture の全体像は、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのブログ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェントから Looker に接続するには、</span><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバーのドキュメント</span></a><span style=\"vertical-align: baseline;\">と </span><a href=\"https://docs.cloud.google.com/looker/docs/connect-ide-to-looker-using-mcp-toolbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases での接続手順</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">自由なレイアウトの可視化は、</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps のドキュメント</span></a><span style=\"vertical-align: baseline;\">から試せます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">差の理由を自動で見つける方法は、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/contribution-analysis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery ML の貢献度分析</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">発見は、届いてはじめて価値になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">分析は、LLM で。共有は、Looker で。</span></p>\n<p><strong style=\"vertical-align: baseline;\">関連リンク・次のステップ</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAP Architecture: S3 に眠るデータを、Google Cloud で AI エージェントの基盤に変える</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバー</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">著者・コントリビューター紹介</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">執筆者:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kuma Arakawa: Senior Customer Engineer</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Annie Jihyeon Lee: Business Intelligence Sales Specialist </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Yu Yamada: Data Analytics Specialist Tech Lead</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Akira Igarashi: Data Analytics Specialist Sales Manager</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Mei Sakurai: Head of Data Analytics Specialist Customer Engineering, Japan</span></p>\n</li>\n</ul>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お問い合わせ:</strong><span style=\"vertical-align: baseline;\"> Google Cloud のデータ分析・AI エージェント基盤導入に関するご相談は、担当営業またはカスタマー エンジニアまでお気軽にお問い合わせください。</span></p>\n</li>\n</ul></div>"
  "8336452aa7e30df89a8e54a63d38ea67":
    "id": "8336452aa7e30df89a8e54a63d38ea67"
    "title": "AI.AGG で BigQuery の数百万行にわたるデータのセマンティック集計を実現"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/semantic-data-aggregation-with-bigquery-and-ai-agg/"
    "published": "2026-11-18 10:20:00"
    "fetched": "2026-11-19 00:29:43"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 6 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/semantic-data-aggregation-with-bigquery-and-ai-agg?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">10 年以上にわたり、BigQuery は構造化データの集計における業界標準を牽引し、ペタバイト規模の財務データの合計算出、アクティブ ユーザー数の集計、過去データの平均値算出などをわずか数秒で実行してきました。しかし、現代の企業がアプリケーション ログ、カスタマー サービスの文字起こし、製品画像、診断レポートといった急増する非構造化データに圧倒されるなか、重大なギャップが浮き彫りになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">これまで、リレーショナル SQL エンジンには、数百万行ものテキストやマルチモーダル データから、共通するセマンティックなテーマを集計、合成、抽出するネイティブな機能が備わっていませんでした。BigQuery には強力な行レベルの AI 関数（AI.GENERATE や AI.CLASSIFY など）が最近導入されましたが、大規模なデータセットを包括的に分析する際には、大規模言語モデル（LLM）のコンテキスト ウィンドウというアーキテクチャ上の独自の課題が立ちはだかります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini のような高度な基盤モデルであっても、重大なデータ切り捨てや致命的な実行エラーを回避しながら、数百万行ものデータを一度のプロンプトで処理することは不可能です。これまでは、この問題を解決するためにデータ エンジニアリング チームが複雑な外部 MapReduce パイプラインを構築し、レート制限に伴うバックオフを管理しながら、分割された要約を再帰的に繋ぎ合わせる必要がありました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回は、現在プレビュー版として提供されている AI.AGG について詳しく解説します。これは、BigQuery GoogleSQL にネイティブに組み込まれた、フルマネージドのマルチレベル セマンティック集計関数です。セマンティック集計を分散 MapReduce の問題として捉え直すことで、AI.AGG は、データチームがわずか 1 つの SQL クエリで数百万行ものデータに対し自然言語による指示を実行することを可能にします。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、その仕組み、革新的なエンタープライズ ユースケース、本番環境にデプロイするためのベスト プラクティスについて詳しく見ていきます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_xGJBEhT.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>ペタバイト規模のデータを、BigQuery 上でネイティブにセマンティックなインサイトに変換します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">マルチレベルのバッチ処理アーキテクチャ</strong></h4>\n<p><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> は、チャンキングや並列実行に伴う極めて複雑なエンジニアリング作業を抽象化します。</span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> クエリを実行すると、BigQuery エンジンがデータベース内でネイティブに一連の処理を自動的にオーケストレートします。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">行レベルの検証: </strong><span style=\"vertical-align: baseline;\">BigQuery エンジンは、各行が最大コンテキスト ウィンドウを超えていないかを確認します（10 MiB を超えるペイロードは破棄されるか、エラーが返されます）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンテキスト長を考慮したバッチ処理:</strong><span style=\"vertical-align: baseline;\"> BigQuery エンジンは、入力行を動的に小規模なバッチにグループ化して、選択した Gemini エンドポイントのトークン制限内に十分に収まるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">並列推論: </strong><span style=\"vertical-align: baseline;\">自然言語による SQL プロンプトが各バッチに並列で適用され、Vertex AI を介して中間的なセマンティック サマリーが生成されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">再帰的合成:</strong><span style=\"vertical-align: baseline;\"> 最後に、システムはこれらの中間出力をまとめてバッチ処理し、まったく同じ指示とともに LLM に渡します。この集約処理は、SQL の </span><code style=\"vertical-align: baseline;\">GROUP BY</code><span style=\"vertical-align: baseline;\"> 句ごとに最終的な集計文字列が 1 つになるまで、再帰的に繰り返されます。</span></p>\n</li>\n</ol>\n<p><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> は、分散されたバッチ間で概念を統合するために高度な推論を必要とするため、パイプラインのすべての段階でフルウェイトの LLM に完全に依存しています。この点が、軽量化された CPU プロキシモデルを活用できる </span><code style=\"vertical-align: baseline;\">AI.CLASSIFY</code><span style=\"vertical-align: baseline;\"> などの行レベルの関数とは異なっています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">マルチモーダルなエンタープライズ環境に対応</strong></h4>\n<p><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> は、テキスト入力とマルチモーダル入力の両方にネイティブに対応しています。BigQuery オブジェクト テーブルと </span><code style=\"vertical-align: baseline;\">OBJ.GET_ACCESS_URL</code><span style=\"vertical-align: baseline;\"> 関数を活用することで、分析チームはデータの移動やコード変換を行うことなく、Cloud Storage に直接保存されている数千もの画像から視覚的なインサイトを抽出して集計できるようになります。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\"> データ エンジニアリングのヒント: NULL 排他ルール</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">複数の列を評価する場合、多くのユーザーは STRUCT（構造体）を関数に渡して処理します。しかし、その複合構造内のフィールドが 1 つでも NULL と評価されると、行全体が NULL と見なされ、何のアラートもなく破棄されてしまいます。データがパイプラインに確実に送られるように、NULL を許容するフィールドは常に IFNULL() で明示的にラップしてください（例: IFNULL(description, 'No data provided')）。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズにおける革新的なユースケース</strong></h4>\n<p><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> の真の分析力は、標準的な SQL の </span><code style=\"vertical-align: baseline;\">GROUP BY</code><span style=\"vertical-align: baseline;\"> 操作と組み合わせることで発揮されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. 大量のシステムログの診断分析</strong></p>\n<p><span style=\"vertical-align: baseline;\">世界中に分散されたマイクロサービスが生成するシステムログには、明示的な致命的エラーとしては現れない、わずかなパフォーマンス低下（メモリ スラッシングやシステム クロックのドリフトなど）が潜んでいることがよくあります。</span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> を活用することで、DevOps チームは数百万件ものログをシステム コンポーネントごとに集約し、特定の目的に沿った、人が読める診断サマリーを生成できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">プロンプト作成のヒント: 異常を探す前に、コンポーネントの「正常な動作」を明示的に説明するようモデルに指示します。これにより、LLM が完全に正常なログに対して誤ってエラーを検出するハルシネーションを抑えることができます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">2. Agentic Data Cloud の構築</strong></p>\n<p><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> は単なる分析レポートツールではなく、動的なオーケストレーション エンジンとしての側面も備えています。たとえば、明確な分類がされていない、過去のサポート チケットの膨大なリポジトリを取得したとします。</span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> をデプロイすれば、未加工のテキストを読み取って決定版のカテゴリ一覧を生成し、厳密な JSON 配列として出力することが可能です。</span></p>\n<p><code style=\"vertical-align: baseline;\">JSON_VALUE_ARRAY</code><span style=\"vertical-align: baseline;\"> を使ってこの配列を展開し、生成された動的ラベルを </span><code style=\"vertical-align: baseline;\">AI.CLASSIFY</code><span style=\"vertical-align: baseline;\"> などの行レベルの分類器に直接渡すことで、エンドツーエンドの自律的なデータラベル付けパイプラインを SQL 上でネイティブにオーケストレートできます。これにより、外部の Python スクリプトを用意する手間を省くことが可能です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">プロンプト エンジニアリングはデータ エンジニアリング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">生成モデルを決定論的な SQL パイプラインに統合する場合、標準的な会話型のプロンプトではうまくいかないことがよくあります。プログラム処理を前提とした SQL 出力を得るためのプロンプト作成には、厳格なエンジニアリングの手法が求められます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">明示的な出力契約: プロンプトを API 契約として扱います。次のようなコマンドを追加します。「文字列の有効な JSON 配列を 1 つだけ返してください。マークダウンのコードブロックや会話テキストは含めないでください。」</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">コンテキスト区切り文字: 明示的なラベル（例: </span><code style=\"vertical-align: baseline;\">'- Description: '</code><span style=\"vertical-align: baseline;\">）を付加した文字列連結を使用して、LLM のコンテキストを固定し、高密度のバッチ処理において各フィールドが混同されるのを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エラー発生時の設計: 欠落している情報については、推測するのではなく厳密な null 値を返すようモデルに明示的に指示することで、後続の処理におけるスキーマのハルシネーションを防ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">少数ショット アンカー: プロンプト内で期待される構造の具体的な例を提供して、モデルのアテンション機構をその構造に強力にグラウンディングします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ガバナンス、費用管理、ガードレール</strong></h4>\n<p><span style=\"vertical-align: baseline;\">セマンティック ワークロードを本番環境へ移行するには、運用面での監視が不可欠です。再帰的なバッチ処理アーキテクチャを採用しているため、Gemini に送信されるトークンの合計数は、元のソースデータのトークン数よりも多くなります。コストを抑えるため、</span><code style=\"vertical-align: baseline;\">WHERE</code><span style=\"vertical-align: baseline;\"> 句や </span><code style=\"vertical-align: baseline;\">LIMIT</code><span style=\"vertical-align: baseline;\"> 句による厳格な事前フィルタリングを徹底してください。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、大規模で静的なデータセットを相互参照するワークフローにおいて、BigQuery は Gemini コンテキスト キャッシュをサポートしており、入力トークンの費用と実行レイテンシを削減することが可能です。</span><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code><span style=\"vertical-align: baseline;\"> ユーティリティを使用すると、実行前にクエリのコストを見積もることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">管理者は、</span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> が BigQuery のガバナンス フレームワークに厳格に準拠し、データの引き出しを防止する VPC Service Controls（VPC-SC）をサポートしていることを確認したうえで、安心して運用できます。さらに、バッチ処理中に一時的なエラーが発生した場合でも、この関数はクエリ全体を停止させるのではなく、拒否された行をスキップして処理を継続する「グレースフル デグラデーション」を実行します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">プレビュー版を利用する際の留意事項:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SQL グループごとの最終出力文字列は、1 グループあたり 10,000 トークンまでに厳密に制限されています。簡潔な出力にするようモデルに指示してください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">個々のペイロード行は 10 MiB 以下である必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">マルチモーダル配列を処理する際は、通知なくデータがスキップされないように、1 行あたりの画像アセットを 10 個未満に制限してください。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">安定性を最大限に高めるため、1 回のクエリで処理する行数は最大 2,000 万行、出力する SQL グループ数は最大 1,000 個にとどめることをおすすめします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AI.AGG を実際に使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">利用を始める際の例として、従来の SQL 指標と併せて </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> を活用し、インサイトを合成する方法をご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">マクロレベルのトピック検出</strong></h4>\n<p><span style=\"vertical-align: baseline;\">特定のトップ投稿者の発言内容を要約し、数千件におよぶコメントを簡潔な要約文にまとめます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;WITH top_commenters AS (\\r\\n SELECT\\r\\n   `by` AS author,\\r\\n   `text`\\r\\n FROM `bigquery-public-data.hacker_news.full`\\r\\n WHERE `type` = &#x27;comment&#x27;\\r\\n   AND `by` IN (&#x27;dang&#x27;, &#x27;patio11&#x27;, &#x27;tptacek&#x27;)\\r\\n LIMIT 5000\\r\\n)\\r\\nSELECT\\r\\n author,\\r\\n AI.AGG(\\r\\n   `text`,\\r\\n   &#x27;These are comments written by this user on a tech forum. Tell me what topics this user talks about the most and what their general tone is. Keep it concise.&#x27;\\r\\n ) AS author_persona\\r\\nFROM top_commenters\\r\\nGROUP BY author;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fc27dc3dc50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_PRKEHfd.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">DevOps 向けの自律的な診断レポート（ログ分析）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">標準的な HTTP エラーコードを集計する代わりに、</span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> を活用して数千もの未加工のスタック トレースやログ メッセージを読み取り、マイクロサービス名ごとにグループ化することで、システム障害の定性的な根本原因を特定できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT \\r\\n  service_name,\\r\\n  COUNT(*) AS total_errors,\\r\\n  AI.AGG(\\r\\n    STRUCT(error_code, log_message, stack_trace), \\r\\n    &#x27;Analyze these error logs and stack traces. Provide a concise, two-sentence summary of the primary root cause or pattern causing failures in this service.&#x27;\\r\\n  ) AS diagnostic_summary \\r\\nFROM `my_project.ops_logs.application_errors` \\r\\nWHERE severity = &#x27;CRITICAL&#x27; AND timestamp &gt;= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 24 HOUR)\\r\\nGROUP BY service_name \\r\\nORDER BY total_errors DESC;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fc27dc3e850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">データ ウェアハウスの新たな時代</strong></h4>\n<p><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> により、Google Cloud はペタバイト規模のセマンティック分析の民主化を推進しています。BigQuery のリレーショナル エンジンが持つ決定論的なグループ化機能と、Vertex AI Gemini のマクロな推論機能を融合させることで、エンタープライズ データ ウェアハウスを変革し、過去の指標を蓄積するだけの受動的なリポジトリから、高度で包括的なインテリジェンスを備えたアクティブでセマンティックなランタイムへと進化させています。</span></p>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ データが持つセマンティックな価値を活用する準備はできていますか？Google Cloud コンソールにアクセスして BigQuery のドキュメントを確認し、今すぐ最初のセマンティック集計を実行してみましょう。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">戦略的クラウド エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Pramod Niralakeri</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データ担当クラウド移行コンサルタント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Shruti Malgatti</strong></p></div>"
  "fa2595f77ee415f1097c5135c13ebce5":
    "id": "fa2595f77ee415f1097c5135c13ebce5"
    "title": "自律型エージェントのためのオープン インフラストラクチャを強化"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/open-infrastructure-for-autonomous-agents-comes-to-cncf/"
    "published": "2026-11-18 10:00:00"
    "fetched": "2026-11-19 00:29:43"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 6 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/open-infrastructure-for-autonomous-agents-comes-to-cncf?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI が</span><strong style=\"vertical-align: baseline;\">人間によるスケーリングからエージェントによるスケーリングへ</strong><span style=\"vertical-align: baseline;\">、</span><strong style=\"vertical-align: baseline;\">記録システムからアクション システムへ</strong><span style=\"vertical-align: baseline;\">、</span><strong style=\"vertical-align: baseline;\">単純なリクエストから複雑なエージェント ワークフローへ</strong><span style=\"vertical-align: baseline;\">と移行するにつれ、プラットフォームの基盤となるワークロードは完全に変わっていきます。エージェントは、継続的なステートフル ループで動作します。具体的には、アクションの提案、サブエージェントの起動、サンドボックス内でのコード実行やツール呼び出しを行い、その結果を次のターンに向けてモデルにフィードバックするというプロセスを繰り返します。このループを大規模に実行するには、2010 年代に Kubernetes と Cloud Native Computing Foundation（CNCF）がコンテナの世界にもたらしたような、オープンな基盤と中立的なガバナンスが必要不可欠です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Google 発の 3 つのオープンソース プロジェクトである </span><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</strong></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">gVisor</strong></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL</strong></a><span style=\"vertical-align: baseline;\"> を CNCF に寄贈することになりました。これらのプロジェクトは先月、CNCF サンドボックスに採択されました。また、このオープン スタックを管理された本番環境に導入し、TPU や GPU での活用を加速させるため、</span><strong style=\"vertical-align: baseline;\">Agent Substrate がバージョン 1.0 に到達し、</strong><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate on GKE として一般提供</strong></a><span style=\"vertical-align: baseline;\">が開始されたことも併せて発表いたします。</span></p>\n<p><span style=\"vertical-align: baseline;\">各プロジェクトは現在、コミュニティのメンテナーや独立したビルド インフラストラクチャのもとで CNCF サンドボックスへのオンボーディングを進めており、gVisor はインキュベーション段階への昇格を目指しています。これらのリリースは、CPU、GPU、TPU を問わず、あらゆるクラウド上のあらゆる Kubernetes クラスタで動作するオープンなスタックを以下の方法を通じて提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</strong></a><strong style=\"vertical-align: baseline;\">（GKE で 1.0 および GA として提供開始）による、アイドル状態のコンピュート オーバーヘッドを排除した分離されたエージェント環境のスケーリング:</strong><span style=\"vertical-align: baseline;\"> エージェントはコードやテストを数秒間実行した後、モデルのターン、外部 API、または人間の入力を</span><strong style=\"vertical-align: baseline;\">待ちます</strong><span style=\"vertical-align: baseline;\">。こうした一時停止の間も専用コンテナを維持し続けると、メモリやコンピューティング リソースが占有されてしまいます。Agent Substrate は、ステートフルなエージェント セッションを ID をアクティブなコンピューティングから分離します。アイドル状態のエージェントをストレージにスナップショットとして保存して 500 ミリ秒未満で復元することにより、コンテナ密度を 10 倍に高め、数百万ものサンドボックスの実行を可能にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">gVisor</strong></a><strong style=\"vertical-align: baseline;\"> によるサンドボックス内での信頼できないコードの分離:</strong><span style=\"vertical-align: baseline;\"> エージェントは、レビューされていないコードや外部パッケージを日常的に生成して</span><strong style=\"vertical-align: baseline;\">実行</strong><span style=\"vertical-align: baseline;\">するため、ホスト Linux カーネルを共有する標準的なコンテナはセキュリティ上のリスクとなります。gVisor は、生成されたコードを軽量のユーザー空間アプリケーション カーネル内で分離し、任意の Linux ノード上でコンテナ並みの密度を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL</strong></a><span style=\"vertical-align: baseline;\"> による事後トレーニングとサービングの効率的な分散: 強化学習（RL）でエージェントをトレーニングすることで、開発者は数百万ものサンドボックス化された並列ロールアウトを通じて</span><strong style=\"vertical-align: baseline;\">学習</strong><span style=\"vertical-align: baseline;\">を行うオープンループを構築できます。OpenRL は、Kubernetes 上のプレーンな Python を使用して、セルフホスト型の RL 事後トレーニング ループをオーケストレートします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Substrate で完全に分離されたエージェント環境をスケーリング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントは分離されたコンピュート リソースと厳格なアクセス境界を必要とする一方で、時間の大部分を待機に費やしています。数秒間のコード実行後、モデルが推論したり人間が応答したりする間は処理を一時停止するためです。エージェントが機密性の高い鍵を保持することなく、承認されたツールやサービスにのみアクセスできるようにするには、個別の ID と一元的なポリシー適用ポイントが必要です。標準の Kubernetes では、アクティブな各エージェントに専用の Pod を割り当てると、エージェントがアイドル状態の間もメモリや CPU が占有されてしまいます。また、コントロール プレーンは本来の設計想定を超えた数百万もの永続オブジェクトを追跡せざるを得なくなり、さらに ID が Pod に直接紐付けられるという課題も生じます。それと同時に、ID が Kubernetes Pod と不可分に結び付いていることが、アクセス制御や Secret の管理を著しく複雑にしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Agent Substrate は、ステートフルなエージェントを基盤となるコンピューティングから分離することで、この問題を解決します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクター</strong><span style=\"vertical-align: baseline;\">は、各エージェントのメモリ、ファイル、個別の ID を保持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワーカー</strong><span style=\"vertical-align: baseline;\">は、Kubernetes のウォームプールから提供される再利用可能な実行サンドボックスです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ゲートウェイ</strong><span style=\"vertical-align: baseline;\">は、インバウンドおよびアウトバウンドのアクセス制御を適用し、アクターの ID に基づいてシークレットを挿入することで、機密性の高い鍵をエージェント環境に持ち込ませないようにします。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">エージェントがモデルのターンやツール呼び出しを待つために一時停止すると、Agent Substrate はそのエージェントのメモリとファイルをストレージにスナップショットとして保存し、ワーカーを即座にウォームプールに戻します。次のリクエストが届くと、Agent Substrate は </span><strong style=\"vertical-align: baseline;\">500 ミリ秒未満</strong><span style=\"vertical-align: baseline;\">で利用可能なワーカー上にアクターを復元し、中断したところから正確に再開します。これは例えるなら「家」というよりも「ホテルの部屋」のような仕組みで、街を離れるときに部屋を管理し続けなくても、戻ってきたらすぐに新しい部屋を利用できるイメージです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_s5MbWZe.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Agent Substrate は、ステートフルなアクターとポリシー ゲートウェイを Kubernetes ワーカーのウォームプールから分離することで、アイドル状態のセッションを 500 ミリ秒未満で復元します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2026 年 5 月に一般公開での開発が始まって以来、Agent Substrate プロジェクトは 100 人以上のコントリビューターを擁するまでに成長しました。</span><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Nous Research などの初期デザイン パートナーは、このプラットフォーム上で Hermes Enterprise を構築</span></a><span style=\"vertical-align: baseline;\">しており、</span><a href=\"https://kagent.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">kagent</span></a><span style=\"vertical-align: baseline;\"> をはじめとする他の CNCF プロジェクトでもすでに活用されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、</span><strong style=\"vertical-align: baseline;\">バージョン 1.0 に達したこと</strong><span style=\"vertical-align: baseline;\">は、Agent Substrate が数百万ものサンドボックスにわたる本番環境のワークロードに対応できることを示しています。これは、標準的なコンテナ ランタイムの </span><strong style=\"vertical-align: baseline;\">10 倍の密度</strong><span style=\"vertical-align: baseline;\">を実現し、</span><strong style=\"vertical-align: baseline;\">1 秒あたり 500 回を超える一時停止と再開処理</strong><span style=\"vertical-align: baseline;\">を実行できるということです。</span></p>\n<p><span style=\"vertical-align: baseline;\">その裏側では、エージェントのライフサイクル管理の手順を変えることなく、分離境界として </span><strong style=\"vertical-align: baseline;\">Cloud Hypervisor microVM</strong><span style=\"vertical-align: baseline;\"> または </span><strong style=\"vertical-align: baseline;\">gVisor</strong><span style=\"vertical-align: baseline;\"> を自由に選択できます。Agent Substrate は標準の OCI コンテナを実行するため、Agent Development Kit（ADK）エージェントやステートフルなコーディング環境、生産性向上エージェントと組み合わせてすぐに活用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE 上の Agent Substrate</strong></a><span style=\"vertical-align: baseline;\"> が一般提供となったことで、このランタイムを Google Cloud 上のマネージド機能として実行したり、オープンソース コードを任意の Kubernetes クラスタにデプロイしたりできるようになりました。クラスタを管理することなく、API を通じて専用のマイクロ VM コンピュート サービスを利用したいチームにとって、Agent Substrate は </span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/agent-compute-engine-deep-dive?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Compute Engine</strong></a><span style=\"vertical-align: baseline;\"> を補完する役割を果たします。Agent Compute Engine は、高速なハイバネーションや、評価および RL パイプライン向けの並列環境フォークを特徴とする、Google の Titanium マイクロ VM サービスです。</span></p>\n<p><a href=\"https://spiritt.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SPIRITT</span></a><span style=\"vertical-align: baseline;\"> では、GKE 上の Agent Substrate を基盤として、エージェントが自律的に実務を遂行し、人間がビジョンを導くために協働するプラットフォーム「SPIRITT Workspace」を構築しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「SPIRITT では、すべてのお客様に自律型の AI ワークスペースを提供しています。そこでは、単独のエージェントまたはエージェント群全体が、コードや開発サイクルからマーケティング、運用に至るまで、組織全体のあらゆる実務を構築、実行、デプロイします。GKE 上の Agent Substrate を活用することで、エージェントが安全にコードを実行できる「セキュリティ分離」、独自のランタイムを組み込める「拡張性」、そしてすべてのお客様のエージェントを大規模かつ経済的に運用できる「密度」が手に入ります。」- SPIRITT、CEO、Tamir Magen 氏</span></p>\n<h4><strong style=\"vertical-align: baseline;\">信頼できないエージェント コードを gVisor で分離</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントが「記録システム」から「アクション システム」へと移行すると、生成されたシェルコマンドや中身が確認されていないパッケージを実行するようになります。標準的なコンテナは、ホスト Linux カーネルをノード上の他のすべてのワークロードと共有するため、信頼できないコードを実行するにはリスクが伴います。Hardware microVM は強力な境界を提供し、Agent Substrate はこれをネイティブにサポートします。また、多くのチームは、ベアメタルやネストされた仮想化が利用できない環境でも、標準的な Linux インスタンス上でコンテナ並みの密度を維持しつつ、強力な分離環境を実行できる仕組みを必要としています。</span></p>\n<p><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor</span></a><span style=\"vertical-align: baseline;\">は、Go で記述された軽量なアプリケーション カーネルを通じて、この分離環境を提供します。コンテナとホスト OS の間に位置する gVisor は、ユーザー空間でアプリケーションのシステムコールをインターセプトして処理するため、信頼できないコードがホストカーネルと直接通信することはありません。2018 年に Google によってオープンソース化された gVisor は、GKE Sandbox や Cloud Run の基盤として、毎日数百万ものサンドボックスを実行しています。Google 以外では、</span><a href=\"https://www.anthropic.com/engineering/how-we-contain-claude\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Anthropic</span></a><span style=\"vertical-align: baseline;\"> や</span><a href=\"https://openai.com/index/securing-research-infrastructure-for-advanced-ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenAI</span></a><span style=\"vertical-align: baseline;\"> がコード実行の分離に、</span><a href=\"https://modal.com/docs/guide/security\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Modal</span></a><span style=\"vertical-align: baseline;\"> や</span><a href=\"https://www.snowflake.com/en/blog/engineering/rebuild-snowpark-execution-sandbox-with-gvisor/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Snowflake</span></a><span style=\"vertical-align: baseline;\"> が実行サンドボックスの基盤として、そして</span><a href=\"https://gvisor.dev/blog/2021/12/02/running-gvisor-in-production-at-scale-in-ant/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Ant Group</span></a><span style=\"vertical-align: baseline;\"> や</span><a href=\"https://gvisor.dev/blog/2026/04/23/scaling-agentic-rl-sandboxes-to-the-millions-with-gvisor-at-tencent/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Tencent</span></a><span style=\"vertical-align: baseline;\"> が本番環境での大規模な運用に gVisor を活用しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">gVisor がエージェント フリートに最適な理由は、主に次の 3 つの機能にあります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高いコンテナ密度と柔軟なメモリ:</strong><span style=\"vertical-align: baseline;\"> RAM の固定ブロックを事前に割り当てる VM とは異なり、gVisor はワークロードに応じてメモリが動的に伸縮するコンテナ プロセスモデルを採用しています。そのため、1 つのノードにより多くのエージェントを集約でき、エージェントあたりのコストを抑えることが可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GPU、TPU、スナップショットのネイティブ サポート:</strong><span style=\"vertical-align: baseline;\"> gVisor は </span><a href=\"https://gvisor.dev/docs/user_guide/gpu/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GPU</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://gvisor.dev/docs/user_guide/tpu/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://gvisor.dev/docs/user_guide/checkpoint_restore/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">チェックポイント / 復元</span></a><span style=\"vertical-align: baseline;\">をネイティブにサポートしているため、エージェントはサンドボックス内からアクセラレータにアクセスし、アイドル時には一時停止することができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Linux が動作するあらゆる環境に対応:</strong><span style=\"vertical-align: baseline;\"> ネストされた仮想化を必要としないため、gVisor はクラウドかローカルかを問わず、あらゆる Linux ノード上で同じ方法でデプロイできます。</span><a href=\"https://northflank.com/blog/gpu-sandboxes\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">たとえば </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Northflank</span></a><span style=\"vertical-align: baseline;\"> は、ネストされた仮想化が利用できない環境において、gVisor を使用して GPU ワークロードをサンドボックス化しています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">gVisor を CNCF に寄贈することで、コミュニティが長年直面してきたパフォーマンスの壁が取り払われます。Google を含むサンドボックス インフラストラクチャ プロバイダはいずれも、gVisor の I/O パフォーマンスをネイティブ Linux に近づけるためのホストカーネル パッチを独自に適用しています。しかし、これまではプロジェクトが単一ベンダーの所有であったため、アップストリーム Linux のメンテナーはこれらのパッチのマージを見送っていました。中立的なガバナンスに移行することで、こうしたカーネルの最適化をアップストリームに反映させる道が開かれます。これにより、あらゆるビルダーが特別な設定なしでネイティブに近いパフォーマンスを享受できるようになります。この動きを受け、</span><a href=\"https://gvisor.dev/blog/2026/10/02/gvisor-cncf/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ant Group、Modal、Tines が gVisor のメンテナーに加わることを表明</span></a><span style=\"vertical-align: baseline;\">し、OpenAI、Tencent、NVIDIA もコントリビューションを継続することが決まりました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">OpenRL で Kubernetes 上で RL 事後トレーニングをスケーリング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">本番環境でエージェントを実行するサンドボックスは、強化学習（RL）でエージェントをトレーニングするために必要な環境とまったく同じものです。現在、フロンティア モデルの大部分の機能向上は RL 事後トレーニングによってもたらされています。これは、実際のツール内で数百万回ものマルチターン ロールアウトを実行し、その結果をスコアリングしてモデルの重みを更新するプロセスです。このループを自前で構築しようとすると、通常はトレーニング アルゴリズムに着手する前に、モノリシックな RL フレームワークをフォークし、分散された重み転送をデバッグすることに追われてしまいます。</span></p>\n<p><a href=\"https://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL</span></a><span style=\"vertical-align: baseline;\"> は、以下の特長を備えたシンプルなセルフホスト型の Python 事後トレーニング ループを Kubernetes クラスタに直接提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">シンプルな Python プリミティブ:</strong><span style=\"vertical-align: baseline;\"> 重みやデータは自社のクラスタに保持したまま、Tinker 互換の API を通じて 4 つのクリーンなプリミティブ（</span><code style=\"vertical-align: baseline;\">sample</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">forward_backward</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">optim_step</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">save_state</code><span style=\"vertical-align: baseline;\">）を使用するだけで、トレーニング ループを記述できます。既存の </span><code style=\"vertical-align: baseline;\">tinker-cookbook</code><span style=\"vertical-align: baseline;\"> レシピはそのまま実行でき、LoRA アダプターとフルパラメータ ファインチューニングの両方をサポートしています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プラグイン対応エンジンと Kubernetes スケジューリング:</strong><span style=\"vertical-align: baseline;\"> OpenRL は、Kubernetes の動的リソース割り当て（DRA）を使用してアクセラレータ プールを分割し、共有プール上での RL ワークロードの実行をオーケストレートします。プラグイン対応のアーキテクチャにより、トレーニング用の </span><code style=\"vertical-align: baseline;\">PyTorch</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">AutoModel</code><span style=\"vertical-align: baseline;\"> やサンプリング用の </span><code style=\"vertical-align: baseline;\">vLLM</code><span style=\"vertical-align: baseline;\"> などの標準エンジンを使用できます。Gemma と Qwen はデフォルトで検証済みであり、TPU のサポートもロードマップに含まれています。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">OpenRL は、</span><a href=\"https://llm-d.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">llm-d</strong></a><span style=\"vertical-align: baseline;\"> とも連携します。llm-d は Red Hat、Google Cloud、IBM Research、CoreWeave、NVIDIA によって設立され、</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/llm-d-1-0-an-open-source-stack-for-distributed-inference?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">最近バージョン 1.0 に到達した</span></a><span style=\"vertical-align: baseline;\"> CNCF の分散推論および RL プロジェクトです。この連携により、RL の両フェーズを通じてアクセラレータをフル稼働させることができます。この連携において、llm-d は以下の機能を提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プレフィックスを考慮したロールアウト ルーティング:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://llm-d.ai/docs/dev/architecture/router\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d ルーター</span></a><span style=\"vertical-align: baseline;\">は、一致する KV キャッシュ プレフィックスを保持しているサンプラーに、マルチターンのロールアウトをルーティングすることで、重複するプレフィル コンピューティングを削減します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">トレーニングとサンプリング間での GPU タイムスライス:</strong><span style=\"vertical-align: baseline;\"> RL トレーニングでは、サンプラーとトレーナーが交互に動作するため、一方のチップ群が稼働している間、もう一方はアイドル状態になります。OpenRL は、</span><a href=\"https://github.com/llm-d-incubation/llm-d-rl-time-slicing\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d のタイムスライス機能</span></a><span style=\"vertical-align: baseline;\">を活用してサンプリングとトレーニングで同じ物理 GPU を共有します。これにより、Agent Substrate がアイドル状態の CPU や RAM を再利用するのと同様に、アクセラレータの空きサイクルを回収して有効活用できます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_oAroVYF.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>OpenRL は Kubernetes 上でシンプルな Python による RL ループを動かし、Agent Substrate サンドボックス内でエピソードを実行します。同時に llm-d がロールアウトのルーティングやアクセラレータのタイムスライス処理を行います。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">OpenRL は、このスタックの中で最も新しいレイヤです。2 月にリサーチ プレビューとして開始されたばかりですが、意図的に早い段階で CNCF に寄贈することにしました。このプロジェクトが目指すのは、あらゆるアクセラレータ上のあらゆるモデルに対応する 1 つのレシピを確立することであり、これは 1 社だけで成し遂げられるものではありません。これを実現するには、アクセラレータ（NVIDIA、AMD、Intel、TPU）、推論エンジン（</span><code style=\"vertical-align: baseline;\">llm-d</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">vLLM</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">SGLang</code><span style=\"vertical-align: baseline;\">）、トレーニング フレームワーク、そして Gemma や Qwen をはじめとするオープン ウェイト モデルを手掛けるコミュニティや開発者の協力が不可欠です。設計が固定化される前に中立的な CNCF ガバナンスを確立しておくことで、誰もが開発に参画できる余地が生まれます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">今、CNCF を選ぶ理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AI エージェントのセキュリティと効率性を高めるには、ランタイム、スケジューラ、コンパイラ、ハードウェアに至る包括的な共同設計が不可欠です。この 1 年で、低コストかつ安全に隔離されたサンドボックス環境と、オープンな事後トレーニング インフラストラクチャの必要性がきわめて明確になりました。Agent Substrate、gVisor、OpenRL を CNCF に寄贈することは、オープンなコラボレーションと共同投資に対する Google の姿勢を改めて示すものです。ベンダーに依存しない所有権が確立されることで、クラウド プロバイダ、ハードウェア ベンダー、独立系ソフトウェア企業がエージェント ワークロードの今後の発展に等しく参画できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回の寄贈は、Kubernetes を寄贈したときと同様に、これらのプロジェクトを通じたエージェント ワークロードの開発と導入を加速させるものになると確信しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">KubeCon で Google のブースにお立ち寄りください</strong></h4>\n<p><span style=\"vertical-align: baseline;\">11 月 9～12 日にソルトレイクシティで開催される </span><a href=\"https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">KubeCon + CloudNativeCon North America</span></a><span style=\"vertical-align: baseline;\"> にぜひご参加ください。各セッションや Google Cloud ブースで、Agent Substrate、OpenRL、gVisor について詳しくご紹介します。また、Modal、Anyscale、Tecton といったコミュニティ パートナーからも、このオープン スタックが各社のエージェント ワークロードにどのような価値をもたらすかについて、まもなく情報発信が行われる予定です。それまでの間、まずは以下のリソースからご確認ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CNCF サンドボックスのアプリケーションをチェックする:</strong><span style=\"vertical-align: baseline;\"> gVisor</span><a href=\"https://github.com/cncf/sandbox/issues/521\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">#521</span></a><span style=\"vertical-align: baseline;\">、Agent Substrate</span><a href=\"https://github.com/cncf/sandbox/issues/523\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">#523</span></a><span style=\"vertical-align: baseline;\">、OpenRL</span><a href=\"https://github.com/cncf/sandbox/issues/518\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">#518</span></a><span style=\"vertical-align: baseline;\">、および同じコホートの KubeRay</span><a href=\"https://github.com/cncf/sandbox/issues/525\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">#525</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">試してみる:</strong><a href=\"http://ate.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ate.dev</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gvisor.dev</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">openrl.dev</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE でエージェントを今すぐ実行:</strong><a href=\"https://docs.cloud.google.com/kubernetes-engine/ai-ml/about-agent-substrate\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE 上の Agent Substrate</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/sandbox-pods\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE Sandbox</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">詳細を読む:</strong><a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE 上の Agent Substrate</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://gvisor.dev/blog/2026/10/02/gvisor-cncf/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gVisor の CNCF への移行</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://opensource.googleblog.com/2026/06/introducing-openrl-a-self-hosted-post-training-api-for-fine-tuning-llms.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL のご紹介</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">オーケストレーションおよび Kubernetes プロダクト管理担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Drew Bradstock</strong></p></div>"
