  "be76e80e0954072b813e4380b729150f":
    "id": "be76e80e0954072b813e4380b729150f"
    "title": "Delivery: SOAP を用いて LLM が導いた発見を、ガバナンスの下で「届ける」"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/delivering-the-insights-derived-by-llms-using-soap-under-a-governance-framework/"
    "published": "2026-11-18 09:00:00"
    "fetched": "2026-11-18 14:58:40"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">利用している主なサービス・ソリューション</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Products Used:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker / LookML</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバー（プレビュー版）</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/looker/docs/connect-ide-to-looker-using-mcp-toolbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps（プレビュー版）</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.cloud.google.com/gemini/docs/conversational-analytics-api/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics API</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Solutions Used:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAP Architecture</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/solutions/data-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Analytics &amp; AI Platform</span></a></p>\n</li>\n</ul>\n<hr />\n<p><span style=\"vertical-align: baseline;\">「9 月と 10 月の F1層 と F2層 の売上を比べて、差が生まれた理由を教えて」。こう問いかければ、LLM は数分で集計を終え、グラフまで描いてくれます。LLM を使ったデータ分析は、いまや当たり前になりつつあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">ところが、その発見を誰かに届けようとした瞬間、話は変わります。手元に残るのは、データが埋め込まれた HTML ファイルや PNG 画像、チャットに貼り付けたスクリーンショットです。せっかくの発見は 1 人のチャット履歴に埋もれるか、本来の権限を離れて社内を漂流していきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">本稿では、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAP Architecture</span></a><span style=\"vertical-align: baseline;\"> で示した「つなぐ」「意味を与える」「働かせる」に続く 4 つ目の要素として、</span><strong style=\"vertical-align: baseline;\">「届ける/共有する」</strong><span style=\"vertical-align: baseline;\"> をご紹介します。AI エージェントが導いた発見を、ファイルではなく Looker 上のガバナンスされたコンテンツとして届ける。そのためのリファレンス アーキテクチャです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_WBEKm2j.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">共有は、まだ「ファイル」のまま</span></h3>\n<p><span style=\"vertical-align: baseline;\">LLM による分析が広がるほど、共有の課題は 2 つの立場から表面化しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">分析する人にとっての課題</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">深掘りできない - 受け取った画像は固定されています。「では地域別には？」と思っても、受け手はゼロから自分で問い直すしかありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">数字を信頼できない - どのデータを、どの「売上」の定義で集計したのか。出所の記録はファイルに残りません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">すぐに古くなる - ファイルはその時点のスナップショットです。来月には、誰かが同じ分析をやり直すことになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">誰に見せてよいか分からない - 判断に迷った結果、無造作に共有してしまうか、共有そのものをあきらめてしまいます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">データを守る人にとっての課題</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データがファイルに埋め込まれる - HTML や画像が保持しているのは、クエリではなくデータそのものです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アクセス制御が引き継がれない - 行レベルや列レベルのセキュリティ、データ マスキングは、コピーされた時点で効力を失います。多くの場合、本人に悪意はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">回収も監査もできない - メール、チャット、共有ドライブに広がったコピーは、異動や退職のタイミングで取り消すことができず、誰が閲覧したかの記録も残りません。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">いま利用者の前にある選択肢は、ファイルやスクリーンショットで「簡単だが危険」に共有するか、データ チームにダッシュボードを依頼して「安全だが遅い」道を選ぶか、の二択です。そして、日々生まれる問いの大半は、後者にたどり着く前に消えていきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">必要なのは、その間にある 3 つ目の選択肢、「簡単で、しかも安全」 な共有です。</span></p>\n<h3><span style=\"vertical-align: baseline;\">原則：可視化を「データ」として共有しない</span></h3>\n<p><span style=\"vertical-align: baseline;\">「届ける/共有する」の考え方は、1 つの原則に集約されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">可視化を「データ」として共有しない。ガバナンスされた「定義」として共有する。</strong></p>\n<p><span style=\"vertical-align: baseline;\">Looker のダッシュボードが保存しているのは、データの行ではなく、クエリとチャートの定義です。データは閲覧者がダッシュボードを開いた瞬間に、その閲覧者の権限で取得されます。そのため、共有する人が「この人に見せてよいか」を判断する必要はありません。システムが閲覧者ごとに判断します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ガバナンスは、共有を妨げるものではありません。共有を簡単にするものです。</span></p>\n<h3><span style=\"vertical-align: baseline;\">リファレンス アーキテクチャ：エージェントは、ファイルではなく Looker に届ける</span></h3>\n<p><span style=\"vertical-align: baseline;\">「届ける/共有する」では、AI エージェントが分析の最後に HTML ファイルを書き出す代わりに、Looker のコンテンツを作成します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_KQYwbOA.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">入口はどのエージェントでも - Gemini Enterprise 上のデータ エージェントでも、Antigravity や Claude Code などのコーディング エージェントでもかまいません。SOAP で整理した「アドホック分析」と「エンジニアリング分析」のペルソナが、そのまま対象になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Looker MCP サーバーで接続 - エージェントは </span><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバー</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）や </span><a href=\"https://docs.cloud.google.com/looker/docs/connect-ide-to-looker-using-mcp-toolbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases</span></a><span style=\"vertical-align: baseline;\"> を通じて Looker に接続し、LookML のセマンティック レイヤを経由してクエリを実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">成果物は Looker コンテンツ - </span><code style=\"vertical-align: baseline;\">make_dashboard</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">add_dashboard_element</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">add_dashboard_filter</code><span style=\"vertical-align: baseline;\"> といったツールでダッシュボードを組み立てます。エージェントが受け手に渡すのは、ファイルではなくリンクです。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">受け手は、自分の権限で見る - リンクを開いた受け手には、その人がアクセスできるデータだけが表示されます。フィルタを変えて深掘りしたり、同じ Explore に対して追加の質問を投げかけたりすることもできます。</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">ウォークスルー：「F1層 と F2層 の売上差の理由は？」</span></h3>\n<p><span style=\"vertical-align: baseline;\">冒頭の問いを例に、エージェントの動きを追ってみます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">比較する - Looker のクエリで月ごとにピボットし、表計算で差額と増減率を求めます。使われるのは、LookML で一元管理された「売上」の定義です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">深掘りする - カテゴリ、チャネル、地域、注文数と平均単価といった切り口で、複数のクエリを実行して差を分解します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">理由を見つける - 例えば、BigQuery ML の</span><a href=\"https://docs.cloud.google.com/bigquery/docs/contribution-analysis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">貢献度分析（Contribution Analysis）</span></a><span style=\"vertical-align: baseline;\">を使えば、差を最もよく説明するセグメントの組み合わせを自動的に順位付けできます。結果は、ガバナンスされた BigQuery のデータセットに書き込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">届ける - KPI、推移、要因、インサイトの一覧を並べたダッシュボードを Looker 上に作成し、リンクを共有します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">上司や同僚がそのリンクを開くと、同じ定義に基づく数字を、それぞれ自分の権限で確認できます。発見は、届いた先でも生き続けます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">LookML がなくても始められる：3 つのパターン</span></h3>\n<p><span style=\"vertical-align: baseline;\">「LookML が整備されていないと、この仕組みは使えないのでは」という疑問もあるでしょう。「届ける/共有する」は、セマンティック レイヤの整備状況に応じて、3 つのパターンを使い分けられるよう設計しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">パターン B：結果ストア - あらかじめ汎用的な LookML ビューを 1 つ用意し、固定スキーマの BigQuery テーブルを参照させます。エージェントは分析結果をこのテーブルに書き込むだけで、分析ごとに LookML を変更する必要はありません。既存の LookML がゼロでも、初日から使えます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">パターン A：エージェントが書く LookML - エージェントが Knowledge Catalog や </span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Knowledge Format（OKF）</span></a><span style=\"vertical-align: baseline;\">のナレッジを手がかりに、サンドボックスのプロジェクトにビューと Explore を生成します。検証とレビューを経てデプロイすれば、ライブなデータで深掘りできるダッシュボードになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Looker Data Apps（プレビュー版） - 定型のダッシュボードでは表現しきれない可視化は、</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps</span></a><span style=\"vertical-align: baseline;\"> で実現できます。コーディング エージェントが自由なレイアウトのアプリを作成し、Looker 上で公開します。クエリは LookML を経由し、閲覧者の権限で実行されます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">まずはパターン B で始め、繰り返し使われる分析をパターン A へ、さらに公式の LookML へと昇格させていく。アドホックな発見が、組織のセマンティック レイヤを育てていくライフサイクルです。</span></p>\n<p><span style=\"vertical-align: baseline;\">かつては熟練した開発者が必要だった LookML も、エージェントが書き、人が Git でレビューする時代になりました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">権限は、新しく作らない</span></h3>\n<p><span style=\"vertical-align: baseline;\">SOAP では「権限はエージェントのために新設するものではなく、既存のアクセス制御がそのまま適用される」と述べました。「届ける/共有する」でも、この考え方は変わりません。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェントから Looker まで - Looker MCP サーバーは OAuth 2.1 による認証を採用しており、エージェントは認証したユーザーの Looker のロールと権限を引き継ぎます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Looker から BigQuery まで - BigQuery 接続で OAuth を利用すれば、クエリは閲覧者本人の ID で実行されます。BigQuery の</span><a href=\"https://docs.cloud.google.com/bigquery/docs/row-level-security-intro\"><span style=\"text-decoration: underline; vertical-align: baseline;\">行レベルのセキュリティ</span></a><span style=\"vertical-align: baseline;\">、ポリシータグ、データ マスキングは、エージェントが生成した LookML に対してもそのまま適用されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">管理者による統制 - Looker MCP サーバーのツールは管理者が 1 つずつ有効化でき、利用状況は System Activity や Cloud Audit Logs で確認できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">エージェントのために共有の管理者キーを用意する必要はありません。AI に強い権限を渡すのではなく、ユーザー本人として動かすことが、安全な共有の前提になります。</span></p>\n<h3><span style=\"vertical-align: baseline;\">「届ける/共有する」がもたらすもの</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">分析する人には - 発見をリンク 1 つで共有でき、受け手はそこから深掘りを続けられます。「誰に見せてよいか」に悩む必要もありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データを守る人には - データはファイルとして持ち出されず、閲覧のたびに権限が評価されます。コンテンツの所在、取り消し、監査を一元的に管理できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">組織には - 個人のチャット履歴に埋もれていた発見が、共有され、検証され、やがて公式の指標へと育っていきます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">S3 に置いたままのデータを BigQuery でゼロコピーで分析し、Looker を通じて閲覧者のもとに届ける。データは、権限を持つ人の目に触れるまで動きません。</span></p>\n<h3><span style=\"vertical-align: baseline;\">次のステップ</span></h3>\n<p><span style=\"vertical-align: baseline;\">最初の一歩は、エージェントの出力先を「ファイル」から「Looker」に変えることです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SOAP Architecture の全体像は、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのブログ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェントから Looker に接続するには、</span><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバーのドキュメント</span></a><span style=\"vertical-align: baseline;\">と </span><a href=\"https://docs.cloud.google.com/looker/docs/connect-ide-to-looker-using-mcp-toolbox\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MCP Toolbox for Databases での接続手順</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">自由なレイアウトの可視化は、</span><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps のドキュメント</span></a><span style=\"vertical-align: baseline;\">から試せます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">差の理由を自動で見つける方法は、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/contribution-analysis\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery ML の貢献度分析</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">発見は、届いてはじめて価値になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">分析は、LLM で。共有は、Looker で。</span></p>\n<p><strong style=\"vertical-align: baseline;\">関連リンク・次のステップ</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/soap-architecture-turning-data-stored-in-s3-into-a-foundation-for-ai-agents-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SOAP Architecture: S3 に眠るデータを、Google Cloud で AI エージェントの基盤に変える</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/looker/docs/mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker MCP サーバー</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/looker/docs/data-apps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Data Apps</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">著者・コントリビューター紹介</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">執筆者:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kuma Arakawa: Senior Customer Engineer</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Annie Jihyeon Lee: Business Intelligence Sales Specialist </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Yu Yamada: Data Analytics Specialist Tech Lead</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Akira Igarashi: Data Analytics Specialist Sales Manager</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Mei Sakurai: Head of Data Analytics Specialist Customer Engineering, Japan</span></p>\n</li>\n</ul>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お問い合わせ:</strong><span style=\"vertical-align: baseline;\"> Google Cloud のデータ分析・AI エージェント基盤導入に関するご相談は、担当営業またはカスタマー エンジニアまでお気軽にお問い合わせください。</span></p>\n</li>\n</ul></div>"
