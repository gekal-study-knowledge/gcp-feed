    "summary": "<h2 class=\"release-note-product-title\">NetApp Volumes</h2>\n<h3>Announcement</h3>\n<p>Through December 31, 2026, Google Cloud NetApp Volumes sends email notifications\nto the Google group for NetApp Volumes maintenance, in addition to\n<a href=\"https://docs.cloud.google.com/unified-maintenance/docs/overview\">Unified Maintenance</a> alerts.\nAfter December 31, 2026, NetApp Volumes no longer sends email notifications to\nthe Google group, and Unified Maintenance is the only source of planned\nmaintenance notifications.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/netapp/volumes/docs/monitor/maintenance-events\">Monitor and plan for maintenance events</a>.</p>\n<h3>Feature</h3>\n<p>Google Cloud NetApp Volumes is integrated with\n<a href=\"https://docs.cloud.google.com/unified-maintenance/docs/overview\">Unified Maintenance</a>. This integration\nsupports the Flex Unified, Flex File, Standard, Premium, and Extreme service\nlevels.</p>\n<p>You can view upcoming and past planned maintenance events for your storage pools\nin Cloud Hub, and track event logs and configure automated alerts in Cloud\nLogging. For more information, see\n<a href=\"https://docs.cloud.google.com/netapp/volumes/docs/monitor/maintenance-events\">Monitor and plan for maintenance events</a>.</p>"
