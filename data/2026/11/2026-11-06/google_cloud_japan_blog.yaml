  "ba226670d75af3ae0f62185a2114b3c5":
    "id": "ba226670d75af3ae0f62185a2114b3c5"
    "title": "Oracle AI Database@Google Cloud の最新イノベーションでエージェント型エンタープライズを強化"
    "link": "https://cloud.google.com/blog/ja/products/databases/oracle-ai-databasegoogle-cloud-whats-new-at-oracle-ai-world/"
    "published": "2026-11-06 11:00:00"
    "fetched": "2026-11-06 16:40:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 28 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/oracle-ai-databasegoogle-cloud-whats-new-at-oracle-ai-world?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">数十年にわたり、グローバル サプライ チェーンや会計台帳から請求エンジンに至るまで、企業のコア オペレーションは Oracle データベースのパフォーマンスとトランザクションの整合性に依存してきました。今回、ラスベガスで開催された</span><a href=\"https://www.oracle.com/ai-world/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle AI World</span></a><span style=\"vertical-align: baseline;\"> において、Google Cloud と Oracle は、Oracle AI Database@Google Cloud、</span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google の Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\">、Gemini Enterprise のインテグレーションを深化させることで、AI コンピューティングとインフラストラクチャ（Oracle Cloud Infrastructure を介して Google TPU を利用可能にすることを含む）、エンタープライズ データ、エージェント型 AI にわたる AI スタック全体でパートナーシップを拡大することを発表しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Oracle のミッション クリティカルな運用データとアプリケーションを Google Cloud のデータおよび AI エコシステム（BigQuery、Gemini Enterprise、Gemini モデルなど）と統合することで、企業は静的な分析を超えて、自律的なエージェント ワークフローを構築できます。このアーキテクチャは、従来のデータサイロを解消し、エージェントが実世界のアクションを推進するために必要となる基礎的なエンタープライズ データに、直接的、安全、かつリアルタイムにアクセスできるようにします。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">エージェント型 AI の基盤となる構成要素</strong></h3>\n<p><span style=\"vertical-align: baseline;\">本番環境グレードのエージェント型 AI を実現するには、モデルの基本的な能力だけでは不十分です。強力なデータベース接続、統合されたデータ ガバナンス、豊富なセマンティック コンテキストが、まとまりのある基盤として連携していることが必要です。Google Cloud Next '26 で初めて発表された以下のコア機能は、Oracle AI Database@Google Cloud で会話型インテリジェンス、エンドツーエンドのガバナンス、自律型エージェント環境を構築するための構成要素として機能します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/oracle/database/docs/use-oracledatabase-mcp\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Data API を使用したリモート MCP サーバー</strong></a><span style=\"vertical-align: baseline;\">: IAM によって管理される ExecuteSQL Data API を活用した、Oracle ワークロード向けのリモート Model Context Protocol（MCP）サーバーが一般提供されました。これらを組み合わせることで、AI エージェント、Google Cloud サービス、エンタープライズ アプリケーションが SQL を安全に実行し、Oracle データベースと直接やり取りすることを可能にする、統合され、標準化されたインターフェースが提供されます。この機能は、Secret Manager を介してデータベース認証情報を自動的に解決し、Google Cloud IAM ポリシーを適用することで、カスタムの natural-language-to-SQL（自然言語から SQL への変換）ミドルウェア、踏み台 VM、平文パスワードを不要にします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/introduction\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog のインテグレーション</strong></a><span style=\"vertical-align: baseline;\">: Google Cloud の Knowledge Catalog のインテグレーション（現在プレビュー版）により、Oracle データベースとより広範な Google Agentic Data Cloud にわたり、エンタープライズ メタデータの検出とガバナンスが統合されます。スキーマとビジネス メタデータを自動的にカタログ化することで、組織は一貫したアクセス制御を適用し、データの来歴を追跡し、エージェントが複雑な運用データに対して正確な推論を行うために必要となる豊富なセマンティック コンテキストを提供できるようになります。この機能に登録するには、</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf3gSDItjmOSsusMr-3opC8Yzfq8cc1mo8onkNTnyuDVAiIJA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらをクリック</span></a><span style=\"vertical-align: baseline;\">してください。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Oracle AI Database@Google Cloud 向け Gemini コネクタ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">前述の基本機能をそのまま基盤として、</span><strong style=\"vertical-align: baseline;\">Oracle AI Database@Google Cloud 向け Gemini コネクタ</strong><span style=\"vertical-align: baseline;\">のプレビュー版もリリースします。このネイティブなインテグレーションにより、ビジネス ユーザーとデベロッパーは、Gemini アプリ内で自然言語クエリを使用して、Oracle AI Database@Google Cloud 上の Oracle データベースを直接操作できるようになります。バックグラウンドでは、Gemini が Knowledge Catalog を自動的に活用して、各ユーザーがアクセスを許可されている統制された Oracle データのみを対象に、検出、検索、回答のグラウンディングを行います。これにより、企業のセキュリティを損なうことなく、複雑な運用データベースを直感的で会話形式のエクスペリエンスに変えることができます。この機能に登録するには、</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf3gSDItjmOSsusMr-3opC8Yzfq8cc1mo8onkNTnyuDVAiIJA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらをクリック</span></a><span style=\"vertical-align: baseline;\">してください。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Oracle in Gemini と Gemini in Oracle</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud と Oracle は、直接のデータベース クエリにとどまらず、より広範なアプリケーション レイヤにわたってエージェント ワークフローを連携させています。これにより、Oracle データを Gemini Enterprise に取り込み、Gemini モデルを Oracle アプリケーション内にネイティブに組み込んでいます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle in Gemini Enterprise:</strong><span style=\"vertical-align: baseline;\"> このたび提供が開始された Oracle in Gemini Enterprise では、会話型分析、クロスクラウド データベース コネクタ、ドメイン認識エージェントが導入されています（新しい Oracle AI Database Agent in Gemini Enterprise も含まれます）。135 を超える事前構築済みの運用スキルとデベロッパー スキル、そして平文の認証情報を一切使用しない標準化された MCP 接続を基盤として、企業はカスタム SQL や脆弱なミドルウェアを使用することなく、JD Edwards、E-Business Suite、NetSuite、Oracle Fusion にわたってマルチエージェント ワークフローをオーケストレートできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle アプリケーションにおける Gemini モデル</strong><span style=\"vertical-align: baseline;\">: 同時に、Gemini のフロンティア推論が </span><a href=\"https://www.oracle.com/news/announcement/oracle-to-make-gemini-models-available-2026-07-30/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle Fusion AI Agent Studio</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.oracle.com/news/announcement/oracle-extends-fusion-agentic-applications-with-introduction-of-fusion-claw-2026-09-29/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Fusion Claw</span></a><span style=\"vertical-align: baseline;\">、Oracle Fusion Applications、NetSuite に直接組み込まれます。これにより、Oracle データベース インテリジェンスと Gemini のエージェント機能が組み合わされ、トランザクション記録システム全体で実行が自動化されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パートナー提供のエージェント ブループリント:</strong><span style=\"vertical-align: baseline;\"> 組織がこれらの統制されたワークフローを迅速にデプロイできるよう、Google Cloud と Oracle は、</span><a href=\"https://digitalfoundations.argano.com/jde-resolution-studio-on-google-cloud-marketplace#gemini-agents\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Argano</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.prnewswire.com/news-releases/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Automus</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.calfus.com/resources/category/press-release/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Calfus</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.hcltech.com/press-release\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">HCL</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://newsroom.ibm.com/announcements\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">IBM</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.infosys.com/newsroom/press-releases.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Infosys</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.ltm.com/insights/povs/from-legacy-infrastructure-constraint-to-an-intelligent-erp-platform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LTM</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.pythian.com/news/pythian-announces-integration-with-gemini-to-help-accelerate-cloud-migration-for-oracle-applications?hs_preview=tpYkZgFR-225190305614\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pythian</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.tcs.com/who-we-are/newsroom\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TCS</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.tessell.com/blog/tessell-agentic-database-lifecycle-management-gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Tessell</span></a><span style=\"vertical-align: baseline;\"> といった主要なパートナーやグローバル システム インテグレーターと連携しています。これらのパートナーは、本番環境グレードのエージェント アーキテクチャ向けに、事前構築済みの運用スキル、カスタム MCP コネクタ、業種別ブループリントを提供しています。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">レイクハウス、ストリーミング、連携による選択肢の拡充</strong></h3>\n<p><span style=\"vertical-align: baseline;\">運用する Oracle データを BigQuery や AI ワークロードに接続する際、アーキテクチャの優先事項、レイテンシのしきい値、ガバナンス要件は企業ごとに異なります。Google Cloud と Oracle は、画一的な統合パターンを規定するのではなく、お客様がワークロードとユースケースに最適なアプローチを選択または組み合わせることができるよう、データ統合の選択肢を幅広く提供しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">Google Cloud ボーダーレス Lakehouse と Oracle AI Lakehouse の双方向性</strong></p>\n<p><span style=\"vertical-align: baseline;\">最新のエンタープライズ データ アーキテクチャは、マルチクラウド化が進んでおり、オープン スタンダードをその基盤としています。Google Cloud と Oracle は、戦略的パートナーシップを基盤として、オープンな Apache Iceberg 標準を活用したクロスクラウドのデータ相互運用をサポートする重要なイノベーションを今年発表しました。それは、</span><strong style=\"vertical-align: baseline;\">Google のボーダーレス Lakehouse と</strong><a href=\"https://www.oracle.com/autonomous-database/autonomous-ai-lakehouse/\" rel=\"noopener\" target=\"_blank\"><strong style=\"vertical-align: baseline;\"> </strong><strong style=\"text-decoration: underline; vertical-align: baseline;\">Oracle AI Lakehouse</strong></a><span style=\"vertical-align: baseline;\"> のインテグレーションです。</span></p>\n<p><span style=\"vertical-align: baseline;\">この取り組みにより、ボーダーレス Lakehouse は、双方のプラットフォームでサポートされているカタログとストレージを活用して、任意のパブリック クラウドやオンプレミス環境にある、Oracle AI Lakehouse によって作成された Apache Iceberg テーブルを読み取ることができるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><strong style=\"vertical-align: baseline;\">Google Cloud ボーダーレス Lakehouse への Oracle のアクセス（プレビュー版）</strong><span style=\"vertical-align: baseline;\">により、このインテグレーションをさらに進化させ、完全な双方向性を実現しました。Oracle Autonomous AI Database と Google のボーダーレス Lakehouse（BigQuery と Managed Spark を活用）は、Google Cloud Storage 内の共有 Apache Iceberg テーブルに対して直接クエリを実行し、書き込み / DML オペレーションを実行できるようになりました。これにより、ETL やデータ レプリケーションの必要性はまったくなくなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">DBMS_CATALOG を介して Oracle に統合された Lakehouse ランタイム REST カタログを利用することで、この双方向のインテグレーションは、オープン スタンダードのストレージ フレームワークを提供すると同時に、分析チーム（BigQuery と Gemini を使用）と運用チーム（Oracle SQL を使用）が、統合された信頼できる唯一の情報源に基づいて連携することを可能にします。この機能に登録するには、</span><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf3gSDItjmOSsusMr-3opC8Yzfq8cc1mo8onkNTnyuDVAiIJA/viewform\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらをクリック</span></a><span style=\"vertical-align: baseline;\">してください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">OCI GoldenGate による 1 秒未満の CDC ストリーミング</strong></p>\n<p><span style=\"vertical-align: baseline;\">大規模な分析や AI のために、ミッション クリティカルな運用データを BigQuery 内に継続的に反映させたい組織にとって、リアルタイムの変更データ キャプチャ（CDC）は、即座に競争上の優位性をもたらします。</span><a href=\"https://docs.cloud.google.com/oracle/database/docs/deploy-and-connect\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ネイティブな OCI GoldenGate のインテグレーション</span></a><span style=\"vertical-align: baseline;\">により、テーブル ブロックへのアクセスやトランザクション ワークロードへの負荷を抑えながら、CDC イベントを Oracle REDO ログから直接抽出できます。トランザクションは、Google Cloud のプライベート ネットワークを介して BigQuery マネージド テーブルに直接、安全にストリーミングされます。これにより、1 秒未満の分析鮮度がもたらされ、Gemini、Feature Store、ライブ ビジネス インテリジェンス ダッシュボードが強化されるとともに、オンプレミス環境から Oracle AI Database@Google Cloud への移行も効率化されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">BigQuery と Oracle のクエリ連携</strong></p>\n<p><span style=\"vertical-align: baseline;\">ワークロードで、オンデマンドの運用可視性や、データを移動しない低頻度の資産間の結合が必要な場合、BigQuery と Oracle のクエリ連携（プレビュー版）により、ライブの Oracle データベースに対して直接、リアルタイムのインプレース分析が可能になります。EXTERNAL_QUERY 関数を使用すると、データチームは BigQuery クエリ、ダッシュボード、パイプラインからネイティブの Oracle SQL を直接実行して、ライブ トランザクション レコードを取得し、ペタバイト規模の BigQuery データセットと簡単に結合できます。このゼロコピー アプローチにより、アドホックなルックアップ、イントラデイ リスク報告、リアルタイムの不正検出における重複ストレージと ETL メンテナンスを排除することで、運用が簡素化され、総所有コスト（TCO）が削減されます。この機能への登録をご希望の場合は、Google Cloud のアカウント担当者にお問い合わせください。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">アーキテクチャ オプション</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">メカニズム</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">データの鮮度とレイテンシ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle OLTP への影響</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">主なユースケース</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">双方向のボーダーレス Lakehouse</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Lakehouse ランタイム REST カタログ（DBMS_CATALOG）と Glue 連携を介した Apache Iceberg テーブルの共有</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リアルタイムの共有ストレージ（ゼロコピー）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ゼロ（共有分析ストレージ レイヤ）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">マルチクラウドのオープンな相互運用、ベンダー ロックインのない BigQuery / Spark / Oracle SQL への統合アクセス</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">OCI GoldenGate を介したリアルタイム CDC</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Storage Write API を介した BigQuery への継続的なログベースのストリーミング</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">準リアルタイム / 1 秒未満</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ゼロ（REDO ログからの非侵襲的な抽出）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery でのミッション クリティカルな運用データの反映、ライブ AI 特徴量ストア、継続的な ML と BI パイプライン</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">BigQuery クエリ連携（プレビュー版）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery Connection API を介して EXTERNAL_QUERY を使用したインプレース クエリ実行</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">オンデマンド / ライブ インプレース</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">可変（クエリによって異なる）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">頻度の低いアドホック クエリ、ゼロコピー ルックアップ、資産間の結合、法令上の報告</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><strong style=\"vertical-align: baseline;\">グローバル展開と公共部門のコンプライアンス</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google は、お客様がどこで事業を展開していても対応できるよう、新しいリージョンと認証を追加することで、Oracle AI Database@Google Cloud のグローバルな物理的拠点とコンプライアンス境界を拡大し続けています。</span></p>\n<p><a href=\"https://docs.cloud.google.com/oracle/database/docs/regions-and-zones#exadata\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">新しいリージョンの追加</strong></a></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">europe-west12-a</code><span style=\"vertical-align: baseline;\">（イタリア、トリノ）と </span><code style=\"vertical-align: baseline;\">northamerica-south1-b </code><span style=\"vertical-align: baseline;\">（メキシコ、ケレタロ）のリージョンが</span><strong style=\"vertical-align: baseline;\">稼働開始</strong><span style=\"vertical-align: baseline;\">となり、ミラノ、アイオワ、サンパウロ、東京、シドニー、ムンバイなどのグローバル ハブに加わりました。これにより、超低レイテンシのアクセスと現地のデータ所在地をご利用いただけます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">FedRAMP High 認証</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Oracle は Oracle AI World で、Oracle AI Database@Google Cloud の FedRAMP High 認証を取得する計画を発表しました。この取り組みにより、米国政府機関や公共部門の組織は、Google Cloud Assured Workloads 内の専用インフラストラクチャで Oracle Exadata Database Service を使用して、規制対象のワークロードを実行できるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">FedRAMP High 認証を受けた環境内で運用することで、連邦政府機関は機密性の高い未分類のデータを保護しながら、Oracle ワークロードを既存のアプリケーションや Gemini と同じ場所に配置できます。政府機関は、Oracle のライブデータに最小限のレイテンシでアクセスできるほか、支払いと調達のプロセスも簡素化されます。これらすべてを、Google Cloud Marketplace や認定パートナーを介して、組織のコンプライアンス境界内で行えます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">エージェントの未来を築く</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Oracle の実績あるトランザクション エンジンと Google の Agentic Data Cloud を組み合わせることで、エンタープライズ データは受動的な記録システムから、能動的でインテリジェントな運用エンジンへと進化します。オープンな Apache Iceberg レイクハウスによるデータの統合、GoldenGate を介した 1 秒未満の変更のストリーミング、BigQuery からのライブクエリの連携、Gemini による統制された Oracle データとの直接対話など、組織は自律型 AI エージェントの大規模なデプロイに必要となる十分な柔軟性とセキュリティを確保し、最も重要なビジネス プロセス全体で予測的な分析情報と自動化されたアクションを推進できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Oracle AI Database@Google Cloud は、</span><a href=\"https://console.cloud.google.com/marketplace/product/oracle/oracle-database-at-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Marketplace</span></a><span style=\"vertical-align: baseline;\"> から直接入手できます。既存の Google Cloud コミットメント、統合された請求、Oracle Support Rewards を使用してデプロイできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳しくは、</span><a href=\"https://www.oracle.com/cloud/google/oracle-database-at-google-cloud/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle AI Database@Google Cloud の概要</span></a><span style=\"vertical-align: baseline;\">をご覧いただくか、公式の</span><a href=\"https://docs.oracle.com/en-us/iaas/Content/database-at-gcp/home.htm\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Oracle Database@Google Cloud のドキュメント</span></a><span style=\"vertical-align: baseline;\">をご確認ください。または、Google Cloud のアカウント担当者に連絡して、アーキテクチャに関するブリーフィングを予約することもできます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース担当プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Kunal Agarwal</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Kiran Shenoy</strong></p></div>"
  "9a174b1559c066d8b3de3c34f6eb32ae":
    "id": "9a174b1559c066d8b3de3c34f6eb32ae"
    "title": "Google Cloud と NASA: 深宇宙ミッション用のロボット システムをテスト"
    "link": "https://cloud.google.com/blog/ja/topics/public-sector/google-cloud-and-nasa-testing-robotic-systems-for-deep-space-missions/"
    "published": "2026-11-06 11:00:00"
    "fetched": "2026-11-06 16:40:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 27 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/public-sector/google-cloud-and-nasa-testing-robotic-systems-for-deep-space-missions?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">NASA は、月探査の拡大、月面基地による人類の持続的な滞在の確立、そして初の有人火星ミッションに向けた基盤構築を目指し、より高度なミッションへ宇宙飛行士を送り出す</span><a href=\"https://www.nasa.gov/humans-in-space/artemis/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">アルテミス計画</span></a><span style=\"vertical-align: baseline;\">を進めています。こうしたなか、乗組員の安全確保と、地球に依存しない自律性の確立が最重要課題となっています。将来の火星への深宇宙ミッションにおいて、宇宙飛行士は深刻な運用上の課題に直面する可能性があります。たとえば通信の往復遅延は最大 44 分に及び、乗組員に対するリアルタイムの医療支援はほぼ不可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">昨年、Google Public Sector は、</span><a href=\"https://cloud.google.com/blog/ja/topics/public-sector/how-google-and-nasa-are-testing-ai-for-medical-care-in-space?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Crew Medical Officer Digital Assistant（CMO-DA）</span></a><span style=\"vertical-align: baseline;\">の開発状況を発表しました。CMO-DA は、遠隔・孤立環境にいる宇宙飛行士へリアルタイムで医療ガイダンスを提供するために設計された、自動臨床意思決定支援システム（CDSS）としてのデジタル アシスタントです。現在、Google はこのイノベーションを基盤として、深宇宙ミッションのサポートや NASA のミッションにおける宇宙飛行士の支援を目的とした、実体のあるロボット システムの概念実証モデルの開発に取り組んでいます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">乗組員の作業時間と安全性の最適化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">月の南極エリアに計画されている月面基地は、人類の持続的な滞在を支えることを目的としています。宇宙における時間は極めて限られた貴重なリソースです。そのため、宇宙飛行士の身体的負担を軽減し、科学研究や発見に充てる時間を最大化することが最優先事項となっています。この課題に対処するため、NASA の</span><a href=\"https://www.nasa.gov/hrp/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ヒューマン リサーチ プログラム</span></a><span style=\"vertical-align: baseline;\">、ジョンソン宇宙センターのロボティクス チーム、ジェット推進研究所（JPL）は、Google Public Sector と協力してロボット システムの開発に取り組むことになりました。このシステムが日常的な準備や管理業務を引き受けることで、宇宙飛行士は人間ならではの強みである複雑な科学研究や発見に専念できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">少人数の乗組員でも最大限の成果を上げられるよう、このロボット システムは貨物や資材の管理、機器の操作などをこなす多用途な「ペイロード」ハンドラとして設計されています。工具の整理やコンパートメントの安全確保などの日常メンテナンスを行っていない時間帯は、医療支援へと柔軟に対応を変更できます。たとえば、宇宙飛行士が腎臓結石の兆候である可能性のある激しい腰痛を訴えた場合、ロボットが超音波診断装置を取ってきて準備します。これにより、人間の医療担当者はエコー画像の分析と患者の治療に集中できるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ロボット システムに向けた空間認識と視覚言語行動モデルの適応</strong></h4>\n<p><span style=\"vertical-align: baseline;\">限られた空間の宇宙船内で、人間と並んで安全に稼働することは非常に複雑な課題です。人が立ち入らない固定された環境で稼働する産業用ロボットとは異なり、超知能（SI）を活用する宇宙システムが狭い船内環境に安全に適応するには、人間の指示に従って柔軟に動くツールが不可欠です。また、カメラをはじめとする限られたセンサー情報に頼る必要があるため、JPL は、もともと軌道上の物体を追跡するために開発された衛星状況認識インテリジェンス ツールを応用しています。これにより、ロボット システムが自らの置かれた 3D 環境を認識し、安全に移動できるよう支援しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">これをジョンソン宇宙センターの iMETRO 施設で安全にテストするため、Google DeepMind の </span><a href=\"https://mujoco.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MuJoCo シミュレータ</span></a><span style=\"vertical-align: baseline;\">が活用されました。これは、SI が実機を稼働させる前に、高精度な仮想空間内で複雑な動作をシミュレーションできる高度な物理エンジンです。最近行われた概念実証の技術デモでは、医療用バッグの位置を特定して指定の場所へ移動させるという、複雑な「ピック＆プレース」動作の実証実験がロボット システムに課されました。空間認識能力を高める「アイツーハンド」カメラ構成を採用したことで、</span><a href=\"https://cloud.google.com/blog/ja/topics/startups/why-global-startups-are-gathering-at-google-cloud-next25?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud インフラストラクチャ上で Physical Intelligence 社</span></a><span style=\"vertical-align: baseline;\">が開発したオープンソースの </span><a href=\"https://huggingface.co/gimarchetti/clr-experiment-pi0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pi0 モデル</span></a><span style=\"vertical-align: baseline;\">は、こうした初期のラボ環境において 85% のベースライン成功率を達成しました。これにより、今後の厳格なトレーニングと安全性の向上に向けた強固な基盤が確立されました。視覚言語行動（VLA）モデルは言語を物理的な動作に直接結び付けるため、宇宙飛行士は通常の英語テキストプロンプトを通じて、ロボット システムへ柔軟に指示を出すことができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">宇宙: 究極のエッジ コンピューティング環境</strong></h4>\n<p><span style=\"vertical-align: baseline;\">こうした複雑なタスクの処理には莫大なコンピューティング能力が必要となりますが、そこに「宇宙は究極のエッジ コンピューティング環境である」という新たなハードルが立ちはだかります。宇宙船は、地球上にあるデータセンターとの継続的な接続に頼ることができません。この課題を解決するため、Google のチームは Google Cloud の </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G4 インスタンス</span></a><span style=\"vertical-align: baseline;\">を活用してベースモデルの高速なトレーニングを行い、40 億パラメータの Pi0 モデルをわずか 2.5 時間でファインチューニングすることに成功しました。特筆すべきは、ファインチューニングされたモデルが、エネルギー効率に優れたコンパクトなエッジデバイス上でローカル動作可能であることを実証した点です。過去 2 年間にわたり、チームは約 15 種類のエッジ コンピューティング デバイスを検証し、将来の火星ミッションで求められる軽量かつ低消費電力なハードウェア上で、効率的に動作するデバイスを選定しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">乗組員の安全確保と宇宙探査の未来を切り開く</strong></h4>\n<p><span style=\"vertical-align: baseline;\">将来的には、宇宙飛行士の直接的な監督と指揮のもと、簡単な音声指示でさまざまなタスクを実行できるロボット システムを構築することが最終目標です。たとえば、人間の医療責任者による厳格な指導のもと、基本的なバイタルサインの測定や簡単な超音波検査といった日常的な健康モニタリングを補佐するよう、ロボットに指示を出すことができます。これにより、人間の判断や意思決定を代替することなく、宇宙飛行士が自力では行うのが難しい物理的なサポートをロボットから受けることが可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Public Sector と NASA によるこの共同取り組みは、科学的発見の限界を押し広げるような、より高度なミッションへの道を切り開くことに貢献します。</span></p>\n<p><span style=\"vertical-align: baseline;\">お客様のミッションにおける Gemini の価値について詳しく知りたい方は、</span><a href=\"https://cloudonair.withgoogle.com/events/google-public-sector-summit-2026?utm_source=linkedin&amp;utm_medium=paidsocial&amp;utm_campaign=FY26-Q4-northam-PUB10000039-onlineevent-er-ps-summit-on-demand-2026&amp;utm_content=-&amp;utm_term=-\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ご登録</span></a><span style=\"vertical-align: baseline;\">のうえ Google Public Sector Summit をオンデマンドでご視聴いただくか、geminiforgov@google.com までお問い合わせください。</span></p>\n<p><sup><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: sub;\">写真: （2026 年 10 月 9 日）--- 国際宇宙ステーションのユニティ モジュールに約 6 か月間係留された後、地球軌道への放出直前に Canadarm2 ロボットアームによって保持されている、Northrop Grumman の Cygnus XL 貨物宇宙船。この写真が撮影された際、この軌道上の前哨基地はマダガスカル沿岸沖、インド洋の上空約 423 km を移動中でした。画像提供: NASA。作成日: 2026 年 10 月 9 日</span></span></sup></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Public Sector、連邦政府担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Jim Kelly</strong></p></div>"
  "8279fdad1980433a881d9d5e1a545d55":
    "id": "8279fdad1980433a881d9d5e1a545d55"
    "title": "金融サービスチームと法務チーム向けの新しい Gemini コース"
    "link": "https://cloud.google.com/blog/ja/topics/training-certifications/new-gemini-courses-for-financial-services-and-legal-teams/"
    "published": "2026-11-06 10:10:00"
    "fetched": "2026-11-06 16:40:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 31 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/training-certifications/new-gemini-courses-for-financial-services-and-legal-teams?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび Google Skills にて、Gemini とエージェントの習得にお役立ていただける、特定の業界向けの新しい動画学習バンドルを公開いたしました。1 つは</span><a href=\"https://www.skills.google/paths/4864\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">金融サービス</span></a><span style=\"vertical-align: baseline;\">、もう 1 つは</span><a href=\"https://www.skills.google/paths/4869\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">法務専門職</span></a><span style=\"vertical-align: baseline;\">に特化したバンドルです。これらの動画はすべて、</span><a href=\"http://skills.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\"> で今すぐ無料でご覧いただけます。</span></p>\n<p><span style=\"vertical-align: baseline;\">複雑な市場ポートフォリオの管理から、厳格なコンプライアンス審査への対応まで、エージェント型 AI を活用して業務を効率化する方法を、短時間の動画コースでわかりやすく解説します。まず、皆様に馴染みのあるユースケースを取り上げ、Gemini を活用してより効率的に作業を進める方法をお伝えします。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">金融サービス向け Gemini で複雑な市場を明確化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">金融アナリストやポートフォリオ マネージャーは、膨大な量のリアルタイム市場データ、変動するリスク プロファイル、厳しいスケジュールに対応しています。たとえば、あなたがファイナンシャル アドバイザーで、クライアントとの最初のセッションの準備をしているとします。20 分後に新規クライアントとのミーティングが予定されています。何百ページもの米国証券取引委員会への提出書類を自力で読むことは不可能です。しかし、金融サービス向け Gemini を使用すれば、2 分で簡単に読むことができます。この動画では、Gemini の使用を開始する 3 つの方法を紹介しています。または、以下のコースリストからすぐに学習を始めることもできます。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=FcmqIX0DSeU\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">3 ways to automate your financial workflows with Gemini</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=FcmqIX0DSeU\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">金融サービスチームがすぐにワークフローの変革を開始できるよう、4 つの実践的な動画コースをリリースしました。Google Skills で今すぐ、すべての動画をご覧いただけます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1912\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コース 1: Gemini を活用してファイナンシャル アドバイザーの知見の質を高める</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1947\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コース 2: Gemini を使用して金融ポートフォリオのレジリエンスを強化する</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1944\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コース 3: Gemini で債券発行を加速する</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1948\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コース 4: Gemini でクレジット市場の機会を発掘する</span></a></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">法務向け Gemini でコンプライアンスと起草を効率化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">法務業務では、正確さがすべてです。たとえば、あなたがレビューする必要がある書類が山積みになっているとします。Gemini を使用してコンプライアンス基準を構築し、それに基づいて契約をレビューすることで、契約条項を 1 行ずつ確認する必要がなくなります。Gemini が違反を指摘し、基準に違反している理由を説明して、解決策を提案します。これは、法務分野で Gemini を活用して効率を大幅に向上させる方法の一例にすぎません。今すぐ利用を開始するための方法を他に 3 つご紹介します。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Y4Nil53XZzI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">How Gemini for legal automates regulatory scans, contract reviews &amp; DSARs</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Y4Nil53XZzI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">日常的な法務ワークフローの向上を目的とした次の 5 つの新しいミニコースをご活用ください。また、Google Skills で法務向け Gemini のすべてのコンテンツをご覧いただくこともできます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1915\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini を使用して法規制ホライゾン スキャニングを行う</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1946\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini を使用して法的データを処理し DSAR に対応する</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1945\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini を使用して契約書のレビューとハンドブックの作成を行う</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1907\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini を使用して法的文書をマスキングする</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://www.skills.google/course_templates/1949\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini を使用して NDA ドキュメントを起草する</span></a></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Gemini Agent Ready（GEAR）でスキルをさらに高める</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ここでご紹介した内容は、少し「初歩的」すぎるとお感じですか？問題ありません。入門的なワークフローから、本番環境グレードのエージェント システムの構築にステップアップすることもできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">無料の Gemini Agent Ready プログラムを通じて、業界で認められたスキルバッジを獲得すれば、実務に役立つ専門知識をお持ちであることを証明できます。今すぐ GEAR にご登録いただいた場合、Google Skills のインタラクティブなトレーニング環境を体験できる 35 クレジットを進呈します。リスクのない環境で、エージェント AI を構築、テスト、習得しましょう。</span></p>\n<p><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今すぐ GEAR を使ってみる</span></a></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud Learning、マネージング ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Gary Eimerman</strong></p></div>"
  "fc0d363d6db242ccd1e037c490d337da":
    "id": "fc0d363d6db242ccd1e037c490d337da"
    "title": "独自のビジネス条件の範囲内でイノベーションを実現: Google Cloud の利用額上限の一般提供を開始"
    "link": "https://cloud.google.com/blog/ja/topics/cost-management/google-cloud-spend-caps-now-generally-available/"
    "published": "2026-11-06 10:00:00"
    "fetched": "2026-11-06 16:40:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 31 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/cost-management/google-cloud-spend-caps-now-generally-available?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Google Cloud の予算での利用額上限の一般提供が開始されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回のリリースにより、リソース削除というリスクを冒すことなく、ワークロードにかかる費用の急増を回避できるようになります。</span><strong style=\"vertical-align: baseline;\">さらに重要な点は、最初のプレビュー以降にお客様から寄せられたフィードバックを直接反映した 3 つの大きなアップデートを導入することです。</strong><span style=\"vertical-align: baseline;\">これにより、お客様の費用管理ハンドブックに、プログラマビリティ、リアルタイムの可視性、自動化されたガードレールを組み込むことができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">新しい利用額上限がビジネスにもたらすメリット</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、次の 3 つの点で、利用額上限の使いやすさと機能を大幅に向上させました。</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">利用額上限 API による自動化</strong><span style=\"vertical-align: baseline;\">: 何百ものプロジェクトのガードレールを手動で管理することは、運用上の大きな課題となっています。これに対処するため、既存の Cloud Billing の予算 API からアクセスできる利用額上限 API をリリースしました。これにより、各プロジェクト内の対象サービスに対して、追加のオーバーヘッドなしで、プログラムによって予算の制限を適用できるようになりました。デベロッパーが新しいサンドボックス プロジェクトをスピンアップするたびに、お客様は上限の引き上げ、更新、削除をその場で自動的に行い、利用額上限を即座に適用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">ライブ費用レポートによるリアルタイムの可視化: </strong><span style=\"vertical-align: baseline;\">AI サービスの利用額上限は、推定ライブ費用に基づいて、使用から数分以内にトリガーされます。上限がトリガーされた場合、上限を超えた理由とタイミングを正確に把握する必要があります。この推定費用を、費用レポート内で直接、より迅速に確認できるようになりました。標準的な課金パイプラインによる純費用の確定を何時間も待つ必要はありません。違反措置のトリガーとなった正確な財務スナップショットを取得できるため、正確な根本原因分析の実行に必要なコンテキストをすぐに把握できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Live Costs - Hi Res Mock\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Live_Costs_-_Hi_Res_Mock.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">3. 毎月のリセットを自動化するガードレール: 以前は、利用額上限がトリガーされると、UI で手動で解除するまで使用制限がロックされたままでした。今回導入する毎月の自動リセット機能により、毎月手動で上限を引き上げる必要がなくなります。適用された利用額上限は自動的にリセットされ、ブロックされたサービスは翌月の初めにシームレスに再開されます。ただし、ガバナンス ポリシーで、厳格な手動監査を行ってから運用を再開することが求められている場合は、手動オーバーライド オプションをこれまでどおり使用できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">利用額上限を導入する際のベスト プラクティス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">全社規模で利用額上限を導入する際は、次の運用上のヒントを念頭に置いてください。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">まず非本番環境を対象にする</strong><span style=\"vertical-align: baseline;\">: まずは、デベロッパー サンドボックス、テストクラスタ、試験運用版 AI エージェントのプレイグラウンドに、厳格な低額の利用額上限を適用しましょう。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アラートを適切に構成する</strong><span style=\"vertical-align: baseline;\">: デフォルトのアラートは、上限の 50%、80%、100% に達した時点で、課金管理者とプロジェクト オーナーに自動的に送信されます。これらのロールに適切な担当者が設定されていることを確認してください。これにより、いざ予算が枯渇しそうになったときにチームが慌てずに済みます。必要に応じて、カスタムロールに利用額上限に関する権限を追加することもできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">固定費用とオンデマンド費用の違いを理解する</strong><span style=\"vertical-align: baseline;\">: 予算のしきい値に達すると、利用額上限により、従量課金制と CUD の対象となるリクエストが停止されます。ただし、プロビジョンド スループットが停止されることはありません。予約済み容量を使用するリクエストは引き続き実行され、通常どおりトラフィックを処理します。</span></p>\n</li>\n</ol>\n<h4><span style=\"vertical-align: baseline;\">GCP の 2 段階の防御ハンドブックについてのおさらい</span></h4>\n<p><span style=\"vertical-align: baseline;\">利用額上限は、Google のネイティブな早期異常検出とシームレスに連携し、クラウド支出に対するクローズドループの防御を提供します。これらのツールを使用して GCP 防御ハンドブックを簡単に設定する方法の詳細については、以前の</span><a href=\"https://cloud.google.com/blog/ja/topics/cost-management/new-early-anomalies-and-spend-caps-on-google-cloud-budgets?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ記事</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ハンドブックのステップ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">機能</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">焦点</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">コアアクション</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">主なメリット</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ステップ 1</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">早期異常</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">予測モニタリング</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">早期の費用シグナルを毎日分析し、費用の方向性の変化について通知する</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">費用の異常な急増を早期に発見し、その傾向を引き起こしている SKU を正確に特定</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ステップ 2</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">利用額上限</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">費用に関する強制処理</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">予算を超過すると、特定のプロジェクトやサービスの使用がプログラムによって一時停止される</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リソースを削除せずに、過剰な支出を確実に防止</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<p><strong style=\"vertical-align: baseline;\">使ってみる</strong></p>\n<p><span style=\"vertical-align: baseline;\">利用額上限は、大規模なワークロードにも今すぐ適用していただけます。詳細については、</span><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budgets-spend-caps?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。また、Google Cloud Billing コンソールの [</span><a href=\"https://pantheon.corp.google.com/billing/budgets?e=13802955&amp;mods=prod_coliseum\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">予算とアラート</span></a><span style=\"vertical-align: baseline;\">] ページに移動して、最初の利用額上限を設定してください。</span></p>\n<p><span style=\"vertical-align: baseline;\">デプロイ ワークフローにプログラムによるガードレールを統合するには、新たに公開された利用額上限 API の</span><a href=\"https://docs.cloud.google.com/billing/docs/how-to/budget-api-spend-cap?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">シニア プロダクト マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Shruthi Nambi</strong></p></div>"
