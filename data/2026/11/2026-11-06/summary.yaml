"overview": |
  この日は 4 ソースから 12 本 (重複を除くと 10 本) で、Gemini Omni 1.2 Flash の一般提供と Agentic Data Cloud コネクタの記事はそれぞれ同じものが 2 つのブログに載った。Google Cloud Japan Blog の 4 本は米国時間 10 月 27〜31 日の英語記事の抄訳。Gemini Omni 1.2 Flash は、商品動画やバーチャル試着、広告など量産する動画向けのモデルで、720p 動画が 1 秒あたり 0.07 米ドルと Gemini Omni 1.1 Flash より 30% 安くなり、生成・編集できる長さが 10 秒から 15 秒に延び、画像・動画の参照への追従性が高まった。360p や 720p で下書きを作ってから 1080p や 4K にアップスケールでき、会話の中で同じクリップを編集できる。音声参照は許可リスト制。Gemini for business と Google Vids から使えるほか、API でも利用できる。BigQuery では、数百万行のテキストやマルチモーダルデータを多段階で意味的に集約する AI.AGG 関数 (プレビュー) が GoogleSQL に組み込まれ、外部の map-reduce パイプラインなしで LLM のコンテキストウィンドウの制約を回避できることが解説された。もう 1 本は、AlphaEvolve・Harbor・Gemini 4 Argon でエージェントスキルを最適化する手法で、Terminal-Bench 2.0 のタスクで OpenCode と Gemini 3.8 Flash を使い、数回の反復で 5% の改善が得られたという。抄訳記事では、Cloud Billing の予算での利用額上限の一般提供が紹介され、リソースを削除せずに費用の急増を防げるうえ、プレビュー以降の改善として既存の予算 API から使える利用額上限 API によるプロジェクトごとの上限の自動設定、AI サービスの上限が推定ライブ費用に基づき使用から数分以内に発動しその費用を費用レポートで即座に確認できること、発動した上限が翌月初めに自動でリセットされる機能 (手動での解除も引き続き選べる) が加わった。Oracle AI World では Google Cloud と Oracle が Oracle AI Database@Google Cloud・Agentic Data Cloud・Gemini Enterprise の統合を深めると発表し、OCI を介した Google TPU の提供を含むパートナーシップ拡大、IAM で管理される ExecuteSQL Data API を使った Oracle ワークロード向けリモート MCP サーバーの一般提供 (Secret Manager で認証情報を解決し、踏み台 VM や平文パスワードが不要)、Knowledge Catalog との統合 (プレビュー) が紹介された。このほか、Google Public Sector が NASA のヒューマンリサーチプログラム・ジョンソン宇宙センター・JPL と、貨物や機器の取り扱いと医療支援を担う深宇宙ミッション用ロボットシステムの概念実証に取り組んでいること (宇宙飛行士向け医療支援アシスタント CMO-DA が土台)、Google Skills で金融サービスと法務専門職向けの Gemini とエージェントの無料動画学習バンドルが公開されたことが紹介された。 リリースノートでは、Bigtable の SSD インスタンスで自動バックアップポリシーを構成し、日次のホットバックアップを作成してホットのまま保持する期間を指定し、その後は自動で標準バックアップに移行させる機能が一般提供 (GA) となった。あわせて Gemini for business の Data Cloud connectors がプレビューとなり、業務ユーザーやアナリストが自然言語で企業の生データを問い合わせられるようになった。BigQuery (プレビュー)、Spanner・AlloyDB・Cloud SQL といった運用データベース (プレビュー)、Looker のガバナンス済みデータ (プレビュー) から直接データを取得でき、行・列レベルのセキュリティとエンドユーザーの資格情報を尊重したうえで、Knowledge Catalog が質問を解釈して適切なデータソースを特定し、利用者の権限の範囲でクエリを実行する。結果は Google ドキュメントや Gmail の下書き、Google スライドへそのまま持ち出せる。もう 1 本は BigQuery DataFrames (BigFrames) の新しい .bigquery アクセサの紹介で、pandas の DataFrame から BigQuery の AI 関数を直接呼び出し、ローカルでの特徴量選択やモデル学習を経ずに ai.predict() による予測や分類、埋め込み生成をクラウド上で実行できる。
