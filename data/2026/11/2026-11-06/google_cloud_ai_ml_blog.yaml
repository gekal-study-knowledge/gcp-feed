    "id": "29a627bc3bbe47bb3066c882b9555b64"
    "title": "Gemini Omni 1.2 Flash: Fast, cost-effective, and reliable video generation and editing now generally available"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-omni-1-2-flash-generally-available/"
    "published": "2026-11-06 02:00:00"
    "fetched": "2026-11-06 04:31:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, Gemini Omni 1.2 Flash is generally available on Google Cloud. Built for the everyday videos businesses make in volume — like product videos, virtual try-ons, and ads — this model is fast, cost-effective, and follows your image, video and audio references more closely than before.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Business users can create with it in Gemini for business and Google Vids, and developers can build with it via API.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here's what's new:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">A lower price:</strong><span style=\"vertical-align: baseline;\"> $0.07 per second of 720p video, 30% less than Gemini Omni 1.1 Flash, with similar savings at other resolutions.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Longer clips:</strong><span style=\"vertical-align: baseline;\"> Generate and edit videos of up to 15 seconds, up from 10s.</span></li>\n<li><strong style=\"vertical-align: baseline;\">More consistent results:</strong><span style=\"vertical-align: baseline;\"> stronger adherence to image and video references keeps products, characters, and brand details consistent from shot to shot.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Faster drafts, in higher resolution:</strong><span style=\"vertical-align: baseline;\"> create drafts at 360p or 720p, then upscale the best creations to 1080p or 4K.</span></li>\n<li><strong style=\"vertical-align: baseline;\">More natural speech: </strong><span style=\"vertical-align: baseline;\">You can generate scenes with more fluid, natural-sounding dialogue, clearer lip-sync, and distinct multi-speaker conditioning.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Editing in conversation:</strong><span style=\"vertical-align: baseline;\"> refine the same clip, such as swapping a product, changing lighting, or changing camera angle, instead of starting over.</span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Note: Audio references are gated behind allowlisting.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Omni 1.2 Flash is ready for production</strong></h3>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Gemini Omni 1.2 Flash is production-ready and backed by Google Cloud’s enterprise-grade infrastructure and security, offering </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Provisioned Throughput</span></a><span style=\"vertical-align: baseline;\">. Outputs carry an imperceptible </span><a href=\"https://deepmind.google/models/synthid/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SynthID</span></a><span style=\"vertical-align: baseline;\"> watermark.</span></span></p>\n<h3><span style=\"vertical-align: baseline;\">Video creation inside the tools people already use</span></h3>\n<p><span style=\"vertical-align: baseline;\">Design and creative platforms are building Gemini Omni 1.2 Flash directly into their products, so their users can create and edit videos where they already work. Here’s how customers are already using Gemini Omni 1.2 Flash:</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"artlist\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/artlist.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“At Artlist, we’re focused on giving creators the control and flexibility to bring their ideas to life. Gemini Omni 1.2 Flash brings exciting capabilities in reference-based generation, video extension, and creative consistency, helping our customers move from experimentation to professional content production at scale.” – Roee Peled, CPTO, Artlist.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=OofOq-NaYXI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Artlist uses Gemini 1.2 Omni Flash to bring creative ideas to life</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=OofOq-NaYXI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Artlist uses Gemini 1.2 Omni Flash to bring creative ideas to life</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"flora\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/flora.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“Creative teams need models that they can rely on consistently. Gemini Omni 1.2 Flash edits exactly what you ask for, a colorway or a background, and leaves the product untouched, even from detailed images and finished video. Its video-to-video takes footage into entirely new styles.” – Andrew Taco Zhang, Product Marketing Manager, FLORA.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Opx8Uf6vcqg\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">FLORA uses Gemini Omni 1.2 Flash to create new styles</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Opx8Uf6vcqg\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">FLORA uses Gemini Omni 1.2 Flash to create new styles </span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"invideo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/invideo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We ran Gemini Omni 1.2 Flash through our evals at invideo. Honestly, it's really good. It sticks to the prompt, and the physics and sound feel real. If you need fast video at scale, it's one of the best we've tested. And 15 seconds means a full scene in one go.” – Shivam Rastogi, VP of Engineering, invideo.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=FQ5wy13QqGo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">invideo uses Gemini Omni 1.2 Flash to create full scenes in one prompt</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=FQ5wy13QqGo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">invideo uses Gemini Omni 1.2 Flash to create full scenes in one prompt</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Krea\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Krea.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We’re really impressed by how fast and accurate this new model is. The outputs retain an amazing level of detail, and the model does a great job of making only the changes we ask for while keeping everything else consistent. We’re excited to use it for character and scene replacements, as well as other creative workflows.” – Numan Khan, Creative Specialist, Krea.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=BZqcrwXwF3E\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Krea uses Gemini Omni 1.2 Flash for their creative workflows, from character to scene replacements</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=BZqcrwXwF3E\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Krea uses Gemini Omni 1.2 Flash for their creative workflows, from character to scene replacements</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Picsart\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Picsart.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>\"Gemini Omni 1.2 fits the way our teams work. Draft mode lets us iterate concepts in minutes, then render in 4K for TV-ready AI dramas. Text stays crisp across frames, characters look and sound real, and the speed keeps production moving. Now that it is generally available, we can bring this quality to over 100M Picsart creators.\" – Narek Hayrapetyan, Head of Product and Partnerships, Picsart.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=wZpPW8r3bJQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Picsart uses Gemini 1.2 Flash to iterate concepts in minutes</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=wZpPW8r3bJQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Picsart uses Gemini 1.2 Flash to iterate concepts in minutes</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Runway\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Runway.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Runway empowers creatives with advanced AI video tools to produce high-quality content. For organizations, Runway’s enterprise solutions deliver robust collaborative tools to scale professional production. Here is what they created with Gemini Omni 1.2 Flash.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=TLpQ6VRhTAo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Runway uses Gemini Omni 1.2 Flash to produce and scale high-quality content</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=TLpQ6VRhTAo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Runway uses Gemini Omni 1.2 Flash to produce and scale high-quality content</span></em></sup></p>\n<h3><span style=\"vertical-align: baseline;\">Product and listing videos at catalog scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">Retailers and marketplaces use Gemini Omni to turn the photos they already have into short product spins, lifestyle clips, try-on videos, and video ads. </span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Photoroom\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Photoroom.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“Photoroom turns product photos into video ads that sell in minutes. We chose Gemini Omni Flash to power our Video Ad Maker and Product Animator because it balances quality, speed and cost. Version 1.2 brings 15-second videos, a top user request. With general availability and SLAs, we can rely on it in production for our sellers and enterprise customers.” - Matt Rouif, CEO and Co-founder, Photoroom.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=fwTIGK0ODiU\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Photoroom uses Gemini Omni 1.2 Flash to power their Video Ad Maker and Product Animator</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=fwTIGK0ODiU\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Photoroom uses Gemini Omni 1.2 Flash to power their Video Ad Maker and Product Animator</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"QuickFrame ai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/QuickFrame_ai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“QuickFrame AI helps marketers and business owners create, edit, and launch professional-quality ads for CTV and social in minutes. With Gemini Omni 1.2 Flash now supporting 15-second video generations at 1080p, users can create a complete CTV ad in a single generation, making TV ad creation simpler for businesses of all sizes.” - Richard Girges, Chief Technology Officer, QuickFrame AI.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=bJMy_nJiIng\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">QuickFrame AI uses Gemini Omni 1.2 Flash to create complete CTV ads in a single generation</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=bJMy_nJiIng\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">QuickFrame AI uses Gemini Omni 1.2 Flash to create complete CTV ads in a single generation</span></em></sup></p>\n<h3><strong style=\"vertical-align: baseline;\">Create in Gemini for business, Google Vids and build with the API</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Coming soon to Gemini, business users will be able to create a short video from a prompt or a product photo, right in the chat. In Google Vids, teams can combine generated clips with avatars, music and voiceover to create product explainers, teasers, social posts and sales pitches. Businesses can also embed the capabilities of Gemini Omni 1.2 Flash into their applications and agents via the API.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started with Gemini Omni</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We'll keep improving Gemini Omni based on your feedback, so tell us what you build.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For business users:</strong><span style=\"vertical-align: baseline;\"> Try it in </span><a href=\"https://vids.new\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Vids</span></a><span style=\"vertical-align: baseline;\">; coming soon to </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for business</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For developers:</strong><span style=\"vertical-align: baseline;\"> Try it in the <a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal?mode=prompt&amp;model=gemini-omni-1.2-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a>,</span><span style=\"vertical-align: baseline;\"> build with the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/omni-1-2-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API</span></a><span style=\"vertical-align: baseline;\">, and see the </span><a href=\"https://cloud.google.com/model-garden/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pricing</span></a><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n</ul></div>"
"last_updated": "2026-11-06 04:31:10 JST"
