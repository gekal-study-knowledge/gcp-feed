    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Data Cloud connectors in Gemini for business, now in </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">preview</span></a><span style=\"vertical-align: baseline;\">, give business users and analysts a direct way to query live enterprise data in natural language. Across most organizations, data questions multiply faster than analysts can answer them: Projects stall in ticket queues, leaders fall back on guesswork, and unmanaged spreadsheets spread across teams. Early generative AI tools promised conversational access to data, but they often struggled to generate accurate SQL across complex schemas or to respect governance rules. Data Cloud connectors let you query governed data directly from your workspace while enforcing row- and column-level security and respecting end-user credentials.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">A new way to query enterprise data</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini brings </span><a href=\"https://cloud.google.com/use-cases/data-cloud-agents#conversational-analytics-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">conversational analytics</span></a><span style=\"vertical-align: baseline;\"> directly into your day-to-day workflow through two paths: </span><a href=\"https://docs.cloud.google.com/gemini/data-agents/conversational-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics agents</span></a><span style=\"vertical-align: baseline;\">, which let you create data agents that include context and instructions to effectively answer questions for specific use cases, and </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Cloud connectors</span></a><span style=\"vertical-align: baseline;\">, allowing you to query live data directly with Gemini. End users can pull data directly from </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> (preview), operational databases like </span><a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/sql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\"> (preview), and governed data from </span><a href=\"https://cloud.google.com/looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker</span></a><span style=\"vertical-align: baseline;\"> (preview). From there, you can move your findings directly into everyday tools, such as turning query results into a Google Doc, an email draft in Gmail, or a deck in Google Slides.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Ask natural-language questions with Data Cloud connectors\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_-_Ask_natural-language_questions_with_Data_Cloud_connectors.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Ask natural-language questions across enterprise data using Data Cloud connectors.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">How Data Cloud connectors work</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Data Cloud connectors work with </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> to locate relevant data, interpret your question, and execute permission-scoped queries under your identity.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Knowledge Catalog prompt interpretation and source discovery\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Knowledge_Catalog_prompt_interpretatio.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Knowledge Catalog interprets the user prompt and identifies the right data source for the query.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When you ask a question in Gemini, the system coordinates discovery, semantic interpretation, and query execution, using the following capabilities:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Natural-language question: </strong><span style=\"vertical-align: baseline;\">You ask an exploratory question in plain language (for example, \"How many sales did we have this month for all cold weather products?\"). End users aren’t expected to know the table or project to use.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Semantic discovery:</strong><span style=\"vertical-align: baseline;\"> Gemini searches Knowledge Catalog to locate candidate data across your estate, considering key attributes like usage patterns.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Context mapping:</strong><span style=\"vertical-align: baseline;\"> The system uses technical metadata, business glossaries, and semantic models to map everyday terms into exact database structures, such as resolving \"cold weather products\" to specific categories like sweaters, coats, and jackets in an ecommerce catalog.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Permission-aware execution:</strong><span style=\"vertical-align: baseline;\"> Gemini generates a SQL query and runs it through the connector under your user credentials, respecting your existing row- and column-level database permissions.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - Step-by-step flow from Gemini prompt to query execution\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_-_Step-by-step_flow_from_Gemini_prompt_t.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Step-by-step flow of a user prompt from Gemini to query execution.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To accurately navigate an enterprise data estate, language models need business context alongside raw database access. Knowledge Catalog provides a </span><a href=\"https://cloud.google.com/blog/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">curated context bundle</span></a><span style=\"vertical-align: baseline;\">, including technical metadata, business logic, table relationships, and verified queries, that improves query accuracy while reducing latency and token consumption.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4 - Navigating the context graph in Knowledge Catalog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4_-_Navigating_the_context_graph_in_Knowledge_Catalog.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Navigating the context graph visually in Knowledge Catalog.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Enterprise analytics has long been fragmented by physical borders: data locked in proprietary silos, open lakehouse tables in cloud object storage, and datasets distributed across multicloud environments. Beyond native BigQuery storage, the BigQuery connector brings conversational analytics to a </span><a href=\"https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-integrates-with-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">borderless lakehouse</span></a><span style=\"vertical-align: baseline;\">, unifying these environments into a single conversational interface to query open table formats (including Apache Iceberg, Delta Lake, and Parquet) and cross-cloud datasets in AWS or Azure using BigQuery. The connector inherits fine-grained access policies from BigQuery and Knowledge Catalog, so row- and column-level access controls apply whether you query native tables or open lakehouse files.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5 - Cross-cloud querying across BigQuery and AWS S3 in Gemini\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/5_-_Cross-cloud_querying_across_BigQuery_and_AWS_S3_in_Gemini.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Gemini accesses data across BigQuery and AWS S3 (through the AWS Glue federated catalog) to answer questions in plain language.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Choosing between connectors and data agents</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In addition to using direct </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Cloud connectors</span></a><span style=\"vertical-align: baseline;\"> to query data in plain language, you can also use </span><a href=\"https://docs.cloud.google.com/gemini/data-agents/conversational-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics agents</span></a><span style=\"vertical-align: baseline;\"> to enable these experiences. While Data Cloud connectors allow you to provide exploratory and ad hoc analysis for users, conversational analytics agents are scoped agents that are built and certified directly by data teams within your organization. These can be built across Data Cloud products such as BigQuery, Looker, and operational databases including Spanner, AlloyDB, and Cloud SQL.</span></p>\n<p><span style=\"vertical-align: baseline;\">These pre-configured agents allow users to run highly governed, multi-step strategic analyses that are scoped to particular subsets of data, supporting compliance requirements and predictable results for reporting. These data agents can also be published in Gemini for consumption or made available via API for building your own conversational apps in the enterprise.</span></p>\n<p><span style=\"vertical-align: baseline;\">These approaches are complementary. Gemini direct connectivity also surfaces relevant published agents created by central data teams, so users can decide whether to proceed with ad hoc analysis using the connectors or use the scoped agent. You can choose the right approach for each workload.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Built-in access controls and governance</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Data Cloud connector queries execute under the end user’s identity. An employee without access to executive salary data or protected healthcare records cannot query that data through natural-language prompts. The agent only discovers metadata in Knowledge Catalog to which you have access, and only executes queries that your account has permission to run.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How to create Data Cloud connectors</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Administrators can configure Data Cloud connectors in the Gemini admin console. From there, admins set up default read-only connections to datasets in BigQuery, operational databases, or Looker, with Knowledge Catalog enabled automatically. Once configured, end users can enable the connector in Gemini to start querying data and building reports in plain language.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"6 - Creating a connected data store in Gemini Enterprise\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/6_connected_data_stores.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Create a connected data store in Gemini and authorize it on first use.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Setup documentation is available for the </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-cloud-sql\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> connectors, with Looker also in preview.</span></p>\n<p><span style=\"vertical-align: baseline;\">Unlike data ingestion mode, which copies data into a Gemini data store, Data Cloud connectors use federated query mode to query your data in place without copying or indexing it — using Knowledge Catalog automatically to search accessible metadata and look up business context.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why use Data Cloud connectors over custom MCP</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Compared to connecting to public or self-managed Model Context Protocol (MCP) servers, first-party Data Cloud connectors provide two main advantages:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Built-in skills for higher response quality:</strong><span style=\"vertical-align: baseline;\"> Data Cloud connectors include pre-configured agent skills tailored to each data engine, such as advanced SQL and AI function generation for BigQuery and operational databases, to improve query accuracy and response quality.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Guided setup and managed authentication:</strong><span style=\"vertical-align: baseline;\"> First-party connectors provide a guided setup experience with managed authentication for Google Cloud databases and BigQuery, removing the need to deploy MCP middleware or manage your own OAuth client configuration for Google Cloud services. In addition, connector-specific settings, such as specifying a default Google Cloud billing project for BigQuery query execution, help administrators enforce governance and manage query costs.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Get started today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Data Cloud connectors help teams find answers from enterprise data sources without waiting on backlog queues. To get started, review the </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Cloud connectors documentation</span></a><span style=\"vertical-align: baseline;\"> or explore </span><a href=\"https://docs.cloud.google.com/gemini/data-agents/conversational-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics agents</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
