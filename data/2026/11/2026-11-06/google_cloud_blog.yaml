  "2844ed5d9908dfe1e04b26a1e2c6a7f0":
    "id": "2844ed5d9908dfe1e04b26a1e2c6a7f0"
    "title": "Building an agent skill optimizer with AlphaEvolve, Harbor and Gemini 4 Argon"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/how-to-build-an-agent-skill-optimizer-with-alphaevolve-and-harbor/"
    "published": "2026-11-06 02:00:00"
    "fetched": "2026-11-06 04:31:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Every day, more and more people are using coding agents like </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Antigravity</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://opencode.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenCode</span></a><span style=\"vertical-align: baseline;\"> to complete software engineering tasks. But those tools need instructions to operate and their output is only as good as the inputs they get. By utilizing </span><a href=\"https://agentskills.io\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agent skills</span></a><span style=\"vertical-align: baseline;\"> that direct the agents through building, testing, and deploying code, developers have a powerful way to automate their workflows. </span></p>\n<p><span style=\"vertical-align: baseline;\">But most skills are written manually, so it’s hard to know which instructions are effective without assessing their output.</span></p>\n<p><span style=\"vertical-align: baseline;\">To measure the effectiveness of our skills, we ran OpenCode with </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/gemini-models/3-8-flash-and-3-8-flash-cyber/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 3.8 Flash</span></a><span style=\"vertical-align: baseline;\"> on tasks from </span><a href=\"https://github.com/harbor-framework/terminal-bench-2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Terminal-Bench 2.0</span></a><span style=\"vertical-align: baseline;\">, a public benchmark. The results were inconclusive: with our baseline skill, the agent passed about two-thirds of its attempts, but the outcome was about the same even without the skill. We needed better results.</span></p>\n<p><span style=\"vertical-align: baseline;\">To achieve them, we turned to </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/alphaevolve-is-available-for-everyone\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve</span></a><span style=\"vertical-align: baseline;\">, which optimizes skills the way it optimizes code: Gemini proposes a new version, an evaluator scores it, and the search retains the higher-scoring version. And with </span><a href=\"https://harborframework.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Harbor</span></a><span style=\"vertical-align: baseline;\">, that evaluator can be a real coding agent working on real tasks. We saw improvements of 5% with just a few iterations with alphaevolve</span></p>\n<p><span style=\"vertical-align: baseline;\">This is how you can build the same loop:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Treat the skill as the program:</strong><span style=\"vertical-align: baseline;\"> AlphaEvolve can rewrite your skill's text.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Let the agent judge:</strong><span style=\"vertical-align: baseline;\"> Harbor runs the agent with the skill on real tasks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Make the score trustworthy:</strong><span style=\"vertical-align: baseline;\"> Compare each version to the baseline skill and run them both at the same time.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Check the winner on unseen tasks:</strong><span style=\"vertical-align: baseline;\"> Save some tasks the search never sees for your final check.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Treat the skill as the program</span></h3>\n<p><span style=\"vertical-align: baseline;\">AlphaEvolve is designed to advance the code between two markers in a seed program. Skills are SKILL.md files with names, descriptions, and markdown instructions, so we put their text between the markers and let Gemini rewrite them:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;def build_skill() -&gt; tuple[str, str]:\\r\\n  &quot;&quot;&quot;Return the evolvable (description, body) pair for the skill.&quot;&quot;&quot;\\r\\n  # EVOLVE-BLOCK-START\\r\\n  description = (\\r\\n      &quot;Solve engineering tasks in a Linux terminal: building and compiling &quot;\\r\\n      &quot;software, fixing broken repositories and configuration, ...&quot;\\r\\n  )\\r\\n  body = r&quot;&quot;&quot;# Terminal task solver\\r\\nYou are working in a Linux container. The task has a specific, checkable end\\r\\nstate, and an automated test suite will decide whether you achieved it. ...\\r\\n&quot;&quot;&quot;\\r\\n  # EVOLVE-BLOCK-END\\r\\n  return description, body&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f427d4bab50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">AlphaEvolve operates in Google Cloud and doesn’t run your code. Its feedback is the scores and notes your evaluator sends back about what \"better\" means.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - Setup\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_Setup.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Image 1. AlphaEvolve proposes a skill, Harbor runs the agent with it next to the baseline skill, and the score and notes go back to AlphaEvolve.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Let the agent judge</span></h3>\n<p><span style=\"vertical-align: baseline;\">Harbor runs agents on benchmark tasks, with each trial in its own container. We ran it on </span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE) with one pod per trial, and a single search ran thousands of agent trials.</span></p>\n<p><span style=\"vertical-align: baseline;\">For each candidate, the evaluator returns a score for passes and failures, as well as  short notes on tasks that failed or timed-out. AlphaEvolve then sends those notes to Gemini for the next version.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Make the score trustworthy</span></h3>\n<p><span style=\"vertical-align: baseline;\">Agent scores can be noisy. In one of our early runs on the same benchmark, our model’s latency explained much of the variance in candidate scores. With each candidate running next to the baseline skill on the same tasks at the same time,  their scores are the difference.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Check the winner on unseen tasks</span></h3>\n<p><span style=\"vertical-align: baseline;\">The best skills read differently than the baseline, which is a careful checklist: read first, reproduce the failure, and work in small verified steps. AlphaEvolve's version is a protocol built around the time limit:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;## 2. Ship a Working Baseline to the Target Path Early\\r\\n(...)\\r\\n- Having a valid artifact on disk protects you from timeouts: if you refine or\\r\\n  golf code (`gpt2.c`, `eigen.py`, `my_warrior.red`), keep the last passing\\r\\n  version written to the target path at all times.\\r\\n\\r\\n\\r\\n(...)\\r\\n\\r\\n\\r\\n## 5. Hard Stop When Green\\r\\nThe moment `eval.py`, the test suite, or your acceptance check passes and the\\r\\nrequired files exist with exact formatting (...): **STOP IMMEDIATELY**. (...)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f427d4ba610&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">What we learned</span></h3>\n<p><span style=\"vertical-align: baseline;\">AlphaEvolve focused on the most common failure: running out of time. About a third of the search's trials hit their time limit, as reported in the evaluator's notes, and AlphaEvolve's best skill is built around that limit.</span></p>\n<p><span style=\"vertical-align: baseline;\">We also found that running the search is harder than building the loop. After about 10 hours, the search scored no new candidate; our latency check held back every evaluation while model responses were slow, and full agent logs filled the controller's disk. It’s important to plan for slow model windows and for log storage before a long search.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition, skills paid off when they added what the agent lacks, as advised by the </span><a href=\"https://agentskills.io/skill-creation/best-practices\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Skills best practices</span></a><span style=\"vertical-align: baseline;\">. Our baseline skill made no measurable difference, while the skill holding the answers added 33 points on the dev tasks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our hypothesis: today's models and coding agents are already tuned for coding work, so general advice has little left to add. If so, the room is in specifics, which a search can find: AlphaEvolve's best skill is built around the agent's most common failure, running out of time.</span></p>\n<h3><span style=\"vertical-align: baseline;\">What's next</span></h3>\n<p><span style=\"vertical-align: baseline;\">We’re testing AlphaEvolve on enterprise agent harnesses — system prompt, policy instructions, and tools —  where the agent lacks business rules that a search can add. In one small study on customer service test cases for a fictional bank, AlphaEvolve found and fixed a wrong policy rule we had planted, and carried the fix over to cases it never saw.</span></p>\n<p><span style=\"vertical-align: baseline;\">Other small studies were mixed, and we’ll share our final results when we’ve completed the full study. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlphaEvolve on Google Cloud:</strong><span style=\"vertical-align: baseline;\"> the </span><a href=\"https://github.com/Google-Cloud-AI/alphaevolve-on-googlecloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub repository</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Benchmark and harness:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/harbor-framework/terminal-bench-2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Terminal-Bench 2.0</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://harborframework.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Harbor</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agent skills:</strong><span style=\"vertical-align: baseline;\"> the format at </span><a href=\"https://agentskills.io\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agentskills.io</span></a><span style=\"vertical-align: baseline;\"> and the </span><a href=\"https://opencode.ai/docs/skills/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">opencode skills docs</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Thanks for reading! Tell us what your own tests show on LinkedIn or X.</span></p></div>"
  "e2654068bb544699708cbf83ddc5fc69":
    "id": "e2654068bb544699708cbf83ddc5fc69"
    "title": "Semantic aggregation over millions of rows in BigQuery with AI.AGG"
    "link": "https://cloud.google.com/blog/products/data-analytics/semantic-data-aggregation-with-bigquery-and-ai-agg/"
    "published": "2026-11-06 02:00:00"
    "fetched": "2026-11-06 04:31:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">For more than a decade, BigQuery has helped set standards for structured data aggregation, calculating financial sums, counting active users, and computing historical averages at a petabyte scale in seconds. But as modern enterprises become inundated with unstructured data — application logs, customer service transcripts, product imagery, and diagnostic reports — a critical gap has emerged.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Historically, relational SQL engines have lacked the native ability to aggregate, synthesize, and extract overarching semantic themes from millions of rows of text and multimodal data. While BigQuery recently introduced powerful row-level AI functions (like AI.GENERATE and AI.CLASSIFY), analyzing massive datasets holistically presents a unique architectural challenge: the large language model (LLM) context window.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Even with advanced foundation models like Gemini, you cannot pass millions of rows into a single prompt without triggering severe truncation or hard execution failures. Traditionally, solving this required data engineering teams to construct complex external map-reduce pipelines, manage rate-limiting backoffs, and recursively stitch chunked summaries together.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Today, we are thrilled to deep-dive into AI.AGG — currently in preview — a fully managed, multi-level semantic aggregation function natively embedded within BigQuery GoogleSQL. By conceptualizing semantic aggregation as a distributed map-reduce problem, AI.AGG enables data teams to run natural-language instructions over millions of rows of data using a single SQL query.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Here is a look under the hood at how it works, transformative enterprise use cases, and best practices for deploying it in production.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_xGJBEhT.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Turning petabytes of data into semantic insights natively in BigQuery.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Multi-level batching architecture</strong></h3>\n<p style=\"text-align: justify;\"><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> abstracts the immense engineering complexity of chunking and parallel execution. When you execute an </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> query, the BigQuery engine automatically orchestrates a sequence natively within the database:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Row-level validation: </strong><span style=\"vertical-align: baseline;\">The engine helps verify no single row exceeds the maximum context window (dropping or returning an error on payloads &gt;10 MiB).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Context-safe batching:</strong><span style=\"vertical-align: baseline;\"> The engine dynamically groups input rows into smaller batches that safely fit within the token limits of your chosen Gemini endpoint.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Parallel inference: </strong><span style=\"vertical-align: baseline;\">Your natural-language SQL prompt is applied to each batch in parallel, generating intermediate semantic summaries via Vertex AI.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Recursive synthesis:</strong><span style=\"vertical-align: baseline;\"> Finally, the system batches these intermediate outputs together and passes them back to the LLM with the exact same instruction. This reduction repeats recursively until a single, final aggregated string is produced per SQL </span><code style=\"vertical-align: baseline;\">GROUP BY</code><span style=\"vertical-align: baseline;\"> clause.</span></p>\n</li>\n</ol>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Because </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> requires deep reasoning to synthesize concepts across disparate batches, it relies entirely on full-weight LLMs for every stage of its pipeline — differentiating it from row-level functions like </span><code style=\"vertical-align: baseline;\">AI.CLASSIFY</code><span style=\"vertical-align: baseline;\">, which can leverage distilled CPU proxy models.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Built for the multimodal enterprise</strong></h3>\n<p style=\"text-align: justify;\"><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> natively supports both text and multimodal inputs. By leveraging BigQuery Object Tables and the </span><code style=\"vertical-align: baseline;\">OBJ.GET_ACCESS_URL</code><span style=\"vertical-align: baseline;\"> function, analytics teams can aggregate visual insights across thousands of images stored directly in Cloud Storage with no data movement or transcoding required.</span></p>\n<p style=\"text-align: justify;\"><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"font-style: italic; vertical-align: baseline;\">Data engineering pro-tip: The NULL exclusivity rule</span></p>\n<p style=\"text-align: justify;\"><span style=\"font-style: italic; vertical-align: baseline;\">When evaluating multiple columns, users often pass a STRUCT into the function. However, if even a single field within that composite structure evaluates to NULL, the entire row is treated as NULL and silently discarded. Always explicitly wrap nullable fields with IFNULL() (e.g., IFNULL(description, 'No data provided')) to help verify your data safely enters the pipeline.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Transformative enterprise use cases</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The true analytical power of </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> emerges when combined with standard SQL </span><code style=\"vertical-align: baseline;\">GROUP BY</code><span style=\"vertical-align: baseline;\"> operations.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. Diagnostic analysis of high-volume system logs</strong></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">System logs generated by globally distributed microservices often hide subtle degradations (like memory thrashing or systemic clock drift) that never throw explicit fatal errors. Using </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\">, DevOps teams can group millions of logs by system component and generate targeted, human-readable diagnostic summaries.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Prompting Tip: Instruct the model to explicitly describe the \"normal operation\" of the component before hunting for anomalies. This helps suppress the LLM's tendency to hallucinate errors on completely healthy logs.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">2. Building the \"agentic data cloud\"</strong></h4>\n<p style=\"text-align: justify;\"><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> isn't just an analytical reporting tool; it’s a dynamic orchestration engine. Imagine acquiring a massive repository of legacy support tickets with no clear categorization. You can deploy </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> to read the raw text, synthesize a definitive list of categories, and output them as a strict JSON array.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">By unpacking this array via </span><code style=\"vertical-align: baseline;\">JSON_VALUE_ARRAY</code><span style=\"vertical-align: baseline;\"> and feeding those dynamic labels directly into row-level classifiers like </span><code style=\"vertical-align: baseline;\">AI.CLASSIFY</code><span style=\"vertical-align: baseline;\">, you can orchestrate an end-to-end, autonomous data labeling pipeline natively in SQL — reducing the need for external Python scripts.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Prompt engineering is data engineering</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">When integrating generative models into highly deterministic SQL pipelines, standard conversational prompts will often fail. Prompting for programmatic SQL outputs is a strict engineering discipline:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Explicit output contracts: Treat the prompt as an API contract. Append commands like: \"Return exactly one valid JSON array of strings. Do not include markdown code blocks or conversational text.\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Contextual delimiters: Use string concatenation with explicit labels (e.g., </span><code style=\"vertical-align: baseline;\">'- Description: '</code><span style=\"vertical-align: baseline;\">) to anchor the LLM and prevent it from conflating fields across dense batches.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Failure state design: Explicitly instruct the model to return strict null values for missing information rather than guessing, preventing schema hallucinations downstream.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Few-shot anchoring: Provide a literal example of your expected structure within the prompt to heavily ground the model's attention mechanism.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Governance, cost management, and guardrails</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Transitioning semantic workloads to production requires operational oversight. Because of the recursive batching architecture, the total tokens sent to Gemini will be greater than the token count of your source data. To mitigate costs, mandate strict </span><code style=\"vertical-align: baseline;\">WHERE</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">LIMIT</code><span style=\"vertical-align: baseline;\"> pre-filtering.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Furthermore, for workflows cross-referencing massive, static datasets, BigQuery supports Gemini Context Caching, which can reduce input token costs and execution latency. Use the </span><code style=\"vertical-align: baseline;\">AI.COUNT_TOKENS</code><span style=\"vertical-align: baseline;\"> utility to estimate query costs prior to execution.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Administrators can operate knowing </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> works strictly within BigQuery's governance framework, supporting VPC Service Controls (VPC-SC) to prevent data exfiltration. Furthermore, if a transient error occurs during a batch process, the function degrades gracefully — skipping the rejected rows rather than crashing the entire query.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Preview guardrails to keep in mind:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The final output string per SQL group is strictly capped at 10,000 tokens per group. Ask the model for concise output</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Individual payload rows must not exceed 10 MiB.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">When processing multimodal arrays, limit image assets to fewer than 10 images per row to avoid silent skipping.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For optimal stability, we recommend processing a maximum of 20 million rows and outputting a maximum of 1,000 distinct SQL groups per query.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Putting AI.AGG into practice</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">To help you get started, here are examples of how </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> is used to synthesize insights alongside traditional SQL metrics.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Macro-level topic discovery</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Summarize what specific top authors talk about, turning thousands of their comments into a concise narrative</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;WITH top_commenters AS (\\r\\n SELECT\\r\\n   `by` AS author,\\r\\n   `text`\\r\\n FROM `bigquery-public-data.hacker_news.full`\\r\\n WHERE `type` = &#x27;comment&#x27;\\r\\n   AND `by` IN (&#x27;dang&#x27;, &#x27;patio11&#x27;, &#x27;tptacek&#x27;)\\r\\n LIMIT 5000\\r\\n)\\r\\nSELECT\\r\\n author,\\r\\n AI.AGG(\\r\\n   `text`,\\r\\n   &#x27;These are comments written by this user on a tech forum. Tell me what topics this user talks about the most and what their general tone is. Keep it concise.&#x27;\\r\\n ) AS author_persona\\r\\nFROM top_commenters\\r\\nGROUP BY author;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f427d577b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_PRKEHfd.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Autonomous diagnostic reporting for DevOps (log analysis)</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Instead of counting standard HTTP error codes, use </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\"> to read thousands of raw stack traces and log messages, grouping them by the microservice name to find the qualitative root cause of systemic failures.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT \\r\\n  service_name,\\r\\n  COUNT(*) AS total_errors,\\r\\n  AI.AGG(\\r\\n    STRUCT(error_code, log_message, stack_trace), \\r\\n    &#x27;Analyze these error logs and stack traces. Provide a concise, two-sentence summary of the primary root cause or pattern causing failures in this service.&#x27;\\r\\n  ) AS diagnostic_summary \\r\\nFROM `my_project.ops_logs.application_errors` \\r\\nWHERE severity = &#x27;CRITICAL&#x27; AND timestamp &gt;= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 24 HOUR)\\r\\nGROUP BY service_name \\r\\nORDER BY total_errors DESC;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f427d45b810&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">The next era of the data warehouse</strong></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">With </span><code style=\"vertical-align: baseline;\">AI.AGG</code><span style=\"vertical-align: baseline;\">, Google Cloud is democratizing access to semantic analysis at petabyte scale. By marrying the deterministic grouping power of BigQuery’s relational engine with the macroscopic reasoning capabilities of Vertex AI Gemini, we are transforming the enterprise data warehouse from a passive repository of historical metrics into an active, semantic runtime capable of deep, holistic intelligence.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Ready to unlock the semantic value of your enterprise data? Head over to the Google Cloud console, explore the BigQuery documentation, and run your first semantic aggregation today.</span></p></div>"
  "29a627bc3bbe47bb3066c882b9555b64":
    "id": "29a627bc3bbe47bb3066c882b9555b64"
    "title": "Gemini Omni 1.2 Flash: Fast, cost-effective, and reliable video generation and editing now generally available"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-omni-1-2-flash-generally-available/"
    "published": "2026-11-06 02:00:00"
    "fetched": "2026-11-06 04:31:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, Gemini Omni 1.2 Flash is generally available on Google Cloud. Built for the everyday videos businesses make in volume — like product videos, virtual try-ons, and ads — this model is fast, cost-effective, and follows your image, video and audio references more closely than before.  </span></p>\n<p><span style=\"vertical-align: baseline;\">Business users can create with it in Gemini for business and Google Vids, and developers can build with it via API.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here's what's new:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">A lower price:</strong><span style=\"vertical-align: baseline;\"> $0.07 per second of 720p video, 30% less than Gemini Omni 1.1 Flash, with similar savings at other resolutions.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Longer clips:</strong><span style=\"vertical-align: baseline;\"> Generate and edit videos of up to 15 seconds, up from 10s.</span></li>\n<li><strong style=\"vertical-align: baseline;\">More consistent results:</strong><span style=\"vertical-align: baseline;\"> stronger adherence to image and video references keeps products, characters, and brand details consistent from shot to shot.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Faster drafts, in higher resolution:</strong><span style=\"vertical-align: baseline;\"> create drafts at 360p or 720p, then upscale the best creations to 1080p or 4K.</span></li>\n<li><strong style=\"vertical-align: baseline;\">More natural speech: </strong><span style=\"vertical-align: baseline;\">You can generate scenes with more fluid, natural-sounding dialogue, clearer lip-sync, and distinct multi-speaker conditioning.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Editing in conversation:</strong><span style=\"vertical-align: baseline;\"> refine the same clip, such as swapping a product, changing lighting, or changing camera angle, instead of starting over.</span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Note: Audio references are gated behind allowlisting.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Gemini Omni 1.2 Flash is ready for production</strong></h3>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Gemini Omni 1.2 Flash is production-ready and backed by Google Cloud’s enterprise-grade infrastructure and security, offering </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Provisioned Throughput</span></a><span style=\"vertical-align: baseline;\">. Outputs carry an imperceptible </span><a href=\"https://deepmind.google/models/synthid/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SynthID</span></a><span style=\"vertical-align: baseline;\"> watermark.</span></span></p>\n<h3><span style=\"vertical-align: baseline;\">Video creation inside the tools people already use</span></h3>\n<p><span style=\"vertical-align: baseline;\">Design and creative platforms are building Gemini Omni 1.2 Flash directly into their products, so their users can create and edit videos where they already work. Here’s how customers are already using Gemini Omni 1.2 Flash:</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"artlist\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/artlist.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“At Artlist, we’re focused on giving creators the control and flexibility to bring their ideas to life. Gemini Omni 1.2 Flash brings exciting capabilities in reference-based generation, video extension, and creative consistency, helping our customers move from experimentation to professional content production at scale.” – Roee Peled, CPTO, Artlist.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=OofOq-NaYXI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Artlist uses Gemini 1.2 Omni Flash to bring creative ideas to life</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=OofOq-NaYXI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Artlist uses Gemini 1.2 Omni Flash to bring creative ideas to life</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"flora\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/flora.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“Creative teams need models that they can rely on consistently. Gemini Omni 1.2 Flash edits exactly what you ask for, a colorway or a background, and leaves the product untouched, even from detailed images and finished video. Its video-to-video takes footage into entirely new styles.” – Andrew Taco Zhang, Product Marketing Manager, FLORA.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Opx8Uf6vcqg\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">FLORA uses Gemini Omni 1.2 Flash to create new styles</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Opx8Uf6vcqg\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">FLORA uses Gemini Omni 1.2 Flash to create new styles </span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"invideo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/invideo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We ran Gemini Omni 1.2 Flash through our evals at invideo. Honestly, it's really good. It sticks to the prompt, and the physics and sound feel real. If you need fast video at scale, it's one of the best we've tested. And 15 seconds means a full scene in one go.” – Shivam Rastogi, VP of Engineering, invideo.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=FQ5wy13QqGo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">invideo uses Gemini Omni 1.2 Flash to create full scenes in one prompt</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=FQ5wy13QqGo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">invideo uses Gemini Omni 1.2 Flash to create full scenes in one prompt</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Krea\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Krea.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“We’re really impressed by how fast and accurate this new model is. The outputs retain an amazing level of detail, and the model does a great job of making only the changes we ask for while keeping everything else consistent. We’re excited to use it for character and scene replacements, as well as other creative workflows.” – Numan Khan, Creative Specialist, Krea.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=BZqcrwXwF3E\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Krea uses Gemini Omni 1.2 Flash for their creative workflows, from character to scene replacements</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=BZqcrwXwF3E\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Krea uses Gemini Omni 1.2 Flash for their creative workflows, from character to scene replacements</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Picsart\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Picsart.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>\"Gemini Omni 1.2 fits the way our teams work. Draft mode lets us iterate concepts in minutes, then render in 4K for TV-ready AI dramas. Text stays crisp across frames, characters look and sound real, and the speed keeps production moving. Now that it is generally available, we can bring this quality to over 100M Picsart creators.\" – Narek Hayrapetyan, Head of Product and Partnerships, Picsart.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=wZpPW8r3bJQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Picsart uses Gemini 1.2 Flash to iterate concepts in minutes</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=wZpPW8r3bJQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Picsart uses Gemini 1.2 Flash to iterate concepts in minutes</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Runway\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Runway.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Runway empowers creatives with advanced AI video tools to produce high-quality content. For organizations, Runway’s enterprise solutions deliver robust collaborative tools to scale professional production. Here is what they created with Gemini Omni 1.2 Flash.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=TLpQ6VRhTAo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Runway uses Gemini Omni 1.2 Flash to produce and scale high-quality content</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=TLpQ6VRhTAo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Runway uses Gemini Omni 1.2 Flash to produce and scale high-quality content</span></em></sup></p>\n<h3><span style=\"vertical-align: baseline;\">Product and listing videos at catalog scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">Retailers and marketplaces use Gemini Omni to turn the photos they already have into short product spins, lifestyle clips, try-on videos, and video ads. </span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Photoroom\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Photoroom.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“Photoroom turns product photos into video ads that sell in minutes. We chose Gemini Omni Flash to power our Video Ad Maker and Product Animator because it balances quality, speed and cost. Version 1.2 brings 15-second videos, a top user request. With general availability and SLAs, we can rely on it in production for our sellers and enterprise customers.” - Matt Rouif, CEO and Co-founder, Photoroom.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=fwTIGK0ODiU\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Photoroom uses Gemini Omni 1.2 Flash to power their Video Ad Maker and Product Animator</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=fwTIGK0ODiU\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">Photoroom uses Gemini Omni 1.2 Flash to power their Video Ad Maker and Product Animator</span></em></sup></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"QuickFrame ai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/QuickFrame_ai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>“QuickFrame AI helps marketers and business owners create, edit, and launch professional-quality ads for CTV and social in minutes. With Gemini Omni 1.2 Flash now supporting 15-second video generations at 1080p, users can create a complete CTV ad in a single generation, making TV ad creation simpler for businesses of all sizes.” - Richard Girges, Chief Technology Officer, QuickFrame AI.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=bJMy_nJiIng\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">QuickFrame AI uses Gemini Omni 1.2 Flash to create complete CTV ads in a single generation</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=bJMy_nJiIng\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: center;\"><sup><em><span style=\"vertical-align: baseline;\">QuickFrame AI uses Gemini Omni 1.2 Flash to create complete CTV ads in a single generation</span></em></sup></p>\n<h3><strong style=\"vertical-align: baseline;\">Create in Gemini for business, Google Vids and build with the API</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Coming soon to Gemini, business users will be able to create a short video from a prompt or a product photo, right in the chat. In Google Vids, teams can combine generated clips with avatars, music and voiceover to create product explainers, teasers, social posts and sales pitches. Businesses can also embed the capabilities of Gemini Omni 1.2 Flash into their applications and agents via the API.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started with Gemini Omni</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We'll keep improving Gemini Omni based on your feedback, so tell us what you build.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For business users:</strong><span style=\"vertical-align: baseline;\"> Try it in </span><a href=\"https://vids.new\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Vids</span></a><span style=\"vertical-align: baseline;\">; coming soon to </span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for business</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For developers:</strong><span style=\"vertical-align: baseline;\"> Try it in the <a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal?mode=prompt&amp;model=gemini-omni-1.2-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a>,</span><span style=\"vertical-align: baseline;\"> build with the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/omni-1-2-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API</span></a><span style=\"vertical-align: baseline;\">, and see the </span><a href=\"https://cloud.google.com/model-garden/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pricing</span></a><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n</ul></div>"
