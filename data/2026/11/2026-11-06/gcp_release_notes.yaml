    "summary": "<h2 class=\"release-note-product-title\">Bigtable</h2>\n<h3>Feature</h3>\n<p>You can <a href=\"https://docs.cloud.google.com/bigtable/docs/managing-backups#configure-hot-automated-backups\">configure a Bigtable automated backup policy</a>\non SSD instances to create daily <a href=\"https://docs.cloud.google.com/bigtable/docs/backups#hot-backups\">hot backups</a>\nand specify how long the backups remain hot before automatically transitioning\nto standard backups. This feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>.</p>"
