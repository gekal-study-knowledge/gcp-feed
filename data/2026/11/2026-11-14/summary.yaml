  この日は 2 ソースからブログ記事 3 本 (同じ記事が 2 ソースに掲載されたため件数は 4) で、エージェントの可観測性とデータ連携、SC26 向けの HPC の発表が中心でした。Google Data Cloud では AI エージェントの可観測性と評価機能が拡張され、BigQuery と Looker のファーストパーティのデータエージェントに加えて、Agent Development Kit (ADK) や LangGraph などのフレームワークで作ったサードパーティのエージェントも、統一されたテレメトリの枠組みで見られるようになりました。多段の推論を追跡しながら機密データを保護すること、トークン消費とクエリの支出を抑えること、プロンプトやスキーマの変更が利用者に届く前に回答の正確さを評価することという、本番運用の 3 つの課題に対応します。もう 1 本は BigQuery から AlloyDB へのエクスポートが一般提供となった発表で、宣言的な 1 つの SQL 文でデータをエクスポートできるため、ミドルウェアやステージング用バケット、複雑なオーケストレーションを必要としていた逆 ETL (Reverse ETL) が不要になります。ブラジルの電力会社 Copel が、数百万台のスマートメーターのテレメトリを BigQuery の分析レイヤーから低レイテンシの顧客サポートダッシュボードやモバイルアプリへ流す際のオーケストレーションのボトルネックを、この組み込みの逆 ETL に移行して解消した事例が紹介されました。SC26 に合わせては、HPC とサイエンスの知見を再利用可能なエージェントスキルとしてまとめ、複雑な構築や最適化をガイド付きのワークフローに変える取り組みと、アルゴリズムを最適化する進化型エージェントのデモが紹介されています。
