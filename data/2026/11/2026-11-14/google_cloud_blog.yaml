  "742f76ff73eaa9ff1562edcaf24fb2df":
    "id": "742f76ff73eaa9ff1562edcaf24fb2df"
    "title": "From OLAP to OLTP: How Copel Simplified Reverse ETL Using BigQuery's Native Export to AlloyDB"
    "link": "https://cloud.google.com/blog/products/data-analytics/reverse-etl-bigquery-exports-to-alloydb/"
    "published": "2026-11-14 02:00:00"
    "fetched": "2026-11-14 03:22:56"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Bridging the gap between analytical systems (OLAP) and transactional databases (OLTP) is notoriously complex. Synchronizing data between the two systems, often called Reverse ETL (Extract, Transform, Load), traditionally requires heavy middleware, staging buckets, and complex orchestration, especially at enterprise scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">We’re announcing the general availability (GA) of </span><a href=\"https://docs.cloud.google.com/bigquery/docs/export-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery exports to AlloyDB</span></a><span style=\"vertical-align: baseline;\">, allowing data engineering teams to use a single, declarative SQL statement to export data from BigQuery to AlloyDB. This approach completely removes the need for complex ETL middleware.</span></p>\n<p><span style=\"vertical-align: baseline;\">To demonstrate the benefits of this feature, we are sharing how </span><a href=\"https://ri.copel.com/en/copel/corporate-profile/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Copel</span></a><span style=\"vertical-align: baseline;\">, a Brazilian electric power provider, eliminated a massive orchestration bottleneck and scaled their smart meter telemetry by migrating to high-performance, built-in Reverse ETL.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The challenge of scaling smart meter telemetry</strong></h3>\n<p><span style=\"vertical-align: baseline;\">At Copel, managing telemetry data from millions of smart electricity meters is a mission-critical operation. This data is streamed continuously and consolidated in an analytical </span><span style=\"font-style: italic; vertical-align: baseline;\">Gold</span><span style=\"vertical-align: baseline;\"> layer in BigQuery. However, to power Copel's \"Systems of Action\" — low-latency customer support dashboards, mobile applications, and operational billing systems — this rich dataset must be constantly synced back into its high-performance transactional database, AlloyDB for PostgreSQL.</span></p>\n<p><span style=\"vertical-align: baseline;\">Until recently, Copel orchestrated this Reverse ETL architecture with a complex </span><a href=\"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dags.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DAG</span></a><span style=\"vertical-align: baseline;\"> in Google’s Managed Service for Apache Airflow. However, there were multiple brittle, intermediate stages in the process of enriching and exporting hundreds of millions of records from BigQuery to AlloyDB:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"From OLAP to OLTP - Image 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/From_OLAP_to_OLTP_-_Image_1.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Copel’s legacy multi-stage architecture requiring Cloud Storage file dumps and sequential gCloud scripts.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">BigQuery ran enrichment and extraction queries, dumping SQL results into dozens of fragmented CSV files inside a Google Cloud Storage bucket.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Apache Airflow executed SQL to create temp tables in AlloyDB to prevent write locking or data corruption for production tables.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sequential gCloud scripts combed through the Cloud Storage CSVs to load data into a respective AlloyDB cluster and shards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Finally, a SQL transaction block safely dropped the production table and renamed the temporary table to production.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">To run this legacy architecture, Copel’s team needed to maintain the pipeline, carefully manage file staging, perform complex IAM impersonation across multiple services, and constantly monitor end-to-end system health.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The breakthrough: Built-in Reverse ETL</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With </span><a href=\"https://docs.cloud.google.com/bigquery/docs/export-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery's </span><code style=\"text-decoration: underline; vertical-align: baseline;\">EXPORT DATA</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> to AlloyDB</span></a><span style=\"vertical-align: baseline;\">, Copel was able to replace this entire multi-step pipeline infrastructure with a single, elegant SQL statement.</span></p>\n<p><span style=\"vertical-align: baseline;\">Now, BigQuery exports communicate directly with AlloyDB instances over highly optimized, parallelized connections — no staging files in Cloud Storage, gCloud scripts, or managing temporary tables required!</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"From OLAP to OLTP - Image 2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/From_OLAP_to_OLTP_-_Image_2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: New architecture showing direct parallel Reverse ETL connection between BigQuery and AlloyDB.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Here is how simple the new Reverse ETL process looks in code:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;EXPORT DATA\\r\\n  WITH CONNECTION `project_id.location.connection_id`\\r\\n  OPTIONS(\\r\\n    format=\\&#x27;ALLOYDB\\&#x27;,\\r\\n    uri=&quot;https://alloydb.googleapis.com/v1/projects/my-project/locations/my-location/clusters/my-cluster/instances/my-instance&quot;,\\r\\n    alloydb_options=&quot;&quot;&quot;{\\r\\n      &quot;table&quot;: &quot;operational_telemetry&quot;\\r\\n    }&quot;&quot;&quot;\\r\\n  )\\r\\nAS SELECT \\r\\n  meter_id,\\r\\n  reading_timestamp,\\r\\n  -- On-the-fly serialization to JSONB\\r\\n  TO_JSON(hourly_metrics) AS hourly_metrics_jsonb\\r\\nFROM \\r\\n  `project_id.dataset_id.smart_meter_telemetry`;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f82c8638510&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The resulting BigQuery values map perfectly to AlloyDB's columns during the export, leaving the nested structures fully queryable and indexable on the PostgreSQL side.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Evaluating performance and scalability</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To validate this new architecture, Copel executed two large-scale Reverse ETL benchmarks: comparing the performance and scalability of a smaller incremental Reverse ETL export against a much larger full-table Reverse ETL export.</span></p>\n<p><span style=\"vertical-align: baseline;\">The performance results exceeded all initial expectations:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 98.1723%;\"><colgroup><col style=\"width: 28.5075%;\" /><col style=\"width: 35.6716%;\" /><col style=\"width: 35.6716%;\" /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Metric</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Test 1: Incremental Export</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Test 2: Full-Table Export</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Total Rows Exported</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">18,145,589 rows</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">207,484,577 rows</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Logical Data Size</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2.32 GB</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">188.87 GB</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Export Throughput</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~3.1 Million rows / minute</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">~4.2 Million rows / minute</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB Specs</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">N2 (16 vCPUs, 128 GB RAM)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">N2 (16 vCPUs, 128 GB RAM)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">CPU Utilization</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Hovered stably at ~85%</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Hovered stably at ~85%</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p><strong style=\"vertical-align: baseline;\">Pro-tip on ingestion</strong><span style=\"vertical-align: baseline;\">: Sustaining an export throughput of ~4.2 million rows/minute on complex </span><code style=\"vertical-align: baseline;\">JSONB</code><span style=\"vertical-align: baseline;\"> telemetry fields is an outstanding technical achievement. It highlights the low-level optimizations between BigQuery's distributed processing engine and AlloyDB's advanced storage layer.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key takeaways and benefits</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By adopting this declarative SQL approach, Copel successfully deleted dozens of lines of complex scripting and custom error-handling blocks. Their Airflow DAG now contains a single, simplified </span><code style=\"vertical-align: baseline;\">BigQueryInsertJobOperator</code><span style=\"vertical-align: baseline;\"> task that executes the export query.</span></p>\n<p><span style=\"vertical-align: baseline;\">This built-in approach unlocks several core business benefits:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct cost reduction: </strong><span style=\"vertical-align: baseline;\">By bypassing Cloud Storage entirely, there are no staging storage costs and associated API read/write operation fees.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enhanced data security: </strong><span style=\"vertical-align: baseline;\">Data moves directly from BigQuery to AlloyDB inside Google's secure internal network without ever being dumped into readable CSV files.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Near-zero maintenance: </strong><span style=\"vertical-align: baseline;\">Pipeline errors are now contained within a single SQL statement, making troubleshooting and logging drastically simpler.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Massive distributed writing</strong><span style=\"vertical-align: baseline;\">: The direct export achieved write speeds exceeding 4 million records per minute by leveraging BigQuery's massive parallelism combined with AlloyDB's optimized PostgreSQL write performance.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Now, rather than spending valuable engineering hours monitoring pipeline failures and intermediate storage buffers, data engineering teams can focus on what matters: delivering smart analytics and premium experiences to customers.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started today: Modernize your Reverse ETL</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Now that BigQuery exports to AlloyDB are generally available, there has never been a better time to simplify your data architecture. If your team is struggling with complex, multi-stage pipelines to push BigQuery data into downstream OLTP databases, we invite you to try built-in export functionality for </span><a href=\"https://docs.cloud.google.com/bigquery/docs/export-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/bigquery/docs/export-to-bigtable\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bigtable</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/bigquery/docs/export-to-spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\">, or </span><a href=\"https://docs.cloud.google.com/bigquery/docs/export-to-pubsub\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Pub/Sub</span></a><span style=\"vertical-align: baseline;\"> today.</span></p></div>"
  "4eefdf9fb8820926143aa149f7cfd1df":
    "id": "4eefdf9fb8820926143aa149f7cfd1df"
    "title": "Where supercomputing meets agentic AI: What’s new in Google Cloud HPC and AI at SC26"
    "link": "https://cloud.google.com/blog/topics/hpc/whats-new-in-hpc-and-ai-at-sc26/"
    "published": "2026-11-14 02:00:00"
    "fetched": "2026-11-14 03:22:56"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Computational scientists and HPC engineers have always been among the earliest adopters of new computing paradigms, and agents are no exception. Today, research and engineering teams use AI models and agents for things such as ingesting dense scientific literature, optimizing code, and autonomously steering simulations. </span></p>\n<p><span style=\"vertical-align: baseline;\">Yet moving from an agent that suggests code optimizations to an agentic system that reliably architects, provisions, and optimizes production HPC workloads at scale takes more than a general-purpose reasoning model. Without deep infrastructure and domain context, an unguided agent can still pair incompatible storage tiers with compute-optimized VMs, overlook placement policies, or stall when diagnosing a multi-node MPI fabric error. </span></p>\n<p><span style=\"vertical-align: baseline;\">That challenge led our team to ask a simple question: </span><span style=\"font-style: italic; vertical-align: baseline;\">What if we could package our deep HPC and scientific expertise into reusable agent skills, turning complex setup and optimization into guided workflows?</span></p>\n<p><span style=\"vertical-align: baseline;\">At SC26, we are showing how Google Cloud brings agentic HPC to life with reusable skills that teach agents how to build and run HPC workloads. In addition, we’re also demonstrating evolutionary agents that optimize your algorithms at cloud scale, and purpose-built supercomputing infrastructure designed for where HPC meets AI.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Teaching agents to speak HPC: From blueprints to skills</span></h3>\n<p><span style=\"vertical-align: baseline;\">Organizations rely on </span><a href=\"https://docs.cloud.google.com/cluster-toolkit/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cluster Toolkit</span></a><span style=\"vertical-align: baseline;\"> to deploy repeatable, production-ready HPC environments on Google Cloud through declarative YAML blueprints. Now we are expanding these capabilities by pairing Cluster Toolkit with composable agent skills with self-describing, deterministic tools, validated through automated, end-to-end testing and available for download from the </span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://github.com/google-deepmind/science-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DeepMind Science Skills</span></a><span style=\"vertical-align: baseline;\"> repositories. Together, this delivers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Infrastructure skills that validate before they deploy</strong><span style=\"vertical-align: baseline;\">: When you ask an agent to stand up a cluster, the skill directs it to first audit your compute and storage quotas, run rapid canary checks for regional capacity, match your workload to a validated Cluster Toolkit blueprint, and wait for human approval, all before running the </span><span style=\"vertical-align: baseline;\">gcluster deploy</span><span style=\"vertical-align: baseline;\"> command.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Workload-specific skills that know the science</strong><span style=\"vertical-align: baseline;\">: After your cluster is live, domain skills connected to </span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://github.com/google-deepmind/science-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DeepMind Science Skills</span></a><span style=\"vertical-align: baseline;\"> guide the agent through things like configuring OpenFOAM and Siemens STAR-CCM+ fluid dynamics runs, tuning GROMACS and AlphaFold 3 life-sciences pipelines, or launching Devito and Open Porous Media (OPM) subsurface simulations with browser-based 3D visualization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Built-in governance and Day-2 diagnostics</strong><span style=\"vertical-align: baseline;\">: Agents operate inside strict IAM, Kueue quota, and budget guardrails, with full provenance in Cloud Logging and structured troubleshooting skills (</span><span style=\"vertical-align: baseline;\">gke-kueue-debugging</span><span style=\"vertical-align: baseline;\">) to resolve stuck queues or node drains automatically.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Scaling from local prototype to breakthrough code</span></h3>\n<p><span style=\"vertical-align: baseline;\">Configuring and running existing solvers is only part of the discovery loop. Across financial services, electronic design automation (EDA), manufacturing, logistics, pharmaceuticals, and AI training, competitive advantage comes from having the fastest underlying code and algorithms. Historically, squeezing out performance gains required scarce optimization specialists and costly brute-force compute.</span></p>\n<p><span style=\"vertical-align: baseline;\">Developed by Google DeepMind, </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/alphaevolve-is-available-for-everyone\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaEvolve</span></a><span style=\"vertical-align: baseline;\"> changes the equation by using a Gemini-powered evolutionary loop to iteratively mutate, benchmark, and optimize code and 3D engineering parameters against target metrics. The </span><strong style=\"vertical-align: baseline;\">AlphaEvolve on Cloud Batch solution, </strong><span style=\"vertical-align: baseline;\"> streamlines the process of moving from a seed algorithm on a laptop to massive parallel experimentation. With Batch, you get:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated parallel evaluation</strong><span style=\"vertical-align: baseline;\">: A single gcluster blueprint provisions the AlphaEvolve controller environment and uses Batch to fan out hundreds of candidate evaluations concurrently across single-VM sandboxes or multi-node MPI task groups.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Interactive control from your preferred surface</strong><span style=\"vertical-align: baseline;\">: Researchers can steer evolutionary experiments and inspect candidate lineage through hosted Python notebooks, or integrate optimization runs directly into their existing CLI workloads and agent-driven development tools. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Evaluation at production scale</strong><span style=\"vertical-align: baseline;\">: Evolving an algorithm on a single node with slow networking risks producing code that only performs well at small scale. By evaluating candidates across Google Cloud compute instances with </span><strong style=\"vertical-align: baseline;\">Cloud RDMA</strong><span style=\"vertical-align: baseline;\"> and </span><strong style=\"vertical-align: baseline;\">Google Cloud Managed Lustre </strong><span style=\"vertical-align: baseline;\">— and using </span><strong style=\"vertical-align: baseline;\">Spot VMs</strong><span style=\"vertical-align: baseline;\"> or </span><strong style=\"vertical-align: baseline;\">Dynamic Workload Scheduler (DWS)</strong><span style=\"vertical-align: baseline;\"> to balance cost against turnaround time — you discover algorithms tuned for real supercomputing fabrics, permanently lowering the compute cost of every future production run.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Supercomputing infrastructure under the hood</span></h3>\n<p><span style=\"vertical-align: baseline;\">An autonomous workflow is only as capable as the infrastructure beneath it. As agentic pipelines pivot dynamically between memory-bandwidth-bound physics solvers, domain foundation models (like </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/alphafold-3\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaFold 3</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/alphagenome\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaGenome</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://developers.google.com/weathernext/guides/models\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">WeatherNext</span></a><span style=\"vertical-align: baseline;\">), and large-scale AI training, Google Cloud provides a unified hardware and orchestration fabric managed by </span><a href=\"https://docs.cloud.google.com/cluster-director/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cluster Director</span></a><span style=\"vertical-align: baseline;\"> that offers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Tightly coupled HPC and scale-out compute</strong><span style=\"vertical-align: baseline;\">: Run classic MPI simulations on </span><a href=\"https://docs.cloud.google.com/compute/docs/compute-optimized-machines#h4d_series\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">H4D</strong><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">instances powered by 5th Gen AMD EPYC processors and Cloud RDMA, including 3 TB high-memory shapes built for large EDA and engineering models. Alternatively, you can maximize performance-per-watt on Arm-based </span><a href=\"https://docs.cloud.google.com/compute/docs/general-purpose-machines#c4a_series\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">C4A</strong></a><span style=\"vertical-align: baseline;\"> instances powered by Google Axion.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Next-generation GPU acceleration</strong><span style=\"vertical-align: baseline;\">: Run coupled physics-AI pipelines and multi-node GPU simulations on </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a4-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A4</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a4x-vms\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A4X</span></a><span style=\"vertical-align: baseline;\"> instances (NVIDIA Blackwell B200 and GB200 NVL72), scale frontier AI training and reasoning on newly available </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#a5x-instances\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A5X</span></a><span style=\"vertical-align: baseline;\"> bare metal instances built on the NVIDIA Vera Rubin NVL72 platform, and use </span><a href=\"https://docs.cloud.google.com/compute/docs/accelerator-optimized-machines#g4-series\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G4</span></a><span style=\"vertical-align: baseline;\"> instances with NVIDIA RTX PRO 6000 Blackwell GPUs to accelerate CAE, CFD, and 3D visualization while reducing per-core software licensing costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">8th gen TPUs for the agentic era</strong><span style=\"vertical-align: baseline;\">: Deploy </span><a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/google-cloud/eighth-generation-tpu-agentic-era/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">8th generation TPUs</span></a><span style=\"vertical-align: baseline;\">, featuring </span><strong style=\"vertical-align: baseline;\">TPU 8t</strong><span style=\"vertical-align: baseline;\"> for large-scale pre-training, reinforcement learning, and accelerated mathematical modeling and simulation (ModSim), alongside </span><strong style=\"vertical-align: baseline;\">TPU 8i</strong><span style=\"vertical-align: baseline;\"> for high-throughput, low-latency reasoning and agentic inference. Additionally, </span><a href=\"https://docs.cloud.google.com/batch/docs/create-run-job-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Batch now supports running jobs on single-host TPU slices</span></a><span style=\"vertical-align: baseline;\">, providing flexible provisioning options for accelerated HPC and AI/ML workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-millisecond parallel storage</strong><span style=\"vertical-align: baseline;\">: Reduce data bottlenecks between simulation and AI stages with </span><a href=\"https://docs.cloud.google.com/managed-lustre/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"vertical-align: baseline;\">, delivering up to 10 TB/s of read throughput, GPUDirect Storage over RDMA, and an 80 PB Dynamic Tier with Cloud Storage Mirroring. For even more performance, you can pair it with </span><strong style=\"vertical-align: baseline;\">Cloud Storage FUSE</strong><span style=\"vertical-align: baseline;\"> local SSD caching.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Experience it live at SC26 in Chicago</span></h3>\n<p><span style=\"vertical-align: baseline;\">Agentic HPC is not about turning unguided models loose on a terminal. This shift is about combining the reasoning power of Gemini with the codified engineering of Cluster Toolkit skills, evolutionary optimization on Batch, and purpose-built supercomputing hardware — so your teams spend their time on discovery rather than infrastructure plumbing.</span></p>\n<p><span style=\"vertical-align: baseline;\">Visiting SC26 (November 15–20)? Stop by </span><strong style=\"vertical-align: baseline;\">Booth #3418</strong><span style=\"vertical-align: baseline;\"> at McCormick Place West for live demos of </span><strong style=\"vertical-align: baseline;\">Antigravity for HPC</strong><span style=\"vertical-align: baseline;\">, the </span><strong style=\"vertical-align: baseline;\">HPC Prompt Playground</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">AlphaEvolve for HPC</strong><span style=\"vertical-align: baseline;\">, and join us at our </span><a href=\"https://sites.google.com/view/advancedcomputingcommunity/sc26-workshop\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Advanced Computing Community Half-Day Workshop</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://sc26.conference-program.com/presentation/?id=bof188&amp;sess=sess382\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic and Hybrid HPC Birds of a Feather (BoF) session</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">To start building today, explore the </span><a href=\"https://docs.cloud.google.com/cluster-toolkit/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Cluster Toolkit</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/solutions/hpc\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud HPC solutions</span></a><span style=\"vertical-align: baseline;\">. To access and implement these agentic workflows, download the validated templates from the </span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Skills</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://github.com/google-deepmind/science-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DeepMind Science Skills</span></a><span style=\"vertical-align: baseline;\"> repositories.</span></p></div>"
  "0f484673871587c484c8022ee6753570":
    "id": "0f484673871587c484c8022ee6753570"
    "title": "New AI agent observability and governance across BigQuery and Looker"
    "link": "https://cloud.google.com/blog/products/data-analytics/enterprise-ai-agent-observability-with-bigquery-and-looker/"
    "published": "2026-11-14 02:00:00"
    "fetched": "2026-11-14 03:22:56"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As enterprises move AI agents from experimental prototypes into production, data and platform teams are discovering that deploying an agent is only half the battle — you also need to see how it reasons, which data it touches, and what it costs to run. Today, we are announcing expanded AI agent observability and evaluation capabilities across Google Data Cloud, giving you unified visibility into your first-party (1P) data agents in </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/looker\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker</span></a><span style=\"vertical-align: baseline;\"> as well as custom third-party (3P) agents built with agent development frameworks such as </span><a href=\"https://google.github.io/adk-docs/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Development Kit (ADK)</span></a><span style=\"vertical-align: baseline;\"> or LangGraph.</span></p>\n<p><span style=\"vertical-align: baseline;\">Putting conversational and autonomous agents into production requires solving three operational challenges: tracing multi-step reasoning while protecting sensitive data, controlling token consumption and query spend, and evaluating answer accuracy before prompt or schema changes reach users. Let’s explore how our new agent observability and evaluation capabilities help you do this. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">What's new: Agent observability across Data Cloud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Running agents at scale means you need to see how they perform, what they cost, and what actions they take. We're rolling out a unified telemetry framework across Google's Agentic Data Cloud that works the same way for every agent: Capture telemetry from the agent, land it in BigQuery tables you own, and analyze it wherever your teams already work.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - Unified Agent Observability Framework across BigQuery and Looker\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_Unified_Agent_Observability_Framework_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Unified agent observability framework capturing logging telemetry across 1P and 3P agents into BigQuery to surface performance and usage insights across developer and admin tools.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">1. Capture telemetry from every first-party and custom agent</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">First-party data agents:</strong><span style=\"vertical-align: baseline;\"> Out-of-the-box Conversational Analytics agents emit telemetry automatically with no setup required. Queries routed to BigQuery data agents in Gemini Enterprise through agent-to-agent (A2A) workflows (now GA) send Cloud Monitoring metrics, Cloud Trace spans, and BigQuery conversation logs straight into your agent's project.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Custom agents:</strong><span style=\"vertical-align: baseline;\"> Agents built with ADK or LangGraph stream the same structured telemetry into BigQuery through single-line SDK instrumentation.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">2. Land telemetry in one governed home in BigQuery</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Conversation logging in BigQuery (GA):</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/bigquery/docs/conversation-logging-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed 1P conversation logging</span></a><span style=\"vertical-align: baseline;\"> writes to BigQuery tables you own, so you can inspect Conversational Analytics traces, including prompts and responses, directly in your data warehouse.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Governed by default:</strong><span style=\"vertical-align: baseline;\"> The </span><a href=\"https://cloud.google.com/gemini/docs/conversational-analytics-api/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Conversational Analytics API</span></a><span style=\"vertical-align: baseline;\">, now GA, includes always-on admin audit logs and optional data-read audit logs in </span><a href=\"https://cloud.google.com/gemini/docs/conversational-analytics-api/audit-logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Audit Logs</span></a><span style=\"vertical-align: baseline;\">, and supports VPC Service Controls, customer-managed encryption keys (CMEK), and </span><a href=\"https://cloud.google.com/gemini/docs/conversational-analytics-api/data-residency\"><span style=\"text-decoration: underline; vertical-align: baseline;\">regional and multi-regional data residency</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">3. Analyze with dashboards wherever your teams work</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">In BigQuery (GA):</strong><span style=\"vertical-align: baseline;\"> Agent monitoring provides prebuilt </span><a href=\"https://cloud.google.com/bigquery/docs/create-data-agents#monitor_agents_and_conversations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dashboards in BigQuery Studio</span></a><span style=\"vertical-align: baseline;\"> to track usage, active sessions, top knowledge sources, and latency across BigQuery Conversational Analytics agents.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - BigQuery Studio Conversational Analytics Dashboard\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_BigQuery_Studio_Conversational_Analyti.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>BigQuery Conversational Analytics dashboard in BigQuery Studio, giving admins visibility into usage, active sessions, top knowledge sources, and latency.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">In Looker (GA):</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/looker/docs/system-activity-dashboards#conversational-analytics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">System Activity dashboards</span></a><span style=\"vertical-align: baseline;\"> for Conversational Analytics, now GA in Looker (Google Cloud core) and Looker (original), track engagement and token usage, while user ratings and query review in the Responses &amp; feedback tab are in preview.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - Looker System Activity Conversational Analytics Dashboard\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_-_Looker_System_Activity_Conversational_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Looker Conversational Analytics dashboard in System Activity, giving admins visibility into usage, token consumption, and user feedback.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li><strong style=\"vertical-align: baseline;\">Build your own:</strong><span style=\"vertical-align: baseline;\"> Create interactive reports with the open-source </span><a href=\"https://googlecloudplatform.github.io/BigQuery-Agent-Analytics-SDK/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Studio template</span></a><span style=\"vertical-align: baseline;\"> or deploy the ready-made </span><a href=\"https://marketplace.looker.com/marketplace/detail/agent_analytics\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Block for Agent Analytics</span></a><span style=\"vertical-align: baseline;\"> for real-time custom agent monitoring.</span></li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4 - Custom Data Studio Agent Analytics Dashboard\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4_-_Custom_Data_Studio_Agent_Analytics_Dashboard.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Custom Data Studio dashboard built on BigQuery Agent Analytics logs to track token consumption, latency, and user engagement.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5 - Looker Block Agent Analytics Dashboard\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/5_-_Looker_Block_Agent_Analytics_Dashboard.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Looker Block dashboard built on BigQuery Agent Analytics telemetry to monitor session volumes, tool execution latency, and token cost distribution.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Tracing agent reasoning and protecting privacy</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Enterprise observability requires balancing diagnostic telemetry with strict data privacy boundaries. Because tracking features involve ingestion and storage costs, Google Data Cloud separates operational telemetry from conversation content so admins and agent owners can govern each layer independently.</span></p>\n<p><span style=\"vertical-align: baseline;\">At the project or organization level, admins can enable Cloud Monitoring (aggregate metrics such as request volume, latency, and token usage) and Cloud Trace (step-by-step spans for each request) across their environment, using Cloud Trace observability scopes to consolidate telemetry across multiple agent projects. To protect sensitive data, these operational metrics and sanitized first-party trace spans exclude customer core content (such as user prompts, model responses, internal thoughts, and generated SQL).</span></p>\n<p><span style=\"vertical-align: baseline;\">When you need deeper transcript auditing, agent owners and editors can opt in to conversation logging on a per-agent basis:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Governed conversation logging in BigQuery:</strong><span style=\"vertical-align: baseline;\"> When enabled, a Google-managed service agent streams user prompts, responses, and turn-level telemetry into a customer-owned BigQuery table (</span><code style=\"vertical-align: baseline;\">agent_events</code><span style=\"vertical-align: baseline;\">) via the BigQuery Storage Write API, inheriting your dataset's IAM permissions, CMEK, and VPC Service Controls. </span><a href=\"https://cloud.google.com/bigquery/docs/conversation-logging-overview#conversation-logging-privacy\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Built-in privacy guardrails</span></a><span style=\"vertical-align: baseline;\"> enforce a fail-closed check before each turn — skipping logging whenever a knowledge source uses row-level security, column-level policy tags, or dynamic data masking — while fail-open execution keeps your users' chat sessions uninterrupted if a logging error occurs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Full trace trees for custom 3P agents:</strong><span style=\"vertical-align: baseline;\"> While 1P conversation logging intentionally strips low-level tool arguments and internal SQL, developers building custom agents on ADK or LangGraph can instrument their code with the open-source ADK plugin (</span><a href=\"https://docs.cloud.google.com/bigquery/docs/bigquery-agent-analytics\"><code style=\"text-decoration: underline; vertical-align: baseline;\">BigQueryAgentAnalyticsPlugin</code></a><span style=\"vertical-align: baseline;\">). With a single-line setup, the SDK streams full tool-invocation execution trees, time-series telemetry, and multimodal payloads straight into BigQuery.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">In-warehouse root cause and drift analysis:</strong><span style=\"vertical-align: baseline;\"> Because conversation logs land natively in your </span><code style=\"vertical-align: baseline;\">agent_events</code><span style=\"vertical-align: baseline;\"> table, you don't need separate export pipelines to diagnose failures. You can run BigQuery AI functions (such as </span><code style=\"vertical-align: baseline;\">AI.GENERATE</code><span style=\"vertical-align: baseline;\"> to summarize error patterns and </span><code style=\"vertical-align: baseline;\">AI.EMBED</code><span style=\"vertical-align: baseline;\"> with </span><code style=\"vertical-align: baseline;\">VECTOR_SEARCH</code><span style=\"vertical-align: baseline;\"> to cluster recurring issues) or use the open-source </span><code style=\"vertical-align: baseline;\">bigquery-agent-analytics</code><span style=\"vertical-align: baseline;\"> Python SDK and </span><a href=\"https://colab.research.google.com/github/GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK/blob/main/examples/bqca_prompt_response_logging_customer_notebook.ipynb\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Colab starter notebook</span></a><span style=\"vertical-align: baseline;\"> for post-hoc semantic drift clustering and LLM-as-a-judge sentiment analysis.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Controlling token costs with FinOps guardrails</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As agent adoption grows, FinOps and platform teams need clear visibility into consumption alongside active controls to prevent runaway spend. With </span><a href=\"https://cloud.google.com/products/data-agents/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">promotional trial pricing</span></a><span style=\"vertical-align: baseline;\"> currently available for Conversational Analytics, now is a good time to establish baseline usage and cost guardrails:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Granular token and latency tracking:</strong><span style=\"vertical-align: baseline;\"> In BigQuery conversation logs, each turn records input, output, thought, cached, and total token counts alongside total turn latency, while Looker System Activity reports estimated input and output tokens across your business intelligence (BI) workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Turnkey observability dashboards:</strong><span style=\"vertical-align: baseline;\"> You can track projected token usage and engagement in the BigQuery Studio Monitoring tab and native Looker System Activity dashboards, or query </span><code style=\"vertical-align: baseline;\">agent_events</code><span style=\"vertical-align: baseline;\"> log data via BigQuery SQL using the open-source seven-page Data Studio report template and self-hosted Streamlit app in the </span><a href=\"https://github.com/GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK/blob/main/docs/guides/bqca-prompt-response-logging-manual.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Agent Analytics GitHub repository</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Active query and token spend caps:</strong><span style=\"vertical-align: baseline;\"> To prevent unexpected charges before they happen, you can configure per-query BigQuery byte scan caps (</span><code style=\"vertical-align: baseline;\">big_query_max_billed_bytes</code><span style=\"vertical-align: baseline;\">) on your agent, which use dry-run estimates to block oversized queries without incurring on-demand scan charges. For BigQuery and the Conversational Analytics API, you can also enforce daily input and output token quotas (in preview) per project, user, or agent in the Google Cloud console and </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> CLI.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Evaluating and benchmarking your AI agents</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Runtime observability works alongside systematic evaluation. While logs and traces tell you how an agent behaved in production, evaluation benchmarks verify whether updates to your prompts, models, or data schemas improve SQL accuracy and answer quality before users experience a regression:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Benchmarking with Prism:</strong><span style=\"vertical-align: baseline;\"> Our open-source evaluation tool, </span><a href=\"https://github.com/GoogleCloudPlatform/conversational-analytics-prism\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Prism</span></a><span style=\"vertical-align: baseline;\">, lets you test Conversational Analytics agents grounded in BigQuery tables or Looker Explores via the Conversational Analytics API using reusable test suites, regex assertions, and multi-region agent discovery (deployed behind an access layer such as Cloud IAP).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified evaluation and production analytics:</strong><span style=\"vertical-align: baseline;\"> Prism can stream completed evaluation runs directly into day-partitioned BigQuery tables in your project, placing your pre-deployment benchmark scores right alongside your production </span><code style=\"vertical-align: baseline;\">agent_events</code><span style=\"vertical-align: baseline;\"> logs for side-by-side analysis in BigQuery and Looker.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Native BigQuery evaluations:</strong><span style=\"vertical-align: baseline;\"> First-party agent evaluations in BigQuery (built on the Gemini Enterprise Agent Platform evaluation service with bring-your-own-service-account support) are available in preview via API and a guided Colab notebook.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ready to bring visibility, governance, and cost control to your AI agents? Here is how to get started in three steps:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable first-party agent observability.</strong><span style=\"vertical-align: baseline;\"> Turn on Cloud Monitoring and Cloud Trace in your project and opt in to per-agent </span><a href=\"https://cloud.google.com/bigquery/docs/conversation-logging-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">conversation logging</span></a><span style=\"vertical-align: baseline;\"> using the </span><a href=\"https://cloud.google.com/bigquery/docs/create-data-agents#monitor_agents_and_conversations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery agent monitoring guide</span></a><span style=\"vertical-align: baseline;\">, and track BI token consumption with the </span><a href=\"https://cloud.google.com/looker/docs/conversational-analytics-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker Conversational Analytics overview</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/looker/docs/system-activity-dashboards#ca-sa-token-usage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Looker System Activity documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Instrument custom agents and deploy analytics dashboards.</strong><span style=\"vertical-align: baseline;\"> Add the </span><a href=\"https://github.com/GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK/blob/main/docs/guides/bqca-prompt-response-logging-manual.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Agent Analytics SDK</span></a><span style=\"vertical-align: baseline;\"> to your ADK or LangGraph agents, launch the open-source Data Studio report template or Streamlit app, and explore in-warehouse log analysis with the </span><a href=\"https://colab.research.google.com/github/GoogleCloudPlatform/BigQuery-Agent-Analytics-SDK/blob/main/examples/bqca_prompt_response_logging_customer_notebook.ipynb\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Colab starter notebook</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Benchmark your agents and set cost guardrails.</strong><span style=\"vertical-align: baseline;\"> Run automated accuracy suites with </span><a href=\"https://github.com/GoogleCloudPlatform/conversational-analytics-prism\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Prism</span></a><span style=\"vertical-align: baseline;\">, and configure BigQuery byte scan caps and daily token quotas via </span><a href=\"https://cloud.google.com/gemini/docs/conversational-analytics-api/manage-costs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Manage BigQuery costs for agents</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ol></div>"
