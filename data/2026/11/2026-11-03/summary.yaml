"overview": |
  この日はブログ記事 4 本とリリースノート 1 件 (同じ記事が 2 ソースに掲載されたため件数は 6)。Application Design Center が大阪 (asia-northeast2)、ムンバイ (asia-south1)、バンコク (asia-southeast3)、シドニー (australia-southeast1)、ベルリン (europe-west10)、サウスカロライナ (us-east1)、ダンマーム (me-central2) で利用可能になり、Oracle Database@Google Cloud では Oracle データベースに接続して SQL を実行できる Database Connections が GA となった。ブログでは、Database Migration Service (DMS) を Cloud SQL for SQL Server 間の継続レプリケーションに使い、最小限のダウンタイムでディスクを縮小する運用パターンを紹介した。また、Antigravity Marketplace で google-cloud-developer プラグインが提供開始され、事前承認済みの Developer Knowledge MCP サーバーにより API キーや OAuth 設定なしでエージェントを公式ドキュメントにグラウンディングできるようになった。さらに、SKILL.md を評価ループなしにマージするとフロンティアモデルを混乱させかねないとして、Google Cloud Developer Plugin を Gemini や Antigravity など数十のシナリオで測定・最適化した経験から、コンテキストウィンドウを膨らませる前にエージェントのスキルを評価する 5 つのルールを示した記事が出た。また Google AI & Infrastructure チームが Mercor と共同で、機械・電気・土木・構造エンジニアリングのタスクでフロンティアモデルを試す新しいベンチマークと公開コンペ "Physical-Engineering's Last Exam" (PLE) を発表し、29 の公開タスクと採点ツール、リーダーボードを ple-bench.com で公開した。
