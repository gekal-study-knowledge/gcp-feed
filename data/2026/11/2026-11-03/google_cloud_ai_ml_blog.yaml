    "title": "Introducing Physical-Engineering’s Last Exam for agents"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/introducing-physical-engineerings-last-exam-for-agents/"
    "published": "2026-11-03 17:00:00"
    "fetched": "2026-11-04 06:30:15"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Authors: Burak Gokturk, VP Research &amp; Development; Rujun Han, Research Scientist; George Lee, Product Manager.</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">Today, the </span><a href=\"http://aiinfra.google\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI &amp; Infrastructure</span></a><span style=\"vertical-align: baseline;\"> team is announcing <strong>Physical-Engineering's Last Exam (PLE)</strong>, a new benchmark and open competition, developed in collaboration with Mercor, and built to test a frontier model’s ability to complete tasks in mechanical, electrical, civil and structural engineering. </span></p>\n<p><span style=\"vertical-align: baseline;\">To help the research community measure and improve how agents handle physical engineering work, we are releasing 29 public tasks, their grading tools, and an open competition leaderboard at </span><a href=\"http://ple-bench.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ple-bench.com</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Frontier labs and the broader research community use model examinations to test AI’s progress in completing tasks in a specific discipline. </span><a href=\"https://lastexam.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Humanity's Last Exam</span></a><span style=\"vertical-align: baseline;\"> measures a model’s general knowledge. </span><a href=\"https://agents-last-exam.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agents' Last Exam</span></a><span style=\"vertical-align: baseline;\"> measures a model’s ability to complete digital professional work. <strong>Physical-Engineering's Last Exam (PLE)</strong> measures a model’s ability to complete work that helps build the physical world. Physical engineers design skyscrapers, power grids, and computer chips we rely on, yet we could find no existing benchmark that tests whether frontier models can do that work end to end.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why textbook benchmarks fall short for physical engineering</span></h3>\n<p><span style=\"vertical-align: baseline;\">Frontier language models now score above 90% on many academic benchmarks. However, those benchmarks mostly test textbook-style questions, single tool calls, or small, self-contained design problems. For AI developers and researchers building agents for physical  engineering, existing benchmarks do not show whether an agent can produce safe, code-compliant, and cost-effective designs under a licensed engineer's review and control. As the </span><a href=\"https://infrastructurereportcard.org/wp-content/uploads/2025/03/Full-Report-2025-Natl-IRC-WEB.pdf?_gl=1*1timmgv*_up*MQ..*_ga*MzEyMjk2NDYxLjE3OTMwNDg0MTc.*_ga_C9EX6BGYX5*czE3OTMwNDg0MTYkbzEkZzAkdDE3OTMwNDg0MTYkajYwJGwwJGgw\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">demand for infrastructure development outpaces financing</span></a><span style=\"vertical-align: baseline;\">, there is a growing opportunity for agents to support engineers working to close this gap.   </span></p>\n<h3><span style=\"vertical-align: baseline;\">Inside PLE: Real-world tasks built with practicing engineers</span></h3>\n<p><span style=\"vertical-align: baseline;\">PLE closes this evaluation gap with 85 long-horizon tasks across four core disciplines: </span><strong style=\"vertical-align: baseline;\">mechanical</strong><span style=\"vertical-align: baseline;\"> (30 tasks), </span><strong style=\"vertical-align: baseline;\">electrical</strong><span style=\"vertical-align: baseline;\"> (27 tasks), </span><strong style=\"vertical-align: baseline;\">civil</strong><span style=\"vertical-align: baseline;\"> (18 tasks), and </span><strong style=\"vertical-align: baseline;\">structural</strong><span style=\"vertical-align: baseline;\"> (10 tasks) engineering.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"PLE Kaggle - ple_disciplines_description\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/PLE_Kaggle_-_ple_disciplines_description.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Instead of answering a single prompt, an agent works inside a containerized project folder — built on</span><a href=\"https://github.com/Mercor-Intelligence/archipelago\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Mercor’s Archipelago environment</span></a><span style=\"vertical-align: baseline;\"> — that mirrors what a practicing engineer receives on the job. Each task holds an average of 61 files (5,170 total files across the benchmark), including PDFs, spreadsheets, emails, 2D CAD drawings, 3D BIM models, and document revisions. The agent must reason through these files, find the governing building codes and physical limits, run calculations, and generate production-ready deliverables that a licensed reviewer would review and approve.</span></p>\n<p><span style=\"vertical-align: baseline;\">In collaboration with experts from Mercor and licensed practicing engineers from industry, we built PLE using two methods:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Expert-authored tasks (44 tasks): Practicing engineers created the project folders, prompts, and grading rubrics based on real professional engineering tasks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Co-authored tasks (41 tasks): Practicing engineers designed the initial task and an agent pipeline assembled the task's environment and grader from licensable engineering standards. Engineers then validated and increased the difficulty of every task assembled by the agent.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">All frontier models score below 50%</span></h3>\n<p><span style=\"vertical-align: baseline;\">We tested 14 frontier models on PLE using seven publicly available agent harnesses (Antigravity, Claude Code, Codex, Hermes, OpenCode, OpenHands, and Pi). Because PLE evaluates both code compliance and cost efficiency, agents only earn points if their design passes every hard safety check first. Our baseline results show a wide gap between current models and real-world engineering requirements:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">High headroom: All frontier models score below 50% on our private test set, with the highest-performing model on its native harness reaching a mean score of 48.3%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Hard safety gates: While the top-scoring agent configuration satisfied 91% of individual constraints on co-authored tasks, only 41.3% of its deliverables passed every hard safety and feasibility check required.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Model vs. harness impact: Choice of model drives performance far more than the harness (up to a 50-point spread across models, versus a median 3-point spread across harnesses for the same model), though harnesses significantly affect run cost.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ple_frontier_private_x\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/ple_frontier_private_x.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Test your agent and join the open competition</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Evaluating AI agents on realistic project files, strict safety rules, and material costs is a practical step toward building helpful tools for physical engineers. Here is how you can get started with PLE today:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Check out the full technical breakdown in our </span><a href=\"https://arxiv.org/pdf/2610.30537\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">PLE paper on arXiv</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Download the 29 public tasks, grading scripts, and evaluation container from our </span><a href=\"https://github.com/google-research/ple\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub repository</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Bring your own agent setup and submit it for evaluation on our private test set at </span><a href=\"http://ple-bench.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ple-bench.com</span></a><span style=\"vertical-align: baseline;\">—with 13 Google-sponsored models running free on our servers and prize details coming soon.</span></p>\n</li>\n</ul></div>"
