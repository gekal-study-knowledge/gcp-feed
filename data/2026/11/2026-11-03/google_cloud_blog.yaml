  "957a20da5c4a0b28d2a9ea6b54fdecf3":
    "id": "957a20da5c4a0b28d2a9ea6b54fdecf3"
    "title": "Beyond Migration: Using Database Migration Service for disk shrinking"
    "link": "https://cloud.google.com/blog/products/databases/use-dms-to-shrink-cloud-sql-for-sql-server-disk/"
    "published": "2026-11-03 02:00:00"
    "fetched": "2026-11-03 02:50:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When database engineers hear “database migration\", they typically think of a one-time onboarding pathway—moving databases from on-premises environments to the cloud, or between different cloud providers.</span></p>\n<p><span style=\"vertical-align: baseline;\">However, Google Cloud's </span><a href=\"https://cloud.google.com/database-migration\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Database Migration Service</span></a><span style=\"vertical-align: baseline;\"> (DMS) supports </span><a href=\"https://medium.com/google-cloud/optimize-cloud-sql-for-sql-server-with-database-migration-service-f2a399ea6e07\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL for SQL Server as a source</span></a><span style=\"vertical-align: baseline;\">. This opens up powerful, non-traditional operational patterns for SQL Server customers within Google Cloud. Because DMS enables continuous, low-downtime database replication between Cloud SQL instances—whether in the same project, across different projects, or across regions—it can serve as an everyday utility for day-two operations like storage management.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we explore a compelling operational use case for DMS with Cloud SQL for SQL Server: executing disk shrinks with minimal application downtime.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why should I shrink my disk?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In many production environments, database storage only moves in one direction: up. Features like Cloud SQL </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/instance-settings#automatic-storage-increase-2ndgen\"><span style=\"text-decoration: underline; vertical-align: baseline;\">automatic storage increase</span></a><span style=\"vertical-align: baseline;\"> are essential for preventing out-of-space outages during unexpected traffic spikes, large batch imports, index maintenance, or temporary staging loads. Similarly, over the lifecycle of an application, you might archive historical records, purge obsolete data, or drop unused indexes.</span></p>\n<p><span style=\"vertical-align: baseline;\">When data is deleted, SQL Server marks the freed space inside your data files (.mdf, .ndf) as reusable for future writes; similarly, log truncation frees up space within transaction log files (.ldf). However, the database files themselves continue to hold their peak used space unless AUTO_SHRINK is configured — a setting that is generally not recommended in production due to severe index fragmentation and performance overhead.</span></p>\n<p><span style=\"vertical-align: baseline;\">With a manual shrink operation on the database files using </span><a href=\"https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-shrinkfile-transact-sql?view=sql-server-ver17\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DBCC SHRINKFILE</span></a><span style=\"vertical-align: baseline;\">, you can release that unused space from SQL Server files back to the underlying disk. Even after shrinking the database files, though, the Cloud SQL persistent disk remains at its peak allocated capacity. If you do not expect your database to grow back into that allocated disk space anytime soon, you should consider shrinking the disk itself to reduce ongoing storage costs — especially in scenarios such as:</span></p>\n<p><strong style=\"vertical-align: baseline;\">After major data archiving or purging:</strong><span style=\"vertical-align: baseline;\"> You have permanently moved historical data to cold storage or BigQuery and your active dataset is now a fraction of its peak size.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Recovering from one-time storage spikes:</strong><span style=\"vertical-align: baseline;\"> A runaway transaction, large data migration, or temporary staging load triggered storage auto-increase, leaving you paying for terabytes of provisioned disk capacity you no longer need.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Post-refactoring or schema optimization:</strong><span style=\"vertical-align: baseline;\"> You have split tables out of a monolithic database into separate services, dropped large unused indexes, or applied data compression.</span></p>\n<p><span style=\"vertical-align: baseline;\">The query below allows you to inspect both the allocated capacity and available free space for each database file fo a database:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT \\r\\n    DB_NAME() AS [DatabaseName],\\r\\n    name AS [LogicalName],\\r\\n    type_desc AS [FileType],\\r\\n    -- Allocated size on disk (converted from 8KB pages to MB)\\r\\n    CAST(size / 128.0 AS DECIMAL(18, 2)) AS [AllocatedSize_MB], \\r\\n    -- Actually used space inside the file\\r\\n    CAST(FILEPROPERTY(name, &#x27;SpaceUsed&#x27;) / 128.0 AS DECIMAL(18, 2)) AS [UsedSpace_MB], \\r\\n    -- Free space left in the allocated file\\r\\n    CAST((size - FILEPROPERTY(name, &#x27;SpaceUsed&#x27;)) / 128.0 AS DECIMAL(18, 2)) AS [FreeSpace_MB],    \\r\\n    -- Percentage of allocated space that is used\\r\\n    CAST((FILEPROPERTY(name, &#x27;SpaceUsed&#x27;) * 100.0) / size AS DECIMAL(18, 2)) AS [SpaceUsed_Percent]\\r\\nFROM sys.database_files;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f85e4d45310&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">You can monitor the following key Cloud SQL metrics in Cloud Monitoring to identify whether your provisioned disk quota significantly exceeds actual disk usage, indicating an opportunity for disk shrinking:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">database/disk/bytes_used</code><span style=\"vertical-align: baseline;\">: Tracks the actual amount of disk space currently consumed by your database files and logs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">database/disk/quota</code><span style=\"vertical-align: baseline;\">: Represents the total provisioned disk capacity allocated to your instance.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Cloud SQL provides a built-in </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/about-storage-shrink\"><span style=\"text-decoration: underline; vertical-align: baseline;\">storage shrink feature</span></a><span style=\"vertical-align: baseline;\"> to reclaim this unallocated disk space, which works well when your workload can tolerate a planned maintenance window. However, native disk shrinking requires instance downtime proportional to the total allocated disk size — which can mean hours of offline maintenance for multi-terabyte drives.</span></p>\n<p><span style=\"vertical-align: baseline;\">If your production SLAs cannot accommodate extended downtime, Database Migration Service (DMS) offers a minimal-downtime alternative. By continuously replicating your databases to a newly provisioned Cloud SQL instance with a smaller, right-sized disk, you can reclaim unused storage while your application stays online — requiring only a brief cutover window. To understand why this approach keeps your cutover window so short, let's first look at how DMS replicates data between Cloud SQL for SQL Server instances under the hood.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How DMS works under the hood: Replication between Cloud SQL for SQL Server instances</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To leverage DMS effectively, it helps to understand its underlying replication mechanism. When migrating between Cloud SQL for SQL Server instances, DMS coordinates a synchronization process similar to native SQL Server log shipping.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_oV7twdV.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Initial full backup: It captures an initial full backup (.bak) of the selected user databases and restores them on the target instance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Continuous log backups: It continuously captures and applies transaction log backups (.trn) to keep the target instance synchronized in near-real time.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Because synchronization occurs at the user database level, objects residing outside of it—such as logins, linked servers, and SQL Server Agent jobs—are not automatically replicated to the standby instance. Consequently, server-level objects must be migrated manually.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Disk shrinking with minimal downtime</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Using this continuous replication pipeline, you can reclaim unallocated storage without taking a lengthy maintenance window. Instead of shrinking the existing disk in place while the instance is offline, you migrate your workload to a newly provisioned Cloud SQL instance with a right-sized disk while your production application remains online.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_tYQzUPq.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">The DMS disk shrink workflow</strong></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Provision a new target instance with a smaller, appropriately sized disk (leaving sufficient headroom for transaction logs and future data growth).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Start a </span><a href=\"https://docs.cloud.google.com/database-migration/docs/sqlserver/csql-sql-server-src-guide\"><span style=\"text-decoration: underline; vertical-align: baseline;\">continuous DMS</span></a><span style=\"vertical-align: baseline;\"> job using your existing Cloud SQL instance as the source.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Let replication catch up while your production application runs uninterrupted.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Perform a brief cutover: Stop application traffic, let the final transaction log apply, promote the target instance in DMS, and repoint your application.</span></p>\n</li>\n</ol>\n<h4><span style=\"vertical-align: baseline;\">Comparison: Native shrink vs. DMS migration</span></h4></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_lOKgFLx.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As shown in the comparison above, because DMS migrates your workload to a new instance at the user-database level, a smooth cutover requires migrating your server-level objects and user mappings alongside your data. Let's look at the essential pre- and post-cutover steps to include in your runbook.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Pre and post-cutover essentials: Going beyond database replication </strong></h3>\n<h4><span style=\"vertical-align: baseline;\">Pre-cutover preparation: Migrating server-level objects</span></h4>\n<p><span style=\"vertical-align: baseline;\">Because DMS operates at the user-database level, server-level objects are not automatically replicated. You will need to create them manually in the destination instance before the cutover.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Script out logins from the source using </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/export-logins\"><code style=\"text-decoration: underline; vertical-align: baseline;\">sp_help_revlogin</code></a><span style=\"vertical-align: baseline;\"> and recreate them on the target instance.</span></p>\n</li>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SQL Server Agent jobs &amp; Server-Level objects: Because DMS replicates databases rather than server instance state, objects outside user databases must be scripted from the source and deployed to the destination Cloud SQL instance. In SQL Server Management Studio (SSMS), connect to your source instance, navigate to the object in Object Explorer, right-click and select </span><code style=\"vertical-align: baseline;\">Script [Object] as &gt; CREATE To &gt; New Query Window / File</code><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li><span style=\"vertical-align: baseline;\">SQL Server Agent jobs (</span><code style=\"vertical-align: baseline;\">SQL Server Agent &gt; Jobs</code><span style=\"vertical-align: baseline;\">): Inspect generated scripts to ensure job steps do not reference on-premises file paths or unsupported OS dependencies.</span></li>\n<li><span style=\"vertical-align: baseline;\">Linked servers (</span><code style=\"vertical-align: baseline;\">Server Objects &gt; Linked Servers</code><span style=\"vertical-align: baseline;\">): Follow the exact same scripting approach. Ensure you enable the </span><code style=\"vertical-align: baseline;\">cloudsql.linked_servers</code><span style=\"vertical-align: baseline;\"> database flag on your Cloud SQL instance before deploying.</span></li>\n<li><span style=\"vertical-align: baseline;\">Extended events (</span><code style=\"vertical-align: baseline;\">Management &gt; Extended Events &gt; Sessions</code><span style=\"vertical-align: baseline;\">): Follow the same scripting approach. </span></li>\n</ul>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">For TDE enabled instances, you will need to </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/use-tde#export-tde-certificate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">export the TDE certificate</span></a><span style=\"vertical-align: baseline;\"> from source and </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/use-tde#import-external-tde-certificate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">import the TDE certificate</span></a><span style=\"vertical-align: baseline;\"> to destination before. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Instance Configurations (such as database flags, Active Directory, Entra ID configurations etc): These must be manually configured on the destination instance to exactly match the source settings.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">If using Polybase you will need to</span> <a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/configure-external-data-sources#manage-the-dmk\"><span style=\"text-decoration: underline; vertical-align: baseline;\">re-encrypt DMK</span></a><span style=\"vertical-align: baseline;\"> for the database-scoped credentials to function correctly.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Post-cutover remediation: Resolving orphaned database users</span></h4>\n<p><span style=\"vertical-align: baseline;\">Database users mapped to SQL Server logins that are either absent or misconfigured on a server instance are unable to authenticate. These are termed </span><span style=\"font-style: italic; vertical-align: baseline;\">orphaned users</span><span style=\"vertical-align: baseline;\">. Because logins created on the destination instance will possess unique Security Identifiers (SIDs) that do not match the source SIDs preserved in your migrated databases, users will be orphaned by default. Addressing this requires manual re-mapping once the target database is brought online following the cutover.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Detecting &amp; re-mapping orphaned users: While using </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/export-logins\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sp_help_revlogin</span></a><span style=\"vertical-align: baseline;\"> preserves SIDs during login migration, creating logins on the destination instance via alternative methods generates new server-level SIDs. Because these differ from the source SIDs retained in the DMS-restored user databases, database users become orphaned after cutover and require re-mapping.</span></p>\n</li>\n</ul>\n<p style=\"padding-left: 80px;\"><span style=\"vertical-align: baseline;\">1. Detect orphaned users: Connect to each destination user database and run the diagnostic query from Microsoft's official </span><a href=\"https://learn.microsoft.com/en-us/sql/sql-server/failover-clusters/troubleshoot-orphaned-users-sql-server?view=sql-server-ver17#detect-orphaned-users\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Troubleshoot Orphaned Users Guide</span></a><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT dp.type_desc, dp.sid, dp.name AS user_name\\r\\nFROM sys.database_principals AS dp\\r\\nLEFT JOIN sys.server_principals AS sp ON dp.sid = sp.sid\\r\\nWHERE sp.sid IS NULL AND dp.authentication_type_desc = &#x27;INSTANCE&#x27;;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f85e4d45110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 80px;\"><span style=\"vertical-align: baseline;\">2. Fix orphaned users (</span><code style=\"vertical-align: baseline;\">ALTER USER</code><span style=\"vertical-align: baseline;\">): For each unlinked database user returned by the query, execute the following statement inside the context of that database to cleanly re-map the principal and its permissions to the new Cloud SQL server login:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;ALTER USER [user_name] WITH LOGIN = [login_name];&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f85e4d46290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Summary and next steps</strong></h3>\n<p><span style=\"vertical-align: baseline;\">DMS is more than a one-time bridge from on-premises environments into Google Cloud — it is a versatile tool for day-two operations in the Cloud SQL engineer's toolkit. When strict production SLAs prevent you from taking lengthy maintenance windows for a native disk shrink, DMS provides a reliable, managed replication pipeline to right-size your storage footprint and reduce infrastructure costs with minimal downtime.</span></p>\n<p><span style=\"vertical-align: baseline;\">To get started with configuring Cloud SQL for SQL Server as a DMS source, </span><a href=\"https://docs.cloud.google.com/database-migration/docs/sqlserver/csql-sql-server-src-guide\"><span style=\"text-decoration: underline; vertical-align: baseline;\">explore the official documentation</span></a><span style=\"vertical-align: baseline;\">. And if you're new to running SQL Server on Google Cloud, check out the </span><a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/introduction\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud SQL for SQL Server introduction</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "a418253159b6f89f69ab731864f72807":
    "id": "a418253159b6f89f69ab731864f72807"
    "title": "Google Cloud Developer plugin now available in Antigravity Marketplace"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-developer-plugin-now-available-in-antigravity-marketplace/"
    "published": "2026-11-03 03:00:00"
    "fetched": "2026-11-03 09:32:56"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Building cloud solutions with autonomous AI agents should feel fast, safe, and reliable. Without cloud-specific context, coding agents often struggle. They might invent deprecated SDK syntax, guess invalid command flags, or attempt operations without the required Identity and Access Management (IAM) permissions. Even worse, an unguided agent can enable billable APIs or provision cloud resources without your explicit permission.</span></p>\n<p><span style=\"vertical-align: baseline;\">Starting today, you can install the </span><strong style=\"vertical-align: baseline;\">google-cloud-developer</strong><span style=\"vertical-align: baseline;\"> plugin directly from the Antigravity Marketplace in the </span><code style=\"vertical-align: baseline;\">Build with Google</code><span style=\"vertical-align: baseline;\"> section. This plugin equips Antigravity with foundational skills, safety guardrails, and live documentation grounding for building on Google Cloud. If you've never installed a plugin using the marketplace before, you can refer to the </span><a href=\"https://antigravity.google/docs/marketplace/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Configuration is straightforward. The bundled Developer Knowledge Model Context Protocol (MCP) server is pre-authorized by default. You don't need to configure API keys, exchange OAuth tokens, or edit any configuration files. You install the plugin, and your agent connects to official Google developer documentation immediately.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this post, we'll walk through what's included in the plugin, how to install it with one click, and how it grounds your agent in live Google Cloud documentation.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Why use the Google Cloud Developer plugin?</span></h2>\n<p><span style=\"vertical-align: baseline;\">Coding agents often rely on static training data. Cloud platforms update quickly, and models can produce code with outdated client libraries or invalid parameters.</span></p>\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> plugin solves this issue. It bundles curated skills, intelligent routing rules, and the Developer Knowledge MCP server into a single portable package.</span></p>\n<p><span style=\"vertical-align: baseline;\">The plugin provides three key benefits:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Live documentation grounding</strong><span style=\"vertical-align: baseline;\">: The agent queries official Google Cloud documentation over streamable HTTP.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Safety and cost guardrails</strong><span style=\"vertical-align: baseline;\">: The agent enforces least-privilege IAM patterns and it requires your consent before it enables billable APIs or modifying cloud infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Environment awareness</strong><span style=\"vertical-align: baseline;\">: The agent inspects your local environment, detects existing CLI configurations, and designs safe execution roadmaps before it runs commands.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">What's included in the plugin</span></h2>\n<p><span style=\"vertical-align: baseline;\">The plugin pairs core baseline skills and live documentation grounding with an intelligent skill routing architecture. Rather than limiting your agent to a fixed set of capabilities, it acts as an extensible gateway that discovers and pulls specialized skills from Google on demand.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Bundled agent skills</span></h3>\n<p><span style=\"vertical-align: baseline;\">The bundled skills provide essential day-one guardrails, live documentation grounding, and the dynamic discovery engine that unlocks the broader catalog:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/finding-google-skills\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\"><code>finding-google-skills</code></strong></a><span style=\"vertical-align: baseline;\">: Powers flexible skill routing by discovering and loading skills on demand from the </span><a href=\"https://g.dev/ai/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\"><code>google/skills</code> repository on GitHub</span></a><span style=\"vertical-align: baseline;\">. Rather than requiring you to research, install, and manage individual skills, it dynamically retrieves the exact instructions your agent needs for specialized tasks in real time.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/retrieving-developer-knowledge\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">retrieving-developer-knowledge</strong></a></code><span style=\"vertical-align: baseline;\">: Provides answers and code samples that are grounded in official Google documentation across Google Cloud, Firebase, Android, Web, and Gemini.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/gcloud\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\"><code>gcloud</code></strong></a><span style=\"vertical-align: baseline;\">: Enforces execution guardrails, validates syntax, and applies safety checks to Google Cloud CLI (</span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\">) commands. It blocks accidental destructive operations and it keeps you in control.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/google-cloud-recipe-auth\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">google-cloud-recipe-auth</strong></a></code><span style=\"vertical-align: baseline;\">: Steers your agent toward secure authentication patterns. It enforces service identities and Application Default Credentials (ADC) while it blocks risky practices like downloading service account JSON keys.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/google-cloud-recipe-onboarding\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">google-cloud-recipe-onboarding</strong></a></code><span style=\"vertical-align: baseline;\">: Guides initial project setup, account onboarding, and billing verification. It audits project states before it attempts to activate services.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Pre-authorized Developer Knowledge MCP server</span></h3>\n<p><span style=\"vertical-align: baseline;\">The plugin connects your agent to the </span><a href=\"https://developers.google.com/knowledge/mcp\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Developer Knowledge MCP server</span></a><span style=\"vertical-align: baseline;\">. Typically, adding an MCP server requires manual API key handling. With the Antigravity Marketplace integration in the </span><code style=\"vertical-align: baseline;\">Build with Google</code><span style=\"vertical-align: baseline;\"> catalog, this MCP server is pre-authorized: Antigravity manages the authentication transparently. Your agent connects to Google's documentation server immediately after installation.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Smart routing rules: on-demand capability expansion</span></h3>\n<p><span style=\"vertical-align: baseline;\">The plugin includes </span><code style=\"vertical-align: baseline;\">google-cloud-discovery.md</code><span style=\"vertical-align: baseline;\">, an active routing rule that works together with the </span><code style=\"vertical-align: baseline;\">finding-google-skills</code><span style=\"vertical-align: baseline;\"> bundled skill. When your prompt touches specialized topics, the routing rule directs the agent to fetch the relevant skills from the public catalog as needed.</span></p>\n<p><span style=\"vertical-align: baseline;\">This dynamic routing keeps your agent fast and token-efficient. Instead of preloading dozens of niche skills that clutter the context window, your agent pulls in deep, specialized guidance only when your task requires it.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Install the plugin with one click</span></h2>\n<p><span style=\"vertical-align: baseline;\">You can install the plugin through the Antigravity Marketplace UI or through your terminal.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"google-cloud-developer-plugin-now-available-in-antigravity-marketplace-agy-install\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/google-cloud-developer-plugin-now-available-in-antigravity-marketplace-agy.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">If you prefer the command line, install the plugin with a single command:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;agy plugin install google-cloud-developer&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f2f388acdd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The CLI registers the skills and connects the Developer Knowledge MCP server immediately. You can also explore the plugin and skills directly on </span><a href=\"https://g.dev/ai/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h2><span style=\"vertical-align: baseline;\">The plugin in action: Querying live documentation</span></h2>\n<p><span style=\"vertical-align: baseline;\">After the plugin is installed, your agent automatically grounds its answers in current documentation. You don't need to prompt it with special syntax. Consider a practical query:</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"Based on the documentation what is the main difference between GKE and Cloud Run? When should I use one over the other?\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Without the plugin, an agent might guess or provide outdated information. With the </span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> plugin active, the agent queries the pre-authorized Developer Knowledge MCP server:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"google-cloud-developer-plugin-now-available-in-antigravity-marketplace-mcp-usage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/google-cloud-developer-plugin-now-available-in-antigravity-marketplace-mcp.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The agent produces a clean, verified answer based on official documentation.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Connect with me</span></h2>\n<p><span style=\"vertical-align: baseline;\">I'd love to hear how you use the plugin in your daily workflow. Share your feedback and questions with me on </span><a href=\"https://www.linkedin.com/in/remigiusz-samborski/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a>, <a href=\"https://x.com/RemikSamborski\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a>, or <a href=\"https://bsky.app/profile/rsamborski.bsky.social\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bluesky</span></a>.</p></div>"
