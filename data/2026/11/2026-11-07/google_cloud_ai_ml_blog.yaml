    "title": "The Blueprint: Orchestrating 5,000+ AI assets for a World Cup TV spot"
    "link": "https://cloud.google.com/blog/products/media-entertainment/how-mito-orchestrated-5000-plus-ai-assets-for-a-world-cup-tv-spot/"
    "published": "2026-11-07 02:00:00"
    "fetched": "2026-11-07 06:17:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Welcome back to The Blueprint, a regular feature where we highlight how Google Cloud customers are tackling unique and common challenges across industries using the latest AI and cloud technologies. We hope to inspire others looking to innovate in their work.</span></p>\n<p><span style=\"vertical-align: baseline;\">AI is rapidly transforming video production at virtually every step of the process, from ideation and storyboarding to filming, editing, and release. At </span><strong style=\"vertical-align: baseline;\">Mito</strong><span style=\"vertical-align: baseline;\">, we’re striving to democratize AI-powered video creation, enabling everyone from solo artists to large enterprises to get the most out of the best creative technologies available.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">The Challenge</strong></h2>\n<p><span style=\"vertical-align: baseline;\">When we founded Mito, our goal was to eliminate the complex technical friction that stops creators from telling long-form, narrative stories with generative AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">However, transitioning from a single five-second clip to a cohesive campaign — such as a 120-second national TV spot for Movistar Plus+, a part of Telefónica, to broadcast across Spain during the World Cup this summer. This effort revealed massive infrastructure and workflow bottlenecks:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Asset &amp; workflow overhead:</strong><span style=\"vertical-align: baseline;\"> Managing local media libraries across individual workstations was unscalable. For Movistar alone, our production required generating a massive \"iceberg\" of over 5000 assets (1000 of those videos) generated in around 65 iteration rounds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero real-time collaboration:</strong><span style=\"vertical-align: baseline;\"> Traditional feedback loops required manual downloads, Google Drive uploads, and fragmented communication across chat apps and email.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rendering latency:</strong><span style=\"vertical-align: baseline;\"> Standard AI video rendering takes four to five minutes per short clip. Running these processes synchronously froze our user interface and stalled creative velocity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model disparity &amp; consistency:</strong><span style=\"vertical-align: baseline;\"> Every generative model requires distinct prompting logic. Maintaining character persistence, specific lighting, and camera angles across dozens of shots — while preserving the likeness of real public figures like chef Ferran Adrià or journalist Juanma Castaño — was nearly impossible without central orchestration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Capacity constraints:</strong><span style=\"vertical-align: baseline;\"> Operating on public pay-as-you-go model APIs left us vulnerable to rate limits and regional throughput throttling during peak traffic.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">The Solution</strong></h2>\n<p><span style=\"vertical-align: baseline;\">To deliver an infinite, real-time creative canvas for filmmakers, we designed a serverless, asynchronous architecture built on Google Cloud.</span></p>\n<p><span style=\"vertical-align: baseline;\">We run our API, AI Director, and background workers as Java services on Cloud Run, which scales with request volume.</span></p>\n<p><span style=\"vertical-align: baseline;\">In order to address message routing challenges, we decoupled job execution using Google Cloud </span><strong style=\"vertical-align: baseline;\">Pub/Sub</strong><span style=\"vertical-align: baseline;\"> as our central event bus. Long-running video generations are offloaded to background Cloud Run workers, allowing creators to keep working uninterrupted on the UI canvas.</span></p>\n<p><span style=\"vertical-align: baseline;\">To minimize latency, media assets are stored in Google Cloud Storage and delivered via Cloud CDN. Expiring key signatures keep pre-release client assets strictly private. Keeping our storage alongside the models we call through Vertex AI reduces network transfer delays.</span></p>\n<p><span style=\"vertical-align: baseline;\">An isolated database architecture helps with the heavy business intelligence and analytics workloads while mitigating potential negative impacts on production performance through Cloud SQL and PostgreSQL. We rely heavily on foundational models like Omni, Veo and Nano Banana, which we access through Vertex AI alongside our custom system prompts.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, our structured canvas frontend enforces a \"Rule of 6\" (limiting prompt variables across World, Camera, Light, Texture, Actions, and Character) and prioritizes still-frame generation before video rendering to maximize cost efficiency.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">The Architecture</strong></h2></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_VoY9Mls.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">The Outcome</strong></h2>\n<p><span style=\"vertical-align: baseline;\">By pairing our creative orchestration platform with Google Cloud’s infrastructure, we successfully delivered a landmark national broadcast campaign that the production team describes as 95% AI-generated:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Prime-time scale:</strong><span style=\"vertical-align: baseline;\"> The 120-second Movistar campaign for the Spanish National Team  aired across every major television channel in Spain, with 1,441 assets live on a single shared Canvas near launch.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI Director copilot:</strong><span style=\"vertical-align: baseline;\"> Our conversational agent translates natural language instructions into precise model parameters while maintaining context, lighting, and visual style across every scene.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Seamless collaboration:</strong><span style=\"vertical-align: baseline;\"> Distributed teams and brand clients can work on the same canvas in real time. Because new generations are saved as separate assets instead of overwriting earlier ones, stakeholders can duplicate projects to explore parallel creative ideas.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Continuous dogfooding:</strong><span style=\"vertical-align: baseline;\"> Through our internal studio, Mito Films, we put our tools to the test on high-stakes client projects — whether that's global television spots or keynotes for top robotics startups — ensuring direct feedback flows back into engineering.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Future-proof foundation:</strong><span style=\"vertical-align: baseline;\"> Our architecture is primed for rendering times to collapse from minutes to seconds, positioning Mito to handle upcoming world models, deeper memory states, and personalized content delivery.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">The Details</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Building an enterprise-grade platform for AI storytelling required solving several backend and creative challenges. This includes our creation of a virtual queuing system that mitigates third-party API rate limiting during usage spikes for smooth request concurrency, with bounded retries and a clear outcome for every job.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because creative output cannot be fully validated with standard unit tests, we built an automated evaluation harness powered by Gemini. Acting as an independent judge, it evaluates AI Director outputs against original user intents across an automated test suite, which we run alongside standard tests for high-impact Director changes.</span></p>\n<p><span style=\"vertical-align: baseline;\">We knew early on that we would need multi-model intelligence routing. As such, we built the AI Director to dynamically coordinate tasks across multiple specialized models — including Sonnet, Gemini, and ElevenLabs for audio — treating the spatial canvas like a live code repository to infer adjacent contextual cues.</span></p>\n<p><span style=\"vertical-align: baseline;\">We also needed to embrace an “imperfect aesthetic” to arrive at a more authentic outcome. In our Movistar spot, the story follows Tommy, a 17-year-old student making an AI video project. At the climax, the AI misunderstands a prompt, making coach Luis de la Fuente say \"In the same milkshake\" while holding a drink. Tommy edits the prompt live to \"In the same heartbeat,\" and the video recalibrates instantly. </span></p>\n<p><span style=\"vertical-align: baseline;\">By incorporating surreal visual elements — like stadium stands built into Galician cliffs or a neighborhood bar covered in pitch grass — we showcased how generative AI can elevate human storytelling rather than obscure it.</span></p></div>"
