  "17de69adbc882e51122cb7cb7cbba13d":
    "id": "17de69adbc882e51122cb7cb7cbba13d"
    "title": "The Blueprint: Orchestrating 5,000+ AI assets for a World Cup TV spot"
    "link": "https://cloud.google.com/blog/products/media-entertainment/how-mito-orchestrated-5000-plus-ai-assets-for-a-world-cup-tv-spot/"
    "published": "2026-11-07 02:00:00"
    "fetched": "2026-11-07 06:17:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">Welcome back to The Blueprint, a regular feature where we highlight how Google Cloud customers are tackling unique and common challenges across industries using the latest AI and cloud technologies. We hope to inspire others looking to innovate in their work.</span></p>\n<p><span style=\"vertical-align: baseline;\">AI is rapidly transforming video production at virtually every step of the process, from ideation and storyboarding to filming, editing, and release. At </span><strong style=\"vertical-align: baseline;\">Mito</strong><span style=\"vertical-align: baseline;\">, we’re striving to democratize AI-powered video creation, enabling everyone from solo artists to large enterprises to get the most out of the best creative technologies available.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">The Challenge</strong></h2>\n<p><span style=\"vertical-align: baseline;\">When we founded Mito, our goal was to eliminate the complex technical friction that stops creators from telling long-form, narrative stories with generative AI. </span></p>\n<p><span style=\"vertical-align: baseline;\">However, transitioning from a single five-second clip to a cohesive campaign — such as a 120-second national TV spot for Movistar Plus+, a part of Telefónica, to broadcast across Spain during the World Cup this summer. This effort revealed massive infrastructure and workflow bottlenecks:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Asset &amp; workflow overhead:</strong><span style=\"vertical-align: baseline;\"> Managing local media libraries across individual workstations was unscalable. For Movistar alone, our production required generating a massive \"iceberg\" of over 5000 assets (1000 of those videos) generated in around 65 iteration rounds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero real-time collaboration:</strong><span style=\"vertical-align: baseline;\"> Traditional feedback loops required manual downloads, Google Drive uploads, and fragmented communication across chat apps and email.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rendering latency:</strong><span style=\"vertical-align: baseline;\"> Standard AI video rendering takes four to five minutes per short clip. Running these processes synchronously froze our user interface and stalled creative velocity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model disparity &amp; consistency:</strong><span style=\"vertical-align: baseline;\"> Every generative model requires distinct prompting logic. Maintaining character persistence, specific lighting, and camera angles across dozens of shots — while preserving the likeness of real public figures like chef Ferran Adrià or journalist Juanma Castaño — was nearly impossible without central orchestration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Capacity constraints:</strong><span style=\"vertical-align: baseline;\"> Operating on public pay-as-you-go model APIs left us vulnerable to rate limits and regional throughput throttling during peak traffic.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">The Solution</strong></h2>\n<p><span style=\"vertical-align: baseline;\">To deliver an infinite, real-time creative canvas for filmmakers, we designed a serverless, asynchronous architecture built on Google Cloud.</span></p>\n<p><span style=\"vertical-align: baseline;\">We run our API, AI Director, and background workers as Java services on Cloud Run, which scales with request volume.</span></p>\n<p><span style=\"vertical-align: baseline;\">In order to address message routing challenges, we decoupled job execution using Google Cloud </span><strong style=\"vertical-align: baseline;\">Pub/Sub</strong><span style=\"vertical-align: baseline;\"> as our central event bus. Long-running video generations are offloaded to background Cloud Run workers, allowing creators to keep working uninterrupted on the UI canvas.</span></p>\n<p><span style=\"vertical-align: baseline;\">To minimize latency, media assets are stored in Google Cloud Storage and delivered via Cloud CDN. Expiring key signatures keep pre-release client assets strictly private. Keeping our storage alongside the models we call through Vertex AI reduces network transfer delays.</span></p>\n<p><span style=\"vertical-align: baseline;\">An isolated database architecture helps with the heavy business intelligence and analytics workloads while mitigating potential negative impacts on production performance through Cloud SQL and PostgreSQL. We rely heavily on foundational models like Omni, Veo and Nano Banana, which we access through Vertex AI alongside our custom system prompts.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, our structured canvas frontend enforces a \"Rule of 6\" (limiting prompt variables across World, Camera, Light, Texture, Actions, and Character) and prioritizes still-frame generation before video rendering to maximize cost efficiency.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">The Architecture</strong></h2></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_VoY9Mls.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">The Outcome</strong></h2>\n<p><span style=\"vertical-align: baseline;\">By pairing our creative orchestration platform with Google Cloud’s infrastructure, we successfully delivered a landmark national broadcast campaign that the production team describes as 95% AI-generated:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Prime-time scale:</strong><span style=\"vertical-align: baseline;\"> The 120-second Movistar campaign for the Spanish National Team  aired across every major television channel in Spain, with 1,441 assets live on a single shared Canvas near launch.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI Director copilot:</strong><span style=\"vertical-align: baseline;\"> Our conversational agent translates natural language instructions into precise model parameters while maintaining context, lighting, and visual style across every scene.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Seamless collaboration:</strong><span style=\"vertical-align: baseline;\"> Distributed teams and brand clients can work on the same canvas in real time. Because new generations are saved as separate assets instead of overwriting earlier ones, stakeholders can duplicate projects to explore parallel creative ideas.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Continuous dogfooding:</strong><span style=\"vertical-align: baseline;\"> Through our internal studio, Mito Films, we put our tools to the test on high-stakes client projects — whether that's global television spots or keynotes for top robotics startups — ensuring direct feedback flows back into engineering.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Future-proof foundation:</strong><span style=\"vertical-align: baseline;\"> Our architecture is primed for rendering times to collapse from minutes to seconds, positioning Mito to handle upcoming world models, deeper memory states, and personalized content delivery.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">The Details</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Building an enterprise-grade platform for AI storytelling required solving several backend and creative challenges. This includes our creation of a virtual queuing system that mitigates third-party API rate limiting during usage spikes for smooth request concurrency, with bounded retries and a clear outcome for every job.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because creative output cannot be fully validated with standard unit tests, we built an automated evaluation harness powered by Gemini. Acting as an independent judge, it evaluates AI Director outputs against original user intents across an automated test suite, which we run alongside standard tests for high-impact Director changes.</span></p>\n<p><span style=\"vertical-align: baseline;\">We knew early on that we would need multi-model intelligence routing. As such, we built the AI Director to dynamically coordinate tasks across multiple specialized models — including Sonnet, Gemini, and ElevenLabs for audio — treating the spatial canvas like a live code repository to infer adjacent contextual cues.</span></p>\n<p><span style=\"vertical-align: baseline;\">We also needed to embrace an “imperfect aesthetic” to arrive at a more authentic outcome. In our Movistar spot, the story follows Tommy, a 17-year-old student making an AI video project. At the climax, the AI misunderstands a prompt, making coach Luis de la Fuente say \"In the same milkshake\" while holding a drink. Tommy edits the prompt live to \"In the same heartbeat,\" and the video recalibrates instantly. </span></p>\n<p><span style=\"vertical-align: baseline;\">By incorporating surreal visual elements — like stadium stands built into Galician cliffs or a neighborhood bar covered in pitch grass — we showcased how generative AI can elevate human storytelling rather than obscure it.</span></p></div>"
  "6b45fb16316f073670558166424c551c":
    "id": "6b45fb16316f073670558166424c551c"
    "title": "Introducing Z4M: storage-optimized compute for AI/ML and parallel file systems"
    "link": "https://cloud.google.com/blog/products/compute/storage-optimized-z4m-machine-series-are-ga/"
    "published": "2026-11-07 02:00:00"
    "fetched": "2026-11-07 06:17:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we’re excited to announce the general availability of our next-generation </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage-optimized Z4M machine</span></a><span style=\"vertical-align: baseline;\"> series in Google Compute Engine, available as both Virtual Machine (VM) and bare-metal instances. </span></p>\n<p><span style=\"vertical-align: baseline;\">We built Z4M to provide storage for AI/ML training and inference workloads such as checkpointing, distributed key-value (KV) cache and parallel file systems — workloads that handle huge data volumes and require massive parallel data processing, as well as high storage and networking throughput. Low latency access to data is equally critical to keep GPUs and TPUs fully utilized. Powered by the fifth-generation Intel Xeon Scalable processors and paired with the latest enhancements in </span><a href=\"https://cloud.google.com/titanium?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium</span></a><span style=\"vertical-align: baseline;\">, Z4M provides up to 168,000 GiB of Local SSD (LSSD) storage coupled with up to 400 Gbps of Cloud Remote Direct Memory Access (RDMA) networking. RDMA improves the performance of these demanding workloads by reducing data-access latency by up to 60% compared to TCP networking, so you can increase your applications’ throughput while right-sizing your cloud investment. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Z4M VMs and bare-metal instances</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The Z4M VM portfolio lets you scale your infrastructure and clusters to meet workload requirements by providing a large total LSSD capacity as well as 875 GiB of LSSD capacity per vCPU. Further, Z4M bare-metal instances give you direct access to the physical hardware without a virtualization layer, reducing latency for workloads such as custom hypervisors and workloads with specific licensing needs. Z4M bare-metal instances are also ideal for agentic AI workloads, enabling developers to run isolated sandboxes at scale, including with Agent Substrate. </span></p>\n<p><span style=\"vertical-align: baseline;\">In addition to 168,000 GiB of LSSD storage, Z4M VMs and bare metal instances offer up to 192 vCPUs and up to 1,536 GiB of memory for at-scale data processing. Z4M instances are based on </span><a href=\"https://cloud.google.com/compute/docs/disks/local-ssd\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Titanium SSDs</span></a><span style=\"vertical-align: baseline;\">, which </span><span style=\"vertical-align: baseline;\">offload local storage processing from CPU resources</span><span style=\"vertical-align: baseline;\"> to deliver real-time data processing, low-latency, high-throughput storage performance and </span><span style=\"vertical-align: baseline;\">enhanced storage security. Z4M delivers up to 15.6M random-read IOPS and up to 75,600 MiB/s sequential-read throughput, improving the LSSD storage performance and throughput compared to Z3 by up to 70% and 110% respectively. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Cloud RDMA and direct storage access </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Z4M provides low-latency access to the storage layer using 400 Gbps of</span><strong style=\"vertical-align: baseline;\"> </strong><a href=\"https://docs.cloud.google.com/vpc/docs/rdma-network-profiles\"><span style=\"text-decoration: underline; vertical-align: baseline;\">RDMA</span></a><span style=\"vertical-align: baseline;\">-enabled standard networking.This helps keep GPUs and TPUs fully utilized even when processing large multimodal datasets, by transferring massive amounts of data at line rate using </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/google-cloud-infrastructure-at-nvidia-gtc-berlin-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NVIDIA GPUDirect Storage</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/blog/products/compute/tpu-8t-and-tpu-8i-technical-deep-dive?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPUDirect Storage</span></a><span style=\"vertical-align: baseline;\">. At the same time, Z4M transfers data at full line rate while processing data locally, with a balanced-LSSD-to-networking-throughput ratio of 1.4:1. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Built for demanding workloads</strong></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Workload Category</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Typical Applications</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">Z4M Benefits</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AIML training and inference</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Checkpointing, distributed Key-Value cache </span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Large LSSD capacity paired with 400 Gbps low-latency RDMA network that supports GPUDirect Storage and TPUDirect Storage, keeping GPUs and TPUs fully utilized  even when processing large multimodal datasets.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://cloud.google.com/marketplace?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=Cloud-SS-DR-GCP-1713658-GCP-DR-NA-US-en-Google-BKWS-BRO-appmod&amp;utm_content=c-Hybrid+%7C+BKWS+-+BRO+%7C+Txt-AppMod-Other-Google+Cloud+Marketplace-576266368948&amp;utm_term=gcp+marketplace&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=23754999107&amp;gclid=CjwKCAiAqabXBhBUEiwAw_SQpSHFGaVTPbIKkxVeOdNM9k3i9zbAQZJ6JPQ7bf1AlnmUkq4wE7UMqxoCFDsQAvD_BwE&amp;e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Parallel file systems</strong></a><strong style=\"vertical-align: baseline;\"> and Enterprise-class storage</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Weka, Sycomp, Silk, VDURA</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Very high vCPU:LSSD ratio of 1:875 combined with a balanced LSSD:networking throughput of 1.4: to improve applications’ performance by processing data locally while transferring data to clients at full line rate.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Business-critical enterprise Databases</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SQL, NoSQL, Vector DBs, data search </span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Sustained LSSD high I/O performance and throughput to sustain a large number of transactions per second.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">What customers and partners are saying</strong></h3></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"nutanix\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/nutanix_CyX4UCq.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Nutanix is committed to helping organizations run their applications and data anywhere. Bringing Nutanix Cloud Clusters (NC2) to Google Cloud's new Z4M metal instances reflects that mission and our continued partnership with Google Cloud. By combining Z4M’s exceptional I/O performance and high storage density along with Intel’s advanced compute and AMX-driven efficiency, NC2 on Z4M provides the scale, density, and performance required to power everything from dense VDI clusters to demanding, data-intensive AI workloads.\"</i> <b>- Saveen Pakala, Vice President of Product Management, Nutanix</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"silk\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/silk_RM9R0Ve.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"Google's Z4M VMs bring Cloud RDMA to a storage-optimized VM with much higher local SSD density than previous generations. In our testing, Cloud RDMA on Z4M demonstrated outstanding performance with up to 3.7x lower latency and up to 6x lower CPU usage than TCP. For our customers, that means faster, more predictable performance across a wide variety of use cases, from I/O-intensive databases to analytics and AI workloads, with the storage density to scale capacity efficiently.\"</i> <b><i>-</i></b> <b>Adik Sokolovski, Chief R&amp;D Officer, Silk</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"sycomp\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/sycomp_CNAxlCa.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>“We're excited to support Google Cloud's new Z4M platform as part of the Sycomp Intelligent Data Storage Platform. With greater capacity per node and the continued evolution of the Z-series architecture, Z4M helps customers achieve new levels of performance and efficiency. Supporting innovations like Z4M reinforces Sycomp's commitment to delivering high-performance storage solutions across the Google Cloud ecosystem.”</i> <b>- Scott Fadden, Senior HPC Solutions Architect, Sycomp</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"weka\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/weka.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><i>\"We've worked alongside Google Cloud for years on the most demanding AI and machine learning workloads. In our testing, we found the new Z4M machines deliver roughly twice the read throughput and up to 79% more IOPS, generation over generation (Z3 family). This means more data, more tokens, and more finished work. We’re excited to see what our joint customers build with these powerful machines.\"</i> <b>- Ajay Singh, Chief Product Officer, WEKA</b></p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Orchestration with Cluster Director</strong></h3>\n<p><span style=\"vertical-align: baseline;\">You can easily configure, deploy and manage large Z4M clusters using Google Cloud’s </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/cluster-capabilities\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cluster Director</span></a><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">which offers advanced placement and maintenance capabilities alongside the</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/cluster-toolkit/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cluster Toolkit</span></a><span style=\"vertical-align: baseline;\"> f</span><span style=\"vertical-align: baseline;\">or rapid cluster deployment</span><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">You can view and deploy your workloads in a compact topology to maximize performance, or spread topology for high availability by targeting availability domains. You can combine or stagger the maintenance across these availability domains.</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Additionally, you can co-locate Z4M instances with your GPU and TPU clusters to process very large datasets in real time and at scale. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Enhanced maintenance experience</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Both Z4M VMs and bare-metal instances make it easier for you to plan ahead and schedule maintenance operations by providing notice from the system several days in advance of  required maintenance. For Z4M VMs with 42,000 GiB or less of LSSD storage, you can live-migrate an instance </span><span style=\"font-style: italic; vertical-align: baseline;\">during </span><span style=\"vertical-align: baseline;\">maintenance events. Z4M VMs with 84,000 GiB or more of LSSD and Z4M bare metal instances must be terminated and restarted while preserving your data through planned maintenance events.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Support for Hyperdisk</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Z4M VMs and bare-metal instances support </span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</span></a><span style=\"vertical-align: baseline;\">, Google Cloud’s workload-optimized block storage, which lets you optimize the performance for each workload by independently tuning the storage performance and capacity for each instance.</span></p>\n<p><span style=\"vertical-align: baseline;\">Specifically, they are compatible with </span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-balanced\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Balanced</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk Throughput</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/compute/docs/disks/hd-types/hyperdisk-extreme\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Extreme</span></a><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/compute/docs/disks/hyperdisks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Hyperdisk</span></a><span style=\"vertical-align: baseline;\"> storage for scalable, high-performance network-attached storage, supporting up to 512 TiB of capacity per instance. For general-purpose workloads, Hyperdisk Balanced, with up to 320K IOPS per instance, offers a mix of performance and cost-efficiency. Hyperdisk Extreme delivers ultra-low latency and supports up to 500K IOPS and 12,500 MiB/s throughput per Z4M VM and bare-metal instance, making it well-suited for demanding database workloads. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Get started with Z4M today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Z4M VMs and bare metal instances are available today in select regions worldwide. To start using Z4M instances, choose Z4M under the Storage-Optimized machine family when creating a new VM or GKE node pool in the Google Cloud console. Learn more at the </span><a href=\"https://docs.cloud.google.com/compute/docs/storage-optimized-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Z4M machine series</span></a><span style=\"vertical-align: baseline;\"> page. Contact your </span><a href=\"https://cloud.google.com/contact?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud sales</span></a><span style=\"vertical-align: baseline;\"> representative for more information on regional availability.</span></p></div>"
