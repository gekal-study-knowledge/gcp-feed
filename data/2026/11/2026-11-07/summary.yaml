  この日はブログ記事 2 本 (同じ記事が 2 ソースに掲載されたため件数は 3)。次世代のストレージ最適化マシンシリーズ Z4M が Compute Engine で一般提供となり、仮想マシンとベアメタルインスタンスの両方で利用できるようになった。チェックポイント、分散 KV キャッシュ、並列ファイルシステムといった AI/ML の学習・推論ワークロード向けで、第 5 世代 Intel Xeon Scalable プロセッサと最新の Titanium を組み合わせ、最大 168,000 GiB のローカル SSD と最大 400 Gbps の Cloud RDMA ネットワーキングを備える。RDMA により TCP と比べてデータアクセスのレイテンシを最大 60% 削減し、GPU や TPU を遊ばせずに済むとしている。最大 192 vCPU・1,536 GiB メモリ、vCPU あたり 875 GiB のローカル SSD 容量で、ランダム読み取り最大 1,560 万 IOPS、シーケンシャル読み取り最大 75,600 MiB/s に達する。ベアメタルインスタンスは仮想化層を介さず物理ハードウェアへ直接アクセスできるため、カスタムハイパーバイザーや固有のライセンス要件があるワークロードに加え、Agent Substrate を含む隔離サンドボックスを大規模に動かすエージェント型 AI ワークロードにも向く。もう 1 本は The Blueprint の連載で、Mito が Movistar Plus+ (Telefónica) のワールドカップ期間中にスペイン全国で放送する 120 秒の TV スポットを制作するにあたり、約 65 回の反復で 5,000 を超えるアセット (うち動画 1,000 本) を生成した事例を扱った。ワークステーションごとのローカルメディアライブラリ管理、リアルタイムの共同作業ができないこと、1 クリップあたり 4〜5 分かかるレンダリング待ち、モデルごとに異なるプロンプト設計のなかで実在の人物の見た目や照明・カメラアングルを保つ難しさ、従量課金 API のレート制限といったボトルネックをどう解いたかを紹介している。
