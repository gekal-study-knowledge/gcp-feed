  "b6f8249d056624f89359adcce5e64727":
    "id": "b6f8249d056624f89359adcce5e64727"
    "title": "エージェンティック時代に向けて開発した最新の TPU：8tx および 8i Max"
    "link": "https://cloud.google.com/blog/ja/topics/ai-infrastructure/tpu-8tx-and-tpu-8i-max/"
    "published": "2026-11-10 10:00:00"
    "fetched": "2026-11-10 12:10:40"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 9 日に、</span><a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/tpu-8i-max-and-8tx/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">News from Google</span></a><span style=\"vertical-align: baseline;\"> および </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/tpu-8tx-and-tpu-8i-max?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud blog</span></a><span style=\"vertical-align: baseline;\"> に投稿されたものの抄訳です。</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">音声認識や言語翻訳などの Google 社内のニーズに基づき、10 年以上前に最初の TPU を設計しました。それから 8 世代の TPU を経て、ユースケースは爆発的に増加しました。i）自社の Gemini モデルのトレーニングとサービング、ii）エージェンティックなワークロード、iii）クラウド インフラストラクチャ上での Google Cloud のお客様へのサービス提供、iv）さらに最近では、iv) お客様が自身のデータセンターに直接 TPU をデプロイできる機能の提供など、あらゆる分野を網羅しています。現在、 TPU は急速に成長しているビジネスであり、フロンティア ラボ、トレーディング業者、小売業者、大学など、100 近くのお客様にご利用いただいています。 </span></p>\n<p><span style=\"vertical-align: baseline;\">4 月の Google Cloud Next で、同世代の 2 つの新しい特化型 TPU を</span><a href=\"https://cloud.google.com/blog/ja/products/infrastructure/eighth-generation-tpu-agentic-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">紹介</span></a><span style=\"vertical-align: baseline;\">しました。大規模トレーニング用の 8t とリアルタイム推論用の 8i です。TPU 8t と 8i は、前世代の TPU と比較して、それぞれ 最大 2.7 倍優れたトレーニング パフォーマンスと最大 80% 向上した推論の価格性能比を提供します。 </span></p>\n<p><span style=\"vertical-align: baseline;\">本日、その取り組みをさらに一歩進め、第 8 世代 TPU ポートフォリオを拡張します。大規模なコンテキスト ウィンドウとラックあたりで非常に高いコンピューティング密度を実現する TPU 8i Max と、安全で機密性の高い推論を実現する TPU 8tx です。Google Cloud が 1 年間に 4 つの TPU システムを導入したのは今回が初めてです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"8th-Gen-range_samesize\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/8th-Gen-range_samesize.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>拡張された第 8 世代 TPU ポートフォリオ： TPU 8t、 TPU 8i、 TPU 8tx、 TPU 8i Max。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">私たちは常に Google DeepMind と共に TPU を共同で設計してきましたが、現在、特定のニーズについて外部組織から多くのフィードバックを受けています。コンピューティングが人間からエージェントの規模に移行する中、企業は AI モデルの大規模なコンテキスト ウィンドウ全体で推論できるアクセラレータを求めています。さらに、厳しい規制を受けている一部のお客様は、独自のワークロードに対応する特化した暗号化機能を求めています。 </span></p>\n<p><span style=\"vertical-align: baseline;\">本日発表する新しい TPU システムは、この新しい現実に対処します。</span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus\"><span style=\"text-decoration: underline; vertical-align: baseline;\">最近の PyTorch に関する発表</span></a><span style=\"vertical-align: baseline;\">と合わせて、すべての開発者と Google Cloud のお客様が TPU をより簡単に利用できるようにすることが私たちの目標です。モジュール式のカスタム シリコンとオープンで使いやすい ソフトウェア スタック を組み合わせることで、 AI 業界のペースに合わせて新しいハードウェアとシステム構成を提供することが可能となります。 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">チップを中心にコンピュータを構築する </strong></h3>\n<p><span style=\"vertical-align: baseline;\">本日、2 つの新しい TPU システムを発表します。新しいチップと新しいシステムの間には重要な違いがあります。 </span></p>\n<p><span style=\"vertical-align: baseline;\">新しいチップの設計は、物理法則と複雑で長期にわたる製造ライフサイクルを伴う複数年のプロセスにおいて、シリコン ウェハー上に数十億個の微細なトランジスタを配置することを意味します。一方、システムは、チップの周りにコンピューティング、ネットワーキング、ストレージをどのように集約するかに関係しています。新たなお客様のニーズや研究のユースケースに迅速に対応するために、それらをチップと一緒にどのようにパッケージ化するかがこれに含まれます。 </span></p>\n<p><span style=\"vertical-align: baseline;\">10 年以上前に最初の TPU を設計したとき、私たちは AI ソフトウェアがシリコン製造よりもはるかに速く進化することを理解していました。そこで、システムのバランスとモジュール性に根本的なアプローチを取り、 </span><a href=\"https://cloud.google.com/ai-infrastructure?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> の一部である構成要素として TPU を設計しました。これにより、エンジニアはパッケージング、高速メモリ、光ネットワーキング、およびそれらの周囲のセキュリティを速やかに最適化できます。このアプローチにより、専用スーパーコンピュータを数年ではなく数か月で提供できます。 </span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">セキュアでハイコンテキストな AI に特化 </strong></h3>\n<p><span style=\"vertical-align: baseline;\">第 8 世代 TPU ポートフォリオの各システムは、 AI ライフサイクルの異なる部分をターゲットにしています。 </span></p>\n<p><span style=\"vertical-align: baseline;\">TPU 8t と TPU 8i は、この世代のチップのベースラインを確立しました。 </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">TPU 8t は、大規模な基盤モデル向けのトレーニングの原動力となるように設計しており、最大化された「グッドプット」（消費エネルギー 1 ワットあたりに提供する有用なインテリジェンス）を備えています。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">TPU 8i は推論エンジンであり、メモリの壁を取り払い、チップ間通信の遅延を半分までに削減するように設計しました。 </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">現在、企業が自律型エージェントを本番環境に導入する中、ハードウェア レベルのデータ セキュリティと数百万トークンのコンテキスト スケールという 2 つの差し迫った新たな課題を解決するために、これらの基盤システムに 2 つの新しい構成を作成しました。 </span></p>\n<h4><strong style=\"vertical-align: baseline;\">TPU 8tx</strong></h4>\n<p><span style=\"vertical-align: baseline;\">第 8 世代の 3 番目のシステムである TPU 8tx は、安全で機密性の高い推論に最適化しており、小規模なトレーニングにも適しています。これは、最も機密性の高いデータとともにフロンティア モデルや独自のモデル、自律型エージェントを実行する、規制対象の企業や政府機関向けに構築しました。 </span></p>\n<p><span style=\"vertical-align: baseline;\">通常、データは保存時やネットワーク送信時には暗号化されていますが、コンピュータで処理する間はメモリ上で復号する必要があります。TPU 8t と同じシリコン上に構築し、カスタムの AMD CPU ホストと組み合わせた TPU 8tx は、セキュリティをハードウェア レイヤーに直接組み込み、現在使用中であっても機密データとモデルの重みを保護および分離した状態に保ちます。そして、リアルタイム推論用に作成したのと同じ低レイテンシの Boardfly ネットワークを採用することで、 TPU 8tx はマルチステップ エージェントを動かし続け、パフォーマンスの低下をほぼゼロに抑えながら、TPU 8t と比較してレイテンシを最大 2 倍低減します。 </span></p>\n<p><span style=\"vertical-align: baseline;\">トレーニング グレードのコンピューティングと高速な推論ネットワークを組み合わせることで、組織は単一のシステム上でモデルを同時に実行およびカスタマイズできます。TPU 8tx により、チームは別々のクラスター間で機密データを移行する必要なく、プライベート データを使用したモデルのファインチューニング、大規模モデルから小規模モデルへの蒸留、強化学習によるエージェントのトレーニングを行うことができます。 </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Designed for sensitive enterprise workloads\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Designed_for_sensitive_enterprise_workloads.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>機密性の高いエンタープライズ ワークロード向けに設計した TPU 8tx は、プライベートなファインチューニングと安全なエージェント実行のためのハードウェア レベルの コンフィデンシャル コンピューティングを提供します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">TPU 8i Max</strong></h4>\n<p><span style=\"vertical-align: baseline;\">4 番目のシステムである TPU 8i Max は、メモリの壁という異なる問題に対処するために設計しました。 </span></p>\n<p><span style=\"vertical-align: baseline;\">数十の AI エージェントが、ソフトウェアのコードベース全体または数時間の動画全体と一度に連携して動作する場合、メモリ帯域幅がすぐにボトルネックになります。そこで、2 つの低レイテンシ TPU 8i チップを 1 つのパッケージに組み合わせました。 </span></p>\n<p><span style=\"vertical-align: baseline;\">TPU 8i Max は、コンピューティングとメモリを連動してスケーリングさせることで、 TPU 8i の 2 倍のコンピューティング、2 倍の SRAM、2 倍の HBM 帯域幅を提供するため、プロセッサに必要なデータが絶えず供給され、大規模なワークロードが停滞することはありません。さらに、TPU 8i Max は既存のラック占有面積内に 2 倍のシリコンを収容するため、データセンターは 1 平方フィートあたりおよび 1 ワットあたりで大幅に多くのコンピューティング パワーを導入できます。 </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"The dual-chip TPU 8i Max system\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/The_dual-chip_TPU_8i_Max_system.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>大規模なコンテキスト ウィンドウと非常に高いコンピューティング密度のために設計した、デュアルチップの TPU 8i Max システム。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ワークロード全体で柔軟性を備えつつ、第 8 世代 TPU の 4 つのシステムを組み合わせることで、エージェンティックなライフサイクルのあらゆる段階に向けた専用のアクセラレータをお客様に提供します。スケールアップ トレーニング用の TPU 8t、低レイテンシ推論用の TPU 8i、コンフィデンシャル コンピューティング用の TPU 8tx、そして大規模なコンテキスト ウィンドウとラックあたりで非常に高いコンピューティング密度を実現する TPU 8i Max です。 </span></p>\n<h3><strong style=\"vertical-align: baseline;\">すべての開発者に TPU を開放 </strong></h3>\n<p><span style=\"vertical-align: baseline;\">10 年以上前に最初の TPU を提供開始した当時、TPU の処理能力を必要とするワークロードを実行している企業はごくわずかでした。ユースケースは限られていたため、エンジニアは最適化したフレームワークと手作業で調整したコードを使用していました。 </span></p>\n<p><span style=\"vertical-align: baseline;\">年月が経ち、 AI が進歩するにつれて、より多くの企業がアクセラレータを利用し始めました。現在、 AI の普及により、幅広い企業やユースケースにおいて TPU は非常に優れた選択肢となる段階に達しています。その結果、私たちは TPU を汎用ハードウェアと同じくらい簡単に利用できるように、導入の障壁を取り除くことに取り組んできました。 </span></p>\n<p><span style=\"vertical-align: baseline;\">本日、こうした投資の成果を以下の主要な分野でお客様にお届けします。 </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">すべての PyTorch 開発者に TPU 開発を開放。コードの書き換えは不要：</strong><span style=\"vertical-align: baseline;\"> 先月、 </span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TorchTPU</span></a><span style=\"vertical-align: baseline;\"> をオープンソース化しました。これにより、 PyTorch コードと Hugging Face モデルが TPU 上でネイティブで実行できるようになり、 vLLM や SGLang などの主要なオープンソース推論エンジン向けの、すぐに使える TPU バックエンドも提供します。さらに、ハードウェアの最適化を容易にするために、新しいオープンソースの </span><a href=\"https://docs.cloud.google.com/tpu/docs/pytorch-on-tpu#tpu-agent-suite\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU agent suite</span></a><span style=\"vertical-align: baseline;\"> （現在プレビュー版）は、 Claude Code 、 Cursor 、 Google Antigravity などのコーディング ツールに直接接続し、数分での TPU オンボーディングの自動化、ボトルネックの診断、自然言語によるカスタム カーネルの自動チューニングを行います。本番環境のデプロイメント向けに、新しいオープンソースの </span><a href=\"https://opensource.googleblog.com/2026/11/supercharging-xla-inference-xla-serving-engine.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">XLA Serving Engine</span></a><span style=\"vertical-align: baseline;\"> を使用すると、 Python でモデルをトレーニングし、 TPU 、 GPU 、 CPU 全体の低レイテンシな C++ ランタイムで直接サービングできます。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">InferenceX および AgentX ベンチマークにおける優れた本番環境のパフォーマンス：</strong><span style=\"vertical-align: baseline;\"> 本番環境で本当に重要なのは、理論上のチップのピーク速度ではなく、実際の AI ワークロードでの結果です。現実的なエージェンティック コーディングとロングコンテキスト作業を検証する、業界標準の InferenceX および AgentX </span><a href=\"https://newsletter.semianalysis.com/p/tpu-inferencex-full-steam?utm_source=post-email-title&amp;publication_id=6349492&amp;post_id=213967688&amp;utm_campaign=email-post-title&amp;isFreemail=false&amp;r=2j6jwc&amp;triedRedirect=true\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ベンチマーク</span></a><span style=\"vertical-align: baseline;\">において、 TPU 上のネイティブな vLLM-TorchTPU ソフトウェア スタック は優れた価格性能比を達成しました。</span><a href=\"https://newsletter.semianalysis.com/p/tpu-strikes-the-king\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">新たな評価結果</span></a><span style=\"vertical-align: baseline;\">は、高いモデル精度を維持しつつ、こうした利点が幅広いフロンティア オープン モデルやオープンソースのサービング スタック全体に適用できることを示しています。同じハードウェア上での今後のソフトウェア最適化により、これらの結果はさらに向上する見込みです。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自律型エージェントのアイドル コンピューティングの無駄を排除：</strong><span style=\"vertical-align: baseline;\"> AI エージェントはステートフルであるため、データベースの検索、外部のソフトウェア ツール、または人間のフィードバックを待つ間、数秒から数時間、頻繁に一時停止します。これらの一時停止中にアクセラレータの電力効率を高めるため、新しい </span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/agent-compute-engine-deep-dive?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Compute Engine</span></a><span style=\"vertical-align: baseline;\"> ソフトウェアは、アイドル状態のエージェント セッションを自動的に一時停止し、ミリ秒単位で使用中のメモリをチップから移動させ、運用のインフラストラクチャ コストを削減します。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">モデル ステート レイヤー (TPU Sync) でメモリの壁を突破：</strong><span style=\"vertical-align: baseline;\"> チップを中心にコンピュータを構築することは、ソフトウェアでメモリ、ストレージ、ネットワーキングを統合することも意味します。エージェントが数百万トークンのコンテキストと継続的な強化学習（RL）ループ全体で推論するにつれて、メモリはすぐにボトルネックになります。 TPU クラスターのモデル ステート レイヤーである </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/introducing-tpu-sync-fast-kv-cache-and-weight-transfer-on-tpu?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Sync</span></a><span style=\"vertical-align: baseline;\"> をオープンソース化します。TPU Sync は、チップの HBM、ホストの DRAM、共有ストレージ、およびデータセンター ネットワークを 1 つの共同設計されたメモリ階層に統合します。これにより、ミリ秒単位で大規模な KV キャッシュをチップ外に自動的に階層化し、分離されたプレフィル ノードとデコード ノード間でコンテキストをストリーミングし、RL の重みを同期して、KV 転送レイテンシと Time to First Token (TTFT) を 90% 以上削減します。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">単一のコントローラーから TPU 全体で分散ワークロードをスケーリング：</strong><span style=\"vertical-align: baseline;\"> Google Kubernetes Engine (GKE) で</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/cloud-pathways-a-distributed-ml-runtime-is-ga?hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一般提供</span></a><span style=\"vertical-align: baseline;\">を開始した </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-intro?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pathways</span></a><span style=\"vertical-align: baseline;\"> は、 Gemini の基盤となる Google DeepMind ランタイムをすべての Google Cloud のお客様に提供します。単一コントローラー アーキテクチャと</span><a href=\"https://github.com/AI-Hypercomputer/pathways-utils\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pathwaysutils</span></a><span style=\"vertical-align: baseline;\"> を使用すると、事前トレーニング、強化学習、マルチホスト推論のために、複数のスライスにまたがる大規模な TPU システムを、1 つのローカル マシンであるかのようにオーケストレーションできます。Cloud Pathways は、コロケーションした Python サイドカー、1 分未満のスライスのホットスワップ、エラスティックなリシャーディングにより、ハードウェアの中断が発生しても実行時間の長いジョブを動かし続けます。 </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE 動的スライシングによるカスタム TPU トポロジのオンデマンドな結合：</strong><span style=\"vertical-align: baseline;\"> 一般提供を開始した </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE 動的</span><span style=\"text-decoration: underline; vertical-align: baseline;\">スライシング</span></a><span style=\"vertical-align: baseline;\">は、光回線スイッチ（OCS）テクノロジーを使用して、物理ハードウェアのプロビジョニングと論理スライスの形成を分離します。 TPU キューブをオンザフライでより大きなトポロジに動的に組み立てたり（スーパースライシング）、より小さな分離されたワークロードに分割したり（サブスライシング）することで、このアップデートは柔軟性に欠ける手作業でのノードプール再作成サイクルを不要にします。このトポロジの俊敏性により、ジョブの起動時間を最大 5 分の 1 に短縮し、障害復旧を最大 4.5 倍に加速し、すべての TPU にわたってフリート全体の稼働率とワークロードのグッドプットを最大限に高めます。 </span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">10 年の経験を活かした共同設計 </strong></h3>\n<p><span style=\"vertical-align: baseline;\">1 年間で 4 つの TPU システムと統一したオープンな ソフトウェア スタックを出荷することは、シリコン アーキテクト、ネットワーキング エンジニア、コンパイラ チーム、Google DeepMind の研究者が並行して構築する場合にのみ実現可能です。 </span></p>\n<p><span style=\"vertical-align: baseline;\">次世代の AI インフラストラクチャを構想し、構築するために、私たちが AI を活用する機会はますます増えています。Google DeepMind の </span><a href=\"https://deepmind.google/blog/how-alphachip-transformed-computer-chip-design/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaChip</span></a><span style=\"vertical-align: baseline;\"> 強化学習システムを利用したり、Gemini を活用してチップ レイアウトの提供を数週間から数時間に短縮したりするなど、私たちは TPU を搭載した AI サービスを利用して、次世代 TPU ハードウェアの開発を急速に加速させています。これこそが真の共同設計であり、 Google ならではの差別化要因です。</span></p>\n<p><span style=\"vertical-align: baseline;\">新しい TPU システムの詳細については、</span><a href=\"https://youtube.com/live/pabDkNR7jIs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">本日の配信</span></a><span style=\"vertical-align: baseline;\">をご覧ください。 </span></p></div>"
