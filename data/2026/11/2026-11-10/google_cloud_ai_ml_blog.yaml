  "92c64c86ccccfce47fcf2ae21a19f9c7":
    "id": "92c64c86ccccfce47fcf2ae21a19f9c7"
    "title": "New survey finds enterprises trapped between legacy software and AI modernization"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/new-survey-finds-enterprises-trapped-between-legacy-software-and-ai-modernization/"
    "published": "2026-11-10 02:00:00"
    "fetched": "2026-11-10 05:25:30"
    "summary": "<div class=\"block-paragraph\"><p>Throughout my career in cybersecurity and infrastructure protection — both in government and now at Google Cloud — I have consistently seen that friction between new and existing technology is often a barrier to progress. A new piece of software or service may work wonderfully on its own but then it’s placed within a complex, interconnected IT environment and lost in the operational inertia.</p><p>Today, enterprise technology is experiencing a historic transformation. Organizations globally are moving beyond integrating AI and LLMs, and are now utilizing AI to power autonomous, agentic workflows. Nearly 90% of the Fortune 100 are already using Gemini Enterprise to build, scale and govern agents. But as AI systems begin to plan, execute multi-step processes, and work alongside human teams, leaders are confronting this same tension between cutting-edge and legacy technology.</p><p>To understand how existing technology environments shape an organization’s ability to operationalize AI, Google Cloud partnered with Hypothesis Group to survey 1,250 enterprise IT and business decision-makers across the United States. The <a href=\"https://services.google.com/fh/files/misc/the_innovation_paradox2026.pdf\" target=\"_blank\">findings</a> reveal a critical paradox: the legacy software systems enterprises rely on to deliver technology to their employees are simultaneously functioning as an innovation tax, actively holding back the AI transformation leaders are trying to achieve.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image 1_legacy software blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_1_legacy_software_blog_8uCnV8N.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-medium\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image2_legacysoftwareblog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_legacysoftwareblog.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <h2><b>Legacy IT’s operational toll</b></h2><p>In our study, we defined “legacy” technology as software running locally on computers and servers rather than natively in the cloud. Across industries, decision-makers report that maintaining this footprint exerts a constant friction on their AI ambitions.</p><p>The consequences to AI are not theoretical. Nearly half (49%) of respondents report that relying on on-premises software has actively delayed, reduced in scope, paused or canceled AI or other technology initiatives.</p><p>Digging deeper, routine patch application and maintenance emerged as a primary operational bottleneck. As AI-enabled vulnerability discovery accelerates, the rate at which flaws are surfaced in legacy codebases has outpaced what human security teams can realistically address.</p><p>This creates a zero-sum game between routine maintenance of legacy systems and AI modernization. Instead of directing engineer cycles toward AI modernization, IT teams are spending their time and resources on maintaining legacy systems.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><div>\n<h2 class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Enterprise monoculture</span></h2>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Why do organizations continue to rely on legacy environments that constrain their modernization? As our research shows, it is not necessarily architectural preference — but the result of vendor lock-in.</span></div>\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"> </div>\n</div>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Beyond narrowing technology choice, deep provider dependence introduces commercial constraints. In our study, 39% of decision-makers report that reliance on legacy software and cloud providers forces them to navigate complex licensing rules or contracts, or limited negotiating flexibility.</span></div>\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"> </div>\n</div>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Even more concerning is the systemic operational risk created by single-vendor concentration. Concentrating operating systems, productivity applications, cloud hosting and emerging AI models within a single vendor's monoculture creates an immense single point of failure. An autonomous AI agent is only as secure as the operating system and network it traverses. When that underlying stack is vulnerable, organizations are not deploying resilient intelligence; they are expanding their attack surface.</span></div>\n</div>\n</div></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"The_Innovation_Paradox_10\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/The_Innovation_Paradox_10.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2><b>Customer choice</b></h2><p>The solution to vendor lock-in is straightforward: enterprise buyers and policymakers must ensure organizations have genuine choice and interoperability in their software, cloud and AI architectures.</p><p>Furthermore, 80% of leaders agree that a provider’s installed base should not determine which AI technology an organization uses, while 78% believe that the providers who led the previous era of enterprise technology may not be best positioned to lead the AI era. Organizations want the freedom to choose best-of-breed intelligence on its own merits, rather than accepting bundled defaults tied to legacy desktop software.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4_legacysoftwareblog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_legacysoftwareblog.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2>Accelerate agentic technology</h2><p>Delivering this level of autonomous agility across the enterprise requires modern technology built to support the agentic era. Here are a few ideas to get there:</p><ul><li><b>Demand architectural and provider choice:</b> AI and cloud must never be held hostage by the legacy software running local servers, email or desktop operating systems. Organizations need the commercial and architectural freedom to select best-of-breed IT on its own merits.</li><li><b>Commit to secure-by-design foundations:</b> The industry must move past the broken cycle of releasing insecure software and patching it after the fact. Software manufacturers must engineer durable, resilient architectures where entire vulnerability classes are eliminated before code ever ships — relieving understaffed IT teams from perpetual applying routine but necessary patches.</li><li><b>Deploy AI-driven defense to remediate legacy debt:</b> For the millions of lines of vulnerable legacy software already running in production, organizations must shift from manual triage to proactive, AI-assisted defense. By deploying platforms like Security Command Center and Mandiant threat analytics, teams can use intelligence to continuously surface active exploit paths, prioritize critical exposure and automate remediation across complex, hybrid environments.</li></ul><p>The promise of agentic AI is to help automate friction away, and accelerate human ingenuity. But that future cannot be built on top of software designed decades ago. As IT leaders plan their roadmaps, it is time to ask: Is your technology foundation accelerating your future, or are you paying a maintenance tax just to keep the past running?</p><p>Learn more about the research <a href=\"https://services.google.com/fh/files/misc/the_innovation_paradox2026.pdf\" target=\"_blank\">here</a>.</p></div>"
  "2cb7a9cc97f278d32b3afb0124136b7f":
    "id": "2cb7a9cc97f278d32b3afb0124136b7f"
    "title": "Introducing Gemini for healthcare"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-healthcare/"
    "published": "2026-11-10 21:00:00"
    "fetched": "2026-11-11 05:13:59"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Every healthcare organization is working to deliver great care to more people at a lower cost. However, a general AI model is not enough to solve this challenge. Today, healthcare runs on fragmented data. Patient records, coverage policies, and clinical evidence remain trapped across disconnected records, claims systems, and administrative tools that don’t work together. Clinicians are forced to spend </span><a href=\"https://services.google.com/fh/files/misc/measuring_admin_burden_2024_ebook.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">nearly 28 hours a week</span></a><span style=\"vertical-align: baseline;\"> on manually reconciling information, and patients wait for answers about their care and their coverage.</span></p>\n<p><span style=\"vertical-align: baseline;\">Healthcare organizations need </span><strong style=\"vertical-align: baseline;\">a single, secure, governed orchestration layer that coordinates work across the systems they already run, assembling verifiable evidence and taking multi-step workflows through to completion with human oversight.</strong></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are announcing </span><strong style=\"vertical-align: baseline;\">Gemini for healthcare</strong><span style=\"vertical-align: baseline;\">. This purpose-built industry solution extends the universal </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini agent</span></a><span style=\"vertical-align: baseline;\">, </span><span style=\"vertical-align: baseline;\">we introduced last month at Gemini at Work. </span></p>\n<p><span style=\"vertical-align: baseline;\">The Gemini agent is a single, always-on agent for work where employees delegate an objective, and the agent plans the steps, retains organizational context, and routes across the best models to deliver finished outcomes inside the tools teams already use. The Gemini agent is built with enterprise-grade identity administration, fine-grained access control, and centralized policy management directly into its runtime. Every agent operates with a distinct identity, inherits each user’s existing role-based permissions, and enforces strict need-to-know boundaries across every user, sub-agent, and workflow</span><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Working across clinical, financial, and administrative systems, it orchestrates multi-step tasks without forcing teams to switch applications:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For providers: </strong><span style=\"vertical-align: baseline;\">Gemini provides a patient’s history across care settings, charts are prepared before the visit, and authorization packets are assembled against payer policy before submission, so fewer claims come back denied.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">For health plans and payers: </strong><span style=\"vertical-align: baseline;\">Gemini ensures requests are checked against medical policy and organized for the clinical reviewer, and benefits and costs are explained to members from their own plan documents.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Gemini for healthcare is built to support HIPAA compliance, with governance running underneath it all. It’s available starting today in preview.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=uqmXoKOs_o0\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Gemini for healthcare</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Gemini for healthcare empowers payers and providers to orchestrate complex clinical, operational, and administrative workflows.</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=uqmXoKOs_o0\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Four components of Gemini for healthcare</span></h3>\n<p><span style=\"vertical-align: baseline;\">Developed alongside clinical and health plan leaders, Gemini for healthcare provides an integrated, fully governed environment configured for payers and providers with four core components:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Skills for healthcare work: </strong><span style=\"vertical-align: baseline;\">Skills are reusable instructions and context, written by domain experts, that teach Gemini to run a specific task. Purpose-built, multi-step instructions guide the </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini agent</span></a><span style=\"vertical-align: baseline;\"> through essential clinical and administrative tasks, such as medical records synthesis, pre-appointment preparation, coverage and policy review, and payer benefit determination. Each skill applies your organization’s policies and plan rules, and teams can build custom skills tailored to the workflows and standard operating procedures unique to their organization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Connectors to clinical, financial, and operational systems: </strong><span style=\"vertical-align: baseline;\">A library of connectors links Gemini directly to the EHR, claims, care management, and administrative systems organizations already run. Gemini queries each system while strictly preserving existing identity and role-based access controls, so teams get unified context without migrating sensitive data or altering permissions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">An open healthcare partner ecosystem: </strong><span style=\"vertical-align: baseline;\">Every health system and health plan runs a different mix of systems. Healthcare systems integrators and digital health partners help organizations extend Gemini with specialized solutions, connect it to what they already run, and scale it without lock-in.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A secure, governed platform with open model choice:</strong><span style=\"vertical-align: baseline;\"> Clinical, security, and IT leaders get one place </span><span style=\"vertical-align: baseline;\">to set and enforce policies that govern every agent interaction. It is built to support HIPAA compliance, with enterprise-grade access controls, end-to-end audit logging, and verifiable citations so reviewers can check where each answer came from. Because the agent supports model choice, </span><span style=\"vertical-align: baseline;\">organizations can pair frontier models from Google and leading partners for complex clinical reasoning with fast, cost-efficient models for routine administrative steps under the same governance.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Unlocking high-value workflows with skills designed for payers and providers</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini for healthcare takes on the heavy assembly and administrative work that slows down clinical decisions and coverage determinations. </span></p>\n<p><strong style=\"vertical-align: baseline;\">At the point of care:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Building a longitudinal timeline from fragmented sources:</strong><span style=\"vertical-align: baseline;\">  Synthesizes EHR and external records, separates active problems from resolved ones, lists allergies, and flags medication discrepancies. Clinicians get a grounded and unified patient picture in minutes rather than piecing together history across disconnected systems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reclaiming preparation time between patients:</strong><span style=\"vertical-align: baseline;\"> Prepares the patient chart ahead of a scheduled visit or procedure, flagging interval events, current medications, and outstanding clearances, labs, or consents, so care teams walk in with the full picture.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Streamlining clinical authorization and appeals:</strong><span style=\"vertical-align: baseline;\"> Extracts relevant chart evidence into an audit-ready packet for review, aligned with payer policy, flagging documentation gaps before submission rather than after a denial. If denials do occur, and the record supports it, it drafts an appeal grounded directly in the clinical record and the plan’s policy.</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">At the point of coverage:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Accelerating payer review:</strong><span style=\"vertical-align: baseline;\"> Checks incoming requests against the health plan’s medical policies and organizes the findings for reviewers, with findings traceable to the submitted documentation and coverage policy. Clinical reviewers spend less time assembling files and more time applying professional judgment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Demystifying benefits and patient financial liability:</strong><span style=\"vertical-align: baseline;\"> Parses complex plan benefit booklets to estimate out-of-pocket costs, track deductibles, and verify in-network status, giving member services staff a step-by-step breakdown grounded in the member’s actual plan documents. For Medicare Advantage members, it applies Medicare’s coverage criteria where a plan’s internal rule is stricter.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Open ecosystem of connectors across the healthcare tech stack</span></h3>\n<p><span style=\"vertical-align: baseline;\">Gemini for healthcare connects directly to core clinical, operational, and industry systems via secure </span><a href=\"https://cloud.google.com/gemini-enterprise/connectors\"><span style=\"text-decoration: underline; vertical-align: baseline;\">connectors</span></a><span style=\"vertical-align: baseline;\">, inheriting each source system’s existing role-based access controls and data permissions.</span></p>\n<p><strong style=\"vertical-align: baseline;\">EHRs and clinical data integration:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Epic EHR</strong><span style=\"vertical-align: baseline;\">: Gives authorized users read-only access to patient conditions, medications, labs, clinical notes, and specialist documentation. With </span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/epic\"><span style=\"text-decoration: underline; vertical-align: baseline;\">no write-back</span></a><span style=\"vertical-align: baseline;\"> to the underlying chart, clinical data integrity remains completely intact.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Oracle Health EHR: </strong><span style=\"vertical-align: baseline;\">Surfaces read-only patient histories, diagnostics, lab results, and clinical documentation for authorized users while enforcing zero write-back to ensure data integrity for the system of record.</span></li>\n<li><strong style=\"vertical-align: baseline;\">InterSystems FHIR Server</strong><span style=\"vertical-align: baseline;\">:</span><span style=\"vertical-align: baseline;\"> Extending beyond EHR integrations, InterSystems FHIR MCP Server provides standardized, high-performance FHIR repository management and clinical data interoperability.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Verato</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Resolves patient identity and matches records across visits and sources.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Keragon - Healthcare Integrations</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Provides connectivity to 400+ healthcare applications, including EHRs, enabling organizations to securely connect their existing healthcare systems through a single MCP integration.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Eligibility, claims, and pricing:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Optum Coordination of Benefits</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Finds additional patient coverage and determines the correct order of benefits before billing. Currently in limited release and testing with Gemini for Healthcare. </span></li>\n<li><strong style=\"vertical-align: baseline;\">Optum Network Eligibility</strong><span style=\"vertical-align: baseline;\">: Retrieves patient eligibility and benefit details from connected health plans in real time. Currently in limited release and testing with Gemini for Healthcare.</span></li>\n<li><strong style=\"vertical-align: baseline;\">TriZetto Provider Solutions:</strong><span style=\"vertical-align: baseline;\"> Verifies patient eligibility, coverage, co-pays, and deductibles across Medicare, Medicaid, and major commercial plans via TriZetto's vast network.</span></li>\n<li><strong style=\"vertical-align: baseline;\">GoodRx</strong><span style=\"vertical-align: baseline;\">: Enables care teams to discover prescription pricing and savings options, including manufacturer-sponsored self-pay programs, directly within AI-powered workflows to help patients access more affordable medications.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Infinitus Relay</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Automates high-volume payer phone calls required for prior authorization and benefit verification.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Terminology and coding:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">IMO Health</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Brings terminology normalization, clinical search, and knowledge graphs into healthcare skills and governed agentic workflows.</span></li>\n<li><strong style=\"vertical-align: baseline;\">ICD-10 Codes</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Searches and validates ICD-10-CM diagnosis codes, billable status, and hierarchy.</span></li>\n<li><strong style=\"vertical-align: baseline;\">RxNorm Drug Vocabulary</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> Looks up standardized drug names, ingredients, strengths, dose forms, and NDCs.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Coverage and provider reference:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">CMS Coverage</strong><span style=\"vertical-align: baseline;\">: Connects directly to Medicare coverage rules, National and Local Coverage Determinations (NCDs/LCDs), ensuring coverage reasoning rests on current published policy rather than static model knowledge.</span></li>\n<li><strong style=\"vertical-align: baseline;\">NPPES NPI Registry</strong><span style=\"vertical-align: baseline;\">: Verifies provider identity, clinical taxonomy, and practice location in real time.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Evidence based guidelines:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Optum EvidenceVue:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Turns real-world clinical data into actionable evidence through AI-powered workflows from Optum Life Sciences. </span></li>\n<li><strong style=\"vertical-align: baseline;\">BMJ Digital Health:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Delivers expert-curated, structured, peer-reviewed clinical guidelines and evidence, grounding care and coverage decisions in verifiable citations.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Clinical and operational workflows:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Salesforce</strong><span style=\"vertical-align: baseline;\">: Headless Salesforce Health Cloud integrations bring workflows, data models, and Agentforce into Gemini for governed action right in the flow of work.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Suki</strong><span style=\"vertical-align: baseline;\">: Delivers Ambient Clinical Intelligence across healthcare workflows, transforming clinical conversations into actionable intelligence that powers documentation, coding, revenue cycle management, and clinical reasoning.</span></li>\n<li><strong style=\"vertical-align: baseline;\">UiPath</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Connects healthcare-ready UiPath automations and agents to help teams assemble citation-backed context for operational reviews, prior authorizations, and appeals.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Synthpop Careflow:</strong><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Orchestrates the patient journey across referral intake, coverage verification, and patient follow-up, turning unstructured referrals into validated, payer-ready orders without manual re-entry.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Alteryx</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Enables healthcare teams to turn their domain expertise into automated analytics workflows, grounding AI-driven insights in business rules and calculations that are visible, understandable, repeatable, and auditable.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Enterprise productivity and collaboration:</strong></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Sana from Workday:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Connects HR, finance, and enterprise knowledge so healthcare teams can surface policies, coordinate tasks, and get work done across administrative systems.</span></li>\n<li><strong style=\"vertical-align: baseline;\">ServiceNow</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">Tracks IT incidents, operational service requests, and approval chains while enforcing existing enterprise routing rules.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Microsoft 365</strong><span style=\"vertical-align: baseline;\">:</span><span style=\"vertical-align: baseline;\"> Integrates directly with Word, Outlook, and SharePoint so prepared authorization packets, appeal letters, and benefit breakdowns land directly in the tools where teams already work.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Google Workspace</strong><span style=\"vertical-align: baseline;\">: Connects seamlessly with Google Docs, Gmail, Drive, and Sheets to surface internal files and coordinate administrative workflows while enforcing enterprise access controls.</span></li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Security and compliance:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cyera Dataport</strong><span style=\"vertical-align: baseline;\">: Integrates with Cyera for data and agent security, delivering protected health information (PHI) context to support HIPAA audits and compliance reporting.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Global implementation partners and ecosystem</span></h3>\n<p><span style=\"vertical-align: baseline;\">Through our open platform, organizations can deploy specialized partner agents such as </span><strong style=\"vertical-align: baseline;\">ASCO Oncology Guideline Assistant</strong><span style=\"vertical-align: baseline;\"> or work with healthcare systems integrators, including </span><strong style=\"vertical-align: baseline;\">66degrees, Accenture, Altimetrik, AuxoAI, Cognizant, Deloitte, Egen, HCLTech, KPMG, NTT DATA, PwC, Quantiphi, Slalom, Tata Consultancy Services, TEKsystems Global Services, and Wipro,</strong><span style=\"vertical-align: baseline;\"> to customize, integrate, and scale these capabilities across complex enterprise architectures without vendor lock-in.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=VIBvNUWB-NQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Healthcare video</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Optum Insight shares how Gemini for healthcare brings value to healthcare professionals at every stage.</h4>\n        \n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=VIBvNUWB-NQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Developed alongside leading healthcare organizations</span></h3>\n<p><span style=\"vertical-align: baseline;\">Health systems, health plan providers, academic medical centers, and clinical leaders are already working with Google Cloud to shape and apply these capabilities across care delivery, plan operations, and medical research: </span></p>\n<p><strong style=\"vertical-align: baseline;\">Synthesizing patient context at the point of care</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“Making it easier for physicians to access and understand a patient’s medical history helps them spend less time gathering information and more time focused on patient care. Through our work with Google Cloud, we’re exploring how Gemini can interpret and synthesize complex patient information from multiple electronic health record systems and care settings, connecting data from different sources to give clinicians a more complete and cohesive understanding of a patient’s medical history.” </span><em><span style=\"vertical-align: baseline;\">—</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Michael J. Schlosser, MD, MBA, FAANS, Executive Vice President and Chief Clinical Officer, </span><strong style=\"vertical-align: baseline;\">HCA Healthcare.</strong></em></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"By leveraging Gemini for healthcare, we will be able to use technology in a way that elevates the patient experience and strengthens the relationship between caregivers and those they serve. Through these integrated solutions, we expect to ease some of the administrative burden on our clinical teams and give them more time for what matters most: caring for their patients. Technology is at its best when it supports our caregivers and strengthens the human connection that is at the heart of healthcare.\" </span><em><span style=\"vertical-align: baseline;\">— Dr. John D'Angelo, President and CEO, </span><strong style=\"vertical-align: baseline;\">Northwell Health</strong><span style=\"vertical-align: baseline;\">.</span></em></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Streamlining coverage, benefits, and payer operations</strong></p>\n<ul>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">“</span><span style=\"font-style: italic; vertical-align: baseline;\">The real promise of AI in healthcare isn’t simply doing today’s work faster. It’s creating a better way for the health system to work. When payers and providers can connect data, insights and workflows more seamlessly, we can remove unnecessary complexity, improve performance and help the entire system work better</span><span style=\"vertical-align: baseline;\">.” — Sandeep Dadlani, Chief Executive Officer, </span><strong style=\"vertical-align: baseline;\">Optum Insight</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">“Gemini for healthcare serves as a foundation for our unified architecture of reusable AI agents, enabling us to deliver new capabilities and productivity gains significantly faster than traditional development cycles. Our focus going forward is an agentic-AI model, where an intelligence layer drives deeper automation and operational transformation. Blue Cross Blue Shield of Massachusetts is working toward that future in healthcare with Google Cloud.\" — Prem Somasundaram, Chief Information Officer, </span><strong style=\"vertical-align: baseline;\">Blue Cross Blue Shield of Massachusetts.</strong></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Accelerating clinical research and evidence-based guidelines</strong></p>\n<ul>\n<li style=\"font-style: italic; vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“For oncology care providers, quick access to current and relevant information is not a luxury, but a necessity. We are excited about what Gemini for healthcare could do to help care providers quickly find the critical information they need, when they need it, so they can drive better outcomes for patients.” </span><span style=\"vertical-align: baseline;\">— Clifford Hudis, MD, FACP, FASCO, Chief Executive Officer, </span><strong style=\"vertical-align: baseline;\">American Society of Clinical Oncology.</strong></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Built on an enterprise-grade foundation</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google is both a frontier AI lab and an enterprise cloud. </span><span style=\"vertical-align: baseline;\">Gemini for healthcare runs on Google Cloud’s secure infrastructure and is built to support HIPAA compliance</span><span style=\"vertical-align: baseline;\">. Clinical data, prompts, and generated outputs remain within your organization’s governed environment and are never used to train or fine-tune Google’s foundation models. Outputs are grounded in clinical records, plan policies, and your organization’s approved guidelines and evidence, with traceable citations and audit logging that give clinical, compliance, and IT leaders visibility and control. And because we operate the full stack, from infrastructure and models through security and the application layer, we can optimize performance, reliability, and cost together, routing high-volume administrative tasks to fast, low-cost models and reserving high-reasoning models for complex clinical and operational analysis, so organizations can scale AI across the enterprise without scaling spend at the same rate.</span></p>\n<h3><span style=\"vertical-align: baseline;\">This is just the beginning</span></h3>\n<p><span style=\"vertical-align: baseline;\">The launch of Gemini for healthcare marks another step in our commitment to bring the best of Gemini to every professional and every workflow, natively tailored to the way their industry works.</span></p>\n<p><a href=\"https://cloud.google.com/gemini/healthcare\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for healthcare</strong></a><span style=\"vertical-align: baseline;\"> is available in </span><strong style=\"vertical-align: baseline;\">preview</strong><span style=\"vertical-align: baseline;\"> in the U.S. today, joining our expanding suite of purpose-built solutions for</span> <a href=\"https://cloud.google.com/ai/legal\"><span style=\"text-decoration: underline; vertical-align: baseline;\">legal</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/ai/financial-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">financial services</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/gemini-enterprise/gov\"><span style=\"text-decoration: underline; vertical-align: baseline;\">government services</span></a><span style=\"vertical-align: baseline;\">.</span><span style=\"vertical-align: baseline;\"> We invite leaders across health systems, medical groups, health plan providers, and payers to explore how Gemini can transform their most critical clinical and operational workflows. </span></p></div>"
