  "92c64c86ccccfce47fcf2ae21a19f9c7":
    "id": "92c64c86ccccfce47fcf2ae21a19f9c7"
    "title": "New survey finds enterprises trapped between legacy software and AI modernization"
    "link": "https://cloud.google.com/blog/products/ai-machine-learning/new-survey-finds-enterprises-trapped-between-legacy-software-and-ai-modernization/"
    "published": "2026-11-10 02:00:00"
    "fetched": "2026-11-10 05:25:21"
    "summary": "<div class=\"block-paragraph\"><p>Throughout my career in cybersecurity and infrastructure protection — both in government and now at Google Cloud — I have consistently seen that friction between new and existing technology is often a barrier to progress. A new piece of software or service may work wonderfully on its own but then it’s placed within a complex, interconnected IT environment and lost in the operational inertia.</p><p>Today, enterprise technology is experiencing a historic transformation. Organizations globally are moving beyond integrating AI and LLMs, and are now utilizing AI to power autonomous, agentic workflows. Nearly 90% of the Fortune 100 are already using Gemini Enterprise to build, scale and govern agents. But as AI systems begin to plan, execute multi-step processes, and work alongside human teams, leaders are confronting this same tension between cutting-edge and legacy technology.</p><p>To understand how existing technology environments shape an organization’s ability to operationalize AI, Google Cloud partnered with Hypothesis Group to survey 1,250 enterprise IT and business decision-makers across the United States. The <a href=\"https://services.google.com/fh/files/misc/the_innovation_paradox2026.pdf\" target=\"_blank\">findings</a> reveal a critical paradox: the legacy software systems enterprises rely on to deliver technology to their employees are simultaneously functioning as an innovation tax, actively holding back the AI transformation leaders are trying to achieve.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image 1_legacy software blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_1_legacy_software_blog_8uCnV8N.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-medium\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image2_legacysoftwareblog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_legacysoftwareblog.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <h2><b>Legacy IT’s operational toll</b></h2><p>In our study, we defined “legacy” technology as software running locally on computers and servers rather than natively in the cloud. Across industries, decision-makers report that maintaining this footprint exerts a constant friction on their AI ambitions.</p><p>The consequences to AI are not theoretical. Nearly half (49%) of respondents report that relying on on-premises software has actively delayed, reduced in scope, paused or canceled AI or other technology initiatives.</p><p>Digging deeper, routine patch application and maintenance emerged as a primary operational bottleneck. As AI-enabled vulnerability discovery accelerates, the rate at which flaws are surfaced in legacy codebases has outpaced what human security teams can realistically address.</p><p>This creates a zero-sum game between routine maintenance of legacy systems and AI modernization. Instead of directing engineer cycles toward AI modernization, IT teams are spending their time and resources on maintaining legacy systems.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><div>\n<h2 class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Enterprise monoculture</span></h2>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Why do organizations continue to rely on legacy environments that constrain their modernization? As our research shows, it is not necessarily architectural preference — but the result of vendor lock-in.</span></div>\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"> </div>\n</div>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Beyond narrowing technology choice, deep provider dependence introduces commercial constraints. In our study, 39% of decision-makers report that reliance on legacy software and cloud providers forces them to navigate complex licensing rules or contracts, or limited negotiating flexibility.</span></div>\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"> </div>\n</div>\n<div class=\"Draftail-block--unstyled\">\n<div class=\"public-DraftStyleDefault-block public-DraftStyleDefault-ltr\"><span>Even more concerning is the systemic operational risk created by single-vendor concentration. Concentrating operating systems, productivity applications, cloud hosting and emerging AI models within a single vendor's monoculture creates an immense single point of failure. An autonomous AI agent is only as secure as the operating system and network it traverses. When that underlying stack is vulnerable, organizations are not deploying resilient intelligence; they are expanding their attack surface.</span></div>\n</div>\n</div></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"The_Innovation_Paradox_10\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/The_Innovation_Paradox_10.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2><b>Customer choice</b></h2><p>The solution to vendor lock-in is straightforward: enterprise buyers and policymakers must ensure organizations have genuine choice and interoperability in their software, cloud and AI architectures.</p><p>Furthermore, 80% of leaders agree that a provider’s installed base should not determine which AI technology an organization uses, while 78% believe that the providers who led the previous era of enterprise technology may not be best positioned to lead the AI era. Organizations want the freedom to choose best-of-breed intelligence on its own merits, rather than accepting bundled defaults tied to legacy desktop software.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4_legacysoftwareblog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_legacysoftwareblog.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2>Accelerate agentic technology</h2><p>Delivering this level of autonomous agility across the enterprise requires modern technology built to support the agentic era. Here are a few ideas to get there:</p><ul><li><b>Demand architectural and provider choice:</b> AI and cloud must never be held hostage by the legacy software running local servers, email or desktop operating systems. Organizations need the commercial and architectural freedom to select best-of-breed IT on its own merits.</li><li><b>Commit to secure-by-design foundations:</b> The industry must move past the broken cycle of releasing insecure software and patching it after the fact. Software manufacturers must engineer durable, resilient architectures where entire vulnerability classes are eliminated before code ever ships — relieving understaffed IT teams from perpetual applying routine but necessary patches.</li><li><b>Deploy AI-driven defense to remediate legacy debt:</b> For the millions of lines of vulnerable legacy software already running in production, organizations must shift from manual triage to proactive, AI-assisted defense. By deploying platforms like Security Command Center and Mandiant threat analytics, teams can use intelligence to continuously surface active exploit paths, prioritize critical exposure and automate remediation across complex, hybrid environments.</li></ul><p>The promise of agentic AI is to help automate friction away, and accelerate human ingenuity. But that future cannot be built on top of software designed decades ago. As IT leaders plan their roadmaps, it is time to ask: Is your technology foundation accelerating your future, or are you paying a maintenance tax just to keep the past running?</p><p>Learn more about the research <a href=\"https://services.google.com/fh/files/misc/the_innovation_paradox2026.pdf\" target=\"_blank\">here</a>.</p></div>"
  "3d20eee4f71c865dd79951577df66fe8":
    "id": "3d20eee4f71c865dd79951577df66fe8"
    "title": "Cloud CISO Perspectives: Our security forecast for 2027"
    "link": "https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-our-security-forecast-2027/"
    "published": "2026-11-10 01:00:00"
    "fetched": "2026-11-10 05:25:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Welcome to the first Cloud CISO Perspectives for November 2026. Today, Chris Betz shares our security forecast for 2027, with insights from top leaders at Google, Google Cloud, and Mandiant.</span></p>\n<p><span style=\"vertical-align: baseline;\">As with all Cloud CISO Perspectives, the contents of this newsletter are posted to the </span><a href=\"https://cloud.google.com/blog/products/identity-security/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud blog</span></a><span style=\"vertical-align: baseline;\">. If you’re reading this on the website and you’d like to receive the email version, you can </span><a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">subscribe here</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Get vital board insights with Google Cloud&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7c34449490&gt;), (&#x27;btn_text&#x27;, &#x27;Visit the hub&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Our security forecast for 2027</strong></h3>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">By Chris Betz, CISO, Google Cloud</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_PYRwidS.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Chris Betz, CISO, Google Cloud</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Today, we’re publishing insights on the cybersecurity trends and challenges we anticipate in 2027, including agentic threats, changing attack tactics, and the new security defense approaches required.</p><p>This year we’ve witnessed a fundamental change in cybersecurity. When the year began, only a few organizations were using LLMs and agents to find and fix vulnerabilities. Today, it’s happening at scale across enterprises.</p><p>Organizations expected a reality with agentic hacking where scale, speed and sophistication would outpace human-only response; today, we’re seeing it in practice. Organizations predicted software development at an unheard of pace; today, we’re securing software delivered in hours and days instead of weeks and months.</p><p>We have passed many milestones, and the world won’t go back — and we are all digging in to fully understand the new reality.</p><p>The year ahead promises to be challenging, exciting, innovative and will outpace 2026. In the year ahead, enterprise software will change as agility and speed provided by agentic development shifts us from a collection of static applications to a live fabric of autonomous agents that can manage pricing, negotiate supplier contracts, allocate capital, and reroute supply chains in real time.</p><p>To make this vision a reality, many organizations are rushing to build agents. It’s on us as an industry to ensure the development and operations models are designed to be trustworthy and safe.</p><p>The risks in 2027 won’t be just server outages or stolen databases. As the agentic operations world takes off, we also need to be concerned about the data and technology foundation that agents rely on.</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">When an agent makes a consequential decision, you must be able to reconstruct the entire story: what inputs came in, how the agent reasoned through them, which tools it called, what parameters it passed, and why policy allowed it. Without that trace, you can&#x27;t debug it, you can&#x27;t validate its correctness, and you can&#x27;t trust it. And if you can&#x27;t trust it, you can&#x27;t scale it.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Karthik Narain</strong><br />\n                \n                \n                  chief product and customer officer, Google Cloud\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Security must evolve to protect the balance sheet through decision integrity. Every consequential action taken by an autonomous system requires a complete, tamper-proof decision trace, recording and tracking: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Inputs entered into the system.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">How the model reasoned through its decisions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Which tools the model called, what parameters it passed, and why policy allowed it.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Collecting this data will help ensure that your teams can reconstruct, validate, and audit every automated decision before scaling.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Making the alert queue disappear, from chasing tickets to setting doctrine</strong></p>\n<p><span style=\"vertical-align: baseline;\">For decades, security operations centers (SOCs) have suffered from crippling alert fatigue — too many alerts compounded by legacy security tools that hand human analysts half-finished investigations. When autonomous threats can probe a network and move laterally in minutes, human defenders can’t manually stitch together logs across eight different consoles or approve individual defensive actions at microsecond speed.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">2027 is the year analysts stop chasing alerts and start shaping outcomes.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Ramya Chitrakar</strong><br />\n                \n                \n                  vice-president, Engineering, Google Cloud Security\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">That broken alert queue disappears in 2027 by flipping the operational model. The alert becomes the final output of an investigation. Autonomous defensive agents will handle the data enrichment, correlation, and triage automatically, surfacing a verified conclusion rather than a raw ticket. </span></p>\n<p><span style=\"vertical-align: baseline;\">Instead of chasing alerts at a keyboard, human analysts move up the stack to set strategic doctrine, define risk appetite, and verify automated actions built for rapid explainability — where any defensive decision can be understood by a human in 60 seconds and reversed in 30.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Moving Beyond Zero: Transaction-level trust and first-class agent identities</strong></p>\n<p><span style=\"vertical-align: baseline;\">As enterprises deploy thousands of custom agents across multicloud environments, flat trust architectures, shared human service accounts, and blanket administrator tokens are turning internal workflows into high-leverage entry points for prompt injection and lateral movement. </span></p>\n<p><span style=\"vertical-align: baseline;\">Traditional Zero Trust is too rigid and broad to govern autonomous software acting on its own.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">We need to extend the Zero Trust concept, not just at the network layer and the machine layer, but now down to the transaction layer.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Heather Adkins</strong><br />\n                \n                \n                  vice-president, Security Engineering, Google\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The year ahead demands an architectural shift to </span><a href=\"https://blog.google/security/going-beyond-zero-a-new-paradigm-for-enterprise-security/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Beyond Zero</span></a><span style=\"vertical-align: baseline;\"> so we can extend verification down to every individual transaction, network packet, and point-in-time authorization. Every autonomous agent should be treated as a first-class identity with its own verifiable credentials, strict least-privileged scope, and open communication standards. </span></p>\n<p><span style=\"vertical-align: baseline;\">When backed by real-time autonomous reasoning, we can dynamically allow a transaction on Tuesday and block the exact same request on Wednesday if conditions look anomalous.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Closing the loop between live runtime and defect-free code</strong></p>\n<p><span style=\"vertical-align: baseline;\">The traditional divide between writing software and securing it is breaking down, while adversaries </span><a href=\"https://cloud.google.com/blog/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619\"><span style=\"text-decoration: underline; vertical-align: baseline;\">actively target the open-source libraries</span></a><span style=\"vertical-align: baseline;\"> and external tools that coding assistants pull into codebases. Developers can no longer file a ticket and wait weeks for a manual security review, yet deploying hasty, unvalidated automated patches in production is just as dangerous to business continuity as the vulnerability itself.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Adversaries aren&#x27;t just attacking model math and algorithms. They&#x27;re actually poisoning the open source software, supply chain, MCP tools, and external libraries that agentic coding assistants pull automatically into code bases.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Sandra Joyce</strong><br />\n                \n                \n                  vice-president, Google Threat Intelligence\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In 2027, security becomes a closed-loop, continuous system embedded directly into the software delivery pipeline. By placing agentic reasoning inside developer tools, we can perform threat modeling and catch configuration errors side-by-side as code is written. </span></p>\n<p><span style=\"vertical-align: baseline;\">It’s also crucial that we link live production environments directly back to source code so that defenders can trace a real-world exposure to the exact line of code, validate whether it is genuinely exploitable, and deliver a pre-tested fix at machine speed without breaking production.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Turning internal ground truth into a decisive defender advantage</strong></p>\n<p><span style=\"vertical-align: baseline;\">Concerns persist around attackers gaining the upper hand in cybersecurity, and many fear autonomous capabilities will only widen that gap in 2027. Adversaries are already compressing six months of reconnaissance into hours, and exploiting flaws before vendors even know they exist. Compounding the challenge for defenders, no single model can discover or patch every vulnerability across code and cloud on its own.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">The defender&#x27;s advantage is that attackers operate with fragmented external visibility and guesswork. Defenders own the complete ground truth, identity privilege graphs, internal network architecture, code lineage, and real-time runtime activity.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Sandra Joyce</strong><br />\n                \n                \n                  vice-president, Google Threat Intelligence\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In the year ahead, defenders will use autonomous technology to capitalize on the one thing an outside attacker will never have: complete internal ground truth. While adversaries operate with fragmented external visibility and guesswork, defenders own the full picture of their identity privilege graphs, internal network architecture, code lineage, and live runtime activity. </span></p>\n<p><span style=\"vertical-align: baseline;\">By feeding that unified context into multi-model ensembles — such as pairing lightweight models for continuous scanning with deep reasoning models that cross-validate findings and eliminate false positives — organizations can spot and remediate toxic combinations of permissions and configurations that look harmless in isolation, before an external attacker can ever piece them together.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Countering asymmetric threat speed and the new extortion playbook</strong></p>\n<p><span style=\"vertical-align: baseline;\">Not every adversary will embrace machine speed the same way in 2027. While state-sponsored espionage actors often avoid loud, hyper-fast automated scripts that risk triggering alarms and blowing their long-term stealth, cybercriminals tend to go all-in on autonomous velocity. </span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">What we&#x27;re seeing right now is a variety of adversaries that are exploiting vulnerabilities before the vendors even know about it.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Charles Carmakal</strong><br />\n                \n                \n                  CTO, Mandiant Consulting\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As endpoint defenses get better at blocking traditional file-encrypting ransomware, criminal crews are shifting to rapid, high-volume data theft and extortion — specifically targeting proprietary model weights, custom agent skills, prompt libraries, and cloud GPU compute (“</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLMJacking</span></a><span style=\"vertical-align: baseline;\">”).</span></p>\n<p><span style=\"vertical-align: baseline;\">Preparation here means eliminating security silos. It’s a critical failure point to treat models, agent permissions, software supply chains, and cloud infrastructure as separate domains. </span></p>\n<p><span style=\"vertical-align: baseline;\">Instead, we want to unite them under a single, intelligence-led governance framework that allows defenders to lock down high-value autonomous assets and shut down extortion paths before data can leave the environment.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Red-teaming the agentic enterprise before adversaries attack</strong></p>\n<p><span style=\"vertical-align: baseline;\">In the rush to capture productivity gains in the year ahead, many enterprises are deploying custom agents directly into core business workflows without testing how those systems behave under adversarial pressure. That mistake leaves guardrails vulnerable to bypasses, scanner blinding, and indirect prompt injection.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">One of the things that the team&#x27;s been doing over the past few years is doing a lot of red team exercises… with those agentic solutions, so that we have the opportunity to identify and fix the issues before an adversary has the ability to do that against victim organizations.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Charles Carmakal</strong><br />\n                \n                \n                  CTO, Mandiant Consulting\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Continuous, proactive adversarial red-teaming must be a mandatory prerequisite before any autonomous workflow touches production. Systematically attempting to break into agentic systems, bypass safety controls, and manipulate model behavior prior to deployment is crucial to securing the agentic era.</span></p>\n<p><span style=\"vertical-align: baseline;\">Critically, model safety engineering should combine the results of those tests with frontline threat intelligence on novel attack prompts and evasion techniques. Defenders can then harden classifiers and neutralize new attack techniques before adversaries can use them against real victims.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Orchestrating specialized agent teams to prevent agent sprawl</strong></p>\n<p><span style=\"vertical-align: baseline;\">Relying on a single generalist agent to defend an enterprise will fail in 2027 because deep technical skills do not transfer across domains. For example, an agent built to reverse-engineer malware is not the agent that should reason about an identity blast radius. </span></p>\n<p><span style=\"vertical-align: baseline;\">As departments across the business rapidly spin up uncoordinated, standalone agents without centralized oversight, agent sprawl is emerging as the </span><a href=\"https://cloud.google.com/transform/these-4-ai-governance-tips-help-counter-shadow-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">next iteration of shadow IT</span></a><span style=\"vertical-align: baseline;\">, threatening to derail enterprise agent deployments through inadequate governance.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Technological adoption cannot outpace architectural governance… We have to prioritize machine speed defense. Security cannot remain a manual checkpoint that slows innovation down.</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Sandra Joyce</strong><br />\n                \n                \n                  vice-president, Google Threat Intelligence\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Just as a well-coordinated human team beats a lone generalist, the year ahead belongs to orchestrated networks of specialized hunter, decoder, and responder agents, each operating with its own domain depth, memory, and dedicated tools. </span></p>\n<p><span style=\"vertical-align: baseline;\">Succeeding at scale requires building the governance and orchestration layer first. The key here will be to establish graduated autonomy, shared state, clean handoffs between specialized agents, and a central coordinator that knows precisely when to act autonomously and when to escalate to a human.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more about our cybersecurity guidance for the coming year, check out our Security 2027 video.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=BtvVsGDTkYI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Google security leaders explore how we defend what&#x27;s next.</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=BtvVsGDTkYI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Join the Google Cloud CISO Community&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7c26fa2990&gt;), (&#x27;btn_text&#x27;, &#x27;Learn more&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">In case you missed it</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Here are the latest updates, products, services, and resources from our security teams so far this month: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Helping you build and defend at machine-speed in the agentic era</strong><span style=\"vertical-align: baseline;\">: At Security Summit 2026, we are sharing updates on how organizations can build securely, secure systems, and defend at machine speed in the agentic era. </span><a href=\"https://cloud.google.com/blog/products/identity-security/helping-you-build-and-defend-at-machine-speed-in-the-agentic-era\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How Google Does It: Using agents to help find, track, and fix vulnerabilities</strong><span style=\"vertical-align: baseline;\">: Threat actors can now find software flaws faster than ever. To maintain an agile, responsive defense, we now use agentic systems with existing foundations. </span><a href=\"https://cloud.google.com/transform/how-google-does-it-using-agents-help-find-track-and-fix-vulnerabilities\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How to use agents to stop insider threats</strong><span style=\"vertical-align: baseline;\">: As agents find their place across the enterprise, we want to be sure that they neither become an insider threat nor enable people to become one. </span><a href=\"https://cloud.google.com/transform/how-to-use-agents-to-stop-insider-threats\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Empowering SOC teams with the Wiz Red and Blue agents</strong><span style=\"vertical-align: baseline;\">: Red Agent gives SOC teams validated pre-breach alerts, while Blue Agent investigates active threats at machine speed, helping teams stay ahead in the AI threat era. </span><a href=\"https://www.wiz.io/blog/soc-alerts-red-and-blue-agents\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The ROI of agentic remediation with Wiz Green Agent</strong><span style=\"vertical-align: baseline;\">: Learn how Fireblocks, Rogo, and project44 used Green Agent to eliminate cross-team blockers and accelerate critical risk resolution. </span><a href=\"https://www.wiz.io/blog/green-agent-agentic-remediation\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Responding to core PHP vulnerabilities CVE-2026-109618 and CVE-2026-10961</strong><span style=\"vertical-align: baseline;\">: Follow these recommendations to minimize remote code execution risks in PHP from two critical vulnerabilities in the core PHP language runtime. </span><a href=\"https://cloud.google.com/blog/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Working collaboratively to fight scams in Asia Pacific</strong><span style=\"vertical-align: baseline;\">: To help tackle scams in the Asia Pacific region, here’s how we combine built-in protections, local partnerships, and education. </span><a href=\"https://blog.google/company-news/inside-google/around-the-globe/google-asia/fight-against-apac-scams/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Please visit the Google Cloud blog for more security stories </span><a href=\"https://cloud.google.com/blog/products/identity-security\"><span style=\"text-decoration: underline; vertical-align: baseline;\">published this month</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Learn something new&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7c26c23490&gt;), (&#x27;btn_text&#x27;, &#x27;Watch now&#x27;), (&#x27;href&#x27;, &#x27;https://www.youtube.com/watch?v=Wpo-5ke9uvQ&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Threat Intelligence news</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The rise of LLMJacking: How threat actors monetize compromised resources</strong><span style=\"vertical-align: baseline;\">: Mandiant responded to multiple incidents in 2026 in which threat actors hijacked enterprise access to large language models, a tactic known as LLMJacking that can generate large spikes in fraudulent cloud charges in a matter of hours. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Shutting the door on the XCPE botnet</strong><span style=\"vertical-align: baseline;\">: Google and industry partners dismantled the XCPE backdoor that had assembled more than 1.3 million set-top boxes into a botnet. We assessed with high confidence that the backdoor and botnet were intentionally developed, deployed, and operated for financial gain by Videostrong Technology Company, an Android original equipment manufacturer and original design manufacturer. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/shutting-the-door-on-the-xcpe-botnet\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ARTEX and friends: Enter agentic offensive frameworks</strong><span style=\"vertical-align: baseline;\">: Since September, Google Threat Intelligence Group and Mandiant have observed multiple threat actors abusing the open-source, agentic pentesting frameworks ARTEX, Hexstrike, and CAIRN to conduct a broad range of actions across multiple phases of the attack life cycle. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Investigating ephemeral supply chain tampering</strong><span style=\"vertical-align: baseline;\">: For the first time, Google Threat Intelligence Group (GTIG) and Mandiant have encountered a software supply chain compromise that was implemented with very short tampering windows that were active for only five to 10 minutes, and effectively evading traditional point-in-time triage and automated file scanning. </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Read more</strong></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Please visit the Google Cloud blog for more threat intelligence stories </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">published this month</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
