    "summary": "<h2 class=\"release-note-product-title\">Managed Service for Apache Airflow</h2>\n<h3>Feature</h3>\n<p><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/upgrade-environments#agentic-upgrade-check\">Agentic upgrade check</a>\nis available in Managed Airflow.</p>\n<p>Before upgrading your environment, you can run an upgrade check in the Google\nCloud console to ask Managed Airflow Agent what changes your DAGs require to\nwork with a selected Airflow build or image version.</p>"
