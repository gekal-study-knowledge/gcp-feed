    "summary": "<h2 class=\"release-note-product-title\">Cloud Service Mesh</h2>\n<h3>Announcement</h3>\n<p><strong>1.31.3-asm.9 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud Service\nMesh 1.31.3-asm.9 uses Envoy v1.39.5-dev.</p>\n<p>This release resolves the security vulnerabilities listed in Security Bulletin\n<a href=\"https://cloud.google.com/service-mesh/docs/security-bulletins#gcp-2026-080\">GCP-2026-080</a>\n(<a href=\"https://istio.io/latest/news/security/istio-security-2026-009/\">ISTIO-SECURITY-2026-009</a>).</p>\n<h3>Announcement</h3>\n<p><strong>1.30.7-asm.9 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/v1.30/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud Service\nMesh 1.30.7-asm.9 uses Envoy v1.38.10-dev.</p>\n<p>This release resolves the security vulnerabilities listed in Security Bulletin\n<a href=\"https://cloud.google.com/service-mesh/docs/security-bulletins#gcp-2026-080\">GCP-2026-080</a>\n(<a href=\"https://istio.io/latest/news/security/istio-security-2026-009/\">ISTIO-SECURITY-2026-009</a>).</p>\n<h3>Announcement</h3>\n<p><strong>1.29.10-asm.4 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/v1.29/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud Service\nMesh 1.29.10-asm.4 uses Envoy v1.37.10-dev.</p>\n<p>This release resolves the security vulnerabilities listed in Security Bulletin\n<a href=\"https://cloud.google.com/service-mesh/docs/security-bulletins#gcp-2026-080\">GCP-2026-080</a>\n(<a href=\"https://istio.io/latest/news/security/istio-security-2026-009/\">ISTIO-SECURITY-2026-009</a>).</p>\n<h3>Fixed</h3>\n<p>Patch 1.29.10-asm.4 contains the fix for the following platform CVEs:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">CVE</th>\n<th style=\"text-align: left;\">Proxy</th>\n<th style=\"text-align: left;\">Control Plane</th>\n<th style=\"text-align: left;\">Distroless</th>\n<th style=\"text-align: left;\">CNI</th>\n<th style=\"text-align: left;\">Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89161\">CVE-2026-89161</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (7.8)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89157\">CVE-2026-89157</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (7.4)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89158\">CVE-2026-89158</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (6.5)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89160\">CVE-2026-89160</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (6.5)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89156\">CVE-2026-89156</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (5.9)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-103111\">CVE-2026-103111</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (0.0)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-109518\">CVE-2026-109518</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">High (0.0)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-86145\">CVE-2026-86145</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (0.0)</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Filter version <code>v4</code> under the <code>Latest</code> alias includes an updated <a href=\"https://docs.cloud.google.com/model-armor/overview#ma-prompt-injection\">prompt\ninjection and jailbreak detection</a>\nfilter with the following improvements:</p>\n<ul>\n<li>Higher recall for indirect prompt injection (IPI) and tool calls.</li>\n<li>Higher recall for conversational inputs at a lower false positive rate.</li>\n<li>Higher recall for jailbreak attacks.</li>\n</ul>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/version-history#release-history\">Filter version history</a>.</p>"
