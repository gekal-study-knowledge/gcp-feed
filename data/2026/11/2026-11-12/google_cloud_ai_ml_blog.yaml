  "238613d9bff2517355b0f00552c9fc98":
    "id": "238613d9bff2517355b0f00552c9fc98"
    "title": "Introducing new AI functions for AlloyDB: ai.classify and ai.extract"
    "link": "https://cloud.google.com/blog/products/databases/ai-classify-and-ai-extract-functions-in-alloydb-ai/"
    "published": "2026-11-12 02:00:00"
    "fetched": "2026-11-12 08:18:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Transactional databases store vast amounts of unstructured text — clinical notes, customer reviews, support tickets, invoices, and property descriptions. Historically, working with this text meant building complex application code: You had to export data from the database, call external model endpoints, write custom prompt wrappers, parse unpredictable responses, manage retry logic, and update database records. This application-side loop creates operational friction. It introduces query latency, bloats application code, increases model token costs, and creates data compliance risks by moving sensitive information across multiple network boundaries.</span></p>\n<p><span style=\"vertical-align: baseline;\">We built </span><a href=\"https://cloud.google.com/alloydb/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI</span></a><span style=\"vertical-align: baseline;\"> to bring Gemini world knowledge directly into your operational database. Rather than treating artificial intelligence as a disconnected external service, we integrated model intelligence directly into the database engine. Today, we are announcing the preview of two new SQL functions in the AlloyDB AI query engine — </span><code style=\"vertical-align: baseline;\">ai.classify</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">ai.extract</code><span style=\"vertical-align: baseline;\"> — available in the </span><code style=\"vertical-align: baseline;\">google_ml_integration</code><span style=\"vertical-align: baseline;\"> extension (version 1.6.1 or later) on PostgreSQL 18, allowing you to perform classification and structured extraction directly inside your database using standard SQL. Supported by smart batching for AI functions (previously known as AI Function Acceleration), these functions deliver production scalability and performance. </span></p>\n<p><span style=\"vertical-align: baseline;\">Now, let’s take a look at these new functions and how to use them.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Classifying text directly in SQL with ai.classify</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">ai.classify</code><span style=\"vertical-align: baseline;\"> function categorizes text into user-defined classes without requiring manual prompt engineering. You can specify categories as a simple list of labels or provide a list containing label names and descriptions to guide model context.</span></p>\n<p><span style=\"vertical-align: baseline;\">Key capabilities include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Single-label classification (</span><code style=\"vertical-align: baseline;\">output_mode =&gt; 'single'</code><span style=\"vertical-align: baseline;\">) to assign the single best category</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Multi-label classification (</span><code style=\"vertical-align: baseline;\">output_mode =&gt; 'multi'</code><span style=\"vertical-align: baseline;\">) to return all matching categories</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Category descriptions using 2D arrays to provide explicit context for each label</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Few-shot prompting by supplying inline examples</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Flexible execution modes for individual rows (</span><code style=\"vertical-align: baseline;\">TEXT</code><span style=\"vertical-align: baseline;\">), arrays (</span><code style=\"vertical-align: baseline;\">TEXT[]</code><span style=\"vertical-align: baseline;\">), and cursors (</span><code style=\"vertical-align: baseline;\">REFCURSOR</code><span style=\"vertical-align: baseline;\">)</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Here’s a quick example showing how you can classify customer feedback directly within a SQL query:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SET google_ml_integration.enable_preview_ai_functions = TRUE;\\r\\n\\r\\nCREATE TABLE product_reviews (id INT, review TEXT);\\r\\n\\r\\nINSERT INTO product_reviews VALUES\\r\\n(1, &#x27;Fantastic, would buy again!&#x27;),\\r\\n(2, &#x27;Broken on arrival.&#x27;),\\r\\n(3, &#x27;Mediocre, not worth the price.&#x27;);\\r\\n\\r\\nSELECT unnest(\\r\\n  ai.classify(\\r\\n    inputs =&gt; ARRAY(SELECT review FROM product_reviews ORDER BY id),\\r\\n    categories =&gt; ARRAY[\\r\\n      [&#x27;positive&#x27;, &#x27;Good sentiment&#x27;],\\r\\n      [&#x27;neutral&#x27;, &#x27;Neither good nor bad sentiment&#x27;],\\r\\n      [&#x27;negative&#x27;, &#x27;Bad sentiment&#x27;]\\r\\n    ],\\r\\n    batch_size =&gt; 5\\r\\n  )\\r\\n) AS sentiment;\\r\\n\\r\\n-- Expected Output:\\r\\n-- sentiment\\r\\n-- ---------\\r\\n-- positive\\r\\n-- negative\\r\\n-- negative&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7de72d4b10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Extracting structured JSON with ai.extract</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">ai.extract</code><span style=\"vertical-align: baseline;\"> function transforms unstructured text into structured JSON data matching your target schema — specified as a JSON schema or a text list of fields. It handles system instructions internally, saving you from writing prompt templates or response parsers.</span></p>\n<p><span style=\"vertical-align: baseline;\">Key capabilities include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Schema flexibility supporting standard JSON schemas or plain text field lists</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Automatic transformation of unstructured text into machine-readable JSON</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Overloaded function signatures for single rows, arrays, and cursor batching</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Here’s an example extracting clinical fields from free-form medical notes:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;SET google_ml_integration.enable_preview_ai_functions = TRUE;\\r\\n\\r\\nSELECT ai.extract( \\r\\n  input =&gt; \\&#x27;Patient Jane Smith, 52 years old, visited the clinic on Oct 25. She is currently experiencing a mild fever, persistent cough, and severe body aches. The doctor prescribed Ibuprofen and Amoxicillin.\\&#x27;,\\r\\n  output_schema =&gt; \\&#x27;{\\r\\n      &quot;patient_name&quot;: {&quot;type&quot;: &quot;string&quot;},\\r\\n      &quot;age&quot;: {&quot;type&quot;: &quot;integer&quot;},\\r\\n      &quot;symptoms&quot;: {\\r\\n        &quot;type&quot;: &quot;array&quot;,\\r\\n        &quot;items&quot;: {&quot;type&quot;: &quot;string&quot;}\\r\\n      },\\r\\n      &quot;prescribed_medications&quot;: {\\r\\n        &quot;type&quot;: &quot;array&quot;,\\r\\n        &quot;items&quot;: {&quot;type&quot;: &quot;string&quot;}\\r\\n      }\\r\\n    }\\&#x27;\\r\\n);\\r\\n\\r\\n--- Expected output    \\r\\n-- {\\r\\n--   &quot;patient_name&quot;: &quot;Jane Smith&quot;,\\r\\n--   &quot;age&quot;: 52,\\r\\n--   &quot;symptoms&quot;: [\\r\\n--     &quot;mild fever&quot;,\\r\\n--     &quot;persistent cough&quot;,\\r\\n--     &quot;severe body aches&quot;\\r\\n--   ],\\r\\n--   &quot;prescribed_medications&quot;: [\\r\\n--     &quot;Ibuprofen&quot;,\\r\\n--     &quot;Amoxicillin&quot;\\r\\n--   ]\\r\\n-- }&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f7de72d4d10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Speeding up queries with smart batching</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Running AI evaluations row-by-row can slow down query execution. AlloyDB addresses this with smart batching for AI functions. When you use </span><code style=\"vertical-align: baseline;\">ai.classify</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">ai.extract</code><span style=\"vertical-align: baseline;\"> in SQL </span><code style=\"vertical-align: baseline;\">WHERE</code><span style=\"vertical-align: baseline;\"> clause expressions, the database engine automatically groups inputs into optimized micro-batches before sending them to Gemini Enterprise Agent Platform models.</span></p>\n<p><span style=\"vertical-align: baseline;\">Smart batching delivers significant performance and efficiency improvements:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Faster inference for query execution compared to row-at-a-time evaluations</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Reduces total model token spend by optimizing input prompt overhead</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Real-world industry applications</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Native classification and extraction functions support operational workflows across key industry sectors:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Healthcare:</strong><span style=\"vertical-align: baseline;\"> Securely convert free-text clinical notes into structured records containing patient names, symptoms, and prescribed medications, keeping patient data safely within the confines of the database.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Financial services:</strong><span style=\"vertical-align: baseline;\"> Extract vendor details, invoice dates, and line-item totals from scanned document text.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Legal technology:</strong><span style=\"vertical-align: baseline;\"> Pull governing law, liability caps, and termination notice periods from contract documents.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Real estate:</strong><span style=\"vertical-align: baseline;\"> Extract property types, bedroom counts, and price ranges from descriptive listing text.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Knowledge graphs:</strong><span style=\"vertical-align: baseline;\"> Extract entities and relationships from documents to populate PostgreSQL Property Graph (PGQ) structures.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Next steps and getting started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We are continuing to expand in-database AI capabilities in AlloyDB, with upcoming enhancements planned for advanced cost optimization, line-level provenance tracking, and query pushdowns beyond </span><code style=\"vertical-align: baseline;\">WHERE</code><span style=\"vertical-align: baseline;\"> clauses.</span></p>\n<p><span style=\"vertical-align: baseline;\">To start using </span><code style=\"vertical-align: baseline;\">ai.classify</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">ai.extract</code><span style=\"vertical-align: baseline;\"> in your database:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB AI Query Engine documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/release-notes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB release notes</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
  "1f33693437a62c3a0b3c6406c2b568e1":
    "id": "1f33693437a62c3a0b3c6406c2b568e1"
    "title": "Don’t just prompt AI — architect it: Introducing the Professional Agentic Architect Certification"
    "link": "https://cloud.google.com/blog/topics/training-certifications/google-cloud-agentic-architect-certification-dont-just-prompt-ai-design-it/"
    "published": "2026-11-12 02:00:00"
    "fetched": "2026-11-12 08:18:04"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">It just got easier to prove your expertise in building production-ready agents. Today, Google Cloud is introducing the </span><a href=\"https://cloud.google.com/learn/certification/agentic-architect/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Professional Agentic Architect certification</span><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></a><span style=\"vertical-align: baseline;\">as the latest milestone in our </span><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Agent Ready (GEAR)</span></a><span style=\"vertical-align: baseline;\"> initiative. Nearly one million developers are using GEAR to skill up on agents, but what makes this particular certification so special is its adoption within Google’s walls. </span></p>\n<p><span style=\"vertical-align: baseline;\">Over the past four months, Google Cloud has trained thousands of forward deployed engineers and strategic partners on our own advanced curriculum. Originally built as an internal training initiative, we are now opening it up to the entire developer community and partner ecosystem through this new certification. </span></p>\n<p><span style=\"vertical-align: baseline;\">As the VP who manages our forward-deployed engineers here at Google Cloud (Ravi) and the managing director of Google Cloud learning (Gary), we’ve seen just how effective this program has been inside Google at helping our teams rethink the way they build, deploy, and use AI in everyday in almost every way. We’re equally about what this new certification can bring to everyone — developers, engineers, and anyone else ready to demonstrate their agentic leadership.</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=AaQTFwEIy78\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">New Google Cloud Agentic Architect Certification</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=AaQTFwEIy78\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">A new hybrid format to validate your real-world skills</strong></h3>\n<p><span style=\"vertical-align: baseline;\">This is not a traditional multiple choice exam. Google has introduced a new hybrid format that requires you to prove both conceptual know-how and hands-on execution.</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Part 1 (The multiple choice proctored exam): </strong><span style=\"vertical-align: baseline;\">Evaluates your system design choices, architectural standards, cost optimization, and security governance.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Part 2 (Hands-on labs on Google Skills):</strong><span style=\"vertical-align: baseline;\"> Puts you in an active cloud environment to build, test, and debug live agentic workflows.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Why earning this certification can help advance your career</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As enterprises look to find top AI talent, this certification immediately signals that you have the advanced skills necessary to design secure, governed, and high-performance multi-agent systems. </span></p>\n<p><a href=\"https://www.ipsos.com/en-us/future-ai-and-technical-skill-building\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Our research with Ipsos on AI skill building</span></a><span style=\"vertical-align: baseline;\"> shows that certifications drive more recruiter outreach: </span><span style=\"vertical-align: baseline;\">82% of learners using Google Skills say that mentioning Google Cloud certifications on their resume drives more recruiter responses</span><strong style=\"vertical-align: baseline;\">.</strong></p>\n<p><span style=\"vertical-align: baseline;\">And it’s not just about getting the call — it’s about being able to answer it. </span><span style=\"vertical-align: baseline;\">That same research showed that </span><span style=\"vertical-align: baseline;\">90% of cloud professionals say credentials like Google Cloud certifications give them the verified know-how needed to fill in-demand roles. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">What’s covered on the exam</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The certification validates your proficiency across five key domains:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Build agents using low-code tools (democratizing rapid agent prototyping).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Use coding agents for application development (supercharging your coding productivity).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Develop custom agents on the </span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini platform</span></a><span style=\"vertical-align: baseline;\"> with open source frameworks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Evaluate and deploy agentic workflows (monitoring, optimizing, and ensuring performance).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Secure and govern agentic workflows (protecting sensitive enterprise data and ensuring model safety).</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Battle-tested by thousands of Google Cloud engineers and partners — now available to you</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Enterprise demand for agentic workloads has skyrocketed. As our customers move past AI prompting and run their most business critical workloads on Google Cloud, we’ve built our own team that delivers the agentic future with them — at scale. Google Cloud partners and Google’s forward deployed engineers are embedded directly with customers around the world and are prepared to solve deep technical challenges because of this rigorous curriculum and certification. </span></p>\n<p><span style=\"vertical-align: baseline;\">While building our forward-deployed engineering program, we wanted to standardize training and upskilling for customers, Google Cloud partners, and our own engineers with the Professional Agentic Architect certification. This ensures our own teams are using the same world-class standards that we recommend to our customers and partners, allowing us to learn from each other and sharpen our skills together. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Skill up for your certification at no cost today</strong></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Register for </span><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Agent Ready</span></a><span style=\"vertical-align: baseline;\"> to get access to 35 free monthly learning credits on Google Skills. For Google Cloud customers, </span><a href=\"https://developers.google.com/program/gear/getcertified\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get Certified</span></a><span style=\"vertical-align: baseline;\"> provides a cohort-based, guided certification journey at no cost. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">For Google Cloud partners, register for </span><a href=\"https://rsvp.withgoogle.com/events/partner-learning/certprograms?pli=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Partner Certification Kickstart</span></a><span style=\"vertical-align: baseline;\"> and review the </span><a href=\"https://partner.skills.google/paths/4531\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">partner learning path</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the </span><a href=\"https://services.google.com/fh/files/misc/professional_agentic_architect_exam_guide_english.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">exam guide</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.skills.google/paths/4525\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">learning path</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.google.com/forms/d/1fi1gqbWsNCFxm1CT9V-JNGff1lyqfU9kNWAaaQMvRi4/viewform?edit_requested=true\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sample questions</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Get hands-on with Google Skills labs and preparation modules to get comfortable developing custom agents on Gemini platform with open source frameworks. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/learn/certification/agentic-architect/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Register</span></a><span style=\"vertical-align: baseline;\"> for the multiple-choice exam, complete the hands-on lab requirements, and claim your digital badge to showcase your expertise to the world.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Don't just prompt AI — architect it. </span><a href=\"https://cloud.google.com/learn/certification/agentic-architect/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get certified today</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
"last_updated": "2026-11-12 08:18:04 JST"
