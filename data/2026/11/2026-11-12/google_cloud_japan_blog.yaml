    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 20 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/neurun-makes-sure-no-fan-gets-lost-in-the-crowd-using-google-maps-platform/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<hr />\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回のブログ記事は、Neurun の創業者 / CEO である Cade Netscher 氏によるものです。Neurun がニューヨーク / ニュージャージー地域の一元化されたデジタルガイド「NYNJ World Cup Concierge」を作成し、2026 年ワールドカップのファンが移動や観戦をスムーズに行えるよう支援した方法をご紹介いただきます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">使い慣れた地図インターフェースで土地勘のない都市を移動</span></h3>\n<p><span style=\"vertical-align: baseline;\">2026 年 FIFA ワールドカップは、ニューヨーク / ニュージャージー地域に活気あふれるエネルギー、満員のスタジアム、忘れられないできごとをもたらしました。しかし、歓喜に沸く観客とスリリングな試合の裏には、複雑なロジスティクスの問題が潜んでいました。39 日間にわたって 200 か国以上から 100 万人を超えるサッカーファンが来場したこのイベントは、スタジアム内での試合のみにとどまらない大規模なものとなりました。ファンは、混雑した不慣れな地域を移動し、無料イベントを探し、地元の店舗の割引を見つけ、車に頼らずに移動する方法を把握する必要がありました。</span></p>\n<p><a href=\"https://nynjfwc26.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ニューヨーク / ニュージャージー ワールドカップ開催委員会</span></a><span style=\"vertical-align: baseline;\">は、何年もかけて、誰もが手軽に参加できる都市規模のプログラムを企画してきましたが、その情報はウェブサイト、PDF、ソーシャル メディアに散在していました。ファンが道に迷ったりイベントを見逃したりすることがないよう、開催委員会は </span><a href=\"https://neurun.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Neurun</span></a><span style=\"vertical-align: baseline;\"> に依頼して、情報を 1 つに集約したデジタルガイドを作成しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Neurun は、大規模なイベント向けに空間認識デジタル プラットフォームを構築しています。当社は、ボストン マラソン、パリ マラソン、アイアンマン ベトナムなど、数多くのイベントでアスリートや観客を案内してきた経験から、信頼できる公式な情報源を参加者に提供することで、イベント体験が大きく変わることを経験しています。そのため、イベントごとにデジタル ブレインと呼ばれるものを構築することで、複雑なイベントでも簡単に感じられるようにしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 5 月初旬、Google Cloud スタートアップの Global Founder Advocate である Uday Ghatikar 氏が率いる Google Cloud Founder Advocacy Team とともに、イノベーション ワークショップ セッションに参加しました。このセッションの目的は、可能性を具現化する技術についてブレインストーミングすることでした。つまり、当社にとっても Google Cloud のお客様にとっても戦略的なゲーム チェンジャーとなるような、野心的なプロダクトをどのようにして構築できるかということです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"newrun-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/newrun-1.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>NYNJ World Cup Concierge は、3D Maps を使用して、ユーザーを没入型マップ上の特定の場所に瞬時に移動させます。（<a href=\"https://storage.googleapis.com/gweb-mobius-cdn/mapsplatform/uploads/67cf423af44bb7db27c90d0e921f1c2f9791c8d2.mp4\">動画</a>）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このセッションを終えて、当社は開発モデルを、クライアントごとの 1 回限りの構築ではなく、再利用可能なモジュール式のコンシェルジュ コンポーネントへと移行しました。この共通の基盤があることで、クライアントごとのカスタマイズを大規模に実現できるようになります。ゼロから再構築するのではなく、実績のあるコア基盤の上に個別にカスタマイズした機能や性能を重ねることで、スピードや信頼性を損なうことなく、より多くのリクエストに応えることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ニューヨーク / ニュージャージー ワールドカップ開催委員会が世界中の観客にこのサービスを提供するには、ファンがすでに信頼し、直感的に理解できるマッピング テクノロジーが必要でした。</span><a href=\"https://mapsplatform.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform</span></a><span style=\"vertical-align: baseline;\"> は、真のグローバル対応と使い慣れたインターフェースを提供するため、海外から訪れるファンもすぐに使いこなせます。また、多言語でのやり取りに対応できる高度な会話型 AI モデルも必要でした。そこで、</span><a href=\"https://cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud</span></a><span style=\"vertical-align: baseline;\"> の</span><a href=\"https://cloud.google.com/\"><span style=\"vertical-align: baseline;\"> </span></a><a href=\"https://deepmind.google/models/gemini\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini</span></a><span style=\"vertical-align: baseline;\"> を統合することで、ファンが母国語で自然な言葉で質問できるようにしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">当社は、Google Cloud スタートアップ チーム、そして位置情報インテリジェンスに関する深い専門知識を持つ Google Cloud パートナー、</span><a href=\"https://www.searce.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Searce</span></a><span style=\"vertical-align: baseline;\"> と緊密に連携し、ホスト委員会のあらゆる部門と協力して、わずか 7 か月で NYNJ World Cup Concierge を構築しました。Searce は、Google Maps Platform の API の上にカスタム API ラッパーを開発することで、構築の速度や信頼性を損なうことなく、当社のエンジニアリング チームが、動的地図インフラストラクチャ上で直接 AI 機能を迅速にテストし、レイヤ化できるようにしました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"newrun-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/newrun-2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>NYNJ World Cup Concierge は、アクティビティへの道順など、ファンの質問に即座に対応する地図を提供します。（<a href=\"https://storage.googleapis.com/gweb-mobius-cdn/mapsplatform/uploads/205a0f3a8e683852467260016afcdc0f98f645d6.mp4\">動画</a>）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">3D Maps と Gemini で空間認識型のファン エクスペリエンスを構築</span></h3>\n<p><span style=\"vertical-align: baseline;\">NYNJ World Cup Concierge は、ファンの質問に即座に対応する地図を提供します。あるファンがファンゾーンに関する質問を入力もしくは話しかけると、Gemini がその意図を解読し、</span><a href=\"https://mapsplatform.google.com/maps-products/3d-maps/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">3D Maps API</span></a><span style=\"vertical-align: baseline;\"> によって没入型マップ上のその特定の場所に瞬時に切り替わります。これにより、ユーザーは目的のエリアをさらに探索したり、周辺スポットをタップしたり、周りに何があるかを追加で質問したりできるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">システムが推測したり、間違った指示を出したりすることがないように、このデジタル ブレインは、市から提供された検証済みの公式データのみに絞ってトレーニングされました。情報にギャップがあると、素晴らしいイベントであっても参加者をがっかりさせてしまいます。リオ、ダカール、ロンドンなどから訪れるファンは、たった 1 つ質問をするだけで、周辺情報や口コミ、そこへの行き方について、信頼性の高い回答を得られるようになります。</span><a href=\"https://mapsplatform.google.com/maps-products/agent-tools/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Grounding with Google Maps</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://developers.google.com/maps/documentation/places/web-service/overview?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Places API</span></a><span style=\"vertical-align: baseline;\"> を使用することで、1 か月にわたるトーナメント期間中に古くなってしまう静的なデータベースではなく、リアルタイムの正確な情報に基づいてすべての推奨事項を根拠づけました。</span></p>\n<p><span style=\"vertical-align: baseline;\">主催者にとって、都市の交通を維持することは最優先事項でした。スタジアムに直接車で向かうことは推奨されていなかったため、都市の交通が安全かつスムーズに流れるようにするためには、ファンを正しい公共交通機関に誘導することが不可欠でした。すべてのクエリに位置情報のコンテキストをフィードすることで、AI がファンの現在地を正確に把握し、関連性の高い回答を提供します。これにより、ファンは最寄りのシャトルや駅の場所をすぐに知ることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini の高度な言語機能を統合することで、言語の壁も取り払われます。スケジュールを直訳すると、実際の意味が伝わらず、ファンを混乱させることがよくあります。Gemini は、ファンの質問がアラビア語であろうと日本語であろうと、言い回しの背後にあるニュアンスと意図を理解し、60 以上の言語で適切な情報を提供します。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">ワールドカップは、土地勘のない約 100 万人もの訪問者を地域に呼び込みます。NYNJ World Cup Concierge を利用すれば、目的地への行き方を尋ねるだけで、その日の現地の状況を反映した回答をワンストップで得ることができます。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Bruce Revman 氏</strong><br />\n                \n                \n                  FIFA 2026 ニューヨーク / ニュージャージー ワールドカップ開催委員会、共同開催都市オフィサー\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">ストリートレベルの発見で地域経済に影響を与える</span></h3>\n<p><span style=\"vertical-align: baseline;\">Concierge は、大会の主要なデジタルガイドとしてウェブ上で提供されたほか、グランド セントラル駅のキオスク端末でも実際に活用されました。10 万人を超えるユニーク ユーザーに利用され、そのデータから、ファンが最も重視しているものが明確にわかりました。質問の 30% 以上は無料のファンイベントの検索に関するもので、交通機関に関する質問は 23% でした。これにより、明確なルート案内とアクセシビリティに重点を置くという当社の方針の妥当性が裏付けられました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"newrun-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/newrun-3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>ファンはチャット プロンプトを使用して、近くのレストランやコーヒー ショップなどの施設を見つけることができます。（<a href=\"https://storage.googleapis.com/gweb-mobius-cdn/mapsplatform/uploads/6178c9270c0f3f7564f839007da3cfce529f9742.mp4\">動画</a>）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">重要なのは、Concierge がファンを近隣のプログラムやイベントに積極的に誘導したことです。これにより、ファンは本来なら知ることがなかったイベントを発見できるようになり、大会の経済効果に大きく貢献しました。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">ワールドカップは、都市全体が世界に門戸を開いたときに何が起こるかを教えてくれました。Concierge はその精神を受け継ぎ、すべての訪問者がニューヨーク市を世界で唯一無二の場所にする周辺地域やプログラムを発見できるようサポートしています。誰かが街の知らなかった一角を発見するたびに、その歓迎は 5 つの行政区すべてに広がります。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Nancy Mammana 氏</strong><br />\n                \n                \n                  New York City Tourism + Conventions、最高マーケティング責任者\n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">NYNJ ワールドカップでは、検証済みの AI ガイドが大規模に機能することが証明されました。NYC Tourism + Conventions は現在、レストラン ウィークやブロードウェイ ウィーク、その他の主要イベントなど、市のプログラムのためにこのインフラストラクチャを年間を通じて稼働させています。</span></p>\n<p><span style=\"vertical-align: baseline;\">一方、Neurun では、このモデルを世界中の地方自治体や大規模イベントに導入しています。また、</span><a href=\"https://www.waze.com/wazeforcities/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Waze for Cities</span></a><span style=\"vertical-align: baseline;\"> と連携して、イベントによる通行止めを </span><a href=\"https://www.waze.com/waze\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Waze</span></a><span style=\"vertical-align: baseline;\"> と Google マップに直接反映し、ドライバーが正確な通行止め情報をリアルタイムで確認できるようにしています。Google Maps Platform、Gemini、Searce による継続的な戦略サポートのもと、当社は、大混雑の中でもファンが二度と道に迷うことのない、極めて優れたイベント インフラストラクチャを構築することができました。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Neurun、創業者 / CEO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Cade Netscher 氏</strong></p></div>"
