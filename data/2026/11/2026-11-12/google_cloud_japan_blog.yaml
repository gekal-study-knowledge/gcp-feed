    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 30 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/expanded-semantic-model-support-in-knowledge-catalog?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">たとえば、経営幹部によるビジネス レビューの前に、営業担当バイス プレジデントが AI アシスタントに「前四半期の主要企業アカウントの純収益は？」と尋ねたとします。エージェントは数秒で完成度の高いグラフを返します。残念ながら、グラフの数値が財務報告書と一致しません。その理由は、エージェントがキャンセルされた注文を収益としてカウントし、検証されていないステージング テーブルからデータを取得したためです。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントが失敗した原因は、モデルの性能でも、ユーザーの質問をクエリに変換できなかったことでもありません。失敗の理由は、エージェントがお客様のビジネスを理解していなかったからです。さらに言えば、そうしたビジネスの理解は通常、Looker、dbt、Snowflake、Databricks、SAP システムなどのセマンティック モデルという形で、すでに定義されています。しかし、定義がそれぞれのツール内に閉じ込められているため、エージェントは推測するしかなく、結果として誤った答えを出してしまうことがよくあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">そこで </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> の出番です。Knowledge Catalog は、これらすべてのツールのセマンティック モデルを 1 つのコンテキスト グラフに統合します。これにより、すべてのエージェントが同じ信頼できる定義に基づいて動作できるようになります。また、2 つのツールで同じ指標が異なる定義になっている場合でも、両方の定義がその出所とともに表示されるため、データ スチュワードはエンドユーザーに届く前にその不一致を解消できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、こうしたセマンティック モデルのサポート拡張の一般提供が開始されました。Knowledge Catalog は、Looker LookML、BigQuery Graph（BigQuery メジャーを含む）、dbt MetricFlow、Snowflake セマンティック ビュー、Databricks メトリック ビュー、SAP Core Schema Notation（CSN）からセマンティック モデルと指標定義をネイティブに取り込み、データを移動したりビジネス ロジックを新しい言語で書き直したりすることなく、スキーマ、リネージ、データ プロファイル、ビジネス用語集、その他の主要なメタデータと単一のコンテキスト グラフで接続します。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェントをこれらのモデルにグラウンディングすることで、アナリストが信頼する定義と同じビジネス定義が適用されるため、その回答はビジネスが信頼する数値と一致するようになります。実際、社内ベンチマークによると、Knowledge Catalog でエージェントをグラウンディングすると、精度が約 4 倍向上し、レイテンシが最大 33% 短縮され、トークン使用量が最大 75% 削減されることが実証されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">統合コンテキスト グラフを使用すると、次のことが可能になります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">すでに信頼しているセマンティック モデルの再利用:</strong><span style=\"vertical-align: baseline;\"> Knowledge Catalog は、</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/connect-knowledge-catalog#configure-knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">エージェント、BigQuery 会話型分析、カスタム エージェントを、データがどこにあっても、チームがすでに定義した指標、フィルタ、結合パスにグラウンディングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自己学習によるコンテキストで、手動定義の限界を超える: </strong><span style=\"vertical-align: baseline;\">Knowledge Catalog は、セマンティック モデルで明確に定義された指標と KPI の定義を、運用ハンドブック、会議メモ、チャット スレッド、コードなどの非構造化ナレッジソースから抽出した関連コンテキストと組み合わせます。Gemini を活用した</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">自己学習型のデータ拡充</span></a><span style=\"vertical-align: baseline;\">により、不足しているコンテキストや古いコンテキストを継続的に検出し、管理された再利用可能なコンテキスト セットに変換します。これにより、手作業によるキュレーションのみに頼ることなく、定義の変更に合わせてエージェントのコンテキストを常に最新の状態に保つことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ビジネス ロジックに企業レベルの信頼をプラス: </strong><span style=\"vertical-align: baseline;\">正しい数式であっても、古いデータや未認証のデータに対して実行すると、間違った回答が生成されてしまいます。そうした事態を防ぐために、Knowledge Catalog はセマンティック定義をデータ品質スコア、鮮度シグナル、リネージと紐づけることができます。これにより、エージェントは SQL を 1 行生成する前に、どのデータを信頼すべきかを判断できます。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1. Side-by-side comparison\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1._Side-by-side_comparison_z1p0n9c.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Knowledge Catalog を使用しない Gemini（左）と、Knowledge Catalog にグラウンディングされた Gemini（右）で同じ質問をした場合の比較。グラウンディングされたエージェント（右）では、Knowledge Catalog 未使用のエージェント（左）のようなハルシネーションを起こさず、トークン使用量とレイテンシを抑えて正確に回答できていることが分かります。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">データ資産全体にわたる 1 つのコンテキスト グラフ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Knowledge Catalog が生成するコンテキスト グラフは、データとセマンティック資産の全体像を示すマップです。テーブル、セマンティック モデル、用語集の定義、データ プロダクトがノードを構成し、リネージ、関連付け、スキーマキー、実際のクエリ履歴からマイニングされた結合、セマンティック モデル内で宣言された結合パスがエッジを構成します。取り込まれたセマンティクスは、同じグラフ上の既存のガバナンスや使用状況シグナルの隣に配置されるため、エージェントは 1 回の走査でビジネス コンセプトから信頼できる数式、検証済みの結合パスへと到達できます。各ソースは、ビジネスに対してそれぞれ独自の視点をもたらします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/looker/docs/looker-core-dataplex\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Looker LookML</strong></a><strong style=\"vertical-align: baseline;\">（一般提供）:</strong><span style=\"vertical-align: baseline;\"> Looker Core からのライブ同期を使用して、モデル、Explore、ビュー、ダッシュボードをインデックスに登録し、コンパイルされた指標 SQL、ファンアウト セーフな結合条件、必須フィルタ、ソーステーブルからエグゼクティブ ダッシュボードまでのリネージをキャプチャします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/metadata-overview#supported-sources\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</strong></a><strong style=\"vertical-align: baseline;\">（一般提供）:</strong><span style=\"vertical-align: baseline;\"> ネイティブ プロパティ グラフ定義、ノードテーブルとエッジテーブル、グラフ メジャー、ビジネスの類義語をインデックスに登録します。これによりエージェントは、エラーが発生しやすい複数テーブルの自己結合ではなく、Graph Query Language（GQL）の走査を使用して、接続されたエンティティを推論できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/dbt-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">dbt MetricFlow</strong></a><strong style=\"vertical-align: baseline;\">（一般提供）:</strong><span style=\"vertical-align: baseline;\"> ソース オブジェクトを dbt モデルと MetricFlow 指標にリンクします。dbt データ品質テストの結果、フィルタ、保存済みクエリ、更新頻度に関する SLA、ダウンストリームでの利用箇所もあわせてリンクされます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/snowflake-horizon-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Horizon Catalog を介した Snowflake セマンティック ビュー</strong></a><strong style=\"vertical-align: baseline;\">（一般提供）:</strong><span style=\"vertical-align: baseline;\"> 連携された BigQuery または Google Cloud Lakehouse テーブルを Snowflake Horizon メタデータと組み合わせ、セマンティック ビューのディメンション、ファクト、指標式、関係、類義語に加えて、データ メトリック関数の品質スコアカードと PII マスキングタグを取り込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/databricks-unity-transfer\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Unity Catalog を介した Databricks 指標ビュー</strong></a><strong style=\"vertical-align: baseline;\">（一般提供）:</strong><span style=\"vertical-align: baseline;\"> Unity Catalog から指標ビューの定義、メジャーの数式、スコープ フィルタ、結合カーディナリティを、テーブル認定バッジや Lakehouse Monitoring のプロファイリング結果とともに取り込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/manage-sap-bdc-metadata\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">SAP Business Data Cloud（BDC）を介した SAP Core Schema Notation（CSN）</strong></a><strong style=\"vertical-align: baseline;\">（一般提供）:</strong><span style=\"vertical-align: baseline;\"> SAP BDC データ プロダクトが Google Cloud Lakehouse を介して連携される際に、ビジネスラベル、ディメンションおよびキューブのモデリング パターン、デフォルトの集計、通貨と単位のバインディング、キー結合と複合結合の関連付け、データ機密性フラグをキャプチャします。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">すべてのソースが同じグラフ内のノードまたはエッジとして配置されるため、LookML の結合、dbt のエクスポージャー、Snowflake の関係、SAP の関連付けを並べて横断的に走査でき、それぞれが依存する物理テーブルまでリンクで結び付けられます。また、データが勝手に上書きされることもありません。重複する定義はそれぞれのソースが明記された状態で並べて表示されるため、データ スチュワードは全体像を正確に把握したうえで、単一の正しい定義へと統合できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2. Context Graphs_compressed\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2._Context_Graphs.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Knowledge Studio のコンテキスト グラフにおける、セマンティック モデル、結合パス、リネージの操作。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">コンテキストの探索と管理を担うコマンド センターである</span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Studio</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）を使えば、これらすべてを探索、統制できます。自然言語プロンプトでセマンティック定義を含むコンテキスト グラフを探索し、コンテキスト グラフ キャンバスを活用して接続パスをたどります。適切なアセットと定義を検証したら、それらを再利用可能な</span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/context-sets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コンテキスト セット</span></a><span style=\"vertical-align: baseline;\">にパッケージ化できます。このコンテキスト セットは、組織内の特定のユースケースやドメインにマッピングされ、Gemini やカスタム エージェントが本番環境で使用できるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">始める</strong></h4>\n<p><span style=\"vertical-align: baseline;\">純収益に関する質問に戻りましょう。Knowledge Catalog を導入すれば、営業担当バイス プレジデントのエージェントは、コンテキスト クエリを一回発行するだけで、信頼できるアセットを検出できます。その際、ドメイン エキスパートが定義した正確な指標式やフィルタを適用し、システム間の結合キーを維持しながら、基盤データが品質チェックに合格していることまで確認します。さらに、レポートの数値も正確です。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=IW5XI2_1ctI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Grounding agents in your trusted semantic models using Knowledge Catalog</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=IW5XI2_1ctI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">まずは </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Studio</span></a><span style=\"vertical-align: baseline;\"> でコンテキスト グラフについてご覧ください。さらに多くのソースに接続する方法については </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog のドキュメント</span></a><span style=\"vertical-align: baseline;\">でご確認いただけます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Maggy Hu</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Paulina Trzeciak</strong></p></div>"
