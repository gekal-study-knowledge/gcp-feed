  "50d648d7470e79803596f6283129c25e":
    "id": "50d648d7470e79803596f6283129c25e"
    "title": "ブランドがフィットする「場所」"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/the-geography-of-brand-fit/"
    "published": "2026-11-12 11:00:00"
    "fetched": "2026-11-12 14:51:18"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 2 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/the-geography-of-brand-fit/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">編集者注: 今回のブログ記事は、AKQA の時空間科学担当プリンシパルである Laurent Madeleni 氏によるものです。Laurent が、Places Insights と Population Dynamics Insights を活用した分析の概要を紹介します。この分析は、お客様が Google 検索、マップ、気象動向から得られたエンベディングを用いて、より高精度な予測モデルをトレーニングするのに役立ちます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ブランドによっては、意外な場所で成功を収めることがあります。今では、11 の主要ブランドの 85,000 の店舗を分析してブランド マーケット フィットを特定することで、その理由を正確に把握できるようになりました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">同じ評価でも顧客の反応は正反対</span></h3>\n<p><span style=\"vertical-align: baseline;\">同じチェーンの 2 つのカフェは、どちらも 4.3 の評価を得ています。地域の平均評価が 4.5 の街では、4.3 の評価は期待を下回ります。別の街では平均が 4.0 であるため、同じ評価でもそのカフェは周辺でトップクラスのカフェになります。</span></p>\n<p> </p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr style=\"background-color: #f1f3f4;\">\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">街 A - 地域のカフェの平均 4.5</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">街 B - 地域のカフェの平均 4.0</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4.3 ★ - 基準を下回る</span></p>\n<p><span style=\"vertical-align: baseline;\">顧客の期待が高く、この店舗はその期待を満たせていない。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">4.3 ★ - 基準を上回る</span></p>\n<p><span style=\"vertical-align: baseline;\">評価は同じ。この街では、普段期待されるレベルを上回っている。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h3> </h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"brand fit-1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/brand_fit-1.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">どの地域でも、コーヒー、ファストフード、ピザ、コンビニエンス ストアなどの業態ごとに、それぞれ独自の基準が自然と形成されています。そのため、「評価が最も高いのはどこか」ではなく、「どこで地域の人々の期待を上回っているか」という質問が有効です。この違いをブランド マーケット フィットと呼びます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">ブランド マーケット フィットを予測するために AKQA が調査した内容</span></h3>\n<p><span style=\"vertical-align: baseline;\">この調査は、Google Maps Platform の 2 つのインサイト プロダクトである Places Insights と Population Dynamics Insights を使用して実施されました。</span></p>\n<p><a href=\"https://mapsplatform.google.com/maps-products/geospatial-analytics/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places Insights</span></a><span style=\"vertical-align: baseline;\"> は、数百万もの米国企業のスポット数や評価の集計データを提供します。BigQuery 上で自社のビジネスデータと Google の包括的なプレイス データセットを安全に結合することで、カスタムの統計情報を導き出すことができます。このデータから、米国のすべての郵便番号ごとに、日常的に利用される 15 の</span><a href=\"https://developers.google.com/maps/documentation/placesinsights/place-types?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プレイスタイプ</span></a><span style=\"vertical-align: baseline;\">の平均評価を測定しました。その後、11 の主要ブランドの約 85,000 店舗をその地域の平均評価と比較しました。</span></p>\n<p><a href=\"https://mapsplatform.google.com/maps-products/geospatial-analytics/?utm_experiment=13103221&amp;product_exp_arm=13103221#population-dynamics-insights\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Population Dynamics Insights</span></a><span style=\"vertical-align: baseline;\"> は、もう 1 つのデータを提供します。検索トレンド、モビリティ、環境データを統合し、プライバシーの保護に配慮した豊富なエンベディングを生成します。このエンベディングを自社の成果データと結合することで、店舗業績の予測やデータギャップの解消に役立てることができます。これにより、「同じような行動パターンを持つ市場は、プレイスを同じように評価しているか」というシンプルな問いを国全体のスケールで投げかけることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">答えは「はい」です。私たちはこの問いをあえて厳しい条件で検証しました。ある州におけるブランド フィットを予測する際、モデルには他の州のデータのみから学習させるという手法をとったのです。このモデルは、11 のブランドすべてで同じ傾向を示しました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">評価に占める割合はわずかでも、店舗評価の明暗を分ける「場所」</span></h3>\n<p><span style=\"vertical-align: baseline;\">同じブランドが同じ地域で 2 つの店舗を運営している場合に、それらの店舗の評価が大きく異なるケースは珍しくありません。郵便番号が同じである 47,570 の同一ブランドの店舗を対象に測定し、それらのペアを比較すると、</span><span style=\"font-style: italic; vertical-align: baseline;\">評価を構成する重みの内訳が店舗j自身（79.6%）と場所（20.4%）であること</span><span style=\"vertical-align: baseline;\">が正確に示されます（20.4% は 星 5 つのうち 1 つ分に相当します）。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"brand fit-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/brand_fit-2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>ブランドの「場所」の評価を決定づける要素</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">「場所」に着目した分析手法では、評価の大部分を予測することは不可能です。そこにはシグナルがないからです。しかし重要なのは、場所が占める割合が存在するのは確かであり、測定可能で、ブランドごとに異なるということです。この割合は、今や予測できるものであり、私たちの手法は、そこに含まれるすべての要素の約 3 分の 2 をカバーしています。</span></p>\n<h3><span style=\"vertical-align: baseline;\">同じカテゴリの 2 つのブランドが異なる場所で成功を収めている例</span></h3>\n<p><span style=\"vertical-align: baseline;\">最も象徴的なのが、2 つのチキンチェーンの例です。同じ食品カテゴリに属しながらも、地理的な条件はほぼ正反対です。</span></p>\n<p><strong style=\"vertical-align: baseline;\">チキンチェーン A</strong></p>\n<p><span style=\"vertical-align: baseline;\">店舗が点在するアメリカの郊外や地方都市でその地域の平均を上回る評価を得ています。そこは、カフェやブランチ スポット、犬連れ OK のテラスではなく、ドライブスルーやガソリン スタンドが立ち並ぶような場所です。</span></p>\n<p><strong style=\"vertical-align: baseline;\">チキンチェーン B</strong></p>\n<p><span style=\"vertical-align: baseline;\">人口密度が高く、テイクアウト中心の地域で高い評価を得ています。そこはデリやコンビニが多く、駐車場よりも人通りが重視されるような場所です。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"brand fit-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/brand_fit-3.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>ブランド店舗の評価に影響を与える「場所」の属性</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">また、このデータは、ブランドの価値提案と優先事項について、現実を突きつけるものとなります。ある有名なコーヒー チェーンは、ソファがあり、ノート PC を持ち込んで長居できる都会の「サードプレイス」であることを謳っています。しかし、このコーヒー チェーンが期待を最も大きく上回っている場所は、様相がまったく異なります。そのような場所は「郊外」、「車で利用しやすい」、「グループや子連れ」、「事前注文」といった特徴を備えています。データでは、ブランドが目指す姿は考慮されません。まさにこれこそが、データの真価です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">ブランドの価値提案には「地理的条件」があります。今では、市場にリソースを投入する前に、その地理的条件を測定できるようになりました。</span></p>\n<h3><span style=\"vertical-align: baseline;\">検証と限界</span></h3>\n<p><span style=\"vertical-align: baseline;\">これらのブランドが 1,445 の新しい店舗（モデルが構築されたときには存在しなかった店舗）をオープンするのを、2 年半にわたって追跡調査してきました。好意的な反応を予測した場所では、新店舗は予想以上に好評であり、冷ややかな反応を予測した場所では、予想よりも厳しい結果となりました。このモデルは、調査対象となった 11 のブランドすべてに当てはまりました。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"brand fit-4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/brand_fit-4.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">同様に重要なのは、この分析によって明確になった「限界」です。</span></p>\n<ul>\n<li><span style=\"vertical-align: baseline;\">チェーンがどこに店舗をオープンするかは予測できません。それは不動産に関する決定であり、今回の検証でもその事実が裏付けられました。店舗がどのように受け入れられるかを予測するのであって、どこに店舗をオープンするかを予測するのではありません。</span></li>\n<li><span style=\"vertical-align: baseline;\">この分析は個人の好みについて示すものではなく、あくまで「場所」に関するものです。</span></li>\n<li><span style=\"vertical-align: baseline;\">原因を示すものでも、売上を測定するものでもありません。また、業績の悪い店舗を救うこともできません。80% の法則を念頭に置く必要があります。</span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">このモデルを他のブランドで活用する方法</span></h3>\n<p><span style=\"vertical-align: baseline;\">十分な数の店舗を持つブランドであれば、この手法で次の 3 つの実用的な問いに答えることができます。</span></p>\n<ul>\n<li><span style=\"vertical-align: baseline;\">自社の価値提案が、すでに期待以上の成果を出しているのはどこか？</span></li>\n<li><span style=\"vertical-align: baseline;\">（モデルの重みではなく）平易な言葉で表すと、これらの場所に共通する特徴は何か？</span></li>\n<li><span style=\"vertical-align: baseline;\">国内で、これらとよく似た場所は他にどこがあるか？</span></li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これは、新規出店地の選定、テスト都市の抽出、そして地域にフィットする顧客目線の価値提案の策定に活用できる、新たな判断材料となります。従来の問いは、「ターゲット ユーザーはどこにいるのか？」でした。この手法により、「</span><span style=\"font-style: italic; vertical-align: baseline;\">ブランドがどこにフィットするか？</span><span style=\"vertical-align: baseline;\">」という新たなレイヤが加わります。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">この手法は、Google Maps Platform の Places Insights（件数）と Population Dynamics Insights（人口エンベディング）を活用して開発されました。調査対象には、11 の QSR ブランド、約 85,000 店舗、米国における 33,791 エリアの郵便番号が含まれています。ここに示されたすべての結論は測定データに基づいており、その適用限界についても検証済みです。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- AKQA、時空間科学担当プリンシパル </span><strong style=\"font-style: italic; vertical-align: baseline;\">Laurent Madeleni 氏</strong></p></div>"
  "3f9448cbab594dc0370de5429977aab1":
    "id": "3f9448cbab594dc0370de5429977aab1"
    "title": "没入型地図、リアルタイムの混雑状況、レスポンシブな地図のスタイル設定が実現する、安心感のある場所選び"
    "link": "https://cloud.google.com/blog/ja/products/maps-platform/drive-confident-place-decisions-with-immersive-maps-live-crowd-signals-and-responsive-map-styling/"
    "published": "2026-11-12 10:10:00"
    "fetched": "2026-11-12 14:51:18"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 27 日に、Google Maps Platform blog に</span><a href=\"https://mapsplatform.google.com/resources/blog/drive-confident-place-decisions-with-immersive-maps-live-crowd-signals-and-responsive-map-styling/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">物理的な世界は動的かつ多次元的であり、絶えず変化しています。だからこそ、デジタル地図は単なるナビゲーション ツールから、現実世界をリアルタイムに反映する、コンテキストに応じたインターフェースへと進化を遂げています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、現実を画面に反映するエクスペリエンスを強化し、お客様が場所に関する意思決定をより正確に行えるように設計された、主要なプロダクト アップデートを発表いたします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/maps/documentation/maps-3d/android-sdk?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android</span></a><span style=\"vertical-align: baseline;\"> および</span><a href=\"https://developers.google.com/maps/documentation/maps-3d/ios-sdk?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">iOS</span></a><span style=\"vertical-align: baseline;\"> 向けの Maps 3D SDK（一般提供）: エンドツーエンドの没入型マッピング エクスペリエンスをモバイルアプリに直接組み込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/maps/documentation/places/ios-sdk/advanced-place-details-ui-kit?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iOS 向けの Places UI Kit Pro</span></a><span style=\"vertical-align: baseline;\">（一般提供）: 信頼性の高い Google のリアルタイムの混雑状況、混雑する時間帯、カスタム アクション ボタンをコンバージョン プロセスにネイティブに埋め込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/maps/documentation/android-sdk/cloud-customization/modes-and-types?hl=en#associate-mode-map-styles\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コンテキストに応じたスタイル設定</span></a><span style=\"vertical-align: baseline;\">（一般提供）: ページを再読み込みすることなく、環境トリガーに基づいて地図のテーマとランドマークの視認性をプログラムで調整します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/maps/documentation/javascript/cbms-release-notes?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud ベースのマップのスタイル設定</span></a><span style=\"vertical-align: baseline;\">（一般提供）: カスタム地図のデザインを自動化し、拡張します。コードベースの管理と AI アシスタンスを使用して、自然言語プロンプトとデザイン システムをすべての地図タイプでプロダクション レディな JSON テーマに直接変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://aistudio.google.com/apps/bundled/city-immersive-tour?utm_source=blog&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Studio の没入型エリアツアー</span></a><span style=\"vertical-align: baseline;\">: プロンプトを入力するだけで、独自の没入型マップ エクスペリエンスを簡単に構築できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらの最新機能を活用することで、見た目の違和感を減らし、現実世界に関する豊富なコンテキストを提供し、エクスペリエンス内で直接、購入意向の強いユーザーのエンゲージメントを維持することができます。</span></p>\n<h3><span style=\"vertical-align: baseline;\">モバイルアプリにネイティブに組み込む高精細で没入型の地図エクスペリエンス</span></h3>\n<p><span style=\"vertical-align: baseline;\">旅行先の下見、リアルタイムの配送ルートの追跡、高精細で写真のようにリアルな空間計画など、ユーザーは流れるような没入型の視覚的エクスペリエンスを求めています。Android と iOS 向けの Maps 3D SDK は、Google の</span><a href=\"https://mapsplatform.google.com/maps-products/3d-maps/?utm_source=blog&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">没入型マップ エクスペリエンス</span></a><span style=\"vertical-align: baseline;\">をモバイルにシームレスかつネイティブに組み込みます。最新のネイティブ デベロッパー ワークフロー向けに、Kotlin と SwiftUI に完全に対応する形でゼロから構築されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">この一般提供リリースでは、カスタム ビジュアリゼーション、多次元インタラクティビティ、滑らかなカメラ アニメーションを活用して、ネイティブ モバイルアプリをより魅力的に進化させ、ユーザーがまさに必要とする視点、詳細、コンテキストを提供できます。3D モデルとスタイル シーンを簡単に統合でき、Google の豊富な地図ラベルやスポットの詳細、構成可能な高度モード、ローカル検索での発見性を高めるカスタムの衝突判定マーカーを完備しています。Google の抽象ベースマップ、高忠実度 3D 画像、コンテキストに応じたスポットの詳細を組み合わせ、ウェブとネイティブ モバイルの両方に対応した 3D マップは、さまざまなユースケースやデバイスで拡張できる、包括的なネイティブ マッピング ソリューションを提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">大手不動産プラットフォームの Realtor.com は、ウェブとモバイルウェブのビューで 3D マップを活用して FlyAround を構築しました。Realtor.com によると、この視覚的なリアリズムにより、モバイルマップのエンゲージメントが</span><a href=\"https://mapsplatform.google.com/resources/blog/how-realtor-uses-immersive-3d-maps-to-build-confidence-in-the-home-buying-journey/?utm_experiment=13103222?utm_source=blog&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2 倍に増加</span></a><span style=\"vertical-align: baseline;\">しました。このケーススタディは、慎重な検討を要する意思決定において、空間コンテキストと臨場感あふれる世界の探索がユーザーの安心感をいかにして高めるかを示しています。</span></p>\n<p><a href=\"https://developers.google.com/maps/documentation/maps-3d/android-sdk?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://developers.google.com/maps/documentation/maps-3d/ios-sdk?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iOS</span></a><span style=\"vertical-align: baseline;\"> 向けの Maps 3D SDK を今すぐお試しください。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3D Maps on mobile-hero\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3D_Maps_on_mobile-hero.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Maps 3D SDK を使用すると、写真のようにリアルな 3D 画像、カスタム マーカーとポリライン、すぐに使えるアニメーションを iOS と Android のモバイルアプリにネイティブに組み込むことができます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">ユーザーを案内する、AI の演出による映画のようなバーチャル ツアー</span></h3>\n<p><span style=\"vertical-align: baseline;\">ユーザーは、リゾートや会場、商業用不動産を検討する際、バラバラの写真カルーセルを何度もクリックするのではなく、空間全体のつながりを直感的に把握したいと考えています。しかし、従来はカスタムの 3D フライトパスをゼロから構築するには、複雑な座標計算とカスタム アニメーション エンジンが必要でした。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google AI Studio の新しい没入型エリアツアー ソリューションは、このプロセスを簡素化し、プロトタイプの作成から映画のようなバーチャル ジャーニーの構築までをよりスムーズに開始できるようにします。</span></p>\n<p><span style=\"vertical-align: baseline;\">3D Maps と Places UI Kit を使用するこのアプレットは、場所データが統合されたインタラクティブな地図を備える AI 駆動型ウェブアプリのプロトタイプをスピーディに作成できます。直感的なチャット インターフェースを使用すれば、コードを直接書かなくてもベースとなるフレームワークを簡単にアレンジできます。これにより、映画のようなカスタム空間ツアーをわずか数分で構築して共有することができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google AI Studio に用意されているオープンソースの</span><a href=\"https://aistudio.google.com/apps/bundled/city-immersive-tour?utm_source=blog&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">没入型エリアツアー アプレット</span></a><span style=\"vertical-align: baseline;\">を使用して、バーチャル ツアーを構築しましょう。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"mpu-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/mpu-2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Google AI Studio に用意されているオープンソースの没入型エリアツアー アプレットを使用すると、手動で座標をスクリプト化することなく、複数のスポットを巡る、映画のような 3D バーチャル ツアーのプロトタイプをすばやく作成できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">即座の意思決定を支援する、リアルタイムの混雑状況シグナル</span></h3>\n<p><span style=\"vertical-align: baseline;\">住所を見れば特定の場所はわかりますが、到着したときの周辺状況までは把握できません。</span></p>\n<p><span style=\"vertical-align: baseline;\">iOS 向けの Places UI Kit では、混雑する時間帯とリアルタイムの混雑状況が Place Details に表示されるようになりました。ユーザーは、時間帯ごとの混雑状況、現在の混雑状況、一般的な待ち時間（利用可能な場合）を確認できます。混雑する時間帯とリアルタイムの混雑状況は、Places UI Kit Essentials と Pro の両方で利用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Places UI Kit Pro では、操作ボタンをカスタマイズすることもできます。ユーザーがアプリを離れることなく場所に関するアクションを実行できるように、デフォルトのボタンを削除したり、「今すぐ予約」や「順番待ちリストに加わる」などの独自のアクションを追加したりすることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの新機能を組み込むには、Place Details のコンテンツ構成に「popularTimes」を追加します。</span></p>\n<p><span style=\"vertical-align: baseline;\">リアルタイムの混雑状況シグナルを構築するには、</span><a href=\"https://developers.google.com/maps/documentation/places/ios-sdk/place-details-ui-kit?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iOS 向けの Places UI Kit</span></a><span style=\"vertical-align: baseline;\"> を今すぐお試しください。</span><a href=\"https://developers.google.com/maps/documentation/places/ios-sdk/places-ui-kit-overview?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Places UI Kit Pro ティア</span></a><span style=\"vertical-align: baseline;\">に用意されている高度なボタン設定もご確認いただけます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"mpu-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/mpu-3.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>iOS 向けの Places UI Kit は、Place Details、リアルタイムの混雑状況、混雑する時間帯をネイティブのコンバージョン フローに直接埋め込みます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">現実世界に合わせて動的に変化する地図</span></h3>\n<p><span style=\"vertical-align: baseline;\">周囲の環境が変化しても地図の表示がそのままでは、ユーザーが置かれている現実世界とはかけ離れているように感じられることがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud ベースのマップのスタイル設定に加わった「コンテキストに応じたスタイル設定」を使用すると、地図をよりレスポンシブで生き生きとしたキャンバスにすることができます。この新機能により、1 つのマップ ID でカラーパレットの調整、レイヤの表示 / 非表示の切り替え、特定のランドマークのハイライト表示をプログラムで実行できます。マップを再読み込みする必要はありません。コンテキストに応じたスタイル設定は、Google の主要なマップ機能でサポートされています。ロードマップ、衛星写真、ハイブリッド、地形、ナビゲーションといった各モード間でシームレスにデザインの統一感を保ち、ユーザーの周囲の環境と調和した一体感のあるマップ体験を提供します。</span></p>\n<p><a href=\"https://developers.google.com/maps/documentation/android-sdk/cloud-customization/modes-and-types?hl=en#associate-mode-map-styles?utm_source=blog&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コンテキストに応じたスタイル設定を今すぐお試しください。</span></a></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"mpu-4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/mpu-4.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>コンテキストに応じたスタイル設定では、ビューを更新しなくても 1 つのマップ ID で地図のカラーパレットをプログラムで更新し、ランドマークをハイライト表示します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">コードと AI による自動化で大規模に展開する独自の地図のスタイル設定</span></h3>\n<p><span style=\"vertical-align: baseline;\">多数の地域サブブランドやエンタープライズ アプリケーションにわたって独自の地図のスタイルを管理している組織にとって、UI コンソールでの手動による地図構成の更新は、リリース サイクルを長期化させ、人的ミスのリスクを高める原因となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud ベースのマップのスタイル設定がすべての地図の種類とモードに拡張されたことで、2D、3D、衛星写真、ハイブリッド、地形といった各ビューで 100 以上の地図上の対象物をカスタマイズできるようになりました。ライトモードとダークモードにも対応しています。コードベースの管理と AI を活用した設計を組み合わせることで、チームは自然言語のプロンプトとブランド ガイドラインをプロダクション レディな JSON スタイルに直接変換できます。</span></p>\n<p><a href=\"https://developers.google.com/maps/documentation/mapmanagement/overview?utm_source=blog&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Map Management API を使用した Cloud ベースのマップのスタイル設定</span></a><span style=\"vertical-align: baseline;\">で今すぐスタイル設定を始めましょう。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"mpu-5\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/mpu-5.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Cloud ベースのマップのスタイル設定と Map Management API により、2D、3D、衛星写真といった基本地図にわたって、自動化されたプログラマティックなスタイル設定ワークフローが実現します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">使ってみる</span></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"mpu-6\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/mpu-6.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Google の 3D マップは、コンテキストに応じた場所データにより、ユーザーが安心して意思決定を行うために必要な空間の奥行きとコンテキストを提供します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">デジタル地図は、初めてのマイホーム購入に向けた新たな周辺地域の探索、休暇の計画、外出前の待ち時間の確認など、顧客の意思決定を直接左右する没入型のエクスペリエンス レイヤへと進化しました。3D ビジュアリゼーション、リアルタイムの混雑状況、レスポンシブなスタイル設定を組み合わせれば、ユーザーが安心して探索、検討、行動するために必要なエクスペリエンスを提供できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの新機能をぜひお試しください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Maps 3D SDK（Android および iOS）: </strong><a href=\"https://developers.google.com/maps/documentation/maps-3d/android-sdk?utm_source=social&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://developers.google.com/maps/documentation/maps-3d/ios-sdk?utm_source=social&amp;utm_campaign=Q3_theme2&amp;hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iOS</span></a><span style=\"vertical-align: baseline;\">、ウェブ向けのデベロッパー ドキュメントを参照して、モバイルアプリに 3D 地図をネイティブに組み込むことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Places UI Kit Pro: </strong><span style=\"vertical-align: baseline;\">iOS 向けの</span><a href=\"https://developers.google.com/maps/documentation/places/ios-sdk/advanced-place-details-ui-kit?hl=en\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Places UI Kit Pro</span></a><span style=\"vertical-align: baseline;\"> を統合して、混雑する時間帯とリアルタイムの混雑状況シグナルを表示します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">没入型エリアツアー: </strong><a href=\"https://aistudio.google.com/apps/bundled/city-immersive-tour?utm_source=social&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Studio</span></a><span style=\"vertical-align: baseline;\"> のオープンソース テンプレートを活用して、独自のインタラクティブな地図デモのプロトタイプ作成とアレンジを開始できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デベロッパー コミュニティ: </strong><span style=\"vertical-align: baseline;\">Discord の </span><a href=\"https://discord.gg/googlemapsplatform?utm_source=social&amp;utm_campaign=Q3_theme2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Maps Platform デベロッパー コミュニティ</span></a><span style=\"vertical-align: baseline;\">で、作成したものを共有し、仲間とつながりましょう。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform 担当プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Haylee Conradi</strong><br /><span style=\"font-style: italic; vertical-align: baseline;\">- Google Maps Platform 担当プロダクト マーケティング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Heather Liu</strong></p></div>"
  "588b52215c4f30fb9276079b244b0d6a":
    "id": "588b52215c4f30fb9276079b244b0d6a"
    "title": "ＳＯＭＰＯシステムズ：基幹システムコードの保守をナレッジグラフと AI 開発で大幅に効率化"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/sompo-systems-streamlines-maintenance-through-knowledge-graphs-and-ai-development/"
    "published": "2026-11-12 10:00:00"
    "fetched": "2026-11-12 14:51:18"
    "summary": "<div class=\"block-paragraph\"><p>損保ジャパンの個人向け保険商品を扱う基幹システム SOMPO-MIRAI は、COBOL を中心とした旧来のアプリケーションを Java に刷新するプロジェクトとして 段階的にリリースを実施。開発と保守を担う ＳＯＭＰＯシステムズ株式会社（ＳＯＭＰＯ）は、この大規模なコードの保守に AI を取り入れようとしています。</p><p>Google Cloud のエンジニアと短期間で集中的に検証する <b>Tech Acceleration Program（TAP）</b>では、SOMPO-MIRAI のサブシステムの Java コードを <b>Spanner Graph</b> でグラフにし、データ項目の定義をまとめたデータ ディクショナリとも結びつけました。AI エージェントがこのグラフをたどることで、アプリ担当外の基盤エンジニアでも、問題が起きたときのアプリケーションへの影響調査を<b>、約 1 週間から 1 日以内に短縮できる見通しです。</b>あわせて、Claude Code などの AI を安全に使える開発環境を Gemini platform （旧 Vertex AI）と Cloud Workstations で整え、2026 年 10 月から全社への展開を始めています。</p><p>今回は、AI 活用推進室で開発への AI の適用を担う武井様、中原様、嶋﨑様に、取り組みの舞台裏をうかがいました。</p><h3><b>基幹システムの保守を支えてきた、有識者の知見と経験</b></h3><p>画面に入力した項目は、最終的にデータベースのどこに書き込まれるのか。この改修は、どのプログラムまで影響するのか。MIRAI の保守では、こうした問いに有識者の経験が答えてきました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"takei-sama\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/takei-sama.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>影響調査では、一例として、有識者が経験から検索語を選び、ソースコードの grep や設計書から影響範囲を絞り込みます。「勘所があるんですよね」と中原様。障害の当たりをつけるにも有識者の知見と経験が必要で、担当者が有識者に頼る場面は多いそうです。アプリの構造を知らない基盤チームには、コードを追うのも一苦労でした。</p><p>損保業務ならではの事情もあります。「損保業務のシステムは、情報システムの中でもいちばん難しいと言われるくらい、商品の複雑さをそのままシステムに引き継いでいます。どんな形で作っても、構造的に複雑になるんです」（武井様）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>大規模コードの保守に、ナレッジグラフを検討</b></h3><p>ＳＯＭＰＯシステムズは、早くから開発に AI を取り入れてきました。あるプロジェクトでは、Gemini 1.5 世代のモデルで Gemini Code Assist を実装と単体テストに使い、<b>工数を 20〜25% 減らしました</b>。武井様はこの成果をもとに、社内で AI の活用を訴えてきました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"nakahara-sama\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/nakahara-sama.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>次に目を向けたのが、SOMPO-MIRAI のような大規模なアプリケーションです。AI 駆動開発のトライアルでは、AI が質問のたびにコード全体を読みにいきました。これではトークンを無駄に使ってしまう、と中原様は話します。</p><p>「関連性をあらかじめ作っておいて、そこに検索をかけたほうが、トークンの量は少なくて済む。大規模なアプリケーションだとそういう構造がないとどんどんお金がかかってしまうので、グラフ化が必要なんじゃないかと考えていました」</p><p>影響分析の PoC でも、AI の精度には伸びしろがありました。嶋﨑様は、ナレッジグラフと連携させれば影響範囲をすぐに把握でき、品質も上がると期待していました。</p><p>「単純な RAG やモデルの追加学習（ファインチューニング）だと、正確な依存関係をハルシネーションなく捉えることはできません。確実な『事実』としての関係性を Spanner Graph で構造化しておき、それを AI に探索させるアプローチだからこそ、大規模なシステムにおいても影響調査に耐えうる精度にできると考えています。」</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>Spanner Graph で、コードとデータ ディクショナリを 1 つのグラフに</b></h3><p>TAP では、SOMPO-MIRAI のあるサブシステムを題材に検討しました。最初のステップで、このサブシステムの Java コードの依存関係を Spanner Graph のグラフにしました。</p><p>コードのグラフがあまりに簡単にできたので、、さらに欲が出てきました。基幹システムでは、データベースの項目の定義をデータ ディクショナリで管理しています。このコードがどのテーブルにアクセスし、そのテーブルの物理項目はディクショナリのどれに当たり、論理モデルでは何と呼ぶのか。そこまでをグラフ上でつなげました。</p><p>「2 日間でどこまでできるのかなと思っていましたが、Google Cloud 側で用意していただいた Java の解析ツールを、Claude Code でカスタマイズしながらグラフ化したので、あっという間にできました。すごく感動しました」（中原様）</p><p>グラフを置く先に Google Cloud を選んだ理由を、嶋﨑様はこう話します。「まず、Spanner はメンテナンス フリーで、バージョンアップを考えなくていいのが大きいです。AI エージェントを動かす基盤も Cloud Run のほかに選択肢がありますし、Cloud Workstations や Gemini platform もすでに使っているので、シームレスにつながります。TAP で Cloud Run や Spanner を実環境で動かせることも確かめられたので、あとはガバナンスを整えて広げれば展開できる状態になりました」</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"01-spanner\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/01-spanner.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>1 週間かかっていた影響調査が 1 日に</b></h3><p>TAP の検証では、これまでアプリ担当外の基盤エンジニアの場合、問題事象におけるアプリケーション影響調査に約 1 週間（40 時間）かかっていたが、これを <b>1 日以内（4〜8 時間）に縮められる見通し</b>が立ちました。参加したエンジニアのアンケートにも、調査に 1 週間程度かかっていたものが 1 日程度になると感じた、という声が寄せられています。</p><p>中原様の印象に残ったのは、基盤チームの反応でした。TAP には基盤のメンバーも参加しました。過去にアプリの調査を頼まれた内容を自然言語でグラフに問いかけてみたところ、すぐに答えが返ってきたといいます。「そこは今回、感動していましたね」</p><p>商品の複雑さは、損害保険のシステムである以上、なくなることはありません。武井様は、その中でも影響範囲を確実にたどれるようにすることが、ナレッジグラフの役割だと話します。</p><p>一方で、課題も見えています。ソースコードは日々変わるので、変更の差分をグラフに取り込む仕組みが必要です。今は取り込みにも時間がかかります。設計書などのドキュメントとソースのどれが対応しているのか、その整合をどう取るかもこれからの検討事項です。中原様は、グラフを使った SRE 的な運用にも取り組みたいと話していました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"02-tap\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/02-tap.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>AI を安全に使える開発環境を標準化し、全社に配布</b></h3><p>SOMPOシステムズでは、TAP などの検証に関わる 環境準備から日々の開発まで、AI を使う場所になっているのが Cloud Workstations です。導入のきっかけは、SOMPO-MIRAI とは別のプロジェクトにありました。社内でクラウド開発を進めようとしたとき、決まった開発環境がなかったのです。案件ごとに Google Cloud 上に仮想マシンを立て、開発者が Windows にリモート ログインして開発していたため、そのたびに大きな費用と準備の期間がかかっていました。</p><p>「そこを解消したくて、社内の共通開発環境を作ることになり、Cloud Workstations を選びました」と嶋﨑様。費用と開発のリードタイムの両方で効果を数字で示して社内の理解を得ることができ、Google Cloud のイベントでも事例として登壇しています。</p><p>金融機関のシステムには、厳しいセキュリティ基準があります。ＳＯＭＰＯシステムズは、Cloud Workstations と Google Cloud の IAM や認証の仕組み、VPC Service Controls などで基準を満たせることを確かめ、社内の承認を得ました。AI の利用も同じ考え方です。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"shimazaki-sama\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/shimazaki-sama.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「AI 提供元の API に直接接続する場合、高度なセキュリティガバナンスを担保するための手続きや検証に、一定のリードタイムが必要となります。Google Cloud の中に閉じて、これまでのセキュリティ・ガバナンスを適用した状態でGemini platform で LLM のエンドポイントを使えるので、AI の利用と開発環境の共通化を一緒に進められる。ガバナンスも効かせられるので、社内のセキュリティ基準でも GO が出ました」（嶋﨑様）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p>Claude のモデルにも Gemini platform 経由でアクセスしており、Gemini などほかのモデルも同じ環境から選べます。中原様も「Google Cloud では、いろいろな LLM を選べるので、すごく助かっています」と話します。</p><p>この AI 開発環境の全社への展開は、2026 年 10 月に正式な組織として立ち上がった AI 活用推進室が担っています。トップダウンで開発・保守・日頃の業務すべてに AI を使い、働き方を変えていくことを表明していることも追い風です。推進室は AI for Strategy、AI for Dev、AI for Knowledge、AI for Biz の 4 チームで構成され、武井様、中原様、嶋﨑様の 3 名は AI for Dev を担当しています。</p><p>2025 年度までのトライアルで効果を確かめたあと、Cloud Workstations の対象をクラウド開発から、SOMPO-MIRAI の Java、COBOL、VB、.NET の開発者にまで広げました。2026 年 9 月中旬に全社向けの説明会を開き、10 月から申請に応じてアカウントを払い出しています。希望するチームには 6 月から先行して使ってもらっており、すでに <b>40 チームで約 330 台</b>が動いています。目標は、社員全員とパートナーです。</p><p>利用者からは、ハーネスはどう作ればいいのか、自分たちのリポジトリにつなげられないか、といった問い合わせが届いています。SOMPO-MIRAI のソースリポジトリとは別に、VB のチームは別の場所にリポジトリを持つなど、つなぎ先はまだ一部に限られています。長く Eclipse を使ってきた Java の開発者には、VS Code の画面に慣れてもらう必要もあります。嶋﨑様のチームは、サンプル アプリを含むゴールデンパスを用意し、使い方の説明会を重ねています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"03-workstations\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/03-workstations.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h3><b>実例を示して、仲間を増やす</b></h3><p>武井様は、AI の技術が週ごとに進歩していると感じています。「AI 駆動開発をやりたいと始めたときよりも、明らかに速いスピードで発展しています。先は読めません。ただ、我々はビジネスに貢献するために、タイム トゥ マーケットを縮めたうえで、今まで諦めていたこともできるし、品質を上げることもできるようになってきています。今回作っている環境も含めて早く全社に展開して、次に出てくる壁を早く越えていきたいと考えています」</p><p>変化に追いつく鍵として、武井様は社内のアーリー アダプターを挙げます。業務の外でも自分で手を動かして新しい技術を追う人が、社内にいます。そうしたキーマンの声を集める仕組みを会社として用意すれば、AI 活用推進室が施策にして回せる、という考えです。</p><p>中原様が次に見据えるのは、開発のルールそのものです。基幹システムには、設計のルールを定めた開発標準やガイドラインが積み重なり、分厚い文書になっています。「そこを圧縮して AI が読める形にして、人間が気にしなくても AI が気にしてアプリケーションに落とし込んでくれる。そういう知識基盤をしっかり整えていきたいです」</p><p>嶋﨑様は、Cloud Workstations とナレッジグラフを起点に、プラットフォーム エンジニアリングを進めます。AI 駆動開発の流れをゴールデンパスとして形にし全社への展開を目指します。　それに向けて部署ごとの勉強会も企画しています。「新しいツールや LLM が次々に出てくるので、その複雑さや違いを吸収する層になって、エンジニアが気軽に使える形にしたいです」</p><p>損害保険特有の難しさを持つ基幹システムを、有識者の知見と経験だけに頼らずに保守する。ＳＯＭＰＯシステムズはその土台として、コードの関係性をグラフに残し、AI を使える開発環境を全社に配布するなど、取り組みを促進していきます。</p><p>ＳＯＭＰＯシステムズ株式会社<br />損保システム第一本部 副本部長<br />兼務　ＡＩ活用推進室、アプリ統括部<br />武井 信之 様</p><p>ＳＯＭＰＯシステムズ株式会社<br />基盤統括部 グランドデザイングループ　グループリーダー<br />兼務　ＡＩ活用推進室、アプリ統括部 ＩＴアーキ戦略グループ、アーキテクト本部 アプリケーションプラットフォームグループ<br />中原 史喬 様</p><p>ＳＯＭＰＯシステムズ株式会社<br />損保システム第一本部 デジタルソリューショングループ　シニアシステムエンジニア<br />兼務　ＡＩ活用推進室、アプリ統括部 ＩＴアーキ戦略グループ<br />嶋﨑 翔太 様</p></div>"
