"overview": |
  この日は Google Cloud ブログ 3 本 (うち 2 本は AI & ML ブログにも掲載されたため掲載数は 5) で、非構造化データの活用とクラスタの移行が話題でした。Cloud Storage に object enrichments が加わり (プレビュー)、AI モデルがオブジェクトから文脈的なメタデータを自動で抽出して object context としてその場に保存するようになりました。企業の情報の大半は画像・PDF・動画・音声としてオブジェクトストレージに眠っており、エージェントから見れば推論できないただのバイト列ですが、この機能で Google フォトなど Google 社内のサービスが使っている AI モデルを利用でき、物体検出や画像ラベリングといった画像アノテーションを他社クラウドの同種サービスと比べて 75% 安く提供します。精度の高い PDF 分類モデルも含まれ、ロレアルは膨大な創作アセットのラベル付けが 100 倍速くなったとコメントしています。GKE では、Dataplane V1 から Dataplane V2 への in-place 移行がプレビューになりました。これまでは並行クラスタを立てる中断を伴う手順が必要で、ステートフルなワークロードや確定した IP 割り当てを抱える本番クラスタの移行が難しかったところ、条件を満たす VPC ネイティブのクラスタならそのまま移行できます。Dataplane V2 は eBPF とオープンソースの Cilium を使って iptables のルーティングと kube-proxy を置き換えるもので、パケット処理を Linux カーネル内の eBPF マップで行うため、ネットワークポリシーを有効にしたまま 15,000 ノード (無効なら 65,000 ノード、ただしクラスタの再作成が必要) まで対応し、Pod の入れ替わりが激しいエージェント系のワークロードや、GPU・Cloud TPU クラスタの土台としても使われます。そのほか、パートナー向けに Gemini を使った共同マーケティング機能が発表され、ブランドに沿った共同アセットを数分で作れるようになりました。
