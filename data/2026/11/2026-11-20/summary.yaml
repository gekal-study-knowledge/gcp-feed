"overview": |
  この日は Google Cloud ブログ 4 本 (うち 3 本は AI & ML ブログにも掲載されたため掲載数は 7)、日本語ブログ 4 本、リリースノート 1 件の計 9 本 (重複を含む掲載数は 12) で、非構造化データの活用と GKE のクラスタ・TPU 運用が話題でした。後から追加されたリリースノートでは、セキュリティ情報 GCP-2026-082 に対応して Java 17 以降のランタイムが 17.0.21.1+2、21.0.13.1+2、25.0.5.1+2 に更新され、App Engine フレキシブル環境と Buildpacks では再ビルド・再デプロイが必要、App Engine スタンダード環境と自動ベースイメージ更新を有効にした Cloud Run・Cloud Run functions では自動で適用され (ウォームインスタンスは再デプロイで即時反映)、カスタムコンテナや Cloud Run のジョブ・ワーカープール、自動更新なしのデプロイは再ビルド・再デプロイが必要で、いずれも一時的に入れた JDK_JAVA_OPTIONS の緩和フラグを外すよう案内されています。Cloud Storage に object enrichments が加わり (プレビュー)、AI モデルがオブジェクトから文脈的なメタデータを自動で抽出して object context としてその場に保存するようになりました。企業の情報の大半は画像・PDF・動画・音声としてオブジェクトストレージに眠っており、エージェントから見れば推論できないただのバイト列ですが、この機能で Google フォトなど Google 社内のサービスが使っている AI モデルを利用でき、物体検出や画像ラベリングといった画像アノテーションを他社クラウドの同種サービスと比べて 75% 安く提供します。精度の高い PDF 分類モデルも含まれ、ロレアルは膨大な創作アセットのラベル付けが 100 倍速くなったとコメントしています。GKE では、Dataplane V1 から Dataplane V2 への in-place 移行がプレビューになりました。これまでは並行クラスタを立てる中断を伴う手順が必要で、ステートフルなワークロードや確定した IP 割り当てを抱える本番クラスタの移行が難しかったところ、条件を満たす VPC ネイティブのクラスタならそのまま移行できます。Dataplane V2 は eBPF とオープンソースの Cilium を使って iptables のルーティングと kube-proxy を置き換えるもので、パケット処理を Linux カーネル内の eBPF マップで行うため、ネットワークポリシーを有効にしたまま 15,000 ノード (無効なら 65,000 ノード、ただしクラスタの再作成が必要) まで対応し、Pod の入れ替わりが激しいエージェント系のワークロードや、GPU・Cloud TPU クラスタの土台としても使われます。そのほか、パートナー向けに Gemini を使った共同マーケティング機能が発表され、ブランドに沿った共同アセットを数分で作れるようになりました。後から追加された Google Cloud ブログの The Blueprint では、ロンドンのスタートアップ Kult が、プレイ中のゲームと進行状況を理解して音声とセカンドスクリーンで答えるゲームコンパニオンを、レイテンシ・精度・コストの 3 点を軸に構築した事例が紹介されました (汎用モデルは学習のカットオフで特定のゲームについて古く誤りがちという課題)。日本語ブログ (米国時間 11 月 7〜18 日の記事の抄訳) では、GKE の動的スライスの一般提供が紹介され、論理 TPU スライスの構成を物理ノードプールから切り離し、TPU の光回路スイッチ (OCS) で TPU キューブ (16 台の VM から成るノードプール) を結合したり分割したりすることで、スライスごとの静的ノードプールに比べて AI ワークロードの起動を最大 5 倍、復旧を 4.5 倍速くできます。あわせて、BigQuery DataFrames (BigFrames) の新しい .bigquery アクセサーで pandas の DataFrame から BigQuery の AI 関数を直接呼び出して予測や分類、エンベディング生成を行う方法、AI リーダーシップ部門を 2026 年に新設した Google Cloud Partner All-stars の受賞者の表彰、前日に報告された ARMORY CASTLE (旧 UNC5221) による vCenter の CVE-2026-123890 悪用 (BONESAW による認証バイパスと SSO 管理者の作成、Broadcom のパッチの即時適用を推奨) の日本語版が公開されました。
