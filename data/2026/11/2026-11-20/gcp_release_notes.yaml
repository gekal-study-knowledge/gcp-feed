    "fetched": "2026-11-21 03:58:05"
    "summary": "<h2 class=\"release-note-product-title\">App Engine flexible environment Java</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/flexible/lifecycle/support-schedule#java\">Java 17 and later</a>: <code>17.0.21.1+2</code>, <code>21.0.13.1+2</code>, <code>25.0.5.1+2</code></li>\n</ul>\n<p>Take immediate action by rebuilding and redeploying your applications to pick up\nthe patched Java runtime, and then remove any temporary <code>JDK_JAVA_OPTIONS</code>\nmitigation flags.</p>\n<p>For more information, see security bulletin\n<a href=\"https://docs.cloud.google.com/support/bulletins#gcp-2026-082\">GCP-2026-082</a>.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Java</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/appengine/docs/standard/lifecycle/support-schedule#java\">Java 17 and later</a>: <code>17.0.21.1+2</code>, <code>21.0.13.1+2</code>, <code>25.0.5.1+2</code></li>\n</ul>\n<p>Applications receive the patched runtime automatically with no action required.</p>\n<p>To refresh warm instances immediately, redeploy your application.</p>\n<p>If you added a temporary <code>JDK_JAVA_OPTIONS</code> mitigation flag in <code>app.yaml</code> or\n<code>appengine-web.xml</code>, remove it and redeploy.</p>\n<p>For more information, see security bulletin\n<a href=\"https://docs.cloud.google.com/support/bulletins#gcp-2026-082\">GCP-2026-082</a>.</p>\n<h2 class=\"release-note-product-title\">Buildpacks</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/docs/buildpacks/runtime-support#java\">Java 17 and later</a>: <code>17.0.21.1+2</code>, <code>21.0.13.1+2</code>, <code>25.0.5.1+2</code></li>\n</ul>\n<p>Take immediate action by rebuilding and redeploying your applications to pick up\nthe patched Java runtime, and then remove any temporary <code>JDK_JAVA_OPTIONS</code>\nmitigation flags.</p>\n<p>For more information, see security bulletin\n<a href=\"https://docs.cloud.google.com/support/bulletins#gcp-2026-082\">GCP-2026-082</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Run</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/run/docs/runtime-support#java\">Java 17 and later</a>: <code>17.0.21.1+2</code>, <code>21.0.13.1+2</code>, <code>25.0.5.1+2</code></li>\n</ul>\n<p>Workloads with automatic base image updates enabled receive the patched runtime\nautomatically with no action required. To refresh warm instances immediately,\nredeploy your workload.</p>\n<p>For custom containers, Cloud Run jobs and worker pools, and deployments without\nautomatic base image updates, rebuild and redeploy your workloads with a patched\nJDK or base image, and then remove any temporary <code>JDK_JAVA_OPTIONS</code> mitigation\nflags.</p>\n<p>For more information, see security bulletin\n<a href=\"https://docs.cloud.google.com/support/bulletins#gcp-2026-082\">GCP-2026-082</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Run functions</h2>\n<h3>Security</h3>\n<p>The following runtime language contains important security updates:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/functions/docs/runtime-support#java\">Java 17 and later</a>: <code>17.0.21.1+2</code>, <code>21.0.13.1+2</code>, <code>25.0.5.1+2</code></li>\n</ul>\n<p>Functions with automatic base image updates enabled receive the patched runtime\nautomatically with no action required. To refresh warm instances immediately,\nredeploy your function.</p>\n<p>For functions without automatic base image updates, redeploy your functions to\npick up the patched runtime, and then remove any temporary <code>JDK_JAVA_OPTIONS</code>\nmitigation flags.</p>\n<p>For more information, see security bulletin\n<a href=\"https://docs.cloud.google.com/support/bulletins#gcp-2026-082\">GCP-2026-082</a>.</p>"
