  "97059a9939ddeb824d0bbc149e2b52c8":
    "id": "97059a9939ddeb824d0bbc149e2b52c8"
    "title": "Introducing object enrichments: Transform unstructured data into agent-ready context"
    "link": "https://cloud.google.com/blog/products/storage-data-transfer/cost-effective-ai-context-extraction-from-unstructured-gcs-data/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 06:12:32"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The vast majority of enterprise information is unstructured, locked away in object storage as petabytes of images, PDFs, videos, and audio files. This data holds the institutional knowledge AI agents need to do business-critical work. But to an agent, a raw object is just bytes it can't reason over. As enterprises start to deploy agents in production, the focus has shifted toward transforming these raw objects into rich, agent-ready context.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are introducing </span><a href=\"https://docs.cloud.google.com/storage/docs/object-enrichments/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">object enrichments</span></a><span style=\"vertical-align: baseline;\">, a new Google Cloud Storage capability that uses AI models to automatically extract rich contextual metadata from Cloud Storage objects and saves it in-place as </span><a href=\"https://docs.cloud.google.com/storage/docs/object-contexts?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">object context</span></a><span style=\"vertical-align: baseline;\">, enabling agents to acquire the information needed to make complex business decisions. Object enrichments gives customers access to the AI models used by internal Google services such as Google Photos, offering image annotations like object detection and image labeling at </span><strong style=\"vertical-align: baseline;\">75% cost savings when compared to similar services from other cloud providers</strong><span style=\"vertical-align: baseline;\">. Available in preview, this fully managed service also includes high-quality PDF classification model, enabling customers to seamlessly turn their object store into an intelligent, AI-ready foundation.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"object_enrichments_blog_1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/object_enrichments_blog_1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">“L'Oreal is the 4th largest advertiser in the world, and managing media assets at that scale is complex. </span><strong style=\"font-style: italic; vertical-align: baseline;\">Cloud Storage object enrichments’s high quality and cost-effective annotations</strong><span style=\"font-style: italic; vertical-align: baseline;\"> enable us to discover, understand, and govern our content at scale, accelerating marketing and advertising operations while remaining compliant in all markets. Object enrichments enables L'Oreal to </span><strong style=\"font-style: italic; vertical-align: baseline;\">label its extensive creative asset repository 100x faster at a fraction of the cost of existing pipelines and processes.</strong><span style=\"font-style: italic; vertical-align: baseline;\">” </span><span style=\"vertical-align: baseline;\">– Antoine Castex, Principal Data &amp; AI Architect, L’Oreal</span></p>\n<h3><span style=\"vertical-align: baseline;\">Agents need context, not raw bytes</span></h3>\n<p><span style=\"vertical-align: baseline;\">To operate efficiently, agents need grounded knowledge; however, reading every raw file at scale is cost- and performance-prohibitive. For example, if an operations agent needs to pinpoint a specific event—such as a doorstep package delivery or a roadway hazard—streaming thousands of smart-camera or vehicle frames into the AI model on every user prompt would burn through expensive tokens and add minutes of delay. To bridge this gap, teams must pre-process raw data and extract rich, contextual metadata, which agents can then leverage at runtime. Historically, achieving this meant dealing with three challenges:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cost:</strong><span style=\"vertical-align: baseline;\"> Running models over millions to billions of objects is expensive, pushing organizations to compromise and process only a fraction of their data, creating blind spots that lessen agents’ accuracy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Operational toil:</strong><span style=\"vertical-align: baseline;\"> A self-managed pipeline means stitching together multiple services — from event triggers and queues to custom infrastructure built on Cloud Run or Google Kubernetes Engine (GKE) — along with scalable retry/error logic and job scheduling. Once deployed, that infrastructure still requires continuous upgrades and capacity management. Teams sometimes spend months on this plumbing rather than focusing on building agents that solve actual business problems. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fragmented metadata: </strong><span style=\"vertical-align: baseline;\">Extracted metadata often lands in a separate data store, decoupling context from the bytes it describes. Teams must pay for and maintain a second storage system, govern access policies across disconnected permission models, and run custom cleanup jobs to keep metadata in sync when source objects are copied, moved, or deleted.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">This is why we built object enrichments: to natively provide agent-ready context for your unstructured data, equipping your agents with complete, grounded knowledge without prohibitive costs, custom pipeline plumbing, or fragmented metadata.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key benefits of object enrichments</strong></h3>\n<p><strong style=\"vertical-align: baseline;\">1. Reduce costs with Google models<br /></strong><span style=\"vertical-align: baseline;\">Object enrichments offers dramatic savings at scale: </span><strong style=\"vertical-align: baseline;\">enriching 10 million images or PDFs costs just $700 </strong><span style=\"vertical-align: baseline;\">(according to published pricing). You can use Google’s high-quality AI models for image annotations—including object detection, face detection, image labeling, and explicit content detection—at one of the industry’s best price points. In addition, the PDF classification model lets you categorize documents into standard business and industry categories like Finance, Games, News, and Health.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Even with a highly accurate baseline, Hyperscience leveraged </span><strong style=\"font-style: italic; vertical-align: baseline;\">object enrichments to drive a 50%+ lift in document classification accuracy,</strong><span style=\"font-style: italic; vertical-align: baseline;\"> while simultaneously </span><strong style=\"font-style: italic; vertical-align: baseline;\">reducing classification inference costs by 2-3x.</strong><span style=\"vertical-align: baseline;\">” </span><strong style=\"vertical-align: baseline;\">– Mayur Pillay, VP Partnerships, Hyperscience</strong></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Object_Enrichments_2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Object_Enrichments_2.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">2. Generate richer context with Gemini<br /></strong><span style=\"vertical-align: baseline;\">For complex multimodal reasoning across text, PDFs, images, audio, and video, you can leverage Gemini natively with object enrichments, unlocking advanced use cases such as summarization, entity extraction, transcription, and translation. Please reach out to us at </span><span style=\"vertical-align: baseline;\">storage-ai@google.com</span><span style=\"vertical-align: baseline;\"> to learn more and request access to this upcoming functionality.</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. No pipeline, low toil setup<br /></strong><span style=\"vertical-align: baseline;\">Skip the brittle, multi-component DIY pipelines. Setting up an enrichment job just takes three simple steps, with no code required in the Google Cloud console, or programmatically via the Cloud Storage API, following these steps:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Define your scope:</strong><span style=\"vertical-align: baseline;\"> Provide a set of buckets containing the objects to process and specify the processing location. Object enrichments can scale to millions or billions of objects.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Choose your models:</strong><span style=\"vertical-align: baseline;\"> Pick one or more of the five first-party Cloud Storage models for images and PDFs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Grant permissions:</strong><span style=\"vertical-align: baseline;\"> Grant the necessary IAM permissions to the object enrichments service to access your Cloud Storage buckets.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Object enrichments handles the rest: It orchestrates model inference, parses the responses, and writes the results to each object's object context, with built-in retries and throttling. There are no queues to manage, workers to scale, or glue code to maintain.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Cloud Storage object enrichments and BigQuery,</span><strong style=\"font-style: italic; vertical-align: baseline;\"> slashes AI development from 6 months to 1 month</strong><span style=\"font-style: italic; vertical-align: baseline;\"> while rapidly improving our models.\"</span><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">- Brandon Bunker, VP of Product AI, Vivint</strong></p>\n<p><strong style=\"vertical-align: baseline;\">4. Context lives where the bytes live<br /></strong><span style=\"vertical-align: baseline;\">Instead of parking metadata in a separate data store, object enrichments writes model outputs directly to </span><a href=\"https://docs.cloud.google.com/storage/docs/object-contexts?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">object context</span></a><span style=\"vertical-align: baseline;\">, a specialized Cloud Storage metadata construct that’s purpose-built for storing contextual information as structured key-value pairs alongside the object itself. Because context is stored alongside object’s actual bytes, you get enterprise-grade data management out of the box, with:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Storage durability and simplified lifecycle management:</strong><span style=\"vertical-align: baseline;\"> Object context shares the same durability and consistency properties as the underlying Cloud Storage object. It travels automatically with the object during copy, move, and replication operations and is automatically removed when the object is deleted — no more cleanup jobs!</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fine-grained IAM governance: </strong><span style=\"vertical-align: baseline;\">Using IAM, administrators can control who can read, add, update, or remove object context.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fast object filtering and serving: </strong><span style=\"vertical-align: baseline;\">Applications can filter object listings directly by object context key-value pairs or read context metadata alongside objects, in order to serve richer experiences.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Turnkey multimodal analytics in BigQuery</strong><span style=\"vertical-align: baseline;\">: You can easily configure your object context to natively flow into </span><a href=\"https://cloud.google.com/bigquery?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> via </span><a href=\"https://docs.cloud.google.com/storage/docs/insights/datasets?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage Insights datasets</span></a><span style=\"vertical-align: baseline;\">, allowing data teams to run SQL analytics, build dashboards, and join unstructured file insights with structured enterprise tables, without writing a single line of ETL code.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">What customers are building</span></h3>\n<p><span style=\"vertical-align: baseline;\">Early customers are already putting object enrichments to work across key business scenarios:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Creative asset search and media archives:</strong><span style=\"vertical-align: baseline;\"> Marketing, retail, and media organizations manage petabytes of creative image assets, where finding a specific asset, e.g., </span><span style=\"font-style: italic; vertical-align: baseline;\">\"a red car driving at sunset\"</span><span style=\"vertical-align: baseline;\"> or </span><span style=\"font-style: italic; vertical-align: baseline;\">\"a vintage convertible in the desert during golden hour\",</span><span style=\"vertical-align: baseline;\"> requires rich semantic metadata. Object enrichments automatically generates descriptive labels in object context, which can then be indexed into a vector database or BigQuery to power accurate retrieval-augmented generation (RAG) applications and asset-discovery agents.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Automated trust, safety, and content moderation: </strong><span style=\"vertical-align: baseline;\">Social platforms, marketplaces, and digital media pipelines scan millions of user uploads and supplier catalogs every day for explicit content. Historically, scaling this for every single upload has been cost-prohibitive, but not anymore. With object enrichments, you can process 10 million images for just $700.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Training data curation for frontier AI: </strong><span style=\"vertical-align: baseline;\">Autonomous driving, smart home, and robotics companies capture hundreds of millions of raw camera and sensor files. They often need targeted data samples for specific fine-tuning scenarios, which make up only a tiny fraction of their corpus. By enriching raw captures in place with object detection and image labeling models and then querying the resulting metadata in BigQuery, ML engineers can pinpoint exact training cohorts in minutes rather than months.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multimodal analytics</strong><span style=\"vertical-align: baseline;\">: Combine insights from images and documents with structured business data to drive personalization, fraud detection, and trend discovery — for example, analyzing customer uploaded images of the product alongside their comments and recent sales data.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Get started with object enrichments</span></h3>\n<p><span style=\"vertical-align: baseline;\">Object enrichments is available in preview today in the Cloud Storage console and through the Cloud Storage API. To get started, check out the following resources</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read the documentation:</strong><span style=\"vertical-align: baseline;\"> Learn </span><a href=\"https://docs.cloud.google.com/storage/docs/object-enrichments/configure-object-enrichments\"><span style=\"text-decoration: underline; vertical-align: baseline;\">how to configure</span></a><span style=\"vertical-align: baseline;\"> an enrichments job and </span><a href=\"https://docs.cloud.google.com/storage/docs/use-object-contexts\"><span style=\"text-decoration: underline; vertical-align: baseline;\">use object contexts</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Analyze in BigQuery:</strong><span style=\"vertical-align: baseline;\"> Set up </span><a href=\"https://docs.cloud.google.com/storage/docs/insights/datasets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Storage Insights datasets</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/storage/docs/object-enrichments/analyze-bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">query your enrichments</span></a><span style=\"vertical-align: baseline;\"> alongside your BigQuery business data.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Connect your agents:</strong><span style=\"vertical-align: baseline;\"> Pair object enrichments and object context with the </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/build-ai-agents-faster-with-gcs-google-cloud-storage-mcp-server\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage MCP server</span></a><span style=\"vertical-align: baseline;\"> to give agents secure, IAM-scoped access to your data and its context.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review pricing:</strong><span style=\"vertical-align: baseline;\"> See </span><a href=\"https://cloud.google.com/storage/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage pricing</span></a><span style=\"vertical-align: baseline;\"> for details.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini enrichments</strong><span style=\"vertical-align: baseline;\">: Reach out to us at </span><strong style=\"vertical-align: baseline;\">storage-ai@google.com</strong><span style=\"vertical-align: baseline;\"> to learn more and request access to this upcoming functionality.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start building:</strong><span style=\"vertical-align: baseline;\"> Head to the </span><a href=\"https://console.cloud.google.com/storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage console</span></a><span style=\"vertical-align: baseline;\"> to enrich your first bucket in just three clicks.</span></p>\n</li>\n</ul></div>"
  "76e4cb9e29a9e7b067f7f960f20ef1f6":
    "id": "76e4cb9e29a9e7b067f7f960f20ef1f6"
    "title": "Helping our partners market smarter, together, with Gemini"
    "link": "https://cloud.google.com/blog/topics/partners/helping-our-partners-market-smarter-together-with-gemini/"
    "published": "2026-11-20 02:00:00"
    "fetched": "2026-11-20 06:12:32"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At Google Cloud, our commitment to agentic transformation extends to everyone, including the partners who build and grow alongside us.</span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are excited to introduce new Gemini-powered co-marketing capabilities directly within everyday go-to-market workflows for our partners. These new features enable partners to produce customized, brand-aligned joint assets in minutes, scaling campaign execution and driving pipeline more effectively.</span></p>\n<h3><span style=\"vertical-align: baseline;\">From marketing together to innovating together: Scaling impact with Gemini</span></h3>\n<p><span style=\"vertical-align: baseline;\">As technology evolves and customer expectations shift, marketers are no longer just producing campaigns. We’re building continuous, hyper-personalized, data-driven demand engines, and we’re doing it across an increasingly fragmented buyer journey.</span></p>\n<p><span style=\"vertical-align: baseline;\">For our partner network, delivering on this expectation means solving a dual challenge: differentiating core offerings while articulating a unified vision with Google Cloud. </span></p>\n<p><span style=\"vertical-align: baseline;\">Bridging that gap at enterprise scale requires more than incremental efficiency — it requires agentic agility to jointly create, adapt, and distribute stories together that resonate.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-StudioHomePage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1-StudioHomePage.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">What’s new: Advanced agentic capabilities within Partner Marketing Studio</span></h3>\n<p><span style=\"vertical-align: baseline;\">The updated Partner Marketing Studio introduces a suite of agentic tools designed to accelerate campaign execution, optimize performance, and maximize impact for partners of all sizes.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agentic search:</strong><span style=\"vertical-align: baseline;\"> Partners can now use a simple chat feature. Search for what you need, rather than navigating a content repository. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Brand alignment: </strong><span style=\"vertical-align: baseline;\">Never worry about brand compliance again, with a brand reviewer agent that helps ensure your content upholds Google Cloud’s partner brand guidelines. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ISV asset creation:</strong><span style=\"vertical-align: baseline;\"> Gemini generated, high-fidelity marketing assets to drive demand to marketplace listings. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Social automation:</strong><span style=\"vertical-align: baseline;\"> A new social editor with the ability to create posts across multiple networks simultaneously, add account tags, and refine messaging per channel with AI.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Customer case studies: </strong><span style=\"vertical-align: baseline;\">An agent designed to build best-in-class customer success stories to highlight joint customer wins. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini-Assisted Translation:</strong><span style=\"vertical-align: baseline;\"> Accelerate global marketing programs with agentic translations across 130 languages.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Natural language analytics:</strong><span style=\"vertical-align: baseline;\"> Gain end-to-end visibility connecting marketing execution directly to tangible business outcomes.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"Partner Marketing Studio has become an extension of our partner marketing team. With built-in Gemini capabilities and ready-to-run joint campaigns, we can tailor high-impact marketing assets across industries, regions, and personas in minutes. It allows us to do more with less while accelerating pipeline for our joint solutions\" -</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Liana Shuma</strong><span style=\"font-style: italic; vertical-align: baseline;\">, Global Head of Technology Partnerships, Pigment</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-CollectionsPage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-CollectionsPage.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Preserving the best of Partner Marketing Studio</span></h3>\n<p><span style=\"vertical-align: baseline;\">While the platform features powerful new tools, our core focus remains unchanged: helping you build your brand authority and generate pipeline demand.</span></p>\n<p><span style=\"vertical-align: baseline;\">You will continue to find a curated content library structured specifically for you, highlighting top-performing campaigns aligned with Google Cloud strategic priority plays. Partners maintain full access to Google-produced localized campaign content and ready-made assets that can be customized to suit specific go-to-market objectives.</span></p>\n<p><span style=\"vertical-align: baseline;\">Furthermore, high-value partner services remain readily accessible within the platform:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Applying to host customer events directly inside a Google office.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Requesting a Google Cloud speaker for your hosted events.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Attending dedicated office-hours sessions with Google Cloud marketing experts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Requesting social amplification for campaigns.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“Google offices are not only a great draw for attendees, but by handling all event logistics, Google Cloud saved us significant time, money, and allowed us to focus entirely on delivering high-impact content and driving audience engagement” - </span><strong style=\"font-style: italic; vertical-align: baseline;\">Jenny Bejarano</strong><span style=\"font-style: italic; vertical-align: baseline;\">. GTM Specialist, Tiger Analytics</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“We appreciate Google Cloud’s support with speakers for our events. This collaboration strengthens our credibility and value proposition with prospects” - </span><strong style=\"font-style: italic; vertical-align: baseline;\">Tommaso Vaccarella</strong><span style=\"font-style: italic; vertical-align: baseline;\">, Co-Founder &amp; General Manager, Connected Stories </span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">The new Partner Marketing Studio portal is available to all Google Cloud partners. You can log in using your existing business credentials through either of the following paths:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Via Google Cloud Partner Network:</strong><span style=\"vertical-align: baseline;\"> Navigate to </span><strong style=\"vertical-align: baseline;\">Resources</strong><span style=\"vertical-align: baseline;\"> &gt; </span><strong style=\"vertical-align: baseline;\">Marketing</strong><span style=\"vertical-align: baseline;\"> &gt; </span><strong style=\"vertical-align: baseline;\">Partner Marketing Studio</strong><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Via direct browser link:</strong><span style=\"vertical-align: baseline;\"> Visit</span> <a href=\"https://www.google.com/search?q=https://www.partnermarketingstudio.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">www.partnermarketingstudio.com</span></a><span style=\"vertical-align: baseline;\"> directly.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Our commitment: Scaling your success with Gemini</span></h3>\n<p><span style=\"vertical-align: baseline;\">These updates are part of Google Cloud’s larger commitment to transforming how we empower and enable partners with Gemini. In addition to Partner Marketing Studio, we’re leveraging Gemini throughout the partner experience, including a revamped partner marketing funds experience to streamline activity planning, simplify pipeline reporting, and proactively validate required documentation before submission.</span></p>\n<p><span style=\"vertical-align: baseline;\">We’ve seen Google Cloud experience tremendous growth in recent years, and a major part of that success has been the incredible work done by our partner ecosystem. Now, as we’re bringing the power of Gemini directly into your go-to-market workflows, we’re excited to take our work together to a whole new level. </span></p>\n<p><span style=\"vertical-align: baseline;\">With AI at our side, and as one of our strongest offerings, it will be easier than ever to create, connect, and grow together.</span></p></div>"
