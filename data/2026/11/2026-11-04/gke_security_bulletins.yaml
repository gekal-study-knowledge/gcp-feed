    "title": "GCP-2026-078"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-078"
    "published": "2026-11-04 09:00:00"
    "fetched": "2026-11-05 07:25:20"
    "summary": "<p><strong>Published: </strong>2026-11-04</p><p><strong>Reference: </strong><a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-98432\">CVE-2026-98432</a></p><table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A vulnerability (CVE-2026-98432) was discovered in the Linux kernel\n        IPv4 TCP stack. The flaw can cause a kernel panic or a container escape\n        (root code execution on the node). An unprivileged process in a\n        container can trigger it locally, without special capabilities such as\n        <code dir=\"ltr\">CAP_NET_RAW</code>. A network attacker can also trigger it by\n        sending TCP packets with IPv4 options to a listener on the node or on\n        the cluster control plane.</p>\n<p>The network attack requires access to a TCP listener on your nodes,\n        Pods, or the control plane's IP-based endpoint. Clusters that restrict\n        this access to trusted sources, for example with firewall rules and\n        control plane authorized networks, are not exposed to network\n        attacks.</p>\n<p>GKE Standard clusters and GKE\n        Autopilot clusters are impacted.</p>\n<h4 id=\"what-should-i-do\" tabindex=\"-1\">What should I do?</h4>\n<p>All GKE versions running Container-Optimized OS\n        prior to the following versions are affected. Upgrade your cluster\n        control plane and nodes to one of the following patch versions or\n        later:</p>\n<ul>\n<li>1.36.5-gke.1982000 or later</li>\n<li>1.35.9-gke.1505000 or later</li>\n<li>1.34.12-gke.1539000 or later</li>\n<li>1.33.13-gke.2207000 or later</li>\n<li>1.32.13-gke.2906000 or later</li>\n</ul>\n<aside class=\"note\"><strong>Note:</strong> Patches for GKE\n        1.37 and Ubuntu node images are in progress.</aside>\n<p>You can apply patch versions from newer release channels if your\n        cluster runs the same minor version in its own release channel. This\n        feature lets you secure your nodes until the patch version becomes the\n        default in your release channel. For details, see\n        <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/release-channels#newer-patch-versions\">Run patch versions from a newer channel</a>.</p>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>"
