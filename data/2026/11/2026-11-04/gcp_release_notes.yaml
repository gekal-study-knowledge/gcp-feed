    "summary": "<h2 class=\"release-note-product-title\">AlloyDB for PostgreSQL</h2>\n<h3>Feature</h3>\n<p>Direct Iceberg access in AlloyDB for PostgreSQL is available for PostgreSQL 18\nand later (<a href=\"https://cloud.google.com/products#product-launch-stages\">in Preview</a>).\nThis feature lets you query Apache Iceberg tables in Cloud Storage or Lakehouse\nruntime catalog and accelerate analytical queries using the AlloyDB columnar\nengine.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/access-iceberg-data-from-alloydb\">Access Iceberg data from\nAlloyDB</a>.</p>\n<h3>Feature</h3>\n<p>Syncing data from BigQuery into AlloyDB is generally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>). This feature\nlets you copy or mirror analytical tables from BigQuery into AlloyDB for\nlow-latency operational access using the <code>alloydb_sync</code> extension.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\">Sync BigQuery data to AlloyDB</a>.</p>\n<h3>Feature</h3>\n<p>AlloyDB Express is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a> for\nPostgreSQL 18. Optimized for rapid prototyping and for workflows that use AI\ncoding agents, this configuration provides the following features:</p>\n<ul>\n<li>Fast provisioning</li>\n<li>Scale-to-zero compute when idle</li>\n<li>A monthly free tier for the first 12 months of usage</li>\n<li>One-click upgrades to AlloyDB for PostgreSQL</li>\n</ul>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/alloydb/docs/express-overview\">AlloyDB Express overview</a>.</p>\n<h2 class=\"release-note-product-title\">Apigee Operator for kubernetes</h2>\n<h3>Announcement</h3>\n<p>On November 4, 2026, we released an updated version of Apigee.</p>\n<h3>Feature</h3>\n<p><strong>The Apigee Operator for Kubernetes version 1.1.2 is now available.</strong></p>\n<h3>Security</h3>\n<table>\n<thead>\n<tr>\n<th>Bug ID</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>521387476, 521388685, 521389473, 521389648, 521390401, 521390431, 521418315, 521467563, 521470029, 521523106, 521532318, 522502328, 522502515, 522502723, 522508097, 522515015, 522515987, 523406508, 524990439, 525000385, 525013469, 545525835, 545535262, 545546643, 545547894, 545594793, 545595426, 545604082, 545605504, 545613200, 545619209, 546865118, 549708263, 572097689, 572100132</strong></td>\n<td><strong>Security fixes for Netty in the Apigee Operator for Kubernetes.</strong> <p>Upgraded Netty to 4.1.137.Final. This addresses the following vulnerabilities:<ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-33870\">CVE-2026-33870</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-33871\">CVE-2026-33871</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-41417\">CVE-2026-41417</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42578\">CVE-2026-42578</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42579\">CVE-2026-42579</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42580\">CVE-2026-42580</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42581\">CVE-2026-42581</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42583\">CVE-2026-42583</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42584\">CVE-2026-42584</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42585\">CVE-2026-42585</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-42587\">CVE-2026-42587</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-44249\">CVE-2026-44249</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-45416\">CVE-2026-45416</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-45673\">CVE-2026-45673</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-45674\">CVE-2026-45674</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-47244\">CVE-2026-47244</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-47691\">CVE-2026-47691</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-48043\">CVE-2026-48043</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-50010\">CVE-2026-50010</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-50020\">CVE-2026-50020</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-50560\">CVE-2026-50560</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-55831\">CVE-2026-55831</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-55833\">CVE-2026-55833</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56745\">CVE-2026-56745</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56746\">CVE-2026-56746</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-56819\">CVE-2026-56819</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59898\">CVE-2026-59898</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59899\">CVE-2026-59899</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59900\">CVE-2026-59900</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59901\">CVE-2026-59901</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59903\">CVE-2026-59903</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59921\">CVE-2026-59921</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-73508\">CVE-2026-73508</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-75595\">CVE-2026-75595</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-75596\">CVE-2026-75596</a></li></ul></p></td>\n</tr>\n<tr>\n<td><strong>527492626, 527495614, 527497578, 527498733, 545553137, 572096453, 572096754, 572096884, 572097054, 572097090, 572097183, 572098198, 572098299, 572099894, 572100881, 578504005</strong></td>\n<td><strong>Security fixes for Jackson in the Apigee Operator for Kubernetes.</strong> <p>Upgraded Jackson to 2.21.7. This addresses the following vulnerabilities:<ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-18401\">CVE-2026-18401</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-19032\">CVE-2026-19032</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-54512\">CVE-2026-54512</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-54513\">CVE-2026-54513</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-54514\">CVE-2026-54514</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-54515\">CVE-2026-54515</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59888\">CVE-2026-59888</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-59889\">CVE-2026-59889</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-68494\">CVE-2026-68494</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-68497\">CVE-2026-68497</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-77310\">CVE-2026-77310</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-83557\">CVE-2026-83557</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89407\">CVE-2026-89407</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-89425\">CVE-2026-89425</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-91776\">CVE-2026-91776</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-91777\">CVE-2026-91777</a></li></ul></p></td>\n</tr>\n<tr>\n<td><strong>521477919, 545546100, 545555197, 545603496, 545608493</strong></td>\n<td><strong>Security fixes for Jetty in the Apigee Operator for Kubernetes.</strong> <p>Upgraded Jetty to 12.0.36. This addresses the following vulnerabilities:<ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2025-11143\">CVE-2025-11143</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-1605\">CVE-2026-1605</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-2332\">CVE-2026-2332</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-6790\">CVE-2026-6790</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-8384\">CVE-2026-8384</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-10050\">CVE-2026-10050</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-10051\">CVE-2026-10051</a></li></ul></p></td>\n</tr>\n<tr>\n<td><strong>522503039</strong></td>\n<td><strong>Security fixes for Vert.x in the Apigee Operator for Kubernetes.</strong> <p>Upgraded Vert.x to 4.5.35. This addresses the following vulnerabilities:<ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-1002\">CVE-2026-1002</a></li><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-6860\">CVE-2026-6860</a></li></ul></p></td>\n</tr>\n<tr>\n<td><strong>579151884</strong></td>\n<td><strong>Security fixes for Guava in the Apigee Operator for Kubernetes.</strong> <p>Upgraded Guava to 33.7.2-jre. This addresses the following vulnerabilities:<ul><li><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-102554\">CVE-2026-102554</a></li></ul></p></td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"release-note-product-title\">Gemini Enterprise</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Enterprise: Switch between teams in the mobile app</strong></p>\n<p>You can switch between multiple teams in the Gemini Enterprise mobile app\nwithout logging out and rescanning the QR code. (Teams were previously called\ninstances.)</p>\n<p>When you open a team for the first time, the mobile app saves it to your teams\nlist. Additionally, you can rename teams in the list and you can remove teams\nfrom your list.</p>\n<p>This feature is generally available (GA). For more information, see\n<a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/use-the-mobile-app#teams\">Teams</a> in <em>Use the mobile\napp</em>.</p>\n<h2 class=\"release-note-product-title\">Google Distributed Cloud (software only) for VMware</h2>\n<h3>Announcement</h3>\n<p>Google Distributed Cloud (software only) for VMware 1.35.700-gke.124 is now available\nfor download. To upgrade, see <a href=\"https://docs.cloud.google.com/kubernetes-engine/distributed-cloud/vmware/docs/how-to/upgrading.md\">Upgrade clusters</a>.\nGoogle Distributed Cloud 1.35.700-gke.124 runs on Kubernetes v1.35.8-gke.100.</p>\n<p>If you use a third-party storage vendor, check the listing of our\npreviously-qualified <a href=\"https://docs.cloud.google.com/kubernetes-engine/enterprise/docs/resources/partner-storage\">storage partners</a>.</p>\n<p>After a release, it takes approximately 7 to 14 days for the version to become\navailable for use with GKE On-Prem API clients: the Google Cloud console, the\ngcloud CLI, and Terraform.</p>\n<h3>Feature</h3>\n<p>The following changes were added in 1.35.700-gke.124:</p>\n<ul>\n<li>Updated system components and container base images to remove the distrusted\neMudhra (emSign) and AAA Certificate Services root CAs and reject compromised\neMudhra intermediate CAs.\n</li>\n<li>Upgraded Container-Optimized OS (COS) to milestone 121\n(<code>cos-121-18867-652-7</code>), which removes the distrusted eMudhra (emSign) and\nAAA Certificate Services root CAs.\n</li>\n<li>Updated the Ubuntu 24.04 node and admin workstation base image to\n<code>ubuntu-gke-op-2404-1-34-v20261024</code> to remove the distrusted eMudhra\n(emSign) root CAs (USN-8944-1).\n</li>\n</ul>\n<h3>Fixed</h3>\n<p>The following issues were fixed in 1.35.700-gke.124:</p>\n<ul>\n<li>Fixed vulnerabilities listed in <a href=\"https://docs.cloud.google.com/kubernetes-engine/distributed-cloud/vmware/docs/vulnerabilities\">Vulnerability fixes</a>.</li>\n<li>Fixed an issue where <code>audit-proxy</code> retried audit log exports indefinitely on\npermanent errors, generating excessive audit logging traffic.\n</li>\n<li>Fixed an issue where the Kubernetes preflight health check scanned all\nnamespaces in the admin cluster instead of the target cluster's namespace,\ncausing cluster upgrades to fail if an unrelated cluster had stale\nreconciling resources.\n</li>\n</ul>\n<h2 class=\"release-note-product-title\">Google Distributed Cloud (software only) for bare metal</h2>\n<h3>Announcement</h3>\n<p>Google Distributed Cloud (software only) for bare metal 1.35.700-gke.124 is now available for\ndownload. To upgrade, see <a href=\"https://docs.cloud.google.com/feeds/how-to/upgrade\">Upgrade clusters</a>.\nGoogle Distributed Cloud for bare metal\n1.35.700-gke.124 runs on Kubernetes v1.35.8-gke.100.</p>\n<p>After a release, it takes approximately 7 to 14 days for the version to become\navailable for installations or upgrades with the GKE On-Prem API clients: the\nGoogle Cloud console, the gcloud CLI, and Terraform.</p>\n<p>If you use a third-party storage vendor, check the listing of our\npreviously-qualified <a href=\"https://docs.cloud.google.com/kubernetes-engine/enterprise/docs/resources/partner-storage\">storage partners</a>.</p>\n<h3>Feature</h3>\n<p>The following changes were added in 1.35.700-gke.124:</p>\n<ul>\n<li>Updated system components and container base images to remove the distrusted\neMudhra (emSign) and AAA Certificate Services root CAs and reject compromised\neMudhra intermediate CAs.\n</li>\n</ul>\n<h3>Fixed</h3>\n<p>The following issues were fixed in 1.35.700-gke.124:</p>\n<ul>\n<li>Fixed vulnerabilities listed in <a href=\"https://docs.cloud.google.com/kubernetes-engine/distributed-cloud/bare-metal/docs/vulnerabilities\">Vulnerability fixes</a>.</li>\n<li>Fixed an issue where removing a node from a cluster left behind its local\n<code>PersistentVolume</code> resources instead of garbage collecting them. This fix\napplies to Google Distributed Cloud for bare metal local <code>PersistentVolume</code> resources\ncreated after upgrading to 1.35.700-gke.124; existing orphaned\n<code>PersistentVolume</code> resources must be deleted manually.\n</li>\n<li>Fixed an issue where resetting or removing a control plane node could remove\nthe wrong <code>etcd</code> or <code>etcd-events</code> member if another control plane node's IP\naddress shared the same prefix (for example, <code>10.201.0.2</code> and <code>10.201.0.26</code>),\ncausing the affected node to become <code>NotReady</code> and stalling cluster upgrades.\n</li>\n<li>Improved <code>containerd</code> resilience against state corruption if a node reboots\nwhile unpacking container images.\n</li>\n<li>Fixed an issue where the periodic configuration drift health check failed with\na <code>version not supported</code> error while a cluster upgrade or rollback was in\nprogress.\n</li>\n<li>Fixed an issue where <code>audit-proxy</code> retried audit log exports indefinitely on\npermanent errors, generating excessive audit logging traffic.\n</li>\n<li>Fixed an issue where the Kubernetes preflight health check scanned all\nnamespaces in the admin cluster instead of the target cluster's namespace,\ncausing cluster upgrades to fail if an unrelated cluster had stale\nreconciling resources.\n</li>\n</ul>\n<h2 class=\"release-note-product-title\">Google SecOps</h2>\n<h3>Announcement</h3>\n<p><strong>Consolidated Settings and Navigation</strong></p>\n<p>The <strong>Consolidated Settings and Navigation</strong> feature is now in public preview. It replaces the separate SIEM Settings and SOAR Settings menus with a single Settings menu, grouped into Administration, Access Management, Investigation, Detection and Data Management, and also updates the left navigation menu. Each settings page is shown only to users with the correct permissions. Cloud IAM, Viewer and Editor users can now view certain SOAR settings pages in read-only mode. Note that the Google SecOps documentation has been updated to reflect the new navigational changes.\nFor more information, see <a href=\"https://docs.cloud.google.com/chronicle/docs/secops/navigate-the-secops-platform\">Navigate the Google SecOps platform</a>.</p>"
