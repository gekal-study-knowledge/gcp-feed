"overview": |
  この日はブログ記事 12 本、リリースノート 1 件、GKE セキュリティ速報 1 件 (同じ記事が 2 ソースに掲載されたため件数は 15)。米国の Google Cloud Blog では Agentic Data Cloud のアップデートとして、Apache Iceberg ベースの borderless Lakehouse でマルチクラウド・オンプレミス・SaaS (Confluent・SAP・Salesforce・Workday など) のデータをデータ移動なしにエージェントへ提供する方針が示された。あわせて AlloyDB 関連が 2 本出て、開発者と AI コーディングエージェント向けに 2 秒未満で PostgreSQL データベースを作成でき、15 分間アイドルで自動停止するスケールトゥゼロの AlloyDB Express がプレビュー (無料枠あり) となったほか、Cloud Storage 上の Iceberg テーブルを AlloyDB から直接クエリして運用データと結合できる direct Iceberg access がプレビュー、AlloyDB sync と Lakehouse federation が一般提供となった。事例としてメルカリがカスタマーサービス環境のレガシー VDI を Chrome Enterprise Premium と Chromebook に置き換え、50% 超のコスト削減を見込む記事も出た。Google Cloud Japan Blog から 6 本が出て、Google が業界パートナーと連携し、130 万台以上のセットトップボックスをボットネットに組み込んでいた XCPE バックドアをテイクダウンした件を詳しく解析した。Android の OEM / ODM である Videostrong Technology 社が経済的利益を目的に意図的に開発・運用していたと評価し、アフィリエイトのモジュールを制御する C2 ドメインもテイクダウンして、さらに 1,000 万台以上の感染デバイスへのアクセスを遮断できたと推測している。Google は同社との提携を解消し、Google アプリをプリロードしたデバイスの製造を禁じた。米国ブログの抄訳として、Cloud SQL for MySQL 向けのフルマネージド Blue/Green デプロイ (プレビュー) による主要バージョンアップグレードのダウンタイム最小化、Oracle との提携で Google TPU を Oracle Cloud Infrastructure に導入 (OCI は Google 以外で TPU を提供する初のハイパースケーラーとなり、2027 年から TPU キャパシティのデプロイを開始予定)、Meta の PyTorch チームと共同開発した TorchTPU のオープンソース化、Gemini Robotics Embodied Reasoning 2 の Gemini プラットフォームでの公開プレビューが紹介された。事例ではマクロミルが 20 年稼働してきた基幹システムを 1 年で GKE や AlloyDB などの Google Cloud へ全面移行し、オートスケールと無停止リリース、コスト削減を実現した。ほかに Nammu21 が AI プラットフォームで法的合意書を構造化し Google Cloud Universal Ledger (GCUL) 上のスマートコントラクトとして展開することでシンジケートローンのライフサイクル全体を自動化する PoC と、Google Cloud Consulting チームの企業支援の経験からエージェント導入で人を中心に据えるための 5 つの教訓をまとめた記事が出た。GKE のセキュリティ速報 GCP-2026-078 (CVE-2026-98432、深刻度 Medium) も公開された。Linux カーネルの IPv4 TCP スタックの欠陥で、カーネルパニックやコンテナからの脱出 (ノード上での root コード実行) につながり、コンテナ内の非特権プロセスが CAP_NET_RAW などの特別な権限なしにローカルから発火させられるほか、ノードやコントロールプレーンのリスナーへ IPv4 オプション付きの TCP パケットを送ることでネットワーク経由でも発火する。GKE Standard と Autopilot の双方が対象で、Container-Optimized OS を使う全バージョンが影響を受けるため、1.36.5-gke.1982000 / 1.35.9-gke.1505000 / 1.34.12-gke.1539000 / 1.33.13-gke.2207000 / 1.32.13-gke.2906000 以降へのアップグレードが必要 (1.37 と Ubuntu ノードイメージのパッチは作成中)。ファイアウォールやコントロールプレーン承認済みネットワークでアクセスを信頼できる範囲に限定しているクラスターは、ネットワーク攻撃の対象外とされている。リリースノートでは、上記の AlloyDB 3 件 (PostgreSQL 18 以降での direct Iceberg access がプレビュー、BigQuery からの同期が GA、AlloyDB Express がプレビュー) に加えて、Apigee Operator for Kubernetes 1.1.2 で Netty 4.1.137.Final・Jackson 2.21.7・Jetty 12.0.36・Vert.x 4.5.35・Guava 33.7.2-jre へ更新して多数の CVE を修正したこと、Gemini Enterprise のモバイルアプリでのチーム切り替えが GA になったこと、Google Distributed Cloud (software only) for VMware / ベアメタル 1.35.700-gke.124 で失効した eMudhra (emSign) と AAA Certificate Services のルート CA を除去したこと、Google SecOps の設定とナビゲーションの統合がパブリックプレビューになったことが告知された。
