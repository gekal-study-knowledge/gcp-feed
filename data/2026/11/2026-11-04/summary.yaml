"overview": |
  この日はブログ記事 8 本 (同じ記事が 2 ソースに掲載されたため件数は 9)。Google Cloud Japan Blog から 6 本が出て、Google が業界パートナーと連携し、130 万台以上のセットトップボックスをボットネットに組み込んでいた XCPE バックドアをテイクダウンした件を詳しく解析した。Android の OEM / ODM である Videostrong Technology 社が経済的利益を目的に意図的に開発・運用していたと評価し、アフィリエイトのモジュールを制御する C2 ドメインもテイクダウンして、さらに 1,000 万台以上の感染デバイスへのアクセスを遮断できたと推測している。Google は同社との提携を解消し、Google アプリをプリロードしたデバイスの製造を禁じた。米国ブログの抄訳として、Cloud SQL for MySQL 向けのフルマネージド Blue/Green デプロイ (プレビュー) による主要バージョンアップグレードのダウンタイム最小化、Oracle との提携で Google TPU を Oracle Cloud Infrastructure に導入 (OCI は Google 以外で TPU を提供する初のハイパースケーラーとなり、2027 年から TPU キャパシティのデプロイを開始予定)、Meta の PyTorch チームと共同開発した TorchTPU のオープンソース化、Gemini Robotics Embodied Reasoning 2 の Gemini プラットフォームでの公開プレビューが紹介された。事例ではマクロミルが 20 年稼働してきた基幹システムを 1 年で GKE や AlloyDB などの Google Cloud へ全面移行し、オートスケールと無停止リリース、コスト削減を実現した。ほかに Nammu21 が AI プラットフォームで法的合意書を構造化し Google Cloud Universal Ledger (GCUL) 上のスマートコントラクトとして展開することでシンジケートローンのライフサイクル全体を自動化する PoC と、Google Cloud Consulting チームの企業支援の経験からエージェント導入で人を中心に据えるための 5 つの教訓をまとめた記事が出た。
