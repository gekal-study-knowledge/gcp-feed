  "8eb992e17aff347e9d72813796d0c8d8":
    "id": "8eb992e17aff347e9d72813796d0c8d8"
    "title": "How Nammu21 automates syndicated loans on Google Cloud Universal Ledger"
    "link": "https://cloud.google.com/blog/topics/financial-services/how-nammu21-automates-syndicated-loans-on-google-cloud-universal-ledger/"
    "published": "2026-11-04 03:00:00"
    "fetched": "2026-11-04 06:30:07"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The syndicated loan and private credit markets, both critical components of corporate finance, have long been constrained by manual processes, leading to multi-week settlements, valuation opacity, and trade friction. </span></p>\n<p><span style=\"vertical-align: baseline;\">To solve these long-standing challenges, fintech innovator </span><a href=\"https://www.nammu21.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Nammu21</span></a><span style=\"vertical-align: baseline;\"> partnered with Google Cloud on a new proof-of-concept. Using its AI-powered platform to structure legal agreements and instantiate them as smart contracts on the </span><a href=\"https://docs.cloud.google.com/universal-ledger\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Universal Ledger (GCUL)</span></a><span style=\"vertical-align: baseline;\">, Nammu21 automates the entire loan lifecycle, paving the way for improved settlement times and greater market efficiency.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Digitizing the loan market</span></h2>\n<p><span style=\"vertical-align: baseline;\">While loan markets provide billions in capital to businesses worldwide, their underlying infrastructure has not kept pace with the speed of digital finance. This landscape requires continuous coordination across facility agents, borrowers, and diverse lender syndicates, while also managing highly customized credit agreements with dynamic tranches and complex covenants. </span></p>\n<p><span style=\"vertical-align: baseline;\">In particular, relying on fragmented, manual interpretation of legal text often results in significant operational drag and data silos. According to the </span><a href=\"https://blog.lma.eu.com/challenging-the-timeline-issue-no-4/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Loan Market Association</span></a><span style=\"vertical-align: baseline;\">, secondary market settlement times for par/near par loans in Q4 2024 still averaged 42 days, with a median of 27 days. These notoriously slow timelines tie up capital, increase counterparty risk, and create a heavy reconciliation burden for participants.</span></p>\n<p><span style=\"vertical-align: baseline;\">Nammu21 transforms bespoke credit documents into programmable assets at scale by rendering each facility's governing terms as a Digital Credit Instrument (DCI). The DCI maps every term — including conditions, consents, eligibility criteria, and operational mechanics that determine what is permitted under a facility — directly back to its originating legal provision. These elements are then expressed as executable behaviours against a loan's live state. </span></p>\n<p><span style=\"vertical-align: baseline;\">To instantiate these instruments, the proof-of-concept utilizes the secure, high-performance execution environment of GCUL, an institutional-grade, permissioned distributed ledger that helps automate complex financial workflows to deliver near-instant transaction finality and predictable costs without the volatility or security concerns of public blockchains.</span></p>\n<h2><span style=\"vertical-align: baseline;\">A purpose-built stack for digital credit</span></h2>\n<p><span style=\"vertical-align: baseline;\">Combined with Nammu21’s data intelligence, GCUL provides the foundational infrastructure for converting legal document logic into live, programmable contracts. Designed to handle the privacy, scale, and multi-party coordination required by institutional finance, GCUL provides a permissioned, high-performance distributed ledger that delivers deterministic, instant transaction finality for high-value financial settlements.</span></p>\n<p><span style=\"vertical-align: baseline;\">Programmable contracts on GCUL are written in </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\">, GCUL's domain-optimized programming language. As a strict, statically-typed subset of Python, </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> is designed to be safe, readable, and auditable, making it ideal for processing complex financial logic.</span></p>\n<p><span style=\"vertical-align: baseline;\">For regulated financial institutions, </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> offers distinct operational advantages over other ledger programming models. The language simplifies development by removing the need for complex memory management or workarounds to meet highly restrictive call stack limits, allowing engineers to focus on the financial logic itself. </span></p>\n<p><span style=\"vertical-align: baseline;\">GCUL also provides robust, built-in permissioning, requiring explicit user authorization before a contract can store data on their behalf. This solves the \"unsolicited asset\" problem — common on public networks — where unwanted tokens can be sent to an organization's wallet, creating compliance and accounting issues. With GCUL, institutions can maintain full control over which assets they interact with to support their high-value, highly regulated use cases.</span></p>\n<p><span style=\"vertical-align: baseline;\">Nammu21 serves a dual role in this architecture. First, the platform renders the DCI programmatically from the original legal agreement without manual document reading to establish the terms. Next, it derives </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> contracts that define the structure of the obligation and govern the loan on GCUL, using the DCI to supply the terms that determine what the loan documents permit, require and block.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Technical architecture: The loan lifecycle on GCUL</span></h2>\n<p><span style=\"vertical-align: baseline;\">Nammu21’s loan implementation on GCUL demonstrates the value of creating a single, immutable source of truth. The proof-of-concept modeled a $1.945 billion Term Loan B — one segment of a broader multi-facility transaction — where the agent bank, borrower, transferor, and transferee all worked off a permissioned view of the same on-ledger rendering.</span></p>\n<p><span style=\"vertical-align: baseline;\">The lifecycle begins when an agent bank selects a specific credit agreement transformed by Nammu21. The platform instantly provides the structured terms from the document, which are used to instantiate a unique </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> contract on GCUL, establishing a verifiable, on-ledger digital twin of that specific loan facility.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-facility-tokenization\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1-facility-tokenization.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, the agent bank initiates the onboarding of the borrower and lenders. This multilateral action requires that each participant review the request and then provide explicit consent by approving the onboarding invitation from their own interface. Once all parties are onboarded, the agent bank records an immutable hash of the loan's key terms on-ledger, attesting that the on-ledger data matches the canonical off-ledger records.</span></p>\n<p><span style=\"vertical-align: baseline;\">Subsequent lifecycle events, such as secondary market transfers or repayments, are also managed as multi-step, automated workflows governed by a consent-driven model. For example, a transfer of a loan position requires new lender, borrower, and agent bank consent  before it can be executed atomically on the ledger. All payment flows, from interest payments to loan close-outs, settle directly on GCUL using tokenized commercial bank money, eliminating the need for external payment rails.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-assignment-transfer-legend\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-assignment-transfer-legend.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Transacting with familiar, regulated money on a programmable ledger provides an architecture purpose-built for institutional finance, grounded in three core pillars:</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Compliance via gated execution: </strong><span style=\"vertical-align: baseline;\">Nammu21’s </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> contracts instantiated with governing terms, validate every action against the terms transformed from the agreement before execution, mitigating potential covenant breaches or invalid transfers upfront while eliminating the risk of silent failures. </span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">Role-based privacy:</strong><span style=\"vertical-align: baseline;\"> GCUL enforces strict, role-based access, ensuring that trading strategies, positions, and sensitive loan data remain confidential and are visible only to the necessary counterparties in a transaction.</span></p>\n<p><span style=\"vertical-align: baseline;\">3. </span><strong style=\"vertical-align: baseline;\">Settlement finality: </strong><span style=\"vertical-align: baseline;\">Every on-ledger action completes near-instantly and anchors on canonical data derived from the original credit agreement, replacing provisional, reconciliation-heavy models with real-time, trusted verification.</span></p>\n<h2><span style=\"vertical-align: baseline;\">The business impact of moving on-ledger</span></h2>\n<p><span style=\"vertical-align: baseline;\">This proof-of-concept illustrates a structural shift in how credit markets can operate. When each facility's governing terms are rendered as a DCI and executed on GCUL, the operational mechanics of lending markets change fundamentally, rather than incrementally. </span></p>\n<p><span style=\"vertical-align: baseline;\">Values can be reconciled bilaterally, but governance logic cannot – and the market’s current friction stems directly from each party's independent interpretation of the rules. Resolving this issue on-ledger is what enables settlement times to compress, back-office overhead to shrink, and counterparty risk to be mitigated by design rather than by manual checking. </span></p>\n<p><span style=\"vertical-align: baseline;\">This same architecture can be applied wherever credit terms are bespoke and manually interpreted. By freeing up capital that would otherwise be trapped in lengthy settlement cycles, new liquidity is unlocked and a more dynamic and efficient secondary loan market can emerge.</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">The team would also like to thank Someera Khokhar, Jordan Shelley, and Saskia A. Aalders at Nammu21 and Googlers Ishan Singh, Kathryn Stavish, Tom Chudy, and Stathis Onasoglou for their contributions.</span></sup></p></div>"
  "20e9b888791ffe732c163216db8acc0f":
    "id": "20e9b888791ffe732c163216db8acc0f"
    "title": "Leading in the agentic era: How to put people first as you adopt AI agents"
    "link": "https://cloud.google.com/blog/topics/consulting/lessons-for-adopting-ai-agents/"
    "published": "2026-11-04 02:00:00"
    "fetched": "2026-11-04 06:30:07"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Over the past few years, our Google Cloud Consulting team has partnered with many companies to introduce AI into their daily operations.</span></p>\n<p><span style=\"vertical-align: baseline;\">In that time, we’ve seen the focus shift from generative AI that answers questions to agentic systems that fully carry out the work. These agents can create multi-step plans and manage a project from start to finish.</span></p>\n<p><span style=\"vertical-align: baseline;\">While budget, compute, and tooling can help launch an agent program, enterprise adoption takes intentional culture work. People need to feel empowered enough to experiment with agents, and leaders need to show teams what agents mean for their roles.</span></p>\n<p><span style=\"vertical-align: baseline;\">Based on our work across these organizations, we’ve put together five practical lessons for guiding enterprises through an agentic shift. </span></p>\n<h3><span style=\"vertical-align: baseline;\">1. Make workflows agent-executed, human-directed</span></h3>\n<p><span style=\"vertical-align: baseline;\">Most enterprise workflows run like a relay race: one person completes a task, checks it, and hands it off to the next person, who then does the same. Layering an AI agent onto that model gives you a faster runner for one leg, but the handoffs may stall or slow down other work. </span></p>\n<p><span style=\"vertical-align: baseline;\">Redesigning your workflows can remove blockers like these in a few ways: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strategic direction:</strong><span style=\"vertical-align: baseline;\"> Move from human-in-the-loop validation (where a person checks each step) to a human-in-the-</span><span style=\"font-style: italic; vertical-align: baseline;\">lead</span><span style=\"vertical-align: baseline;\"> model. Agents take on the work, and people set the direction and own the outcomes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Parallel dependencies:</strong><span style=\"vertical-align: baseline;\"> One agent can handle every dependency at once instead of passing work through a multi-person queue. For example, an agent can check product availability, credit limits, and contract paperwork at the same time without waiting on each step to finish.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Manage by exception:</strong><span style=\"vertical-align: baseline;\"> Once the process is set up this way, the agent absorbs routine deterministic transactions, routing only ambiguous or high-judgment scenarios to human review. Cross-team stalls disappear, and your team stays in control.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">2. Turn hesitation into ownership</span></h3>\n<p><span style=\"vertical-align: baseline;\">In our experience, the biggest barrier to adoption is trust. Many employees worry about their value if an agent handles most of their day-to-day tasks. Others are concerned with who takes the blame if an agent makes a mistake. We encourage teams to treat agents the way they'd treat a junior team member:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Active delegation:</strong><span style=\"vertical-align: baseline;\"> Frame agents as digital coworkers. That means assigning tasks to them, defining their scope, and checking their work for accuracy.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Clear responsibilities:</strong><span style=\"vertical-align: baseline;\"> Set boundaries around which decisions an agent can make and which require human sign-off. When team members know exactly where accountability sits, they can better direct agents.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Comfort through exposure</strong><span style=\"vertical-align: baseline;\">: Confidence grows through familiarity. We recommend starting with low-stakes use cases (like scheduling internal meetings) to help motivate teams before moving to high-stakes operations (such as financial forecasting).   </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">3. Manage hybrid teams of people and agents</span></h3>\n<p><span style=\"vertical-align: baseline;\">Next, it’s important to support collaboration when you bring agents into your team. Let’s look at how this might work in practice,</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Focus on results:</strong><span style=\"vertical-align: baseline;\"> Collaborate across teams to break down workflows at both the tool and task level. Cross-functional perspectives reveal an end-to-end view of the process, helping you pinpoint where agentic capabilities belong and how to prioritize ideas by technical feasibility and business impact.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\"> Reinforce behaviors:</strong><span style=\"vertical-align: baseline;\"> Top performers on a hybrid team are the people who guide their agents well. Reward team members for auditing an agent's reasoning and catching when its logic drifts from company goals.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Coach your teams:</strong><span style=\"vertical-align: baseline;\"> Show your teams how to work with agents so people can spend more time on creative work and decision-making.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">4. Build agentic literacy through experimentation</span></h3>\n<p><span style=\"vertical-align: baseline;\">Your teams need to understand how agents solve problems. People who know where an agent's logic breaks down (and why) can guide and judge its output.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Beyond the tool:</strong><span style=\"vertical-align: baseline;\"> Literacy covers both writing a good prompt and auditing the result. Agents choose the most likely path instead of following deterministic rules, so people need to know when to trust an agent's output and when to check it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Safe learning zones:</strong><span style=\"vertical-align: baseline;\"> Give business roles the same sandbox access that technical teams get to build agentic literacy across the whole organization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Celebrating intelligent failure:</strong><span style=\"vertical-align: baseline;\"> Experimentation is how teams learn. In our experience, we’ve seen that when teams build an agent that fails because the data wasn't accurate, that team then understands how important data readiness is. Even if it didn’t work out, this should still be encouraged so your teams keep experimenting. </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">5. Govern agents with a hub-and-spoke model</span></h3>\n<p><span style=\"vertical-align: baseline;\">To roll agents out across an enterprise, you need central guardrails that don't slow down the teams closest to the work. A hub-and-spoke model does both: it gives teams a shared foundation to build on and room to move at their own pace.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The hub:</strong><span style=\"vertical-align: baseline;\"> Establish a central AI council team that sets guidelines, maintains ethical guardrails, and manages a library of approved tools. That way, teams don't rebuild the same things. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The spokes:</strong><span style=\"vertical-align: baseline;\"> Allow individual teams to adapt those tools to their own needs, experiment quickly, and give feedback on what works in practice.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Within Google Cloud Consulting, we use our internal </span><a href=\"https://www.youtube.com/watch?v=F8S9AInJ9Ic\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Catalog</span></a><span style=\"vertical-align: baseline;\"> to share low-code agents and skills that drive cross-team learning, innovation, and efficiency. However, you don’t need to build a custom platform to implement this. Here are a few approaches:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Filter and sort agents made by employees through a simple internal web app.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Publish and share agents with built-in Gemini Enterprise features like Agent Gallery.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Work directly with technical teams that help organizations create tailored solutions.   </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Lead with a people-first approach to AI</span></h3>\n<p><span style=\"vertical-align: baseline;\">Becoming an agentic organization is about your people. Give your teams systems and guardrails to move fast, room to experiment, and leadership that promotes accountability. </span></p>\n<p><span style=\"vertical-align: baseline;\">Ultimately, the overarching goal is to build an organization where human ingenuity and agents support and amplify one another.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started</span></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"http://govern\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Explore free courses on Google Skills</span></a><span style=\"vertical-align: baseline;\">: Build in-demand AI expertise at your own pace and guide your teams through the agentic journey.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/events/build-with-gemini-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Join a Build with Gemini workshop</span></a><span style=\"vertical-align: baseline;\">: Sign up today to discover hands-on strategies for creating agentic literacy and empowering your teams to lead with AI.</span></p>\n</li>\n</ul></div>"
  "38f944262f62acf2c712ec06f9f068fe":
    "id": "38f944262f62acf2c712ec06f9f068fe"
    "title": "New capabilities to power agents at scale with Google's Agentic Data Cloud"
    "link": "https://cloud.google.com/blog/products/databases/whats-new-across-googles-agentic-data-cloud/"
    "published": "2026-11-04 23:00:00"
    "fetched": "2026-11-05 01:51:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Not long ago, we were entering the agentic era; today, organizations are deriving significant value from running agents in production. The opportunity to capture new revenue streams, improve efficiency, and manage risk makes reimagining operations with agents top of mind for enterprise leaders.</span></p>\n<p><span style=\"vertical-align: baseline;\">That is why we built the </span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\"> — a System of Action designed to activate all your data by breaking down walled gardens, deliver high accuracy and trust, and operate proactively at low cost. Leading organizations such as </span><strong style=\"vertical-align: baseline;\">PayPal, Siemens, Telus, Vodafone, Walmart,</strong><span style=\"vertical-align: baseline;\"> and more are already achieving business impact with us today. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we’re sharing key updates to Google’s Agentic Data Cloud. We’re empowering your agents everywhere, grounding them in your enterprise context to deliver accurate, trusted answers, and providing elevated agentic-first experiences for both practitioners and business users.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Activate all your data for agents with the borderless Lakehouse</span></h3>\n<p><span style=\"vertical-align: baseline;\">Enterprise data lives everywhere — across multi-cloud environments, on-premises systems, and SaaS platforms like Confluent, SAP, Salesforce, and Workday. The </span><a href=\"https://cloud.google.com/products/lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">borderless Lakehouse</span></a><span style=\"vertical-align: baseline;\">, built on the open Apache Iceberg format, lets you activate all of your data, wherever it lives, so that your agents have one governed foundation. Instead of moving data, stitching together connectors, or paying surprise variable egress fees, you get a stack tuned at every layer, from the infrastructure to the model. In fact, Apache Iceberg data under management has more than tripled over the past year. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are announcing several new enhancements for the borderless Lakehouse. </span><strong style=\"vertical-align: baseline;\">Gemini now works </strong><a href=\"https://cloud.google.com/blog/products/data-analytics/borderless-lakehouse-integrates-with-gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">directly on your borderless Lakehouse</strong></a><span style=\"vertical-align: baseline;\"> allowing business users to use natural language to query records that live across clouds while agents ground their reasoning and drive business workflows. With </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-cross-cloud-data-access\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">cross-cloud interconnect and caching for AWS and Azure</strong></a><span style=\"vertical-align: baseline;\">, now generally available, you can query data across clouds with a private, secure connection and zero variable egress fees. And when you query remote cloud data, Lakehouse automatically caches retrieved data blocks locally within Google Cloud. Additionally, customers can use the open Iceberg catalog federation with Databricks Unity, Snowflake Horizon, and AWS Glue as well as zero-copy integrations with SAP, Workday, and Salesforce.</span></p>\n<p><span style=\"vertical-align: baseline;\">To deliver context for AI, the </span><strong style=\"vertical-align: baseline;\">borderless Lakehouse integrates directly with Knowledge Catalog</strong><span style=\"vertical-align: baseline;\">, to automatically index your distributed and unstructured data, in cloud storage, giving agents the right context to be accurate, while controlling token costs for an intelligent and sustainable agentic strategy</span><span style=\"vertical-align: baseline;\">. </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"By implementing the borderless Lakehouse that federates single-copy Apache Iceberg data from Amazon S3 tables to BigQuery, Delivery Hero's talabat reduced data-movement costs by approximately 40% while making streaming transactional events queryable across both clouds within minutes of production.\"</span><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">-</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Harish Ramesh, Staff Data Engineer, Delivery Hero talabat</strong></p>\n<p><span style=\"vertical-align: baseline;\">To take action in the moment, agents need simultaneous access to both your historical analytical data, and real-time transactional data. That’s why today we're announcing new </span><a href=\"https://cloud.google.com/products/alloydb\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB</strong></a><strong style=\"vertical-align: baseline;\"> integrations with the borderless Lakehouse</strong><span style=\"vertical-align: baseline;\">. With </span><a href=\"https://cloud.google.com/blog/products/databases/direct-iceberg-access-in-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">direct Iceberg access in AlloyDB</span></a><span style=\"vertical-align: baseline;\">, you can now directly query Iceberg tables stored in cloud storage, without any ETL pipelines or copies, and join live operational data with historical lakehouse data in a single PostgreSQL query. By combining AlloyDB's transactional capabilities with direct Iceberg table access, systems can efficiently bridge transactional and analytical data to meet rigorous demands from agents. It is fully integrated with the </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse runtime catalog</span></a><span style=\"vertical-align: baseline;\">, allowing you to register Iceberg tables in AlloyDB alongside the rest of your tables. Everything automatically shows up in Knowledge Catalog — so your agents get the same governed context. AlloyDB direct Iceberg access is up to 7x faster on aggregation queries than Amazon’s comparable PostgreSQL-compatible service.</span></p>\n<p><span style=\"vertical-align: baseline;\">And completing this borderless strategy, </span><a href=\"https://cloud.google.com/products/spanner/omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Omni</span></a><span style=\"vertical-align: baseline;\">, which is generally available, brings Google-grade consistency, scale, and multi-model capabilities to hybrid agentic applications across on premises, edge nodes, and multi-cloud environments.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Deliver accurate, trusted answers by grounding every agent in enterprise context</span></h3>\n<p><span style=\"vertical-align: baseline;\">Agents are only as accurate as the business context they are grounded in.</span> <a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> is Google Cloud’s universal context engine that turns raw data into shared business context for agents to answer and act with higher accuracy, trust, and token efficiency. Today, we’re taking Knowledge Catalog to the next level</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">by extending our AI-driven context curation capabilities with</span><strong style=\"vertical-align: baseline;\"> self-learning, reusable context sets, and a reimagined user experience </strong><span style=\"vertical-align: baseline;\">so your context layer is built and evolved automatically with your business while keeping humans in full control of their data governance. Based on our internal benchmarks, Knowledge Catalog makes AI agents nearly 4x more accurate, with up to 33% lower latency, and using up to 75% fewer tokens.</span></p>\n<p><span style=\"vertical-align: baseline;\">Much of an enterprise’s institutional knowledge lives outside their databases in operational playbooks, documents, and tickets, and context for agents must be curated around the questions people actually ask. With the new </span><a href=\"https://cloud.google.com/blog/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">self-learning enrichment</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">in Knowledge Catalog, available in preview, agents take on the heavy lifting of context curation. Knowledge Catalog learns from user intent and every human and agent interaction by continuously mining unstructured sources like Google Workspace, GitHub, Jira, Confluence, and SharePoint to close context gaps and evolve context automatically. It also packages domain knowledge into reusable </span><a href=\"https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Knowledge Format </span></a><span style=\"vertical-align: baseline;\">(OKF) context sets, allowing context engineers and data stewards to govern this enriched context effortlessly. For data stewards and data teams, we also introduced, a </span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">new studio experience in Knowledge Catalog</strong></a><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">in preview, which provides a conversational user interface where you can explore context in natural language, visualize your entire data estate across cloud environments and SaaS applications, and review, audit, and approve proposed enrichment updates with full versioning and rollback.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4-Navigating the context graph visually in Knowledge Studio\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4-Navigating_the_context_graph_visually_in_Knowledge_Studio_OFTQhZt.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>New studio experience in Knowledge Catalog showcasing conversational context exploration and an interactive graph</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Additionally, we announced that </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805#:~:text=Knowledge%20Catalog%3A,ensure%20factual%20responses.\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog is now on by default in Gemini</strong></a><span style=\"vertical-align: baseline;\">, in preview. Every data question is now grounded </span><span style=\"vertical-align: baseline;\">in a governed</span><span style=\"vertical-align: baseline;\"> business context automatically. When you connect BigQuery, AlloyDB, Cloud SQL, or Spanner, Knowledge Catalog resolves business terms, locates trusted tables, and determines join paths before generating SQL — under each user’s own access permissions. This gives organizations the confidence to deploy agents at enterprise scale because your agents draw from shared, registered context sets for consistent accuracy, lower latency, and reduced token costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, because critical business definitions cannot be left to an LLM’s guesswork, Knowledge Catalog </span><a href=\"https://cloud.google.com/blog/products/data-analytics/expanded-semantic-model-support-in-knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">grounds agents in trusted semantic models</span></a><span style=\"vertical-align: baseline;\">, now generally available, from BigQuery, Looker (LookML), Databricks, Snowflake, dbt, and SAP, without moving data. Whether an agent is calculating net revenue for finance or customer churn for operations, it applies the exact same governed formulas your business teams rely on. Knowledge Catalog also extends metadata discovery and federation to Oracle AI Database@Google Cloud, Snowflake, Databricks Unity Catalog, and third-party catalogs like Atlan and Collibra — building on the catalog investments you’ve already made so your entire data estate is universally understood by every agent.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Transforming practitioner experiences with agents</span></h3>\n<p><span style=\"vertical-align: baseline;\">We are reimagining how data professionals and business teams work — elevating practitioners from individual contributors supported by co-assistants, into orchestrators of autonomous agents that drive intent-driven business outcomes. </span></p>\n<p><span style=\"vertical-align: baseline;\">For both technical teams and everyday business users, we introduced two new purpose-built capabilities in Gemini, at the recent </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini at Work</span></a><span style=\"vertical-align: baseline;\"> event. For Data and ML engineers, we are extending Gemini with machine learning skills and tools that back every data scientist and data engineer with a team of agents. Engineers describe the outcome they want in plain language, and Gemini generates PySpark code, provides notebooks to edit and test it, trains models, and troubleshoots and fixes pipeline issues on its own. And for business users, anyone in your organization can generate reliable, real-time operational reports simply by asking. Gemini uses operational reporting skills integrated with BigQuery and the Knowledge Catalog to construct and save the query. Once saved, teams can run reports on demand without incurring token costs, guaranteeing consistent, verified answers every time.</span></p>\n<p><span style=\"vertical-align: baseline;\">Now, for developers who'd rather stay in their own tools, we recently announced the general availability of the </span><a href=\"https://cloud.google.com/blog/products/data-analytics/data-agent-kit-brings-data-skills-and-tools-to-your-ide-or-cli\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\">. It eliminates console hopping and ETL boilerplate by integrating Google Data Cloud tools directly into your developers' preferred IDEs and CLIs — like VS Code, Claude Code, and Antigravity. Armed with native MCP tooling, practitioners define business intent and let agents generate, tune, and test data pipelines.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Engineering a data infrastructure built for agent scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">As organizations scale to millions of agents collaborating across workflows, traditional database architectures break down. We’re introducing tailored infrastructure engineered specifically for agent scale. </span></p>\n<p><span style=\"vertical-align: baseline;\">To accelerate rapid testing and prototyping, today we’re announcing </span><a href=\"https://cloud.google.com/blog/products/databases/introducing-alloydb-express-for-rapid-testing-and-prototyping\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Express</strong></a><strong style=\"vertical-align: baseline;\">, in preview. </strong><span style=\"vertical-align: baseline;\">This is a new edition of AlloyDB designed for builders and coding agents who need extreme development velocity. It offers sub-2-second instant provisioning, scale-to-zero pause and resume, secure private IP connectivity, integrated observability, and a small footprint with 1–2 vCPUs and 20GB of storage. AlloyDB now provides a developer-first, PostgreSQL environment for agent development and testing.</span></p>\n<p><span style=\"vertical-align: baseline;\">For production environments, we recently announced </span><a href=\"https://cloud.google.com/blog/products/databases/announcing-postgresql-for-agents-in-alloydb\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">PostgreSQL for agents in AlloyDB</strong></a><strong style=\"vertical-align: baseline;\">, in preview,</strong><span style=\"vertical-align: baseline;\"> which enables thousands of collaborating AI agents to query live transactional data with complete workload isolation. With the </span><a href=\"https://cloud.google.com/blog/products/databases/alloydbs-agentic-database-architecture\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agentic database architecture</span></a><span style=\"vertical-align: baseline;\">, agents achieve sub-millisecond I/O, and terabit-per-second aggregated scan throughput, supporting over 3 million queries per second. Compute scales automatically based on active reasoning sessions and scales back to zero when idle without affecting production systems.</span></p>\n<p><span style=\"vertical-align: baseline;\">For running open-source data infrastructure, </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> extends its price-performance advantage compared to market alternatives by over 3x through further improvements to Lightning Engine. Recent enhancements for </span><a href=\"https://spark.apache.org/releases/spark-release-4-0-0.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spark 4.0</span></a><span style=\"vertical-align: baseline;\"> include faster startup at no additional cost, beneficial for interactive workloads and small batch ETL jobs. In addition, the </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/tiers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">premium tier</span></a><span style=\"vertical-align: baseline;\"> provides performance boosts by pairing upgraded hardware with software acceleration from the Lightning Engine, and this is on by default. </span></p>\n<p><span style=\"vertical-align: baseline;\">Finally, we’ve continued to enhance </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> for agent scale. In the past year alone, we've made queries over 40% faster while cutting query processing cost by more than 50% through intelligent optimizations like fluid scaling and built-in workload acceleration. </span><a href=\"https://docs.cloud.google.com/bigquery/docs/graph-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</strong></a><span style=\"vertical-align: baseline;\"> is now generally available, bringing petabyte-scale graph analytics directly on relational tables with zero ETL. It allows organizations to model data as nodes and edges to uncover complex, hidden relationships without moving data into a separate graph database. And today, two new models from Google Research run natively in BigQuery. The first is </span><a href=\"https://research.google/blog/timesfm-3-a-zero-shot-foundation-model-for-multivariate-forecasting/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TimesFM 3.0</span></a><span style=\"vertical-align: baseline;\">, now in preview, which lets you generate forecasts directly in SQL with no custom models to train or manage and </span><a href=\"https://research.google/blog/introducing-tabfm-a-zero-shot-foundation-model-for-tabular-data/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TabFM</span></a><span style=\"vertical-align: baseline;\">, also now in preview, which brings predictive machine learning directly into BigQuery. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">In addition to these announcements, we continue to enhance core performance, cost management, and operational resilience across our broader data ecosystem.</span></p>\n<p><span style=\"vertical-align: baseline;\">Ready to transform your data estate into an active System of Action? Explore our </span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\"> page, </span><a href=\"https://cloud.google.com/resources/offers/data-strategy-workshop\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sign up for a Data Strategy Workshop</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/free\"><span style=\"text-decoration: underline; vertical-align: baseline;\">start building</span></a><span style=\"vertical-align: baseline;\"> your agentic enterprise, at no cost, with Google Cloud.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can also head over to our </span><a href=\"https://cloudonair.withgoogle.com/events/trusted-agents-real-outcomes-agentic-data-cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Trusted Agents, Real Outcomes</span></a><span style=\"vertical-align: baseline;\"> digital event to catch our Agentic Data Cloud vision and the latest innovations. See the portfolio in action, learn from Yahoo’s real-world blueprint, and unpack deep-dive sessions with product leaders across Databases, Data Analytics, and BI. </span></p></div>"
  "7071fb3f86f5307816a9fd1ad41f0ec0":
    "id": "7071fb3f86f5307816a9fd1ad41f0ec0"
    "title": "AlloyDB Express: Instant, scale-to-zero PostgreSQL for developers and coding agents"
    "link": "https://cloud.google.com/blog/products/databases/introducing-alloydb-express-for-rapid-testing-and-prototyping/"
    "published": "2026-11-04 23:00:00"
    "fetched": "2026-11-05 01:51:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Databases have struggled to keep up with the speed of AI-enabled software development. Across the engineering and platform teams we talk to, we see coding agents stalled by slow database provisioning, CI/CD test pipelines bottlenecked by complexity, and internal apps hitting a wall as they transition from sandbox to production. Until now, no PostgreSQL service in the market has combined agent-ready capabilities with uncompromised enterprise security and scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">To solve this, we are excited to announce the preview of </span><strong style=\"vertical-align: baseline;\">AlloyDB Express</strong><span style=\"vertical-align: baseline;\">, a new offering of </span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> designed specifically for developers and AI coding agents. Capable of spinning up in seconds and automatically pausing when idle, it helps bridge the gap between rapid, AI-driven development and robust enterprise infrastructure.The result is a highly secure, cost-effective database environment that accelerates how you build applications and can easily grow to production scale. Get started with the free tier and pay only for what you use. </span></p>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Express is an agent-ready database that gives you:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Database creation in under two seconds:</strong><span style=\"vertical-align: baseline;\"> Create a ready-to-use PostgreSQL database in under two seconds using </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> CLI, REST API, MCP, Terraform or Console.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale-to-zero:</strong><span style=\"vertical-align: baseline;\"> Your database automatically pauses after 15 minutes of inactivity so you do not incur costs for compute while it is idle. When a new query arrives, it wakes up automatically in seconds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise-ready with built-in AI and security:</strong><span style=\"vertical-align: baseline;\"> Access enterprise AI capabilities including vector, text, and hybrid search to quickly build AI applications, all protected by built-in enterprise security guardrails.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start for free and pay only for what you use:</strong><span style=\"vertical-align: baseline;\"> Get started with our free monthly allowance and as you scale, pay only for what you use.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">One-click upgrade to production scale:</strong><span style=\"vertical-align: baseline;\"> When your app is ready for production, upgrade your existing database to AlloyDB in one click—keeping data, schemas, users, and connection strings intact while gaining enterprise high availability (HA), read replicas, and disaster recovery (DR).</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Accelerate development without compromising security</span></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Express combines self-service speed with built-in enterprise security. For app builders and coding agents this means you can instantly provision fully isolated PostgreSQL databases without manual setup, allowing every test and prototype to run in its own dedicated database. And for platform and security administrators you define IAM, network, and organization policies centrally once, and every AlloyDB Express database created by a developer or coding agent automatically stays within your company's security guardrails.</span></p>\n<p><span style=\"vertical-align: baseline;\">Whether code is written by developers or AI agents, security remains enforced through built-in protection mechanisms which:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Minimize exposure with safe default connections:</strong><span style=\"vertical-align: baseline;\"> Keep your data hidden from the public internet using public DNS endpoints that mask IP addresses and block incoming traffic until explicitly allowed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Secure internal integrations via private VPC networking: </strong><span style=\"vertical-align: baseline;\">Safely connect your internal workloads using Private Service Connect (PSC) or private DNS.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enforce least privilege with granular access controls: </strong><span style=\"vertical-align: baseline;\">Confidently restrict agent and user permissions utilizing Google Cloud IAM, VPC Service Controls, and native PostgreSQL roles.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">AlloyDB Express brings built-in AI capabilities</span></h3>\n<p><span style=\"vertical-align: baseline;\">Unlike databases that rely on external vector stores or complex setups, AlloyDB Express embeds enterprise AI tools directly into your database, so you can focus on building features.  You can accelerate your AI application development, with tools like:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fast vector search (</strong><strong style=\"vertical-align: baseline;\">pgvector</strong><strong style=\"vertical-align: baseline;\"> HNSW and Google’s </strong><strong style=\"vertical-align: baseline;\">ScaNN</strong><strong style=\"vertical-align: baseline;\"> index):</strong><span style=\"vertical-align: baseline;\"> Store and search vector embeddings alongside your operational data for semantic search, recommendation engines, and agent memory (RAG) — without syncing data to a separate vector database.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct access to Gemini models within SQL queries:</strong><span style=\"vertical-align: baseline;\"> Generate text or image embeddings on the fly and run semantic filtering, ranking, and summarization (</span><code style=\"vertical-align: baseline;\">ai.if</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">ai.rank</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\">) directly inside standard </span><code style=\"vertical-align: baseline;\">SELECT</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">INSERT</code><span style=\"vertical-align: baseline;\"> statements.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Natural language-to-SQL generation:</strong><span style=\"vertical-align: baseline;\"> Let developers and AI agents ask questions in plain English to generate, run, and refine queries in seconds using built-in AlloyDB Studio and natural language APIs.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Start with the free tier and pay only for what you use</span></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Express offers simple intuitive pricing and scales to zero when inactive. Data stays safe, and the database wakes up instantly when a new query arrives.Here is a short summary of our pricing:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Active compute:</strong><span style=\"vertical-align: baseline;\"> $0.115 per Compute Unit hour (CU-hr), billed by the second.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Paused compute:</strong><span style=\"vertical-align: baseline;\"> $0.00 per hour when idle for more than 15 mins.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Used storage:</strong><span style=\"vertical-align: baseline;\"> $0.30 per GB-month, billed only for the disk space your data actually uses.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">In addition, Google Cloud offers a free tier, making it easier to get started with 50 free CUs every month. For more details see the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/express-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Express pricing</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Express is available today in preview. Try it in the</span> <a href=\"http://console.cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a><span style=\"vertical-align: baseline;\"> or read the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/express-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Express documentation page</span></a><span style=\"vertical-align: baseline;\"> for more details on how to get started.</span></p></div>"
  "972780114547885826a6b97f5c9c5a26":
    "id": "972780114547885826a6b97f5c9c5a26"
    "title": "Unify operational and Lakehouse data with direct Iceberg access in AlloyDB for PostgreSQL"
    "link": "https://cloud.google.com/blog/products/databases/direct-iceberg-access-in-alloydb/"
    "published": "2026-11-04 23:00:00"
    "fetched": "2026-11-05 01:51:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To make good business decisions, you need two kinds of data: the live state of the business from operational databases, and the historical context stored in an analytical system such as a lakehouse or a data warehouse. Traditionally, those systems have been separate, but they are now converging rapidly. That’s why today, we're announcing direct Iceberg access in </span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\">, in preview. Now, developers can query Apache Iceberg tables stored in a cloud storage bucket directly from AlloyDB and join them with live operational data, all in a single SQL query.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition, we’re announcing the general availability of </span><a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB sync</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-real-time-data-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse federation</span></a><span style=\"vertical-align: baseline;\">. Together, they give AlloyDB three ways to work with the borderless Lakehouse, which keeps one open copy of your data available to any engine. </span><a href=\"https://cloud.google.com/customers/etsy-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Etsy</span></a><span style=\"vertical-align: baseline;\">, for example, unified three petabytes with the borderless Lakehouse, joining data in place to accelerate pipeline queries by 60%. With AlloyDB, which approach to use depends on where the data lives and how your application reads it:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct Iceberg access:</strong><span style=\"vertical-align: baseline;\"> Read Iceberg tables in place, accelerated by the AlloyDB columnar engine.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB sync:</strong><span style=\"vertical-align: baseline;\"> Serve lakehouse data from AlloyDB for your most latency-sensitive workloads, refreshed on a schedule you set.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lakehouse federation:</strong><span style=\"vertical-align: baseline;\"> Query native BigQuery tables in place, with BigQuery doing the processing.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">With this launch, apps and  agents can act on operational and lakehouse data together without building or managing custom pipelines.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/AlloyDB.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AlloyDB and the borderless Lakehouse: Query Apache Iceberg and BigQuery data in place or sync it to AlloyDB, giving real-time applications and AI agents governed access to operational and lakehouse data together.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Decisions at the moment of action</span></h3>\n<p><span style=\"vertical-align: baseline;\">With these integrations between AlloyDB and the borderless Lakehouse, historical context sits next to live transactions, so decisions can happen at the moment of action, without building or managing custom pipelines. For example:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fraud and risk:</strong><span style=\"vertical-align: baseline;\"> Before approving a payment, a fraud agent checks it against five years of customer transaction history in Iceberg, in addition to the last 30 days in the database.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Personalization:</strong><span style=\"vertical-align: baseline;\"> A shopping agent joins the live cart with lifetime value and return history in the lakehouse to choose the right offer while the shopper is still on the page.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dynamic pricing:</strong><span style=\"vertical-align: baseline;\"> A pricing agent combines live inventory in AlloyDB with years of demand and weather history in the lakehouse to adjust prices as conditions change.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data products:</strong><span style=\"vertical-align: baseline;\"> A data team publishes curated tables once to Iceberg, and then dozens of applications read them in place instead of each maintaining its own copy.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">In each case, the history stays in the lakehouse and the decision happens in the database. Agents act on your behalf using only the tables and permissions you grant them in AlloyDB.</span></p>\n<p><span style=\"vertical-align: baseline;\">Let’s take a deeper look at each of the three integrations.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Direct Iceberg access in AlloyDB (Preview)</span></h3>\n<p><span style=\"vertical-align: baseline;\">With direct Iceberg access, AlloyDB reads Apache Iceberg tables directly from Cloud Storage, using either a bucket path or the Lakehouse runtime catalog. You register an Iceberg table once and query it like any other PostgreSQL table, including joins with live operational tables.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Register five years of transaction history stored as Iceberg\\r\\nCREATE TABLE transaction_history (\\r\\n  customer_id BIGINT, category TEXT, amount NUMERIC, ts TIMESTAMPTZ)\\r\\nUSING iceberg\\r\\nWITH (uri = &#x27;gs://my-bucket/warehouse/payments/transaction_history&#x27;);\\r\\n\\r\\n\\r\\n-- Compare the payment in flight with the customer&#x27;s history\\r\\nSELECT t.amount,\\r\\n       AVG(h.amount) AS usual_spend,\\r\\n       MAX(h.amount) AS largest_past_purchase\\r\\nFROM recent_transactions t                -- live, in AlloyDB\\r\\nJOIN transaction_history h                -- five years, in Iceberg\\r\\n  ON h.customer_id = t.customer_id AND h.category = t.category\\r\\nWHERE t.transaction_id = &#x27;TX-1001&#x27;\\r\\nGROUP BY t.amount;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f41f3452cd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">AlloyDB reads Iceberg tables in place and joins them with live operational data, using the same copy as the rest of your lakehouse.</span></p>\n<p><span style=\"vertical-align: baseline;\">Iceberg support is built into AlloyDB and is accelerated by the </span><a href=\"https://docs.cloud.google.com/alloydb/docs/columnar-engine/about\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB columnar engine</span></a><span style=\"vertical-align: baseline;\">, so queries over lakehouse data are fast. They run on the same database instance as your application, without a separate reader instance to manage, and they read the latest data your team has published to the lakehouse.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our testing on a 1 TB dataset in Cloud Storage, AlloyDB direct Iceberg access is </span><strong style=\"vertical-align: baseline;\">up to 7x faster</strong><span style=\"vertical-align: baseline;\"> on aggregation queries than Amazon's comparable PostgreSQL-compatible service, and </span><strong style=\"vertical-align: baseline;\">up to 3.5x faster</strong><span style=\"vertical-align: baseline;\"> on aggregation queries than the open-source PostgreSQL extension.</span></p>\n<h3><span style=\"vertical-align: baseline;\">AlloyDB sync for the lowest-latency reads (GA)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Not every table needs to be read in place. A retail merchant risk score, for example, is checked before every payment but only changes when the data team recomputes it overnight. Data like this, read on every request and refreshed on a schedule, is fastest as a local table in AlloyDB. The challenge is keeping that copy fresh without building and maintaining a pipeline.</span></p>\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB sync</span></a><span style=\"vertical-align: baseline;\"> copies lakehouse data from BigQuery into AlloyDB, once or on a schedule, and keeps it refreshed. The copy is a local AlloyDB table, so your app reads it as fast as any other table, and you can index it, serve it from read pools, or use it with the columnar engine and vector search. You can start a sync with one click from the BigQuery console or from SQL:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Keep merchant risk scores refreshed every hour\\r\\nSELECT alloydb_sync.create_bq_sync_table(\\r\\n  &#x27;my-project.risk.merchant_risk_scores&#x27;,\\r\\n  &#x27;merchant_risk_scores&#x27;,\\r\\n  INTERVAL &#x27;1 hour&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f41f3452d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Lakehouse federation (GA)</span></h3>\n<p><span style=\"vertical-align: baseline;\">For organizations with years of analytical history already in BigQuery, </span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-real-time-data-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse federation</span></a><span style=\"vertical-align: baseline;\"> lets AlloyDB query native BigQuery tables in place and join them with live operational data in a single query. AlloyDB pushes filters, aggregations, and limits down to BigQuery, which does most of the processing and sends back only the results. You can also set which project is billed for these queries and restrict which roles can use them.</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud customers like Loyal Guru are already pairing AlloyDB and BigQuery in this way. </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"AlloyDB, along with other Google Cloud products like BigQuery, provides the agility and performance needed to continually enhance our platform's capabilities and help us anticipate emerging trends rather than merely reacting.\"</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Javi Fernández, Co-founder &amp; CTO, Loyal Guru</strong><span style=\"vertical-align: baseline;\"> </span></p>\n<h3><span style=\"vertical-align: baseline;\">Choose the right approach and get started</span></h3>\n<p><span style=\"vertical-align: baseline;\">The convergence of operational and analytical systems is underway; how you choose to approach it in  a Google Cloud environment depends on your use case:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct Iceberg access:</strong><span style=\"vertical-align: baseline;\"> Best for historical data in Iceberg that your app joins with live data, accelerated by the AlloyDB columnar engine.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Try it:</strong><span style=\"vertical-align: baseline;\"> Enable direct Iceberg access on a PostgreSQL 18 instance and follow: </span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-iceberg-data-from-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Access Iceberg data from AlloyDB</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB sync: </strong><span style=\"vertical-align: baseline;\">Best for tables your app reads constantly and needs at the lowest latency. The copy is as fresh as its last refresh.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Build:</strong><span style=\"vertical-align: baseline;\"> Pick a table in BigQuery and choose to </span><a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sync to AlloyDB</span></a><span style=\"vertical-align: baseline;\"> using the Google Cloud console or psql. </span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lakehouse federation:</strong><span style=\"vertical-align: baseline;\"> Best for history that lives in native BigQuery tables, processed by BigQuery.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Start: </strong><span style=\"vertical-align: baseline;\">Follow</span><a href=\"https://cloud.google.com/alloydb/docs/configure-access-real-time-data\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Configure AlloyDB access to real-time data in BigQuery</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Read </span><a href=\"https://docs.cloud.google.com/alloydb/docs/choose-access-bigquery-data-from-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Choose how to access BigQuery data from AlloyDB</span></a><span style=\"vertical-align: baseline;\"> to learn more.</span></p></div>"
  "65715cc895a8d2926b16922ec2a8bd30":
    "id": "65715cc895a8d2926b16922ec2a8bd30"
    "title": "Chrome Enterprise Premium drives 50%+ projected cost reduction for Mercari"
    "link": "https://cloud.google.com/blog/products/chrome-enterprise/chrome-enterprise-premium-drives-50-projected-cost-reduction-for-mercari/"
    "published": "2026-11-04 18:00:00"
    "fetched": "2026-11-05 01:51:16"
    "summary": "<div class=\"block-paragraph\"><p><i>Editor's Note: Today's post is by Yu Susaki, Manager of Enterprise Security at</i> <a href=\"https://www.mercari.com/\" target=\"_blank\"><i>Mercari</i></a><i>, a leading consumer-to-consumer (C2C) marketplace with more than 20 million monthly active users.</i> <a href=\"https://www.mercari.com/\" target=\"_blank\"><i>Mercari</i></a><i> selected</i> <a href=\"https://chromeenterprise.google/products/chrome-enterprise-premium/\" target=\"_blank\"><i>Chrome Enterprise Premium</i></a><i> and</i> <a href=\"https://www.google.com/intl/en_us/chromebook/discover-chromebook/\" target=\"_blank\"><i>Chromebooks</i></a><i> to secure its highly sensitive customer service (CS) environment. Handling personally identifiable information (PII) on a daily basis, Mercari required a security strategy that could protect its data while addressing the operational inefficiencies and high costs of its legacy Virtual Desktop Infrastructure (VDI). With a customer service environment largely driven by strategic partners, Mercari needed a scalable solution to empower agents to work securely and seamlessly while implementing safeguards to protect against data loss.</i></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Gemini_Generated_Image_flcbtsflcbtsflcb\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Gemini_Generated_Image_flcbtsflcbtsflcb.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>Flexibility and security with one secure enterprise browser</b></p><p>Previously, our customer service environment relied on a mix of legacy devices routed through VDI. This created operational friction, a frustrating user experience, increased IT overhead, and required managing overlapping DLP controls on both the VDI and local environments to prevent potential data transfer between the two. To simplify our architecture, we decided to shift focus from OS-level isolation to browser-layer data control, introducing Chrome Enterprise Premium and Chromebooks to a partner environment to establish data control and boundaries based on user actions.</p><p>By leveraging Chrome Enterprise Premium, our team configured strict DLP rules, implementing controls to restrict users from pasting or uploading files to destinations outside of Mercari's approved business tools. This helps protect sensitive company data from being leaked or fed into unapproved channels. We knew investing in Chrome Enterprise Premium would help enable AI-powered productivity while restricting data leaks to unsanctioned AI tools. The transition was smooth because our workforce was already using the Chrome Enterprise browser across the company prior to the security upgrade. Because employees were able to continue using the browser interface they were already accustomed to, the implementation of the new security solution was easier and resulted in strong user adoption. By implementing these policy controls, we could confidently adopt new AI capabilities while ensuring enterprise data boundaries are strictly enforced.</p><p>Beyond DLP, transitioning to this new architecture dramatically streamlined IT operations and reduced costs. With zero-touch enrollment, IT no longer needs to manually set up individual devices before handing them to users. Furthermore, by reducing dependency on VDI and consolidating various security agents (like legacy DLP, MDM, and EDR), we project a cost reduction of more than 50% over a three-year period within this environment, covering device costs, VDI running costs, and security licenses.</p><p>Additionally, this browser-centric model eliminates the heavy operational overhead and specialized engineering resources traditionally required just to maintain a complex VDI infrastructure, allowing us to redirect valuable IT talent to higher-priority initiatives.</p><p>Implementing Chrome Enterprise Premium and ChromeOS enabled a zero-trust, device-based approach that protects data, slashes IT costs, and measurably improves security. We eliminated VDI friction, lowered costs, and strictly enforced data boundaries—ultimately making Chrome Enterprise Premium the right move to deeply protect our marketplace and users.</p><p>Looking ahead, we are set up as an AI-forward organization that wants its employees to benefit from new technologies, like agentic browsers, but in a highly controlled environment. To achieve this, we leveraged the power of Chrome Enterprise Premium. As a first step, we are using browser policies to enable a safe, read-only adoption of Gemini in Chrome. Employees can now leverage multi-page context and seamless side-panel interactions without manual copy-pasting, which drastically reduces the risk of unintended actions like data modification. Looking forward, we plan to continuously explore the optimal balance between AI productivity and security. By dynamically utilizing both existing and upcoming enterprise security features alongside Chrome Enterprise Premium’s robust DLP, we will ensure data boundaries evolve proactively, empowering our workforce to innovate safely.</p></div>"
