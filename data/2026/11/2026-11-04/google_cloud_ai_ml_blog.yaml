    "title": "How Nammu21 automates syndicated loans on Google Cloud Universal Ledger"
    "link": "https://cloud.google.com/blog/topics/financial-services/how-nammu21-automates-syndicated-loans-on-google-cloud-universal-ledger/"
    "published": "2026-11-04 03:00:00"
    "fetched": "2026-11-04 06:30:15"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The syndicated loan and private credit markets, both critical components of corporate finance, have long been constrained by manual processes, leading to multi-week settlements, valuation opacity, and trade friction. </span></p>\n<p><span style=\"vertical-align: baseline;\">To solve these long-standing challenges, fintech innovator </span><a href=\"https://www.nammu21.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Nammu21</span></a><span style=\"vertical-align: baseline;\"> partnered with Google Cloud on a new proof-of-concept. Using its AI-powered platform to structure legal agreements and instantiate them as smart contracts on the </span><a href=\"https://docs.cloud.google.com/universal-ledger\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Universal Ledger (GCUL)</span></a><span style=\"vertical-align: baseline;\">, Nammu21 automates the entire loan lifecycle, paving the way for improved settlement times and greater market efficiency.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Digitizing the loan market</span></h2>\n<p><span style=\"vertical-align: baseline;\">While loan markets provide billions in capital to businesses worldwide, their underlying infrastructure has not kept pace with the speed of digital finance. This landscape requires continuous coordination across facility agents, borrowers, and diverse lender syndicates, while also managing highly customized credit agreements with dynamic tranches and complex covenants. </span></p>\n<p><span style=\"vertical-align: baseline;\">In particular, relying on fragmented, manual interpretation of legal text often results in significant operational drag and data silos. According to the </span><a href=\"https://blog.lma.eu.com/challenging-the-timeline-issue-no-4/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Loan Market Association</span></a><span style=\"vertical-align: baseline;\">, secondary market settlement times for par/near par loans in Q4 2024 still averaged 42 days, with a median of 27 days. These notoriously slow timelines tie up capital, increase counterparty risk, and create a heavy reconciliation burden for participants.</span></p>\n<p><span style=\"vertical-align: baseline;\">Nammu21 transforms bespoke credit documents into programmable assets at scale by rendering each facility's governing terms as a Digital Credit Instrument (DCI). The DCI maps every term — including conditions, consents, eligibility criteria, and operational mechanics that determine what is permitted under a facility — directly back to its originating legal provision. These elements are then expressed as executable behaviours against a loan's live state. </span></p>\n<p><span style=\"vertical-align: baseline;\">To instantiate these instruments, the proof-of-concept utilizes the secure, high-performance execution environment of GCUL, an institutional-grade, permissioned distributed ledger that helps automate complex financial workflows to deliver near-instant transaction finality and predictable costs without the volatility or security concerns of public blockchains.</span></p>\n<h2><span style=\"vertical-align: baseline;\">A purpose-built stack for digital credit</span></h2>\n<p><span style=\"vertical-align: baseline;\">Combined with Nammu21’s data intelligence, GCUL provides the foundational infrastructure for converting legal document logic into live, programmable contracts. Designed to handle the privacy, scale, and multi-party coordination required by institutional finance, GCUL provides a permissioned, high-performance distributed ledger that delivers deterministic, instant transaction finality for high-value financial settlements.</span></p>\n<p><span style=\"vertical-align: baseline;\">Programmable contracts on GCUL are written in </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\">, GCUL's domain-optimized programming language. As a strict, statically-typed subset of Python, </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> is designed to be safe, readable, and auditable, making it ideal for processing complex financial logic.</span></p>\n<p><span style=\"vertical-align: baseline;\">For regulated financial institutions, </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> offers distinct operational advantages over other ledger programming models. The language simplifies development by removing the need for complex memory management or workarounds to meet highly restrictive call stack limits, allowing engineers to focus on the financial logic itself. </span></p>\n<p><span style=\"vertical-align: baseline;\">GCUL also provides robust, built-in permissioning, requiring explicit user authorization before a contract can store data on their behalf. This solves the \"unsolicited asset\" problem — common on public networks — where unwanted tokens can be sent to an organization's wallet, creating compliance and accounting issues. With GCUL, institutions can maintain full control over which assets they interact with to support their high-value, highly regulated use cases.</span></p>\n<p><span style=\"vertical-align: baseline;\">Nammu21 serves a dual role in this architecture. First, the platform renders the DCI programmatically from the original legal agreement without manual document reading to establish the terms. Next, it derives </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> contracts that define the structure of the obligation and govern the loan on GCUL, using the DCI to supply the terms that determine what the loan documents permit, require and block.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Technical architecture: The loan lifecycle on GCUL</span></h2>\n<p><span style=\"vertical-align: baseline;\">Nammu21’s loan implementation on GCUL demonstrates the value of creating a single, immutable source of truth. The proof-of-concept modeled a $1.945 billion Term Loan B — one segment of a broader multi-facility transaction — where the agent bank, borrower, transferor, and transferee all worked off a permissioned view of the same on-ledger rendering.</span></p>\n<p><span style=\"vertical-align: baseline;\">The lifecycle begins when an agent bank selects a specific credit agreement transformed by Nammu21. The platform instantly provides the structured terms from the document, which are used to instantiate a unique </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> contract on GCUL, establishing a verifiable, on-ledger digital twin of that specific loan facility.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-facility-tokenization\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1-facility-tokenization.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, the agent bank initiates the onboarding of the borrower and lenders. This multilateral action requires that each participant review the request and then provide explicit consent by approving the onboarding invitation from their own interface. Once all parties are onboarded, the agent bank records an immutable hash of the loan's key terms on-ledger, attesting that the on-ledger data matches the canonical off-ledger records.</span></p>\n<p><span style=\"vertical-align: baseline;\">Subsequent lifecycle events, such as secondary market transfers or repayments, are also managed as multi-step, automated workflows governed by a consent-driven model. For example, a transfer of a loan position requires new lender, borrower, and agent bank consent  before it can be executed atomically on the ledger. All payment flows, from interest payments to loan close-outs, settle directly on GCUL using tokenized commercial bank money, eliminating the need for external payment rails.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-assignment-transfer-legend\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-assignment-transfer-legend.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Transacting with familiar, regulated money on a programmable ledger provides an architecture purpose-built for institutional finance, grounded in three core pillars:</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Compliance via gated execution: </strong><span style=\"vertical-align: baseline;\">Nammu21’s </span><code style=\"vertical-align: baseline;\">gculpy</code><span style=\"vertical-align: baseline;\"> contracts instantiated with governing terms, validate every action against the terms transformed from the agreement before execution, mitigating potential covenant breaches or invalid transfers upfront while eliminating the risk of silent failures. </span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">Role-based privacy:</strong><span style=\"vertical-align: baseline;\"> GCUL enforces strict, role-based access, ensuring that trading strategies, positions, and sensitive loan data remain confidential and are visible only to the necessary counterparties in a transaction.</span></p>\n<p><span style=\"vertical-align: baseline;\">3. </span><strong style=\"vertical-align: baseline;\">Settlement finality: </strong><span style=\"vertical-align: baseline;\">Every on-ledger action completes near-instantly and anchors on canonical data derived from the original credit agreement, replacing provisional, reconciliation-heavy models with real-time, trusted verification.</span></p>\n<h2><span style=\"vertical-align: baseline;\">The business impact of moving on-ledger</span></h2>\n<p><span style=\"vertical-align: baseline;\">This proof-of-concept illustrates a structural shift in how credit markets can operate. When each facility's governing terms are rendered as a DCI and executed on GCUL, the operational mechanics of lending markets change fundamentally, rather than incrementally. </span></p>\n<p><span style=\"vertical-align: baseline;\">Values can be reconciled bilaterally, but governance logic cannot – and the market’s current friction stems directly from each party's independent interpretation of the rules. Resolving this issue on-ledger is what enables settlement times to compress, back-office overhead to shrink, and counterparty risk to be mitigated by design rather than by manual checking. </span></p>\n<p><span style=\"vertical-align: baseline;\">This same architecture can be applied wherever credit terms are bespoke and manually interpreted. By freeing up capital that would otherwise be trapped in lengthy settlement cycles, new liquidity is unlocked and a more dynamic and efficient secondary loan market can emerge.</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">The team would also like to thank Someera Khokhar, Jordan Shelley, and Saskia A. Aalders at Nammu21 and Googlers Ishan Singh, Kathryn Stavish, Tom Chudy, and Stathis Onasoglou for their contributions.</span></sup></p></div>"
