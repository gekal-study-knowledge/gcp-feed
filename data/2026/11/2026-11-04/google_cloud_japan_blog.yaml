    "title": "Gemini Robotics Embodied Reasoning 2 が Google Cloud で利用可能に"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-robotics-embodied-reasoning-2-is-now-available-on-google-cloud/"
    "published": "2026-11-04 11:00:00"
    "fetched": "2026-11-04 10:54:17"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 28 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-robotics-embodied-reasoning-2-is-now-available-on-google-cloud?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">今年に入って、Google は </span><a href=\"https://deepmind.google/blog/gemini-robotics-2-brings-whole-body-intelligence-to-robots/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Robotics 2</span></a><span style=\"vertical-align: baseline;\"> を発表しました。これは、ロボットが現実世界で自ら考え、行動し、適応することを可能にする次世代のインテリジェンス レイヤです。このブレークスルーの中核を担うのが、</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-2/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Robotics Embodied Reasoning 2</strong></a><strong style=\"vertical-align: baseline;\">（ER 2）</strong><span style=\"vertical-align: baseline;\">です。これは、ロボットの高度な頭脳として機能する特化型 Gemini モデルです。Gemini Robotics ER 2 は、固定アームから等身大ヒューマノイドまで、あらゆる形態のロボットに対応します。高度な時空間の動画理解、長期的な計画能力、組み込みのセーフティ ガードレールを組み合わせることで、これを実現しています。これにより、ロボットは人間と自然に会話する、低レベルのアクション モデルやハードウェア API をオーケストレートする、数百もの意思決定を伴う数分間のタスクを実行する、複数のロボットチーム間で連携する、といったことが可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Google はこの最先端のエンボディド推論モデルを企業の本番環境向けに提供開始します。</span><strong style=\"vertical-align: baseline;\">Gemini Robotics ER 2 は、Gemini プラットフォームにて公開プレビュー版としてご利用いただけます。</strong><span style=\"vertical-align: baseline;\">これにより組織は、Google DeepMind による最新のロボット向け</span><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-2/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エンボディド推論モデル</span></a><span style=\"vertical-align: baseline;\">と、Google Cloud のエンタープライズ グレードのセキュリティ、マルチエージェント オーケストレーション、エンドツーエンドのライフサイクル管理を初めて組み合わせて活用できるようになります。安全で適応性の高い物理 AI のシミュレーション、評価、大規模なデプロイがかつてないほど容易になります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ ロボティクス向け物理エージェントの強化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Robotics ER 2 は、ロボットを物理エージェントへと進化させます。このモデルは、高度な時空間推論と長期的な計画能力を組み合わせることで、ロボットがタスクを完了するための手順をオーケストレートし、自己修正を行い、未知の状況にも適応できるようにします。エージェント環境を構築するために、開発者は視覚言語行動（VLA）モデルやナビゲーション API といった低レイヤの制御インターフェースをツールとして宣言し、マルチモーダルな動画、音声、テキストをモデルに直接ストリーミングできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ロボットの開発および運用を行う企業にとっての主なメリットは以下のとおりです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. 実作業タスクの検証、理解、自己修正</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現場での実作業において、ロボットは次のステップへ進む前に、前のステップが実際に成功したかどうかを把握する必要があります。Gemini Robotics ER 2 は、連続する映像フィードをリアルタイムで推論処理することで、未知の状況や初めて直面する状況にもその場で柔軟に適応します。このモデルの主な機能は以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">タスクの進捗状況をバイナリ ステータス、離散カテゴリ、または連続スコアに分類します。これにより、リアルタイムの状況認識精度が向上し、ワークフロー全体をやり直すことなく、失敗したステップのみをその場で調整およびイテレーションできるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">重要なイベントが発生した正確な動画フレーム（液体を注ぐのを止めるタイミングなど）を、91.3% の精度および 0.96 秒の平均絶対フレーム距離で特定します。多くの大規模モデルと比較して 4 倍の実行速度を誇り、計算コストもごくわずかに抑えられます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Visual Question Answering や計器の読み取りをはじめ、Google の核となる空間推論能力をさらに向上させます。たとえば、円形ダイヤル、サイトグラス、デジタル ディスプレイ、リニアスケール、定規、液体温度計など、10 種類以上の計器カテゴリの値を視覚情報から直接読み取り、解釈できます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">2. あらゆる形態のロボットを支える、単一のインテリジェンス レイヤ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Robotics ER 2 は、多種多様な形状やサイズのロボットをオーケストレートし、固定アームや車輪付きローバーから四足歩行ロボット、より複雑な形態にいたるまで、そのインテリジェンスを自在に拡張します。また、マルチロボットの連携も実現します。異なる種類のロボット同士が作業空間のセマンティックな理解を共有し、役割分担やタスクの引き継ぎを行うことで、1 台のロボットでは不可能な高度なワークフローも完遂できるようになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">3. エージェント型ツールのオーケストレーションと自然言語インタラクション</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Robotics ER 2 は、次に何を行うかを考えながら、同時にアクションをオーケストレートします。開発者は、VLA モデル、ナビゲーション API、カスタム関数といった下位レベルの制御インターフェースをツールとして宣言することで、シミュレーション、実機制御、遠隔操作全体でシームレスに利用できます。Gemini Robotics ER 2 は、自然言語による指示からナビゲーション API やマニピュレーター制御 API を直接オーケストレートできます。これにより、ロボットがアクションの実行中に自らのアプローチを口頭で説明したり、オペレーターが専門用語を使わずに指示を変更したりできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">4. Google Cloud で安全かつ適応性に優れた物理エージェントを構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">開発者やエンタープライズ チームは、Gemini プラットフォーム上で物理エージェントのシミュレーション、オーケストレーション、管理を行います。構築されたエージェントは、Google Cloud のスケーラブルなインフラストラクチャを活用し、エッジ上の実機ロボットへ直接デプロイして実行されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高速シミュレーション: </strong><span style=\"vertical-align: baseline;\">MuJoCo-Warp や NVIDIA Isaac Sim などの使い慣れた環境でシミュレーションを行い、実機を操作する前にロボットの動作をテストできます。その後、Gemini プラットフォーム上でマルチモーダル モデルを活用して合成シナリオを生成し、ワークセルの画像データへ自動でラベル付けを行います。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スマートなトレーニング</strong><span style=\"vertical-align: baseline;\">: Gemini Robotics ER 2 の空間ポインティング、モーメント検出、進捗分類機能を活用し、Cloud Storage や BigQuery 内のデモ動画のキュレーションとラベル付けを行います。その後、Gemini プラットフォーム、GKE、または Cluster Director を介して、カスタムの VLA モデルをトレーニングします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">容易な運用: </strong><span style=\"vertical-align: baseline;\">エンタープライズ向けの IAM、セキュリティ制御、組み込みの関数呼び出し機能を備えた Gemini プラットフォーム上に、Gemini Robotics ER 2 のワークフローをデプロイできます。Google Distributed Cloud を活用して、SLAM や経路計画といったレイテンシに敏感なローカル ワークロードを工場の現場側にオフロードし、フリートのテレメトリー データを BigQuery へシームレスにストリーミングします。アーキテクチャの詳細は、</span><a href=\"https://cloud.google.com/solutions/physical-ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Physical AI ソリューション</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Gemini プラットフォームで Gemini Robotics ER 2 を使用して構築しているお客様の事例</strong></h4>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「AIVI-Learning を利用するお客様は毎月飛躍的に増えており、Gemini Robotics ER 2 はそこにさらなる価値を提供してくれます。映像によって、検査のあり方そのものが一変します。Spot は単に「ある一時点の見た目に問題がないか」を点検するだけにとどまりません。映像に AI モデルを適用できるようになったことで、まったく新しい可能性の領域が広がります。」</span></p>\n<p><strong style=\"vertical-align: baseline;\">Boston Dynamics</strong><span style=\"vertical-align: baseline;\">、Spot 担当バイス プレジデント兼ゼネラル マネージャー、Marco da Silva 氏</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「DeepReach AI は、物理 AI を現実世界で動作させるためのスキルエンジンです。当社のハードウェアと AI プラットフォームは、世界中の熟練した人々の作業データを収集し、モデル トレーニングを加速させるデータ フライホイールに変換します。Gemini Robotics ER 2 は、すべての録画データからタスクを正確に理解してくれるため、最も重要なデータをより迅速かつ圧倒的なスケールで特定できるようになりました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">DeepReach</strong><span style=\"vertical-align: baseline;\">、共同創業者 / CTO、Chris Liu 氏</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「高度な推論モデルは、ロボットが複雑な環境を解釈し、行動を計画し、変化する状況に適応することを可能にし、物理 AI の新たな可能性を切り拓きます。Google の Gemini Robotics ER 2 モデルは、まさにこの方向性に向けた重要な一歩となるものです。Google と協力し、こうした新たな機能が次世代のロボット コンピューティング プラットフォームをどのように構築していけるのかを探求できることを、大変嬉しく思っています。」</span></p>\n<p><strong style=\"vertical-align: baseline;\">Arm</strong><span style=\"vertical-align: baseline;\">、Arm Total Design for Physical AI 担当シニア ディレクター、Barrie Mullins 氏</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「私たちが目指しているのは、材料の研究開発ワークフローを加速させ、研究者がより多くのアイデアをよりスピーディに検証できるようにすることです。現在のラボ自動化のほとんどは、単一の独立したタスクしかこなせない固定的なスクリプトに依存しています。Gemini Robotics ER 2 を活用することで、ロボットに視覚的および物理的な柔軟性がもたらされ、既存のインフラストラクチャとスムーズに連携できるようになります。たとえば、API のない旧型のマイクロ波反応器のタッチスクリーンを読み取ったり、遠心分離機のバランスを考慮してサンプルをセットしたり、人の行き交う混雑したラボ内でサンプルを安全に搬送したりすることが可能です。これが、私たちが目指す次のレベルです。これにより、合成から分離に至る一連の実験プロセス全体を実行できる自律型ラボの実現に大きく近づきます。その結果、研究者は新材料の発見に向けた新しいアイデアの創出に一段と集中できるようになります。」</span></p>\n<p><strong style=\"vertical-align: baseline;\">ASTAR Institute of Materials Research and Engineering（ASTAR IMRE）</strong><span style=\"vertical-align: baseline;\">エグゼクティブ ディレクター兼 MARVEL-AI エグゼクティブ ディレクター、Loh Xian Jun 教授</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini プラットフォームで Gemini Robotics ER 2 の利用を開始する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">開発者やエンタープライズ チームは、Gemini プラットフォームの Model Garden を通じて、Gemini Robotics ER 2 のパブリック プレビュー版による構築を今すぐ開始できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini プラットフォームで構築する:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/gemini-robotics-er?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Robotics-ER 2 のドキュメント</span></a><span style=\"vertical-align: baseline;\">と</span><a href=\"https://cloud.google.com/model-garden/pricing?e=48754805&amp;hl=ja#gemini-robotics\"><span style=\"text-decoration: underline; vertical-align: baseline;\">料金</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デベロッパー ガイドを確認する:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://ai.google.dev/gemini-api/docs/robotics-overview\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini API Robotics のドキュメント</span></a><span style=\"vertical-align: baseline;\">で、サンプルコードと双方向ストリーミング ガイドをご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">研究発表を読む:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-robotics-er-2/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google DeepMind Gemini Robotics ER 2 の発表</span></a><span style=\"vertical-align: baseline;\">で、ベンチマークや安全性に関する技術レポートをご覧ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud の物理 AI を探索する:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/solutions/physical-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">cloud.google.com/solutions/physical-ai</span></a><span style=\"vertical-align: baseline;\"> と </span><a href=\"http://cloud.google.com/ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">cloud.google.com/ai</span></a><span style=\"vertical-align: baseline;\"> にアクセスして、Google Cloud インフラストラクチャがシミュレーション、トレーニング、デプロイをどのようにサポートしているかをご確認ください。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Deepmind Robotics、バイス プレジデント兼責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Carolina Parada</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">応用 AI ブラックベルト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Adrian Jones</strong></p></div>"
