    "summary": "<h2 class=\"release-note-product-title\">Cloud Load Balancing</h2>\n<h3>Feature</h3>\n<p>Distributed tracing with Cloud Trace is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a> for\nGlobal external Application Load Balancers, Regional external Application Load Balancers,\nRegional internal Application Load Balancers, and Cross-region internal Application Load Balancers. Attach a\ntelemetry policy to a load balancer's forwarding rule to generate trace spans\nthat conform to W3C Trace Context and OpenTelemetry, and get end-to-end\nvisibility into requests from clients through the load balancer to your\nbackends. For more information, see\n<a href=\"https://docs.cloud.google.com/load-balancing/docs/distributed-tracing-overview\">Distributed tracing overview</a>.</p>\n<h3>Feature</h3>\n<p>For mutual TLS (mTLS) on Application Load Balancers,\nfrontend mTLS validation relaxations are <strong>generally available</strong>.</p>\n<p>The <code>ALLOW_VALIDATION_RELAXATIONS</code> client validation mode on the\nClient Authentication (<code>ServerTlsPolicy</code>) resource allows you to\nconfigure specific X.509 certificate validation exceptions to\nstandard client certificate validation rules.\nThis simplifies migrations of legacy workloads while\nmaintaining an active security posture.</p>\n<p>This mode supports the following client certificate validation relaxation\nparameters:</p>\n<ul>\n<li><p><code>ALLOW_MISSING_EKU</code>: Bypasses Extended Key Usage validation if the EKU\nextension is absent in the client certificate.</p></li>\n<li><p><code>ALLOW_SHA1_HASHING</code>: Permits client certificates signed with the legacy\nSHA-1 algorithm.</p></li>\n<li><p><code>ALLOW_EXPIRED_LEAF_CERTIFICATE</code>: Evaluates expired leaf certificates by\nvalidating them as of 1 second prior to their actual expiration time.</p></li>\n</ul>\n<p>This feature is available for all Application Load Balancer types.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/load-balancing/docs/mtls#client-validation-mode\">Client validation modes</a>.</p>\n<h2 class=\"release-note-product-title\">Datastream</h2>\n<h3>Feature</h3>\n<p>Datastream is now available in the <code>africa-south1</code> (Johannesburg)\nregion. For the list of all available regions, see\n<a href=\"https://docs.cloud.google.com/datastream/docs/ip-allowlists-and-regions\">IP allowlists and regions</a>.</p>\n<h3>Feature</h3>\n<p>Datastream is now available in the <code>asia-southeast3</code> (Bangkok)\nregion. For the list of all available regions, see\n<a href=\"https://docs.cloud.google.com/datastream/docs/ip-allowlists-and-regions\">IP allowlists and regions</a>.</p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>Support for template-specific exclusion rules in streaming sanitization\n(<code>StreamSanitizeUserPrompt</code> and <code>StreamSanitizeModelResponse</code>) is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>. You can use\ndictionary and regular expression exclusion rules in buffered mode\n(<code>STREAMING_MODE_BUFFERED</code>) with partial or full matching, and in real-time mode\n(<code>STREAMING_MODE_REALTIME</code>) with partial matching, to mitigate false-positive\ndetections for prompt injection and jailbreak detection and responsible AI\nfilters.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/configure-exclusion-rules#exclusion-rules-streaming\">Exclusion rules in streaming\nsanitization</a>.</p>\n<h2 class=\"release-note-product-title\">Oracle Database@Google Cloud</h2>\n<h3>Feature</h3>\n<p>Oracle Database@Google Cloud supports creating custom DNS domains for your ODB Networks. You can use custom Domain Name Systems (DNS) to control the names of your resources and delegate DNS resolution within your organization. For more information, see <a href=\"https://docs.cloud.google.com/oracle/database/docs/create-manage-custom-dns\">Create and manage custom DNS domains</a>.</p>\n<p>You can use custom DNS domains only for <a href=\"https://docs.cloud.google.com/oracle/database/docs/create-clusters\">Exadata VM clusters</a>.</p>\n<p>This feature is <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>.</p>"
