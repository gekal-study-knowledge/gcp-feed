"entries":
  "8ffb5dae4b56f44dbc684064327a7721":
    "id": "8ffb5dae4b56f44dbc684064327a7721"
    "title": "The Rise of LLMJacking: How Threat Actors Monetize Compromised Cloud and Model Resources"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models/"
    "published": "2026-11-02 23:00:00"
    "fetched": "2026-11-03 02:50:29"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Written by: </span><span>Christopher Romano, Codi Starks, Garrett Mahoney, John Wolfram, Josh Murchie, K Singh, Mathew Potaczek, Mike Lombardi, Rik Dolfing</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Introduction</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Mandiant responded to multiple incidents in 2026 in which threat actors hijacked enterprise access to Large Language Models (LLMs), a tactic known as \"LLMJacking.\" Spanning a variety of cloud and LLM providers, these intrusions impacted organizations in North America, South America, and Asia Pacific across the financial services, retail, technology, and transportation sectors. </span></p>\n<p><span style=\"vertical-align: baseline;\">Unlike the gradual resource consumption associated with cryptojacking, LLMJacking can generate large spikes in fraudulent cloud charges in a matter of hours. Across individual incidents, we observed fraudulent charges associated with resource consumption exceeding $100,000 USD in a single day, with cumulative charges at some organizations reaching $1 million USD before access was revoked.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Usage chart showing LLMJacking generating a spike in API requests\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_Usage_chart_showing_LLMJacking_ge.max-1000x1000_IcanCpV.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: Usage chart showing LLMJacking generating a spike in API requests</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Analyzing the criminal ecosystem behind these frontline compromises, and building upon </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"text-decoration: underline; vertical-align: baseline;\">previous reporting</span></a><span style=\"vertical-align: baseline;\"> on the growing underground market for LLM credentials, Google Threat Intelligence Group (GTIG) has identified a diverse set of financially motivated threat clusters operating out of multiple regions globally.</span></p>\n<p><span style=\"vertical-align: baseline;\">As the LLMJacking ecosystem matures, we are also tracking a division of labor between threat actors establishing initial access to compromised environments and operators managing downstream monetization infrastructure, known as “LLM Mixers”. LLM Mixers function as illicit routing gateways that proxy, aggregate, and resell unauthorized LLM access to underground subscribers. In one investigation, GTIG observed two distinct operational clusters coordinating to compromise and monetize enterprise LLM infrastructure, demonstrating the sophisticated specialization emerging in this space.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this blog post, we describe the attack lifecycle observed across recent LLMJacking investigations and provide actionable detection, hardening, and remediation guidance to help organizations secure their infrastructure. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Initial Access</span></h3>\n<p><span style=\"vertical-align: baseline;\">While low-level resource theft has involved the </span><a href=\"https://www.cio.com/article/4155404/ai-token-freeloaders-are-coming-for-your-customer-support-chatbot.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">manipulation of customer support chatbots</span></a><span style=\"vertical-align: baseline;\"> to conduct unauthorized tasks like code generation, threat actors conducting LLMJacking bypass these front-end interfaces to target backend model resources directly. Specifically, they focus on either identifying publicly exposed LLM endpoints or obtaining valid LLM application programming interface (API) keys. An example of the latter can be seen in Figure 1, where a threat actor uses an automated script to verify exposure by calling the </span><code style=\"vertical-align: baseline;\">/api/create</code><span style=\"vertical-align: baseline;\"> endpoint to independently run their own models on endpoints that unsuspecting users have left publicly accessible. Leaving these services unprotected not only expands an organization's traditional attack surface, but could also introduce a significant increase in hosting costs. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Threat Actor tests publicly exposed Ollama endpoints and attempts to register their own models\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_Threat_Actor_tests_publicly_expos.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: Threat Actor tests publicly exposed Ollama endpoints and attempts to register their own models</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Across multiple LLMJacking investigations, however, the dominant initial access vector has been exposed or stolen cloud identity tokens—including IAM credentials, Service Account keys, GitHub Personal Access Tokens (PATs), and active session tokens—which threat actors leverage to establish an initial foothold into target organizations' infrastructure.</span></p>\n<p><span style=\"vertical-align: baseline;\">For instance, in mid-2026 UNC6993 compromised a cloud instance through a misconfigured Service Account key and used this access to grant further access to an LLM API. UNC6993 also hosted a session hijacking page masquerading as an application portal to join a group of LLM users. This page tricks users into navigating to the legitimate LLM service website, and pasting their raw JSON payload containing an active access token, which was then posted to the backend  API to bypass password and multifactor authentication (MFA) controls.</span></p>\n<p><span style=\"vertical-align: baseline;\">In another instance, one threat actor gained initial entry by combining a stolen Personal Access Token (PAT) to access private code repositories with the exploitation of a suspected web application vulnerability in a package running within a containerized cloud environment. Similarly, a different threat actor leveraged compromised IAM credentials of corporate users, using cloud federation tokens to programmatically generate fresh access keys to circumvent MFA requirements. In a separate incident, a threat actor was first observed accessing the environment with a compromised cloud Service Account key with broad project permissions.</span></p>\n<p><span style=\"vertical-align: baseline;\">Beyond general cloud identity credentials, threat actors also target LLM API keys. For example, a threat actor opportunistically harvested exposed corporate LLM API keys from public GitHub repositories. Demonstrating advanced evasion tradecraft, the group conducted automated credential validation sweeps using minimal single-token requests (</span><code style=\"vertical-align: baseline;\">max_tokens=1</code><span style=\"vertical-align: baseline;\">). This allowed the threat actor to stealthily confirm the viability of the stolen keys while remaining undetected by the victim’s endpoint detection and response (EDR) and SIEM volume anomaly alerts.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Lateral Movement and Persistence</span></h3>\n<p><span style=\"vertical-align: baseline;\">After gaining an initial foothold, threat actors systematically work to escalate privileges, solidify access, and conduct internal reconnaissance to identify targets and further cloud credentials.</span></p>\n<p><span style=\"vertical-align: baseline;\">To expand their access, threat actors enumerated cloud services, code repositories, and data stores for sensitive credentials. In one intrusion, a threat actor conducted internal reconnaissance across multiple cloud regions to map available services and identity policies. In a separate intrusion, a threat actor compromised a containerized cloud environment. Once inside, they performed extensive repository reconnaissance, cloning sensitive codebases to search for hardcoded secrets, configuration variables, and developer credentials. They also scanned access logs to identify credentials for secondary cloud environments. Threat actors also executed targeted database queries to harvest additional credentials; in one case, the threat actor queried cloud data warehouse metadata tables to search for database credentials, administrator passwords, and sensitive columns, alongside performing cloud object storage operations associated with targeted data theft.</span></p>\n<p><span style=\"vertical-align: baseline;\">Across intrusions, we observed threat actors abusing cloud identity permissions and virtual machine configurations to escalate privileges and maintain persistent access. Utilizing service accounts associated with compromised workloads, one threat actor exploited token-creation privileges to generate temporary credentials for high-privilege service accounts, resulting in the exfiltration of infrastructure credentials, internal database passwords, and third-party API keys from cloud secret managers. Other threat actors established persistence by creating unauthorized IAM and service accounts and injecting SSH keys into compute instances. Specifically, one actor escalated privileges by attaching administrative policies to service roles, created unauthorized IAM accounts with full administrative rights, and established interactive management sessions into running virtual machines to inject unauthorized SSH public keys into host configuration files. Similarly, another threat actor created deceptive backdoor service accounts disguised as internal billing optimization utilities and injected environment-wide SSH keys into compute instance metadata.</span></p>\n<p><span style=\"vertical-align: baseline;\">Beyond exploiting traditional cloud infrastructure permissions, we have observed instances of threat actors targeting vulnerabilities specifically within LLM routing software to escalate privileges. In one case, after acquiring pre-validated Virtual Keys from the threat actor that established initial access, a follow-on cluster executed targeted application logic exploitation against the victim's LiteLLM gateway. The actor exploited a user ID rebind vulnerability in the </span><span style=\"vertical-align: baseline;\">/key/regenerate</span><span style=\"vertical-align: baseline;\"> endpoint (CVE-2026-40217) to elevate standard Virtual Keys into full </span><span style=\"vertical-align: baseline;\">PROXY_ADMIN</span><span style=\"vertical-align: baseline;\"> master administrative credentials, establishing deep, persistent control over the compromised environment.</span></p>\n<h3><span style=\"vertical-align: baseline;\">LLM Abuse</span></h3>\n<p><span style=\"vertical-align: baseline;\">The ultimate objective of LLMJacking is the monetization and resource-hijacking of foundation models, which actors achieve through token proxying, automated model streaming, and GPU hardware provisioning.</span></p>\n<p><span style=\"vertical-align: baseline;\">Threat actors frequently enabled a variety of managed generative platforms, and created additional API keys to scale their operations. Upon acquiring LLM API access keys, UNC6993 attempted to generate additional API keys and enable associated services within victim cloud projects, quickly accumulating over $100,000 USD in billing charges. Another threat actor subscribed victim accounts to Pay-As-You-Go agreements, selecting premium foundation models and launching high-volume inference streams. To bypass rate limits, the threat actor deployed a \"burn and rotate\" strategy, continuously creating and deleting short-lived service accounts while auditing the cloud provider’s billing interface to monitor financial impact.</span></p>\n<p><span style=\"vertical-align: baseline;\">Threat actors also leveraged their access to host their own proxy endpoints and agentic workloads. For example, one threat actor enabled agents, deployed publicly accessible reverse proxies, and used custom Node.js proxy bundles to expose endpoints compatible with multiple frontier LLMs rebranded under a persona known as </span><code style=\"vertical-align: baseline;\">D1337-KAIROS</code><span style=\"vertical-align: baseline;\">. The actor deployed a containerized backdoor using the </span><a href=\"https://manus.im\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Manus</span></a><span style=\"vertical-align: baseline;\"> agent framework to the compromised cloud environment, which queried an upstream LLM to reason through instructions and execute resulting commands locally, supported by </span><a href=\"https://github.com/searxng/searxng\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SearXNG</span></a><span style=\"vertical-align: baseline;\"> metasearch and </span><a href=\"https://github.com/agent-infra/sandbox\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agent-infra/sandbox</span></a><span style=\"vertical-align: baseline;\"> execution environments. To scale compute, the threat actor provisioned compute instances with powerful GPUs, attempted to spin up high-end hardware across multiple regions, and requested quota increases via the cloud provider’s API. The actor also hosted</span><a href=\"https://github.com/BerriAI/litellm\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">LiteLLM</span></a><span style=\"vertical-align: baseline;\"> gateways on external servers to manage and route API traffic.</span></p>\n<p><span style=\"vertical-align: baseline;\">Rather than consuming hijacked compute solely for their own operations, GTIG observed evidence of threat actors monetizing compromised API quotas by selling access to these resources through LLM Mixers. The threat actors used open-source API gateways and custom relay infrastructure to pool stolen credentials, meter usage, and obscure the origin of the requests. For example, UNC6993 used open-source tools such as </span><a href=\"https://github.com/QuantumNous/new-api\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">new-api</span></a><span style=\"vertical-align: baseline;\"> (a centralized model hub and gateway) and </span><a href=\"https://github.com/su-kaka/gcli2api\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gcli2api</span></a><span style=\"vertical-align: baseline;\"> (an API proxy tool converting command line interface (CLI) tools into standard frontier model endpoints), likely to aggregate stolen keys and balance request loads across accounts. We believe the threat actor sells access to these tools via underground storefronts.</span></p>\n<p><span style=\"vertical-align: baseline;\">Another threat actor that executed more than 500,000 LLM API calls in less than eight hours leveraged stolen third-party API keys to power the token routing service</span><code style=\"vertical-align: baseline;\"> jet-night.com</code><span style=\"vertical-align: baseline;\">. Jet Night passed nearly one million dollars in token costs to the victim organization. Given Jet Night’s per-token costs to users are so far below typical market rates GTIG believes the service relies on stolen keys to operate profitably. For example, Jet Night offers an unlimited token plan for approximately $60 USD per month with alleged access to frontier models, a consumer service level that would typically run between $100 and $250 per month. Moreover, the service has advertised multiple outages on its public Telegram channel which is likely due to stolen keys being revoked as victims discover their respective compromises.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Screenshot of Jet Night Plans and Pricing Structure\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3_Screenshot_of_Jet_Night_Plans_and.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Screenshot of Jet Night Plans and Pricing Structure</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A threat actor deployed custom proxy relay infrastructure (</span><code style=\"vertical-align: baseline;\">ai-relay</code><span style=\"vertical-align: baseline;\">) hosted on deceptive lookalike domains. For example, they registered a domain </span><span style=\"vertical-align: baseline;\">to masquerade as the victim's legitimate internal host. This custom relay infrastructure was used to seamlessly siphon high-value commercial LLM access into the illicit </span><code style=\"vertical-align: baseline;\">newapi[.]pro</code><span style=\"vertical-align: baseline;\"> resale ecosystem, directly draining the victim's corporate account quotas to serve their underground customers.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Outlook</span></h3>\n<p><span style=\"vertical-align: baseline;\">GTIG expects that threat actors will increasingly prioritize LLMJacking over traditional resource theft like cryptojacking, driven by the immediate, high-margin monetization enabled by emerging underground LLM Mixers. As enterprises integrate higher-tier models and agentic workflows into production environments, cybercriminals will likely refine automated reconnaissance to target exposed API tokens and exploit vulnerabilities in model routing middleware. This operational specialization will sustain a growing illicit resale marketplace, allowing threat actors to rapidly siphon enterprise quotas while passing the billing costs to victims before compromises are detected.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Detection and Hunting</span></h3>\n<p><span style=\"vertical-align: baseline;\">In the event that security measures have failed, it is critical that defenders have early visibility into abuse of cloud LLM platforms. Defenders should prioritize detection of modifications to LLM accounts and services and treat any unauthorized enablement as a critical security event. In multiple incidents that Mandiant investigated, LLM services were not enabled at the time of compromise. Abuse of access keys allowed the threat actor to modify and enable LLM API services (e.g. Bedrock, Gemini API, etc.). Once enabled, the threat actor can use the APIs to generate massive bills to the organization in just minutes or hours. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Google Security Operations</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google Security Operations customers have access to these broad category rules and more under the Cloud Threats, Mandiant Frontline Threats, Mandiant Hunting Rules rule packs. The activity discussed in the blog post is detected in Google SecOps under the rule names:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS Account Key Creation</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS Create New Access Key</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS Create User Account</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS Delete User Account</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Base64 Encoded Shell Command Execution</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Create and Delete Firewall in Default Network</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GCE Project SSH Keys</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GCP Service Account Key Creation</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GCP Create New Service Account</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GCP Firewall Rule Created</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Linux Archive Exfiltration via Curl or Wget</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Persistence: Compute Set Instance or Project Metadata Startup Scripts or URLs</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Mitigation and Remediation</span></h3>\n<p><span style=\"vertical-align: baseline;\">To prevent attackers from abusing Cloud LLM services, defenders should prioritize Identity and Access Management (IAM) and supply chain security, two of the most common pathways for gaining access to and abusing Cloud services. </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Credential Hygiene</strong><span style=\"vertical-align: baseline;\">: Utilize a centralized secrets management platform to control the management and rotation of sensitive keys and secrets. Automation of secrets and keys can limit the lifespan of leaked credentials. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Least Privilege</strong><span style=\"vertical-align: baseline;\">: Ensure users and service accounts only possess the permissions necessary for their specific role and required tasks. Deny all permissions that are not explicitly required, including access to Cloud LLM services. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Code Monitoring</strong><span style=\"vertical-align: baseline;\">: Automate secret scanning within codebases (GitHub, Gitlab, etc.) to ensure API keys and secrets added to source code are identified and removed promptly. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Routine Configuration Audits</strong><span style=\"vertical-align: baseline;\">: Perform periodic comprehensive configuration audits of Cloud services to identify potential attack paths and unintended exposure of endpoints. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Rate Limiting</strong><span style=\"vertical-align: baseline;\">: Implement a WAF like Google’s Cloud Armor to enforce rate limiting for individual client connections.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Network Allow Listing</strong><span style=\"vertical-align: baseline;\">: Restrict outbound connections from Cloud services via VPC firewall rules to known IP addresses where feasible.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Budget Alerts</strong><span style=\"vertical-align: baseline;\">: Implement granular API quotas on LLM services to limit request volume per model. Utilize spending caps to set budgets and avoid over-spending.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Multi-Factor Authentication (MFA):</strong><span style=\"vertical-align: baseline;\"> Enforce phishing-resistant multi-factor authentication across all cloud identity providers, management consoles, and developer platforms to ensure that stolen credentials or session tokens cannot be easily exploited.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Shadow LLM Discovery:</strong><span style=\"vertical-align: baseline;\"> Utilize Security Posture Management tools to automatically scan your hybrid cloud environments and identify unauthorized or unmonitored tools, models, and infrastructure, ensuring complete visibility of your model footprint.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Granular API Key Scopes: </strong><span style=\"vertical-align: baseline;\">Restrict and segment API keys by specific model endpoints, environments (dev/prod), and usage limits to ensure a compromised token for a basic utility model cannot be used to invoke expensive, high-tier frontier models.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Validation Sweep Monitoring:</strong><span style=\"vertical-align: baseline;\"> Monitor model gateway and API access logs for anomalous, low-volume requests (such as </span><code style=\"vertical-align: baseline;\">max_tokens=1</code><span style=\"vertical-align: baseline;\"> or zero-temperature pings). Attackers frequently use these micro-transactions for stealthy credential validation sweeps prior to launching large-scale infrastructure abuse.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Vulnerability &amp; ML Supply Chain Patching: </strong><span style=\"vertical-align: baseline;\">Integrate automated vulnerability scanning (SAST/DAST/SCA) across your custom application code, containerized workloads, and machine learning dependencies (like PyTorch and Hugging Face libraries) to prevent initial access via unpatched server vulnerabilities.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gateway Patch Management:</strong><span style=\"vertical-align: baseline;\"> Extend vulnerability management programs to include centralized model proxy and routing  gateways (e.g., LiteLLM), ensuring rapid patching against privilege escalation and authentication bypass flaws (such as CVE-2026-40217).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sandboxed Execution for Dynamic Workloads:</strong><span style=\"vertical-align: baseline;\"> Isolate the runtime environment in highly virtualized, process-isolated, serverless sandboxes if your LLM application is required to execute generated code or database queries dynamically.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Vetted Model Repositories: </strong><span style=\"vertical-align: baseline;\">Restrict and enforce model pulls and pipeline dependencies solely from trusted internal registries or approved enterprise catalogs to prevent developers from pulling compromised models containing pre-configured backdoors.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Graph-Based Exposure Modeling: </strong><span style=\"vertical-align: baseline;\">Implement continuous, graph-based risk prioritization that maps cloud assets, application code, and data flows to automatically identify and remediate complex, multi-hop attack paths.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Adversarial Exposure Validation:</strong><span style=\"vertical-align: baseline;\"> Deploy automated offensive agents to continuously test external attack surfaces, uncover exposed endpoints, and simulate credential validation sweeps.</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Monitoring Native Cloud Audit Logs </span></h4>\n<ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AWS</strong><span style=\"vertical-align: baseline;\">: Monitor CloudTrail logs for API events from </span><code style=\"vertical-align: baseline;\">bedrock.amazonaws.com</code><span style=\"vertical-align: baseline;\">. Based on historical LLM Jacking incidents, monitor for the following API operations across the attack lifecycle:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resource Exploitation</strong><span style=\"vertical-align: baseline;\">: Monitor for direct execution of the LLM via the </span><code style=\"vertical-align: baseline;\">Converse</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">InvokeModel,</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">InvokeModelWithResponseStream</code><span style=\"vertical-align: baseline;\"> API operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">API Throttling &amp; Error Spikes: </strong><span style=\"vertical-align: baseline;\">Monitor for high-volume spikes in </span><code style=\"vertical-align: baseline;\">ThrottlingException</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">ValidationException</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">ResourceNotFoundException</code><span style=\"vertical-align: baseline;\"> errors, which could indicate an automated “spraying” methodology targeting cloud infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Target Scoping</strong><span style=\"vertical-align: baseline;\">: Monitor potential reconnaissance activity used to discover available models via the </span><code style=\"vertical-align: baseline;\">ListFoundationModels,ListInferenceProfiles</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">GetFoundationModelAvailability</code><span style=\"vertical-align: baseline;\"> operations. Additionally, monitor for attempts to unlock new models in the environment via the </span><code style=\"vertical-align: baseline;\">PutUseCaseForModelAccess</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">CreateFoundationModelAgreement</code><span style=\"vertical-align: baseline;\"> API operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Security/Evasion</strong><span style=\"vertical-align: baseline;\">: Review attempts to view, alter, or disable logging configurations to conceal prompt contents and avoid detection. Monitor the </span><code style=\"vertical-align: baseline;\">GetModelInvocationLoggingConfiguration</code><span style=\"vertical-align: baseline;\"> operation, as well as </span><code style=\"vertical-align: baseline;\">PutModelInvocationLoggingConfiguration</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">DeleteModelInvocationLoggingConfiguration</code><span style=\"vertical-align: baseline;\">. Any calls to disable logging by non-IaC (Infrastructure as Code) principals should be treated as high severity.</span></p>\n</li>\n</ul>\n</ul>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">Automated Tooling: Analyze User-Agent strings to identify automated tools and SDKs (e.g., claude-cli, aws-sdk-rust, and aws-sdk-go-v2) interacting directly with the target cloud infrastructure.</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Azure</strong><span style=\"vertical-align: baseline;\">: Monitor Azure Activity Logs (Control Plane) and Diagnostic Logs (Data Plane) for events associated with the </span><code style=\"vertical-align: baseline;\">Microsoft.CognitiveServices</code><span style=\"vertical-align: baseline;\"> namespace. To hunt for or detect LLM Jacking incidents, monitor the following operations:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resource Exploitation</strong><span style=\"vertical-align: baseline;\">: Monitor for direct execution of the LLM. In Azure, model invocations occur on the data plane and require Diagnostic Logs to be enabled. Look for high volumes of POST requests to inference endpoints such as Completions or Chat Completions APIs. On the management plane (Activity Logs), monitor for unauthorized creation of new instances via the </span><code style=\"vertical-align: baseline;\">Microsoft.CognitiveServices/accounts/deployments/write</code><span style=\"vertical-align: baseline;\"> operation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Target Scoping</strong><span style=\"vertical-align: baseline;\">: Monitor potential reconnaissance activity to discover available Azure LLM resources, models, and deployments via the </span><code style=\"vertical-align: baseline;\">Microsoft.CognitiveServices/accounts/read</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">Microsoft.CognitiveServices/accounts/deployments/read</code><span style=\"vertical-align: baseline;\"> operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Security/Evasion</strong><span style=\"vertical-align: baseline;\">: Review attempts to view or modify logging configurations (to see if data plane model invocations are being recorded) via the </span><code style=\"vertical-align: baseline;\">Microsoft.Insights/diagnosticSettings/read</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">Microsoft.Insights/diagnosticSettings/write</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">Microsoft.Insights/diagnosticSettings/delete</code><span style=\"vertical-align: baseline;\"> operations.</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GCP</strong><span style=\"vertical-align: baseline;\">: Monitor Cloud Audit </span><a href=\"https://cloud.google.com/logging/docs/audit\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Logging</span></a><span style=\"vertical-align: baseline;\"> for calls to Gemini Enterprise Agent Platform endpoints (aiplatform.googleapis.com). Gemini Enterprise Agent Platform inference operations are contained within Data Access logs, which are disabled by default due to volume and ingestion costs. You must manually configure your IAM audit policies to track these.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enablement of Agent Platform Services</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://docs.cloud.google.com/service-usage/docs/audit-logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Alert</span></a><span style=\"vertical-align: baseline;\"> on enablement of Gemini Enterprise Agent Platform services via the </span><code style=\"vertical-align: baseline;\">google.api.serviceusage.v1.ServiceUsage.EnableService</code><span style=\"vertical-align: baseline;\"> method.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resource Exploitation</strong><span style=\"vertical-align: baseline;\">: Monitor for direct execution of the LLM via Gemini Enterprise Agent Platform, which requires Data Access audit logging to be enabled. Look for </span><code style=\"vertical-align: baseline;\">google.cloud.aiplatform.v1.PredictionService.Predict</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">google.cloud.aiplatform.v1.PredictionService.GenerateContent</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">google.cloud.aiplatform.v1.PredictionService.StreamGenerateContent</code><span style=\"vertical-align: baseline;\"> operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Target Scoping</strong><span style=\"vertical-align: baseline;\">: Monitor potential reconnaissance activity to discover available models and endpoints via the </span><code style=\"vertical-align: baseline;\">google.cloud.aiplatform.v1.ModelService.ListModels</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">google.cloud.aiplatform.v1.EndpointService.ListEndpoints</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">google.cloud.aiplatform.v1.PublisherModelService.ListPublisherModels</code><span style=\"vertical-align: baseline;\"> API operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Security/Evasion</strong><span style=\"vertical-align: baseline;\">: Review attempts to view or alter logging and audit configurations. Monitor for operations like </span><code style=\"vertical-align: baseline;\">google.iam.v1.IAMPolicy.GetIamPolicy</code><span style=\"vertical-align: baseline;\"> (to check if Data Access logs are enabled on the project/resource) or attempts to review log exports via </span><code style=\"vertical-align: baseline;\">google.logging.v2.ConfigServiceV2.ListSinks</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">google.logging.v2.ConfigServiceV2.GetSink</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Indicators of Compromise (IOCs)</span></h3>\n<p><span style=\"vertical-align: baseline;\">To assist the wider community in hunting and identifying activity outlined in this blog post, we have included indicators of compromise (IOCs) in a </span><a href=\"https://www.virustotal.com/gui/collection/4377d2403ea17a04744ca871113c1313b0162f190f0b785f5a10b744e8528245/iocs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GTI Collection</span></a><span style=\"vertical-align: baseline;\"> for registered users.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Network Indicators</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Indicator</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Description</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">jet-night.com</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">LLM Mixer</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">newapi.pro</span></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">LLM Mixer</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline; color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\">Table 1: Network Indicators</span></p></div>"
  "43833d05a15af4197eb58d86eaac8ef7":
    "id": "43833d05a15af4197eb58d86eaac8ef7"
    "title": "Shutting the Door on the XCPE Botnet"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/shutting-the-door-on-the-xcpe-botnet/"
    "published": "2026-11-02 23:00:00"
    "fetched": "2026-11-03 02:50:29"
    "summary": "<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Introduction</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Last week, Google and industry partners dismantled the XCPE backdoor which enrolled more than 1.3 million set-top boxes into a botnet. We assess with high confidence that the backdoor and botnet were intentionally developed, deployed, and operated for financial gain by Videostrong Technology Co., an Android Original Equipment Manufacturer (OEM) and Original Design Manufacturer (ODM).</span></p>\n<p><span style=\"vertical-align: baseline;\">Videostrong monetized the backdoor by selling access to criminal affiliates and loading those affiliates’ malware modules onto infected devices. These secondary modules were conducting ad-fraud; silently enrolling infected devices into residential proxy networks; and loading additional malware onto XCPE-compromised devices. We also took action to disrupt the command and control (C2) domains that operate these affiliate modules. Because these affiliates each have diversified distribution channels for their modules beyond XCPE, we assess that taking down their C2 domains will sever access to at least 10 million additional compromised devices. </span></p>\n<p><span style=\"vertical-align: baseline;\">We found this malicious software built directly into many different device models and brands over multiple years, supported by dedicated infrastructure and constantly evolving configurations to evade detection and manage their affiliates. We believe this campaign wasn’t an isolated rogue insider or a development oversight. As a result, Google has cut ties with Videostrong and banned them from making devices with preloaded Google apps. </span></p>\n<p><span style=\"vertical-align: baseline;\">Google requires OEMs go through a comprehensive suite of compatibility and security tests to ensure a consistent and safe user experience across the Android ecosystem. However, Videostrong employed obfuscation techniques to exploit a gap in our tests and load malicious code after the device's first boot. As a result, Google has implemented changes to its existing review process to better safeguard against similar activity in the future. A device manufacturer intentionally infecting their users with malware is an unacceptable breach of trust, and represents a serious risk to those users. Without users’ knowledge or consent, infected devices were offered as a distribution mechanism for a wide array of criminal actors. This led to a variety of malicious activities being conducted on and through the devices, including ad-fraud, data exfiltration, and </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">routing malicious network traffic</span></a><span style=\"vertical-align: baseline;\"> through the devices.</span></p>\n<p><span style=\"vertical-align: baseline;\">We worked closely with Japan’s National Police Agency, Lumen, HUMAN Security, Plume, Synthient, and TrendAI to analyze this malware ecosystem and disrupt its operations. </span></p>\n<p><span style=\"vertical-align: baseline;\">While we expect this disruption to have a significant effect on these criminal operations, this is not the end of our work combatting malicious activity. Backdoor operators, ad-fraud rings, and residential proxy providers operate as an interconnected supply chain. Point-in-time disruptions are a critical tool to protect our users, but  lasting disruption in this fluid ecosystem will require continued targeting of this infrastructure. </span></p>\n<p><span style=\"vertical-align: baseline;\">Google undertook the following actions to support disruption of the XCPE botnet: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Legal action to take down the domains and servers Videostrong used to control the botnet and install malware modules</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Legal action to take down C2 domains used by over a dozen malware families loaded as modules via this backdoor</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Banned Videostrong and any future subsidiaries or affiliates from building and selling certified Android devices in the future, or supplying software to other certified vendors</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Implementing improvements to how we ensure the integrity of firmware on certified Android TV devices </span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Overview</span><span style=\"vertical-align: baseline;\"> </span></h3>\n<p><span style=\"vertical-align: baseline;\">The x.cpe network was built for ongoing profit. By giving malware affiliates backdoor access, the operators conspired to monetize these devices long after purchase. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"XCPE malware overview\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_XCPE_malware_overview.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1: XCPE malware overview</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Malware</span></h4>\n<p><span style=\"vertical-align: baseline;\">Since at least late 2024, Videostrong has evolved its pre-installed malware from simple single-stage droppers into a modular, three-stage architecture designed for resilience and multi-tenant monetization: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Primary Backdoor: </strong><span style=\"vertical-align: baseline;\">Operating at the </span><code style=\"vertical-align: baseline;\">android.uid.system</code><span style=\"vertical-align: baseline;\"> privilege level, </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> (running as </span><code style=\"vertical-align: baseline;\">com.oemservice</code><span style=\"vertical-align: baseline;\"> in some builds) is preloaded in the firmware partition. If uninstalled by a user, it automatically reinstalls from the </span><code style=\"vertical-align: baseline;\">/oem/</code><span style=\"vertical-align: baseline;\"> partition upon reboot, maintaining persistent system-level access. Its main function is to establish and facilitate communications between the C2 server and the loader and execution engine. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Loader and Execution Engine: </strong><span style=\"vertical-align: baseline;\">To evade security scans, </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> acts primarily as the C2 communicator and offloads module execution to an external loader, </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\">. This file employs native anti-analysis utilities to thwart sandbox detection, and configures and initializes the monetization modules. Most recently, </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> has itself been phased out in favor of using more tailored dropper malware that loads and executes single modules.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Monetization Modules: </strong><span style=\"vertical-align: baseline;\">Videostrong monetizes its backdoored devices by loading monetization modules which are developed by entities other than Videostrong that act as affiliates. These modules are deployed as native ELF daemons, embedded SDKs compiled directly into the </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> DEX bytecode, or are fetched as secondary APKs from the malware staging infrastructure.  The loaded modules transform infected devices into residential proxy exit nodes (e.g., Linkfog, AppSalt, NetNut), ad-fraud engines (e.g., CBOXTV, HiddenView), or execute additional backdoors that load even more monetization modules (e.g. Moyu, Spirit).</span></p>\n</li>\n</ul>\n<h4><strong><span style=\"vertical-align: baseline;\">Infrastructure</span></strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Command and Control: </strong><span style=\"vertical-align: baseline;\">The botnet uses a two-stage C2 process. It first initiates HTTP POST requests to fetch dynamic configuration settings, geolocation data, and STUN server parameters. It then establishes a persistent, real-time Message Queuing Telemetry Transport (MQTT) connection to receive instructions for silent app installations, arbitrary shell commands, screen captures, and network reconnaissance. MQTT is a lightweight, publish-and-subscribe network protocol designed for low-bandwidth, high-latency, or unreliable remote networks.</span></p>\n</li>\n<li><strong style=\"vertical-align: baseline;\">Malware staging infrastructure: </strong><span style=\"vertical-align: baseline;\">Additional monetization modules as well as various shell scripts and legitimate applications are hosted remotely and downloaded by infected devices upon command from the operator via the MQTT broker. A significant majority of these files are hosted as Github releases on operator-owned Github pages. Other files are hosted on operator-controlled servers and file hosting sites.</span></li>\n</ul>\n<h4><strong><span style=\"vertical-align: baseline;\">Malware Deep Dive</span></strong></h4>\n<h4><span style=\"vertical-align: baseline;\">Backdoor Initialization</span></h4>\n<p><span style=\"vertical-align: baseline;\">The infection chain begins with a stub package (called </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> in some builds and </span><code style=\"vertical-align: baseline;\">com.oemservice</code><span style=\"vertical-align: baseline;\"> in others) preloaded in the system partition of the firmware and running at the </span><code style=\"vertical-align: baseline;\">android.uid.system</code><span style=\"vertical-align: baseline;\"> privilege level. This stub has limited functionality. Upon boot, it checks the device's </span><code style=\"vertical-align: baseline;\">oem/</code><span style=\"vertical-align: baseline;\"> directory for the corresponding </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> package and initiates installation into the </span><code style=\"vertical-align: baseline;\">/data/app/</code><span style=\"vertical-align: baseline;\"> directory as outlined below. </span></p>\n<p><span style=\"vertical-align: baseline;\">To maintain inter-process state across the firmware ecosystem, </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> exports two ContentProviders, which expose structured configuration tables storing runtime parameters, device identifiers, proxy configuration blobs, and execution flags accessible by co-installed system applications. This enables other apps in Videostrong’s ecosystem, such as their YokaTV Player streaming software, to fetch configuration parameters provided by the C2 server mentioned below. </span></p>\n<h4><span style=\"vertical-align: baseline;\">C2 Configuration</span></h4>\n<p><span style=\"vertical-align: baseline;\">The malware utilizes a two-stage communications protocol. It first fetches initial bootstrap configurations via an HTTP request, followed by a persistent MQTT subscription to receive commands and module download instructions. </span></p>\n<p><span style=\"vertical-align: baseline;\">To dynamically derive the HTTP C2 bootstrap server, it follows the following routine:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Queries </span><code style=\"vertical-align: baseline;\">content://com.release.debug.provider/configs</code><span style=\"vertical-align: baseline;\"> for </span><code style=\"vertical-align: baseline;\">private_url</code><span style=\"vertical-align: baseline;\"> via </span><code style=\"vertical-align: baseline;\">x.cpe.util.ExtraReadUtils</code><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Queries the Android system property to determine if </span><code style=\"vertical-align: baseline;\">ro.mecool.device</code><span style=\"vertical-align: baseline;\"> is true.</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">If true, it defaults to </span><code style=\"vertical-align: baseline;\">http://mcstb.anyevonline.com:8000</code><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">If false, it dynamically generates the following: </span><code style=\"vertical-align: baseline;\">http://stb[AndroidVersion][Type].anyevonline.com:8000</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Using the selected hostname, the client makes an HTTP POST request with an AES-encrypted JSON object containing hardware telemetry (SN, MAC, model, firmware version) to the following endpoints:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">/router/config/mqtt</strong><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> This endpoint provides MQTT broker details (including Broker Hostname, TCP Port, Authentication Tokens/Passwords, and the specific Topic structure: </span><code style=\"vertical-align: baseline;\">/device/{model}/{chipId}/{action}</code><span style=\"vertical-align: baseline;\">. After receiving this data, the device initiates a persistent, real-time socket connection to the MQTT broker.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">/router/config/acs</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">This endpoint response returns URLs for </span><code style=\"vertical-align: baseline;\">ip-api[.]com</code><span style=\"vertical-align: baseline;\">  and a Google STUN server to enable the malware to identify geolocation and public IP and port mapping to traverse network address translation (NAT) boundaries. It also returns a URL (</span><code style=\"vertical-align: baseline;\">http://ott.szbboys[.]com:8000/cpe/file/upload</code><span style=\"vertical-align: baseline;\"> for uploading files, logs, or diagnostic dumps from the device, and returns flags to configure ad modules (</span><code style=\"vertical-align: baseline;\">adBwmActive</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">adDevourUse</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">adDevourCode</code><span style=\"vertical-align: baseline;\">), and to enable or disable core malware modules.</span></p>\n</li>\n<li><strong style=\"vertical-align: baseline;\">/router/config/app</strong><strong style=\"vertical-align: baseline;\">: </strong><span style=\"vertical-align: baseline;\">This endpoint provides module-level configs, including server mappings and parameters, which </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> decrypts and passes to a SQLite </span><code style=\"vertical-align: baseline;\">ContentProvider</code><span style=\"vertical-align: baseline;\"> named </span><code style=\"vertical-align: baseline;\">ShareProvider</code><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">com.oem.share.provider</code><span style=\"vertical-align: baseline;\">). By exposing this inter-process data interface, </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> enables modules to retrieve up-to-date upstream infrastructure parameters (such as URLs for additional configs, user manuals, etc).</span></li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">MQTT Capabilities</span><span style=\"vertical-align: baseline;\"> </span></h4>\n<p><span style=\"vertical-align: baseline;\">Following initial configuration, persistent real-time C2 communication is managed by the MQTT library (</span><code style=\"vertical-align: baseline;\">x.cpe.mqtt.MqttUtils</code><span style=\"vertical-align: baseline;\">). All identified samples analyzed to date utilize a single broker hostname, </span><code style=\"vertical-align: baseline;\">mqtt.szbboys[.]com</code><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Specific MQTT topics are mapped to specific actions, including:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Silent Application Installation</strong><span style=\"vertical-align: baseline;\">: Fetches remote APKs to a temporary directory. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Disable Google Play Protect</strong><span style=\"vertical-align: baseline;\">: To bypass security, </span><code style=\"vertical-align: baseline;\">AppUtils.disablePackageVerify()</code><span style=\"vertical-align: baseline;\"> targets the global setting \"</span><code style=\"vertical-align: baseline;\">package_verifier_user_consent</code><span style=\"vertical-align: baseline;\">\" via </span><code style=\"vertical-align: baseline;\">Settings.Global.putInt</code><span style=\"vertical-align: baseline;\"> and sets it to </span><code style=\"vertical-align: baseline;\">-1</code><span style=\"vertical-align: baseline;\">, disabling Google Play Protect app verification.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Arbitrary Shell Execution</strong><span style=\"vertical-align: baseline;\">: Executes remote commands via </span><code style=\"vertical-align: baseline;\">sh</code><span style=\"vertical-align: baseline;\"> under system UID privilege level. Results are published to the MQTT broker.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Shell Script Execution</strong><span style=\"vertical-align: baseline;\">: Downloads and executes shell scripts via </span><code style=\"vertical-align: baseline;\">x.cpe.util.RunCmds</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Remote Desktop Monitor &amp; Screen Capture</strong><span style=\"vertical-align: baseline;\">: Utilizes </span><code style=\"vertical-align: baseline;\">android.app.Instrumentation.sendKeyDownUpSync()</code><span style=\"vertical-align: baseline;\"> to inject keycodes and Java reflection on hidden APIs (</span><code style=\"vertical-align: baseline;\">android.view.SurfaceControl.screenshot</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">SurfaceControl$ScreenshotHardwareBuffer</code><span style=\"vertical-align: baseline;\">) to continuously capture the screen, compress to JPEG, and publish over MQTT.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Network Reconnaissance</strong><span style=\"vertical-align: baseline;\">: Invokes embedded binaries (</span><code style=\"vertical-align: baseline;\">libtraceroute.so</code><span style=\"vertical-align: baseline;\">) to fingerprint the victim network, and perform standard ping tests. The binaries also perform robust AS-lookup WHOIS routing queries.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Our analysis of the C2 data indicates the preponderance of interactions with victim devices were related to module install, uninstall, and configuration actions. We also observed Videostrong operators executing sensitive actions on the device, including capturing live screenshots; injecting keystrokes; exfiltrating sensitive data including account information, device information, package inventories, and system logs; and executing shell scripts and commands, including to establish reverse shells on devices.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Loader and Execution Engine Details</span><span style=\"vertical-align: baseline;\"> </span></h4>\n<p><span style=\"vertical-align: baseline;\">Earlier versions of </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> directly embedded malicious monetization modules. In late 2024 – possibly as a response to </span><a href=\"https://blog.google/innovation-and-ai/technology/safety-security/google-taking-legal-action-against-the-badbox-20-botnet/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">earlier Google enforcement</span></a><span style=\"vertical-align: baseline;\"> related to BadBox – Videostrong removed malicious modules from </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> and introduced a separate malicious package they developed, </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\">, which </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> routes instructions and data to via Inter-Process Communication (IPC). Modern variants of </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> facilitate C2 communications but pass configuration parameters, module updates, and other payloads to </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> as the execution engine. We believe the actor may have evolved the malware in this way in an attempt to ensure </span><code style=\"vertical-align: baseline;\">x.cpe </code><span style=\"vertical-align: baseline;\">could remain undetected.</span></p>\n<p><span style=\"vertical-align: baseline;\">Upon boot, </span><code style=\"vertical-align: baseline;\">com.abc.nexus.broadcast.BootReceiver</code><span style=\"vertical-align: baseline;\"> broadcasts the </span><code style=\"vertical-align: baseline;\">com.abc.nexus.data</code><span style=\"vertical-align: baseline;\"> intent, bootstrapping </span><code style=\"vertical-align: baseline;\">com.abc.nexus.service.CoreService</code><span style=\"vertical-align: baseline;\">. Within </span><code style=\"vertical-align: baseline;\">CoreService.onCreate</code><span style=\"vertical-align: baseline;\">, the application performs maintenance and persistence tasks. The main logic sets up a listener through </span><code style=\"vertical-align: baseline;\">RemoteMessageHandler</code><span style=\"vertical-align: baseline;\"> for IPC communications from </span><code style=\"vertical-align: baseline;\">x.cpe,</code><span style=\"vertical-align: baseline;\">and parses JSON payloads received from it.  </span></p>\n<p><span style=\"vertical-align: baseline;\">After these steps, </span><code style=\"vertical-align: baseline;\">CoreService</code><span style=\"vertical-align: baseline;\"> initializes the monetization modules. </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> services extract and orchestrate a series of nested native libraries and dynamically downloaded secondary payloads which vary significantly based on sample. Many versions of </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> come preloaded with four or more embedded modules, while other versions contain as few as one. The most common malware modules include </span><code style=\"vertical-align: baseline;\">TitanService</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">BwmService</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AdtimeService</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">lb102Service</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">LinkfogService</code><span style=\"vertical-align: baseline;\"> (sometimes called </span><code style=\"vertical-align: baseline;\">AgentService)</code><span style=\"vertical-align: baseline;\">. Discussion of these and other modules can be found in the monetization modules section. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Persistence and Evasion</span></h3>\n<p><span style=\"vertical-align: baseline;\">The malware operators implement a number of mechanisms to establish persistence and thwart detection and analysis.</span></p>\n<p><span style=\"vertical-align: baseline;\">As a system preload, </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> cannot be removed by the user. If </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> is uninstalled from </span><code style=\"vertical-align: baseline;\">/data/app/</code><span style=\"vertical-align: baseline;\">, upon reboot the </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> service </span><code style=\"vertical-align: baseline;\">BootReceiver</code><span style=\"vertical-align: baseline;\"> follows the same routine outlined above and reinstalls the package. </span></p>\n<p><span style=\"vertical-align: baseline;\">The backdoor is able to silently download additional files to the device and execute them without user consent because it first wipes user consent configuration on the device and then disables Google Play Protect:</span></p>\n<p> </p>\n<pre class=\"language-markup\"><code>public static void disablePackageVerify() {\n    PreferenceUtils.setPackageVerifyFromUser(CPEApp.instance, true);\n    AppUtils.setPackageVerify(-1); // Actioning a bypass against GPP evaluation\n}</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 2: Disabling Google Play Protect</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In many variants of </span><code style=\"vertical-align: baseline;\">com.abc.nexus,</code><span style=\"vertical-align: baseline;\"> we observed the extraction of a sophisticated anti-analysis and process hardening utility </span><code style=\"vertical-align: baseline;\">libseccomp_guard.so</code><span style=\"vertical-align: baseline;\">, which runs prior to the initialization of malware modules, to ensure they remain protected from automated sandboxes and security instrumentation. It filters system calls to prevent the pausing or termination of individual threads, denies cross-process interference to ensure isolation, and prevents the spawning of child processes. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Evolution</span></h4>\n<p><span style=\"vertical-align: baseline;\">Since August 2026, new dropper packages have been installed via the MQTT channel, which appear to be synchronized with the mass-uninstallation of </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> across the botnet. We assess this may represent a new evolution of the malware to further evade detection. These new packages are disguised as Android system applications, with names such as </span><code style=\"vertical-align: baseline;\">com.android.system.ntp</code><span style=\"vertical-align: baseline;\"> and</span><code style=\"vertical-align: baseline;\"> com.android.sso.auth.handler</code><span style=\"vertical-align: baseline;\">. Where </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> could act as a general purpose loader and execution engine (executing instructions passed to it from </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\">), these packages instead install single monetization modules (such as AppSalt).  Multiple variants of these packages extract a native ELF file, </span><code style=\"vertical-align: baseline;\">libexploit.so</code><span style=\"vertical-align: baseline;\">, which in turn executes functions </span><code style=\"vertical-align: baseline;\">nativeAdbRoot()</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">nativeAdbShell()</code><span style=\"vertical-align: baseline;\">. These functions restart the local </span><code style=\"vertical-align: baseline;\">adbd</code><span style=\"vertical-align: baseline;\"> service as root, and initiate an ADB shell connection. Following this, the app uses the connection to install itself in the </span><code style=\"vertical-align: baseline;\">system</code><span style=\"vertical-align: baseline;\"> partition.  The </span><code style=\"vertical-align: baseline;\">system</code><span style=\"vertical-align: baseline;\"> partition is remounted as read-write and the payload replicates itself to a newly minted directory in </span><code style=\"vertical-align: baseline;\">/system/priv-app/</code><span style=\"vertical-align: baseline;\"> and creates an XML file at </span><code style=\"vertical-align: baseline;\">/system/etc/permissions/privapp-permissions-&lt;app name&gt;.xml</code><span style=\"vertical-align: baseline;\">. This file grants the malware </span><code style=\"vertical-align: baseline;\">android.permission.INSTALL_PACKAGES</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">android.permission.REBOOT</code><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">The app configures the malware modules through hardcoded configuration parameters, and does not listen for </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> IPC messages. The app itself is controlled by the operators via shell scripts pushed via the broker and executed by </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\">. These include setting the property </span><code style=\"vertical-align: baseline;\">persist.networkstack.uninstall</code><span style=\"vertical-align: baseline;\"> (which, when read by the app, triggers uninstallation and cleanup), </span><code style=\"vertical-align: baseline;\">persist.networkstack.skip_system_install</code><span style=\"vertical-align: baseline;\"> (which skips system installation, forcing it to remain running in </span><code style=\"vertical-align: baseline;\">/data/app/</code><span style=\"vertical-align: baseline;\">), and </span><code style=\"vertical-align: baseline;\">persist.networkstack.install_time</code><span style=\"vertical-align: baseline;\"> (which implements timestomping, overriding the default timestamp of the app to align with the other packages installed in the </span><code style=\"vertical-align: baseline;\">system</code><span style=\"vertical-align: baseline;\"> directory).  </span></p>\n<h3><span style=\"vertical-align: baseline;\">Botnet composition</span></h3>\n<p><span style=\"vertical-align: baseline;\">The botnet is globally dispersed, with certain concentrations possibly implying market penetration for the brand distributor.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Global distribution of x.cpe\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_3_Global_distribution_of_x.cpe.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 3: Global distribution of x.cpe</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">While the overwhelming majority of the infected devices in the XCPE botnet are Android TV set-top boxes, we observed a number of other infected Android-based IoT devices, including telehealth  devices, karaoke machines, and digital signage devices. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Monetization</span><span style=\"vertical-align: baseline;\"> </span></h4>\n<p><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> loads a variety of malicious modules for monetization. Most often the modules are associated with residential proxy services and bandwidth sharing, but we've also observed ad fraud modules. Given that a single device may be running multiple modules providing the same or similar functionality (e.g., as many as three residential proxy SDKs installed on a single device) it is clear that Videostrong seeks to monetize every infected device to the greatest extent possible. </span></p>\n<p><span style=\"vertical-align: baseline;\">Services are loaded by </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> via three methods:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Native Daemons</strong><span style=\"vertical-align: baseline;\">: Native ELF binaries prepackaged with </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\">, which are unpacked to data directories and spawned as background processes with system/root privileges.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Embedded SDKs / Services</strong><span style=\"vertical-align: baseline;\">: Java/Kotlin SDKs compiled directly into Nexus and invoked via Android Service lifecycles or IPC broadcast triggers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Dynamic Droppers &amp; Secondary APK Installers</strong><span style=\"vertical-align: baseline;\">: Downloader function that pulls remote native ELFs or secondary standalone APKs and invokes system package managers. Nexus receives messages from </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> directing it to download specific modules.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Malware modules loaded via the backdoor include the following: </span></p>\n<h4><span style=\"vertical-align: baseline;\">Residential Proxy / Bandwidth Sharing Modules</span></h4>\n<p><strong style=\"vertical-align: baseline;\">LINKFOG</strong></p>\n<p><code style=\"vertical-align: baseline;\">Com.abc.nexus</code><span style=\"vertical-align: baseline;\">’s </span><code style=\"vertical-align: baseline;\">LinkfogService</code><span style=\"vertical-align: baseline;\"> unpacks a Go binary named </span><code style=\"vertical-align: baseline;\">lw_android_agent</code><span style=\"vertical-align: baseline;\">  from </span><code style=\"vertical-align: baseline;\">assets/</code><span style=\"vertical-align: baseline;\"> to local app storage and supplies it with vendor parameters. This service silently turns infected devices into residential edge computing and PCDN proxy exit nodes. It connects to FRP reverse tunnels, and uploads bandwidth accounting metrics to Linkfog API backends. Linkfog (operated by Beijing Linkfog Technology via 点心云 / Dianxinyun) brands itself as a “Peer-to-Peer Content Delivery Network”.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Jaguar</strong></p>\n<p><span style=\"vertical-align: baseline;\">The</span><code style=\"vertical-align: baseline;\"> com.abc.nexus</code><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">AdtimeService </code><span style=\"vertical-align: baseline;\">extracts </span><code style=\"vertical-align: baseline;\">libjaguar.so</code><span style=\"vertical-align: baseline;\"> from </span><code style=\"vertical-align: baseline;\">assets/</code><span style=\"vertical-align: baseline;\">. The file is an unobfuscated 32-bit ELF binary written in C, compiled as a native Android binary. It utilizes JNI (Java Native Interface) to initialize its core routines, dynamically derives a ChaCha20 decryption key via ARM NEON SIMD instructions to decode heavily obfuscated configurations , and establishes an encrypted C2 channel. Upon successful registration, the C2 responds with JSON configuration specifying proxy endpoints. The proxy command loop </span><code style=\"vertical-align: baseline;\">x_ctrl_do_ctrl_msg</code><span style=\"vertical-align: baseline;\"> delegates proxy operations based on incoming JSON variable commands, and is capable of both TCP and UDP relay.</span></p>\n<p><strong style=\"vertical-align: baseline;\">AppSalt / Honeygain</strong></p>\n<p><span style=\"vertical-align: baseline;\">AppSalt SDK is the residential proxy SDK owned by Honeygain, which is in turn owned by Oxylabs. </span><code style=\"vertical-align: baseline;\">com.abc.nexus.service.CoreService</code><span style=\"vertical-align: baseline;\"> initializes Appsalt SDK. First, the application obtains an Appsalt SDK API key from a native library </span><code style=\"vertical-align: baseline;\">libnative_keys.so</code><span style=\"vertical-align: baseline;\"> by calling its </span><code style=\"vertical-align: baseline;\">getAppsaltKey()</code><span style=\"vertical-align: baseline;\"> function. Appsalt SDK is initialized without displaying a consent screen - instead it explicitly calls the </span><code style=\"vertical-align: baseline;\">optIn()</code><span style=\"vertical-align: baseline;\"> method which sets a consent flag without displaying any user interface. During Appsalt SDK startup it checks the application's installation source and stops execution if the application was installed from the official Google Play Store. </span></p>\n<p><span style=\"vertical-align: baseline;\">Once Appsalt is successfully initialized it establishes a WebSocket connection with the primary command and control domain. Appsalt uses JSON-formatted messages for initial check-in (registration) and heartbeat requests. Appsalt command and control servers use MessagePack formatted messages to issue commands pertaining to proxy operations. Appsalt SDK is configured with an initial set of domains that act as proxy gateways. The list of proxy gateways can be updated by the command and control server. The device establishes UDP / QUIC connections with these gateways.</span></p>\n<p><strong style=\"vertical-align: baseline;\">BWM / IPWeb</strong></p>\n<p><span style=\"vertical-align: baseline;\">This residential proxy and bandwidth-sharing node is implemented through the </span><code style=\"vertical-align: baseline;\">com.abc.nexus.service.BwmService</code><span style=\"vertical-align: baseline;\"> component (sometimes named </span><code style=\"vertical-align: baseline;\">com.abc.nexus.service.SN4Service)</code><span style=\"vertical-align: baseline;\"> and its associated SDK. Upon initialization, it secures itself within an isolated sandbox environment, captures device telemetry, and registers with a remote server over UDP. From this C2, it receives instructions to initiate a Java NIO TCP multiplexed proxy tunnel. The service functions to route arbitrary traffic through the infected device on behalf of a remote threat actor.</span></p>\n<p><strong style=\"vertical-align: baseline;\">GaGaNode</strong></p>\n<p><span style=\"vertical-align: baseline;\">GaGaNode is the first-party SDK owned by residential proxy operator IPCola. It connects over TCP to a primary C2 server and sends heartbeat beacon data over HTTP POST to a separate server. The SDK both contains its own proxy relay functionality, and it initializes additional proxy SDKs from affiliates. Upon device registration to the C2, </span><code style=\"vertical-align: baseline;\">com.gaganode.sdk.node.endpoint.a</code><span style=\"vertical-align: baseline;\"> receives </span><span style=\"vertical-align: baseline;\">incoming packets from relay servers and places them in queue for the client to read and proxy through its exit node socket. The service manages multiple proxy sessions at once (referred to as clients), and each client has its own tcp/udp queue for messages.</span></p>\n<p><span style=\"vertical-align: baseline;\">We observe GaGaNode initializing PopaNet/NetNut and EarnFM Fleet residential proxy SDKs.</span><span style=\"vertical-align: baseline;\"> GaGaNode/IPCola is thus likely able to further monetize its SDK and offer these affiliates access to the infected exit nodes.</span></p>\n<p><strong style=\"vertical-align: baseline;\">NetNut / Popanet</strong></p>\n<p><span style=\"vertical-align: baseline;\">Popanet is a residential proxy SDK developed by NetNut, a residential proxy operator. The GaGaNode module initiates the Popanet SDK (</span><code style=\"vertical-align: baseline;\">io.popanet.Popa</code><span style=\"vertical-align: baseline;\">). This malware is identical to the malware described in our </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">previous disruption of NetNut</span></a><span style=\"vertical-align: baseline;\">. All C2 infrastructure used by Popanet samples connected to </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> was taken down as part of the earlier Netnut disruption.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Traffmonetizer</strong></p>\n<p><span style=\"vertical-align: baseline;\">The Traffmonetizer SDK is initialized inside the primary background service </span><span style=\"vertical-align: baseline;\">com.abc.nexus.service.CoreService</span><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">CoreService</span><span style=\"vertical-align: baseline;\"> operation depends on the availability of policy JSON provided by the XCPE backdoor via IPC. Before calling Traffmonetizer SDK initialization methods, the application obtains a Traffmonetizer SDK API key from the native library </span><code style=\"vertical-align: baseline;\">libnative_keys.so</code><span style=\"vertical-align: baseline;\"> by calling its </span><code style=\"vertical-align: baseline;\">getTraffmonetizerKey()</code><span style=\"vertical-align: baseline;\"> function. </span></p>\n<p><span style=\"vertical-align: baseline;\">Traffmonetizer functionality is split between two components where the Android SDK acts as a state machine which handles native library callbacks through asynchronous event dispatchers. </span><code style=\"vertical-align: baseline;\">ServiceBloc</code><span style=\"vertical-align: baseline;\"> monitors connection status updates from the native callbacks and </span><code style=\"vertical-align: baseline;\">ConnectivityBloc</code><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">monitors Wi-Fi and mobile data network changes. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Traffmonetizer native library initialization and configuration is followed by a call to </span><code style=\"vertical-align: baseline;\">baseClientStart()</code><span style=\"vertical-align: baseline;\"> which establishes a WebSocket connection to a C2 server. Traffmonetizer uses a single WebSocket (TLS) connection to the command and control server to multiplex control messages and tunneled connections (supports both TCP and UDP). Traffmonetizer also supports “Content Delivery” tunneling which allows nodes to tunnel bandwidth-intensive traffic.</span></p>\n<p><strong style=\"vertical-align: baseline;\">EarnFM</strong></p>\n<p><span style=\"vertical-align: baseline;\">EarnFM is a residential proxy provider, and Fleet SDK is the provider’s SDK that enrolls devices as exit nodes into the proxy network. In </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\">, FleetSDK is initialized by </span><code style=\"vertical-align: baseline;\">com.gaganode.sdk</code><span style=\"vertical-align: baseline;\"> as mentioned above. FleetSdk then loads native binary </span><code style=\"vertical-align: baseline;\">libfleetshare.so</code><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">FleetSDK establishes a persistent WebSocket connection with its primary C2 server for routing arbitrary network traffic. Incoming tasking frames are received over the WebSocket channel and processed in a continuous loop. Messages contain structured JSON commands instructing the daemon to connect to specific remote hosts, with support for both TCP and UDP.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Backdoor Modules</span></h4>\n<p><strong style=\"vertical-align: baseline;\">Spirit</strong></p>\n<p><span style=\"vertical-align: baseline;\">Spirit is a dynamic code loading backdoor. Spirit employs multiple stages. The first stage payload fetches device information (hardware, operating system, and manufacturer/brand information and geolocation), posting it over HTTP to a hardcoded C2 server, and fetches a list of additional modules to download from the server. The second stage communicates with a separate server, and is used for </span><span style=\"vertical-align: baseline;\">tasking, config sync, module retrieval, heartbeats, and reporting. </span><span style=\"vertical-align: baseline;\">We have observed Spirit loading a significant amount of additional malware monetization modules, including some of the families already directly loaded by </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Moyu</strong></p>\n<p><span style=\"vertical-align: baseline;\">Moyu is a 3-stage backdoor previously observed as part of the BadBox enterprise. On </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\">-backdoored devices, we observed it initialized by </span><code style=\"vertical-align: baseline;\">com.abc.nexus.service.DevourService.</code><span style=\"vertical-align: baseline;\"> The first stage is an offline dropper that reconstructs and loads an embedded second stage. Stage two polls an update C2 to download, decrypt, and load the third stage. Stage three implements a backdoor with hidden Double-WebView click/conversion fraud, persistent clipboard hijacking, and secondary dynamically loaded JAR execution and a separate residential proxy trojan.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Bird</strong></p>\n<p><span style=\"vertical-align: baseline;\">Bird is a 2-stage backdoor previously tied to the BadBox enterprise. Stage 1 beacons a device and analysis-environment profile to its C2 server and, when the server approves, downloads, decrypts, and loads the Stage 2 JAR. Stage 2 implements a dynamic code loading backdoor (two plugin loaders plus a C2-driven reflective method invoker), a separate downloader (silent APK installation and Accessibility-driven Google Play installs), and ad abuse (lockscreen ads, overlays, browser launches).</span></p>\n<p><strong style=\"vertical-align: baseline;\">Fission</strong></p>\n<p><span style=\"vertical-align: baseline;\">Fission is a dynamic code loading (DCL) backdoor embedded within standard video applications (e.g., </span><code style=\"vertical-align: baseline;\">com.newtv.cboxtv</code><span style=\"vertical-align: baseline;\">). Upon initialization, the first stage plugin contacts its C2 server to download additional modules. The decrypted second stage payload fetches execution targets and tracking URLs from the C2. The request sends an unencrypted POST request with tracking metrics from the internal </span><code style=\"vertical-align: baseline;\">DeviceManager.</code></p>\n<p><span style=\"vertical-align: baseline;\">The payload we observed was configured to commit ad fraud. Rather than rendering visible advertisements in a </span><code style=\"vertical-align: baseline;\">WebView</code><span style=\"vertical-align: baseline;\"> or UI component, the Stage 2 plugin executes headlessly in the background. The module queries ad server endpoints in the background to retrieve ad placement responses, parses out both primary impression beacons (</span><code style=\"vertical-align: baseline;\">pvm</code><span style=\"vertical-align: baseline;\">) and third-party tracking monitor URLs (</span><code style=\"vertical-align: baseline;\">pvtpm</code><span style=\"vertical-align: baseline;\">), and immediately fires HTTP GET requests to each tracking endpoint to register a fake ad view without displaying creative content.</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">When executing inside specific smart-TV application stores (</span><code style=\"vertical-align: baseline;\">com.changhong.appstore</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">com.tcl.appmarket2</code><span style=\"vertical-align: baseline;\">), the plugin initializes and triggers the ad SDK directly to report synthetic ad exposures.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Ad-Fraud</span></h4>\n<p><strong style=\"vertical-align: baseline;\">HiddenView</strong></p>\n<p><span style=\"vertical-align: baseline;\">We observed HiddenView loaded remotely from the attacker’s Github channel as </span><code style=\"vertical-align: baseline;\">com.ota.service</code><span style=\"vertical-align: baseline;\">. It is a standalone ad fraud application capable of running in the background using a transparent window overlay, using hidden WebViews to load targeted web pages and simulate user interaction (scrolling, clicking, typing, media playback), playing media unattended, and capturing the user’s screen.</span></p>\n<h4><span style=\"vertical-align: baseline;\">How the pieces come together</span><span style=\"vertical-align: baseline;\"> </span></h4>\n<p><span style=\"vertical-align: baseline;\">Configuration messages pushed via MQTT (action </span><code style=\"vertical-align: baseline;\">ext/lib/config</code><span style=\"vertical-align: baseline;\">) demonstrate how </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> and various monetization modules function together. </span></p>\n<p><span style=\"vertical-align: baseline;\">Upon registration, subscribed devices receive a </span><code style=\"vertical-align: baseline;\">ext/lib/config</code><span style=\"vertical-align: baseline;\"> message, which contains configuration parameters for malicious plugins. This includes:</span></p>\n<p><span style=\"vertical-align: baseline;\">Limits on system resources:</span></p>\n<p> </p>\n<pre class=\"language-markup\"><code>\"constraints\": [\n    {\n      \"cpu\": 70,\n      \"ioRead\": 5000,\n      \"ioWrite\": 5000,\n      \"libCode\": \"linkfog\",\n      \"memory\": 50,\n      \"reportAlarm\": true,\n      \"trigger\": 3\n    }</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 4: System resource limits configuration payload</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Module name, download location per architecture, hashes, and weight (relative priority for system resources):</span></p>\n<p> </p>\n<pre class=\"language-markup\"><code> \"infos\": [\n    {\n      \"libChannel\": \"SZKJ\",\n      \"libCode\": \"linkfog\",\n      \"libResource\": [\n        {\n          \"address\": \"https://github.com/Aviciiii/ott/releases/download/cpe_ext_lib/lw_android_agent_special_ndk_64\",\n          \"architecture\": \"arm64-v8a\",\n          \"md5\": \"abd0b6de6fdf78234f5dab098d5dd229\"\n        },\n        {\n          \"address\": \"https://github.com/Aviciiii/ott/releases/download/cpe_ext_lib/lw_android_agent_special_ndk_32_20250717\",\n          \"architecture\": \"armeabi-v7a\",\n          \"md5\": \"d8971688d1929b6ed915b80eca7e7e3f\"\n        }\n      ],\n      \"libWeight\": 5\n    },</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 5: Module configuration payload</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Devices are assigned to one of six timezone-separated pools on the </span><code style=\"vertical-align: baseline;\">ott.szbboys[.]com</code><span style=\"vertical-align: baseline;\"> domain:</span></p>\n<p> </p>\n<pre class=\"language-markup\"><code>\"region\": \"Iraq\",\n  \"serverPool\": {\n    \"defaultPool\": \"Pool5\",\n    \"lastUpdated\": \"2025-08-06 17:00:00\",</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 6: Server Pool configuration payload</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The “</span><code style=\"vertical-align: baseline;\">policys</code><span style=\"vertical-align: baseline;\">” section instructs </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> which modules to download and run:</span></p>\n<p> </p>\n<pre class=\"language-markup\"><code> \"status\": [\n    {\n      \"enable\": true,\n      \"libCode\": \"linkfog\"\n    },\n    {\n      \"enable\": false,\n      \"libCode\": \"bwm\"\n    },\n    {\n      \"enable\": false,\n      \"libCode\": \"adtime\"\n    },\n    {\n      \"enable\": false,\n      \"libCode\": \"admoyu\"\n    },\n    {\n      \"enable\": false,\n      \"libCode\": \"titan\"\n    },\n    {\n      \"enable\": false,\n      \"libCode\": \"lb102\"\n    }\n  ],</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 7: Module activation payload</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> passes on these configuration parameters to </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> for the given module on the device. Devices report bandwidth usage and alarms back to </span><code style=\"vertical-align: baseline;\">serverPool</code><span style=\"vertical-align: baseline;\"> to stay within the configured constraints. </span></p>\n<p><span style=\"vertical-align: baseline;\">When </span><code style=\"vertical-align: baseline;\">com.abc.nexus</code><span style=\"vertical-align: baseline;\"> acknowledges receiving the bundle, </span><code style=\"vertical-align: baseline;\">x.cpe</code><span style=\"vertical-align: baseline;\"> immediately publishes </span><code style=\"vertical-align: baseline;\">ext/lib/config/reply</code><span style=\"vertical-align: baseline;\"> back to the MQTT broker:</span></p>\n<p> </p>\n<pre class=\"language-markup\"><code>\"code\": 0,\n  \"msg\": \"success\",\n  \"data\": \"received data success and applying\",\n  \"async\": true,\n  \"immediately\": false</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 8: x.cpe response payload</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Infrastructure</span></h4>\n<p><span style=\"vertical-align: baseline;\">As previously mentioned, devices first connect to various endpoints on </span><code style=\"vertical-align: baseline;\">*.anyevonline[.]com</code><span style=\"vertical-align: baseline;\"> for initial bootstrap, registration, and configuration. Earlier malware versions used various hostnames of </span><code style=\"vertical-align: baseline;\">{*tms | *ott | *ota}.szbboys[.]com</code><span style=\"vertical-align: baseline;\"> for the same purpose. </span></p>\n<p><span style=\"vertical-align: baseline;\">While earlier versions of the malware used HTTP for C2, and then a blended C2 approach with both HTTP and MQTT, static analysis of current versions indicate they exclusively send/receive C2 communications via MQTT. A single MQTT broker orchestrates all MQTT C2 communications for samples we’ve identified. Hostname </span><code style=\"vertical-align: baseline;\">mqtt.szbboys[.]com</code><span style=\"vertical-align: baseline;\"> is resolved by hosts</span><code style=\"vertical-align: baseline;\"> 219.134.163[.]210</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">219.134.163[.]211. </code><span style=\"vertical-align: baseline;\">It listens on non-standard MQTT ports 3885-3887. </span></p>\n<p><span style=\"vertical-align: baseline;\">The malware constructs OkHttp requests for file downloads after tasking via the MQTT broker. Files are hosted on several services:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Several Github release pages</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">filemail[.]com</code><span style=\"vertical-align: baseline;\"> file sharing service</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Two operator-controlled servers hosted on IPs</span><code style=\"vertical-align: baseline;\"> 38.145.197[.]135 </code><span style=\"vertical-align: baseline;\">and </span><code style=\"vertical-align: baseline;\">23.94.49[.]57</code></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Netflow telemetry on the broker nodes (</span><code style=\"vertical-align: baseline;\">219.134.163[.]210/.211</code><span style=\"vertical-align: baseline;\">) indicates that while infected devices communicate over ports 3885–3887, operators likely manage the broker and dispatch tasking via interactive HTTP REST API (port 8082), WebSocket (port 8083), and EMQX web administration console (port 18083) sessions originating from non-bot IP space. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Call to Action</span></h3>\n<p><span style=\"vertical-align: baseline;\">While we believe our actions have seriously impacted over a dozen malicious actors, the underlying illicit market is resilient. Backdoor operators, ad-fraud rings, and residential proxy providers operate as an interconnected supply chain, and when one component is disrupted, operators quickly pivot to new loaders or rival monetization SDKs. Creating lasting change requires accountability across the hardware supply chain, the residential proxy industry, and the broader technology ecosystem.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Accountability and Reform</span></h4>\n<p><span style=\"vertical-align: baseline;\">A device manufacturer intentionally infecting their users with malware is an unacceptable breach of trust. By turning everyday hardware into persistent beachheads for criminal affiliates, Videostrong prioritized illicit post-sale recurring revenue over the safety and privacy of its users. Downstream hardware brands, white-label resellers, telecommunications providers, and online e-commerce marketplaces also share responsibility for closing this vector. Retailers and distributors should require independent security audits from Original Design Manufacturers (ODMs) and swiftly delist manufacturers implicated in supply-chain abuse.</span></p>\n<p><span style=\"vertical-align: baseline;\">Residential proxy providers have been able to flourish under the guise of legitimate businesses. While some providers may claim to behave ethically and only enroll devices with the clear consent of consumers, any claims of \"ethical sourcing\" must be backed by transparent, auditable proof of user consent. In our analysis, these proxy operators only seek consent when they are forced due to platform policy and enforcement. Silent opt-in without user consent remains the most prevalent means by which devices are turned into exit nodes.  </span></p>\n<h4><span style=\"vertical-align: baseline;\">Empowering and Protecting the Consumer</span></h4>\n<p><span style=\"vertical-align: baseline;\">Residential proxies are an understudied area of risk for consumers, and more can be done to raise awareness. Consumers should be extremely wary of applications that offer payment in exchange for \"unused bandwidth\" or \"sharing your internet.\" These applications are primary ways for illicit proxy networks to grow, and could open security vulnerabilities on the device’s home network. We urge users to stick to app stores you trust, review permissions for third-party VPNs and proxies, and ensure built-in security protections like Google Play Protect are active.</span></p>\n<p><span style=\"vertical-align: baseline;\">Consumers should only purchase connected devices, such as set-top boxes, from reputable manufacturers. Our </span><a href=\"https://www.android.com/certified/partners/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Android TV website</span></a><span style=\"vertical-align: baseline;\"> provides the most up-to-date list of partners.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Industry Collaboration</span></h4>\n<p><span style=\"vertical-align: baseline;\">We encourage mobile platforms, ISPs, online marketplaces and other tech platforms to continue sharing intelligence and implementing best practices to identify malicious backdoors, illicit proxy networks, and other harmful software and limit their harms.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Indicators of Compromise</span></h3>\n<h4><span style=\"vertical-align: baseline;\">Core Malware Samples</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Tool(s)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Package Name</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 