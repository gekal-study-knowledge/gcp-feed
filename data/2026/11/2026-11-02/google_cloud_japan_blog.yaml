  "b02f028a8745a891a870b5dc1389ddcf":
    "id": "b02f028a8745a891a870b5dc1389ddcf"
    "title": "ARTEX とその同類: エージェント型攻撃フレームワークの登場"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks/"
    "published": "2026-11-02 12:10:00"
    "fetched": "2026-11-02 16:15:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 31 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><em><span style=\"vertical-align: baseline;\">執筆者：Aurora Blum、David Mainor、Rohit Nambiar、Omar ElAhdan、Matthew McWhirt、Will Silverstone、Bhavesh Dhake、Chris Busse</span></em></p>\n<hr />\n<h3><strong style=\"vertical-align: baseline;\">はじめに</strong></h3>\n<p><span style=\"vertical-align: baseline;\">攻撃者がエージェント型フレームワークを悪用して高度に自動化された侵入を実行する近年のインシデント事例により、LLM（大規模言語モデル）の敵対的利用の進展に大きな注目が集まっています。Google Threat Intelligence Group（GTIG）は</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 年 9 月のレポート</span></a><span style=\"vertical-align: baseline;\">において、先進的な攻撃者が基本的なプロンプト操作からエージェント型ワークフローや LLM による自動化へと移行し始めていることを指摘しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">同レポートの公開以降、GTIG および Mandiant は、インシデント対応の現場において、複数の攻撃者がオープンソースのエージェント型ペネトレーションテスト用フレームワークである ARTEX、Hexstrike、CAIRN を悪用し、攻撃ライフサイクルの複数の段階にわたって広範な攻撃活動を展開していることを確認しました。このアクティビティは脅威環境全体で観測されており、Wiz の最新</span><a href=\"https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">レポート</span></a><span style=\"vertical-align: baseline;\">でも報告されています。ARTEX や同種のエージェント型攻撃フレームワークの台頭は、オープンソースのマルチエージェント攻撃フレームワークやカスタムエージェントツールの採用へと向かう、攻撃者の広範なシフトを浮き彫りにしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは、複雑な攻撃パスが自動的に連鎖することで侵入規模が指数関数的に拡大し、攻撃がマシンスピードで進行するパラダイムシフトを意味しています。侵害された認証情報の利用や未修正システムの標的化など、侵入の基本的なメカニズム自体は変わりませんが、既存の脆弱性をフレームワークが即座に突く攻撃は、そのスピードと規模の観点で大きなインパクトをもたらし、防御側に新たな課題を突きつけています。セキュリティチーム、開発者、システム管理者には、スケール可能で自律的なソフトウェアに対抗するため、防御戦略を根本から見直すことが求められます。本稿では Mandiant Consulting による防御戦略もご紹介します。提案する防御戦略（コントロールプレーンの分離、短期間のみ有効な認証情報、最小権限の原則、セグメンテーション、ふるまい検知）は、いずれも長年推奨されてきたセキュリティのベストプラクティスです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">実環境で観測された攻撃アクティビティ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">攻撃者が使用するツールは、自律的なエージェント型攻撃へと進化しています。その一例が、ペネトレーションテスト（「ペンテスト」）用に設計されたツール群やフレームワークの活用です。これらのツールやフレームワークは、オープンソースおよびフロンティアモデルの LLM を活用した各種エージェントをオーケストレーションし、侵入の各段階を自動化します。従来、サイバースパイ活動や金銭目的の脅威アクターは、Cobalt Strike や Metasploit など、セキュリティ専門家向けに構築されたペンテストやレッドチーム用プラットフォームを悪用してシステムを攻撃していました。現在では、LLM を活用した攻撃用フレームワークへの移行が進んでいます。これらのフレームワークは以前から存在していましたが、実環境での侵入を成功させ始めており、攻撃のスピードと規模の双方を向上させる決定的な進化を示しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 8 月下旬以降、Mandiant のインシデント対応案件において、ARTEX、PentAGI、CAIRN などのオープンソースのマルチエージェント型ペンテストプラットフォームや、独自のカスタムツールを攻撃者が積極的に運用している事例が観測されています。また、このプラットフォームの使用は当社のリサーチテレメトリによっても裏付けられています。これらのインシデントでは、攻撃ライフサイクルの広範なプロセス（水平展開/ラテラルムーブメント、データベースの悪用、データ持ち出しの準備など）をエージェント型アクティビティが自律的に実行している様子が確認されました。実際の環境でこれらのフレームワーク悪用が確認されたことは、防御側にとって大きな転換点となります。エージェントは複数の攻撃パスの探索、エラーの修復、目標の達成を数秒から数分のうちに自律して遂行できるからです。基盤となる LLM の機能向上と相まって、攻撃速度とスケールの加速は、従来の侵入ダイナミクスを根底から変える重大なシフトとなっています。</span></p>\n<h4><span style=\"vertical-align: baseline;\">ARTEX フレームワーク</span></h4>\n<p><span style=\"vertical-align: baseline;\">ARTEX は、Go 言語で記述され、埋め込み型 Next.js Web コンソールを備えた、自律型のマルチエージェント LLM 駆動型ペンテスト兼攻撃用 C2（Command and Control）プラットフォームです。このフレームワークは元々ユーザー </span><a href=\"https://github.com/Autumn-27\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">Autumn-27</span></a><span style=\"vertical-align: baseline;\"> によって開発され、GitHub 上で公開されました。広範な悪用を理由に 2026 年 10 月に制作者によりオリジナルのリポジトリは削除されましたが、ScopeWeaver などのローカライズ版や ARTEX PRO と呼ばれる商用版を含め、コミュニティのフォークを通じて世界的に拡散し続けています。ARTEX は、攻撃ライフサイクルを 6 つの専門サブエージェントに抽象化します。フロンティアモデルやオープンソースモデルの API を活用することで、ハイレベルな戦術目標を実行可能なマシンコマンドへと変換します。GTIG では、Active Directory の自動偵察、権限昇格、標的のクラウドインフラのプロファイリング（Azure ストレージキーの収集など）から、カスタム Web シェルの合成と展開に至るまでの各種機能を観測しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 8 月下旬以降、ARTEX は金銭目的の恐喝グループからサイバースパイを目的と推測される攻撃者まで、動機を問わず多様な攻撃者に採用されています。例えば、Wiz Research チームは ARTEX に関連するキャンペーンを追跡しており（GTIG では UNC7228 として追跡）、これは Microsoft が </span><a href=\"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">中国との関連が疑われる攻撃者 STORM-0940 として追跡している活動</span></a><span style=\"vertical-align: baseline;\"> と重複しています。Wiz の調査により、</span><a href=\"https://www.wiz.io/blog/artex-in-the-wild-storm-0940-expands-targeting-of-it-and-software-vendors\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">10 月に報告された IT 関連の活動</span></a><span style=\"vertical-align: baseline;\"> に留まらず、少なくとも 2026 年 8 月まで遡る活動であることが判明しました。Wiz は、米国および欧州のエンタープライズ向けソフトウェア、産業オートメーション、半導体製造・設計、電気通信の各業界にわたる複数組織への標的化、侵害活動、およびデータ窃取の活動を特定しました。この攻撃者は非常に迅速に行動し、最初に侵害したアカウントから深部のシステムアクセス権を獲得するまで通常約 4 時間、最速事例ではわずか 15 分で到達しています。また、被害者の環境に合わせてツールをカスタマイズし、初期インフラがブロックされた場合はオープンプロキシにフォールバックする柔軟性も見せています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ARTEX の採用拡大を示す事例として、GTIG と Mandiant はインシデント対応調査において、侵害後の偵察、ラテラルムーブメント、権限昇格に ARTEX を使用する複数の攻撃グループを観測しました。これには、データ窃取恐喝を行う金銭目的の攻撃者や、中国との関連が疑われる追加の攻撃クラスタが含まれます。これらの攻撃活動は、米国の政府、テクノロジー、化学・素材、製造分野の組織に被害を与えたほか、アジアの金融セクターを標的にした ARTEX の活動に関する</span><a href=\"https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">公開レポート</span></a><span style=\"vertical-align: baseline;\">とも一致しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">複数の事例において、攻撃者は標的組織の盗まれた認証情報を ARTEX に与え、攻撃ライフサイクルの後続フェーズを実行するよう命令していました。これらの侵入分析から、ARTEX フレームワークによるアクティビティと人間オペレーターによる操作との間に、いくつかの主要な相違点が判明しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ログファイルとタイムスタンプに基づき、人間オペレーターとしては極めて不自然なバースト状のアクティビティが特定されました。各侵入プロセスには意図的な休止時間（インターバル）が含まれていたものの、個々の ARTEX 実行シーケンスは約 2 秒から 25 秒の極めて短時間に集中して実行されました。ある攻撃では、23 秒間のアクティブバースト時間に 27 件のイベントが発生し、異なるセキュリティグループ間で AWS パーミッションの急速なスキャンが実施されていました。また、データ持ち出し用のスクリプト準備中、「スクリプトサイズが大きすぎる」というエラーが発生した際も、ARTEX は自律的にスクリプトを調整・トリミングして再実行し、約 10 秒で 17 個のスナップショットインスタンスのデプロイを成功させました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">熟練した人間のオペレーターと比較すると、ARTEX は迅速な試行錯誤に依存していたため、フォレンジック調査の観点ではるかに多くのノイズ（痕跡）を残す形でコード実行を達成していました。ある事例では、有効な認証情報を与えられた ARTEX が外部公開された Linux Weaver OA Web サーバーにアクセスし、公開 API 呼び出し経由で SQL コマンドを実行しました。合法的に公開されたアプリケーション固有の API 呼び出しを利用して、ARTEX は技術的な課題に遭遇しながらも一部のコマンド実行を成功させ、さらなる偵察を行いました。しかし、このプロセスで 240 件ものログイベントが生成され、複数のサブエージェントが同一目標を追求する中で相互に上書きし合うことによるエラーも発生していました。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">データベース実行コンテキストからシステム実行コンテキストへとピボット（展開）を試みるにあたり、ARTEX は提供されたユーザー認証情報でアクセス可能なアプリケーション固有の SQL API を使用し、</span><code style=\"vertical-align: baseline;\">.jsp</code><span style=\"vertical-align: baseline;\"> 拡張子のログファイルを公開アクセス可能な場所に書き出すよう MySQL インスタンスを変更しました。実行された SQL コマンドは、MySQL ログを汚染して Web アクセス可能な JSP Web シェルを書き込ませることを意図していたと見られます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">この API を使用して、ARTEX は </span><code style=\"vertical-align: baseline;\">SET GLOBAL general_log_file = '&lt;Webシェルのパス&gt;’</code><span style=\"vertical-align: baseline;\"> を実行した後に </span><code style=\"vertical-align: baseline;\">SET GLOBAL general_log = 1</code><span style=\"vertical-align: baseline;\"> を実行し、その後の SQL コマンドが </span><code style=\"vertical-align: baseline;\">general_log_file</code><span style=\"vertical-align: baseline;\"> で定義されたファイルパスに書き込まれるようにしました。その後、ARTEX は </span><code style=\"vertical-align: baseline;\">`SELECT '&lt;% [Webシェルコンテンツ] %&gt;'`</code><span style=\"vertical-align: baseline;\"> という形式の SQL SELECT 文を実行しました。基盤となる Java Web サーブレットによる JSP ファイルの処理仕様により、'&lt;% %&gt;' 内の Java コードがパースされ、プロセス メモリ空間にコンパイルされることで、実行手段が確保されました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ログアクティビティには、上記のシーケンスが複数回繰り返された痕跡があり、Web シェルの候補ごとに連番のようなファイル名（</span><code style=\"vertical-align: baseline;\">cl1217.jsp, f1219a.jsp, z1219.jsp</code><span style=\"vertical-align: baseline;\">）が使用され、それぞれ異なるコマンドが実行されていました。Web シェルの実行試行時に発生したエラー（例: 「</span><code style=\"vertical-align: baseline;\">variable ‘t is already defined</code><span style=\"vertical-align: baseline;\">」）により Web シェルが失敗すると、ARTEX はアプローチを修正し、それぞれ異なる目的を持つ独自の Web シェルを複数書き込み、エラーを修正しながら、</span><code style=\"vertical-align: baseline;\">.jsp</code><span style=\"vertical-align: baseline;\"> Web シェルが正常に実行されて有効なコマンド出力を返してくるまで処理を続けました。</span></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">別の事例では、アクセス試行中に ARTEX が </span><code style=\"vertical-align: baseline;\">artex-probe-*</code><span style=\"vertical-align: baseline;\">（* は 5 桁の連番風の数字）というファイル名の各種拡張子ファイルを生成しました。調査結果からは数値の厳密な意味や増加法則の特定は困難ですが、ARTEX は作成したドロップファイル名、アカウント名、パスワード、メール件名内でも同様の連番風の数値マーカーを使用していることが確認されています。</span></p>\n<h4><span style=\"font-style: italic; vertical-align: baseline;\">攻撃ライフサイクルの各フェーズにおける ARTEX のアクティビティ一覧</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><a href=\"https://cloud.google.com/security/resources/insights/targeted-attack-lifecycle?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Phase of the attack lifecycle</strong></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">観測された ARTEX の機能と手口</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">初期偵察</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">取得した Azure 認証情報（SAS トークン、サービス プリンシパル、Kudu 認証情報、ストレージ アカウント キー）の有効パーミッションを、サブ秒単位の権限確認、テスト用 Blob の書き込み/削除、ARM デプロイ検証ドライラン スウィープにより自動マッピングしました。これには急速なアクティビティが含まれ、ARTEX は約 330〜400 ms で極小のテスト用 Blob を書き込んで即座に削除し、8 秒間で 11 種類の Azure リソースタイプにわたる ARM </span><code style=\"vertical-align: baseline;\">deployments/validate</code><span style=\"vertical-align: baseline;\"> ドライラン スウィープを実行しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">侵害した IAM ユーザー権限を </span><code style=\"vertical-align: baseline;\">DryRun</code><span style=\"vertical-align: baseline;\"> フラグとプレースホルダー ID を使ってテストし、EC2 コンピュート、EBS ボリューム、スナップショット機能を評価しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">500 回以上の Web リクエストにわたり、ARTEX は各種 Web ディレクトリで様々なファイル名や拡張子を試行し、HTTP レスポンスコード（</span><code style=\"vertical-align: baseline;\">200</code><span style=\"vertical-align: baseline;\"> または </span><code style=\"vertical-align: baseline;\">403</code><span style=\"vertical-align: baseline;\">）に基づいて Web サーバーがアクセスを許可する URL エンドポイントをファジング探索しました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">足場確立</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kudu 管理 API を悪用して任意のコマンドを実行し、カスタムの Python、C#、不正な PowerShell スクリプトをステージングしました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ネイティブの curl を使用して動的に生成された PowerShell およびバッチ スクリプトをダウンロードし、491 個のローテーションする </span><code style=\"vertical-align: baseline;\">webhook.site</code><span style=\"vertical-align: baseline;\"> URL 経由でコマンド結果を送り返すことで、被害組織の内部 Windows データベース サーバー上に C2 および実行権限を確立しました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">権限昇格</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">高価値な IAM ロールを持つ可能性のあるクラウドコンピュートインスタンスを立ち上げ、そのロールの一時認証情報を取得することで権限昇格を試みました。ただし、無効なインスタンスプロファイル ARN が原因で、これらの試みは失敗したと見られます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kerberoasting スクリプトを実行して侵害したドメイン全体からサービスチケットを収集し、SQL インジェクションを用いてデータベース認証情報をダンプし、オフラインでのクラッキング時間をおいた後、DCSync スクリプトを実行してドメイン krbtgt キー、クラウド AD 同期認証情報、ドメインコントローラーのマシンハッシュを窃取することで権限を昇格させました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">書き込み可能な admin フラグを特定して活用し、数分以内に </span><code style=\"vertical-align: baseline;\">is_admin=true</code><span style=\"vertical-align: baseline;\"> を設定したアカウントを作成しました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">内部偵察</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ドメインコントローラーおよびフェデレーションサーバーに対して、反復的に生成された PowerShell 列挙スクリプトを実行し、内部ネットワークの偵察を行いました。スクリプトは事前認証なしでドメインユーザー名を検証し、グループ管理サービスアカウント（gMSA）をリスト化し、Active Directory 証明書サービス（AD CS）テンプレート（SmartcardUser、ClientAuth）を監査し、数千のフォレスト間セキュリティプリンシパルをマッピングし、内部 Exchange、PasswordState 認証情報ボルト、SSRF/SCM ターゲットをスキャンしました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">水平展開（ラテラルムーブメント）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Pass-the-Ticket、WinRM、Kerberos リレイ、Pass-the-Hash スクリプトを使用してドメインコントローラーへの横移動を試みましたが、エンドポイント保護機能によって実行がブロックされ、防御側がサーバーへのアクセスを遮断する直前に、ローカル Windows サービスのトークン権限制限に直面しました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">潜伏の維持</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">新しい SSH キーペアを生成し、専用のパブリック Elastic IP を割り当て、カスタムセキュリティグループの作成を試みたものの権限問題で失敗したため、既存のセキュリティグループにバインドされた永続的な </span><code style=\"vertical-align: baseline;\">t3.micro</code><span style=\"vertical-align: baseline;\"> インスタンスを起動して、外部からアドレス指定可能なジャンプホストおよび内部の足場を構築しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アカウント乗っ取り（特定されたユーザーのパスワードリセットなど）、命名規則に </span><code style=\"vertical-align: baseline;\">ArtexProbe</code><span style=\"vertical-align: baseline;\"> を含むプレーンテキストのパスワードを持つ複数アカウントの作成、管理者アカウントの作成によって永続性を確保しました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">目的の達成</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">バックエンド SQL データベースへのクエリ実行（約 20 回のクエリで約 400 KB の結果を抽出）および大量の Blob 読み取りを実行しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">キーレスな一時 EC2 インスタンスを介してカスタム ブート スクリプトをデプロイし、マウントされた複数の EBS スナップショットやボリュームからデータを収集しようと試みました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ドメインコントローラーから 110,000 以上の Active Directory オブジェクトを列挙し、Domain Admins グループを取得しました。その後、curl を介してローテーションする webhook.site エンドポイントにコマンド出力を送信しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">クエリを実行して保存されたメモを復号し、他のユーザーのメモ添付ファイルの読み取りを試みました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">新しい 100GB のボリュームを作成し、起動したインスタンスのルートディスクを 60GB に拡張しました。これは自動収集スクリプトによるデータの持ち出しを目的とした事前準備とみられます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">レガシー データベース内の従業員レコードを編集し、メモやステータス行を作成・削除し、チェックリストの応答を自らのプローブファイルを指すように変更しました。この事例では、正規機能の興味深い悪用が観測されています。ARTEX は複雑なマルウェアを実行するのではなく、組み込みのアプリケーション機能を武器化しました。アプリケーションの通知システムを強制操作して 1,300 人以上の内部ユーザーにテストメールを送信し、信頼された通知チャネルを大量の内部メッセージングツールへと変貌させました。その後、一括送信から単一の受信者へのテストメールへと移行しました。</span></p>\n</li>\n</ul>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h4><span style=\"vertical-align: baseline;\">PentAGI 攻撃フレームワーク</span></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG はまた、孤立した環境内でペンテストプロセスを自動化するために設計された自律型攻撃フレームワーク「PentAGI（Penetration Testing Artificial General Intelligence）」の悪用も確認しています。VXControl によって開発されたこのフレームワークは、オープンソース版と商用版が提供されています。ユーザーがターゲットとゴールを指定するだけで動作するよう設計されており、初心者でも複雑なサイバーセキュリティキャンペーンを実行できるようになります。ターゲットとゴールが設定されると、フレームワークは独自の機能を備えた専門エージェントチームを活用してタスク（「Flows」と呼ばれる）をサブタスクに分解・実行し、報告を行います。ツールやコマンドはホスト環境ではなく、Kali Linux を実行する孤立したサンドボックス内で実行されます。PentAGI が使用するツールは、すべて Kali Linux でデフォルト利用可能なオープンソースのペンテストツール（Metasploit、Nmap、SQLmap など）です。このフレームワークは、フロンティアモデルやオープンウェイトモデルを含む 10 種類以上のクラウドおよびローカルの LLM バックエンドをサポートしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">観測された PentAGI のアクティビティの大部分は、WHOIS による資産マッピングやアクティブな脆弱性スキャンの段階にとどまっていました。しかし、運用上の痕跡（アーティファクト）の分析結果から、一部の攻撃活動は複数の組織に対するアクティブな侵入や潜伏（永続化）へと進行していたことが示されています。オペレーターもまた、フレームワークを様々な方法で適応・統合させています。ある事例では、オープンソース版 PentAGI をベースに構築されたカスタム攻撃オーケストレーションプラットフォームが特定されました。これは少なくとも 2026 年 8 月下旬から 10 月初旬にかけて、システムインテグレーターや大手通信事業者を含むアジアの広範な組織に対して組織的な偵察や脆弱性スキャンを行うために使用されたとみられます。また別の事例では、航空宇宙セクターを標的とするために PentAGI とプロキシサービスが連携して使用されている様子も観測されました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">自律型攻撃フレームワークの進化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">脅威環境における LLM 機能の活用は、短期間のうちに著しい成熟を見せています。これには、LLM が生成した悪意のあるコードの組み込み、動的な LLM 対応マルウェアの開発、エージェントハーネスファイルの汚染、マルチエージェント型攻撃フレームワークの構築などが含まれます。特に、2025 年後半から 2026 年 10 月にかけて、自律型および半自律型の攻撃フレームワークは決定的な運用上の閾値を越え、攻撃者によって実際の環境への侵入に積極的に悪用されるマルチエージェントフレームワークへと変化しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">GTIG はこの実験的試みの進化を追跡してきました。初期の単純なプロンプト操作によるコーディング支援から、実際の環境におけるフレームワークの悪用、そして人間が指示を出すだけで完全に自律的なフレームワークが侵入を実行する将来の脅威モデルへと至るプロセスです。完全自律型攻撃では、人間の役割はエージェントに標的を指示することだけであり、あとは運用の成果を得るのみとなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">現時点で、自律型攻撃フレームワークに対する攻撃者の利用はまだ初期段階にあると評価されます。現在はオープンソースツールが洗練されていない方法で使用されており、結果として検知されやすいノイズの多いキャンペーンとなっていますが、攻撃自体は成功を収めています。これらのフレームワーク、基盤となる LLM、およびそれを指示する人間オペレーターの洗練度が向上するにつれ、人間の介在が減るだけでなく、隠蔽性や攻撃の高度化も進むことが予想されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">以下は、過去 1 年間におけるサイバー攻撃での LLM 拡張機能の進化の過程と、今後の展望をステージごとに表しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ステージ 1：プロンプトベースの LLM 利用</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：攻撃者がチャットボット形式で LLM とやり取りし、マルウェアのコード記述やデバッグ、フィッシングメールの作成、ペルソナの構築、ターゲットの軽微な偵察などに LLM を利用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：失敗リスクが低く修正が容易な単純作業を LLM にアウトソースし、個々の個別タスクの処理速度を向上させます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム：</strong><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/adversarial-misuse-generative-ai?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2025 年末から 2026 年初頭</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ステージ 2：マルウェアへの LLM 機能の埋め込み</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：HONESTCUE や PROMPTSPY などのマルウェアファミリーに見られるように、コード記述などエラーリスクの低い特定の操作を LLM に委任し、実行時に動的に LLM を使用してペイロードを多様な方法で難読化し、検知の回避を試みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：侵入後のフェーズにおいて LLM を組み込み始めます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム</strong><span style=\"vertical-align: baseline;\">：</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/distillation-experimentation-integration-ai-adversarial-use?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 年初頭</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ステージ 3：オペレーションへの LLM 自動化の組み込み</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：エージェント機能の発達に伴い、特定の個別タスク（マルウェア開発環境の構築やデバッグなど）への利用を開始します。人間のオペレーターと並行してエージェントが使用され、新たなエクスプロイトの開発や高リスクな脆弱性研究の支援を行います。また、LLM 利用に対する OPSEC（作戦保安）や可視性を意識し始め、アクティビティを隠蔽するために LLM プロキシサービスを導入します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：人間が監視・介入する形で、よりハイリスクで重要なタスクに LLM が活用されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム</strong><span style=\"vertical-align: baseline;\">：2026 年初頭 - </span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 年 9 月</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ステージ 4：自律型フレームワークの開発と実験</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：自律型フレームワークの開発と実験を開始します。キャンペーンでは攻撃ライフサイクルのより多くの段階を LLM 拡張ツールに任せ、自律的なアクションを実行するためにモデル API を自作ツールや Telegram ボットに統合します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：攻撃ライフサイクルのより多くの段階を LLM に実行させる実験が進みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム</strong><span style=\"vertical-align: baseline;\">：</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 年半ば - 2026 年 9 月</span></a></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ステージ 5：実環境での LLM 駆動型ツールによる複数フェーズの同時実行</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：実際の環境において、最小限の人間の介入でライフサイクルの大部分をエージェントが担当する大量無差別攻撃が観測されます。また、より自律的な機能を備えたマルウェアを伴う活動も見られます。さらに、LLM ミキサー、推論サービス、ローカルモデルなどを活用して難読化を高める実験も継続しています。全体的な TTP（技術・戦術・手順）は精緻さに欠けノイズが多いものの、攻撃自体は成功しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：実際の攻撃運用に LLM を積極的に統合する一方で、最先端モデル（フロンティアラボ）への依存を減らしたり隠蔽したりする方法を模索しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム</strong><span style=\"vertical-align: baseline;\">：現在の発展段階</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ステージ 6：人間の介在ゼロ、またはほぼゼロで行われる低レベルなマルチエージェント型攻撃</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：高度に自律化されているものの手法自体は洗練されておらず、フォレンジック的にノイズの多い運用となり、人間オペレーターは介在しません。攻撃者が標的と目的を設定すると、マルチエージェント型フレームワークが攻撃チェーン全体を実行して目的を達成・報告します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：攻撃インフラやツールの多様化を進め、防御側の可視性をさらに阻害します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム</strong><span style=\"vertical-align: baseline;\">：近々（1〜3 ヶ月以内）</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ステージ 7：高度な完全自律型・エージェント型攻撃</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティビティ</strong><span style=\"vertical-align: baseline;\">：攻撃用途における LLM の成熟度のピークを表し、人間の介在が不要な完全自律型侵入であるだけでなく、隠蔽性と巧妙度が大幅に向上します。オペレーターは難読化された専用インフラやセルフホスト型 LLM を通じてのみモデルとやり取りします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">進化のポイント</strong><span style=\"vertical-align: baseline;\">：防御側の可視性を極限まで制限しつつ、自律的かつ高度に隠蔽された作戦展開が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムフレーム</strong><span style=\"vertical-align: baseline;\">：中期（3〜6 ヶ月以内）</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">悪意のあるアクターが攻撃用の自律型エージェントの実験を続け、将来的な完全自律運用へとシフトしていくと考えられます。GTIG では、ZeroHollow 推論サービスや完全エージェント型フレームワークである </span><a href=\"https://github.com/agent0ai/agent-zero\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\">AgentZero</span></a><span style=\"vertical-align: baseline;\"> などのツールを使った実験の痕跡を確認しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">今後の展望</strong></h3>\n<p><span style=\"vertical-align: baseline;\">過去 12 ヶ月間で、GTIG は LLM を悪用した攻撃手口の決定的な進化を観測しました。単発的な運用生産性向上支援のレベルから、連携したマルチエージェント自律型攻撃フレームワークのデプロイへと進化しています。四半期ごとの</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">調査レポート</span></a><span style=\"vertical-align: baseline;\"> に記載された初期のマイルストーンではエージェント技術への初期の関心が示されていましたが、最前線のインシデント対応や予防的インテリジェンス収集における最近の観測では、侵入中の特定のタスクや段階を自動化するためにこれらのフレームワークを採用している実態が浮き彫りになりました。攻撃者は生成モデルを積極的に活用して前例のない速度とスケールを実現し、エージェント型 AI 機能や自動化を活用したより複雑な攻撃インフラの構築を進めています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ARTEX のようなフレームワークは攻撃のタイムラインをマシン速度まで圧縮しますが、現時点ではスピードと引き換えに隠蔽性を犠牲にしています。制限なしの自律実行はフォレンジックなトラフィックを大量に発生させ、特徴的な識別子に依存し、明確なコードレベルの痕跡を残すため、検知や緩和の可能性を高めます。そのため、これらのツールは検知されることによるリスクやコストが低いシナリオに最も適しています。さらに、検知と遮断/対応は異なる機能であり、単に攻撃を時間内に検知しただけでは、攻撃者の目的達成を阻止するのには十分ではない場合もあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">したがって、GTIG は高い確信度をもって、サイバー犯罪グループが自律型攻撃ツールの運用への組み込みを継続すると評価しています。キャンペーンの到達範囲拡大によって、成功率の多少の低下は十分に相殺できるためです。長期的アクセス維持を狙う隠蔽重視の攻撃者は公開版ツールの採用率は低いと予想されますが、運用の優先順位によってはスピードやスケール目的で利用する可能性があります。動機に関わらず、参入障壁の低さ、新エクスプロイト統合の容易さ、大規模なスケーラビリティにより、自律型フレームワークは幅広い攻撃者にとって低コストで攻撃能力を飛躍的に高める魅力的な手段となっており、今後も採用拡大が続く可能性が極めて高いと考えられます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AI を悪用した攻撃への防御：5 つの防衛レイヤー</strong></h3>\n<p><span style=\"vertical-align: baseline;\">LLM 対応の攻撃ツールは、攻撃手法そのものを根本から変えるものではなく、それらを組み合わせる時間を大幅に短縮します。従来ならオペレーターが数時間かけて行っていた認証情報の発見、権限チェック、横移動、データアクセスが、正規の ID や標準機能を通じて数分で完了するようになります。これらは静的インジケーターでは検知できません。防御側が最も効果的に対処できるのは、単一の ID、認証情報、またはワークロードの侵害が極めて限られたアクセス権しか付与しない設計にすることです。コントロールプレーンの露出を抑制し、長期有効なシークレットを短期かつ権限範囲の絞られた認証情報に置き換え、アプリケーション階層をセグメント化し、重要なビジネス機能にガードレールを設置することで、自動化によるスピードの優位性を削ぐことができます。ふるまい検知はこれらの管理策で防げなかったアクティビティに対処しますが、正常な状態を定義するための十分な ID、コントロールプレーン、データプレーン、ネットワークのテレメトリが不可欠です。これらの管理策の多くはすでに馴染みのあるものですが、自動化ツールは管理策間のギャップを遥かに早く発見し悪用できる点が異なります。</span></p>\n<p><span style=\"vertical-align: baseline;\">上述の通り、LLM 対応の攻撃用ツールはサイバー攻撃のスピードとスケールを向上させています。LLM 対応・自律型ツールは弱点の特定、アクセス確認、エラーの解釈、アプローチの修正、攻撃パスの継続を、人間の介在を最小限に抑えて行います。環境の調査、コードの記述や修正、エラー対応、次のステップの実行に数時間を要していた作業が、数分で完了するようになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">これは検知上の大きな課題も生み出します。アクティビティの多くは有効な認証情報とLotL（Living off the Land：環境寄生型）手法など正規機能を利用します。攻撃者が正規のサービスプリンシパルで認証し、標準管理 API を呼び出し、サポートされたプロトコルでクラウドストレージにアクセスし、既存の管理インターフェース経由でコマンドを実行することが考えられます。ツール名、ハッシュ、IP アドレスなどの静的インジケーターも有用ですが、こうしたアクティビティの多くを網羅することはできません。</span></p>\n<p><span style=\"vertical-align: baseline;\">効果的な防御には、次の 2 つの能力の組み合わせが必要です。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">有効なアクセス権を得た攻撃者の行動を制限する管理策</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ID、アプリケーション、ワークロードが通常のパターンから外れて動作し始めたことを示すテレメトリ</span></p>\n</li>\n</ol>\n<h4><span style=\"vertical-align: baseline;\">LLM の敵対的利用が攻撃タイムラインをどう変えるか</span></h4>\n<p><span style=\"vertical-align: baseline;\">LLM 対応または高度に自動化された攻撃アクティビティの調査では、いくつかの共通テーマが繰り返し浮き彫りになっています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スピードと規模</strong><span style=\"vertical-align: baseline;\">：自動化ツールは広範な偵察、複数の攻撃パスの同時検証、エラーへの即座の対処を行い、ただちに後続のアクティビティに移行します。初期アクセスから権限確認、ラテラルムーブメント、データアクセスに至る時間が大幅に短縮されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">相互接続された環境</strong><span style=\"vertical-align: baseline;\">：攻撃者が単一の技術スタック内にとどまることは滅多にありません。インターネットに面したアプリの設定ファイルから認証情報が露出し、その認証情報がクラウドストレージ、ソースリポジトリ、ID システム、内部インフラへのアクセスを許す可能性があります。自動化により、こうした相互関係の迅速な発見と検証が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一見正当に見える ID アクティビティ</strong><span style=\"vertical-align: baseline;\">：個別に観察すると正常に見えるアクションが多く存在します（サービスプリンシパルの認証、API 呼び出し、ストレージオブジェクトのダウンロードなど）。より強力な検知シグナルはコンテクスト（リクエスト発生元、発生頻度、前後のアクション、その ID として予期される挙動か）から得られます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コントロールプレーンおよびデータプレーンの盲点</strong><span style=\"vertical-align: baseline;\">：多くの組織は堅牢なエンドポイント監視を備えていますが、管理 API、プログラム用 ID、クラウドストレージアクティビティに対する可視性は十分ではありません。権限テスト、ストレージキーの取得、大量ダウンロード、ファイアウォール変更、管理 API 呼び出しがログに記録されていても、有用なアラートが発生しない場合があります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Mandiant は、ラテラルムーブメントを制限し、自律型ツールのスピード優位性を抑制するために、企業防衛を以下の 5 つの基本レイヤーで構築することを推奨しています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">レイヤー</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p style=\"text-align: center;\"><strong style=\"vertical-align: baseline;\">説明</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイヤー 1：コントロールプレーンの保護</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">すべての管理 API、コンソール、CI/CD へのアクセスを信頼できるネットワークに限定</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイヤー 2：ID とキーの制限</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">短期間のみ有効なワークロード認証情報へ移行し、シークレットを廃止</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイヤー 3：設定の強化</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">アプリおよびインフラ全体での継続的な脆弱性スキャンを実施</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイヤー 4：アプリケーションの保護</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">正規機能や性能の悪用を防止するためにアプリケーションを強化</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">レイヤー 5：行動変化の検知</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ID の速度変化、API のバースト、容量的異常をモニタリング</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p style=\"text-align: center;\"><span style=\"font-style: italic; vertical-align: baseline;\">表 1：敵対的 LLM のスピード優位性とラテラルムーブメントを制限するための基本的防衛レイヤー</span></p>\n<h3><strong style=\"vertical-align: baseline;\">レイヤー 1：コントロールプレーンの保護</strong></h3>\n<p><span style=\"vertical-align: baseline;\">環境の管理、デプロイ、再設定に攻撃者が利用可能なシステムへのアクセスを制限します。</span></p>\n<p><span style=\"vertical-align: baseline;\">コントロールプレーンは Active Directory やクラウドコンソールにとどまりません。ID プロバイダー、クラウド管理 API、ネットワーク/ファイアウォール管理プラットフォーム、仮想化インフラ、コードリポジトリ、CI/CD システム、特権アクセス管理プラットフォーム、バックアップインフラ、認証局（CA）、SaaS 管理コンソール、アプリケーション管理インターフェースなども含まれます。</span></p>\n<h4><span style=\"vertical-align: baseline;\">重要な理由</span></h4>\n<p><span style=\"vertical-align: baseline;\">インターネットからアクセス可能な管理インターフェースは、認証情報が取得された後、急速に攻撃パスへと組み込まれるおそれがあります。たとえば、Azure App Service には Kudu Site Control Manager（SCM）経由の管理インターフェースが含まれており、アプリのデプロイや管理機能をサポートしています。攻撃者が発行用認証情報や同インターフェースにアクセス可能な ID を入手した場合、自動化によって認証テスト、機能列挙、アプリファイル操作、コマンド実行、出力取得、アタッチされたアーティファクトの削除などを瞬時に実行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">同様の外部露出は、ファイアウォール管理、仮想化コンソール、クラウド管理 API、バックアッププラットフォーム、CI/CD インターフェース、その他の管理サービス全体に存在します。アクセス可能な管理パスが存在するだけで、自動化された攻撃者に新たな検証テストの手段を与えてしまうことになります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">軽減策</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">管理者向けインターネット外部露出の削減</strong><span style=\"vertical-align: baseline;\">：クラウド管理、ネットワーク機器管理、アプリ発行インターフェース、ハイパーバイザー、バックアッププラットフォームなどの機密サービスへのアクセスは、可能な限り信頼できるネットワーク、プライベート接続、または専用の管理パスに制限します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">信頼できる管理パスの義務化</strong><span style=\"vertical-align: baseline;\">：特権ユーザーに対し、管理対象デバイス、特権アクセス端末（PAW）、または承認されたジャンプホストからの管理操作を要求します。サポートされている場合は、FIDO2 やパスキーなどのフィッシングに耐性のある認証と組み合わせます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アプリ管理インターフェースの強化</strong><span style=\"vertical-align: baseline;\">：アプリの管理および発行エンドポイントを、公開アプリの延長としてではなく特権インフラとして取り扱います。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">適切な場合、Kudu/SCM エンドポイントへのアクセス制限を個別に設定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">SCM アクセスを承認された管理ネットワークやデプロイ用インフラに制限します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">不要な基本認証（Basic Auth）による発行機能を無効化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">デプロイおよび発行用認証情報へのアクセスを制限します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">デプロイ済みアプリファイルの直接改変を防ぐ run-from-package などのデプロイモデルを検討します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">設計による公開範囲の管理</strong><span style=\"vertical-align: baseline;\">：パブリック IP の割り当てに関するガバナンスを確立し、ワークロードや管理インターフェースをインターネットに直接公開する前にアーキテクチャレビューを義務付けます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プログラムによる管理への同様のコントロール適用</strong><span style=\"vertical-align: baseline;\">：サポートされている場合、管理用サービスプリンシパルや自動化 ID を、想定されるネットワーク、ワークロード、またはプライベート接続に限定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">個別のアタックサフェースとしてのコントロールプレーン監視</strong><span style=\"vertical-align: baseline;\">：クラウドプラットフォーム、アプリ管理インターフェース、ネットワークインフラ、バックアッププラットフォームなどの管理システムから、認証、設定変更、デプロイ、管理テレメトリを集約・一元化します。過去に確認されていないネットワーク、ホスティングプロバイダー、地域からの管理アクセスに対してアラートを発します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">レイヤー 2：ID とキーの制限</strong></h3>\n<p><span style=\"vertical-align: baseline;\">盗まれた認証情報の有効期限、アクセス権限、使用可能な場所を制限することで、その価値を低下させます。</span></p>\n<p><span style=\"vertical-align: baseline;\">セキュリティプログラムは従来、人間の ID の保護を重点的に扱ってきました。しかし、サービスプリンシパル、サービスアカウント、API キー、ストレージキー、クラウドアクセスキー、デプロイトークン、PAT（個人用アクセストークン）、アプリシークレットなどは、広範なアクセス権を持つにもかかわらず監視が手薄になりがちです。</span></p>\n<p><span style=\"vertical-align: baseline;\">プログラム用 ID は、長期間有効な認証情報、広範な権限、限定的な条件付きアクセス制御、不十分なモニタリングが組み合わさった場合、自動化された攻撃者にとって格好の標的となります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">重要な理由</span></h4>\n<p><span style=\"vertical-align: baseline;\">外部露出したクラウドストレージ認証情報を例に考えてみましょう。自動化ツールがソースコード、環境変数、アプリ設定、データベース、あるいは侵害した別のシステムから認証情報を発見すると、即座に検証を行い、利用可能なデータの列挙を開始できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">インターネット上のどこからでも利用でき、広範なストレージアクセスを認める長期間有効な認証情報が存在すると、単一の認証情報漏洩が瞬時に大規模なデータアクセス被害へと拡大するリスクがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">サービスプリンシパルなどのプログラム用 ID でも同様のパターンが当てはまります。内部 CI/CD ランナー用に用意された認証情報であっても、任意のネットワークから認証して本番リソースにアクセスできる状態であれば、リスクは著しく高まります。</span></p>\n<p><span style=\"vertical-align: baseline;\">そのため、認証情報のセキュリティ対策では、「ID が何にアクセスできるか」と「そのアクセスが有効となる条件」の両方に対処する必要があります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">緩和策</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードおよびプログラム用 ID の優先管理</strong><span style=\"vertical-align: baseline;\">：特権を持つ人間用 ID と同等の厳密さを、サービスプリンシパル、サービスアカウント、API キー、クラウドアクセスキー、アプリ認証情報、デプロイトークン、PAT にも適用します。これらの ID には所有者の明確化、ライフサイクル管理、最小権限、モニタリング、インシデント対応手順を設定する必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">長期的な認証情報から短期的な認証情報への移行</strong><span style=\"vertical-align: baseline;\">：永続的なシークレットを廃止し、可能な限り一時的またはワークロードに紐付いた認証情報を使用します。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">静的な AWS IAM アクセスキーから IAM ロールによる一時認証情報へ移行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Azure サービスプリンシパルのクライアントシークレットをマネージド ID に置き換えます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Azure Storage アカウントの共有キー認証を無効化し、条件付きアクセスポリシーを適用した Entra ID 認可へ移行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">長期的なサービスアカウントキーの代わりに Google Cloud Workload Identity 連携を使用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GitHub のクラシック PAT から、細分化された PAT や GitHub Actions OIDC などのワークロードベース認証へ移行します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">「場所」と「対象」の両方の制約</strong><span style=\"vertical-align: baseline;\">：非人間 ID がアクセスできる API、サブスクリプション、プロジェクト、リポジトリ、ストレージ、システムを実際に必要な範囲に制限します。また、それらの ID が認証できる場所やワークロードも制限します。内部 CI/CD ランナーが使うサービスプリンシパルを、外部の無関係なインフラから利用できないようにすべきです。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">マルチクラウドのサービスプリンシパルを強化するには、長期的な静的認証情報を短期間のトークンに置き換え、アクセス制御を厳格に適用する必要があります。主要プロバイダーにおける主なアプローチは以下の通りです。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud</strong><span style=\"vertical-align: baseline;\">：Workload Identity 連携と対象を絞った IAM 制約を活用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AWS</strong><span style=\"vertical-align: baseline;\">：OIDC フェデレーションとサービスコントロールポリシー（SCP）を組み合わせて活用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Azure</strong><span style=\"vertical-align: baseline;\">：条件付きアクセスポリシーを適用し、文脈に応じてアクセスを制限します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Okta</strong><span style=\"vertical-align: baseline;\">：Private Key JWT 認証とネットワーク制限付き認証ポリシーを実装します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">各クラウドプラットフォームにおいて、プライベート接続、想定送信元範囲、ワークロードフェデレーション、リソースポリシー、IAM 条件などを適切に利用します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AWS IAM ロール委任の制限</strong><span style=\"vertical-align: baseline;\">：ある ID が別の ID の権限を割り当てたり引き継いだりすることを許可するパーミッションを厳格に管理します。AWS では、iam:PassRole を特定のロールおよび意図したサービスに制限し、iam:PassedToService などの条件を適用します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">認証情報・シークレットストアの隔離</strong><span style=\"vertical-align: baseline;\">：パスワードボルトやシークレット管理システムを、厳格に管理されたアクセスパスの配下に配置します。特権アクセスには強力な認証を要求し、プログラムアクセスを想定ワークロードおよびネットワークに限定し、大量のシークレットクエリや一括エクスポートなどの異常アクティビティに対してアラートを設定します。正常な自動化のベースラインを確立した上で偏倚を検知することが重要です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パスワードリセットおよびアカウント管理プロセスの強化</strong><span style=\"vertical-align: baseline;\">：高リスクなパスワードリセットやアカウントリカバリには、強力な再認証や追加の身元確認を要求します。パスワードリセット、アカウント作成、権限変更などの急増を監視します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">機密情報ハイジーンの管理自動化</strong><span style=\"vertical-align: baseline;\">：リポジトリ、コンテナイメージ、ビルドアーティファクト、パイプラインに対して、外部露出したシークレットの継続的スキャンを実装します。コードや設定ファイルから認証情報を削除し、専用の管理プラットフォームへ移行します。外部露出した認証情報は履歴から消すだけでなく、速やかにローテーションします。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">レイヤー 3：設定の強化と攻撃パスの削減</strong></h3>\n<p><span style=\"vertical-align: baseline;\">初期の足場を与える弱点を取り除き、侵害されたワークロードの到達範囲を制限します。</span></p>\n<p><span style=\"vertical-align: baseline;\">自動化ツールは、複数の軽微な弱点が組み合わさって大きな攻撃パスが形成されている環境で極めて高い効果を発揮します。公開アプリ、過剰な権限を持つワークロード ID、環境変数内の認証情報、無制限のネットワークアクセスは、単体では対処可能に見えても、組み合わさることで機密システムへの直接的な経路となります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">重要な理由</span></h4>\n<p><span style=\"vertical-align: baseline;\">インターネットに面したアプリの脆弱性は一見独立しているように見えても、バックエンド DB へのアクセス権を持っていたり、環境変数にクラウドトークンが含まれていたり、ホストマシンがストレージや API へのアクセス権を持つクラウド ID を保持していたりすることがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">自動化により、こうした経路を高速で検証できます。エラーレスポンス、スタックトレース、DB の応答、コンパイラ出力、API エラーなどは、ツールが数秒で次のリクエストを修正するための有益なフィードバックとなります。外部に露出した詳細な診断情報は、トラブルシューティングだけでなく攻撃者の試行錯誤を加速させる結果となります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">緩和策</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">外部アタックサフェースの継続的削減</strong><span style=\"vertical-align: baseline;\">：インターネットに面したアプリやインフラの脆弱性、不要な公開サービス、デフォルト設定をスキャンします。OS だけでなく、カスタムアプリ、フレームワーク、ライブラリ、依存関係も管理対象に含めます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロードが侵害される前提での設計</strong><span style=\"vertical-align: baseline;\">：フロントエンドが侵害されても、そのアプリの機能に必要なシステムだけにアクセスが制限されるよう設計します。アプリの権限を削り、必要な DB、API、キュー、ストレージへのアクセスに絞り込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アプリ層のセグメンテーション徹底</strong><span style=\"vertical-align: baseline;\">：外部公開アプリを ID インフラや内部管理システムから分離します。DMZ 上のワークロードから内部ネットワークへの不要な Kerberos、NTLM、LDAP、SMB、RDP、SSH、DB 接続を制限します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データベースの実行時権限の強化</strong><span style=\"vertical-align: baseline;\">：アプリ用 DB アカウントに広範な管理者権限を与えないようにします。OS コマンド実行、任意ファイル書き込み、サーバー全域設定の変更などを禁止します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロード内の認証情報外部露出の削減</strong><span style=\"vertical-align: baseline;\">：設定ファイル、環境変数、IaC、デプロイスクリプト、CI/CD、DB 内の埋め込みシークレットを見直します。1 つのワークロード侵害が他システムの認証情報外部露出に繋がらないようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">外部ユーザーへのエラーフィードバック制限</strong><span style=\"vertical-align: baseline;\">：未認証ユーザーに詳細なスタックトレース、コンパイラメッセージ、SQL エラー、内部パスなどを返さないようにします。詳細な情報は内部ログのみに記録します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ネットワーク・セキュリティ機器の強化</strong><span style=\"vertical-align: baseline;\">：ルーター、ファイアウォール、VPN 機器などから不要な管理サービスを削除し、アカウント、スケジュールタスク、スタートアップスクリプトを監査します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Active Directory 証明書サービス（AD CS）の強化</strong><span style=\"vertical-align: baseline;\">：証明書発行によって権限昇格を許すようなテンプレートや登録パスを見直します。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">不要な場合は ENROLLEE_SUPPLIES_SUBJECT を削除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">登録権限を必要な ID のみに制限します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">高リスクな登録シナリオでは管理者承認を必須とします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">CA Webインタフェースで EPA（認証の拡張保護）を有効化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">特権ユーザーによる不審な証明書発行要求を監視します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">認証情報リプレイおよびリレイ機会の削減</strong><span style=\"vertical-align: baseline;\">：Windows Credential Guard の有効化、Protected Users の適用、SMB 署名・LDAP 署名の強制、可能であれば NTLM の非有効化を進めます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">公開ワークロードからの不要な認証の制限</strong><span style=\"vertical-align: baseline;\">：外部公開サーバーからの Kerberos、NTLM、LDAP、SMB などの通信を必要最低限の明示的宛先にのみ制限します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">レイヤー 4：アプリケーション開発の強化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">侵入後に攻撃者が再利用可能な正規の企業機能を強化・堅牢化します。</span></p>\n<p><span style=\"vertical-align: baseline;\">攻撃アクティビティの大部分は、環境内に既に存在する機能に依拠しています。アプリケーション、認証プロトコル、管理サービス、スクリプト環境、メッセージングシステム、デプロイプラットフォームなどが、新たなマルウェアを持ち込むことなく攻撃を継続する手段を提供してしまいます。自動化により、こうした機能の発見と悪用が非常に容易になります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">重要な理由</span></h4>\n<p><span style=\"vertical-align: baseline;\">社内ビジネスアプリや API は各社独自にカスタムされており、悪用ポイントの把握には内部知識を要するのが一般的でした。しかし、自動化された LLM 駆動型の攻撃ツールにより、攻撃者はこれら独自の社内アプリを迅速に解釈・理解し、攻撃に利用できるようになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">一例として社内通信機能が挙げられます。侵害されたアカウントが通知やメール送信 API への正当な権限を持っている場合、メッセージ送信自体は正常な動作です。しかし、この機能が悪用されて大量のフィッシングメール送信に利用される恐れがあります。制限やレートリミットがなければ、標準的なビジネス機能が高倍速の悪用ツールに変貌してしまいます。</span></p>\n<h4><span style=\"vertical-align: baseline;\">緩和策</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">影響度の高いビジネス API へのガードレール設定</strong><span style=\"vertical-align: baseline;\">：機密データアクセス、認証情報取得、メール送信、ユーザー作成、アクセス変更などを行うアプリに対し、適切なレートリミットや送信制限を設けます。通常のボリュームから外れた動作にはアラートを発します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インシデント前の正規管理機能のインベントリ把握</strong><span style=\"vertical-align: baseline;\">：リモートコマンド実行、デプロイ、スクリプト実行、証明書発行などの機能を持つプラットフォームをあらかじめ把握し、適切な制限と監視を施しておきます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自動テストと脅威モデリングの実施</strong><span style=\"vertical-align: baseline;\">：すべての社内アプリで SAST/DAST スキャンをデプロイ前に実施します。また、エージェント型のソースコードレビューや </span><a href=\"https://cloud.google.com/security/ai-threat-defense\"><span style=\"vertical-align: baseline;\">Google AI Threat Defense</span></a><span style=\"vertical-align: baseline;\"> などの AI 支援型脆弱性テストを活用して、攻撃者に発見される前に攻撃パスを自ら特定・修復します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">レイヤー 5：行動および容量の変化の検知</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ID、アプリ、ワークロード、インフラが確立されたパターンから外れて動作し始めた瞬間を検知します。</span></p>\n<p><span style=\"vertical-align: baseline;\">自動攻撃中の個別アクションは正規操作と見分けがつかないことが多いため、検知にはコンテキスト（ID、送信元、量、タイミング、シーケンス、対象リソース、過去の履歴）が不可欠となります。</span></p>\n<h4><span style=\"vertical-align: baseline;\">重要な理由</span></h4>\n<p><span style=\"vertical-align: baseline;\">サービスプリンシパルによるストレージアクセス自体は怪しくありませんが、普段内部から 10 個のオブジェクトにしかアクセスしない ID が、突如未知のホスティングプロバイダーから数千のファイルをダウンロードし始めた場合は異常です。</span></p>\n<p><span style=\"vertical-align: baseline;\">アウトバウンドのアクティビティも重要なコンテキストを提供します。侵害されたサーバー上の自動化ツールは、外部の webhook サービス、LLM プラットフォーム、一時ファイル共有サービス、トンネリングサービスなどと通信を行うことがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">単一の HTTPS 接続は正常でも、普段決まった宛先としか通信しない本番サーバーが、突然複数の未知の外部サービスへ接続し始めた場合は詳細な調査が必要です。</span></p>\n<h4><span style=\"vertical-align: baseline;\">緩和策と検知の優先事項</span></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ID およびワークロードレベルの行動ベースライン確立</strong><span style=\"vertical-align: baseline;\">：重要なサービスプリンシパル、アプリ、ワークロードの想定される認証元、API、通信パターンを定義します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">認証送信元の変化検知</strong><span style=\"vertical-align: baseline;\">：特権ユーザーやワークロード ID が使用するネットワーク、ASN、クラウドリージョンなどを追跡し、パターンから外れた成功認証を調査します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コントロールプレーンのベロシティ（速度）監視</strong><span style=\"vertical-align: baseline;\">：管理 API 呼び出し、権限テスト、設定変更、資源列挙などの異常なバーストに対してアラートを発します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データプレーンアクティビティのベースライン設定</strong><span style=\"vertical-align: baseline;\">：機密ストレージへのアクセスパターンを確立し、突然の大量アクセスや異常な読み書きシーケンスを検知します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一連のシーケンスに基づく検知ルールの構築</strong><span style=\"vertical-align: baseline;\">：ID、コントロールプレーン、データプレーン、ネットワークのイベントを相関分析し、新規認証→権限探索→データ一括ダウンロード→未知の外部接続という一連の流れを単一の攻撃シーケンスとして分析します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">公開ワークロードからの East-West （内部ネットワーク間の水平）トラフィック監視</strong><span style=\"vertical-align: baseline;\">：DMZ や外部公開システムからの予期しない内部スキャンや管理トラフィックを検知します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Egress（外部送信）トラフィックの制御と監視</strong><span style=\"vertical-align: baseline;\">：本番サーバーからの不要なアウトバウンド接続を制限し、未知の宛先や外部 AI プラットフォームへの接続を監視します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">挙動把握に必要なテレメトリの保持</strong><span style=\"vertical-align: baseline;\">：ID ログ、コントロールプレーン・データプレーンログ、プロキシ・DNS ログ、エンドポイントアクティビティを一元的に収集・長期保持します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Google Security Operations（SecOps）</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google SecOps のお客様は、「Mandiant Frontline Threats」および「Mandiant Hunting Rules」ルールパックを通じて、これらの包括的カテゴリールール等を利用できます。本ブログ投稿で扱ったアクティビティは、Google SecOps 内で以下のルール名により検知されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Webhook.Site Interaction</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Curl Invocation</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Cmd Launching Curl</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AWS Cloud Accounts Getcalleridentity</span></p>\n</li>\n</ul></div>"
  "27b836cb7745d184c961bfccfcdc3b56":
    "id": "27b836cb7745d184c961bfccfcdc3b56"
    "title": "エージェント プラグインの開発から学んだ、評価エンジニアリングの 4 つの教訓"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/four-eval-engineering-lessons/"
    "published": "2026-11-02 12:00:00"
    "fetched": "2026-11-02 16:15:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 17 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/four-eval-engineering-lessons?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント システム開発における真の課題は、「作ること」ではなく「測ること」です。</span></p>\n<p><span style=\"vertical-align: baseline;\">評価エンジニアリングは、信頼性の高い AI システムを構築するための重要な基盤です。エージェントの挙動を正確に測る体系的かつ再現可能なテストを構築できるかどうか。それが、信頼できるツールをリリースできるか、それともサイレント エラーや API 呼び出しの失敗、誤作動を引き起こすツールになってしまうかの分かれ目となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">私は Google で長年にわたり評価エンジニアリングの取り組みを推進してきました。新しくリリースされた </span><a href=\"https://cloud.google.com/blog/ja/topics/developers-practitioners/introducing-the-google-cloud-developer-plugin-for-ai-coding-agents?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Developer プラグイン</span></a><span style=\"vertical-align: baseline;\">の開発は、実際のデベロッパー ワークフローを通じてこれらの重要原則をストレステストし、検証する実践の場となりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">新しいプラグインの開発から得られた、皆様のエージェント開発にも活かせる 4 つの評価の教訓をご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">1. 要約ではなく、実行ステップを評価する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントを初めて評価した際、私たちは LLM-as-a-Judge を導入し、エージェントが最終的に返したテキスト回答を点検して、チェックリストに基づいて採点していました。しかし、採点ツールはエージェントが「実際に何を行ったか」ではなく「出力したテキスト」しか見ていないため、この方法には根本的な欠陥があることにすぐ気づきました。Google Cloud Developer プラグイン向けに、最初の 11 種類のプロンプトからなる評価スイートを実行したところ、自動採点ツールは 3 つのプロンプトを「不合格」と判定しました。しかし、未加工のツール呼び出しログを開いて対話履歴を確認してみると、プラグインは実際には 3 つすべて合格していたのです。たとえば Cloud Run のクリーンアップに関するプロンプトでは、ルーブリックとして「コマンドを実行する前に構文チェックを行うこと」が定められていました。エージェントは、最初のステップとして gcloud help run services list を実行しました。作業自体は完了していたものの、エージェントが最後に出力したメッセージは、ヘルプ ドキュメントを確認したことをわざわざ報告するのではなく、データの永久損失についてユーザーに警告することを優先していたのです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Image 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Image_1_XmJ1pt2.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">採点ツールは、エージェントが正しい対応をしたにもかかわらず、要約でそれを報告しなかったという理由だけで減点してしまったのです。ルーブリックの項目に「X を実行したか？」とあっても、実際のツール呼び出しの実行プロセスを評価しない限り、LLM による判定は単なる推測にすぎません。</span></p>\n<p><strong style=\"vertical-align: baseline;\">要点:</strong><span style=\"vertical-align: baseline;\"> エージェントの評価を、最後に出力されるまとめの言葉だけで行わないでください。未加工の実行プロセスを採点し、実際にどんなコマンドが実行され、検証され、対象範囲が設定されたのかを確認してください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">2. 非同期オペレーションの評価を設計する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ツール呼び出しの実行プロセスを読み解く段階になると、何を読み取るかと同じくらい、そのテレメトリーをどう抽出するかが重要になってきます。エージェント テレメトリーを時系列のフラットなイベントリストとして抽出してしまうと、ツールの同時ディスパッチが見えなくなってしまいます。これは、動作不良を引き起こす重大な原因の一つです。最新のエージェント ハーネスは、多くの場合、配列を使用して複数のツール呼び出しをまとめ、1 回のアシスタント ターンでバッチ処理します。</span></p>\n<p><span style=\"vertical-align: baseline;\">実際の評価で、エージェントに「環境の検査」と「ドキュメントの検索」をリクエストしたところ、ハーネスはスキルの読み込みと 2 件のドキュメント検索を、1 つの tool_calls ペイロード内で同時にディスパッチしました。スキルの有効化は多段階のプロセスです。最初の呼び出しでは短い起動スタブのみが返され、その次のターンで初めて指示の本文が挿入されます。そのため、検索処理を制御すべき指示がプロンプト コンテキストに届いたときには、システムはすでに検索を完了してしまっていたのです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image 2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_2_CHyk3qC.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">システムはスキルに対して専用のターンを挟まなかったため、スキルの指示をエージェントの行動に反映させることができなかったのです。テレメトリー パイプラインがターン構造を取り除き、すべての呼び出しを 1 つのフラットなタイムラインに統合してしまうと、エンジニアは「なぜエージェントはスキルに埋め込まれた明確な指示を無視したのか？」と思い悩み、何日も無駄に過ごすことになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">要点: </strong><span style=\"vertical-align: baseline;\">テレメトリーの抽出時にターン構造を保持してください。そうすることで、追加の指示がコンテキスト ウィンドウに読み込まれる前に、クライアントサイドで並列ディスパッチによるツール呼び出しが行われてしまう事象を検知できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">3. ライブ実行と「ドライラン」を並行してテストする</strong></h4>\n<p><span style=\"vertical-align: baseline;\">並列ディスパッチなど、ハーネス独自の挙動を把握するには、実際の API 呼び出しを検査する必要があります。しかし、単一の環境条件だけでエージェントをテストしていると、重要な問題の半分を見落とすことになります。最初から、ライブ実行とプランのみの実行の 2 パターンを並行して実施する必要があります。ライブ実行の条件では、エージェントはサンドボックス化された実際の認証情報を保持し、実際にコマンドを実行します。これにより、構文が正常に動作するか、パラメータが綺麗にシリアライズされるか、破壊的な操作を行う前にエージェントに自制が効くかを確認できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">ライブ実行では、ステップ 2 で予期しない権限エラーが発生し、テストしようとしている挙動に到達する前にテストが中止されることがよくあります。そこで必要になるのが「プランのみ」の条件です。あらかじめ認証情報を取り除いておき、何も実行せずに「何をしようとしているのか」をエージェントに説明させます。これにより権限の障害が取り除かれ、モデルの純粋な推論とルーティングの意図が明らかになります。最も重要な発見の約半分は、この 2 つの差から得られたものです。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image 3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_3_OixTmu5.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">たとえば、あるオンボーディング用のプロンプトでは、プロジェクト リストの呼び出し時にライブ実行がすぐにブロックされてしまいました。対照的に、プランのみの実行はスムーズに完了し、組織のポリシー、管理者の承認、ガバナンスを完全に無視した 8,000 文字のプランを生成しました。プランのみの実行がわずか数秒で明らかにした重大な認知上の欠陥が、ライブ実行では覆い隠されてしまっていたのです。</span></p>\n<p><strong style=\"vertical-align: baseline;\">要点:</strong><span style=\"vertical-align: baseline;\"> ライブ評価とプランのみの評価を並行して実施してください。ライブ実行では実際の実行と安全上の制御をテストします。プランのみの実行では、権限エラーに阻まれることなく、モデルの生の推論とルーティングを確認できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">4. 「ゴールデン セット」を永続的なベースラインとして使用する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">フロンティア モデルのアーキテクチャは数か月ごとに変化し、エージェント ハーネスは進化し、プラグイン マニフェストの標準も必然的に変わっていきます。Google Cloud Developer プラグインを構築するにあたり、私たちは評価を、こうした非決定的な環境における継続的インテグレーション テストとして扱いました。つまり、ハーネス、ライブモデル、そして各種ツールが連携して動作する複合スタックに対し、現実的なタスクを使用してストレステストを実施したのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">このアプローチでは、最終的なテキスト出力から推測するのではなく、エージェントが何を考え、実際にどのようなコマンドを実行し、何も壊さずに問題を解決できたかという、実行プロセス全体を把握します。次に、理想的なパスを理解している人間の専門家がキュレートしたゴールデン セットに対して、その実行結果を採点します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">要点:</strong><span style=\"vertical-align: baseline;\"> ハーネス、モデル、プラグインなど、システム全体が実際の運用環境で実行すべきことに基づいて、ゴールデン セットを構築してください。モデルは変化しますが、そうしたベースラインの実行結果がセーフティネットになります。</span></p>\n<p><strong style=\"vertical-align: baseline;\">注意: 「ワンショット」デモではなく評価スイートを使用する</strong></p>\n<p><span style=\"vertical-align: baseline;\">エンジニアが陥りがちな間違いの一つに、私がワンショット デモと呼んでいる手法があります。これは、LLM にプロンプトを入力し、LLM が完全な 3D ゲームを構築したりルービック キューブを一発で解いたりするのを見て、それを「評価」と呼んでしまうような状態のことです。しかし実際には、これは自己満足のための指標にすぎません。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI で質の高い作業を行うには、評価スイートが必要だと私は確信しています。評価なしで進めるのは、暗闇の洞窟へと目隠しで飛び込むようなものです。エンタープライズ グレードのエージェントを開発するなら、複数ステップに及ぶ対話の処理能力、権限の制御、そして破壊的な結果の回避能力をテストしなければなりません。たとえば、「コスト削減の機会を見つけて」とリクエストしただけなのに、プロジェクトが誤って削除されてしまうような事態を防ぐ必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェント プラグインや MCP サーバーの構築は、始まりにすぎません。実際のクラウド インフラストラクチャ環境で真に信頼できるものをリリースするには、期待どおりに動作することを確認するための評価作業に、かなりの労力が必要となります。結局のところ、モデルの入れ替わりを乗り越えられるのは、ストレステスト済みの評価スイートだけです。Google Cloud Developer プラグインの</span><a href=\"https://g.dev/cloud/dev-setup\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご確認いただくか、こちらの </span><a href=\"https://g.dev/cloud/agent-plugins-codelab-agy\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Codelab</span></a><span style=\"vertical-align: baseline;\"> をご覧になり、Antigravity でプラグインの利用を始めてみてください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、AI インフラストラクチャおよび応用エンジニアリング担当デベロッパー リレーションズ リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Casey West</strong></p></div>"
  "302a4604eca8c333844a3559468e444d":
    "id": "302a4604eca8c333844a3559468e444d"
    "title": "Knowledge Catalog に新しい自己学習型コンテキスト エンリッチメントを導入"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents/"
    "published": "2026-11-02 12:00:00"
    "fetched": "2026-11-02 16:15:20"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 23 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>このたび、Google Cloud のエージェント向けコンテキスト エンジンである<a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/introduction\"> Knowledge Catalog</a> で、自己学習型のコンテキスト エンリッチメント（プレビュー版）と、刷新された Knowledge Studio エクスペリエンス（プレビュー版）をリリースしました。自己学習型のエンリッチメントは、Knowledge Catalog 既存の Gemini によるエンリッチメントをベースにしており、エージェントとユーザー間のやり取りを分析してギャップを特定することで、ビジネス コンテキストを正確かつ最新の状態に保ちます。<a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\">Knowledge Studio</a> は、コンテキスト エンジニアとデータ スチュワードのための新しいコマンド センターです。会話形式でデータ資産を探索したり、視覚的なコンテキスト グラフ上で関係性を把握したりできるほか、コンテキスト グラフへの変更案をユーザーやエージェントに公開する前に確認することもできます。</p><p>エージェントの性能は、その推論のベースとなる組織全体の定義、ルール、関係、すなわちコンテキストの質に左右されます。そのため、コンテキストのキュレーションは企業における AI エージェント活用において最も重要な取り組みの一つとなっています。現在、キュレーションの大部分は手作業で行われています。コンテキスト エンジニアはエージェントごとにプロンプトとマッピングを記述し、データ スチュワードは数千ものアセットにわたり定義を手動で更新して最新の状態に保とうとします。しかし、組織のエージェントが数個から数千個、そして最終的には数百万個へと拡大していくと、この方法では対応できなくなります。</p><p>Knowledge Catalog の Gemini を活用した自己学習型エンリッチメントは、手動によるメンテナンス作業を、継続的なフィードバック ループへと進化させます。エージェントとユーザーのやり取りを分析することで、不足している情報や古くなったコンテキストを的確に特定します。さらに、ハンドブック、コード リポジトリ、ビジネス ドキュメントから検証済みの定義を抽出して、ガバナンスの効いた再利用可能な「コンテキスト セット」として集約します。また、最適化された検索により、各エージェントは肥大化したプロンプトや未加工のスキーマから推論するのではなく、必要なコンテキストを正確に取得して、組織全体で蓄積された学習成果を活用できます。社内ベンチマークによると、Knowledge Catalog の使用により、AI エージェントは精度が約 4 倍向上、レイテンシは最大 33% 短縮、トークン使用量も最大 75% 削減されます。</p><p><b>Gemini を活用した自己学習型のエンリッチメントでコンテキストを最新の状態に維持</b></p><p>Gemini エージェントに「前四半期の EMEA の純収益はいくらだった？」という簡単な質問をするとします。正しく回答するには、会社が純収益をどのように定義しているか、受注データがどのテーブルに保持されているか、そしてそれらがどのように結合されているかを把握している必要があります。しかし、そうした知識は通常、Google ドキュメントの財務ハンドブック、GitHub のデータモデル、Confluence ページなどに分散しています。従来の静的なデータカタログでは、エージェントが適切なデータを効果的にクエリできるように、現場のエキスパートがビジネス定義、指標、その他のコンテキストを手動で集めて更新する必要があります。しかし、実際にはエキスパートがすべてのアセットを文書化する余裕などありません。そのため、財務チームが翌四半期のパートナー クレジットの処理方法を改訂した瞬間、静的な定義と実態にずれが生じ、数式がハードコードされたすべてのエージェントが間違った回答を返すようになります。</p><p>Knowledge Catalog のエンリッチメント機能は、チームのすべてのドキュメント、リポジトリ、テーブルといったビジネス ナレッジがすでに保存されている場所で機能します。自社やサードパーティのソースにわたる構造化データはもちろん、Cloud Storage、Google Workspace、GitHub、Confluence、SharePoint の非構造化データとも連携します。ビジネス ナレッジの検出、抽出、体系化、維持を自動で行い、ハンドブックや Wiki などの非構造化ソースとそのコンテキストを Knowledge Catalog のテーブルやスキーマといった構造化メタデータに紐づけます。これにより、構造化データの検出と活用が大幅に容易になります。また、オンデマンドまたはスケジュール実行により、ビジネス定義、テーブルや列の説明、結合関係、ゴールデン クエリ、タスク固有のエージェント指示などを、それぞれのソースの引用と信頼スコアを添えて自動提案します。実行のたびにソースでの変更を検出し、古くなった定義を廃止するとともに競合をフラグ付けして、確認を促します。</p><p>エンリッチメント機能は、ユーザーとエージェント双方のインタラクションから学習します。エンリッチメントを構成すると、PII を秘匿化しながら、Gemini エージェント、BigQuery の会話型分析、カスタム エージェントからのインタラクション トレースを分析できます。また、曖昧な列のルックアップ、グラウンディングされていない指標、定義の欠落、ユーザーによる質問の言い換えなど、エージェントがつまずいた箇所を特定できます。その後、エンリッチメント機能は信頼できる回答を見つけて修正案をステージングし、同じ間違いが繰り返されないようにします。コンテキスト エンジニアリングはこのようにして何百万ものエージェントのやり取りに追従し、エキスパートが定義をゼロから記述しなくても、提示された変更をレビューするだけで済むようにします。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-Configuring an enrichment task with connected sources, evaluation, and self-learning\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1-Configuring_an_enrichment_task_with_connected_sources_evaluation_and_sel.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>接続されたソース、評価、自己学習によってエンリッチメント タスクを構成</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>自動化とは、制御を放棄することではありません。自動公開はいつでも有効または無効にできます。また、提案された変更を自動的に承認する信頼スコア（例: 85%）を自由に設定することもできます。しきい値を下回る変更や、削除などの影響の大きい更新は、変更リクエストとしてスチュワードによる承認、編集、拒否の判断に回されます。独自の評価セットを提供して、提案された更新をエンドツーエンドでテストすることもできます。また、すべての変更は完全な来歴とともにログに記録され、元に戻すことができます。もちろん、Google がお客様のデータをモデルのトレーニングに使用することはありません。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-Reviewing enrichment proposals, confidence scores, and change diffs before publishing\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2-Reviewing_enrichment_proposals_confidence_scores_and_change_diffs_before.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>公開前にエンリッチメントの提案、信頼スコア、変更の差分を確認</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>コンテキスト セットによりオーディエンスごとに適切なコンテキストを設定</b></p><p>その性質上、エンタープライズ コンテキスト グラフは非常に広範なデータを網羅したものになりますが、個々のタスクにおいてエージェントとユーザー双方が必要とするのは、信頼できる適切なセグメントのみであることがよくあります。Knowledge Catalog は、コンテキスト セットによってそれに対応します。コンテキスト セットとは、コンテキスト グラフの中から、特定のドメイン、チーム、エージェント、またはエンドユーザー グループの定義、指標、結合ロジック、ゴールデン クエリのみを厳選して管理するサブセットです。たとえば、セールス エージェントであればセールス用のコンテキスト セット、財務アナリストのアシスタントであれば財務用のコンテキスト セットにバインドできます。「純収益」は、グループによって当然意味が異なるため、すべてのドメインは同じカタログ内で独自の定義を維持します。ただし、エージェントは 1 つのセットだけに限定されるわけではありません。Knowledge Catalog の検索機能を使用すれば、任意のタスクに適したコンテキスト セットを動的に探し出すことも可能です。</p><p>コンテキスト セットには、組み込みのデータ ガバナンスときめ細かいアクセス制御機能も備わっています。各コンテキスト セットへのアクセスは IAM で管理されるため、どのエージェントとユーザーに読み取り、使用、編集の権限を与えるかをスチュワードが制御できます。エージェントは使用を許可されているセットからのみコンテキストを取得し、基盤となるデータへのアクセスは既存の権限に従って行われます。すべての更新は遡って追跡したり、元に戻したりできます。また、コンテキスト セットは<a href=\"https://cloud.google.com/blog/ja/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing\"> Open Knowledge Format</a>（OKF）を基盤としているため、OKF バンドルをインポートしてコンテキスト セットに変換し、それを再び OKF としてエクスポートすることで、コンテキストのポータビリティを維持できます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3-Approved enrichments published to a governed context set\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3-Approved_enrichments_published_to_a_governed_context_set.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>承認されたエンリッチメントを管理されたコンテキスト セットに公開</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>Knowledge Studio ですべてを探索、管理</b></p><p>上述の機能はすべて、エージェントのコンテキストをキュレートして管理するコンテキスト エンジニアとデータ スチュワード向けに構築された、刷新された Knowledge Catalog エクスペリエンスに統合されています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4-Navigating the context graph visually in Knowledge Studio\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4-Navigating_the_context_graph_visually_in_Knowledge_Studio.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Knowledge Studio でコンテキスト グラフを視覚的に操作</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>新しい Knowledge Studio は、Knowledge Catalog を静的なインベントリのリポジトリからインタラクティブなコマンド センターへと変貌させます。これにより、以下が可能になります。</p><ul><li><b>コンテキスト カバレッジを一目で確認:</b> オペレーショナル データベースやウェアハウスから、セマンティック モデル、コンテキスト セット、ドキュメントまで、クロスクラウド データ資産をビジュアル マップ上で俯瞰できます。</li><li><b>対話形式でコンテキストを探索:</b> 自然言語でビジネスに関する質問をしたり、エンタープライズ コンテキスト グラフ全体で関係性をたどったりできるほか、エージェントがメタデータをどのように推論しているかを正確に把握できます。</li><li><b>エンリッチメントを 1 か所で確認、検証:</b> 提案された各変更、ソースの引用、信頼スコアを精査できます。実際の質問を用いてコンテキスト セットをテストし、ソフトウェア開発のようなバージョン管理機能で変更リクエストの承認、編集、ロールバックを行えます。</li><li><b>エンリッチメント実行をモニタリング:</b> 各エンリッチメント タスクのスケジュール、結果、トークン使用量、実行時間を追跡できるほか、実行が完了するとメールで通知を受け取れます。</li></ul><p><b>使ってみる</b></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=qeWzgLGSkls\">\n\n      \n        <img alt=\"Knowledge Catalog の自己学習型エンリッチメントがエンタープライズ AI エージェントをグラウンディングする仕組み\" src=\"https://img.youtube.com/vi/qeWzgLGSkls/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Knowledge Catalog の自己学習型エンリッチメントがエンタープライズ AI エージェントをグラウンディングする仕組み</h4>\n        \n        \n          <p>デモを見る: Knowledge Catalog の自己学習型エンリッチメントがエージェントをグラウンディングする仕組み</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=qeWzgLGSkls\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><p>これらの機能は、今後数週間以内にお客様へ順次公開される予定です。即時アクセスをリクエストするには、<a href=\"https://docs.google.com/forms/d/1Xsxc1j9XqHupqnvfn7hC1bHtAB90ro4GqkCZboAPW_M/edit\" target=\"_blank\">ご登録ください。</a>詳細な手順については、<a href=\"https://docs.cloud.google.com/knowledge-catalog/docs\">ドキュメント</a>をご確認ください。</p><p><b><i>-</i></b> <i>データ分析担当グループ プロダクト マネージャー、</i><b><i>Firat Elbey</i></b></p><p><b><i>- プロダクト リード、</i></b><i>Vasiya Krishnan</i></p></div>"
  "0aaba76f6793ae43c36355e46aa18a0b":
    "id": "0aaba76f6793ae43c36355e46aa18a0b"
    "title": "Agent Compute Engine と拡張されたエージェント ガバナンスのご紹介"
    "link": "https://cloud.google.com/blog/ja/topics/ai-infrastructure/introducing-agent-compute-engine-and-expanded-agent-governance/"
    "published": "2026-11-02 11:00:00"
    "fetched": "2026-11-02 16:15:20"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 22 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/introducing-agent-compute-engine-and-expanded-agent-governance?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p><b>ブログ執筆者:</b> Nirav Mehta（プロダクト管理担当バイス プレジデント）、Michael Bachman（バイス プレジデント兼ゼネラル マネージャー）、Kevin Hutchins（プロダクト管理担当バイス プレジデント）</p><p>Gemini を地球規模に展開した経験から、自律型エージェントを安全に実行することは、本質的にインフラストラクチャの課題であることを、身をもって学びました。シングルターン プロンプトからインタラクティブなエージェントへの移行には、実行と制御における新たなパラダイムが不可欠です。大規模な同時接続エージェント セッションに対応するため、Google はこれらの課題解決に向けて、Gemini 向けの新たなコンピューティング ソリューションおよびガバナンス ソリューションを開発しました。</p><p>このたび、AGNTCon + MCPCon において、Google は <b>Agent Compute Engine</b> をリリースし、これらの機能をユーザーの皆様にお届けします。Agent Compute Engine は、業務タスクを実行するエージェントとしての Gemini をすでに支えている、専用設計のコンピュート サービスです。今後数か月以内にプレビュー版の提供を開始する予定で、ハードウェア レベルで分離されたランタイム サンドボックス セキュリティを実現します。さらに、ビジネス向け Gemini のエージェント ガバナンス機能を拡張し、エージェントがどのような環境で稼働していてもサポートできるようにします。これらの機能を組み合わせることで、エージェントの実行、統制、スケーリングに必要な制御を実現できます。</p><p><b>Agent Compute Engine の仕組み</b></p><p>Agent Compute Engine は、コードの記述と実行、ツールの実行、ブラウザの操作、エンタープライズ ワークフローのオーケストレーション、そして迅速かつ大規模な反復処理といった、Google の膨大なエージェント ワークロードを処理するニーズから生まれました。従来のコンピュート プリミティブは一般的なワークロードには適しているものの、AI エージェント特有の高度に反復的な性質に合わせて最適化されているわけではありませんでした。</p><p>エージェント専用に構築された Agent Compute Engine は、すべての Gemini エージェントに独自の高性能でセキュアなコンピュータを割り当て、動的でリソースの入れ替わりが激しい Gemini セッションを強力に支えます。Agent Compute Engine は、AI エージェント独自のライフサイクル パターンに特化して最適化されており、まもなくこのサービスを使用して独自のカスタム エージェントを駆動できるようになります。主な特長は次のとおりです。</p><ul><li><b>スピードと効率性:</b> エージェントは常に起動、一時停止、再開を繰り返すため、優れたスピード、スケーラビリティ、そして極めて高い効率性を兼ね備えたアーキテクチャが不可欠です。Agent Compute Engine は高速起動するマイクロ VM を提供するため、エージェント ループや評価スイープでインフラストラクチャの起動待ちが発生することはありません。さらに、複数のエージェントで Google ユーザーをサポートするには、物理マシンのリソースを最大限に引き出す、費用対効果の高いソリューションが不可欠です。Agent Compute Engine は、コピーオンライト メモリ共有を使用して単一のオペレーティング システム テンプレート上で複数のエージェントを実行し、高速なチェックポイントと復元によってアイドル状態のマイクロ VM を一時停止することで、これを実現しています。エージェントがツール呼び出しの実行を完了し、エージェント ループの「思考」フェーズに入ると、マイクロ VM はアイドル状態であることを通知し、ホストはマイクロ VM をアクティブ状態からアイドル状態へと移行させます。つまり、エージェントが人間や外部システムの応答を待っている間、実行中のマイクロ VM を一時停止し、スナップショットから即座に再開できます。</li><li><b>セキュリティ、分離、ガバナンスの強化:</b> エージェントがより複雑なタスクを担うようになるにつれ、信頼できないコードや敵対的なコードがサンドボックス内で実行されるリスクは常に存在します。Agent Compute Engine を Google のオフロード インフラストラクチャ プロセッシング ユニット（IPU）である <a href=\"https://docs.cloud.google.com/docs/security/titanium-hardware-security-architecture\">Titanium</a> 上で実行することで、信頼できない AI エージェント向けに構築された、シリコンベースの多層防御を実現します<b>。</b>Agent Compute Engine は、独自のゲストカーネルとルートアクセスを備えた、ハードウェア分離型の Cloud Hypervisor 境界を介して強固な隔離を実現します（Agent Compute Engine のマイクロ VM アーキテクチャとセキュリティの詳細については、<a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/agent-compute-engine-deep-dive\">技術的な解説</a>をご覧ください）。各マイクロ VM は、有効期間の短い認証情報を使用して、エージェント独自の ID で動作します。また、すべてのマイクロ VM には暗号で検証された独自の ID が付与され、サービス認証情報はマイクロ VM 外への送信時に挿入されます。Agent Gateway と統合された Agent Compute Engine は、包括的なオブザーバビリティ、ポリシー管理、セキュリティ評価を提供します。</li><li><b>永続性とエンタープライズ インテグレーション:</b> エージェントには、複数の長時間実行セッションにわたってエージェント データを永続化する機能が求められます。これを解決するために、各 Agent Compute Engine マイクロ VM には独自の <a href=\"https://docs.cloud.google.com/compute/docs/disks/hyperdisks\">Hyperdisk</a> が割り当てられており、実行ワークスペースとエージェント コンテキストの永続化を実現しています。さらに、エージェントが有意義な作業を行うには、企業データを移動させることなくそのまま活用できる機能が不可欠です。Agent Compute Engine を Google のクラウドと ID ファブリックに直接組み込むことで、エンタープライズ接続はマイクロ VM 自体を保護するのとまったく同じセキュリティおよび ID モデルによって統制され、統一された ID モデルと監査可能性を実現します。</li></ul><p>「Gemini エージェントを地球規模にスケールさせるには、迅速にスピンアップし、極めて効率的に動作するコンピュートが必要です。Agent Compute Engine のマイクロ VM は、世界中のユーザーにインタラクティブなエージェント サンドボックスを提供するために必要な応答性、ハードウェア分離、そしてワークロード密度を実現してくれます。」- <b>Gemini 担当バイス プレジデント兼 Google Fellow、Gautham Thambidorai</b></p><p><b>Agent Substrate を使用して GKE 上に構築</b></p><p>カスタマイズとマルチクラウドでのポータビリティを求めているプラットフォーム チームや、すでに Kubernetes を標準環境として採用しているプラットフォーム チームには、<a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke?e=48754805&amp;hl=ja\">Google Kubernetes Engine（GKE）上の Agent Substrate</a> が最適です。これは、Kubernetes に同じエージェント ファーストの設計をもたらすオープンソースの実行ランタイムです。エージェントの実行とマシン管理をクリーンに分離する、ゼロトラスト アーキテクチャに基づいて構築されています。エージェントがアイドル状態になると、Agent Substrate はアクティブ メモリのスナップショットを取得してマシンをプールに戻し、再び必要になった瞬間にエージェントを再開します。オープンソースかつ Kubernetes ネイティブであるため、カスタマイズや拡張が可能で、既存のワークロードと並行して実行できます。Agent Substrate の主な特長は次のとおりです。</p><ul><li><b>高密度:</b> Agent Substrate は、各エージェントに対して完全なカーネル分離と ID ベースのネットワーク セキュリティを維持しながら、従来の環境と比較して最大 10 倍ものコンピュート密度を実現します。</li><li><b>1 秒未満のアクティベーション:</b> 20 万エージェント規模のベンチマーク検証において、Agent Substrate は一時停止および再開のレイテンシを 500 ミリ秒未満に抑えつつ、毎秒 500 回のアクティベーションを維持しました。</li><li><b>セキュア バイ デフォルト:</b> Agent Substrate は、いわば「エージェントのためのゼロトラスト」です。各サンドボックスには、選択したマイクロ VM または gVisor による強力なハードウェア分離機能が組み込まれています。すべてのエージェントには暗号技術で保護された独自の ID が付与され、この ID はきめ細かいネットワーク ポリシーを適用し、エージェント自身の手が届かない場所で認証情報を注入する Egress プロキシとペアになっています。今後は、Agent Substrate ランタイム アーキテクチャを拡張し、より広範なビジネス向け Gemini ガバナンス フレームワークと統合していく予定です。</li><li><b>オープンソースのポータビリティ:</b> どのようなコンピュート環境の Kubernetes クラスタでも実行でき、Claude Code、OpenClaw、Hermes をはじめとするあらゆるエージェント フレームワークやハーネスと連携します。</li><li><b>動的ストレージ</b>: Filestore エージェント ボリュームと統合され、1 秒未満の再開レイテンシでアクティブなコンピュートとともにスケールし、マルチエージェント ワークフローのための単一の共有ワークスペースを提供します。</li></ul><p>Nous Research のような最先端の AI チームは、この信頼性の高いアーキテクチャをすでに使用して、マルチテナント エージェントを既存の顧客インフラストラクチャに直接かつ効率的にデプロイしています。</p><p>「Hermes Enterprise は、お客様が既存のインフラストラクチャにデプロイできるようにすると同時に、エージェントごとの分離と拡張可能なアクセス制御を処理できるように構築されています。Agent Substrate は、プラットフォーム レイヤでこの両方に対処しつつ、貴重なコンピュート リソースの消費も抑えます。Agent Substrate を使用した経験から、エージェント ワークロードの増加に合わせてアーキテクチャを効率的にスケールできると確信しています。」<b>- Nous Research、最高ビジネス責任者、Hervé Bizira 氏</b></p><p><b>あらゆる環境で稼働するエージェントのガバナンス機能を拡張</b></p><p>組織が自律型エージェントを孤立したパイロット運用からマルチランタイムの本番環境フリートへと移行するにつれて、従来のセキュリティ フレームワークの強化と進化が不可欠となっています。お客様は、エージェント、ツール、モデル、スキル、データにわたる動的で非決定的なインタラクション パスの保護、最小権限アクセスに基づく分散ランタイムによるデフォルト拒否体制の維持、非同期エージェント アクションの監査可能性の確保という 3 つの課題に直面しています。強力なエージェント ガバナンスがなければ、エージェントの無秩序な増加は、シャドー AI、データの引き出し、追跡や監査が困難なエージェント アクションなどのリスクをすぐに引き起こします。</p><p>これらの課題を解決するために、Google は Gemini プラットフォームに以下のような堅牢なエージェント ガバナンス機能を組み込みました。</p><ul><li><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview\"><b>Agent Gateway</b></a><b>:</b> クライアントからエージェント、そしてエージェントからあらゆる場所へのトラフィックを制御する航空管制官として機能します。機密データの保護、エージェント攻撃保護、セマンティック ガバナンス、独自のポリシーを導入する機能など、幅広い<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/overview\">ガバナンスおよびセキュリティ ポリシー</a>を統合しています。</li><li><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-registry\"><b>Agent Registry</b></a><b>:</b> 承認されたすべての実行中エージェント、ツール、MCP サーバー、スキル、モデル、エンドポイントの信頼できる情報源として機能する中央リポジトリを提供し、適用されたポリシーを介してランタイム アクセスを統制します。</li><li><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview\"><b>Agent Identity</b></a><b>:</b> オープン標準規格に基づく <a href=\"https://github.com/spiffe/spiffe\" target=\"_blank\">SPIFFE</a> を使用して各エージェントに一意でセキュアな ID を割り当て、認証、アクセス制御、監査のためのデジタル署名として機能します。</li><li><a href=\"https://docs.cloud.google.com/stackdriver/docs/observability/agent-observability\"><b>エージェントのオブザーバビリティ</b></a><b>:</b> <a href=\"https://github.com/open-telemetry/semantic-conventions-genai\" target=\"_blank\">エージェント セマンティック規則</a>を採用した OpenTelemetry（OTel）準拠のテレメトリーを提供し、Agent Gateway を経由するすべてのモデル呼び出し、ツール呼び出し、エージェント ホップに対して標準化された指標、ログ、分散トレースを出力します。</li></ul><p>現在、エージェント フリートは多様な環境で劇的に増加し続けています。そこで Google は、ビジネス向け Gemini のエージェント ガバナンス機能の適用範囲を Google Cloud ランタイム、クロスクラウド、オンプレミス、クライアント デバイスへと拡大し、稼働するあらゆる場所でエージェントを管理および保護できるようにしています。これには、次の機能が含まれます。</p><ul><li><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview#deployment-model-summary\"><b>Google Cloud ランタイムの幅広いカバレッジ</b></a><b>:</b> Agent Runtime、Cloud Run、Gemini プラットフォーム上の Agent Sandbox、GKE、Agent Compute Engine（プレビュー版）全体にわたり、包括的なエージェント ガバナンスを提供します。</li><li><b>一貫したクロスクラウド展開:</b> Envoy プロキシベースの軽量なポリシー適用ポイントをデプロイし、マルチクラウドやハイブリッド環境へとガバナンスを拡張します（近日中にプレビュー版を提供予定）。</li><li><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-endpoint\"><b>エンドポイント上のローカル エージェント向けガバナンス</b></a><b>:</b> OS レベルのサンドボックスとローカル ガバナンス サービスにより、管理対象デバイス上の Claude Code や Antigravity CLI などのコーディング エージェントにもガバナンスを拡張します（近日中にプレビュー版を提供予定）。</li></ul><p>さらに、<b>Agent Gateway</b> における新しいエージェント ガバナンス機能を発表しました。これにより、きめ細かいコスト管理、インテリジェントなモデル ルーティング、カスタマイズやインテグレーションの簡素化を実現できます。今四半期にプレビュー版で提供される主な機能は次のとおりです。</p><ul><li><b>トークンとコストのきめ細かいガバナンス:</b><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/token-management-overview\"> トークン管理</a>により、エージェントやモデル全体でトークンの消費を制御できるため、支出の帰属先を明確にし、予算のガードレールを適用して、トークン指標の信頼できる唯一の情報源を確保できます。</li><li><b>適切なモデルへのリクエスト ルーティング</b>: モデル ルーティング ポリシーにより、ユーザーやエージェントからのリクエストを最適なモデルへ振り分け、コストを制御してパフォーマンスを向上させます。</li><li><b>拡張可能なポリシー:</b><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/extension-bindings-overview\"> Service Extensions バインディング</a>により、インライン プログラマビリティと機能拡張をスマートに実現できます。Google サービス、お客様のカスタム関数、パートナー サービスをデータパスに直接、シームレスに統合できます。</li><li><b>セキュリティ パートナー エコシステムの拡大:</b> サードパーティの ID プロバイダである Ping Identity、SailPoint、Saviynt による<a href=\"https://services.google.com/fh/files/misc/secure_interoperability_and_delegated_authority_with_third_party_identity_provider_final.pdf\" target=\"_blank\">委任されたユーザー認証</a>と、<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview#agent-auth-manager\">Agent Identity Auth Manager を使用したセキュアな OAuth</a> を提供します。統合パートナーのリストは、<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agw-partners\">こちら</a>をご覧ください。</li><li><b>エージェントとツールの簡素化されたセキュアな接続:</b> Cloud Run 用エクスプレス リンクを使用すると、エージェントが必要なアクセス先を宣言するだけで、ID トークンの注入をはじめとするコンポーネント間のセキュアな認証済み接続が確立されます。</li></ul><p><i>「L’Oréal の目標は、エージェント型 AI をチーム全員の手に届け、新しいアイデアを実現して美容の未来を創り出せるようにすることです。当社の Beauty Tech Agentic Platform を通じて、AI エージェントは日常業務の一部となりつつあります。Google Cloud のエージェント ガバナンスは、Cloud Run などのランタイム全体で ID、ポリシー、オブザーバビリティを統合し、この大きな目標を、確信を持って推し進める強力な基盤となっています。当社の開発者は、各エージェントのアクセス権限を明確に管理しながら、より迅速にイノベーションを起こすことができます。」</i><b><i>-</i></b> <b>L’Oreal、AI リード エンジニア、Alexandre Frizzo 氏</b></p><p><b>Google のレジリエンスに優れたエージェント インフラストラクチャを基盤に構築</b></p><p>エージェントの時代を迎えた今、インフラストラクチャのスケーリング手法そのものにも進化が求められています。Agent Compute Engine と Agent Substrate による高パフォーマンスな実行環境に、クロスクラウドへと対応拡張されたビジネス向け Gemini のエージェント ガバナンス機能を組み合わせることで、安全に保護された高密度 AI エージェントのためのレジリエントな基盤を確立しています。</p><ul><li><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/agent-compute-engine-deep-dive\">Agent Compute Engine</a> の詳細をご確認のうえ、ご関心のある方は<a href=\"https://docs.google.com/forms/u/0/d/17-u6fXLEUpfmid3cl99cTdO-INuEeQYQqzNjmd4WwRg/viewform?edit_requested=true\" target=\"_blank\">こちらからお知らせください</a>。</li><li>コミュニティとともにオープンに構築される <a href=\"https://cloud.google.com/blog/ja/products/containers-kubernetes/agent-substrate-available-on-gke?e=48754805&amp;hl=ja\">Agent Substrate</a> の開発にご協力ください。<a href=\"http://ate.dev/\" target=\"_blank\">オープンソース リポジトリ</a>にアクセスし、今すぐ GKE でお試しください。</li><li><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern\">エージェント ガバナンス</a>の詳細をご確認のうえ、ご関心のある方は<a href=\"https://forms.gle/91cYE7RH4eQ18dbf7\" target=\"_blank\">こちらからお知らせください</a>。</li><li><a href=\"https://events.linuxfoundation.org/agntcon-mcpcon-north-america/\" target=\"_blank\">AGNTCon + MCPCon</a> にぜひお越しください。エキスパートにご相談いただけるほか、実際のデモもご覧いただけます。</li></ul><p><b><i>- Google Cloud インフラストラクチャ チーム</i></b></p></div>"
