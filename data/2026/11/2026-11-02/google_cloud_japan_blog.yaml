利用できます。このブログ投稿で取り上げた活動は、Google Security Operations において以下のルール名で検出されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explorer Launching Cmd With Powershell Start Process Command</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Suspicious Process Invoking Dllhost Clsid Invocation</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ファイル IoC の ATI アクティブ侵害ルールに一致</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">IP アドレス IoC の ATI 高優先度ルールに一致</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">IP アドレス IoC の ATI 中優先度ルールに一致</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">システム バイナリのコピー</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">System32 バイナリが非標準ディレクトリにコピーされた</span></p>\n</li>\n</ul></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">検出</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">YARA ルール</strong></p>\n<pre class=\"language-plain\"><code>rule G_APT_Downloader_CROSSROAD_1\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects obfuscated and masquerading UNC7017 CROSSROAD downloaders targeting AOMEI software update mechanisms\"\n\t\t\n\tstrings:\n\t\t// Masquerading &amp; Metadata\n\t\t$meta_typo = \"AOMEI Update Compent\" wide\n\t\t$meta_co = \"AOMEI International Network Limited\" wide\n\t\t$meta_ver = \"8.2.5.0\" wide\n\t\t$meta_orig = \"upgrade-now.exe\" wide\n\t\t$meta_name = \"upgrade-now\" wide\n\t\t// Embedded Decompression &amp; Downloader Artifacts\n\t\t$miniz1 = \"archive is too large\" ascii\n\t\t$miniz2 = \"failed finding central directory\" ascii\n\t\t$miniz3 = \"unexpected decompressed size\" ascii\n\t\t$whttp1 = \"WinHttpCrackUrl\" ascii\n\t\t$whttp2 = \"WinHttpSendRequest\" ascii\n\t\t// Obfuscation &amp; Scheduled Task Artifacts\n\t\t$task1 = \"RadminComponentRuntime\" wide\n\t\t$task2 = \"Radmin Component runtime checkable.\" wide\n\t\t$flag = \"--runtimechk\" wide\n\t\t$sob1 = \"IsCurrentIpWhitelisted._sob_enc\" ascii\n\t\t$sob2 = \"DownloadFileFromUrlA._sob_enc\" ascii\n\t\t$sob3 = \"WinMain._sob_enc.\" ascii\n\t\t$obf_key = \"_sob_key\" ascii\n\tcondition:\n\t\tuint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and filesize &lt; 5MB and (\n\t\t\t(($meta_typo or ($meta_co and ($meta_orig or $meta_name or $meta_ver))) and\n\t\t\t any of ($miniz*) and\n\t\t\t any of ($whttp*)) or\n\t\t\t(2 of ($sob*) and ($task1 or $flag)) or\n\t\t\t($obf_key and $task1 and $task2 and any of ($sob*))\n\t\t)\n}\n</code></pre>\n<pre class=\"language-plain\"><code>rule G_APT_Backdoor_SHINYROAD_1\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects the SHINYROAD BlkScrDl.dll COM-staging loader and RuntimeComponent.dll PocketPy engine\"\n\t\t\n\tstrings:\n\t\t// Shared SHINYROAD artifacts (shared memory section and mutex)\n\t\t$shm = \"Local\\\\963d3c60-d406-4ad6-aa1e-dc8e45061ccf\" ascii wide\n\t\t$mtx = \"Global\\\\{F9E6E3C0-E11A-4F85-9944-AF4AD6E05883}\" ascii wide\n\t\t// BlkScrDl.dll loader: config.zip staging and COM server registration\n\t\t$ld1 = \"%sconfig.zip\" ascii\n\t\t$ld2 = \"%scsvc\\\\RuntimeComponent.dll\" ascii\n\t\t$ld3 = \"libBlkScrDl.dll\" ascii\n\t\t$com1 = \"Software\\\\Classes\\\\CLSID\\\\%s\" ascii\n\t\t$com2 = \"Software\\\\Classes\\\\AppID\\\\%s\" ascii\n\t\t$com3 = \"%s\\\\InprocServer32\" ascii\n\t\t// RuntimeComponent.dll embedded PocketPy engine\n\t\t$rc1 = \"libRuntimeComponent.dll\" ascii\n\t\t$rc2 = \"metadata.dat\" ascii\n\t\t$rc3 = \"_pyio_compat\" ascii\n\t\t$rc4 = \"_pyio_struct\" ascii\n\t\t$rc5 = \"%sdemo_srv.log\" ascii\n\tcondition:\n\t\tuint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and filesize &lt; 5MB and (\n\t\t\t($shm and $mtx) or\n\t\t\t(($shm or $mtx) and (2 of ($ld*) or 2 of ($rc*))) or\n\t\t\t(2 of ($ld*) and 2 of ($com*)) or\n\t\t\t($rc1 and $rc2 and any of ($rc3, $rc4, $rc5))\n\t\t)\n}\n</code></pre></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-plain\"><code>rule G_APT_Backdoor_SHINYROAD_2\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects compiled PocketPy bytecode payloads associated with SHINYROAD backdoors\"\n\n\tstrings:\n\t\t$pkpy_magic = { 4F 43 01 00 }\n\t\t$proto1 = \"mct3-handshake-v1\" ascii\n\t\t$script = \"bootstrap_tcp_slim_v2_call_min.py\" ascii\n\t\t$jam1 = \"JAM_BURST_PACKETS_MIN\" ascii\n\t\t$jam2 = \"JAM_MIN_MS\" ascii\n\t\t$jam3 = \"JAM_MAX_BYTES\" ascii\n\t\t$mod1 = \"_pyio_struct\" ascii\n\t\t$mod2 = \"_pyio_compat\" ascii\n\t\t$enc1 = \"nh_enc\" ascii\n\t\t$enc2 = \"encbody\" ascii\n\n\tcondition:\n\t\t$pkpy_magic at 0 and filesize &lt; 500KB and (\n\t\t\t$proto1 or\n\t\t\t$script or\n\t\t\tall of ($jam*) or\n\t\t\t(all of ($mod*) and any of ($enc*))\n\t\t)\n}</code></pre>\n<pre class=\"language-markup\"><code>rule G_APT_Launcher_ADAPTAGENT_1\n{\n\tmeta:\n\t\tauthor = \"Mandiant\"\n\t\tdesc = \"Detects UNC7017 ADAPTAGENT post-exploitation loader and sideloaded Adaptix payload (Nitro camouflage)\"\n\t\tref = \"https://cloud.google.com/blog/topics/threat-intelligence/investigating-ephemeral-supply-chain-tampering\"\n\t\tplatforms = \"Win\"\n\t\trs1 = \"14b31918075e6130b9123158743db0a81e2d7bfcf6d39731ee7d9200a98cd591\"\n\n\tstrings:\n\t\t// Sideloaded Masquerading &amp; Camouflage\n\t\t$camo_exe1 = \"NitroPromotion.exe\" ascii wide nocase\n\t\t$camo_exe2 = \"Nitro_Scan2PDFApp.exe\" ascii wide nocase\n\t\t$camo_dll1 = \"Eztwain4.dll\" ascii wide nocase\n\t\t$camo_dll2 = \"Nitro PDF Eztwain4\" ascii wide nocase\n\t\t$camo_ver = \"14.10.1.0\" ascii wide\n\t\t$camo_copy = \"Nitro Software, Inc.\" ascii wide\n\n\t\t// NitroPromotion Loader &amp; Staging Functionality\n\t\t$load1 = \"DownloadToLocalAppData\" ascii\n\t\t$load2 = \"ExtractZipToDirectoryA\" ascii\n\t\t$load3 = \"GetTempZipFileNameA\" ascii\n\t\t$load4 = \"CreateScheduledTask\" ascii\n\n\t\t// Adaptix C2 &amp; ADAPTAGENT Core Artifacts\n\t\t$adapt1 = \"Adaptix Crash Analyzer v1.0\" ascii\n\t\t$adapt2 = \"Global\\\\{8d00c640-48d8-4440-a8e1-660fd37f572a}\" ascii wide\n\t\t$adapt3 = \"\\\\\\\\.\\\\pipe\\\\%08lx\" ascii\n\t\t$adapt4 = \"13ConnectorHTTP\" ascii\n\t\t$adapt5 = \"9Connector\" ascii\n\n\tcondition:\n\t\tuint16(0) == 0x5A4D and uint32(uint32(0x3C)) == 0x00004550 and filesize &lt; 10MB and (\n\t\t\t// Branch 1: ADAPTAGENT Sideloaded Payload (Eztwain4.dll)\n\t\t\t(any of ($camo_dll*, $adapt1, $adapt2) and 2 of ($adapt*)) or\n\n\t\t\t// Branch 2: NitroPromotion Masquerading Loader (NitroPromotion.exe)\n\t\t\t(any of ($camo_exe*) and (2 of ($load*) or any of ($adapt1, $adapt2))) or\n\t\t\t(all of ($camo_ver, $camo_copy) and any of ($camo_exe*) and any of ($load*))\n\t\t)\n}</code></pre></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">MITRE ATT&amp;CK の手法</strong></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">戦術</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">手法 ID</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">手法名</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">観測されたコンテキスト</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リソース開発</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1583/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1583.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">インフラストラクチャの取得: ドメイン</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">storage-data.com</code><span style=\"vertical-align: baseline;\"> ならびに </span><code style=\"vertical-align: baseline;\">promotion.</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">aomei.</code><span style=\"vertical-align: baseline;\"> サブドメインの登録。ペイロードのステージングとコールバックに使用。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リソース開発</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1583/006/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1583.006</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">インフラストラクチャの取得: ウェブサービス</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Alibaba Cloud OSS（</span><code style=\"vertical-align: baseline;\">serv.oss-cn-hongkong.aliyuncs.com</code><span style=\"vertical-align: baseline;\">）と公開 Cloud Storage バケット（</span><code style=\"vertical-align: baseline;\">aomeiupdate</code><span style=\"vertical-align: baseline;\">）を、高評価のステージング インフラストラクチャとして悪用。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リソース開発</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1608/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1608.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">機能のステージング: マルウェアのアップロード</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">各改ざん時間枠の前に、攻撃アクターが制御するドメインとクラウド ストレージに </span><code style=\"vertical-align: baseline;\">upgrade-now.zip</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">component.zip</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">en.zip</code><span style=\"vertical-align: baseline;\"> をステージング。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">初期アクセス</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1195/002/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1195.002</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">サプライ チェーンの侵害: ソフトウェア サプライ チェーンの侵害</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リモート AOMEI </span><code style=\"vertical-align: baseline;\">.ini</code><span style=\"vertical-align: baseline;\"> アップデート構成ファイルの一時的な変更。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1059/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1059.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンドとスクリプトのインタープリタ: PowerShell</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Nitro PDF / Adaptix C2 ペイロードを実行する、非表示での PowerShell 実行（</span><code style=\"vertical-align: baseline;\">-WindowStyle Hidden</code><span style=\"vertical-align: baseline;\">）。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1059/006/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1059.006</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンドとスクリプトのインタープリタ: Python</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">組み込みの PocketPy インタープリタ（</span><code style=\"vertical-align: baseline;\">RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">WNTestDll.dll</code><span style=\"vertical-align: baseline;\">）を介した、コンパイル済みバイトコードのインメモリ実行。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1559/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1559.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">プロセス間通信: コンポーネント オブジェクト モデル</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> は、CLSID </span><code style=\"vertical-align: baseline;\">{21191641-0D7F-4CD9-9572-01AAE6E7851B}</code><span style=\"vertical-align: baseline;\"> をインプロセス COM サーバーとして登録し、Radmin プロセスに </span><code style=\"vertical-align: baseline;\">csvc\\RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> を読み込ませます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">永続性</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1053/005/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1053.005</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">スケジュールされたタスク / ジョブ: スケジュールされたタスク</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">スケジュールされたタスク </span><code style=\"vertical-align: baseline;\">\\RadminComponentRuntime</code><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">FamItrfc.exe --runtimechk</code><span style=\"vertical-align: baseline;\"> を実行）と </span><code style=\"vertical-align: baseline;\">\\NitroRuntime</code><span style=\"vertical-align: baseline;\">。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1574/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1574.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行フローのハイジャック: DLL</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">署名付きの </span><code style=\"vertical-align: baseline;\">FamItrfc.exe</code><span style=\"vertical-align: baseline;\"> による </span><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> の検索順序ハイジャックと、Nitro PDF を装ったローダによる </span><code style=\"vertical-align: baseline;\">Eztwain4.dll</code><span style=\"vertical-align: baseline;\"> のサイドローディング。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1480/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1480</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">実行ガードレール</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">セカンダリ ペイロードの取得前に、</span><code style=\"vertical-align: baseline;\">AOMEI</code><span style=\"vertical-align: baseline;\"> ディレクトリの部分文字列と外部 IP リフレクション フィルタリングを検証。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1036/005/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1036.005</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">なりすまし: 正規のリソースの名前または場所との一致</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">BlkScrDl.dll</code><span style=\"vertical-align: baseline;\"> は、Radmin の正規の「空白画面」ドライバ ライブラリを装い、ADAPTAGENT ローダは Nitro PDF ツール（</span><code style=\"vertical-align: baseline;\">NitroPromotion.exe</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">Eztwain4.dll</code><span style=\"vertical-align: baseline;\">）を装います。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1027/013/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1027.013</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">難読化されたファイルまたは情報: 暗号化された / エンコードされたファイル</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">config.zip</code><span style=\"vertical-align: baseline;\"> 内に ChaCha20 で暗号化された </span><code style=\"vertical-align: baseline;\">metadata.dat</code><span style=\"vertical-align: baseline;\"> として保存されている SHINYROAD ステージ 2 Python バイトコード。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1140/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1140</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ファイルまたは情報の難読化解除 / デコード</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">RuntimeComponent.dll</code><span style=\"vertical-align: baseline;\"> は、HMAC-SHA256 派生鍵と IV を使用して、ChaCha20 でメモリ内の </span><code style=\"vertical-align: baseline;\">metadata.dat</code><span style=\"vertical-align: baseline;\"> を復号します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1070/004/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1070.004</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">インジケーターの削除: ファイルの削除</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">--nitrod</code><span style=\"vertical-align: baseline;\"> で生成された子プロセスを介した CROSSROAD（</span><code style=\"vertical-align: baseline;\">upgrade-now.exe</code><span style=\"vertical-align: baseline;\">）の自己削除。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">防御回避</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1564/004/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1564.004</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">アーティファクトの非表示: NTFS のファイル属性</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD は、プライマリ </span><code style=\"vertical-align: baseline;\">:$DATA</code><span style=\"vertical-align: baseline;\"> ストリームの名前を </span><code style=\"vertical-align: baseline;\">:wtfbbq</code><span style=\"vertical-align: baseline;\"> という代替データ ストリームに変更してから、ハンドルを閉じる際にファイルを削除対象としてフラグを立てます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">認証情報アクセス</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1187/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1187</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">強制認証</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">Notifycfg.ini</code><span style=\"vertical-align: baseline;\"> 内で構成された、UNC リソースをレンダリングする非表示の 1x1 ポップアップを介した WebDAV NTLM 強制認証。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">検出</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1016/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1016</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">システム ネットワーク構成の検出</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD は、</span><code style=\"vertical-align: baseline;\">myip.opendns.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">o-o.myaddr.l.google.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">checkip.amazonaws.com</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">api.ipify.org</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">ifconfig.me/ip</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">icanhazip.com</code><span style=\"vertical-align: baseline;\"> を介してホストの外部 IP を解決します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">検出</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1614/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1614</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">システムの位置の探索</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD は、IP から取得した国コードが</span><code style=\"vertical-align: baseline;\">「CN」</code><span style=\"vertical-align: baseline;\">（中国）の場合、プライマリ ペイロードの実行パスを中止します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">検出</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1082/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1082</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">システム情報の探索</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD は、被害者のホスト名をフィンガープリントして、一意のエージェント識別子を導出します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">検出</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1033/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1033</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">システム オーナー / ユーザーの探索</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD は、ログインしたユーザー名を独自のエージェント識別子と C2 鍵の導出に組み込みます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンド＆コントロール</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1105/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1105</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">内部へのツール転送</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">CROSSROAD は </span><code style=\"vertical-align: baseline;\">component.zip</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">en.zip</code><span style=\"vertical-align: baseline;\"> を </span><code style=\"vertical-align: baseline;\">%TEMP%\\svc&lt;random_hex&gt;.tmp</code><span style=\"vertical-align: baseline;\"> にダウンロードし、</span><code style=\"vertical-align: baseline;\">%LOCALAPPDATA%\\Radmin\\</code><span style=\"vertical-align: baseline;\"> に解凍します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンド＆コントロール</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1571/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1571</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">非標準ポート</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD カスタム バイナリ C2（TCP </span><code style=\"vertical-align: baseline;\">41397</code><span style=\"vertical-align: baseline;\">）、ADAPTAGENT ビーコン（TCP </span><code style=\"vertical-align: baseline;\">6800</code><span style=\"vertical-align: baseline;\">）。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンド＆コントロール</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1573/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1573.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">暗号化されたチャネル: 対称暗号</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">ハードコードされたハンドシェイク鍵で暗号化されたカスタム バイナリ C2 ストリーム。エージェント ID から派生したホスト固有の鍵にローテーションされます。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンド＆コントロール</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1001/001/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1001.001</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">データの難読化: ジャンクデータ</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD は、ランダム化されたジャンク パケット（トラフィック チャフ）を生成して、ネットワーク シグネチャ マッチングを妨害します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コマンド＆コントロール</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><a href=\"https://attack.mitre.org/techniques/T1219/002/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">T1219.002</span></a></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">リモート アクセス ツール: リモート デスクトップ ソフトウェア</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SHINYROAD バックドアとともに、正規の Famatech Radmin 3.x サーバー コンポーネントを被害者のホストにデプロイします。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">表 6: MITRE ATT&amp;CK 手法</span></p>\n<h4><span style=\"vertical-align: baseline;\">謝辞</span></h4>\n<p><span style=\"vertical-align: baseline;\">GTIG と Mandiant は、この活動を最初に発見し、プロアクティブにテレメトリーを共有し、共通の顧客ベースとより広範なソフトウェア エコシステムのセキュリティ確保のために継続的に協力してくれた ManageEngine Threat Analysis Lab（</span><a href=\"https://www.manageengine.com/threat-analysis-lab\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">METAL</span></a><span style=\"vertical-align: baseline;\">）のリサーチチームに感謝いたします。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Mandiant</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Google Threat Intelligence Group</strong></p></div>"
