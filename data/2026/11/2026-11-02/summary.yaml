  この日は Google Cloud の日本語ブログに 10 月下旬の米国記事の抄訳がまとまって公開され、脅威インテリジェンスとエージェント基盤が中心でした。セキュリティでは、GTIG と Mandiant が 2026 年 4 月から 7 月にかけての AOMEI Technology のアップデート基盤を狙ったサプライチェーン侵害を報告しました。UNC7017 として追跡するクラスタが改ざんを 5〜10 分間だけ有効にして元に戻す手口で、CROSSROAD ダウンローダと SHINYROAD バックドアを配信していました。さらに、攻撃者がオープンソースのエージェント型ペンテストフレームワーク ARTEX、Hexstrike、CAIRN を悪用している事例も示され、コントロールプレーンの分離や短期間のみ有効な認証情報などの防御策が挙げられています。エージェント基盤では、Agent Compute Engine が発表され、今後数か月以内にプレビュー提供を始める予定で、ハードウェアレベルで分離されたサンドボックスを備えます。Knowledge Catalog には自己学習型コンテキストエンリッチメントと Knowledge Studio がプレビューで加わり、GDC エアギャップでは Gemini on GDC のエンタープライズ検索 (プレビュー版) などソブリン AI の機能が拡充されました。エージェント評価エンジニアリングの教訓を 4 点まとめた記事も公開されています。
