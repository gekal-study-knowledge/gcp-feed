    "summary": "<h2 class=\"release-note-product-title\">Apigee Edge for Public Cloud</h2>\n<h3>Announcement</h3>\n<p><strong>Scheduled maintenance of Management/Control Plane for the Apigee Edge for Public Cloud on November 6, 2026.</strong></p>\n<p>Scheduled maintenance of Management/Control Plane for the Apigee Edge for Public Cloud production will take place on Friday, November 6, 2026, from 9:00 PM PT to\n10:00 PM PT (Saturday, November 7, 2026, from 5:00 AM UTC to 6:00 AM UTC). This\nmaintenance follows the monthly maintenance window schedule documented in the\n<a href=\"https://docs.apigee.com/release/notes/apigee-release-notes\">Apigee Edge release notes archive</a>.</p>\n<p>During the scheduled maintenance window, the following services will be\ntemporarily unavailable, and attempts to access them will return a <code>4xx</code> status\ncode:</p>\n<ul>\n<li>Management Services UI</li>\n<li>Management Services APIs</li>\n<li>Monetization Management APIs</li>\n<li>New proxy deployments</li>\n<li>DevPortal Service</li>\n<li>Microgateway Services</li>\n<li>Edge Query (Analytics Stats APIs)</li>\n</ul>\n<p>Runtime API calls to deployed API proxies are unaffected. While access to\nanalytics queries may be temporarily unavailable during the maintenance window, all\nanalytics and metrics data from this period will be available once maintenance\nends.</p>\n<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p><a href=\"https://docs.cloud.google.com/bigquery/docs/conversational-analytics\">Conversational analytics in BigQuery</a>\nis now available in the <code>asia-northeast1</code> (Tokyo) location. For more\ninformation, see <a href=\"https://docs.cloud.google.com/bigquery/docs/conversational-analytics#locations\">Locations</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Omni 1.2 Flash</strong></p>\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/omni-1-2-flash\">Gemini Omni 1.2 Flash</a>\n(<code>gemini-omni-1.2-flash</code>) is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">General Availability (GA)</a>.\nGemini Omni 1.2 Flash is an omni-modal foundation model that processes text,\nimage, and video inputs to generate text and high-definition video with\nsynchronized audio through the\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/capabilities/interactions\">Interactions API</a>.</p>\n<p>Gemini Omni 1.2 Flash introduces the following capabilities:</p>\n<ul>\n<li><p><strong>Standalone video upscaling</strong>: Upscale previously generated videos from\n360p to 720p or 1080p, and from 720p to 1080p or 4K using <code>task: \"upscale\"</code>.\nSee <a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/video/upscale-videos\">Upscale videos</a>.</p></li>\n<li><p><strong>Extended video generation and editing duration</strong>: Generate or edit videos\nup to 15 seconds in length across text-to-video, image-to-video,\nreference-to-video, and video editing tasks (up to 10 seconds for\nfirst-and-last-frame interpolation and video extension).</p></li>\n<li><p><strong>Reference-guided video editing and extension</strong>: Supply up to 2 reference\nimages along with an input video when editing or extending videos. See\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/video/edit-videos\">Edit videos</a> and\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/video/extend-videos\">Extend videos</a>.</p></li>\n<li><p><strong>Deterministic generation and billing labels</strong>: Specify <code>seed</code> for\nreproducible video outputs and attach custom <code>labels</code> to Interactions API\nrequests.</p></li>\n<li><p><strong>Standard PayGo and Provisioned Throughput</strong>: Available with\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/standard-paygo\">Standard Pay-as-you-go (PayGo)</a>\nand\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput/gemini-omni-models\">Provisioned Throughput</a>\n(685 tokens per second per GSU).</p></li></ul>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>You can enable or disable the child sexual abuse material (CSAM) filter in\nModel Armor templates and floor settings, and configure granular\nconfidence levels (<code>High</code>, <code>Medium and above</code>, and <code>Low and above</code>).</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/model-armor/overview#ma-csam-detection\">Model Armor\nfilters</a> and <a href=\"https://docs.cloud.google.com/model-armor/manage-templates#configure-detections\">Create and manage\ntemplates</a>.</p>\n<h2 class=\"release-note-product-title\">Security Command Center</h2>\n<h3>Deprecated</h3>\n<p>Data Security Posture Management (DSPM) is no longer available to new organizations. If\nDSPM is already enabled for your organization, you retain full\naccess until its scheduled shutdown on February 1, 2027. For more information,\nsee <a href=\"https://docs.cloud.google.com/security-command-center/docs/deprecations\">Deprecations and shut down features</a> and\n<a href=\"https://docs.cloud.google.com/security-command-center/docs/dspm-data-security#data-security-framework\">alternative detection capabilities</a>.</p>"
