  "7b964493dd983b69d95853bb7a28ddbf":
    "id": "7b964493dd983b69d95853bb7a28ddbf"
    "title": "Introducing Compute Engine API multi-versioning: Predictable evolution without breaking production"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/introducing-compute-engine-api-multi-versioning-predictable-evolution-without-breaking-production/"
    "published": "2026-11-05 01:00:00"
    "fetched": "2026-11-05 01:51:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Ready to modernize your infrastructure without risking production stability? API multi-versioning for Compute Engine, now in general availability, helps you do just that. With date-based API versions, Compute Engine can now regularly deliver modern API semantics, stronger resilience defaults, and improved developer experience while preserving the rock-solid stability of the </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API.</span></p>\n<p><span style=\"vertical-align: baseline;\">For more than a decade, the Google Compute Engine </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API has served as the foundational control plane for millions of virtual machines, Google Kubernetes Engine (GKE) clusters, and large-scale AI infrastructure. For platform teams and developers who build on Google Cloud, that single </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> endpoint delivered an extraordinary promise: write your integration once, and trust that it will keep running year after year.</span></p>\n<p><span style=\"vertical-align: baseline;\">Yet as cloud architectures have grown in scale and sophistication, infrastructure teams have faced a growing tension. On one hand, mission-critical production workloads require absolute API stability and strict backward compatibility. On the other hand, customers want faster access to safer security defaults, stronger regional resilience, machine-readable error models, and modern, declarative-friendly APIs, but introducing these improvements in place risks disrupting existing automation. The new versioning model helps avoid that disruption by giving you the flexibility to adopt modern semantics on your own schedule without touching your production workloads.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Date-based API versions for Compute Engine</span></h2>\n<p><span style=\"vertical-align: baseline;\">Historically, Compute Engine relied on </span><strong style=\"vertical-align: baseline;\">channel-based versioning (CBV)</strong><span style=\"vertical-align: baseline;\"> with three long-lived channels: </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> (generally available), </span><code style=\"vertical-align: baseline;\">/beta</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">/alpha</code><span style=\"vertical-align: baseline;\">. Because </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> was a single, mutable production surface shared by every customer worldwide, any behavioral improvement–even changing a counter-intuitive default or modernizing an error format–carried the risk of breaking existing scripts or required multi-year migrations.</span></p>\n<p><span style=\"vertical-align: baseline;\">With </span><strong style=\"vertical-align: baseline;\">interface-based versioning (IBV)</strong><span style=\"vertical-align: baseline;\">, aligned with Google </span><a href=\"https://google.aip.dev/185\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AIP-185</span></a><span style=\"vertical-align: baseline;\">, Compute Engine introduces immutable, date-based API snapshots alongside </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stable versions (</strong><code><strong style=\"vertical-align: baseline;\">YYYY-MM-DD</strong></code><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: Released on a predictable </span><strong style=\"vertical-align: baseline;\">quarterly cadence</strong><span style=\"vertical-align: baseline;\"> (starting with </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">), each stable version represents a locked, point-in-time contract of all generally available Compute Engine features and behavioral defaults. Stable versions don't receive breaking changes after they're published. They have no end-of-support date today.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Preview versions (</strong><code><strong style=\"vertical-align: baseline;\">YYYY-MM-DD-preview</strong></code><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: Released on a rapid cadence (such as </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\">), preview versions branch from a stable parent to give developers early access to upcoming features and API designs, carrying a predictable one-year lifespan for testing and feedback.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Uninterrupted </strong><code><strong style=\"vertical-align: baseline;\">/v1</strong></code><strong style=\"vertical-align: baseline;\"> support</strong><span style=\"vertical-align: baseline;\">: The existing </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API remains fully supported and it continues to serve as the default if no date-based version is specified. Your existing applications, scripts, and integrations continue to work without modification.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Primary benefits for builders</span></h2>\n<h3><span style=\"vertical-align: baseline;\">1. Stability and customer-controlled upgrades</span></h3>\n<p><span style=\"vertical-align: baseline;\">In a traditional single-version API, changing a default behavior forces a trade-off between platform progress and customer stability. But date-based multi-versioning puts upgrade timing entirely in your hands:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pin to a known contract</strong><span style=\"vertical-align: baseline;\">: Direct REST callers and SDK users can lock onto a specific version identifier (such as </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">) knowing its request and response schemas are frozen.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Upgrade on your schedule</strong><span style=\"vertical-align: baseline;\">: When a new quarterly stable version introduces updated defaults or modified resource schemas, your team can evaluate the release notes, test in staging by changing a single version string, and roll out to production at your own pace.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Consistent resource URIs</strong><span style=\"vertical-align: baseline;\">: Date-based versions continue to use the </span><code style=\"vertical-align: baseline;\">/compute/v1/</code><span style=\"vertical-align: baseline;\"> base URL path. You specify the target version via the </span><code style=\"vertical-align: baseline;\">X-Goog-Api-Version</code><span style=\"vertical-align: baseline;\"> HTTP header or the </span><code style=\"vertical-align: baseline;\">$apiVersion</code><span style=\"vertical-align: baseline;\"> query parameter. This means that resource </span><code style=\"vertical-align: baseline;\">selfLink</code><span style=\"vertical-align: baseline;\"> URIs remain uniform across tools and services.</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Request a specific date-based stable version using the HTTP header\\r\\ncurl -X GET \\\\\\r\\n  &quot;https://compute.googleapis.com/compute/v1/projects/my-project/zones/us-central1-a/instances&quot; \\\\\\r\\n  -H &quot;Authorization: Bearer $(gcloud auth print-access-token)&quot; \\\\\\r\\n  -H &quot;X-Goog-Api-Version: 2026-09-01&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f4200369e90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">2. Safer defaults, stronger resilience, and modern API standards</span></h3>\n<p><span style=\"vertical-align: baseline;\">By isolating behavioral changes to new date-based versions, Compute Engine is delivering improvements that make cloud applications more resilient, more secure, and easier to automate:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resilient global queries by default</strong><span style=\"vertical-align: baseline;\">: In legacy </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">, calling </span><code style=\"vertical-align: baseline;\">AggregatedList</code><span style=\"vertical-align: baseline;\"> across all zones and regions defaults </span><code style=\"vertical-align: baseline;\">returnPartialSuccess</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">false</code><span style=\"vertical-align: baseline;\">. This means a transient issue in a single zone could cause a global list request to fail unless callers explicitly opted in. In new date-based versions, partial success is enabled by default so global fleet queries remain resilient during localized maintenance or disruptions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Actionable, machine-readable errors (AIP-193)</strong><span style=\"vertical-align: baseline;\">: Date-based versions adopt standardized </span><a href=\"https://google.aip.dev/193\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">google.rpc.ErrorInfo</code></a><span style=\"vertical-align: baseline;\"> payloads with structured </span><code style=\"vertical-align: baseline;\">reason</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">domain</code><span style=\"vertical-align: baseline;\">, and contextual </span><code style=\"vertical-align: baseline;\">metadata</code><span style=\"vertical-align: baseline;\"> (such as returning the list of </span><code style=\"vertical-align: baseline;\">supported_versions</code><span style=\"vertical-align: baseline;\"> if an invalid version identifier is requested), eliminating brittle regex parsing of error strings.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stronger security and least-privilege hygiene</strong><span style=\"vertical-align: baseline;\">: New API versions allow Compute Engine to tighten overly broad legacy IAM permission checks and introduce safer configuration defaults without disrupting legacy automation running on </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cleaner, declarative-friendly API design</strong><span style=\"vertical-align: baseline;\">: Multi-versioning provides a clean path to evolve complex, decade-old resource schemas toward modern Google API Improvement Proposals (AIPs).</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">3. Seamless adoption across client libraries, </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\">, and Terraform</span></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you call the REST API directly or manage infrastructure through higher-level tools, Compute Engine API Multi-Versioning is designed to work without friction:</span></p>\n<div align=\"center\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Surface</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">How multi-versioning works</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Your responsibility</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Client libraries (Python, Go, Java, Node.js, C#, Ruby, PHP)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Each SDK release automatically binds to a specific date-based API version while </span><strong style=\"vertical-align: baseline;\">preserving the </strong><code><strong style=\"vertical-align: baseline;\">/v1</strong></code><strong style=\"vertical-align: baseline;\"> package namespace</strong><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">compute_v1</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">apiv1</code><span style=\"vertical-align: baseline;\">). Enums are represented as strings for seamless forward and backward compatibility.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Upgrade your client library dependency as usual–</span><strong style=\"vertical-align: baseline;\">no import path rewrites required</strong><span style=\"vertical-align: baseline;\">. Use </span><code style=\"vertical-align: baseline;\">-preview</code><span style=\"vertical-align: baseline;\"> SDK releases to test preview features.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud CLI (</strong><strong style=\"vertical-align: baseline;\">gcloud</strong><strong style=\"vertical-align: baseline;\">)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">gcloud compute</code><span style=\"vertical-align: baseline;\"> targets the bundled stable API version. The new </span><strong style=\"vertical-align: baseline;\">gcloud preview compute</strong><span style=\"vertical-align: baseline;\"> command group targets the bundled preview API version.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Keep </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> updated. Existing </span><code style=\"vertical-align: baseline;\">gcloud compute</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">beta</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">alpha</code><span style=\"vertical-align: baseline;\"> scripts continue to work as-is.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Terraform (</strong><code><strong style=\"vertical-align: baseline;\">google</strong></code><strong style=\"vertical-align: baseline;\"> &amp; </strong><code><strong style=\"vertical-align: baseline;\">google-beta</strong></code><strong style=\"vertical-align: baseline;\">)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">google</code><span style=\"vertical-align: baseline;\"> provider targets stable date-based APIs, while </span><code style=\"vertical-align: baseline;\">google-beta</code><span style=\"vertical-align: baseline;\"> targets preview APIs under the hood.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Upgrade your Terraform provider version to adopt new features; no manual API version configuration needed in HCL scripts.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Direct HTTP / REST</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Select any active version via </span><code style=\"vertical-align: baseline;\">-H \"X-Goog-Api-Version: YYYY-MM-DD\"</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">?$apiVersion=YYYY-MM-DD</code><span style=\"vertical-align: baseline;\">, and fetch version-specific </span><a href=\"https://www.googleapis.com/discovery/v1/apis/compute/2026-09-01/rest\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Discovery Documents</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Pass the header or query parameter in your HTTP client to opt into a specific version (e.g., </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h2><span style=\"vertical-align: baseline;\">Get started</span></h2>\n<p><span style=\"vertical-align: baseline;\">Compute Engine API multi-versioning is available today across all Google Cloud regions, with </span><code><strong style=\"vertical-align: baseline;\">2026-09-01</strong></code><span style=\"vertical-align: baseline;\"> as the initial stable version and </span><code><strong style=\"vertical-align: baseline;\">2026-10-01-preview</strong></code><span style=\"vertical-align: baseline;\"> available for preview testing.</span></p>\n<p><span style=\"vertical-align: baseline;\">Start exploring and adopting date-based versions in your workflows:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the documentation</strong><span style=\"vertical-align: baseline;\">:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/api/how-tos/api-versioning-guide\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine API Versioning Guide</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/api/how-tos/api-requests-responses\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Creating API Requests and Handling Responses</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/reference/rest/v1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine REST API Reference</span></a><span style=\"vertical-align: baseline;\"> (use the version selector to inspect </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\"> schemas)</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Try </strong><code><strong style=\"vertical-align: baseline;\">gcloud preview compute</strong></code><span style=\"vertical-align: baseline;\">: Run </span><code style=\"vertical-align: baseline;\">gcloud components update</code><span style=\"vertical-align: baseline;\"> and test upcoming preview capabilities using the new </span><code style=\"vertical-align: baseline;\">gcloud preview compute</code><span style=\"vertical-align: baseline;\"> surface.</span></p>\n</li>\n</ol></div>"
  "aeb3f55dbbd7a22c49c15e8db380ffcd":
    "id": "aeb3f55dbbd7a22c49c15e8db380ffcd"
    "title": "Helping you build and defend at machine-speed in the agentic era"
    "link": "https://cloud.google.com/blog/products/identity-security/helping-you-build-and-defend-at-machine-speed-in-the-agentic-era/"
    "published": "2026-11-05 02:00:00"
    "fetched": "2026-11-05 07:25:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As both a frontier lab and the operator of the world's most comprehensive threat intelligence network, Google occupies a unique vantage point: We see exactly how Large Language Models are engineered, and how adversaries are targeting them in the wild.</span></p>\n<p><span style=\"vertical-align: baseline;\">Passive defense is no longer viable. Allowing rapid, ungoverned adoption of autonomous systems into traditional workflows can lead to critical security incidents. </span></p>\n<p><span style=\"vertical-align: baseline;\">At the Google Cloud Security Summit, we are sharing updates on how we are helping organizations build securely, secure systems, and defend at machine speed in the agentic era. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Building securely in the agentic era</span></h3>\n<p><span style=\"vertical-align: baseline;\">Agentic coding tools have dramatically accelerated software delivery, but human review can’t keep up with machine-speed commits and unvetted dependencies. Because autonomous agents are now part of the supply chain, blind trust can turn them into direct backdoors for attackers.</span></p>\n<p><span style=\"vertical-align: baseline;\">Our approach to securing the development lifecycle builds native, real-time guardrails in the integrated development environment (IDE), unifies asset graphs across code and identity and access management (IAM,) and verifies models to weed out logic flaws before code merges.</span></p>\n<h3><span style=\"vertical-align: baseline;\">CodeMender: Frontier cyber with enterprise control</span></h3>\n<p><span style=\"vertical-align: baseline;\">As software-driven threats continue to escalate, our autonomous code-security agent </span><a href=\"https://cloud.google.com/blog/products/identity-security/find-and-fix-software-vulnerabilities-with-codemender\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> helps organizations find and fix code vulnerabilities at machine speed. It can eliminate manual triage bottlenecks while deeply embedding security in the software development lifecycle. </span></p>\n<p><span style=\"vertical-align: baseline;\">CodeMender works with multiple models, including </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\">, that can bring state-of-the-art cybersecurity capabilities. These include identifying previously-unknown vulnerabilities, and generating tested patches before they can be exploited. </span></p>\n<p><span style=\"vertical-align: baseline;\">Most recently, Wiz used Gemini 4 Argon along with other models to identify and help remediate </span><a href=\"https://www.wiz.io/blog/php2shell-php-rce\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">core PHP vulnerabilities that affected 70% of websites</span></a><span style=\"vertical-align: baseline;\">. Gemini 4 Argon made a notable contribution to finding the vulnerability, developing a likely exploit path, detecting attacks, and validating the patch.</span></p>\n<p><span style=\"vertical-align: baseline;\">Currently in preview, CodeMender delivers new capabilities for secure isolation and flexible scanning:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Secure autonomous remediation</strong><span style=\"vertical-align: baseline;\">: CodeMender isolates vulnerability verification and exploit simulation inside your choice of operating system-level sandbox or isolated virtual machine, and adds human-in-the-loop checks for local write and command execution helping to reduce the risks of malicious exploits and zero-day testing gone awry.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Flexible scanning modes</strong><span style=\"vertical-align: baseline;\">: CodeMender now allows you to scan a specific folder, entire repository, or only modified files since the last scan so you have fine grain control on how many files to scan to optimize for scanning speed and costs.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Since the CodeMender preview became available in July, hundreds of customers have used CodeMender to help them find and fix vulnerabilities at machine speed.</span></p>\n<p><span style=\"vertical-align: baseline;\">“As adversaries attack at machine speed, Google’s Fairwind Program helps us keep pace with our application security. Our early evaluation of CodeMender shows the potential to reduce vulnerability discovery time by over 95%, while keeping expert validation and remediation under human oversight,” said Ivan Fontarensky, CTO Cybersecurity Services, Thales Group.</span></p>\n<p><span style=\"vertical-align: baseline;\">“IDC research finds that nearly 40% of enterprises add vulnerabilities faster than they can remediate them. Detection without remediation only adds to developer workloads,” said Katie Norton, research director, Cloud Security, IDC. “CodeMender solves this by pairing exploitability validation with deployable code fixes, driving the continuous, verified patching required as exploitation timelines compress.”</span></p>\n<h3><span style=\"vertical-align: baseline;\">Securing workloads everywhere</span></h3>\n<p><span style=\"vertical-align: baseline;\">When autonomous workloads transition to production, the threat landscape shifts entirely. Adversaries target your plumbing — credentials, data boundaries, and integrations that connect agents to the enterprise. Once inside, attackers exploit over-privileged credentials and unsegmented environments to move laterally across enterprise data boundaries.</span></p>\n<p><span style=\"vertical-align: baseline;\">To eliminate these flat-trust architectures, Google Cloud delivers a unified framework of foundational security and governance controls for agents everywhere they run. Whether your agents are operating on the Gemini platform, Google Kubernetes Engine (GKE) and Cloud Run, the new </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/introducing-agent-compute-engine-and-expanded-agent-governance\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Compute Engine</span></a><span style=\"vertical-align: baseline;\">, or are coordinating across multi-cloud environments — they are bound by the same rigorous enterprise controls.</span></p>\n<p><span style=\"vertical-align: baseline;\">To enforce our agents everywhere framework at the transaction level, we are introducing critical identity, network, and content controls:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Auth Manager (Agent Identity)</strong><span style=\"vertical-align: baseline;\">: Centralizes credential management inside a Google-managed vault governed by IAM. Now generally available, </span><a href=\"https://docs.cloud.google.com/iam/docs/auth-manager-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Auth Manager</span></a><span style=\"vertical-align: baseline;\"> automates OAuth 2.0/PKCE flows and refreshes user-delegated tokens to minimize consent fatigue and reduce credential theft. Alongside Auth Manager, </span><a href=\"https://docs.cloud.google.com/iam/docs/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Identity</span></a><span style=\"vertical-align: baseline;\"> </span><a href=\"https://docs.cloud.google.com/iam/docs/auth-agent-own-identity-external\"><span style=\"text-decoration: underline; vertical-align: baseline;\">JWT support</span></a><span style=\"vertical-align: baseline;\">, now in preview, issues standard OIDC tokens, allowing agents to authenticate securely across AWS, Azure, on-premises backends, and MCP servers without static, long-lived API keys.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Identity-based VPC Service Controls</strong><span style=\"vertical-align: baseline;\">: Reinforcing perimeter defenses against data exfiltration, </span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-new-scalable-perimeter-options-with-vpc-service-controls\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC-SC ingress and egress rules</span></a><span style=\"vertical-align: baseline;\"> now support IAM roles</span><strong style=\"vertical-align: baseline;\">,</strong><span style=\"vertical-align: baseline;\"> generally available,</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">and Workload Identity Federation for GKE</span><strong style=\"vertical-align: baseline;\">, </strong><span style=\"vertical-align: baseline;\">in preview, enabling security teams to enforce granular, identity-based perimeter boundaries across enterprise GKE clusters without complex, manual exceptions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model Armor custom topic detector</strong><span style=\"vertical-align: baseline;\">: This new enhancement, available in preview, enables you to enforce topic adherence for agents. You can define custom prompt-based rules to identify on-topic and off-topic interactions. Tailored for industry use cases in healthcare, insurance, and retail, it keeps your agent conversations focused, compliant, and secure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Advanced network threat protection: </strong><span style=\"vertical-align: baseline;\">Building on </span><a href=\"https://docs.cloud.google.com/firewall/docs/about-intrusion-prevention\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud NGFW Enterprise’ IPS </span></a><span style=\"vertical-align: baseline;\">capabilities, you can now protect workloads with the new </span><a href=\"https://docs.cloud.google.com/chronicle/docs/soar/marketplace-integrations/wildfire\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud NGFW advanced malware sandbox</span></a><span style=\"vertical-align: baseline;\">, generally available, enabled by Palo Alto Networks WildFire, streamline firewall operations using Cloud NGFW</span><a href=\"https://docs.cloud.google.com/firewall/docs/about-firewall-endpoints#:~:text=the%20folder%20level.-,Project-level%20firewall%20endpoints,-:%20project%20administrators%20create\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> project-level resources</span></a><span style=\"vertical-align: baseline;\">, generally available, and automate exploit protection with </span><a href=\"https://docs.cloud.google.com/armor/docs/managed-rules-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Armor managed rules</span></a><span style=\"vertical-align: baseline;\">, available in preview, backed by Thales Imperva’s global threat intelligence that scans 1.5 trillion monthly web requests.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Defending at machine-speed</span></h3>\n<p><span style=\"vertical-align: baseline;\">Attackers are integrating advanced capabilities across their operational lifecycles to achieve unprecedented scale and velocity. To defeat autonomous, multi-agent threats, we must empower defenders with agentic, intelligence-driven operations to neutralize adversaries in minutes, not days.</span></p>\n<p><span style=\"vertical-align: baseline;\">Modern SOCs require autonomous investigation, detection, and response powered by planetary-scale infrastructure:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Continuous monitoring catches live compromises at the workload layer and feeds telemetry directly into the Wiz Security Graph.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Threat Intelligence telemetry is codified directly into the runtime logic of defensive models, triggering automated agentic threat hunts that reconstruct process trees and isolate threats in real time.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Autonomous agents analyze complex alerts, run correlation queries across multi-vendor telemetry in sub-second timeframes, and present clear mitigation actions for strategic human sign-off.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Of course, deploying autonomous technology is only half the battle; teams also need the right operational frameworks to wield it effectively. To help you</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">evolve your cyber defense operations,</span><strong style=\"vertical-align: baseline;\">  </strong><a href=\"https://cloud.google.com/resources/report/content/the-defenders-advantage-applying-agentic-systems\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mandiant Transformation Services</strong></a><span style=\"vertical-align: baseline;\"> experts can modernize your operating models to maximize the benefits of these advanced technologies. By refining processes and workforce skills with frontline best practices, Mandiant enables your organization to proactively mitigate threats and ensure business continuity during a breach. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Better together: Wiz and Google Cloud</span></h3>\n<p><span style=\"vertical-align: baseline;\">Delivering end-to-end defense requires extending these native platform controls into multi-cloud environments where organizations run diverse tooling. </span></p>\n<p><span style=\"vertical-align: baseline;\">Together, Wiz and Google Cloud are combining deep autonomous application understanding, connected security context, and threat intelligence to help organizations innovate securely and stay ahead of emerging threats. Recent highlights include:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Securing autonomous workloads wherever you build and run with Wiz: </strong><span style=\"vertical-align: baseline;\">As organizations build and scale with Google Cloud and Gemini platform, Wiz protects autonomous applications across their entire lifecycle from code to runtime. Wiz discovers and maps autonomous applications, agents, and infrastructure, deeply analyzing the application itself, including its purpose, capabilities, and permissions, to uncover hidden risks. Combined with the context of the Wiz Security Graph, this surfaces complex attack paths and runtime threats, empowering teams to prioritize risk and innovate with confidence.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Securing code at machine speed with Wiz AI SAST</strong><span style=\"vertical-align: baseline;\">: Now in preview, Wiz AI Static Application Security Testing (SAST) uses agentic reasoning to understand how an application behaves and surface complex business logic flaws. Grounded in Wiz Research and powered by our proprietary Atlas harness, </span><a href=\"https://www.wiz.io/blog/introducing-wiz-ai-sast\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz AI SAST</span></a><span style=\"vertical-align: baseline;\"> correlates code weaknesses with infrastructure context on the Wiz Security Graph so teams can prioritize the risks that matter most. Exploitable attack paths can then be remediated at machine speed using our Green Agent and CodeMender. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Strengthening threat defense together with Wiz plus Google Security Operations</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://www.wiz.io/blog/wiz-defend-and-google-security-operations\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Defend and Google Security Operations</span></a><span style=\"vertical-align: baseline;\"> now work from a shared data model, giving security operations teams the flexibility to investigate threats in either platform. Improvements include a dedicated Wiz Content Pack in Google Security Operations, Wiz Blue Agent investigation analysis in Google Security Operations, and bi-directional syncing between the platforms for a streamlined analyst experience. Additionally, Wiz Defend now integrates with Google Threat Intelligence, bringing the latest insights and frontline intelligence directly into Wiz.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Protecting under-resourced organizations with Scan for Good</strong><span style=\"vertical-align: baseline;\">: A joint initiative launched by Google DeepMind and Wiz, </span><a href=\"https://www.wiz.io/blog/scan-for-good-critical-ai-exposures\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scan for Good</span></a><span style=\"vertical-align: baseline;\"> brings the power of autonomous technology coupled with human security researchers to under-resourced organizations, including public services, critical infrastructure, and non-profits. In its first month, this initiative has used Argon to help more than 50 public service organizations and critical infrastructure providers find and remediate critical exposures.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Turning the advantage back to the builders and defenders</span></h3>\n<p><span style=\"vertical-align: baseline;\">Securing the agentic era requires evolving operational models, enforcing secure-by-design pipelines, and taking direct action against malicious infrastructure. At Google, our responsibility extends to disrupting adversaries at the source:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Tracking bad actors targeting Google Cloud environments and permanently disabling their infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Engineering specialized defensive architectures with Google DeepMind, including models trained specifically for high-stakes cybersecurity and automated code analysis.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Feeding frontline threat intelligence back into model alignment and classifier training to neutralize emerging attack vectors before they materialize.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">By establishing native pipeline defenses, dismantling flat trust architectures, and deploying machine-speed operations, enterprises can turn the AI advantage back to defenders.</span></p>\n<p><span style=\"vertical-align: baseline;\">Join us at the </span><a href=\"https://cloudonair.withgoogle.com/events/summit-amer-security-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Security Summit</span></a><span style=\"vertical-align: baseline;\"> to explore these capabilities and learn how to secure your organization in the agentic era.</span></p></div>"
  "71c5b3632827afc8eff8b35cbe8b7228":
    "id": "71c5b3632827afc8eff8b35cbe8b7228"
    "title": "Highlights and reflections from Google Public Sector Summit: Where mission meets moonshot"
    "link": "https://cloud.google.com/blog/topics/public-sector/highlights-and-reflections-from-google-public-sector-summit-where-mission-meets-moonshot/"
    "published": "2026-11-05 02:00:00"
    "fetched": "2026-11-05 07:25:13"
    "summary": "<div class=\"block-paragraph\"><p>Over <b>2,700</b> government leaders, innovators, and industry partners convened across two-days at our <a href=\"https://events.govexec.com/google-public-sector-summit/\" target=\"_blank\">Google Public Sector Summit</a> in Washington D.C. where we explored the theme, <i>“Where mission meets moonshot.”</i> We were honored to bring together leaders who are driving impact in the agentic era and leveraging agents to help boost productivity, drive innovation, and transform how services are delivered.</p><p>Let’s take a closer look at the sessions, speakers, demos, and activations throughout the event that showcased how leaders across education and government are collaborating with Google Public Sector to turn their moonshot aspirations into secure, scaled, real-world mission outcomes.</p><h2><b>Driving impact together</b></h2><p>In our morning keynote, CEO of Google Public Sector, <b>Karen Dahut</b> unpacked the event theme and shared how organizations like NASA, NOAA, The Department of War, The Department of Energy, The State of Connecticut, The U.S. Army, Case Western Reserve University, and more are collaborating with Google to drive impact in the agentic era. Karen underscored the importance of leading boldly, building with and for your people, and scaling for impact.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Karen Dahut keynote\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_090400-1207_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>Thomas Kurian</b>, CEO of Google Cloud, reinforced our commitment and shared the latest innovations across our integrated and secure stack including <a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-government-services?e=48754805\">Gemini for government services</a>, purpose-built for public sector missions. He also shared additional announcements including the Wiz Red, Green, and Blue agents which <a href=\"http://wiz.io/blog/wiz-for-gov-agents-fedramp\" target=\"_blank\">are now available</a> within Wiz for Gov, Wiz’s FedRAMP Class D (High) certified environment, and how we are bringing <a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/new-innovations-in-google-distributed-cloud\">enterprise search capabilities to Gemini on Google Distributed Cloud for air-gapped deployments</a>.</p><p><b>Chris Hein</b>, Field CTO of Google Public Sector, shared a live product demonstration that showcased Google’s technology in action. Attendees had the opportunity to hear from leaders <b>Michael P. Duffey</b>, Under Secretary of War for Acquisition and Sustainment, and <b>Ed Forst,</b> Administrator for the General Services Administration, who shared how they are applying technology to transform their missions and power their moonshots. Through partnership and powerful technology, we are creating impact at scale by transforming services, strengthening security, and improving outcomes.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Keynote Panel\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_100805-3108_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2><b>Dedicated programming for the agentic era</b></h2><p>During our Cloud Talks session, attendees heard from <b>Elizabeth Moon,</b> Managing Director of Customer Engineering for Google Public Sector, as she hosted a series of talks across critical pillars of public sector transformation. Presentations highlighted <i>infrastructure for the agentic era</i> led by <b>Rich Sanzi,</b> VP/GM for Accelerated Computing Systems at Google Cloud; <i>building safely with Google’s agentic capabilities</i> led by <b>Michael Gerstenhaber</b>, VP of Product Management for Gemini; and <i>implementing proactive defense at planet-scale</i> led by <b>Sandra Joyce</b>, VP of Google Threat Intelligence.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Cloud Talks Elizabeth Moon\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_114735-3692_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>Attendees also heard from dozens of customer and partner speakers during our breakout panels hosted by Google Public Sector leaders <b>Ron Bushar, Tony Orlando,</b> and<b> Elizabeth Moon,</b> as well as our lightning talks and closed-door birds of a feather discussions on topics including tokenomics, migration, and compliance. Alongside our customers and partners, we showcased how agents are transforming every facet of the public sector, from accelerating scientific breakthroughs, advancing healthcare outcomes, improving service delivery, strengthening national security, and more.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Data Panel\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_104934-7529_ALIVE_1.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>Over the course of the event, we offered specialized programming and engagement opportunities for national security and defense leaders. Through our Partner Connect programming, <a href=\"https://cloud.google.com/blog/topics/public-sector/google-public-sector-increases-partner-investments-for-frontline-adoption?e=48754805\">we shared</a> how we are scaling our impact through a thriving, highly capable partner community and introduced enhanced partner initiatives focused on fostering deeper collaboration, supercharging frontline adoption, and expanding mission delivery capabilities across our valued partner network.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Partner Connect\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1021_091900-7053_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2><b>Hands-on innovation with Google Public Sector</b></h2><p>The Mission Exchange served as our interactive showfloor centerpiece, bringing multi-agent coordination to life with our flagship Emergency Response Simulation, as well as live demos that showcased our full-stack innovations encompassing everything from planet-scale infrastructure to leading models and agentic platforms.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Mission Exchange\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_113740-9093_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>We hosted 19 lightning talks in the Mission Exchange, featuring customer, partner and Google experts who shared live demos and showcased real-world mission-ready solutions. Attendees also had the opportunity to join our technical hands-on labs including <i>“Getting Started with Gemini”</i> and <i>“Build Gemini Agents: From Prompt to Prototype”</i> where they built functional mission-ready agents with Google Cloud.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Hands-On Labs\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_135117-4934_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><h2><b>What’s your moonshot?</b></h2><p>I was honored to lead our closing session, <i>“What’s your moonshot?”</i> where we brought together visionary leaders <b>Adam McCarthy</b> (The White House), <b>Laura Baker</b> (NYS Board of Elections), and <b>Barry J. Schindler</b> (USPTO) to explore practical strategies for fostering a culture of courageous problem-solving and applying technology to supercharge ambition and ingenuity in entirely new ways.</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"GPS Summit 2026 Closing Session\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/GPS2026_1020_151053-4343_ALIVE.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>As we look ahead, I want to leave you with one question: <i>“What’s your moonshot?”</i></p><p>Answering this question will require bold leadership, ambition, and courage; it will require partnership and collaboration across teams and organizations; and technology that can help amplify capacity and potential. Leading in the agentic era means being comfortable with stepping into the unknown. It means asking and answering audacious questions, expanding the boundaries of what’s possible, and taking one small step in a bold new direction - even when - <i>especially</i> when it is hard.</p><h2><b>Let’s build what’s next, together</b></h2><p>We believe that bold moonshots all start with a single, pragmatic first step. To help you get started, I encourage you to take advantage of a number of helpful resources and opportunities to engage:</p><ul><li>Explore our Google Public Sector Summit <a href=\"https://cloudonair.withgoogle.com/events/google-public-sector-summit-2026?utm_source=linkedin&amp;utm_medium=paidsocial&amp;utm_campaign=FY26-Q4-northam-PUB10000039-onlineevent-er-ps-summit-on-demand-2026&amp;utm_content=-&amp;utm_term=-&amp;_gl=1*4lmx28*_ga*MTgwOTkxMzcxNS4xNzkxNDAzNzk3*_ga_WH2QY8WWF5*czE3OTMxOTkwNTUkbzM4JGcxJHQxNzkzMjAyNTY1JGo2MCRsMCRoMA..\" target=\"_blank\">sessions on-demand</a>.</li><li>Learn how <a href=\"http://goo.gle/gemini-for-gov\" target=\"_blank\">Gemini for government services</a> can help transform critical workflows and advance your mission.</li><li>Request <a href=\"https://www.wiz.io/demo\" target=\"_blank\">a demo</a> to see how Wiz Agents can help your agency meet today’s security demands at machine speed.</li><li>Schedule a <a href=\"https://cloud.google.com/contact/form?direct=true&amp;e=48754805\">1:1 consultation</a> with a Google team member or reach us at geminiforgov@google.com.</li></ul><p>The agentic era will not be defined by what technology can do, but by what we choose to build with it. Let’s go build, together.</p></div>"
"last_updated": "2026-11-05 07:25:13 JST"
