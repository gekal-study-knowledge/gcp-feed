    "title": "Introducing Compute Engine API multi-versioning: Predictable evolution without breaking production"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/introducing-compute-engine-api-multi-versioning-predictable-evolution-without-breaking-production/"
    "published": "2026-11-05 01:00:00"
    "fetched": "2026-11-05 01:51:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Ready to modernize your infrastructure without risking production stability? API multi-versioning for Compute Engine, now in general availability, helps you do just that. With date-based API versions, Compute Engine can now regularly deliver modern API semantics, stronger resilience defaults, and improved developer experience while preserving the rock-solid stability of the </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API.</span></p>\n<p><span style=\"vertical-align: baseline;\">For more than a decade, the Google Compute Engine </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API has served as the foundational control plane for millions of virtual machines, Google Kubernetes Engine (GKE) clusters, and large-scale AI infrastructure. For platform teams and developers who build on Google Cloud, that single </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> endpoint delivered an extraordinary promise: write your integration once, and trust that it will keep running year after year.</span></p>\n<p><span style=\"vertical-align: baseline;\">Yet as cloud architectures have grown in scale and sophistication, infrastructure teams have faced a growing tension. On one hand, mission-critical production workloads require absolute API stability and strict backward compatibility. On the other hand, customers want faster access to safer security defaults, stronger regional resilience, machine-readable error models, and modern, declarative-friendly APIs, but introducing these improvements in place risks disrupting existing automation. The new versioning model helps avoid that disruption by giving you the flexibility to adopt modern semantics on your own schedule without touching your production workloads.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Date-based API versions for Compute Engine</span></h2>\n<p><span style=\"vertical-align: baseline;\">Historically, Compute Engine relied on </span><strong style=\"vertical-align: baseline;\">channel-based versioning (CBV)</strong><span style=\"vertical-align: baseline;\"> with three long-lived channels: </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> (generally available), </span><code style=\"vertical-align: baseline;\">/beta</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">/alpha</code><span style=\"vertical-align: baseline;\">. Because </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> was a single, mutable production surface shared by every customer worldwide, any behavioral improvement–even changing a counter-intuitive default or modernizing an error format–carried the risk of breaking existing scripts or required multi-year migrations.</span></p>\n<p><span style=\"vertical-align: baseline;\">With </span><strong style=\"vertical-align: baseline;\">interface-based versioning (IBV)</strong><span style=\"vertical-align: baseline;\">, aligned with Google </span><a href=\"https://google.aip.dev/185\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AIP-185</span></a><span style=\"vertical-align: baseline;\">, Compute Engine introduces immutable, date-based API snapshots alongside </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stable versions (</strong><code><strong style=\"vertical-align: baseline;\">YYYY-MM-DD</strong></code><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: Released on a predictable </span><strong style=\"vertical-align: baseline;\">quarterly cadence</strong><span style=\"vertical-align: baseline;\"> (starting with </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">), each stable version represents a locked, point-in-time contract of all generally available Compute Engine features and behavioral defaults. Stable versions don't receive breaking changes after they're published. They have no end-of-support date today.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Preview versions (</strong><code><strong style=\"vertical-align: baseline;\">YYYY-MM-DD-preview</strong></code><strong style=\"vertical-align: baseline;\">)</strong><span style=\"vertical-align: baseline;\">: Released on a rapid cadence (such as </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\">), preview versions branch from a stable parent to give developers early access to upcoming features and API designs, carrying a predictable one-year lifespan for testing and feedback.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Uninterrupted </strong><code><strong style=\"vertical-align: baseline;\">/v1</strong></code><strong style=\"vertical-align: baseline;\"> support</strong><span style=\"vertical-align: baseline;\">: The existing </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API remains fully supported and it continues to serve as the default if no date-based version is specified. Your existing applications, scripts, and integrations continue to work without modification.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Primary benefits for builders</span></h2>\n<h3><span style=\"vertical-align: baseline;\">1. Stability and customer-controlled upgrades</span></h3>\n<p><span style=\"vertical-align: baseline;\">In a traditional single-version API, changing a default behavior forces a trade-off between platform progress and customer stability. But date-based multi-versioning puts upgrade timing entirely in your hands:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pin to a known contract</strong><span style=\"vertical-align: baseline;\">: Direct REST callers and SDK users can lock onto a specific version identifier (such as </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">) knowing its request and response schemas are frozen.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Upgrade on your schedule</strong><span style=\"vertical-align: baseline;\">: When a new quarterly stable version introduces updated defaults or modified resource schemas, your team can evaluate the release notes, test in staging by changing a single version string, and roll out to production at your own pace.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Consistent resource URIs</strong><span style=\"vertical-align: baseline;\">: Date-based versions continue to use the </span><code style=\"vertical-align: baseline;\">/compute/v1/</code><span style=\"vertical-align: baseline;\"> base URL path. You specify the target version via the </span><code style=\"vertical-align: baseline;\">X-Goog-Api-Version</code><span style=\"vertical-align: baseline;\"> HTTP header or the </span><code style=\"vertical-align: baseline;\">$apiVersion</code><span style=\"vertical-align: baseline;\"> query parameter. This means that resource </span><code style=\"vertical-align: baseline;\">selfLink</code><span style=\"vertical-align: baseline;\"> URIs remain uniform across tools and services.</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Request a specific date-based stable version using the HTTP header\\r\\ncurl -X GET \\\\\\r\\n  &quot;https://compute.googleapis.com/compute/v1/projects/my-project/zones/us-central1-a/instances&quot; \\\\\\r\\n  -H &quot;Authorization: Bearer $(gcloud auth print-access-token)&quot; \\\\\\r\\n  -H &quot;X-Goog-Api-Version: 2026-09-01&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f4200369e90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">2. Safer defaults, stronger resilience, and modern API standards</span></h3>\n<p><span style=\"vertical-align: baseline;\">By isolating behavioral changes to new date-based versions, Compute Engine is delivering improvements that make cloud applications more resilient, more secure, and easier to automate:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resilient global queries by default</strong><span style=\"vertical-align: baseline;\">: In legacy </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">, calling </span><code style=\"vertical-align: baseline;\">AggregatedList</code><span style=\"vertical-align: baseline;\"> across all zones and regions defaults </span><code style=\"vertical-align: baseline;\">returnPartialSuccess</code><span style=\"vertical-align: baseline;\"> to </span><code style=\"vertical-align: baseline;\">false</code><span style=\"vertical-align: baseline;\">. This means a transient issue in a single zone could cause a global list request to fail unless callers explicitly opted in. In new date-based versions, partial success is enabled by default so global fleet queries remain resilient during localized maintenance or disruptions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Actionable, machine-readable errors (AIP-193)</strong><span style=\"vertical-align: baseline;\">: Date-based versions adopt standardized </span><a href=\"https://google.aip.dev/193\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">google.rpc.ErrorInfo</code></a><span style=\"vertical-align: baseline;\"> payloads with structured </span><code style=\"vertical-align: baseline;\">reason</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">domain</code><span style=\"vertical-align: baseline;\">, and contextual </span><code style=\"vertical-align: baseline;\">metadata</code><span style=\"vertical-align: baseline;\"> (such as returning the list of </span><code style=\"vertical-align: baseline;\">supported_versions</code><span style=\"vertical-align: baseline;\"> if an invalid version identifier is requested), eliminating brittle regex parsing of error strings.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stronger security and least-privilege hygiene</strong><span style=\"vertical-align: baseline;\">: New API versions allow Compute Engine to tighten overly broad legacy IAM permission checks and introduce safer configuration defaults without disrupting legacy automation running on </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cleaner, declarative-friendly API design</strong><span style=\"vertical-align: baseline;\">: Multi-versioning provides a clean path to evolve complex, decade-old resource schemas toward modern Google API Improvement Proposals (AIPs).</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">3. Seamless adoption across client libraries, </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\">, and Terraform</span></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you call the REST API directly or manage infrastructure through higher-level tools, Compute Engine API Multi-Versioning is designed to work without friction:</span></p>\n<div align=\"center\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Surface</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">How multi-versioning works</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Your responsibility</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Client libraries (Python, Go, Java, Node.js, C#, Ruby, PHP)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Each SDK release automatically binds to a specific date-based API version while </span><strong style=\"vertical-align: baseline;\">preserving the </strong><code><strong style=\"vertical-align: baseline;\">/v1</strong></code><strong style=\"vertical-align: baseline;\"> package namespace</strong><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">compute_v1</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">apiv1</code><span style=\"vertical-align: baseline;\">). Enums are represented as strings for seamless forward and backward compatibility.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Upgrade your client library dependency as usual–</span><strong style=\"vertical-align: baseline;\">no import path rewrites required</strong><span style=\"vertical-align: baseline;\">. Use </span><code style=\"vertical-align: baseline;\">-preview</code><span style=\"vertical-align: baseline;\"> SDK releases to test preview features.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud CLI (</strong><strong style=\"vertical-align: baseline;\">gcloud</strong><strong style=\"vertical-align: baseline;\">)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">gcloud compute</code><span style=\"vertical-align: baseline;\"> targets the bundled stable API version. The new </span><strong style=\"vertical-align: baseline;\">gcloud preview compute</strong><span style=\"vertical-align: baseline;\"> command group targets the bundled preview API version.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Keep </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> updated. Existing </span><code style=\"vertical-align: baseline;\">gcloud compute</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">beta</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">alpha</code><span style=\"vertical-align: baseline;\"> scripts continue to work as-is.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Terraform (</strong><code><strong style=\"vertical-align: baseline;\">google</strong></code><strong style=\"vertical-align: baseline;\"> &amp; </strong><code><strong style=\"vertical-align: baseline;\">google-beta</strong></code><strong style=\"vertical-align: baseline;\">)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">The </span><code style=\"vertical-align: baseline;\">google</code><span style=\"vertical-align: baseline;\"> provider targets stable date-based APIs, while </span><code style=\"vertical-align: baseline;\">google-beta</code><span style=\"vertical-align: baseline;\"> targets preview APIs under the hood.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Upgrade your Terraform provider version to adopt new features; no manual API version configuration needed in HCL scripts.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Direct HTTP / REST</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Select any active version via </span><code style=\"vertical-align: baseline;\">-H \"X-Goog-Api-Version: YYYY-MM-DD\"</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">?$apiVersion=YYYY-MM-DD</code><span style=\"vertical-align: baseline;\">, and fetch version-specific </span><a href=\"https://www.googleapis.com/discovery/v1/apis/compute/2026-09-01/rest\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Discovery Documents</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Pass the header or query parameter in your HTTP client to opt into a specific version (e.g., </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h2><span style=\"vertical-align: baseline;\">Get started</span></h2>\n<p><span style=\"vertical-align: baseline;\">Compute Engine API multi-versioning is available today across all Google Cloud regions, with </span><code><strong style=\"vertical-align: baseline;\">2026-09-01</strong></code><span style=\"vertical-align: baseline;\"> as the initial stable version and </span><code><strong style=\"vertical-align: baseline;\">2026-10-01-preview</strong></code><span style=\"vertical-align: baseline;\"> available for preview testing.</span></p>\n<p><span style=\"vertical-align: baseline;\">Start exploring and adopting date-based versions in your workflows:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the documentation</strong><span style=\"vertical-align: baseline;\">:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/api/how-tos/api-versioning-guide\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine API Versioning Guide</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/api/how-tos/api-requests-responses\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Creating API Requests and Handling Responses</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/reference/rest/v1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine REST API Reference</span></a><span style=\"vertical-align: baseline;\"> (use the version selector to inspect </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\"> schemas)</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Try </strong><code><strong style=\"vertical-align: baseline;\">gcloud preview compute</strong></code><span style=\"vertical-align: baseline;\">: Run </span><code style=\"vertical-align: baseline;\">gcloud components update</code><span style=\"vertical-align: baseline;\"> and test upcoming preview capabilities using the new </span><code style=\"vertical-align: baseline;\">gcloud preview compute</code><span style=\"vertical-align: baseline;\"> surface.</span></p>\n</li>\n</ol></div>"
