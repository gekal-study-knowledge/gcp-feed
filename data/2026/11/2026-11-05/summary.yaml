"overview": |
  この日は 3 ソースから 9 本。リリースノートでは、Apigee Edge for Public Cloud の本番環境の管理/コントロールプレーンで、2026 年 11 月 6 日 (金) 午後 9 時〜10 時 PT (11 月 7 日 5:00〜6:00 UTC) に定期メンテナンスが行われ、その間は Management Services の UI・API、Monetization Management API、新しいプロキシのデプロイ、DevPortal、Microgateway、Edge Query (Analytics Stats API) が使えず 4xx を返すが、デプロイ済みプロキシへのランタイム API 呼び出しには影響しないと告知された。Security Command Center の Data Security Posture Management (DSPM) は新規組織では利用できなくなり、有効化済みの組織も 2027 年 2 月 1 日に提供終了となる。Gemini Omni 1.2 Flash (gemini-omni-1.2-flash) が Gemini Enterprise Agent Platform で GA となり、単体のアップスケール (360p→720p/1080p、720p→1080p/4K)、最大 15 秒の動画生成・編集、参照画像 2 枚を使った編集・延長、シードによる再現可能な生成、Standard PayGo と Provisioned Throughput (GSU あたり毎秒 685 トークン) に対応した。BigQuery の会話型分析は asia-northeast1 (東京) で使えるようになり、Model Armor では CSAM フィルタの有効/無効と信頼度レベルを設定できるようになった。Google Cloud Blog では、Compute Engine API のマルチバージョニングが一般提供となり、日付ベースの API バージョンで /v1 API の安定性と後方互換性を保ったまま、新しいセマンティクスや既定値を選んで採用できるようになった。Google Cloud Security Summit に合わせて、自律型コードセキュリティエージェント CodeMender のサンドボックス内検証と人間の確認、Auth Manager の GA、Agent Identity の JWT 対応プレビュー、VPC Service Controls の IAM ロール対応 GA、Model Armor のカスタムトピック検出器プレビュー、Cloud NGFW の高度なマルウェアサンドボックス (Palo Alto Networks WildFire) GA、Wiz との連携強化などが発表された。エージェント基盤では、Agent Substrate・gVisor・OpenRL の 3 プロジェクトを CNCF に寄贈し、Agent Substrate が 1.0 に達して Agent Substrate on GKE として GA となった。待機中のエージェントをストレージにスナップショットして 500 ミリ秒未満で復元し、標準的なコンテナランタイムの 10 倍の密度で数百万のサンドボックスを動かせるという。ワシントン D.C. で開かれ 2,700 名超が参加した Google Public Sector Summit の振り返りも出た。Google Cloud Japan Blog は 4 本で、Mandiant と GTIG による LLMJacking (企業の LLM アクセスを乗っ取り、1 日 10 万米ドル超、累計 100 万米ドルに達する不正請求の例も) の攻撃ライフサイクルと検知・対策、KDDI の RAG アプリ Buffmee でレスポンスレイテンシを 38% 削減し TTFT を約 18% 改善した事例、Knowledge Catalog における LookML セマンティックインデックス作成の一般提供、各エージェントにハードウェア分離の microVM を割り当てる Agent Compute Engine の開発の裏側を紹介した。
