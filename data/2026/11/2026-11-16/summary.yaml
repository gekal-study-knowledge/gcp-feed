"overview": |
  この日はリリースノート 1 件と Google Cloud 日本語ブログ 2 本の計 3 本でした。リリースノートでは、Google Cloud Armor がグローバルスコープのエッジセキュリティポリシーで、Cloud CDN のエッジキャッシュサービス向けに自律システム番号 (ASN)、ネットワーク脅威インテリジェンス (NTI)、HTTP フィルタリングをサポートし、プレビューとして提供されました。ブログでは、Pod の IP アドレスが絶えず変わる Kubernetes 環境で、VPC フローログがサンプリング時点の GKE メタデータ (クラスタ、Pod とワークロード、名前空間、サービス、ノードとゾーン) を各レコードに付加することで、追加のエージェントやサイドカーなしに L3 / L4 トラフィックをワークロード単位で把握し、Pod が消えた後もトラブルシューティングできる仕組みが解説されています。もう 1 本は、Google Cloud が Hypothesis Group と米国のエンタープライズ企業の IT およびビジネスの意思決定者 1,250 名を対象に行った調査の紹介で、回答者の 49% がオンプレミスソフトウェアへの依存を直接の原因として AI などの取り組みの遅延、縮小、停止、中止を経験しており、レガシーシステムのパッチ適用と保守が AI モダナイゼーションとのゼロサムゲームを生んでいると報告されました。
