"overview": |
  この日はリリースノート 1 件、Google Cloud ブログ 4 本、日本語ブログ 2 本の計 7 本で、デジタル主権と脅威インテリジェンスの記事が加わりました。リリースノートでは、Google Cloud Armor がグローバルスコープのエッジセキュリティポリシーで、Cloud CDN のエッジキャッシュサービス向けに自律システム番号 (ASN)、ネットワーク脅威インテリジェンス (NTI)、HTTP フィルタリングをサポートし、プレビューとして提供されました。Google Threat Intelligence Group (GTIG) と Mandiant の AI Threat Tracker は、攻撃者が単なるプロンプト利用から ARTEX、CAIRN、CyberStrikeAI、PentAGI といった自律型マルチエージェントの攻撃フレームワークの運用へ移り、LLM とエージェントでパッチの差分解析を自動化して n-day 脆弱性を素早く武器化していることや、LLMJacking などの収益化手法が広がっていることを報告しています。デジタル主権では、Google Cloud Data Boundary の新しい体験が発表され、データの所在・アクセス・暗号化にまたがる技術的な制御と継続的な監視を、商用インフラ上でソフトウェア定義かつ AI 支援のガバナンスとして提供します。また Google Cloud Dedicated 上で検証済みの ISV エコシステムが拡大しており、フランスの S3NS (Thales が過半数を所有・運営する合弁会社) や、同じく Thales が所有・運営するドイツの新会社 (プレビュー) を通じて、SecNumCloud や BSI C3A といった基準に沿った環境で企業向けソフトウェアを動かせることが紹介されました。Google は 2026 年の Gartner Magic Quadrant for Cloud Operational Database Management Systems でリーダーに選ばれ、ビジョンの完全性で最も高く評価されています。日本語ブログでは、Pod の IP アドレスが絶えず変わる Kubernetes 環境で、VPC フローログがサンプリング時点の GKE メタデータ (クラスタ、Pod とワークロード、名前空間、サービス、ノードとゾーン) を各レコードに付加し、追加のエージェントやサイドカーなしに L3 / L4 トラフィックをワークロード単位で把握できる仕組みと、Google Cloud が Hypothesis Group と米国のエンタープライズ企業の意思決定者 1,250 名に行った調査で、49% がオンプレミスソフトウェアへの依存を直接の原因として AI などの取り組みの遅延、縮小、停止、中止を経験していたことが紹介されました。
