  "a8433996a47127c56aa3dadba6909afe":
    "id": "a8433996a47127c56aa3dadba6909afe"
    "title": "最新の調査により、企業がレガシー ソフトウェアと AI モダナイゼーションの狭間で立ち往生していることが明らかに"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/new-survey-finds-enterprises-trapped-between-legacy-software-and-ai-modernization/"
    "published": "2026-11-16 10:00:00"
    "fetched": "2026-11-16 22:21:45"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 11 月 10 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/ai-machine-learning/new-survey-finds-enterprises-trapped-between-legacy-software-and-ai-modernization?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>政府機関および現在の Google Cloud において、サイバーセキュリティとインフラストラクチャ保護に携わってきたキャリアを通じ、私は新旧のテクノロジー間で生じる摩擦が、進歩の大きな障壁となる場面を幾度となく目にしてきました。新しいソフトウェアやサービスは、単体では極めて優秀に機能しても、複雑に相互接続された IT 環境に組み込まれた途端、従来の運用の惰性に埋もれてしまうことがあります。</p><p>昨今、企業向けテクノロジーは歴史的な変革を遂げています。世界中の組織が、AI や LLM の統合を超えて、AI を活用した自律的なエージェント ワークフローの運用へと舵を切っています。Fortune 100 企業の約 90% が、すでに Gemini Enterprise を使用してエージェントの構築、スケーリング、管理を行っています。しかし、AI システムが計画を立て、複数ステップのプロセスを実行し、人間のチームと協働するようになるにつれ、リーダーたちは最先端技術とレガシー テクノロジーとの間で、同じようなジレンマに直面しています。</p><p>既存のテクノロジー環境が、組織の AI 運用能力にどのような影響を与えるかを把握するため、Google Cloud は Hypothesis Group と提携し、全米のエンタープライズ企業における IT およびビジネスの意思決定者 1,250 名を対象とした調査を実施しました。<a href=\"https://services.google.com/fh/files/misc/the_innovation_paradox2026.pdf\" target=\"_blank\">調査結果</a>から、重大なパラドックスが明らかになりました。企業が従業員にテクノロジーを提供する基盤として頼っているレガシー ソフトウェア システムが、同時にイノベーションの足かせとなり、リーダーが推進しようとしている AI 変革を直接的に阻害しているのです。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--small\n      \n      \n        h-c-grid__col\n        \n        \n        h-c-grid__col--2 h-c-grid__col--offset-5\n      \">\n\n      \n      \n        \n        <img alt=\"image 1_legacy software blog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image_1_legacy_software_blog_8uCnV8N.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-medium\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image2_legacysoftwareblog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_legacysoftwareblog.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><b>レガシー IT の運用上の負担</b></p><p>この調査において「レガシー」テクノロジーとは、クラウド上でネイティブに稼働するのではなく、パソコンやサーバー上でローカルに実行されるソフトウェアと定義しています。さまざまな業界の意思決定者が、このフットプリントの維持が、自社の目指す AI 活用の絶え間ない阻害要因になっていると報告しています。</p><p>これが AI の推進に及ぼす影響は、理論上の話にとどまりません。回答者の半数近く（49%）が、オンプレミス ソフトウェアへの依存が直接の原因となり、AI やその他のテクノロジー イニシアチブの遅延、規模縮小、一時停止、中止を余儀なくされたと回答しています。</p><p>さらに詳しく調べると、定期的なパッチ適用とメンテナンスが、運用上の主なボトルネックとなっていることがわかりました。AI を活用した脆弱性の検知が加速するにつれ、レガシー コードベースで欠陥が表面化するスピードは、人間のセキュリティ チームが現実的に対処できる速度を上回っています。</p><p>その結果、レガシー システムの日常的なメンテナンスと AI モダナイゼーションとの間で、ゼロサムゲームが生じています。IT チームは、エンジニアのリソースを AI のモダナイゼーションに投入するどころか、レガシー システムの維持管理に時間と労力を費やす事態に追い込まれています。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">企業のモノカルチャー</strong></h4>\n<p><span style=\"vertical-align: baseline;\">なぜ組織は、モダナイゼーションを制約するレガシー環境に依存し続けているのでしょうか。今回の調査が明らかにしたように、その理由はアーキテクチャの好みにあるのではなく、ベンダー ロックインの結果にほかなりません。</span></p>\n<p><span style=\"vertical-align: baseline;\">プロバイダへの依存度が高いと、テクノロジーの選択肢が狭まるだけでなく、商業的な制約も生じます。この調査において、意思決定者の 39% が、レガシー ソフトウェアやクラウド プロバイダへの依存によって、複雑なライセンス ルールや契約への対処を余儀なくされたり、交渉における柔軟性が損なわれたりしていると回答しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに懸念されるのは、単一ベンダーへの集中によって生じるシステム運用リスクです。オペレーティング システム、生産性向上アプリ、クラウド ホスティング、そして最新の AI モデルに至るまでを単一ベンダーのモノカルチャーに集中させることは、極めて重大な単一障害点を自ら作り出すことを意味します。自律型 AI エージェントのセキュリティは、それが動作するオペレーティング システムとネットワークのセキュリティに依存します。基盤となるスタックが脆弱であれば、組織は強靭なインテリジェンスをデプロイしているのではなく、自ら攻撃対象領域を広げているに過ぎません。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"The_Innovation_Paradox_10\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/The_Innovation_Paradox_10.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>お客様の選択</b></p><p>ベンダー ロックインの解決策は明快です。企業の調達担当者や政策立案者は、組織がソフトウェア、クラウド、AI の各アーキテクチャにおいて、真の選択肢と相互運用性を確実に享受できるようにする必要があります。</p><p>さらに、リーダーの 80% が「組織が使用する AI テクノロジーは、プロバイダのインストール ベースによって縛られるべきではない」と回答しており、78% は「これまでのエンタープライズ IT 時代を主導してきたプロバイダが、必ずしも AI 時代をリードするのに適しているとは限らない」と考えています。組織は、レガシーなデスクトップ ソフトウェアに紐付いたデフォルトのセットを受け入れるのではなく、製品そのものの価値に基づいて、最も優れたインテリジェンスを自由に選択することを望んでいます。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image4_legacysoftwareblog\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image4_legacysoftwareblog.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>エージェント テクノロジーの加速</b></p><p>このレベルの自律的なアジリティを企業全体で実現するには、エージェントの時代を支えるために設計された最新のテクノロジーが不可欠です。以下に、そのためのアイデアをいくつかご紹介します。</p><ul><li><b>アーキテクチャとプロバイダの選択肢を求める:</b> AI やクラウドが、ローカル サーバー、メール、デスクトップ オペレーティング システム上で稼働するレガシー ソフトウェアに縛られてはなりません。組織には、製品そのもののメリットに基づいて最適な IT を自由に選択できるよう、契約上およびアーキテクチャ上の選択の自由が必要です。</li><li><b>安全性を重視した設計の基盤を徹底する:</b> 業界は、脆弱なソフトウェアをリリースしてから後追いでパッチを適用するという悪循環を断ち切る必要があります。ソフトウェア メーカーは、コードをリリースする前に脆弱性クラス全体を排除する、堅牢でレジリエントなアーキテクチャを構築する必要があります。これにより、人員不足に悩む IT チームを、日常的だが不可欠なパッチを延々と適用し続ける作業から解放できます。</li><li><b>AI を活用した防御を導入してレガシー デットを解消する:</b> すでに本番環境で稼働している数百万行もの脆弱なレガシー ソフトウェアに対し、組織は手動によるトリアージから、AI を活用したプロアクティブな防御に移行する必要があります。Security Command Center や Mandiant の脅威分析プラットフォームをデプロイすることで、チームはインテリジェンスを活用して、現在進行形の悪用パスを継続的に特定し、重大なリスクの優先順位付けを行って、複雑なハイブリッド環境全体での修復を自動化できます。</li></ul><p>エージェント型 AI がもたらす真価とは、業務の摩擦を自動化によって取り除き、人間の創意工夫を加速させることにあります。しかし、そのような未来は、数十年前のソフトウェアを基盤として構築することはできません。IT リーダーがロードマップを計画するにあたり、今こそ問うべきことがあります。それは、「自社のテクノロジー基盤は未来を加速させているのか、それとも過去を維持するためだけにメンテナンス費用を支払い続けているのか」ということです。</p><p>調査の詳細については、<a href=\"https://services.google.com/fh/files/misc/the_innovation_paradox2026.pdf\" target=\"_blank\">こちら</a>をご覧ください。</p><p><b><i>-</i></b> <i>Google Cloud、リスクおよびコンプライアンス担当バイス プレジデント、</i><b><i>Jeanette Manfra</i></b></p></div>"
  "04bbedf346177694302bfea093bf5c43":
    "id": "04bbedf346177694302bfea093bf5c43"
    "title": "VPC フローログを使用して GKE ワークロードを迅速にトラブルシューティングする方法"
    "link": "https://cloud.google.com/blog/ja/products/containers-kubernetes/using-vpc-flow-logs-to-troubleshoot-gke-workloads/"
    "published": "2026-11-16 09:00:00"
    "fetched": "2026-11-16 22:21:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 29 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/containers-kubernetes/using-vpc-flow-logs-to-troubleshoot-gke-workloads?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Kubernetes 環境を効果的に運用するうえで、ネットワーク トラフィックを可視化することは不可欠です。サービスの速度が低下したり、接続が失われたりした場合、誰が誰と通信しているのかを把握することで、問題を迅速に絞り込むことができます。標準的なクラウド ネットワークでは、フローログが IP アドレス、ポート、プロトコル間の接続を記録することで、その可視性を実現します。しかし、Kubernetes では Pod は一時的なものです。Pod の IP アドレスは、Pod のスケーリング、クラッシュ、ノード間の移動に伴って絶えず変化します。そのため、10.4.2.18 が 10.4.8.44 と通信していることを示す未加工のログエントリからは、そのアドレスを所有していたワークロード（および Pod）、そのアドレスが存在していた名前空間、そのアドレスがアクセスしようとしていたアプリケーションについて、ほとんど何もわかりません。クラスタを検索する頃には、その Pod はすでに存在しない可能性すらあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud 環境では、ネットワーク層で</span><a href=\"https://docs.cloud.google.com/vpc/docs/using-flow-logs\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC フローログ</span></a><span style=\"vertical-align: baseline;\">がこの不足を補います。Google Cloud の仮想ネットワークは、Pod が行うすべての接続をすでに認識しているため、サンプリングされた各フローは、IP アドレスの背後にある</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/kubernetes-engine-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\">（GKE）メタデータ（Pod、ワークロード、名前空間、サービス）とともに記録されます。追加のエージェントやサイドカーをデプロイすることなく、L3 / L4 トラフィックのワークロード レベルのアトリビューションを取得できます。また、より詳細な情報が必要な場合は、すでに実行している可能性のあるクラスタ内のコンテナ ネットワーク インターフェース（CNI）とデータプレーンのオブザーバビリティ ツールを補完します。VPC フローログと GKE の連携の仕組み、およびその利用方法を詳しく見ていきましょう。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">GKE メタデータが VPC フローログを補強する仕組み</strong></h4>\n<p><span style=\"vertical-align: baseline;\">VPC フローログは、Google Cloud の仮想ネットワーク内で直接トラフィックをサンプリングします。GKE クラスタをホストするサブネットでフローログを有効にすると、VPC ネットワークを通過する Pod トラフィックのすべてのレコードに、サンプリング時に IP アドレスを所有していた Kubernetes コンテキストがアノテーションとして付加されます。これにより、Pod がなくなった後もコンテキストが保持されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">クラスタ: </strong><span style=\"vertical-align: baseline;\">クラスタの名前とロケーション。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワークロード: </strong><span style=\"vertical-align: baseline;\">Pod の名前と名前空間、および Pod を所有するコントローラ（Deployment、StatefulSet、DaemonSet など）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サービス名: </strong><span style=\"vertical-align: baseline;\">トラフィックを受信した Kubernetes サービス。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ノードとゾーン:</strong><span style=\"vertical-align: baseline;\"> 標準の VPC フィールド。フローの両端にあるノード VM とそのゾーンが含まれます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">GKE ワークロードを</span><a href=\"https://docs.cloud.google.com/app-hub/docs/overview?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">App Hub</span></a><span style=\"vertical-align: baseline;\"> に登録した場合、各レコードには、各エンドポイントのビジネス アプリケーション、環境、重要度を識別するアプリケーションレベルのラベル（</span><code style=\"vertical-align: baseline;\">apphubSource</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">apphubDestination</code><span style=\"vertical-align: baseline;\">）も含まれます。これは、GKE マイクロサービスが、クラスタ外の App Hub 登録リソース（Cloud Run サービスなど）と通信する場合に特に便利です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">始める前に</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">ログバケットを</strong><a href=\"https://cloud.google.com/network-intelligence-center/docs/flow-analyzer/enable-log-analytics\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">オブザーバビリティ分析</strong></a><strong style=\"vertical-align: baseline;\">（旧称、ログ分析）にアップグレードする: </strong><span style=\"vertical-align: baseline;\">Flow Analyzer は、アップグレードされたバケット（通常は </span><code style=\"vertical-align: baseline;\">_Default</code><span style=\"vertical-align: baseline;\">）からのみ読み取ります。</span><strong style=\"vertical-align: baseline;\">注:</strong><span style=\"vertical-align: baseline;\"> このアップグレードは永続的です。</span></p>\n<p><code style=\"vertical-align: baseline;\">gcloud logging buckets update _Default \\</code><code style=\"vertical-align: baseline;\">    --location=global \\</code><code style=\"vertical-align: baseline;\">    --enable-analytics</code></p>\n<p><strong style=\"vertical-align: baseline;\">組織全体で VPC フローログを有効にする:</strong><span style=\"vertical-align: baseline;\"> 組織レベルの構成 1 つで、将来のクラスタを含むすべての VPC ネットワークのすべてのサブネットをカバーします（ネットワーク管理者ロールが必要です）。</span><code style=\"vertical-align: baseline;\">include-all-metadata</code><span style=\"vertical-align: baseline;\"> をオンにして、すべてのレコードに名前空間と Pod の詳細が含まれるようにします。可視性と費用のバランスを取るために、セカンダリ サンプリング レート（</span><code style=\"vertical-align: baseline;\">--flow-sampling</code><span style=\"vertical-align: baseline;\">）、集計間隔（</span><code style=\"vertical-align: baseline;\">--aggregation-interval</code><span style=\"vertical-align: baseline;\">）、またはフィルタ式（</span><code style=\"vertical-align: baseline;\">--filter-expr</code><span style=\"vertical-align: baseline;\">）を追加して、関心のあるトラフィックのみを表示できます。</span><code style=\"vertical-align: baseline;\">gcloud network-management vpc-flow-logs-configs create CONFIG_NAME \\</code><code style=\"vertical-align: baseline;\">    --location=global \\</code><code style=\"vertical-align: baseline;\">    --organization=ORGANIZATION_ID \\</code><code style=\"vertical-align: baseline;\">    --metadata=include-all-metadata</code></p>\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/intranode-visibility\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ノード内の可視化</strong></a><strong style=\"vertical-align: baseline;\">を有効にする:</strong><span style=\"vertical-align: baseline;\"> Autopilot クラスタではすでに有効になっていますが、Standard クラスタでは有効にする必要があります。</span><strong style=\"vertical-align: baseline;\">注: </strong><span style=\"vertical-align: baseline;\">これを有効にすると、コントロール プレーンとノード コンポーネントが再起動され、ノードごとのオーバーヘッドが追加されるため、まず本番環境以外のクラスタでテストしてください。</span><code style=\"vertical-align: baseline;\">gcloud container clusters update CLUSTER_NAME \\</code><code style=\"vertical-align: baseline;\">    --location=LOCATION \\</code><code style=\"vertical-align: baseline;\">    --enable-intra-node-visibility</code></p>\n<p><span style=\"vertical-align: baseline;\">これで準備は完了です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Flow Analyzer でトラフィックを視覚的に分析</strong></h4>\n<p><span style=\"vertical-align: baseline;\">VPC フローログはすべてのレコードを Cloud Logging に書き込みます。ログ エクスプローラまたはログ分析で検索やクエリを実行できます。日常業務では、Network Intelligence Center の一部である</span><a href=\"https://docs.cloud.google.com/network-intelligence-center/docs/flow-analyzer/overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Flow Analyzer</span></a><span style=\"vertical-align: baseline;\"> が同じレコードをインタラクティブなグラフとテーブルに変換するため、数回のクリックでクラスタ、名前空間、ワークロード、Pod、サービスごとにトラフィックをグループ化してフィルタできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">以下のチュートリアルでは、us-central1 の GKE Autopilot クラスタで、オープンソースのマイクロサービス デモである</span><a href=\"https://github.com/GoogleCloudPlatform/microservices-demo\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Online Boutique</span></a><span style=\"vertical-align: baseline;\"> を使用します。</span><code style=\"vertical-align: baseline;\">loadgenerator</code><span style=\"vertical-align: baseline;\"> Deployment は、擬似的な買い物客トラフィックを </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\"> に送信します。frontend は、</span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">cartservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">currencyservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">recommendationservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">shippingservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">adservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">checkoutservice</code><span style=\"vertical-align: baseline;\"> を呼び出します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ケース 1: IP アドレスをワークロード名に変換する</strong><span style=\"vertical-align: baseline;\">インシデントを調査する場合でも、アーキテクチャの変更を評価する場合でも、最初の質問は常に同じです。どのエンドポイントがどの程度の量で通信しているか、というものです。</span></h4>\n<p><span style=\"vertical-align: baseline;\">GKE メタデータを使用すると、Flow Analyzer はエフェメラル IP アドレスのペアを提示するのではなく、Kubernetes ワークロード名を使用してこの質問に直接回答できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Flow Analyzer での手順:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Network Intelligence Center</strong><span style=\"vertical-align: baseline;\"> &gt; [</span><strong style=\"vertical-align: baseline;\">Flow Analyzer</strong><span style=\"vertical-align: baseline;\">] を開き、期間を [</span><strong style=\"vertical-align: baseline;\">直近 1 時間</strong><span style=\"vertical-align: baseline;\">] に設定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">送信元</strong><span style=\"vertical-align: baseline;\">] と [</span><strong style=\"vertical-align: baseline;\">宛先</strong><span style=\"vertical-align: baseline;\">] で、[</span><strong style=\"vertical-align: baseline;\">フローの整理の基準</strong><span style=\"vertical-align: baseline;\">] を [</span><strong style=\"vertical-align: baseline;\">GKE ワークロード</strong><span style=\"vertical-align: baseline;\">] に設定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">フィルタバーで、[</span><strong style=\"vertical-align: baseline;\">GKE ワークロードが既知</strong><span style=\"vertical-align: baseline;\">] フィルタを追加して、Pod 間のトラフィックのみが表示されるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">新しいクエリを実行</strong><span style=\"vertical-align: baseline;\">] をクリックします。</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_HzpvhDD.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Flow Analyzer で送信元 GKE ワークロードと宛先 GKE ワークロードごとにトラフィックをグループ化し、未加工の IP ルックアップなしでマイクロサービスの依存関係をマッピングする。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">主な分析情報: </strong><span style=\"vertical-align: baseline;\">通信量で並べ替えられたこのテーブルは、すぐに使えるアプリケーション依存関係マップです。</span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\"> は </span><code style=\"vertical-align: baseline;\">loadgenerator</code><span style=\"vertical-align: baseline;\">（ユーザー トラフィックを表す）からの受信リクエストを処理し、</span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\"> は </span><code style=\"vertical-align: baseline;\">recommendationservice</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\"> の両方からの呼び出しに応答します。各行には、未加工の IP アドレスではなくワークロード名が表示されるため、不正なワークロード間通信や予期しないワークロード間通信がすぐに明らかになります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ケース 2: 単一のサービスをドリルダウンする</strong><span style=\"vertical-align: baseline;\">サービスの速度が低下している場合や、サービスが変更されようとしている場合、そのサービスに依存しているユーザーとその依存度を把握する必要があります。</span></h4>\n<p><span style=\"vertical-align: baseline;\">Flow Analyzer での手順:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">トラフィックの集計</strong><span style=\"vertical-align: baseline;\">] を [</span><strong style=\"vertical-align: baseline;\">クライアント</strong><span style=\"vertical-align: baseline;\"> ↔</span><strong style=\"vertical-align: baseline;\"> サーバー（双方向）</strong><span style=\"vertical-align: baseline;\">] に変更して、ペア間のリクエストとレスポンスがまとめてカウントされるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">サーバー</strong><span style=\"vertical-align: baseline;\">] で、フィルタ [</span><strong style=\"vertical-align: baseline;\">GKE ワークロード</strong><span style=\"vertical-align: baseline;\"> = </span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\">] を追加します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\"> 新しいクエリを実行</strong><span style=\"vertical-align: baseline;\">] をクリックし、一番上の行の [</span><strong style=\"vertical-align: baseline;\">詳細</strong><span style=\"vertical-align: baseline;\">] をクリックします。</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2_H9re5kG.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>サーバー GKE ワークロード（productcatalogservice）をクライアント ↔ サーバー（双方向）集計でフィルタして、呼び出し元のシェアと詳細タイムラインを表示する。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">主な分析情報:</strong><span style=\"vertical-align: baseline;\"> カタログ サービスのすべての呼び出し元、各呼び出し元のトラフィックのシェア、各ペアのタイムラインを取得できるため、1 つの呼び出し元のラインが上昇し、他の呼び出し元が横ばいの場合、最初にどこを調べるべきかがわかります。量ではなくレイテンシが問題である場合は、表示モードをレイテンシに切り替えて、同じ呼び出し元をラウンドトリップ時間でランク付けします。</span></p>\n<p><strong style=\"vertical-align: baseline;\">ケース 3: ゾーンをまたいで通信する Pod を見つける</strong><span style=\"vertical-align: baseline;\">リージョン GKE クラスタでは、異なるゾーンに配置された通信の頻繁なサービスが、ゾーンの境界を越えてすべてのリクエストを送信するため、ゾーン間のデータ転送料金が加算されます。VPC フローログには、すべてのフローの両端のゾーンが記録されるため、そのトラフィックを発生させている Pod のペアを簡単に特定できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Flow Analyzer での手順:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">基本フィルタ</strong><span style=\"vertical-align: baseline;\">] から [</span><strong style=\"vertical-align: baseline;\">SQL フィルタ</strong><span style=\"vertical-align: baseline;\">] に切り替えると、同じフローの 2 つのフィールドを比較できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">条件</strong><span style=\"vertical-align: baseline;\">] ボックスに「</span><code style=\"vertical-align: baseline;\">src_gcp_zone &lt;&gt; dest_gcp_zone</code><span style=\"vertical-align: baseline;\">」と入力します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">フローの整理の基準</strong><span style=\"vertical-align: baseline;\">] を </span><strong style=\"vertical-align: baseline;\">送信元 GCP ゾーン、送信元 GKE Pod、宛先 GCP ゾーン</strong><span style=\"vertical-align: baseline;\">、</span><strong style=\"vertical-align: baseline;\">宛先 GKE Pod</strong><span style=\"vertical-align: baseline;\"> に設定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">[</span><strong style=\"vertical-align: baseline;\">新しいクエリを実行</strong><span style=\"vertical-align: baseline;\">] をクリックします。</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_3n9hbpu.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>src_gcp_zone &lt;&gt; dest_gcp_zone を使用した SQL フィルタと複数属性のグループ化により、ゾーン間のネットワーク トラフィックを発生させている Pod ペアを特定する。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">主な分析情報:</strong><span style=\"vertical-align: baseline;\"> このテーブルには、ゾーン間のトラフィックが通信量順に表示され、各エンドの正確な Pod とゾーンが特定されます。このクラスタでは、上位のフローは us-central1-b の </span><code style=\"vertical-align: baseline;\">frontend</code><span style=\"vertical-align: baseline;\"> Pod と us-central1-c の </span><code style=\"vertical-align: baseline;\">currencyservice</code><span style=\"vertical-align: baseline;\"> Pod の間で発生し、その後に </span><code style=\"vertical-align: baseline;\">checkoutservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">shippingservice</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">productcatalogservice</code><span style=\"vertical-align: baseline;\"> のペアが続きます。さらに調査するには、[ログ分析で探索] をクリックして、基盤となる SQL クエリを開き、結合や時間バケットの追加などのカスタマイズを行います。</span></p>\n<p><span style=\"vertical-align: baseline;\">GKE には、この問題に対する解決策が組み込まれています。Service で </span><code style=\"vertical-align: baseline;\">trafficDistribution: PreferSameZone</code><span style=\"vertical-align: baseline;\">（古いバージョンでは </span><code style=\"vertical-align: baseline;\">PreferClose</code><span style=\"vertical-align: baseline;\">）を設定すると、呼び出し元のゾーンにある正常なエンドポイントが優先されます。各ゾーンに、そのゾーンのトラフィックを処理するのに十分なレプリカがあることを確認してください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">留意事項</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pod からインターネットへのトラフィック:</strong><span style=\"vertical-align: baseline;\"> VPC フローログには Pod アノテーションが含まれません。これは、フローがサンプリングされる前に、マスカレード エージェントが Pod IP をノード IP に置き換えるためです。内部の宛先をマスカレード以外のリストに保持すると、それらのフローの Pod 名が保持されます。ノード内の可視化で </span><code style=\"vertical-align: baseline;\">ip-masq-agent</code><span style=\"vertical-align: baseline;\"> を実行する場合、接続の問題を回避するために、そのリストにクラスタのノードと Pod の IP 範囲も含める必要があります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ブロックされたトラフィック:</strong><span style=\"vertical-align: baseline;\"> ネットワーク ポリシーによってブロックされたトラフィックは VPC ネットワークに到達しないため、</span><a href=\"https://cloud.google.com/kubernetes-engine/docs/how-to/network-policy-logging\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NetworkPolicy ロギング</span></a><span style=\"vertical-align: baseline;\">を使用して調査します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">サンプリング:</strong><span style=\"vertical-align: baseline;\"> フローログはサンプリングされるため、</span><a href=\"https://services.google.com/fh/files/misc/vpc_flow_logs_understanding_byte_and_packet_counts.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">バイト数とパケット数</span></a><span style=\"vertical-align: baseline;\">は、接続ごとのアカウンティングではなく、ランキングや傾向の把握に適しています。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">次のステップ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">クラスタで VPC フローログがすでに有効になっている場合は、</span><code style=\"vertical-align: baseline;\">_Default</code><span style=\"vertical-align: baseline;\"> バケットをアップグレードして Flow Analyzer を開くだけで、上記の 3 つのチュートリアルを再現できます。詳細については、次のドキュメントをご覧ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/vpc/docs/using-flow-logs#gke\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC フローログを構成する</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/vpc/docs/about-flow-logs-records#gke-annotations\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC フローログのレコードについて</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/network-intelligence-center/docs/flow-analyzer/analyze-traffic-flows\"><span style=\"text-decoration: underline; vertical-align: baseline;\">トラフィック フローを分析する</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/best-practices/network-observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE ネットワークのオブザーバビリティのベスト プラクティス</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/kubernetes-engine/docs/troubleshooting/network-observability\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE ネットワークのオブザーバビリティのトラブルシューティング</span></a></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Nishant Kumar</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Whitney Jenkins</strong></p></div>"
