    "published": "2026-11-13 11:00:00"
    "fetched": "2026-11-13 19:33:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 5 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/introducing-alloydb-express-for-rapid-testing-and-prototyping?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">データベースは、AI 対応ソフトウェアの開発スピードに追いつくのに苦戦してきました。私たちが話を聞いたエンジニアリング チームやプラットフォーム チームでは、データベース プロビジョニングの遅延によりコーディング エージェントの作業が停滞し、複雑さにより CI / CD テスト パイプラインがボトルネックとなり、サンドボックスから本番環境への移行時に社内アプリが行き詰まる状況が見られています。これまで、エージェント対応機能と妥協のないエンタープライズ セキュリティおよびスケールを兼ね備えた PostgreSQL サービスは市場に存在しませんでした。</span></p>\n<p><span style=\"vertical-align: baseline;\">この問題を解決するため、Google は、デベロッパーや AI コーディング エージェント向けに特別に設計された</span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> の新サービス、</span><strong style=\"vertical-align: baseline;\">AlloyDB Express</strong><span style=\"vertical-align: baseline;\"> のプレビュー版の提供を開始したことをお知らせいたします。数秒で起動し、アイドル状態になると自動的に一時停止するため、AI を活用した迅速な開発と堅牢なエンタープライズ インフラストラクチャのギャップを埋めることができます。その結果、アプリケーション構築を加速させ、本番環境規模に簡単に拡張できる、安全性が高く費用対効果に優れたデータベース環境が実現します。無料枠から始めて、使用量に応じた料金のみお支払いください。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェント対応データベースである AlloyDB Express は、以下のような特長を備えています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">2 秒未満でデータベースを作成:</strong><span style=\"vertical-align: baseline;\"> </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> CLI、REST API、MCP、Terraform、コンソールを使用して、すぐに使える PostgreSQL データベースを 2 秒未満で作成できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ゼロへのスケーリング:</strong><span style=\"vertical-align: baseline;\"> データベースは 15 分間非アクティブな状態が続くと自動的に一時停止するため、アイドル状態の間のコンピューティング費用は発生しません。新しいクエリが到着すると、数秒で自動的に起動します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AI とセキュリティを組み込んだエンタープライズ仕様:</strong><span style=\"vertical-align: baseline;\"> ベクトル検索、テキスト検索、ハイブリッド検索などのエンタープライズ AI 機能を活用して、AI アプリケーションを迅速に構築できます。これらはすべて、組み込みのエンタープライズ セキュリティ ガードレールで保護されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">無料で開始し、使用量に応じた料金のみのお支払い:</strong><span style=\"vertical-align: baseline;\"> 毎月の無料枠から利用を開始し、利用規模の拡大に合わせて実際の使用量に応じた料金のみお支払いください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ワンクリックで本番環境規模にアップグレード:</strong><span style=\"vertical-align: baseline;\"> アプリを本番環境に移行する準備が整ったら、既存のデータベースをワンクリックで AlloyDB にアップグレードできます。これにより、データ、スキーマ、ユーザー、接続文字列をそのまま維持しながら、エンタープライズ向けの高可用性（HA）、リードレプリカ、障害復旧（DR）を実現できます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">セキュリティを犠牲にすることなく開発を加速</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Express は、セルフサービスの迅速さと組み込みのエンタープライズ セキュリティを兼ね備えています。アプリビルダーやコーディング エージェントは、手動で設定することなく完全に分離された PostgreSQL データベースを即座にプロビジョニングできるため、すべてのテストやプロトタイプを専用のデータベースで実行できるようになります。また、プラットフォーム管理者やセキュリティ管理者は、IAM、ネットワーク、組織のポリシーを一元的に一度定義するだけで、デベロッパーやコーディング エージェントが作成したすべての AlloyDB Express データベースが、自動的に会社のセキュリティ ガードレール内に収まるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">コードを記述したのがデベロッパーか AI エージェントかを問わず、以下のような組み込みの保護メカニズムによってセキュリティが確保されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">安全なデフォルト接続で公開範囲を最小限に抑える:</strong><span style=\"vertical-align: baseline;\"> IP アドレスをマスクし、明示的に許可されるまで受信トラフィックをブロックするパブリック DNS エンドポイントを使用して、データをパブリック インターネットから隠します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プライベート VPC ネットワーキングによる安全な内部統合:</strong><span style=\"vertical-align: baseline;\"> Private Service Connect（PSC）またはプライベート DNS を使用して、内部ワークロードを安全に接続します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">きめ細かなアクセス制御で最小権限を適用:</strong><span style=\"vertical-align: baseline;\"> Google Cloud IAM、VPC Service Controls、ネイティブの PostgreSQL ロールを活用して、エージェントとユーザーの権限を確実に制限します。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">AI 機能が組み込まれている AlloyDB Express</strong></h3>\n<p><span style=\"vertical-align: baseline;\">外部のベクトルストアや複雑な設定に依存するデータベースとは異なり、AlloyDB Express はエンタープライズ AI ツールをデータベースに直接組み込むため、機能の構築に集中できます。以下のようなツールを活用して、AI アプリケーション開発を迅速化できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高速ベクトル検索（pgvector HNSW および Google の ScaNN インデックス）:</strong><span style=\"vertical-align: baseline;\"> 運用データとともにベクトル エンベディングを保存、検索することで、セマンティック検索、レコメンデーション エンジン、エージェント メモリ（RAG）を実現します。データを別のベクトル データベースに同期させる必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">SQL クエリ内から Gemini モデルに直接アクセス:</strong><span style=\"vertical-align: baseline;\"> テキストや画像のエンベディングをその場で生成し、標準の </span><code style=\"vertical-align: baseline;\">SELECT</code><span style=\"vertical-align: baseline;\"> ステートメントや </span><code style=\"vertical-align: baseline;\">INSERT</code><span style=\"vertical-align: baseline;\"> ステートメント内で直接、セマンティック フィルタリング、ランキング、要約（</span><code style=\"vertical-align: baseline;\">ai.if</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">ai.rank</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\">）を実行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自然言語からの SQL 生成:</strong><span style=\"vertical-align: baseline;\"> デベロッパーや AI エージェントが平易な英語で質問すると、組み込みの AlloyDB Studio と自然言語 API を活用して、数秒でクエリを生成、実行、改良できます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">無料枠から開始し、使用量に応じた料金のみのお支払い</strong></h3>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Express は、シンプルかつ直感的な料金体系を採用しており、非アクティブ時にはゼロにスケールします。データは安全に保管され、新しいクエリが到着するとデータベースは即座に起動します。料金の概要は以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アクティブ コンピューティング:</strong><span style=\"vertical-align: baseline;\"> コンピューティング単位時間（CU 時間）あたり 0.115 ドル。秒単位で課金されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一時停止中のコンピューティング:</strong><span style=\"vertical-align: baseline;\"> 15 分以上アイドル状態の場合、1 時間あたり 0.00 ドル。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">使用ストレージ:</strong><span style=\"vertical-align: baseline;\"> 1 GB あたり月額 0.30 ドル。データが実際に使用するディスク容量分のみ課金されます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">さらに、Google Cloud には無料枠が用意されており、毎月 50 CU を無料で利用できるため、手軽にご利用を開始できます。詳しくは、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/express-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Express の料金</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"vertical-align: baseline;\">使ってみる</strong></p>\n<p><span style=\"vertical-align: baseline;\">このたび、AlloyDB Express のプレビュー版の提供を開始いたしました。</span><a href=\"http://console.cloud.google.com/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud コンソール</span></a><span style=\"vertical-align: baseline;\">でお試しいただくか、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/express-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Express のドキュメント ページ</span></a><span style=\"vertical-align: baseline;\">でご利用開始方法の詳細をご確認ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース部門エンジニアリング シニア ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Ravi Murthy</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース部門グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Gopal Ashok</strong></p></div>"
  "43a614908dee7e3cade7c9796d946073":
    "id": "43a614908dee7e3cade7c9796d946073"
    "title": "ユーザーを新次元に導く世界初の有線 XR グラス、XREAL AURA"
    "link": "https://cloud.google.com/blog/ja/products/chrome-enterprise/step-in-to-a-new-dimension-with-xreal-aura-a-first-of-its-kind-wired-xr-glasses/"
    "published": "2026-11-13 11:00:00"
    "fetched": "2026-11-13 19:33:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 29 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/chrome-enterprise/step-in-to-a-new-dimension-with-xreal-aura-a-first-of-its-kind-wired-xr-glasses?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">人々の働き方が急速に進化するなか、生産性を維持し、つながりを保つためのツールも進化し続けています。AI の導入によって日々のワークフローが変革され、同時に XR ヘッドセットやスマートグラスなどのフォーム ファクタによって、複数のアプリやデバイスにまたがる生産的な作業の仕方が再構築されようとしています。</span></p>\n<p><span style=\"vertical-align: baseline;\">そしてこのたび、Android XR を搭載した初の有線 XR グラス、</span><a href=\"https://x.com/XREAL_Global/status/2115489213281894825?a=HrHEmLqHSVxCJgLWbeI&amp;s=20\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">XREAL AURA</span></a><span style=\"vertical-align: baseline;\"> が発売されました。XREAL AURA のフォーム ファクタは、企業の仕事環境に次のような、画期的で効果的な機能をもたらします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">新たに導入された分割コンピューティング アーキテクチャで、有線グラスでの空間コンピューティングを利用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">画角 70 度の光学シースルー ディスプレイにより、リッチなビジュアル コンテンツを現実世界に直接重ねて表示し、周囲とのつながりを維持できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">グラスフレームの重量は 95 グラム未満で、長時間使用しても疲れません。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">特に注目すべきは、AURA がユーザーにもたらす独創的な生産性の効果です。従業員は、Google Play ストアで現在入手可能な人気タイトルを含む、エンタープライズ アプリをすぐに利用できます。Android の数百に及ぶ生産性向上アプリでも不十分な場合は、ノートパソコンを接続して、そのアプリケーションを空間環境に持ち込むこともできます。AURA の DisplayPort 入力（DP-in）機能により、プラットフォームを問わずノートパソコンをシームレスに接続でき、直接 Android アプリと連携できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Android XR デバイスの管理とセキュリティは、IT チームにとって非常に重要です。今年初めに Android XR に Android Enterprise 管理機能を導入しましたが、XREAL AURA デバイスも同じフレームワークで管理されます。管理とセキュリティの主な機能は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">managed Google Play: 公開および限定公開のビジネスアプリを安全に頒布および管理し、エンドユーザーが必要なツールをすべて利用できるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Android のゼロタッチ登録: Android デバイスをリモートで自動的にデプロイできるため、時間の節約と大規模な登録が可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">デバイス管理: Wi-Fi などのコアシステム リソースの構成や、アプリの不許可などのシステム ポリシー設定機能を含め、フルマネージド デバイスモードがサポートされます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Play プロテクト: 機械学習を活用してマルウェア、フィッシング、ランサムウェアをプロアクティブに検出し、脅威を阻止します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">コア Android プラットフォーム セキュリティ: 確認付きブートやデバイスの暗号化など、ハードウェアから OS まで網羅する多層保護機能でデバイスの安全を確保し、Google から定期的に配布されるモジュール式セキュリティ アップデートによって新たな脅威からデバイスを保護します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Device Trust from Android Enterprise: デバイスの保護とプライバシーの尊重により、企業の従業員がどこからでも仕事ができるよう支援します。管理対象外のデバイスも保護に含めることができます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">XREAL AURA を使用すると、周囲の環境とデジタルデータを同時に視覚に収めることが、いとも簡単にできます。独自のフォーム ファクタにより、ユーザーはエクステンデッド リアリティと物理空間での操作をシームレスに切り替えられます。これは、企業ユーザーに次のような新しいユースケースの実現を可能にします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ユーザーにのみ表示される仮想モニターと 3D コンテンツにより、空間コンピューティングで生産性を向上</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">機器の操作中に仮想エキスパートからサポートを受ける</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">複雑な情報を物理空間上に簡単に可視化</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">製品を 3D で設計およびシミュレーション</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">音声を使用して、物理的な世界から簡単に情報をデジタル システムのレコードに取り込む</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Android XR は、XREAL AURA 有線グラスなどの高性能デバイスを通じて、高度なコンピューティングと AI を日々の業務に活用できるようにするものです。すべてのデバイスが、安全で使い慣れた Android Enterprise フレームワークでシームレスに管理されます。この包括的なアプローチにより、企業は XR の可能性を最大限に引き出すことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Android についてさらに詳しく知りたい場合や、ご質問がある場合は、</span><a href=\"https://www.androidenterprise.community/product-updates?filters%5BproductArea%5D%5B0%5D=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">カスタマー コミュニティ</span></a><span style=\"vertical-align: baseline;\">でお知らせください。</span></p>\n<p><span style=\"vertical-align: baseline;\">仕事の進め方や視聴体験、遊びとの向き合い方に至るまで、XREAL AURA がもたらす変革について詳しくは、</span><a href=\"https://blog.google/products-and-platforms/platforms/android/xreal-aura/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google の最新ニュース</span></a><span style=\"vertical-align: baseline;\">ブログをご覧ください。</span></p>\n<p><span style=\"vertical-align: baseline;\">デバイスのご購入は、</span><a href=\"https://us.shop.xreal.com/products/xreal-aura?utm_source=google&amp;utm_medium=extension&amp;utm_campaign=AURA_Launch&amp;utm_content=google_enterprise_blog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">XREAL AURA ショップ</span></a><span style=\"vertical-align: baseline;\">からお願いいたします。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">XREAL AURA は、米国、カナダ、日本、韓国のユーザーのみにご利用いただけます。また、18 歳以上のお客様を対象としています。一部のアプリや機能では、ダウンロード、設定、サブスクリプションが必要になります。</span></span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、プロダクト オペレーション責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Will Ro</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google、技術パートナーシップ責任者、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sean Ginevan</strong></p></div>"
  "e412acb599b4d3ed0a9686b5c20eea73":
    "id": "e412acb599b4d3ed0a9686b5c20eea73"
    "title": "Google Cloud と NVIDIA が共同エンジニアリングのコラボレーションを拡大、エージェントの時代に向けてインフラストラクチャを拡張"
    "link": "https://cloud.google.com/blog/ja/topics/ai-infrastructure/google-cloud-infrastructure-at-nvidia-gtc-berlin-2026/"
    "published": "2026-11-13 09:00:00"
    "fetched": "2026-11-13 19:33:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 22 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/google-cloud-infrastructure-at-nvidia-gtc-berlin-2026?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業における継続的なマルチステップのエージェント ワークフローへの移行が進むにつれて、従来のインフラストラクチャは限界に達しつつあります。しかし、純粋なパフォーマンスは多くの要素の 1 つでしかありません。エージェント型 AI を真にスケールするには、タスクに対して適切なモデルを実行できる柔軟性に加え、機密性の高い知的財産と基盤となるインフラストラクチャの両方を検証可能な形で管理するために必要なデータ主権と運用主権も必要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud はこのたび、NVIDIA GTC Berlin 2026 で、この基盤を実現するスタック全体における新たな進歩を発表しました。これにより、ボトルネックが最小限に抑えられ、エコシステムの選択肢が広がり、ハードウェアで強化されたセキュリティによって最も機密性の高いワークロードを保護する新しいソブリン AI と Confidential Computing の機能が新しく導入されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェントの時代に向けたアーキテクチャの構築</strong></h4>\n<p><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud の AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> は、お客様がモデルのトレーニング、サービング、運用を大規模に行えるよう、コンピューティング、ストレージ、ネットワーキング、ソフトウェアを単一のシステムとして協調設計して構築されています。そしてこのたび、NVIDIA とのコラボレーションにより、このエージェント ネイティブ インフラストラクチャの新しいアップデートを発表しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NVIDIA Vera Rubin プラットフォーム ベースの A5X インスタンスによる高速コンピューティング</strong><span style=\"vertical-align: baseline;\">: ベアメタル GPU をアクセラレータとして使用するこのインスタンスは、最新の NVIDIA Vera Rubin NVL72 プラットフォームを搭載し、大規模なパフォーマンスを実現します。来月の一般提供に合わせて、新しいローカル リージョンへと展開してインフラストラクチャのフットプリントを拡大し、EMEA のデータ所在地および主権の要件をサポートします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Virgo Network によるスケールアウト A5X ネットワーキング:</strong><a href=\"https://cloud.google.com/blog/ja/products/networking/introducing-virgo-megascale-data-center-fabric?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Virgo Network</span></a><span style=\"vertical-align: baseline;\"> は、メッシュ トポロジを介して、建物内および建物間におけるノンブロッキング スケールアウト ファブリックをサポートします。この新機能によって極めて高度な水平スケーリングが可能になり、クラスタを単一サイト内では 80,000 個の Rubin GPU、マルチサイト デプロイ全体では最大 960,000 個の Rubin GPU に拡張できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Managed Lustre と NVIDIA GPUDirect Storage を使用したストレージ:</strong><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">は、A5X インスタンスで NVIDIA GPUDirect Storage をサポートします。これにより、トレーニング データと推論データが CPU とシステムメモリを介さず並列ファイル システムから GPU メモリへと直接転送される RDMA パスが実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KV キャッシュによるロング コンテキスト メモリ:</strong><span style=\"vertical-align: baseline;\"> A5X インスタンスは、ロング コンテキストでマルチターンのエージェント ワークロード向けに、GPU 高帯域幅メモリ（HBM）を超えてコンテキスト メモリを拡張するよう設計された高度な KV キャッシュ機能もサポートします。この高速キャッシュ レイヤは、ストレージ階層間でコンテキストをオフロードして再利用します。これにより、冗長な計算処理の削減、最初のトークンまでの時間の短縮、推論グッドプットのコスト効率の向上が実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Kubernetes Engine（GKE）上の A5X インスタンスによるワークロード オーケストレーション:</strong><span style=\"vertical-align: baseline;\"> GKE は、分散 AI ワークロード向けの機能スイートを提供します。たとえば、</span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/allocate-network-resources-dra?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE マネージド DRANET</span></a><span style=\"vertical-align: baseline;\"> は、ネットワーク インターフェース カードをファーストクラスのネイティブ Kubernetes リソースにすることで、RDMA 管理を簡素化します。また、</span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/schedule-gke-workloads-tas\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kueue</span></a><span style=\"vertical-align: baseline;\"> は、トポロジ対応のスケジューリングとリソース管理により、分散ワークロードのパフォーマンスを向上させます。これらの機能により、GKE と A5X インスタンスは、エージェント ワークロードのオーケストレーションに最適な組み合わせとなります。</span></p>\n</li>\n</ul></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=jSsyHFW3uOs\">\n\n      \n        <img alt=\"Google Cloud A5X instances: Powering next-gen AI with NVIDIA Vera Rubin platform\" src=\"https://img.youtube.com/vi/jSsyHFW3uOs/maxresdefault.jpg\" />\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=jSsyHFW3uOs\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><em><span style=\"vertical-align: baseline;\">「エージェント型 AI の真の価値は、処理速度の向上だけでなく、現在の制作パイプラインの摩擦から人間の創造性を解放することにあります。NVIDIA Vera Rubin NVL72 で高速化された Google Cloud の A5X インスタンスにより、WPP のクリエイティブ チームと制作チームは、フレーム単位の正確性での品質チェックやブランド アセットのシームレスな調整が可能なインテリジェント エージェントを活用できます。Google Cloud により、クライアントの最も野心的なクリエイティブ要求にも応えられる信頼性、スケール、主権セキュリティを実現できました。」 - </span><strong style=\"vertical-align: baseline;\">WPP 最高技術責任者、Stephan Pretorius 氏</strong></em></p></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">オープンモデルとエコシステムのイノベーションをさらに拡大</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェント ワークフローが単一のモデルのみで完結することはほとんどありません。そうしたワークフローでは、タスクを最も効率的なモデルにルーティングします。そのためインフラストラクチャは、ロードマップを制限するのではなく、選択肢を広げるものであるべきです。Google Cloud では、マルチクラウド環境、ハイブリッド環境、規制の厳しい環境の全体にわたって、任意のソフトウェアと NVIDIA AI インフラストラクチャ上にインフラストラクチャをデプロイできます。このたび、迅速な構築と適応のための自由を提供する複数のアップデートを発表しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープンモデル: </strong><a href=\"https://cloud.google.com/sovereign-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sovereign Cloud ポートフォリオ</span></a><span style=\"vertical-align: baseline;\">に、Gemma、Mistral、NVIDIA Nemotron などのモデルのサポートを追加します。これにより、モデルの重みとランタイムを完全に管理しながらオープン ウェイト モデルを実行および管理できるため、高性能なアクセラレーションを維持しつつロックインを回避できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NVIDIA Cosmos 3 と NVIDIA Nemotron 3.5 SuperVL および NVIDIA NeMo が Gemini で利用可能に</strong><span style=\"vertical-align: baseline;\">: 新しい NVIDIA Nemotron 3.5 SuperVL モデルを</span><strong style=\"vertical-align: baseline;\">マネージド トレーニング クラスタ</strong><span style=\"vertical-align: baseline;\">でカスタマイズできるようになりました。</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/machine-learning/training/training-clusters/get-started\"><span style=\"text-decoration: underline; vertical-align: baseline;\">MTC に最適化されたトレーニング レシピを使用</span></a><span style=\"vertical-align: baseline;\">して、Google Cloud 上の NVIDIA NeMo RL と NVIDIA NeMo Gym で Nemotron のトレーニング後の作業をすぐに開始できます。NVIDIA Cosmos 3 を使用すると、ロボットや自律走行車を現実世界に投入する前に仮想世界で試行、失敗、改善を行い、シミュレーションから現実へのワークフローをサポートできます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ソブリン AI と Confidential Computing によるデプロイの保護</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントがより自律的でミッション クリティカルなタスクを担うようになるにつれ、扱うデータの機密性も高まっています。このような高度なワークロードをデプロイする組織には、イノベーションを阻害しない、ハードウェアで強化された保護と運用管理が必要です。知的財産を保護しながらクラウドでモデル トレーニングを行う場合でも、完全にエアギャップのある環境でミッション クリティカルなワークロードを実行する場合でも、Google Cloud と NVIDIA は検証可能なセキュリティとローカルでの管理を実現できるよう支援します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud はこのたび、オンプレミス環境向けの新しいソブリン AI 機能と、パブリック クラウド向けの Confidential Computing の進化を発表しました。</span></p>\n<p><strong><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Distributed Cloud を使用したオンプレミスのソブリン AI</span></strong></p>\n<p><span style=\"vertical-align: baseline;\">インターネットから厳密に分離する必要があるミッション クリティカルなワークロードでは、</span><a href=\"https://cloud.google.com/distributed-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Distributed Cloud</span></a><span style=\"vertical-align: baseline;\">（GDC）を使用することで、データセンターやエッジ施設にマネージド クラウド スタックを直接提供できます。ソブリン AI の取り組みを前進させるため、Google Cloud では GDC エアギャップ デプロイ全体で新しいコンピューティング アクセラレータ、マルチモーダル モデル、すぐに使用できる検索機能を提供しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GDC 上の NVIDIA Blackwell Ultra GPU:</strong><span style=\"vertical-align: baseline;\"> 今年のプレビュー版公開に続き、最新の NVIDIA HGX B300 システムが GDC 上で一般提供（GA）開始となりました。これにより、業界をリードするコンピューティング密度とエネルギー効率に優れた性能をオンプレミスで実現し、要求の厳しいローカル推論ワークロードに必要な高スループット プラットフォームの基盤を構築できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GDC 上の Gemini Flash モデル:</strong><span style=\"vertical-align: baseline;\"> NVIDIA HGX B300 を搭載した GDC 上で Gemini 3.5 Flash を利用できるようになったことで、ソブリン モデル カタログが拡張されました。これにより、テキスト、音声、動画、画像のすべてを対象とした高速で高スループットのマルチモーダル推論を、エアギャップのある境界内で完全に実行できるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GDC 上でのエンタープライズ検索機能:</strong><span style=\"vertical-align: baseline;\"> 現在プレビュー版として提供されている </span><a href=\"https://cloud.google.com/blog/ja/topics/hybrid-cloud/managed-rag-search-inside-the-sovereign-perimeter-gemini-on-gdc-enterprise-search?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GDC エアギャップの Gemini によるエンタープライズ検索機能</span></a><span style=\"vertical-align: baseline;\">は、マルチモーダル検索拡張生成（RAG）を活用した、すぐに使える会話型インターフェースです。これらの機能は、NVIDIA HGX B300 を搭載した GDC エアギャップ上の Gemini によって提供されます。独自のドキュメント、メディア、非構造化アーカイブを対象としたクエリ、要約、クロスチェックを、アナリストやナレッジ ワーカーがカスタム エンジニアリングなしで即座に実行できるようになりました。インデックス作成、エンベディング、インタラクションはすべて、厳密に主権セキュリティ境界内で処理されます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ソブリン AI ワークロードは、エアギャップのあるオンプレミス デプロイだけでなく NVIDIA AI インフラストラクチャ上で実行することもでき、</span><a href=\"https://cloud.google.com/security/products/assured-workloads\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Boundary</span></a><span style=\"vertical-align: baseline;\"> を使用してパブリック クラウド上でデータ所在地のリージョン指定などの制御を適用したり、</span><a href=\"https://cloud.google.com/products/dedicated\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Dedicated</span></a><span style=\"vertical-align: baseline;\"> を使用してフランスの S3NS やドイツの Thales などの独立したローカル パートナーが運営する分離されたクラウド上で実行したりすることが可能です。</span></p>\n<p><strong><span style=\"text-decoration: underline; vertical-align: baseline;\">パブリック クラウドでの Confidential Computing</span></strong></p>\n<p><span style=\"vertical-align: baseline;\">企業のワークロードが拡大するにつれて、アクティブなトレーニングにおける機密性の高い知的財産の保護や、リアルタイムの推論におけるユーザー コンテキストとモデル IP の保護が、安全な AI アーキテクチャを維持するうえで欠かせないものになります。Google Cloud の高度なセキュリティ ランタイムと NVIDIA Confidential Computing の組み合わせにより、処理速度を犠牲にすることなく、検証済みの高信頼実行環境内に高性能な生成 AI モデルをデプロイすることが可能になります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Confidential Computing 対応 G4 インスタンスの一般提供を開始: </strong><span style=\"vertical-align: baseline;\">NVIDIA RTX PRO 6000 Blackwell Server Edition GPU を搭載した Confidential Computing 対応 G4 インスタンスの提供を開始し、プライバシーの保護に配慮した AI へのアクセスを拡大します。NVIDIA Confidential Computing に対応した G4 Confidential GPU は、パフォーマンスを犠牲にすることなくセキュリティを強化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Confidential Computing は現在、</span><strong style=\"vertical-align: baseline;\">NVIDIA HGX B200</strong><span style=\"vertical-align: baseline;\"> とインテル TDX を搭載した </span><strong style=\"vertical-align: baseline;\">A4</strong><span style=\"vertical-align: baseline;\"> インスタンスで利用可能です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud に Confidential Bare Metal を導入します。これは、フロンティア モデルの AI サービングにおけるシングルテナント ベアメタルのパフォーマンスと分離の価値を認識し、それに対応するものです。Google Cloud のイノベーションは、</span><strong style=\"vertical-align: baseline;\">NVIDIA Confidential Bare Metal</strong><span style=\"vertical-align: baseline;\"> を使用した </span><strong style=\"vertical-align: baseline;\">A4X Max</strong><span style=\"vertical-align: baseline;\"> インスタンス（</span><strong style=\"vertical-align: baseline;\">NVIDIA GB300 NVL72</strong><span style=\"vertical-align: baseline;\"> 搭載）へとつながります。暗号化された DDR と NVLink 相互接続により、ハードウェアを基盤とするセキュアブートとアテステーションを拡張します。ベアメタル AI ワークロードはこの信頼できる実行境界を活用し、推論およびトレーニングの実行中にユーザー プロンプトとモデルを保護します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Google Cloud のメリット</strong></h4>\n<p><span style=\"vertical-align: baseline;\">NVIDIA とのコラボレーションによる共同エンジニアリングを通じて、NVIDIA のフルスタック アクセラレーテッド コンピューティング プラットフォームが </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\"> に直接統合されました。これにより、モデルの大規模なトレーニング、サービング、運用に必要なエージェント ネイティブのインフラストラクチャをご利用いただけるようになりました。今回の発表は、NVIDIA Vera Rubin プラットフォームと高スループット ネットワーキングを組み合わせ、オープンモデルのサポートを拡大した、この統合基盤についてご紹介するものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">今回のコラボレーションではさらに、お客様がデータを検証可能な形で管理できる機能も提供します。NVIDIA インフラストラクチャ全体で新しいソブリン AI デプロイと Confidential Computing を利用できるようになったため、ハードウェアで強化されたセキュリティと国内でのデータ保管により、最も機密性の高いワークロードを保護できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google はハードウェアとソフトウェアを 1 つのシステムとして設計しているため、コードを書き直すことなく、さまざまなアーキテクチャでモデルを実行できます。このシステムではコンピューティング サイクルがワークロードの処理に集中的に使用されるため、AI プロダクトをより迅速にリリースできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの新機能の利用を開始するには、Google Cloud の営業担当者にお問い合わせください。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">AI およびコンピューティング インフラストラクチャ担当バイス プレジデント兼ゼネラル マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Mark Lohmeyer</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、Distributed &amp; Sovereign Cloud 担当バイス プレジデント兼ゼネラル マネージャー</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Ankur Mehrotra</strong></p></div>"
