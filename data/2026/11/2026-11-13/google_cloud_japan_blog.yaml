    "id": "34bf8396e91f2b418ffc79665df209b3"
    "title": "Gemini Omni 1.2 Flash: 高速で費用対効果に優れ、信頼性の高い動画生成・編集機能の一般提供を開始"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-omni-1-2-flash-generally-available/"
    "published": "2026-11-13 11:00:00"
    "fetched": "2026-11-13 11:23:52"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 6 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-omni-1-2-flash-generally-available?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Google Cloud で Gemini Omni 1.2 Flash の一般提供を開始いたしました。このモデルは、商品動画やバーチャル試着、広告など、企業が日常的に大量に制作する動画向けに開発されました。高速かつ費用対効果に優れ、入力された画像、動画、音声の参照データをこれまで以上に忠実に再現します。</span></p>\n<p><span style=\"vertical-align: baseline;\">ビジネス ユーザーは Gemini for Business や Google Vids を通じて、開発者は API を介して、このモデルを制作や開発に活用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">主な新機能は以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">価格の引き下げ:</strong><span style=\"vertical-align: baseline;\"> 720p 動画 1 秒あたり $0.07 となり、Gemini Omni 1.1 Flash と比較して 30% 低価格になりました。他の解像度でも同様にコストを削減できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">より長いクリップ:</strong><span style=\"vertical-align: baseline;\"> 最長 15 秒の動画を生成、編集できます（以前は 10 秒）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">より一貫性のある生成結果:</strong><span style=\"vertical-align: baseline;\"> 画像や動画の参照データをより忠実に再現でき、複数のカットがある動画でも商品、キャラクター、ブランドの細部が一貫して維持されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高解像度ドラフトのより迅速な作成:</strong><span style=\"vertical-align: baseline;\"> 360p または 720p でドラフト動画を作成してから、1080p または 4K にアップスケールして仕上げられます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">より自然な音声:</strong><span style=\"vertical-align: baseline;\"> より流暢で自然なセリフ、より精度の高いリップシンク、話者ごとの明確な音声の使い分けにより、臨場感のあるシーンを生成できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">会話形式での編集:</strong><span style=\"vertical-align: baseline;\"> 同じクリップを最初から作り直すのではなく、商品の入れ替え、照明の変更、カメラアングルの変更などで調整できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">注: 音声の参照データは許可リストに登録されている必要があります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">本番環境で使用できる Gemini Omni 1.2 Flash</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini Omni 1.2 Flash はプロダクション レディなモデルであり、Google Cloud のエンタープライズ グレードのインフラストラクチャとセキュリティによって支えられています。また、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/provisioned-throughput\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プロビジョンド スループット</span></a><span style=\"vertical-align: baseline;\">も利用可能です。出力には、人の目には見えない </span><a href=\"https://deepmind.google/models/synthid/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SynthID</span></a><span style=\"vertical-align: baseline;\"> の透かしが入ります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使い慣れたツール内で動画制作が可能に</strong></h4>\n<p><span style=\"vertical-align: baseline;\">デザインやクリエイティブのプラットフォーム企業では、Gemini Omni 1.2 Flash を自社製品に直接組み込んで、ユーザーが普段から使用している環境で動画を作成、編集できるようにしています。Gemini Omni 1.2 Flash の活用事例を以下にご紹介します。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"artlist\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/artlist.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「Artlist では、クリエイターがアイデアを形にするためのコントロールと柔軟性の提供に重点を置いています。Gemini Omni 1.2 Flash は、参照データに基づく生成、動画の延長、生成物の一貫性確保など、お客様が試験的な段階からプロフェッショナルなコンテンツ制作へと大規模に移行する際に役立つ優れた機能を備えています。」– Artlist、CPTO、Roee Peled 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=OofOq-NaYXI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Artlist は Gemini Omni 1.2 Flash を使用してクリエイティブなアイデアを具現化</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n        \n          <p>Artlist は Gemini Omni 1.2 Flash を使用してクリエイティブなアイデアを具現化</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=OofOq-NaYXI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Artlist は Gemini Omni 1.2 Flash を使用してクリエイティブなアイデアを具現化</span></span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"flora\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/flora.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「クリエイティブ チームには、一貫して動作する頼れるモデルが必要です。Gemini Omni 1.2 Flash は、詳細な画像や完成した動画に手を加える場合でも、商品の見た目はそのままに、配色や背景などのリクエストされた部分だけを的確に編集できます。動画から動画への変換機能を使って、映像をまったく新しいスタイルに変えられます。」– FLORA、プロダクト マーケティング マネージャー、Andrew Taco Zhang 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=Opx8Uf6vcqg\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">FLORA は Gemini Omni 1.2 Flash を使用して新しいスタイルを生成</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=Opx8Uf6vcqg\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">FLORA は Gemini Omni 1.2 Flash を使用して新しいスタイルを生成</span></span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"invideo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/invideo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「invideo で Gemini Omni 1.2 Flash を評価したところ、実に素晴らしい結果に驚きました。プロンプトに忠実で、物理的な動きや音もリアルです。手早く大規模に動画を生成する必要がある場合、これはテストした中で間違いなくトップクラスのモデルです。15 秒あれば、1 つのシーンを一回で生成できます。」– invideo、エンジニアリング担当バイス プレジデント、Shivam Rastogi 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=FQ5wy13QqGo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">invideo は Gemini Omni 1.2 Flash を使用して 1 つのプロンプトでシーン全体を作成</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=FQ5wy13QqGo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">invideo は Gemini Omni 1.2 Flash を使用して 1 つのプロンプトでシーン全体を作成</span></span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Krea\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Krea.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「この新しいモデルのスピードと精度には目を見張るものがあります。出力結果は驚くほど細部まで再現されており、指示した変更のみを的確に反映しつつ、それ以外の部分はすべて一貫性を保って仕上げてくれます。キャラクターやシーンの置き換え、その他のクリエイティブなワークフローに活用するのを楽しみにしています。」– Krea、クリエイティブ スペシャリスト、Numan Khan 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=BZqcrwXwF3E\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Krea はキャラクターからシーンの置き換えまで、クリエイティブなワークフローに Gemini Omni 1.2 Flash を使用</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=BZqcrwXwF3E\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Krea はキャラクターからシーンの置き換えまで、クリエイティブなワークフローに Gemini Omni 1.2 Flash を使用</span></span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Picsart\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Picsart.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「Gemini Omni 1.2 は、当社チームの制作スタイルに合っています。ドラフトモードでコンセプトを数分で反復修正し、4K でレンダリングしてテレビ対応の AI ドラマを制作できます。テキストはどのフレームでも鮮明に表示され、キャラクターの見た目や声もリアルで、処理スピードも速いため制作がスムーズに進みます。一般提供が開始されたことで、1 億人を超える Picsart クリエイターにこの品質を提供できるようになりました。」– Picsart、プロダクト責任者兼パートナーシップ責任者、Narek Hayrapetyan 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=wZpPW8r3bJQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Picsart は Gemini 1.2 Flash を使用してコンセプトを数分で反復修正</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=wZpPW8r3bJQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Picsart は Gemini 1.2 Flash を使用してコンセプトを数分で反復修正</span></span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Runway\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Runway.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>Runway は、高品質なコンテンツを制作できる高度な AI 動画ツールでクリエイターを支援します。企業向けには、プロフェッショナルな制作を大規模に展開するための強力なコラボレーション ツールを備えた Runway のエンタープライズ ソリューションを提供しています。Gemini Omni 1.2 Flash で作成された以下の動画をご覧ください。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=TLpQ6VRhTAo\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Runway は Gemini Omni 1.2 Flash を使用して高品質なコンテンツの制作と大規模な展開を実現</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=TLpQ6VRhTAo\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Runway は Gemini Omni 1.2 Flash を使用して高品質なコンテンツの制作と大規模な展開を実現</span></span></p>\n<h4><strong style=\"vertical-align: baseline;\">カタログ全件の商品動画とリスティング動画を生成</strong></h4>\n<p><span style=\"vertical-align: baseline;\">小売業者やマーケットプレイスは、Gemini Omni を活用して既存の写真を商品の短い回転画像、ライフスタイル クリップ、試着動画、動画広告に変換しています。</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"Photoroom\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Photoroom.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「Photoroom を使用すると、商品の写真から販売を促進する動画広告を数分で作成できます。動画広告メーカーと商品アニメ化ツールの基盤として、当社は品質、スピード、費用のバランスに優れた Gemini Omni Flash を選びました。バージョン 1.2 は、ユーザーからの要望が最も多かった 15 秒の動画に対応しています。一般提供の開始と SLA の適用により、販売者やエンタープライズのお客様の本番環境においても信頼性の高いツールとして活用いただけます。」- Photoroom、CEO / 共同創業者、Matt Rouif 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=fwTIGK0ODiU\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Photoroom は Gemini Omni 1.2 Flash を使用して動画広告メーカーと商品アニメ化ツールを強化</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=fwTIGK0ODiU\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">Photoroom は Gemini Omni 1.2 Flash を使用して動画広告メーカーと商品アニメ化ツールを強化</span></span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"QuickFrame ai\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/QuickFrame_ai.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「QuickFrame AI を活用すれば、コネクテッド テレビやソーシャル向けのプロ品質の広告をマーケティング担当者やビジネス オーナーの手で数分で作成、編集、リリースできます。Gemini Omni 1.2 Flash が 15 秒の 1080p 動画の生成に対応したことで、1 回の生成でコネクテッド テレビ用の広告丸 1 本を制作可能になりました。あらゆる規模の企業で、テレビ広告を手軽に作ることができます。」- QuickFrame AI、最高技術責任者、Richard Girges 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=bJMy_nJiIng\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">QuickFrame AI は Gemini Omni 1.2 Flash を使用して 1 回の生成でコネクテッド テレビ用の広告丸 1 本を制作</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=bJMy_nJiIng\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: super;\">QuickFrame AI は Gemini Omni 1.2 Flash を使用して 1 回の生成でコネクテッド テレビ用の広告丸 1 本を制作</span></span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini for Business、Google Vids で制作して API で構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Gemini にまもなく追加されるこのモデルにより、ビジネス ユーザーはチャット画面で直接プロンプトや商品写真を使ってショート動画を作成できるようになります。Google Vids では、生成されたクリップをアバター、音楽、ナレーションと組み合わせて、製品説明、ティーザー、ソーシャル投稿、セールスピッチを作成できます。企業は、API を介して Gemini Omni 1.2 Flash の機能を自社のアプリケーションやエージェントに組み込むことも可能です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini Omni を使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は皆様からのフィードバックをもとに Gemini Omni の改善を続けてまいります。どのようなものを構築されたか、ぜひお聞かせください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ビジネス ユーザーの場合:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://vids.new/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Vids</span></a><span style=\"vertical-align: baseline;\"> で試す（</span><a href=\"https://cloud.google.com/gemini-enterprise\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini for Business</span></a><span style=\"vertical-align: baseline;\"> でも近日中に提供開始）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">開発者の場合:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://console.cloud.google.com/agent-platform/studio/multimodal?mode=prompt&amp;model=gemini-omni-1.2-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud コンソール</span></a><span style=\"vertical-align: baseline;\">で試す、</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/gemini/omni-1-2-flash\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API</span></a><span style=\"vertical-align: baseline;\"> で構築する、</span><a href=\"https://cloud.google.com/model-garden/pricing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">料金</span></a><span style=\"vertical-align: baseline;\">を確認する</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、シニア プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">John Nack</strong></p></div>"
  "1cdffec4556106ad22a0f9d91c69662b":
    "id": "1cdffec4556106ad22a0f9d91c69662b"
    "title": "エージェント時代におけるマシンスピードでの構築と防御を支援"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/helping-you-build-and-defend-at-machine-speed-in-the-agentic-era/"
    "published": "2026-11-13 11:15:00"
    "fetched": "2026-11-13 19:33:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 5 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/helping-you-build-and-defend-at-machine-speed-in-the-agentic-era?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">フロンティア ラボであり、世界で最も包括的な脅威インテリジェンス ネットワークの運営者でもある Google は、独自の立ち位置にあります。Google は、大規模言語モデルがどのように設計され、攻撃者が実際の現場でどのようにそれらを標的にしているかを正確に把握しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">受動型の防御だけでは、もはや対応できません。十分な管理や統制がないまま、自律システムを従来のワークフローに急速導入すると、重大なセキュリティ インシデントを引き起こす可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Security Summit では、エージェントの時代において、組織が安全に構築を行い、システムを保護し、マシンスピードで防御できるよう、Google がどのように支援しているかについての最新情報をお伝えします。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">エージェントの時代における安全な構築</strong></h3>\n<p><span style=\"vertical-align: baseline;\">エージェント コーディング ツールはソフトウェア デリバリーを劇的に加速させましたが、マシンスピードで行われる commit や未検証の依存関係に、人間によるレビューが追いつかなくなっています。自律型エージェントがサプライ チェーンの一部となった今、無条件に信用してしまうと、攻撃者にとっての直接的なバックドアになり得ます。</span></p>\n<p><span style=\"vertical-align: baseline;\">開発ライフサイクルを保護する Google のアプローチでは、統合開発環境（IDE）にネイティブなリアルタイムのガードレールを構築し、コードと Identity and Access Management（IAM）全体でアセットグラフを一元化し、モデルを検証してコードが統合される前にロジックの欠陥を排除します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">CodeMender: エンタープライズ管理を備えた最先端のサイバーセキュリティ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ソフトウェアに起因する脅威が拡大し続けるなか、Google の自律型コード セキュリティ エージェント </span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/find-and-fix-software-vulnerabilities-with-codemender?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">CodeMender</span></a><span style=\"vertical-align: baseline;\"> は、組織がコードの脆弱性をマシンスピードで検出して修正できるよう支援します。手動によるトリアージのボトルネックを解消しながら、ソフトウェア開発ライフサイクルにセキュリティを深く組み込むことができます。</span></p>\n<p><span style=\"vertical-align: baseline;\">CodeMender は、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-4-argon-available-on-google-cloud?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini 4 Argon</span></a><span style=\"vertical-align: baseline;\"> を含む複数のモデルと連携して、最先端のサイバーセキュリティ機能を提供します。これらの機能には、これまで未知だった脆弱性を特定し、悪用される前にテスト済みのパッチを生成する機能が含まれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">直近では、Wiz は Gemini 4 Argon と他のモデルを組み合わせて、</span><a href=\"https://www.wiz.io/blog/php2shell-php-rce\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ウェブサイトの 70% に影響を及ぼした PHP コアの脆弱性</span></a><span style=\"vertical-align: baseline;\">を特定し、修復を支援しました。Gemini 4 Argon は、脆弱性の発見、想定される攻撃パスの特定、攻撃の検出、パッチの検証において、特筆すべき貢献を果たしました。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在プレビュー版の CodeMender は、安全な分離と柔軟なスキャンを実現する以下の新機能を提供します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">安全かつ自律的な修復</strong><span style=\"vertical-align: baseline;\">: CodeMender は、脆弱性の検証とエクスプロイトのシミュレーションを、選択したオペレーティング システムレベルのサンドボックスまたは隔離された仮想マシン内で行います。また、ローカルでの書き込みとコマンド実行に人間参加型のチェックを追加することで、悪意のあるエクスプロイトやゼロデイ テストが思わぬ事態を引き起こすリスクを軽減します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">柔軟なスキャンモード</strong><span style=\"vertical-align: baseline;\">: CodeMender では、特定のフォルダ、リポジトリ全体、または前回のスキャン以降に変更されたファイルのみをスキャンできるようになりました。これにより、スキャンするファイルの数を細かく制御して、スキャン速度と費用を最適化できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">7 月に CodeMender のプレビュー版がリリースされて以来、数百社におよぶお客様が CodeMender を活用し、マシンスピードで脆弱性の検出および修正を行っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「攻撃者がマシンスピードで攻撃を仕掛けてくる中、Google の Fairwind Program は、当社のアプリケーション セキュリティで遅れをとらない対応を維持するのに役立っています。CodeMender の初期評価では、専門家による検証と修復で人の目による管理を維持しながら、脆弱性発見までの時間を 95% 以上短縮できる可能性が示されています」と、Thales Group のサイバーセキュリティ サービス担当 CTO である Ivan Fontarensky 氏は述べています。</span></p>\n<p><span style=\"vertical-align: baseline;\">「IDC の調査によると、企業の 40% 近くで、脆弱性の修復が新たな脆弱性の発生ペースに追いついていません。修復を伴わない検出は、開発者の作業負担を増やすだけにすぎません」と、IDC のクラウド セキュリティ担当リサーチ ディレクターである Katie Norton 氏は述べています。「CodeMender は、悪用可能性の検証とデプロイ可能なコード修正を組み合わせることでこれを解決します。悪用されるまでの時間が短縮するなかで不可欠となる、検証済みパッチの継続的な適用を促進するからです。」</span></p>\n<h3><strong style=\"vertical-align: baseline;\">あらゆる場所でワークロードを保護</strong></h3>\n<p><span style=\"vertical-align: baseline;\">自律型ワークロードが本番環境に移行すると、脅威の状況は一変します。攻撃者は、認証情報、データ境界、エージェントと企業を接続する統合環境といった、システムの接続基盤を標的とするからです。侵入した攻撃者は、過剰な権限を持つ認証情報とセグメント化されていない環境を悪用して、企業のデータ境界を越えて横展開します。</span></p>\n<p><span style=\"vertical-align: baseline;\">このようなフラット トラスト アーキテクチャを排除するために、Google Cloud は、エージェントが実行されるあらゆる場所で、基本的なセキュリティとガバナンス制御の統合フレームワークを提供します。エージェントが Gemini プラットフォーム、Google Kubernetes Engine（GKE）、Cloud Run、新しい </span><a href=\"https://cloud.google.com/blog/ja/topics/ai-infrastructure/introducing-agent-compute-engine-and-expanded-agent-governance?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Compute Engine</span></a><span style=\"vertical-align: baseline;\"> で動作しているか、マルチクラウド環境間で連携しているかにかかわらず、同じ厳格なエンタープライズ統制が適用されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">トランザクション レベルで「あらゆる場所でのエージェント」フレームワークを適用するために、以下の重要な ID、ネットワーク、コンテンツの制御機能を導入します。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Auth Manager（Agent Identity）</strong><span style=\"vertical-align: baseline;\">: IAM のガバナンスのもと、Google マネージド Vault 内で認証情報を一元管理します。一般提供が開始された</span><a href=\"https://docs.cloud.google.com/iam/docs/auth-manager-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Auth Manager</span></a><span style=\"vertical-align: baseline;\"> は、OAuth 2.0 / PKCE フローを自動化し、ユーザー委任トークンを更新することで、同意疲れを最小限に抑え、認証情報の盗難リスクを低減します。Auth Manager とともに、</span><a href=\"https://docs.cloud.google.com/iam/docs/agent-identity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Identity</span></a><a href=\"https://docs.cloud.google.com/iam/docs/auth-agent-own-identity-external\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">JWT サポート</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）が標準の OIDC トークンを発行します。これにより、エージェントは有効期間の長い静的な API キーを使用せずに、AWS、Azure、オンプレミスのバックエンド、MCP サーバー間で安全に認証できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ID ベースの VPC Service Controls</strong><span style=\"vertical-align: baseline;\">: データの引き出しに対する境界防御を強化するため、</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/introducing-new-scalable-perimeter-options-with-vpc-service-controls?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">VPC-SC の上り（内向き）と下り（外向き）のルール</span></a><span style=\"vertical-align: baseline;\">で IAM ロールがサポートされるようになりました（一般提供）。また、Workload Identity Federation for GKE（プレビュー版）により、セキュリティ チームは、複雑な手動の例外処理を行うことなく、エンタープライズ GKE クラスタ全体にきめ細かい ID ベースの境界を適用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model Armor のカスタム トピック検出機能</strong><span style=\"vertical-align: baseline;\">: 現在プレビュー版で提供されているこの機能強化により、エージェントに指定のトピックを遵守させることができます。プロンプトベースのカスタムルールを定義して、トピックに沿ったインタラクションとトピックから外れたインタラクションを識別できます。この機能は医療、保険、小売業界のユースケースに合わせてカスタマイズされているため、エージェントの会話が脱線するのを防ぎ、コンプライアンスを確保した安全なコミュニケーションを維持します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高度なネットワーク脅威からの保護: </strong><a href=\"https://docs.cloud.google.com/firewall/docs/about-intrusion-prevention\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud NGFW Enterprise の IPS</span></a><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">機能に基づいて、Palo Alto Networks WildFire を利用した新しい</span><a href=\"https://docs.cloud.google.com/chronicle/docs/soar/marketplace-integrations/wildfire\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud NGFW の高度なマルウェア サンドボックス</span></a><span style=\"vertical-align: baseline;\">（一般提供）でワークロードを保護できるようになりました。また、Cloud NGFW の</span><a href=\"https://docs.cloud.google.com/firewall/docs/about-firewall-endpoints#:~:text=the%20folder%20level.-,Project-level%20firewall%20endpoints,-:%20project%20administrators%20create\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プロジェクト レベルのリソース</span></a><span style=\"vertical-align: baseline;\">（一般提供）を使用してファイアウォールの運用を効率化し、</span><a href=\"https://docs.cloud.google.com/armor/docs/managed-rules-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Armor のマネージド ルール</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）で脆弱性攻撃からの保護を自動化できます。このルールは、毎月 1.5 兆件のウェブ リクエストをスキャンする Thales Imperva のグローバル脅威インテリジェンスを基盤としています。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">マシンスピードでの防御</strong></h3>\n<p><span style=\"vertical-align: baseline;\">攻撃者は、運用ライフサイクル全体に高度な機能を統合し、これまでにない規模と速度で攻撃を仕掛けています。自律型マルチエージェントによる脅威に対抗するには、エージェント型かつインテリジェンス主導の運用によって防御側を強化し、数日ではなく数分で攻撃者を無力化できるようにする必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">最新の SOC（セキュリティ オペレーション センター）には、地球規模のインフラストラクチャを基盤とした、以下のような自律的な調査、検出、対応機能が必要です。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">継続的な監視により、ワークロード レイヤにおいてリアルタイムで発生している侵害を検出し、テレメトリーを Wiz Security Graph に直接フィードする。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">防御モデルのランタイム ロジックに直接組み込まれた Google Threat Intelligence のテレメトリーにより、プロセスツリーを再構築して脅威をリアルタイムで隔離する自動エージェント型脅威ハンティングをトリガーする。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">自律型エージェントが、複雑なアラートを分析し、マルチベンダーのテレメトリー全体にわたる相関クエリを 1 秒未満で実行して、人間が戦略的な最終承認を行えるよう明確な対応策を提示する。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">もちろん、自律型テクノロジーを導入するだけでは不十分です。チームがそれを効果的に活用するには、適切な運用フレームワークも必要です。サイバー防御運用を発展させるため、</span><a href=\"https://cloud.google.com/resources/report/content/the-defenders-advantage-applying-agentic-systems\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Mandiant Transformation Services</strong></a><span style=\"vertical-align: baseline;\"> のエキスパートが運用モデルをモダナイズし、これらの高度なテクノロジーのメリットを最大限に引き出します。Mandiant は、最前線のベスト プラクティスを活用してプロセスを改善し、人材のスキルを高めることで、組織が先手を打って脅威を低減し、侵害発生時でもビジネスの継続性を確保できるよう支援します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">連携による相乗効果: Wiz と Google</strong></h3>\n<p><span style=\"vertical-align: baseline;\">エンドツーエンドの防御を実現するには、これらのネイティブ プラットフォーム制御を、組織が多様なツールを運用しているマルチクラウド環境に拡張する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Wiz と Google Cloud は、自律型アプリケーションに対する深い理解、連携されたセキュリティ コンテキスト、そして脅威インテリジェンスを組み合わせることで、組織が安全にイノベーションを推進し、新たな脅威に先手を打てるよう支援します。最近のハイライトは次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz を使用して、構築と実行場所を問わず自律型ワークロードを保護: </strong><span style=\"vertical-align: baseline;\">組織が Google Cloud と Gemini プラットフォームを使用して構築とスケーリングを行う際、Wiz はコードからランタイムまで、ライフサイクル全体にわたって自律型アプリケーションを保護します。Wiz は、自律型アプリケーション、エージェント、インフラストラクチャを検出してマッピングし、目的、機能、権限を含めてアプリケーション自体を詳細に分析することで、隠れたリスクを明らかにします。Wiz Security Graph のコンテキストと組み合わせることで、複雑な攻撃パスやランタイムの脅威を明らかにし、チームがリスクの優先順位付けを行い、自信を持ってイノベーションを推進できるように支援します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz AI SAST でマシンスピードのコード セキュリティを実現</strong><span style=\"vertical-align: baseline;\">: プレビュー版として提供されている Wiz AI 静的アプリケーション セキュリティ テスト（SAST）は、エージェント推論を使用してアプリケーションの動作を理解し、複雑なビジネス ロジックの欠陥をあぶり出します。Wiz Research に基づき、独自の Atlas ハーネスによって強化された </span><a href=\"https://www.wiz.io/blog/introducing-wiz-ai-sast\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz AI SAST</span></a><span style=\"vertical-align: baseline;\"> は、コードの脆弱性を Wiz Security Graph のインフラストラクチャ コンテキストと関連付けることで、チームが最も重要なリスクに優先して対処できるようにします。これにより、悪用可能な攻撃パスは、Green Agent と CodeMender を使用して、マシンスピードで修復できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz と Google Security Operations とともに強化する脅威防御</strong><span style=\"vertical-align: baseline;\">:</span><a href=\"https://www.wiz.io/blog/wiz-defend-and-google-security-operations\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Wiz Defend と Google Security Operations</span></a><span style=\"vertical-align: baseline;\"> が共有データモデルで連携するようになり、セキュリティ運用チームはどちらのプラットフォームでも柔軟に脅威を調査できるようになりました。改善点としては、Google Security Operations における専用 Wiz コンテンツ パックや Wiz Blue Agent 調査分析の導入、プラットフォーム間の双方向同期によるアナリスト エクスペリエンスの効率化などが挙げられます。さらに、Wiz Defend は Google Threat Intelligence と統合され、最新の分析情報と最前線のインテリジェンスを Wiz に直接取り込めるようになりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scan for Good でリソース不足の組織を保護</strong><span style=\"vertical-align: baseline;\">: Google DeepMind と Wiz が共同で立ち上げたイニシアチブである </span><a href=\"https://www.wiz.io/blog/scan-for-good-critical-ai-exposures\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Scan for Good</span></a><span style=\"vertical-align: baseline;\"> は、自律型テクノロジーとセキュリティ研究者の知見を組み合わせた力を、公共サービス、重要インフラ、非営利団体などのリソース不足の組織に提供します。この取り組みの最初の 1 か月で、Argon を活用することで、50 を超える公共サービス組織と重要インフラ プロバイダが重大な脆弱性を発見し、修復できるよう支援しました。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">構築側と防御者に優位性を取り戻す</strong></h3>\n<p><span style=\"vertical-align: baseline;\">自律型エージェントの時代にセキュリティを確保するには、運用モデルを進化させ、安全性を重視した設計のパイプラインを適用し、悪意のあるインフラストラクチャに対して直接的な対策を講じる必要があります。Google の責任は、以下のように、攻撃者の発生源でその活動を阻止することにまで及びます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud 環境を標的とする悪意のある攻撃者の追跡と、そのインフラストラクチャの恒久的な無効化。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google DeepMind との連携による、重大なリスクが伴うサイバーセキュリティや自動コード分析に特化したモデルを含む、専門的な防御アーキテクチャの構築。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">最前線の脅威インテリジェンスをモデルのアライメントと分類器のトレーニングにフィードバックし、新たな攻撃ベクトルが顕在化する前に無効化。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ネイティブなパイプライン防御を確立し、フラット トラスト アーキテクチャを解体し、マシンスピードの運用を展開することで、企業は AI の優位性を防御者に取り戻すことができます。</span></p>\n<p><a href=\"https://cloudonair.withgoogle.com/events/summit-amer-security-2026\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Security Summit</span></a><span style=\"vertical-align: baseline;\"> に参加いただくと、これらの機能について詳しく学び、自律型エージェントの時代に組織を保護する方法をご確認いただけます。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Threat Intelligence 担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sandra Joyce</strong></p></div>"
  "611a47b4d41feef0d9d56999097c9d5f":
    "id": "611a47b4d41feef0d9d56999097c9d5f"
    "title": "Google の Agentic Data Cloud にエージェントを大規模に強化する新機能が登場"
    "link": "https://cloud.google.com/blog/ja/products/databases/whats-new-across-googles-agentic-data-cloud/"
    "published": "2026-11-13 11:10:00"
    "fetched": "2026-11-13 19:33:13"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 5 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/whats-new-across-googles-agentic-data-cloud?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">エージェントの時代に突入したのはそう昔のことではありませんが、今や、組織は本番環境でエージェントを運用し、大きな価値を引き出すようになっています。新たな収益源を獲得する機会となるほか、効率の向上や、リスク管理まで、エージェントを活用した業務の再構築は、企業のリーダーにとって最優先事項となっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">そこで Google は、</span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\"> を構築しました。これは、いわゆる System of Action（行動のシステム）であり、その設計思想として、ウォールド ガーデン（閉じられた環境）を取り払ってあらゆるデータを有効活用する、高精度と信頼性を実現する、低コストでプロアクティブに運用する、といったことを重視しています。</span><strong style=\"vertical-align: baseline;\">PayPal、Siemens、Telus、Vodafone、Walmart</strong><span style=\"vertical-align: baseline;\"> などの大手企業は、すでに Google とともにビジネス上の成果を上げています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、Google の Agentic Data Cloud の主な最新情報をお知らせします。Google は、あらゆる場面でエージェントを強化するとともに、企業ごとのコンテキストに基づいてグラウンディングしながら正確で信頼できる回答を提供するなど、エージェント主体のエクスペリエンスを技術者とビジネス ユーザーの両方にとって優れたものにしています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ボーダーレスな Lakehouse で、エージェントがあらゆるデータを有効活用</strong></h4>\n<p><span style=\"vertical-align: baseline;\">企業データは、マルチクラウド環境やオンプレミス システム、SaaS プラットフォーム（Confluent、SAP、Salesforce、Workday など）まで、あらゆる場所に存在します。オープンな Apache Iceberg 形式を基盤とする</span><a href=\"https://cloud.google.com/products/lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレスな Lakehouse</span></a><span style=\"vertical-align: baseline;\"> により、データの保存場所を問わず、あらゆるデータを活用することが可能となっており、エージェントは一元管理された基盤を利用できます。この基盤のもとでは、データを移動したり、コネクタを組み合わせたりする必要はなく、想定外の下り（外向き）料金が発生することもありません。インフラストラクチャからモデルまで、あらゆるレイヤで調整済みのスタックを利用できます。実際、Apache Iceberg で管理されているデータは、過去 1 年間で 3 倍以上に増加しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでは、ボーダーレスな Lakehouse に関連する新しい機能強化をいくつかご紹介します。</span><strong style=\"vertical-align: baseline;\">Gemini が</strong><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/borderless-lakehouse-integrates-with-gemini\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレスな Lakehouse と直接連携</strong></a><span style=\"vertical-align: baseline;\">できるようになりました。これにより、ビジネス ユーザーはクラウド全体に分散したレコードに対して、自然言語でクエリすることが可能となります。また、エージェントは推論をグラウンディングできるようになり、ビジネス ワークフローの促進につながります。さらに、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-cross-cloud-data-access\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AWS および Azure 向けの Cross-Cloud Interconnect とキャッシュ保存</strong></a><span style=\"vertical-align: baseline;\">が一般提供となり、プライベートで安全な接続を通じて、下り（外向き）料金を追加で支払うことなく、クラウド間でデータをクエリできるようになりました。外部のクラウドデータに対してクエリを実行すると、Lakehouse は取得したデータブロックを Google Cloud 内に自動的にキャッシュ保存します。さらに、Databricks Unity、Snowflake Horizon、AWS Glue とのオープンな Iceberg カタログ連携や、SAP、Workday、Salesforce とのゼロコピー統合も利用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI にコンテキストを提供するため、</span><strong style=\"vertical-align: baseline;\">ボーダーレスな Lakehouse は Knowledge Catalog と直接統合</strong><span style=\"vertical-align: baseline;\">されています。Knowledge Catalog はクラウド ストレージ内の分散データや非構造化データに自動的にインデックスを付与し、エージェントが適切なコンテキストに基づき正確性を得られるようにします。また、トークン費用も抑えられ、インテリジェントで持続可能なエージェント戦略を実現できます。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「Delivery Hero talabat はボーダーレスな Lakehouse において、Amazon S3 テーブルから Apache Iceberg 形式の単一の元データを BigQuery に連携させることで、データ移動の費用を約 40% 削減しました。また、本番環境のストリーミング トランザクション イベントに対して両方のクラウドから数分以内にクエリできます。」</span><strong style=\"vertical-align: baseline;\">-</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Delivery Hero talabat、スタッフ データ エンジニア、Harish Ramesh 氏</strong></p>\n<p><span style=\"vertical-align: baseline;\">エージェントがただちにアクションを実行するには、過去の分析データとリアルタイムのトランザクション データの両方に同時にアクセスする必要があります。そこで、</span><a href=\"https://cloud.google.com/products/alloydb\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB</strong></a><strong style=\"vertical-align: baseline;\"> とボーダーレスな Lakehouse の新たなインテグレーション</strong><span style=\"vertical-align: baseline;\">についてお知らせいたします。</span><a href=\"https://cloud.google.com/blog/ja/products/databases/direct-iceberg-access-in-alloydb?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB から Iceberg に直接アクセス</span></a><span style=\"vertical-align: baseline;\">することで、ETL パイプラインやコピーを使うことなく、Cloud Storage に保存されている Iceberg テーブルに直接クエリを実行できるようになり、単一の PostgreSQL クエリで本番環境の運用データと過去のレイクハウス データを結合することが可能となります。AlloyDB のトランザクション機能と Iceberg テーブルへの直接アクセスを組み合わせることで、トランザクション データと分析データを効率的に組み合わせて、エージェントからの厳しい要求に応えられるようになります。また、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse ランタイム カタログ</span></a><span style=\"vertical-align: baseline;\">と完全に統合されているため、AlloyDB に Iceberg テーブルを他のテーブルと同じように登録できます。これらのテーブルはすべて Knowledge Catalog に自動的に反映されるため、エージェントはガバナンスが適用された共通のコンテキストを取得できます。AlloyDB から Iceberg への直接アクセスは、集計クエリにおいて、Amazon の同等の PostgreSQL 互換サービスよりも最大 7 倍高速です。</span></p>\n<p><span style=\"vertical-align: baseline;\">このボーダレス戦略の完成度をさらに高めるのが、すでに一般提供となっている </span><a href=\"https://cloud.google.com/products/spanner/omni\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Omni</span></a><span style=\"vertical-align: baseline;\"> です。これにより、オンプレミス、エッジノード、マルチクラウド環境にまたがるハイブリッド エージェント アプリケーションに、Google グレードの整合性、スケール、マルチモデル機能がもたらされます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">個々のエージェントを企業のコンテキストにグラウンディングして、正確かつ信頼できる回答を提供</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェントの精度は、グラウンディングの基盤となるビジネス コンテキストの質に左右されます。</span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> は、Google Cloud のユニバーサル コンテキスト エンジンであり、元データを共有ビジネス コンテキストに変換して、エージェントがより高い精度、信頼性、トークン効率で回答、行動できるようにします。このたび、Knowledge Catalog がさらに進化し、AI を活用したコンテキスト キュレーション機能が拡張されました。具体的には、</span><strong style=\"vertical-align: baseline;\">自己学習機能、再利用可能なコンテキスト セット、刷新されたユーザー エクスペリエンス</strong><span style=\"vertical-align: baseline;\">によって、コンテキスト レイヤがビジネスに応じて自動的に構築されて進化し続けるほか、人間がデータ ガバナンスを完全に制御できるようになっています。Google 社内のベンチマークによると、Knowledge Catalog の使用により、AI エージェントの精度が約 4 倍向上し、レイテンシは最大 33% 短縮、トークン使用量は最大 75% 削減しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">企業の組織内で培われたノウハウの多くは、データベースの中ではなく、運用ハンドブックや、ドキュメント、チケットに記されています。そのため、エージェントのコンテキストは、人々が実際に尋ねる質問に寄せながらキュレートする必要があります。Knowledge Catalog の新しい</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/knowledge-catalog-self-learning-context-enrichment-for-ai-agents\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">自己学習型エンリッチメント</strong></a><span style=\"vertical-align: baseline;\">（プレビュー版）では、コンテキスト キュレーションという重労働をエージェントが担います。具体的には、Knowledge Catalog が、Google Workspace、GitHub、Jira、Confluence、SharePoint などの非構造化ソースを継続的にマイニングし、ユーザー インテントや人間とエージェント間のあらゆるやり取りから学習して、コンテキストを補いながら自動的に進化させます。また、ローカルな知識を </span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Knowledge Format</span></a><span style=\"vertical-align: baseline;\">（OKF）コンテキスト セットにパッケージ化して再利用できるようにすることで、コンテキスト エンジニアやデータ スチュワードが拡充されたコンテキストを簡単に管理できるようにしています。さらに、データ スチュワードとデータチーム向けに、</span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog の新しい Studio エクスペリエンス</strong></a><span style=\"vertical-align: baseline;\">（プレビュー版）も導入されました。会話型ユーザー インターフェースを通じて、自然言語でコンテキストを探索したり、クラウド環境および SaaS アプリケーションにまたがるデータ資産全体を可視化したり、提案されたコンテキスト拡充点をチェック、監査、承認したりできます（バージョニングとロールバック機能も完備されています）。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4-Navigating the context graph visually in Knowledge Studio\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4-Navigating_the_context_graph_visually_in_Knowledge_Studio_OFTQhZt.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Knowledge Catalog の新しい Studio インターフェースでは、会話を通してコンテキストを探索でき、図がインタラクティブに変化します</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">さらに、</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805#:~:text=Knowledge%20Catalog%3A,ensure%20factual%20responses.\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog が Gemini でデフォルトで有効</strong></a><span style=\"vertical-align: baseline;\">になりました（現在プレビューとして公開中）。これにより、データに関するあらゆる質問が、適切に管理されたビジネス コンテキストに自動的にグラウンディングされるようになります。Knowledge Catalog は、BigQuery、AlloyDB、Cloud SQL、Spanner との接続を経て、ビジネス用語の解決、信頼できるテーブルの特定、結合パスの判断までを行い、各ユーザーのアクセス権も考慮しながら SQL を生成します。こうした仕組みにより、エージェントは登録済みの共有コンテキスト セットに基づいて精度を一貫して確保できるほか、レイテンシの短縮やトークン費用の削減にもつながり、組織は自信をもってエンタープライズ規模でエージェントをデプロイすることが可能となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">なお、重要なビジネス定義については LLM の推量に任せることはできません。そこで役立つのが、Knowledge Catalog が</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/expanded-semantic-model-support-in-knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">信頼できるセマンティック モデルにエージェントをグラウンディング</span></a><span style=\"vertical-align: baseline;\">する機能であり、このたび一般提供となりました。グラウンディングのソースは BigQuery、Looker（LookML）、Databricks、Snowflake、dbt、SAP に対応しており、データの移動は発生しません。これにより、財務上の純収益から、業務上の顧客離脱率の計算まで、ビジネスチームが使用している適切に管理された数式と同じものを使用できます。さらに、Knowledge Catalog では、メタデータの検出およびフェデレーションを Oracle AI Database@Google Cloud、Snowflake、Databricks Unity Catalog や、サードパーティのカタログ（Atlan、Collibra など）にも拡張できます。これにより、既存のカタログを活用しながら、データ資産全体を普遍的に理解することがあらゆるエージェントで可能となります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">実務担当者のエージェント エクスペリエンスを変革</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、データ専門家やビジネスチームの働き方をまったく新しいものへと変革します。具体的には、個々の従業員は、アシスタントという相棒のサポートを受けながら働く実務担当者から、自律型エージェントのオーケストレーターへと進化し、これらのエージェントが意図に基づきビジネスの成果を促進していく、という形になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">先日の </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini at Work</span></a><span style=\"vertical-align: baseline;\"> イベントでは、技術チームと一般的なビジネス ユーザーのそれぞれに向けた Gemini の 2 つの新機能を紹介しました。データ エンジニアや ML エンジニア向けには、Gemini の ML スキルやツールが拡張されており、エージェント群がこれらを使ってあらゆるデータ サイエンティストやデータ エンジニアを支えます。エンジニアが求める結果を平易な言葉で説明すると、Gemini が PySpark コードの生成はもとより、それを編集してテストするためのノートブックの提供、モデルのトレーニング、パイプラインの問題のトラブルシューティングおよび修正までを行います。一方、ビジネス ユーザーは誰でも、質問するだけで信頼性の高いリアルタイムの業務レポートを生成できます。Gemini の業務レポート生成スキルが BigQuery および Knowledge Catalog と統合され、クエリを構築して保存するところまでを行います。クエリをいったん保存すれば、オンデマンドでレポートを実行し、トークン費用を生じさせることなく、毎回検証を経た一貫性のある回答を確実に得られるようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、これまでどおり独自ツールを使い続けたいデベロッパーのために、</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/data-agent-kit-brings-data-skills-and-tools-to-your-ide-or-cli?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> の一般提供が近ごろ発表されました。Google データクラウド ツールを、デベロッパーが自分の好きな IDE や CLI（VS Code、Claude Code、Antigravity など）に直接統合できるため、コンソールを切り替えたり、お決まりの ETL 処理を記述したりする必要がなくなります。具体的には、ネイティブの MCP ツールが完備されており、ビジネス インテントを定義するだけで、エージェントにデータ パイプラインの生成、調整、テストを任せられます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェントの規模に対応するデータ インフラストラクチャの構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ワークフロー内で連携するエージェント数が数百万単位へと規模が拡大すると、従来のデータベース アーキテクチャでは破綻に陥ります。Google は、このようなエージェントの規模に対応できるよう、特別に設計、カスタマイズされたインフラストラクチャの導入に取り組んでいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">迅速なテストとプロトタイピングを促進するため、このたび </span><a href=\"https://cloud.google.com/blog/ja/products/databases/introducing-alloydb-express-for-rapid-testing-and-prototyping\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Express</strong></a><span style=\"vertical-align: baseline;\"> のプレビュー版をリリースいたします。これは、開発速度を極限まで高めたいビルダーやコーディング エージェント向けに設計された、AlloyDB の新しいエディションです。このエディションは、2 秒未満の即時プロビジョニングをはじめ、ゼロへのスケーリング（一時停止）と再開、安全なプライベート IP 接続、オブザーバビリティの統合、小さなフットプリント（1～2 個の vCPU と 20 GB のストレージ）という特徴があります。この AlloyDB は、主にデベロッパーに対して、エージェントの開発およびテストのための PostgreSQL 環境を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">一方、本番環境向けに、</span><a href=\"https://cloud.google.com/blog/ja/products/databases/announcing-postgresql-for-agents-in-alloydb?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB のエージェント向け PostgreSQL</strong></a><strong style=\"vertical-align: baseline;\">（プレビュー版）</strong><span style=\"vertical-align: baseline;\">を最近発表しました。これを使えば、ワークロードを完全に分離した状態で、連携動作する数千の AI エージェントが本番環境のトランザクション データにクエリすることが可能となります。この</span><a href=\"https://cloud.google.com/blog/ja/products/databases/alloydbs-agentic-database-architecture\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント対応のデータベース アーキテクチャ</span></a><span style=\"vertical-align: baseline;\">では、ミリ秒未満の I/O およびテラビット/秒の合計スキャン スループットが実現され、エージェントが 1 秒あたりに処理可能なクエリ数が 300 万以上に達します。コンピューティング リソースは、アクティブな推論セッションに基づいて自動的にスケールされ、アイドル状態になると本番環境システムに影響を与えることなくゼロにスケールダウンされます。</span></p>\n<p><span style=\"vertical-align: baseline;\">オープンソースのデータ インフラストラクチャ実行環境に関しては、</span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> が Lightning Engine のさらなる改善により、市場の同等サービスと比較してコスト パフォーマンスが 3 倍以上になっています。</span><a href=\"https://spark.apache.org/releases/spark-release-4-0-0.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spark 4.0</span></a><span style=\"vertical-align: baseline;\"> に対して最近行った機能強化により、起動が高速化されており（追加費用なし）、インタラクティブなワークロードや小規模なバッチ ETL ジョブにおいて効果を発揮します。さらに、</span><a href=\"https://docs.cloud.google.com/managed-spark/docs/tiers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">プレミアム ティア</span></a><span style=\"vertical-align: baseline;\">では、アップグレードされたハードウェアと Lightning Engine のソフトウェア アクセラレーションの組み合わせによりパフォーマンスが向上しており、これはデフォルトで有効になっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、エージェントのスケールに対応できるよう、</span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\"> の強化にも継続的に取り組んでいます。この過去 1 年間だけに限っても、流動的なスケーリングおよび組み込みのワークロード アクセラレーションなどのインテリジェントな最適化により、クエリ処理のコストを 50% 以上削減し、40% 以上高速化しました。また、</span><a href=\"https://docs.cloud.google.com/bigquery/docs/graph-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery Graph</strong></a><span style=\"vertical-align: baseline;\"> の一般提供が始まり、ペタバイト規模のグラフ分析をリレーショナル テーブルで直接、ETL なしで実行できるようになりました。BigQuery Graph でデータをノードおよびエッジとしてモデル化できるため、データを別のグラフ データベースに移動することなく、複雑で隠れた関係を明らかにすることが可能となります。さらにこのたび、Google Research が提供する 2 つの新しいモデルを BigQuery でネイティブに実行できるようになりました。1 つ目は、現在プレビュー版の </span><a href=\"https://research.google/blog/timesfm-3-a-zero-shot-foundation-model-for-multivariate-forecasting/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TimesFM 3.0</span></a><span style=\"vertical-align: baseline;\"> であり、カスタムモデルをトレーニング、管理しなくても、SQL で直接予測を生成できます。2 つ目は、同じくプレビュー版の </span><a href=\"https://research.google/blog/introducing-tabfm-a-zero-shot-foundation-model-for-tabular-data/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TabFM</span></a><span style=\"vertical-align: baseline;\"> であり、BigQuery に予測 ML を直接組み込めます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">上でお伝えした事柄に加えて、Google は、より広範なデータ エコシステム全体を通じて、コア パフォーマンス、コスト管理、運用レジリエンスの強化を継続的に行っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">データ資産をアクティブな System of Action に変革する準備はできていますか？</span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\"> のページをご覧になるとともに、</span><a href=\"https://cloud.google.com/resources/offers/data-strategy-workshop\"><span style=\"text-decoration: underline; vertical-align: baseline;\">データ戦略ワークショップにご登録</span></a><span style=\"vertical-align: baseline;\">ください。Google Cloud で、エージェント時代のエンタープライズの</span><a href=\"https://cloud.google.com/free\"><span style=\"text-decoration: underline; vertical-align: baseline;\">構築を無料で始めましょう</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、デジタル イベント「</span><a href=\"https://cloudonair.withgoogle.com/events/trusted-agents-real-outcomes-agentic-data-cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Trusted Agents, Real Outcomes（信頼できるエージェント、確かな成果）</span></a><span style=\"vertical-align: baseline;\">」では、Agentic Data Cloud のビジョンと最新のイノベーションを紹介していますので、こちらもどうぞご覧ください。ポートフォリオの実際の活用例や、Yahoo の実例を紹介するほか、データベース、データ分析、BI のプロダクト リーダー陣が詳細な解説を行っています。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データクラウド プロダクト戦略および成長担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Sirish Chandrasekaran</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト管理およびデータベース担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Raj Pai</strong></p></div>"
