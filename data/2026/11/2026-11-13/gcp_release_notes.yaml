    "title": "November 13, 2026"
    "link": "https://docs.cloud.google.com/release-notes#November_13_2026"
    "published": "2026-11-13 17:00:00"
    "fetched": "2026-11-14 09:10:27"
    "summary": "<h2 class=\"release-note-product-title\">Access Approval</h2>\n<h3>Feature</h3>\n<p>Cloud Quotas is generally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>).</p>\n<h2 class=\"release-note-product-title\">Access Transparency</h2>\n<h3>Feature</h3>\n<p>Cloud Quotas is generally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>).</p>\n<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>BigQuery connections to <a href=\"https://docs.cloud.google.com/bigquery/docs/connect-to-mysql\">MySQL</a>,\n<a href=\"https://docs.cloud.google.com/bigquery/docs/connect-to-oracle\">Oracle</a>, and\n<a href=\"https://docs.cloud.google.com/bigquery/docs/connect-to-postgresql\">PostgreSQL</a> are now available and can be\nused to run <a href=\"https://docs.cloud.google.com/bigquery/docs/mysql-federated-queries\">MySQL federated queries</a>,\n<a href=\"https://docs.cloud.google.com/bigquery/docs/oracle-federated-queries\">Oracle federated queries</a>, and\n<a href=\"https://docs.cloud.google.com/bigquery/docs/postgresql-federated-queries\">PostgreSQL federated queries</a>.\nThese features are in <a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>.</p>\n<h2 class=\"release-note-product-title\">Bigtable</h2>\n<h3>Feature</h3>\n<p>You can use the Google Cloud console to view and analyze read and write access\npatterns for your Bigtable instances and clusters, including request volume,\nlatency, bandwidth, and row scan metrics broken down by query type. This feature\nis <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/bigtable/docs/access-patterns\">Analyze access patterns</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Run</h2>\n<h3>Feature</h3>\n<p><a href=\"https://docs.cloud.google.com/run/docs/configuring/ambient-networking\">Ambient networking</a> in\nCloud Run simplifies workload traffic management, security, and observability\nby routing through a fully managed, per-instance Envoy sidecar\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>).</p>\n<h3>Feature</h3>\n<p>Use <a href=\"https://docs.cloud.google.com/run/docs/configuring/express-links\">express links</a> with Cloud Run\n<a href=\"https://docs.cloud.google.com/run/docs/configuring/ambient-networking\">ambient networking</a> to connect\nCloud Run services without writing authentication code or configuring a service\nmesh (<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>).</p>\n<h2 class=\"release-note-product-title\">Cloud SQL for MySQL</h2>\n<h3>Feature</h3>\n<p>Cloud SQL enhanced backups support instances with disaster recovery (DR)\nreplica instances. You can associate a Backup and DR backup plan directly with a\nprimary instance that has a designated DR replica.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/backup-options#eb-dr-replicas\">Choose your backup\noption</a> and\n<a href=\"https://docs.cloud.google.com/sql/docs/mysql/backup-recovery/manage-enhanced-backups\">Manage enhanced\nbackups</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud SQL for PostgreSQL</h2>\n<h3>Feature</h3>\n<p>Cloud SQL enhanced backups support instances with disaster recovery (DR)\nreplica instances. You can associate a Backup and DR backup plan directly with a\nprimary instance that has a designated DR replica.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/sql/docs/postgres/backup-recovery/backup-options#eb-dr-replicas\">Choose your backup\noption</a> and\n<a href=\"https://docs.cloud.google.com/sql/docs/postgres/backup-recovery/manage-enhanced-backups\">Manage enhanced\nbackups</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud SQL for SQL Server</h2>\n<h3>Feature</h3>\n<p>Cloud SQL enhanced backups support instances with disaster recovery (DR)\nreplica instances. You can associate a Backup and DR backup plan directly with a\nprimary instance that has a designated DR replica.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/backup-recovery/backup-options#eb-dr-replicas\">Choose your backup\noption</a> and\n<a href=\"https://docs.cloud.google.com/sql/docs/sqlserver/backup-recovery/manage-enhanced-backups\">Manage enhanced\nbackups</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise</h2>\n<h3>Feature</h3>\n<p><strong>Gemini Enterprise: Single-user quota limits for AI developer tools</strong></p>\n<p>Single-user quota limits apply to AI developer tools, including Google\nAntigravity, in the Gemini Enterprise Standard and Gemini Enterprise Plus\neditions. For AI developer tools, the quota multiplier applies to the weekly\nquota and resets on each user's seven-day cycle.</p>\n<p>This feature is generally available (GA). For more information, see\n<a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/quotas-and-pay-as-you-go-usage#single-user-quota-limits\">Single-user quota\nlimits</a>\nand <a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/feature-usage#configure-single-user-quota-limit\">Configure a single-user quota\nlimit</a>.</p>\n<h2 class=\"release-note-product-title\">Looker</h2>\n<h3>Announcement</h3>\n<p>Beginning November 9, 2026, the following features will be automatically enabled for Looker (original) and Looker (Google Cloud core) instances running Looker 26.22.</p>\n<h3>Feature</h3>\n<p>Looker (original) now supports <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-authentication-google#mirroring\">Google Group mirroring</a>, which lets administrators automatically assign Looker roles and groups that are based on Google Groups membership. The updated <strong>Google Authentication</strong> admin page also adds <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-authentication-google#advanced_role_management\">advanced role management</a> and <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-authentication-google#configuring_google_authentication_using_the_api\">programmatic configuration through the Looker API</a>.</p>\n<h3>Change</h3>\n<p>We will begin billing for usage of Gemini-assisted features that exceeds their instance token allocation. Gemini-assisted features are a set of agentic capabilities that include Conversational Analytics and other generally available features that use Gemini.</p>\n<p>Looker admins can prepare for the billing of this usage by associating their Looker instance with a Google Cloud project that has a valid billing account. You can specify a Google Cloud project on your instance's <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-platform-gil#designate-billing-project\"><strong>Gemini in Looker</strong> admin page</a>.</p>\n<h3>Feature</h3>\n<p>Looker visualizations now support grouping rows or pivot columns that are outside of row or column limits into a consolidated \"Other\" category. When you use <a href=\"https://docs.cloud.google.com/looker/docs/table-options#limit_displayed_rows\">Limit Displayed Rows</a> or <a href=\"https://docs.cloud.google.com/looker/docs/table-options#limit_displayed_pivot_columns\">Limit Displayed Pivot Columns</a>, select <strong>Group remaining rows into 'Other'</strong> or <strong>Group remaining pivots into 'Other'</strong> to display the top N rows or pivot columns alongside an aggregated \"Other\" category. You can also customize the category label and, for some chart types, choose a custom color.</p>\n<p>Row grouping is supported on table, bar, column, line, area, scatterplot, pie, and donut multiples visualizations. Pivot grouping is supported on table, bar, column, line, area, and scatterplot visualizations.</p>\n<h3>Feature</h3>\n<p>When you <a href=\"https://docs.cloud.google.com/looker/docs/downloading#filter_and_query_metadata\">download Looks, Explores, or dashboard tiles</a>, you can include filter and query information in the downloaded file. PNG images can include a filter banner, and Excel workbooks can include query metadata and filter sheets. Dashboard editors can set the default Excel metadata option for tile downloads in the <a href=\"https://docs.cloud.google.com/looker/docs/editing-user-defined-dashboards#download-add-query-metadata-sheet\">dashboard settings</a>. When you download a <a href=\"https://docs.cloud.google.com/looker/docs/tabbed-dashboards#download-pdf\">tabbed dashboard as a PDF</a>, you can choose whether all dashboard filters appear at the top of the PDF or each tab's active filters appear under that tab's header.</p>\n<h3>Feature</h3>\n<p>Looker administrators can now opt in to the <a href=\"https://docs.cloud.google.com/looker/docs/db-config-google-bigquery#official-jdbc-driver\">official Google BigQuery JDBC driver</a> (<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>) on <a href=\"https://docs.cloud.google.com/looker/docs/db-config-google-bigquery\">BigQuery connections</a>. The new driver is built and supported by Google and will replace the current Looker legacy driver in a future release.</p>\n<p>To try the driver, perform the following steps:</p>\n<ol>\n<li>Open the <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-database-connections\"><strong>Connections</strong></a> admin page by selecting <strong>Admin &gt; Database &gt; Connections</strong>.</li>\n<li>Click the <strong>Edit</strong> button for a BigQuery connection. (See <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-database-connections#editing-connections\">Editing connections</a> for more information.)</li>\n<li>Turn off the <a href=\"https://docs.cloud.google.com/looker/docs/db-config-google-bigquery#stable_driver\"><strong>Use latest stable driver</strong></a> toggle on the connection.</li>\n<li>From the <a href=\"https://docs.cloud.google.com/looker/docs/connecting-to-your-db#driver-version\"><strong>Driver Version</strong></a> drop-down menu, choose one of the <strong>BigQuery Official [Preview]</strong> driver options.</li>\n<li>Select <strong>Test</strong> to <a href=\"https://docs.cloud.google.com/looker/docs/db-config-google-bigquery#testing_the_connection\">check the connection</a>, and then select <strong>Update Connection</strong>.</li>\n</ol>\n<p>Note the following details:</p>\n<ul>\n<li>Existing connections continue to use the current driver unless an administrator opts in.</li>\n<li>You can switch back at any time by choosing the previous <a href=\"https://docs.cloud.google.com/looker/docs/connecting-to-your-db#driver-version\">driver version</a>.</li>\n</ul>\n<p>If you encounter an issue during the Preview of Looker support of the official BigQuery driver, report it to <a href=\"mailto:cloud-looker-dialects@google.com\">cloud-looker-dialects@google.com</a>.</p>\n<h3>Change</h3>\n<p>When you <a href=\"https://docs.cloud.google.com/looker/docs/downloading#downloading_a_dashboard_as_a_pdf\">download a dashboard as a PDF</a> or <a href=\"https://docs.cloud.google.com/looker/docs/scheduling-and-sending-dashboards#expand_tables_to_show_all_rows\">set up a PDF dashboard delivery</a>, selecting <strong>Expand tables to show all rows</strong> makes the <strong>Fit Page to Dashboard</strong> option unavailable and sets <strong>Paper Size</strong> to <strong>A4</strong>, with page breaks enabled by default.</p>\n<h3>Feature</h3>\n<p>The Sankey chart type is now generally available. Sankey charts visualize the flow and distribution of data between categories, stages, or states. Sankey charts are especially useful for analyzing multi-step pathways, such as customer journeys, website navigation flows, or resource allocations across different systems. Learn more about using <a href=\"https://docs.cloud.google.com/looker/docs/sankey-options\">Sankey charts</a> in Looker.</p>\n<h3>Breaking</h3>\n<p>Two-factor authentication (2FA) is now enabled by default for all new and existing Looker (original) instances that use email and password authentication and that didn't opt out during the advance opt-out window. Administrators retain full control to manage or disable 2FA by using the <a href=\"https://docs.cloud.google.com/looker/docs/admin-panel-authentication-two-factor\"><strong>Admin &gt; Authentication &gt; Two-Factor</strong> panel</a>.</p>\n<h2 class=\"release-note-product-title\">Managed Service for Apache Airflow</h2>\n<h3>Breaking</h3>\n<p><em>(Airflow 3.3.1, 3.2.2, and 2.11.1)</em> Upgraded the <code>pip</code> package from version\n23.2.1 to version 26.2.2. This update is available in Managed Airflow (Gen 3)\nbuilds <code>composer-3-airflow-3.3.1-build.8</code>,\n<code>composer-3-airflow-3.2.2-build.12</code>, and <code>composer-3-airflow-2.11.1-build.25</code>\nand later, and in the Managed Airflow (Gen 2) image\n<code>composer-2.18.0-airflow-2.11.1</code> and later.</p>\n<p>This version includes security fixes and changes how custom PyPI packages are\ninstalled:</p>\n<ul>\n<li><strong>PEP 440 version specifiers</strong>: <code>pip</code> 26.2.2 enforces\n<a href=\"https://peps.python.org/pep-0440/#version-specifiers\">PEP 440</a> compliance\nand supports the <code>.*</code> wildcard only with <code>==</code> and <code>!=</code>. For example, use\n<code>gcsfs&gt;=0.8</code> instead of <code>gcsfs&gt;=0.8.*</code>.</li>\n<li><strong>Isolated source builds</strong>: source packages (<code>.tar.gz</code>) are always built in\nan isolated environment. If you install source packages from a private\nrepository that is your only package index, make sure that the repository\ncontains precompiled wheel packages (<code>.whl</code>) for <code>setuptools</code> and any other\nbuild dependencies (listed under <code>[build-system] requires</code> in\n<code>pyproject.toml</code>). Alternatively, publish your packages as <code>.whl</code> packages.\nAs a temporary workaround to disable build isolation, add\n<code>no-build-isolation = false</code> to the <code>[global]</code> section of your <code>pip.conf</code>\nfile. This workaround works only if the build dependencies are already\ninstalled in your environment.</li>\n<li><strong>Legacy <code>pkg_resources</code> builds</strong>: older source packages that rely on\n<code>pkg_resources</code> might fail to build. Use newer package versions with\nprecompiled <code>.whl</code> packages, or for your own private packages, build them\nas <code>.whl</code> packages or update their build scripts so that they don't use the\nlegacy <code>pkg_resources</code> module.</li>\n</ul>\n<p>Make sure that your custom PyPI packages are compatible with these changes\nbefore you upgrade your environment. If the installation of PyPI packages fails\nduring an upgrade, your environment keeps running with its current version and\npackages.</p>\n<h2 class=\"release-note-product-title\">Resource Manager</h2>\n<h3>Change</h3>\n<p>Essential Contacts write operations (<code>CreateContact</code>,\n<code>UpdateContact</code>, <code>DeleteContact</code>, and <code>SendTestMessage</code>) in the <code>v1</code> API now\ngenerate <a href=\"https://docs.cloud.google.com/logging/docs/audit#admin-activity\">Admin Activity audit logs</a>\n(<code>ADMIN_WRITE</code>) in addition to Data Access audit logs (<code>DATA_WRITE</code>). If you\nhave Data Access audit logs enabled for Essential Contacts,\nthese operations generate both an Admin Activity log entry and a Data Access\nlog entry.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/resource-manager/docs/essential-contacts-audit-logging#admin-activity-write-logs\">Essential Contacts audit logging</a>.</p>"
