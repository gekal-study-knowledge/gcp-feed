"overview": |
  この日は Google Cloud Blog から 5 本で、Organization Policy のエージェント対応とネットワーク・セキュリティ運用の発表が中心でした。Organization Policy Service では、Model Context Protocol (MCP) サーバーの一般提供と、Gemini による自然言語での制約記述が発表されました。MCP サーバーは自律エージェントやパイプラインが Organization Policy と直接やり取りするためのツールを提供するため、管理者が複雑な階層チェーンを手でたどらずに済みます。100 を超える定義済みポリシーとカスタム組織のポリシーを組み合わせて、リソース階層全体にガードレールを敷けます。ネットワークでは、パートナー Cross-Cloud Interconnect がラストマイルに拡張され、Lumen Technologies とのプレビューとして提供が始まりました。昨年のオープン仕様に基づく AWS 向け提供に続くもので、プライベートクラウド、オンプレミスのデータセンター、ネオクラウド、他のクラウドへ数分でプロビジョニングできるマネージドサービスとして高帯域の接続を広げます。セキュリティ運用では、SentinelOne と Google Security Operations の統合が作り直され、エンドポイントのテレメトリを中間のクラウドバケット経由で回さずに届けることで、取り込みのレイテンシと運用負荷を下げられるようになりました。Chrome Enterprise Premium については、ヘルスケアでの保護強化が紹介されました。EHR や臨床アプリがウェブに移り、臨床チームが文書作成やチャートの要約、複数ステップの作業を代行する AI エージェントをブラウザで使うようになったことを踏まえ、機密データのコピー・ペースト・フォーム送信・印刷・画面キャプチャを制限する DLP と、詳細なレポートによる可視性を提供します。このほか、Gartner が初めて公開したデータレイクハウスプラットフォームの Magic Quadrant で、Google がリーダーかつビジョンの評価軸で最も先に位置づけられたことが紹介されました。
