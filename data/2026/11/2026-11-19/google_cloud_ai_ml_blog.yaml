    "id": "c4c2578354121ac4338ad838b382a1d7"
    "title": "Sashiko: Lessons from building an agentic code review system for Linux"
    "link": "https://cloud.google.com/blog/products/application-development/lessons-from-building-sashiko-an-agentic-code-review-system/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 07:50:54"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The speed of development in large open-source projects has always been limited by code review, not code generation. Even as coding agents get better at writing code, they do not accelerate development on their own. This is especially true of patches to the Linux kernel. Without a way to build trust in proposed changes, more generated code simply piles up in front of the same small group of human maintainers. Some of those patches are solid changes, just written faster; many others are plausible-looking \"AI slop\" sent by contributors who do not fully understand the systems they are modifying. And the influx of AI-generated security reports, many of which are duplicates or inaccurate, only adds to maintainers’ load.</span></p>\n<p><span style=\"vertical-align: baseline;\">Linux runs billions of Android phones, most cloud providers, and nearly every supercomputer. It spans more than 35 million lines of code, and over 85,000 changes land every year. Automated build bots and fuzzers like </span><a href=\"https://github.com/google/syzkaller\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Syzkaller</span></a><span style=\"vertical-align: baseline;\"> catch build errors and crashes, but code review has always been the main way to guarantee the stability and safety of the kernel. Every day, maintainers read hundreds and hundreds of proposed patches by hand to catch memory leaks, deadlocks, race conditions, and security bugs.</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_sIAzTvL.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>To help maintainers handle the load and catch bugs before they land, the <a href=\"http://aiinfra.google/\">Google AI &amp; Infrastructure</a> team built <a href=\"https://github.com/sashiko-dev/sashiko\"><b>Sashiko</b></a>, an open-source, agentic code review system powered by Gemini. We named the project after the Japanese word 刺し子, a stitching technique for artistically reinforcing worn cloth, and donated it to the Linux Foundation earlier this year.</p><p>In this blog, we cover the problem Sashiko was designed to solve, how it works, what the data shows, and what we learned from building and running it in the wild.</p><h3><b>Reviewing code is hard</b></h3><p>Reviewing a change in a complex code base is objectively hard, both for humans and LLMs. It often requires a deep understanding of how the system works in general, well outside the proposed change. In fact, it’s pretty common to see patches that engineers claim perfectly solve the problem, but if they were to be merged, would actually introduce even worse problems (albeit subtle). Traditionally, only experienced maintainers have been able to spot and prevent these issues. The same is true for agentically generated code.</p><p>To verify the correctness of a change, a potentially large number of invariants should be proven, which is often a much larger and harder task than developing the change itself. This is true for both human and agentic reviewers. However, LLM-based reviewers have some unique properties, both positive and negative:</p><ol><li><b>LLMs often struggle to put in enough effort.</b> LLMs are trained to achieve the goal of spending fewer tokens. So they often tend to cut corners and dismiss concerns without proper investigation or flag false positives without proper due diligence.</li><li><b>LLMs are easier to bias</b>. The current generation of LLMs usually performs much better if provided a single relatively simple task (e.g., prove the patch for memory leaks) rather than multiple tasks (e.g., explore several complex, varied concerns). It’s pretty common for an LLM to find an obvious issue in the code and refuse to look deeper for other types of issues. Also, commit log text can sometimes affect the result of code review in a non-predicatable or even malicious way.</li><li><b>LLMs don’t have persistent memory.</b> Surprisingly, this is a positive thing for code review: An LLM can review the same or similar patch multiple times as if it were a new patch. No sane human can review the same patch applied to 100 slightly different branches to find the few that have incompatible changes.</li></ol><h3><b>How Sashiko reviews a patch</b></h3><p>To avoid these failure modes, Sashiko separates <b>finding candidate bugs</b> from <b>verification of those bugs</b>, and requires each pass to record what it ruled out:</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Gather context and plan\\r\\n  -&gt; Parallel specialist sessions (concerns + dismissed concerns)\\r\\n  -&gt; Triage\\r\\n  -&gt; Per-bug deep checks\\r\\n  -&gt; Review report&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f2909ad0f50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Notes on each step:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gather context and plan:</strong><span style=\"vertical-align: baseline;\"> Sashiko first pulls in the code around the diff (modified functions, struct definitions, and direct callers) and loads the subsystem's domain guides, so the changed lines are never judged in isolation. A planner then decides which specialist passes are needed (skipping hardware checks on pure software code, for example) and sets a reasoning budget for each pass based on patch complexity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Parallel specialist sessions:</strong><span style=\"vertical-align: baseline;\"> Up to seven specialist sessions run in parallel, each focused on a single class of problems: commit intent, implementation match, control flow, resource lifetimes, locking, security, and hardware. Giving each pass a single focus prevents one type of bug from crowding out another. Each session searches and reads the repository with git tools (averaging about 100 tool calls per review) and outputs two lists: concerns it believes are real, and candidate concerns it investigated and ruled out, along with the code that supports that conclusion.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Triage:</strong><span style=\"vertical-align: baseline;\"> A lead verifier audits those two lists together. Clear-cut bugs already proven by the code in front of it pass straight through; dismissals proven by a local check are dropped. Everything else deserves additional investigation. Crucially, that includes not only contested bugs where specialists disagreed, but also </span><strong style=\"vertical-align: baseline;\">shaky self-dismissals </strong><span style=\"vertical-align: baseline;\">— cases where a specialist spotted a real bug and dismissed it by assuming, without proof, that some unseen caller or lock would prevent it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Per-bug deep checks:</strong><span style=\"vertical-align: baseline;\"> Instead of checking all difficult cases in one shared prompt, Sashiko gives each difficult case its own verification agent that runs in parallel. Each agent gets one specific question to answer with git tools under a symmetrical rule: Neither a bug claim nor a dismissal is accepted without concrete code proof across </span><span style=\"font-style: italic; vertical-align: baseline;\">all</span><span style=\"vertical-align: baseline;\"> call sites. If a specialist talks itself out of a real bug based on a false assumption, this step catches it and promotes it back to a real finding.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review report: </strong><span style=\"vertical-align: baseline;\">Sashiko generates a report that sounds like a human maintainer asking questions about the proposed change, matching the style expected on a Linux mailing list.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">All this happens at no cost for developers. Deep agentic reviews at scale require a substantial token budget. If developers had to pay for them with their own API keys, many important contributors would be pushed away. Instead, Sashiko reviews patches sent to public Linux kernel mailing lists, and Google runs the service at </span><a href=\"https://sashiko.dev\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sashiko.dev</span></a><span style=\"vertical-align: baseline;\">. Everything runs in the open: every prompt, tool call, reasoning step, and ruled-out bug is public. The project initially used the open-source Linux review prompts started by Chris Mason, and more than 100 contributors, including prominent kernel maintainers and engineers, have since helped to improve prompts and Sashiko itself. Recently, Sashiko switched to a different prompt system that combines per-tree or per-version auto-generated notes on code with subjective maintainers notes, which contain directions and instructions from maintainers that can’t be derived from the code.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What the data shows</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The real test of an automated reviewer is whether maintainers pay attention to the reports it sends out, and whether those reports track actual software quality. Seven months of Sashiko production data from the kernel mailing lists give a clear picture of both these questions.</span></p>\n<p><strong style=\"vertical-align: baseline;\">It is part of the daily workflow.</strong><span style=\"vertical-align: baseline;\"> Sashiko completes roughly 1200 reviews a day across over 100 kernel mailing lists. It sends review emails only to lists whose maintainers opt in, and already over 70 of them have done so. Developers also engage directly with the reports: More than 1500 kernel developers have replied on the mailing lists, and their pushback on false alarms has directly driven improvements to Sashiko's prompts and verification engine. In fact, </span><a href=\"http://lwn.net\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LWN.net</span></a><span style=\"vertical-align: baseline;\"> recently </span><a href=\"https://lwn.net/Articles/1096963/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">wrote</span></a><span style=\"vertical-align: baseline;\"> that </span><strong style=\"vertical-align: baseline;\">Sashiko has already become an important part of the kernel's development process</strong><span style=\"vertical-align: baseline;\"> and was </span><a href=\"https://lwn.net/Articles/1100241/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the top bug reporter</span></a><span style=\"vertical-align: baseline;\"> of issues in the 7.2 release cycle.</span></p>\n<p><strong style=\"vertical-align: baseline;\">It prevents new bugs and uncovers old ones.</strong><span style=\"vertical-align: baseline;\"> When Sashiko flags a bug in a proposed patch, the author typically fixes it in the next revision before the change is ever merged. Many developers run Sashiko locally or in corporate private instances. The bugs that Sashiko helped to prevent leave no trace in the git commit log, making them hard to count directly. What </span><span style=\"font-style: italic; vertical-align: baseline;\">can</span><span style=\"vertical-align: baseline;\"> be counted are fixes for preexisting bugs that Sashiko finds and reports as a byproduct of reviewing new changes: Sashiko is cited in over 2000 mainline kernel commits and in over 500 of this year's official Linux kernel CVEs, spanning drivers, core kernel code, networking, GPUs, memory management, and virtualization.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Fewer bugs are slipping into mainline releases.</strong><span style=\"vertical-align: baseline;\"> Across the 18 kernel releases prior to Sashiko (Linux 6.2 through 6.19, covering 254000 commits), an average of 3.4% of merged commits required a follow-up fix within 60 days. Since Sashiko rolled out, that 60-day fix rate has fallen to 2.8% in Linux 7.1 and 2.2% in Linux 7.2, </span><strong style=\"vertical-align: baseline;\">a 35% drop</strong><span style=\"vertical-align: baseline;\"> (with the 30-day fix rate falling from 2.3% to 1.4%). It’s too early to make strong claims, and obviously many other factors can influence release-to-release numbers, so we cannot solely credit Sashiko for the entire drop, but the trend is optimistic.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Since Sashiko was rolled out, the percentage of merged commits in the Linux kernel that received a follow-up fix in 60 days has dropped by 35%.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">A clean review carries real signal.</strong><span style=\"vertical-align: baseline;\"> If Sashiko's warnings were mostly noise, commits merged with warnings would need follow-up fixes no more often than commits that passed cleanly. In practice, across 21,500 tracked mainline commits, patches that received a clean Sashiko review required a follow-up fix within 60 days just 0.9% of the time — less than a third of the historical baseline. Patches merged despite a critical Sashiko warning needed a fix 7.6% of the time — an 8x higher risk (and 6.3x higher even after adjusting for patch size). </span></p>\n<p><span style=\"vertical-align: baseline;\">That gap is what makes Sashiko useful to maintainers: A clean pass instills real confidence, while a critical warning is a strong reason to take another look at the proposed patch.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_IdMDvr5.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This all tracks with what Linus Torvalds wrote in a mailing-list discussion a few weeks after Sashiko’s launch:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"As you say, Sashiko tends to be quite good. Even when it flags something unnecessarily and there's no actual problem, there's likely to be a reason for the question. And we've seen some truly stellar reports too. Things that are deep and subtle, and the AI is 100% correct. So anybody who thinks that all AI is slop is in denial about the current state.\"</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Linus Torvalds</strong><span style=\"vertical-align: baseline;\"> (</span><a href=\"https://lore.kernel.org/all/CAHk-=wi_drr4Ls9KtXW1k8L2FUDF0YdnyjvKmPgLXHDFnnRWEg@mail.gmail.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">on lore.kernel.org</span></a><span style=\"vertical-align: baseline;\">)<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 97.389%;\"><colgroup><col style=\"width: 48.2659%;\" /><col style=\"width: 51.7341%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Sashiko at a glance</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Since March 2026</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Patch reviews completed</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">241,000 (~1200+ / day)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Opted-in kernel subsystem lists</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">75+</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Mainline commits crediting Sashiko</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2,000+</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2026 Linux kernel CVEs crediting Sashiko</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">528</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">60-day post-merge fix rate</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Down from 3.4% baseline to 2.2% (Linux 7.2)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">What we learned from building and running Sashiko</strong></h3>\n<p><span style=\"vertical-align: baseline;\">First, </span><strong style=\"vertical-align: baseline;\">benchmark-driven development beats intuition.</strong><span style=\"vertical-align: baseline;\"> While developing Sashiko, we tried many ideas that looked very reasonable on their face but didn’t end up working out. Other ideas were less obvious but worked surprisingly well. What was crucial: Early on, we built a benchmark out of nearly 1,000 real Linux kernel bugs and used it to evaluate every major Sashiko change. Every bug in this set was a real mistake that had passed human review by kernel experts, had been merged into mainline Linux, and later had to be fixed. On that benchmark, Sashiko with the new </span><strong style=\"vertical-align: baseline;\">Gemini 4 Carbon</strong><span style=\"vertical-align: baseline;\"> model catches </span><strong style=\"vertical-align: baseline;\">75.8%</strong><span style=\"vertical-align: baseline;\"> of the bugs that human reviewers missed (using high thinking level).</span></p>\n<p><span style=\"vertical-align: baseline;\">Second, </span><strong style=\"vertical-align: baseline;\">coding agents are not great at reviewing their own code.</strong><span style=\"vertical-align: baseline;\"> Models are trained to produce a working solution within a limited token budget. Asking these agents to review their own code might work well for isolated tasks, but for real, large codebases, creating a functional solution is often just 5-10% of the work. What’s really hard is to produce a solution that works all of the time, is well-integrated into the surrounding code, and doesn’t introduce subtle regressions. This is often substantially more complex and requires additional effort. Similar to human developers, agents benefit from external code review: Reviewers often spot issues that the initial author missed, even if they are not more experienced.</span></p>\n<p><span style=\"vertical-align: baseline;\">Third, </span><strong style=\"vertical-align: baseline;\">open source and shared community ownership and development help to build trust.</strong><span style=\"vertical-align: baseline;\"> By being fully open and transparent from the <span style=\"vertical-align: baseline;\">beginning</span>, Sashiko allowed anyone to run it the way they wanted: using different models (including open source and local models), customizing prompts, or even adopting Sashiko to other-than-Linux projects. This helped with community adoption and brought over 100 contributors to improve Sashiko, including some prominent kernel developers.</span></p>\n<p><span style=\"vertical-align: baseline;\">More and more engineers are putting local Sashiko instances into their coding-agent loops, so patches are checked against the community's review rules before a human maintainer ever sees them. We use the same workflow to build Sashiko itself (\"Sashiko for Sashiko\"), running it to review every change to its codebase and prompt pipeline both locally and through a Github integration.</span></p>\n<p><span style=\"vertical-align: baseline;\">Although Sashiko started in the Linux kernel, the need for an agentic trust layer applies across critical open-source software. Because the core review engine does not depend on C or on kernel-specific rules, the Linux kernel playbook (combining an open verification pipeline, community-owned domain guides, and a benchmark mined from historically known issues and fixes) can likely be applied to other foundational open-source projects such as GCC, LLVM, or Git.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Now, I think the other side of AI - and this is where Sashiko comes in - is that it basically does end up being a tool that can then increase the trust in the patch. So AI giveth, and AI taketh away. But the basic issue shouldn't be AI per se, it should be that notion of 'trust'.\" - </span><strong style=\"vertical-align: baseline;\">Linus Torvalds</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://lore.kernel.org/all/CAHk-=wgbGarE7Ozw4VG6oUKDj9pk-8DRoDiX00bo1MwEMm9UWQ@mail.gmail.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">on LKML</span></a></p>\n<p><span style=\"vertical-align: baseline;\">You can check out Sashiko at </span><a href=\"https://sashiko.dev\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">sashiko.dev</strong></a><span style=\"vertical-align: baseline;\">, or find the code on </span><a href=\"https://github.com/sashiko-dev/sashiko\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</strong></a><span style=\"vertical-align: baseline;\"> to run it in your own development workflow.</span></p></div>"
