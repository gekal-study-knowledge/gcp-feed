    "published": "2026-11-19 17:00:00"
    "fetched": "2026-11-20 06:11:23"
    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>You can now <a href=\"https://docs.cloud.google.com/bigquery/docs/data-engineering-agent-pipelines#monitor-agent\">enable agent observability with the Data Engineering Agent</a>\nto monitor the agent's token consumption, request volume, and model latency in\nCloud Monitoring and inspect execution traces and tool calls in Cloud Trace.\nThis feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h3>Feature</h3>\n<p>You can now create <a href=\"https://docs.cloud.google.com/bigquery/docs/ai-index-overview\">AI indexes</a> using the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_ai_index\"><code>CREATE AI INDEX</code> statement</a>\nto perform natural language searches across table columns with the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-search\"><code>AI.SEARCH</code> function</a>\nwithout manually generating embeddings or managing models. To learn how to\ncreate, monitor, and delete AI indexes, see\n<a href=\"https://docs.cloud.google.com/bigquery/docs/ai-index\">Use AI indexes</a>. This feature is in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>.</p>\n<h3>Feature</h3>\n<p>You can use the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/migration/migration-validation\">validation service</a> in the\nBigQuery Migration Service to verify that tables migrated from your source data\nwarehouse match your target tables in BigQuery across schemas, aggregate\nmetrics, and row-level data. This feature is available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>.</p>\n<h3>Security</h3>\n<p>A path traversal vulnerability in workspace directory handling and Git\nintegration was discovered in Dataform, BigQuery Studio, and Colab Enterprise.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/security-bulletins#gcp-2026-084\">GCP-2026-084</a>\nsecurity bulletin.</p>\n<h3>Feature</h3>\n<p>BigQuery <a href=\"https://docs.cloud.google.com/bigquery/docs/generative-ai-overview#locations\">generative AI functions</a>\nnow support the <code>gemini-4-neon</code> model. This model is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Load Balancing</h2>\n<h3>Feature</h3>\n<p>The <code>DENY_BY_DEFAULT</code> action for authorization policies is\ngenerally available (GA) for regional external Application Load Balancers, regional internal Application Load Balancers,\nand cross-region internal Application Load Balancers.</p>\n<p>Attaching a <code>DENY_BY_DEFAULT</code> authorization policy to a load balancer's\nforwarding rule establishes a deny-by-default security baseline that blocks all\nrequests unless they are explicitly permitted by a separate <code>ALLOW</code> or <code>CUSTOM</code>\nauthorization policy.</p>\n<p>For more information, see the following documentation:\n* <a href=\"https://docs.cloud.google.com/load-balancing/docs/auth-policy/auth-policy-overview\">Authorization policy overview</a>\n* <a href=\"https://docs.cloud.google.com/load-balancing/docs/auth-policy/set-up-auth-policy-app-lb#deny-by-default\">Set up authorization policies for Application Load Balancers</a></p>\n<h2 class=\"release-note-product-title\">Dataform</h2>\n<h3>Security</h3>\n<p>A path traversal vulnerability in workspace directory handling and Git\nintegration was discovered in Dataform, BigQuery Studio, and Colab Enterprise.\nFor more information, see the\n<a href=\"https://docs.cloud.google.com/dataform/docs/security-bulletins#gcp-2026-084\">GCP-2026-084</a>\nsecurity bulletin.</p>\n<h2 class=\"release-note-product-title\">Managed Service for Apache Airflow</h2>\n<h3>Security</h3>\n<p>Managed Airflow service is preparing a fix for the\n<a href=\"https://www.cve.org/CVERecord?id=CVE-2026-114938\">CVE-2026-114938</a>\nvulnerability. This fix will be published in an upcoming Managed Airflow\nversion, and will be backported to past Managed Airflow versions released\nbetween 2024 and 2026.</p>\n<p>After the fix is deployed to production, Managed Airflow will provide\ninstructions detailing the steps customers must take to prevent potential\nexploitation of CVE-2026-114938.</p>\n<p>In the meantime, all customers are requested to configure the following\n<a href=\"https://docs.cloud.google.com/composer/docs/composer-3/set-environment-variables\">environment variable</a>\nin their Managed Airflow environments, which effectively blocks exploitation of\nCVE-2026-114938:</p>\n<p><code>JAVA_TOOL_OPTIONS=-XX:+IgnoreUnrecognizedVMOptions -XX:UseAVX=2</code></p>"
