"overview": |
  この日は Google Cloud ブログ 7 本 (うち 1 本は AI & ML ブログにも掲載) と日本語ブログ 3 本で、エージェントを支える基盤づくりが中心でした。Google の AI & Infrastructure チームは、Gemini を使った Linux カーネル向けのオープンソースのエージェント型コードレビューシステム Sashiko (刺し子にちなむ命名、今年のうちに Linux Foundation へ寄贈) を解説しました。Linux は 3,500 万行を超えるコードを抱えて年間 8 万 5,000 件以上の変更が入る一方、レビューは少数のメンテナーが毎日何百件ものパッチを手で読むことに依存しており、コード生成が速くなるだけでは、それらしく見えるだけの AI slop や重複・不正確な AI 生成のセキュリティ報告が同じメンテナーの前に積み上がるだけになる、という問題意識から、メモリリークやデッドロック、競合状態、セキュリティバグを取り込み前に見つけることを狙っています。ネットワークでは、GKE のシングルスタック IPv6 がプレビューとなり、ノードとポッドの両方をプライベート IPv4 アドレスなしで動かせるようになりました (Cloud TPU v6e と Axion を含む CPU ノードプールが対象、DNS64/NAT64 で IPv4 のエンドポイントにも到達可能)。AI のデプロイは数千のアクセラレーターノードやスケールする推論レプリカ、Ray ワーカー、ベクトルデータベースなどで膨大なアドレス空間を必要とし、計算資源や電力より先に IP アドレスが枯渇する、という指摘です。また、Envoy をエージェント時代のプロキシとして拡張する取り組みも紹介されました。マイクロサービスと違ってエージェントは通信相手を自分で選び、ルーティングに使う属性がリクエストボディの奥にあり、リクエスト数だけでなくトークン予算で制御され、多ターンの推論ループがステートフルなセッションアフィニティと厳格なツール実行の境界を要求するため、モデル・トークン・MCP のルーティングを Envoy 側で扱えるようにしています。エージェントに文脈を与えるオープン仕様 Open Knowledge Format は v0.3 を公開し、RFC 2119 のキーワードを使った正式な適合性 (conformance) の規定、エージェントの編集に追随する信頼レベル、ライセンスを自己記述するバンドル、知識を安全に廃止・移動する方法、安定した拡張モデルと明確なバージョニング方針を追加しました (必須フィールドは引き続き type だけで、既存のバンドルはそのまま動作します)。あわせて他の業界標準と併用するためのユースケース集と、コーディングエージェントが OKF バンドルを読み書きするためのagent skill 2 種が公開され、リポジトリは Google Cloud Platform の GitHub organization から独立した open-knowledge-format へ移りました。データベースでは、Database Center の assessments が Cloud SQL for PostgreSQL 向けにプレビューとなり、クローンしたインスタンス上で隔離された合成ベンチマークを自動実行して、推奨設定の効果を本番に影響を与えず、ステージングのレプリカを手で用意することなく検証できるようになりました。そのほか、Windows やレガシーなデスクトップアプリを Chrome ブラウザの中で配信する Cameyo by Google をIDC の Market Note が取り上げたこと (リプラットフォーム不要で Chrome Enterprise・ChromeOS・Gemini へつなぐ橋渡し) と、ヘルシンキの Slush 2026 に合わせて EMEA のスタートアップのエージェント活用事例 (Google Cloud 上でバックエンドとデータ基盤を刷新した北欧最大のマーケットプレイス CDON、Gemini の推論で 50 万人超の教員の授業計画を支援する英国の Chalkie.ai など) が紹介されました。後から追加された日本語ブログ (いずれも米国時間 11 月 10〜11 日の記事の抄訳) では、医療向け Gemini がプレビューとして紹介されました。先月の Gemini at Work で発表した汎用の Gemini エージェントを医療向けに拡張したもので、医療従事者が情報の手作業による照合に週 28 時間近くを費やしている状況に対し、臨床・財務・管理のシステムを横断してマルチステップのワークフローを人の監督のもとで進め、HIPAA コンプライアンスをサポートします。また、Google の AI Threat Defense プラットフォームの一部である自律型コードセキュリティエージェント CodeMender を Cloud Run 経由で GitHub の pull リクエストに組み込むリファレンスアーキテクチャが紹介され、/verify でサンドボックス内のエクスプロイト検証、/fix でパッチ提案を pull リクエストのタイムライン上で行えます (Mandiant M-Trends 2026 によると欠陥修正の平均日数は 10 年前の約 59 日から 2025 年には 170 日以上に増加)。「Cloud CISO の視点」では、CISO の Chris Betz がエージェント型の脅威や攻撃戦術の変化など 2027 年のセキュリティ動向予測を紹介しました。
