  "aacd1998dd3b84c0a2da6a88f70cd7e8":
    "id": "aacd1998dd3b84c0a2da6a88f70cd7e8"
    "title": "A bridge to modernization: What IDC’s Market Note says about Cameyo by Google"
    "link": "https://cloud.google.com/blog/products/chrome-enterprise/a-bridge-to-modernization-what-idcs-market-note-says-about-cameyo-by-google/"
    "published": "2026-11-19 06:36:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph\"><p>Organizations are increasingly adopting generative and agentic AI as they look for ways to unlock more business value. Yet for many IT leaders, business-critical legacy desktop apps stand in the way—too essential to retire, too complex and costly to rewrite—yet unequipped for the security challenges and productivity opportunities of the AI era.</p><p>That doesn’t have to block your modernization strategy. By delivering Windows and legacy applications directly inside the Chrome browser, Cameyo by Google connects legacy workflows to Chrome Enterprise, ChromeOS, and Gemini—with zero replatforming required.</p><p>In a recent IDC Market Note, “<a href=\"https://cameyo.google/engage/idc-marketscape-report/?utm_source=linkedin&amp;utm_medium=Paid_Social&amp;utm_campaign=FY26-Q3-global-49119-website-dl-chrm-ceos-cy-marketscape-report&amp;utm_content=idc-market-report-cameyo?utm_source=website&amp;utm_medium=blog&amp;utm_campaign=FY26-Q3-global-49119-website-dl-chrm-ceos-cy-marketscape-report&amp;utm_content=idc-market-report-cameyo?utm_source=newsletter&amp;utm_medium=Newsletter&amp;utm_campaign=FY26-Q3-global-49119-website-dl-chrm-ceos-cy-marketscape-report&amp;utm_content=idc-market-report-cameyo\" target=\"_blank\">Cameyo by Google: A Modern Bridge Technology Platform in Digital Workspace Transformation</a><a href=\"https://cameyo.google/engage/idc-marketscape-report\" target=\"_blank\">,</a>” lead analyst Filippo Vanara examines how Cameyo reduces deployment complexity while enhancing security and lowering costs. Here are five of our key takeaways from the IDC Market Note:</p><ol><li><b>Rebuilding legacy apps costs millions: Virtual App Delivery (VAD) is the bridge</b></li></ol><p>Enterprise modernization barriers make rewriting or replatforming legacy applications unfeasible for many organizations. The IDC report notes that \"Cameyo is positioned as a strategic bridge between legacy application environments and modern, AI-driven digital workspaces.\" By connecting legacy systems to modern, AI-enhanced digital workspaces, Cameyo enables organizations to safeguard their existing technology investments.</p><p>2. <b>Instant AI and security upgrades with Gemini and Chrome Enterprise</b></p><p>Moving legacy apps into the browser immediately surrounds them with modern capabilities they were never built to support. With Cameyo, legacy workflows run right alongside built-in enterprise AI like Gemini in Chrome—giving employees safe, managed AI tools instead of pushing them toward unmanaged \"shadow AI.\" At the same time, apps can inherit Chrome’s advanced threat protections and Data Loss Prevention (DLP) policies through Chrome Enterprise Premium, which the IDC Market Note highlights \"This enables organizations to extend AI capabilities and modern security controls to legacy workflows.\"</p><p>3. <b>Protecting your organizations from cyberattacks</b></p><p>Traditional VDI utilizes open VPNs and public server ports that leave organizations vulnerable to cyberattacks. According to the IDC Market Note, \"As part of its value proposition, security is central to Cameyo. In fact, the platform adopts a zero trust architecture, isolating users, sessions, and resources from the corporate network.” Additionally, \"the use of non-persistent infrastructure and a simplified architecture reduces the overall attack surface.\"</p><p>4.<b> Slashing operational and virtualization costs</b></p><p>According to IDC's 2025 EMEA CloudOps Survey (n = 509) findings, 89% of organizations in Europe estimated that they are currently wasting their public cloud spending. When companies use Cameyo as opposed to complex virtual desktops, they consistently realize reduced costs. According to the IDC Market Note, \"Cost is another core value proposition for Cameyo as it emphasizes its potential to deliver significant cost savings compared with traditional VDI and DaaS solutions: up to 54% reduction in total cost of ownership (TCO) when transitioning from legacy environments.\"</p><p>5. <b>Phased modernization across endpoints</b></p><p>According to the IDC Market Note, IDC believes Cameyo represents an important evolution within the broader VCC market, specifically reflecting a shift from desktop-centric virtualization to application-centric delivery models. In this context, the platform functions as a bridge technology, enabling enterprises to modernize incrementally rather than requiring full application replatforming. This aligns with IDC's view that most organizations will pursue phased modernization strategies, maintaining legacy software while gradually transitioning to cloud-native architectures.” By delivering legacy applications as Progressive Web Apps (PWAs), Cameyo helps businesses modernize without being tethered to a specific device or operating system. When paired with ChromeOS Flex, Cameyo can ensure seamless access to those legacy apps on older devices, extending existing hardware lifespans and reducing capital expenditures.</p><p><b>Download the report</b></p><p>Adopting AI doesn't mean leaving legacy applications stranded. True workplace modernization integrates existing, business-critical software into a secure, unified AI ecosystem—without requiring complex app rewrites or costly migrations.</p><p>Read the full IDC Market Note (Cameyo by Google: A Modern Bridge Technology Platform in Digital Workspace Transformation) to benchmark your endpoint strategy, eliminate cloud waste, and bridge legacy software to Google Intelligent Endpoints.</p><p><b>Download the no-cost IDC Market Note</b> <a href=\"https://cameyo.google/engage/idc-marketscape-report/?utm_source=linkedin&amp;utm_medium=Paid_Social&amp;utm_campaign=FY26-Q3-global-49119-website-dl-chrm-ceos-cy-marketscape-report&amp;utm_content=idc-market-report-cameyo?utm_source=website&amp;utm_medium=blog&amp;utm_campaign=FY26-Q3-global-49119-website-dl-chrm-ceos-cy-marketscape-report&amp;utm_content=idc-market-report-cameyo?utm_source=newsletter&amp;utm_medium=Newsletter&amp;utm_campaign=FY26-Q3-global-49119-website-dl-chrm-ceos-cy-marketscape-report&amp;utm_content=idc-market-report-cameyo\" target=\"_blank\"><b>here</b></a><b>.</b><br /><br /> <i>IDC Market Note, Cameyo by Google: A Modern Bridge Technology Platform in Digital Workspace Transformation, #EUR154528226, May 2026</i></p></div>"
  "5bab3c1fcb3cea92e2fdfcb7f3c64b40":
    "id": "5bab3c1fcb3cea92e2fdfcb7f3c64b40"
    "title": "EMEA startups building the next-generation of agents on Google Cloud"
    "link": "https://cloud.google.com/blog/topics/startups/google-cloud-highlights-emea-startup-momentum-at-slush-2026/"
    "published": "2026-11-19 02:30:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As thousands of founders, investors, and technology leaders gather in Helsinki for Slush 2026, the European startup ecosystem is undergoing a profound transformation. The conversation has moved from  AI experiments to operating agents. Across Europe, the Middle East, and Africa (EMEA), pioneering startups are deploying autonomous AI agents that reason, integrate deeply with core systems, and automate complex workflows at scale.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google Cloud and Google DeepMind we’re focused on delivering a complete AI stack for startups,including; Gemini Enterprise and the Gemini agent; the industry’s broadest choice of proprietary models including Gemini, Claude, GPT; open models like Gemma; multiple compute options including both GPUs and TPUs;  the infrastructure required to build and scale AI applications; and the tools to manage huge volumes of data, monitor token spend, and more. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Spotlighting EMEA Startup Momentum at Slush</span></h3>\n<p><span style=\"vertical-align: baseline;\">This week at Slush, we are proud to highlight a remarkable group of European startups leveraging Google Cloud’s secure infrastructure and Gemini models to redefine their industries:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CDON (Sweden): </strong><span style=\"vertical-align: baseline;\">As the largest e-commerce marketplace in the Nordics, CDON modernized its backend and data infrastructure on Google Cloud. Its analytics pipelines run on Google BigQuery, dbt, and Google Cloud Storage, utilizing Python and FastAPI to ingest massive volumes of retail marketplace data. CDON democratizes real-time business reporting across brands and lays the groundwork for predictive personalization and generative AI workloads.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Chalkie.ai (UK):</strong><span style=\"vertical-align: baseline;\">  A fast-growing education technology platform, Chalkie.ai uses Gemini's advanced reasoning capabilities to transform lesson planning for over 500,000 educators. By exporting directly to Google Slides Google Slides, teachers can instantly generate curriculum-aligned presentations and materials directly within their instructional tools while maintaining strict student data privacy standards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Finova (UK): </strong><span style=\"vertical-align: baseline;\">A</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">leader in UK lending and savings software, has launched the UK’s first whole-of-market AI mortgage application agent, built on Google Cloud and Gemini. By deploying Gemini’s advanced reasoning to automate complex mortgage applications across multiple lender portals, Finova removes manual data entry bottlenecks and reduces errors. This saves mortgage brokers at least 30 minutes per application and reclaims thousands of operational hours industry-wide.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fyndiq (Sweden):</strong><span style=\"vertical-align: baseline;\"> Swedish e-commerce marketplace Fyndiq (part of CDON Group) anchors its predictive analytics and data operations in Google BigQuery, dbt, and Google Cloud Storage. Fyndiq models transaction and product feed data to deliver near real-time business insights to merchandisers. By applying Google’s machine learning and performance models, Fyndiq optimizes customer acquisition and regional campaign reach.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ruby Labs (UK):</strong><span style=\"vertical-align: baseline;\"> Ruby Labs runs its global subscriber growth and marketing engine for popular consumer health and entertainment apps on Google Cloud. Ruby Labs processes massive pipelines of subscriber, billing, and attribution data using a unified analytical stack built on BigQuery, Cloud Pub/Sub, and Google Cloud Storage. Connecting real-time signals with marketing frameworks on Google Ads surfaces enables Ruby Labs to optimize acquisition funnels and ad relevance at global scale.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Via Health Tech (Germany): </strong><span style=\"vertical-align: baseline;\">Berlin-based VIA HealthTech is the AI assistant for psychotherapists. Powered by Gemini's multimodal audio and reasoning capabilities on Google Cloud, VIA turns therapy sessions into structured clinical notes within seconds and drafts psychological reports, giving therapists their time back for their patients. Trust is built in: VIA's security and compliance setup is BSI C5 attested and ISO 27001 certified, so therapists can use AI without compromising their professional secrecy. More than 4,000 clinicians already rely on it.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Powering Europe’s builders with enterprise infrastructure</span></h3>\n<p><span style=\"vertical-align: baseline;\">Building sustainable AI businesses requires infrastructure that combines high computational performance with strict data governance and predictable cost efficiency. This week we launched the</span><a href=\"https://cloud.google.com/blog/topics/startups/sovereign-ai-on-your-terms-our-new-startup-accelerator-is-open?e=48754805\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator: Sovereign AI</span></a><span style=\"vertical-align: baseline;\"> (Europe &amp; Israel). This equity-free, 12-week hybrid program is tailored for late-Seed to Series A startups handling high-stakes, regulated workloads across sectors like GovTech, HealthTech, and financial services. Participating founders receive 1:1 architectural mentorship from Google Cloud engineers, technical advisory support to prepare for EU AI Act regulatory sandboxes, and hands-on guidance deploying across our tiered sovereign portfolio—from the Google Cloud Data Boundary and partner-operated clouds like S3NS to air-gapped Google Distributed Cloud environments and open-weight models like Gemma.</span></p>\n<p><span style=\"vertical-align: baseline;\">Additionally, through the Google for Startups Cloud Program, startups across EMEA receive up to $350,000 in cloud credits , dedicated engineering support, and preferred access to partner tools and our AI infrastructure and models.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Meet Google Cloud at Slush 2026</span></h3>\n<p><span style=\"vertical-align: baseline;\">Whether you are building agents, scaling multi-modal applications, or migrating to scalable cloud infrastructure, Google Cloud provides the foundation for the next generation of EMEA startups .</span></p>\n<p><span style=\"vertical-align: baseline;\">If you are attending Slush 2026 in Helsinki, visit the Google Cloud booth to meet our engineering and startup teams, explore interactive demos, and learn more about applying to the </span><a href=\"https://cloud.google.com/startup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Cloud Program</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "08220c6200e149e76f047b58620ef349":
    "id": "08220c6200e149e76f047b58620ef349"
    "title": "What’s new in OKF v0.3: enterprise-ready knowledge, use cases, and skills"
    "link": "https://cloud.google.com/blog/products/data-analytics/introducing-okf-v0-3/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">In June we introduced the </span><a href=\"https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Open Knowledge Format (OKF)</span></a><span style=\"vertical-align: baseline;\">, an open specification that provides plain markdown and YAML to give agents the context they need. In July, </span><a href=\"https://cloud.google.com/blog/products/data-analytics/okf-v0-2-adds-trust-signals\"><span style=\"text-decoration: underline; vertical-align: baseline;\">v0.2</span></a><span style=\"vertical-align: baseline;\"> added trust signals: provenance, trust, freshness, lifecycle, and attestation.</span></p>\n<p><span style=\"vertical-align: baseline;\">In production, bundles move between organizations, multiple agents edit the same corpus, and independent tools need to read a bundle the same way. Released today, OKF v0.3</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">adds precise conformance rules, trust tiers that keep pace with agent edits, self-describing bundles with licensing, safe ways to retire and move knowledge, a stable extension model, and a clear versioning policy. However, the core idea behind OKF stays the same: </span><code style=\"vertical-align: baseline;\">type</code><span style=\"vertical-align: baseline;\"> is still the only required field, and your existing bundles keep working.</span></p>\n<p><span style=\"vertical-align: baseline;\">We're also launching </span><strong style=\"vertical-align: baseline;\">OKF use cases</strong><span style=\"vertical-align: baseline;\">, which are community guides for using OKF alongside other industry standards, and two </span><strong style=\"vertical-align: baseline;\">agent skills</strong><span style=\"vertical-align: baseline;\"> that let coding agents write and read OKF bundles. Finally, to make cross-organization collaboration easier, we’re moving OKF out of the Google Cloud Platform GitHub org into a standalone organization at </span><a href=\"https://github.com/open-knowledge-format/open-knowledge-format/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://github.com/open-knowledge-format/open-knowledge-format/</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Let’s take a closer look at what’s new in OKF v0.3.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Built for interoperability</span></h3>\n<p><span style=\"vertical-align: baseline;\">v0.3 adds a formal conformance section, allowing independent producers and consumers to work together by design. The spec is self-contained and uses RFC 2119 keywords. It gives one clear answer to the questions that come up when tools from different teams and vendors read the same bundle. The full detail is in the spec, but a few themes matter for anyone building on OKF:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Built on standard file formats.</strong><span style=\"vertical-align: baseline;\"> OKF uses a small, widely supported set of standards: YAML 1.2 frontmatter, CommonMark with GFM tables and footnotes, and RFC 3339 timestamps. If your tools handle those, they handle OKF.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">OKF bundles share space with other markdown files.</strong><span style=\"vertical-align: baseline;\"> A </span><code style=\"vertical-align: baseline;\">.md</code><span style=\"vertical-align: baseline;\"> file without a </span><code style=\"vertical-align: baseline;\">type</code><span style=\"vertical-align: baseline;\"> is skipped by OKF consumers, so </span><code style=\"vertical-align: baseline;\">README.md</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">AGENTS.md</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">CONTRIBUTING.md</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">SKILL.md</code><span style=\"vertical-align: baseline;\"> can live inside a bundle without breaking it. Files that aren't markdown, like images or attester code, are </span><span style=\"font-style: italic; vertical-align: baseline;\">assets</span><span style=\"vertical-align: baseline;\"> that concepts can link to.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Consumers handle real-world input predictably.</strong><span style=\"vertical-align: baseline;\"> Bundles written by many agents can contain nulls, empty strings, single values where a list was expected, and new vocabulary. v0.3 specifies how a consumer reads each of these. Consumers accept these inputs without failing, while validators log warnings for malformed entries. A bundle never fails because an optional field is missing or a link is broken.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Trust that keeps pace with agents</span></h4>\n<p><span style=\"vertical-align: baseline;\">v0.2 gave every concept a trust tier: </span><span style=\"font-style: italic; vertical-align: baseline;\">unverified</span><span style=\"vertical-align: baseline;\">, </span><span style=\"font-style: italic; vertical-align: baseline;\">machine-confirmed</span><span style=\"vertical-align: baseline;\">, or </span><span style=\"font-style: italic; vertical-align: baseline;\">human-reviewed</span><span style=\"vertical-align: baseline;\">. As agents take on more of the editing, v0.3 makes sure the tier always reflects the latest version of the content. Here's a typical sequence:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A person reviews a metric definition and signs off.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A week later, an agent refines the definition.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The trust tier now reflects that the person hasn't yet reviewed the new text.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">In v0.3, </span><strong style=\"vertical-align: baseline;\">only current verifications count</strong><span style=\"vertical-align: baseline;\">. A verification is current when it happened at or after the last meaningful change to the content, recorded in </span><code style=\"vertical-align: baseline;\">generated.at</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;generated: { by: reference_agent/gemini-2.5-pro, at: &quot;2026-09-02T10:00:00Z&quot; }\\r\\nverified:\\r\\n  - { by: &quot;human:jsmith&quot;, at: &quot;2026-08-25T09:00:00Z&quot; }        # before the rewrite: history\\r\\n  - { by: &quot;process:finance-nightly&quot;, at: &quot;2026-09-03T02:00:00Z&quot; }  # current&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f16a338cf90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This concept is now </span><strong style=\"vertical-align: baseline;\">machine-confirmed</strong><span style=\"vertical-align: baseline;\">, not human-reviewed, until a person confirms it again. The older sign-off stays in the file as history, and a UI can show it as \"reviewed before the last change.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">v0.3 also standardizes actor identifiers. Actors are </span><code style=\"vertical-align: baseline;\">&lt;producer&gt;/&lt;version&gt;</code><span style=\"vertical-align: baseline;\"> for tools, or </span><code style=\"vertical-align: baseline;\">&lt;scheme&gt;:&lt;id&gt;</code><span style=\"vertical-align: baseline;\"> for everything else, and v0.3 adds </span><code style=\"vertical-align: baseline;\">team:</code><span style=\"vertical-align: baseline;\"> next to </span><code style=\"vertical-align: baseline;\">human:</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">process:</code><span style=\"vertical-align: baseline;\">. Only </span><code style=\"vertical-align: baseline;\">human:</code><span style=\"vertical-align: baseline;\"> earns human-reviewed, because a team name doesn't say which person actually checked the content.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Bundles that describe themselves</span></h4>\n<p><span style=\"vertical-align: baseline;\">When an agent has access to dozens of bundles, bundle-level metadata supports progressive disclosure so it can pick the right bundle without reading every file. In v0.3, the bundle-root </span><code style=\"vertical-align: baseline;\">index.md</code><span style=\"vertical-align: baseline;\"> can carry frontmatter about the bundle itself:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;---\\r\\nokf_version: &quot;0.3&quot;\\r\\ntitle: Acme retail analytics\\r\\ndescription: Tables, metrics, and sanctioned computations for Acme retail. Use it for sales and margin questions.\\r\\nlicense: CC-BY-4.0\\r\\n---&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f16a3419f90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><ul>\n<li style=\"vertical-align: baseline;\">\n<p><code><strong style=\"vertical-align: baseline;\">description</strong></code><span style=\"vertical-align: baseline;\"> is written for routing. In one sentence it says what the bundle covers and when to use it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code><strong style=\"vertical-align: baseline;\">license</strong></code><span style=\"vertical-align: baseline;\"> makes clear what you're allowed to do with knowledge you receive from someone else.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><code><strong style=\"vertical-align: baseline;\">okf_version</strong></code><span style=\"vertical-align: baseline;\"> tells a consumer which rules to apply, including compatibility fallbacks for older bundles.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Tools that regenerate </span><code style=\"vertical-align: baseline;\">index.md</code><span style=\"vertical-align: baseline;\"> must keep this frontmatter.</span></p>\n<h4><span style=\"vertical-align: baseline;\">A lifecycle with forwarding addresses</span></h4>\n<p><span style=\"vertical-align: baseline;\">Knowledge evolves, and an agent that finds a deprecated concept should be able to get to its replacement. v0.3 adds </span><code style=\"vertical-align: baseline;\">superseded_by</code><span style=\"vertical-align: baseline;\">:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;status: deprecated\\r\\nsuperseded_by: /metrics/gross-margin.md&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f16a3418210&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Consumers that filter to current knowledge follow the pointer and return the replacement. The same mechanism handles moves and renames. Leave a short deprecated concept at the old path that points to the new one, and existing links and stored references keep working.</span></p>\n<h4><span style=\"vertical-align: baseline;\">One rule for links and paths</span></h4>\n<p><span style=\"vertical-align: baseline;\">Links in the body and path fields in frontmatter (</span><code style=\"vertical-align: baseline;\">resource</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">superseded_by</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">executor.resource</code><span style=\"vertical-align: baseline;\">, and others) now resolve the same way:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A value with a scheme (</span><code style=\"vertical-align: baseline;\">https:</code><span style=\"vertical-align: baseline;\">) is an absolute URL.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A value that starts with </span><code style=\"vertical-align: baseline;\">/</code><span style=\"vertical-align: baseline;\"> resolves from the bundle root.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Anything else resolves from the directory of the file that contains it, just like on GitHub or in any markdown editor.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For bundles marked v0.2 or earlier, or with no version, a consumer can also resolve paths from the bundle root, so existing bundles keep working.</span></p>\n<p><span style=\"vertical-align: baseline;\">v0.3 also makes explicit that </span><strong style=\"vertical-align: baseline;\">links are not parent/child relationships.</strong><span style=\"vertical-align: baseline;\"> Only the directory tree defines hierarchy. A link is an untyped, directed relationship, and the text around it says what kind (\"joins with,\" \"replaces,\" \"depends on\"). Path fields that point at concepts are edges in the bundle graph too.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Room to extend, without collisions</span></h4>\n<p><span style=\"vertical-align: baseline;\">The community has been extending OKF since v0.1, with typed edges, routing hints, and erasure profiles. v0.3 makes a few extension mechanisms a first-class rule:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Extension keys are allowed </span><strong style=\"vertical-align: baseline;\">at any level</strong><span style=\"vertical-align: baseline;\">, including inside </span><code style=\"vertical-align: baseline;\">sources</code><span style=\"vertical-align: baseline;\"> entries, </span><code style=\"vertical-align: baseline;\">verified</code><span style=\"vertical-align: baseline;\"> events, </span><code style=\"vertical-align: baseline;\">executor</code><span style=\"vertical-align: baseline;\">, and </span><code style=\"vertical-align: baseline;\">attester</code><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A producer that edits a file </span><strong style=\"vertical-align: baseline;\">must keep the keys it doesn't understand</strong><span style=\"vertical-align: baseline;\"> so one tool doesn't overwrite metadata added by another.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Future OKF versions </span><strong style=\"vertical-align: baseline;\">will never define keys that start with </strong><strong style=\"vertical-align: baseline;\">x-</strong><span style=\"vertical-align: baseline;\">. Name your keys </span><code style=\"vertical-align: baseline;\">x-&lt;producer&gt;-&lt;name&gt;</code><span style=\"vertical-align: baseline;\">, for example </span><code style=\"vertical-align: baseline;\">x-acme-owner</code><span style=\"vertical-align: baseline;\">, and they won't collide with a future spec version.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">A versioning policy before 1.0</span></h4>\n<p><span style=\"vertical-align: baseline;\">v0.3 defines OKF's versioning rules. Before 1.0, minor versions may include breaking changes as long as each is documented with a consumer fallback where possible. Starting at 1.0, minor versions will be strictly additive, and released normative text will not change in place.</span></p>\n<p><span style=\"vertical-align: baseline;\">The spec also lists what was </span><strong style=\"vertical-align: baseline;\">considered and deferred</strong><span style=\"vertical-align: baseline;\">: typed relationships, the full attestation runtime protocol (receipt and verdict wire formats), semantic-layer attestation, validity windows, and a </span><code style=\"vertical-align: baseline;\">refuted</code><span style=\"vertical-align: baseline;\"> verification event. Until the community agrees on a form for these, extension keys are the place to experiment. We'd like your proposals.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Introducing OKF use cases</span></h3>\n<p><span style=\"vertical-align: baseline;\">OKF keeps its core specification small and links to existing domain schemas like Avro, Protobuf, or OpenAPI instead of duplicating them. In practice, though, when your organization already has an established artifact in another standard, such as a schema, a contract, or a spec, what should the OKF concept next to it say, and how should an agent use the two together?</span></p>\n<p><span style=\"vertical-align: baseline;\">Starting with v0.3, we're publishing </span><strong style=\"vertical-align: baseline;\">use cases</strong><span style=\"vertical-align: baseline;\">: guides for using OKF with other industry standards. Each one explains:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Where the boundary sits</strong><span style=\"vertical-align: baseline;\">: what belongs in the other standard and what belongs in OKF.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How to link the two</strong><span style=\"vertical-align: baseline;\">: which frontmatter and link conventions point from a concept into the other artifact.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">What an agent should do</strong><span style=\"vertical-align: baseline;\"> with the combination.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A complete worked example</strong><span style=\"vertical-align: baseline;\"> you can copy.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Use cases are layered on the core spec, not part of it. A bundle that ignores them is still a conformant OKF bundle. When a convention proves itself across several use cases, it can be proposed for the core spec through the usual process.</span></p>\n<p><span style=\"vertical-align: baseline;\">Use cases are managed directly in GitHub. Each use case gets its own folder under </span><a href=\"https://github.com/open-knowledge-format/open-knowledge-format/tree/main/usecases\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">usecases/</code></a><span style=\"vertical-align: baseline;\"> in the OKF repository, for example </span><code style=\"vertical-align: baseline;\">usecases/&lt;usecase&gt;/</code><span style=\"vertical-align: baseline;\">. The guide is a </span><code style=\"vertical-align: baseline;\">.md</code><span style=\"vertical-align: baseline;\"> file in that folder, and any sample bundles or artifacts sit next to it. Use cases are reviewed, versioned, and discussed like any other change.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Propose a use case</span></h4>\n<p><span style=\"vertical-align: baseline;\">If you pair OKF with a standard, please send us a proposal. A rough first draft is welcome. Open a pull request that adds a folder under </span><code style=\"vertical-align: baseline;\">usecases/</code><span style=\"vertical-align: baseline;\"> with a </span><code style=\"vertical-align: baseline;\">.md</code><span style=\"vertical-align: baseline;\"> file in it, and we'll refine it together in review.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Compatibility</span></h3>\n<p><span style=\"vertical-align: baseline;\">v0.3 has two breaking changes, and existing v0.2 bundles stay readable:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Path fields resolve relative to their file.</strong><span style=\"vertical-align: baseline;\"> Fallback: for bundles marked v0.2 or earlier, or with no version, consumers can resolve from the bundle root.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Only current verifications count toward the trust tier.</strong><span style=\"vertical-align: baseline;\"> No fallback needed, since tiers can only go down.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Everything else is a clarification or an optional addition. v0.1 fallbacks (</span><code style=\"vertical-align: baseline;\">timestamp</code><span style=\"vertical-align: baseline;\">, body </span><code style=\"vertical-align: baseline;\"># Citations</code><span style=\"vertical-align: baseline;\">) still apply.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Agent skills for OKF</span></h3>\n<p><span style=\"vertical-align: baseline;\">The two skills live in the new repository and follow the open </span><a href=\"https://agentskills.io/specification\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Skills</span></a><span style=\"vertical-align: baseline;\"> format, so any agent that supports skills can load them.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">okf-generate</strong><span style=\"vertical-align: baseline;\"> writes, updates, migrates, and validates bundles from available sources. It cites a source for each claim, records a human review only when that person confirms it, and copies attested computations from a sanctioned source instead of writing them.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">okf-consume</strong><span style=\"vertical-align: baseline;\"> answers questions from a bundle. For each concept used, it reports the trust tier, status, freshness, and attestation result, and runs attested computations only through the bundle's configured executor and attester.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">To install them in Gemini CLI, run:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# install okf-generate\\r\\ngemini skills install https://github.com/open-knowledge-format/open-knowledge-format --path skills/okf-generate\\r\\n\\r\\n# install okf-generate\\r\\ngemini skills install https://github.com/open-knowledge-format/open-knowledge-format --path skills/okf-consume&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f16a3419850&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://github.com/open-knowledge-format/open-knowledge-format#agent-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">README</span></a><span style=\"vertical-align: baseline;\"> lists the install steps for other agents.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get involved</span></h3>\n<p><span style=\"vertical-align: baseline;\">Read the </span><a href=\"https://github.com/GoogleCloudPlatform/open-knowledge-format/blob/main/SPEC.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">v0.3 spec</span></a><span style=\"vertical-align: baseline;\">. Add </span><code style=\"vertical-align: baseline;\">okf_version</code><span style=\"vertical-align: baseline;\"> to your bundles, and check that your consumer computes trust tiers from current verifications only. Issues and pull requests, including new use case proposals, are welcome on GitHub.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Spec, samples, use cases, and reference implementations:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/open-knowledge-format/open-knowledge-format/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://github.com/open-knowledge-format/open-knowledge-format/</span></a></p></div>"
  "063c1ac995401c4029957e27a9c4016c":
    "id": "063c1ac995401c4029957e27a9c4016c"
    "title": "Testing changes, fast: Introducing agentic assessments in Database Center"
    "link": "https://cloud.google.com/blog/products/databases/database-center-assessments-for-cloud-sql-for-postgresql/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Applying recommendations to a production database can feel risky if you can’t easily quantify the performance benefit or justify the additional cost. While </span><a href=\"https://docs.cloud.google.com/database-center/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Database Center</span></a><span style=\"vertical-align: baseline;\"> flags fleet-level health issues and provides proactive recommendations, database administrators still face the challenge of testing recommended changes without disrupting live applications or spending hours manually configuring staging replicas. </span></p>\n<p><span style=\"vertical-align: baseline;\">To help solve this problem, we’re excited to announce the preview of </span><a href=\"https://docs.cloud.google.com/sql/docs/postgres/assessments-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">assessments in Database Center for Cloud SQL for PostgreSQL</span></a><span style=\"vertical-align: baseline;\">. Assessments is an agentic workflow that lets you run automated, isolated synthetic benchmarks on cloned instances, helping you verify potential performance gains before touching your production environment.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Moving from recommendations to production changes</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Managing production databases means balancing system stability, performance, and infrastructure spend. When Database Center alerts you to a potential bottleneck and recommends a change, you need to evaluate the change before you can implement it. That workflow can be complex:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Setting up dedicated staging environments to mirror production settings</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Running benchmark workloads to simulate real-world traffic</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Measuring latency, throughput, and resource saturation before and after applying changes</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Calculating whether performance gains justify potential cost adjustments</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Because this manual benchmarking process takes a lot of time and engineering effort, it’s easy to put off making critical updates, leaving databases under-provisioned or inefficient.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">How assessments automates the validation workflow</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Assessments simplify performance validation by automating the entire testing cycle in an isolated environment. When you click \"Assess impact\" on a supported recommendation in Database Center, the assessments workflow handles each step of the benchmarking process:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Plan creation:</strong><span style=\"vertical-align: baseline;\"> Assessments builds a customized test plan for running a synthetic benchmark tailored to your instance. You can refine parameters such as client connections, transaction counts, query mode, or benchmark duration using plain-language prompts to match your target workload requirements </span><strong style=\"vertical-align: baseline;\">(for example, </strong><strong style=\"font-style: italic; vertical-align: baseline;\">\"Change the benchmark duration to 60 seconds\"</strong><strong style=\"vertical-align: baseline;\">).</strong></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Safe isolation:</strong><span style=\"vertical-align: baseline;\"> The agentic workflow clones your primary instance so that benchmarks run without consuming production resources or affecting live traffic.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Baseline measurement:</strong><span style=\"vertical-align: baseline;\"> The workflow automatically runs synthetic workloads against the cloned instance to establish performance metrics from before the change.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Applying changes:</strong><span style=\"vertical-align: baseline;\"> The workflow modifies the cloned environment according to the selected recommendation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Comparative reporting:</strong><span style=\"vertical-align: baseline;\"> Finally, it reruns the benchmark workload and generates an evaluation report comparing pre- and post-change metrics, including transaction throughput, average latency, CPU utilization, and memory usage — and automatically deletes the temporary clone once the assessment completes.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Initial supported recommendations</strong></h3>\n<p><span style=\"vertical-align: baseline;\">During the preview, you can run automated assessments for three types of Cloud SQL for PostgreSQL updates:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Machine upgrade:</strong><span style=\"vertical-align: baseline;\"> Measure how increased vCPU and memory allocations impact query throughput and reduce compute contention under load.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Edition upgrade:</strong><span style=\"vertical-align: baseline;\"> Compare performance metrics between Cloud SQL Enterprise and Enterprise Plus editions to verify throughput gains and reduced latency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enable data cache:</strong><span style=\"vertical-align: baseline;\"> Evaluate how enabling data cache on Enterprise Plus instances affects read latency and offloads I/O bottlenecks for data-intensive workloads.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Assessments in Database Center are available in preview. You can start validating performance changes in your Cloud SQL for Postgres environment today directly in the Google Cloud console:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Review the</span> <a href=\"https://docs.cloud.google.com/sql/docs/postgres/release-notes#August_25_2026\"><span style=\"text-decoration: underline; vertical-align: baseline;\">release notes</span></a><span style=\"vertical-align: baseline;\"> for the latest updates on Cloud SQL for PostgreSQL.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Read the</span> <a href=\"https://docs.cloud.google.com/sql/docs/postgres/assessments-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">assessments overview</span></a><span style=\"vertical-align: baseline;\"> to explore architecture details and supported database versions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Follow the step-by-step guide to</span> <a href=\"https://docs.cloud.google.com/database-center/docs/assessments\"><span style=\"text-decoration: underline; vertical-align: baseline;\">create an assessment</span></a><span style=\"vertical-align: baseline;\"> for your instances in Database Center.</span></p>\n</li>\n</ul></div>"
  "f84eeef27e4f97374d0cbe52105cf5ae":
    "id": "f84eeef27e4f97374d0cbe52105cf5ae"
    "title": "Scaling massive AI/ML workloads with IPv6 on Google Kubernetes Engine clusters"
    "link": "https://cloud.google.com/blog/products/networking/run-aiml-workloads-on-ipv6-only-gke-clusters/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">TL;DR: Single-stack IPv6 on GKE runs both nodes and pods without having to use private IPv4 addresses. Available in preview for Cloud TPU v6e and CPU node pools, including Axion, it works with DNS64/NAT64 to reach IPv4 endpoints.</span></p>\n<p><span style=\"vertical-align: baseline;\">Long before they run out of compute or power, AI applications hit another wall: running out of IP addresses. A single AI deployment often requires a vast address space to support everything from thousands of accelerator nodes, scaling inference replicas, bursting Ray workers and pipelines, pod sidecars, and services like vector databases. Running a dual stack — IPv6 behind a private IPv4 space — can help, but only to a point, because the private IPv4 space has often already been exhausted across existing networks. </span></p>\n<p><span style=\"vertical-align: baseline;\">To help, today, we're announcing single-stack IPv6 on Google Kubernetes Engine (GKE), allowing you to run both nodes and pods on IPv6, without private IPv4 addresses. Single-stack IPv6 is available in preview for Cloud TPU v6e and CPU node pools, including Axion, and works with DNS64/NAT64 to reach IPv4 endpoints.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_M6LxTK3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Nodes and pods run IPv6-only across Cloud TPU v6e and CPU-based node pools, with no private IPv4. Workloads reach Google Cloud APIs over native IPv6 and IPv4-only endpoints through DNS64/NAT64.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">What single-stack IPv6 delivers</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The availability of single-stack IPv6 in GKE is a game-changer for large AI deployments. Consider the following features and benefits that it brings to the table:</span></p>\n<p><strong style=\"vertical-align: baseline;\">1. No private IPv4 required for nodes or pods<br /></strong><span style=\"vertical-align: baseline;\">Nodes and pods use IPv6 exclusively. Without the RFC 1918 footprint that governs private IPv4 address spaces, clusters avoid conflicts with on-premises networks, peered VPCs, or adjacent clusters.</span></p>\n<p><strong style=\"vertical-align: baseline;\">2. IPv4 interoperability with DNS64/NAT64<br /></strong><span style=\"vertical-align: baseline;\">You enable DNS64 on the VPC, and NAT64 on a regional Cloud NAT gateway, allowing pods to transparently reach IPv4-only endpoints, registries, and dataset hubs — refer to the documentation to learn how to </span><a href=\"https://docs.cloud.google.com/dns/docs/configure-dns64\"><span style=\"text-decoration: underline; vertical-align: baseline;\">configure DNS64</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://docs.cloud.google.com/nat/docs/public-nat#nat64\"><span style=\"text-decoration: underline; vertical-align: baseline;\">set up Cloud NAT</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><strong style=\"vertical-align: baseline;\">3. Massive address space per node<br /></strong><span style=\"vertical-align: baseline;\">Each node receives a /112 pod range (65,536 addresses), so IP address capacity no longer limits how high your clusters, nodes, or pods can scale. Standard GKE maximum-pods-per-node limits still apply.</span></p>\n<p><strong style=\"vertical-align: baseline;\">4. Broad accelerator and compute support<br /></strong><span style=\"vertical-align: baseline;\">We designed single-stack IPv6 in GKE with the goal of supporting a range of accelerators and general compute families. At preview, it supports Cloud TPU v6e (Trillium), plus E2, N1, N2, N2D, N4, C3, C3D, C4, C4D, C4A, and Z3 machine families, with support for additional accelerators and machine families coming soon.</span></p>\n<p><strong style=\"vertical-align: baseline;\">5. Direct workload observability<br /></strong><span style=\"vertical-align: baseline;\">Every pod has a unique IPv6 address without having to run NAT inside the cluster, simplifying telemetry, network policies, and debugging.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Performance</span><span style=\"vertical-align: baseline;\"> and scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">Single-stack IPv6 removes private IPv4 address limits without additional data plane overhead. In our internal testing, we saw the following performance characteristics:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pod lifecycle:</strong><span style=\"vertical-align: baseline;\"> Burst pod scheduling and CNI sandbox setup performed at parity with IPv4.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Networking</strong><span style=\"vertical-align: baseline;\">: Inter-node TCP/UDP latency and multi-stream pod-to-pod throughput matched IPv4. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Services</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">and</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">DNS</strong><span style=\"vertical-align: baseline;\">: eBPF service load balancing and NodeLocalDNS showed no measurable overhead compared to standard IPv4.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Start building today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Single-stack IPv6 is available now in preview on GKE version </span><strong style=\"vertical-align: baseline;\">1.37.1-gke.3020000</strong></p>\n<p><span style=\"vertical-align: baseline;\">To create your first IPv6-only cluster, run the following commands, replacing REGION and CLUSTER_NAME:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# 1. Create a VPC with internal (ULA) IPv6 enabled\\r\\ngcloud compute networks create gke-ipv6-net \\\\\\r\\n    --subnet-mode=custom \\\\\\r\\n    --enable-ula-internal-ipv6\\r\\n\\r\\n# 2. Enable DNS64 for the VPC\\r\\ngcloud dns policies create gke-ipv6-dns64 \\\\\\r\\n    --networks=gke-ipv6-net \\\\\\r\\n    --enable-dns64-all-queries\\r\\n\\r\\n# 3. Enable NAT64 in your region\\r\\ngcloud compute routers create gke-ipv6-router \\\\\\r\\n    --network=gke-ipv6-net --region=REGION\\r\\ngcloud compute routers nats create gke-ipv6-nat64 \\\\\\r\\n    --router=gke-ipv6-router --region=REGION \\\\\\r\\n    --auto-allocate-nat-external-ips \\\\\\r\\n    --nat64-all-v6-subnet-ip-ranges\\r\\n\\r\\n# 4. Create the cluster\\r\\ngcloud beta container clusters create CLUSTER_NAME \\\\\\r\\n    --cluster-version=1.37.1-gke.3020000 \\\\\\r\\n    --location=REGION \\\\\\r\\n    --enable-dataplane-v2 \\\\\\r\\n    --cluster-dns=clouddns \\\\\\r\\n    --stack-type=ipv6 \\\\\\r\\n    --network=gke-ipv6-net \\\\\\r\\n    --create-subnetwork name=my-subnet \\\\\\r\\n    --ipv6-access-type=internal&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f16a33aac10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">To learn more, see the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/single-stack-ipv6\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "c4c2578354121ac4338ad838b382a1d7":
    "id": "c4c2578354121ac4338ad838b382a1d7"
    "title": "Sashiko: Lessons from building an agentic code review system for Linux"
    "link": "https://cloud.google.com/blog/products/application-development/lessons-from-building-sashiko-an-agentic-code-review-system/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The speed of development in large open-source projects has always been limited by code review, not code generation. Even as coding agents get better at writing code, they do not accelerate development on their own. This is especially true of patches to the Linux kernel. Without a way to build trust in proposed changes, more generated code simply piles up in front of the same small group of human maintainers. Some of those patches are solid changes, just written faster; many others are plausible-looking \"AI slop\" sent by contributors who do not fully understand the systems they are modifying. And the influx of AI-generated security reports, many of which are duplicates or inaccurate, only adds to maintainers’ load.</span></p>\n<p><span style=\"vertical-align: baseline;\">Linux runs billions of Android phones, most cloud providers, and nearly every supercomputer. It spans more than 35 million lines of code, and over 85,000 changes land every year. Automated build bots and fuzzers like </span><a href=\"https://github.com/google/syzkaller\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Syzkaller</span></a><span style=\"vertical-align: baseline;\"> catch build errors and crashes, but code review has always been the main way to guarantee the stability and safety of the kernel. Every day, maintainers read hundreds and hundreds of proposed patches by hand to catch memory leaks, deadlocks, race conditions, and security bugs.</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_sIAzTvL.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>To help maintainers handle the load and catch bugs before they land, the <a href=\"http://aiinfra.google/\">Google AI &amp; Infrastructure</a> team built <a href=\"https://github.com/sashiko-dev/sashiko\"><b>Sashiko</b></a>, an open-source, agentic code review system powered by Gemini. We named the project after the Japanese word 刺し子, a stitching technique for artistically reinforcing worn cloth, and donated it to the Linux Foundation earlier this year.</p><p>In this blog, we cover the problem Sashiko was designed to solve, how it works, what the data shows, and what we learned from building and running it in the wild.</p><h3><b>Reviewing code is hard</b></h3><p>Reviewing a change in a complex code base is objectively hard, both for humans and LLMs. It often requires a deep understanding of how the system works in general, well outside the proposed change. In fact, it’s pretty common to see patches that engineers claim perfectly solve the problem, but if they were to be merged, would actually introduce even worse problems (albeit subtle). Traditionally, only experienced maintainers have been able to spot and prevent these issues. The same is true for agentically generated code.</p><p>To verify the correctness of a change, a potentially large number of invariants should be proven, which is often a much larger and harder task than developing the change itself. This is true for both human and agentic reviewers. However, LLM-based reviewers have some unique properties, both positive and negative:</p><ol><li><b>LLMs often struggle to put in enough effort.</b> LLMs are trained to achieve the goal of spending fewer tokens. So they often tend to cut corners and dismiss concerns without proper investigation or flag false positives without proper due diligence.</li><li><b>LLMs are easier to bias</b>. The current generation of LLMs usually performs much better if provided a single relatively simple task (e.g., prove the patch for memory leaks) rather than multiple tasks (e.g., explore several complex, varied concerns). It’s pretty common for an LLM to find an obvious issue in the code and refuse to look deeper for other types of issues. Also, commit log text can sometimes affect the result of code review in a non-predicatable or even malicious way.</li><li><b>LLMs don’t have persistent memory.</b> Surprisingly, this is a positive thing for code review: An LLM can review the same or similar patch multiple times as if it were a new patch. No sane human can review the same patch applied to 100 slightly different branches to find the few that have incompatible changes.</li></ol><h3><b>How Sashiko reviews a patch</b></h3><p>To avoid these failure modes, Sashiko separates <b>finding candidate bugs</b> from <b>verification of those bugs</b>, and requires each pass to record what it ruled out:</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;Gather context and plan\\r\\n  -&gt; Parallel specialist sessions (concerns + dismissed concerns)\\r\\n  -&gt; Triage\\r\\n  -&gt; Per-bug deep checks\\r\\n  -&gt; Review report&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f16a3762f50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Notes on each step:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gather context and plan:</strong><span style=\"vertical-align: baseline;\"> Sashiko first pulls in the code around the diff (modified functions, struct definitions, and direct callers) and loads the subsystem's domain guides, so the changed lines are never judged in isolation. A planner then decides which specialist passes are needed (skipping hardware checks on pure software code, for example) and sets a reasoning budget for each pass based on patch complexity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Parallel specialist sessions:</strong><span style=\"vertical-align: baseline;\"> Up to seven specialist sessions run in parallel, each focused on a single class of problems: commit intent, implementation match, control flow, resource lifetimes, locking, security, and hardware. Giving each pass a single focus prevents one type of bug from crowding out another. Each session searches and reads the repository with git tools (averaging about 100 tool calls per review) and outputs two lists: concerns it believes are real, and candidate concerns it investigated and ruled out, along with the code that supports that conclusion.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Triage:</strong><span style=\"vertical-align: baseline;\"> A lead verifier audits those two lists together. Clear-cut bugs already proven by the code in front of it pass straight through; dismissals proven by a local check are dropped. Everything else deserves additional investigation. Crucially, that includes not only contested bugs where specialists disagreed, but also </span><strong style=\"vertical-align: baseline;\">shaky self-dismissals </strong><span style=\"vertical-align: baseline;\">— cases where a specialist spotted a real bug and dismissed it by assuming, without proof, that some unseen caller or lock would prevent it.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Per-bug deep checks:</strong><span style=\"vertical-align: baseline;\"> Instead of checking all difficult cases in one shared prompt, Sashiko gives each difficult case its own verification agent that runs in parallel. Each agent gets one specific question to answer with git tools under a symmetrical rule: Neither a bug claim nor a dismissal is accepted without concrete code proof across </span><span style=\"font-style: italic; vertical-align: baseline;\">all</span><span style=\"vertical-align: baseline;\"> call sites. If a specialist talks itself out of a real bug based on a false assumption, this step catches it and promotes it back to a real finding.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Review report: </strong><span style=\"vertical-align: baseline;\">Sashiko generates a report that sounds like a human maintainer asking questions about the proposed change, matching the style expected on a Linux mailing list.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">All this happens at no cost for developers. Deep agentic reviews at scale require a substantial token budget. If developers had to pay for them with their own API keys, many important contributors would be pushed away. Instead, Sashiko reviews patches sent to public Linux kernel mailing lists, and Google runs the service at </span><a href=\"https://sashiko.dev\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">sashiko.dev</span></a><span style=\"vertical-align: baseline;\">. Everything runs in the open: every prompt, tool call, reasoning step, and ruled-out bug is public. The project initially used the open-source Linux review prompts started by Chris Mason, and more than 100 contributors, including prominent kernel maintainers and engineers, have since helped to improve prompts and Sashiko itself. Recently, Sashiko switched to a different prompt system that combines per-tree or per-version auto-generated notes on code with subjective maintainers notes, which contain directions and instructions from maintainers that can’t be derived from the code.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">What the data shows</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The real test of an automated reviewer is whether maintainers pay attention to the reports it sends out, and whether those reports track actual software quality. Seven months of Sashiko production data from the kernel mailing lists give a clear picture of both these questions.</span></p>\n<p><strong style=\"vertical-align: baseline;\">It is part of the daily workflow.</strong><span style=\"vertical-align: baseline;\"> Sashiko completes roughly 1200 reviews a day across over 100 kernel mailing lists. It sends review emails only to lists whose maintainers opt in, and already over 70 of them have done so. Developers also engage directly with the reports: More than 1500 kernel developers have replied on the mailing lists, and their pushback on false alarms has directly driven improvements to Sashiko's prompts and verification engine. In fact, </span><a href=\"http://lwn.net\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LWN.net</span></a><span style=\"vertical-align: baseline;\"> recently </span><a href=\"https://lwn.net/Articles/1096963/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">wrote</span></a><span style=\"vertical-align: baseline;\"> that </span><strong style=\"vertical-align: baseline;\">Sashiko has already become an important part of the kernel's development process</strong><span style=\"vertical-align: baseline;\"> and was </span><a href=\"https://lwn.net/Articles/1100241/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the top bug reporter</span></a><span style=\"vertical-align: baseline;\"> of issues in the 7.2 release cycle.</span></p>\n<p><strong style=\"vertical-align: baseline;\">It prevents new bugs and uncovers old ones.</strong><span style=\"vertical-align: baseline;\"> When Sashiko flags a bug in a proposed patch, the author typically fixes it in the next revision before the change is ever merged. Many developers run Sashiko locally or in corporate private instances. The bugs that Sashiko helped to prevent leave no trace in the git commit log, making them hard to count directly. What </span><span style=\"font-style: italic; vertical-align: baseline;\">can</span><span style=\"vertical-align: baseline;\"> be counted are fixes for preexisting bugs that Sashiko finds and reports as a byproduct of reviewing new changes: Sashiko is cited in over 2000 mainline kernel commits and in over 500 of this year's official Linux kernel CVEs, spanning drivers, core kernel code, networking, GPUs, memory management, and virtualization.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Fewer bugs are slipping into mainline releases.</strong><span style=\"vertical-align: baseline;\"> Across the 18 kernel releases prior to Sashiko (Linux 6.2 through 6.19, covering 254000 commits), an average of 3.4% of merged commits required a follow-up fix within 60 days. Since Sashiko rolled out, that 60-day fix rate has fallen to 2.8% in Linux 7.1 and 2.2% in Linux 7.2, </span><strong style=\"vertical-align: baseline;\">a 35% drop</strong><span style=\"vertical-align: baseline;\"> (with the 30-day fix rate falling from 2.3% to 1.4%). It’s too early to make strong claims, and obviously many other factors can influence release-to-release numbers, so we cannot solely credit Sashiko for the entire drop, but the trend is optimistic.</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">Since Sashiko was rolled out, the percentage of merged commits in the Linux kernel that received a follow-up fix in 60 days has dropped by 35%.</q>\n\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">A clean review carries real signal.</strong><span style=\"vertical-align: baseline;\"> If Sashiko's warnings were mostly noise, commits merged with warnings would need follow-up fixes no more often than commits that passed cleanly. In practice, across 21,500 tracked mainline commits, patches that received a clean Sashiko review required a follow-up fix within 60 days just 0.9% of the time — less than a third of the historical baseline. Patches merged despite a critical Sashiko warning needed a fix 7.6% of the time — an 8x higher risk (and 6.3x higher even after adjusting for patch size). </span></p>\n<p><span style=\"vertical-align: baseline;\">That gap is what makes Sashiko useful to maintainers: A clean pass instills real confidence, while a critical warning is a strong reason to take another look at the proposed patch.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_IdMDvr5.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This all tracks with what Linus Torvalds wrote in a mailing-list discussion a few weeks after Sashiko’s launch:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"As you say, Sashiko tends to be quite good. Even when it flags something unnecessarily and there's no actual problem, there's likely to be a reason for the question. And we've seen some truly stellar reports too. Things that are deep and subtle, and the AI is 100% correct. So anybody who thinks that all AI is slop is in denial about the current state.\"</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Linus Torvalds</strong><span style=\"vertical-align: baseline;\"> (</span><a href=\"https://lore.kernel.org/all/CAHk-=wi_drr4Ls9KtXW1k8L2FUDF0YdnyjvKmPgLXHDFnnRWEg@mail.gmail.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">on lore.kernel.org</span></a><span style=\"vertical-align: baseline;\">)<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 97.389%;\"><colgroup><col style=\"width: 48.2659%;\" /><col style=\"width: 51.7341%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Sashiko at a glance</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Since March 2026</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Patch reviews completed</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">241,000 (~1200+ / day)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Opted-in kernel subsystem lists</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">75+</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Mainline commits crediting Sashiko</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2,000+</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">2026 Linux kernel CVEs crediting Sashiko</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">528</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">60-day post-merge fix rate</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Down from 3.4% baseline to 2.2% (Linux 7.2)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">What we learned from building and running Sashiko</strong></h3>\n<p><span style=\"vertical-align: baseline;\">First, </span><strong style=\"vertical-align: baseline;\">benchmark-driven development beats intuition.</strong><span style=\"vertical-align: baseline;\"> While developing Sashiko, we tried many ideas that looked very reasonable on their face but didn’t end up working out. Other ideas were less obvious but worked surprisingly well. What was crucial: Early on, we built a benchmark out of nearly 1,000 real Linux kernel bugs and used it to evaluate every major Sashiko change. Every bug in this set was a real mistake that had passed human review by kernel experts, had been merged into mainline Linux, and later had to be fixed. On that benchmark, Sashiko with the new </span><strong style=\"vertical-align: baseline;\">Gemini 4 Carbon</strong><span style=\"vertical-align: baseline;\"> model catches </span><strong style=\"vertical-align: baseline;\">75.8%</strong><span style=\"vertical-align: baseline;\"> of the bugs that human reviewers missed (using high thinking level).</span></p>\n<p><span style=\"vertical-align: baseline;\">Second, </span><strong style=\"vertical-align: baseline;\">coding agents are not great at reviewing their own code.</strong><span style=\"vertical-align: baseline;\"> Models are trained to produce a working solution within a limited token budget. Asking these agents to review their own code might work well for isolated tasks, but for real, large codebases, creating a functional solution is often just 5-10% of the work. What’s really hard is to produce a solution that works all of the time, is well-integrated into the surrounding code, and doesn’t introduce subtle regressions. This is often substantially more complex and requires additional effort. Similar to human developers, agents benefit from external code review: Reviewers often spot issues that the initial author missed, even if they are not more experienced.</span></p>\n<p><span style=\"vertical-align: baseline;\">Third, </span><strong style=\"vertical-align: baseline;\">open source and shared community ownership and development help to build trust.</strong><span style=\"vertical-align: baseline;\"> By being fully open and transparent from the <span style=\"vertical-align: baseline;\">beginning</span>, Sashiko allowed anyone to run it the way they wanted: using different models (including open source and local models), customizing prompts, or even adopting Sashiko to other-than-Linux projects. This helped with community adoption and brought over 100 contributors to improve Sashiko, including some prominent kernel developers.</span></p>\n<p><span style=\"vertical-align: baseline;\">More and more engineers are putting local Sashiko instances into their coding-agent loops, so patches are checked against the community's review rules before a human maintainer ever sees them. We use the same workflow to build Sashiko itself (\"Sashiko for Sashiko\"), running it to review every change to its codebase and prompt pipeline both locally and through a Github integration.</span></p>\n<p><span style=\"vertical-align: baseline;\">Although Sashiko started in the Linux kernel, the need for an agentic trust layer applies across critical open-source software. Because the core review engine does not depend on C or on kernel-specific rules, the Linux kernel playbook (combining an open verification pipeline, community-owned domain guides, and a benchmark mined from historically known issues and fixes) can likely be applied to other foundational open-source projects such as GCC, LLVM, or Git.</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Now, I think the other side of AI - and this is where Sashiko comes in - is that it basically does end up being a tool that can then increase the trust in the patch. So AI giveth, and AI taketh away. But the basic issue shouldn't be AI per se, it should be that notion of 'trust'.\" - </span><strong style=\"vertical-align: baseline;\">Linus Torvalds</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://lore.kernel.org/all/CAHk-=wgbGarE7Ozw4VG6oUKDj9pk-8DRoDiX00bo1MwEMm9UWQ@mail.gmail.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">on LKML</span></a></p>\n<p><span style=\"vertical-align: baseline;\">You can check out Sashiko at </span><a href=\"https://sashiko.dev\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">sashiko.dev</strong></a><span style=\"vertical-align: baseline;\">, or find the code on </span><a href=\"https://github.com/sashiko-dev/sashiko\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</strong></a><span style=\"vertical-align: baseline;\"> to run it in your own development workflow.</span></p></div>"
  "a73cebe0473ac6d3fedf8d2154e089c8":
    "id": "a73cebe0473ac6d3fedf8d2154e089c8"
    "title": "Building an agentic stack in Envoy: routing models, tokens, and MCP"
    "link": "https://cloud.google.com/blog/products/networking/the-envoy-agentic-stack-routing-models-tokens-and-mcp/"
    "published": "2026-11-19 02:00:00"
    "fetched": "2026-11-19 07:50:49"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At Google Cloud, we believe the next generation of AI and agentic systems must be built on open, battle-tested foundations. Envoy, an open-source edge and service proxy designed for cloud-native applications, has already transformed microservices and modern cloud networking, powering everything from Google Cloud’s Application Load Balancers to the Agent Substrate dataplane on Google Kubernetes Engine. Now, Envoy is uniquely positioned to become the open standard for AI traffic, MCP tooling, and agent-to-agent communication. </span></p>\n<p><span style=\"vertical-align: baseline;\">Earlier this year, we presented </span><a href=\"https://cloud.google.com/blog/products/networking/the-case-for-envoy-networking-in-the-agentic-ai-era\"><span style=\"text-decoration: underline; vertical-align: baseline;\">the technical case for Envoy networking in the agentic AI era</span></a><span style=\"vertical-align: baseline;\">, examining how autonomous AI agents fundamentally challenge traditional Layer 7 networking assumptions. Unlike microservices, autonomous agent workloads choose who they communicate with. In addition, their routing attributes live deep within request bodies, with their traffic governed by token budgets as well as request rates, and their multi-turn reasoning loops requiring stateful session affinity and strict tool execution boundaries.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google Cloud, we have been working hard to develop Envoy for the agentic era. Read on for a closer look at how Envoy has evolved to better support autonomous agents, giving developers the performance and portability of an open-source ecosystem, backed by enterprise security and scalability.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_x4jVFeR.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Why autonomous agents challenge traditional L7 proxies</span></h3>\n<p><span style=\"vertical-align: baseline;\">Over the past decade, Envoy became the industry standard for cloud-native traffic management by operating cleanly at </span><strong style=\"vertical-align: baseline;\">Layer 4</strong><span style=\"vertical-align: baseline;\"> (TCP/UDP connection management) and </span><strong style=\"vertical-align: baseline;\">Layer 7</strong><span style=\"vertical-align: baseline;\"> (URI, method, and header-based routing).</span></p>\n<p><span style=\"vertical-align: baseline;\">Autonomous agents introduce two higher-order protocol layers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 8 (agentic interaction protocols):</strong><span style=\"vertical-align: baseline;\"> such as </span><strong style=\"vertical-align: baseline;\">LLM APIs</strong><span style=\"vertical-align: baseline;\">, Anthropic’s </span><strong style=\"vertical-align: baseline;\">Model Context Protocol (MCP)</strong><span style=\"vertical-align: baseline;\"> and Google’s </span><strong style=\"vertical-align: baseline;\">Agent2Agent (A2A)</strong><span style=\"vertical-align: baseline;\">, running over JSON-RPC 2.0 or gRPC. Critical policy attributes—such as </span><code style=\"vertical-align: baseline;\">tools/call</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">tool_name: \"execute_sql\"</code><span style=\"vertical-align: baseline;\">, or </span><code style=\"vertical-align: baseline;\">model: \"gemini-1.5-pro\"</code><span style=\"vertical-align: baseline;\">—are serialized inside the request payload.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layer 9 (agent framework interfaces):</strong><span style=\"vertical-align: baseline;\"> Coordination frameworks such as UCP, AP2, and Google Cloud’s Agent Development Kit, where multi-turn workflows produce dynamic token consumption and non-linear execution graphs.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Fronting these workloads with traditional L7 proxies creates four major architectural challenges:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Payload blindness:</strong><span style=\"vertical-align: baseline;\"> Nearly all LLM traffic shares the same paths (such as </span><code style=\"vertical-align: baseline;\">/v1/chat/completions</code><span style=\"vertical-align: baseline;\">), so a header-based proxy cannot distinguish between a low-cost query and an expensive 500,000-token prompt, or one model from another.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Request rate limiting fallacy:</strong><span style=\"vertical-align: baseline;\"> One request  per minute with a massive context window can use  more accelerator compute and memory bandwidth than dozens of  short queries, and agent loops can burn through budgets unnoticed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stateless load balancing: </strong><span style=\"vertical-align: baseline;\">Each turn of an agent's conversation should go back to the server that already remembers it. Traditional load balancers send it to whichever server is next, so the model has to start over for every turn, this wastes time and GPUs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ungoverned tool execution:</strong><span style=\"vertical-align: baseline;\"> Agents query databases, execute code in sandboxes, and call third-party APIs. Without inline inspection of MCP tool  calls, organizations risk prompt injection, data exfiltration, and runaway billing loops.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">The core pillars of Envoy’s agentic stack</span></h3>\n<p><span style=\"vertical-align: baseline;\">To address these challenges, Envoy provides capabilities that turn the network into an active governance layer:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table style=\"width: 100%;\"><colgroup><col style=\"width: 29.2708%;\" /><col style=\"width: 70.7292%;\" /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Core Pillar</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Operational Functionality</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">1. Native body parser</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Payload blindness: </strong><span style=\"vertical-align: baseline;\">Read request bodies, not just headers.</span><span style=\"vertical-align: baseline;\">Line-rate payload normalization across OpenAI, Anthropic, and Gemini schemas with SSE stream handling.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">2. Tokenomics engine</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Request-rate fallacy: </strong><span style=\"vertical-align: baseline;\">Count tokens, not just requests.</span><span style=\"vertical-align: baseline;\">Pre-inference token estimation, </span><span style=\"vertical-align: baseline;\">tokens per minute (TPM)</span><span style=\"vertical-align: baseline;\">/</span><span style=\"vertical-align: baseline;\">tokens per day (TPD)</span><span style=\"vertical-align: baseline;\"> rate limiting</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">3. Model &amp; MCP routing</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Stateless load balancing: </strong><span style=\"vertical-align: baseline;\">Keep agent sessions on the right servers</span><span style=\"vertical-align: baseline;\">Endpoint Picker (EPP) model dispatch, KV-cache prefix affinity, MCP Stateless support.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">4. AI security guardrails</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Ungoverned tool execution: </strong><span style=\"vertical-align: baseline;\">Policy tool calls.</span><span style=\"vertical-align: baseline;\">Inline policy, decision point (ext_proc) callouts for guardrails: Model Armor, ShieldGemma, and data loss prevention.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h4><span style=\"vertical-align: baseline;\">1. Native wire-format body parsing and transcoding</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Client applications often get locked into specific model APIs. For example, client code built for OpenAI's schema cannot communicate with Anthropic's endpoints or Google’s Gemini without client-side translation layers.</span></p>\n<p><span style=\"vertical-align: baseline;\">To help, Envoy ecosystem includes native body parsers that normalize requests across diverse model families, providing:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Client abstraction:</strong><span style=\"vertical-align: baseline;\"> Upstream applications send a standardized schema. Envoy inspects the JSON payload at line-rate, extracts the target model, and dynamically transcodes the request into the downstream provider's native format.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No application code changes:</strong><span style=\"vertical-align: baseline;\"> Switching from an external commercial model to a self-hosted open-source model (such as Gemma or Llama on vLLM) requires only an Envoy configuration update. Application code remains unchanged.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Streaming token extraction:</strong><span style=\"vertical-align: baseline;\"> Envoy parses server-sent events (SSE) response streams in real time, capturing token counts from usage chunks while maintaining ultra-low time-to-first-token latency.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">2. Tokenomics engine: token-aware traffic management</span></h4>\n<p><span style=\"vertical-align: baseline;\">In AI networking, </span><strong style=\"vertical-align: baseline;\">tokens are the fundamental unit of capacity</strong><span style=\"vertical-align: baseline;\">. Envoy replaces coarse request counters with token-aware traffic management features such as:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Token rate limiting:</strong><span style=\"vertical-align: baseline;\"> Enforces tokens per minute (TPM) and tokens per day (TPD) limits per tenant, project, or model.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Pre-inference throttling:</strong><span style=\"vertical-align: baseline;\"> Envoy estimates input tokens from request payload bytes and extracts actual token usage from LLM responses to record in a quota database, rejecting subsequent over-quota requests with an HTTP </span><code style=\"vertical-align: baseline;\">429</code><span style=\"vertical-align: baseline;\"> before they reach the inference cluster.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Runaway loop protection:</strong><span style=\"vertical-align: baseline;\"> Autonomous agents can enter recursive reasoning loops. By tracking cumulative token consumption and message counts per session or agent ID, Envoy throttles multi-turn sessions once an agent exceeds its assigned budget.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">3. Model routing and Model Context Protocol (MCP) support</span></h4>\n<p><span style=\"vertical-align: baseline;\">Envoy manages traffic for both downstream model backends and outbound tool calls, with:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KV-cache prefix affinity:</strong><span style=\"vertical-align: baseline;\"> Using the Kubernetes Gateway API Inference Extensions and Endpoint Picker (EPP), Envoy routes prompts sharing identical system instructions to the GPU worker currently holding that cache in memory, reducing latency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Model retry and fallback:</strong><span style=\"vertical-align: baseline;\"> If a primary model returns a 429 status code or fails, Envoy automatically retries or redirects the request to a secondary model pool with zero client interruption.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">MCP tool routing:</strong><span style=\"vertical-align: baseline;\"> For MCP agents, Envoy routes requests via JSON-RPC 2.0 bodies and HTTP headers. Per the </span><a href=\"https://blog.modelcontextprotocol.io/posts/2026-07-28/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026-07-28 MCP specification</span></a><span style=\"vertical-align: baseline;\">, Envoy uses </span><code style=\"vertical-align: baseline;\">Mcp-Method</code><span style=\"vertical-align: baseline;\"> and </span><code style=\"vertical-align: baseline;\">Mcp-Name</code><span style=\"vertical-align: baseline;\"> headers for zero-body-parsing routing to backend servers. Backends reject header-body mismatches with an HTTP </span><code style=\"vertical-align: baseline;\">400</code><span style=\"vertical-align: baseline;\"> / </span><code style=\"vertical-align: baseline;\">-32020</code><span style=\"vertical-align: baseline;\"> (HeaderMismatch) error to prevent tampering.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">4. AI security guardrails </span></h4>\n<p><span style=\"vertical-align: baseline;\">Inline safety filtering cannot come at the expense of network throughput. To prevent this, Envoy provides </span><strong style=\"vertical-align: baseline;\">security callouts:</strong><span style=\"vertical-align: baseline;\"> Using standardized external processing (</span><code style=\"vertical-align: baseline;\">ext_proc</code><span style=\"vertical-align: baseline;\">), Envoy connects to dedicated policy decision engines — such as Google Cloud’s Model Armor, ShieldGemma, or local classifiers — to detect prompt injections and sensitive data leaks with minimal latency overhead.</span></p>\n<h3><span style=\"vertical-align: baseline;\">High-density infrastructure: Envoy and Agent Substrate</span></h3>\n<p><span style=\"vertical-align: baseline;\">In enterprise production environments, agents frequently spend time idle between user queries or long-running tool executions. Running hundreds of thousands of idle agents in dedicated containers or virtual machines can create prohibitive infrastructure costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">Envoy pairs directly with high-density execution runtimes like </span><a href=\"https://github.com/agent-substrate/substrate\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</strong></a><span style=\"vertical-align: baseline;\"> to provide:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale-to-zero traffic steering:</strong><span style=\"vertical-align: baseline;\"> Agent Substrate uses lightweight isolation runtimes (such as Cloud Hypervisor, microVMs and gVisor application sandboxes) that can suspend and resume in milliseconds. When traffic arrives for a suspended agent, Envoy buffers the initial packet while signaling the runtime to resume the instance, completing the end-to-end resume in milliseconds.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Egress perimeter defense:</strong><span style=\"vertical-align: baseline;\"> Envoy functions as both an ingress and egress gateway for agent environments, routing the inbound traffic and restricting outbound network calls to verified domains and preventing untrusted autonomous code from reaching unauthorized endpoints.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Getting started</span></h3>\n<p><span style=\"vertical-align: baseline;\">Envoy has evolved into an intelligent, extensible networking layer designed specifically for the unique demands of multi-agent architectures. To begin building with the agentic stack in Envoy:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Explore the code:</strong><span style=\"vertical-align: baseline;\"> Review the </span><a href=\"https://github.com/envoyproxy/envoy\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Envoy proxy</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://github.com/theagentrouter/agent-router\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Router</span></a><span style=\"vertical-align: baseline;\"> implementations on Github and examine the open-source sample configurations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Join the community: </strong><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Participate in CNCF, </span></span><span style=\"vertical-align: baseline;\"><a href=\"https://github.com/kubernetes-sigs/gateway-api\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gateway API</span></a><span style=\"vertical-align: baseline;\">, and Kubernetes AI Gateway Working Group </span><span style=\"vertical-align: baseline;\">to collaborate on standardized inference APIs, MCP routing specifications, and token management conventions.</span></span></p>\n</li>\n</ul></div>"
"last_updated": "2026-11-19 07:50:49 JST"
