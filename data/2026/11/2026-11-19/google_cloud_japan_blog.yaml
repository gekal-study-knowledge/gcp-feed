    "title": "医療向け Gemini のご紹介"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-for-healthcare/"
    "published": "2026-11-19 01:00:00"
    "fetched": "2026-11-19 12:58:42"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 11 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-healthcare?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">すべての医療機関は、より多くの人々に対して、質の高い医療をより抑えたコストで提供することを目指しています。しかし、一般的な AI モデルでは、この課題を解決するには不十分です。現在の医療現場ではデータが断片化されており、患者の記録、保険適用方針、臨床エビデンスは、連携していない記録、請求システム、管理ツールに分散したままです。その結果、医療従事者は情報を手作業で照合することを余儀なくされ、そのために</span><a href=\"https://services.google.com/fh/files/misc/measuring_admin_burden_2024_ebook.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">週に 28 時間近く</span></a><span style=\"vertical-align: baseline;\">も費やしています。患者もまた、自身の治療や保険適用に関する回答を長く待たされることになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">医療機関には、</span><strong style=\"vertical-align: baseline;\">現在利用しているシステム全体を横断して業務を調整できる、安全かつガバナンスの確立された単一のオーケストレーション レイヤ</strong><span style=\"vertical-align: baseline;\">が必要です。このオーケストレーション レイヤは、検証可能なエビデンスを収集しながら、人間による監督のもとでマルチステップ ワークフローを完了まで導く役割を担います。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび発表した医療向け Gemini は、目的に特化した業界向けソリューションであり、先月の Gemini at Work で発表した汎用の </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェント</span></a><span style=\"vertical-align: baseline;\">を拡張したものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini エージェントは、従業員が目的を委任すると、エージェントが手順を計画し、組織のコンテキストを保持し、最適なモデルにルーティングして、チームがすでに使用しているツール内で完成した成果物を提供する、単独であらゆる業務に対応できる常時稼働のエージェントです。Gemini エージェントは、エンタープライズ グレードの ID 管理、きめ細かいアクセス制御、一元化されたポリシー管理機能をランタイムに直接組み込んで構築されています。各エージェントは、個別の ID で動作し、各ユーザーの既存のロールベースの権限を継承するとともに、すべてのユーザー、サブエージェント、ワークフローにわたって厳格な「知る必要性」の境界を適用し、必要な情報のみにアクセスできるようにします。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、臨床、財務、管理の各システムを横断して連携しながら、ユーザーにアプリケーションの切り替えを強いることなく、マルチステップ タスクをオーケストレートします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">医療機関: </strong><span style=\"vertical-align: baseline;\">Gemini は、さまざまな医療現場における患者の履歴を提供します。カルテは診察前に準備され、承認書類は提出前に保険会社の方針に照らして作成されるため、請求が却下されることが少なくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">保険会社、保険加入者: </strong><span style=\"vertical-align: baseline;\">Gemini は、申請内容を医療方針に照らして確認し、臨床審査担当者が評価しやすい形に整理します。また、加入者に対しては、契約中のプランの文書に基づいて、給付内容や費用負担について分かりやすく案内します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、HIPAA コンプライアンスをサポートするように構築されており、そのすべてが強固なガバナンスのもとで運用されます。現在はプレビュー版をご利用いただけます。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=uqmXoKOs_o0\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">医療向け Gemini は、保険会社や医療機関が複雑な臨床、運用、管理のワークフローをオーケストレートできるようにします。</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">医療向け Gemini は、保険会社や医療機関が複雑な臨床、運用、管理のワークフローをオーケストレートできるようにします。</h4>\n        \n        \n          <p>医療向け Gemini は、保険会社や医療機関が複雑な臨床、運用、管理のワークフローをオーケストレートできるようにします。</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=uqmXoKOs_o0\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">医療向け Gemini の 4 つのコンポーネント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、医療従事者や医療保険業界のリーダーと共同で開発されました。以下の 4 つのコア コンポーネントで構成されており、保険会社や医療機関向けに、完全に管理された統合環境を提供します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">医療業務向けのスキル: </strong><span style=\"vertical-align: baseline;\">スキルとは、専門家によって作成された再利用可能な指示とコンテキストであり、特定のタスクを実行できるように Gemini に学習させるためのものです。</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェント</span></a><span style=\"vertical-align: baseline;\">は、目的に合わせて設計されたマルチステップの指示により、臨床や管理に不可欠な業務を遂行します。これには、医療記録の統合、診察前の準備、保険の適用範囲や方針の確認、保険給付の判断などが含まれます。各スキルには、組織のポリシーや保険プランのルールを適用できます。また、独自の業務プロセスや標準業務手順に合わせてカスタムスキルを作成することもできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">臨床、財務、運用システムへのコネクタ: </strong><span style=\"vertical-align: baseline;\">コネクタのライブラリにより、組織がすでに運用している EHR、請求、診療、管理のシステムに Gemini を直接連携できます。Gemini は、既存の ID とロールベースのアクセス制御を厳格に維持しながら各システムにクエリを実行するため、機密データを移行したり権限を変更したりすることなく、統合されたコンテキストを取得できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープンな医療パートナー エコシステム: </strong><span style=\"vertical-align: baseline;\">医療機関や保険者ごとに、利用しているシステム構成は異なります。医療分野のシステム インテグレータやデジタルヘルス パートナーと連携することで、Gemini を自組織の業務に合わせて拡張できるほか、既存のシステムと連携させながら、ベンダー ロックインに縛られることなく運用を拡大できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープンモデルを選択できる、安全かつ管理されたプラットフォーム:</strong><span style=\"vertical-align: baseline;\"> 臨床、セキュリティ、IT の各リーダーは、エージェントのすべてのやり取りを管理するポリシーを一元的に設定、適用できます。プラットフォームは HIPAA コンプライアンスをサポートするように構築されており、エンタープライズ クラスのアクセス制御、エンドツーエンドの監査ログ、検証可能な引用情報により、審査担当者は各回答の出典を確認できます。エージェントは複数のモデルに対応しているため、複雑な臨床推論には Google やパートナーのフロンティア モデルを利用し、日常的な管理業務には高速で費用効率の高いモデルを利用するといったことが可能です。これらはすべて同一のガバナンスの下で運用されます。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">保険会社や医療機関向けに設計されたスキルで価値の高いワークフローを実現</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、臨床上の意思決定や保険適用の判断を遅らせる、煩雑な情報収集や管理作業を担います。</span></p>\n<p><strong style=\"vertical-align: baseline;\">医療現場:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">断片的な情報源から経時的なタイムラインを構築:</strong><span style=\"vertical-align: baseline;\"> EHR と外部記録を統合し、現在進行中の疾患と解決済みの問題を区別します。さらに、アレルギー情報を整理し、投薬情報の不一致を特定します。医療従事者は、複数のシステムに散在する情報を手作業で寄せ集めることなく、根拠のある統一された患者の全体像を数分で把握できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">患者ごとの事前準備を効率化:</strong><span style=\"vertical-align: baseline;\"> 診察や処置の前に患者のカルテを準備し、前回受診以降の出来事、現在の投薬状況、未処理の許可申請、検査、同意事項などを整理することで、医療チームが全体像を把握したうえで診療に臨めるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">医療承認申請や異議申し立てを効率化:</strong><span style=\"vertical-align: baseline;\"> カルテから必要な根拠情報を抽出し、監査対応可能な資料を審査用に作成します。これは保険会社の方針に準拠しており、却下された後ではなく、提出前に文書上の不備を指摘します。申請が却下された場合でも、根拠を裏付ける記録により、臨床記録と保険プランの方針に直接基づいた異議申し立ての下書きを作成します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">保険適用判断:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">保険会社の審査を迅速化:</strong><span style=\"vertical-align: baseline;\"> 受領した申請内容を医療保険の医療方針と照合し、審査担当者向けに結果を整理します。判断根拠は提出された文書と保険適用方針まで追跡可能です。審査担当者は、情報収集に費やす時間を減らし、専門的な判断に充てる時間を増やすことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">給付内容と患者の自己負担額を明確化:</strong><span style=\"vertical-align: baseline;\"> 複雑な給付規定を解析し、自己負担額の見積もり、免責額の追跡、ネットワーク内医療機関の状況確認を行い、保険加入者の実際の契約内容に基づいて、サービス担当者に詳細な説明を提供します。Medicare Advantage の加入者については、保険プランの内部規則がより厳格な場合には、Medicare の給付基準を適用します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">医療技術スタック全体をカバーするオープンなコネクタ エコシステム</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、安全な</span><a href=\"https://cloud.google.com/gemini-enterprise/connectors\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コネクタ</span></a><span style=\"vertical-align: baseline;\">を介して、臨床、運用、業界の基幹システムに直接接続し、各ソースシステムの既存のロールベース アクセス制御とデータ権限を継承します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">EHR と臨床データの統合:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Epic EHR</strong><span style=\"vertical-align: baseline;\">: 承認されたユーザーに対して、患者の状態、投薬情報、検査結果、臨床記録、専門医の診療記録への読み取り専用アクセスを提供します。基盤となるカルテへの</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/epic\"><span style=\"text-decoration: underline; vertical-align: baseline;\">書き戻しは行わない</span></a><span style=\"vertical-align: baseline;\">ため、臨床データの完全性を維持できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle Health EHR: </strong><span style=\"vertical-align: baseline;\">承認されたユーザーに対して、患者の病歴、診断結果、検査結果、臨床文書を読み取り専用で提供します。書き戻しを一切行わないことで、記録元システムのデータの完全性を確保します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">InterSystems FHIR Server</strong><span style=\"vertical-align: baseline;\">: EHR 統合にとどまらず、InterSystems FHIR MCP Server より、FHIR リポジトリの標準化された高性能な管理機能と、臨床データの相互運用性を提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verato: </strong><span style=\"vertical-align: baseline;\">患者の身元を統合管理し、異なる受診履歴や複数のデータソースに存在する患者記録の照合を行います。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keragon - Healthcare Integrations: </strong><span style=\"vertical-align: baseline;\">EHR を含む 400 以上の医療アプリケーションとの接続性を提供し、単一の MCP 統合を通じて既存の医療システムを安全に接続できるようにします。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">受給資格、請求、料金設定:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optum Coordination of Benefits: </strong><span style=\"vertical-align: baseline;\">患者が加入している追加の保険適用を特定し、請求前に給付の適用順序を判断します。現在は医療向け Gemini の検証段階にあり、限定的にサービスを提供しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optum Network Eligibility</strong><span style=\"vertical-align: baseline;\">: 連携済みの医療保険プランから、患者の受給資格と給付状況の詳細をリアルタイムで取得します。現在は医療向け Gemini の検証段階にあり、限定的にサービスを提供しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TriZetto Provider Solutions:</strong><span style=\"vertical-align: baseline;\"> TriZetto の広範なネットワークを通じて、Medicare、Medicaid、主要な民間保険プランにおける患者の受給資格、補償範囲、自己負担額、免責額を確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GoodRx</strong><span style=\"vertical-align: baseline;\">: 医療チームが AI を活用したワークフロー内で、処方薬の価格や、割引オプション（製薬会社が提供する自己負担プログラムなど）を直接確認できるようにすることで、患者がより手頃な価格で医薬品を入手できるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Infinitus Relay:</strong><span style=\"vertical-align: baseline;\"> 事前承認や給付確認に必要な、保険会社への大量の電話連絡を自動化します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">医療用語、コーディング:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">IMO Health:</strong><span style=\"vertical-align: baseline;\"> 医療用語の標準化、臨床検索、ナレッジグラフを医療スキルおよび管理されたエージェント ワークフローに組み込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ICD-10 Codes:</strong><span style=\"vertical-align: baseline;\"> ICD-10-CM 診断コード、請求可能ステータス、階層構造を検索および検証します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">RxNorm Drug Vocabulary:</strong><span style=\"vertical-align: baseline;\"> 標準化された医薬品名、成分、効力、剤形、NDC を検索します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">保険適用範囲と医療提供者に関する参照情報:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CMS の補償範囲</strong><span style=\"vertical-align: baseline;\">: Medicare の保険適用規則、National Coverage Determinations および Local Coverage Determinations（NCDs/LCDs）に直接接続し、保険適用の根拠が静的なモデルの知識ではなく、現在公表されている方針に基づいていることを保証します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NPPES NPI Registry</strong><span style=\"vertical-align: baseline;\">: 医療提供者の身元、臨床分類、診療場所をリアルタイムで検証します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">エビデンスに基づくガイドライン:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optum EvidenceVue: </strong><span style=\"vertical-align: baseline;\">Optum Life Sciences の AI を活用したワークフローを通じて、実臨床データを実用的なエビデンスに変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">BMJ Digital Health: </strong><span style=\"vertical-align: baseline;\">専門家が厳選した、体系化された査読済みの臨床ガイドラインとエビデンスを提供し、検証可能な引用に基づいて診療や保険適用に関する意思決定を裏付けます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">臨床や業務のワークフロー:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Salesforce</strong><span style=\"vertical-align: baseline;\">: Headless Salesforce Health Cloud との統合により、ワークフロー、データモデル、Agentforce を Gemini に組み込み、業務フロー内で管理されたアクションを実行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Suki</strong><span style=\"vertical-align: baseline;\">: 医療ワークフロー全体に Ambient Clinical Intelligence を提供し、臨床における会話を実用的なインテリジェンスに変換して、ドキュメント作成、コーディング、収益サイクル管理、臨床推論を強化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">UiPath: </strong><span style=\"vertical-align: baseline;\">医療対応の UiPath 自動化とエージェントを接続し、業務レビュー、事前承認、異議申し立てのために、引用情報に基づいたコンテキストを構築できるよう支援します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Synthpop Careflow: </strong><span style=\"vertical-align: baseline;\">紹介の受付、保険適用の確認、患者のフォローアップといった患者の診療プロセス全体を管理し、構造化されていない紹介情報を、手動での再入力なしに、保険会社が対応可能な検証済みの指示書へと変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Alteryx: </strong><span style=\"vertical-align: baseline;\">医療チームが専門知識を自動化された分析ワークフローに変換できるようにします。AI による洞察を、可視化され、理解しやすく、再現可能で、監査可能なビジネスルールや計算に基づいて確立します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">企業の生産性とコラボレーション:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sana from Workday:</strong><span style=\"vertical-align: baseline;\"> 人事、財務、企業のナレッジを連携させることで、医療チームが診療方針を確認し、タスクを調整し、管理システム全体で業務を遂行できるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ServiceNow: </strong><span style=\"vertical-align: baseline;\">企業の既存のルーティング ルールを適用しながら、IT インシデント、運用サービス リクエスト、承認プロセスを追跡します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Microsoft 365</strong><span style=\"vertical-align: baseline;\">: Word、Outlook、SharePoint と直接連携し、作成済みの承認書類、異議申し立て書、給付内訳を、既存のツールに直接配信できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Workspace</strong><span style=\"vertical-align: baseline;\">: Google ドキュメント、Gmail、Google ドライブ、Google スプレッドシートとシームレスに連携し、内部ファイルを可視化して管理ワークフローを調整すると同時に、企業のアクセス制御を徹底します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">セキュリティとコンプライアンス:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cyera Dataport</strong><span style=\"vertical-align: baseline;\">: Cyera との統合によりデータとエージェントのセキュリティを確保し、保護医療情報（PHI）のコンテキストを提供することで、HIPAA 監査やコンプライアンス報告をサポートします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">グローバルな実装パートナーとエコシステム</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google のオープン プラットフォームを通じて、</span><strong style=\"vertical-align: baseline;\">ASCO Oncology Guideline Assistant</strong><span style=\"vertical-align: baseline;\"> などの専門的なパートナー エージェントをデプロイすることも、</span><strong style=\"vertical-align: baseline;\">66degrees、Accenture、Altimetrik、AuxoAI、Cognizant、Deloitte、Egen、HCLTech、KPMG、NTT DATA、PwC、Quantiphi、Slalom、Tata Consultancy Services、TEKsystems Global Services、Wipro</strong><span style=\"vertical-align: baseline;\"> といった医療分野のシステム インテグレータと連携することも可能です。ベンダー ロックインを回避しながら、複雑なエンタープライズ アーキテクチャ全体でこれらの機能をカスタマイズ、統合、スケーリングできます。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=VIBvNUWB-NQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">医療向け Gemini のご紹介</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Optum Insight が、医療向け Gemini があらゆる段階で医療従事者に価値をもたらす仕組みを解説します。</h4>\n        \n        \n          <p>Optum Insight が、医療向け Gemini があらゆる段階で医療従事者に価値をもたらす仕組みを解説します。</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=VIBvNUWB-NQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">大手医療機関と共同で開発</strong></h4>\n<p><span style=\"vertical-align: baseline;\">すでに多くの医療システム、医療保険事業者、大学病院、臨床リーダーが Google Cloud と連携して、医療の提供、保険運用、医学研究の各分野において、さまざまな機能を構築し、活用しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">医療現場における患者情報の統合</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医師が患者の病歴に簡単にアクセスして把握できるようになれば、情報収集に費やす時間を減らして、患者のケアに集中する時間を増やすことができます。Google Cloud との協業を通じて、Gemini が複数の電子医療記録システムや医療現場から得られる複雑な患者情報をどのように解釈、統合できるかを模索しています。さまざまなソースからのデータを結び付けることで、臨床医は患者の病歴をより完全かつ包括的に把握できるようになるでしょう。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">HCA Healthcare</strong><span style=\"font-style: italic; vertical-align: baseline;\">、エグゼクティブ バイス プレジデント兼最高臨床責任者、Michael J. Schlosser 氏（MD、MBA、FAANS）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療現場では毎日膨大な量の情報とデータが生み出されているにもかかわらず、多くの患者は一連の診療をつながりのないやり取りと感じがちで、一貫した体験として捉えることは稀です。Google Cloud との協業を通じて、AI が医療体験全体にわたる情報の連携をどのように支援できるかを模索しています。患者一人ひとりを包括的にサポートし、よりパーソナライズされた診療体験を創出し、臨床医が適切なタイミングで有意義な洞察を得ることを目指しています。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">Highmark Health</strong><span style=\"font-style: italic; vertical-align: baseline;\">、社長、Karen Hanlon 氏</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療向け Gemini を活用することで、医療体験を向上させ、医療従事者と患者との関係を強めるような方法でテクノロジーを利用できるようになります。こうした統合ソリューションを通じて、臨床チームの事務的な負担を軽減し、最も重要なこと、すなわち患者へのケアに充てる時間を増やすことができると期待しています。テクノロジーは、医療従事者を支援し、医療の核心である人間同士のつながりを強める時に、その真価を発揮するのです。」- </span><strong style=\"font-style: italic; vertical-align: baseline;\">Northwell Health</strong><span style=\"font-style: italic; vertical-align: baseline;\">、社長兼 CEO、John D'Angelo 博士</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">保険適用、給付、事務作業の合理化</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療分野における AI の真の可能性は、単に現在の業務をより迅速に行うことだけではありません。それは、医療システムがより良く機能するための新たな仕組みを創出することにあります。保険会社と医療機関がデータ、知見、ワークフローをよりシームレスに連携できれば、不必要な複雑さを排除し、パフォーマンスを向上させ、システム全体をより適切に機能させることができます。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">Optum Insight</strong><span style=\"font-style: italic; vertical-align: baseline;\">、最高経営責任者、Sandeep Dadlani 氏</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療向け Gemini は、再利用可能な AI エージェントからなる当社の統合アーキテクチャの基盤として機能し、従来の開発サイクルよりもはるかに迅速に、新機能の提供と生産性の向上を実現しています。今後の焦点は、インテリジェンス レイヤがより深い自動化と業務変革を推進するエージェント型 AI モデルであり、当社は、医療分野での実現に向けて、Google Cloud とともに取り組んでいます。」- </span><strong style=\"font-style: italic; vertical-align: baseline;\">Blue Cross Blue Shield of Massachusetts</strong><span style=\"font-style: italic; vertical-align: baseline;\">、最高情報責任者、Prem Somasundaram 氏</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">臨床研究とエビデンスに基づくガイドラインの推進</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「腫瘍学の医療従事者にとって、最新かつ関連性の高い情報に迅速にアクセスできることは、贅沢なことではなく必要不可欠なことです。医療向け Gemini を活用することで、医療従事者が必要とする重要な情報を素早く見つけ、患者により良い治療成果をもたらす手助けとなる可能性に、私たちは大きな期待を寄せています。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">米国臨床腫瘍学会</strong><span style=\"font-style: italic; vertical-align: baseline;\">、最高経営責任者、Clifford Hudis 氏（MD、FACP、FASCO）</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ グレードの基盤上に構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、最先端の AI ラボであると同時に、エンタープライズ クラウドでもあります。医療向け Gemini は、Google Cloud の安全なインフラストラクチャ上で実行され、HIPAA コンプライアンスをサポートするように構築されています。臨床データ、プロンプト、生成された出力結果は、お客様の組織が管理する環境内に留まり、Google の基盤モデルのトレーニングやファインチューニングに利用されることは一切ありません。出力結果は、臨床記録、治療方針、お客様の組織が承認したガイドラインやエビデンスに基づいており、追跡可能な引用情報と監査ログにより、臨床、コンプライアンス、IT の各責任者が可視性と制御を確保できます。また、インフラストラクチャやモデルからセキュリティ、アプリケーション レイヤまで、フルスタックで自社運用しているため、パフォーマンス、信頼性、費用を同時に最適化できます。大量の管理業務を高速かつ低費用なモデルに割り当て、高度な推論を要するモデルを複雑な臨床分析や業務分析に専念させることで、企業全体で AI をスケールさせることが可能です。コストが同じペースで膨らむことはありません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">さらなる展開に向けて</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini のリリースは、あらゆる専門職の皆様が、それぞれの業界の働き方に最適化された Gemini の最先端機能を日常のワークフローで活用できるようにするという、Google のコミットメントを実現するうえで極めて重要な一歩となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、米国で</span><strong style=\"vertical-align: baseline;\">プレビュー版</strong><span style=\"vertical-align: baseline;\">の提供を開始しています。これにより、</span><a href=\"https://cloud.google.com/ai/legal\"><span style=\"text-decoration: underline; vertical-align: baseline;\">法務</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/ai/financial-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">金融サービス</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/gemini-enterprise/gov\"><span style=\"text-decoration: underline; vertical-align: baseline;\">行政サービス</span></a><span style=\"vertical-align: baseline;\">向けに展開中の専用ソリューションに新たな専門領域が加わることとなります。Gemini がいかにして重要な臨床および業務ワークフローを変革できるか、医療システム、医療グループ、医療サービス提供者、保険会社のリーダーの皆様に、ぜひその可能性をご確認いただければ幸いです。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、CEO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Thomas Kurian</strong></p></div>"
