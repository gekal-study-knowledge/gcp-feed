    "title": "医療向け Gemini のご紹介"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/gemini-for-healthcare/"
    "published": "2026-11-19 01:00:00"
    "fetched": "2026-11-19 12:58:42"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 11 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/gemini-for-healthcare?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">すべての医療機関は、より多くの人々に対して、質の高い医療をより抑えたコストで提供することを目指しています。しかし、一般的な AI モデルでは、この課題を解決するには不十分です。現在の医療現場ではデータが断片化されており、患者の記録、保険適用方針、臨床エビデンスは、連携していない記録、請求システム、管理ツールに分散したままです。その結果、医療従事者は情報を手作業で照合することを余儀なくされ、そのために</span><a href=\"https://services.google.com/fh/files/misc/measuring_admin_burden_2024_ebook.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">週に 28 時間近く</span></a><span style=\"vertical-align: baseline;\">も費やしています。患者もまた、自身の治療や保険適用に関する回答を長く待たされることになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">医療機関には、</span><strong style=\"vertical-align: baseline;\">現在利用しているシステム全体を横断して業務を調整できる、安全かつガバナンスの確立された単一のオーケストレーション レイヤ</strong><span style=\"vertical-align: baseline;\">が必要です。このオーケストレーション レイヤは、検証可能なエビデンスを収集しながら、人間による監督のもとでマルチステップ ワークフローを完了まで導く役割を担います。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび発表した医療向け Gemini は、目的に特化した業界向けソリューションであり、先月の Gemini at Work で発表した汎用の </span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェント</span></a><span style=\"vertical-align: baseline;\">を拡張したものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Gemini エージェントは、従業員が目的を委任すると、エージェントが手順を計画し、組織のコンテキストを保持し、最適なモデルにルーティングして、チームがすでに使用しているツール内で完成した成果物を提供する、単独であらゆる業務に対応できる常時稼働のエージェントです。Gemini エージェントは、エンタープライズ グレードの ID 管理、きめ細かいアクセス制御、一元化されたポリシー管理機能をランタイムに直接組み込んで構築されています。各エージェントは、個別の ID で動作し、各ユーザーの既存のロールベースの権限を継承するとともに、すべてのユーザー、サブエージェント、ワークフローにわたって厳格な「知る必要性」の境界を適用し、必要な情報のみにアクセスできるようにします。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、臨床、財務、管理の各システムを横断して連携しながら、ユーザーにアプリケーションの切り替えを強いることなく、マルチステップ タスクをオーケストレートします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">医療機関: </strong><span style=\"vertical-align: baseline;\">Gemini は、さまざまな医療現場における患者の履歴を提供します。カルテは診察前に準備され、承認書類は提出前に保険会社の方針に照らして作成されるため、請求が却下されることが少なくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">保険会社、保険加入者: </strong><span style=\"vertical-align: baseline;\">Gemini は、申請内容を医療方針に照らして確認し、臨床審査担当者が評価しやすい形に整理します。また、加入者に対しては、契約中のプランの文書に基づいて、給付内容や費用負担について分かりやすく案内します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、HIPAA コンプライアンスをサポートするように構築されており、そのすべてが強固なガバナンスのもとで運用されます。現在はプレビュー版をご利用いただけます。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=uqmXoKOs_o0\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">医療向け Gemini は、保険会社や医療機関が複雑な臨床、運用、管理のワークフローをオーケストレートできるようにします。</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">医療向け Gemini は、保険会社や医療機関が複雑な臨床、運用、管理のワークフローをオーケストレートできるようにします。</h4>\n        \n        \n          <p>医療向け Gemini は、保険会社や医療機関が複雑な臨床、運用、管理のワークフローをオーケストレートできるようにします。</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=uqmXoKOs_o0\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">医療向け Gemini の 4 つのコンポーネント</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、医療従事者や医療保険業界のリーダーと共同で開発されました。以下の 4 つのコア コンポーネントで構成されており、保険会社や医療機関向けに、完全に管理された統合環境を提供します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">医療業務向けのスキル: </strong><span style=\"vertical-align: baseline;\">スキルとは、専門家によって作成された再利用可能な指示とコンテキストであり、特定のタスクを実行できるように Gemini に学習させるためのものです。</span><a href=\"https://cloud.google.com/blog/ja/products/ai-machine-learning/welcome-to-gemini-at-work-2026?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini エージェント</span></a><span style=\"vertical-align: baseline;\">は、目的に合わせて設計されたマルチステップの指示により、臨床や管理に不可欠な業務を遂行します。これには、医療記録の統合、診察前の準備、保険の適用範囲や方針の確認、保険給付の判断などが含まれます。各スキルには、組織のポリシーや保険プランのルールを適用できます。また、独自の業務プロセスや標準業務手順に合わせてカスタムスキルを作成することもできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">臨床、財務、運用システムへのコネクタ: </strong><span style=\"vertical-align: baseline;\">コネクタのライブラリにより、組織がすでに運用している EHR、請求、診療、管理のシステムに Gemini を直接連携できます。Gemini は、既存の ID とロールベースのアクセス制御を厳格に維持しながら各システムにクエリを実行するため、機密データを移行したり権限を変更したりすることなく、統合されたコンテキストを取得できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープンな医療パートナー エコシステム: </strong><span style=\"vertical-align: baseline;\">医療機関や保険者ごとに、利用しているシステム構成は異なります。医療分野のシステム インテグレータやデジタルヘルス パートナーと連携することで、Gemini を自組織の業務に合わせて拡張できるほか、既存のシステムと連携させながら、ベンダー ロックインに縛られることなく運用を拡大できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">オープンモデルを選択できる、安全かつ管理されたプラットフォーム:</strong><span style=\"vertical-align: baseline;\"> 臨床、セキュリティ、IT の各リーダーは、エージェントのすべてのやり取りを管理するポリシーを一元的に設定、適用できます。プラットフォームは HIPAA コンプライアンスをサポートするように構築されており、エンタープライズ クラスのアクセス制御、エンドツーエンドの監査ログ、検証可能な引用情報により、審査担当者は各回答の出典を確認できます。エージェントは複数のモデルに対応しているため、複雑な臨床推論には Google やパートナーのフロンティア モデルを利用し、日常的な管理業務には高速で費用効率の高いモデルを利用するといったことが可能です。これらはすべて同一のガバナンスの下で運用されます。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">保険会社や医療機関向けに設計されたスキルで価値の高いワークフローを実現</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、臨床上の意思決定や保険適用の判断を遅らせる、煩雑な情報収集や管理作業を担います。</span></p>\n<p><strong style=\"vertical-align: baseline;\">医療現場:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">断片的な情報源から経時的なタイムラインを構築:</strong><span style=\"vertical-align: baseline;\"> EHR と外部記録を統合し、現在進行中の疾患と解決済みの問題を区別します。さらに、アレルギー情報を整理し、投薬情報の不一致を特定します。医療従事者は、複数のシステムに散在する情報を手作業で寄せ集めることなく、根拠のある統一された患者の全体像を数分で把握できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">患者ごとの事前準備を効率化:</strong><span style=\"vertical-align: baseline;\"> 診察や処置の前に患者のカルテを準備し、前回受診以降の出来事、現在の投薬状況、未処理の許可申請、検査、同意事項などを整理することで、医療チームが全体像を把握したうえで診療に臨めるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">医療承認申請や異議申し立てを効率化:</strong><span style=\"vertical-align: baseline;\"> カルテから必要な根拠情報を抽出し、監査対応可能な資料を審査用に作成します。これは保険会社の方針に準拠しており、却下された後ではなく、提出前に文書上の不備を指摘します。申請が却下された場合でも、根拠を裏付ける記録により、臨床記録と保険プランの方針に直接基づいた異議申し立ての下書きを作成します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">保険適用判断:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">保険会社の審査を迅速化:</strong><span style=\"vertical-align: baseline;\"> 受領した申請内容を医療保険の医療方針と照合し、審査担当者向けに結果を整理します。判断根拠は提出された文書と保険適用方針まで追跡可能です。審査担当者は、情報収集に費やす時間を減らし、専門的な判断に充てる時間を増やすことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">給付内容と患者の自己負担額を明確化:</strong><span style=\"vertical-align: baseline;\"> 複雑な給付規定を解析し、自己負担額の見積もり、免責額の追跡、ネットワーク内医療機関の状況確認を行い、保険加入者の実際の契約内容に基づいて、サービス担当者に詳細な説明を提供します。Medicare Advantage の加入者については、保険プランの内部規則がより厳格な場合には、Medicare の給付基準を適用します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">医療技術スタック全体をカバーするオープンなコネクタ エコシステム</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、安全な</span><a href=\"https://cloud.google.com/gemini-enterprise/connectors\"><span style=\"text-decoration: underline; vertical-align: baseline;\">コネクタ</span></a><span style=\"vertical-align: baseline;\">を介して、臨床、運用、業界の基幹システムに直接接続し、各ソースシステムの既存のロールベース アクセス制御とデータ権限を継承します。</span></p>\n<p><strong style=\"vertical-align: baseline;\">EHR と臨床データの統合:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Epic EHR</strong><span style=\"vertical-align: baseline;\">: 承認されたユーザーに対して、患者の状態、投薬情報、検査結果、臨床記録、専門医の診療記録への読み取り専用アクセスを提供します。基盤となるカルテへの</span><a href=\"https://docs.cloud.google.com/gemini/enterprise/docs/connectors/epic\"><span style=\"text-decoration: underline; vertical-align: baseline;\">書き戻しは行わない</span></a><span style=\"vertical-align: baseline;\">ため、臨床データの完全性を維持できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Oracle Health EHR: </strong><span style=\"vertical-align: baseline;\">承認されたユーザーに対して、患者の病歴、診断結果、検査結果、臨床文書を読み取り専用で提供します。書き戻しを一切行わないことで、記録元システムのデータの完全性を確保します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">InterSystems FHIR Server</strong><span style=\"vertical-align: baseline;\">: EHR 統合にとどまらず、InterSystems FHIR MCP Server より、FHIR リポジトリの標準化された高性能な管理機能と、臨床データの相互運用性を提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verato: </strong><span style=\"vertical-align: baseline;\">患者の身元を統合管理し、異なる受診履歴や複数のデータソースに存在する患者記録の照合を行います。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keragon - Healthcare Integrations: </strong><span style=\"vertical-align: baseline;\">EHR を含む 400 以上の医療アプリケーションとの接続性を提供し、単一の MCP 統合を通じて既存の医療システムを安全に接続できるようにします。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">受給資格、請求、料金設定:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optum Coordination of Benefits: </strong><span style=\"vertical-align: baseline;\">患者が加入している追加の保険適用を特定し、請求前に給付の適用順序を判断します。現在は医療向け Gemini の検証段階にあり、限定的にサービスを提供しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optum Network Eligibility</strong><span style=\"vertical-align: baseline;\">: 連携済みの医療保険プランから、患者の受給資格と給付状況の詳細をリアルタイムで取得します。現在は医療向け Gemini の検証段階にあり、限定的にサービスを提供しています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TriZetto Provider Solutions:</strong><span style=\"vertical-align: baseline;\"> TriZetto の広範なネットワークを通じて、Medicare、Medicaid、主要な民間保険プランにおける患者の受給資格、補償範囲、自己負担額、免責額を確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GoodRx</strong><span style=\"vertical-align: baseline;\">: 医療チームが AI を活用したワークフロー内で、処方薬の価格や、割引オプション（製薬会社が提供する自己負担プログラムなど）を直接確認できるようにすることで、患者がより手頃な価格で医薬品を入手できるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Infinitus Relay:</strong><span style=\"vertical-align: baseline;\"> 事前承認や給付確認に必要な、保険会社への大量の電話連絡を自動化します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">医療用語、コーディング:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">IMO Health:</strong><span style=\"vertical-align: baseline;\"> 医療用語の標準化、臨床検索、ナレッジグラフを医療スキルおよび管理されたエージェント ワークフローに組み込みます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ICD-10 Codes:</strong><span style=\"vertical-align: baseline;\"> ICD-10-CM 診断コード、請求可能ステータス、階層構造を検索および検証します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">RxNorm Drug Vocabulary:</strong><span style=\"vertical-align: baseline;\"> 標準化された医薬品名、成分、効力、剤形、NDC を検索します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">保険適用範囲と医療提供者に関する参照情報:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">CMS の補償範囲</strong><span style=\"vertical-align: baseline;\">: Medicare の保険適用規則、National Coverage Determinations および Local Coverage Determinations（NCDs/LCDs）に直接接続し、保険適用の根拠が静的なモデルの知識ではなく、現在公表されている方針に基づいていることを保証します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">NPPES NPI Registry</strong><span style=\"vertical-align: baseline;\">: 医療提供者の身元、臨床分類、診療場所をリアルタイムで検証します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">エビデンスに基づくガイドライン:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optum EvidenceVue: </strong><span style=\"vertical-align: baseline;\">Optum Life Sciences の AI を活用したワークフローを通じて、実臨床データを実用的なエビデンスに変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">BMJ Digital Health: </strong><span style=\"vertical-align: baseline;\">専門家が厳選した、体系化された査読済みの臨床ガイドラインとエビデンスを提供し、検証可能な引用に基づいて診療や保険適用に関する意思決定を裏付けます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">臨床や業務のワークフロー:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Salesforce</strong><span style=\"vertical-align: baseline;\">: Headless Salesforce Health Cloud との統合により、ワークフロー、データモデル、Agentforce を Gemini に組み込み、業務フロー内で管理されたアクションを実行できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Suki</strong><span style=\"vertical-align: baseline;\">: 医療ワークフロー全体に Ambient Clinical Intelligence を提供し、臨床における会話を実用的なインテリジェンスに変換して、ドキュメント作成、コーディング、収益サイクル管理、臨床推論を強化します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">UiPath: </strong><span style=\"vertical-align: baseline;\">医療対応の UiPath 自動化とエージェントを接続し、業務レビュー、事前承認、異議申し立てのために、引用情報に基づいたコンテキストを構築できるよう支援します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Synthpop Careflow: </strong><span style=\"vertical-align: baseline;\">紹介の受付、保険適用の確認、患者のフォローアップといった患者の診療プロセス全体を管理し、構造化されていない紹介情報を、手動での再入力なしに、保険会社が対応可能な検証済みの指示書へと変換します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Alteryx: </strong><span style=\"vertical-align: baseline;\">医療チームが専門知識を自動化された分析ワークフローに変換できるようにします。AI による洞察を、可視化され、理解しやすく、再現可能で、監査可能なビジネスルールや計算に基づいて確立します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">企業の生産性とコラボレーション:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sana from Workday:</strong><span style=\"vertical-align: baseline;\"> 人事、財務、企業のナレッジを連携させることで、医療チームが診療方針を確認し、タスクを調整し、管理システム全体で業務を遂行できるようにします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ServiceNow: </strong><span style=\"vertical-align: baseline;\">企業の既存のルーティング ルールを適用しながら、IT インシデント、運用サービス リクエスト、承認プロセスを追跡します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Microsoft 365</strong><span style=\"vertical-align: baseline;\">: Word、Outlook、SharePoint と直接連携し、作成済みの承認書類、異議申し立て書、給付内訳を、既存のツールに直接配信できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Workspace</strong><span style=\"vertical-align: baseline;\">: Google ドキュメント、Gmail、Google ドライブ、Google スプレッドシートとシームレスに連携し、内部ファイルを可視化して管理ワークフローを調整すると同時に、企業のアクセス制御を徹底します。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">セキュリティとコンプライアンス:</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cyera Dataport</strong><span style=\"vertical-align: baseline;\">: Cyera との統合によりデータとエージェントのセキュリティを確保し、保護医療情報（PHI）のコンテキストを提供することで、HIPAA 監査やコンプライアンス報告をサポートします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">グローバルな実装パートナーとエコシステム</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google のオープン プラットフォームを通じて、</span><strong style=\"vertical-align: baseline;\">ASCO Oncology Guideline Assistant</strong><span style=\"vertical-align: baseline;\"> などの専門的なパートナー エージェントをデプロイすることも、</span><strong style=\"vertical-align: baseline;\">66degrees、Accenture、Altimetrik、AuxoAI、Cognizant、Deloitte、Egen、HCLTech、KPMG、NTT DATA、PwC、Quantiphi、Slalom、Tata Consultancy Services、TEKsystems Global Services、Wipro</strong><span style=\"vertical-align: baseline;\"> といった医療分野のシステム インテグレータと連携することも可能です。ベンダー ロックインを回避しながら、複雑なエンタープライズ アーキテクチャ全体でこれらの機能をカスタマイズ、統合、スケーリングできます。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=VIBvNUWB-NQ\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">医療向け Gemini のご紹介</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Optum Insight が、医療向け Gemini があらゆる段階で医療従事者に価値をもたらす仕組みを解説します。</h4>\n        \n        \n          <p>Optum Insight が、医療向け Gemini があらゆる段階で医療従事者に価値をもたらす仕組みを解説します。</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=VIBvNUWB-NQ\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">大手医療機関と共同で開発</strong></h4>\n<p><span style=\"vertical-align: baseline;\">すでに多くの医療システム、医療保険事業者、大学病院、臨床リーダーが Google Cloud と連携して、医療の提供、保険運用、医学研究の各分野において、さまざまな機能を構築し、活用しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">医療現場における患者情報の統合</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医師が患者の病歴に簡単にアクセスして把握できるようになれば、情報収集に費やす時間を減らして、患者のケアに集中する時間を増やすことができます。Google Cloud との協業を通じて、Gemini が複数の電子医療記録システムや医療現場から得られる複雑な患者情報をどのように解釈、統合できるかを模索しています。さまざまなソースからのデータを結び付けることで、臨床医は患者の病歴をより完全かつ包括的に把握できるようになるでしょう。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">HCA Healthcare</strong><span style=\"font-style: italic; vertical-align: baseline;\">、エグゼクティブ バイス プレジデント兼最高臨床責任者、Michael J. Schlosser 氏（MD、MBA、FAANS）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療現場では毎日膨大な量の情報とデータが生み出されているにもかかわらず、多くの患者は一連の診療をつながりのないやり取りと感じがちで、一貫した体験として捉えることは稀です。Google Cloud との協業を通じて、AI が医療体験全体にわたる情報の連携をどのように支援できるかを模索しています。患者一人ひとりを包括的にサポートし、よりパーソナライズされた診療体験を創出し、臨床医が適切なタイミングで有意義な洞察を得ることを目指しています。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">Highmark Health</strong><span style=\"font-style: italic; vertical-align: baseline;\">、社長、Karen Hanlon 氏</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療向け Gemini を活用することで、医療体験を向上させ、医療従事者と患者との関係を強めるような方法でテクノロジーを利用できるようになります。こうした統合ソリューションを通じて、臨床チームの事務的な負担を軽減し、最も重要なこと、すなわち患者へのケアに充てる時間を増やすことができると期待しています。テクノロジーは、医療従事者を支援し、医療の核心である人間同士のつながりを強める時に、その真価を発揮するのです。」- </span><strong style=\"font-style: italic; vertical-align: baseline;\">Northwell Health</strong><span style=\"font-style: italic; vertical-align: baseline;\">、社長兼 CEO、John D'Angelo 博士</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">保険適用、給付、事務作業の合理化</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療分野における AI の真の可能性は、単に現在の業務をより迅速に行うことだけではありません。それは、医療システムがより良く機能するための新たな仕組みを創出することにあります。保険会社と医療機関がデータ、知見、ワークフローをよりシームレスに連携できれば、不必要な複雑さを排除し、パフォーマンスを向上させ、システム全体をより適切に機能させることができます。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">Optum Insight</strong><span style=\"font-style: italic; vertical-align: baseline;\">、最高経営責任者、Sandeep Dadlani 氏</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「医療向け Gemini は、再利用可能な AI エージェントからなる当社の統合アーキテクチャの基盤として機能し、従来の開発サイクルよりもはるかに迅速に、新機能の提供と生産性の向上を実現しています。今後の焦点は、インテリジェンス レイヤがより深い自動化と業務変革を推進するエージェント型 AI モデルであり、当社は、医療分野での実現に向けて、Google Cloud とともに取り組んでいます。」- </span><strong style=\"font-style: italic; vertical-align: baseline;\">Blue Cross Blue Shield of Massachusetts</strong><span style=\"font-style: italic; vertical-align: baseline;\">、最高情報責任者、Prem Somasundaram 氏</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">臨床研究とエビデンスに基づくガイドラインの推進</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「腫瘍学の医療従事者にとって、最新かつ関連性の高い情報に迅速にアクセスできることは、贅沢なことではなく必要不可欠なことです。医療向け Gemini を活用することで、医療従事者が必要とする重要な情報を素早く見つけ、患者により良い治療成果をもたらす手助けとなる可能性に、私たちは大きな期待を寄せています。」 — </span><strong style=\"font-style: italic; vertical-align: baseline;\">米国臨床腫瘍学会</strong><span style=\"font-style: italic; vertical-align: baseline;\">、最高経営責任者、Clifford Hudis 氏（MD、FACP、FASCO）</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">エンタープライズ グレードの基盤上に構築</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、最先端の AI ラボであると同時に、エンタープライズ クラウドでもあります。医療向け Gemini は、Google Cloud の安全なインフラストラクチャ上で実行され、HIPAA コンプライアンスをサポートするように構築されています。臨床データ、プロンプト、生成された出力結果は、お客様の組織が管理する環境内に留まり、Google の基盤モデルのトレーニングやファインチューニングに利用されることは一切ありません。出力結果は、臨床記録、治療方針、お客様の組織が承認したガイドラインやエビデンスに基づいており、追跡可能な引用情報と監査ログにより、臨床、コンプライアンス、IT の各責任者が可視性と制御を確保できます。また、インフラストラクチャやモデルからセキュリティ、アプリケーション レイヤまで、フルスタックで自社運用しているため、パフォーマンス、信頼性、費用を同時に最適化できます。大量の管理業務を高速かつ低費用なモデルに割り当て、高度な推論を要するモデルを複雑な臨床分析や業務分析に専念させることで、企業全体で AI をスケールさせることが可能です。コストが同じペースで膨らむことはありません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">さらなる展開に向けて</strong></h4>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini のリリースは、あらゆる専門職の皆様が、それぞれの業界の働き方に最適化された Gemini の最先端機能を日常のワークフローで活用できるようにするという、Google のコミットメントを実現するうえで極めて重要な一歩となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">医療向け Gemini は、米国で</span><strong style=\"vertical-align: baseline;\">プレビュー版</strong><span style=\"vertical-align: baseline;\">の提供を開始しています。これにより、</span><a href=\"https://cloud.google.com/ai/legal\"><span style=\"text-decoration: underline; vertical-align: baseline;\">法務</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/ai/financial-services\"><span style=\"text-decoration: underline; vertical-align: baseline;\">金融サービス</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://cloud.google.com/gemini-enterprise/gov\"><span style=\"text-decoration: underline; vertical-align: baseline;\">行政サービス</span></a><span style=\"vertical-align: baseline;\">向けに展開中の専用ソリューションに新たな専門領域が加わることとなります。Gemini がいかにして重要な臨床および業務ワークフローを変革できるか、医療システム、医療グループ、医療サービス提供者、保険会社のリーダーの皆様に、ぜひその可能性をご確認いただければ幸いです。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、CEO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Thomas Kurian</strong></p></div>"
  "d973bde08b26fbd68a2dd0c4d6f6a0fc":
    "id": "d973bde08b26fbd68a2dd0c4d6f6a0fc"
    "title": "Cloud CISO の視点: 2027 年のセキュリティ動向予測"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/cloud-ciso-perspectives-our-security-forecast-2027/"
    "published": "2026-11-19 11:00:00"
    "fetched": "2026-11-19 21:46:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/cloud-ciso-perspectives-our-security-forecast-2027?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">2026 年 11 月最初の「Cloud CISO の視点」をお読みいただきありがとうございます。今回は、CISO の Chris Betz が、Google、Google Cloud、Mandiant のトップリーダーからの見解を交えながら、2027 年のセキュリティ動向予測をご紹介します。</span></p>\n<p><span style=\"vertical-align: baseline;\">これまでのすべての「Cloud CISO の視点」と同様、このニュースレターのコンテンツは</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud 公式ブログ</span></a><span style=\"vertical-align: baseline;\">に投稿されます。このニュースレターをウェブサイトでご覧になっており、メール版の受信をご希望の方は、</span><a href=\"https://cloud.google.com/resources/google-cloud-ciso-newsletter-signup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらからご登録</span></a><span style=\"vertical-align: baseline;\">ください。</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Google Cloud で取締役向けの重要な情報を得る&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1ea6549810&gt;), (&#x27;btn_text&#x27;, &#x27;インサイト ハブを見る&#x27;), (&#x27;href&#x27;, &#x27;https://cloud.google.com/solutions/security/board-of-directors?utm_source=cgc-site&amp;utm_medium=et&amp;utm_campaign=FY26-Q2-GLOBAL-GCP39634-email-dl-dgcsm-CISOP-NL-177159&amp;utm_content=-&amp;utm_term=-&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">2027 年のセキュリティ動向予測</strong></h3>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、CISO、Chris Betz</span></p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_PYRwidS.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Chris Betz, CISO, Google Cloud</p></figcaption>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>今回は、エージェント型の脅威、攻撃戦術の変化、必要とされる新たなセキュリティ防御アプローチなど、2027 年に予想されるサイバーセキュリティのトレンドと課題に関するインサイトをお届けします。</p><p>今年は、サイバーセキュリティにおいて根本的な変化が見られました。年初には、LLM やエージェントを使用して脆弱性を発見し、対処している組織はごくわずかでした。しかし現在では、企業全体で大規模に実施されるようになっています。</p><p>多くの組織は、エージェント型攻撃によって、その規模、スピード、巧妙さが人間のみの対応能力を凌駕することを予見していました。そして現在、私たちはそれが現実に起きているのを目の当たりにしています。また、前例のない速度でソフトウェア開発が進む世界も予見していました。そして現在、私たちは数週間や数か月ではなく、数時間から数日でリリースされるソフトウェアのセキュリティを確保しようとしています。</p><p>私たちは多くの節目を乗り越えてきました。もはや以前の状態に戻ることはありません。そして現在、誰もがこの新たな現実を正しく理解しようと努めています。</p><p>これからの一年は、挑戦に満ち、刺激的で、革新的な年になるでしょう。そして、その変化の勢いは 2026 年をもしのぐものになるはずです。今後一年で、エンタープライズ ソフトウェアは大きく変化するでしょう。エージェント型開発がもたらすアジリティとスピードによって、私たちは静的なアプリケーションの集合体から脱却し、価格設定、サプライヤーとの契約交渉、資本配分、サプライチェーンの再構築をリアルタイムで行える、自律型エージェントのダイナミックな基盤へと移行していくでしょう。</p><p>こうしたビジョンを実現するために、多くの組織がエージェントの構築を急いでいます。開発モデルと運用モデルが信頼性と安全性を確保できるように設計することは、この業界全体の責務です。</p><p>2027 年に予想されるリスクは、単なるサーバーの停止やデータベースの盗難にとどまりません。エージェント オペレーションの世界が本格化するにつれ、エージェントが依存するデータやテクノロジーの基盤についても十分な注意を払う必要があります。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">エージェントが重要な意思決定を行った際には、その判断に至る経緯を完全に再構築できなければなりません。具体的には、どのような入力が与えられたのか、エージェントがそれらをどのように推論したのか、どのツールを呼び出したのか、どのようなパラメータを渡したのか、なぜポリシー上その実行が許可されたのか、といったことを後から追跡できる必要があります。監査証跡がなければ、問題をデバッグすることも、判断の正しさを検証することも、エージェントを信頼することもできません。そのような信頼できないエージェントを大規模に展開することはできません。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Google Cloud、最高プロダクト責任者兼最高顧客責任者、Karthik Narain</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これからのセキュリティは、意思決定の完全性を確保することで、企業の財務基盤を守れるよう進化していかなければなりません。自律型システムによって行われるあらゆる重要なアクションには、改ざん防止機能を備えた完全な意思決定トレースが必要であり、以下を記録および追跡する必要があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">システムに入力されたデータ。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">モデルが意思決定に至るまでの推論プロセス。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">モデルが呼び出したツール、渡したパラメータ、ポリシーがそれを許可した理由。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">これらのデータを収集することで、スケーリングを行う前に、自動化されたすべての意思決定を再構築、検証、監査できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">アラートキューを解消する: チケットの追跡から指針の確立へ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">何十年もの間、セキュリティ オペレーション センター（SOC）は、深刻なアラート疲れに悩まされてきました。アラートが多すぎるうえに、従来のセキュリティ ツールでは調査が不完全なまま人間のアナリストに引き継がれるという状況が重なっていました。自律的な脅威が数分でネットワークを調査し、横展開できる時代において、人間の防御担当者が 8 つの異なるコンソールに分散したログを手作業でつなぎ合わせたり、個々の防御アクションをマイクロ秒単位のスピードで承認したりすることは不可能です。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">2027 年は、アナリストがアラートの追跡をやめ、成果を形にし始める年です。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Google Cloud Security、エンジニアリング担当バイス プレジデント、Ramya Chitrakar</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">運用モデルを転換することで、2027 年には、この機能不全に陥ったアラートキューは解消されます。アラートは、調査の最終的な成果物となります。自律型の防御エージェントがデータの拡充、相関分析、トリアージを自動的に処理し、未加工のチケットではなく、検証済みの結論を提示するようになります。</span></p>\n<p><span style=\"vertical-align: baseline;\">人間のアナリストは、アラート対応に追われるのではなく、より高度な役割を担うようになり、戦略的な指針の策定、リスク許容度の定義、自動化アクションの検証などを行います。ここで重要となるのは迅速な説明可能性であり、あらゆる防御上の意思決定について、人間が 60 秒以内にその判断理由を理解でき、必要であれば 30 秒以内に取り消せることが求められます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Beyond Zero に向けて: トランザクション レベルの信頼とファースト クラスのエージェント ID</strong></h3>\n<p><span style=\"vertical-align: baseline;\">企業がマルチクラウド環境に数千ものカスタム エージェントをデプロイするなか、フラットな信頼アーキテクチャ、共有の人間サービス アカウント、包括的な管理者トークンにより、内部ワークフローがプロンプト インジェクションやラテラル ムーブメントの格好のエントリー ポイントになりつつあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">従来のゼロトラストは、自律的に動作するソフトウェアを管理するには厳格すぎ、範囲が広すぎます。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">ゼロトラストのコンセプトを、ネットワークやマシンのレイヤだけでなく、トランザクション レイヤにまで拡張する必要があります。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Google、セキュリティ エンジニアリング担当バイス プレジデント、Heather Adkins</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">今後 1 年は、</span><a href=\"https://blog.google/security/going-beyond-zero-a-new-paradigm-for-enterprise-security/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Beyond Zero</span></a><span style=\"vertical-align: baseline;\"> へのアーキテクチャの転換が求められます。これにより、個々のトランザクション、ネットワーク パケット、特定の時点の認可に至るまで検証を拡張できるようになります。また、すべての自律型エージェントはファースト クラスの ID として扱い、それぞれに検証可能な認証情報、厳格な最小権限のスコープ、オープンな通信標準を適用する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">リアルタイムの自律的な推論に裏付けられたシステムであれば、火曜日にトランザクションを許可し、状況が異常であると判断された場合には、水曜日にまったく同じリクエストをブロックするといった動的な対応が可能です。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">ライブのランタイム環境と欠陥のないコードとの間のループを閉じる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ソフトウェアの作成とセキュリティの確保という従来の境界線は崩れつつあります。その一方で、攻撃者はコーディング アシスタントがコードベースに取り込む</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">オープンソース ライブラリ</span></a><span style=\"vertical-align: baseline;\">や外部ツールを積極的に標的にしています。デベロッパーはもはや、何週間もかかる手動のセキュリティ レビューの結果を待てなくなっています。しかし、検証されていない自動パッチを本番環境に急いでデプロイすることは、脆弱性そのものと同じくらいビジネスの継続性にとって危険です。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">攻撃者は、モデルの数式やアルゴリズムだけを攻撃しているわけではありません。実際には、エージェント型コーディング アシスタントがコードベースに自動的に取り込むオープンソース ソフトウェア、サプライ チェーン、MCP ツール、外部ライブラリを汚染しているのです。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Google Threat Intelligence 担当バイス プレジデント、Sandra Joyce</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">2027 年には、セキュリティはソフトウェア デリバリー パイプラインに直接組み込まれた、クローズドループの継続的なシステムになります。エージェント推論をデベロッパー ツールに組み込むことで、コードが記述される過程で、脅威モデリングと設定エラーの検出を並行して行うことが可能になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、本番環境をソースコードに直接紐付けることも極めて重要です。これにより、防御側は実際の脆弱性を正確なコード行まで追跡して、それが本当に悪用可能かどうかを検証し、本番環境を停止させることなく、事前テスト済みの修正プログラムを適用できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">内部のグラウンド トゥルースを防御側の決定的な優位性に変える</strong></h3>\n<p><span style=\"vertical-align: baseline;\">サイバーセキュリティにおいて攻撃者が優位に立つことへの懸念は依然として存在しており、2027 年には自律的な機能によってその差がさらに広がるのではないかと多くの人が恐れています。敵対者はすでに、6 か月分の偵察活動を数時間にまで短縮しており、ベンダーが脆弱性の存在に気づく前にそれらを悪用しています。防御側にとってさらに厄介なのは、コードやクラウドに存在するあらゆる脆弱性を、単一のモデルだけで発見、修正できるわけではないということです。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">防御側の強みは、攻撃者が断片的な外部視点と推測に頼らざるを得ないことにあります。防御側は、完全なグラウンド トゥルース、ID 権限グラフ、内部ネットワーク アーキテクチャ、コードリネージ、リアルタイムの実行状況を把握しています。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Google Threat Intelligence 担当バイス プレジデント、Sandra Joyce</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">今後 1 年間で、防御側は自律型テクノロジーを使用して、外部の攻撃者が決して得ることのできない唯一のもの、すなわち完全な内部のグラウンド トゥルースを最大限に活用することになるでしょう。攻撃者が断片的な外部視点と推測に基づいて行動する一方で、防御側は、ID 権限グラフ、内部ネットワーク アーキテクチャ、コードリネージ、リアルタイムの実行状況について全体像を把握しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした統合されたコンテキストをマルチモデル アンサンブルにフィードする（たとえば、継続的なスキャン用の軽量モデルと、検出結果を相互検証して誤検出を排除する高度な推論モデルを組み合わせる）ことで、単独では無害に見える権限と設定の有害な組み合わせを、外部の攻撃者がそれらを結びつける前に特定して修正できます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">非対称な攻撃スピードと新たな恐喝戦術に対抗する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">2027 年になっても、すべての攻撃者が同じようにマシンスピードを活用するわけではありません。国家の支援を受けたエスピオナージ アクターは、長期的な潜伏活動が露見するリスクを避けるため、アラートを大量に発生させかねない派手で超高速な自動化攻撃を避けることが多いのに対し、サイバー犯罪者は自律化されたスピードを最大限に活用する傾向があります。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">私たちが今まさに目にしているのは、ベンダー自身がまだ脆弱性を認識する前に、それらを悪用しているさまざまな攻撃者の存在です。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Mandiant Consulting、CTO、Charles Carmakal</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エンドポイント防御が従来のファイル暗号化型ランサムウェアをブロックする能力を高めていくにつれ、犯罪グループは、迅速かつ大規模なデータ窃取や恐喝へと手口を変えつつあります。具体的には、独自のモデル重み、カスタム エージェント スキル、プロンプト ライブラリ、クラウド GPU コンピューティング（「</span><a href=\"https://cloud.google.com/blog/ja/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLMJacking</span></a><span style=\"vertical-align: baseline;\">」）を標的としています。</span></p>\n<p><span style=\"vertical-align: baseline;\">この状況に備えるには、セキュリティのサイロ化を解消することが不可欠です。モデル、エージェントの権限、ソフトウェア サプライ チェーン、クラウド インフラストラクチャを別々のドメインとして扱うことは、重大な障害点となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">代わりに必要なのは、それらを単一のインテリジェンス主導のガバナンス フレームワークの下に統合することです。そうすることで、防御側は高価値な自律型アセットを適切に保護し、機密データが環境外へ流出する前に、恐喝につながる攻撃経路を遮断できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">攻撃者に先んじてエージェント型企業をレッドチーム演習で検証する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">来年に向けて生産性の向上を急ぐあまり、敵対的な圧力下でシステムがどのように動作するかをテストすることなく、カスタム エージェントを中核となるビジネスワークフローに直接デプロイしている企業が多く見られます。しかし、このような誤った施策により、システムは、ガードレールの突破、スキャナの無力化、間接的なプロンプト インジェクションに対して脆弱な状態になってしまいます。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">ここ数年、私たちのチームはエージェント型ソリューションを対象とした数多くのレッドチーム演習を実施してきました。これにより、攻撃者が実際の組織に対して攻撃を仕掛ける前に、問題を特定して修正する機会を得ることができます。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Mandiant Consulting、CTO、Charles Carmakal</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">今後は、本番環境で自律型ワークフローを運用する前に、継続的かつプロアクティブなレッドチーム演習を必須要件とすべきです。デプロイする前に、エージェント システムに侵入し、安全制御を突破し、モデル挙動の操作を体系的に試みることは、エージェントの時代の安全を確保する上で極めて重要です。</span></p>\n<p><span style=\"vertical-align: baseline;\">特に重要なのは、モデルの安全性設計において、これらのテスト結果と、新たな攻撃プロンプトや回避手法に関する最前線の脅威インテリジェンスを組み合わせることです。そうすることで、攻撃者が実際の被害組織に対して新たな攻撃手法を使用する前に、防御側は分類器を強化し、それらの攻撃を無効化できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">エージェントの乱立を防ぐための専門エージェント チームを組織的に編成する</strong></h3>\n<p><span style=\"vertical-align: baseline;\">2027 年には、単一の汎用エージェントに企業の防御を任せるアプローチは通用しなくなるでしょう。なぜなら、高度な技術的スキルはドメインをまたいで転用できないからです。たとえば、マルウェアをリバース エンジニアリングするために構築されたエージェントは、ID の影響範囲を推論するエージェントではありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">一方で、企業の各部門が中央集権的な管理体制なしに独自のエージェントを次々と導入することで、エージェントが無秩序に増加してしまうことが新たな課題として浮上しています。これは、かつての</span><a href=\"https://cloud.google.com/transform/these-4-ai-governance-tips-help-counter-shadow-agents\"><span style=\"text-decoration: underline; vertical-align: baseline;\">シャドー IT の新たな形態</span></a><span style=\"vertical-align: baseline;\">とも言える現象であり、不十分なガバナンスによってエンタープライズ エージェントの活用を阻害するリスクがあります。</span></p></div>\n<div class=\"block-pull_quote\"><div class=\"uni-pull-quote h-c-page\">\n  <section class=\"h-c-grid\">\n    <div class=\"uni-pull-quote__wrapper h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n      <div class=\"uni-pull-quote__inner-wrapper h-c-copy h-c-copy\">\n        <q class=\"uni-pull-quote__text\">技術の導入がアーキテクチャのガバナンスを上回ってはなりません。私たちはマシンスピードでの防御を優先しなければなりません。セキュリティは、イノベーションを遅らせる手動のチェックポイントのままであってはなりません。</q>\n\n        \n          <cite class=\"uni-pull-quote__author\">\n            \n            \n              <span class=\"uni-pull-quote__author-meta\">\n                \n                  <strong class=\"h-u-font-weight-medium\">Google Threat Intelligence 担当バイス プレジデント、Sandra Joyce</strong><br />\n                \n                \n              </span>\n            \n          </cite>\n        \n      </div>\n    </div>\n  </section>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">連携の取れた人間のチームが、一人のジェネラリストに勝るように、これからの時代に求められるのは、ハンター、デコーダー、レスポンダーといった専門エージェントが連携するオーケストレートされたネットワークです。そこでは、各エージェントが独自の専門知識、メモリ、専用ツールを駆使して役割を担います。</span></p>\n<p><span style=\"vertical-align: baseline;\">大規模な成功を収めるには、まずガバナンスとオーケストレーション レイヤを構築する必要があります。ここで重要となるのは、段階的な自律性の確立、状態の共有、専門エージェント間のスムーズな引き継ぎを実現するとともに、自律的に行動すべきタイミングと人間にエスカレーションすべきタイミングを正確に把握する中央コーディネーターを確立することです。</span></p>\n<p><span style=\"vertical-align: baseline;\">2027 年のサイバーセキュリティに関するガイダンスについて詳しくは、Security 2027 の動画をご覧ください。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=BtvVsGDTkYI\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Security 2027: How We Defend What’s Next</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n        \n          <p>Security 2027: How We Defend What’s Next</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=BtvVsGDTkYI\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;Google Cloud CISO Community にご参加ください&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1ea65499d0&gt;), (&#x27;btn_text&#x27;, &#x27;詳細&#x27;), (&#x27;href&#x27;, &#x27;https://rsvp.withgoogle.com/events/google-cloud-ciso-community-interest-form-2026?utm_source=cgc-blog&amp;utm_medium=blog&amp;utm_campaign=FY25-Q1-global-GCP30328-physicalevent-er-dgcsm-parent-CISO-community-2025&amp;utm_content=cisop_&amp;utm_term=-&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">その他の最新情報</strong></h3>\n<p><span style=\"vertical-align: baseline;\">セキュリティ チームからこれまでに届いた今月のアップデート、プロダクト、サービス、リソースに関する最新情報は以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェントの時代にマシンスピードで構築と防御を支援</strong><span style=\"vertical-align: baseline;\">: Security Summit 2026 では、エージェントの時代において、組織が安全に構築を行い、システムを保護し、マシンスピードで防御する方法に関する最新情報をご紹介します。</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/helping-you-build-and-defend-at-machine-speed-in-the-agentic-era?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">How Google Does It: エージェントを活用した脆弱性の発見、追跡、修正</strong><span style=\"vertical-align: baseline;\">: 脅威アクターは、これまで以上に迅速にソフトウェアの欠陥を発見できるようになりました。アジャイルで即応性の高い防御を維持するために、Google では既存の基盤にエージェント システムを導入しています。</span><a href=\"https://cloud.google.com/transform/how-google-does-it-using-agents-help-find-track-and-fix-vulnerabilities\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェントを使用してインサイダー脅威を阻止する方法</strong><span style=\"vertical-align: baseline;\">: エージェントが企業全体に普及するにつれて、エージェント自身がインサイダー脅威になったり、人がインサイダー脅威を引き起こすのを助長したりしないようにする必要があります。</span><a href=\"https://cloud.google.com/transform/how-to-use-agents-to-stop-insider-threats\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz の Red Agent と Blue Agent で SOC チームを強化</strong><span style=\"vertical-align: baseline;\">: Red Agent は、SOC チームに検証済みの侵害前アラートを提供します。Blue Agent は、アクティブな脅威をマシンスピードで調査し、AI 脅威の時代にチームが先手を打てるよう支援します。</span><a href=\"https://www.wiz.io/blog/soc-alerts-red-and-blue-agents\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Wiz Green Agent を活用したエージェントによる修復の ROI</strong><span style=\"vertical-align: baseline;\">: Fireblocks、Rogo、project44 が Green Agent を活用してチーム間の障害を排除し、重大なリスクの解決を加速させた方法をご紹介します。</span><a href=\"https://www.wiz.io/blog/green-agent-agentic-remediation\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コア PHP の脆弱性 CVE-2026-109618 および CVE-2026-10961 への対応</strong><span style=\"vertical-align: baseline;\">: コア PHP 言語ランタイムの 2 つの重大な脆弱性によるリモートコード実行リスクを最小限に抑えるには、これらの推奨事項に従ってください。</span><a href=\"https://cloud.google.com/blog/ja/products/identity-security/responding-to-core-php-vulnerabilities-cve-2026-109618-cve-2026-109619?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">アジア太平洋地域における詐欺対策に向けた連携</strong><span style=\"vertical-align: baseline;\">: アジア太平洋地域における詐欺対策に取り組むために Google が取り組んでいる組み込み型の保護機能、現地パートナーとの連携、啓発活動についてご紹介します。</span><a href=\"https://blog.google/company-news/inside-google/around-the-globe/google-asia/fight-against-apac-scams/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n</ul>\n<p><a href=\"https://cloud.google.com/blog/ja/products/identity-security\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今月公開された</span></a><span style=\"vertical-align: baseline;\">その他のセキュリティ関連の記事については、Google Cloud 公式ブログをご覧ください。</span></p></div>\n<div class=\"block-aside\"><dl>\n    <dt>aside_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;title&#x27;, &#x27;新しいことを学ぶ&#x27;), (&#x27;body&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1ea65d65d0&gt;), (&#x27;btn_text&#x27;, &#x27;今すぐ見る&#x27;), (&#x27;href&#x27;, &#x27;https://www.youtube.com/watch?v=Wpo-5ke9uvQ&#x27;), (&#x27;image&#x27;, None)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">脅威インテリジェンスに関するニュース</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">LLMJacking の台頭: 脅威アクターは侵害したリソースをどのように収益化しているか</strong><span style=\"vertical-align: baseline;\">: Mandiant は 2026 年、脅威アクターが企業の大規模言語モデルへのアクセスを乗っ取る複数のインシデントに対応しました。これは LLMJacking として知られる戦術で、わずか数時間で、クラウド料金の不正な急増を引き起こす可能性があります。</span><a href=\"https://cloud.google.com/blog/ja/topics/threat-intelligence/llmjacking-monetizing-compromised-cloud-models\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">XCPE ボットネットの阻止</strong><span style=\"vertical-align: baseline;\">: Google と業界パートナー各社は、130 万台以上のセットトップ ボックスをボットネットに組み込んでいた XCPE バックドアを解体しました。Google は、このバックドアとボットネットが、Android 端末の相手先ブランド製品製造企業（OEM）および相手先ブランド設計製造企業（ODM）である Videostrong Technology Company によって、金銭的利益を得る目的で意図的に開発、デプロイ、運用されていたと高い確度で評価しました。</span><a href=\"https://cloud.google.com/blog/topics/threat-intelligence/shutting-the-door-on-the-xcpe-botnet\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ARTEX および関連ツール: エージェント型攻撃フレームワークの登場</strong><span style=\"vertical-align: baseline;\">: 9 月以降、Google Threat Intelligence Group と Mandiant は、複数の脅威アクターがオープンソースのエージェント型ペネトレーション テスト フレームワークである ARTEX、Hexstrike、CAIRN を悪用し、攻撃ライフサイクルの複数のフェーズにわたって幅広い活動を展開していることを確認しています。</span><a href=\"https://cloud.google.com/blog/ja/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一時的に行われるサプライ チェーン改ざんの調査</strong><span style=\"vertical-align: baseline;\">: Google Threat Intelligence Group（GTIG）と Mandiant は、わずか 5～10 分間だけ有効になる極めて短い改ざん時間枠で実行され、従来の特定の時点におけるトリアージや自動ファイル スキャンを巧妙に回避するソフトウェア サプライ チェーンの侵害を初めて確認しました。</span><a href=\"https://cloud.google.com/blog/ja/topics/threat-intelligence/hardening-code-pipelines-and-ci-cd-infrastructure?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">詳細はこちら</strong></a><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n</ul>\n<p><a href=\"https://cloud.google.com/blog/ja/topics/threat-intelligence?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今月公開された</span></a><span style=\"vertical-align: baseline;\">その他の脅威インテリジェンス関連の記事については、Google Cloud 公式ブログをご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、CISO、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Chris Betz</strong></p></div>"
  "703041adf09b68a83cccb9a317c2cf92":
    "id": "703041adf09b68a83cccb9a317c2cf92"
    "title": "問題を検出するだけでなく修正まで行う: pull リクエストで CodeMender を実行する方法"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/how-to-run-codemender-in-your-pull-requests/"
    "published": "2026-11-19 10:30:00"
    "fetched": "2026-11-19 21:46:08"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 11 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/how-to-run-codemender-in-your-pull-requests?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">多くのデベロッパーがエージェント型ツールを活用して、これまで以上に迅速にコードを生成するようになった一方で、コードはより複雑化し、ソフトウェアの欠陥を特定して修正するのにより多くの時間を要するようになっています。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、このプレッシャーに対処できるよう支援することを重視しています。</span><a href=\"https://cloud.google.com/security/resources/m-trends\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mandiant M-Trends 2026 レポート</span></a><span style=\"vertical-align: baseline;\">によると、ソフトウェア開発の速度は</span><a href=\"https://dora.dev/insights/balancing-ai-tensions/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">一部のチームでは 2 倍</span></a><span style=\"vertical-align: baseline;\">にまで向上している一方で、デベロッパーがソフトウェアの欠陥を修正するのにかかる平均時間は 10 年前の約 59 日から 2025 年には 170 日以上にまで増加していることを、Google は認識しています。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=p2vmRfShi_U\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">CodeMender: AI を活用した脆弱性修正を GitHub PR 内で直接提供</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n        \n          <p>CodeMender: AI を活用した脆弱性修正を GitHub PR 内で直接提供</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=p2vmRfShi_U\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">より多くのコードをより迅速に保護できるよう、Google は自律型コード セキュリティ エージェントである CodeMender を開発しました。CodeMender は、ソフトウェアの欠陥を圧倒的なスピードで検出および修正できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、デベロッパー ツールは、既存のルーティンに適合して初めて成功すると考えています。そこで、Google の </span><a href=\"https://cloud.google.com/transform/ja/securing-enterprise-agility-in-the-machine-speed-era?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Threat Defense プラットフォーム</span></a><span style=\"vertical-align: baseline;\">の一部である CodeMender は、自動化されたコード修正をデベロッパー ワークフローに直接組み込みます。今回は、Google Cloud Run を介して CodeMender の自動修復を Git pull リクエストに直接組み込むリファレンス アーキテクチャをご紹介します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">デベロッパーに表示される内容</strong></h4>\n<p><span style=\"vertical-align: baseline;\">すべての操作はタイムライン上で完結します。スキャンが完了すると、検出結果の一覧表、ID 付きの各検出結果、そして次に入力できる 2 つのコマンドが、1 つのコメントとして投稿されます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure-1a\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure-1a.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 1: pull リクエストによる Cloud Run 上でのスキャン実行。検出結果、エクスプロイトのトレース、提案されたパッチは、すべて同じタイムラインに返されます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><code style=\"vertical-align: baseline;\">/verify 612424da</code><span style=\"vertical-align: baseline;\"> と返信すると、エクスプロイトの試みがスレッドに返され、折りたたみ式の [View Exploit Steps &amp; Response Trace] ブロックに格納されるため、会話が埋もれることはありません。</span></p>\n<p><code style=\"vertical-align: baseline;\">/fix 612424da</code><span style=\"vertical-align: baseline;\"> と返信すると、同じようにパッチが [Preview Proposed Code Diff] の後ろに届き、すでに作成されているドラフト pull リクエスト上でそのまま </span><code style=\"vertical-align: baseline;\">/approve</code><span style=\"vertical-align: baseline;\"> を行うことができます。どちらのコマンドも、ID の代わりに </span><code style=\"vertical-align: baseline;\">all</code><span style=\"vertical-align: baseline;\"> を使用できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure-2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure-2.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 2: 検出結果の表と実行可能なスラッシュ コマンドを表示する初期スキャン コメント。デベロッパーは pull リクエストのタイムラインから完全に離れることなく作業できます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">デベロッパーが pull リクエストから離れたり、コンソールを学習したりする必要はありません。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">重大度だけでなく、証拠も提供</strong></h4>\n<p><span style=\"vertical-align: baseline;\">CodeMender で </span><code style=\"vertical-align: baseline;\">cm find</code><span style=\"vertical-align: baseline;\"> を実行すると、コード分析中の脆弱性検出に関する信頼スコアが返されます。信頼スコアが 100% 未満の場合は、</span><code style=\"vertical-align: baseline;\">cm verify</code><span style=\"vertical-align: baseline;\"> を使用して、CodeMender にサンドボックス内でエクスプロイトをビルドおよびシミュレートさせ、脆弱性が実際に悪用可能かどうかを判断できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">シミュレーション結果によって重大度が変わる可能性があります。検証サンドボックスは一時的なものであるため、パイプラインはこれらのアーティファクトを Google Cloud Storage へ自動的にストリーミングし、コンプライアンスやセキュリティ運用でのレビューに備えて監査証跡を保存します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure-3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure-3.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 3: /verify コマンドにより返される、サンドボックス内でのエクスプロイト試行のトレース。レビュー担当者には、抽象的なアラートではなく実用的な証拠が提供されます。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">検証パイプラインの障害モードを考慮して設計してください。ハーネスがエクスプロイトの成功を示す文字列のみを検索していると、モック サーバーのクラッシュや実行タイムアウトといったテストの失敗によって、パイプラインがフェイルオープン状態になるおそれがあります。その結果、実際の脆弱性が誤って「安全」と判定されてしまう可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">パーサーが、真陰性の結果とテストのクラッシュを明確に切り分けるようにしてください。エクスプロイトが正常に完了しなかった場合は、正常な状態であると判断するのではなく、ステータスを「不確定」としてフラグを立ててください。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">パッチを提案し、差分をプレビューする</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エクスプロイトによって検出結果が本物であることが証明されたら、次のステップはチケットではなくパッチです。</span><code style=\"vertical-align: baseline;\">cm fix a1b2c3d4</code><span style=\"vertical-align: baseline;\"> で CodeMender にパッチの作成を指示します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure-4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure-4.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 4: /fix コマンドにより返される Unified 形式のコード差分。レビュー担当者がパッチを評価するうえで有意義なコンテキストを提供します。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">差分に問題がなければ、1 ステップで適用できます。デベロッパーが </span><code style=\"vertical-align: baseline;\">/approve</code><span style=\"vertical-align: baseline;\"> と返信します。エージェントはパッチをブランチに commit して push し、commit ステータス </span><code style=\"vertical-align: baseline;\">security/codemender-gate</code><span style=\"vertical-align: baseline;\"> をグリーンに設定します。ブランチ保護によって、そのステータスがマージをブロックする条件として機能するようになります。これがないと、ゲートは単なる参考にとどまります。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">GitHub と Cloud Run の間で鍵の保存は不要</strong></h4>\n<p><span style=\"vertical-align: baseline;\">GitHub と Google Cloud が相互に信頼するまで、この処理は行われません。このエージェントは、ソースコードへの書き込みアクセス権を必要とします。これはまさに、シークレット ストアに保管して漏洩のリスクに晒したくはない認証情報です。代わりに、GitHub Actions で有効期間の短い OIDC トークンを発行し、Google 側でそれを受け入れるよう設定できるため、盗まれるおそれのある長期的な認証情報は一切存在しません。</span></p>\n<p><span style=\"vertical-align: baseline;\">ここでのセキュリティは、ほぼすべて次の 1 行に依存しています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;resource &quot;google_iam_workload_identity_pool_provider&quot; &quot;github&quot; {\\r\\n  workload_identity_pool_provider_id = &quot;github-provider&quot;\\r\\n\\r\\n  oidc {\\r\\n    issuer_uri = &quot;https://token.actions.githubusercontent.com&quot;\\r\\n  }\\r\\n\\r\\n  attribute_mapping = {\\r\\n    &quot;google.subject&quot;          = &quot;assertion.sub&quot;\\r\\n    &quot;attribute.repository_id&quot; = &quot;assertion.repository_id&quot;\\r\\n  }\\r\\n\\r\\n  # Without this, any repository on GitHub can exchange a token against your pool\\r\\n  attribute_condition = &quot;assertion.repository_id == \\&#x27;123456789\\&#x27;&quot;\\r\\n}&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f1ea61e5550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">すべての GitHub Actions ワークフローがその発行元 URL を共有するため、発行元を検証するだけでは意味がありません。実際に機能しているのは、この条件の部分です。</span></p>\n<p><span style=\"vertical-align: baseline;\">何と照合しているかに注目してください。</span><code style=\"vertical-align: baseline;\">assertion.repository</code><span style=\"vertical-align: baseline;\"> でも機能しますが、これはリポジトリ名と照合されます。名前は変更される可能性があり、手放してしまうと他の誰かに取得されるリスクがあります。一方、</span><code style=\"vertical-align: baseline;\">repository_id</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">repository_owner_id</code><span style=\"vertical-align: baseline;\"> は不変であるため、Google では代わりにこれらをマッピングすることをおすすめしています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エクスプロイトを安全に実行できる場所を提供する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">検証では、誰もレビューしておらず、オンデマンドで作成され、モック ターゲットに向けられた、その脆弱性クラス特有の動作を行う攻撃コードが実行されます。最近のニュースでも取り上げられているように、自律型エージェントがタスクを完了する最速の方法として、コンテナから抜け出して内部ネットワークをポートスキャンすることを決定するような事態は、絶対に避けたいものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">判定を信頼する前に、2 つの重要な質問に答える必要があります。そのコードはどこで実行されるのか、そして実行中に何にアクセスできるのか、という点です。その答えは、Cloud Run ジョブとして実行することです。</span></p>\n<p><span style=\"vertical-align: baseline;\">すべての Cloud Run インスタンスはサンドボックス化されており、ジョブは常に第 2 世代の実行環境（Linux と完全な互換性を持つマイクロ VM）で実行されます。実行が開始され、1 つの処理が行われて終了します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"figure-5a\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/figure-5a.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>図 5: 何も保持せず、1 つの検出結果のためだけに存在するインスタンスで実行されるエクスプロイト。判定のみが残ります。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">次に、環境を完全にクリーンにします。ジョブに独自のサービス アカウントを付与し、エクスプロイトを書き込む API 以外の権限は付与しないようにします。Cloud Run は、インスタンスの起動時にコンテナ イメージを pull するのではなく、デプロイ時にインポートするため、レジストリへのアクセスは必要ありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">組織のポリシーによっては </span><code style=\"vertical-align: baseline;\">roles/editor</code><span style=\"vertical-align: baseline;\"> 権限が付与されている可能性があるため、Compute Engine のデフォルト サービス アカウントの使用は避けてください。ネットワークも遮断します。外部へのルートを持たないサブネットへのダイレクト VPC 下り（外向き）を設定すれば、どこにも外部通信できないコードは、検出した情報を持ち出したり、セカンド ステージの攻撃コードを取得したりすることができなくなります。</span></p>\n<p><span style=\"vertical-align: baseline;\">検出結果ごとに 1 つのジョブを実行します。実行が終了すると、インスタンスも終了し、判定だけが残ります。</span></p>\n<p><a href=\"https://cloud.google.com/run/docs/configuring/jobs/sandboxes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Run サンドボックス</span></a><span style=\"vertical-align: baseline;\">または</span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Sandbox</span></a><span style=\"vertical-align: baseline;\"> が、最後のギャップを埋めます。インスタンス内では、プロセスの実行が親ワークロード、環境変数、シークレット、Google Cloud メタデータ サーバーから分離されているため、プラットフォームがデフォルトで割り当てる認証情報にもアクセスできません。エージェントが作成したコードをすぐに実行できるように設計されています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">自律型 GitOps セキュリティ エージェントは今すぐ構築できます。</span><a href=\"https://github.com/GCP-Architecture-Guides/codemender-gitops-starter-kit\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">codemender-gitops</span></a><span style=\"vertical-align: baseline;\"> のリファレンス実装から始めましょう。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">クラウドおよび AI セキュリティ アーキテクト</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Manish Gaur</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">クラウドおよび AI セキュリティ アーキテクト</span><strong style=\"font-style: italic; vertical-align: baseline;\">、Collin Frierson</strong></p></div>"
