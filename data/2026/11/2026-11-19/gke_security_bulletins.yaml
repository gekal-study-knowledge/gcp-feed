    "title": "GCP-2026-088"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-088"
    "published": "2026-11-19 09:00:00"
    "fetched": "2026-11-20 19:55:55"
    "summary": "<p><strong>Published: </strong>2026-11-19</p><p><strong>Reference: </strong><a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-99288\">CVE-2026-99288</a></p><table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A denial-of-service vulnerability (CVE-2026-99288) was discovered in\n        the Linux kernel TCP implementation. The flaw can cause a kernel panic\n        (denial of service) on the affected virtual machine; it does not allow\n        privilege escalation or container breakout to code execution on the\n        host. A remote attacker can trigger it by sending specially crafted TCP\n        packets to a reachable TCP listener on a node, Pod, or the cluster\n        control plane's IP-based endpoint. Internal traffic within the same\n        VPC can also trigger this vulnerability.</p>\n<p>GKE Standard clusters and GKE\n        Autopilot clusters running Container-Optimized OS or\n        Ubuntu prior to the patched versions are affected across both cluster\n        control planes and worker nodes.</p>\n<p>Pods running in GKE Sandbox (gVisor) are not affected.</p>\n<p>Windows Server node pools are not affected.</p>\n<h4 id=\"am-i-affected\" tabindex=\"-1\">Am I affected?</h4>\n<p>The primary risk is from external or cross-project traffic. The\n        following configurations are not exposed to that traffic.</p>\n<h5 id=\"cluster-control-plane\" tabindex=\"-1\">Cluster control plane</h5>\n<ul>\n<li>Clusters using only the DNS-based endpoint (IP-based endpoints\n          disabled with <code dir=\"ltr\">--no-enable-ip-access</code>), because traffic is\n          terminated at Google's Layer 7 frontends.</li>\n<li>Clusters using only a private IP endpoint (external IP endpoint\n          disabled).</li>\n<li>Clusters with an external IP endpoint that restrict access using\n          authorized networks and have Google Cloud public IP access disabled\n          (<code dir=\"ltr\">--no-enable-google-cloud-access</code>).</li>\n</ul>\n<h5 id=\"nodes\" tabindex=\"-1\">Nodes</h5>\n<ul>\n<li>Private nodes whose services are exposed externally exclusively\n          through Layer 7 Application Load Balancers (Ingress or Gateway API) or\n          proxy Network Load Balancers, which terminate external TCP connections\n          upstream.</li>\n</ul>\n<h4 id=\"what-should-i-do\" tabindex=\"-1\">What should I do?</h4>\n<p>All GKE versions running Container-Optimized OS\n        prior to the following versions are affected. Upgrade your cluster\n        control plane and nodes to one of the following patch versions or\n        later:</p>\n<ul>\n<li>1.36.6-gke.1189000 or later</li>\n<li>1.35.10-gke.1155000 or later</li>\n<li>1.34.13-gke.1091000 or later</li>\n</ul>\n<aside class=\"note\"><strong>Note:</strong> Patches for GKE\n        1.37, 1.33, and 1.32 on Container-Optimized OS, as well as Ubuntu\n        node images, are in progress. This bulletin will be updated with\n        additional patched GKE versions as soon as they become\n        available.</aside>\n<p>You can apply patch versions from newer release channels if your\n        cluster runs the same minor version in its own release channel. This\n        feature lets you secure your nodes until the patch version becomes the\n        default in your release channel. For details, see\n        <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/release-channels#newer-patch-versions\">Run patch versions from a newer channel</a>.</p>\n</td>\n<td>High</td>\n</tr>\n</tbody>\n</table>"
