"overview": |
  この日は 4 ソースから 12 本 (うち AlloyDB Omni の 1 本は Google Cloud ブログと AI & ML ブログに重複掲載) で、データ基盤と AI の組み合わせ、セキュリティ運用の評価、国内のパートナー・事例記事が並びました。PostgreSQL 100% 互換でどこでも動く AlloyDB Omni が、ローカルでホストした LLM と連携できるようになり、Gemma 4 や Qwen3.8 などのローカルモデルを使って、クラウド・自社データセンター・ノートPC 上でもデータを手元に置いたままエージェント型の体験を構築できるようになりました。AlloyDB Omni は Google 検索と同じ ScaNN インデックス技術を内蔵し、ベクトル埋め込みの大規模な保存とセマンティック検索、自然言語でのクエリに対応しており、Gemini のようなクラウドのモデルでもローカルモデルでも同じアーキテクチャでローカルのモデルサーバーを呼び出します。また、クラウドコミュニケーション (CPaaS) 大手の Sinch が、Google Cloud Professional Services と組んでエンタープライズデータウェアハウスを Snowflake から BigQuery へ移行した事例が紹介されました。AWS と GCP にまたがり EU・米国・オーストラリアで別々の Snowflake インスタンスを動かしていたことによるリージョン間レプリケーションの複雑さや月次請求の急増を解消し、単一のガバナンスされた信頼できる情報源を確立して予測 AI の基盤とすることを狙っています。セキュリティでは、Google が 2026 年の Gartner Magic Quadrant for SIEM でリーダーに選ばれ、評価対象 15 社の中で「ビジョンの完全性」が最も高い位置づけとなりました。Google Security Operations の Gemini を、Triage and Investigation agent・Threat Hunt agent・Detection Engineering agent などの専用エージェント群へ広げてきたことを挙げています。日本語ブログでは、Partner Marketing Studio に Gemini を使ったエージェント検索・ブランド審査エージェント・ISV アセット作成・複数ネットワークへの同時投稿ができるソーシャルメディアエディタ・130 言語の翻訳などが加わったパートナーマーケティングの新機能 (米国 11 月 20 日の記事の抄訳)、Google Cloud Partner Tech Influencer Challenge 2026 の結果発表 (企業の部の最優秀賞は株式会社 G-gen、Gemini 賞は KDDIアイレット株式会社)、ロッテが開発内製化支援プログラム TAP を活用し、マーケティング本部の工数の 54.4% や中央研究所の業務の 52% を占めていた調整・書類業務を対象に、全体ワークフロー管理 AI を軸とする 6 つの AI で「モノづくり改革」に取り組む事例 (BigQuery、Cloud Run、Gemini など) が公開されています。 後から追加された日本語ブログの抄訳では、Partner Cross-Cloud Interconnect が Microsoft Azure に拡張されてプレビューとなり、Google Cloud と Microsoft が共同でサポートし、物理インフラを管理せずにコンソールや API から数分で Google Cloud と Azure の間にプライベートな高帯域幅接続を張れること (物理的に離れたロケーションでの冗長化、エッジルーター間の自動暗号化、帯域幅に応じた固定料金)、ラスト ワンマイル向けの Partner Cross-Cloud Interconnect が Lumen Technologies とのプレビューで始まり、プライベートクラウドやオンプレミスのデータセンター、ネオクラウドから Google Cloud への専用 L3 プライベート接続を数分で確立できることが紹介されました。また、Gemini Agent Ready (GEAR) の一環として、監視付きの多肢選択式試験と Google Skills のハンズオンラボを組み合わせたハイブリッド形式の Professional Agentic Architect 認定資格が発表されました。セキュリティでは GTIG AI 脅威トラッカーが公開され、2026 年第 2 四半期に脅威アクターがクラウドリソースの侵害からエージェントを使った認証情報の大量窃取キャンペーンの実行まで 6 時間足らずで進めた例や、UNC6780 が AI コーディングアシスタントと LLM セキュリティスキャナーを欺いてオープンソースのサプライチェーン侵害を仕掛けている状況、独自の AI モデルやコードを狙う攻撃、侵害したアカウントやクラウド基盤を使った LLM ジャッキングなどの傾向を報告しています。 リリースノートでは、BigQuery の ML.TREND・ML.SEASONALITY・ML.DETECT_CHANGE_POINTS・ML.CORRELATION の各テーブル値関数と、AI.EMBED・AI.SIMILARITY の組み込みテキスト埋め込みモデル embeddinggemma-300m が一般提供となり、BigQuery Migration Service が Databricks SQL と Apache Spark SQL 3.x・4.x の GoogleSQL への変換と Databricks からのスキーマメタデータ抽出にプレビューで対応しました。Google SecOps の SIEM と SOAR のリリースノートは廃止され、今後は Google SecOps Release Notes に一本化されます。Managed Service for Apache Airflow は、2026 年 12 月から新しいイメージとビルドで Ray の Java ランタイム site-packages/ray/jars/ray_dist.jar を事前インストールしなくなり (Airflow ワーカー内でローカルの Java・クロス言語 Ray ランタイムを起動する場合のみ対応が必要)、同じく 2026 年 12 月から Gen 3 と Gen 2 の新しいビルド・バージョンが Python 3.12 に切り替わって Python 3.11.8 は新しいバージョンで提供されなくなります。Google Cloud NetApp Volumes の Flex File サービスレベルは asia-east2 (香港)・europe-central2 (ワルシャワ)・europe-west6 (チューリッヒ)・europe-west10 (ベルリン)・northamerica-south1 (ケレタロ)・us-south1 (ダラス) で提供されなくなりました。
