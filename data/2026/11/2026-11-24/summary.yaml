  この日は Google Cloud ブログ 2 本と AI & ML ブログ 1 本の計 3 本 (うち 1 本は両ブログに重複掲載) で、データ基盤と AI の組み合わせが中心でした。PostgreSQL 100% 互換でどこでも動く AlloyDB Omni が、ローカルでホストした LLM と連携できるようになり、Gemma 4 や Qwen3.8 などのローカルモデルを使って、クラウド・自社データセンター・ノートPC 上でもデータを手元に置いたままエージェント型の体験を構築できるようになりました。AlloyDB Omni は Google 検索と同じ ScaNN インデックス技術を内蔵し、ベクトル埋め込みの大規模な保存とセマンティック検索、自然言語でのクエリに対応しており、Gemini のようなクラウドのモデルでもローカルモデルでも同じアーキテクチャでローカルのモデルサーバーを呼び出します。また、クラウドコミュニケーション (CPaaS) 大手の Sinch が、Google Cloud Professional Services と組んでエンタープライズデータウェアハウスを Snowflake から BigQuery へ移行した事例が紹介されました。AWS と GCP にまたがり EU・米国・オーストラリアで別々の Snowflake インスタンスを動かしていたことによるリージョン間レプリケーションの複雑さや月次請求の急増を解消し、単一のガバナンスされた信頼できる情報源を確立して予測 AI の基盤とすることを狙っています。
