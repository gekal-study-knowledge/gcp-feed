    "title": "November 24, 2026"
    "link": "https://docs.cloud.google.com/release-notes#November_24_2026"
    "published": "2026-11-24 17:00:00"
    "fetched": "2026-11-25 09:21:53"
    "summary": "<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>The following table-valued functions are now\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA) in the query editor and as part of\n<a href=\"https://docs.cloud.google.com/bigquery/docs/conversational-analytics#bigquery-ml-support\">conversational analytics</a>\nto help you analyze your data:</p>\n<ul>\n<li><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-trend\"><code>ML.TREND</code></a>:\nidentify the directional trajectory of your data.</li>\n<li><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-seasonality\"><code>ML.SEASONALITY</code></a>:\nidentify repeating patterns in your data.</li>\n<li><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-detect-change-points\"><code>ML.DETECT_CHANGE_POINTS</code></a>:\nidentify intervals where structural shifts occur in your data.</li>\n<li><a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-correlation\"><code>ML.CORRELATION</code></a>:\nidentify the statistical correlation between a target column and one or more\nmetric columns.</li>\n</ul>\n<h3>Feature</h3>\n<p>The built-in text embedding model <code>embeddinggemma-300m</code> in the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-embed\"><code>AI.EMBED</code></a>\nand\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-similarity\"><code>AI.SIMILARITY</code></a>\nfunctions is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h3>Feature</h3>\n<p>BigQuery Migration Service supports translating Databricks SQL and Apache\nSpark SQL 3.x and 4.x into GoogleSQL and extracting schema metadata from\nDatabricks in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/bigquery/docs/migration/databricks-sql\">Databricks and Apache Spark SQL translation reference</a>\nand\n<a href=\"https://docs.cloud.google.com/bigquery/docs/enable-sql-translations#supported_sql_dialects\">Supported SQL dialects</a>.</p>\n<h2 class=\"release-note-product-title\">Google SecOps SIEM</h2>\n<h3>Deprecated</h3>\n<p><strong>These SIEM Release Notes are now deprecated. For future updates on new features, changes, and announcements, see <a href=\"https://docs.cloud.google.com/chronicle/docs/secops/release-notes\">Google SecOps Release Notes</a>.</strong></p>\n<h2 class=\"release-note-product-title\">Google SecOps SOAR</h2>\n<h3>Deprecated</h3>\n<p><strong>These SOAR Release Notes are now deprecated. For future updates on new features, changes, and announcements, see <a href=\"https://docs.cloud.google.com/chronicle/docs/secops/release-notes\">Google SecOps Release Notes</a>.</strong></p>\n<h2 class=\"release-note-product-title\">Managed Service for Apache Airflow</h2>\n<h3>Announcement</h3>\n<p>In December 2026, new Managed Airflow images and builds will no longer\npre-install <code>site-packages/ray/jars/ray_dist.jar</code>, the Java runtime that Ray\nuses for Java and cross-language (Python-Java) workloads:</p>\n<ul>\n<li>Python-only Ray workloads are unaffected by this change.</li>\n<li>Remote Java or cross-language Ray jobs submitted to an external cluster (such\nas Ray on Vertex AI or KubeRay on GKE) are unaffected because they use the\n<code>ray_dist.jar</code> inside the remote cluster image, not the environment's local\ncopy.</li>\n<li>Only workloads that start a local Java or cross-language Ray runtime directly\ninside the Airflow worker, or custom code directly reading\n<code>site-packages/ray/jars/ray_dist.jar</code>, might require action.</li>\n<li>Existing environments will be affected by this change when you upgrade them\nto a version or build that doesn't have <code>ray/jars/ray_dist.jar</code>\npre-installed.</li>\n</ul>\n<p>If you start a local Java or cross-language Ray runtime directly inside an\nAirflow worker, you will need to manually supply the missing runtime library.\nFollow these steps:</p>\n<ol>\n<li><p>Extract <code>ray_dist.jar</code> from the exact version of the <code>ray</code> package installed\nin your environment. For the list of packages in your environment, see\n<a href=\"https://docs.cloud.google.com/composer/docs/versions-packages\">Preinstalled packages changelog</a>.</p></li>\n<li><p>Upload the extracted <code>ray_dist.jar</code> to the <code>data/</code> folder of your\nManaged Airflow environment's bucket.</p></li>\n<li><p>Add the JAR file path to your Ray jobs using Ray's native <code>java_jars</code>\nruntime environment configuration option.</p></li>\n</ol>\n<h3>Announcement</h3>\n<p>In December 2026, Managed Airflow (Gen 3) and Managed Airflow (Gen 2)\nenvironments will start using Python 3.12:</p>\n<ul>\n<li>New Airflow builds of Managed Airflow (Gen 3) and versions of\nManaged Airflow (Gen 2) will switch to Python 3.12.</li>\n<li>Python 3.11.8 will no longer be available in new versions and Airflow builds\nof Managed Airflow.</li>\n<li>Existing Managed Airflow (Gen 3) environments will keep using Python 3.11.8\nuntil you manually upgrade the Airflow build of your environment to a build\nthat uses Python 3.12.</li>\n<li>Existing Managed Airflow (Gen 2) environments will keep using Python 3.11.8\nuntil you manually upgrade your environment to a version that uses\nPython 3.12.</li>\n<li>Managed Airflow (Gen 3) builds and Managed Airflow (Gen 2) versions released\nbefore this change will keep using Python 3.11.8.</li>\n</ul>\n<h2 class=\"release-note-product-title\">NetApp Volumes</h2>\n<h3>Announcement</h3>\n<p>The Flex File service level for Google Cloud NetApp Volumes is no longer\navailable in the following regions:</p>\n<ul>\n<li><code>asia-east2</code> (Hong Kong)</li>\n<li><code>europe-central2</code> (Warsaw)</li>\n<li><code>europe-west6</code> (Zurich)</li>\n<li><code>europe-west10</code> (Berlin)</li>\n<li><code>northamerica-south1</code> (Querétaro)</li>\n<li><code>us-south1</code> (Dallas)</li>\n</ul>\n<p>Other service levels remain available in <code>europe-west6</code> (Standard, Premium, and\nExtreme) and <code>us-south1</code> (Flex Unified). For more information about available\nregions, see\n<a href=\"https://docs.cloud.google.com/netapp/volumes/docs/discover/service-levels#supported_regions\">Supported regions</a>.</p>"
