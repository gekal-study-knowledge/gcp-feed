  "2f584d2033edd58968e1612e545bc12e":
    "id": "2f584d2033edd58968e1612e545bc12e"
    "title": "Data + AI Anywhere: AlloyDB Omni integration with local models"
    "link": "https://cloud.google.com/blog/products/databases/alloydb-omni-integration-with-local-models/"
    "published": "2026-11-24 02:00:00"
    "fetched": "2026-11-24 04:51:47"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Open models like Gemma 4 from Google DeepMind are a great option to keep your data local. But how can a local AI model integrate with on-premises data?</span></p>\n<p><a href=\"https://cloud.google.com/alloydb/omni?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni</span></a><span style=\"vertical-align: baseline;\">, Google’s 100% PostgreSQL-compatible database that runs anywhere, now integrates with locally hosted large language models (LLMs). With AlloyDB Omni, you can build agentic experiences on your own infrastructure and on your own terms. Whether it’s in the cloud, in your datacenter, or even on your laptop, you can have data plus AI anywhere.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Built-in AI for your local environment</strong></h2>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Omni is a downloadable, run-anywhere edition of AlloyDB that easily deploys to your own infrastructure, including on-premises. AlloyDB Omni packs powerful, built-in AI, including the same ScaNN indexing technology powering Google Search. When you pair AlloyDB Omni with a model, you can store vector embeddings at scale; search them semantically; and even query the database using natural language. You can use virtually any model you like, whether that’s a frontier Cloud-hosted model like Gemini or a local model. And with locally hosted models you maintain complete control over your data environment.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Connecting to Gemma 4, Qwen3.8, and other local models</strong></h2>\n<p><span style=\"vertical-align: baseline;\">You can now connect AlloyDB Omni to local models like </span><a href=\"https://deepmind.google/models/gemma/gemma-4/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemma 4</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://huggingface.co/Qwen\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Qwen3.8</span></a><span style=\"vertical-align: baseline;\">. No matter which model you choose, the architecture remains the same.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - alloydb-omni-local-models\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_alloydb-omni-local-models.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AlloyDB Omni calls a local model server directly from SQL — keeping prompts, data, and responses inside your environment.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This setup enables entirely new use cases for environments that were previously blocked from adopting agentic capabilities. If you operate an air-gapped network or have data locality requirements, you can still build intelligent applications. You can analyze local logs, generate summaries of proprietary internal documents, and power localized chatbots—all while maintaining strict data governance.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keep data on-premises:</strong><span style=\"vertical-align: baseline;\"> Because the database and the model sit in the same local environment, your data never crosses the public internet.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduce latency:</strong><span style=\"vertical-align: baseline;\"> Processing inference requests locally minimizes network transit time.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Query directly via SQL:</strong><span style=\"vertical-align: baseline;\"> Your standard database queries can invoke machine learning functions that process data locally. Like this:</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT customer_name,\\r\\n       ai.generate(&#x27;Summarize in 1 short sentence: &#x27; || comment,\\r\\n                   model_id =&gt; &#x27;gemma4_llm&#x27;) AS summary\\r\\nFROM customer_feedback;\\r\\n\\r\\n customer_name |                                summary                                \\r\\n---------------+-----------------------------------------------------------------------\\r\\n Alice         | The customer demands a refund for a double charge or they will cancel\\r\\n Bob           | The user likes the product but requests dark mode support.&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205f3d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, you’ll see how to run queries like this yourself, step by step.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Get started</strong></h2>\n<p><span style=\"vertical-align: baseline;\">You can test this integration on your own machines today. Using a Kubernetes environment we will show you how to deploy and integrate AlloyDB Omni and a local open model.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Step 0: Before you begin</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In this example, we will use Google Kubernetes Engine (GKE) to host the AlloyDB Omni database and local model. GKE gives us a standardized, reproducible environment but you can use the same setup on-prem or almost anywhere.</span></p>\n<p><span style=\"vertical-align: baseline;\">We will assume you have already setup:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/quickstarts/create-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A GKE cluster</span></a><span style=\"vertical-align: baseline;\">, and</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kubernetes tools </span><a href=\"https://kubernetes.io/docs/tasks/tools/#kubectl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">kubectl</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://helm.sh/docs/intro/install/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Helm</span></a></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Step 1: Deploy the AlloyDB Omni Kubernetes Operator</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We will use the </span><a href=\"https://docs.cloud.google.com/alloydb/omni/kubernetes/current/docs/deploy-kubernetes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni Kubernetes operator</span></a><span style=\"vertical-align: baseline;\"> to set up our AlloyDB Omni database. The Operator makes deploying and maintaining AlloyDB Omni a breeze.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;helm install \\\\\\r\\n  cert-manager oci://quay.io/jetstack/charts/cert-manager \\\\\\r\\n  --version v1.21.3 \\\\\\r\\n  --namespace cert-manager \\\\\\r\\n  --create-namespace \\\\\\r\\n  --set crds.enabled=true \\\\\\r\\n  --set global.leaderElection.namespace=cert-manager\\r\\n\\r\\nhelm install alloydbomni-operator oci://gcr.io/alloydb-omni/alloydbomni-operator \\\\\\r\\n--version 1.9.0 \\\\\\r\\n--create-namespace \\\\\\r\\n--namespace alloydb-omni-system \\\\\\r\\n$(helm install --help | grep -q -- &#x27;--rollback-on-failure&#x27; &amp;&amp; echo &#x27;--rollback-on-failure&#x27; || echo &#x27;--atomic&#x27;) \\\\\\r\\n--timeout 5m&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205c590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Step 2: Create your AlloyDB Omni database</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Don’t forget to enable the </span><code style=\"vertical-align: baseline;\">googleMLExtension</code><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl create namespace ai-demo\\r\\n\\r\\ncat &lt;&lt; \\&#x27;EOF\\&#x27; | kubectl apply -f -\\r\\napiVersion: v1\\r\\nkind: Secret\\r\\nmetadata:\\r\\n  name: db-pw-my-omni\\r\\n  namespace: ai-demo\\r\\ntype: Opaque\\r\\ndata:\\r\\n  my-omni: &quot;VmVyeVN0cm9uZ1Bhc3N3b3Jk&quot; # password &quot;VeryStrongPassword&quot;\\r\\n---\\r\\napiVersion: alloydbomni.dbadmin.goog/v1\\r\\nkind: DBCluster\\r\\nmetadata:\\r\\n  name: my-omni\\r\\n  namespace: ai-demo\\r\\nspec:\\r\\n  databaseVersion: &quot;18.4.0&quot;\\r\\n  primarySpec:\\r\\n    adminUser:\\r\\n      passwordRef:\\r\\n        name: db-pw-my-omni\\r\\n    features:\\r\\n      googleMLExtension:\\r\\n        enabled: true\\r\\n    resources:\\r\\n      cpu: 2\\r\\n      memory: 4Gi\\r\\n      disks:\\r\\n      - name: DataDisk\\r\\n        size: 20Gi\\r\\n        storageClass: standard\\r\\n    dbLoadBalancerOptions:\\r\\n      annotations:\\r\\n        networking.gke.io/load-balancer-type: &quot;internal&quot;\\r\\n  allowExternalIncomingTraffic: true\\r\\nEOF&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205d750&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Step 3: Deploy your AI model</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We will use </span><a href=\"https://ollama.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ollama</span></a><span style=\"vertical-align: baseline;\"> to help us deploy our model.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this example we deploy Gemma 4 from Google DeepMind. Or, you can modify this command to deploy Qwen3.8 – just change a few lines as noted in the comments.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;cat &lt;&lt; \\&#x27;EOF\\&#x27; | kubectl apply -f -\\r\\napiVersion: apps/v1\\r\\nkind: Deployment\\r\\nmetadata:\\r\\n name: ollama\\r\\n namespace: ai-demo\\r\\nspec:\\r\\n replicas: 1\\r\\n selector:\\r\\n   matchLabels:\\r\\n     app: ollama\\r\\n template:\\r\\n   metadata:\\r\\n     labels:\\r\\n       app: ollama\\r\\n   spec:\\r\\n     containers:\\r\\n     - name: ollama\\r\\n       image: ollama/ollama:latest\\r\\n       ports:\\r\\n       - containerPort: 11434\\r\\n       env:\\r\\n       - name: OLLAMA_KEEP_ALIVE\\r\\n         value: &quot;-1&quot;                  # keep the model in RAM\\r\\n       - name: OLLAMA_LOAD_TIMEOUT\\r\\n         value: &quot;20m&quot;\\r\\n       resources:\\r\\n         requests:\\r\\n           cpu: &quot;4&quot;\\r\\n           memory: &quot;16Gi&quot;             # for Qwen 3.8: 24Gi\\r\\n       volumeMounts:\\r\\n       - name: models\\r\\n         mountPath: /root/.ollama\\r\\n       lifecycle:\\r\\n         postStart:\\r\\n           exec:\\r\\n             command: [&quot;/bin/sh&quot;, &quot;-c&quot;, &quot;(sleep 5 &amp;&amp; ollama pull gemma4:12b) &gt;/dev/null 2&gt;&amp;1 &amp;&quot;]\\r\\n             # For Qwen 3.8, comment out the line above and use this one:\\r\\n             # command: [&quot;/bin/sh&quot;, &quot;-c&quot;, &quot;(sleep 5 &amp;&amp; ollama pull qwen3.8) &gt;/dev/null 2&gt;&amp;1 &amp;&quot;]\\r\\n     volumes:\\r\\n     - name: models\\r\\n       ephemeral:\\r\\n         volumeClaimTemplate:\\r\\n           spec:\\r\\n             accessModes: [&quot;ReadWriteOnce&quot;]\\r\\n             resources:\\r\\n               requests:\\r\\n                 storage: 30Gi\\r\\n---\\r\\napiVersion: v1\\r\\nkind: Service\\r\\nmetadata:\\r\\n name: ollama-service\\r\\n namespace: ai-demo\\r\\nspec:\\r\\n type: ClusterIP\\r\\n ports:\\r\\n - port: 11434\\r\\n   targetPort: 11434\\r\\n selector:\\r\\n   app: ollama\\r\\nEOF&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205f710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Step 4: Register the model with AlloyDB Omni</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Connect to your database.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl exec -it -n ai-demo $(kubectl get pod -n ai-demo -l alloydbomni.internal.dbadmin.goog/task-type=database -o jsonpath=\\&#x27;{.items[0].metadata.name}\\&#x27;) -c database -- env PGPASSWORD=&quot;VeryStrongPassword&quot; psql -h 127.0.0.1 -U postgres&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205e290&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Note: If you receive a connection error, you might need to wait a moment for your database to provision.</span></p>\n<p><span style=\"vertical-align: baseline;\">Now you should be connected to your AlloyDB Omni database with the </span><code style=\"vertical-align: baseline;\">psql</code><span style=\"vertical-align: baseline;\"> client. Next, run the following SQL script to register your local model.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE EXTENSION IF NOT EXISTS google_ml_integration;\\r\\nALTER SYSTEM SET google_ml_integration.request_timeout_in_seconds = 600;\\r\\nSELECT pg_reload_conf();\\r\\nCREATE OR REPLACE FUNCTION google_ml.ollama_llm_input_transform(\\r\\n  model_id character varying, prompt text,\\r\\n  generation_config json, system_instructions json\\r\\n) RETURNS json AS $$\\r\\n  SELECT json_build_object(\\r\\n    &#x27;model&#x27;, CASE model_id\\r\\n               WHEN &#x27;gemma4_llm&#x27;  THEN &#x27;gemma4:12b&#x27;\\r\\n               WHEN &#x27;qwen3_8_llm&#x27; THEN &#x27;qwen3.8&#x27;\\r\\n             END,\\r\\n    &#x27;messages&#x27;, json_build_array(\\r\\n      json_build_object(&#x27;role&#x27;, &#x27;system&#x27;, &#x27;content&#x27;,\\r\\n        COALESCE(system_instructions-&gt;&#x27;systemInstruction&#x27;-&gt;&#x27;parts&#x27;-&gt;0-&gt;&gt;&#x27;text&#x27;,\\r\\n                 &#x27;You are a helpful assistant.&#x27;)),\\r\\n      json_build_object(&#x27;role&#x27;, &#x27;user&#x27;, &#x27;content&#x27;, prompt)\\r\\n    )\\r\\n  );\\r\\n$$ LANGUAGE sql;\\r\\n\\r\\nCREATE OR REPLACE FUNCTION google_ml.ollama_llm_output_transform(\\r\\n  model_id character varying, response json\\r\\n) RETURNS text AS $$\\r\\n  SELECT trim(regexp_replace(\\r\\n    response-&gt;&#x27;choices&#x27;-&gt;0-&gt;&#x27;message&#x27;-&gt;&gt;&#x27;content&#x27;,\\r\\n    &#x27;&lt;think&gt;.*?&lt;/think&gt;&#x27;, &#x27;&#x27;, &#x27;s&#x27;));\\r\\n$$ LANGUAGE sql;\\r\\n\\r\\nCALL google_ml.create_model(\\r\\n  model_id =&gt; &#x27;gemma4_llm&#x27;,   -- and/or &#x27;qwen3_8_llm&#x27;,\\r\\n  model_request_url =&gt; &#x27;http://ollama-service.ai-demo.svc.cluster.local:11434/v1/chat/completions&#x27;,\\r\\n  model_provider =&gt; &#x27;custom&#x27;,\\r\\n  model_type     =&gt; &#x27;llm&#x27;,\\r\\n  model_in_transform_fn  =&gt; &#x27;google_ml.ollama_llm_input_transform&#x27;,\\r\\n  model_out_transform_fn =&gt; &#x27;google_ml.ollama_llm_output_transform&#x27;\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205db90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Note: If you receive a </span><code style=\"vertical-align: baseline;\">Resource not found</code><span style=\"vertical-align: baseline;\"> error, wait a moment for the model to load.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition to registering your model, the above script tells AlloyDB Omni how to interpret the model’s raw output. In this example chain-of-thought (CoT) reasoning is part of the response inside </span><code style=\"vertical-align: baseline;\">&lt;think&gt;&lt;/think&gt;</code><span style=\"vertical-align: baseline;\"> tags. We don’t want the CoT, so our output transform function removes it.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Step 5: Try it out!</strong></h3>\n<p><span style=\"vertical-align: baseline;\">You can use functions like </span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\"> built-in to AlloyDB Omni to connect to your local model – without ever leaving the SQL client!</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE TABLE customer_feedback (\\r\\n   id SERIAL PRIMARY KEY,\\r\\n   customer_name TEXT,\\r\\n   comment TEXT\\r\\n);\\r\\nINSERT INTO customer_feedback (customer_name, comment) VALUES\\r\\n(&#x27;Alice&#x27;, &#x27;I was charged twice on my credit card! Please refund $49 immediately or I will cancel.&#x27;),\\r\\n(&#x27;Bob&#x27;,   &#x27;Great product, but can you please add dark mode support?&#x27;);\\r\\n\\r\\nSELECT customer_name,\\r\\n       ai.generate(&#x27;Summarize in 1 short sentence: &#x27; || comment,\\r\\n                   model_id =&gt; &#x27;gemma4_llm&#x27; /* or &#x27;qwen3_8_llm&#x27; */) AS summary\\r\\nFROM customer_feedback;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f991205cad0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Make it your own</span></h2>\n<p><span style=\"vertical-align: baseline;\">Try out all the AI features that AlloyDB Omni has to offer! AlloyDB Omni </span><a href=\"https://cloud.google.com/alloydb/ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">supports</span></a><span style=\"vertical-align: baseline;\"> fast vector search, built-in AI functions, and more. </span><a href=\"https://docs.cloud.google.com/alloydb/omni/containers/current/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Give them a try</span></a><span style=\"vertical-align: baseline;\"> and build something great.</span></p></div>"
  "84d6b7737364434a23618e6faf065861":
    "id": "84d6b7737364434a23618e6faf065861"
    "title": "How Sinch modernized its enterprise data warehouse from Snowflake to BigQuery to power AI"
    "link": "https://cloud.google.com/blog/products/data-analytics/how-sinch-migrated-from-snowflake-to-bigquery-to-power-ai/"
    "published": "2026-11-24 02:00:00"
    "fetched": "2026-11-24 04:51:47"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As the scale of global communications grows larger and larger, enterprise platforms must process billions of interactions with customers across a complex network of touchpoints without breaking them. A prime example is </span><a href=\"https://sinch.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sinch</span></a><span style=\"vertical-align: baseline;\">, one of the world’s leading cloud communications and customer engagement (CPaaS) companies, which processes billions of customer interactions, SMS routing events, voice calls, and transactional messages.</span></p>\n<p><span style=\"vertical-align: baseline;\">Managing massive international messaging traffic brings significant architectural challenges, so Sinch built a distributed, multi-cloud data footprint across AWS and GCP, with separate Snowflake instances running in the EU, US, and Australia. To eliminate data silos, curb monthly billing spikes, establish a single governed source of truth, and unlock the next generation of predictive AI capabilities, Sinch partnered with </span><a href=\"https://cloud.google.com/consulting\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Professional Services</span></a><span style=\"vertical-align: baseline;\"> to migrate its enterprise data warehouse to Google </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here’s how we engineered Sinch’s new, modern, cost-efficient, and AI-ready platform architecture </span></p>\n<h3><strong style=\"vertical-align: baseline;\">The challenge: untangling distributed warehouses and escalating spikes</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Before it embarked on this modernization journey, Sinch faced several architectural and operational friction points:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cross-regional data sprawl:</strong><span style=\"vertical-align: baseline;\"> The company’s separate Snowflake instances in the EU, US, and Australia required intricate inter-region replication, which caused  multi-directional dependencies and complex cross-warehouse data management.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resource spikes and commercial inefficiencies:</strong><span style=\"vertical-align: baseline;\"> Heavy monthly billing runs drove severe compute spikes in the US, even as other regions had underutilized capacity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">High-volume scanning vs. dialect disparities:</strong><span style=\"vertical-align: baseline;\"> A single US email event table could generate up to 100 TB of daily scans. Meanwhile, mission-critical SQL relied on Snowflake-specific concurrency and table-swapping paradigms for concurrency validation, which lacked 1:1 equivalents in cloud-native SQL.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“Google Cloud's engineering expertise helped us overcome several technical challenges during our migration, particularly around optimising Spark partitioning and restructuring incremental data loads. This allowed us to identify more efficient approaches, improve performance and ensure we built a scalable, reliable solution for the future.”<br /></span><strong style=\"font-style: italic; vertical-align: baseline;\">Dan Peters, senior manager, Data Delivery, Sinch</strong></p>\n<h3><span style=\"vertical-align: baseline;\">Phase 1: validating architecture with a target MVP</span></h3>\n<p><span style=\"vertical-align: baseline;\">To mitigate operational risk and prevent downtime for Sinch’s critical enterprise workloads (including ERP and NetSuite integrations), we initiated a phased migration framework:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_OgG7rWd.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A use case pilot validation:</strong><span style=\"vertical-align: baseline;\"> The migration kicked off with a dedicated use case MVP that spanned 20 tables and 125 GB of refined data and automatically validated end-to-end data fidelity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layered strategy for coupled pipelines:</strong><span style=\"vertical-align: baseline;\"> Rather than attempting to cleanly slice interconnected business domains in the EU, the team adopted a layered approach —  migrating raw and base (bronze and silver) layers, establishing automated data ingestion, and stabilizing core entities before repointing consumption marts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Orchestration consolidation:</strong><span style=\"vertical-align: baseline;\"> Sinch consolidated 36 independent ETL workflows into a single parameterized orchestrator by using </span><a href=\"https://cloud.google.com/workflows\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Workflows</span></a><span style=\"vertical-align: baseline;\">, which streamlined CI/CD deployment logic, and reduced operational overhead.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Re-engineering for scale: key architectural pillars</span></h3>\n<h4><strong style=\"vertical-align: baseline;\">1. Decoupled storage and optimized ingestion</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Sinch transitioned its data ingestion pipelines to Dataproc Serverless (running Apache Spark 3.5), which directly pulled refined data into native BigQuery tables from S3 and Databricks Unity Catalog. And to overcome batch quota limits and resource exhaustion on billion-row datasets, Sitch optimized jobs by increasing Spark repartitioning factors to 50.</span></p>\n<p><span style=\"vertical-align: baseline;\">For its incremental pipelines, the team eliminated data duplication while minimizing query read costs by replacing slow, keyless merge statements with an optimized insert-and-overwrite windowing strategy.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">2. AI-assisted SQL and macro translation</strong></h4>\n<p><span style=\"vertical-align: baseline;\">In order to accelerate the translation of more than 1,200 dbt models across global projects, Sinch utilized Google Cloud BigQuery Migration Service alongside a set of custom AI translation skills. Here’s how:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The team refactored Snowflake-specific table versioning and concurrency management paradigms into deterministic transaction blocks and view abstraction pointers. This ensured atomic updates and consistent data access.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sinch leveraged specialized Google skills for other regional migration — specifically the </span><span style=\"vertical-align: baseline;\">dbt-sf-to-bq-translator</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://github.com/google/skills/tree/main/skills/cloud/dbt-sf-to-bq-translator\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">skill</span></a><span style=\"vertical-align: baseline;\"> powered by the underlying BigQuery Translation API — to automate the conversion of dbt models from Snowflake to BigQuery SQL syntax. This significantly reduced manual refactoring effort and error rates.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Concurrency checks that relied on row-level locking were redesigned into serialized batch validations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Integer overflow risks in massive calculation tables were solved by adopting a tiered precision strategy (favoring </span><span style=\"vertical-align: baseline;\">NUMERIC</span><span style=\"vertical-align: baseline;\"> over </span><span style=\"vertical-align: baseline;\">BIGNUMERIC</span><span style=\"vertical-align: baseline;\">), which cut storage costs and preserved absolute precision.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">“Migrating over a thousand complex dbt models and translating legacy SQL required a robust, automated approach. Google Cloud's guidance on query restructuring helped us streamline pipeline development and remove compilation blockers. The team shared best practices for migrating code from Snowflake to BigQuery, such as replacing Snowflake </span><code style=\"font-style: italic; vertical-align: baseline;\">SWAP WITH</code><span style=\"font-style: italic; vertical-align: baseline;\"> and hybrid-table patterns with BigQuery time travel. They also helped us build workflows that copy data from Snowflake to BigQuery and run our dbt jobs along the way, which sped up our move to BigQuery.”<br /></span><strong style=\"vertical-align: baseline;\">Varun Gupta, Senior Data Engineer, Sinch</strong></p>\n<h3><strong style=\"vertical-align: baseline;\">Real-world business impact</strong></h3>\n<p><span style=\"vertical-align: baseline;\">By completing the migration, Sinch successfully transformed the operational bottleneck of its global data footprint into a driver of enterprise growth:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Metric / capability</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Before (Snowflake)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">After (BigQuery)</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Pipeline performance</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">High data churn; lengthy multi-hour batch runs</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Significantly faster query and pipeline processing speeds across billions of records</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Compute and billing efficiency</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Unpredictable month-end billing spikes</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Predictable capacity management with BigQuery reservations and slot autoscaling</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI readiness</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Segmented data warehouses requiring external pipelines</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Native BQML and Vertex AI decision intelligence platform</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">Looking </span><span style=\"vertical-align: baseline;\">ahead</span></h3>\n<p><span style=\"vertical-align: baseline;\">With its core European warehouse workloads stabilized on BigQuery and data validation consistently outperforming legacy benchmarks, Sinch is now expanding this modern blueprint across its Australian (SMB) and US analytics. The SMB instance migration is already in progress and is utilizing Antigravity skills for the Snowflake to BigQuery translation.</span></p>\n<p><span style=\"vertical-align: baseline;\">By unifying data storage, operational governance, and serverless compute, Sinch has built a resilient platform that delivers real-time messaging reliability today while positioning the company to capture the full potential of enterprise AI tomorrow.</span></p></div>"
  "0ae4741c33118dfba4a521d0eaf7645d":
    "id": "0ae4741c33118dfba4a521d0eaf7645d"
    "title": "Google is named a Leader in the 2026 Gartner® Magic Quadrant™ for SIEM"
    "link": "https://cloud.google.com/blog/products/identity-security/google-is-named-a-leader-in-the-2026-gartner-magic-quadrant-for-siem/"
    "published": "2026-11-24 02:00:00"
    "fetched": "2026-11-24 13:37:33"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we are proud to announce that Gartner has recognized Google as a Leader in the 2026 Gartner® Magic Quadrant™ for Security Information and Event Management (SIEM). Among the 15 vendors evaluated this year, Google was positioned furthest on “Completeness of Vision.” </span></p>\n<p><span style=\"vertical-align: baseline;\">Today's threat landscape requires a new approach to security operations that can keep pace with the speed, scale, and sophistication of autonomous attacks. Traditional SIEM architectures centralized logs and alerts, but left analysts to manually stitch together context, write and maintain detections, and craft response playbooks. </span></p>\n<p><span style=\"vertical-align: baseline;\">Now, working alongside analysts, autonomous agents can reason over enterprise context and use frontline threat intelligence to compress detection and response cycles from days to seconds.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure1_TJTor23.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Advancing the agentic SOC across threat investigation, detection, and response</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We feel our placement in the 2026 Leaders Quadrant reflects our rapid pace of engineering innovation in Google Security Operations. </span><span style=\"vertical-align: baseline;\">Since </span><a href=\"https://cloud.google.com/blog/products/identity-security/google-is-named-a-leader-in-the-2025-gartner-magic-quadrant-for-siem\"><span style=\"text-decoration: underline; vertical-align: baseline;\">last year’s Magic Quadrant report</span></a><span style=\"vertical-align: baseline;\">, we’ve focused on turning the </span><a href=\"https://cloud.google.com/solutions/security/agentic-soc\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agentic SOC</span></a><span style=\"vertical-align: baseline;\"> from vision into daily reality for our customers, helping security teams scale their expertise and outpace attackers. We expanded Gemini in Security Operations from a helpful assistant into a team of </span><a href=\"https://cloud.google.com/blog/products/identity-security/next26-redefining-security-for-the-ai-era-with-google-cloud-and-wiz?e=48754\"><span style=\"text-decoration: underline; vertical-align: baseline;\">purpose-built agents</span></a><span style=\"vertical-align: baseline;\">, including the Triage and Investigation agent, Threat Hunt agent, Detection Engineering agent, and Third-party Context agent. We also introduced agentic automation to orchestrate automated actions in playbooks with agents. </span></p>\n<p><span style=\"vertical-align: baseline;\">Security teams are also able to assess their exposure to breaking threats, ranging from the </span><a href=\"https://cloud.google.com/blog/products/identity-security/introducing-the-emerging-threats-center-in-google-security-operations?e=48754\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Emerging Threats Centers</span></a><span style=\"vertical-align: baseline;\"> to Mandiant rule packs and other </span><a href=\"https://docs.cloud.google.com/chronicle/docs/detection/curated-detections#open_the_curated_detections_page_and_rule_sets\"><span style=\"text-decoration: underline; vertical-align: baseline;\">curated detections</span></a><span style=\"vertical-align: baseline;\">, hunt and analyze threats faster using familiar syntax with GoogleSQL in Search, and run simplified operation at scale through native Data Processing Pipelines, the Health Hub, and a unified investigation and case management experience.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Measurable speed and real-world impact in the SOC</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The shift to an agentic SOC with Google Security Operations is already delivering quantifiable time savings and operational relief for defenders. “Since implementing Google SecOps, we’ve cut false positives by 42%—exceeding all our expectations. Our analysts no longer spend their days validating noise on glass. Instead, they’re focused on solving complex problems and building proactive protections across our 100-year-old enterprise,” said David Nagel, global CISO, Genuine Parts Company.</span></p>\n<p><span style=\"vertical-align: baseline;\">Traditional detection engineering — which requires reverse-engineering attacks, manually authoring rules and validating coverage before pushing to production — requires intense resourcing from busy security teams. Our </span><a href=\"https://www.youtube.com/watch?v=2Pm3YJzy2zo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Detection Engineering agent</span></a><span style=\"vertical-align: baseline;\"> transforms this workflow by automating rule creation and simulating threat coverage on demand. This can enable organizations to compress the entire end-to-end testing and deployment lifecycle down to </span><a href=\"https://services.google.com/fh/files/misc/security-omdia-agentic-defense-google-secops.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">under 30 minutes</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">In addition to streamlining detection engineering, Google Security Operations brings agentic capabilities to threat hunting. Deep threat hunting across months of historical telemetry has historically been a manual, labor-intensive process restricted to specialized hunt teams or senior analysts, often demanding up to a full day of dedicated effort per hunt. </span></p>\n<p><span style=\"vertical-align: baseline;\">The </span><a href=\"https://cloud.google.com/blog/products/identity-security/detecting-and-containing-powered-threats-with-google-security-operations-agents?e=48754#:~:text=3.%20Retroactive%20hunting\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Threat Hunting agent</span></a><span style=\"vertical-align: baseline;\"> uplevels the SOC by autonomously generating and executing comprehensive hunt plans directly from threat intelligence to uncover advanced adversaries and emerging tactics, techniques, and procedures (TTPs), helping customers complete in </span><a href=\"https://services.google.com/fh/files/misc/security-omdia-agentic-defense-google-secops.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">less than an hour</span></a><span style=\"vertical-align: baseline;\"> what previously took a full day.</span></p>\n<p><span style=\"vertical-align: baseline;\">“With threats doubling every year, we have to fight machines with machines. Google SecOps and Gemini give our junior analysts 'superpowers' to act like senior threat hunters, cutting our response times from hours to minutes so LATAM flights stay on time and our passengers safe,” said André Pires Ferreira Magalhães, CISO, LATAM Airlines.</span></p>\n<p><span style=\"vertical-align: baseline;\">According to a new </span><a href=\"https://services.google.com/fh/files/misc/idc-bv-google-secops-gemini.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Business Value report</span></a><span style=\"vertical-align: baseline;\"> from IDC, security operations teams using Gemini in Security Operations have achieved a 98% faster mean time to identify threats, a 50% reduction in impactful security incidents per month, and an 84% reduction in the time spent manually drafting security reports and incident summaries. Ultimately, these efficiency gains allow organizations to scale their defenses and redirect their most experienced, time-limited talent toward strategic security priorities. </span></p>\n<p><span style=\"vertical-align: baseline;\">Furthermore, those organizations saw a </span><span style=\"vertical-align: baseline;\">319% three-year ROI and a 7-month payback, $5.4M average annual benefits per organization and 38.2% team efficiency gain</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">from using Gemini in production. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Innovating alongside our customers</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Recognition in the Gartner Magic Quadrant is ultimately a reflection of the security teams who rely on Google Security Operations every day and push us to set new standards. Your real-world feedback and hard-won operational insights help us turn cutting-edge technology into a true defender’s advantage.</span></p>\n<p><span style=\"vertical-align: baseline;\">To read the entire report and explore Google's ranking along with the other vendors evaluated, </span><a href=\"https://www.gartner.com/doc/reprints?id=00ThR00000WnEU2UAN&amp;ct=261123&amp;st=sb\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">download</span></a><span style=\"vertical-align: baseline;\"> a complimentary copy of the 2026 Gartner® Magic Quadrant™ for SIEM.</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">Gartner, Magic Quadrant for Security Information and Event Management, Andrew Davies, Mitchell Schneider, Rustam Malik, Eric Ahlm, 8 November 2026.</span></sup></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">GARTNER is a registered trademark and service mark of Gartner, Inc. and/or its affiliates in the U.S. and internationally, and MAGIC QUADRANT is a registered trademark of Gartner, Inc. and/or its affiliates and are used herein with permission. All rights reserved. Gartner does not endorse any vendor, product or service depicted in our research publications, and does not advise technology users to select only those vendors with the highest ratings or other designation. Gartner research publications consist of the opinions of Gartner's research organization and should not be construed as statements of fact. Gartner disclaims all warranties, expressed or implied, with respect to this research, including any warranties of merc hantability or fitness for a particular purpose.</span></sup></p></div>"
