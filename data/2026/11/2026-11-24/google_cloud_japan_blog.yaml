    "title": "ロッテ:「作業」は AI に、「価値創造」は人に。AI エージェントの活用で挑む「モノづくり改革」の最前線"
    "link": "https://cloud.google.com/blog/ja/topics/customers/lotte-takes-on-manufacturing-reform-through-the-use-of-ai-agents/"
    "published": "2026-11-24 11:00:00"
    "fetched": "2026-11-24 13:37:36"
    "summary": "<div class=\"block-paragraph\"><p>総合菓子・アイスメーカーの株式会社ロッテ（以下、ロッテ）は、商品開発の現場に根強く残るさまざまな作業を AI で変革し、社員がより創造的な仕事に取り組める環境づくりを進めています。その取り組みの最重要テーマが、メーカーの根幹である商品開発のプロセスをゼロベースで見直す「モノづくり改革」です。ここではその中核メンバーに、Google Cloud の開発内製化支援プログラム「TAP」を活用した取り組みと、その先に見据える「AI 駆動型変革」について伺います。</p><p><b>利用しているサービス:</b><br /> <a href=\"https://cloud.google.com/bigquery?utm_source=google&amp;utm_medium=cpc&amp;utm_campaign=Cloud-SS-DR-GCP-1713664-GCP-DR-APAC-JP-ja-Google-BKWS-BRO-Others&amp;utm_content=c-Hybrid+%7C+BKWS+-+BRO+%7C+Txt+-+Databases-Non+Relational+DB-Bigtable-JP_ja-311649800052&amp;utm_term=%E3%83%93%E3%83%83%E3%82%B0+%E3%83%87%E3%83%BC%E3%82%BF+%E3%82%AF%E3%83%A9%E3%82%A6%E3%83%89&amp;gclsrc=aw.ds&amp;gad_source=1&amp;gad_campaignid=717097664&amp;gclid=CjwKCAjwl4HXBhAjEiwAHlpWhGdfshwuSycbslVK8pQXXhHHQ5FpeiwwH5fgsdIDcm6Ja4OHsnQB3RoC9RQQAvD_BwE&amp;hl=en\">BigQuery</a>, <a href=\"https://cloud.google.com/run?e=48754805&amp;hl=ja\">Cloud Run</a>, <a href=\"https://cloud.google.com/storage?e=48754805&amp;hl=ja\">Cloud Storage</a>, <a href=\"https://cloud.google.com/data-studio?e=48754805&amp;hl=ja\">データポータル</a>, <a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805&amp;hl=ja\">Gemini</a> など</p><h3><b>業務の約半分が調整、書類作成に費やされている現状を、AI エージェントで変革</b></h3><p>原材料費をはじめとする生産コストの上昇を受け、製菓業界は大きな転換期を迎えています。ロッテにおいても今後は商品を「安く、広く届ける」だけでなく、「付加価値で選ばれる」ようにしていくことが求められています。しかし、ロッテ 経営戦略部 経営戦略課 課長の中村 準氏によれば、そこに大きな壁がありました。新たな価値創出を考えるべき社員が、日々の業務に忙殺されていたのです。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A1985_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A1985_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「マーケティング本部では工数の 54.4% が会議や資料作成、メール対応などの調整・報告業務に使われていました。また、商品開発の中核を担うロッテ中央研究所においても、業務の 52% が書類・管理業務に費やされ、本来の研究開発に割ける時間が約 2 割にとどまっていたのが実情です。」（中村氏）</p><p>例えば、商品パッケージに記載する原材料やアレルギー関連表示は、目視で照合する確認作業が年間数百回も発生していたといいます。</p><p>「これらの業務は品質と安全を守るために欠かせないプロセスですが、確認や調整に時間がかかると商品の発売が遅れ、トレンドを捉える機会を逃しかねません。創造的な仕事を志す人材が単純作業に疲弊してしまったり、中間層が調整に追われてしまったりすることも問題でした。」（中村氏）</p><p>そこでロッテは、AI を活用した業務のさらなる品質向上と効率化を図るため、全社的な AI 開発プロジェクトを発足。経営インパクトの大きい 9 つの重点ユースケースのうち、AI の導入を機にモノづくりのプロセスそのものを一から見直す「モノづくり改革」を最重要テーマとして位置付け、開発をスタートしました。</p><p>モノづくりには、マーケティング部門や研究開発部門だけでなく、営業、品質保証、工場、サプライ チェーン管理など多くの部門が関わります。今回は、各部門へのアンケート結果や費用対効果なども踏まえて、「モノづくり改革」の構成要素として、6 つの AI を開発することが決定されました。「判断は人が担い、AI は作業を担う設計」というコンセプトのもと、工程全体の進捗をつなぐ「全体ワークフロー管理 AI」を軸に、「商品開発 AI」「表示相談 AI」「原料規格書確認 AI」「イングレ（原材料）確認 AI」「版下確認 AI」の各 AI を組み合わせることで一連の業務変革を目指します。</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"fig01\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/fig01.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>なお、この取り組みにおいては、AI に詳しい ICT 部門ではなく、業務を熟知した各事業部門のマネージャーがプロジェクトを主導するという方法が採られています。加えて、経営層が進捗を確認できる仕組みも設定。単なる AI ツールの導入にとどまらず、むしろ AI を「変革のカタリスト（触媒）」として活用しながら、現場と経営の実態に基づいた業務改革を図る「AI 駆動型変革」が目標に掲げられました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A2064_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A2064_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>そして、この「AI 駆動型変革」を実現するためのプラットフォームに Google Cloud が選定されます。株式会社ロッテホールディングス（以下、ロッテ HD）ICT部 IT戦略グループ DX推進チーム マネージャーの橋本 桂祐氏は、その理由を次のように説明します。<br /><br />「Google Cloud には BigQuery や Cloud Run など、従量課金で試しやすいサービス群が揃っており、内製でのスモール スタートに向いていました。また、データを集約しておけば、Google Cloud の先進的な AI 研究開発の成果を享受できるようになります。」（橋本氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph\"><h3><b>事業部門、ICT、基盤構築パートナー、Google Cloud が連携し、3 日間の TAP で 6 つの AI エージェントを構築</b></h3><p>しかし、その構想を実際のシステムとして構築するのは簡単なことではありませんでした。現場が本当に使えるアプリケーションを内製できるのか、社内ウェブアプリと AI をどう連携させて配置するのか、認証やデータベース、セキュリティはどうするのか、といった課題をクリアしなければならないからです。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"fig02\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/fig02.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>ロッテ HD ICT部 IT戦略グループ モダナイゼーションチームの下地 怜氏は、これらの課題を解決して、内製での迅速かつ確実な目標達成を実現すべく、各要素を構成図にまとめて Google Cloud に相談。伴走型支援プログラム「<a href=\"https://cloud.google.com/solutions/in-house-development-support?e=48754805&amp;hl=ja\">Tech Acceleration Program（TAP）</a>」の提案を受け、これに参加することにしました。</p><p>TAP では 3 日間にわたって、アジャイル開発型のワークショップを実施。ロッテの ICT 部門と事業部門、Google Cloud、基盤構築パートナーが同じ部屋に集まり、最終的には 5 班・約 30 名体制で検証を進めました。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A1908_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A1908_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「TAP では、バイブ コーディングで開発したプロトタイプをその場で事業部門メンバーに見せ、意見を聞いて改善するサイクルを回すことができました。従来の取り組みでは、こちらが現場を知らないがゆえに運用に乗せるのにとても苦労していたのですが、事業部門メンバーの感想を確認しながら作業できたため、真にユーザーが求めるものをつくれているという実感を得ることができました。」（下地氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"TAP風景\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/TAPFengJing.max-1000x1000.jpg\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>（3 日間にわたり開催された TAPでは、ロッテ ICT×事業部門・Google Cloud・基盤構築パートナーがアプリ開発の実現性や基盤づくりについて共同で検証）</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>下地氏はアプリと基盤を別々に考えるのではなく、基盤構築パートナーと連携して TAP に参加し、共同で作業を実施したことにも大きな手応えを感じていました。</p><p>「実際にデプロイまでのフローを試したことで、CI/CD の設計の土台にもなりましたし、基盤の今後のアーキテクチャの方向性についても手がかりを得ることができました。この経験を通じてユースケースと基盤の同時推進の具体像が描けたことで、現在もしっかりと並行して進めることができています。」（下地氏）</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"fig03_architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/fig03_architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Google Cloud を活用しながら、「AI 駆動型変革」をさらに推進</strong></h3>\n<p><span style=\"vertical-align: baseline;\">2026 年 10 月時点では、こうして開発された 6 つの AI のプロトタイプのうち、「全体ワークフロー管理 AI」など 3 つが本番リリースに向けて進行中です。</span></p>\n<p><span style=\"vertical-align: baseline;\">「そのうちの 1 つ、『原料規格書確認 AI』は、取引先から提出される原料規格書を AI に確認させる仕組みです。AI エージェントがアップロードされた規格書を解析し、Python で実装したルールベースのチェック エンジンが、社内基準や関連法規などに照らして約 200 項目を自動で検証し、不備があれば取引先への再依頼文のドラフトも生成します。チェック結果はスプレッドシートに証跡として残るため、どの項目をどう判断したかを現場が確認することも可能です。」（下地氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、現場からのフィードバックをもとに AI がルールの改善案を出し、人が承認して反映する「ループ エンジニアリング」を取り入れ、使うほど賢くなる仕組みも構築しました。これにより作業時間の削減や確認のばらつきの解消が期待でき、機能改善に向けた会議のあり方も変わり得るといいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">「これまでは『どこに課題があるか』から会議を始めていましたが、AI が改善案を出してくれれば、人はそれを採用するかどうかの判断に時間を使えます。作業を減らすだけでなく、仕事の進め方そのものが変わる可能性を感じました。」（下地氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">一方、中村氏は 6 つの AI が稼働した場合の効果は、暫定試算でおよそ 50 人分の工数削減に相当すると胸を張ります。ただし、工数削減そのものが目的ではないと強調しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「当初は 6 つの AI を 3～5 年かけて業務に定着させる構想だったのですが、TAP を通じて具体的な成果が見えるようになったことで、1 年以内の実現を目指そうという気運が生まれています。何より大切なのは、こうして生まれた時間を、新しい商品や付加価値を生み出す仕事に振り向けていけることなのです。」（中村氏）</span></p>\n<p><span style=\"vertical-align: baseline;\">ロッテの AI 駆動型変革はまだ始まったばかり。より大きな取り組みとなるグループ共通基盤は、2026 年 9 月までの設計フェーズを経て構築フェーズへと進展しています。その目玉は、スピードと安全性を両立する「AI 組み込み型 CI/CD」の実現です。併せて、現場主導の AI エージェント開発も今後さらに加速させていきます。グループ共通基盤と個別の AI エージェント開発を同時に進める狙いについて、橋本氏はこう締めくくりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">「現場に使ってもらえる共通基盤をつくり上げるには、AI エージェントを実際に使いながら、現場が期待するものを基盤側にフィードバックし、両輪で設計を磨いていくのが効率的です。この際には開発をパートナー任せにせず、ペア プログラミングのように一緒につくっていくことで、3 年後の自走を見据えた人材育成も図っていきたいですね。さらにその後は、クラウド移行や運用監視・管理まで AI エージェントに一任し、自動化する世界を実現したいと考えています。今回の取り組みは、業務のあり方自体を変革していくものですから、Google Cloud の関連ソリューションのさらなる充実に大いに期待しています。」（橋本氏）</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"_53A2137_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A2137_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><a href=\"https://www.lotte.co.jp/\" target=\"_blank\"><b>株式会社ロッテ</b></a><br />1948 年に創業された総合菓子・アイスメーカー。「お口の恋人」というコーポレートメッセージを掲げ、チューインガムやチョコレート、アイスクリームなどを展開する。従業員数は 2,240 名、海外拠点・グループ会社を含めて 6,976 名（2026 年 3 月 31 日現在、海外および旧 Dari K 株式会社は 2025 年 12 月 31 日現在）。</p></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">インタビュイー（写真左から）<br /></strong><span style=\"vertical-align: baseline;\">株式会社ロッテホールディングス<br /></span><span style=\"vertical-align: baseline;\">・ICT部 IT戦略グループ モダナイゼーションチーム　下地 怜 氏<br /></span><span style=\"vertical-align: baseline;\">・ICT部 IT戦略グループ DX推進チーム マネージャー　橋本 桂祐 氏<br /></span><span style=\"vertical-align: baseline;\">株式会社ロッテ<br /></span><span style=\"vertical-align: baseline;\">・経営戦略部 経営戦略課 課長　中村 準 氏</span></p>\n<hr />\n<p><strong style=\"vertical-align: baseline;\">▼セッション動画を見る<br /></strong><span style=\"vertical-align: baseline;\">本事例のインタビュイーによるセッション動画が公開中です。あわせてご覧ください。<br /></span><span style=\"vertical-align: baseline;\">【AI-Ready Infra &amp; DB Summit 2026】<br /></span><span style=\"vertical-align: baseline;\">基調講演: </span><a href=\"https://cloudonair.withgoogle.com/events/infra-db-summit26/watch?talk=keynote\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud のインフラとデータベース最新動向。AI が使う基盤、AI で作る基盤。</span></a><br /><span style=\"vertical-align: baseline;\">セッション: </span><a href=\"https://cloudonair.withgoogle.com/events/infra-db-summit26/watch?talk=session-a1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ロッテが挑む AI 駆動型変革：基盤×ユースケース同時推進と内製開発の最前線</span></a></p>\n<p><strong style=\"vertical-align: baseline;\">▼他の導入事例記事を読む<br /></strong><span style=\"vertical-align: baseline;\">その他の Google Cloud 導入事例は</span><a href=\"https://cloud.google.com/customers?hl=ja&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p></div>"
  "e1b6d526c7e2ab175c79aad5a090d587":
    "id": "e1b6d526c7e2ab175c79aad5a090d587"
    "title": "Gemini でパートナー マーケティングをよりスマートに"
    "link": "https://cloud.google.com/blog/ja/topics/partners/helping-our-partners-market-smarter-together-with-gemini/"
    "published": "2026-11-24 10:10:00"
    "fetched": "2026-11-24 13:37:36"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 20 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/partners/helping-our-partners-market-smarter-together-with-gemini?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、AI エージェントによる変革への取り組みを、Google とともにビジネスを築いて成長していくパートナーを含め、すべての人に広げています。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、Gemini を活用した新しい共生マーケティング機能を導入いたしました。これらの新機能は、パートナーの皆様が日常的に使用している市場開拓ワークフローから直接ご利用いただけます。これらの機能を使用することで、ブランドに沿ったカスタムの共同アセットを数分で作成し、キャンペーンの実施を拡大して、パイプラインをより効果的に推進できるようになります。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">共生マーケティングから共生イノベーションへ: Gemini で効果を拡大</strong></h3>\n<p><span style=\"vertical-align: baseline;\">テクノロジーの進化と顧客の期待の変化に伴い、マーケティング担当者は単にキャンペーンを制作するだけではなくなりました。私たちは、ますます細分化する購入プロセス全体にわたって、継続的で高度にパーソナライズされたデータドリブンな需要創出エンジン構築の取り組みも進めています。</span></p>\n<p><span style=\"vertical-align: baseline;\">パートナー ネットワークにとって、こうした期待に応えることは、コアサービスを差別化する一方で Google Cloud との統一ビジョンを明確化するという二重の課題を解決することを意味します。</span></p>\n<p><span style=\"vertical-align: baseline;\">エンタープライズ規模でそのギャップを埋めるには、わずかな効率向上だけでは不十分です。共感を呼ぶストーリーを共同で作成、調整、配信する、エージェントを活用したアジリティが求められます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-StudioHomePage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1-StudioHomePage.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">新機能: Partner Marketing Studio 内の高度なエージェント機能</strong></h3>\n<p><span style=\"vertical-align: baseline;\">新しくなった Partner Marketing Studio には、キャンペーンの実施を加速し、パフォーマンスを最適化して、あらゆる規模のパートナー様が最大限の効果を得られるように設計された一連のエージェント ツールが導入されています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェント検索:</strong><span style=\"vertical-align: baseline;\"> シンプルなチャット機能を使用できるようになりました。コンテンツ リポジトリをナビゲートするのではなく、必要なものを検索できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ブランドの整合性:</strong><span style=\"vertical-align: baseline;\"> コンテンツが Google Cloud のパートナー ブランド ガイドラインに準拠していることを確認するブランド審査エージェントにより、ブランド コンプライアンスを気にする必要はもうありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ISV アセットの作成:</strong><span style=\"vertical-align: baseline;\"> Gemini で生成された高品質なマーケティング アセットにより、マーケットプレイスのリスティングへの需要が促進されます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ソーシャル メディアの自動化:</strong><span style=\"vertical-align: baseline;\"> 新しいソーシャル メディア エディタにより、複数のネットワークへの同時投稿、アカウントタグの追加、AI を使用したチャネルごとのメッセージ調整を行えます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">お客様事例:</strong><span style=\"vertical-align: baseline;\"> 新たに設計されたエージェントにより、共同での成果に焦点を当てた最高水準のお客様成功事例を作成できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Gemini を利用した翻訳:</strong><span style=\"vertical-align: baseline;\"> 130 言語に対応したエージェントによる翻訳で、グローバル マーケティング プログラムを加速します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自然言語分析:</strong><span style=\"vertical-align: baseline;\"> マーケティングの実施を具体的なビジネス成果に直接結び付けるエンドツーエンドの可視性を実現します。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「Partner Marketing Studio は、当社のパートナー マーケティング チームの延長線上にある存在となっています。組み込みの Gemini 機能とすぐに実行できる共同キャンペーンにより、業界、地域、ペルソナを問わず、大きな効果を生み出すマーケティング アセットを数分でカスタマイズできます。Partner Marketing Studio を使用することで、共同ソリューションのパイプラインを加速しながら、より少ない労力でより多くの成果を上げることができています」- Pigment、テクノロジー パートナーシップ担当グローバル責任者 </span><strong style=\"font-style: italic; vertical-align: baseline;\">Liana Shuma 氏</strong></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-CollectionsPage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-CollectionsPage.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Partner Marketing Studio の優れた機能を引き続き提供</strong></h3>\n<p><span style=\"vertical-align: baseline;\">プラットフォームには新しい強力なツールが搭載されましたが、Google Cloud の中核となる目標は変わりません。それは、ブランドの信頼性を高め、パイプラインの需要を創出することです。</span></p>\n<p><span style=\"vertical-align: baseline;\">パートナー様に合わせて構造化され、厳選されたコンテンツ ライブラリは引き続きご利用可能で、Google Cloud の優先戦略に沿ったパフォーマンス上位のキャンペーンをご確認いただけます。パートナー様は、Google が作成したローカライズ済みのキャンペーン コンテンツや、特定の市場開拓目標に合わせてカスタマイズ可能な既製のアセットを引き続き制限なくご利用になれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、以下のような価値の高いパートナー サービスをプラットフォーム内ですぐにご利用いただける点も変わりありません。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google のオフィス内で直接、顧客イベントを開催することを申請する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">主催するイベントに Google Cloud の講演者をリクエストする。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud マーケティング エキスパートによる専用のオフィスアワー セッションに参加する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">キャンペーンのソーシャル メディアによる拡大をリクエストする。</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「Google のオフィスは参加者にとって魅力的なだけでなく、Google Cloud がイベントのロジスティクスをすべて処理してくれるため、時間と費用を大幅に節約でき、インパクトの大きなコンテンツの提供とオーディエンス エンゲージメントの促進に専念できました。」- Tiger Analytics、GTM スペシャリスト </span><strong style=\"font-style: italic; vertical-align: baseline;\">Jenny Bejarano 氏</strong></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「Google Cloud がイベントの講演者をサポートしてくれたことに感謝しています。ご協力いただいたおかげで、見込み顧客に対する弊社の信用度が高まり、価値提案が強化されました」- Connected Stories、共同創業者 / ゼネラル マネージャー </span><strong style=\"font-style: italic; vertical-align: baseline;\">Tommaso Vaccarella 氏</strong></p>\n<h3><strong style=\"vertical-align: baseline;\">使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">新しい Partner Marketing Studio ポータルは、すべての Google Cloud パートナー様にご利用いただけます。既存のビジネス認証情報を使用して、次のいずれかの方法でログインできます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://partners.cloud.google.com/home\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud パートナー ネットワーク</strong></a><strong style=\"vertical-align: baseline;\">経由:</strong><span style=\"vertical-align: baseline;\"> [</span><strong style=\"vertical-align: baseline;\">リソース</strong><span style=\"vertical-align: baseline;\">] &gt; [</span><strong style=\"vertical-align: baseline;\">マーケティング</strong><span style=\"vertical-align: baseline;\">] &gt; [</span><strong style=\"vertical-align: baseline;\">Partner Marketing Studio</strong><span style=\"vertical-align: baseline;\">] に移動します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ブラウザの直接リンク:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://www.partnermarketingstudio.com\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">www.partnermarketingstudio.com</span></a><span style=\"vertical-align: baseline;\"> に直接アクセスします。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Google Cloud のコミットメント: Gemini でパートナー様の成功を拡大</strong></h3>\n<p><span style=\"vertical-align: baseline;\">これらの更新は、Gemini を使用して、パートナー様を支援、強化する方法を変革するという Google Cloud の大きな取り組みの一環です。Google Cloud は、Partner Marketing Studio に加えて、パートナー エクスペリエンス全体で Gemini を活用しています。たとえば、パートナー マーケティング ファンドのエクスペリエンスを刷新し、活動計画の合理化、パイプライン レポートの簡素化、必要なドキュメントの提出前のプロアクティブな検証を行っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">近年、Google Cloud は大きな成長を遂げていますが、その成功の大部分は、パートナー エコシステムの素晴らしい取り組みによるものです。そして今、Gemini の力を市場開拓ワークフローに直接組み込むことで、共同作業をまったく新しいレベルに引き上げられることを嬉しく思います。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI を味方に付け、Google Cloud の特に強力なソリューションとして活用しながら、これまで以上に簡単に、ともに創造し、つながり、成長してまいりましょう。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">- グローバル パートナー マーケティング担当マネージング ディレクター </span><strong style=\"font-style: italic; vertical-align: baseline;\">Aimee Catalano</strong></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\">※本記事でご紹介している一部の機能やパートナー サービス（Google オフィスでのイベント開催申請、講演者のリクエスト、オフィスアワーなど）はグローバル版向けのプログラムであり、日本版の Partner Marketing Studio では提供内容や画面構成が一部異なります。日本のパートナー様は、ログイン後に日本独自のキャンペーンやローカライズ済みアセットをご利用いただけます。</span></sup></p></div>"
  "95f65b078acafef0658e85f5a988f98a":
    "id": "95f65b078acafef0658e85f5a988f98a"
    "title": "Google Cloud Partner Tech Influencer Challenge 2026 受賞企業 & 優秀コンテンツが決定！"
    "link": "https://cloud.google.com/blog/ja/topics/partners/google-cloud-partner-tech-influencer-challenge-2026-winners/"
    "published": "2026-11-24 10:00:00"
    "fetched": "2026-11-24 13:37:36"
    "summary": "<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Google Cloud Partner Tech Influencer Challenge 2026 について</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud ではパートナー企業の社員の皆様による技術コンテンツの投稿を応援しています。2022 年より開始した「テクニカル ブログ チャレンジ」は、2025 年から「Google Cloud Partner Tech Influencer Challenge」と名称を変更し、ブログに限らない Web 媒体も対象として実施しています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Google Cloud Partner Tech Influencer Challenge 2026 結果発表</strong></h3>\n<p><span style=\"vertical-align: baseline;\">本ブログでは、Google Cloud Partner Tech Influencer Challenge 2026 の結果発表としまして、投稿いただいたコンテンツについて非常に多くの知見を提供いただいたパートナー企業様、及び優秀な技術コンテンツをご提供いただいた個人の皆様を表彰します。</span></p>\n<p><span style=\"vertical-align: baseline;\">表彰カテゴリは以下のとおりです。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">表彰カテゴリ</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">企業の部</strong></h4>\n<h5><span style=\"vertical-align: baseline;\">最優秀賞</span></h5>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">本取り組みにおける投稿総数および投稿記事の質を総合的に加味し、最も優秀な結果を残されたパートナー企業様を選出</span></p>\n</li>\n</ul>\n<h5><span style=\"vertical-align: baseline;\">Gemini 賞</span></h5>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini for business や Gemini platform 等を含むエンタープライズ向け Gemini に関する総投稿数と質を総合評価し、優秀な結果を残されたパートナー企業様を選出</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">個人の部</strong></h4>\n<h5><span style=\"vertical-align: baseline;\">特別賞 - マルチメディア賞: </span></h5>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ユニークなメディア媒体を用いて投稿されたコンテンツおよび受賞者を選出</span></p>\n</li>\n</ul>\n<h5><span style=\"vertical-align: baseline;\">特別賞 - Gemini 審査賞: </span></h5>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gemini による審査で特に優秀と判断されたコンテンツおよび受賞者を選出</span></p>\n</li>\n</ul>\n<h5><span style=\"vertical-align: baseline;\">Deep Dive 賞</span></h5>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">以下のカテゴリ毎、製品技術についての How To や深堀りを行っていただいたコンテンツおよび受賞者を選出</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">AI / ML 部門</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Data Analytics / BI 部</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Database 部門</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Infrastructure &amp; Application 部門</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Security 部門</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace 部門</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">受賞された企業様、受賞者様は以下のとおりです。</span></p>\n<hr />\n<h3><strong style=\"vertical-align: baseline;\">企業の部</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">最優秀賞</strong></h4>\n<h5><span style=\"vertical-align: baseline;\">株式会社 G-gen </span></h5></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_gEANgOH.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">本取り組みにおける「投稿総数および投稿記事の質」を総合的に加味し、最も優秀な結果を残された企業として、最優秀賞をお贈りいたします。</span></p>\n<p><a href=\"https://blog.g-gen.co.jp/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">G-gen Tech Blog</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">新機能の発表から間を置かずに実機検証を行い、設定手順や落とし穴まで含めて詳細に公開いただく記事の数々は、Google Cloud を扱う多くのエンジニアにとって最初に参照する情報源になっています。一年を通じた継続的な発信量と、記事ごとの検証の深さを総合的に評価し、最優秀賞をお贈りいたします。今後の発信にも期待しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini 賞</strong></h4>\n<h5><span style=\"vertical-align: baseline;\">KDDIアイレット株式会社 </span></h5></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_UXRoMDO.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Gemini for business や Gemini platform 等を含むエンタープライズ向け Gemini に関する総投稿数と質を総合評価し、Gemini 賞をお贈りいたします。</span></p>\n<p><a href=\"https://iret.media/tag/google-cloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">「#Google Cloud」の記事一覧 | iret.media</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">エンタープライズ向け Gemini について、機能紹介にとどまらず、実際に業務へ組み込む際の設計や権限、運用の勘所まで踏み込んだ技術コンテンツを一年を通じて数多く発信いただきました。現場で Gemini を活用しようとするエンジニアの背中を押す発信の量と質を総合的に評価し、Gemini 賞をお贈りいたします。</span></p>\n<hr />\n<h3><strong style=\"vertical-align: baseline;\">個人の部 - 特別賞</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">マルチメディア賞</strong></h4>\n<p><span style=\"vertical-align: baseline;\"><strong>株式会社スリーシェイク 小渕 周 様<br /></strong></span><a href=\"https://www.youtube.com/watch?v=L4xKohdSHkY\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">第22回 決定論 vs 確率論：Gemini 3 FlashとTF-IDFを組み合わせた「法規判定エンジン」の構築 - Youtube.com</span></a></p>\n<p><a href=\"https://speakerdeck.com/shukob/jue-ding-lun-vs-que-lu-lun-gemini-3-flashtotf-idfwozu-mihe-waseta-fa-gui-pan-ding-enzin-nogou-zhu\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">決定論 vs 確率論：Gemini 3 FlashとTF-IDFを組み合わせた「法規判定エンジン」の構築 - Speaker Deck</span></a></p>\n<p><span style=\"vertical-align: baseline;\">等</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">登壇スライドや Youtube を通じ、LLM の評価・観測から法規判定エンジンの設計まで、専門性と実践知を兼ね備えた発信を多様な形で届けられました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Gemini 審査賞</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">クラウドエース株式会社 相原 健吾 様<br /></span></strong><a href=\"https://zenn.dev/cloud_ace_jp/articles/bedaa22307ce32\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">安い推論モデルの方が結果的に高くつく？ LLM の「価格逆転現象」と実務でのモデル選定術</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">モデル単価だけではなく正答を得るまでにかかる総トークンと総コストで評価すべきという視点を複数回の実測で裏付けた、エージェント設計のモデル選定に直結する記事でした。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">個人の部 - Deep Dive 賞</strong></h3>\n<h4><strong style=\"vertical-align: baseline;\">AI / ML 部門</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">株式会社スリーシェイク 佐藤 慧太 様<br /></span></strong><a href=\"https://zenn.dev/satohjohn/articles/gemini-managed-agents-security\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Enterprise Agent Platform の「Managed Agents」に Cloud Run を運用させてみる</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Managed Agents を用いた Cloud Run 運用自動化を、観測からチューニング・検証まで実測データと共に詳細に検証された、知見が豊富で実務に役立つ素晴らしい記事でした。</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">株式会社システムサポート 寺坂 征哉 様<br /></span></strong><a href=\"https://sight-r.sts-inc.co.jp/google_cloud_article/google-cloud-veo-long-video/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">【応用編】Veoを使った長尺動画作成方法</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Veoを活用した長尺動画作成の具体的な手順と応用テクニックを丁寧に解説されており、実践知見が深い、クリエイティブな業務効率化に役立つ記事でした。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Data Analytics / BI 部門</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">合同会社デロイト トーマツ 大前 七奈 様<br /></span></strong><a href=\"https://zenn.dev/deloitte_jp_eng/articles/04a27b92be91fc\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AIエージェントの回答ばらつきを減らす：BigQuery Graphによる候補制約</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">GA 直後の BigQuery Graph をいち早く取り上げ、AI エージェント用のオントロジーを構築するというキャッチーかつ実践的なテーマで検証いただいた点が素晴らしいです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Database 部門</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">株式会社野村総合研究所 杉山 聡 様<br /></span></strong><a href=\"https://qiita.com/satoshi-sugiyama/items/632fe8a16fd0e20ea0ae\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">なぜSpanner Queueがありがたいのか #GoogleCloud - Qiita</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Spanner Queue で DB 更新とイベント発行の一貫性を担保できる点を、クラウドネイティブ設計の観点と実機検証を交えて解説いただいた素晴らしい記事でした。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Infrastructure &amp; Application 部門</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">株式会社 G-gen 杉村 勇馬 様<br /></span></strong><a href=\"https://blog.g-gen.co.jp/entry/allow-self-signed-cert-with-agent-gateway\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Gatewayで自己署名証明書のAPIエンドポイントを許可する - G-gen Tech Blog</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Agent Gateway におけるエージェント通信の統制において、導入時に課題となりやすい自己署名証明書の問題に踏み込み、実装を含めた詳細な検証も行っていただいた点を高く評価しました。</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">株式会社 NTT ドコモ 朴 多感 様<br /></span></strong><a href=\"https://nttdocomo-developers.jp/entry/2025/12/24/090000_5\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Azure × Google Cloud 間を HA VPN＋BGP＋PSC でつなぐ Vertex AI プライベート接続ガイド - ENGINEERING BLOG ドコモ開発者ブログ</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Azure と Google Cloud を接続し、Gemini platform (旧 Vertex AI) を安全に利用するための実践的な記事です。丁寧に図解されていること、手順の再現性があることを高く評価しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Security 部門</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">株式会社 G-gen 武井 祐介 様<br /></span></strong><a href=\"https://blog.g-gen.co.jp/entry/secops-case-triage-with-mcp-and-skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google SecOps MCP serverとSkillsでアラートをトリアージする</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Google SecOps の MCP サーバーを使ったアラート調査において、単なる機能紹介にとどまらず、独自の運用ルールを AGENTS.md で補完して精度を高める実運用目線の検証が秀逸です。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Google Workspace 部門</strong></h4>\n<p><strong><span style=\"vertical-align: baseline;\">NTT インテグレーション株式会社 今井 雄大 様<br /></span></strong><a href=\"https://ximix.niandc.co.jp/blog/google-workspace-flows-mail-review-cycle\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">[GWSStudio100本ノック] マーケティングメールのドラフトを自動レビューし基準達成まで回すエージェントを作成してみた</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Google Workspace Studio でのマーケティングメールの自動レビューから改善までを自動化する、実効性の高い検証と丁寧な解説を高く評価しました。</span></p>\n<p><strong><span style=\"vertical-align: baseline;\">ソフトバンク株式会社 中村 一夫 様<br /></span></strong><a href=\"https://www.softbank.jp/biz/blog/cloud-technology/articles/202512/gws-studio-auto-reply-agent/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Workspace Studio (旧称Flows)とGeminiで完了！「空き時間いつ？」に全自動で返信するAIエージェント｜クラウドテクノロジーブログ｜ソフトバンク</span></a></p>\n<p><strong><span style=\"vertical-align: baseline;\">Google 社員コメント<br /></span></strong><span style=\"vertical-align: baseline;\">Google Workspace Studio と Gemini を組み合わせ、日程調整の全自動化を動画も活用し分かりやすく解説した実用的な記事でした。</span></p>\n<hr />\n<h3><strong style=\"vertical-align: baseline;\">総評</strong></h3>\n<p><span style=\"vertical-align: baseline;\">非常に多くの技術コンテンツを投稿いただき、誠にありがとうございました。本年度も皆様からご投稿いただいた技術コンテンツは 2,000 件を超え、ブログに加えて YouTube や Speaker Deck などのマルチメディアコンテンツも数多くお寄せいただきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">今年の投稿を読み進めて強く感じたのは、AI エージェントの時代が、もはや構想ではなく現場にも訪れているということです。昨年中心であった「Gemini で何ができるか」といった、いわゆる「やってみた」コンテンツが、本年は解きたい業務課題を起点に Gemini platform や Agent Development Kit、MCP を使ってエージェントを設計し、Cloud Run などの基盤にデプロイして運用に乗せる、などといった実践的な内容を取り扱うコンテンツにシフトした傾向が見られています。エージェントにクラウドの運用改善を任せる検証、エージェント間通信やツール呼び出しをゲートウェイで統制する検証、Google Workspace 上の業務をエージェントに完結させる検証など、ただエージェントを動かすだけでなく、どう統制し、どう評価し、どこまで任せるかという「AI エージェントの実践活用」に踏み込んだ知見が多数共有されたことは、今年の大きな進化といえます。</span></p>\n<p><span style=\"vertical-align: baseline;\">更に、検証内容の深さも印象に残りました。モデルの思考トークンまで含めた総コストを実測で比較、GA 直後の新機能をエージェントの知識基盤として設計に組み込む、マルチクラウド間の閉域接続といった、「やってみた」で終わらない、数値と根拠をもって設計判断に踏み込むコンテンツが各分野で多く見られました。速報性の観点でも、新機能の発表から日を置かずに実機検証を公開いただいた記事が大幅に増加しており、読者にとって非常に価値が高いコンテンツが多く創出されたと感じています。</span></p>\n<p><span style=\"vertical-align: baseline;\">これらの素晴らしい技術コンテンツは、Google Cloud の技術を広め、エージェント時代の実践的な知見を日本のエンジニア コミュニティに届ける一翼を担っていただいております。本当にありがとうございます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">さいごに</strong></h3>\n<p><span style=\"vertical-align: baseline;\">受賞企業様、及び受賞者の皆様おめでとうございます。また、ご参加いただいた企業様及び皆様、素晴らしい技術コンテンツをご提供いただき誠にありがとうございました。</span></p>\n<p><span style=\"vertical-align: baseline;\">2027 年も引き続き、さらに多くのパートナーの皆さまに技術コンテンツを投稿していただきたいと考えております。現在新たなプログラムを鋭意作成中になりますので、お知らせできるまでお待ちいただけますと幸いです。</span></p></div>"
