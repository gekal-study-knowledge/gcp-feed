    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 12 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/training-certifications/google-cloud-agentic-architect-certification-dont-just-prompt-ai-design-it?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">プロダクション レディなエージェントを構築する専門知識を、より手軽に証明できるようになりました。このたび、Google Cloud は、</span><a href=\"https://developers.google.com/program/gear?hl=ja\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Agent Ready（GEAR）</span></a><span style=\"vertical-align: baseline;\">イニシアチブにおける最新のマイルストーンとして、</span><a href=\"https://cloud.google.com/learn/certification/agentic-architect?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Professional Agentic Architect 認定資格</span></a><span style=\"vertical-align: baseline;\">を発表いたしました。100 万人近くの開発者が GEAR を活用してエージェントのスキルアップを図っていますが、この認定資格を特別なものにしているのは、Google 社内でも採用されている点です。</span></p>\n<p><span style=\"vertical-align: baseline;\">過去 4 か月間、Google Cloud は独自の高度なカリキュラムを通じて、数千人のフォワード デプロイド エンジニアと戦略的パートナーをトレーニングしてきました。もともとは社内トレーニング イニシアチブとして開始されたものですが、この新しい認定資格を通じて、デベロッパー コミュニティやパートナー エコシステム全体へも提供を開始いたします。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud でフォワード デプロイド エンジニア部門を統括するバイス プレジデント（Ravi）と、Google Cloud Learning のマネージング ディレクター（Gary）として、私たちはこのプログラムが Google 社内でいかに効果的であったかを目の当たりにしてきました。チームが日常業務のほぼあらゆる側面において、AI の構築、デプロイ、活用のあり方を再考するうえで、本プログラムは大きな力となっています。この新しい認定資格が、デベロッパーやエンジニア、そしてエージェント分野でのリーダーシップを発揮する準備ができているすべての人にもたらす可能性についても、私たちは同様に大きな期待を寄せています。</span></p></div>\n<div class=\"block-video\">\n\n\n\n<div class=\"article-module article-video \">\n  <figure>\n    <a class=\"h-c-video h-c-video--marquee\" href=\"https://youtube.com/watch?v=AaQTFwEIy78\">\n\n      \n        \n\n        <div class=\"article-video__aspect-image\">\n          <span class=\"h-u-visually-hidden\">Google Cloud Professional Agentic Architect 認定資格のご紹介 | 今すぐ認定資格を取得しましょう</span>\n        </div>\n      \n      <svg class=\"h-c-video__play h-c-icon h-c-icon--color-white\" xmlns=\"http://www.w3.org/2000/svg\">\n        <use xlink:href=\"#mi-youtube-icon\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"></use>\n      </svg>\n    </a>\n\n    \n      <figcaption class=\"article-video__caption h-c-page\">\n        \n          <h4 class=\"h-c-headline h-c-headline--four h-u-font-weight-medium h-u-mt-std\">Google Cloud Professional Agentic Architect 認定資格のご紹介 | 今すぐ認定資格を取得しましょう</h4>\n        \n        \n          <p>Google Cloud Professional Agentic Architect 認定資格のご紹介 | 今すぐ認定資格を取得しましょう</p>\n        \n      </figcaption>\n    \n  </figure>\n</div>\n\n<div class=\"h-c-modal--video\">\n   <a class=\"glue-yt-video\" href=\"https://youtube.com/watch?v=AaQTFwEIy78\">\n   </a>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">実践的なスキルを証明する新しいハイブリッド形式</strong></h4>\n<p><span style=\"vertical-align: baseline;\">本試験は、従来の多肢選択式試験とは異なります。新たなハイブリッド形式によって、概念的なノウハウとハンズオンでの実践力の双方を証明することが求められます。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パート 1（監視付きの多肢選択式試験）:</strong><span style=\"vertical-align: baseline;\"> システム設計の選択、アーキテクチャ標準、コストの最適化、セキュリティ ガバナンスを評価します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パート 2（Google Skills のハンズオンラボ）:</strong><span style=\"vertical-align: baseline;\"> アクティブなクラウド環境で、ライブ エージェント ワークフローを構築、テスト、デバッグします。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">この認定資格の取得がキャリアアップに役立つ理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">企業が優秀な AI 人材を求めるなか、この認定資格は、セキュアでガバナンスの効いた高性能マルチエージェント システムを設計するための高度なスキルを備えていることを、即座にアピールできます。</span></p>\n<p><a href=\"https://www.ipsos.com/en-us/future-ai-and-technical-skill-building\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI スキル構築に関する Ipsos との共同調査</span></a><span style=\"vertical-align: baseline;\">によると、認定資格は採用担当者からの関心を高める効果があります。Google Skills を利用している学習者の 82% が、履歴書に Google Cloud 認定資格を記載することで、採用担当者からの連絡が増えると回答しています</span><strong style=\"vertical-align: baseline;\">。</strong></p>\n<p><span style=\"vertical-align: baseline;\">大切なのは、単に連絡をもらうことだけではなく、その期待にしっかりと応えられることです。同じ調査によると、クラウド プロフェッショナルの 90% が、Google Cloud 認定資格などの資格を取得することで、需要の高い職種で求められる実証済みのノウハウを身に付けられると回答しています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">試験の対象範囲</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この認定資格では、次の 5 つの主要分野における習熟度を評価します。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">ローコード ツールを使用してエージェントを構築する（迅速なエージェント プロトタイピングの民主化）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">アプリケーション開発でコーディング エージェントを使用する（生産性を飛躍的に向上）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">オープンソース フレームワークを使用して、</span><a href=\"https://cloud.google.com/products/gemini-enterprise-agent-platform?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini プラットフォーム</span></a><span style=\"vertical-align: baseline;\">でカスタム エージェントを開発する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェント ワークフローを評価、デプロイする（モニタリング、最適化、パフォーマンスの確保）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エージェント ワークフローを保護し、統制する（企業の機密データの保護とモデルの安全性確保）。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">数千人の Google Cloud エンジニアとパートナーが現場で検証済み - 今すぐ利用可能</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェント ワークロードに対する企業の需要は急増しています。お客様が AI プロンプト活用の一歩先へと進み、最もビジネス クリティカルなワークロードを Google Cloud で実行するようになるなか、Google はお客様とともにエージェントの未来を大規模に実現する独自のチームを立ち上げました。Google Cloud パートナーと Google のフォワード デプロイド エンジニアは、世界中のお客様の現場に直接入り込んでおり、この厳格なカリキュラムと認定資格によって、高度な技術的課題を解決する万全の体制を整えています。</span></p>\n<p><span style=\"vertical-align: baseline;\">フォワード デプロイド エンジニアリング プログラムを構築するにあたり、Professional Agentic Architect 認定資格を通じて、お客様、Google Cloud パートナー、そして Google 自身のエンジニアに対するトレーニングとスキルアップの標準化を図りたいと考えました。これにより、Google 自身のチームも、お客様やパートナーに推奨しているのと同じ世界水準の基準を採用することになり、互いに学び合い、ともにスキルを磨き合うことができます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">今すぐ無料で、認定資格取得のためのスキルを磨きましょう</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://developers.google.com/program/gear\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini Agent Ready</span></a><span style=\"vertical-align: baseline;\"> に登録すると、Google Skills で利用できる学習クレジットを毎月 35 クレジット分、無料で獲得できます。Google Cloud のお客様は、</span><a href=\"https://developers.google.com/program/gear/getcertified\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Get Certified Program</span></a><span style=\"vertical-align: baseline;\"> で、コホートベースのガイド付き認定資格取得プログラムを無料で利用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Cloud パートナー様は、</span><a href=\"https://rsvp.withgoogle.com/events/partner-learning/certprograms?pli=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パートナー認定資格のキックスタート</span></a><span style=\"vertical-align: baseline;\">に登録し、</span><a href=\"https://partner.skills.google/paths/4531\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">パートナー学習プログラム</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://services.google.com/fh/files/misc/professional_agentic_architect_exam_guide_english.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">試験ガイド</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://www.skills.google/paths/4525\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">学習プログラム</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://docs.google.com/forms/d/1fi1gqbWsNCFxm1CT9V-JNGff1lyqfU9kNWAaaQMvRi4/viewform?edit_requested=true\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">質問例</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Skills のラボや準備モジュールを実際に体験し、オープンソース フレームワークを使用して Gemini プラットフォームでカスタム エージェントを開発することに慣れていきましょう。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">多肢選択式試験に</span><a href=\"https://cloud.google.com/learn/certification/agentic-architect/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">登録</span></a><span style=\"vertical-align: baseline;\">し、ハンズオンラボの要件を完了して、デジタルバッジを取得し、専門知識を世界にアピールしましょう。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">AI にプロンプトを入力するだけではなく、AI を設計しましょう。</span><a href=\"https://cloud.google.com/learn/certification/agentic-architect?hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">今すぐ認定試験にお申し込みください</span></a><span style=\"vertical-align: baseline;\">。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud Learning、マネージング ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Gary Eimerman</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">応用 AI および FDE 担当バイス プレジデント、</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Ravi Rajamani</strong></p></div>"
  "abbf9ef512d8bf8b341280558dd30948":
    "id": "abbf9ef512d8bf8b341280558dd30948"
    "title": "Lumen と Partner Cross-Cloud Interconnect が実現するラスト ワンマイルのクラウド接続の簡素化"
    "link": "https://cloud.google.com/blog/ja/products/networking/partner-cross-cloud-interconnect-for-last-mile-delivered-by-lumen/"
    "published": "2026-11-24 10:30:00"
    "fetched": "2026-11-25 00:32:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 13 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/networking/partner-cross-cloud-interconnect-for-last-mile-delivered-by-lumen?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">より多くのワークロードに対応できるように、Cross-Cloud Interconnect は拡張を続けています。Google Cloud の</span><a href=\"https://cloud.google.com/solutions/cross-cloud-network\"><span style=\"text-decoration: underline; vertical-align: baseline;\">クロスクラウド ネットワーク</span></a><span style=\"vertical-align: baseline;\">は、クラウド環境とオンプレミス環境にまたがるアプリケーションを接続して保護する方法を簡素化し、最適化することを目的に設計されています。昨年、Google はオープン仕様に基づいて </span><a href=\"https://cloud.google.com/blog/ja/products/networking/extending-cross-cloud-interconnect-to-aws-and-partners?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS 向け Partner Cross-Cloud Interconnect をリリース</span></a><span style=\"vertical-align: baseline;\">しました。このサービスは、複雑なクロスクラウド ネットワークを構築することなく、数分でプロビジョニング可能なマネージド サービスです。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、</span><strong style=\"vertical-align: baseline;\">ラスト ワンマイル向けの Partner Cross-Cloud Interconnect</strong><span style=\"vertical-align: baseline;\"> の対象を拡大しています。Lumen Technologies とのプレビュー版を皮切りにリーチを広げ、プライベート クラウド、オンプレミスのデータセンター、ネオクラウド、その他のクラウドに、同じシンプルさと高帯域幅の接続を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">「ネットワークは、クラウド自体と同じくらい動的で使いやすいものに変わる必要があります。Google Cloud と Lumen の接続性を組み合わせることで、企業は必要なパフォーマンスと信頼性を備えたクラウドに自社の拠点から簡単に接続できるようになります。これは、プログラムで制御可能であり、クラウド サービスを使うのと同じような感覚で利用できるネットワークの実現に向けた重要なステップです。」 - Lumen Technologies、EVP、最高技術および製品責任者、Jim Fowler 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">企業のワークロードや AI パイプラインは、パブリック クラウド、特殊なネオクラウド、プライベート クラウド、オンプレミス サイトの混在化が進む環境で実行されています。AI エージェントは、顧客の支店、小売店、製造現場を対象としたデータや運用テクノロジーの支援も始めています。これらの環境間でデータを確実に移動するには大容量のプライベート接続が必要ですが、プロビジョニングと接続の管理は、依然として個別のツール、プロバイダ、運用モデルに依存しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">クラウド コンピューティングとストレージの容量は数秒でスピンアップできますが、物理サイトやプライベート クラウドの接続では、手動での見積もり、相互接続の注文、ルーティング構成などの手続きに数週間から数か月かかることがあります。高可用性ソリューションを構築する場合、ネットワーク エンジニアは別々の施設にまたがるデュアル回線を調整し、BGP フェイルオーバーを構成し、暗号鍵を手動で管理する必要があるため、さらに手間が増えます。</span><strong style=\"vertical-align: baseline;\">ラスト ワンマイル向けの Partner Cross-Cloud Interconnect</strong><span style=\"vertical-align: baseline;\"> と Lumen Technologies を使用すると、Lumen の広範なラスト ワンマイル ネットワークを活用して、Google Cloud への専用 L3 プライベート接続を数か月ではなく数分で確立できます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_pCCI.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">プログラマブルかつレジリエントなクラウド接続</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect はオープンな</span><a href=\"https://github.com/aws/Interconnect\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Interconnect API</span></a><span style=\"vertical-align: baseline;\"> 仕様とプロビジョニング プロセスを使用するため、ネットワーク チームは 1 つの運用ランブックでプライベート クラウド、ネオクラウド、オンプレミス、マルチクラウド接続に対応できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">あらゆる環境へのオンデマンド接続:</strong><span style=\"vertical-align: baseline;\"> パブリック クラウド、プライベート クラウド、AI ネオクラウド、オンプレミス拠点にわたり、1～50 Gbps のスケーリングを数分で実現</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デフォルトで高いレジリエンスとセキュリティを確保:</strong><span style=\"vertical-align: baseline;\"> 物理的に離れた施設やエッジ アベイラビリティ ドメイン（EAD）にある冗長ルーター間でのキャパシティの事前プロビジョニング、メンテナンスの調整、ワイヤスピードでの MACsec 暗号化</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">総所有コスト（TCO）の削減:</strong><span style=\"vertical-align: baseline;\"> Google Cloud のデータ転送料（外向き）を含んだ予測可能な定額制の帯域幅ティアにより、未使用の物理ポート容量やクロスコネクト料金を削減</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ニーズに合ったオプションを選択</strong></h4>\n<p><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-csp-overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">CSP 向け Partner Cross-Cloud Interconnect</strong></a><strong style=\"vertical-align: baseline;\">:</strong><span style=\"vertical-align: baseline;\"> 柔軟で自動化されたマルチクラウド接続に最適</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">専用の物理ポートを注文したり、相互接続を管理したりすることなく、Google Cloud を</span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/how-to/cci/aws/connectivity-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS</span></a><span style=\"vertical-align: baseline;\"> や</span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/how-to/cci/oci/connectivity-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">OCI</span></a><span style=\"vertical-align: baseline;\"> などのプロバイダに接続できます。</span></p>\n</li>\n</ul>\n<p><strong style=\"vertical-align: baseline;\">ラスト ワンマイル向けの Partner Cross-Cloud Interconnect: </strong><span style=\"vertical-align: baseline;\">プライベート クラウド、ネオクラウド、オンプレミス拠点、マルチクラウド環境へのリーチを拡大するのに最適</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Lumen をはじめとするパートナーのラスト ワンマイル ネットワークを活用して、プライベート クラウド、ネオクラウド、データセンター、その他のクラウド ロケーションを接続します。プロビジョニングに伴う長いリードタイムとは無縁です。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">提供状況</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ラスト ワンマイル向けの Partner Cross-Cloud Interconnect は、Lumen Technologies とのプレビュー版が us-east4（バージニア北部）で提供されており、近日中にさらに多くのリージョンで公開される予定です。</span></p>\n<p><span style=\"vertical-align: baseline;\">プレビュー版に参加するには、</span><a href=\"https://forms.gle/recCuFsEkZ3XRJ3h8\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちらのフォームからお申し込み</span></a><span style=\"vertical-align: baseline;\">いただくか、Google Cloud または Lumen のアカウント担当者にお問い合わせください。詳しくは、</span><a href=\"https://www.lumen.com/blog/en-us/lumen-cloud-interconnect-google-cloud-partner-interconnect\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lumen に関するお知らせ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">クラウド ネットワーキング、プロダクト管理担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Himanshu Mehra</strong></p></div>"
  "d6aff12457a30f6e5fd464cf59606441":
    "id": "d6aff12457a30f6e5fd464cf59606441"
    "title": "Partner Cross-Cloud Interconnect によって Azure へのマルチクラウド ネットワーキングがシンプルに"
    "link": "https://cloud.google.com/blog/ja/products/networking/cross-cloud-interconnect-for-microsoft-azure/"
    "published": "2026-11-24 10:00:00"
    "fetched": "2026-11-25 00:32:16"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 18 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/networking/cross-cloud-interconnect-for-microsoft-azure?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">AI が企業によるアプリケーションの構築や運用のあり方を変える中、モデルやデータ、アプリケーションを複数のクラウドに分散させる企業が増えています。これを実現するには、環境間での高速なプライベート接続が必要です。これまで、複数のクラウドを接続するには、各プロバイダから物理的な回線を手配し、双方でネットワークを設定し、複数のチーム間で調整する必要がありました。このプロセスには数週間、場合によっては数か月かかることもあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、これを大幅にシンプルにしたいと考えました。このたび、Partner Cross-Cloud Interconnect が Microsoft Azure に拡張され、プレビュー版としてご利用いただけるようになりました。このサービスは Google Cloud と Microsoft 社が共同でサポートしており、Google Cloud 環境と Azure 環境の間にプライベートな高帯域幅接続を提供します。この接続は、プログラムによって数分で設定でき、管理する物理インフラストラクチャは必要ありません。</span></p>\n<p><span style=\"vertical-align: baseline;\">「Google Cloud の Partner Cross-Cloud Interconnect は、直接的なクラウドネイティブのアプローチでマルチクラウド ネットワーキングを簡素化します。従来のインフラストラクチャの複雑さを排除することで、さまざまなクラウド環境間でワークロードを接続するための信頼性が高くスケーラブルな基盤を提供します。」- Nestlé 社、IT およびデジタル プラットフォーム担当グローバル責任者、Ralf Huebenthal 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">「Walmart は、複数のクラウド プロバイダにまたがるシームレスなプラットフォームを運用して、イノベーションを促進しています。Google Cloud との提携の下、同社のグローバル ネットワークをハイブリッドとマルチクラウドでのネットワーキングに活用しています。Cross-Cloud Interconnect でクラウド プロバイダ間の接続を簡素化して、本番環境での運用までの時間を短縮し、全体としての費用削減を実現できました。」 - Walmart 社、ソフトウェア エンジニアリング担当グループ ディレクター、Gerald Bothello 氏</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_JZez7Jh.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect のメリット</strong></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">数週間ではなく数分でオンデマンド接続を実現: Google Cloud コンソールまたは API から接続を設定し、必要な帯域幅を選択するだけで、残りの処理は両方のクラウドが処理してくれます。ハードウェアを注文する必要も、ネットワークを手動で構成する必要も、プロバイダ間を行き来する必要もありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">組み込みの信頼性: 冗長性を確保するため、物理的に離れたロケーションをまたいで接続が構成されます。Google Cloud と Azure が共同で接続をモニタリングし、メンテナンスと復旧を処理します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">プライバシーとセキュリティ: トラフィックは公共のインターネットを経由せず、Google Cloud と Azure のエッジルーター間で自動的に暗号化されます。お客様による構成は必要ありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">予測可能な料金: </strong><span style=\"vertical-align: baseline;\">接続の帯域幅に応じた固定価格のため、Google Cloud の費用を計画および管理しやすくなります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">「お客様は複数のクラウドにまたがってアプリケーション、データ プラットフォーム、AI を構築しているため、クラウド間のネットワークが正常に機能することを望んでいます。Azure Multicloud Interconnect with Google Cloud は、Azure と Google Cloud の間にプライベートなマネージドパスをお客様に提供します。Google Cloud との連携により、公開プレビュー版としてお客様に提供できることを嬉しく思います。」- Microsoft 社、Azure ネットワーキング、プロダクト管理担当パートナー、Sudha Mahajan 氏</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の Cross-Cloud Interconnect エコシステムは拡大を続けています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Microsoft Azure 向け Partner Cross-Cloud Interconnect は、us-east4（北バージニア）、us-west2（ロサンゼルス）、europe-west3（フランクフルト）でプレビュー版として提供を開始します。</span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-csp-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-oci-overview\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">OCI</span></a><span style=\"vertical-align: baseline;\"> のサービスは一般提供されています。Azure 向けサービスの一般提供への移行に合わせて、対象リージョンを追加していく予定です。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://cloud.google.com/blog/ja/products/networking/partner-cross-cloud-interconnect-for-last-mile-delivered-by-lumen/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">通信事業者である Lumen 社とのラスト ワンマイル接続を実現する Partner Cross-Cloud Interconnect</span></a><span style=\"vertical-align: baseline;\"> のプレビュー版が、プライベート クラウド、オンプレミス サイト、ネオクラウド環境を Google Cloud に接続するお客様向けに提供されています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Partner Cross-Cloud Interconnect は、ネットワークの相互運用性に関する</span><a href=\"https://github.com/aws/Interconnect\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">オープン仕様</span></a><span style=\"vertical-align: baseline;\">に基づいて構築されています。Google Cloud は</span><a href=\"https://cloud.google.com/blog/ja/products/networking/aws-and-google-cloud-collaborate-on-multicloud-networking?e=48754805&amp;hl=ja\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AWS と共同</span></a><span style=\"vertical-align: baseline;\">でこの仕様を昨年公開しており、どのプロバイダでも採用できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">詳細については、Partner Cross-Cloud Interconnect の</span><a href=\"https://docs.cloud.google.com/network-connectivity/docs/interconnect/concepts/partner-cci-for-csp-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">または Microsoft の</span><a href=\"https://aka.ms/AMIIgnite_Blog\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">発表</span></a><span style=\"vertical-align: baseline;\">をご覧いただくか、Google Cloud のアカウント担当者にお問い合わせください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">クラウド ネットワーキング、プロダクト管理担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Himanshu Mehra</strong></p></div>"
  "543ac6bf44eac3b295a5b2a8f72f0841":
    "id": "543ac6bf44eac3b295a5b2a8f72f0841"
    "title": "GTIG AI 脅威トラッカー: プロンプトから自律型へ – 敵対的 AI の進化"
    "link": "https://cloud.google.com/blog/ja/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai/"
