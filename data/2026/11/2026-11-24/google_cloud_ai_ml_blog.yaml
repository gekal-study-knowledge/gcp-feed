  "2f584d2033edd58968e1612e545bc12e":
    "id": "2f584d2033edd58968e1612e545bc12e"
    "title": "Data + AI Anywhere: AlloyDB Omni integration with local models"
    "link": "https://cloud.google.com/blog/products/databases/alloydb-omni-integration-with-local-models/"
    "published": "2026-11-24 02:00:00"
    "fetched": "2026-11-24 04:51:53"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Open models like Gemma 4 from Google DeepMind are a great option to keep your data local. But how can a local AI model integrate with on-premises data?</span></p>\n<p><a href=\"https://cloud.google.com/alloydb/omni?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni</span></a><span style=\"vertical-align: baseline;\">, Google’s 100% PostgreSQL-compatible database that runs anywhere, now integrates with locally hosted large language models (LLMs). With AlloyDB Omni, you can build agentic experiences on your own infrastructure and on your own terms. Whether it’s in the cloud, in your datacenter, or even on your laptop, you can have data plus AI anywhere.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Built-in AI for your local environment</strong></h2>\n<p><span style=\"vertical-align: baseline;\">AlloyDB Omni is a downloadable, run-anywhere edition of AlloyDB that easily deploys to your own infrastructure, including on-premises. AlloyDB Omni packs powerful, built-in AI, including the same ScaNN indexing technology powering Google Search. When you pair AlloyDB Omni with a model, you can store vector embeddings at scale; search them semantically; and even query the database using natural language. You can use virtually any model you like, whether that’s a frontier Cloud-hosted model like Gemini or a local model. And with locally hosted models you maintain complete control over your data environment.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Connecting to Gemma 4, Qwen3.8, and other local models</strong></h2>\n<p><span style=\"vertical-align: baseline;\">You can now connect AlloyDB Omni to local models like </span><a href=\"https://deepmind.google/models/gemma/gemma-4/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemma 4</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://huggingface.co/Qwen\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Qwen3.8</span></a><span style=\"vertical-align: baseline;\">. No matter which model you choose, the architecture remains the same.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - alloydb-omni-local-models\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_-_alloydb-omni-local-models.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AlloyDB Omni calls a local model server directly from SQL — keeping prompts, data, and responses inside your environment.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">This setup enables entirely new use cases for environments that were previously blocked from adopting agentic capabilities. If you operate an air-gapped network or have data locality requirements, you can still build intelligent applications. You can analyze local logs, generate summaries of proprietary internal documents, and power localized chatbots—all while maintaining strict data governance.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Keep data on-premises:</strong><span style=\"vertical-align: baseline;\"> Because the database and the model sit in the same local environment, your data never crosses the public internet.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reduce latency:</strong><span style=\"vertical-align: baseline;\"> Processing inference requests locally minimizes network transit time.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Query directly via SQL:</strong><span style=\"vertical-align: baseline;\"> Your standard database queries can invoke machine learning functions that process data locally. Like this:</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;SELECT customer_name,\\r\\n       ai.generate(&#x27;Summarize in 1 short sentence: &#x27; || comment,\\r\\n                   model_id =&gt; &#x27;gemma4_llm&#x27;) AS summary\\r\\nFROM customer_feedback;\\r\\n\\r\\n customer_name |                                summary                                \\r\\n---------------+-----------------------------------------------------------------------\\r\\n Alice         | The customer demands a refund for a double charge or they will cancel\\r\\n Bob           | The user likes the product but requests dark mode support.&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff31eb9d2d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Next, you’ll see how to run queries like this yourself, step by step.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Get started</strong></h2>\n<p><span style=\"vertical-align: baseline;\">You can test this integration on your own machines today. Using a Kubernetes environment we will show you how to deploy and integrate AlloyDB Omni and a local open model.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Step 0: Before you begin</strong></h3>\n<p><span style=\"vertical-align: baseline;\">In this example, we will use Google Kubernetes Engine (GKE) to host the AlloyDB Omni database and local model. GKE gives us a standardized, reproducible environment but you can use the same setup on-prem or almost anywhere.</span></p>\n<p><span style=\"vertical-align: baseline;\">We will assume you have already setup:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/quickstarts/create-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">A GKE cluster</span></a><span style=\"vertical-align: baseline;\">, and</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kubernetes tools </span><a href=\"https://kubernetes.io/docs/tasks/tools/#kubectl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">kubectl</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://helm.sh/docs/intro/install/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Helm</span></a></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Step 1: Deploy the AlloyDB Omni Kubernetes Operator</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We will use the </span><a href=\"https://docs.cloud.google.com/alloydb/omni/kubernetes/current/docs/deploy-kubernetes\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB Omni Kubernetes operator</span></a><span style=\"vertical-align: baseline;\"> to set up our AlloyDB Omni database. The Operator makes deploying and maintaining AlloyDB Omni a breeze.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;helm install \\\\\\r\\n  cert-manager oci://quay.io/jetstack/charts/cert-manager \\\\\\r\\n  --version v1.21.3 \\\\\\r\\n  --namespace cert-manager \\\\\\r\\n  --create-namespace \\\\\\r\\n  --set crds.enabled=true \\\\\\r\\n  --set global.leaderElection.namespace=cert-manager\\r\\n\\r\\nhelm install alloydbomni-operator oci://gcr.io/alloydb-omni/alloydbomni-operator \\\\\\r\\n--version 1.9.0 \\\\\\r\\n--create-namespace \\\\\\r\\n--namespace alloydb-omni-system \\\\\\r\\n$(helm install --help | grep -q -- &#x27;--rollback-on-failure&#x27; &amp;&amp; echo &#x27;--rollback-on-failure&#x27; || echo &#x27;--atomic&#x27;) \\\\\\r\\n--timeout 5m&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff2ef65c650&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Step 2: Create your AlloyDB Omni database</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Don’t forget to enable the </span><code style=\"vertical-align: baseline;\">googleMLExtension</code><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl create namespace ai-demo\\r\\n\\r\\ncat &lt;&lt; \\&#x27;EOF\\&#x27; | kubectl apply -f -\\r\\napiVersion: v1\\r\\nkind: Secret\\r\\nmetadata:\\r\\n  name: db-pw-my-omni\\r\\n  namespace: ai-demo\\r\\ntype: Opaque\\r\\ndata:\\r\\n  my-omni: &quot;VmVyeVN0cm9uZ1Bhc3N3b3Jk&quot; # password &quot;VeryStrongPassword&quot;\\r\\n---\\r\\napiVersion: alloydbomni.dbadmin.goog/v1\\r\\nkind: DBCluster\\r\\nmetadata:\\r\\n  name: my-omni\\r\\n  namespace: ai-demo\\r\\nspec:\\r\\n  databaseVersion: &quot;18.4.0&quot;\\r\\n  primarySpec:\\r\\n    adminUser:\\r\\n      passwordRef:\\r\\n        name: db-pw-my-omni\\r\\n    features:\\r\\n      googleMLExtension:\\r\\n        enabled: true\\r\\n    resources:\\r\\n      cpu: 2\\r\\n      memory: 4Gi\\r\\n      disks:\\r\\n      - name: DataDisk\\r\\n        size: 20Gi\\r\\n        storageClass: standard\\r\\n    dbLoadBalancerOptions:\\r\\n      annotations:\\r\\n        networking.gke.io/load-balancer-type: &quot;internal&quot;\\r\\n  allowExternalIncomingTraffic: true\\r\\nEOF&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff2ef279110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Step 3: Deploy your AI model</strong></h3>\n<p><span style=\"vertical-align: baseline;\">We will use </span><a href=\"https://ollama.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Ollama</span></a><span style=\"vertical-align: baseline;\"> to help us deploy our model.</span></p>\n<p><span style=\"vertical-align: baseline;\">In this example we deploy Gemma 4 from Google DeepMind. Or, you can modify this command to deploy Qwen3.8 – just change a few lines as noted in the comments.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;cat &lt;&lt; \\&#x27;EOF\\&#x27; | kubectl apply -f -\\r\\napiVersion: apps/v1\\r\\nkind: Deployment\\r\\nmetadata:\\r\\n name: ollama\\r\\n namespace: ai-demo\\r\\nspec:\\r\\n replicas: 1\\r\\n selector:\\r\\n   matchLabels:\\r\\n     app: ollama\\r\\n template:\\r\\n   metadata:\\r\\n     labels:\\r\\n       app: ollama\\r\\n   spec:\\r\\n     containers:\\r\\n     - name: ollama\\r\\n       image: ollama/ollama:latest\\r\\n       ports:\\r\\n       - containerPort: 11434\\r\\n       env:\\r\\n       - name: OLLAMA_KEEP_ALIVE\\r\\n         value: &quot;-1&quot;                  # keep the model in RAM\\r\\n       - name: OLLAMA_LOAD_TIMEOUT\\r\\n         value: &quot;20m&quot;\\r\\n       resources:\\r\\n         requests:\\r\\n           cpu: &quot;4&quot;\\r\\n           memory: &quot;16Gi&quot;             # for Qwen 3.8: 24Gi\\r\\n       volumeMounts:\\r\\n       - name: models\\r\\n         mountPath: /root/.ollama\\r\\n       lifecycle:\\r\\n         postStart:\\r\\n           exec:\\r\\n             command: [&quot;/bin/sh&quot;, &quot;-c&quot;, &quot;(sleep 5 &amp;&amp; ollama pull gemma4:12b) &gt;/dev/null 2&gt;&amp;1 &amp;&quot;]\\r\\n             # For Qwen 3.8, comment out the line above and use this one:\\r\\n             # command: [&quot;/bin/sh&quot;, &quot;-c&quot;, &quot;(sleep 5 &amp;&amp; ollama pull qwen3.8) &gt;/dev/null 2&gt;&amp;1 &amp;&quot;]\\r\\n     volumes:\\r\\n     - name: models\\r\\n       ephemeral:\\r\\n         volumeClaimTemplate:\\r\\n           spec:\\r\\n             accessModes: [&quot;ReadWriteOnce&quot;]\\r\\n             resources:\\r\\n               requests:\\r\\n                 storage: 30Gi\\r\\n---\\r\\napiVersion: v1\\r\\nkind: Service\\r\\nmetadata:\\r\\n name: ollama-service\\r\\n namespace: ai-demo\\r\\nspec:\\r\\n type: ClusterIP\\r\\n ports:\\r\\n - port: 11434\\r\\n   targetPort: 11434\\r\\n selector:\\r\\n   app: ollama\\r\\nEOF&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff2ef27a150&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Step 4: Register the model with AlloyDB Omni</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Connect to your database.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;kubectl exec -it -n ai-demo $(kubectl get pod -n ai-demo -l alloydbomni.internal.dbadmin.goog/task-type=database -o jsonpath=\\&#x27;{.items[0].metadata.name}\\&#x27;) -c database -- env PGPASSWORD=&quot;VeryStrongPassword&quot; psql -h 127.0.0.1 -U postgres&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff2ef279750&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Note: If you receive a connection error, you might need to wait a moment for your database to provision.</span></p>\n<p><span style=\"vertical-align: baseline;\">Now you should be connected to your AlloyDB Omni database with the </span><code style=\"vertical-align: baseline;\">psql</code><span style=\"vertical-align: baseline;\"> client. Next, run the following SQL script to register your local model.</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE EXTENSION IF NOT EXISTS google_ml_integration;\\r\\nALTER SYSTEM SET google_ml_integration.request_timeout_in_seconds = 600;\\r\\nSELECT pg_reload_conf();\\r\\nCREATE OR REPLACE FUNCTION google_ml.ollama_llm_input_transform(\\r\\n  model_id character varying, prompt text,\\r\\n  generation_config json, system_instructions json\\r\\n) RETURNS json AS $$\\r\\n  SELECT json_build_object(\\r\\n    &#x27;model&#x27;, CASE model_id\\r\\n               WHEN &#x27;gemma4_llm&#x27;  THEN &#x27;gemma4:12b&#x27;\\r\\n               WHEN &#x27;qwen3_8_llm&#x27; THEN &#x27;qwen3.8&#x27;\\r\\n             END,\\r\\n    &#x27;messages&#x27;, json_build_array(\\r\\n      json_build_object(&#x27;role&#x27;, &#x27;system&#x27;, &#x27;content&#x27;,\\r\\n        COALESCE(system_instructions-&gt;&#x27;systemInstruction&#x27;-&gt;&#x27;parts&#x27;-&gt;0-&gt;&gt;&#x27;text&#x27;,\\r\\n                 &#x27;You are a helpful assistant.&#x27;)),\\r\\n      json_build_object(&#x27;role&#x27;, &#x27;user&#x27;, &#x27;content&#x27;, prompt)\\r\\n    )\\r\\n  );\\r\\n$$ LANGUAGE sql;\\r\\n\\r\\nCREATE OR REPLACE FUNCTION google_ml.ollama_llm_output_transform(\\r\\n  model_id character varying, response json\\r\\n) RETURNS text AS $$\\r\\n  SELECT trim(regexp_replace(\\r\\n    response-&gt;&#x27;choices&#x27;-&gt;0-&gt;&#x27;message&#x27;-&gt;&gt;&#x27;content&#x27;,\\r\\n    &#x27;&lt;think&gt;.*?&lt;/think&gt;&#x27;, &#x27;&#x27;, &#x27;s&#x27;));\\r\\n$$ LANGUAGE sql;\\r\\n\\r\\nCALL google_ml.create_model(\\r\\n  model_id =&gt; &#x27;gemma4_llm&#x27;,   -- and/or &#x27;qwen3_8_llm&#x27;,\\r\\n  model_request_url =&gt; &#x27;http://ollama-service.ai-demo.svc.cluster.local:11434/v1/chat/completions&#x27;,\\r\\n  model_provider =&gt; &#x27;custom&#x27;,\\r\\n  model_type     =&gt; &#x27;llm&#x27;,\\r\\n  model_in_transform_fn  =&gt; &#x27;google_ml.ollama_llm_input_transform&#x27;,\\r\\n  model_out_transform_fn =&gt; &#x27;google_ml.ollama_llm_output_transform&#x27;\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff2ef278550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Note: If you receive a </span><code style=\"vertical-align: baseline;\">Resource not found</code><span style=\"vertical-align: baseline;\"> error, wait a moment for the model to load.</span></p>\n<p><span style=\"vertical-align: baseline;\">In addition to registering your model, the above script tells AlloyDB Omni how to interpret the model’s raw output. In this example chain-of-thought (CoT) reasoning is part of the response inside </span><code style=\"vertical-align: baseline;\">&lt;think&gt;&lt;/think&gt;</code><span style=\"vertical-align: baseline;\"> tags. We don’t want the CoT, so our output transform function removes it.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Step 5: Try it out!</strong></h3>\n<p><span style=\"vertical-align: baseline;\">You can use functions like </span><code style=\"vertical-align: baseline;\">ai.generate</code><span style=\"vertical-align: baseline;\"> built-in to AlloyDB Omni to connect to your local model – without ever leaving the SQL client!</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;CREATE TABLE customer_feedback (\\r\\n   id SERIAL PRIMARY KEY,\\r\\n   customer_name TEXT,\\r\\n   comment TEXT\\r\\n);\\r\\nINSERT INTO customer_feedback (customer_name, comment) VALUES\\r\\n(&#x27;Alice&#x27;, &#x27;I was charged twice on my credit card! Please refund $49 immediately or I will cancel.&#x27;),\\r\\n(&#x27;Bob&#x27;,   &#x27;Great product, but can you please add dark mode support?&#x27;);\\r\\n\\r\\nSELECT customer_name,\\r\\n       ai.generate(&#x27;Summarize in 1 short sentence: &#x27; || comment,\\r\\n                   model_id =&gt; &#x27;gemma4_llm&#x27; /* or &#x27;qwen3_8_llm&#x27; */) AS summary\\r\\nFROM customer_feedback;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7ff2ef27b0d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Make it your own</span></h2>\n<p><span style=\"vertical-align: baseline;\">Try out all the AI features that AlloyDB Omni has to offer! AlloyDB Omni </span><a href=\"https://cloud.google.com/alloydb/ai?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">supports</span></a><span style=\"vertical-align: baseline;\"> fast vector search, built-in AI functions, and more. </span><a href=\"https://docs.cloud.google.com/alloydb/omni/containers/current/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Give them a try</span></a><span style=\"vertical-align: baseline;\"> and build something great.</span></p></div>"
"last_updated": "2026-11-24 04:51:53 JST"
