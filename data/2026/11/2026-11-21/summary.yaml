"overview": |
  この日は Google Cloud ブログ 9 本 (うち 2 本は AI & ML ブログにも掲載) とリリースノート 1 本 (掲載数は計 12) で、データ基盤とエージェント、GKE のネットワーク、アクセス管理が中心でした。データ分析では、Managed Service for Apache Spark 4.0 がサーバーレスとマネージドクラスタの両方で一般提供になりました。サーバーレスでの利用は過去 1 年でほぼ倍増して毎月数百万ジョブが動いており、Spark と BigQuery が同じテーブルを読み書きでき、Knowledge Catalog でガバナンスやリネージを共有します。Managed Service for Apache Airflow (旧 Cloud Composer) はパイプラインのライフサイクル全体にエージェントの支援を加え、コンソールの Managed Airflow Agent が失敗したタスクの調査、環境の改善提案、DAG の新しい Airflow バージョンへの対応確認を行い、IDE やコーディングエージェントでは Data Agent Kit が DAG の作成・移行・デプロイを担います (架空の小売企業 Cymbal Shops のブラックフライデーを例に解説)。Vodafone Czech Republic は BigQuery の Data Engineering Agent を Dataform で使い、2,000〜3,000 行規模のレガシーなストアドプロシージャを Dataform パイプラインに置き換えて実行時間を半分にしました。データエージェントの評価については、実データの構造と因果的なふるまいを保ちつつ名前・数値・文書をすべて合成した「風洞」となる合成データ環境で試験すべきだという論考も公開されています。GKE では、サイドカーを使わないサービスメッシュである ambient networking が一般提供になり、ネットワーク機能をアプリケーションの Pod からノード単位の共有コンポーネントとマネージドなコントロールプレーン (Traffic Director、Certificate Authority Service による mTLS 用の証明書発行) に移します。アクセス管理では、Cloud IAM の次世代アクセス制御エンジン Unified Access Policies が追加料金なしでプレビューになり、許可と拒否のルールを 1 つのスキーマにまとめ、ポリシーを一度書けば組織全体にバインドでき、人・ワークロード・エージェントの ID を既存の IAM ポリシーとあわせて管理できます。そのほか、Google AI Studio の API キーの漏えいで月 180 ドルの利用が数万ドルの請求になり得るとして、Application Default Credentials などで生の API キーから離れる手順のガイド、Google 広告チームが Spanner Graph を数十億ノード規模の不正・悪用検知に使っている事例 (2025 年の世界の詐欺損失は約 5,800 億ドルと推定)、TCS のターミナル運用システム DynaPORT を AlloyDB for PostgreSQL と GKE でモダナイズした事例が紹介されました。リリースノートでは、Google Cloud CLI 594.0.1 (2026-11-21) が一般的なバグ修正として公開されました。
