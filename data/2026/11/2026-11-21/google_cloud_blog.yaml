"entries":
  "07f7b0d74cc6283227cebdd928fad052":
    "id": "07f7b0d74cc6283227cebdd928fad052"
    "title": "Ultimate guide for fixing your team’s API keys"
    "link": "https://cloud.google.com/blog/topics/developers-practitioners/how-to-fix-your-teams-api-keys/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Most Gemini prototypes start the same way. You grab an API key from </span><a href=\"https://aistudio.google.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI Studio</span></a><span style=\"vertical-align: baseline;\">, then paste it into your coding agent to start building a prototype. That speed is the point, and shouldn’t be slowed down. </span></p>\n<p><span style=\"vertical-align: baseline;\">The trouble starts later, when the prototype gets real users and the key comes along unchanged. By then it usually isn't one key. Every developer has their own, often several, sitting in </span><span style=\"vertical-align: baseline;\">.env</span><span style=\"vertical-align: baseline;\"> files, shell profiles and chat threads. The app has one more, baked into its config.</span></p>\n<p><span style=\"vertical-align: baseline;\">For example, imagine an account that normally spends $180 a month. One of those keys ends up in a public repo, a Slack channel or a mobile app bundle. Automated scrapers find it within minutes and use it to run large workloads. By the time the first billing alert arrives, the bill is in the tens of thousands. Under the </span><a href=\"https://cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate\"><span style=\"text-decoration: underline; vertical-align: baseline;\">shared responsibility model</span></a><span style=\"vertical-align: baseline;\">, the customer pays for usage made with their own valid credentials. For a seed-stage company, that’s runway gone in a weekend.</span></p>\n<p><span style=\"vertical-align: baseline;\">In our recent post, </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/10-questions-for-your-startup-developers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">10 questions every startup should answer before moving to production with their AI prototype</span></a><span style=\"vertical-align: baseline;\">, we covered the whole path from prototype to production. This post goes deeper on one part of it: getting off raw API keys entirely.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here is what this guide covers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Authorize your people.</strong><span style=\"vertical-align: baseline;\"> Give everyone on the team one login with Application Default Credentials and use it to call Gemini, Claude and open models. Steps 1 and 2 take about five minutes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Authorize your application.</strong><span style=\"vertical-align: baseline;\"> Run your app under its own service account with only the access it needs. Steps 3 and 4.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lock down what's left.</strong><span style=\"vertical-align: baseline;\"> Move the remaining keys into Secret Manager, then add spend caps, guardrails and monitoring. Step 5 and the closing sections.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">The code for every step is in a </span><a href=\"https://github.com/sergiov8/secure-your-keys-demo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">companion repo</span></a><span style=\"vertical-align: baseline;\"> with runnable samples and offline tests.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Why a raw key is different</span></h3>\n<p><span style=\"vertical-align: baseline;\">An AI Studio key is a bearer token. Whoever holds it can use it. It doesn't expire on its own. It isn't tied to a machine, a person or a workload. It has no spending limit unless you add one. When someone leaves the company, nobody knows which keys to revoke.</span></p>\n<p><span style=\"vertical-align: baseline;\">That is fine on your laptop while you are the only user. It stops being fine when any of these is true:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">A key has left your laptop. It was shared in chat, committed to a repo or deployed to a server.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">More than one person on the team needs to call the API.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You are spending more than a few hundred dollars a month, or you are about to onboard paying customers.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If one of those describes you, do the switch this week.</span></p>\n<p><span style=\"vertical-align: baseline;\">Before changing anything, find out where your keys are. The repo includes a small scanner that looks for strings shaped like Google API keys and for </span><span style=\"vertical-align: baseline;\">api_key=</span><span style=\"vertical-align: baseline;\"> set to a literal value. It reports the file and line but never the key itself. It also exits with an error, so you can drop it into CI:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;python -m step1_keyless_auth.scan_for_keys .&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33b389890&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Step one: Give each person one login</span></h3>\n<p><span style=\"vertical-align: baseline;\">Each person on the team runs one command:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud auth application-default login&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe34edd3450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">A browser window opens, you sign in with your work account and gcloud stores a short-lived credential on your machine. Every Google Cloud SDK finds it automatically. There is no key to copy, paste or leak.</span></p>\n<p><span style=\"vertical-align: baseline;\">Then point your tools at the team project:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;export GOOGLE_CLOUD_PROJECT=my-startup-dev&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe34edd3250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Someone has to grant you access to the project first. Step four shows how.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step two: Call any model with that login</span></h3>\n<p><span style=\"vertical-align: baseline;\">That single credential works for every model in </span><a href=\"https://cloud.google.com/model-garden\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Garden</span></a><span style=\"vertical-align: baseline;\">, not only Gemini. You don't need new accounts, new keys or separate invoices. Within each SDK, switching models means changing one string.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Gemini</strong><span style=\"vertical-align: baseline;\">, with the </span><a href=\"https://github.com/googleapis/python-genai\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Gen AI SDK</span></a><span style=\"vertical-align: baseline;\">. If your prototype builds the client with </span><span style=\"vertical-align: baseline;\">api_key=...</span><span style=\"vertical-align: baseline;\">, this is the only change:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google import genai\\r\\n\\r\\nclient = genai.Client(enterprise=True, project=&quot;my-startup-dev&quot;, location=&quot;global&quot;)\\r\\nresp = client.models.generate_content(model=&quot;gemini-4-hydrogen&quot;, contents=&quot;Hi&quot;)\\r\\nprint(resp.text)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe34edd3110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">enterprise=True</span><span style=\"vertical-align: baseline;\"> sends the call to Gemini Platform instead of AI Studio. Older samples call the same flag </span><span style=\"vertical-align: baseline;\">vertexai=True</span><span style=\"vertical-align: baseline;\">, and current SDK versions accept both.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Claude</strong><span style=\"vertical-align: baseline;\">, with </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/partner-models/claude/use-claude\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Anthropic's SDK</span></a><span style=\"vertical-align: baseline;\"> and the same login:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from anthropic import AnthropicVertex\\r\\n\\r\\nclient = AnthropicVertex(project_id=&quot;my-startup-dev&quot;, region=&quot;global&quot;)\\r\\nmsg = client.messages.create(\\r\\n    model=&quot;claude-sonnet-5-5&quot;,\\r\\n    max_tokens=512,\\r\\n    messages=[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Hi&quot;}],\\r\\n)\\r\\nprint(msg.content[0].text)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe34edd1450&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Open models</strong><span style=\"vertical-align: baseline;\"> such as OpenAI's </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/maas/openai/gpt-oss-120b\"><span style=\"text-decoration: underline; vertical-align: baseline;\">gpt-oss</span></a><span style=\"vertical-align: baseline;\">, with the OpenAI SDK pointed at Google Cloud:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import google.auth, google.auth.transport.requests\\r\\nfrom openai import OpenAI\\r\\n\\r\\ncreds, _ = google.auth.default(scopes=[&quot;https://www.googleapis.com/auth/cloud-platform&quot;])\\r\\ncreds.refresh(google.auth.transport.requests.Request())\\r\\n\\r\\nclient = OpenAI(\\r\\n    base_url=&quot;https://aiplatform.googleapis.com/v1/projects/my-startup-dev/locations/global/endpoints/openapi&quot;,\\r\\n    api_key=creds.token,  # a one-hour token from your login, not a stored key\\r\\n)\\r\\nresp = client.chat.completions.create(\\r\\n    model=&quot;openai/gpt-oss-120b-maas&quot;,\\r\\n    messages=[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Hi&quot;}],\\r\\n)\\r\\nprint(resp.choices[0].message.content)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af10d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Two things to know:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Partner models like Claude need a one-time </span><strong style=\"vertical-align: baseline;\">Enable</strong><span style=\"vertical-align: baseline;\"> on their Model Garden card in each project. After that, everyone with access can call them.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">OpenAI's GPT-6 models </span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/google-cloud-brings-openai-models-to-customers\"><span style=\"text-decoration: underline; vertical-align: baseline;\">arrived in Model Garden</span></a><span style=\"vertical-align: baseline;\"> on October 21 in private preview for select enterprise customers. When they open up, the same login will work for them too.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Every call lands on one Google Cloud bill, which makes it easier to compare models on cost and quality.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step three: Give your app its own identity</span></h3>\n<p><span style=\"vertical-align: baseline;\">Your app needs the same thing your developers just got: an identity instead of a key. For a workload, that identity is a service account.</span></p>\n<p><span style=\"vertical-align: baseline;\">The good news is that the code from Step 2 doesn't change. On your laptop, ADC picks up your own login. On Cloud Run, GKE or Compute Engine, it picks up a short-lived token for the service account attached to the workload, refreshed automatically. So there is nothing in your codebase to leak. A token that escapes is short-lived, usually about an hour, and it only carries the permissions of one service account.</span></p>\n<p><span style=\"vertical-align: baseline;\">Create the service account and deploy with it:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud iam service-accounts create agent-runtime \\\\\\r\\n  --display-name=&quot;Runtime identity for the app&quot;\\r\\n\\r\\ngcloud run deploy my-agent \\\\\\r\\n  --image=us-docker.pkg.dev/my-startup-prod/agents/api:v1 \\\\\\r\\n  --service-account=agent-runtime@my-startup-prod.iam.gserviceaccount.com \\\\\\r\\n  --region=us-central1&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af12cd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Keep people and production apart. Developers work in </span><span style=\"vertical-align: baseline;\">my-startup-dev</span><span style=\"vertical-align: baseline;\"> under their own logins, and the app runs in </span><span style=\"vertical-align: baseline;\">my-startup-prod</span><span style=\"vertical-align: baseline;\"> under its service account. A mistake in one doesn't spend the other's budget.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Step four: Give each identity only what it needs</span></h3>\n<p><span style=\"vertical-align: baseline;\">Removing keys solves the leak problem. The next question is what each identity is allowed to do. If a person or a service account holds the Editor or Owner role, a stolen login or token can still delete resources, change permissions or read data it never needed.</span></p>\n<p><span style=\"vertical-align: baseline;\">Calling models takes one role, </span><a href=\"https://cloud.google.com/vertex-ai/docs/general/access-control\"><span style=\"text-decoration: underline; vertical-align: baseline;\">roles/aiplatform.user</span></a><span style=\"vertical-align: baseline;\">. The grant looks the same for both kinds of identity.</span></p>\n<p><span style=\"vertical-align: baseline;\">For people, grant it to a Google group, not to individuals. Onboarding and offboarding then become a group membership change:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud projects add-iam-policy-binding my-startup-dev \\\\\\r\\n  --member=&quot;group:ai-builders@my-startup.com&quot; \\\\\\r\\n  --role=&quot;roles/aiplatform.user&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af12b50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">For the app, grant it to the service account:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud projects add-iam-policy-binding my-startup-prod \\\\\\r\\n  --member=&quot;serviceAccount:agent-runtime@my-startup-prod.iam.gserviceaccount.com&quot; \\\\\\r\\n  --role=&quot;roles/aiplatform.user&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af11c10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">It takes about 30 seconds longer than granting Editor. If anything is compromised later, the attacker gets one narrow role instead of the whole project. When someone leaves, remove them from the group and their access ends everywhere at once.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the Cloud Console, the Grant access dialog has a </span><strong style=\"vertical-align: baseline;\">Help me choose roles</strong><span style=\"vertical-align: baseline;\"> button. You describe the task in plain English and </span><a href=\"https://cloud.google.com/iam/docs/role-picker-gemini\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemini suggests predefined roles</span></a><span style=\"vertical-align: baseline;\">. By default the suggestions cover common tasks, which usually means a service's broad Admin, Editor or Viewer role. To get the narrow roles, say so:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"vertical-align: baseline;\">What is the narrowest access a service account needs to call Gemini models on Agent Platform?</span></p>\n<p><span style=\"vertical-align: baseline;\">Three more controls are worth knowing:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">If your project sits in an organization, the </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/control-model-access\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vertexai.allowedModels</span></a><span style=\"vertical-align: baseline;\"> policy limits which models anyone can call. You list values such as </span><span style=\"vertical-align: baseline;\">publishers/google/models/gemini-4-hydrogen:predict</span><span style=\"vertical-align: baseline;\">, and everything else is blocked.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The repo includes a one-line audit that lists every service account holding Owner or Editor on a project. Run it now and again before each launch.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">To stop new keys from being created, enforce </span><a href=\"https://docs.cloud.google.com/organization-policy/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Org Policies</span></a><span style=\"vertical-align: baseline;\"> denying CREATE on </span><a href=\"https://docs.cloud.google.com/api-keys/docs/custom-constraints\"><span style=\"text-decoration: underline; vertical-align: baseline;\">apikeys.googleapis.com/Key</span></a><span style=\"vertical-align: baseline;\"> for API keys and </span><a href=\"https://docs.cloud.google.com/organization-policy/restrict-service-accounts#disable_service_account_key_creation\"><span style=\"text-decoration: underline; vertical-align: baseline;\">iam.managed.disableServiceAccountKeyCreation</span></a><span style=\"vertical-align: baseline;\"> for service account keys.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Step 5: Put the remaining keys in Secret Manager</span></h3>\n<p><span style=\"vertical-align: baseline;\">Some keys won't go away, like Stripe, Slack or your email provider. They belong in </span><a href=\"https://cloud.google.com/secret-manager\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Secret Manager</span></a><span style=\"vertical-align: baseline;\">, not in </span><span style=\"vertical-align: baseline;\">.env</span><span style=\"vertical-align: baseline;\"> files, chat threads or the repo. Access works the way it did in Step 4: grant read access on each secret to the identity that needs it.</span></p>\n<p><span style=\"vertical-align: baseline;\">Test keys go to the developer group:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud secrets create stripe-test-key --data-file=-\\r\\ngcloud secrets add-iam-policy-binding stripe-test-key \\\\\\r\\n  --member=&quot;group:ai-builders@my-startup.com&quot; \\\\\\r\\n  --role=&quot;roles/secretmanager.secretAccessor&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af112d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Anyone in the group can then fetch the key with their own login:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;gcloud secrets versions access latest --secret=stripe-test-key&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af139d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Live keys stay in the production project, readable only by the app's service account. The app reads them at startup:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;from google.cloud import secretmanager\\r\\n\\r\\nsm = secretmanager.SecretManagerServiceClient()\\r\\nresp = sm.access_secret_version(\\r\\n    name=&quot;projects/my-startup-prod/secrets/stripe-live-key/versions/latest&quot;\\r\\n)\\r\\nstripe_key = resp.payload.data.decode(&quot;utf-8&quot;)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af13150&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Reading </span><span style=\"vertical-align: baseline;\">--data-file=-</span><span style=\"vertical-align: baseline;\"> from standard input keeps the value out of your shell history. Every read is tied to a named person or service account, and rotating a key means adding one new version. Nothing is redeployed and no file is copied between laptops.</span></p>\n<p><span style=\"vertical-align: baseline;\">Then finish the job. Go to the </span><a href=\"https://aistudio.google.com/apikey\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Studio API keys page</span></a><span style=\"vertical-align: baseline;\"> and delete every key, personal or shared, that ever left a laptop. A key you have moved away from is still live until you delete it.</span></p>\n<h3><span style=\"vertical-align: baseline;\">What the new setup gives you</span></h3>\n<p><span style=\"vertical-align: baseline;\">Once your people and your app run on identities in a Google Cloud project, several protections become available that a bare key can't offer. You don't need all of them on day one. They are worth knowing about before your first launch.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">A spend cap that pauses the service</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Standard budget alerts send email while the bill keeps climbing. A </span><a href=\"https://cloud.google.com/billing/docs/how-to/budgets-spend-caps\"><span style=\"text-decoration: underline; vertical-align: baseline;\">spend cap budget</span></a><span style=\"vertical-align: baseline;\">, currently in Preview, does more. When estimated spend for one service in one project passes the amount you set, new requests to that service are paused until you lift the cap or the next month starts. Alerts go to billing admins and project owners at 50%, 80% and 100%.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can create one in the console under </span><strong style=\"vertical-align: baseline;\">Budgets &amp; alerts</strong><span style=\"vertical-align: baseline;\"> by choosing </span><strong style=\"vertical-align: baseline;\">Spend cap enforcement</strong><span style=\"vertical-align: baseline;\">, or through the Budget API. The repo wraps the API call and has a dry-run flag so you can inspect the request first:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;python -m bonus_spend_cap.create_spend_cap \\\\\\r\\n  --billing-account 012345-6789AB-CDEF01 --amount 500 --dry-run&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33af10550&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Know the limits before relying on it. Each cap covers a single project and a single service. Agent Platform, the Gemini API, Cloud Run and Cloud Run functions are eligible today. Enforcement runs on estimated cost and is not instant. Any overage is billed as normal, so set the number below the amount you can actually afford to lose. A cap also pauses usage covered by commitments, and after you lift it the service can take up to an hour to recover.</span></p>\n<p><span style=\"vertical-align: baseline;\">Set one cap on the dev project and another on prod. An experiment then can't drain the budget your customers depend on. For a second layer, lower your </span><a href=\"https://cloud.google.com/docs/quotas/view-manage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agent Platform quotas</span></a><span style=\"vertical-align: baseline;\"> to what you really need, so a bug or an agent stuck in a loop runs into a ceiling instead of your card limit.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Guardrails on prompts and responses</strong></h3>\n<p><span style=\"vertical-align: baseline;\">As soon as real users can type into your app, someone will try to make it ignore its instructions. </span><a href=\"https://cloud.google.com/security-command-center/docs/model-armor-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Model Armor</span></a><span style=\"vertical-align: baseline;\"> screens prompts and responses for prompt injection, jailbreak attempts, malicious URLs and sensitive data. You create a template once, check each prompt against it and only call the model when it comes back clean. The repo has both halves.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">A sandbox for model-written code</strong></h3>\n<p><span style=\"vertical-align: baseline;\">If your product lets the model write and run code, for example to analyze a customer's spreadsheet, that code should not run inside your application process. With </span><a href=\"https://cloud.google.com/vertex-ai/generative-ai/docs/code-execution\"><span style=\"text-decoration: underline; vertical-align: baseline;\">code execution</span></a><span style=\"vertical-align: baseline;\">, the model runs Python in a Google-managed sandbox and hands back the result:</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;config=types.GenerateContentConfig(\\r\\n    tools=[types.Tool(code_execution=types.ToolCodeExecution())],\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe34c648110&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The generated code never sees your environment variables, your files or your database.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Someone watching for unusual behavior</strong></h3>\n<p><a href=\"https://cloud.google.com/security-command-center\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Security Command Center</span></a><span style=\"vertical-align: baseline;\"> surfaces threats and misconfigurations across the project, such as a service account suddenly calling an API it has never used or a workload contacting an unfamiliar host. Together with Cloud Audit Logs, which record who changed what and when, it also gives you the answers your first enterprise customer's security review will ask for. Because every call now comes from a named person or service account, those logs mean something.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Your 20-minute checklist</strong></h2>\n<p><span style=\"vertical-align: baseline;\">For your team:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Everyone runs </span><span style=\"vertical-align: baseline;\">gcloud auth application-default login</span><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Grant </span><span style=\"vertical-align: baseline;\">roles/aiplatform.user</span><span style=\"vertical-align: baseline;\"> to one Google group, and enable the partner models you want.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Move shared test keys into Secret Manager, readable by the group.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For your app:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Deploy with a service account that holds </span><span style=\"vertical-align: baseline;\">roles/aiplatform.user</span><span style=\"vertical-align: baseline;\"> and nothing broader.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Move live third-party keys into Secret Manager, readable only by that service account.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Set a spend cap on each project below the amount you can afford to lose.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">For both: Run the key scanner, then delete every AI Studio key at </span><a href=\"https://aistudio.google.com/apikey\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">aistudio.google.com/apikey</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">None of this slows down building. You keep the speed of the prototype and every model in Model Garden stays one string away. Nobody on the team has to guard a key again. The full code, with a sample for every step and bonus above, is in the </span><a href=\"https://github.com/sergiov8/secure-your-keys-demo\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">companion repo</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Have a scenario you'd like us to cover next? Reach us at </span><a href=\"https://cloud.google.com/startup\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud for Startups</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "13f8eede339948b437722071960366d6":
    "id": "13f8eede339948b437722071960366d6"
    "title": "Drowning in clicks: Scaling Black Friday pipelines with Managed Airflow agents"
    "link": "https://cloud.google.com/blog/products/data-analytics/scaling-airflow-pipelines-with-ai-agents-on-managed-airflow/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">When an Airflow pipeline fails in production, the hard part is rarely the fix. It's finding out what to fix. A task dies without a traceback. Is it the code, the data, or the environment? Hard to say, as clues are scattered across task logs, scheduler logs, and worker metrics. And once you know what the problem is, the question becomes whether to add memory, rewrite the </span><a href=\"https://en.wikipedia.org/wiki/Directed_acyclic_graph\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DAG</span></a><span style=\"vertical-align: baseline;\">, or finally take on the major version upgrade you've been putting off. Answering these questions takes time and deep Airflow expertise, usually while you're on call in the middle of an incident.</span></p>\n<p><span style=\"vertical-align: baseline;\">AI agents can increasingly do much of this legwork. Managed Service for Apache Airflow (formerly Cloud Composer) now offers agentic help across a pipeline's entire lifecycle. In the Google Cloud console, </span><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/agentic-capabilities-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Airflow Agent</span></a><span style=\"vertical-align: baseline;\"> investigates failed tasks, recommends improvements to your environment, and checks whether your DAGs are ready for a newer Airflow version. In your IDE or coding agent, </span><a href=\"https://docs.cloud.google.com/data-agent-kit/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> writes, migrates, and deploys DAGs. In this post, we take you on a tour of these features through a story of a fictional company, Cymbal Shops. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Meet Cymbal Shops, where every click counts</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Amira is a data engineer at Cymbal Shops, an online retailer running </span><code style=\"vertical-align: baseline;\">cymbal-prod</code><span style=\"vertical-align: baseline;\">, a production Managed Airflow (Gen 3) environment whose workers have 2 vCPUs, 4 GB of memory, and that autoscale between 1 and 6. Every click, search, and add-to-cart on Cymbal's website and mobile app goes to a Pub/Sub topic. A </span><a href=\"https://docs.cloud.google.com/pubsub/docs/cloudstorage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage subscription</span></a><span style=\"vertical-align: baseline;\"> writes the events as newline-delimited JSON files into hourly folders under </span><code style=\"vertical-align: baseline;\">gs://cymbal-clickstream-landing/events/</code><span style=\"vertical-align: baseline;\">. It writes files in parallel and starts new ones every 5 minutes or every 128 MB, whichever comes first.</span></p>\n<p><span style=\"vertical-align: baseline;\">Analysts, meanwhile, want these events in BigQuery, cleaned and with personal data hashed — and they want them fast. Ideally, each file would be processed the moment it lands. But Cymbal's Airflow environment runs Airflow 2.11.1, and Airflow 2 has no native way to start a DAG run when something happens outside Airflow. You can get close: Schedule a DAG every few minutes and let a sensor wait for new files, or build an extra service that triggers runs through the Airflow REST API. However, the team doesn't want all those moving parts, so they settle for the next best thing: an hourly batch.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The pipeline that worked (until it didn't)</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Amira writes her DAGs with an agent. She works in </span><a href=\"https://antigravity.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity</span></a><span style=\"vertical-align: baseline;\"> with the </span><a href=\"https://docs.cloud.google.com/data-agent-kit/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit plugin</span></a><span style=\"vertical-align: baseline;\">, which adds Google Data Cloud skills and tools to the agent, and she uses Gemini as her model. Setup takes a few minutes: She installs the plugin, signs in with her Google account, and selects her project and region.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the agent panel, she describes what she needs with this prompt:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Write a DAG named clickstream_hourly for the Managed Airflow environment cymbal-prod in us-central1. Every hour, load the previous hour of clickstream events into the BigQuery table clickstream.events. The events are newline-delimited JSON files in gs://cymbal-clickstream-landing/events/YYYY-MM-DD/HH/. Transform them with pandas: read each file into a DataFrame with the nested context object kept as a JSON string, combine the files with pd.concat, then drop malformed records, deduplicate on event_id (Pub/Sub delivers at least once), and hash user_email and ip_address. Re-running an hour must not create duplicates. If a run fails, email data-oncall@example.com. Validate the DAG and deploy it.\"</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1 - authoring-clickstream-dag\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1_-_authoring-clickstream-dag.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Data Agent Kit inspects the target Managed Airflow environment in Antigravity, generates an Airflow 2.11-compatible DAG, and deploys it.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The agent checks the target environment before it writes any code. Because </span><code style=\"vertical-align: baseline;\">cymbal-prod</code><span style=\"vertical-align: baseline;\"> runs Airflow 2.11.1, the agent produces the code aligned to that version. It then deploys the DAG to </span><code style=\"vertical-align: baseline;\">cymbal-prod</code><span style=\"vertical-align: baseline;\"> and confirms that Airflow loads it without errors.</span></p>\n<p><span style=\"vertical-align: baseline;\">Amira reviews the code, and the DAG goes live in early August. It's good code: readable, idempotent, and correct for Airflow 2.11. A busy hour sees about 200 files and 350 MB, and the task peaks below 2 GB — well under the 4 GB worker limit.</span></p>\n<p><span style=\"vertical-align: baseline;\">Look at how the task builds its input, though. It lists every file in the hour's folder, reads each one into a DataFrame, and then </span><code style=\"vertical-align: baseline;\">pd.concat</code><span style=\"vertical-align: baseline;\"> combines them into a single DataFrame. The unit of work is a clock hour, so the task needs more memory as traffic grows. That's fine until traffic changes...</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2 - clickstream-hourly-code\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_-_clickstream-hourly-code.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>The hourly task loads every JSON file from the previous hour into memory and combines them into a single DataFrame with pd.concat.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Campaign week: out of memory</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Late October brings two changes in the same week. Cymbal launches its \"Fall Into Savings\" campaign, and a new mobile app release adds much more detailed event tracking. Events from the new app version are about three times larger than their predecessors, and the campaign brings more traffic on top, so an hour of clicks grows from about 350 MB to about 1.4 GB. Holding a whole hour in pandas takes several times its raw size, so </span><code style=\"vertical-align: baseline;\">load_previous_hour_clickstream</code><span style=\"vertical-align: baseline;\"> now needs more memory than a worker’s allotted 4 GB. Autoscaling doesn't help here: It adds workers when tasks queue up, but each task still runs on a single worker and can't use more memory than that worker has.</span></p>\n<p><span style=\"vertical-align: baseline;\">On October 23, the 14:00 UTC run of </span><code style=\"vertical-align: baseline;\">clickstream_hourly</code><span style=\"vertical-align: baseline;\"> fails. All three attempts die the same way, with no error in the task log.</span></p>\n<p><span style=\"vertical-align: baseline;\">Amira opens </span><code style=\"vertical-align: baseline;\">cymbal-prod</code><span style=\"vertical-align: baseline;\"> in the console, where Managed Airflow Agent is built in. It diagnoses the problem and recommends a fix; Amira decides what to change.</span></p>\n<p><span style=\"vertical-align: baseline;\">She goes to the DAGs tab, selects </span><code style=\"vertical-align: baseline;\">clickstream_hourly</code><span style=\"vertical-align: baseline;\">, and opens Run history. Next to the failed 14:00 run there's an Investigate button with a sparkle icon. She clicks it, and a short ‘Investigate DAG run failure’ dialog asks her to confirm her choice. The Ask agent panel then opens next to the page, and the agent starts investigating.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3 - console-troubleshoot-oom\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/3_-_console-troubleshoot-oom.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Managed Airflow Agent investigates the failed run in the console, correlates worker memory metrics with task retries, and recommends fixes.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">At the end of the report, the agent recommends three fixes: load the files straight into BigQuery, process them in batches, or give the workers more memory.</span></p>\n<p><span style=\"vertical-align: baseline;\">Look at what the agent delivers! Every conclusion includes the evidence that led to it, so Amira can check the reasoning herself.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">More memory buys time, not a fix</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Two of the recommendations are code changes, and code changes take time to write and test. With every hourly run now failing, Amira needs the quick fix first: more memory for the workers. But how much? The right number depends on the whole environment, not on one task. So she asks the agent in the same panel:</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"clickstream_hourly runs out of memory on 4 GB workers. Analyze the cymbal-prod environment and recommend how much worker memory it needs, along with any other improvements.\"</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4 - console-environment-recommendations\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/4_-_console-environment-recommendations.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Managed Airflow Agent analyzes environment-wide telemetry, recommends 8 GB worker memory, and flags resilience and retention gaps.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The agent recommends increasing worker memory from 4 GB to 8 GB, and flags three production-readiness gaps: Database retention is disabled, the environment isn't highly resilient, and it has no scheduled snapshots.</span></p>\n<p><span style=\"vertical-align: baseline;\">Amira acts on the first recommendation right away. The agent is read-only, so she makes the change herself and increases worker memory to 8 GB.</span></p>\n<p><span style=\"vertical-align: baseline;\">She schedules the other two recommendations for the next change window. With 8 GB workers, the pipeline gets through the rest of the campaign.</span></p>\n<p><span style=\"vertical-align: baseline;\">But that only buys time. Black Friday traffic is forecast at 8 to 10 times a normal peak hour, and at that volume the hourly batch will need well over 8 GB. The troubleshooting report had already named the real problem: a unit of work that grows with traffic. That brings Amira back to what the team wanted in the first place, which was to process each file as soon as it lands.</span></p>\n<p><span style=\"vertical-align: baseline;\">Airflow 3 makes that much easier, because it supports event-driven scheduling natively. An asset watcher listens to an external source, such as a Pub/Sub subscription. When new messages arrive, it updates an asset, and any DAG scheduled on that asset starts a run. Under the hood, the watcher still checks the subscription every few seconds, but it does so inside Airflow's triggerer. No DAG needs to be scheduled just so a sensor can wait for files, and no extra service has to trigger runs. Each run gets the new messages in its payload, so it can work on just the files that landed, one task per file, and memory per task depends on file size, not on how busy the hour is.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Before the jump: what breaks in Airflow 3?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">A major version upgrade of a production environment isn't something to do blind. Before anyone touches the code, Amira asks the agent in the same panel: </span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Check whether cymbal-prod is ready to upgrade to Airflow 3.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Managed Airflow Agent can also check upgrade readiness. It checks compatibility of the environment's DAGs with a given version. Amira is checking what problems she might have while migrating to Airflow 3.3.1 (</span><code style=\"vertical-align: baseline;\">composer-3-airflow-3.3.1-build.3</code><span style=\"vertical-align: baseline;\">). The agent reports the following observations:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5 - console-upgrade-readiness-check\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/5_-_console-upgrade-readiness-check.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Managed Airflow Agent scans DAGs in cymbal-prod for Airflow 3 compatibility blockers before migration.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Two findings are blockers. The first comes as a surprise: a maintenance DAG that cleans up the Airflow database by hand, which Airflow 3 no longer allows. The agent's fix is to retire it and turn on database retention, the same feature it recommended during the incident. The second, </span><code style=\"vertical-align: baseline;\">marketing_attribution</code><span style=\"vertical-align: baseline;\">, still uses </span><code style=\"vertical-align: baseline;\">execution_date</code><span style=\"vertical-align: baseline;\">, which Airflow 3 removed. Four DAGs also need </span><code style=\"vertical-align: baseline;\">schedule_interval</code><span style=\"vertical-align: baseline;\"> renamed to </span><code style=\"vertical-align: baseline;\">schedule</code><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">In a few minutes, the agent estimated the work to be done. To perform the upgrade, the report suggests using Data Agent Kit's migrations skill.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Rebuilt for the flood: one file at a time</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Rather than upgrading in place, Amira creates a new Airflow 3 environment alongside </span><code style=\"vertical-align: baseline;\">cymbal-prod</code><span style=\"vertical-align: baseline;\"> to move the DAGs there.</span></p>\n<p><span style=\"vertical-align: baseline;\">Back in Antigravity, Data Agent Kit's migrations skill takes over. It adapts existing DAGs to the target Airflow version, deploys them, and verifies them. Finally, the agent deploys the DAGs to </span><code style=\"vertical-align: baseline;\">cymbal-prod-af3</code><span style=\"vertical-align: baseline;\"> and confirms that they load without errors.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"6 - ide-airflow3-migration\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/6_-_ide-airflow3-migration.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Data Agent Kit's migrations skill refactors the pipeline to Airflow 3 event-driven scheduling and verifies deployment in cymbal-prod-af3.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Two design choices remove the original problem:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Scheduling moves into the watcher. </span><code style=\"vertical-align: baseline;\">PubsubPullTrigger</code><span style=\"vertical-align: baseline;\"> is an event trigger, so an </span><code style=\"vertical-align: baseline;\">AssetWatcher</code><span style=\"vertical-align: baseline;\"> can use it directly. The triggerer checks the subscription every 10 seconds in the background. Each batch of messages becomes an asset event that starts a run, with the messages in its payload. Nothing waits for the top of the hour, and no extra service has to call the Airflow REST API.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Each task processes one file rather than a full hour. Dynamic task mapping gives each new file its own task, and the subscription caps files at 128 MB. A busier hour means </span><span style=\"font-style: italic; vertical-align: baseline;\">more</span><span style=\"vertical-align: baseline;\"> tasks, not </span><span style=\"font-style: italic; vertical-align: baseline;\">bigger</span><span style=\"vertical-align: baseline;\"> ones.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Once the new DAG proves itself on live traffic, Amira pauses the hourly DAG in </span><code style=\"vertical-align: baseline;\">cymbal-prod</code><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Ready for Black Friday</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Success! In a load test that replayed eight times normal peak traffic, </span><code style=\"vertical-align: baseline;\">clickstream_ingest</code><span style=\"vertical-align: baseline;\"> simply ran more often. Memory per task didn't change.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Dimension</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Before: Airflow 2, hourly batch</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">After: Airflow 3, event-driven</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Unit of work</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">One clock hour: about 350 MB normally, 1.4 GB at campaign peak</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">One file, a few MB each (at most 128 MB)</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Peak memory per task</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Grows with traffic: about 5 to 6 GB at campaign peak, well over 8 GB forecast for Black Friday</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Flat, well under 1 GB</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Time from click to BigQuery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Over an hour</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">A few minutes</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">What made the difference</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Each agent works from the right vantage point. </strong><span style=\"vertical-align: baseline;\">The console agent inspects production telemetry with your permissions and doesn't change anything, while the coding agent works in the IDE where code changes get reviewed, tested, and deployed.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Each step sets up the next one. </strong><span style=\"vertical-align: baseline;\">The troubleshooting report offered a wider review, and each recommendation came with actionable advice. The upgrade check ended with next steps for the migrations skill, turning its report into the brief for the migration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agents propose and people decide. </strong><span style=\"vertical-align: baseline;\">Amira scaled the workers, ran the infrastructure commands, and reviewed every change.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Static inspection estimates the work before live migration. </strong><span style=\"vertical-align: baseline;\">Checking compatibility in the console scoped the effort in minutes, and the migration agent then made and verified the changes in a real environment.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Two more ways to use agents with Managed Airflow</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Amira used the agents built into the console and her IDE. Two other capabilities didn't fit her story but are worth knowing about:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">You can bring your own agent with the </span><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/use-composer-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Airflow MCP server</span></a><span style=\"vertical-align: baseline;\">, now generally available, so any MCP-compatible agent can manage your environments, allowing you to list and trigger DAGs, check run status, and inspect failed task instances. Access is controlled through IAM, and read-only tools are flagged so you can limit agents to them.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Run agentic steps inside your pipelines with the Apache Airflow </span><a href=\"https://airflow.apache.org/docs/apache-airflow-providers-common-ai/stable/index.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Common AI provider</span></a><span style=\"vertical-align: baseline;\">, which adds model-driven tasks that run side by side with deterministic ones in the same Airflow 3 DAG. Examples include </span><a href=\"https://airflow.apache.org/docs/apache-airflow-providers-common-ai/stable/operators/llm_branch.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LLM-based branching</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://airflow.apache.org/docs/apache-airflow-providers-common-ai/stable/retry_policies.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">agentic retries</span></a><span style=\"vertical-align: baseline;\"> that tell a transient error from a bad input, and </span><a href=\"https://airflow.apache.org/docs/apache-airflow-providers-common-ai/stable/operators/llm_schema_compare.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">schema drift detection</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Try it yourself</strong></h3>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Explore </span><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/troubleshoot-tasks-and-dag-runs-with-agent\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Airflow Agent troubleshooting</span></a><span style=\"vertical-align: baseline;\"> and the </span><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/agentic-capabilities-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">overview of agentic capabilities</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Install </span><a href=\"https://cloud.google.com/products/data-agent-kit\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> using the </span><a href=\"https://docs.cloud.google.com/data-agent-kit\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">, the </span><a href=\"https://marketplace.visualstudio.com/items?itemName=GoogleCloudTools.datacloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">extension for VS Code</span></a><span style=\"vertical-align: baseline;\">, the </span><a href=\"https://github.com/GoogleCloudPlatform/data-agent-kit-plugin\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">plugin for coding agents</span></a><span style=\"vertical-align: baseline;\"> (Antigravity, Claude Code, Gemini CLI, and Codex CLI), or the </span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">open-source Airflow agent skills</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn about </span><a href=\"https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/event-scheduling.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Airflow 3 event-driven scheduling</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Connect your agents to the </span><a href=\"https://docs.cloud.google.com/composer/docs/composer-3/use-composer-mcp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Airflow MCP server</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Build model-driven tasks and agents in DAGs with the </span><a href=\"https://airflow.apache.org/blog/common-ai-provider-1.0/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Apache Airflow Common AI provider</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul>\n<hr />\n<p><sup><em><span style=\"vertical-align: baseline;\">Special thanks to Jacek Iżykowski, Software Engineer on Managed Service for Apache Airflow, for authoring the original Cymbal Shops pipeline story and agent workflows featured in this post.</span></em></sup></p>\n<p><sup><em><strong style=\"vertical-align: baseline;\">Note:</strong><span style=\"vertical-align: baseline;\"> As a fictional company, any agent outputs from Cymbal Shops are shortened and illustrative, as are traffic and memory numbers.</span></em></sup></p></div>"
  "5eecf719234a232d1edaf8b6bb2912e0":
    "id": "5eecf719234a232d1edaf8b6bb2912e0"
    "title": "Frontier and Center: Why your data agents need a “wind tunnel”"
    "link": "https://cloud.google.com/blog/products/data-analytics/a-data-simulator-to-test-agents/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Imagine you're building a data agent to answer questions about an enterprise data warehouse. Ideally, you'd develop and test it against production data, but access restrictions and data sensitivity make that difficult – especially when the engineers building the agent sit outside the team that owns the data. Even with access, a live warehouse is a poor test track: Catalog descriptions are often incomplete or contradicted by institutional knowledge in docs and chat threads; there’s no verified answer key across its thousands of tables; and you can't systematically vary the complexity of the data and documents to see where the agent breaks. So teams often test on toy datasets and hope the agent holds up in production.</span></p>\n<p><span style=\"vertical-align: baseline;\">Other disciplines test differently. Automobile designers study aerodynamics by putting a scale model in a wind tunnel, which reproduces the airflow forces that matter while ignoring surface details like paint and badges. A shape that performs well in the tunnel performs well on the road because the tunnel preserves the physical properties the shape responds to.</span></p>\n<p><span style=\"vertical-align: baseline;\">Data agents need a wind tunnel too: a synthetic data estate (the databases, documents, and chat history where a company's knowledge lives) with the same structure and causal behavior as a real organization, while synthesizing every name, number, and document. It is designed to preserve what the agent reasons over: how tables relate, what business events create which records, where institutional knowledge lives, and how definitions get messy. When those properties hold, an agent's behavior in the tunnel tracks its behavior on production data, even though the two share no sensitive content.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google, we built an internal data simulator to serve as a wind tunnel for our enterprise data agents. Rather than copying proprietary schemas or cataloging every undocumented quirk in a live warehouse, an engineer starts with a short, plain-English description of organizational patterns, for example: </span><span style=\"font-style: italic; vertical-align: baseline;\">\"Simulate a two-plant brake manufacturer with an ERP, a shop-floor execution system, and a three-shift schedule where second-shift supervisors track downtime differently from operations and finance.\" </span><span style=\"vertical-align: baseline;\">From just a few sentences, the simulator invents a structurally analogous company (\"Calder Brakes\"), generating its schemas, rows, event history, documents, and chat threads alongside a benchmark of hard questions and a verified answer key.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_JHmwdEP.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1. Production data and its synthetic counterpart share causal structure without sharing sensitive content. A short description of domain patterns seeds the wind tunnel, where the agent is evaluated over read-only tools and behavioral trends carry back to production.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Why clean test databases fall short</span></h3>\n<p><span style=\"vertical-align: baseline;\">Why did we do this? Most data agents are evaluated on small, clean test databases with well-labeled tables, unambiguous metrics, and no conflicting documents. Those datasets are convenient, but they rarely test the judgment that enterprise data demands.</span></p>\n<p><span style=\"vertical-align: baseline;\">Once generated, a synthetic estate is served through a read-only interface — SQL execution, schema browsing, and document search — that any agent can call without seeing the blueprint or answer key. But consider what happens when an agent is asked either a qualitative onboarding question or a quantitative metric question from our simulated factory, \"Calder Brakes Plant 2\":</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Qualitative:</span><span style=\"vertical-align: baseline;\"> \"A new analyst is joining the team. What should they know about how 'downtime' is handled here, before they start producing reports?\"</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"font-style: italic; vertical-align: baseline;\">Quantitative:</span><span style=\"vertical-align: baseline;\"> \"How many hours of downtime did Plant 2 log in Q3?\"</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">A naive agent falls into the same trap on both questions. It searches for the most authoritative document and finds a policy memo from Bob, a second-shift supervisor, which states that downtime means unplanned stoppages only, and planned changeovers don't count. Bob is confident, articulate, and senior, so the agent summarizes his definition — and filters out planned changeovers when writing its SQL query.</span></p>\n<p><span style=\"vertical-align: baseline;\">Both answers are wrong. In fact, the plant's official metric counts changeovers as planned downtime. Bob sincerely believes his version because it flatters his shift's numbers, but weeks later the metric owner quietly corrects the record in a follow-up thread. Getting either question right requires looking past a document's tone, checking who owns the metric before writing SQL, and tracing later corrections. This is where data agents often fail in production.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How the simulator builds a trusted benchmark</span></h3>\n<p><span style=\"vertical-align: baseline;\">A synthetic estate is only useful for evaluation if its answer key is accurate and reproducible. Our simulator achieves this by separating simulated company’s design from data generation across four stages (Figure 2).</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_pMgxVcc.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2. One pipeline, one source of truth. In the estate-generation pipeline, only ① Compile blueprint invents facts and ③ Render documents phrases those fixed facts as prose (blue boxes); ② Simulate &amp; build tables (plus SQL answer computation) runs deterministically from the frozen blueprint and seed, before ④ Evaluate agent tests the agent over read-only tools.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">First, the </span><strong style=\"vertical-align: baseline;\">Compile blueprint</strong><span style=\"vertical-align: baseline;\"> stage uses a language model to turn the pattern prompt into a frozen blueprint specifying the company's systems, people, metrics, and individual beliefs. Those beliefs can be mistaken on purpose — Bob's flawed definition of downtime is recorded alongside the official metric, planting the trap and its solution together.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the estate-generation pipeline, </span><strong style=\"vertical-align: baseline;\">Compile blueprint</strong><span style=\"vertical-align: baseline;\"> is the only point where a language model decides what is true. Once the blueprint is frozen, </span><strong style=\"vertical-align: baseline;\">Simulate &amp; build tables</strong><span style=\"vertical-align: baseline;\"> runs deterministically without a model: employees act on their schedules, triggering tickets, shift handovers, and database rows, so that every record traces back to the event that created it. Organizational messiness emerges naturally from this timeline, such as outdated procedures or conflicting definitions, while row-level flaws that model real ingestion glitches (e.g., retry-storm duplicate rows, unmerged keys, or a mid-quarter unit change) are injected into the tables. Every flaw is recorded in a machine-readable messiness log so the benchmark generator can adjust the ground-truth SQL queries to account for the messy tables.</span></p>\n<p><span style=\"vertical-align: baseline;\">Given the same blueprint and random seed, the simulator produces identical tables and an identical SQL answer key on every run. The only subsequent step in building the estate that calls a model is </span><strong style=\"vertical-align: baseline;\">Render documents</strong><span style=\"vertical-align: baseline;\">, which turns the facts fixed in the blueprint into memos and chat threads in each person's writing style. Finally, </span><strong style=\"vertical-align: baseline;\">Evaluate agent</strong><span style=\"vertical-align: baseline;\"> tests the agent over read-only tools.</span></p>\n<p><span style=\"vertical-align: baseline;\">Three build-time checks keep the benchmark honest:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Computed SQL and rubric gold answers:</strong><span style=\"vertical-align: baseline;\"> Every quantitative question ships with the SQL query that computes its expected (\"gold\") answer against the messy tables. Because the messiness log records injected retry duplicates on defect rows, the benchmark generator automatically pairs a defect-count question with the deduplicating </span><code style=\"vertical-align: baseline;\">COUNT(DISTINCT)</code><span style=\"vertical-align: baseline;\"> query (</span><code style=\"vertical-align: baseline;\">240</code><span style=\"vertical-align: baseline;\">) – and runs decoy SQL queries representing common mistakes (like an un-deduplicated </span><code style=\"vertical-align: baseline;\">COUNT(*)</code><span style=\"vertical-align: baseline;\"> or Bob's changeover filter) to verify that falling for a trap yields a different number. Qualitative questions ship with a rubric grounded in the blueprint's metric owner, official definition, and correction trail. If the estate lacks the data to verify a question, the generator drops the item rather than shipping an unverified question.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Verified documents:</strong><span style=\"vertical-align: baseline;\"> Every rendered memo and chat thread is checked against the blueprint to confirm it states its assigned facts without introducing unrecorded numbers, dates, or names.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hallucination sentinels:</strong><span style=\"vertical-align: baseline;\"> The simulator plants questions about invented metrics like \"Basalt Velocity Ratio\" that appear nowhere in the estate; a reliable agent abstains and reports that no such metric exists.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Testing for behavioral trends and realism</span></h3>\n<p><span style=\"vertical-align: baseline;\">A wind tunnel does not need to match the exact score an agent gets on production data; it needs to reproduce the same behavioral trends: </span><strong style=\"vertical-align: baseline;\">direction</strong><span style=\"vertical-align: baseline;\"> (if longer reasoning chains lower accuracy on real data, they should lower accuracy in the tunnel) and </span><strong style=\"vertical-align: baseline;\">rate </strong><span style=\"vertical-align: baseline;\">(accuracy should degrade at the similar pace as contradictions accumulate). When those trends hold, you can confidently compare agent versions and dial up complexity step by step to find where reasoning breaks down.</span></p>\n<p><span style=\"vertical-align: baseline;\">We test how closely our simulated estates match reality — and whether evaluation signals carry over — at three levels:</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Statistical properties</strong><span style=\"vertical-align: baseline;\">: Every build produces a realism report measuring structural properties that affect SQL generation and joins — including row multiplication across table joins (join fan-out), key skew, null and duplicate rates, event durations, and day-of-week activity curves — alongside numeric distribution checks such as leading-digit frequencies (Benford's law).</span></li>\n<li><strong style=\"vertical-align: baseline;\">Domain expert review: </strong><span style=\"vertical-align: baseline;\">In early engagements with enterprise partners, we built synthetic estates modeled on their domains and had their analysts query the data to judge whether it behaved like their own systems.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Independent calibration and carry-over checks</strong><span style=\"vertical-align: baseline;\">: We run the simulator's output through an independent calibration suite of more than a hundred checks covering statistical realism and answer-key SQL verification. In our internal evaluations, capability upgrades — such as switching an agent to a deeper reasoning mode or improving how it handles context — move accuracy in the same direction and rank agent configurations in the same order on both synthetic estates and human-authored benchmarks. Broader multi-agent studies across paired real and synthetic customer estates are now underway.</span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">How our approach builds on prior work</span></h3>\n<p><span style=\"vertical-align: baseline;\">Our simulator builds on two research threads. In database question answering, benchmarks like </span><a href=\"https://bird-bench.github.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BIRD</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://spider2-sql.github.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spider 2.0</span></a><span style=\"vertical-align: baseline;\"> have moved from clean schemas to messy databases, while agent environments like </span><a href=\"https://webarena.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">WebArena</span></a><span style=\"vertical-align: baseline;\">, tool-use benchmarks like </span><a href=\"https://arxiv.org/abs/2406.12045\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">τ-bench</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://arxiv.org/abs/2304.03442\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Generative Agents</span></a><span style=\"vertical-align: baseline;\"> simulate websites or use language models to role-play human users. In contrast, our simulator's employees follow deterministic rules tied to their roles and schedules, so a single seed replays the exact same organizational history every time.</span></p>\n<p><span style=\"vertical-align: baseline;\">We also adapt an intuition from </span><a href=\"https://arxiv.org/abs/1703.06907\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">domain randomization</span></a><span style=\"vertical-align: baseline;\"> in robotics, where simulations vary surface details like lighting and textures during training while keeping the underlying physics faithful. Applied to data agent evaluation, that means synthesizing every surface name, number, and document from a short pattern description, while keeping the causal structure, cross-document links, and institutional messiness faithful to enterprise reality.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Hardening agents without customer data</span></h3>\n<p><span style=\"vertical-align: baseline;\">Generating a test estate on demand removes a bottleneck between enterprises that own sensitive data, and the engineering teams building data agents for them. Traditionally, developing and benchmarking an enterprise agent required access to production tables and a hand-labeled question set — the two assets hardest to share across organizational or compliance boundaries. We use this wind tunnel internally to stress-test and harden Google Cloud's data agents against realistic enterprise messiness without touching customer data, and the same blueprint-first architecture can be applied by any engineering team building evaluation suites for their own agents.</span></p>\n<p><span style=\"vertical-align: baseline;\">Synthetic evaluation still carries two risks: </span><strong style=\"vertical-align: baseline;\">overfitting</strong><span style=\"vertical-align: baseline;\"> to the simulator's patterns of messiness, and </span><strong style=\"vertical-align: baseline;\">drift</strong><span style=\"vertical-align: baseline;\"> as a live business evolves away from its blueprint. The discipline required is the same one that wind-tunnel engineers practice: Periodically calibrate the tunnel against real-world runs, keep benchmark difficulty aligned with production failure modes, and treat the simulation as a living model. Your agents — and their users — will thank you. </span></p></div>"
  "d3765113f3cf709a56cc95bac42bdb99":
    "id": "d3765113f3cf709a56cc95bac42bdb99"
    "title": "DynaPORT modernization on Google Cloud with AlloyDB for PostgreSQL and GKE"
    "link": "https://cloud.google.com/blog/products/databases/dynaport-modernizes-with-alloydb/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">In global maritime logistics, Marine Ports and Terminals play a significant role in the movement of container and cargo, within and beyond. Marine ports and terminals world-wide use a Terminal Operating System (TOS) which acts as the central nervous system managing port operations 24 hours a day, 365 days a year. A modern TOS plans, automates and orchestrates every physical and digital activities, resources and events across Order-to-Invoice processes of a marine terminal. </span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Developed by </span><a href=\"https://www.tcs.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Tata Consultancy Services</span></a><span style=\"vertical-align: baseline;\"> (TCS), DynaPORT is a field-proven next-generation Terminal Operating System that provides a single, integrated operating backbone for multimodal and multipurpose terminals. It orchestrates the complete order-to-invoice lifecycle across vessel, rail, truck, and barge operations, while supporting containers, general cargo, dry and liquid bulk, break-bulk, and roll-on/roll-off cargo. By automating end-to-end terminal workflows, DynaPORT delivers real-time operational visibility into operations while optimizing assets and resources to drive improvement of key business performance indicators.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">One of India’s largest commercial port developers and operators has relied on DynaPORT for more than two decades across its cargo terminals, supporting the management of bulk, break-bulk, and liquid cargo. To modernize the platform’s architecture, TCS partnered with the customer to achieve a landmark milestone: migrating DynaPORT to a modern, cloud-based architecture.</span></p>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The Port Operator &amp; TCS partnered with Google Cloud to execute an ambitious cloud modernization journey. Modeled after the architectural principles of high-velocity Google Cloud enterprise transformations—this case study details the systematic deconstruction of legacy technical debt, the strategic rationale and enterprise differentiators of choosing AlloyDB for PostgreSQL, the target Google Kubernetes Engine (GKE) and AlloyDB cloud-native architecture, the heterogeneous migration of over </span><strong style=\"vertical-align: baseline;\">1.2 million lines of code</strong><span style=\"vertical-align: baseline;\"> using Google Cloud Database Migration Service (DMS).</span></p>\n<h3><span style=\"vertical-align: baseline;\">1. The Legacy Technical Debt: Deconstructing the Monolith</span></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Enterprise logistics platforms that evolve over decades inevitably accumulate architectural debt, particularly through tightly coupled components. DynaPORT Cargo followed this pattern: successive releases and architectural transitions gradually transformed the platform into a classic multi-tier monolith, with its components carrying significant technical debt.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"DynaportAlloyDB-Blog1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DynaportAlloyDB-Blog1.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">The Procedural Stored-Procedure</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Over years of optimization for sub-millisecond on-premises database round-trips, fundamental business logic had been progressively migrated out of the application tier and embedded directly into the database engine. In the DynaPORT Cargo module alone, the core schema contained:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">2,760 Tables and 555 Sequences</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">262 Packages containing over 1.2 million lines of code</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">54 Stored Procedures, 53 Functions, and 63 Database Triggers</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Cross-schema User-Defined Types (UDTs) </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Critical business operations—such as multi-tiered marine invoice tariff calculations, dynamic slab rating, berth allocation planning, yard truck assignments, and autonomous error logging—were entirely governed by complex, multi-thousand-line PL/SQL procedures. The database was no longer merely a relational persistence store; it was the primary execution engine of the enterprise.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Monolithic JEE Middleware and Packaging</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The application tier was hosted on monolithic WebLogic and WildFly application servers running on static on-premises virtual machines. The application relied on legacy Java Enterprise features, including Enterprise JavaBeans (EJBs), custom Object-Relational Mapping (ORM) dialects, and heavy configuration state. Modules including Revenue Management, Berth Planning, Gate Operations, and Reporting shared common JVM heaps across application servers. A performance spike in batch invoice generation could starve memory from real-time Handheld Terminals (HHT) used by container crane operators on the quayside.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Absence of Modern Automation and Fragile Release Cycles</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Because business logic was fragmented across Java application binaries and raw database packages, continuous delivery was practically non-existent:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Manual Deployment Runbooks</strong><span style=\"vertical-align: baseline;\">: Releases required multi-hour maintenance windows involving manual execution of sequential SQL scripts, package recompilations, and server restarts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">High Regression Risk</strong><span style=\"vertical-align: baseline;\">: In the legacy schema with 262 interdependent packages, modifying a single package specification frequently invalidated dozens of dependent functions, views, and synonyms, triggering cascading runtime failures.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><strong style=\"vertical-align: baseline;\">Environment Drift</strong><span style=\"vertical-align: baseline;\">: Development, testing, and production environments suffered from configuration divergence, requiring lengthy manual reconciliation before any production cutover.</span></p>\n</li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">Commercial Licensing Penalties and Vertical Limits</span></h4>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Licensing fees scaled linearly with physical CPU core counts, penalizing the business whenever hardware was scaled to accommodate peak cargo vessel traffic. Furthermore, high-availability setups required complex shared storage arrays, specialized interconnects, and heavy administrative overhead from dedicated database administrators (DBAs).</span></p>\n<h3><span style=\"vertical-align: baseline;\">2. Strategic Evaluation: Why Google Cloud and AlloyDB for PostgreSQL?</span></h3>\n<p><span style=\"vertical-align: baseline;\">When architecting the cloud transformation, the joint architecture teams from the customer, TCS, and Google Cloud evaluated two fundamentally different modernization strategies:<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Evaluation Dimension</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Strategy A: Database-Agnostic Migration</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Strategy B: Modernization using AlloyDB</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Architectural Focus</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Extract all business logic from the database tier and rewrite it into Java application-tier services (HQL / Spring Data).</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Retain optimized procedural logic in the database tier, converting to PostgreSQL PL/pgSQL on AlloyDB.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Application Impact</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Massive. Complete rewrite of thousands of data access objects, ORM mappings, and transaction boundaries.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Moderate. Focused remediation of syntax, metadata, and database dialect differences; application remains stable.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Estimated Effort</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multiple person-years; prohibitive time-to-market.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Target delivery achievable in agile sprints; low operational disruption.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Performance Profile</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Network latency amplification due to multiple network hops for complex set operations previously run in-database.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Native in-engine execution with sub-millisecond response times, backed by AlloyDB’s accelerated storage and compute engine.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Strategic Recommendation</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Rejected due to timeline risks and massive business disruption.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Selected as the winning enterprise target path.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">3. The Modernized Architecture: AlloyDB + GKE Based Architecture</span></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The target cloud architecture was designed according to the </span><a href=\"https://docs.cloud.google.com/architecture/framework/reliability#core_principles\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Architecture Framework</span></a><span style=\"vertical-align: baseline;\">, transforming the monolithic JEE middleware into modern containerized microservices orchestrated on </span><a href=\"https://cloud.google.com/kubernetes-engine\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine (GKE)</strong></a><span style=\"vertical-align: baseline;\">, coupled with an enterprise </span><a href=\"https://cloud.google.com/products/alloydb\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</strong></a><span style=\"vertical-align: baseline;\"> cluster.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"DynaportAlloyDB-Blog2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DynaportAlloyDB-Blog2.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">4. Migration Execution &amp; Code Remediation</span></h3>\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">The cornerstone of the migration was converting over 1.2 million lines of deeply intertwined Oracle PL/SQL procedural logic into PostgreSQL PL/pgSQL. The team utilized Google Cloud </span><a href=\"https://cloud.google.com/database-migration?e=48754805\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Database Migration Service (DMS)</strong></a><span style=\"vertical-align: baseline;\"> with its built-in </span><strong style=\"vertical-align: baseline;\">Conversion Workspaces</strong><span style=\"vertical-align: baseline;\"> and Gemini-assisted AI code refactoring to accelerate bulk transformations.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"DynaportAlloyDB-Blog3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/DynaportAlloyDB-Blog3.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">While DMS automatically converted the majority of standard DDL constructs, functions, and queries, the remaining (~15%) involved complex Oracle proprietary idioms that required targeted engineering remediation. Couple of examples of the manual intervention.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Technical Pattern &amp; Remediation</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Legacy PL/SQL Mechanism</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Modernized AlloyDB PL/pgSQL Equivalent</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Architectural Remediation &amp; Runtime Impact</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Dynamic Array Allocation</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">TYPE_L.EXTEND;</span></p>\n<p><span style=\"vertical-align: baseline;\">TYPE_L(TYPE_L.COUNT) := rec;</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">TYPE_L := array_append(TYPE_L, rec); or TYPE_L[cardinality(TYPE_L)+1] := rec;</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Replaced unsupported .EXTEND method on nested tables with native PostgreSQL array concatenation and dynamic index expansion.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Deterministic Row Generation</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SELECT ROWNUM FROM PTY_IM WHERE ROWNUM &lt;= N;</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">SELECT s.idx FROM generate_series(1, N) AS s(idx);</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Eliminated physical dummy table hacks (PTY_IM) in favor of in-memory, set-returning generator functions with zero disk I/O.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><span style=\"vertical-align: baseline;\">5. Business Outcomes &amp; The Future of Smart Ports</span></h3>\n<p><span style=\"vertical-align: baseline;\">In April 2026, the modernized DynaPORT platform on Google Cloud went live in production at one of the newest ports in India, achieving a seamless, low downtime cutover. By Aug’26, 3 more terminals have gone live on this.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Quantifiable Operational and Financial Impact</span></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Impact Dimension</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Legacy On-Premises Stack</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Modernized Google Cloud &amp; AlloyDB Stack</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Database Performance</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Variable query latency during batch spikes; table bloat requiring manual DBA reindexing.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Upto 2x transactional throughput, sub-second read query responses, automated ML vacuuming and memory optimization.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">High Availability &amp; Failover</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Complex SAN failover; multi-minute outages during planned database maintenance.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Sub-second automatic failover, 99.99% availability SLA inclusive of maintenance, zero transaction loss.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Deployment Agility</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Multi-week release cycles; high-risk manual database patching; frequent regression issues.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Containerized rolling updates on GKE and non-blocking transactional DDL deployments in AlloyDB.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Total Cost of Ownership (TCO)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Punitive per-core enterprise licenses; high on-prem hardware and maintenance overhead.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">About 50% reduction in database TCO; completely open-source compatible with transparent, predictable cloud pricing.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Scalability</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Rigid vertical hardware limits; slow hardware procurement cycles.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Instantaneous horizontal elasticity across GKE container pods and AlloyDB read pools.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h4><span style=\"vertical-align: baseline;\">Conclusion: Key Lessons for Enterprise Modernization</span></h4>\n<p><span style=\"vertical-align: baseline;\">The successful cloud migration of DynaPORT yields three fundamental architectural lessons for enterprise IT leaders:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Do Not Throw Away Proven Intellectual Property</strong><span style=\"vertical-align: baseline;\">: Fully rewriting mission-critical procedural logic into application code is often a high-risk anti-pattern. Migrating from Oracle PL/SQL to open PL/pgSQL on an accelerated engine like AlloyDB preserves decades of tested business rules while modernizing the infrastructure platform.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Select Database Engines Built for Cloud Realities</strong><span style=\"vertical-align: baseline;\">: Standard open-source relational engines often struggle with extreme enterprise throughput without extensive tuning. AlloyDB’s disaggregated storage architecture, columnar acceleration, and built-in ML intelligence provide the enterprise muscle needed to replace legacy commercial database engines.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Containerize Application Workloads on GKE</strong><span style=\"vertical-align: baseline;\">: Decoupling the application tier into independently scalable container pods on Google Kubernetes Engine provides the elasticity and resilience necessary to absorb rapid operational surges without affecting core database stability.</span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Ready to modernize your legacy enterprise applications?</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Schedule a Google Cloud Architecture Blueprint Workshop with your </span><a href=\"https://cloud.google.com/contact/form\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Account Field</span></a><span style=\"vertical-align: baseline;\"> team today. We will engage as an important stakeholder to evaluate your current legacy setup and help design a low-risk, high-performance migration pathway using Google Cloud services like AlloyDB and Google Kubernetes Engine.</span></p></div>"
  "21e557f9f3963722dc2355db0cceb3dc":
    "id": "21e557f9f3963722dc2355db0cceb3dc"
    "title": "What’s new in Managed Service for Apache Spark 4.0"
    "link": "https://cloud.google.com/blog/products/data-analytics/whats-new-in-managed-service-for-apache-spark-4-0/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As organizations move from reactive analytics to proactive systems of action powered by autonomous AI agents, data platforms face a new set of demands. Moving from human scale to agent scale changes both how data pipelines run and how they are built: Teams and AI agents now use Model Context Protocol (MCP) tools and agentic troubleshooting to build, submit, and diagnose Apache Spark pipelines while preparing multimodal datasets, performing feature engineering, and acting on live business signals around the clock. Over the past year, customer use of </span><a href=\"https://cloud.google.com/products/managed-service-for-apache-spark\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Service for Apache Spark</span></a><span style=\"vertical-align: baseline;\"> in serverless deployments has nearly doubled, with millions of jobs running each month as enterprises build on Google’s </span><a href=\"https://cloud.google.com/data-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Agentic Data Cloud</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">In the Agentic Data Cloud, Apache Spark doesn't operate in isolation. Managed Service for Apache Spark runs on Google Cloud's borderless lakehouse, so Apache Spark and BigQuery can read and write the same tables with high performance. Through Knowledge Catalog, both engines share centralized governance, consistent policies, detailed lineage, and semantic discovery for AI agents. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we are announcing the general availability of Managed Service for Apache Spark 4.0, debuting a next-generation runtime foundation for serverless and managed cluster deployments. Engineered to power both modern enterprise data pipelines and fast-growing agentic workloads, Managed Service for Apache Spark 4.0 introduces:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A new 4.0 runtime with Apache Spark 4.2:</strong><span style=\"vertical-align: baseline;\"> Standardized on Apache Spark 4.2, Java 25, Python 3.13 with Pixi, and Apache Iceberg 1.12, it is now available for both serverless and managed clusters.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">A redesigned, code-first Google Cloud console and agentic troubleshooting:</strong><span style=\"vertical-align: baseline;\"> Onboard quickly with a new Overview page featuring a samples gallery, Lakehouse public datasets, and one-click VS Code authoring in Cloud Shell, manage all serverless and cluster workloads from a unified Jobs view, and use an AI agent to automatically diagnose job failures.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Third-party IDE integration with the Data Agent Kit:</strong><span style=\"vertical-align: baseline;\"> Configure MCP servers, skills, and API access to build and run Apache Spark pipelines directly from VS Code, Claude Code, and Antigravity.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Faster startups and Lightning Engine acceleration:</strong><span style=\"vertical-align: baseline;\"> Run on default Gen4 infrastructure with faster startups at no additional cost, and accelerate workloads with Lightning Engine for up to 3.25x the price-performance over the leading high-speed Apache Spark alternative.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified DCU quotas and Lakehouse runtime catalog attachment:</strong><span style=\"vertical-align: baseline;\"> Improve capacity obtainability with serverless infrastructure fungibility and Data Compute Unit (DCU) quotas, while attaching every workload automatically to the </span><a href=\"https://cloud.google.com/products/lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse runtime catalog</span></a><span style=\"vertical-align: baseline;\"> instead of a legacy Hive Metastore.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">A new 4.0 runtime with Apache Spark 4.2</strong></h4>\n<p><span style=\"vertical-align: baseline;\">This new runtime packages Apache Spark 4.2 (including Spark Declarative Pipelines and Real-Time Mode), Java 25, Scala 2.13, Apache Iceberg 1.12, Delta Lake 4.4, and Python 3.13 with Pixi for faster dependency management.</span></p>\n<p><span style=\"vertical-align: baseline;\">Managed Spark serverless and cluster workloads now run on the same modern stack whether written by a data engineer or generated by data engineering and data science skills in Gemini, Claude, and other large language models (LLMs). Teams can standardize on one set of component versions and move PySpark, Scala, and Spark SQL workloads between serverless and managed clusters.</span></p>\n<h4><strong style=\"vertical-align: baseline;\">A code-first console with agentic troubleshooting</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Data teams should spend their time writing Spark logic rather than configuring infrastructure, hunting for the right job, or digging through driver and executor logs when something fails. Version 4.0 ships alongside a redesigned, code-first Google Cloud console built to take that operational work off their plate.</span></p>\n<p><span style=\"vertical-align: baseline;\">The refreshed console streamlines every stage of the Apache Spark lifecycle:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Frictionless onboarding and one-click authoring:</strong><span style=\"vertical-align: baseline;\"> A redesigned Overview page helps developers get started immediately with an integrated samples gallery, pre-loaded Lakehouse public datasets, guided demos, and one-click authoring in VS Code through Cloud Shell.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Optimized defaults and reusable runtime profiles:</strong><span style=\"vertical-align: baseline;\"> Out-of-the-box performance defaults simplify job submission and cluster creation. With reusable runtime profiles (in preview) for batch and interactive workloads, platform admins can capture governed hardware, network, and autoscaling baselines once so developers can simply select a profile and run code.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Unified job, session, and fleet management:</strong><span style=\"vertical-align: baseline;\"> Engineers can submit and monitor batch jobs, interactive serverless sessions, and managed clusters from a single unified listing, backed by streamlined fleet management and redesigned detail views that surface key performance metrics and logs in one place.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Agentic troubleshooting:</strong><span style=\"vertical-align: baseline;\"> When a job fails or slows down, an AI agent analyzes logs, metrics, and query plans within existing IAM permissions to identify the likely root cause and recommend a fix, helping engineers quickly return a failed job to a healthy state.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Image 1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Image_1.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Image 1: Gemini Cloud Assist investigates a failed Apache Spark job, forms a hypothesis, and points to the likely root cause without leaving the job page.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Image 2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Image_2_2UeXeim.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Image 2: One Jobs page for every Apache Spark workload across serverless and managed clusters, with tier and runtime version at a glance.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Build and run Apache Spark from your IDE with the Data Agent Kit</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Many data engineers and data scientists would rather never leave their editor. With the </span><a href=\"https://docs.cloud.google.com/data-cloud-extension\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\">, they can build and run Apache Spark workloads from VS Code, Antigravity, Claude Code, and other agentic IDEs. Setup takes a few clicks: pick Apache Spark and the other services you use, and the kit configures Model Context Protocol (MCP) servers, agent skills, and API access for each one. From there, AI agents can generate, tune, and test Apache Spark pipelines on Managed Service for Apache Spark 4.0 without leaving the IDE.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Image 3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Image_3_jJ1IB7Z.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Image 3: In VS Code, the Data Agent Kit sets up MCP servers, skills, and API access for Apache Spark and other services.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Faster startups and Lightning Engine acceleration</strong></h4>\n<p><span style=\"vertical-align: baseline;\">As practitioners and AI agents trigger short-running, ephemeral jobs on demand to prepare data, perform feature engineering, and answer ad-hoc queries, low startup latency and predictable price-performance are essential to avoiding a cost spiral. In Managed Service for Apache Spark 4.0, our performance-optimized serverless experience removes manual infrastructure tuning through three changes:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Faster startups at no additional cost:</strong><span style=\"vertical-align: baseline;\"> On the serverless Premium tier, runtime and control-plane optimizations in version 4.0 deliver faster startup times than previous runtime versions across interactive sessions and short-running batch workloads at no additional cost.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hardware acceleration by default:</strong><span style=\"vertical-align: baseline;\"> New serverless 4.0 workloads run on the Premium tier by default, using Google Cloud's latest-generation </span><a href=\"https://cloud.google.com/compute/docs/general-purpose-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gen4 VM instances</span></a><span style=\"vertical-align: baseline;\"> and Hyperdisk storage. Teams get our highest-efficiency compute and storage fleet without picking machine types or configuring disks, while aligning infrastructure tiering directly with workload urgency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Software acceleration with Lightning Engine:</strong><span style=\"vertical-align: baseline;\"> Our native C++ vectorized execution engine,</span><a href=\"https://docs.cloud.google.com/managed-spark/docs/guides/lightning-engine\"><span style=\"text-decoration: underline; vertical-align: baseline;\"> Lightning Engine</span></a><span style=\"vertical-align: baseline;\">, is available in the 4.0 runtime and delivers up to 3.25x the price-performance over the leading high-speed Apache Spark alternative, along with up to 4.9x faster performance compared to running open-source Apache Spark with zero code changes. Built on Apache Gluten and Velox with Google-specific optimizations, Lightning Engine compiles Apache Spark DataFrame, Dataset, and Spark SQL query plans into native SIMD instructions. For lakehouse storage, built-in intelligent caching accelerates file scan times on Apache Iceberg tables by up to 50%. Separately, for workloads querying BigQuery, Lightning Engine's native reader uses Apache Arrow streams to accelerate BigQuery reads by up to 40% compared to default BigQuery reads in Managed Service for Apache Spark. In the 4.0 runtime, Lightning Engine expands support to ARM processors, Ubuntu images, and native vectorized readers for Apache ORC and CSV alongside Apache Parquet, Apache Iceberg, and Delta Lake.</span></p>\n</li>\n</ul>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">\"We were facing not only processing challenges, we were facing management overhead across thousands of servers in our ecosystem, so we migrated to serverless Managed Service for Apache Spark. We moved from managing infrastructure to a no-ops infrastructure. Not only did it help us overcome maintenance and cluster management challenges, it helped us optimize our costs at scale to meet our business SLAs. Apache Spark is no longer just compute for us; it is a strategic business accelerator.\"<br /></span><strong style=\"font-style: italic; vertical-align: baseline;\">—Saurabh Kumar, Senior Director of Data Engineering, Lowe's.</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">Advanced capacity management and obtainability</strong></h4>\n<p><span style=\"vertical-align: baseline;\">When autonomous agents and production pipelines run around the clock, tying a workload to a single machine shape or zone can stall downstream decisions when regional demand spikes. Without dedicated reservations, cloud service providers may not always have available capacity during peak demand. We are introducing infrastructure fungibility for serverless deployments to improve resource availability for all customers:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Serverless infrastructure fungibility and fallback:</strong><span style=\"vertical-align: baseline;\"> Serverless 4.0 workloads are no longer tied to one VM instance family, disk type, or zone. The platform selects from several latest-generation VM instance families and disk types across zones in the region. If the preferred infrastructure is constrained during a local demand peak, the service automatically chooses the best available infrastructure in the same region instead of failing the job. Once capacity returns, workloads go back to the default Gen4 VM instances and Hyperdisk infrastructure.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Data Compute Unit (DCU) quotas:</strong><span style=\"vertical-align: baseline;\"> Quotas for serverless deployments are now set in DCUs rather than per machine family. Because the platform selects the VM instance family, admins manage one unified DCU quota instead of separate CPU quotas for each machine type.</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">Lakehouse runtime catalog attachment by default</strong></h4>\n<p><span style=\"vertical-align: baseline;\">A borderless lakehouse breaks down walled gardens by connecting operational, analytical, and cross-cloud data in open formats without moving it. In Managed Service for Apache Spark 4.0, Apache Iceberg ships directly in the runtime image, and every workload automatically has access to the serverless </span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse runtime catalog</span></a><span style=\"vertical-align: baseline;\">. Teams no longer have to configure a lakehouse metastore with Apache Spark or complete prerequisites such as setting up Google Cloud Storage (GCS) directories beforehand, so they can focus straight on writing business logic. Version 4.0 also eliminates the need for GCS staging buckets and uses end-user credentials by default.</span></p>\n<p><span style=\"vertical-align: baseline;\">Through the Lakehouse runtime catalog, Managed Service for Apache Spark, BigQuery, and AlloyDB can directly read and write the same Apache Iceberg tables on GCS without ETL pipelines or data copies. Everything registered in the Lakehouse runtime catalog automatically surfaces in </span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\">, which enriches metadata and business context so AI agents and Gemini can query and reason over tables curated with Apache Spark with high accuracy, governed access controls, and lower token costs.</span></p>\n<p><span style=\"vertical-align: baseline;\">To see how these capabilities come together across end-to-end architectures, read our </span><a href=\"https://services.google.com/fh/files/misc/google_cloud_apache_spark_whitepaper.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Apache Spark in the Agentic Era whitepaper</span></a><span style=\"vertical-align: baseline;\">. The whitepaper walks through practical design patterns for multimodal data preparation, large-scale feature engineering, and connecting AI agents to governed Apache Iceberg tables through MCP tools and Knowledge Catalog.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">Managed Service for Apache Spark 4.0 is available for serverless and managed cluster deployments across all Managed Service for Apache Spark regions. The fastest way to try version 4.0 is the </span><a href=\"https://docs.cloud.google.com/data-cloud-extension\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\">: install it in VS Code, Claude Code, or Antigravity to build and run Apache Spark workloads on version 4.0 with AI agents right from your IDE. You can also start from the new Overview page in the </span><a href=\"https://console.cloud.google.com/dataproc\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud console</span></a><span style=\"vertical-align: baseline;\">, which walks you from code to a running job.</span></p>\n<p><span style=\"vertical-align: baseline;\">To learn more, read the Managed Service for Apache Spark 4.0 documentation for </span><a href=\"https://docs.cloud.google.com/managed-spark/docs/concepts/versions/spark-runtime-4.0\"><span style=\"text-decoration: underline; vertical-align: baseline;\">serverless deployments and managed clusters</span></a><span style=\"vertical-align: baseline;\">, and try the hands-on </span><a href=\"https://codelabs.developers.google.com/codelabs/lightning-engine#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lightning Engine codelab</span></a><span style=\"vertical-align: baseline;\">.</span><span style=\"vertical-align: baseline;\"> </span></p></div>"
  "374115c4e755cc005d098a4a65bad153":
    "id": "374115c4e755cc005d098a4a65bad153"
    "title": "How Spanner Graph detects ads fraud and abuse at Google at multi-billion node scale"
    "link": "https://cloud.google.com/blog/products/databases/how-spanner-graph-detects-google-ads-fraud-and-abuse/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Ever wonder how the Google Ads team keeps the massive system stable and online, despite continuous attempts by hackers to take it down? Part of the answer is using </span><a href=\"https://docs.cloud.google.com/spanner/docs/graph/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\"> as its core operational and graph database. </span></p>\n<p><span style=\"vertical-align: baseline;\">The Google Ads team uses a central graph-based platform to fight fraud and abuse with batch and real-time signals. Built to protect the Google Ads ecosystem and now used by multiple teams across Google, the platform organizes anti-abuse intelligence into a single, interconnected view. Its core mission is simple but critical: uncover hidden connections between malicious assets in real time before they can harm users or advertisers. This blog talks about the challenging modern fraud and abuse landscape, and how Spanner, specifically Spanner Graph, helps Google successfully detect those threats.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">The rising cost and sophistication of modern fraud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The need for a graph-based abuse detection platform stems from how the global threat landscape has evolved. Digital advertising fraud and online scams are no longer minor operational nuisances, they are a massive drain on the global economy. According to the</span><span style=\"vertical-align: baseline;\"> </span><a href=\"https://blog.google/innovation-and-ai/technology/safety-security/fraud-scams-advisory-june-2026/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NASDAQ Global Financial Crime Report</span></a><span style=\"vertical-align: baseline;\">, total global fraud losses are estimated at nearly $580 billion for 2025. Furthermore, global surveys indicate that approximately one in five adults fall victim to scams. In digital ads</span><span style=\"vertical-align: baseline;\">,</span><span style=\"vertical-align: baseline;\"> fraud and abuse waste marketing spend, corrupt attribution data, and expose everyday users to financial scams, identity theft, and malware.</span></p>\n<p><span style=\"vertical-align: baseline;\">Bad actors are increasingly leveraging automation and AI to scale deceptive campaigns more efficiently. In 2025 alone, </span><a href=\"https://blog.google/products/ads-commerce/2025-ads-safety-report/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google blocked or removed</span></a><span style=\"vertical-align: baseline;\"> more than 8.3 billion policy-violating ads and suspended 24.9 million advertiser accounts. As these tactics evolve, real-time detection becomes more important for protecting businesses and users.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why stopping modern abuse is so complex</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Defending applications from fraud and abuse requires continuously advancing threat detection beyond traditional, point-in-time checks. To do that, modern security systems must address two compounding challenges simultaneously:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fraud and abuse operate as networks:</strong><span style=\"vertical-align: baseline;\"> Bad actors hide behind residential proxies and synthetic identities to create deceptive ad campaigns. Each of the attributes like location proxies, account, and identity parameters  appear benign in isolation. But behind the scenes, bad actors share payment methods, domains, and accounts, requiring security systems to target entire coordinated clusters of fraud rather than isolated indicators. This is hard to capture with traditional approaches that do not understand the relationship between attributes and evaluates each signal separately.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Detection must scale dynamically:</strong><span style=\"vertical-align: baseline;\"> As the graph-based abuse detection platform grew, the previous system, based on offline MapReduce batch processing, became bottlenecked. Tracing multi-hop relationships in batch MapReduce required repeated, expensive joins across distributed stages, triggering massive intermediate data expansions, heavy shuffle overhead, and network bottlenecks that caused hours-long latencies and combinatorial fanouts during multi-hop traversals.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">In critical scenarios like halting live malware campaigns, multi-hour latency gaps leave room for a lot of damage. To block sophisticated fraud rings, Google needed to evaluate multi-hop relationship risks in real time at the time of serving these ads, before malicious content reaches users.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Why Spanner Graph</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To overcome the limits of processing at inference time, the engineering team needed a database that could ingest live signals from a large number of sources via pub/sub streams, all while delivering horizontal elasticity, global transactional consistency, and sub-second multi-hop traversals. The solution was to modernize Google's graph-based abuse detection platform for Ads onto </span><a href=\"https://docs.cloud.google.com/spanner/docs/graph/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Graph</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Because Ads’ core transactional and entity data already lived in Spanner, they didn’t need to migrate any data in order to adopt Spanner Graph. Rather than standing up a separate, specialized graph database, the team simply defined property graphs directly on top of their existing relational tables.</span></p>\n<p><span style=\"vertical-align: baseline;\">This delivered several benefits:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">From hour-long batch jobs to sub-second queries:</strong><span style=\"vertical-align: baseline;\"> Spanner Graph co-locates graph traversal computations directly with the underlying distributed data splits to minimize join overhead. Multi-hop traversals that previously took an hour in offline Apache Flume MapReduce jobs now execute on live production data with sub-second to single-digit millisecond latency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero-ETL adoption in weeks, not months:</strong><span style=\"vertical-align: baseline;\"> Because there was no data to move, most graph-based abuse detection use cases transitioned to Spanner Graph within weeks. Layering a graph directly onto existing Spanner tables eliminated fragile synchronization pipelines and redundant storage costs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Expressive pattern matching with native ISO GQL:</strong><span style=\"vertical-align: baseline;\"> Instead of writing and maintaining complex custom traversal code, engineers now query the exact same tables using standard ISO Graph Query Language (GQL), significantly accelerating feature velocity.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_HrBXtvr.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">How a graph-based abuse detection platform detects fraud</strong></h3>\n<p><span style=\"vertical-align: baseline;\">With Spanner Graph, Google's graph-based abuse detection platform for ads performs multi-hop pattern matching directly against operational relational data using ISO GQL. For instance, when an account is flagged for suspicious activity, the platform does real-time traversals to uncover all connected signals across the graph. This allows security systems to identify and disable entire coordinated fraud rings quickly rather than handling individual accounts sequentially.</span></p>\n<p><span style=\"vertical-align: baseline;\">Here’s how it works. The following query uses full-text keyword search and vector similarity search to traverse connected entities across multiple hops to identify a target entity linked to known suspicious activity. </span><strong><span style=\"vertical-align: baseline;\">Note that the query is illustrative and the field names have been anonymized. </span></strong></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;GRAPH CentralGraph (Illustrative Query)\\r\\n-- 1. Multi-hop Graph Traversal: Trace relationship paths between entities\\r\\nMATCH (n1:Entity_1 {id: $seed_entity_id})-[r1:Relationship_1]-&gt;(n2:Entity_2)&lt;-[r2:Relationship_2]-(n3:Entity_3)\\r\\nMATCH (n3)-[r3:Relationship_3]-&gt;(n4:Entity_4)&lt;-[r4:Relationship_3]-(n5:Entity_1)-[r5:Relationship_4]-&gt;(n6:Entity_5)\\r\\nWHERE n5.status = &#x27;FLAGGED&#x27;\\r\\n-- 2. Full-Text Search: Filter entities by text description keywords\\r\\n  AND SEARCH(n3.description_text, &#x27;suspicious activity&#x27;)\\r\\n-- 3. Vector Search: Match similar entity embeddings for behavioral anomaly detection\\r\\n  AND VECTOR_SEARCH(n6.embedding, $target_embedding, top_k =&gt; 5) &gt; 0.85\\r\\nRETURN n1.id AS TargetEntity, n3.id AS LinkedEntity, n5.id AS FlaggedEntity, n6.id AS SimilarEntity&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fe33b0f8d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">Impact of adding real-time graph intelligence</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Today, the graph-based abuse detection platform operates as a unified, Google-wide defense platform across a live graph of over 500 billion nodes and 1 trillion edges. Further, bringing ability to do multi-hop graph queries to real-time enforcement has fundamentally changed how Google stops abuse, delivering big wins for customers and end users:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Safeguarding advertiser budgets:</strong><span style=\"vertical-align: baseline;\"> The graph-based abuse detection platform is a primary source of detection signals for ad policy enforcement across Google's ad products. By uncovering the coordinated networks behind click fraud, click farms, and invalid traffic in real time, it stops bad actors, so advertisers don’t waste budget on invalid interactions.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Defending users against emerging threats:</strong><span style=\"vertical-align: baseline;\"> Real-time relationship analysis helps Google catch public-figure impersonation, account takeovers, cloaking, and landing-page malware before campaigns start to scale. During any incident, the graph-based abuse detection platform plays a vital role in tracing the connected assets and rapidly shutting down the attack.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stopping repeat financial offenders:</strong><span style=\"vertical-align: baseline;\"> By correlating billing, financial, and identity information the platform identifies repeat bad actors and prevents banned offenders from simply spinning up new accounts to evade enforcement.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Graph capabilities for every industry</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google's graph-based abuse detection platform for ads shows what Spanner Graph can deliver under the world’s most demanding scale and latency requirements. Because this unified relational and graph architecture is built directly into Spanner, enterprises across a variety of industries can use the same foundation to solve their own complex pattern-matching and fraud challenges:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Advertising and digital media:</strong><span style=\"vertical-align: baseline;\"> Ad platforms link cookies, device fingerprints, and click behavior to block coordinated fraud rings in real time. For instance, Google Ads leverages Spanner Graph to analyze relationship risk across a 500-billion-node graph, while </span><a href=\"https://cloud.google.com/blog/products/databases/graph-technologies-underpin-yahoo-system-of-action?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Yahoo uses Spanner</span></a><span style=\"vertical-align: baseline;\"> for their monetization use case.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Retail and e-commerce:</strong><span style=\"vertical-align: baseline;\"> Retailers connect customer accounts, payments, and shipping data to stop promo abuse and bot networks at checkout. For instance, </span><a href=\"https://cloud.google.com/blog/topics/retail/how-target-rebuilt-retail-discovery-with-spanner-graph\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Target</span></a><span style=\"vertical-align: baseline;\"> rebuilt its Gift Finder using Spanner Graph and vector search (GraphRAG), cutting maintenance by 50% with sub-10ms latency. Additionally, </span><a href=\"https://developer.paypal.com/community/blog/knowledge_graph_for_unified_customer_entity/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">PayPal</span></a><span style=\"vertical-align: baseline;\"> uses Spanner Graph for its Customer Graph to unify customer identities across brands.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cybersecurity and threat intelligence:</strong><span style=\"vertical-align: baseline;\"> Security teams map network assets, login origins, and access permissions to uncover attack paths and isolate compromised infrastructure during live incidents. Unifying graph queries with relational telemetry in Spanner helps expose proxy networks and automated impersonators before lateral movement occurs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Financial services and payments:</strong><span style=\"vertical-align: baseline;\"> Risk teams correlate billing data and payment instruments to stop synthetic identity rings and fraud. Equifax uses Spanner Graph to map ownership hierarchies across 30 million businesses.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Get started</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Ready to bring real-time graph intelligence to your operational data at scale? </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Learn more about</span> <a href=\"https://cloud.google.com/spanner\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner</span></a><span style=\"vertical-align: baseline;\"> and explore</span> <a href=\"https://cloud.google.com/products/spanner/graph\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Spanner Graph</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Get hands-on experience with codelabs </span><a href=\"https://codelabs.developers.google.com/codelabs/spanner-graph-getting-started#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://codelabs.developers.google.com/spanner-graph-algorithms#0\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">here</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ul></div>"
  "414c32bb5d287c66fbd331e47ed5203d":
    "id": "414c32bb5d287c66fbd331e47ed5203d"
    "title": "How Vodafone is using the Data Engineering Agent to improve their data pipelines"
    "link": "https://cloud.google.com/blog/products/data-analytics/vodafone-cuts-data-pipeline-costs-30-via-data-engineeringagent/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">For large organizations, building and </span><span style=\"vertical-align: baseline;\">maintaining</span><span style=\"font-style: italic; vertical-align: baseline;\"> data pipelines is one of the most complex tasks that data engineering teams are tasked with. In BigQuery environments, the </span><a href=\"https://cloud.google.com/blog/products/data-analytics/exploring-the-data-engineering-agent-in-bigquery\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">Data Engineering Agent</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> can help, leveraging Gemini to to automate these workflows.</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">In this blog post, Vodafone Czech Republic describes how it has used the Data Engineering Agent to modernize and optimize </span><a href=\"https://cloud.google.com/bigquery\"><span style=\"font-style: italic; text-decoration: underline; vertical-align: baseline;\">BigQuery</span></a><span style=\"font-style: italic; vertical-align: baseline;\"> stored procedures, transforming them into modern data pipelines and reducing pipeline execution times by half. - Pedro Esteves, Google Cloud</span></p>\n<p><span style=\"vertical-align: baseline;\">The Data Engineering Agent makes it easy to build and maintain modern data pipelines. The agent is available in </span><a href=\"https://docs.cloud.google.com/bigquery/docs/pipelines-introduction\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery pipelines</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://cloud.google.com/dataform\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dataform</span></a><span style=\"vertical-align: baseline;\">. At Vodafone, we used the agent directly in Dataform to build Dataform pipelines. As shown in the example below, the Data Engineering Agent takes natural language instructions together with any code provided in the instruction file to build the Dataform pipeline.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_8EqtqGJ.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">How Vodafone currently executes its pipelines</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Vodafone Czech Republic uses many BigQuery stored procedures to transform data for business purposes. These stored procedures are a legacy of a previous on-premises data warehouse migration to BigQuery. Many of them contain 2,000 or 3,000 lines of code and run sequentially.</span></p>\n<p><span style=\"vertical-align: baseline;\">Compared to a modular Dataform approach created by the Data Engineering Agent, there are several known disadvantages of maintaining legacy, multi-thousand-line stored procedures, as described in the table below.<br /><br /></span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Feature</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Legacy stored procedures (Monolith)</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Modular approach (Dataform)</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Code structure</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Single file, 1000s of lines, complex logic mixed.</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Small, modular </span><span style=\"vertical-align: baseline;\">.sqlx</span><span style=\"vertical-align: baseline;\"> files </span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Logic reuse</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Copy/Paste code blocks (prone to drift).</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">functions and </span><span style=\"vertical-align: baseline;\">ref()</span><span style=\"vertical-align: baseline;\"> for strict logic reuse</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Testing</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Manual, ad-hoc, rarely done</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Automated testing (Unique, Not Null, Referential Integrity) built-in</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Documentation</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Comments in code (usually outdated)</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Auto-generated documentation with lineage graph</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Execution</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Manual scheduling; hard-coded dependency management</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Automatic execution based on lineage (DAG)</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<h3><strong style=\"vertical-align: baseline;\">How the Data Engineering Agent improved our data pipelines</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To solve the problems of running and maintaining legacy stored procedures, we used the Data Engineering Agent to migrate some of the stored procedures into Dataform pipelines.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Parallelization of code</span></h4>\n<p><span style=\"vertical-align: baseline;\">The Data Engineering Agent was able to parallelize the code into independent steps which are then run in parallel to improve readability and performance. See the example below:</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_ZXl6ID7.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Caching intermediate results</span></h4>\n<p><span style=\"vertical-align: baseline;\">The Data Engineering Agent can understand dependencies between the tables and cache certain intermediate tables using </span><a href=\"https://docs.cloud.google.com/bigquery/docs/materialized-views-intro\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery materialized views</span></a><span style=\"vertical-align: baseline;\">. This means that tables that are used in downstream processes can be cached, speeding up code execution and reducing cost.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Facilitating orchestration of the pipeline</span></h4>\n<p><span style=\"vertical-align: baseline;\">Having a modular pipeline allows us to facilitate end-to-end orchestration and pipeline dependencies to meet our SLAs. Before using Dataform, we had to manually control pipeline execution by creating metadata tables with several checkpoints and logs. Dependencies between stored procedures jobs were also maintained manually in a spreadsheet. By executing the pipeline in Dataform, all the dependencies and execution logs are handled by Dataform. </span></p>\n<h4><span style=\"vertical-align: baseline;\">Ability to run sections of the pipeline</span></h4>\n<p><span style=\"vertical-align: baseline;\">Because the code is now split into several steps, it’s possible to execute only a subset of the actions in Dataform rather than running the entire stored procedure. This can help with debugging and gives us the flexibility to only run the relevant sections of the code.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Lessons learned</strong></h3>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">There’s a trade-off between parallelization and caching. When we prompted the Data Engineering Agent to parallelize our procedures, we noticed an increase in cost.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">When running a standard sequential stored procedure, BigQuery caches the base table for the first thread. However, splitting this logic into parallel streams can inadvertently negate those caching benefits, causing full table scans for each thread. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">To solve this, we asked the Data Engineering Agent to create materialized views for intermediate tables. These views effectively pre-cache the data, ensuring that your parallelized queries remain performant and cost-efficient.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">To make the agent parallelize the code more efficiently we gave it specific instructions on which areas (staging tables) we were interested in parallelizing. </span></p>\n</li>\n</ol>\n<h3><strong style=\"vertical-align: baseline;\">Results: Accelerated migration and performance</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Deploying Data Engineering Agent delivered immediate and measurable impact, specifically in addressing the toil associated with legacy migrations. The agent successfully achieved high-fidelity replication of all stored procedures, ensuring 1:1 logic parity with minimal human intervention.</span></p>\n<p><span style=\"vertical-align: baseline;\">By automating the conversion of complex ETL pipelines, the agent achieved a 90% reduction in migration time compared with traditional manual approaches. What would have typically required weeks of engineering effort was completed in a fraction of the time, freeing engineers to focus on other key tasks.</span></p>\n<p><span style=\"vertical-align: baseline;\">Furthermore, the modernization of the underlying infrastructure resulted in substantial performance gains. Post-migration benchmarks indicate that the </span><strong style=\"vertical-align: baseline;\">new data pipelines run twice as fast</strong><span style=\"vertical-align: baseline;\">, significantly reducing query latency and increasing overall data throughput.</span></p>\n<p><span style=\"vertical-align: baseline;\">And as we previously discussed, instructing the agent to cache intermediate tables led to a </span><strong style=\"vertical-align: baseline;\">30% reduction in costs</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Beyond accelerating development and reducing costs, these agentic tools are also changing the way data engineers approach their work. Rather than spending significant time on repetitive migration and optimization tasks, engineers can collaborate with agents to explore different implementation options, validate design decisions, and accelerate delivery. This shift is encouraging teams to adopt new ways of working, where agentic capabilities become an integral part of the development process and help shape how data solutions are designed, delivered, and maintained.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Industrializing the Data Engineering Agent at Vodafone</strong></h3>\n<p><span style=\"vertical-align: baseline;\">At Vodafone, we’re planning to scale the use of the Data Engineering Agent across the company in the following key areas:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Standardized Dataform template repository:</strong><span style=\"vertical-align: baseline;\"> Establishing a central repository for Dataform templates allows for consistent architecture and design patterns across different projects and teams, helping ensure quality and alignment with global standards.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Global market onboarding:</strong><span style=\"vertical-align: baseline;\"> We will expand the Data Engineering Agent deployment across key Vodafone markets including the Czech Republic (CZ), Romania (RO), Ireland (IE), Germany (DE), and the United Kingdom (UK), to drive widespread adoption and modernization.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Integration with developer environments (IDEs):</strong><span style=\"vertical-align: baseline;\"> Deepening the integration of agentic capabilities directly into developer workflows (such as VS Code, and and Antigravity) will enable engineers to leverage Data Engineering Agent features within their existing tools and IDEs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Federated CI/CD governance:</strong><span style=\"vertical-align: baseline;\"> Implementing a centralized yet flexible governance framework for Continuous Integration and Continuous Deployment (CI/CD) will allow individual markets to maintain autonomy while adhering to corporate quality and security policies.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Modernization of legacy stored procedures at scale:</strong><span style=\"vertical-align: baseline;\"> By systematically migrating complex, legacy workloads — specifically SAS code, BTEQ scripts, and MicroStrategy — into modern Dataform pipelines will allow us to reduce technical debt and accelerate transformation across the enterprise.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">To learn more about transforming your enterprise data architecture for the agentic era, download our complete </span><a href=\"https://cloud.google.com/resources/content/data-agents-guidebook\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agents Guidebook</span></a><span style=\"vertical-align: baseline;\"> or explore Google Cloud’s </span><a href=\"https://cloud.google.com/ramp\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Rapid Migration and Modernization Program (RaMP)</span></a><span style=\"vertical-align: baseline;\">. To get started building and optimizing your own data pipelines with the agent today, visit the </span><a href=\"https://docs.cloud.google.com/bigquery/docs/data-engineering-agent-pipelines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Engineering Agent pipelines documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "291b628e385201cf52dec8795876682c":
    "id": "291b628e385201cf52dec8795876682c"
    "title": "How to simplify cloud access with Unified Access Policies, now in preview"
    "link": "https://cloud.google.com/blog/products/identity-security/how-to-simplify-cloud-access-with-unified-access-policies/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As organizations scale their cloud footprint to thousands of autonomous agents and microservices, you can accidentally create an operational bottleneck with strict Identity and Access Management (IAM). Meanwhile, administrators still need to enforce least privilege across thousands of resources without slowing down engineering velocity.</span></p>\n<p><span style=\"vertical-align: baseline;\">Enter </span><a href=\"https://docs.cloud.google.com/iam/docs/unified-access-policies\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Unified Access Policies</span></a><span style=\"vertical-align: baseline;\"> (UAPs), Google Cloud's next-generation access control engine in </span><a href=\"https://cloud.google.com/products/iam\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud IAM</span></a><span style=\"vertical-align: baseline;\">, now in preview at no additional cost. UAP consolidates allow and deny rules into one unified schema, and decouples policy definition from resource enforcement. </span></p>\n<p><span style=\"vertical-align: baseline;\">This approach allows you to author a policy once and bind it across your organization. UAP governs human, workload, and first-class agent identities with your existing IAM policies. With UAP, you can radically simplify your access policies and manage them more easily at scale.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Scale limitations of legacy access models</span></h3>\n<p><span style=\"vertical-align: baseline;\">Traditional access policy models can push teams into a tough trade-off between Zero Trust access and pipeline speed due to three compounding forces:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Fragmented schemas and permission sprawl</strong><span style=\"vertical-align: baseline;\">:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">In granting thousands of granular permissions across cloud resources, administrators are forced to choose between either over-granting permissions from coarse roles with broad access, or wrangling two different syntaxes (APIs and mental models across allow and deny) just to define one workload's custom access posture.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Policies treated as snowflakes</strong><span style=\"vertical-align: baseline;\">: Because legacy policies attach directly to individual resources, applying a standard developer or security baseline across 25 projects means duplicating and maintaining 50 separate allow and deny policy configurations in Terraform. This approach can create severe configuration fatigue and operational burden, with greater risk of misconfiguration.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scale ceilings and explosion of agent identities</strong><span style=\"vertical-align: baseline;\">: Modern cloud environments span human teams, federated workloads, service accounts, and autonomous agents that should never share generic service account credentials. As non-human and agent identities multiply, large enterprises routinely hit the hard 64 KB single-policy size limit on allow policies — requiring policy refactoring to onboard new teams or agents.</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">Helping platform and security teams address these access limitations demands a new approach: an agent-ready engine on a unified control plane, designed to simplify, centralize, and scale access control.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Key capabilities in UAP preview</span></h3>\n<p><span style=\"vertical-align: baseline;\">UAP removes cognitive burden for platform and IAM administrators, security architects, and agent administrators while shrinking your Infrastructure as Code footprint. UAP re-architects how policies are authored, bound, and enforced across your resource hierarchy because it’s built around a simpler authorization model.</span></p>\n<p><span style=\"vertical-align: baseline;\">1. </span><strong style=\"vertical-align: baseline;\">Unified allow and deny syntax</strong><span style=\"vertical-align: baseline;\">:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">Consolidate positive access grants and firm security guardrails into a single, auditable policy instead of reconciling separate allow and deny files.</span></p>\n<p><span style=\"vertical-align: baseline;\">2. </span><strong style=\"vertical-align: baseline;\">Multi-binding support</strong><span style=\"vertical-align: baseline;\">: A standalone policy binding acts as the connective tissue between your policy definition and target Cloud Resource Manager (CRM) nodes (organization, folder, and project). You can now bind a single UAP policy across up to 25 CRM targets in preview, eliminating duplicate Terraform blocks.</span></p>\n<p><span style=\"vertical-align: baseline;\">3. </span><strong style=\"vertical-align: baseline;\">Expanded scale limits (5x effective policy size)</strong><span style=\"vertical-align: baseline;\">: UAP breaks through the legacy single-policy size ceiling by letting you attach up to five UAP policies (64 KB and up to 100 rules each) to any single CRM resource — scaling to 2,500 unique principals and 500 groups per resource.</span></p>\n<p><span style=\"vertical-align: baseline;\">4. </span><strong style=\"vertical-align: baseline;\">Clear separation of concerns</strong><span style=\"vertical-align: baseline;\">: Central security architects can author vetted baseline and guardrail policies at the organization node and delegate self-service binding to folder and project administrators, without letting local teams alter central rule logic.</span></p>\n<p><span style=\"vertical-align: baseline;\">5. </span><strong style=\"vertical-align: baseline;\">Expressive permission wildcards and immutable guardrails</strong><span style=\"vertical-align: baseline;\">: Replace brittle permission lists with prefix, suffix, and substring wildcards alongside predefined roles and action exclusions (excluded permissions).</span></p>\n<p><span style=\"vertical-align: baseline;\">6. </span><strong style=\"vertical-align: baseline;\">Built-in readiness for agents</strong><span style=\"vertical-align: baseline;\">: UAP treats agents as first-class principals (</span><span style=\"font-style: italic; vertical-align: baseline;\">principal://agents.global...</span><span style=\"vertical-align: baseline;\">) rather than generic service accounts. Agent administrators can scope least-privilege allow and deny rules directly to individual agents or entire agent pools, combine UAP with short-lived, downscoped tokens, and build on an extensible foundation for human-in-the-loop and delegated agent authorization.</span></p>\n<p><span style=\"vertical-align: baseline;\">7. </span><strong style=\"vertical-align: baseline;\">Day 1 parity across all four surfaces</strong><span style=\"vertical-align: baseline;\">:</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">At runtime, Cloud IAM evaluates your existing allow policies, deny policies and UAP policies concurrently across your resource hierarchy. Whether your teams prefer interactive workflows or declarative automation, UAP launches with full create, read, update, and delete parity across the Google Cloud console, gCloud CLI, Terraform, and the Cloud IAM v3 REST API.</span></p>\n<p><span style=\"vertical-align: baseline;\">You can deploy your first policy to bring these powerful capabilities into your environment in just a few minutes.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Enforce UAP in 3 steps</span></h3>\n<p><span style=\"vertical-align: baseline;\">While you can automate UAP through Terraform, gCloud CLI or REST API, you can also author and bind policies interactively in the Google Cloud console.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Step 1: Open the Unified Access Policies tab<br /></strong><span style=\"vertical-align: baseline;\">In the Google Cloud console, select your target organization, folder, or project in the resource picker and navigate to </span><span style=\"font-style: italic; vertical-align: baseline;\">IAM &amp; Admin &gt; IAM</span><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Alongside the existing Principals tab, select the new </span><span style=\"font-style: italic; vertical-align: baseline;\">Unified Access Policies </span><span style=\"vertical-align: baseline;\">tab to view all policies in your scope — including their binding status, governed principals and rule types — and click </span><span style=\"font-style: italic; vertical-align: baseline;\">+ Create policy</span><span style=\"vertical-align: baseline;\">.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_USv8KWE.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Unified Access Policies page lists all the policies managed at/ enforced at the scope picked by the customer (Project, Folder or Org).</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Step 2: Define policy details and access rules<br /></strong><span style=\"vertical-align: baseline;\">In the </span><span style=\"font-style: italic; vertical-align: baseline;\">Policy Details</span><span style=\"vertical-align: baseline;\"> pane, enter a policy name and description, then build your access posture under </span><span style=\"font-style: italic; vertical-align: baseline;\">Add rules</span><span style=\"vertical-align: baseline;\">:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Select principals and exceptions</strong><span style=\"vertical-align: baseline;\">: Choose a principal set or individual identity (such as dev group or agent identity) via </span><span style=\"font-style: italic; vertical-align: baseline;\">+ Add principal</span><span style=\"vertical-align: baseline;\">, and optionally exempt breakglass administrator groups via </span><span style=\"font-style: italic; vertical-align: baseline;\">+ Add exception principal.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Choose the rule effect and permissions</strong><span style=\"vertical-align: baseline;\">: Select </span><span style=\"font-style: italic; vertical-align: baseline;\">Allow</span><span style=\"vertical-align: baseline;\"> (using predefined roles, individual permissions or permission wildcards) or </span><span style=\"font-style: italic; vertical-align: baseline;\">Deny</span><span style=\"vertical-align: baseline;\"> (using explicit permissions or wildcards, such as </span><span style=\"font-style: italic; vertical-align: baseline;\">compute.googleapis.com/firewalls.*</span><span style=\"vertical-align: baseline;\">)</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Combine rules in one policy</strong><span style=\"vertical-align: baseline;\">: Click </span><span style=\"font-style: italic; vertical-align: baseline;\">Add another rule</span><span style=\"vertical-align: baseline;\"> to pair positive grants and deny guardrails in the same policy, while inspecting the live JSON configuration preview on the right.</span></p>\n</li>\n</ol></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_jfIgzYQ.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Create Allow and/or Deny rules within a single UAP policy resource.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Step 3: Bind the policy and manage lifecycle<br /></strong><span style=\"vertical-align: baseline;\">Proceed to the </span><span style=\"font-style: italic; vertical-align: baseline;\">Enforcement</span><span style=\"vertical-align: baseline;\"> step, select the target organization, folder, or project scopes where you want the policy to take effect, and click</span><span style=\"font-style: italic; vertical-align: baseline;\"> Bind policy</span><span style=\"vertical-align: baseline;\">. </span></p>\n<p><span style=\"vertical-align: baseline;\">Once created, you can click any policy on the </span><span style=\"font-style: italic; vertical-align: baseline;\">Unified Access Policies</span><span style=\"vertical-align: baseline;\"> landing page to open its </span><span style=\"font-style: italic; vertical-align: baseline;\">Policy details</span><span style=\"vertical-align: baseline;\"> view — where you can audit active rules and resource bindings, click </span><span style=\"font-style: italic; vertical-align: baseline;\">View JSON</span><span style=\"vertical-align: baseline;\"> to export the policy for IaC pipelines, or edit bindings as your environment evolves.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_dZIDsI6.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Every policy can be bound to a target resource through a binding. Leveraging separate bindings, a single policy can be enforced on multiple resources, unlocking simpler management at scale.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">With your first policy securely enforced and managed, your security and platform teams can spend less time wrangling permission sprawl and more time driving business velocity.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Get started today</span></h3>\n<p><span style=\"vertical-align: baseline;\">With Unified Access Policies, we are excited to help you build a more secure, agile and future-ready cloud architecture that scales alongside your human and AI workloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">To streamline your organization’s access management, explore the Unified Access Policies </span><a href=\"https://docs.cloud.google.com/iam/docs/unified-access-policies\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">, and try it in a test project — create and bind your first reusable UAP policy using gcloud CLI, REST API, or Terraform.</span></p></div>"
  "c8f8b5de9aa3930ae0e7674331eeebd0":
    "id": "c8f8b5de9aa3930ae0e7674331eeebd0"
    "title": "Introducing ambient networking for GKE"
    "link": "https://cloud.google.com/blog/products/networking/ambient-networking-for-gke-sidecarless-service-mesh/"
    "published": "2026-11-21 02:00:00"
    "fetched": "2026-11-21 03:58:09"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Network sidecars have a deserved reputation for excessive resource consumption  and increased management overhead, especially in a service mesh environment. Today, we are announcing the general availability of </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/ambient-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ambient networking for Google Kubernetes Engine</span></a><span style=\"vertical-align: baseline;\"> (GKE). This milestone marks an important evolution in how your run service mesh on GKE, bringing a sidecar-less architecture into production. Introduced earlier this year, ambient networking decouples functionality traditionally provided as a service mesh from application workloads, allowing platform operators and developers to help secure, observe, and route traffic without the resource overhead and operational complexity of managing sidecar proxies. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Ambient networking architecture</strong></h3></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1_ambient_networking_architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_ambient_networking_architecture.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">The ambient networking architecture shifts networking responsibilities from individual application pods to shared per-node components and managed control plane services.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Control plane</span></h4>\n<p><span style=\"vertical-align: baseline;\">The ambient networking control plane orchestrates operations across the cluster.</span></p>\n<ul>\n<li><strong style=\"vertical-align: baseline;\">Traffic Director:</strong><span style=\"vertical-align: baseline;\"> Serves as the centralized xDS control plane, continuously delivering routing rules, access control policies, and cluster state updates to node-level proxies.</span></li>\n<li><strong style=\"vertical-align: baseline;\">Certificate Authority Service:</strong><span style=\"vertical-align: baseline;\"> Authenticate workloads and dynamically issues managed workload identity certificates, on-demand to enable seamless mTLS encryption across service-to-service communication.</span></li>\n<li><strong style=\"vertical-align: baseline;\">GKE control plane:</strong><span style=\"vertical-align: baseline;\"> Manages the cluster</span></li>\n<li><strong style=\"vertical-align: baseline;\">Gateway controller:</strong><span style=\"vertical-align: baseline;\"> Reads the Gateway CRDs and passes configuration information to Traffic Director</span></li>\n</ul>\n<h4><span style=\"vertical-align: baseline;\">GKE node components</span></h4>\n<p><span style=\"vertical-align: baseline;\">At the same time, several </span><span style=\"vertical-align: baseline;\">Node-level management components operate securely within the </span><code style=\"vertical-align: baseline;\">gke-managed-ambient</code><span style=\"vertical-align: baseline;\"> namespace:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ambient networking runtime interface (NRI) plugin:</strong><span style=\"vertical-align: baseline;\"> Integrates with the NRI to perform low-level network redirection, intercepting traffic to and from ambient-enabled application pods.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">xDS agent (ambient agent):</strong><span style=\"vertical-align: baseline;\"> Runs inside the node proxy pod to receive xDS configuration updates from Traffic Director and request certificates from the GKE control plane on-demand.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Node proxy (L4 Envoy proxy):</strong><span style=\"vertical-align: baseline;\"> A high-performance, shared per-node Envoy instance that processes intercepted L4 traffic, enforces mutual TLS (mTLS), evaluates authorization policies, performs load balancing, and emits rich telemetry metrics.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Service pods:</strong><span style=\"vertical-align: baseline;\"> The user’s application/service pods communicate through the GKE node proxy to perform service to service mTLS across the cluster.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Core functionality</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Together, these features combine to deliver a number of advanced capabilities for GKE environments: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero Trust architecture: </strong><span style=\"vertical-align: baseline;\">Ambient networking allows customers to establish a Zero Trust security posture. Traffic between workloads can be automatically encrypted using mutual TLS (mTLS) with managed workload identities, helping protect and secure service-to-service communication across the cluster.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Simplified access policy:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Granular control over service communication is simplified through authorization policies. Operators can define precise access rules to enforce least-privilege security boundaries between microservices.</span></span></li>\n<li style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\"><strong style=\"vertical-align: baseline;\">Rich telemetry:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">Gain operational insights with out-of-the-box L4 metrics and L7 metrics. Observability data can be collected automatically, giving teams visibility into traffic patterns, latency, and connection health for efficient monitoring and troubleshooting.<br /><br /></span></span>To see these metrics, use Network Services Monitoring, a new Google Cloud capability that is also available today. Network Services Monitoring shows the traffic that ambient networking handles, for example, service-to-service connections, latency, and error rates, across your GKE clusters, so you can understand service dependencies without building your own dashboards. To learn more, read the <a href=\"https://docs.cloud.google.com/network-intelligence-center/docs/network-services-monitoring/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Ambient networking benefits</span></h3>\n<p><span style=\"vertical-align: baseline;\">Ambient networking delivers tangible value for GKE operators:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simpler operations</strong><span style=\"vertical-align: baseline;\">: </span><span style=\"vertical-align: baseline;\">Traditionally, service mesh products rely on injecting sidecar containers directly into every workload pod. Ambient networking removes this sidecar dependency by shifting networking features to shared node components. This fully managed solution simplifies deployment and streamlines day-to-day cluster operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Simplified lifecycle management: </strong><span style=\"vertical-align: baseline;\">When proxy logic is decoupled from application containers, lifecycle management is simplified. Upgrading proxy versions or applying configuration updates helps avoid restarting application workloads or scheduling downtime windows, enabling continuous availability for your services. Ambient networking can reduce administrative overhead and application disruption an average of four times annually by eliminating pod restarts required by CVE patches for L4 mesh usage.<br /><br /></span><span>This fully managed solution can be installed either at cluster creation time or added to an existing cluster. Ongoing maintenance to the cluster components is handled by automated systems and is performed along with normal GKE cluster maintenance.</span></p>\n</li>\n<li><strong style=\"vertical-align: baseline;\">Reduced resource consumption: </strong><span style=\"vertical-align: baseline;\">By moving away from sidecar proxies for each pod, ambient networking reduces compute and memory overhead. Ambient networking enables up to a 10x reduction in GKE resource usage for layer 4 (L4) mesh features, including mTLS, load balancing, telemetry, and more. </span></li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Try ambient networking in your GKE clusters today</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Simplifying adoption by removing the cost and complexity barriers of sidecars.  Try it out in your GKE environment and experience the benefits of ambient networking: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">fully managed installation and upgrades</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">service-to-service mTLS and authorization policies</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">lower resource usage than sidecars</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">L4 &amp; L7 metrics</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">See our documentation for more information: </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/ambient-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://docs.cloud.google.com/kubernetes-engine/docs/concepts/ambient-overview</span></a></p>\n<p><span style=\"vertical-align: baseline;\">Pricing: </span><a href=\"https://cloud.google.com/products/gke-service-networking/pricing?e=48754\"><span style=\"text-decoration: underline; vertical-align: baseline;\">https://cloud.google.com/products/gke-service-networking/pricing</span></a></p></div>"
