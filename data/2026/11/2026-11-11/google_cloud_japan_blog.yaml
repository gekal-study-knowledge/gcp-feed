  "88d80f0d40cde3d8dab001d8d70b778e":
    "id": "88d80f0d40cde3d8dab001d8d70b778e"
    "title": "AlloyDB for PostgreSQL から Iceberg に直接アクセスして、運用データと Lakehouse データを統合する"
    "link": "https://cloud.google.com/blog/ja/products/databases/direct-iceberg-access-in-alloydb/"
    "published": "2026-11-11 10:00:00"
    "fetched": "2026-11-11 17:52:17"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 5 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/databases/direct-iceberg-access-in-alloydb?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">適切なビジネス上の意思決定を行うには、運用データベースから得られるビジネスの最新状況と、レイクハウスやデータ ウェアハウスなどの分析システムに保存されている履歴コンテキストという 2 種類のデータが必要です。従来、これらのシステムは別々のものでしたが、現在では急速に統合が進んでいます。こうした状況を受け、このたび </span><a href=\"https://cloud.google.com/products/alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB for PostgreSQL</span></a><span style=\"vertical-align: baseline;\"> から Iceberg に直接アクセスする機能（プレビュー版）を発表いたしました。デベロッパーは、Cloud Storage バケットに保存されている Apache Iceberg テーブルに対して AlloyDB から直接クエリし、最新の運用データと結合できるようになります。こうした処理をすべて、単一の SQL クエリで実行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB 同期</span></a><span style=\"vertical-align: baseline;\">と </span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-real-time-data-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse フェデレーション</span></a><span style=\"vertical-align: baseline;\">の一般提供も始まりました。Lakehouse は、データのオープンなコピーを 1 つ保持して、あらゆるエンジンから利用できるのが特徴ですが、このボーダーレスな Lakehouse を AlloyDB から操作する方法がこれで全部で 3 つになります。事例として、</span><a href=\"https://cloud.google.com/customers/etsy-lakehouse\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Etsy</span></a><span style=\"vertical-align: baseline;\"> はボーダーレスな Lakehouse から 3 ペタバイトのデータを移動することなく結合して、パイプライン クエリを 60% 高速化しました。データの保存場所やアプリケーションからの読み取り方に応じて、AlloyDB では次のいずれかのアプローチを使用できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Iceberg への直接アクセス:</strong><span style=\"vertical-align: baseline;\"> AlloyDB カラム型エンジンによって、Iceberg テーブルを動かすことなくその場で高速に読み取ります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB 同期:</strong><span style=\"vertical-align: baseline;\"> レイテンシについて妥協できないワークロードに対して、指定間隔で同期された Lakehouse データを AlloyDB から提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lakehouse フェデレーション:</strong><span style=\"vertical-align: baseline;\"> ネイティブの BigQuery テーブルを動かすことなくその場でクエリを実行し、BigQuery で処理します。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">このたびの新機能により、アプリやエージェントは、運用データと Lakehouse データをまとめて処理するために、カスタム パイプラインを構築、管理する必要がなくなります。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/AlloyDB.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>AlloyDB とボーダーレスな Lakehouse: Apache Iceberg または BigQuery データを動かさずにその場で直接クエリするか、または AlloyDB にデータを同期できます。これにより、リアルタイム アプリケーションや AI エージェントに対して、運用データおよび Lakehouse データの両方への制御アクセスを提供することが可能となります。</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">アクションと同時に意思決定</strong></h4>\n<p><span style=\"vertical-align: baseline;\">AlloyDB とボーダーレスな Lakehouse のインテグレーションにより、過去のコンテキストと本番環境のトランザクションの直接連携が可能となるため、カスタム パイプラインを構築、管理しなくても、アクションと同時に意思決定を行えるようになります。例:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">不正行為やリスクの判定:</strong><span style=\"vertical-align: baseline;\"> 不正行為検出エージェントが、支払いの承認前に、データベース内の過去 30 日間の履歴に加えて、Iceberg 内の過去 5 年間の顧客取引履歴をチェックできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パーソナライズ:</strong><span style=\"vertical-align: baseline;\"> ショッピング エージェントが、ページに滞在中のユーザーのカート情報と、Lakehouse からのライフタイム バリューおよび返品履歴を組み合わせて、最適な特典情報を判断します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">動的な価格設定:</strong><span style=\"vertical-align: baseline;\"> 価格設定エージェントが、AlloyDB のリアルタイムの在庫と、Lakehouse の需要および天候の履歴データを組み合わせて、状況に即した価格を設定します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">データ プロダクト:</strong><span style=\"vertical-align: baseline;\"> データチームがキュレートしたテーブルを Iceberg にひとたび公開すれば、数十のアプリケーションがそれぞれ独自のコピーを保持することなく Iceberg から読み取れるようになります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">いずれの場合も、履歴は Lakehouse に残り、意思決定はデータベース側で行います。具体的には、エージェントが、アクセス許可されたテーブルおよび権限を使って、AlloyDB で人間の代わりに処理を行います。</span></p>\n<p><span style=\"vertical-align: baseline;\">では、3 種類の統合方法について詳しく見ていきましょう。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AlloyDB から Iceberg への直接アクセス（プレビュー版）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Iceberg への直接アクセスでは、AlloyDB はバケットパスまたは Lakehouse ランタイム カタログを使用して、Cloud Storage から Apache Iceberg テーブルを直接読み取ります。Iceberg テーブルをいったん登録すると、他の PostgreSQL テーブルと同様にクエリを実行できるようになり、本番環境の運用テーブルとの結合も行えます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Register five years of transaction history stored as Iceberg\\r\\nCREATE TABLE transaction_history (\\r\\n  customer_id BIGINT, category TEXT, amount NUMERIC, ts TIMESTAMPTZ)\\r\\nUSING iceberg\\r\\nWITH (uri = &#x27;gs://my-bucket/warehouse/payments/transaction_history&#x27;);\\r\\n\\r\\n\\r\\n-- Compare the payment in flight with the customer&#x27;s history\\r\\nSELECT t.amount,\\r\\n       AVG(h.amount) AS usual_spend,\\r\\n       MAX(h.amount) AS largest_past_purchase\\r\\nFROM recent_transactions t                -- live, in AlloyDB\\r\\nJOIN transaction_history h                -- five years, in Iceberg\\r\\n  ON h.customer_id = t.customer_id AND h.category = t.category\\r\\nWHERE t.transaction_id = &#x27;TX-1001&#x27;\\r\\nGROUP BY t.amount;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fabfd367090&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"font-style: italic; vertical-align: baseline;\">AlloyDB は、Lakehouse のデータをコピーすることなく、Iceberg テーブルをその場で読み取って、本番環境の運用データと結合します。</span></p>\n<p><span style=\"vertical-align: baseline;\">AlloyDB に Iceberg サポートが組み込まれ、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/columnar-engine/about\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB カラム型エンジン</span></a><span style=\"vertical-align: baseline;\">によって加速される仕組みになっているため、Lakehouse データへのクエリが高速に処理されます。これらのクエリは、アプリケーションが使用するのと同じデータベース インスタンス上で実行され、読み取り用インスタンスを別途用意する必要はありません。また、社内の諸部門が Lakehouse に公開した最新のデータを読み取れます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Cloud Storage の 1 TB のデータセットを対象に、集計クエリを使ってテストしたところ、AlloyDB から Iceberg への直接アクセスは、Amazon の同等の PostgreSQL 互換サービスよりも</span><strong style=\"vertical-align: baseline;\">最大 7 倍高速</strong><span style=\"vertical-align: baseline;\">、オープンソースの PostgreSQL 拡張機能よりも</span><strong style=\"vertical-align: baseline;\">最大 3.5 倍高速</strong><span style=\"vertical-align: baseline;\">でした。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">AlloyDB 同期による最小レイテンシの読み取り（一般提供）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">どんなテーブルでも動かさずにその場で読み取ったほうがいい、というわけではありません。たとえば、小売業者のリスクスコアは、支払いが発生するたびに参照、チェックされますが、このスコアが変更されるのは、データチームが夜間に再計算したときのみです。このように、リクエストのたびに読み取られ、更新はスケジュールに従って行われるようなデータは、AlloyDB 内にローカル テーブルとして持つと処理が最速となります。このようなケースでは、パイプラインを構築、維持することなく、データのコピーを最新状態に保つことが課題となります。</span></p>\n<p><a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB 同期</span></a><span style=\"vertical-align: baseline;\">は、Lakehouse データを BigQuery から AlloyDB に一度、またはスケジュールに従って定期的にコピーし、最新の状態に保ちます。このコピーは AlloyDB のローカル テーブルとなるため、アプリは他のテーブルと同じ速度で読み取ることができます。また、インデックスを作成したり、読み取りプールを使用したり、カラム型エンジンやベクトル検索を使ったりすることもできます。同期処理は、BigQuery コンソールまたは SQL からワンクリックで開始できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Keep merchant risk scores refreshed every hour\\r\\nSELECT alloydb_sync.create_bq_sync_table(\\r\\n  &#x27;my-project.risk.merchant_risk_scores&#x27;,\\r\\n  &#x27;merchant_risk_scores&#x27;,\\r\\n  INTERVAL &#x27;1 hour&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fabfd9f8710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Lakehouse フェデレーション（一般提供）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">すでに BigQuery に長年の分析データを蓄積している組織は、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-real-time-data-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse フェデレーション</span></a><span style=\"vertical-align: baseline;\">によって、ネイティブの BigQuery テーブルを動かすことなく AlloyDB から直接クエリして、本番環境の運用データと結合するところまでを、1 つのクエリで行えます。AlloyDB は、フィルタリング、集計、制限の処理を BigQuery に push し、BigQuery がほとんどの処理を行って、結果のみを返します。また、これらのクエリに対して課金されるプロジェクトを設定したり、クエリを使用できるロールを制限したりすることもできます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Loyal Guru などの Google Cloud のお客様は、すでに AlloyDB と BigQuery をこのように組み合わせて使っています。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「AlloyDB を、BigQuery のような Google Cloud プロダクトと併用すれば、プラットフォームの機能を継続的に強化していくためのアジリティとパフォーマンスを確保できるほか、後手に回らぬよう新たなトレンドを予測することもできます。」</span><span style=\"vertical-align: baseline;\"> - </span><strong style=\"vertical-align: baseline;\">Loyal Guru、共同創業者 / 最高技術責任者、Javi Fernández 氏</strong></p>\n<h4><strong style=\"vertical-align: baseline;\">適切な方法を選んで使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現在、運用システムと分析システムを統合する動きが広がっています。Google Cloud 環境でそれを実現する方法は、以下のようにユースケースに応じて選択できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Iceberg への直接アクセス:</strong><span style=\"vertical-align: baseline;\"> アプリで Iceberg の過去データと本番環境のデータを統合する場合は、この方法が最適です。この方法では、AlloyDB カラム型エンジンによって処理が高速化されます。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">試す:</strong><span style=\"vertical-align: baseline;\"> Iceberg への直接アクセスを PostgreSQL 18 インスタンスで有効にしてから、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/access-iceberg-data-from-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB から Iceberg データにアクセスする</span></a><span style=\"vertical-align: baseline;\">の手順に沿って操作してください。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">AlloyDB 同期: </strong><span style=\"vertical-align: baseline;\">アプリがテーブルの読み取りを頻繁に行い、レイテンシを最小におさえたい場合に最適です。読み取るコピーは、更新後の最新のものとなります。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">実装する:</strong><span style=\"vertical-align: baseline;\"> Google Cloud コンソールまたは psql を使って、BigQuery のテーブルを選択して </span><a href=\"https://docs.cloud.google.com/alloydb/docs/sync-bigquery-data-to-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB に同期</span></a><span style=\"vertical-align: baseline;\">します。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Lakehouse フェデレーション:</strong><span style=\"vertical-align: baseline;\"> ネイティブの BigQuery テーブルに保存されている履歴データを BigQuery で処理したい場合に最適です。</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">始める: </strong><a href=\"https://cloud.google.com/alloydb/docs/configure-access-real-time-data\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery のリアルタイム データへの AlloyDB アクセスを構成する</span></a><span style=\"vertical-align: baseline;\">の手順に沿って操作してください。</span></p>\n</li>\n</ul>\n</ul>\n<p><span style=\"vertical-align: baseline;\">詳細については、</span><a href=\"https://docs.cloud.google.com/alloydb/docs/choose-access-bigquery-data-from-alloydb\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlloyDB から BigQuery データにアクセスする方法を選択する</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース担当プロダクト管理リード、</span><strong style=\"font-style: italic; vertical-align: baseline;\"> Nikhil Gaekwad</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">データベース担当グループ プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Bala Narasimhan</strong></p></div>"
  "a1ebc900ba82700678d2e9d7a374e158":
    "id": "a1ebc900ba82700678d2e9d7a374e158"
    "title": "Compute Engine API マルチ バージョニングの概要: 本番環境に影響を与えない予測可能な進化"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/introducing-compute-engine-api-multi-versioning-predictable-evolution-without-breaking-production/"
    "published": "2026-11-11 10:00:00"
    "fetched": "2026-11-11 17:52:17"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 5 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/introducing-compute-engine-api-multi-versioning-predictable-evolution-without-breaking-production?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">本番環境の安定性を損なうことなく、インフラストラクチャをモダナイズしたいとお考えですか？Compute Engine の API マルチ バージョニングが一般提供となり、まさにそれを実現できるようになりました。日付ベースの API バージョンにより、Compute Engine は </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API の堅牢な安定性を維持しながら、最新の API セマンティクス、強化されたレジリエンスの初期設定、改善されたデベロッパー エクスペリエンスを定期的に提供できるようになりました。</span></p>\n<p><span style=\"vertical-align: baseline;\">10 年以上にわたり、Google Compute Engine </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API は、数百万台の仮想マシン、Google Kubernetes Engine（GKE）クラスタ、大規模な AI インフラストラクチャの基盤となるコントロール プレーンとして機能してきました。Google Cloud で構築を行うプラットフォーム チームやデベロッパーにとって、この単一の </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> エンドポイントは、一度連携システムを構築すれば、その後何年も確実に動作し続けるという、絶大な安心感を提供してきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、クラウド アーキテクチャの規模が拡大し高度化するにつれて、インフラストラクチャ チームは大きなジレンマに直面するようになっています。まず、ミッション クリティカルな本番環境ワークロードでは、API の絶対的な安定性と厳格な後方互換性が求められます。その一方で、より安全なセキュリティの初期設定、強化されたリージョンのレジリエンス、機械で読み取り可能なエラーモデル、宣言型ツールと相性の良い最新 API などへの迅速なアクセスも求められています。しかし、こうした改善を既存の環境に直接導入すると、既存の自動化が機能しなくなるリスクがあります。新しいバージョニング モデルでは、本番環境のワークロードに手を加えることなく、独自のスケジュールで最新のセマンティクスを柔軟に導入できるため、自動化が正常に機能しなくなる事態を回避できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Compute Engine の日付ベースの API バージョン</strong></h4>\n<p><span style=\"vertical-align: baseline;\">これまで、Compute Engine は</span><strong style=\"vertical-align: baseline;\">チャネルベースのバージョニング（CBV）</strong><span style=\"vertical-align: baseline;\">を採用し、</span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\">（一般提供）、</span><code style=\"vertical-align: baseline;\">/beta</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">/alpha</code><span style=\"vertical-align: baseline;\"> の 3 つの長期チャネルに依存していました。</span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> は、世界中のすべてのお客様が共有する単一の変更可能な本番環境のインターフェースであったため、動作の改善（直感的でないデフォルト設定の変更やエラー形式の最新化など）であっても、既存スクリプトが動かなくなるリスクや、複数年にわたる移行を強いるリスクを伴っていました。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の</span><a href=\"https://google.aip.dev/185\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">AIP-185</span></a><span style=\"vertical-align: baseline;\"> に準拠した</span><strong style=\"vertical-align: baseline;\">インターフェース ベースのバージョニング（IBV）</strong><span style=\"vertical-align: baseline;\">により、Compute Engine では </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> に加え、変更不可の日付ベースの API スナップショットが導入されます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">安定版（</strong><strong style=\"vertical-align: baseline;\">YYYY-MM-DD</strong><strong style=\"vertical-align: baseline;\">）</strong><span style=\"vertical-align: baseline;\">: 予測可能な</span><strong style=\"vertical-align: baseline;\">四半期ペース</strong><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\"> から開始）でリリースされます。各安定版は、一般提供されているすべての Compute Engine 機能とデフォルトの動作を、特定の時点で固定した API 仕様です。安定版は、公開後に互換性を破る変更が加えられることはありません。現時点でサポート終了日は設定されていません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">プレビュー版（</strong><strong style=\"vertical-align: baseline;\">YYYY-MM-DD-preview</strong><strong style=\"vertical-align: baseline;\">）</strong><span style=\"vertical-align: baseline;\">: 迅速なリリース サイクル（</span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\"> など）でリリースされるプレビュー版は、親となる安定版から分岐したもので、デベロッパーは今後の機能や API 設計に早期アクセスできます。検証やフィードバックを行える有効期間はあらかじめ 1 年間と決められています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">継続的な </strong><strong style=\"vertical-align: baseline;\">/v1</strong><strong style=\"vertical-align: baseline;\"> のサポート</strong><span style=\"vertical-align: baseline;\">: 既存の </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> API は引き続き完全にサポートされ、日付ベースのバージョンが指定されていない場合はデフォルトとして機能します。既存のアプリケーション、スクリプト、連携システムは、変更を加えることなくそのまま動作します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">ビルダーにとっての主なメリット</strong></h4>\n<p><strong style=\"vertical-align: baseline;\">1. 安定性とお客様によるアップグレードの管理</strong></p>\n<p><span style=\"vertical-align: baseline;\">従来の単一バージョンの API では、デフォルトの動作を変更すると、プラットフォームの機能進化をとるか、お客様のシステムの安定性をとるかというトレードオフが生じます。しかし、日付ベースのマルチバージョン管理では、お客様自身がアップグレードのタイミングを以下のように完全に制御できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">既知の仕様に固定</strong><span style=\"vertical-align: baseline;\">: REST を直接呼び出すユーザーと SDK ユーザーは、リクエストとレスポンス スキーマが完全に固定されていることを前提に、特定のバージョン識別子（</span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\"> など）をロックできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">スケジュールに合わせたアップグレード</strong><span style=\"vertical-align: baseline;\">: 四半期ごとに新しい安定版がリリースされ、デフォルト設定やリソース スキーマが更新された場合でも、チームはリリースノートを確認し、バージョン文字列を 1 か所変更してステージング環境でテストしたうえで、独自のペースで本番環境にロールアウトできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">一貫したリソース URI</strong><span style=\"vertical-align: baseline;\">: 日付ベースのバージョンでは、引き続き </span><code style=\"vertical-align: baseline;\">/compute/v1/</code><span style=\"vertical-align: baseline;\"> ベース URL パスが使用されます。ターゲット バージョンは、</span><code style=\"vertical-align: baseline;\">X-Goog-Api-Version</code><span style=\"vertical-align: baseline;\"> HTTP ヘッダーまたは </span><code style=\"vertical-align: baseline;\">$apiVersion</code><span style=\"vertical-align: baseline;\"> クエリ パラメータで指定します。つまり、どのようなツールやサービスからアクセスしても、リソースの </span><code style=\"vertical-align: baseline;\">selfLink</code><span style=\"vertical-align: baseline;\"> URI は変わりません。</span></p>\n</li>\n</ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Request a specific date-based stable version using the HTTP header\\r\\ncurl -X GET \\\\\\r\\n  &quot;https://compute.googleapis.com/compute/v1/projects/my-project/zones/us-central1-a/instances&quot; \\\\\\r\\n  -H &quot;Authorization: Bearer $(gcloud auth print-access-token)&quot; \\\\\\r\\n  -H &quot;X-Goog-Api-Version: 2026-09-01&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7fabfc7b9490&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">2. より安全な初期設定、強化されたレジリエンス、最新の API 標準</strong></p>\n<p><span style=\"vertical-align: baseline;\">動作の変更を日付ベースの新しいバージョンに切り離すことで、Compute Engine はクラウド アプリケーションのレジリエンス、セキュリティ、自動化のしやすさを向上させる以下の改善を実現しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">デフォルトでレジリエンスのあるグローバル クエリ</strong><span style=\"vertical-align: baseline;\">: 従来の </span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> では、すべてのゾーンとリージョンを対象に </span><code style=\"vertical-align: baseline;\">AggregatedList</code><span style=\"vertical-align: baseline;\"> を呼び出すと、</span><code style=\"vertical-align: baseline;\">returnPartialSuccess</code><span style=\"vertical-align: baseline;\"> がデフォルトで </span><code style=\"vertical-align: baseline;\">false</code><span style=\"vertical-align: baseline;\"> に設定されていました。つまり、呼び出し元が明示的にオプトインしていない場合、単一ゾーンで発生した一時的な問題によってグローバル リスト リクエストが失敗することがありました。新しい日付ベースのバージョンでは、一部のデータのみの取得がデフォルトで有効になっているため、局所的なメンテナンスや障害が発生しても、グローバル フリート クエリはレジリエンスを維持できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">対処可能で機械読み取り可能なエラー（AIP-193）</strong><span style=\"vertical-align: baseline;\">: 日付ベースのバージョンでは、構造化された </span><code style=\"vertical-align: baseline;\">reason</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">domain</code><span style=\"vertical-align: baseline;\">、コンテキスト </span><code style=\"vertical-align: baseline;\">metadata</code><span style=\"vertical-align: baseline;\">（無効なバージョン識別子がリクエストされた場合に </span><code style=\"vertical-align: baseline;\">supported_versions</code><span style=\"vertical-align: baseline;\"> のリストを返すなど）を含む標準化された </span><a href=\"https://google.aip.dev/193\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">google.rpc.ErrorInfo</code></a><span style=\"vertical-align: baseline;\"> ペイロードが採用され、エラー文字列の脆弱な正規表現解析が不要になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">セキュリティの強化と最小権限のハイジーン向上</strong><span style=\"vertical-align: baseline;\">: 新しい API バージョンでは、</span><code style=\"vertical-align: baseline;\">/v1</code><span style=\"vertical-align: baseline;\"> で実行されている従来の自動化に影響を与えることなく、Compute Engine において過度に広範だった従来の IAM 権限チェックを強化し、より安全なデフォルト構成を導入できるようになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">よりクリーンで宣言型ツールと相性の良い API 設計</strong><span style=\"vertical-align: baseline;\">: マルチ バージョニングにより、10 年前の複雑なリソース スキーマを最新の Google API 改善提案（AIP）へと進化させる明確な移行パスが提供されます。</span></p>\n</li>\n</ul>\n<p><code style=\"vertical-align: baseline;\">3. クライアント ライブラリ、gcloud</code><strong style=\"vertical-align: baseline;\">、Terraform にわたるシームレスな導入</strong></p>\n<p><span style=\"vertical-align: baseline;\">REST API を直接呼び出す場合でも、上位レベルのツールでインフラストラクチャを管理する場合でも、Compute Engine API のマルチ バージョニングは、スムーズに動作するように設計されています。</span></p>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">インターフェース</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">マルチ バージョニングの仕組み</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">ユーザーの責任</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">クライアント ライブラリ（Python、Go、Java、Node.js、C#、Ruby、PHP）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">各 SDK リリースは、</span><strong style=\"vertical-align: baseline;\">/v1</strong><strong style=\"vertical-align: baseline;\"> パッケージ名前空間</strong><span style=\"vertical-align: baseline;\">（</span><code style=\"vertical-align: baseline;\">compute_v1</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">apiv1</code><span style=\"vertical-align: baseline;\">）</span><strong style=\"vertical-align: baseline;\">を保持しながら</strong><span style=\"vertical-align: baseline;\">、特定の日付ベースの API バージョンに自動的にバインドされます。列挙型は、シームレスな前方互換性と後方互換性を実現するために文字列として表現されます。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">通常どおりクライアント ライブラリの依存関係をアップグレードします。</span><strong style=\"vertical-align: baseline;\">インポート パスの書き換えは不要です</strong><span style=\"vertical-align: baseline;\">。</span><code style=\"vertical-align: baseline;\">-preview</code><span style=\"vertical-align: baseline;\"> SDK リリースを使用して、プレビュー機能をテストします。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud CLI（gcloud）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">gcloud compute</code><span style=\"vertical-align: baseline;\"> は、バンドルされた安定版 API バージョンを対象とします。新しい </span><strong style=\"vertical-align: baseline;\">gcloud preview compute</strong><span style=\"vertical-align: baseline;\"> コマンド グループは、バンドルされたプレビュー API バージョンを対象とします。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> を最新の状態に保ちます。既存の </span><code style=\"vertical-align: baseline;\">gcloud compute</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">beta</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">alpha</code><span style=\"vertical-align: baseline;\"> スクリプトはそのまま機能します。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Terraform（</strong><strong style=\"vertical-align: baseline;\">google</strong><strong style=\"vertical-align: baseline;\"> と </strong><strong style=\"vertical-align: baseline;\">google-beta</strong><strong style=\"vertical-align: baseline;\">）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">google</code><span style=\"vertical-align: baseline;\"> プロバイダは安定した日付ベースの API を対象とし、</span><code style=\"vertical-align: baseline;\">google-beta</code><span style=\"vertical-align: baseline;\"> は内部的にプレビュー API を対象とします。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Terraform プロバイダのバージョンをアップグレードすることで、新機能を活用できます。HCL スクリプトで API バージョンを手動で構成する必要はありません。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">HTTP / REST の直接呼び出し</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><code style=\"vertical-align: baseline;\">-H \"X-Goog-Api-Version: YYYY-MM-DD\"</code><span style=\"vertical-align: baseline;\"> または </span><code style=\"vertical-align: baseline;\">?$apiVersion=YYYY-MM-DD</code><span style=\"vertical-align: baseline;\"> を使用してアクティブなバージョンを選択し、バージョン固有の</span><a href=\"https://www.googleapis.com/discovery/v1/apis/compute/2026-09-01/rest\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ディスカバリ ドキュメント</span></a><span style=\"vertical-align: baseline;\">を取得できます。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">HTTP クライアントでヘッダーまたはクエリ パラメータを渡して、特定のバージョン（例: </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\">）を有効にします。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Compute Engine API のマルチ バージョニングは、現在すべての Google Cloud リージョンで利用可能です。最初の安定版は </span><strong style=\"vertical-align: baseline;\">2026-09-01</strong><span style=\"vertical-align: baseline;\"> で、</span><strong style=\"vertical-align: baseline;\">2026-10-01-preview</strong><span style=\"vertical-align: baseline;\"> はプレビュー テストに利用できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">日付ベースのバージョンについて以下のリソースで確認し、ワークフローへの導入をご検討ください。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ドキュメントを確認する</strong><span style=\"vertical-align: baseline;\">:</span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/api/how-tos/api-versioning-guide\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine API バージョニング ガイド</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/api/how-tos/api-requests-responses\"><span style=\"text-decoration: underline; vertical-align: baseline;\">API リクエストの作成とレスポンスの処理</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/compute/docs/reference/rest/v1\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Compute Engine REST API のリファレンス</span></a><span style=\"vertical-align: baseline;\">（バージョン セレクタを使用して </span><code style=\"vertical-align: baseline;\">2026-09-01</code><span style=\"vertical-align: baseline;\"> と </span><code style=\"vertical-align: baseline;\">2026-10-01-preview</code><span style=\"vertical-align: baseline;\"> のスキーマを確認）</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">gcloud preview compute</strong><strong style=\"vertical-align: baseline;\"> を試す</strong><span style=\"vertical-align: baseline;\">: </span><code style=\"vertical-align: baseline;\">gcloud components update</code><span style=\"vertical-align: baseline;\"> を実行し、新しい </span><code style=\"vertical-align: baseline;\">gcloud preview compute</code><span style=\"vertical-align: baseline;\"> インターフェースを使用して、今後のプレビュー機能をテストします。</span></p>\n</li>\n</ol>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Michael Murstein</strong></p></div>"
"last_updated": "2026-11-11 17:52:17 JST"
