"overview": |
  この日は Google Cloud Blog の 4 本で、BigQuery measures の一般提供と、GKE のネットワークポリシー、Gemini のパートナー連携、CodeMender の PR 連携が取り上げられました。BigQuery measures が一般提供となり、BI のメトリクス定義とナレッジグラフのエンティティ関係を 1 つのモデルで定義して、AI エージェント・SQL・GQL・ダッシュボードから同じ統制されたメトリクスを使えるようにし、エージェントのハルシネーションを抑えるとしています。GKE では ClusterNetworkPolicy (CNP) を試した記事が公開され、Admin・ネットワークポリシー・Baseline の 3 階層の優先順位でクラスタ全体のポリシーを適用し、LLM の namespace への通信を許可されたクライアントに限定しつつ、DNS (ポート 53) 以外のメタデータ API へのアクセスを遮断する構成を Codelab とともに紹介しています。パートナー向けには、MCP・A2A・REST API のコネクターやスキル、プラグインで ISV のソリューションを Gemini に組み込み、Google Cloud Marketplace への掲載までを支援する Gemini factory の取り組み (サンフランシスコ、ニューヨーク、ロンドン、パリ、テルアビブ、東京などでのワークショップ) が紹介されました。セキュリティでは、自律型のコードセキュリティエージェント CodeMender を Cloud Run 経由で GitHub のプルリクエストに組み込み、スキャン結果や修正パッチを PR のタイムラインに返すリファレンスアーキテクチャが公開されました (Mandiant M-Trends 2026 によると脆弱性の平均修正期間は 10 年前の約 59 日から 2025 年には 170 日超に延びています)。
