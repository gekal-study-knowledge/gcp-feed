    "summary": "<h2 class=\"release-note-product-title\">Apigee Edge for Public Cloud</h2>\n<h3>Announcement</h3>\n<p>On November 11, 2026, we began releasing Edge UI updates for Apigee Edge for\nPublic Cloud.</p>\n<h3>Fixed</h3>\n<table>\n<thead>\n<tr>\n<th>Bug ID</th>\n<th>Component</th>\n<th>Description</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>392653797, 399185014</strong></td>\n<td>Edge UI</td>\n<td>Fixed an issue where navigating to the App Details or New App pages in organizations with a large number of API products experienced slowness or UI freezing during the initial page load. The Edge UI now fetches API products on demand when you open the <strong>Add Product</strong> dialog, improving initial page load performance.</td>\n</tr>\n<tr>\n<td><strong>576859695</strong></td>\n<td>Edge UI</td>\n<td>Fixed an issue in the Analytics Error Code Analysis dashboard where <code>504 Gateway Timeout</code> responses caused by target timeouts were excluded from the <strong>Proxy errors</strong> charts. Target timeout <code>504</code> responses are now counted under <strong>Proxy errors</strong>.</td>\n</tr>\n<tr>\n<td><strong>188163219</strong></td>\n<td>Edge UI</td>\n<td>Fixed a UI formatting issue in the Analytics Custom Reports list view so that dimensions display without overlapping.</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Feature</h3>\n<p><strong>Govern agents on any CNCF-conformant Kubernetes cluster with Agent Gateway for cross-cloud (Limited Preview)</strong></p>\n<p><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/governance/agent-gateway-cross-cloud/overview\">Agent Gateway for cross-cloud</a>\nis available in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Limited Preview</a>. It\nextends\nAgent Platform governance to agents that run on Cloud Native Computing\nFoundation (CNCF)-conformant Kubernetes clusters outside of Google Cloud, such\nas Amazon Elastic Kubernetes Service (Amazon EKS), Azure Kubernetes Service\n(AKS), Red Hat OpenShift, and bare-metal clusters. Your\nagents keep running where they are, but you govern them from one place: give\neach agent a verifiable identity, register agents and MCP servers in Agent\nRegistry, and route their LLM, MCP, and A2A traffic through local Agent Gateway\nproxies by using your existing service mesh or network stack. Those proxies\nenforce access and Model Armor safety policies, and send access logs and agent\ntraces to Cloud Logging and Cloud Trace.</p>\n<p>Agent Gateway for cross-cloud is available at no charge during Limited Preview.\nOther products that you configure with it, such as Model Armor, Cloud Logging, and\nCloud Trace, are billed at their standard rates. To request access, complete the\n<a href=\"https://docs.google.com/forms/d/e/1FAIpQLSeUpnNRtYQjLRblii-KoUbJJ7DjEV6fvQAfO21IAXgVSqFjpw/viewform\">access request form</a>.</p>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/agents/governance/agent-gateway-cross-cloud/setup\">Set up Agent Gateway for cross-cloud</a>.</p>\n<h2 class=\"release-note-product-title\">Oracle Database@Google Cloud</h2>\n<h3>Feature</h3>\n<p>For Exadata VM Clusters and Exascale VM Clusters, you can now choose to create a cluster without an Identity Connector, and enable or disable the Identity Connector after the cluster is created by using the Google Cloud console, the gcloud CLI, or the API. For more information, see <a href=\"https://docs.cloud.google.com/oracle/database/docs/enable-disable-identity-connector\">Enable and disable Identity Connector</a>.</p>\n<p>This feature is <a href=\"https://cloud.google.com/products#product-launch-stages\">generally available (GA)</a>.</p>"
