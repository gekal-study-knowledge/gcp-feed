  "c2f92fca7df44f3fedbbd34b7605ccbc":
    "id": "c2f92fca7df44f3fedbbd34b7605ccbc"
    "title": "November 17, 2026"
    "link": "https://docs.cloud.google.com/release-notes#November_17_2026"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 08:44:16"
    "summary": "<h2 class=\"release-note-product-title\">Access Context Manager</h2>\n<h3>Feature</h3>\n<p>Extended session length for Workforce Identity Federation is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA) for OAuth apps owned by Google Cloud projects. You can configure sessions\nthat last up to 90 days by using project scopes. For more information, see\n<a href=\"https://docs.cloud.google.com/access-context-manager/docs/extended-session-length-for-workforce-identity-federation\">Configure extended session length for Workforce Identity Federation</a>.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Go</h2>\n<h3>Feature</h3>\n<p>Support for migrating your App Engine push queues to Cloud Tasks by updating the\nbundled services SDK is in\n<a href=\"https://cloud.google.com/products/#product-launch-stages\">General Availability (GA)</a>.\nThis method lets you upgrade your app without needing to modify your application\ncode. For more information on how to migrate, see the\n<a href=\"https://docs.cloud.google.com/appengine/migration-center/standard/go/migrating-push-queues-upgrade-sdk\">push queues migration guide</a>.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Java</h2>\n<h3>Feature</h3>\n<p>Support for migrating your App Engine push queues to Cloud Tasks by updating the\nbundled services SDK is in\n<a href=\"https://cloud.google.com/products/#product-launch-stages\">General Availability (GA)</a>.\nThis method lets you upgrade your app without needing to modify your application\ncode. For more information on how to migrate, see the\n<a href=\"https://docs.cloud.google.com/appengine/migration-center/standard/java/migrating-push-queues-upgrade-sdk\">push queues migration guide</a>.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment PHP</h2>\n<h3>Feature</h3>\n<p>Support for migrating your App Engine push queues to Cloud Tasks by updating the\nbundled services SDK is in\n<a href=\"https://cloud.google.com/products/#product-launch-stages\">General Availability (GA)</a>.\nThis method lets you upgrade your app without needing to modify your application\ncode. For more information on how to migrate, see the\n<a href=\"https://docs.cloud.google.com/appengine/migration-center/standard/php/migrating-push-queues-upgrade-sdk\">push queues migration guide</a>.</p>\n<h2 class=\"release-note-product-title\">App Engine standard environment Python</h2>\n<h3>Feature</h3>\n<p>Support for migrating your App Engine push queues to Cloud Tasks by updating the\nbundled services SDK is in\n<a href=\"https://cloud.google.com/products/#product-launch-stages\">General Availability (GA)</a>.\nThis method lets you upgrade your app without needing to modify your application\ncode. For more information on how to migrate, see the\n<a href=\"https://docs.cloud.google.com/appengine/migration-center/standard/python/migrating-push-queues-upgrade-sdk\">push queues migration guide</a>.</p>\n<h2 class=\"release-note-product-title\">Backup and DR</h2>\n<h3>Feature</h3>\n<p>Support for automating resource protection for Compute Engine instances and\ndisks at scale in Backup and DR is generally available (GA). By using\nauto-protection policies and resource labels, you can automatically assign a\nbackup plan to qualifying resources across projects based on user-defined\nlabels. For more information, see\n<a href=\"https://docs.cloud.google.com/backup-disaster-recovery/docs/protect/automate-protection\">Automate resource protection</a>.</p>\n<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>You can now use the BigQuery REST API\n(<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/rest/v2/datasets/insert\"><code>datasets.insert</code></a>,\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/rest/v2/datasets/patch\"><code>datasets.patch</code></a>,\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/rest/v2/datasets/update\"><code>datasets.update</code></a>, and\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/rest/v2/datasets/get\"><code>datasets.get</code></a>) to configure\nand monitor <a href=\"https://docs.cloud.google.com/bigquery/docs/data-replication\">cross-region dataset replication</a>\nand to attach or detach failover reservations for\n<a href=\"https://docs.cloud.google.com/bigquery/docs/managed-disaster-recovery\">managed disaster recovery</a>. This\nfeature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h3>Feature</h3>\n<p>You can now use the\n<a href=\"https://docs.cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-ai-rank\"><code>AI.RANK</code> function</a>\nto reorder the rows of a table by how\nwell the text in a specified column answers a search query. This function is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h2 class=\"release-note-product-title\">Cloud Logging</h2>\n<h3>Change</h3>\n<p>Ops Agent version 2.72.0 changed the processing of all supported logging\npipelines from the Logging Agent service to the Metric Agent service.\nWhen you upgrade from an earlier version of the Ops Agent to version 2.72.0\nor later, you will see duplicated logs for a period, because each service\nmaintains its own record of the logs it has processed. This is expected.\nIf the duplicated logs are causing problems, then you can temporarily\nreconfigure the agent to continue using the Logging Agent service.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/logging/docs/agent/ops-agent/troubleshoot-run-ingest#upgraded-logging\">Upgraded logging pipelines</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Monitoring</h2>\n<h3>Change</h3>\n<p>Ops Agent version 2.72.0 changed the processing of all supported logging\npipelines from the Logging Agent service to the Metric Agent service.\nWhen you upgrade from an earlier version of the Ops Agent to version 2.72.0\nor later, you will see duplicated logs for a period, because each service\nmaintains its own record of the logs it has processed. This is expected.\nIf the duplicated logs are causing problems, then you can temporarily\nreconfigure the agent to continue using the Logging Agent service.\nFor more information, see\n<a href=\"https://docs.cloud.google.com/monitoring/agent/ops-agent/troubleshoot-run-ingest#upgraded-logging\">Upgraded logging pipelines</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud SDK</h2>\n<h3>Breaking</h3>\n<h2 id=\"59400_2026-11-17\">594.0.0 (2026-11-17)</h2>\n<h3 id=\"breaking_changes\">Breaking Changes</h3>\n<ul>\n<li><strong>(Google Cloud CLI)</strong> Fixed an issue where <code>--account</code> overrode the <code>ACCOUNT_NAME</code> positional\nargument (formerly <code>ACCOUNT</code>) of <code>gcloud auth print-access-token</code>,\n<code>print-identity-token</code>, <code>login</code>, <code>application-default login</code>, and\n<code>activate-service-account</code> when specified after it. The positional argument\nnow takes precedence. <code>--account</code> still applies when <code>ACCOUNT_NAME</code> is\nomitted.</li>\n<li><strong>(Cloud Billing)</strong> Fixed an issue where <code>--account</code> overrode the <code>ACCOUNT_ID</code> positional\nargument (formerly <code>ACCOUNT</code>) of <code>gcloud billing accounts get-iam-policy</code>,\n<code>set-iam-policy</code>, <code>add-iam-policy-binding</code>, and <code>remove-iam-policy-binding</code>\nwhen specified after it. The positional argument now takes precedence.\n<code>ACCOUNT_ID</code> is now always required. <code>--account</code> no longer replaces a missing\n<code>ACCOUNT_ID</code>.</li>\n<li><strong>(Compute Engine)</strong> Fixed an issue where <code>--project</code> overrode the <code>PROJECT_ID</code> positional\nargument of <code>gcloud compute shared-vpc</code> commands when specified after it.\nThe positional argument now takes precedence. <code>PROJECT_ID</code> is now always\nrequired. <code>--project</code> no longer replaces a missing <code>PROJECT_ID</code>.</li>\n</ul>\n<h3 id=\"google_cloud_cli\">Google Cloud CLI</h3>\n<ul>\n<li>Fixed an issue where <code>gcloud config config-helper</code> crashed or overwrote stored credentials when <code>auth/credential_file_override</code> (<code>CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE</code>) was set.</li>\n<li>Added error details (such as the error reason and troubleshooting links) to the output for failed long-running operations.</li>\n</ul>\n<h3 id=\"ai\">AI</h3>\n<ul>\n<li>Fixed <code>--system-labels</code> flag of <code>gcloud ai model-garden models deploy</code> being ignored for Model Garden and Hugging Face models.</li>\n</ul>\n<h3 id=\"agent_registry\">Agent Registry</h3>\n<ul>\n<li>Promoted <code>gcloud agent-registry skill-encryption-spec</code> to GA.</li>\n<li>Promoted <code>gcloud agent-registry skills revisions download</code> to GA.</li>\n<li>Fixed <code>gcloud agent-registry skills create --payload</code> so that the local ZIP archive is uploaded as the initial revision of the skill.</li>\n</ul>\n<h3 id=\"alloydb\">AlloyDB</h3>\n<ul>\n<li>Added support for the <code>z4d-highmem-16-standardlssd</code> machine-type in\n<code>gcloud alloydb instances create</code> and <code>gcloud alloydb instances update</code>.</li>\n</ul>\n<h3 id=\"app_lifecycle_manager\">App Lifecycle Manager</h3>\n<ul>\n<li>Added <code>--with-default-evaluation</code> flag to\n<code>gcloud beta app-lifecycle-manager flags create</code> to populate boolean flags\nwith default variants (<code>Enabled</code> and <code>Disabled</code>) and default evaluation spec\n(<code>defaultVariant: Disabled</code>).</li>\n</ul>\n<h3 id=\"artifact_registry\">Artifact Registry</h3>\n<ul>\n<li>Renamed the <code>URI</code> positional argument of\n<code>gcloud artifacts vulnerabilities list</code> to <code>ARTIFACT_URI</code> in help text.\nCommand syntax is unchanged.</li>\n</ul>\n<h3 id=\"assured_workloads\">Assured Workloads</h3>\n<ul>\n<li>Renamed the <code>WORKLOAD_ID</code> positional argument of\n<code>gcloud assured workloads create</code> to <code>WORKLOAD</code> in help text. Command syntax\nis unchanged.</li>\n</ul>\n<h3 id=\"biglake\">BigLake</h3>\n<ul>\n<li>Promoted <code>gcloud biglake iceberg views</code> to beta. The <code>create</code>, <code>delete</code>,\n<code>describe</code>, <code>get-iam-policy</code>, <code>list</code>, <code>set-iam-policy</code>, and <code>update</code>\ncommands are now available in beta.</li>\n<li>Promoted <code>gcloud biglake data-product-sharing unpublish</code> to GA.</li>\n</ul>\n<h3 id=\"cloud_backup_dr\">Cloud Backup DR</h3>\n<ul>\n<li>Updated <code>gcloud backup-dr applied-auto-protection-policies list</code> to\nreturn an error when <code>--location=-</code> is specified, because listing across\nall locations is not supported.</li>\n</ul>\n<h3 id=\"cloud_composer\">Cloud Composer</h3>\n<ul>\n<li>Added <code>--rollback-image-version</code> flag to\n<code>gcloud composer environments update</code> to roll back a Cloud Composer 3\nenvironment to its previous image version.</li>\n</ul>\n<h3 id=\"cloud_dataflow\">Cloud Dataflow</h3>\n<ul>\n<li>Updated <code>gcloud dataflow config-store-settings</code> commands to accept project\nIDs in addition to project numbers for project-level settings.</li>\n</ul>\n<h3 id=\"cloud_iam\">Cloud IAM</h3>\n<ul>\n<li>Added <code>--attribute-sync-interval</code> flag to <code>gcloud iam workforce-pools\nproviders create-oidc</code> and <code>gcloud iam workforce-pools providers\nupdate-oidc</code>, and <code>--clear-attribute-sync-interval</code> flag to <code>gcloud iam\nworkforce-pools providers update-oidc</code>.</li>\n</ul>\n<h3 id=\"cloud_run\">Cloud Run</h3>\n<ul>\n<li>Added support for <code>gcloud beta run deploy --domain</code> when property\n<code>regional/endpoint_mode</code> is set to <code>regional-preferred</code>.</li>\n<li>Promoted regional endpoints support to GA for <code>gcloud run deploy</code> and\n<code>gcloud run</code> <code>services</code>, <code>revisions</code>, <code>jobs</code>, and <code>worker-pools</code> commands.</li>\n<li>Promoted <code>--scaling</code>, <code>--scaling-cpu-target</code>, <code>--clear-scaling-cpu-target</code>,\n<code>--min</code>, and <code>--max</code> flags to <code>gcloud beta run worker-pools deploy</code> and\n<code>gcloud beta run worker-pools update</code> for configuring worker pool automatic\nand CPU utilization scaling.</li>\n</ul>\n<h3 id=\"cloud_sql\">Cloud SQL</h3>\n<ul>\n<li>Promoted <code>gcloud sql blue-green-deployments</code> to GA.</li>\n<li>Promoted <code>--msdtc-enabled</code> and <code>--msdtc-rpc-auth-mode</code> flags of <code>gcloud sql instances create</code> and <code>gcloud sql instances patch</code> to GA.</li>\n</ul>\n<h3 id=\"cloud_speech_api\">Cloud Speech API</h3>\n<ul>\n<li>Promoted <code>gcloud ml speech recognizers</code> command group to beta.</li>\n</ul>\n<h3 id=\"cloud_storage\">Cloud Storage</h3>\n<ul>\n<li>Fixed an issue in <code>gcloud storage buckets update</code> where specifying\n<code>--update-labels</code> or <code>--remove-labels</code> multiple times only applied the last\nflag instead of merging all specified labels.</li>\n</ul>\n<h3 id=\"cloud_tasks\">Cloud Tasks</h3>\n<ul>\n<li>Promoted <code>gcloud tasks batch-create</code> command to GA, which creates multiple\ntasks from a JSON or YAML file in a single batch operation.</li>\n<li>Promoted <code>--tasks-from-file</code> and <code>--failed-tasks-file</code> on\n<code>gcloud tasks delete</code> to GA, which deletes multiple tasks in a single batch\noperation.</li>\n<li>Deprecated <code>--from-file</code> on <code>gcloud alpha/beta tasks delete</code>; use\n<code>--tasks-from-file</code> instead.</li>\n<li>Promoted the task-level retry flags (<code>--max-attempts</code>,\n<code>--max-retry-duration</code>, <code>--min-backoff</code>, <code>--max-backoff</code>, and\n<code>--max-doublings</code>) on <code>gcloud tasks create-http-task</code> and\n<code>gcloud tasks create-app-engine-task</code> to GA. These flags override the\nqueue-level retry configuration for an individual task.</li>\n</ul>\n<h3 id=\"cluster_director\">Cluster Director</h3>\n<ul>\n<li>Promoted <code>--existing-instances</code> flag of\n<code>gcloud cluster-director clusters create</code> and <code>--add-existing-instances</code> and\n<code>--remove-existing-instances</code> flags of\n<code>gcloud cluster-director clusters update</code> to beta to support importing\nexisting Compute Engine instances into clusters.</li>\n<li>Added <code>resourcePolicyConfig</code> to <code>--slurm-node-sets</code> flag of\n<code>gcloud beta cluster-director clusters create</code> and\n<code>--add-slurm-node-sets</code> and <code>--update-slurm-node-sets</code> flags of\n<code>gcloud beta cluster-director clusters update</code> to support configuring the\naccelerator topology of Slurm node sets.</li>\n</ul>\n<h3 id=\"compute_engine\">Compute Engine</h3>\n<ul>\n<li>Promoted <code>PASSTHROUGH_LOAD_BALANCER_AVAILABILITY_GROUP0</code> and\n<code>PASSTHROUGH_LOAD_BALANCER_AVAILABILITY_GROUP1</code> values of the <code>--purpose</code>\nflag of <code>gcloud compute addresses create</code> to GA.</li>\n<li>Promoted <code>--purpose</code> flag of <code>gcloud compute public-delegated-prefixes\ncreate</code> to GA.</li>\n<li>Promoted <code>--network-attachment</code> and <code>--service-class-id</code> flags of <code>gcloud\ncompute addresses create</code> to GA.</li>\n<li>Promoted Global External Passthrough Network Load Balancing\n(<code>EXTERNAL_PASSTHROUGH</code> load-balancing scheme) support in <code>gcloud compute\nforwarding-rules</code> to GA.</li>\n<li>Promoted Global External Passthrough Network Load Balancing\n(<code>EXTERNAL_PASSTHROUGH</code> load-balancing scheme) support in <code>gcloud compute\nbackend-services</code> to GA.</li>\n<li>Promoted <code>imageOptimizationPolicy</code> support in <code>HttpRouteAction</code> to GA for\n<code>gcloud compute url-maps import</code>, <code>gcloud compute url-maps export</code>, and\n<code>gcloud compute url-maps validate</code>.</li>\n<li>Updated <code>gcloud compute ssh</code> to print status messages describing SSH key\ngeneration, public key upload, private key login, and temporary OS Login\ncertificate cleanup.</li>\n</ul>\n<h3 id=\"config_connector\">Config Connector</h3>\n<ul>\n<li>Updated Google Cloud Config Connector to version 1.161.0.\nSee Config Connector Overview for more details <a href=\"https://cloud.google.com/config-connector/docs/overview\">https://cloud.google.com/config-connector/docs/overview</a>.</li>\n</ul>\n<h3 id=\"container\">Container</h3>\n<ul>\n<li>Added <code>bmsai</code> option to <code>--confidential-node-type</code> flag in <code>gcloud container\nclusters create</code>, <code>clusters create-auto</code>, <code>node-pools create</code>, and\n<code>node-pools update</code> commands.</li>\n</ul>\n<h3 id=\"design_center\">Design Center</h3>\n<ul>\n<li>Added <code>gcloud design-center spaces application-templates export</code> command to\nexport IaC for an application template.</li>\n<li>Added <code>gcloud design-center spaces application-templates revisions export</code>\ncommand to export IaC for an application template revision.</li>\n</ul>\n<h3 id=\"kubernetes_engine\">Kubernetes Engine</h3>\n<ul>\n<li>Added <code>--enable-cluster-scale-to-zero</code> and <code>--cluster-scale-to-zero-delay</code>\nflags to <code>gcloud container clusters create</code>,\n<code>gcloud container clusters create-auto</code>, and\n<code>gcloud container clusters update</code> to configure cluster scale-to-zero.</li>\n</ul>\n<h3 id=\"workspace_add_ons\">Workspace Add Ons</h3>\n<ul>\n<li>Added <code>gcloud beta workspace-add-ons chat-app-config</code> command group to view\nand update the Google Chat app configuration of a Google Cloud project.</li>\n<li>Added <code>gcloud beta workspace-add-ons deployments</code> command group and\n<code>gcloud beta workspace-add-ons get-authorization</code> command, which match their\nGA versions.</li>\n</ul>\n<p>Subscribe to these release notes at <a href=\"https://groups.google.com/forum/#!forum/google-cloud-sdk-announce\">https://groups.google.com/forum/#!forum/google-cloud-sdk-announce</a>.</p>\n<h2 class=\"release-note-product-title\">Cloud Service Mesh</h2>\n<h3>Announcement</h3>\n<p><strong>1.31.3-asm.13 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud Service\nMesh 1.31.3-asm.13 uses Envoy v1.39.7-dev.</p>\n<p>This release fixes an issue introduced in the previous patch where gRPC HTTP/2\nflow-control errors in <code>pilot-agent</code> could disconnect xDS configuration streams\nand prevent proxy pods from becoming ready.</p>\n<h3>Fixed</h3>\n<p>Patch 1.31.3-asm.13 contains the fix for the following platform CVEs:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">CVE</th>\n<th style=\"text-align: left;\">Proxy</th>\n<th style=\"text-align: left;\">Control Plane</th>\n<th style=\"text-align: left;\">Distroless</th>\n<th style=\"text-align: left;\">CNI</th>\n<th style=\"text-align: left;\">Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-118131\">CVE-2026-118131</a></td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Medium (9.8)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-128085\">CVE-2026-128085</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (5.3)</td>\n</tr>\n</tbody>\n</table>\n<h3>Announcement</h3>\n<p><strong>1.30.7-asm.13 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/v1.30/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud\nService Mesh 1.30.7-asm.13 uses Envoy v1.38.10-dev.</p>\n<p>This release fixes an issue introduced in the previous patch where gRPC HTTP/2\nflow-control errors in <code>pilot-agent</code> could disconnect xDS configuration streams\nand prevent proxy pods from becoming ready.</p>\n<h3>Fixed</h3>\n<p>Patch 1.30.7-asm.13 contains the fix for the following platform CVEs:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">CVE</th>\n<th style=\"text-align: left;\">Proxy</th>\n<th style=\"text-align: left;\">Control Plane</th>\n<th style=\"text-align: left;\">Distroless</th>\n<th style=\"text-align: left;\">CNI</th>\n<th style=\"text-align: left;\">Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-118131\">CVE-2026-118131</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (9.8)</td>\n</tr>\n</tbody>\n</table>\n<h3>Announcement</h3>\n<p><strong>1.29.10-asm.8 is now available for in-cluster Cloud Service Mesh.</strong></p>\n<p>For details on upgrading Cloud Service Mesh, see\n<a href=\"https://docs.cloud.google.com/service-mesh/v1.29/docs/upgrade/upgrade\">Upgrade Cloud Service Mesh</a>. Cloud\nService Mesh 1.29.10-asm.8 uses Envoy v1.37.10-dev.</p>\n<p>This release fixes an issue introduced in the previous patch where gRPC HTTP/2\nflow-control errors in <code>pilot-agent</code> could disconnect xDS configuration streams\nand prevent proxy pods from becoming ready.</p>\n<h3>Fixed</h3>\n<p>Patch 1.29.10-asm.8 contains the fix for the following platform CVEs:</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: left;\">CVE</th>\n<th style=\"text-align: left;\">Proxy</th>\n<th style=\"text-align: left;\">Control Plane</th>\n<th style=\"text-align: left;\">Distroless</th>\n<th style=\"text-align: left;\">CNI</th>\n<th style=\"text-align: left;\">Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-118131\">CVE-2026-118131</a></td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">No</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (9.8)</td>\n</tr>\n<tr>\n<td style=\"text-align: left;\"><a href=\"https://nvd.nist.gov/vuln/detail/CVE-2026-128085\">CVE-2026-128085</a></td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Yes</td>\n<td style=\"text-align: left;\">Medium (5.3)</td>\n</tr>\n</tbody>\n</table>\n<h2 class=\"release-note-product-title\">Dataflow</h2>\n<h3>Feature</h3>\n<p>Eager watermark advancement is generally available (GA) for\n<a href=\"https://docs.cloud.google.com/dataflow/docs/streaming-engine\">Streaming Engine</a> jobs. When you enable eager\nwatermark advancement, records that arrive behind the current watermark no\nlonger stall the watermark, so windowed results and event-time timers run on\nschedule. Delayed records are still processed concurrently with on-time data.\nIf your pipeline uses windowed aggregations or stateful processing, configure\nallowed lateness to cover expected delays before you enable this feature. For\nmore information, see\n<a href=\"https://docs.cloud.google.com/dataflow/docs/guides/eager-watermark-advancement\">Eager watermark advancement</a>.</p>\n<h2 class=\"release-note-product-title\">Gemini Enterprise Agent Platform</h2>\n<h3>Change</h3>\n<p><strong>AlphaGenome available without an allowlist</strong></p>\n<p>AlphaGenome (<code>alphagenome-003</code> and <code>alphagenome-004</code>) no longer requires\nproject allowlisting. Any Google Cloud project can view and deploy AlphaGenome\nfrom Model Garden without submitting an access request. For deployment\nrequirements, see\n<a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/open-models/alphagenome\">AlphaGenome</a>.</p>\n<h2 class=\"release-note-product-title\">Model Armor</h2>\n<h3>Feature</h3>\n<p>You can use custom organization policies to ensure that updated\nModel Armor <code>FloorSetting</code> resources enforce required filters, such as\nresponsible AI or prompt injection and jailbreak detection. This feature is\ngenerally available\n(<a href=\"https://cloud.google.com/products#product-launch-stages\">GA</a>). For more\ninformation, see <a href=\"https://docs.cloud.google.com/model-armor/access-control/custom-constraints\">Use custom organization\npolicies</a>.</p>\n<h2 class=\"release-note-product-title\">Service Health</h2>\n<h3>Announcement</h3>\n<p>Personalized Service Health supports Google Antigravity for enterprises (product ID <code>hZpxrZf6wIdajCN6y30V</code>). For more information, see <a href=\"https://docs.cloud.google.com/service-health/docs/supported-products-locations\">Supported products and locations</a>.</p>"
