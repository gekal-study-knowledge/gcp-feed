  "4b05524b7fdae259d6558f30fc21fd48":
    "id": "4b05524b7fdae259d6558f30fc21fd48"
    "title": "Beyond the compute bottleneck: Maximizing the ROI of AI accelerators with purpose-built storage"
    "link": "https://cloud.google.com/blog/products/storage-data-transfer/maximizing-ai-accelerator-roi-with-purpose-built-storage/"
    "published": "2026-11-17 02:00:00"
    "fetched": "2026-11-17 08:12:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">There’s a lot more to AI infrastructure than just buying accelerators. Indeed, the infrastructure mandate for enterprise AI has shifted from acquiring accelerators to keeping them fully utilized. Next to these expensive accelerators, storage accounts for only a small sliver of total AI spend. However, having the wrong storage in place can put the rest of your committed compute capital at risk.</span></p>\n<p><span style=\"vertical-align: baseline;\">To optimize your accelerators’ TCO, you need to keep them fully occupied. Very often, the challenge here is data I/O. If accelerators sit waiting to read or write data, you’re wasting money. Across the industry, insufficient storage throughput has become a primary impediment to AI success, starving models of the data they need. And the problem is only going to get worse. Gartner </span><a href=\"https://www.gartner.com/en/newsroom/press-releases/2026-04-28-gartner-identifies-six-steps-to-manage-artificial-intelligence-agent-sprawl\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">predicts</span></a><span style=\"vertical-align: baseline;\"> enterprises will deploy over 150,000 agents in the next few years, so the I/O bottleneck and the challenge of orchestrating storage for agentic fleets will only compound. </span></p>\n<p><span style=\"vertical-align: baseline;\">Organizations are eager to move their AI initiatives forward, but preventing idle compute requires a purpose-built approach to data I/O. With the demands of AI, standard enterprise storage — even a system optimized for fast analytics — will inevitably suffer from bottlenecks that leave compute resources twiddling their proverbial thumbs.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AI is not a monolithic workload</strong></h3>\n<p><span style=\"vertical-align: baseline;\">The most common architectural misstep we see is treating AI as a single, general-purpose workload. In reality, the physical movement of data transforms across the AI lifecycle, creating distinct I/O profiles based on how models consume and generate information:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">In </span><strong style=\"vertical-align: baseline;\">model training</strong><span style=\"vertical-align: baseline;\">, clusters read datasets at high throughput, but pause regularly to write checkpoints to record their state in event of a failure. When thousands of GPUs attempt to save this data in a single, simultaneous burst, standard storage architectures stall. That’s especially true of traditional cloud storage, which is engineered for durability. Writing checkpoints triggers thousands of administrative database transactions to safely record the files, bogging down the system, choking the network, and freezing the entire GPU cluster until the save is complete. Furthermore, saving the data is only one of the problems: If a server fails, slow storage turns a routine checkpoint recovery into a multi-hour delay, leaving expensive accelerators sitting completely idle.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inference</strong><span style=\"vertical-align: baseline;\">, conversely, is real-time and latency-sensitive. As AI services scale to meet user demand, inference clusters constantly load and unload petabyte-scale model repositories quickly. In this case, a slow storage system can leave GPUs in a “cold start” as they wait for data.  Also, many models now process context windows that exceed 100,000 tokens, filling up accelerator memory. Without a high-speed external cache to offload this context, when a user asks the next question, the accelerator must recalculate previous inputs, wasting compute on redundant operations.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Industry-leading performance across object and file storage</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To solve these I/O challenges and keep expensive accelerators busy, organizations need compute, networking, and storage to be deeply integrated.</span></p>\n<p><span style=\"vertical-align: baseline;\">As industry analysts have noted, enterprise customers gain a unique performance advantage because Google Cloud runs on the exact same storage foundation as Google's own consumer products. This foundation is built on Colossus—the planet-scale distributed file system powering Google Search, YouTube, and Gemini. Because this shared infrastructure supports billions of users daily, its reliability is continuously proven against the extreme traffic and hardware demands of Google's global consumer services. As a result, today, nine out of the world’s ten leading AI frontier model labs run on Google Cloud infrastructure because we deliver the throughput and performance they require to innovate. In fact, we spent the last two years co-designing our storage architecture directly with these frontier labs as well as with Google's own foundation model teams.</span></p>\n<p><span style=\"vertical-align: baseline;\"> For large-scale training on object storage, our architecture ensures workloads don’t have to wait on data, and successfully absorbs peak bandwidth demands.  For real-time inference, enterprise platform companies like Salesforce AI Research leverage our architecture to serve complex agentic inference workloads with up to </span><a href=\"https://www.youtube.com/watch?v=m1tpS9peCXU\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">40% fewer GPUs</span></a><span style=\"vertical-align: baseline;\">. We deliver these outcomes through two distinct, purpose-built storage solutions:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cloud Storage Rapid: </strong><span style=\"vertical-align: baseline;\">For organizations that have standardized on cloud-native object storage, </span><a href=\"https://docs.cloud.google.com/storage/docs/rapid/high-performance-storage\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Storage Rapid</span></a><span style=\"vertical-align: baseline;\"> provides Colossus scale and performance directly to accelerators, so they can use the data stored on object storage in their AI workflows. This eliminates the need to migrate data into separate, specialized storage silos to achieve the performance that AI workloads require. A single Rapid bucket pushes the boundaries of object storage, delivering up to 15 TB/s of throughput and 20 million queries per second with sub-millisecond latency. This makes it a strong fit for streaming large training datasets and recovering checkpoints without bottlenecking the network. <br /><br /></span><span style=\"vertical-align: baseline;\">For bursty workloads such as model loading across multiple locations, </span><a href=\"https://docs.cloud.google.com/storage/docs/rapid/rapid-cache\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Rapid Cache</span></a><span style=\"vertical-align: baseline;\"> acts as a read accelerator that co-locates active data directly with TPU and GPU clusters. With no code changes, Rapid Cache delivers up to 2.5 TB/s of aggregate read throughput, taking idle cold-start times from hours to minutes.</span></p>\n</li>\n</ul>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud Managed Lustre:</strong><span style=\"vertical-align: baseline;\"> For demanding AI and HPC workloads that need a parallel file system, there’s </span><a href=\"https://cloud.google.com/products/managed-lustre\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud Managed Lustre</span></a><span style=\"vertical-align: baseline;\">. Built in partnership with DDN, Managed Lustre provides up to 10 TB/s of throughput per instance, absorbing the intense read-write bursts of synchronous checkpointing and reinforcement learning, so that your expensive accelerators remain fully saturated.<br /><br /></span><span style=\"vertical-align: baseline;\">To help organizations scale their workloads without breaking budgets, Managed Lustre’s new </span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/democratizing-managed-lustre-with-lower-cost-and-frictionless-development?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Dynamic Tier</span></a><span style=\"vertical-align: baseline;\"> delivers </span><span style=\"font-style: italic; vertical-align: baseline;\">more Lustre for less </span><span style=\"vertical-align: baseline;\">by consolidating hot and cold data into a single namespace, eliminating traditional caching performance cliffs. Finally, </span><a href=\"https://docs.cloud.google.com/managed-lustre/docs/storage-mirror\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Managed Lustre Cloud Storage Mirror</span></a><span style=\"vertical-align: baseline;\"> reduces the downtime and operational friction inherent in manual data transfers. Instead of you having to write custom scripts that leave expensive compute clusters waiting on files, it automatically synchronizes datasets in the background so they are ready before training begins.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Proven in production at scale</span></h3>\n<p><span style=\"vertical-align: baseline;\">This purpose-built storage foundation is already powering customers’ most demanding AI workloads, helping them extract maximum return on investment from their compute resources.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Thinking Machines Lab</strong><span style=\"vertical-align: baseline;\"> utilizes Cloud Storage Rapid Cache to stabilize read throughput peaks above 1.8 TB/s and achieve an 89% cache hit ratio, completely eradicating rate-limiting surge errors across their multi-region architecture.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Shopify</strong><span style=\"vertical-align: baseline;\"> deployed 50+ unique Rapid Caches across their worldwide footprint, achieving over 2 TB/s peak throughput and up to a 90% latency reduction from their baseline to meet the data demands of their growing compute scale.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Salesforce AI Research</strong><span style=\"vertical-align: baseline;\"> uses Managed Lustre as a high-throughput, low-latency external cache to keep their GPUs fully saturated, driving substantial performance gains for LLM inference over previous hardware generations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Atlassian</strong><span style=\"vertical-align: baseline;\"> adopted Managed Lustre on Google Kubernetes Engine (GKE) to turn preemption interruptions into quick five-minute restores, delivering nearly 5x higher throughput and boosting their GPU utilization by 70% compared to NVMe-based systems.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Harmonic</strong><span style=\"vertical-align: baseline;\"> relies on Managed Lustre to train mathematical reasoning models, eliminating 50% of experiment interruptions, cutting startup times in half, and increasing data retrieval speeds by 15x.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">The path forward</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When advising AI Infrastructure teams designing their stack today, our guidance is straightforward. First, evaluate your token economics rather than just legacy storage metrics. If your chips are waiting on data, optimizing storage is a cost-effective and efficient remedy. Second, avoid creating separate copies of data for every new workload; keep your primary data in a unified foundation and move it to the right tier as needed. Finally, while AI performance grabs the headlines, you can’t create your AI strategy on infrastructure built for a different era. At the same time, AI infrastructure needs enterprise-grade reliability, built-in security, and automated cost discipline for optimized TCO.</span></p>\n<p><span style=\"vertical-align: baseline;\">The future of enterprise AI belongs to organizations that can turn their data into action. Google Cloud enables you to match the speed of your storage to the speed of your compute, so that you maximize your compute investments.</span></p></div>"
  "0c8a170b5eba3665d85a1b97e83828f6":
    "id": "0c8a170b5eba3665d85a1b97e83828f6"
    "title": "COLD RELIC: A Case Study in Impersonation and Compromise"
    "link": "https://cloud.google.com/blog/topics/threat-intelligence/cold-relic-a-case-study-in-impersonation-and-compromise/"
    "published": "2026-11-17 23:00:00"
    "fetched": "2026-11-18 01:41:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Written by: Josh Murchie, John Wolfram, Joseph Spero, Peter Ukhanov, Fernando Tomlinson, Jr., Wesley Shields</span></p>\n<hr />\n<h3><span style=\"vertical-align: baseline;\">Introduction</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Over the past year, Mandiant has responded to a series of linked intrusions demonstrating how Russian cyber espionage group COLD RELIC (formerly tracked as COLDRIVER and UNC4057; also known as Star Blizzard, Callisto, and Gossamer Bear) turns a single cloud compromise into a springboard for ongoing third party compromise and espionage. Most recently, Mandiant investigated a 2026 compromise at a US-based organization where COLD RELIC directly weaponized data, the corporate staff directory, and identities stolen during a late-2025 compromise, which Mandiant also investigated, at a separate US-based organization. </span></p>\n<p><span style=\"vertical-align: baseline;\">COLD RELIC is a Russian state-sponsored threat group that the </span><a href=\"https://www.justice.gov/archives/opa/pr/justice-department-disrupts-russian-intelligence-spear-phishing-efforts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">US Department of Justice (DOJ) has assessed</span></a><span style=\"vertical-align: baseline;\"> operates within Russia's Federal Security Service (FSB). The group is known for implementing sophisticated phishing and malware campaigns with the aim to gain access to information of strategic or political relevance to the Russian government, as well as to leverage compromised access to target compromised individuals’ broader social and professional networks. Once COLD RELIC compromises a target, it uses stolen emails and data to establish authentic pretexts and impersonate contacts when reaching out to subsequent targets. While COLD RELIC has largely maintained a low profile, yielding minimal public reporting relative to other Russia-nexus threat actors, it has been highly successful at compromising high-value targets (including government officials, defense contractors, and non-governmental organizations (NGOs) across Europe and North America) while maintaining a consistent operational tempo.</span></p>\n<p><span style=\"vertical-align: baseline;\">While Google Threat Intelligence Group (GTIG) has </span><a href=\"https://blog.google/threat-analysis-group/google-tag-coldriver-russian-phishing-malware\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">tracked and disrupted</span></a><span style=\"vertical-align: baseline;\"> COLD RELIC phishing campaigns since 2015, recent Mandiant incident response investigations have uncovered critical new insights into the group’s social engineering and post-compromise tradecraft. We are sharing this end-to-end analysis—along with actionable detection and hardening guidance—to help organizations defend against COLD RELIC’s ongoing use of stolen pretexts, localized residential proxies, and cross-cloud identity abuse. As part of our efforts to thwart this threat actor, we issue </span><a href=\"https://knowledge.workspace.google.com/admin/reports/government-backed-attack-alerts\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Government-backed attack alerts</span></a><span style=\"vertical-align: baseline;\"> when we detect COLD RELIC targeting Google accounts. COLD RELIC remains an active threat; GTIG has observed evidence of new phishing operations as recently as November 2026. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Threat Detail</span><strong style=\"vertical-align: baseline;\"> </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Over more than a decade of tracking COLD RELIC alongside Mandiant incident response investigations, we have observed the group continually refine how it leverages data harvested from one intrusion to enable follow-on operations against downstream targets. In late 2025, COLD RELIC downloaded a large volume of data from a US-based organization, searching for names, email addresses, and email archives, likely to fulfill broader intelligence requirements. In 2026, Mandiant investigated a subsequent COLD RELIC intrusion at a second US-based organization where phishing URL parameters and impersonation pretexts indicated that COLD RELIC likely leveraged contact and relationship context from the first organization to target the second.</span></p>\n<p><span style=\"vertical-align: baseline;\">One of the hallmarks of COLD RELIC phishing campaigns is the use of a compromised website as the initial link that will redirect the target to the actual phishing domain. This provides COLD RELIC with a layer of misdirection and hides their phishing domains, while also giving them a chance to fingerprint anyone visiting the link to determine if they should be redirected or not. A COLD RELIC phishing link usually contains a parameter on the end of it with a value that is set by the attacker and often indicates a relationship to a previous victim or what the lure is. For example, a URL might look like these (though this is not always the case):</span></p></div>\n<div class=\"block-paragraph_advanced\"><pre class=\"language-markup\"><code>https://compromised.example.com/some_path/some_file.php?file=&lt;previous_victim_name&gt;\nhttps://compromised.example.com/some_path/some_file.php?ref=&lt;lure_name&gt;</code></pre>\n<p style=\"text-align: center;\"><span style=\"color: #5f6368; display: block; font-size: 16px; font-style: italic; margin-top: 8px; width: 100%;\"><span style=\"vertical-align: baseline;\">Figure 1: Sample URLs incorporating targeted individuals’ names or lure topics</span></span></p></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">During Mandiant’s incident response investigation at the second US-based organization, responders identified that COLD RELIC initiated contact over an encrypted messaging app while impersonating an employee from the first victim organization. In parallel, GTIG correlated a COLD RELIC redirector URL from the intrusion that had been submitted to VirusTotal in June 2026, whose query parameter referenced the first victim organization.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Case Study 1 - Stolen Credentials to Data Exfiltration</span></h3>\n<p><span style=\"vertical-align: baseline;\">During the late-2025 intrusion, GTIG observed COLD RELIC operators compromise the cloud productivity environment of a US-based organization. To gain initial access, COLD RELIC leveraged a residential proxy network in the US located in close geographical proximity to the victim. COLD RELIC authenticated using the stolen credentials of a Super Admin account, in combination with a </span><span style=\"vertical-align: baseline;\">multi-factor authentication</span><span style=\"font-style: italic; vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">(</span><span style=\"vertical-align: baseline;\">MFA) push notification fatigue attack. After the victim user accepted an MFA request, COLD RELIC registered a device model previously unseen within the tenant of the victim organization. COLD RELIC leveraged passkeys, MFA backup codes, and rogue MFA devices to retain access throughout the intrusion.</span></p>\n<p><span style=\"vertical-align: baseline;\">COLD RELIC used the privileges of the compromised Super Admin account to download the contents of the entire organization’s cloud storage drive by both mass sharing files to a COLD RELIC-operated email account and downloading files directly. While operating inside the tenant of the victim organization, COLD RELIC accessed the Admin Console, queried Admin security investigation and email audit logs to check defensive visibility, and viewed, modified, and deleted Alert Center notifications to remove forensic evidence of the initial intrusion. COLD RELIC also exported full employee lists and initiated a domain-wide data export via Google Workspace Customer Takeout using Super Admin privileges. Unlike individual end-user Google Takeout, Customer Takeout is an administrative tenant-wide export tool; these requests are logged in Google Workspace Admin audit logs (</span><code style=\"vertical-align: baseline;\">CUSTOMER_TAKEOUT_CREATED</code><span style=\"vertical-align: baseline;\">), and administrators can also </span><a href=\"https://knowledge.workspace.google.com/admin/users/advanced/allow-or-block-google-takeout\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">disable Google Takeout for users at the organizational level</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Following mass data theft and antiforensics activities, COLD RELIC maintained access to the victim organization for several months and performed additional activities including:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Email inbox sync via OAuth to external email clients</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Reauthentication using unrevoked attacker-enrolled passkeys that persisted across password and session resets and bypassed device registration controls</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Targeted cloud drive document access related to credentials, email archives, personnel information, and other documents relevant to COLD RELIC’s intelligence collection requirements</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">When the threat actor was removed from the victim organization’s infrastructure, GTIG observed COLD RELIC leveraging email accounts impersonating employees of the victim organization. These impersonated accounts were used to target both internal employees and associates within the same professional circles with renewed social engineering attempts.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Case Study 2 - Leveraging Previous Compromise - Initial Approach</span></h3>\n<p><span style=\"vertical-align: baseline;\">During the second intrusion, COLD RELIC demonstrated competency in navigating multi-cloud environments and federated authentication mechanisms. GTIG observed COLD RELIC operators compromise a Microsoft Entra ID user account of a US-based organization that used Entra ID as its federated single sign-on (SSO) identity provider for Google Workspace. To gain initial access, COLD RELIC impersonated an employee of the organization impacted in Case Study 1 to establish a pretext for communications over a secure messaging app. The threat actor ultimately shared phishing links during the course of the conversation. These phishing links, designed to steal credentials and authentication tokens for Entra ID, redirected the victim to document lures relevant to the ongoing conversation in order to avoid raising suspicion. Upon successful authentication using the stolen credentials, COLD RELIC registered and used a new MFA device in the SSO solution to retain access to the user account throughout the intrusion. </span></p>\n<p><span style=\"vertical-align: baseline;\">A redacted and abbreviated version of the social engineering conversation is included below (image generated with LLMs):</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--medium\n      \n      \n        h-c-grid__col\n        \n        h-c-grid__col--4 h-c-grid__col--offset-4\n        \n      \">\n\n      \n      \n        \n        <img alt=\"Redacted, LLM-generated depiction of observed threat actor social engineering engagement\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/Figure_2_Redacted_LLM-generated_depiction_.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 2: Redacted, LLM-generated depiction of observed threat actor social engineering engagement</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">By impersonating someone known in the same professional circles as the new target, COLD RELIC increased their chance of phishing success. Ultimately, in this case, COLD RELIC was able to obtain credentials to the organization and perform bulk download of files accessible in the compromised user’s cloud drive. </span></p>\n<h3><span style=\"vertical-align: baseline;\">Post-Compromise Activity</span></h3>\n<p><span style=\"vertical-align: baseline;\">After gaining initial access to an organization, COLD RELIC registers rogue MFA devices, passkeys, and MFA backup codes to establish long-term persistence. Once persistence is secured, COLD RELIC conducts aggressive data collection and exfiltration operations, accessing email, chat, and cloud storage repositories. While COLD RELIC's primary objective post-compromise is mass collection and download of files and email archives, it simultaneously performs targeted queries for specific terms of interest. In particular, COLD RELIC searches for credentials, personnel information, email archives (.pst files), and documents related to their collection requirements. Additionally, COLD RELIC seeks out data that can support subsequent spear-phishing operations, including organizational rosters, contact lists, resumes, and event schedules to build convincing pretexts for future targets.</span></p>\n<p><span style=\"vertical-align: baseline;\">Beyond seeking out data to support subsequent operations, COLD RELIC also appeared to repurpose the account used in Case Study 2 for follow on targeting. After the compromise, the encrypted messaging application used for the initial approach recorded that the threat actor changed their profile name to a completely new person. GTIG believes this new persona was likely used to continue to target other organizations in the same professional circles in a similar manner to both of the cases documented here.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Outlook and Implications</span></h3>\n<p><span style=\"vertical-align: baseline;\">COLD RELIC’s campaigns demonstrate the convergence of human-centric social engineering and cloud identity abuse. By obtaining access to strategic personnel rosters and operational documents, Russian intelligence services turn legitimate business communications into attack vectors against trusted partners. Their ability to navigate across multiple cloud ecosystems highlights that organizations must defend their entire identity estate holistically. GTIG will continue to track, disrupt, and expose COLD RELIC infrastructure to protect global cloud users.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Remediation and Hardening</span></h3>\n<p><span style=\"vertical-align: baseline;\">As previously mentioned, GTIG has observed COLD RELIC heavily rely on residential proxy networks in the course of their intrusions. Moreover, the group goes one step further in obfuscating their activities by selecting proxies that geolocate to the same approximate location as their victim users, thereby avoiding impossible travel or other heuristic-based alerting mechanisms. GTIG recommends enriching authentication logs with </span><a href=\"https://spur.us/blog/residential-proxy-lateral-movement-risk\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">residential proxy</span></a><span style=\"vertical-align: baseline;\"> and VPN IP reputation feeds, alerting on sudden residential ASN shifts for privileged accounts, and applying conditional access policies to block or detect logons from known proxy networks.</span></p>\n<p><span style=\"vertical-align: baseline;\">In some cases, the severity and scope of COLD RELIC intrusions were amplified due to users storing credentials and other secrets within their organization’s cloud storage platforms. This enabled COLD RELIC to pivot to additional accounts or services that it would not have otherwise been able to access, including users’ personal accounts which are typically unmonitored by their employers. Organizations can implement cloud storage Data Loss Prevention (DLP) policies, such as </span><a href=\"https://knowledge.workspace.google.com/admin/security/create-data-protection-rules\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Workspace’s Security &amp; Data Protection</span></a><span style=\"vertical-align: baseline;\">, to warn or block users attempting to create, upload, or externally share files matching sensitive patterns.</span></p>\n<p><span style=\"vertical-align: baseline;\">In at least one case, GTIG observed that a victim organization identified the intrusion and attempted to remediate COLD RELIC’s access to their cloud tenant via password resets for impacted accounts. However, because the threat actor hijacked sessions and the victim organization failed to also revoke all existing sessions for the accounts in question, COLD RELIC maintained access. In similar circumstances, such as Business Email Compromise (BEC) intrusions, GTIG recommends organizations revoke all user sessions in addition to forcing password resets for impacted accounts.</span><span style=\"vertical-align: baseline;\">Organizations should implement the following recommendations:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Identity &amp; Multi-Factor Authentication </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Enforce Phishing-Resistant MFA (FIDO2 / WebAuthn): Replace SMS, voice, and push notifications with hardware security keys (e.g., Titan Security Keys). Hardware keys are bound to the origin URL and cannot be intercepted by AiTM reverse proxies or approved via fatigue attacks.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Restrict and Audit Passkey Registrations: Monitor identity logs for passkey registrations and rogue device enrollments, particularly on administrative accounts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Harden MFA Registration: Require existing administrators or out-of-band identity verification to approve new MFA devices or secondary authenticators (such as Microsoft Authenticator or passkeys).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Organizations and individuals may consider enrolling in the </span><a href=\"https://landing.google.com/advancedprotection/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Advanced Protection Program</span></a><span style=\"vertical-align: baseline;\">. </span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Session Management &amp; Incident Response </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Mandate Session &amp; OAuth Revocation in BEC Playbooks: When remediating suspected account compromise, password changes alone are insufficient. Administrators must immediately revoke all active browser sessions, refresh tokens, and authorized third-party OAuth app permissions across both Google Workspace and Microsoft Entra ID, and remove any unauthorized passkeys, backup codes, or MFA devices.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Audit Third-Party OAuth Grants: Continuously review authorized third-party applications in Google Workspace and Microsoft 365, flagging unexpected native desktop email clients (e.g., Thunderbird) or external mail services (e.g., Proton Mail).</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Network &amp; Infrastructure Controls </span></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Detect &amp; Block Residential Proxy Logons: Restrict administrative access from consumer ISPs, VPNs, and known residential proxy ASN ranges (e.g., AS5650, AS20115).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Cross-Cloud DLP Policies: Deploy Data Loss Prevention (DLP) rules across cloud storage (Google Drive, OneDrive, SharePoint) to alert on documents containing sensitive terms (e.g., passwords, roster, .pst) or to restrict mass external file-sharing.</span></p>\n</li>\n</ul>\n</ol></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Detections</span></h3>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<thead>\n<tr>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Observed Activity</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">MITRE ATT&amp;CK Mapping</strong></p>\n</th>\n<th scope=\"col\" style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Detection Opportunity</strong></p>\n</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">MFA Fatigue Attack</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1621:</strong><span style=\"vertical-align: baseline;\"> Multi-Factor Authentication Request Generation</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Monitor for MFA Spam:</strong><span style=\"vertical-align: baseline;\"> Alert on multiple failed login or MFA challenge events for a single user in a short timeframe, followed closely by a successful authentication from the same IP address.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">OAuth Abuse &amp; Mail Sync</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1114.002:</strong><span style=\"vertical-align: baseline;\"> Email Collection: Remote Email Collection </span></p>\n<p><strong style=\"vertical-align: baseline;\">T1528:</strong><span style=\"vertical-align: baseline;\"> Steal Application Access Token</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Unapproved OAuth Scopes:</strong><span style=\"vertical-align: baseline;\"> Alert on new OAuth authorizations (</span><code style=\"vertical-align: baseline;\">Authorize</code><span style=\"vertical-align: baseline;\"> event in GWS OAuth logs) granting broad scopes (e.g., </span><code style=\"vertical-align: baseline;\">https://mail.google.com/</code><span style=\"vertical-align: baseline;\">) to non-standard or unapproved email clients like Proton or Thunderbird.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Automated Data Exfiltration Attempt</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1119:</strong><span style=\"vertical-align: baseline;\"> Automated Collection</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Customer Takeout Initiation:</strong><span style=\"vertical-align: baseline;\"> Generate alerts for the creation of any tenant-wide collection or export (e.g., </span><code style=\"vertical-align: baseline;\">Customer Takeout Created</code><span style=\"vertical-align: baseline;\"> in GWS Admin logs), as this is a technique that can result in data exfiltration of an entire tenant.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Data Theft via Bulk Download</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1530:</strong><span style=\"vertical-align: baseline;\"> Data from Cloud Storage </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Anomalous Download Volume:</strong><span style=\"vertical-align: baseline;\"> Monitor logs for spikes in file downloads (e.g. </span><code style=\"vertical-align: baseline;\">Download</code><span style=\"vertical-align: baseline;\"> events in GWS Drive logs) by a single user within a short period of time, particularly originating from non-corporate ASNs/IPs or known residential proxy networks.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Data Theft via External Sharing</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1567.002:</strong><span style=\"vertical-align: baseline;\"> Exfiltration to Cloud Storage</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">External File Sharing Anomalies:</strong><span style=\"vertical-align: baseline;\"> Monitor logs for a spike in documents being shared externally (e.g., GWS Drive </span><code style=\"vertical-align: baseline;\">User Sharing Permissions Change</code><span style=\"vertical-align: baseline;\"> or </span><code style=\"vertical-align: baseline;\">Visibility</code><span style=\"vertical-align: baseline;\"> changed to </span><code style=\"vertical-align: baseline;\">shared_externally</code><span style=\"vertical-align: baseline;\">), particularly to free email providers (e.g., </span><code style=\"vertical-align: baseline;\">@gmail.com</code><span style=\"vertical-align: baseline;\">).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Device &amp; Passkey Enrollment</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1098.005:</strong><span style=\"vertical-align: baseline;\"> Account Manipulation: Device Registration</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">New MFA/Device Enrollment:</strong><span style=\"vertical-align: baseline;\"> Alert on new passkey enrollments (e.g., GWS </span><code style=\"vertical-align: baseline;\">Passkey enrolled</code><span style=\"vertical-align: baseline;\"> events) or device registrations (GWS </span><code style=\"vertical-align: baseline;\">Device Registered</code><span style=\"vertical-align: baseline;\"> events), particularly when originating from unexpected geographic locations or immediately following an MFA fatigue pattern.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Use of MFA Backup Codes</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1078.004:</strong><span style=\"vertical-align: baseline;\"> Valid Accounts: Cloud Accounts</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Backup Code Usage:</strong><span style=\"vertical-align: baseline;\"> Monitor logs for authentications with MFA backup codes (e.g., GWS User logs where the Login Challenge Type is </span><code style=\"vertical-align: baseline;\">Backup code</code><span style=\"vertical-align: baseline;\">), particularly if it originates from a non-corporate ASN or known residential proxy networks.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Impairing Defenses via Alert Deletion</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1562.008:</strong><span style=\"vertical-align: baseline;\"> Impair Defenses: Disable or Modify Cloud Logs / Alerts</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Alert Center Tampering:</strong><span style=\"vertical-align: baseline;\"> Alert on any user modifying or deleting security alerts (e.g., </span><code style=\"vertical-align: baseline;\">Batch Delete Operation Performed</code><span style=\"vertical-align: baseline;\"> events in GWS Admin logs), particularly if the user is deleting alerts related to their own account or critical severity alerts (e.g., GWS Government-backed attack alerts).</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Internal Reconnaissance via User List</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1087.004:</strong><span style=\"vertical-align: baseline;\"> Account Discovery: Cloud Account</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Directory Export:</strong><span style=\"vertical-align: baseline;\"> Alert on domain user exports (e.g., </span><code style=\"vertical-align: baseline;\">User List Download</code><span style=\"vertical-align: baseline;\"> events in GWS Admin logs). While admins may do this legitimately, it should be heavily scrutinized, particularly when performed from unknown devices.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Forensic Counter-Investigation</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1082:</strong><span style=\"vertical-align: baseline;\"> System Information Discovery</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Admin Log Querying:</strong><span style=\"vertical-align: baseline;\"> Monitor logs for users performing audit log queries (e.g., </span><code style=\"vertical-align: baseline;\">Investigation Query</code><span style=\"vertical-align: baseline;\"> events in GWS Admin logs). Unexpected querying of security, access, or audit logs may indicate a threat actor attempting to perform counter-forensics.</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Searching for Passwords &amp; Archives</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">T1083:</strong><span style=\"vertical-align: baseline;\"> File and Directory Discovery </span></p>\n<p><strong style=\"vertical-align: baseline;\">T1552.001:</strong><span style=\"vertical-align: baseline;\"> Credentials In Files</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Sensitive File Search:</strong><span style=\"vertical-align: baseline;\"> Monitor logs for file directory keyword searches (e.g., </span><code style=\"vertical-align: baseline;\">Item search performed</code><span style=\"vertical-align: baseline;\"> events in GWS Drive logs) containing terms related to archives or credentials such as </span><code style=\"vertical-align: baseline;\">.pst</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">.bak</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">password</code><span style=\"vertical-align: baseline;\">, </span><code style=\"vertical-align: baseline;\">cred</code><span style=\"vertical-align: baseline;\">, or repeated accesses/downloads of documents explicitly titled with credential-related keywords.</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n</div>\n</div></div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Google Security Operations (SecOps)</span></h3>\n<p><span style=\"vertical-align: baseline;\">Google SecOps customers have access to these broad category rules and more under the Mandiant Frontline Threats rule pack. The activity discussed in the blog post is detected in Google SecOps under the rule names:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace Successful MFA Fatigue Attack</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace Customer Takeout Initiated</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace Alert Center Alert Deletion</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace Directory User List Download</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace Drive Bulk External or Freemail File Sharing</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace Device or Passkey Enrollment Following MFA Fatigue</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Google Workspace OAuth Broad Mail Scope Granted to Unapproved Client</span></p>\n</li>\n</ul></div>"
  "f27899d20659994698c5b0a97ca85872":
    "id": "f27899d20659994698c5b0a97ca85872"
    "title": "Building Sovereign AI in Europe, With Europe: Our New Startup Accelerator"
    "link": "https://cloud.google.com/blog/topics/startups/sovereign-ai-on-your-terms-our-new-startup-accelerator-is-open/"
    "published": "2026-11-17 17:30:00"
    "fetched": "2026-11-18 01:41:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today we’re announcing an open call for applications for the </span><a href=\"http://startup.google.com/programs/accelerator/sovereign-ai/europe-israel/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator: Sovereign AI</span></a><span style=\"vertical-align: baseline;\">. Available in Europe and Israel, this initiative supports startups that are building cutting-edge AI solutions for European regulatory environments.</span></p>\n<p><span style=\"vertical-align: baseline;\">Artificial intelligence represents an estimated </span><a href=\"https://cms.implementconsultinggroup.com/media/uploads/articles/2024/The-economic-opportunity-of-generative-AI-in-the-EU/The-economic-opportunity-of-AI-in-the-EU.pdf\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">€1.2 trillion economic opportunity for Europe</span></a><span style=\"vertical-align: baseline;\">. To realize this potential, European enterprises and public institutions need to adopt advanced AI while also meeting crucial data governance requirements, including the </span><a href=\"https://artificialintelligenceact.eu/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">EU AI Act</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.nis-2-directive.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">NIS2</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://www.eiopa.europa.eu/digital-operational-resilience-act-dora_en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">DORA</span></a><span style=\"vertical-align: baseline;\">, and national frameworks such as </span><a href=\"https://www.lsti-certification.fr/en/Company-offers/Cybersecurity/SecNumCloud\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SecNumCloud</span></a><span style=\"vertical-align: baseline;\"> and </span><a href=\"https://www.bsi.bund.de/EN/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/Kriterienkatalog-C5/kriterienkatalog-c5_node.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">BSI's cloud security and sovereignty principles</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">We want ambitious founders to build in Europe, with solutions made in Europe. For startups, digital sovereignty cannot mean settling for second-rate tools or getting locked into a single rigid stack. It means co-engineering with Europe's tech ecosystem so founders can scale on their own terms from day one: for instance combining frontier Gemini models, open-weight models like Gemma and Mistral, and verifiable data residency and cryptographic controls delivered with local European sovereign partners.</span></p>\n<h3><span style=\"vertical-align: baseline;\">How it works</span></h3>\n<p><span style=\"vertical-align: baseline;\">This equity-free, 15-week hybrid program includes virtual and in-person sessions connecting founders with Google engineers, regulatory experts, and local partners. Selected startups receive hands-on architectural mentorship, 1:1 pairing with Google Cloud engineers, and advisory support to prepare for EU AI Act Regulatory Sandboxes.</span></p>\n<p><span style=\"vertical-align: baseline;\">Participants will gain direct support to deploy across Google Cloud’s tiered sovereign portfolio:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sovereign cloud infrastructure</strong><span style=\"vertical-align: baseline;\">: From regional data controls and external key management (data boundary) to partner-operated clouds (such as S3NS in France and Thales in Germany) and fully air-gapped Google Distributed Cloud environments.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Auditable, private AI</strong><span style=\"vertical-align: baseline;\">: Fine-tuning and deploying open-weight models like the Gemma family (including MedGemma) in sovereign environments for verifiable control over data and operations.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Ecosystem and investors access</strong><span style=\"vertical-align: baseline;\">: Direct engagement with European sovereign cloud operators, system integrators, and institutional investors to compress enterprise sales cycles.</span></p>\n</li>\n</ul>\n<h3><span style=\"vertical-align: baseline;\">Who should apply</span></h3>\n<p><span style=\"vertical-align: baseline;\">We are selecting a small, high-touch cohort of late-seed to post Series A startups headquartered across Europe and Israel with strong traction that use AI to handle sensitive, regulated workloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">We’re specifically seeking startups focused on:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Government and public service technologies</strong><span style=\"vertical-align: baseline;\"> including sovereign document processing, citizen service portals, municipal operations, smart utilities, and civic emergency grids (defense applications excluded).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Healthcare and life sciences</strong><span style=\"vertical-align: baseline;\"> including clinical trial analytics, electronic health records (EHR/EHDS), diagnostic copilots, and hospital operations that meet compliance requirements for GDPR and the </span><a href=\"https://health.ec.europa.eu/ehealth-digital-health-and-care/european-health-data-space-regulation-ehds_en\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">European Health Data Space</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Regulated finance</strong><span style=\"vertical-align: baseline;\"> including credit risk modeling, anti-money laundering pipelines, fraud detection, credit underwriting pipelines, and claims processing.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Cybersecurity and data trust</strong><span style=\"vertical-align: baseline;\"> including enterprise threat detection and response, supply chain security, vulnerability scanning, and civilian IT infrastructure protection.</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">If you’re a founder building sovereign AI to power Europe’s digital autonomy, we want to help you scale your impact. You can apply on the </span><a href=\"http://startup.google.com/programs/accelerator/sovereign-ai/europe-israel/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator page</span></a><span style=\"vertical-align: baseline;\">.  The deadline for applications is January 15th, 2027.</span></p>\n<p><span style=\"vertical-align: baseline;\"><span style=\"vertical-align: baseline;\">Hear from past participants how the accelerator program helped supercharge their products:</span></span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1_9zF6Ot7.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">\"In sovereign and regulated environments, proving tech works is only part of the challenge. Having direct access to Google Cloud engineers who understand these constraints can save a young company a great deal of time.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Denise Williams, Managing Director, Dysplasia</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2_79uocp3.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">\"If you are building deep-tech for regulated and sovereign markets, you cannot afford to build in isolation. The technical depth, mentorship, and validation you gain through the Accelerator cut through years of trial and error.\" </span></p>\n<p><span style=\"vertical-align: baseline;\">Maria Terzi, Co-Founder and CEO, Malloc</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3_1FPVKSW.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">\"Building in regulated spaces requires expert guidance that flags hidden hurdles. This cohort provides the technical clarity and expert access needed to turn strict compliance into your greatest competitive advantage.\" </span></p>\n<p><span style=\"vertical-align: baseline;\">Gabriela Isas, Co-Founder and CEO, Good With</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"4\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/4_CCgjVhA.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">\"In regulated markets your customers will ask where data lives and how AI makes decisions. The Accelerator programme helps you build those answers into your architecture from day one.\" </span></p>\n<p><span style=\"vertical-align: baseline;\">Kartik Dabbiru, Founder and Chief Executive Officer</span><span style=\"vertical-align: baseline;\">, ComplyStream</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"5\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/5_aG2xAFA.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">\"Operating in regulated markets doesn't stop you from using frontier AI; it means designing for control from day one. The Accelerator programme helped us navigate that balance effectively.\"</span></p>\n<p><span style=\"vertical-align: baseline;\">Juan Mir de Leonardo, Product Director, Connect by Circular-Lab</span></p></div>"
  "3c46c0d7a13219925da2b9d1f0bb7f0e":
    "id": "3c46c0d7a13219925da2b9d1f0bb7f0e"
    "title": "Sovereign AI in Europe: New ways to control your AI stack"
    "link": "https://cloud.google.com/blog/products/identity-security/sovereign-ai-on-your-terms-made-with-europe/"
    "published": "2026-11-17 17:00:00"
    "fetched": "2026-11-18 01:41:31"
    "summary": "<div class=\"block-paragraph_advanced\"><p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Today in Brussels, public sector leaders, policymakers and partners are meeting at the Sovereign AI Summit to discuss how to build the next decade of Europe's public services, healthcare, and finance with AI under European control. We're here with our European partners to help deliver it.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Achieving that goal takes more than deciding where data is stored. When we talk with European organizations, we hear four common questions from them: </span></p>\n<ol style=\"text-align: left;\">\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Will choosing more control mean settling for less capable AI? </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Who can access our data, and can we prove to regulators that our controls work?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">Will the value that organizations create with AI stay in Europe?</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p style=\"text-align: justify;\"><span style=\"vertical-align: baseline;\">How can we keep AI running reliably?</span></p>\n</li>\n</ol>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">In May 2025, we </span><a href=\"https://cloud.google.com/blog/products/identity-security/google-advances-sovereignty-choice-and-security-in-the-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">introduced a portfolio</span></a><span style=\"vertical-align: baseline;\"> of sovereign cloud offerings for customers to match their desired level of control to each workload. In February, we </span><a href=\"https://cloud.google.com/blog/products/identity-security/delivering-a-secure-open-sovereign-digital-world\"><span style=\"text-decoration: underline; vertical-align: baseline;\">set out the commitments</span></a><span style=\"vertical-align: baseline;\"> behind that portfolio, covering local investment, operational continuity, customer control over data, and open technology. </span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Today, we’re building on these commitments. Gemini models are coming to Google Cloud Dedicated, our partner-operated cloud, expanding model choice beyond the open models already available in the model garden. We are also announcing new capabilities for cryptographic key control and compliance, and new work with European software companies and startups.</span></p>\n<h3 style=\"text-align: left;\"><strong style=\"vertical-align: baseline;\">Bringing Google AI across our sovereign portfolio</strong></h3>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Sovereignty is not one-size-fits-all, so </span><a href=\"https://cloud.google.com/sovereign-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sovereign Cloud from Google</span></a><span style=\"vertical-align: baseline;\"> offers three ways to run a workload. First, Google Cloud Data Boundary applies data residency, access, and encryption controls on our public cloud. A second option is Google Cloud Dedicated, which is operated by an independent local partner on isolated infrastructure. And finally, Google Distributed Cloud runs in a customer's own data center connected or fully air-gapped. </span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Select Gemini models are already available in Google Cloud with a </span><a href=\"https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/data-residency\"><span style=\"text-decoration: underline; vertical-align: baseline;\">commitment</span></a><span style=\"vertical-align: baseline;\"> to perform machine-learning processing of customer data in-region for these models, including within the EU. It is also </span><a href=\"https://cloud.google.com/blog/topics/hybrid-cloud/gemini-is-now-available-anywhere\"><span style=\"text-decoration: underline; vertical-align: baseline;\">available</span></a><span style=\"vertical-align: baseline;\"> with Google Distributed Cloud. And with today’s announcement that Gemini is coming to Google Cloud Dedicated, organizations that require a locally operated cloud will be able to use it there too. </span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Many teams also want open models, or models they have tuned themselves. In France, S3NS has made managed model serving and inference </span><a href=\"https://www.s3ns.io/en/news/ai-PREMI3NS-model\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">generally available</span></a><span style=\"vertical-align: baseline;\"> on PREMI3NS, its cloud built on Google Cloud Dedicated. Teams can deploy open models from providers such as Mistral and Google through Model Garden, or bring their own models. S3NS operates the environment, designed so the deployed models and prompts remain within the PREMI3NS environment under S3NS's control.</span></p>\n<h3 style=\"text-align: left;\"><strong style=\"vertical-align: baseline;\">Keeping customers in control of access and keys</strong></h3>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">For many European organizations, data access, encryption key access and services access dictate their sovereignty posture. On our public cloud, customers can already see when Google personnel access their data and why, approve or deny that access with </span><a href=\"https://cloud.google.com/assured-workloads/access-transparency/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Access Transparency</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://cloud.google.com/assured-workloads/access-approval/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Access Approval</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://cloud.google.com/assured-workloads/key-access-justifications/docs/overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Key Access Justifications</span></a><span style=\"vertical-align: baseline;\">. Customers who want  more control can hold their encryption keys </span><a href=\"https://cloud.google.com/kms/docs/ekm\"><span style=\"text-decoration: underline; vertical-align: baseline;\">outside Google Cloud</span></a><span style=\"vertical-align: baseline;\">, which enables them to deny access to their data for any reason. Together, these controls help ensure the customer controls any and all access to their data.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">When customers hold keys outside Google Cloud, every key request has to travel to an external system, which can add latency and availability risk. Confidential External Key Management (cEKM), currently in preview, is designed to remove that trade-off: Customers, or their chosen local partner, hold and control access to the root keys outside Google Cloud, while key operations run inside a hardware-attested </span><a href=\"https://cloud.google.com/confidential-computing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Confidential Computing</span></a><span style=\"vertical-align: baseline;\"> environment designed to run with the low latency and reliability that data-intensive workloads, including AI, demand.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Customers can also ask trusted local partners to hold their keys external from Google infrastructure. A new partnership with Telefónica in Spain (currently in preview) expands customer options beyond existing European partnerships France, Germany, Italy, Spain.  </span></p>\n<h3 style=\"text-align: left;\"><strong style=\"vertical-align: baseline;\">Helping customers demonstrate compliance to regulators</strong></h3>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Auditing sovereignty controls and requirements is not only difficult, it often requires engineering effort. To help make audits smoother, we are introducing </span><a href=\"https://cloud.google.com/blog/products/identity-security/inside-the-new-data-boundary-experience\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Boundary</span></a><span style=\"vertical-align: baseline;\"> frameworks that map local and regional regulatory requirements to enforced, auditable controls. A framework for </span><a href=\"https://docs.cloud.google.com/assured-workloads/docs/control-packages/switzerland-data-boundary\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Switzerland</span></a><span style=\"vertical-align: baseline;\"> is available today, and a framework for the EU's Digital Operational Resilience (DORA) Act is planned for financial services organizations.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">With </span><a href=\"https://cloud.google.com/products/audit-manager/\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Audit Manager</span></a><span style=\"vertical-align: baseline;\">, customers can start from a ready-made framework, adapt it to their own policies, and give auditors continuous, machine-readable evidence, designed to keep customer data within their designated boundary.</span></p>\n<h3 style=\"text-align: left;\"><strong style=\"vertical-align: baseline;\">Building with European operators, software vendors, and startups</strong></h3>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Sovereignty also depends on who operates the technology, and whether the value it creates stays local. That's why we work with European companies at every layer: those that operate the cloud, those that build software for it, and the startups that will build what comes next.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Google Cloud Dedicated is designed so that the local partner controls the environment, can block software updates in exceptional circumstances, and can keep operating for up to 12 months in the unlikely scenario that its Dedicated instance connection to Google is severed. These design choices sit alongside the </span><a href=\"https://cloud.google.com/blog/products/identity-security/delivering-a-secure-open-sovereign-digital-world\"><span style=\"text-decoration: underline; vertical-align: baseline;\">commitments</span></a><span style=\"vertical-align: baseline;\"> we made in February, including that should Google receive an order from a national government to suspend or terminate the provision of Google Cloud's operations provided from any country, we will seek to limit, modify, or object to any such order using all available legal avenues.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">In France, PREMI3NS from S3NS has achieved SecNumCloud 3.2 qualification from ANSSI, France's national cybersecurity agency. With Thales, we are extending Google Cloud Dedicated to Germany (currently in preview), to enable a sovereign hyperscale capability across the EU.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">Regulated workloads often stall because the security, identity, and monitoring tools that teams depend on are not available in a sovereign environment. More than a </span><a href=\"https://cloud.google.com/blog/products/identity-security/how-isvs-are-unlocking-european-workloads-on-google-cloud-dedicated\"><span style=\"text-decoration: underline; vertical-align: baseline;\">dozen software vendors have now validated</span></a><span style=\"vertical-align: baseline;\"> their products on Google Cloud Dedicated, including European providers such as Memority and Tsuga.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">We also want to help the new companies and skills that AI is creating  to take root in Europe. The new </span><a href=\"https://startup.google.com/programs/accelerator/sovereign-ai/europe-israel/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google for Startups Accelerator: Sovereign AI</span></a><span style=\"vertical-align: baseline;\"> is an equity-free program that gives startups in regulated sectors support from Google engineers, mentorship, and access to local cloud providers.</span></p>\n<h3 style=\"text-align: left;\"><strong style=\"vertical-align: baseline;\">What comes next</strong></h3>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">We are continuing to build on the strategy we set in 2025: giving customers control that they can verify, a choice in  how they operate in the cloud and who operates the environment, and access to advanced AI regardless of your deployment choices. We will keep bringing more of our AI platform to partner-operated and on-premises environments, extending access and key controls to more services, and adding frameworks for more regulations, together with the European partners who operate these services.</span></p>\n<p style=\"text-align: left;\"><span style=\"vertical-align: baseline;\">To learn more, visit </span><a href=\"https://cloud.google.com/sovereign-cloud\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Sovereign Cloud from Google</span></a><span style=\"vertical-align: baseline;\"> or </span><a href=\"https://cloud.google.com/contact\"><span style=\"text-decoration: underline; vertical-align: baseline;\">talk to a sovereign specialist</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
