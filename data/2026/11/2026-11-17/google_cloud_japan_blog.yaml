  "06ac5d58f14dfb19fb22a75533fad558":
    "id": "06ac5d58f14dfb19fb22a75533fad558"
    "title": "Google Cloud、日本のサイバーセキュリティ強化と、 AI の導入や人材育成を加速する新たな取り組みを発表"
    "link": "https://cloud.google.com/blog/ja/products/gcp/announces-initiatives-to-strengthen-cybersecurity-and-accelerate-ai/"
    "published": "2026-11-17 10:00:00"
    "fetched": "2026-11-17 15:39:35"
    "summary": "<div class=\"block-paragraph\"><p>Google Cloud の CEO である Thomas Kurian（トマス キュリアン）は昨日、片山さつき財務大臣と会談し、日本のサイバーセキュリティの強化と、全国規模での AI スキル習得および業務への導入を支援する、Google Cloud の新たな取り組みを発表しました。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"TK Photo\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/TK_Photo.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p>日本はいま、巧妙化するサイバー攻撃と、少子高齢化に伴う働き手の減少という 2 つの大きな課題を抱えています。Google Cloud は、最新のセキュリティ技術とソブリン クラウドの提供、パートナーと連携した AI 人材の育成を通じて、こうした課題に取り組む日本の企業や行政機関を支援します。</p><h3><b>AI によるサイバーセキュリティ強化とソブリン クラウド基盤</b></h3><p>日本の企業や重要インフラ、行政機関を標的としたランサムウェアや高度なサイバー攻撃が相次ぎ、高リスクな脆弱性への迅速な対応と、機密性の高いデータを国内で安全に守る基盤の整備が急務となっています。</p><p><b>1. AI を活用したサイバーセキュリティの強化</b></p><p>政府が 11 月 6 日に決定した「サイバーセキュリティ緊急対策パッケージ」では、AI を活用した脆弱性の早期発見、情報収集および分析体制の強化、高度な専門人材の確保などが柱に掲げられ、AI 時代にふさわしいサイバーセキュリティへの移行が打ち出されました。Google Cloud は、Google Cloud、Wiz、Mandiant、Google DeepMind の技術を組み合わせて、脆弱性の発見から修復までを支援します。Wiz Research も最近、PHP の深刻な脆弱性「PHP2Shell」の発見に関わり、開発元と連携した脆弱性の公表に貢献しました。今回、日本国内の行政機関や重要インフラの防御力を一層高めるため、次の 3 つの取り組みを進めます。</p><ul><li><b>サイバーセキュリティ向けフロンティア AI モデルの早期提供</b>: 国家サイバー統括室 (NCO) やデジタル庁などの行政機関、金融機関、重要インフラ事業者に対し、サイバーセキュリティ能力を強化した最新のフロンティア AI モデルである Gemini 4 Carbon for Cyber と、脆弱性の検知やコード修復を支援する<a href=\"https://cloud.google.com/security/codemender\"> CodeMender</a> への早期アクセスを提供します。</li><li><b>無償の脆弱性診断プログラムである</b> <a href=\"https://www.wiz.io/ja-jp/blog/scan-for-good-for-japan\" target=\"_blank\"><b>Scan for Good</b></a><b> の提供開始:</b> 重要な政府機関や地方公共団体などを対象に、AI を活用した Wiz Red Agent で外部から脆弱性を診断し修正方法の案内とあわせて無償で提供します。攻撃者に悪用される前に、リスクを見つけて対処できるよう支援します。</li><li><b>脅威インテリジェンスの共有:</b> Google Threat Intelligence Group (GTIG) および Mandiant は、主要省庁との連携を深め、最新の脅威インテリジェンスを日本の行政機関や重要インフラ企業と共有します。</li></ul><p><b>2. 国内パートナーと進めるソブリン クラウドと行政向け AI 基盤の提供</b></p><p>Google Cloud は、サイバー攻撃への備えとともに、企業や行政機関が重要なデータや知的財産を守りながら、最新のクラウドや AI を安心して使いこなせる基盤づくりも進めています。</p><ul><li><b>国内パートナーとの「</b><a href=\"https://cloud.google.com/distributed-cloud-air-gapped?hl=ja&amp;e=48754805\"><b>Google Distributed Cloud エアギャップ</b></a><b>」の提供拡大</b>:<br /> Google Distributed Cloud エアギャップは、厳格なデータ主権や規制要件に対応し、完全な非インターネット環境でクラウドおよび AI を提供するソブリンクラウドソリューションです。</li></ul><p>2025年7月から販売パートナーとして本製品を提供していたNTTデータが、運用まで担えるパートナーの要件を他社に先駆けて満たし、導入から運用まで一貫して支援する体制が整ったことを 2026年11月13日に<a href=\"https://www.nttdata.com/global/ja/news/topics/2026/111301/\" target=\"_blank\">発表</a>しました。</p><p>また、富士通株式会社と日本電気株式会社も Google Distributed Cloud エアギャップの販売パートナーに加わる予定です。Google Cloud は、信頼できる国内パートナー各社との連携で、国内にデータの運用と主権を保った安全なクラウドと AI の活用を支援します。</p><ul><li><b>行政機関および自治体向けの</b> <a href=\"https://cloud.google.com/blog/ja/topics/public-sector/gemini-for-government-unlocking-the-next-wave-of-public-sector-innovation?e=48754805&amp;hl=ja\"><b>Gemini for Government</b></a><b> の提供予定</b>: 国内でのデータ処理に対応した行政機関向けの Gemini for Government の提供を今後開始し、国や地方自治体が安全性を確保しながら行政ワークフローを自動化し、住民サービスを高度化できるよう支援します。</li></ul><h3><b>日本の労働力不足を AI で補う、実践的な人材育成と導入支援</b></h3><p>Gemini をはじめとする AI 技術は、現場の生産性を高める力になります。Google Cloud は、日本の働き手や組織が日々の業務で AI エージェントを即座に活用できるよう、新たな取り組みを開始します。</p><p><b>1. 中小企業向けに Google Workspace の特別オファーを世界に先駆けて提供開始</b></p><p>日本国内ではすでに 10 万社、280 万人が Google Workspace を利用しています。12 月 9 日より Google Workspace に Gemini エージェントが標準機能として順次搭載され、専任の IT 部門を持たない中小企業でも、システム構築や移行作業なしで AI を実務に導入できるようになります。この導入を後押しするため、2026 年 12 月 9 日から 2027 年 3 月 31 日まで、日本国内で従業員 50 名以下の新規のお客様を対象に、Google Workspace（Starter、Standard、Plus の各プラン）と Gemini Enterprise Business edition を 15% 割引で提供します。基本枠を超えた従量課金 (PAYG) についても、2027 年 1 月から同様の割引を適用します。</p><p><b>2. AI、クラウド、サイバーセキュリティ人材の育成と認定資格バウチャーの無償提供</b></p><p>Google は 2019 年にデジタルスキル トレーニングを提供するプロジェクト「Grow with Google」を日本で開始し、全国 47 都道府県の自治体やパートナー企業および団体と連携して、日本全国のべ 1,000 万人以上の方に、オンライン講座や対面式のセミナーを提供してきました。</p><p>こうした実績をもとに、Google Cloud は国内のパートナー企業とともに、2030 年までに 100 万人の AI、クラウド、サイバーセキュリティの人材を育成することを目指します。実際には、オンデマンドで学べる <a href=\"https://www.skills.google/\" target=\"_blank\">Google Skills</a> のコースとハンズオン ラボ、企業が AI エージェントを自社で作れるよう支援する <a href=\"https://cloud.google.com/solutions/in-house-development-support?e=48754805\">Tech Acceleration Program (TAP)</a>、脅威分析やインシデント対応を学べる<a href=\"https://cloud.google.com/learn/security/mandiant-academy-courses?e=48754805&amp;hl=ja#upcoming-and-on-demand-courses\"> Mandiant Academy</a> などを通じて、AI エージェントを作り、運用し、安全に守れるエンジニアや開発者と、サイバー攻撃に対応できるセキュリティ エンジニアを全国で増やします。</p><p>さらに、実践的なスキル習得と資格取得を後押しするため、計 2 万名に以下の無償提供を実施します。</p><ul><li><b>「</b><a href=\"https://grow.google/intl/ja_jp/ai-professional/?srsltid=AYCX9vKju2A68HD-7vdinH6AXGSJTOlEp3vDmHo8VQN9GvfMK34cEkGZ\" target=\"_blank\"><b>Google AI プロフェッショナル認定証</b></a><b>」の受講アカウント（1 万名）</b>: 日本リスキリングコンソーシアムと連携し、基礎から実践的な AI 活用スキルまでを学べる無料受講アカウントを配布します。</li><li><b>「</b><a href=\"https://cloud.google.com/learn/certification/generative-ai-leader?hl=ja\"><b>Generative AI Leader」</b></a><b>の認定試験バウチャー（1 万名）</b>: 組織内で生成 AI の導入と業務変革を推進する人材の育成に向け、Google Cloud 公式認定資格の試験受験料を無償提供します。</li></ul><p>Google Cloud はこれからも、日本の政府、自治体、パートナー企業、教育機関とともに、安全で信頼できるクラウド基盤の提供と一人ひとりのスキル習得を支え、日本の持続的な経済成長と安全なデジタル社会の実現に貢献していきます。</p></div>"
  "94b1ca9d9f31421111925fd0b23e5b6a":
    "id": "94b1ca9d9f31421111925fd0b23e5b6a"
    "title": "Gartner Magic Quadrant のデータ レイクハウス プラットフォーム部門で、Google が「ビジョンの完全性」において最高評価を獲得"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/google-is-a-leader-in-the-gartner-magic-quadrant-for-data-lakehouse-platforms/"
    "published": "2026-11-17 09:00:00"
    "fetched": "2026-11-17 15:39:35"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 13 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/google-is-a-leader-in-the-gartner-magic-quadrant-for-data-lakehouse-platforms?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、Gartner が初めて発行したデータ レイクハウス プラットフォーム部門の Magic Quadrant においてリーダーの一社に選出され、「ビジョンの完全性」において最高評価を獲得しました。この評価は、お客様が日々直面している根本的な変化を裏付けるものだと確信しています。エージェントの時代において、エンタープライズ レイクハウスはもはや単なる受動的なデータ リポジトリではありません。あらゆるデータにわたってエージェントが推論と行動を行うための基盤へと進化しているのです。</span></p>\n<p><span style=\"vertical-align: baseline;\">もともとレイクハウスは、オープンで低コストなストレージにデータ ウェアハウスの信頼性を実現するために登場しました。しかし今、この分野を定義するベンチマークは新たなフェーズへと移行しています。先進的な企業は、静的なレポート分析から、運用のモニタリング、異常検知、ビジネス ワークフローの実行をリアルタイムで行う自律型 AI エージェントへと急速に移行を進めています。この変化に対応するため、企業には、データをあらかじめ移動することなく、何千ものエージェントが自社のあらゆるデータに対して継続的に読み取り、推論し、実行できるプラットフォームが求められています。破損しやすいパイプライン、ストレージの重複、一貫性を欠いたガバナンスに悩まされる従来の断片化されたデータスタックでは、エージェント規模のワークロードに必要なスケール、パフォーマンス、レイテンシに対応することは到底不可能です。</span></p>\n<p><span style=\"vertical-align: baseline;\">こうした複雑さや隠れたコストを解消すべく、Google はスタックのすべてのレイヤでボーダーレスな Lakehouse をゼロから設計しました。エージェントがペタバイト規模のデータ全体を横断して推論できるように特別に設計されたボーダーレス Lakehouse は、マルチクラウド、データ プラットフォーム、SaaS アプリケーションに分散したデータ資産を統合します。これにより、管理されたビジネス コンテキストに基づいてエージェントをグラウンディングし、データが存在するその場所で Gemini を直接活用できます。これにより、チームはインフラストラクチャの管理に追われることなく、ビジネス成果のオーケストレーションへとシフトできます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_RU0bsvP.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">グローバルなデータ フットプリントをその場で有効化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">ほとんどの組織にとって、AI のスケーリングを阻む最大の障壁は、企業データが複数のクラウド、オペレーショナル データベース、SaaS プラットフォームに分散していることです。これらすべてのデータを 1 つの物理的な場所に移動させるには時間がかかり、コストがかさむだけでなく、ガバナンス上のリスクも生じます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google の</span><a href=\"https://cloud.google.com/products/lakehouse\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">ボーダーレス Lakehouse</strong></a><span style=\"vertical-align: baseline;\"> は、分散環境を橋渡しし、データを有効化するための基盤として機能します。オープンな </span><strong style=\"vertical-align: baseline;\">Apache Iceberg</strong><span style=\"vertical-align: baseline;\"> を基盤とするこのテクノロジーは、マルチクラウド、SaaS、運用データベースに分散したデータを統合し、ガバナンスの効いた単一のファブリックへと接続します。高コストなデータの複製や複雑な移行を行わずに、AWS、Azure、Google Cloud に分散したデータセットの分析を即座に開始できるため、組織は以下のメリットを享受できます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">パフォーマンスを犠牲にしないオープン性:</strong><span style=\"vertical-align: baseline;\"> BigQuery や Managed Service for Apache Spark を使用し、オープンな Iceberg テーブル上で直接アナリティクスや AI を実行できます。ネイティブ ストレージと同等の優れた費用対効果を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">高速クロスクラウドの優れた費用対効果:</strong><span style=\"vertical-align: baseline;\"> </span><strong style=\"vertical-align: baseline;\">Cross-Cloud Interconnect とインテリジェント キャッシュ</strong><span style=\"vertical-align: baseline;\">により、AWS と Azure へのプライベートな高速パスを簡単かつ費用対効果の高い方法で確立できます。クエリがアクセスするアクティブなデータブロックのみをキャッシュすることにより、レイクハウスは重複するルックアップをローカルで処理し、データ所在地を維持しながら、変動するデータ送信料金を排除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">垂直統合されたセキュリティとガバナンス:</strong><span style=\"vertical-align: baseline;\"> データの保存場所に関わらずデータを保護することは、妥協できない重要事項です。</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse ランタイム カタログ</strong></a><span style=\"vertical-align: baseline;\">における</span><strong style=\"vertical-align: baseline;\">認証情報の払い出し</strong><span style=\"vertical-align: baseline;\">により、データ所在地に関係なく、セキュリティ ポリシーがエージェントに直接適用されます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">ドイツの大手銀行 </span><strong style=\"vertical-align: baseline;\">Commerzbank</strong><span style=\"vertical-align: baseline;\"> は、Google のボーダーレス Lakehouse と Apache Iceberg を基盤として AI 戦略を策定し、厳格なヨーロッパの銀行規制を遵守しつつ、コンタクト センターおよびマーケティング部門への AI エージェント導入を実現しました。現在では、この統合基盤が行内全体の AI 活用を力強く支えています。マーケティング チームはキャンペーンの制作時間を数週間から数日に短縮し、コンタクト センターの担当者は検証済みの次のステップをわずか数秒で確認できるようになりました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">エージェントに必要なのは、単なるアクセス権ではなくビジネス コンテキスト</strong></h3>\n<p><span style=\"vertical-align: baseline;\">自律型エージェントの精度は、理解できるビジネス コンテキストの深さに左右されます。レイクハウスは、エージェントとエンタープライズ データの分断を解消し、ストレージ レイヤからメタデータを直接かつ自動的に収集してコンテキスト エンジンに提供します。</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/about-lakehouse-catalogs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Lakehouse ランタイム カタログ</span></a><span style=\"vertical-align: baseline;\">は、</span><a href=\"https://cloud.google.com/products/knowledge-catalog\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog</span></a><span style=\"vertical-align: baseline;\"> と直接統合され、全社データに共通するユニバーサル コンテキスト エンジンとして機能します。Google 内外を問わずあらゆるソースからメタデータとセマンティック コンテキストを自律的に集約してキュレートし、意味合いを抽出および拡充したうえで、構築や利用を行うすべてのエージェントにこの統合コンテキストを配信します。Knowledge Catalog の主な機能は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">企業全体での統合集計:</strong><span style=\"vertical-align: baseline;\"> 単一の管理されたセマンティック レイヤが、マルチクラウド アセット全体における指標のドリフトを防ぎます。</span><strong style=\"vertical-align: baseline;\">Knowledge Catalog</strong><span style=\"vertical-align: baseline;\"> の</span><strong style=\"vertical-align: baseline;\">拡張集計</strong><span style=\"vertical-align: baseline;\">の一般提供により、組織は Looker、dbt、BigQuery に分散したメタデータ、指標、ビジネス ロジックを 1 つのプレーンに統合できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">手軽に実現するエージェント グラウンディング:</strong><span style=\"vertical-align: baseline;\"> 検証済みのビジネス ロジックにエージェントをグラウンディングさせることで、開発の迅速化と信頼の構築を同時に実現します。</span><strong style=\"vertical-align: baseline;\">Knowledge Catalog でグラウンディングされた Gemini</strong><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/context-sets\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">コンテキスト セット</strong></a><span style=\"vertical-align: baseline;\">（どちらもプレビュー版）を使用すると、チームはキュレートされた指標や指示をトークン効率の高いバンドルにパッケージ化し、標準 API や Model Context Protocol 経由でエージェントに提供できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ノーコードのコンテキスト最適化:</strong><span style=\"vertical-align: baseline;\"> 最も関連性の高いコンテキストだけを配信することで、レイテンシの低減、トークン費用の削減、そして高コストな推論ループの防止を実現します。</span><a href=\"https://docs.cloud.google.com/knowledge-catalog/docs/knowledge-studio\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Knowledge Catalog の新しいスタジオ エクスペリエンス</span></a><span style=\"vertical-align: baseline;\">（プレビュー版）では、データ スチュワード向けにエージェント ファーストのノーコード環境を提供します。定義の曖昧さを解消するとともに、エージェントのアクセスが許可されている正確なコンテキストを安全に統制できます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Bloomberg Media は、会話型クエリを </span><strong style=\"vertical-align: baseline;\">Knowledge Catalog</strong><span style=\"vertical-align: baseline;\"> のセマンティック レイヤに直接グラウンディングし、クエリの精度を 63% 向上させるとともに、ビジネスチーム全体でハルシネーションを排除することに成功しました。</span></p>\n<p><span style=\"vertical-align: baseline;\">ビジネス コンテキストは、考慮すべき要素の半分に過ぎません。エージェントは単に分析するだけでなく行動も起こすため、分析レイクハウスとオペレーショナル データベースが 1 つのシステムとして連動して動く必要があります。そのため、BigQuery、Managed Service for Apache Spark、Spanner、AlloyDB は相互に連携するよう構築されており、ボーダーレス Lakehouse が Agentic Data Cloud 全体のデータ基盤として機能しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">エージェント レイクハウスで実務担当者を支援</strong></p>\n<p><span style=\"vertical-align: baseline;\">レイクハウスのポテンシャルを最大限に発揮させるには、人々におけるデータの扱い方そのものを変革する必要があります。これまで、データ エンジニア、データ サイエンティスト、ビジネス ユーザーは、互いに分断されたサイロの中で個別に作業を行っていました。レイクハウスは </span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/borderless-lakehouse-integrates-with-gemini?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Gemini と直接</strong></a><span style=\"vertical-align: baseline;\">連携し、コラボレーションを促進する結合組織としての役割を果たします。そして、一元化されたレイクハウス データの上で AI エージェントを直接構築、テスト、運用できるようにします。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">技術チーム向けのインテント ドリブン ワークフロー:</strong><span style=\"vertical-align: baseline;\"> </span><a href=\"https://cloud.google.com/blog/ja/topics/developers-practitioners/data-agent-kit-is-now-ga-bring-google-data-cloud-to-any-coding-agent?e=48754805&amp;hl=ja\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Data Agent Kit</span></a><span style=\"vertical-align: baseline;\"> を使用すると、データ実務担当者は普段お使いの IDE や CLI から直接、シンプルなテキスト プロンプトだけでコードの作成、ノートブックの構築、ML モデルの実行を行えます。チームはボイラープレート コードをゼロから作成することなく、事前構築済みのエージェント スキルや MCP ツールを使用して複雑なデータ パイプラインを構築し、15 を超える Google Cloud データサービスをシームレスに連携できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ビジネス ユーザー向けのプロアクティブでパーソナルな分析情報:</strong><span style=\"vertical-align: baseline;\"> 会話型分析により、ビジネス ユーザーはデータチームがカスタム レポートを作成するのを待つことなく、信頼できる回答を平易な言葉で得ることができます。</span><strong style=\"vertical-align: baseline;\">ワンクリック公開</strong><span style=\"vertical-align: baseline;\">はこれをさらに進化させ、承認された技術モデルを即座に会話ツールに変換します。これにより、従業員はコーディング経験の有無にかかわらず、平易な言葉で質問したり、正確なレポートを作成したり、カスタム エージェントを日常のワークフローに安全にグラウンディングしたりできるようになります。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">PayPal はこれらの機能を使用して、Looker セマンティック モデルを AI エージェントに直接接続しました。これにより、ビジネス インテリジェンス チームが指標モデルを一度定義するだけで、5,000 人の従業員がほぼ 100% の精度でライブデータをクエリできるようになり、分析情報の取得スピードが 50% 向上しました。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">AI 搭載エンジンをレイクハウスに導入</strong></h3>\n<p><span style=\"vertical-align: baseline;\">リアルタイムでビジネス成果につながる意思決定を行うには、データが存在するその場所で、AI エージェントが複雑な推論ループを直接実行する必要があります。Google の最先端 AI と高パフォーマンスな処理エンジンをオープン テーブル形式に直接組み込むことで、データを重複して保持するような複雑な作業を回避し、きわめて大きな価値を引き出せます。以下のようなユースケースが考えられます。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">かつてない規模での分析の実行:</strong><span style=\"vertical-align: baseline;\"> ペタバイト規模のオープンデータに基づいてリアルタイムのアクションを駆動するには、高度に最適化されたコンピュートが必要となります。</span><a href=\"https://cloud.google.com/bigquery\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery</strong></a><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">では、流動的なスケーリングや組み込みのワークロード アクセラレーションなどの高度な最適化により、クエリ処理コストを 50% 以上カットしながら、クエリ処理を 40% 以上高速化しました。また、</span><a href=\"https://docs.cloud.google.com/managed-spark/docs/guides/lightning-engine\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Apache Spark 向け Lightning Engine</strong></a><span style=\"vertical-align: baseline;\"> は、オープン フォーマットの Spark ワークロードを、主要な代替ソリューションと比べて 3 倍を超える優れた費用対効果で処理します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">インプレース AI と ML:</strong><span style=\"vertical-align: baseline;\"> プレビュー版の</span><a href=\"https://research.google/blog/introducing-tabfm-a-zero-shot-foundation-model-for-tabular-data/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">TabFM</span></a><span style=\"vertical-align: baseline;\"> により、ビジネスチームは簡単な SQL クエリで表形式データに関する予測分析情報を即座に生成できます。また、BigQuery の</span><a href=\"https://research.google/blog/timesfm-3-a-zero-shot-foundation-model-for-multivariate-forecasting/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">TimesFM 3.0</span></a><span style=\"vertical-align: baseline;\"> では、既存データに基づいた高度な多変量予測を提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">エージェント規模の優れた費用対効果を誇るデータ処理:</strong><span style=\"vertical-align: baseline;\"> エージェントは継続的かつ短時間に集中的なクエリを行うため、アイドル状態のコンピュート費用を支払っていると、すぐにコストが膨れ上がってしまいます。</span><a href=\"https://cloud.google.com/blog/ja/products/data-analytics/unveiling-new-bigquery-capabilities-for-the-agentic-era?e=48754805&amp;hl=ja\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">BigQuery の流動的なスケーリング</strong></a><span style=\"vertical-align: baseline;\">では、最小利用期間のない秒単位課金が導入され、高コストな 1 分間の最小期間制限がなくなったことで、コンピュート費用を最大 34% 削減できます。</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">コストの高騰を防ぎ、大規模な効率化を最大化</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud のボーダーレス Lakehouse は、コンピュート、AI 処理、トークン消費の各領域で相乗的なコスト削減をもたらし、エンタープライズ AI の費用対効果を再定義します。AI エージェントが数百万行ものデータを処理するようになると、トークン費用はあっという間に膨大な予算項目へと膨れ上がるおそれがあります。Knowledge Catalog は、各プロンプトに必要な正確なメタデータや指標のみをフィルタして提供し、高額なトークン消費を抑えます。整理されていない膨大なデータセットを LLM に送信する必要がなくなるため、トークン消費量を大幅に削減できます。BigQuery AI には組み込みのトークン制御機能が追加されており、クエリ実行前の使用量推定や厳格な上限設定が可能です。さらに最適化モードを活用することで、よりコンパクトで効率的なモデルへと自動的に切り替えることができます。これにより、費用が最適化された BigQuery の AI 関数を使用した場合、行ごとの生成 AI 処理と比べてトークン使用量を 230 分の 1 に抑えられます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">次のステップ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">業界での Google の位置付けと、お客様のデータ ジャーニーを加速させるためのアプローチについて詳しくは、</span><a href=\"https://cloud.google.com/resources/content/datalakehousemq\"><span style=\"text-decoration: underline; vertical-align: baseline;\">2026 年 Gartner Magic Quadrant のデータ レイクハウス プラットフォーム部門のレポート</span></a><span style=\"vertical-align: baseline;\">（無料）をダウンロードしてください。</span></p>\n<hr />\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Gartner、Magic Quadrant データ レイクハウス プラットフォーム部門、Aaron Rosenbaum、Michael Gonzales、Masud Miraz、Ramke Ramakrishnan、Xingyu Gu、Robin Schumacher、Prasad Pore、2026 年 11 月 4 日</span></span></sup></p>\n<p><sup><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Gartner および Magic Quadrant は、Gartner, Inc. および / またはその関係会社の商標です。</span></span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">Gartner は、発行物に掲載されている特定の企業、ベンダー、製品、サービスを推奨するものではありません。また、最高の格付けまたはその他の評価を得たベンダーのみを選択するように助言するものでもありません。Gartner の発行物は、Gartner のビジネスおよびテクノロジー インサイト組織の見解を表したものであり、事実を表現したものではありません。Gartner は、明示または黙示を問わず、商品性や特定の目的への適合性を含め、本出版物に関連したいかなる保証も行いません。</span></span><span style=\"font-style: italic; vertical-align: baseline;\"><span style=\"vertical-align: sub;\">上の図は、リサーチ ドキュメントの一部として Gartner, Inc. より公開されているもので、ドキュメント全体の文脈に即して評価する必要があります。この Gartner のドキュメントをご希望の方は、Google までご請求ください。</span></span></sup></p></div>"
