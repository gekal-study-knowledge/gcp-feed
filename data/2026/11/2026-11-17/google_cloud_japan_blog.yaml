    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 10 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/the-open-ai-native-stack-on-kubernetes-from-open-models-to-distributed-inference-and-agents?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">この 10 年間で、Kubernetes はマイクロサービスやコンテナ化されたアプリケーションをオーケストレートするための標準として定着しました。現在、分散コンピューティングでは、次の大きなアーキテクチャの転換が起きており、</span><strong style=\"vertical-align: baseline;\">AI ワークロードは、隔離された研究用のプロトタイプから大規模なマルチテナントの本番環境フリートへと変わりつつあります</strong><span style=\"vertical-align: baseline;\">。この投稿では、この移行を支えるオープンソース スタックについて解説し、お使いの Kubernetes クラスタですぐに試せるサンプル マニフェストをご紹介します。また、KubeCon + CloudNativeCon North America 2026 にご参加いただくと、ライブデモやテクニカル セッションを通じて、これらのプロジェクトの実際の動作をご覧いただけます。</span></p>\n<p><span style=\"vertical-align: baseline;\">現在のエンジニアリング チームにとって、本番環境での AI 活用は、クローズドでブラックボックスな API を汎用的に呼び出すだけの運用を急速に脱しつつあります。また、企業は、長期的な競争上の優位性が特定領域への特化にあることに気付きつつあります。プラットフォーム エンジニア、ML 研究者、AI ビルダーは、高性能な</span><strong style=\"vertical-align: baseline;\">オープンウェイト モデル</strong><span style=\"vertical-align: baseline;\">（</span><a href=\"https://ai.google.dev/gemma/docs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Gemma</span></a><span style=\"vertical-align: baseline;\"> ファミリーなど）を自分たちの手で自由に実行したいと考えています。そして、</span><strong style=\"vertical-align: baseline;\">強化学習（RL）</strong><span style=\"vertical-align: baseline;\">を使用してこれらのモデルを独自のエンタープライズ データセットに適応させ、予測可能なレイテンシ、高いスループット、最大限に高めたハードウェア効率で提供したいと考えています。</span></p>\n<p><a href=\"https://blog.google/innovation-and-ai/products/dolphingemma/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">DolphinGemma</strong></a><span style=\"vertical-align: baseline;\">（イルカのコミュニケーション方法を研究する科学者を支援する LLM）のようなドメインモデルを音響データでトレーニングする科学分野の取り組みであれ、複雑な契約書を評価する法務プラットフォームであれ、自律型コーディング エージェントを構築するエンジニアリング チームであれ、その目的は同じです。その目的とは、</span><strong style=\"vertical-align: baseline;\">サービス提供コストとレイテンシを大幅に削減しながら、最先端レベルのタスク パフォーマンスを実現すること</strong><span style=\"vertical-align: baseline;\">です。</span></p>\n<p><span style=\"vertical-align: baseline;\">しかし、従来のコンテナ インフラストラクチャで RL の事後トレーニング、ステートフルな分散推論、自律型エージェントの実行をスケールするには、以下のような大きな課題があります。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">RL におけるアクセラレータの活用不足</strong><span style=\"vertical-align: baseline;\">: トレーニングとロールアウト生成を交互に行う場合、トレーニング実行の大部分の時間において、高コストな GPU や TPU がアイドル状態のままになります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">キャッシュを考慮しないロード バランシング</strong><span style=\"vertical-align: baseline;\">: 標準の Kubernetes のラウンドロビン ルーティングや最小接続ルーティングを使用すると、マルチターンのエージェント呼び出しが任意の Pod にランダムに分散され、Key-Value（KV）キャッシュの局所性が失われます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">フレームワークの断片化</strong><span style=\"vertical-align: baseline;\">: Kubernetes と並行して、サイロ化されたコンピューティング クラスタ（独自に構築した</span><a href=\"https://www.ray.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Ray</span></a><span style=\"vertical-align: baseline;\"> や</span><a href=\"https://slurm.schedmd.com/overview.html\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Slurm</span></a><span style=\"vertical-align: baseline;\"> の環境など）を運用すると、リソース容量が断片化し、メンテナンスのトイルが増大します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">マルチテナント クラスタにおけるエージェントのセキュリティ</strong><span style=\"vertical-align: baseline;\">: 信頼できないモデル生成のシェルコマンドやスクリプトを共有環境で実行すると、クラスタがサンドボックス エスケープや権限昇格のリスクにさらされます。</span></p>\n</li>\n</ul>\n<p><a href=\"https://rsvp.withgoogle.com/events/google-cloud-at-kubecon-north-america-2026?pli=1\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">KubeCon + CloudNativeCon North America 2026</strong></a><span style=\"vertical-align: baseline;\"> において、Google Cloud は、Kubernetes と</span><a href=\"https://cloud.google.com/kubernetes-engine\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine（GKE）</span></a><span style=\"vertical-align: baseline;\">全体にわたり、以下のコンポーネントをベースとする、統合されたオープンソースの AI ネイティブ スタックを導入、拡張することで、これらの課題に対処しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"http://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL</strong></a><strong style=\"vertical-align: baseline;\">（CNCF Sandbox）</strong><span style=\"vertical-align: baseline;\">: RL の事後トレーニングを簡素化し、アクセラレータの使用率を最大化する、Kubernetes ネイティブの事後トレーニング サービス。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://llm-d.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">llm-d 1.0</strong></a><strong style=\"vertical-align: baseline;\">（CNCF Sandbox）</strong><span style=\"vertical-align: baseline;\">: 接頭辞のキャッシュ保存対応ルーティング、分離型サービング、多層 KV キャッシュ管理を提供する、オープンな分散推論コントロール プレーン。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/add-on/ray-on-gke/concepts/overview\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">KubeRay を使用した Ray on GKE</strong></a><strong style=\"vertical-align: baseline;\">（CNCF Sandbox）</strong><span style=\"vertical-align: baseline;\">: 分散型の Ray コンピューティングとデータ処理のために、エンタープライズ ライフサイクル管理、弾力的な自動スケーリング、</span><a href=\"https://kueue.sigs.k8s.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Kueue</span></a><span style=\"vertical-align: baseline;\"> によるスケジューリングを提供するフレームワーク。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://ate.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Agent Substrate</strong></a><strong style=\"vertical-align: baseline;\">（CNCF Sandbox）</strong><span style=\"vertical-align: baseline;\">: マルチターン AI エージェント ワークフローのライフサイクル管理と実行ターゲットを提供する、オープン オーケストレーション ランタイム。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://gvisor.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">gVisor</strong></a><strong style=\"vertical-align: baseline;\">（CNCF Sandbox）</strong><span style=\"vertical-align: baseline;\">: マルチテナント クラスタで信頼できないエージェント コードを実行する際に強力なシステムコール隔離機能を提供する、カーネルレベルのコンテナ サンドボックス。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://pytorch.org/blog/introducing-torchtpu/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">TorchTPU</strong></a><span style=\"vertical-align: baseline;\">: アップストリームの</span><a href=\"https://vllm.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">vLLM</span></a><span style=\"vertical-align: baseline;\"> と</span><a href=\"https://docs.sglang.io/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">SGLang</span></a><span style=\"vertical-align: baseline;\"> 内で、Cloud TPU と GPU 全体にファーストクラスのネイティブ PyTorch サポートを提供するバックエンド。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">OpenRL による強化学習と Kubernetes の連携</strong></h4>\n<p><span style=\"vertical-align: baseline;\">教師ありファインチューニング（SFT）はすでに標準的な手法となっていますが、特にマルチステップの推論、数学的証明、自律的なツール使用などの領域で優れた成果を上げるには、RL が必要となります。</span></p>\n<p><span style=\"vertical-align: baseline;\">これまで、ML のテスト環境と本番環境の Kubernetes フリートを連携させることは困難でした。ML 研究者は、標準の報酬関数を使用して Python や PyTorch で迅速にイテレーションを行いたいと考えています。一方、プラットフォーム チームは、マルチテナント ガバナンス、割り当ての適用、予測可能なスケジューリングを必要としています。</span></p>\n<p><span style=\"vertical-align: baseline;\">この課題を解決するために、Google は </span><a href=\"https://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL</strong></a><span style=\"vertical-align: baseline;\"> を作成し、</span><strong style=\"vertical-align: baseline;\">CNCF Sandbox</strong><span style=\"vertical-align: baseline;\"> に寄贈しました。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">OpenRL のアーキテクチャとしての特長</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">4 つのプリミティブによるシンプルな Python 抽象化</strong><span style=\"vertical-align: baseline;\">: 研究者は、4 つのコア プリミティブ（</span><code style=\"vertical-align: baseline;\">forward_backward</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">optim_step</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">sample</code><span style=\"vertical-align: baseline;\">、</span><code style=\"vertical-align: baseline;\">save_state</code><span style=\"vertical-align: baseline;\">）を中心とする標準的な Python トレーニング コードを記述します。OpenRL は、これらのプリミティブを Kubernetes スケジューリング ワークフローに変換します。デベロッパーが Kubernetes の内部構造を学習したり、インフラストラクチャ コードを管理したりする必要はありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">協調型アクセラレータ タイムスライス</strong><span style=\"vertical-align: baseline;\">: OpenRL は、同じ物理アクセラレータ上でトレーニング ステップとロールアウト推論をインターリーブします。この手法により、コンピュート バウンドなトレーニングやレイテンシに敏感なロールアウト生成に対して、個別の静的クラスタを専用に割り当てる必要がなくなります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">重みの差分同期</strong><span style=\"vertical-align: baseline;\">: 最適化ステップのたびに数ギガバイト規模のモデルの重み全体をクラスタ ネットワーク経由で送信すると、ネットワークが著しく飽和してしまいます。OpenRL はパラメータの差分のみをロールアウト ワーカーに送信するため、ロールアウトのコールド スタートが不要になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">構成不要の動的リソース割り当て（</strong><a href=\"https://kubernetes.io/docs/concepts/resource-management/dynamic-resource-allocation/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">DRA</strong></a><strong style=\"vertical-align: baseline;\">）</strong><span style=\"vertical-align: baseline;\">: OpenRL は、モデルのコンテキストの長さ、バッチの次元、LoRA とフル ファインチューニングの構成を自動的にプロファイリングします。その後、ネイティブの Kubernetes DRA クレームを使用して、種類の異なるアクセラレータ フリート全体でワークロードを動的にビンパッキングします。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">llm-d 1.0 による大規模な分散推論</strong></h4>\n<p><span style=\"vertical-align: baseline;\">モデルを事後トレーニングした後、インタラクティブでバースト性の高いエージェント トラフィック下でモデルを提供すると、分散システムに関する新たな課題が生じます。標準の Ingress コントローラは LLM トラフィックをステートレスな HTTP リクエストとして処理するため、連続するターンが異なるレプリカに分散し、KV キャッシュが常に再構築されてしまいます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud、Red Hat、IBM Research、CoreWeave、NVIDIA が共同で創設したこのプロジェクトには、25 以上の組織から 500 人以上のエンジニアが貢献しています。現在、</span><a href=\"https://llm-d.ai/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">llm-d 1.0</strong></a><span style=\"vertical-align: baseline;\"> は CNCF Sandbox の分散推論コントロール プレーンとなっており、スタンドアロンの推論エンジン（vLLM や SGLang など）をクラスタ全体で連携するサービング ファブリックに変換しています。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: inference.networking.x-k8s.io/v1alpha1\\r\\nkind: InferencePool\\r\\nmetadata:\\r\\n  name: gemma-serving-pool\\r\\n  namespace: ai-serving\\r\\nspec:\\r\\n  targetRef:\\r\\n    group: apps\\r\\n    kind: Deployment\\r\\n    name: vllm-gemma-27b\\r\\n  scheduling:\\r\\n    # Routes multi-turn requests to replicas holding matching KV context\\r\\n    strategy: PrefixCacheAware\\r\\n    fallback: LeastQueueDepth\\r\\n  observability:\\r\\n    kvCacheSyncInterval: &quot;50ms&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f4801c39c90&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">llm-d 1.0 のコア機能</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">接頭辞のキャッシュ保存対応ルーティング（</strong><a href=\"https://llm-d.ai/docs/dev/architecture/router/epp\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Endpoint Picker</strong></a><strong style=\"vertical-align: baseline;\">）</strong><span style=\"vertical-align: baseline;\">: Endpoint Picker は </span><a href=\"https://gateway-api-inference-extension.sigs.k8s.io/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Kubernetes Gateway API Inference Extension</strong></a><span style=\"vertical-align: baseline;\"> に統合されているため、GKE が </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/about-gke-inference-gateway\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">GKE Inference Gateway</strong></a><span style=\"vertical-align: baseline;\"> を通じてネイティブに管理します。Endpoint Picker は、ワーカー Pod 全体にわたり KV キャッシュの常駐状態をリアルタイムで評価します。本番環境のデプロイでは、マルチターン エージェント ワークロードにおける </span><a href=\"https://llm-d.ai/blog/llm-d-v1.0-state-of-the-art-inference-ready-for-day-2\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">KV キャッシュ ヒット率が 35% から 70% に倍増</span></a><span style=\"vertical-align: baseline;\">し、</span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/llm-d-1-0-an-open-source-stack-for-distributed-inference\"><span style=\"text-decoration: underline; vertical-align: baseline;\">最初のトークンまでの時間（TTFT）の中央値が 70～85% 短縮</span></a><span style=\"vertical-align: baseline;\">されました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">3 階層の KV キャッシュ オフロード</strong><span style=\"vertical-align: baseline;\">: 長いコンテキストのインタラクション中にアクセラレータの高帯域幅メモリ（HBM）が容量に近付くと、llm-d は KV キャッシュ ブロックを、</span><strong style=\"vertical-align: baseline;\">HBM → ホスト CPU RAM → ローカル NVMe SSD / Google Cloud Managed Lustre / Cloud Storage</strong><span style=\"vertical-align: baseline;\"> の順にカスケードします。このオフロードにより、計算コストの高いコンテキストの再計算を回避できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">DisaggregatedSet による EPD の分離</strong><span style=\"vertical-align: baseline;\">: </span><strong style=\"vertical-align: baseline;\">エンコード、プレフィル、デコード（EPD）</strong><span style=\"vertical-align: baseline;\">を、高速相互接続で結ばれた専用のハードウェア プールへ個別に分離します。DisaggregatedSet は、Kubernetes </span><a href=\"https://lws.sigs.k8s.io/stable/docs/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LeaderWorkerSet（LWS）</span></a><span style=\"vertical-align: baseline;\">を基盤として構築されています。これにより、独立した水平スケーリングと、ダウンタイムのない連携されたローリング アップグレードが可能になります。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TorchTPU アップストリームのネイティブ対応</strong><span style=\"vertical-align: baseline;\">: PyTorch モデルは、TorchTPU を介し、アップストリームの vLLM や SGLang を通じて Google Cloud TPU 上でネイティブに実行できます。デベロッパーは、プライベート フォークを維持したりパイプラインを書き直したりすることなく、TPU v5e、v6e、v7x、および NVIDIA GPU で、初日から同等の機能を利用できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">レイテンシを許容できる非同期処理とフロー制御</strong><span style=\"vertical-align: baseline;\">: llm-d-async-processor コンポーネントは、レイテンシを許容するバックグラウンド タスクを Pub/Sub または Redis からクラスタの余剰容量に pull します。厳格なトラフィックの優先順位付けが適用されるため、バックグラウンド プロセスがインタラクティブなユーザー エクスペリエンスを低下させることはありません。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Prism によるフリートのオブザーバビリティ</strong><span style=\"vertical-align: baseline;\">: llm-d のオープンソース ベンチマークおよびパフォーマンス ダッシュボードである </span><a href=\"https://github.com/llm-d/llm-d-prism\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Prism</strong></a><span style=\"vertical-align: baseline;\"> を使用して、クラスタ全体のスループット、トークン間レイテンシ（ITL）、TTFT、キャッシュ ヒット率を追跡します。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">KubeRay を使用した Python と ML の分散型オーケストレーション</strong></h4>\n<p><span style=\"vertical-align: baseline;\">推論や RL ループは専用のランタイムが処理しますが、分散データの前処理、エンベディングの生成、PyTorch の分散トレーニングは </span><strong style=\"vertical-align: baseline;\">Ray</strong><span style=\"vertical-align: baseline;\"> に大きく依存しています。</span></p>\n<p><strong style=\"vertical-align: baseline;\">KubeRay</strong><span style=\"vertical-align: baseline;\"> は、Kubernetes 上で Ray クラスタ、ジョブ、サービス（RayCluster、RayJob、RayService カスタム リソース）のライフサイクル全体を管理する、オープンソースの Kubernetes ネイティブ オペレーターを提供します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;apiVersion: ray.io/v1\\r\\nkind: RayJob\\r\\nmetadata:\\r\\n  name: gemma-fine-tune-job\\r\\n  namespace: ai-workloads\\r\\n  labels:\\r\\n    kueue.x-k8s.io/queue-name: ml-team-queue\\r\\nspec:\\r\\n  shutdownAfterJobFinishes: true\\r\\n  ttlSecondsAfterFinished: 60\\r\\n  entrypoint: python fine_tune_gemma.py --model-id google/gemma-2-27b-it\\r\\n  runtimeEnvYAML: |\\r\\n    pip:\\r\\n      - datasets==2.18.0\\r\\n      - transformers==4.40.0\\r\\n      - torch==2.2.0\\r\\n  rayClusterSpec:\\r\\n    rayVersion: &quot;2.35.0&quot;\\r\\n    headGroupSpec:\\r\\n      rayStartParams:\\r\\n        dashboard-host: &quot;0.0.0.0&quot;\\r\\n      template:\\r\\n        spec:\\r\\n          containers:\\r\\n            - name: ray-head\\r\\n              image: rayproject/ray-ml:2.35.0\\r\\n              resources:\\r\\n                limits:\\r\\n                  cpu: &quot;4&quot;\\r\\n                  memory: &quot;16Gi&quot;\\r\\n                requests:\\r\\n                  cpu: &quot;2&quot;\\r\\n                  memory: &quot;8Gi&quot;\\r\\n    workerGroupSpecs:\\r\\n      - groupName: gpu-workers\\r\\n        replicas: 4\\r\\n        minReplicas: 1\\r\\n        maxReplicas: 8\\r\\n        rayStartParams: {}\\r\\n        template:\\r\\n          spec:\\r\\n            containers:\\r\\n              - name: ray-worker\\r\\n                image: rayproject/ray-ml:2.35.0\\r\\n                resources:\\r\\n                  limits:\\r\\n                    nvidia.com/gpu: &quot;1&quot;\\r\\n                    cpu: &quot;8&quot;\\r\\n                    memory: &quot;32Gi&quot;\\r\\n                  requests:\\r\\n                    nvidia.com/gpu: &quot;1&quot;\\r\\n                    cpu: &quot;4&quot;\\r\\n                    memory: &quot;16Gi&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f47f35bb710&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">プラットフォーム チームにとって KubeRay が重要な理由</strong></h4>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">宣言型のクラスタ ライフサイクル</strong><span style=\"vertical-align: baseline;\">: プラットフォーム エンジニアは、アドホックなトレーニング実行のためにエフェメラルな自己修復型 Ray クラスタをオンデマンドでスピンアップすることも、バッチ パイプライン用に長期間有効なクラスタを実行することもできます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ネイティブな Kueue のキューイングとマルチテナンシー</strong><span style=\"vertical-align: baseline;\">: KubeRay は </span><strong style=\"vertical-align: baseline;\">Kueue</strong><span style=\"vertical-align: baseline;\"> と直接連携して、共有 GPU および TPU 容量全体にわたる、マルチテナントの公平な共有、優先度に基づくプリエンプション、割り当ての管理を実現します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">弾力的な自動スケーリング</strong><span style=\"vertical-align: baseline;\">: KubeRay は、アクティブな Ray タスクとアクターの配置に基づいてワーカー Pod を動的にスケーリングし、アイドリング リソースの消費を防ぎます。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">AI エージェントのための強力な隔離: Agent Substrate と gVisor</strong></h4>\n<p><span style=\"vertical-align: baseline;\">マルチターン AI エージェントが、会話型アシスタントから、コードの生成、シェルコマンドの実行、外部 API のオーケストレーションを行う自律型システムへと進化するにつれ、共有クラスタ上で信頼できないモデル生成コードを実行してしまうという重大なセキュリティ リスクが生じてきます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud は、CNCF Sandbox に </span><strong style=\"vertical-align: baseline;\">Agent Substrate</strong><span style=\"vertical-align: baseline;\"> を寄贈するとともに、</span><strong style=\"vertical-align: baseline;\">gVisor</strong><span style=\"vertical-align: baseline;\"> へも中核的な貢献を継続しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">カーネルレベルのサンドボックス化</strong><span style=\"vertical-align: baseline;\">: gVisor は、システムコールをインターセプトして仮想化するユーザー空間カーネルを提供します。これにより、信頼できないエージェント コードがホストカーネルを侵害したり、隣接するテナント ワークロードにアクセスしたりするのを防ぐことができます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">1 秒未満のエフェメラルな実行</strong><span style=\"vertical-align: baseline;\">: エージェントのターンごとにサンドボックスが数ミリ秒でスピンアップし、OpenRL での RL ロールアウト生成と本番環境のエージェント ワークフローの両方に対して、隔離された実行環境を提供します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">実践で実証済み: ドメイン推論をマスターする</strong></h4>\n<p><span style=\"vertical-align: baseline;\">この完全なオープンソース スタックを厳格なエンタープライズ ワークロードで評価するため、</span><strong style=\"vertical-align: baseline;\">Gemma 4</strong><span style=\"vertical-align: baseline;\"> を、</span><a href=\"http://harvey.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Harvey.ai</span></a><span style=\"vertical-align: baseline;\"> が開発したオープンソースの </span><a href=\"https://github.com/harveyai/harvey-labs\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Legal Agent Benchmark（LAB）</strong></a><span style=\"vertical-align: baseline;\">でテストしました。このベンチマークは、合併買収（M&amp;A）のデュー デリジェンスから契約紛争の分析まで、24 の複雑な法務分野を網羅しています。評価の結果は、以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ベンチマーク結果</strong><span style=\"vertical-align: baseline;\">: 標準的な SFT では、マルチステップの推論の評価基準における精度は約 50% で頭打ちになりましたが、</span><strong style=\"vertical-align: baseline;\">OpenRL を使用した再現可能な RL ループを適用したところ、モデルの精度が 70% まで向上しました</strong><span style=\"vertical-align: baseline;\">。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">運用効率</strong><span style=\"vertical-align: baseline;\">: トレーニング パイプライン全体にわたり、手動でパーティション管理をしなくても、GPU と TPU の容量が、GKE 上で同時に実行される LoRA ジョブや推論ジョブで動的に共有されました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">チーム別に見る、このスタックの導入方法</strong></h4>\n<div align=\"left\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\">\n<div style=\"color: #5f6368; width: 100%;\"><table><colgroup><col /><col /><col /></colgroup>\n<tbody>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">組織のペルソナ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">主な課題</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">OpenRL + llm-d + KubeRay + Gemma を使用したアーキテクチャ</strong></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">エンタープライズ プラットフォーム チーム</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">Slurm / Ray クラスタの断片化やハードウェア費用の高騰を招くことなく、複数の社内 ML チームを管理する。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">DRA、Kueue、アクセラレータのタイムスライスを使用して、既存の GKE クラスタをセルフホスト型の </span><strong style=\"vertical-align: baseline;\">Reinforcement Learning-as-a-Service（RLaaS）</strong><span style=\"vertical-align: baseline;\">に変換する。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">規制対象企業（金融、医療、法律）</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">知的財産（IP）、コンプライアンス、プライバシーに関する規制により、専有データをサードパーティの公開 API に送信することが禁じられている。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">10 億～300 億パラメータの Gemma モデルを、ドメイン固有の報酬関数を使用してプライベートな Virtual Private Cloud（VPC）内で完全に事後トレーニングしてサービングし、優れたタスク精度と総所有コスト（TCO）の削減を実現する。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">AI ネイティブのビルダーおよびエージェント デベロッパー</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">コンテキストの長いマルチターンのエージェント インタラクションにおける、高いサービング コストとレイテンシによるボトルネック。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">gVisor で隔離された </span><strong style=\"vertical-align: baseline;\">Agent Sandbox</strong><span style=\"vertical-align: baseline;\"> の実行ターゲットと組み合わせて、llm-d 接頭辞のキャッシュ保存ルーティングをデプロイする。</span></p>\n</td>\n</tr>\n<tr>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><strong style=\"vertical-align: baseline;\">Model-as-a-Service およびネオクラウド プロバイダ</strong></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">多様なハードウェア フリート全体にわたって、利益率の高いマルチテナント事後トレーニングと推論を実現する。</span></p>\n</td>\n<td style=\"vertical-align: top; border: 1px solid #000000; padding: 16px;\">\n<p><span style=\"vertical-align: baseline;\">OpenRL のマルチテナント API と llm-d のマルチアクセラレータ コントロール プレーンを、GPU と TPU が混在するクラスタ全体に公開する。</span></p>\n</td>\n</tr>\n</tbody>\n</table></div>\n</div>\n</div>\n</div>\n<h4><strong style=\"vertical-align: baseline;\">KubeCon North America 2026 で Google とつながりましょう</strong></h4>\n<p><span style=\"vertical-align: baseline;\">ソルトレイクシティで開催される KubeCon NA には参加されますか？これらのオープンソース テクノロジーの実際の動作をぜひご覧ください。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KubeCon + CloudNativeCon North America 2026 で Google Cloud とつながる:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Hall B のブース #122 でお待ちしています。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://rsvp.withgoogle.com/events/google-cloud-at-kubecon-north-america-2026?pli=1\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud at KubeCon North America 2026</span></a><span style=\"vertical-align: baseline;\"> のイベントサイトで、Google 社員による講演をぜひご覧ください。</span></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">注目のセッションや基調講演に参加する:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kubernetes with Conviction: How Customization is Shaping the OSS AI Ecosystem's Future（確固たる信念に基づく Kubernetes: カスタマイズが OSS AI エコシステムの未来をどう形作っているか）-</span><a href=\"https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/program/schedule/?id=1301727\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Salt Palace | Level 1 | Hall DE</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">The Latest in GPU, TPU, NIC and Other Device Support (WG Device Management)（GPU、TPU、NIC、その他のデバイス サポートの最新情報（WG デバイス管理））-</span><a href=\"https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/program/schedule/?id=1289704\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Salt Palace | Level 2 | 250 D-F</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Kubernetes Solutions for Agent-Shaped Problems（エージェント型の問題に対する Kubernetes ソリューション）-</span><a href=\"https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/program/schedule/?id=1248040\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Salt Palace | Level 1 | Hall DE</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">How Anthropic Almost Melted GKE (And the PRs That Saved It)（Anthropic が GKE を危機に陥れかけた経緯（とそれを救った PR））-</span><a href=\"https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/program/schedule/?id=1247612\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Salt Palace | Level 1 | Ballroom H</span></a></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Gateway API Project Update: Building the Future of Traffic（Gateway API プロジェクトの最新情報: トラフィックの未来を構築する）-</span><a href=\"https://events.linuxfoundation.org/kubecon-cloudnativecon-north-america/program/schedule/?id=1247612\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Salt Palace | Level 2 | 250 D-F</span></a></p>\n</li>\n</ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Google Cloud ブースでライブデモを見る:</strong></p>\n</li>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Demo | Inferencing with ARM processors on GKE（デモ | GKE で ARM プロセッサを使用した推論）（火曜日 13:30～16:30 MST）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Sandbox your agent workflows with gVisor（gVisor によるエージェント ワークフローのサンドボックス化）（火曜日 16:30～19:30 MST）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Securely running fleets of agents with OpenShell（OpenShell によるエージェント フリートの安全な実行）（水曜日 10:30～13:30 MST）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Cost optimization via GKE spot nodes &amp; node auto-provisioning（GKE スポットノードとノード自動プロビジョニングによるコスト最適化）（水曜日 12:30～14:30 MST）</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">From Reasoning to Action: Arm-Powered Coding Agents with GKE Agent Sandbox and Axion（推論から行動へ: GKE Agent Sandbox と Axion を使用した Arm 搭載コーディング エージェント）（木曜日 10:30～13:30 MST）</span></p>\n</li>\n</ul>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">使ってみる</strong></h4>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">OpenRL を確認する</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://openrl.dev/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">openrl.dev</span></a><span style=\"vertical-align: baseline;\"> にアクセスし、</span><a href=\"https://github.com/openrl-dev\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">OpenRL GitHub リポジトリ</span></a><span style=\"vertical-align: baseline;\">で Kubernetes ネイティブの RL ファインチューニング レシピをご確認ください。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">llm-d 1.0 をデプロイする</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://llm-d.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d.ai</span></a><span style=\"vertical-align: baseline;\"> にアクセスして、Gateway API Inference Extension をテストし、クラスタに接頭辞対応の推論プールをデプロイします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KubeRay を実行する</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://docs.ray.io/en/latest/cluster/kubernetes/getting-started.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">KubeRay のドキュメント</span></a><span style=\"vertical-align: baseline;\">に沿って、Kueue とともに Ray の分散ワークロードを管理します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">GKE に Gemma をデプロイする</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://cloud.google.com/kubernetes-engine/docs\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Kubernetes Engine のドキュメント</span></a><span style=\"vertical-align: baseline;\">で、TPU と GPU に Gemma モデルをデプロイするための手順ガイドをご確認ください。</span></p>\n</li>\n</ol>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">Google Cloud、クラウド デベロッパー アドボケイト、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Abdelfettah Sghiouar</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">GKE プロダクト管理担当ディレクター、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Allan Naim</strong></p></div>"
  "f4e69459a9c88aae1bcfdbfffd323c56":
    "id": "f4e69459a9c88aae1bcfdbfffd323c56"
    "title": "エージェント向けの Physical-Engineering’s Last Exam のご紹介"
    "link": "https://cloud.google.com/blog/ja/products/ai-machine-learning/introducing-physical-engineerings-last-exam-for-agents/"
    "published": "2026-11-17 09:30:00"
    "fetched": "2026-11-18 01:41:34"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 4 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/ai-machine-learning/introducing-physical-engineerings-last-exam-for-agents?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">執筆者: 研究開発担当 VP Burak Gokturk、リサーチ サイエンティスト Rujun Han、プロダクト マネージャー George Lee</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、</span><a href=\"http://aiinfra.google/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google AI &amp; インフラストラクチャ</span></a><span style=\"vertical-align: baseline;\"> チームは、Mercor と共同で開発した新しいベンチマークおよび公開コンペティションである </span><strong style=\"vertical-align: baseline;\">Physical-Engineering's Last Exam（PLE）</strong><span style=\"vertical-align: baseline;\">を発表しました。これは、機械、電気、土木、構造工学のタスクを遂行するフロンティア モデルの能力を検証するために設計されたものです。</span></p>\n<p><span style=\"vertical-align: baseline;\">研究コミュニティがエージェントによる物理エンジニアリング作業の処理能力を評価し、改善できるよう、29 の公開タスク、その評価ツール、公開コンペティションのリーダーボードを </span><a href=\"http://ple-bench.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ple-bench.com</span></a><span style=\"vertical-align: baseline;\"> で公開しています。</span></p>\n<p><span style=\"vertical-align: baseline;\">最先端の研究機関やさまざまな研究コミュニティは、特定の分野で AI がタスクを完了する能力の進歩を評価するために、モデル試験を使用しています。</span><a href=\"https://lastexam.ai/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Humanity's Last Exam</span></a><span style=\"vertical-align: baseline;\"> は、モデルの一般知識を評価します。</span><a href=\"https://agents-last-exam.org/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Agents' Last Exam</span></a><span style=\"vertical-align: baseline;\"> は、デジタル プロフェッショナル ワークを遂行するモデルの能力を評価します。</span><strong style=\"vertical-align: baseline;\">Physical-Engineering's Last Exam（PLE）</strong><span style=\"vertical-align: baseline;\">は、物理的な世界を構築するのに役立つ作業を遂行するモデルの能力を評価するものです。私たちの生活を支える高層ビル、電力網、コンピュータ チップなどを設計する物理エンジニアの作業を、エンドツーエンドで実行できるかどうかを評価する既存のベンチマークはこれまで存在していませんでした。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">物理工学において教科書的なベンチマークでは不十分な理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">最先端の言語モデルは、多くの学術的なベンチマークで 90% 以上のスコアを記録しています。しかし、これらのベンチマークは、教科書的な質問、単一のツール呼び出し、または小規模で自己完結型の設計問題を評価するものがほとんどです。物理エンジニアリング用のエージェントを構築する AI 開発者や研究者には、エージェントが有資格のエンジニアのレビューと管理の下で、安全で、規定に準拠した、費用対効果の高い設計を生成できるかどうか、既存のベンチマークではわかりません。</span><a href=\"https://infrastructurereportcard.org/wp-content/uploads/2025/03/Full-Report-2025-Natl-IRC-WEB.pdf?_gl=1*1timmgv*_up*MQ..*_ga*MzEyMjk2NDYxLjE3OTMwNDg0MTc.*_ga_C9EX6BGYX5*czE3OTMwNDg0MTYkbzEkZzAkdDE3OTMwNDg0MTYkajYwJGwwJGgw\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">インフラストラクチャ開発の需要が資金調達のスピードを上回る</span></a><span style=\"vertical-align: baseline;\">なか、このギャップを埋めるために取り組むエンジニアをエージェントが支援できる機会が広がっています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">PLE の内容: 実務エンジニアと共同で構築した実世界のタスク</strong></h4>\n<p><span style=\"vertical-align: baseline;\">PLE は、</span><strong style=\"vertical-align: baseline;\">機械</strong><span style=\"vertical-align: baseline;\">（30 タスク）、</span><strong style=\"vertical-align: baseline;\">電気</strong><span style=\"vertical-align: baseline;\">（27 タスク）、</span><strong style=\"vertical-align: baseline;\">土木</strong><span style=\"vertical-align: baseline;\">（18 タスク）、</span><strong style=\"vertical-align: baseline;\">構造</strong><span style=\"vertical-align: baseline;\">（10 タスク）の 4 つの主要分野にわたる 85 の長期的なタスクで、この評価のギャップを埋めます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"PLE Kaggle - ple_disciplines_description\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/PLE_Kaggle_-_ple_disciplines_description.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">エージェントは、単一のプロンプトに回答するのではなく、</span><a href=\"https://github.com/Mercor-Intelligence/archipelago\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Mercor の Archipelago 環境</span></a><span style=\"vertical-align: baseline;\">上に構築されたコンテナ化されたプロジェクト フォルダ内で動作します。このフォルダは、実務エンジニアが業務で受け取るものを再現したものです。各タスクには、PDF、スプレッドシート、メール、2D CAD 図面、3D BIM モデル、ドキュメントの改訂版など、平均 61 個のファイル（ベンチマーク全体で合計 5,170 個のファイル）が含まれています。エージェントは、これらのファイルを解釈して推論し、適用される構造の基準や法規と物理的な制限を特定し、計算を実行して、有資格の審査担当者が審査および承認するためのプロダクション レディな成果物を生成する必要があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google は、Mercor の専門家や業界の有資格の実務に携わるエンジニアと協力して、次の 2 つの方法で PLE を構築しました。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">エキスパートが作成したタスク（44 タスク）: 実際のエンジニアリング タスクに基づいて、実務に携わっているエンジニアがプロジェクト フォルダ、プロンプト、評価基準を作成しました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">共同作成タスク（41 タスク）: 実務に携わっているエンジニアが初期タスクを設計し、エージェント パイプラインがライセンス取得可能なエンジニアリング標準からタスクの環境と採点ツールを組み立てました。その後、エンジニアがエージェントによって組み立てられたすべてのタスクを検証し、難易度を上げました。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">すべてのフロンティア モデルのスコアが 50% 未満</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google は、一般公開されている 7 つのエージェント ハーネス（Antigravity、Claude Code、Codex、Hermes、OpenCode、OpenHands、Pi）を使用して、PLE で 14 のフロンティア モデルをテストしました。PLE は基準や法規への準拠と費用対効果の両方を評価するため、エージェントは、設計がすべての厳格な安全性チェックに合格した場合にのみポイントを獲得できます。ベースラインの結果は、現在のモデルと実際のエンジニアリング要件との間に大きなギャップがあることを示しています。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">大きな改善の余地: すべてのフロンティア モデルが、Google の非公開テストセットで 50% 未満のスコアで、ネイティブ ハーネスで最もパフォーマンスの高いモデルの平均スコアでも 48.3% にとどまりました。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">厳格な安全基準: 最高スコアのエージェント構成は、共同作業タスクの個々の制約の 91% を満たしていましたが、必要なすべての厳格な安全性と実現可能性のチェックに合格した成果物は 41.3% のみでした。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">モデルとハーネスによる影響の比較: モデルの選択がパフォーマンスに与える影響は、ハーネスよりもはるかに大きくなります（モデル間の差は最大 50 ポイント、同じモデルのハーネス間の差は中央値で 3 ポイント）。ただし、ハーネスは実行費用に大きく影響します。</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"ple_frontier_private_x\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/ple_frontier_private_x.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">エージェントの能力を検証して公開コンペティションに参加する</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現実的なプロジェクト ファイル、厳格な安全ルール、材料費に基づいて AI エージェントを評価することは、物理エンジニアにとって有用なツールを構築するための実用的なステップです。PLE の利用を開始する方法は次のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://arxiv.org/pdf/2610.30537\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">arXiv の PLE に関する論文</span></a><span style=\"vertical-align: baseline;\">を参照して技術的な詳細を確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">29 の公開タスク、採点スクリプト、評価コンテナを </span><a href=\"https://github.com/google-research/ple\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub リポジトリ</span></a><span style=\"vertical-align: baseline;\">からダウンロードします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">独自のエージェント設定を</span><a href=\"http://ple-bench.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">ple-bench.com</span></a><span style=\"vertical-align: baseline;\"> で送信して Google の非公開テストセットでの評価を受けます。Google がスポンサーとなっている 13 のモデルが Google のサーバーで無料で実行されます。賞品の詳細については、近日発表予定です。</span></p>\n</li>\n</ul>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- Google AI とインフラストラクチャ</strong></p></div>"
