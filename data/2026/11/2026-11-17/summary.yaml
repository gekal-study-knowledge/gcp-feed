  この日は Google Cloud ブログ 1 本と日本語ブログ 2 本の計 3 本でした。Google Cloud の CEO Thomas Kurian が片山さつき財務大臣と会談し、日本のサイバーセキュリティ強化と AI の導入・人材育成を支援する新たな取り組みを発表しました。政府が 11 月 6 日に決定したサイバーセキュリティ緊急対策パッケージを受け、国家サイバー統括室 (NCO) やデジタル庁などの行政機関、金融機関、重要インフラ事業者へのサイバーセキュリティ向けフロンティアモデル Gemini 4 Carbon for Cyber と脆弱性の検知・コード修復を支援する CodeMender の早期提供、重要な政府機関や地方公共団体を対象に Wiz Red Agent で外部から脆弱性を診断する無償プログラム Scan for Good の開始、GTIG と Mandiant による脅威インテリジェンスの共有を進め、国内パートナーと組んだソブリンクラウドと行政向け AI 基盤の提供にも取り組みます。また、Google が Gartner が初めて発行したデータレイクハウスプラットフォーム部門の Magic Quadrant でリーダーに選ばれ、ビジョンの完全性で最高評価を得たことと、Apache Iceberg を基盤にマルチクラウドや SaaS、運用データベースのデータを移動せずに統合するボーダーレス Lakehouse が紹介されました。Google Cloud ブログでは、AI インフラの課題がアクセラレーターの調達から稼働率の維持に移っており、データ I/O の不足でアクセラレーターが遊ばないよう AI 向けに設計されたストレージを選ぶことが ROI を左右すると解説されています。
