"overview": |
  この日は Google Cloud ブログ 4 本、日本語ブログ 5 本、リリースノート 1 本の計 10 本で、日本と欧州でのソブリン AI とサイバーセキュリティの取り組み、Mandiant の脅威調査が目立ちました。Google Cloud の CEO Thomas Kurian が片山さつき財務大臣と会談し、日本のサイバーセキュリティ強化と AI の導入・人材育成を支援する新たな取り組みを発表しました。政府が 11 月 6 日に決定したサイバーセキュリティ緊急対策パッケージを受け、国家サイバー統括室 (NCO) やデジタル庁などの行政機関、金融機関、重要インフラ事業者へのサイバーセキュリティ向けフロンティアモデル Gemini 4 Carbon for Cyber と脆弱性の検知・コード修復を支援する CodeMender の早期提供、重要な政府機関や地方公共団体を対象に Wiz Red Agent で外部から脆弱性を診断する無償プログラム Scan for Good の開始、GTIG と Mandiant による脅威インテリジェンスの共有を進め、国内パートナーと組んだソブリンクラウドと行政向け AI 基盤の提供にも取り組みます。欧州では、ブリュッセルの Sovereign AI Summit に合わせて、パートナーが運用する Google Cloud Dedicated で Gemini モデルを提供することや、暗号鍵の管理とコンプライアンスの新機能、欧州のソフトウェア企業やスタートアップとの協業が発表され、欧州とイスラエルのスタートアップを対象に EU AI Act・NIS2・DORA などの規制環境向け AI を支援する株式不要・15 週間のハイブリッドプログラム Google for Startups Accelerator: Sovereign AI の募集も始まりました。Mandiant は、FSB の下で活動するとされるロシアの諜報グループ COLD RELIC (旧称 COLDRIVER / UNC4057、別名 Star Blizzard、Callisto、Gossamer Bear) が、2025 年末に米国組織から盗んだデータや社員名簿、ID を使って 2026 年に別の米国組織を侵害した事例を分析し、1 つのクラウド侵害を足がかりに第三者への侵害と諜報を続ける手口を報告しています。また、Google が Gartner が初めて発行したデータレイクハウスプラットフォーム部門の Magic Quadrant でリーダーに選ばれ、ビジョンの完全性で最高評価を得たことと、Apache Iceberg を基盤にマルチクラウドや SaaS、運用データベースのデータを移動せずに統合するボーダーレス Lakehouse が紹介されました。日本語ブログではほかに、Mercor と共同開発した機械・電気・土木・構造の 4 分野 85 タスクで物理エンジニアリング作業をエージェントが遂行できるかを測るベンチマーク Physical-Engineering's Last Exam (PLE、29 の公開タスクと評価ツール、リーダーボードを ple-bench.com で公開) と、Kubernetes 上で RL の事後トレーニング、キャッシュを考慮した分散推論、エージェントの実行を担うオープンな AI ネイティブスタックが紹介されました。Google Cloud ブログでは、AI インフラの課題がアクセラレーターの調達から稼働率の維持に移っており、データ I/O の不足でアクセラレーターが遊ばないよう AI 向けに設計されたストレージを選ぶことが ROI を左右すると解説されています。リリースノートでは、Workforce Identity Federation の延長セッション (プロジェクトスコープで最長 90 日) が GA、App Engine スタンダード環境の Go / Java / PHP / Python でバンドルサービス SDK の更新によりコードを変えずに push キューを Cloud Tasks へ移行する機能が GA、Backup and DR のラベルによる Compute Engine インスタンスとディスクの自動保護が GA、BigQuery の REST API によるクロスリージョンのデータセットレプリケーションとフェイルオーバー予約の設定、および検索クエリへの適合度で行を並べ替える AI.RANK 関数が GA となりました。Ops Agent 2.72.0 ではログ処理が Logging Agent から Metric Agent サービスに移ったため、アップグレード後しばらくログが重複します。Google Cloud CLI 594.0.0 は、gcloud auth や gcloud billing accounts、gcloud compute shared-vpc で後ろに指定した --account / --project が位置引数を上書きしていた問題を直し、位置引数を優先する破壊的変更を含みます (ACCOUNT_ID と PROJECT_ID は必須に)。あわせて gcloud sql blue-green-deployments の GA 化や Cloud Run の regional endpoints の GA 化なども行われました。日本語ブログにはさらに、PyTorch Conference で発表された分散 LLM 推論のオープンソースの Kubernetes ネイティブスタック llm-d 1.0 (米国時間 10 月 21 日の記事の抄訳) が追加されました。Google が Red Hat や IBM などと設立した CNCF サンドボックスプロジェクトで、25 以上の組織から 500 人以上が参加しており、キャッシュ対応ルーティング、階層型 KV キャッシュ、優先度フロー制御、プリフィル / デコードの分離などを Google Cloud TPU と GPU で提供します。
