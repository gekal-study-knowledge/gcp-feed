    "summary": "<h2 class=\"release-note-product-title\">Google SecOps</h2>\n<h3>Feature</h3>\n<p><strong>Publisher Agent Version 2.7.2</strong></p>\n<p>Publisher Agent Version 2.7.2 is now available.</p>\n<p>This release includes the following updates and fixes for the Publisher and remote agent:</p>\n<ul>\n<li><strong>Alert lazy loading for remote actions:</strong> Remote action tasks now support loading case data on demand from the server when alert lazy loading is enabled, reducing task payload sizes.</li>\n<li><strong>Integration dependency installation fix:</strong> Fixed an issue where installing integrations with multiple interdependent dependency files could fail before all packages finished installing.</li>\n<li><strong>Remote agent deletion fix:</strong> Fixed directory permissions when running the self-destruction script during remote agent deletion.</li>\n<li><strong>Publisher stability and security updates:</strong> Improved Publisher resilience and addressed security vulnerabilities.</li>\n</ul>\n<h2 class=\"release-note-product-title\">Google SecOps SOAR</h2>\n<h3>Announcement</h3>\n<p>Release 6.3.107 is being rolled out to the first phase of regions as listed\n<a href=\"https://docs.cloud.google.com/chronicle/docs/soar/overview-and-introduction/soar-gradual-release\">here</a>.</p>\n<p>This release contains internal and customer bug fixes.</p>\n<h3>Feature</h3>\n<p><strong>Publisher Agent Version 2.7.2</strong></p>\n<p>Publisher Agent Version 2.7.2 is now available.</p>\n<p>This release includes the following updates and fixes for the Publisher and remote agent:</p>\n<ul>\n<li><strong>Alert lazy loading for remote actions:</strong> Remote action tasks now support loading case data on demand from the server when alert lazy loading is enabled, reducing task payload sizes.</li>\n<li><strong>Integration dependency installation fix:</strong> Fixed an issue where installing integrations with multiple interdependent dependency files could fail before all packages finished installing.</li>\n<li><strong>Remote agent deletion fix:</strong> Fixed directory permissions when running the self-destruction script during remote agent deletion.</li>\n<li><strong>Publisher stability and security updates:</strong> Improved Publisher resilience and addressed security vulnerabilities.</li>\n</ul>"
