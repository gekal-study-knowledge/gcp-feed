"overview": |
  この日はリリースノート 1 件のみで、Google SecOps の更新が中心でした。Publisher Agent バージョン 2.7.2 が利用可能になり、アラートの遅延読み込みが有効な場合にリモートアクションのタスクがケースデータをサーバーからオンデマンドで読み込めるようになって、タスクのペイロードサイズが削減されます。あわせて、相互に依存する複数の依存ファイルを持つインテグレーションのインストールが全パッケージのインストール完了前に失敗することがある問題、リモートエージェント削除時の自己削除スクリプト実行でのディレクトリ権限の問題が修正され、Publisher の安定性向上とセキュリティ脆弱性への対処も行われました。また Google SecOps SOAR のリリース 6.3.107 が第 1 フェーズのリージョンから順次展開されており、社内および顧客から報告されたバグの修正が含まれます。
