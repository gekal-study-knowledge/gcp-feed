    "summary": "<h2 class=\"release-note-product-title\">Google SecOps SOAR</h2>\n<h3>Announcement</h3>\n<p>Release 6.3.106 is being rolled out to the first phase of regions as listed\n<a href=\"https://docs.cloud.google.com/chronicle/docs/soar/overview-and-introduction/soar-gradual-release\">here</a>.</p>\n<h3>Feature</h3>\n<p><strong>Case activity tagging</strong></p>\n<p>You can now use custom tags for individual activities, comments, tasks, and\nactions on the Case Wall, and filter the wall view by those tags. This allows\nyou to categorize specific observations and filter the timeline to view only the\nentries relevant to your investigation or team.</p>\n<p>For more information, see <a href=\"https://docs.cloud.google.com/chronicle/docs/soar/investigate/working-with-cases/define-tags-in-cases-admin#add-activity-tag\">Add a tag to a Case Wall activity</a>.</p>"
