  "f1359ec277416f2f134f739356e301a6":
    "id": "f1359ec277416f2f134f739356e301a6"
    "title": "損害保険ジャパン:「正しく使われる」ための運用設計で、約 2 万ユーザーの Gemini Enterprise 活用を推進"
    "link": "https://cloud.google.com/blog/ja/topics/customers/sompo-japan-promotes-the-use-of-gemini-enterprise/"
    "published": "2026-11-09 10:00:00"
    "fetched": "2026-11-09 10:26:45"
    "summary": "<div class=\"block-paragraph\"><p>2026 年 1 月、損害保険ジャパン株式会社（以下、損保ジャパン）は、全社員約 2 万人を対象に Gemini Enterprise を PoC として検証導入しました。その後、わずか半年で週次アクティブ ユーザー率（WAU）が約 80% を記録。多くの社員が、日常業務で AI エージェントを利用しています。利用浸透・定着の背景には、従来型システムとは異なるリスクの捉え方と、ガバナンス、活用拡大・定着を一体で進める設計がありました。同社 DX 推進部の担当者に、その詳細を伺います。<br /></p><p><b>利用しているサービス:</b><br /> <a href=\"https://cloud.google.com/ai?e=48754805\">Gemini Enterprise</a>, <a href=\"https://cloud.google.com/bigquery?hl=ja\">BigQuery</a>, <a href=\"https://cloud.google.com/dns?e=48754805\">Cloud DNS</a>, <a href=\"https://cloud.google.com/security/products/armor?e=48754805\">Cloud Armar</a>, <a href=\"https://cloud.google.com/load-balancing?e=48754805\">Cloud Load Balancing</a>, <a href=\"https://cloud.google.com/run?e=48754805\">Cloud Run</a>, <a href=\"https://cloud.google.com/security/products/secret-manager?e=48754805\">Secret Manager</a>, <a href=\"https://docs.cloud.google.com/scheduler/docs/schedule-run-cron-job?hl=ja\">Cloud Scheduler</a>, <a href=\"https://cloud.google.com/storage?e=48754805\">Cloud Storage</a>, <a href=\"https://docs.cloud.google.com/iam/docs?hl=ja\">Cloud IAM</a>, <a href=\"https://cloud.google.com/monitoring?e=48754805\">Cloud Monitoring</a>, <a href=\"https://cloud.google.com/logging?e=48754805\">Cloud Logging</a>, <a href=\"https://docs.cloud.google.com/trace/docs?hl=ja\">Cloud Trace</a>, <a href=\"https://docs.cloud.google.com/artifact-registry/docs?hl=ja\">Artifact Registry</a>, <a href=\"https://cloud.google.com/vpc?e=48754805\">Virtual Private Cloud（VPC）</a></p><h3><b>恐れたのは「システムが落ちること」ではなく「使われない」こと</b></h3><p>国内「 3 メガ損保」の一角として知られる ＳＯＭＰＯホールディングスの中核を担う損保ジャパン。同社は業務効率化のために全国 2 万人の社員向けにチャットボット型 AI を開発し、2025 年から約 1 年にわたって提供していました。しかし、ほどなくして Gemini Enterprise への移行を決断します。同社 DX 推進部 チーフエンジニア 城市 由佳理氏は、その理由を次のように説明します。</p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A9856-1_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A9856-1_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p>「私たちは効率的なリサーチや文書作成、定型業務の自動化のために、全社でもっと AI 活用を推進していきたいと考えていました。そこでまず、目を付けたのが Gemini Notebook です。社内文書をアップロードするだけで、専門知識の検索・要約ができる Gemini Notebook こそ、当時の私たちが求めていたものでした。そして、そのノートブックと連携・活用できる AI エージェント基盤として Gemini Enterprise を選んだという流れです。」</p><p>とは言え、生成 AI サービス、特に AI エージェントのような新しい技術は、提供するだけでは定着しません。社員が最初の一歩を踏み出すにはまず「何に使えるのか」を知ってもらう必要があります。同時に、誤った使い方を防ぐガードレールも欠かせません。機密情報の漏洩や倫理、セキュリティ上の問題は、そこで生じるからです。城市氏は、これらの課題を解決すべく、従来から大きく考え方を変えることを決意しました。<br /></p><p>「従来のシステム運用では、落とさず安定稼働させることが最大の命題でした。しかし AI エージェントの運用では、より多くの人たちに使ってもらえること、そしてなにより、正しく使われることにこそ比重を置くべきだと考え、『活用拡大』『安全な利用・ガバナンス』『利用の定着』を達成すべき 3 つの目標としました。」（城市氏）</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"全体アーキ図_SOMPO\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/QuanTiakiTu_SOMPO.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><strong style=\"vertical-align: baseline;\">可視化が支える定着、市民開発が広げる活用</strong></h3>\n<p><span style=\"vertical-align: baseline;\">最後の「利用の定着」に向けては、Discovery Engine API の監査ログをBigQuery に集約し、全体の DAU・WAU や継続率、公式ノートブックやカスタム エージェントの利用数、部署ごとの利用率という 3 つの切り口で可視化し、細かな手立てを打っていきました。</span></p>\n<p><span style=\"vertical-align: baseline;\">また、活用が進む先進部署の取り組みを推進事例として展開し、勉強会などのイベント効果をデータで検証・対策。Cloud Monitoring で致命的エラーの即時通知、内部エラー多発の閾値検知、API クォータ逼迫の予兆検知という 3 種類のアラートを設定し、利用者のモチベーションを削ぐ障害をプロアクティブに防ぐ取り組みも行っています。</span></p>\n<p><span style=\"vertical-align: baseline;\">さらに、2026 年 5 月には、カスタム エージェントの作成・共有機能を現場に開放。社内のポリシーに最適化してより柔軟な作成・権限管理を実現するために、エージェント一覧データを BigQuery に集約してルール逸脱を自動モニタリングし、該当ユーザーに是正案内を送る仕組みを独自開発しています。一律に利用を制限するのではなく、監視と是正によって「自由な市民開発」と「ガバナンス」を両立させた成果について、城市氏はこう語ります。</span></p>\n<p><span style=\"vertical-align: baseline;\">「自分たちで作って公開するものは、その部署の人たちが本当に使いたいものです。自分たちの業務に必要なものを、自分たちで作れるようになったことで、日次アクティブ ユーザー率（DAU）が 50% 超、週次アクティブ ユーザー率（WAU）が約 80% にまで高まりました。また、Gemini Enterprise 導入以降の生成 AI 活用の盛り上がりを受けて、生成 AI を相棒のように捉え、どう使えばよいかを社員同士で情報交換する文化も生まれました。勉強会を開いたり、各部門を回って使い方を教えたり、その中から新しいエージェントを開発したりする動きも加速しています。そうした中、各部署においてAI 活用を牽引する社員も増えてきており、今後、さらに市民開発が加速していくことを期待しています。」</span></p>\n<p><span style=\"vertical-align: baseline;\">AI エージェント基盤の価値は、契約ライセンス数や利用者数だけでは測れません。利用資格を教育で担保し、入出力されるデータの安全性を確保し、利用状況データを次の支援へ生かし、ガバナンスを維持しながら現場の創意を発展させることが肝要です。損保ジャパンの取り組みは、生成 AI を「会社から配布されたツール」から「社員が自らを成長させる業務インフラ」へ変えていく好例だと言えるでしょう。</span></p>\n<hr />\n<p> </p></div>\n<div class=\"block-paragraph_with_image\"><div class=\"article-module h-c-page\">\n  <div class=\"h-c-grid uni-paragraph-wrap\">\n    <div class=\"uni-paragraph\n      h-c-grid__col h-c-grid__col--8 h-c-grid__col-m--6 h-c-grid__col-l--6\n      h-c-grid__col--offset-2 h-c-grid__col-m--offset-3 h-c-grid__col-l--offset-3\">\n\n      \n\n\n\n\n\n\n  \n\n    <figure class=\"article-image--wrap-small\n      \n      \">\n\n      \n      \n        \n        <img alt=\"_53A9888-2_small\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/_53A9888-2_small.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n\n\n\n\n\n      <p><a href=\"https://www.sompo-japan.co.jp/\"><b>損害保険ジャパン株式会社</b></a><br />1888 年創業。SOMPO ホールディングスの中核企業として、自動車保険や火災保険をはじめとする損害保険事業やリスクマネジメントサービスなどを展開。「安心・安全・健康のテーマパーク」の実現を掲げ、デジタル技術や生成 AI の積極的な業務活用を通じて、社会課題の解決と新たな価値創出に取り組んでいる。<br /></p><p><b>インタビュイー</b><br />DX 推進部 チーフエンジニア</p><p>城市 由佳理 氏</p>\n    </div>\n  </div>\n</div>\n\n</div>\n<div class=\"block-paragraph_advanced\"><hr />\n<p><strong style=\"vertical-align: baseline;\">▼ セッション動画を観る<br /></strong><span style=\"vertical-align: baseline;\">本事例のインタビュイーによるセッション動画が公開中です。あわせてご覧ください。<br /></span><span style=\"vertical-align: baseline;\">【Next Tokyo 26 セッション】</span><a href=\"https://www.googlecloudevents.com/next-tokyo/v/s-4393272\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">損害保険ジャパンにおける 2 万人規模の Gemini Enterprise 安定運用を支える技術的アプローチ</span></a></p>\n<p><strong style=\"vertical-align: baseline;\">▼他の導入事例記事を読む<br /></strong><span style=\"vertical-align: baseline;\">その他の Google Cloud 導入事例は</span><a href=\"https://cloud.google.com/customers?hl=ja&amp;e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">こちら</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p></div>"
  "2a6ae13c4e964b9aa513b41142cb9bfd":
    "id": "2a6ae13c4e964b9aa513b41142cb9bfd"
    "title": "IAM Helper エージェント スキルと MCP ツールでエージェントを安全にスケール"
    "link": "https://cloud.google.com/blog/ja/products/identity-security/scale-agents-securely-with-iam-helper-agent-skills-and-mcp-tools/"
    "published": "2026-11-09 10:00:00"
    "fetched": "2026-11-09 10:26:45"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 28 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/identity-security/scale-agents-securely-with-iam-helper-agent-skills-and-mcp-tools?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">アプリケーション構築のために自律型エージェントを導入する組織が増えるなか、ID とアクセスの保護はより大きな課題となっています。クラウド リソースのプロビジョニング、Terraform の作成、マイクロサービスのデプロイをマシンスピードで行うためにエージェントに依存しているデベロッパーは、セキュリティの摩擦が拡大するにつれて、CI / CD パイプラインがすぐにブロックされてしまう事態に直面します。</span></p>\n<p><span style=\"vertical-align: baseline;\">このたび、エージェントの時代の ID とアクセスの管理に先手を打つために、IAM Helper をリリースしました。このエージェント向けのインテリジェントな構成要素スイートは、複雑なエンドツーエンドの IAM ワークフローを自動化できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud IAM のエージェント ネイティブなオーケストレーションおよびインターフェース レイヤとして、IAM Helper は、Google Cloud のコア IAM エンジン（ポリシー インテリジェンスや Privileged Access Manager（PAM）を含む）を強化し、自律型コード アシスタント、デプロイ パイプライン、カスタム エージェントから IAM スキルを直接呼び出せるようにします。この機能を使用すると、最小権限のセキュリティとエージェント ガバナンスを維持するための管理上のオーバーヘッドを削減しながら、利便性を最大限に高め、デプロイを加速させることができます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">IAM Helper エージェント スキル: 自動化されたガバナンスによる迅速かつ安全なデプロイ</strong></h3>\n<p><span style=\"vertical-align: baseline;\">権限のブロックを手動でトラブルシューティングすることは、エンジニアリング チームと管理者にとっての負担となります。一方、近道を選ぶと、エージェントに過剰な権限が付与され、最小権限の原則が損なわれるリスクがあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">IAM Helper を使用すると、エージェントがアクセス管理を動的に処理できます。ポリシー評価の負担を人間の管理者や LLM から取り除き、複雑なオーケストレーションを Google Cloud バックエンドに直接オフロードすることで、トークン効率を最大化し、コストのかかる運用上のボトルネックを防ぎます。</span></p>\n<p><span style=\"vertical-align: baseline;\">IAM Helper エージェント スキルは、独立したユーティリティとして動作するのではなく、クラウドへのアクセスのライフサイクル全体でエージェントをガイドします。オープンな</span><a href=\"https://agentskills.io/home\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">エージェント スキル標準</span></a><span style=\"vertical-align: baseline;\">を使用してパッケージ化されたこれらのエンドツーエンドのワークフロー、ヘルパー スクリプト、ガードレールは、複数の基盤となる関数と API をオーケストレートして、複雑な IAM タスクを解決できます。一般的なエージェント（Gemini CLI、Gemini Cloud Assist、ADK、Claude Code、Cursor）で動作します。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">組み込みのガードレールと実際の効果</strong></h3>\n<p><span style=\"vertical-align: baseline;\">すべての IAM Helper エージェント スキルは、読み取り専用の検出とポリシーの変更を分けて扱います。診断とシミュレーションは自動的に実行されますが、アクセス ポリシーの変更は、カスタマイズ可能なリスク階層に基づいて人間参加型（HITL）の確認のために一時停止されます。IAM ヘルパーの価値を実際に確認するために、2 つの日常的なシナリオがどのように変わるのかを見てみましょう。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ユーザー支援型の修復の拡張</strong><span style=\"vertical-align: baseline;\">: デベロッパーのコーディング エージェントが新しいアプリケーションをデプロイしているときに 403 エラーが発生したとします。サポート チケットを送信して待機する代わりに、エージェントは、iam-helper-for-troubleshooting を使用して不足している Pub/Sub 権限を数秒で特定し、iam-helper-for-privileged-access-management を使用して 1 時間の JIT 付与をリクエストすることで、数時間に及ぶデバッグの負担を排除します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">自律型パイプラインの自己修復</strong><span style=\"vertical-align: baseline;\">: インフラストラクチャ エージェントが、定常的なデプロイ パイプライン中に権限ブロックに遭遇します。パイプラインは、ビルドを失敗させるのではなく、IAM Helper エージェント スキルを使用して、最小権限のポリシーを修正して生成します。さらに、iam-helper-for-policy-simulator を介して 90 日間のログを検証し、アクティブなサービスに影響がないことを確認したうえで、変更を管理者にルーティングして迅速な承認を仰ぎます。</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">IAM Helper エージェント スキルは、トークンと費用の効率を最大化するように設計されており、エージェントが複数ステップの管理操作を自律的に実行することを可能にします。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">コンプライアンスに準拠した最小権限ポリシーの作成</strong><span style=\"vertical-align: baseline;\">: DevOps エンジニアがアクセス要件を JSON、YAML、Terraform HCL に変換すると、iam-helper-for-policy-management が IAM v1 許可バインディングと IAM v2 拒否ルールを生成して検証します。公開アクセス（allUsers）や広範な基本ロール（roles/owner、roles/editor）など、リスクの高い構成が適用される前に自動的に検出してブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">403 エラーを数秒で解決</strong><span style=\"vertical-align: baseline;\">: オンコール エンジニアやデプロイ エージェントが、わかりにくい 403 PERMISSION_DENIED エラーに遭遇した場合、iam-helper-for-troubleshooting が不足している権限やブロックしているルールを数秒で特定します。これはユーザーのロールに応じて適応されます。デベロッパーの場合は、ローカルでブロックを解除できるかどうかを確認したり、管理者向けに構造化されたチケットを生成したりできます（リクエスト フロー）。一方、セキュリティ管理者の場合は、組織、フォルダ、プロジェクトの階層全体で継承された許可ルールと v2 拒否ルールをトレースして問題を解決できます（解決フロー）。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">変更をロールアウトする前に影響範囲をシミュレート</strong><span style=\"vertical-align: baseline;\">: プラットフォーム エンジニアは、ポリシーを更新したり、IAM Recommender のロール削減を適用したりする前に、アクティブなワークロードに影響がないことを確認する必要があります。iam-helper-for-policy-simulator は、構造化された「計画、シミュレート、分析、適用」のフローをエージェントに案内し、提案された変更を 90 日間の過去のアクセスログに対してテストして、更新が有効になる前に既存のトラフィックが中断されないことを確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">常設特権を付与するのではなく、ジャストインタイムでアクセス権を昇格</strong><span style=\"vertical-align: baseline;\">: 対応者やメンテナンス エージェントが本番環境への一時的なアクセスを必要とする場合、iam-helper-for-privileged-access-management が Privileged Access Manager（PAM）を介してオンデマンド認証情報のライフサイクルを管理します。リクエスト元、管理者、承認者のワークフローをサポートしているため、昇格されたアクセス権は監査され、時間制限が設けられ、タスクが完了すると自動的に取り消されます。</span></p>\n</li>\n</ol>\n<p><span style=\"vertical-align: baseline;\">IAM Helper エージェント スキルは、高度なワークフロー ロジックを提供しますが、すべて共通の基本的な MCP ツールセットに基づいています。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Google Cloud IAM MCP ツールを活用</strong></h3>\n<p><span style=\"vertical-align: baseline;\">Google Cloud IAM Helper MCP ツールは、コア IAM エンドポイント（Policy Troubleshooter、Policy Analyzer、Policy Simulator、IAM v1 / v2 API）全体で Google マネージド MCP サーバーを介して公開されるアトミックな読み取り専用関数を通じて、バックエンド接続を提供します。</span></p>\n<p><span style=\"vertical-align: baseline;\">MCP ツールを使用すると、チームがカスタム API ラッパーを作成しなくても、エージェントは標準的な方法でクラウド バックエンドにクエリを実行できるようになります。プロンプト内で冗長なポリシー ドキュメントを解析することなく正確な回答を得られるため、トークン効率が最大化されます。エージェントは、これらのツールを動的に検出して呼び出し、カスタム ロジックが必要な場合に権限の確認やロールの一覧表示などの基本的な操作を実行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">階層の走査、グループの展開、ポリシーの評価などの操作は、専用の IAM エンドポイント（IAM v1 許可ロール、IAM v2 拒否、Policy Troubleshooter、Policy Analyzer など）で行われるため、スキルは最小限のトークン使用量で迅速かつ正確に実行されます。チームは、独自のカスタム エージェント スキルを作成する際に、これらのアトミックな MCP ツールを直接使用することもできます。これにより、Google Cloud の IAM 機能を社内のチケット発行システム、カスタム コンプライアンス チェック、既存のデプロイ パイプラインと簡単に組み合わせることができます。</span></p>\n<h3><strong style=\"vertical-align: baseline;\">使ってみる</strong></h3>\n<p><span style=\"vertical-align: baseline;\">エージェント ワークフローを加速させ、運用上のオーバーヘッドを削減し、インテリジェントでスケーラブルなセキュリティをデプロイ パイプラインに導入しましょう。IAM Helper エージェント スキルを使用した構築を今すぐ始めるには、</span><a href=\"https://github.com/google/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Google Cloud エージェント スキル カタログ</span></a><span style=\"vertical-align: baseline;\">をご覧ください。詳しくは、公式の</span><a href=\"https://docs.cloud.google.com/iam/docs\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">IAM ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご確認ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">プロダクト マネージャー、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Siddharth Deekshit</strong></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">シニア ソフトウェア エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Surekha Balla</strong></p></div>"
  "9fb1cf80b489d3bb0099c34f86af19ba":
    "id": "9fb1cf80b489d3bb0099c34f86af19ba"
    "title": "Google Cloud Developer プラグインが Antigravity Marketplace から入手可能に"
    "link": "https://cloud.google.com/blog/ja/topics/developers-practitioners/google-cloud-developer-plugin-now-available-in-antigravity-marketplace/"
    "published": "2026-11-09 11:00:00"
    "fetched": "2026-11-09 18:09:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 11 月 3 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/topics/developers-practitioners/google-cloud-developer-plugin-now-available-in-antigravity-marketplace?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">自律型 AI エージェントを使用してクラウド ソリューションを構築する際は、迅速性、安全性、信頼性が感じられることが重要です。しかし、そのクラウドに固有のコンテキストが欠けていると、コーディング エージェントは満足に機能することが難しくなります。サポートされていない SDK 構文や無効なコマンド フラグを生成したり、必要な Identity and Access Management（IAM）権限なしでオペレーションを試行したりする可能性があります。さらに悪いことに、監督されていないエージェントが明示的な許可なしに、課金対象の API を有効にしたり、クラウド リソースをプロビジョニングしたりする可能性もあります。</span></p>\n<p><span style=\"vertical-align: baseline;\">そこで推奨されるのが、</span><strong style=\"vertical-align: baseline;\">google-cloud-developer</strong><span style=\"vertical-align: baseline;\"> プラグインの使用です。このたび、このプラグインが </span><code style=\"vertical-align: baseline;\">Build with Google</code><span style=\"vertical-align: baseline;\"> セクションの Antigravity Marketplace から直接インストールできるようになりました。このプラグインにより、Google Cloud でのソリューション構築に必要な基礎スキル、安全ガードレール、ライブ ドキュメントへのグラウンディングが Antigravity に備わります。Marketplace を使用したプラグインのインストール方法については、</span><a href=\"https://antigravity.google/docs/marketplace/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Antigravity のドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><span style=\"vertical-align: baseline;\">インストール後の構成は簡単です。バンドルされている Developer Knowledge Model Context Protocol（MCP）サーバーは、デフォルトで事前承認されています。API キーを構成したり、OAuth トークンを交換したり、構成ファイルを編集したりする必要はありません。プラグインをインストールすると、エージェントがすぐに Google の公式デベロッパー向けドキュメントに接続されます。</span></p>\n<p><span style=\"vertical-align: baseline;\">この投稿では、プラグインに含まれる要素、ワンクリックでインストールする方法、エージェントを最新の Google Cloud ドキュメントにグラウンディングする方法について説明します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Google Cloud Developer プラグインを使用する理由</strong></h4>\n<p><span style=\"vertical-align: baseline;\">コーディング エージェントは、静的なトレーニング データに依存しがちです。一方、クラウド プラットフォームは頻繁に更新されるので、モデルは古いクライアント ライブラリや無効なパラメータでコードを生成してしまう可能性があります。</span></p>\n<p><span style=\"vertical-align: baseline;\">この問題は、</span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> プラグインを使用することで解決できます。厳選されたスキル、インテリジェントなルーティング ルール、そして Developer Knowledge MCP サーバーを 1 つのポータブル パッケージにバンドルしたプラグインです。</span></p>\n<p><span style=\"vertical-align: baseline;\">このプラグインの主要な 3 つのメリットは以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">ライブ ドキュメントへのグラウンディング</strong><span style=\"vertical-align: baseline;\">: エージェントは、Streamable HTTP を介して Google Cloud の公式ドキュメントを参照します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">安全性と費用のガードレール</strong><span style=\"vertical-align: baseline;\">: エージェントは最小権限の IAM パターンを適用し、課金対象の API を有効にしたり、クラウド インフラストラクチャを変更したりする場合は、必ず事前にユーザーの同意を確認します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">環境の把握</strong><span style=\"vertical-align: baseline;\">: エージェントは、ローカル環境を検査し、既存の CLI 構成を検出して、安全な実行ロードマップを設計したうえでコマンドを実行します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">プラグインに含まれる要素</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このプラグインは、コアとなるベースライン スキルとライブ ドキュメントへのグラウンディング機能を、インテリジェントなスキル ルーティング アーキテクチャと組み合わせています。エージェントを一定の機能セットに制限するのではなく、オンデマンドで Google から専門的なスキルを検出して取得する拡張可能なゲートウェイとして機能します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">エージェント スキルのバンドル</strong></h4>\n<p><span style=\"vertical-align: baseline;\">エージェント スキルによって、即座に適用される重要ガードレール、ライブ ドキュメントへのグラウンディング、幅広いカタログを参照する動的検出エンジンといった機能が提供されます。バンドルされているスキルの代表的なものは以下のとおりです。</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/finding-google-skills\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">finding-google-skills</code></a><span style=\"vertical-align: baseline;\">: GitHub の </span><a href=\"https://g.dev/ai/skills\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">google/skills</code><span style=\"text-decoration: underline; vertical-align: baseline;\"> リポジトリからオンデマンドでスキルを検出して読み込むことで、柔軟なスキル ルーティングを実現します</span></a><span style=\"vertical-align: baseline;\">。個々のスキルを調査、インストール、管理する必要はなく、エージェントが専門的なタスクを実行するために必要な指示をリアルタイムで動的に取得します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/retrieving-developer-knowledge\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">retrieving-developer-knowledge</strong></a><span style=\"vertical-align: baseline;\">: Google Cloud、Firebase、Android、ウェブ、Gemini 全般にわたる公式 Google ドキュメントに基づいた回答とコードサンプルを提供します。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/gcloud\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">gcloud</code></a><span style=\"vertical-align: baseline;\">: 実行ガードレールを施行し、構文を検証して、Google Cloud CLI（</span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\">）コマンドに安全チェックを適用します。これによって、誤操作による破壊的な行為が防止され、適切な管理を徹底できます。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/google-cloud-recipe-auth\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">google-cloud-recipe-auth</strong></a><span style=\"vertical-align: baseline;\">: エージェントを安全な認証パターンに誘導します。サービス ID とアプリケーションのデフォルト認証情報（ADC）を適用し、サービス アカウント JSON キーのダウンロードなどの高リスク アクションをブロックします。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><a href=\"https://github.com/google/skills/tree/main/plugins/cloud/google-cloud-developer/skills/google-cloud-recipe-onboarding\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">google-cloud-recipe-onboarding</strong></a><span style=\"vertical-align: baseline;\">: 初プロジェクトの初期設定、アカウントのオンボーディング、請求の確認といった処理の進行を適正に導きます。このスキルは、サービスを有効にする前に、プロジェクトの状態を監査します。</span></p>\n</li>\n</ul>\n<h4><strong style=\"vertical-align: baseline;\">事前承認済みの Developer Knowledge MCP サーバー</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このプラグインは、エージェントを</span><a href=\"https://developers.google.com/knowledge/mcp\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">Developer Knowledge MCP サーバー</span></a><span style=\"vertical-align: baseline;\">に接続します。通常、MCP サーバーを追加するには、API キーを手動で処理する必要があります。しかし、Antigravity Marketplace と </span><code style=\"vertical-align: baseline;\">Build with Google</code><span style=\"vertical-align: baseline;\"> カタログの統合により、この MCP サーバーは事前承認されており、Antigravity が認証を透過的に管理するので、手動で追加する必要がありません。プラグインをインストールすると、エージェントが直ちに Google のドキュメント サーバーに接続されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">スマート ルーティング ルール: オンデマンドの機能拡張</strong></h4>\n<p><span style=\"vertical-align: baseline;\">このプラグインには、ルーティング ルール </span><code style=\"vertical-align: baseline;\">google-cloud-discovery.md</code><span style=\"vertical-align: baseline;\"> が含まれており、バンドルされているスキル </span><code style=\"vertical-align: baseline;\">finding-google-skills</code><span style=\"vertical-align: baseline;\"> とアクティブに連携します。プロンプトが専門的なトピックに触れると、このルーティング ルールにより、エージェントが必要に応じて公開カタログから関連するスキルを取得します。</span></p>\n<p><span style=\"vertical-align: baseline;\">この動的ルーティングにより、エージェントが高速化され、トークン効率が向上します。コンテキスト ウィンドウを煩雑にする多数の特殊なスキルを事前に読み込むのではなく、タスクで必要になったときにのみ、エージェントが詳細な専門ガイダンスを読み込む仕組みです。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">ワンクリックでプラグインをインストール</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Developer プラグインは、Antigravity Marketplace の UI またはターミナルからインストールできます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"google-cloud-developer-plugin-now-available-in-antigravity-marketplace-agy-install\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/google-cloud-developer-plugin-now-available-in-antigravity-marketplace-agy.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">コマンドラインを使用する場合は、次のコマンドを使用してプラグインをインストールしてください。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;agy plugin install google-cloud-developer&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600c2cc910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">CLI がスキルを登録し、Developer Knowledge MCP サーバーにすぐに接続されます。</span><a href=\"https://g.dev/ai/skills\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub</span></a><span style=\"vertical-align: baseline;\"> でプラグインとスキルを直接確認することもできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">プラグインの動作: ライブ ドキュメントの照会</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Developer プラグインをインストールすると、エージェントは自動的に回答を最新のドキュメントにグラウンディングします。特別な構文でプロンプトを作成する必要はありません。実用例を見てみましょう。</span></p>\n<p><span style=\"font-style: italic; vertical-align: baseline;\">「ドキュメントによると、GKE と Cloud Run の主な違いは何ですか？それぞれどのような場合に使用すべきですか？」</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud Developer プラグインがインストールされていない場合、エージェントは推測や古い情報に基づいて回答する可能性があります。一方、</span><code style=\"vertical-align: baseline;\">google-cloud-developer</code><span style=\"vertical-align: baseline;\"> プラグインが利用可能な場合、エージェントは事前承認済みの Developer Knowledge MCP サーバーにクエリを送信します。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"google-cloud-developer-plugin-now-available-in-antigravity-marketplace-mcp-usage\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/google-cloud-developer-plugin-now-available-in-antigravity-marketplace-mcp.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">これにより、エージェントは、公式ドキュメントに基づいて、検証済みの明確な回答を生成します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">筆者への問い合わせ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">日々のワークフローでこのプラグインをどのように活用されているか、ぜひお聞かせください。フィードバックやご質問がございましたら、</span><a href=\"https://www.linkedin.com/in/remigiusz-samborski/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">LinkedIn</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://x.com/RemikSamborski\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">X</span></a><span style=\"vertical-align: baseline;\">、</span><a href=\"https://bsky.app/profile/rsamborski.bsky.social\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Bluesky</span></a><span style=\"vertical-align: baseline;\"> でお気軽にお問い合わせください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">リード デベロッパーリレーションズ エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Remigiusz Samborski</strong></p></div>"
  "dd501bb52d5f92fcc4957526f531bf16":
    "id": "dd501bb52d5f92fcc4957526f531bf16"
    "title": "Gemini Enterprise を Snowflake のデータに安全に接続する方法"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/bridge-gemini-enterprise-and-snowflake-with-google-adk/"
    "published": "2026-11-09 10:10:00"
    "fetched": "2026-11-09 18:09:10"
    "summary": "<div class=\"block-paragraph\"><p>※この投稿は米国時間 2026 年 10 月 28 日に、Google Cloud blog に<a href=\"https://cloud.google.com/blog/products/data-analytics/bridge-gemini-enterprise-and-snowflake-with-google-adk?e=48754805&amp;hl=en\">投稿</a>されたものの抄訳です。</p><p>エンタープライズ AI には、単純なチャット インターフェースの域にとどまらない機能が求められます。その真の価値を発揮させるには、厳格なセキュリティとデータ ガバナンスを維持しながら、AI エージェントがデータ ウェアハウスにアクセスして実用的なインサイトを生成できるようにする必要があります。</p><p>このガイドでは、Google Cloud の Gemini Enterprise と Snowflake が安全に連携できるよう橋渡しする方法について説明します。Model Context Protocol（MCP）と Google Agent Development Kit（ADK）を使用すると、自然言語の理解、Snowflake Cortex を介した正確な SQL 生成、ユーザーレベル権限でのクエリ実行ができるアシスタントとして機能するエージェントを構築できます。</p><p><b>適切な統合パターンを選ぶ</b></p><p><b>直接接続とカスタム オーケストレーション</b></p><p>この投稿でご紹介する Google ADK アーキテクチャは、高度なカスタム オーケストレーション パターンに該当します。Snowflake の分析情報を外部のエンタープライズ ツールと組み合わせるワークフロー、カスタム推論ループ、Gemini Agent Engine でのクロス プラットフォーム状態管理など、Google Cloud で複雑なマルチエージェント システムを構築するデベロッパー向けに設計されています。</p><p>標準的なエンタープライズにおける、Gemini Enterprise を Snowflake に直接接続する基本的なユースケースには、<a href=\"https://www.snowflake.com/en/developers/guides/quickstart-iceberg-cortex-gemini/\" target=\"_blank\"> こちらのリンク</a>で説明されている共同ソリューションをご利用ください。</p><p><b>アーキテクチャの概要</b></p><p>このアーキテクチャは、ビジネス ユーザーが「前四半期にテキサス州で最も売れた商品 5 つは？」といった質問をできるようにします。</p><p>エージェントは未加工の SQL 実行をクライアントに公開するのではなく、クエリの生成と実行の両方を、Snowflake MCP サーバーを介して公開されている管理された Snowflake Cortex Agent に委任します。</p><ol><li><b>管理された変換</b>: ADK エージェントがユーザーの自然言語による質問を Snowflake MCP サーバーに渡すと、Snowflake MCP サーバーが Cortex Analyst セマンティック ビューを基盤とする Cortex Agent（CORTEX_AGENT_RUN）を呼び出します。</li><li><b>管理された境界内での直接実行</b>: Cortex Agent は質問を SQL に変換し、認証済みユーザーの OAuth セッションとロール権限を使用して Snowflake 内で直接実行して、構造化された結果を ADK エージェントに返します。</li></ol><p>このアプローチにより、企業のセマンティック定義にマッピングされた、決定論的な Text-to-SQL 変換が可能になります。クエリの実行は Snowflake の管理された境界内で行われ、スキーマのハルシネーションや検証されていない SQL の実行のリスクが軽減されます。</p><p><b>システム アーキテクチャのフロー</b></p><p>以下の図は、Gemini Enterprise アプリと Snowflake エコシステム間の信頼境界と、番号付きの実行フローを示しています。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_rLGaLNc.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>詳細な実行シーケンス</b></p><p>エージェントが MCP を介して自然言語クエリの変換と管理された実行を Snowflake Cortex Agent に委任する仕組みを、以下のシーケンス図に示します。</p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image2_l1dz0na.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph\"><p><b>ステップ 1: Snowflake のセキュリティ インテグレーションを設定する</b></p><p>エンタープライズ AI における最大のリスクは、汎用サービス アカウントを介してモデルに広範なアクセス権を付与してしまい、ユーザーがセキュリティ制限を回避できるようになることです。この問題は、OAuth 2.0 を使用して別のユーザーに成り代わることで解決できます。</p><p>まず、クライアント シークレットを保護するために、Snowflake で OAuth 機密クライアントを作成します。以下のスニペットを使用して、Snowflake 内でセキュリティ インテグレーションを構成します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;USE ROLE ACCOUNTADMIN;  \\r\\nCREATE OR REPLACE SECURITY INTEGRATION &lt;SECURITY_INTEGRATION_NAME&gt; \\r\\nTYPE = OAUTH \\r\\nENABLED = TRUE \\r\\nOAUTH_CLIENT = CUSTOM \\r\\nOAUTH_CLIENT_TYPE = &#x27;CONFIDENTIAL&#x27; \\r\\n-- Google Cloud&#x27;s official handshake receiver address: \\r\\nOAUTH_REDIRECT_URI = &#x27;https://vertexaisearch.cloud.google.com/oauth-redirect&#x27; \\r\\nOAUTH_ISSUE_REFRESH_TOKENS = TRUE \\r\\n-- Let the connection stay alive for 90 days (max Snowflake allowed limit) \\r\\nOAUTH_REFRESH_TOKEN_VALIDITY = 7776000;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600f0daa10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>Google Cloud の構成に必要なクライアント認証情報を取得するには、Snowflake で次のコマンドを実行します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Retrieve OAuth Client ID and Client Secret\\r\\nSELECT SYSTEM$SHOW_OAUTH_CLIENT_SECRETS(&#x27;&lt;SECURITY_INTEGRATION_NAME&gt;&#x27;);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600718e910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>ステップ 2: データ ガバナンスとアクセス制御</b></p><p>Snowflake 内にエージェント専用のロールを作成して、最小権限の原則を適用します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;USE ROLE SECURITYADMIN;\\r\\n-- 1. Create a dedicated role\\r\\nCREATE ROLE IF NOT EXISTS &lt;GENAI_ROLE_NAME&gt;;\\r\\nGRANT ROLE &lt;GENAI_ROLE_NAME&gt; TO USER &lt;BUSINESS_USER_NAME&gt;;  \\r\\nUSE ROLE SYSADMIN;\\r\\n-- 2. Grant structural access\\r\\nGRANT USAGE ON DATABASE &lt;DATABASE_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\nGRANT USAGE ON SCHEMA &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 3. Grant compute access\\r\\nGRANT USAGE ON WAREHOUSE &lt;WAREHOUSE_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 4 .Grant access to the semantic layer\\r\\nGRANT SELECT, REFERENCES ON SEMANTIC VIEW &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SEMANTIC_VIEW_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 5. Grant select privileges on underlying raw data tables\\r\\nGRANT SELECT ON ALL TABLES IN SCHEMA &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbced0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>重要</b></p><ul><li>ユーザー コンテキストには、セマンティック ビューのベースとなる物理テーブルに対する SELECT 権限が必要です。セマンティック ビューへのアクセスのみを許可すると、クエリの実行中にランタイム エラーが発生します。</li><li>ベーステーブルへの直接アクセスを許可することがセキュリティ ポリシーで禁止されている場合は、物理テーブルの上に<a href=\"https://docs.snowflake.com/en/user-guide/views-secure\" target=\"_blank\"> <b>Snowflake セキュアビュー</b></a>を配置し、その上にセマンティック ビューを構築します。Snowflake ビューは<b>オーナーの権限</b>で実行されるため、ユーザーの生成 AI ロールには、元テーブルではなく、セキュアビューとセマンティック ビューに対する SELECT 権限のみが必要となります。</li><li><b>Snowflake OAuth トークン</b>は、認可の時点でユーザーの DEFAULT_ROLE と DEFAULT_WAREHOUSE を取得してバインドします。これらのデフォルトが設定される前にユーザーが接続を承認すると、セッションは誤ったロール（その時点で利用可能なロール）にロックされ、本来必要な権限がそのロールにない場合、クエリの実行は失敗します。<ul><li><b>デフォルトを設定する（下図を参照）:</b> Gemini Enterprise で承認する前に設定します。</li><li><b>接続を認可する:</b> ユーザーに Gemini Enterprise で 1 回限りの OAuth 認可を実行してもらいます。</li><li><b>（省略可）デフォルトに戻す:</b> 認可後、ユーザーは安全に Snowflake のデフォルトのロールとウェアハウスを標準の運用設定に戻すことができます。</li></ul></li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;ALTER USER &lt;BUSINESS_USER_NAME&gt; SET DEFAULT_ROLE = &#x27;&lt;GENAI_ROLE_NAME&gt;&#x27;;\\r\\nALTER USER &lt;BUSINESS_USER_NAME&gt; SET DEFAULT_WAREHOUSE = &#x27;&lt;WAREHOUSE_NAME&gt;&#x27;;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbf9d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>ステップ 3: Snowflake 内で Cortex Agent と MCP サーバーをプロビジョニングする</b></p><p>次に、セマンティック ビューを使用して Snowflake で管理された Cortex Agent を作成し、CORTEX_AGENT_RUN ツールタイプを介してエージェントを公開する MCP サーバーをプロビジョニングします。このアプローチでは、SQL 生成とクエリ実行の両方を Snowflake に委任しながら、呼び出し元の OAuth ID とロール権限を適用します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;USE DATABASE &lt;DATABASE_NAME&gt;;\\r\\nUSE SCHEMA &lt;SCHEMA_NAME&gt;;\\r\\nUSE ROLE SYSADMIN;\\r\\n\\r\\n-- 1. Create the Cortex Agent over your semantic view\\r\\nCREATE OR REPLACE AGENT &lt;AGENT_NAME&gt;\\r\\n  COMMENT = \\&#x27;Governed data assistant for business queries\\&#x27;\\r\\n  PROFILE = \\&#x27;{&quot;cortex_analyst&quot;: {&quot;semantic_models&quot;: [&quot;&lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SEMANTIC_VIEW_NAME&gt;&quot;]}}\\&#x27;;\\r\\n\\r\\n-- 2. Provision the MCP Server exposing the Cortex Agent\\r\\nCREATE OR REPLACE MCP SERVER &lt;SERVER_NAME&gt;\\r\\nFROM SPECIFICATION $$\\r\\ntools:\\r\\n  - name: &quot;run_cortex_agent&quot;\\r\\n    type: &quot;CORTEX_AGENT_RUN&quot;\\r\\n    identifier: &quot;&lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;AGENT_NAME&gt;&quot;\\r\\n    title: &quot;Cortex Agent Assistant&quot;\\r\\n    description: &quot;Converts natural language questions into SQL and executes them directly within Snowflake using the caller\\&#x27;s OAuth session permissions.&quot;\\r\\n$$;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbc8d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>分離とガバナンスに関する注記:</b> CORTEX_AGENT_RUN を使用することで、クエリの生成と実行がすべて Snowflake の管理されたセキュリティ境界内で行われるようになります。SYSTEM_EXECUTE_SQL などの未加工の実行ツールを外部クライアントに公開しないようにしてください。公開すると、不要なセキュリティ サーフェスが生じ、一元化された Cortex Agent ガバナンスが回避されてしまいます。</p><p><b>ステップ 4: MCP サーバーの URL を特定して作成する</b></p><p>ADK コードには、Snowflake が管理する MCP サーバーのエンドポイント URL が必要です。サーバーをプロビジョニングできたら、まずサーバーへのアクセスを許可する必要があります。その後、Snowflake ワークシートで次のクエリを使用して、正確なエンドポイント URL を取得できます。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;-- 1. Grant access to the Cortex Agent and the MCP server\\r\\nUSE ROLE SECURITYADMIN;\\r\\nGRANT USAGE ON AGENT &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;AGENT_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\nGRANT USAGE ON MCP SERVER &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SERVER_NAME&gt; TO ROLE &lt;GENAI_ROLE_NAME&gt;;\\r\\n-- 2. View the MCP URL\\r\\nDESCRIBE MCP SERVER &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SERVER_NAME&gt;;\\r\\n-- Or:\\r\\nDESC MCP SERVER &lt;DATABASE_NAME&gt;.&lt;SCHEMA_NAME&gt;.&lt;SERVER_NAME&gt;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbe590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>コマンド出力で、メタデータ プロパティを調べてエンドポイント リンクを見つけます。URL は次のような構成になっています。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;https://&lt;org_name&gt;-&lt;account_name&gt;.snowflakecomputing.com/api/v2/databases/&lt;database_name&gt;/schemas/&lt;schema_name&gt;/mcp-servers/&lt;server_name&gt;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbff50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>ステップ 5: Google ADK を介して接続する</b></p><p>MCP サーバーを作成し、その URL を取得できたら、Google Agent Development Kit（ADK）を使用してエージェント コードを記述します。Python コードで、エージェントがユーザー認証情報を抽出するために使用する固有識別子 AUTH_ID（snowflake_oauth_conn など）を定義します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;import os\\r\\nimport re\\r\\nfrom typing import Optional\\r\\nfrom google.adk.agents.llm_agent import LlmAgent\\r\\nfrom google.adk.tools.mcp_tool.mcp_toolset import McpToolset\\r\\nfrom google.adk.tools.mcp_tool.mcp_session_manager import StreamableHTTPConnectionParams\\r\\nfrom google.adk.tools.tool_context import ToolContext\\r\\n\\r\\n# Define the Auth ID first in your code. \\r\\n# You will use this exact name when registering the agent in the Google Cloud Console.\\r\\n# Gemini Enterprise maps the authorization token to this identifier in the ToolContext.\\r\\nAUTH_ID = &quot;snowflake_oauth_conn&quot;  \\r\\n\\r\\n# 1. OAuth Header Extraction:\\r\\n# Define a callback to dynamically extract the user\\&#x27;s OAuth token injected by Gemini Enterprise \\r\\n# and generate the Authorization headers required to authenticate with the Snowflake MCP.\\r\\ndef get_auth_headers(tool_context: Optional[ToolContext] = None) -&gt; dict: \\r\\n    &quot;&quot;&quot; \\r\\n    OAuth Handling Callback: Dynamically extracts the user\\&#x27;s OAuth token injected by Gemini Enterprise and generates the headers required to authenticate with the Snowflake MCP. \\r\\n    &quot;&quot;&quot; \\r\\n    token = None \\r\\n    if tool_context and hasattr(tool_context, &quot;state&quot;): \\r\\n        try: \\r\\n            # Parse the state dictionary injected by Gemini Enterprise containing authorization states \\r\\n            state_dict = tool_context.state.to_dict() if hasattr(tool_context.state, \\&#x27;to_dict\\&#x27;) else tool_context.state \\r\\n            pattern = re.compile(fr&quot;.*{re.escape(AUTH_ID)}.*&quot;, re.IGNORECASE)  \\r\\n            # Find the active token matching our Auth ID (snowflake_oauth_conn)\\r\\n            matching_keys = [k for k in state_dict.keys() if pattern.match(k)] \\r\\n            if matching_keys: \\r\\n                token = state_dict.get(matching_keys[0]) \\r\\n        except Exception as e: \\r\\n            print(f&quot;Warning: Failed to read ToolContext OAuth state: {e}&quot;)  \\r\\n    # Return authorization headers. If token is None, requests to MCP will fail.\\r\\n    return { \\r\\n        &quot;Authorization&quot;: f&quot;Bearer {token}&quot;, \\r\\n        &quot;Content-Type&quot;: &quot;application/json&quot;, \\r\\n        &quot;Accept&quot;: &quot;application/json, text/event-stream&quot;, \\r\\n    }  \\r\\n\\r\\n# 2. MCP Initialization:\\r\\n# Define the Snowflake MCP URL retrieved from \\&#x27;DESCRIBE MCP SERVER\\&#x27; directly in the code:\\r\\nMCP_SERVER_URL = &quot;&lt;YOUR_MCP_SERVER_URL&gt;&quot; # Replace with the URL retrieved from \\&#x27;DESCRIBE MCP SERVER\\&#x27; \\r\\n\\r\\n# Initialize the Snowflake MCP Toolset using this URL.\\r\\nsnowflake_mcp = McpToolset( \\r\\n    connection_params=StreamableHTTPConnectionParams( \\r\\n        url=MCP_SERVER_URL \\r\\n    ), \\r\\n    header_provider=get_auth_headers\\r\\n)  \\r\\n\\r\\n# 3. Build the Agent:\\r\\n# Construct the LlmAgent using the Gemini 2.5 Flash model and attach the Snowflake MCP Toolset.\\r\\nroot_agent = LlmAgent( \\r\\n    model=&quot;gemini-2.5-flash&quot;, \\r\\n    name=&quot;enterprise_data_analyst&quot;, \\r\\n    instruction=( \\r\\n        &quot;You are an enterprise data analyst. Use the `enterprise_data_agent` tool &quot; \\r\\n        &quot;on the Snowflake MCP server to answer business questions. Pass the user\\&#x27;s &quot; \\r\\n        &quot;natural language question to the tool, which translates it into SQL and &quot; \\r\\n        &quot;executes it directly within Snowflake\\&#x27;s governed boundary, then present &quot; \\r\\n        &quot;the results clearly to the user.&quot; \\r\\n    ), \\r\\n    tools=[snowflake_mcp]\\r\\n)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbcb50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>注:</b> 上記の Python スニペットは、エージェント設定の<b>標準バージョン</b>です。組織固有の要件に応じて、このテンプレートをベースに堅牢性を高めるための要素（カスタムエラー処理、構造化スキーマ、カスタム プロンプト、設定、追加のツールラッパーなど）を実装することをおすすめします。</p><p><b>ステップ 6: プロジェクトを構成してデプロイする</b></p><p>ADK エージェントを Agent Platform の Agent Runtime にデプロイするには、次のディレクトリ レイアウトでファイルを整理します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;snowflake_agent/\\r\\n├── agent.py # The agent definition and MCP connection code (from Step 5)\\r\\n├── __init__.py # Package initializer exposing the agent\\r\\n├── .env # Environment configurations (Google Cloud Project, etc.)\\r\\n└── requirements.txt # List of project dependencies (google-adk, etc.)&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbdfd0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><ol><li><b>ファイルの詳細</b></li></ol><ul><li><b>__init__.py:</b> root_agent オブジェクトをデプロイ CLI に公開します。</li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Snowflake ADK Agent package\\r\\nfrom .agent import root_agent&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbd910&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><ul><li><b>.env:</b> 環境の構成を宣言します。</li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;GOOGLE_CLOUD_PROJECT=&quot;&lt;YOUR_GCP_PROJECT_ID&gt;&quot;\\r\\nGOOGLE_CLOUD_LOCATION=&quot;&lt;LOCATION&gt;&quot;\\r\\nGOOGLE_GENAI_USE_VERTEXAI=&quot;TRUE&quot;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbcd10&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><ul><li><b>requirements.txt:</b> 依存関係を指定します。</li></ul></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;google-adk[mcp]==2.3.0\\r\\ngoogle-genai==2.10.0\\r\\npydantic-settings==2.14.2\\r\\ngoogle-cloud-aiplatform[agent_engines]&gt;=1.50.0&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbf8d0&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>2. CLI を使用したデプロイ</b></p><p>複雑なカスタム Python スクリプトを実行したり、コンテナを手動で構築したりする代わりに、公式の <b>Google Agents CLI</b>（agents-cli）を使用してデプロイできます。CLI でコードのパッケージ化、サーバーのセットアップ、デプロイ パイプラインの処理をすべて行えます。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;# Deploy the agent to the Google Cloud Agent Runtime\\r\\nagents-cli deploy --deployment-target agent_runtime&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600ddbeb50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>CLI はデプロイのライフサイクルを自動的に処理します。完了すると、一意のプロジェクト リソースパス（例: projects/PROJECT_ID/locations/LOCATION/reasoningEngines/RESOURCE_ID）が出力されます。このパスは、次のステップでエージェントを登録する際に使用します。</p><p><b>ヒント:</b> ADK エージェントのデプロイに関する詳細と高度な構成オプションについては、以下をご確認ください。</p><ul><li><a href=\"https://adk.dev/deploy/agent-runtime/deploy/\" target=\"_blank\">ADK Agent Runtime デプロイガイド</a></li><li><a href=\"https://adk.dev/deploy/agent-runtime/index.md\" target=\"_blank\">ADK デプロイ リファレンス ドキュメント</a></li></ul><p><b>ステップ 7: Gemini Enterprise にカスタム エージェントを登録する</b></p><p>エージェント コードを準備してデプロイしたら、Google Cloud コンソールでエージェントを登録します。ここでは、エージェントの構成を紐付け、Snowflake のセキュリティ統合から取得した OAuth パラメータのマッピングを行います。</p><ol><li><b>Snowflake から OAuth エンドポイントを抽出する</b></li></ol><p>Snowflake で次のクエリを実行して、正確なトークン エンドポイントと認可エンドポイントを抽出します。</p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;DESCRIBE SECURITY INTEGRATION &lt;SECURITY_INTEGRATION_NAME&gt;;&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600c6ab010&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p>結果から、次のプロパティの値を見つけます。</p><ul><li><b>OAUTH_AUTHORIZATION_ENDPOINT</b>: Snowflake 認可 URI。</li><li><b>OAUTH_TOKEN_ENDPOINT</b>: Snowflake トークン URI。</li></ul><ol><li><b>Google Cloud コンソールでの登録手順</b></li><li>コンソールで [<b>Gemini Enterprise</b>] ページに移動します。</li><li>エージェントを登録するアプリケーションを選択します。</li><li>左側のナビゲーションで [<b>エージェント</b>]、[<b>+ エージェントを追加</b>] の順にクリックします。</li><li>[<b>Custom agent via Agent Platform</b>] の [<b>Add</b>] を選択します。認可の設定画面が表示されます。</li><li>Snowflake OAuth 接続を設定します。<ul><li>[<b>Add authorization</b>] をクリックします。</li><li><b>Authorization name</b>: ADK コードで定義した ID を正確に入力します（例: snowflake_oauth_conn）。これにより、認証情報がコードの AUTH_ID に正しくマッピングされます。</li><li><b>Client ID</b> と <b>Client secret</b>: SYSTEM$SHOW_OAUTH_CLIENT_SECRETS クエリを使用して Snowflake から取得した認証情報を入力します。</li><li><b>Token URI</b>: DESCRIBE SECURITY INTEGRATION から抽出した正確なトークン エンドポイント値を入力します。</li><li><b>Authorization URI</b>: DESCRIBE SECURITY INTEGRATION から抽出した認可エンドポイント値を取得し、末尾に ?response_type=code を追加します（クライアント ID とスコープのクエリ パラメータなど）。</li></ul></li></ol></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &#x27;https://&lt;org_name&gt;-&lt;account_name&gt;.snowflakecomputing.com/oauth/authorize?client_id=YOUR_CLIENT_ID&amp;redirect_uri=https%3A%2F%2Fvertexaisearch.cloud.google.com%2Foauth-redirect&amp;scope=session%3Arole-any&amp;response_type=code&#x27;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600c6a9590&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph\"><p><b>重要</b><br />認可 URI の末尾が &amp;response_type=code（他のパラメータがない場合は ?response_type=code）になっていることを確認します。このパラメータは、Google Cloud が OAuth 2.0 認可コードフローをトリガーするために必要です。</p><ul><li>[<b>Done</b>]、[<b>Next</b>] の順にクリックします。</li></ul><ol><li>エージェントのプロパティを構成します。</li><li>[<b>Create</b>] をクリックして登録を完了します。</li></ol><p><b>識別子のアライメントについて</b></p><ul><li><b>ADK コードの AUTH_ID &lt;==&gt; Google Cloud の認可名</b>: Python スクリプト内の AUTH_ID は、コンソールでの登録時に入力した「認可名 / ID」と完全に一致している必要があります。コードを先に作成する手順となるため、登録時にはコード内で定義した識別子を再利用します。</li><li><b>Snowflake セキュリティ インテグレーション名（例: &lt;SECURITY_INTEGRATION_NAME&gt;）</b>: これは純粋に Snowflake 側のデータベース オブジェクト名です。Google Cloud 認可名や ADK Python コードの AUTH_ID と一致する必要はありません。</li></ul><p><b>使ってみる</b></p><p>Gemini モデルの推論機能、ADK のオーケストレーション、Snowflake の管理されたデータレイヤーを組み合わせることで、データを安全を維持したまま AI を活用できるようになります。このアーキテクチャは、セキュリティ境界を尊重しながらビジネス価値を提供するエージェント型アシスタントを実現します。</p><p><b><i>-</i></b> <i>クラウド データ エンジニア、</i><b><i>Pankaj Bajpai</i></b></p><p><b><i>-</i></b> <i>AI エンジニア、</i><b><i>Abhilash Adavi</i></b></p></div>"
  "cd8c5786d9f0ff0701b2201b889990a0":
    "id": "cd8c5786d9f0ff0701b2201b889990a0"
    "title": "ボーダーレス Lakehouse で Databricks の Apache Iceberg テーブルにクエリを実行する"
    "link": "https://cloud.google.com/blog/ja/products/data-analytics/querying-databricks-iceberg-tables-with-google-clouds-lakehouse/"
    "published": "2026-11-09 09:30:00"
    "fetched": "2026-11-09 18:09:10"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">※この投稿は米国時間 2026 年 10 月 30 日に、Google Cloud blog に</span><a href=\"https://cloud.google.com/blog/products/data-analytics/querying-databricks-iceberg-tables-with-google-clouds-lakehouse?e=48754805&amp;hl=en\"><span style=\"text-decoration: underline; vertical-align: baseline;\">投稿</span></a><span style=\"vertical-align: baseline;\">されたものの抄訳です。</span></p>\n<p><span style=\"vertical-align: baseline;\">大規模組織では多くの場合、Databricks を含む複数のデータ プラットフォームを活用して負荷の高い Apache Spark ジョブを実行しつつ、BigQuery を併用して同時実行性の高い分析ワークロードを処理しています。これまで、これらのシステムを連携させるには、環境間でデータをコピーするための複雑なパイプラインを構築する必要がありました。このアプローチでは、ストレージ費用が増加し、レイテンシが発生し、セキュリティ管理が断片化します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Google Cloud のボーダーレス Lakehouse を使用すると、Databricks で管理されている Apache Iceberg テーブルを BigQuery から直接クエリできるようになります。このゼロコピー アプローチにより、データの複製が不要になります。つまり、BigQuery は Databricks が書き込んだのと同じファイルを読み取り、Lakehouse の次回のスケジュールされたメタデータ更新後（最長 5 分間隔）に新しい変更が反映されます。</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image1\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/image1_9nWgq7s.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><strong style=\"vertical-align: baseline;\">Lakehouse と Databricks の連携</strong></h4>\n<p><span style=\"vertical-align: baseline;\">マネージド Iceberg テーブルは、ネイティブの Delta ログとともに Iceberg 互換のメタデータを自動的に生成します。データ エンジニアリング チームは、Databricks を使用して Parquet ファイルを Google Cloud Storage（GCS）に一度保存するだけで済みます。Lakehouse はこの情報を BigQuery に読み込むのではなく、Iceberg メタデータを直接読み取って、BigQuery のベクトル化エンジンを GCS 上のオープン形式のファイルに直接適用します。</span></p>\n<p><span style=\"vertical-align: baseline;\">上の例では Google Cloud Storage（GCS）がプライマリ ストレージ レイヤとして機能していますが、Lakehouse はこのボーダーレスな連携を Amazon S3 や Azure Blob Storage などの外部クラウド環境へも直接展開します。Lakehouse は、オープンな Apache Iceberg REST カタログとクロスクラウド接続を組み合わせることで、BigQuery がデータを移動することなくクラウド間でクエリを実行できるようにします。各連携カタログは、選択した Google Cloud のロケーション（データに最も近いリージョンが理想的）に配置されます。これにより、BigQuery はオープン形式の Parquet ファイルを保存場所で読み取ることができ、レプリケーション パイプラインなしでのマルチクラウド分析を可能にします。リモートクラウドの下り（外向き）料金は引き続き適用されますが、Cross-Cloud Interconnect（AWS）と Lakehouse キャッシュ保存により、この負担を軽減できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Lakehouse フレームワークは、単に外部データをクエリするだけでなく、エンジン間で真の読み取り / 書き込み（R / W）相互運用性を実現します。このプラットフォームはオープンな Apache Iceberg 基盤上に構築されているため、データチームは BigQuery 内で直接、マルチステートメントの SQL コマンドを簡単に実行できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">一元化されたセキュリティとガバナンス</strong></h4>\n<p><span style=\"vertical-align: baseline;\">異なるシステム間でアクセス制御を管理すると、脆弱性が生じる可能性があります。Lakehouse は、アクセス権の委任によってこの問題に対処します。管理者は、GCS バケットの IAM 権限を管理するサービス アカウントに関連付けられた BigQuery Cloud リソース接続を構成できます。ユーザーに Lakehouse のテーブル エンティティへのアクセス権を付与すると、Databricks が取り込みを処理する一方で、外部 Iceberg テーブルに行レベルや列レベルのセキュリティ、動的データ マスキングなどの BigQuery の制御機能を適用できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">カタログの連携とクルデンシャル ベンディング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">従来、これらのプラットフォームを接続するには、静的なメタデータパスを指すように BigQuery クエリを手動で構成する必要がありました。現在の構成では、オープンな Apache Iceberg REST Catalog API を活用しています。Databricks Unity Catalog は、一元化されたメタデータ レイヤとして機能し、BigQuery 管理者が連携接続を使用して Lakehouse ランタイム カタログを確立できます。クエリを実行すると、Lakehouse が Unity Catalog に問い合わせて現在のテーブルの状態を確認し、クルデンシャル ベンディングを通じて有効期間の短いトークンを発行して、BigQuery に GCS への一時的な読み取りアクセス権を付与します。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">パーティション プルーニング</strong></h4>\n<p><span style=\"vertical-align: baseline;\">BigQuery は、各テーブルの Iceberg メタデータを使用してクエリを計画し、関連するデータファイルのみをその場で読み取ります。Iceberg の隠しパーティショニングを使用すると、ディレクトリ レイアウトを知らなくても、タイムスタンプなどの論理列でフィルタリングできます。なお、Databricks マネージド Iceberg テーブルはパーティション変換をサポートしていません。Databricks では、代わりにリキッド クラスタリングの使用が推奨されています。</span></p>\n<p><span style=\"vertical-align: baseline;\">標準の WHERE 句のフィルタにより、BigQuery は Iceberg マニフェストを使用して、条件に一致しないパーティションをスキップできます。パーティション列をリテラル値と比較して、プルーニングを適用できるようにします。これらのマニフェストは、列レベルの詳細な統計情報を保持しているため、BigQuery は無関係なマニフェスト レコードや不要な Parquet ファイルを即座にスキップできます。その結果、クエリは必要なバイト範囲のみをスキャンするため、クエリの実行が高速化され、オンデマンド スロットの消費量とストレージ スキャンの費用が大幅に削減されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">Iceberg メタデータと Lakehouse キャッシュ保存による高速クエリ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Iceberg マニフェストは、読み取るデータファイルをすでに識別しているため、BigQuery は Iceberg テーブルのメタデータ キャッシュ保存を必要としません。Amazon S3 などのクロスクラウド テーブルの場合、Lakehouse キャッシュ（プレビュー版）によって取得済みのデータブロックが Google Cloud に保持されるため、繰り返し実行されるクエリではローカルから直接読み取ることができます。BigQuery は、各クエリを計画するときに Iceberg マニフェスト ファイルを直接読み取ります。有効化が必要なメタデータ キャッシュ保存はありません。この動的パーティション プルーニングにより、不要なファイルがスキップされ、実行時間とスキャンされるバイト数が大幅に削減されます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">メンテナンスとライフサイクル管理</strong></h4>\n<p><span style=\"vertical-align: baseline;\">現代の Lakehouse には、継続的なメンテナンスが必要です。定期的なケアを怠ると、パフォーマンスが低下し、非効率なリポジトリと化してしまいます。幸いにも、BigQuery と Databricks の両方に、テーブルの健全性を維持し、分析ワークロードを高速化するネイティブ機能が備わっています。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">テーブルを最適化された状態に保つ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">最適なクエリ パフォーマンスを維持するには、Lakehouse のストレージ フットプリントを継続的にメンテナンスする必要があります。</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Databricks API を介して定期的なコンパクション パイプラインをトリガーし、小さな Parquet ファイルをより大きな最適化されたレイアウトに統合するか、Predictive Optimization 機能を使用する。</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">Databricks の VACUUM コマンドを実行して、アクティブなスナップショット外の参照されていないファイルをクリアし、余分な GCS ストレージ費用を回避する。</span></p>\n</li>\n</ol>\n<h4><strong style=\"vertical-align: baseline;\">コンパクションと小さなファイルに関する問題</strong></h4>\n<p><span style=\"vertical-align: baseline;\">頻繁な書き込みオペレーション、継続的な取り込みジョブ、ストリーミング ワークロードにより、数千もの小さな Parquet ファイルが絶え間なく生成されます。この断片化により、BigQuery の読み取り効率を低下させるストレージのボトルネックが発生します。GCS への数千ものネットワーク接続を確立し、多数の小さなファイルのメタデータ フッターを処理すると、コンピューティング時間が大幅に消費され、ベクトル化されたクエリ実行によるパフォーマンス上のメリットが損なわれます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Iceberg 内で定期的なコンパクションを実行すると、こうした非効率性が解消されます。Databricks は、アクセス パターンに基づいてファイル レイアウトを動的に調整するリキッド クラスタリングを使用するか、ネイティブのテーブル管理ユーティリティを介して、これを自動的に管理します。</span></p>\n<p><span style=\"vertical-align: baseline;\">Databricks で小さなファイルを手動で統合（コンパクション）するには、OPTIMIZE を実行します。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;-- Run on Databricks to compact small files\\r\\n-- On Databricks:\\r\\nOPTIMIZE customer_events;\\r\\n-- For Iceberg tables you manage outside Databricks:\\r\\nCALL my_catalog.system.rewrite_data_files(\\r\\ntable =&gt; &#x27;default.customer_events&#x27;,\\r\\nstrategy =&gt; &#x27;binpack&#x27;,\\r\\noptions =&gt; map(\\r\\n&#x27;target-file-size-bytes&#x27;,\\r\\n&#x27;268435456&#x27;,\\r\\n&#x27;min-file-size-bytes&#x27;,\\r\\n&#x27;67108864&#x27;\\r\\n)\\r\\n);&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f60073e2250&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">このコマンドを実行すると、散在するファイル セグメントが、通常 256 MB～512 MB の構造化された大きなブロックに集約され、BigQuery のスキャン スループット向上に役立ちます。ビンパック アプローチは、合計ファイルサイズのバランスを優先することで迅速に動作しますが、別の並べ替え戦略を使用すれば、特定の列キーに沿ってデータセットの順序を整えることもできます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">孤立したファイルとスナップショット保持の管理（VACUUM）</strong></h4>\n<p><span style=\"vertical-align: baseline;\">トランザクションの更新、レコードの変更、テーブルのコンパクションが行われるたびに、Iceberg 内に新しいスナップショットが作成され、データセットの完全性が維持されます。時間の経過とともに、現在のテーブルから参照されなくなった過去の Parquet オブジェクトは孤立します。これらのレガシー ファイルによりタイムトラベル分析が可能になりますが、放置すると GCS ストレージ料金が徐々に増加する原因になります。</span></p>\n<p><span style=\"vertical-align: baseline;\">データチームは、Databricks の VACUUM オペレーションを使用して、放置されたストレージ ファイルをスキャンおよび削除できます。</span></p></div>\n<div class=\"block-code\"><dl>\n    <dt>code_block</dt>\n    <dd>&lt;ListValue: [StructValue([(&#x27;code&#x27;, &quot;ALTER TABLE customer_events SET TBLPROPERTIES (&#x27;delta.deletedFileRetentionDuration&#x27; = &#x27;7 days&#x27;);\\r\\nVACUUM customer_events FULL;&quot;), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;, &lt;wagtail.rich_text.RichText object at 0x7f600c570d50&gt;)])]&gt;</dd>\n</dl></div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">標準構成では、VACUUM ルーティンを実行する前に、7 日間の保持期間（deletedFileRetentionDuration）が必須のしきい値として適用されます。この保持期間を維持することで、実行中の分析ジョブでファイルが見つからないエラーが発生するのを防ぎ、過去データの復元オプションも確保できます。定期的な VACUUM ジョブをスケジュールするか、Predictive Optimization に実行を任せることで、参照されていないデータファイルが削除されます。また、Iceberg 読み取りに対応したテーブルの場合は、古い Iceberg メタデータも削除されます。これにより、Lakehouse 全体でストレージ費用を低く抑え、パフォーマンスを高く維持できます。</span></p>\n<h4><strong style=\"vertical-align: baseline;\">まとめ</strong></h4>\n<p><span style=\"vertical-align: baseline;\">Databricks の Apache Iceberg データセットを Lakehouse に接続すると、BigQuery でデータをさらに活用できるようになります。処理を基盤となるストレージから分離し、オープン フォーマットを採用し、クルデンシャル ベンディングに対応した標準の REST API を使用することで、データの移行やパフォーマンスの低下を伴うことなく、スケーラブルなエンジニアリング ワークロードと同時分析を実行できます。</span></p>\n<p><span style=\"vertical-align: baseline;\">Databricks Iceberg の読み取り（UniForm）を Lakehouse フェデレーション、Lakehouse キャッシュ保存、定期的な OPTIMIZE および VACUUM メンテナンスと組み合わせることで、効率的なゼロコピー レイクハウスを構築できます。このアプローチは、ストレージ費用の削減、脆弱なパイプラインのメンテナンスの回避、現代の分析や新たな AI ワークロードに対応するデータ環境の準備に役立ちます。</span></p>\n<p><span style=\"vertical-align: baseline;\">統合アーキテクチャを構築する際、プラットフォーム間でデータファイルを移動する必要はなくなりました。Lakehouse ランタイム カタログに Databricks の Iceberg テーブルを登録して双方向連携を有効にすると、すぐにクエリを開始できます。詳細については、</span><a href=\"https://docs.cloud.google.com/lakehouse/docs/set-up-cross-cloud-connection-databricks\"><span style=\"text-decoration: underline; vertical-align: baseline;\">ドキュメント</span></a><span style=\"vertical-align: baseline;\">をご覧ください。</span></p>\n<p><strong style=\"font-style: italic; vertical-align: baseline;\">- </strong><span style=\"font-style: italic; vertical-align: baseline;\">戦略的クラウド エンジニア、</span><strong style=\"font-style: italic; vertical-align: baseline;\">Pramod Niralakeri</strong></p></div>"
