    "summary": "<h2 class=\"release-note-product-title\">AI Hypercomputer</h2>\n<h3>Feature</h3>\n<p><strong>Generally available</strong>:\n<a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-intro\">Pathways on Cloud</a>\nis now generally available on Google Kubernetes Engine (GKE). Major features include\nthe following:</p>\n<ul>\n<li><strong>Single-controller execution model</strong>: Coordinate multi-slice and multi-host\nCloud TPU workloads from a single Python client process. Pathways uses\nasynchronous dispatch and centralized scheduling to support both Single\nProgram, Multiple Data (SPMD) and Multiple Program, Multiple Data (MPMD)\nworkloads. For example, training and reinforcement learning (RL) loops.</li>\n<li><strong>Resilient and elastic training</strong>: Keep training jobs running across hardware\ninterruptions with\n<a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/resilient-training\">resilient training</a>,\nincluding the following capabilities:\n<ul>\n<li><strong><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/resilient-training#elastic-training\">Elastic training</a></strong>:\nDynamically scale down to healthy Cloud TPU slices during unplanned\nhardware failures and scale back up when replacement slices rejoin without\nrestarting the entire job.</li>\n<li><strong>Suspend-resume</strong>: Automatically save and restore high-bandwidth memory\n(HBM) state to Cloud Storage during planned GKE preemption\nevents.</li>\n<li><strong>Hot-swapping</strong>: Remap interrupted workloads onto standby or lower-priority\nCloud TPU slices.</li>\n</ul></li>\n<li><strong><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/porting-jax-workloads#colocated-python\">Colocated Python sidecar containers</a></strong>:\nRun custom Python code directly on Cloud TPU host VMs alongside\nPathways workers. For example, multi-host data loading with\n<a href=\"https://github.com/google/grain\">Grain</a> or <code>RemoteIterator</code>, and distributed\nasynchronous checkpointing with <a href=\"https://github.com/google/orbax\">Orbax</a>.</li>\n<li><strong>Interactive mode and Shared Pathways Service</strong>: Run, inspect, and debug JAX\nworkloads interactively from a notebook or terminal using\n<a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-interactive-mode\">interactive mode</a>,\nor share a long-running pool of Cloud TPU slices on demand across\nmultiple users and jobs with the\n<a href=\"https://github.com/AI-Hypercomputer/pathways-utils/tree/main/pathwaysutils/experimental/shared_pathways_service\">Shared Pathways Service</a>.</li>\n<li><strong>Cluster Director, Cluster Toolkit, and GKE integration</strong>:\nLaunch JAX workloads on the Pathways runtime using\n<a href=\"https://docs.cloud.google.com/cluster-director/docs/overview\">Cluster Director</a> or\n<a href=\"https://docs.cloud.google.com/cluster-toolkit/docs/deploy/gke/run-workloads-pathways\">Cluster Toolkit</a>\n(<code>gcluster</code> with <code>--pathways</code> and <code>--pathways-headless</code>), or by deploying\nKubernetes JobSet manifests on GKE.</li>\n<li><strong><code>pathwaysutils</code> utility package</strong>: Use the\n<a href=\"https://github.com/AI-Hypercomputer/pathways-utils\"><code>pathwaysutils</code></a> Python\npackage for advanced features such as the Shared Pathways Service,\n<a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/resilient-training#elastic-training\">elasticity</a>,\nand\n<a href=\"https://github.com/AI-Hypercomputer/pathways-utils/blob/main/pathwaysutils/experimental/reshard.py\"><code>experimental.reshard</code></a>\nfor device-side data transfers across hosts over Inter-Chip Interconnect (ICI)\nor Data Center Network (DCN).</li>\n<li><strong>Standard <code>libtpu.so</code> layering and custom <code>libtpu.so</code> support</strong>: Pathways is\nlayered over the standard <code>libtpu.so</code> shared library and provides a way to\ndynamically link in a user-provided <code>libtpu.so</code> at runtime using\n<a href=\"https://github.com/AI-Hypercomputer/pathways-utils/tree/main/pathwaysutils/experimental/gke\"><code>PathwaysJobSet.with_custom_libtpu</code></a>\nin <code>pathwaysutils</code>.</li>\n<li><strong>Single-process profiling, observability, and compilation cache</strong>: Capture\nend-to-end JAX profiler traces across the client, proxy, resource manager, and\nCloud TPU hosts from a single process. Reuse compiled XLA modules\nwith a persistent compilation cache on Cloud Storage, and view\nPathways control and data plane metrics in Cloud Monitoring.</li>\n<li><strong>Agentic workload debugging</strong>: Troubleshoot failed, crashing, or stalled\nPathways workloads on GKE using the\n<a href=\"https://github.com/google/skills/tree/main/skills/cloud/pathways-workload\"><code>pathways-workload</code> agent skill</a>.\nWith this skill, AI agents can inspect Cloud Logging container logs, node\nkernel logs, and GKE events to help identify root causes and\nfixes.</li>\n<li><strong>Supported Cloud TPU versions, JAX versions, and container images</strong>:\nSupports TPU7x (Ironwood), TPU v6e (Trillium), TPU v5p, and TPU v5e for JAX\nversions 0.12.0.1, 0.12.0, 0.11.2, 0.11.1, 0.11.0, 0.10.2, and 0.10.1, with\ncontainer images published in Artifact Registry:\n<ul>\n<li><strong>Image locations</strong>:\n<ul>\n<li><strong>Pathways resource manager and worker</strong>:\n<code>us-docker.pkg.dev/cloud-tpu-v2-images/cloud-pathways/server:<var>TAG</var></code></li>\n<li><strong>IFRT proxy server</strong>:\n<code>us-docker.pkg.dev/cloud-tpu-v2-images/cloud-pathways/proxy_server:<var>TAG</var></code></li>\n<li><strong>Colocated Python sidecar</strong>:\n<code>us-docker.pkg.dev/cloud-tpu-v2-images/cloud-pathways/colocated_python_sidecar:<var>TAG</var></code></li>\n</ul></li>\n<li><strong>Image tags</strong>: Replace <code><var>TAG</var></code> with one of the\nfollowing tags, which are created automatically when a Pathways build\npasses qualification tests and is promoted to production:\n<ul>\n<li><code><var>YYYYMMDD</var>-jax_<var>JAX_VERSION</var></code>:\nPinned tag created by combining the UTC promotion date\n(<code><var>YYYYMMDD</var></code>) with <code>-jax_</code> and the verified\nJAX version (<code><var>JAX_VERSION</var></code>) after\nper-version qualification tests pass. For example,\n<code>20261108-jax_0.12.0.1</code>.</li>\n<li><code>jax-<var>JAX_VERSION</var></code>: Rolling tag updated\nafter per-version qualification tests pass to point to the most recent\nverified image for that JAX release. For example, <code>jax-0.12.0.1</code> or\n<code>jax-0.12.0</code>.</li>\n<li><code>latest</code>: Rolling tag updated when a build passes qualification tests\nagainst the most recent supported JAX release.</li>\n</ul></li>\n</ul></li>\n</ul>\n<p>For more information, see\n<a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-intro\">Introduction to Pathways on Cloud</a>.</p>\n<h2 class=\"release-note-product-title\">Anthos Config Management</h2>\n<h3>Change</h3>\n<p>Addressed multiple Common Vulnerabilities and Exposures (CVEs) by updating dependencies.</p>\n<h3>Change</h3>\n<p>Upgraded the <code>git-sync</code> dependency from v4.4.2 to v4.5.0 to pick up vulnerability fixes. For more details, see <a href=\"https://github.com/kubernetes/git-sync/releases\">git-sync releases</a>.</p>\n<h3>Change</h3>\n<p>Upgraded the Open Telemetry image from 0.152.0 to 0.159.0 to pick up vulnerability fixes. To understand the changes in each release, review the full changelog for <a href=\"https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/CHANGELOG.md\">opentelemetry-collector-contrib</a>.</p>\n<h2 class=\"release-note-product-title\">Anti Money Laundering AI</h2>\n<h3>Announcement</h3>\n<p>New minor engine version released for the commercial line of business within the <code>v004.009</code> version line (<code>aml-commercial.default.v004.009.202610-000</code>). This version extends support for the major engine version and includes no significant changes compared to the previous minor version.</p>\n<h2 class=\"release-note-product-title\">BigQuery</h2>\n<h3>Feature</h3>\n<p>When you <a href=\"https://docs.cloud.google.com/bigquery/docs/create-pipelines\">create</a> or\n<a href=\"https://docs.cloud.google.com/bigquery/docs/schedule-pipelines\">schedule</a>\na pipeline, you can specify the maximum number of\nconcurrently executed pipeline tasks. This feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>\n<h2 class=\"release-note-product-title\">Bigtable</h2>\n<h3>Feature</h3>\n<p>You can use the Google Cloud console to create and manage Apache Avro schema\nbundles for your Bigtable tables. You can also view Avro schema bundle\ndefinitions in Bigtable Studio. This feature is in\n<a href=\"https://cloud.google.com/products#product-launch-stages\">Preview</a>. For more\ninformation, see\n<a href=\"https://docs.cloud.google.com/bigtable/docs/create-manage-avro-schemas\">Create and manage Avro schemas</a>.</p>\n<h2 class=\"release-note-product-title\">Dataform</h2>\n<h3>Feature</h3>\n<p>You can limit how many actions run concurrently within a single <a href=\"https://docs.cloud.google.com/dataform/docs/trigger-execution#limit-concurrent-actions\">workflow\nexecution</a> or\n<a href=\"https://docs.cloud.google.com/dataform/docs/schedule-runs#create-workflow-configuration\">workflow configuration schedule</a>.\nThis feature is\n<a href=\"https://cloud.google.com/products#product-launch-stages\">generally available</a>\n(GA).</p>"
