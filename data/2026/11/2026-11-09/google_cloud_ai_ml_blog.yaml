    "title": "Now generally available: GKE dynamic slicing for higher resilience, and efficiency for TPUs"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gke-dynamic-slicing-on-tpus/"
    "published": "2026-11-09 22:00:00"
    "fetched": "2026-11-10 05:25:30"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Running large-scale AI workloads on TPU and Google Kubernetes Engine (GKE) requires infrastructure that adapts as fast as your models change. Dynamic Slicing is generally available on GKE, which decouples logical TPU slice formation from physical nodepool provisioning.</span></p>\n<p><span style=\"vertical-align: baseline;\">Compared to creating a static nodepool for each TPU slice, dynamic slicing reduces AI workload startup times by up to </span><strong style=\"vertical-align: baseline;\">5x</strong><span style=\"vertical-align: baseline;\"> and workload recovery by </span><strong style=\"vertical-align: baseline;\">4.5x </strong><span style=\"vertical-align: baseline;\">— maximizing TPU goodput, efficiency, and workload resilience at scale. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Beyond one workload, one nodepool </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Previously, managing TPU capacity at GKE standard required separate, fixed TPU slice topology nodepools, increasing startup times and complexity while preventing multi-host nodepools from hosting multiple AI workloads. Changing workload needs meant manually deleting and recreating nodepools. Additionally, this tight coupling created large failure domains where a single hardware fault crashed an entire slice, slowing recovery while reprovisioning.</span></p>\n<p><span style=\"vertical-align: baseline;\">To overcome these challenges, we built GKE dynamic slicing, which decouples physical hardware provisioning from logical slice formation, dynamically stitching together TPU cubes using TPU optical circuit switching (OCS) technology to form various larger slice topologies (super-slicing), or partitioning TPU cubes into smaller slices for multiple workloads to run inside a nodepool (sub-slicing). By enabling workloads to assemble custom TPU slice topologies on demand without having to delete and recreate static nodepools, dynamic slicing reduces job startup latency, limits the blast radius of hardware failures, accelerates recovery of workloads, and improves fleet utilization and efficiency. </span></p>\n<p><span style=\"vertical-align: baseline;\">Dynamic slicing delivers several key improvements for platform teams:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero-downtime topology agility:</strong><span style=\"vertical-align: baseline;\"> Completely eliminates the rigid \"delete-and-create\" nodepool cycle, allowing to dynamically stitch together TPU cubes (16 VMs nodepools) to form large TPU slices, or carve out smaller-slices on the fly as an AI workload is submitted.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Up to 5x faster job startup:</strong><span style=\"vertical-align: baseline;\"> Slashes job startup times by up to five times by instantly assembling logical slice topologies from pre-provisioned TPU nodepools instead of waiting for a slow, new nodepool deployment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Improved fleet utilization:</strong><span style=\"vertical-align: baseline;\"> Improves resource efficiency and eliminates idle capacity by enabling multi-tenant packing of smaller workloads within nodepools. Additionally, it lets you provision partially healthy nodepools. This way, you can utilize healthy hosts that would otherwise be unavailable.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Up to 4.5x faster recovery and fault tolerance:</strong><span style=\"vertical-align: baseline;\"> Accelerates recovery by isolating large slice failures to a TPU cube (a 16-VM 4x4x4 slice topology) and swapping unhealthy cubes in one to two minutes. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enhanced visibility and control:</strong><span style=\"vertical-align: baseline;\"> Offers comprehensive insight into potential TPU partitions (slices) within each cube, covering real-time health and usage metrics to facilitate proactive, optimized workload scheduling.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Dynamic slicing architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">GKE dynamic slicing is offered in two forms: super-slicing, to create larger scale TPU slices that exceed the size of a single TPU cube; and sub-slicing, which provisions smaller, independent slices from a single cube.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Dynamic super-slicing</span></h4>\n<p><span style=\"vertical-align: baseline;\">GKE dynamic super-slicing utilizes TPU optical circuit switching (OCS) technology to dynamically connect TPU cubes (consisting of 16 VMs configured in a 4x4x4 slice topology) at the time of workload scheduling. By altering the OCS network configuration dynamically, larger slice topologies are created and tailored to the workload slice needs outlined in the Kubernetes workload manifest, significantly enhancing operational efficiency.</span></p>\n<p><span style=\"vertical-align: baseline;\">Super-slicing fundamentally relies on a baseline conversion of all available TPU capacity into uniform nodepools composed of 16-VM (4x4x4) TPU cubes. When a TPU slice topology is specified in Kubernetes workload YAML file, the GKE scheduler (or your custom scheduler) identifies the request and instantiates slice creation. This process uses the TPU </span><a href=\"http://cloud.google.com/blog/topics/systems/the-evolution-of-googles-jupiter-data-center-network?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">optical circuit switch</span></a><span style=\"vertical-align: baseline;\"> to stitch multiple 4x4x4 cubes together, dynamically instantiating the targeted slice topology and scheduling the workload directly onto the newly established super-slice. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1. SUperSliceVisualizer_compressed\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1._SUperSliceVisualizer_compressed.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>How a 4x4x16 super slice (comprising 64 Ironwood VMs and 256 total chips) is formed using four Ironwood cubes (also provisioned as GKE nodepools). At runtime, the slice is created dynamically by stitching together the TPU network across all TPU chips in these four cubes.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Dynamic sub-slicing</span></h4>\n<p><span style=\"vertical-align: baseline;\">Dynamic sub-slicing partitions a single, pre-provisioned TPU cube (16 VM nodepool) into smaller, independent sub-slices on demand. You can manage a single pool of uniform TPU cubes and partition them on demand. With this approach, multiple distinct jobs with completely different slice topology requirements can run concurrently and fully isolated inside the same physical TPU cube, boosting overall resource utilization and allowing you to salvage and run workloads on healthy partitions, even if a portion of the cube is unhealthy.</span></p>\n<p><span style=\"vertical-align: baseline;\">When a workload is scheduled, sub-slicing dynamically parses its specific slice topology requirements from the incoming Kubernetes manifest. It then locates healthy partitions within the cubes, activates the high-speed Inter-Chip Interconnect (ICI) network to form sub-slices, and deploys the workload onto the newly created slice. Upon workload completion, the scheduler automatically deconstructs (\"deforms\") the slice and returns the partitions to the shared pool, making them immediately available for future workloads without having to recreate the GKE nodepool.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2. dynamic_sub_slicing_visualization\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2._dynamic_sub_slicing_visualization.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>How GKE sub-slicing dynamically partitions a 16-host TPU cube into smaller, independent slices (e.g., 2x2x4 with 16 chips down to 2x2x2) for optimal utilization of TPU resources.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Customer use cases</span></h4>\n<p><span style=\"vertical-align: baseline;\">You can leverage dynamic slicing to form massive TPU slice topologies to meet large scale training, ranging from large 8,000-chip single slices to multi-slices of multiple thousands of chips, down to single-host four-chip configurations. This supports a wide variety of heterogeneous AI workloads within the same environment. Designed for the demands of largest-scale workloads, </span><strong style=\"vertical-align: baseline;\">dynamic slicing</strong><span style=\"vertical-align: baseline;\"> delivers resiliency and operational efficiency for AI workloads running across thousands of accelerators. </span><strong style=\"vertical-align: baseline;\">Sub-slicing</strong><span style=\"vertical-align: baseline;\"> offers the versatility to efficiently scale inference workloads ranging from small to large-scale deployments.  </span></p>\n<h4><span style=\"vertical-align: baseline;\">Dynamic slicing scheduler for GKE </span></h4>\n<p><span style=\"vertical-align: baseline;\">GKE provides deployable schedulers optimized for dynamic slicing, or you can use your own custom scheduler to manage workload placement. This flexibility allows for intelligent workload scheduling based on proactive health status monitoring. See more in our </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<h4><span style=\"vertical-align: baseline;\">Pre-provision nodepools</span></h4>\n<p><span style=\"vertical-align: baseline;\">To get started, you must perform a one-time activity of pre-provisioning TPU capacity into nodepools of 16 VMs each (maps to a TPU cube or sub-block). This baseline conversion allows for dynamic stitching of these units into custom slice topologies on demand. </span></p>\n<p><span style=\"vertical-align: baseline;\">Dynamic slicing introduces a new type of nodepools called an incremental provisioning nodepool. An incremental provisioning nodepool is a fault-tolerant model that supersedes the traditional \"all-or-nothing\" approach for creating TPU slices. GKE provisions the nodepool using all available healthy hosts even if some hosts in a 4x4x4 (16 VM) slice are faulty. The system continuously reconciles state, automatically adding pending nodes once faulty hosts recover.</span></p>\n<p><span style=\"vertical-align: baseline;\">This setup is a prerequisite for dynamic sub-slicing, as it allows the high-speed ICI network mesh to be dynamically configured. By using incremental provisioning, you can create nodepools for your entire capacity at once, reducing operational toil and maximizing TPU utilization by enabling sub-slicing on healthy nodes.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Workload scheduling on dynamic slicing</span><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></h4>\n<p><span style=\"vertical-align: baseline;\">After enabling the slice controller in the GKE cluster and configuring the GKE scheduler, you can indicate the need for dynamic slices for your workloads using simple workload annotations.</span></p>\n<p><span style=\"vertical-align: baseline;\">Upon detecting these annotations, the scheduler automatically triggers the GKE slice controller to create a Slice </span><a href=\"https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Custom Resource</span></a><span style=\"vertical-align: baseline;\"> (CR) to form the dynamic slice at runtime. Once the slice is formed, the workload is scheduled on the dynamic slice. Refer to </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/use-gke-dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> for examples.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Repair</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When host or network failures disrupt workloads, the GKE scheduler maintains resilience and continuous operation through targeted recovery strategies:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Super-slicing (slices larger than 1 TPU cube): </strong><span style=\"vertical-align: baseline;\">Hardware failures are isolated to a smaller unit — the TPU \"cube\" — allowing the scheduler to quickly reform the slice by removing the unhealthy cube and choosing all healthy cubes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-slicing: </strong><span style=\"vertical-align: baseline;\">Slices on faulty infrastructure are dynamically reformed using available healthy partitions.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Next steps </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Dynamic slicing (super-slice and sub-slice) is available for  TPUs and is offered in all regions where TPUs are available. It is supported exclusively in </span><a href=\"https://docs.cloud.google.com/tpu/docs/all-capacity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU All Capacity</span></a><span style=\"vertical-align: baseline;\"> under reservation mode. For  working examples of dynamic slicing, refer to the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
