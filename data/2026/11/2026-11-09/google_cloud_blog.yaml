  "9cd4a66f88630764fce1c26819581ae8":
    "id": "9cd4a66f88630764fce1c26819581ae8"
    "title": "Introducing TPU Sync: Fast KV cache and weight transfer for inference and RL on TPU"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/introducing-tpu-sync-fast-kv-cache-and-weight-transfer-on-tpu/"
    "published": "2026-11-09 22:00:00"
    "fetched": "2026-11-10 05:25:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">As frontier AI evolves from stateless single-turn prompts to million-token agents, disaggregated serving, and continuous reinforcement learning (RL), the primary bottleneck in AI infrastructure has shifted from raw compute to orchestrating live model state — both the </span><span style=\"font-style: italic; vertical-align: baseline;\">contextual state</span><span style=\"vertical-align: baseline;\"> held in massive key-value (KV) caches during inference and the </span><span style=\"font-style: italic; vertical-align: baseline;\">parameter state</span><span style=\"vertical-align: baseline;\"> updated and broadcast from trainers to rollout samplers during RL. Whenever this state is trapped inside a single chip's memory or stalled on network transfers, AI accelerators sit idle.</span></p>\n<p><span style=\"vertical-align: baseline;\">We designed</span> <a href=\"https://github.com/google/tpu-sync\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Sync</span></a><span style=\"vertical-align: baseline;\"> from first principles to serve as </span><strong style=\"vertical-align: baseline;\">the model-state layer</strong><span style=\"vertical-align: baseline;\"> across TPU clusters — built on the architectural insight that accelerator High Bandwidth Memory (HBM), host DRAM, shared storage, and the data center network (DCN) should operate as a single, co-designed memory hierarchy. An open-source, native C++ library, TPU Sync moves TPU-tiled tensors directly across this hierarchy with asynchronous DMA transfers that overlap data movement with active computation.</span></p>\n<p><span style=\"vertical-align: baseline;\">For inference, it decouples TPU compute from network backpressure and turns host DRAM, local SSDs, and Google Cloud Managed Lustre into an automated, multi-tier KV cache; and for RL, it exposes low-level DMA and DCN primitives that higher-level RL frameworks can use to stream updated weights from trainers to samplers. By accessing device buffers in place rather than copying or locking them, TPU Sync consistently slashes KV transfer latency by over 90% and reduces Time to First Token (TTFT) by an average of 90% for heavyweight open-weight MoE models (235B–480B parameters) in prefix-caching and disaggregated-serving workloads, compared to running without TPU Sync.</span></p>\n<p><span style=\"vertical-align: baseline;\">Across this shared model-state layer, TPU Sync integrates directly into existing infrastructure stacks across PyTorch (via</span> <a href=\"https://github.com/google-pytorch/torch_tpu\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TorchTPU</span></a><span style=\"vertical-align: baseline;\">) and JAX — serving as the TPU KV cache connector for vLLM, SGLang, and llm-d disaggregated serving, while providing low-level transfer primitives for Pathways and multi-controller JAX (McJAX) RL pipelines.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Understanding TPU Sync: The kitchen analogy</strong></h3>\n<p><span style=\"vertical-align: baseline;\">To understand TPU Sync’s impact, imagine a high-end restaurant kitchen. Think of the TPU as an incredibly fast executive chef working on a tiny countertop (the chip's HBM). When preparing a massive feast, the chef needs lots of ingredients (the KV cache), which quickly clutter the counter.</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The standard kitchen (without TPU Sync):</strong><span style=\"vertical-align: baseline;\"> When the small counter fills up, the chef has to toss out prepped ingredients and chop them again from scratch the next time an order needs them — stalling the kitchen on repetitive prep work (prefill recomputation).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">The upgraded kitchen (with TPU Sync):</strong><span style=\"vertical-align: baseline;\"> TPU Sync adds a spacious side pantry (pinned host RAM), a shared walk-in cold storage room accessible to every station in the kitchen (shared cluster storage), and a coordinated team of runners. The runners slide full prep trays directly between the counter, the pantry, and peer stations without repacking them (direct DMA in native TPU layout).</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Crucially, the runners swap trays in and out </span><span style=\"font-style: italic; vertical-align: baseline;\">while the chef keeps cooking</span><span style=\"vertical-align: baseline;\"> (asynchronous, non-blocking transfers).</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Key use cases for TPU Sync</strong></h3>\n<p><span style=\"vertical-align: baseline;\">TPU Sync improves system throughput and latency in workloads requiring deep context, high concurrency, multi-turn reasoning and RL rollouts:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Long-context AI agents and multi-turn chats</strong><span style=\"vertical-align: baseline;\">: When interacting with an AI agent over an extended 256K to 1M+ token session or analyzing massive documents, the model generates a continuously growing KV cache. Instead of allowing this state to exhaust HBM capacity, TPU Sync automatically tiers older KV blocks out of TPU HBM and into large pools of host RAM (with experimental tiering to shared secondary storage).</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enterprise applications with heavy system prompts (prefix caching): </strong><span style=\"vertical-align: baseline;\">AI serving platforms receive thousands of queries that share common instructions or documents. Rather than recomputing prefixes that the model has already processed, TPU Sync extends the prefix cache into distributed host memory so concurrent sessions can reuse precomputed KV blocks and bypass redundant prefill computation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Disaggregated serving architecture (prefill/decode):</strong><span style=\"vertical-align: baseline;\"> In modern enterprise deployments, workloads are isolated: Compute-bound nodes process the initial massive prompt (prefill), while memory-bound nodes draft the response token-by-token (decode). TPU Sync bridges this hardware gap by acting as a high-bandwidth Host-to-Host (H2H) streaming pipeline. It routes the processed context directly from the prefill nodes to the decode nodes, consistently delivering an over 90% reduction in data transfer overhead.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Reinforcement learning pipelines (experimental):</strong><span style=\"vertical-align: baseline;\"> Validated on internal RL workloads and included in the repository as an experimental module, TPU Sync provides low-level DMA and DCN transfer primitives that higher-level RL frameworks can use to synchronize model weights between trainers and inference samplers — including automatic resharding across different trainer and sampler parallelism layouts — to reduce the time rollout workers spend waiting on weight updates.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Breaking through the memory wall with TPU Sync</strong></h2>\n<p><span style=\"vertical-align: baseline;\">At its core, TPU Sync establishes a high-performance data transfer path between TPU HBM and host RAM, as well as across TPU hosts via the DCN. It achieves this through four key architectural advantages:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Layout-preserving direct DMA with in-place buffer aliasing</strong><span style=\"vertical-align: baseline;\">: TPU Sync accesses the underlying JAX PJRT buffers or PyTorch tensors in place and moves slices directly between TPU HBM and page-locked (</span><code style=\"vertical-align: baseline;\">DmaMap</code><span style=\"vertical-align: baseline;\">-registered) host memory in a single hardware DMA. By keeping tensors in their native TPU physical tile layout across HBM, host DRAM, storage, and the wire, data lands ready for immediate Matrix Multiply Unit (MXU) execution with no Python serialization, no layout conversion, and no user-space bounce buffers.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Compute-overlapped transfers</strong><span style=\"vertical-align: baseline;\">: Rather than taking an exclusive lock or making an on-device copy of static KV cache and weight buffers, TPU Sync creates raw PJRT buffer aliases (</span><code style=\"vertical-align: baseline;\">PJRT_RawBuffer</code><span style=\"vertical-align: baseline;\">) without holding PJRT usage locks so block-level transfers can run concurrently with active in-place computation, with built-in DMA pacing to keep large transfers from delaying kernel launches.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">No XLA compilation in the data path</strong><span style=\"vertical-align: baseline;\">: Because TPU Sync executes transfers and tile-aware strided resharding in native C++ outside the XLA graph, moving KV blocks or resharding weights across different trainer and sampler topologies does not trigger runtime compilation — keeping the data path fast and framework-agnostic.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">High-bandwidth PCIe DMA and DCN streaming</strong><span style=\"vertical-align: baseline;\">: Using the </span><code style=\"vertical-align: baseline;\">raw_transfer</code><span style=\"vertical-align: baseline;\"> library’s direct PJRT raw-buffer DMA pipeline, TPU Sync reaches up to 223 GB/s of aggregate D2H and H2D throughput per Ironwood (TPU v7x) host out of the 256 GB/s PCIe Gen5 hardware ceiling, and streams across the DCN at up to ~192 Gbps on a single 200 Gbps NIC (or ~350 Gbps across dual 200 Gbps NICs with NUMA-aware multi-NIC striping).</span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">TPU Sync exposes a low-level data transfer API, making it easier for developers to integrate high-speed TPU data transfer into higher-level frameworks.</span></p>\n<h2><strong style=\"vertical-align: baseline;\">Higher-level architecture</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Built on top of its core transport and resharding primitives, TPU Sync provides a modular orchestration stack for distributed cache management:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Global KV store:</strong><span style=\"vertical-align: baseline;\"> A global registry that maps prompt prefix hashes to physical cache blocks, handles dynamic lookups, and coordinates LRU eviction and tier demotion.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">TPU Sync controller:</strong><span style=\"vertical-align: baseline;\"> The orchestration layer that generates transfer plans, coordinates data movement across nodes, and handles lease management and recovery.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">KV cache manager:</strong><span style=\"vertical-align: baseline;\"> The local execution engine that tracks block states, manages HBM, host DRAM (including </span><code style=\"vertical-align: baseline;\">/dev/shm</code><span style=\"vertical-align: baseline;\"> warm-boot persistence) alongside experimental POSIX storage backends, and executes asynchronous DMA transfers.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/1-architecture_6N0ck5s.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Figure 1. TPU Sync operates as the model-state layer on TPU, unifying TPU HBM (Tier 1), pinned host DRAM (Tier 2), shared storage (Tier 3), and multi-host DCN under a single layout-preserving DMA data plane.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h2><strong style=\"vertical-align: baseline;\">Solving disaggregated serving and prefix caching</strong></h2>\n<p><span style=\"vertical-align: baseline;\">Let us take a closer look at how TPU Sync helps with some of the use cases we listed in the earlier section. By treating host pinned memory as a substantial, high-speed Tier 2 cache, TPU Sync reduces the fragmentation and memory limits of standard HBM setups.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Prefill/Decode (P/D) disaggregated serving</span></h3>\n<p><span style=\"vertical-align: baseline;\">In state-of-the-art serving topologies, prefill (compute-bound) and decode (memory-bound) phases are isolated on separate node pools. To prevent latency bubbles, TPU Sync bridges this gap with a highly optimized, three-step pipeline:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Direct-DMA offloading: </strong><span style=\"vertical-align: baseline;\">Once a prefill node processes an initial prompt, TPU Sync immediately moves the resulting KV blocks into pinned host RAM via its asynchronous D2H DMA path.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Host-to-host streaming</strong><span style=\"vertical-align: baseline;\">: The </span><span style=\"vertical-align: baseline;\">TPU Sync controller</span><span style=\"vertical-align: baseline;\"> then orchestrates a high-bandwidth Host-to-Host (H2H) transfer, streaming the context directly to the assigned decode node.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Overlapped ingestion</strong><span style=\"vertical-align: baseline;\">: As blocks arrive in the decode node's host RAM, TPU Sync triggers an asynchronous H2D transfer directly into TPU HBM. This happens concurrently with active decoding computation, substantially minimizing TTFT.</span></p>\n</li>\n</ol>\n<h3><span style=\"vertical-align: baseline;\">Host-powered prefix caching</span></h3>\n<p><span style=\"vertical-align: baseline;\">For highly concurrent systems sharing large system prompts or running multi-turn agentic loops, TPU HBM is not large enough to hold multiple active cache blocks. TPU Sync extends the prefix cache out of HBM (Tier 1) into substantial, distributed host RAM pools (Tier 2). Because TPU Sync transfers are asynchronous, it overlaps the PCIe DMA loading of the next required prefix from host RAM with the compute of the current request — minimizing TPU idle time between requests.</span></p>\n<p><span style=\"vertical-align: baseline;\">For workloads that exceed even host DRAM capacity, TPU Sync also includes an experimental POSIX storage backend (Tier 3+) that asynchronously spills older KV blocks to local SSDs or shared Google Cloud Managed Lustre storage — pairing with llm-d prefix-affinity routing on GKE so replicas can recall cached prefixes across tiers without recomputing prompts.</span></p>\n<h3><span style=\"vertical-align: baseline;\">Sample performance results</span></h3>\n<p><span style=\"vertical-align: baseline;\">P/D disaggregated inference result highlights: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Over 90% KV transfer overhead cut</strong><span style=\"vertical-align: baseline;\">: For heavyweight models like Qwen3 235B, median KV transfer latency dropped from several seconds down to a flat ~230 ms.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Substantial TTFT reduction</strong><span style=\"vertical-align: baseline;\">: Demonstrated an average of 60%</span><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">reduction in TTFT for heavyweight models (Qwen3 235B) under controlled, low-concurrency testing benchmarks, and an average of 90% for 480B under low concurrency.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Substantial high-traffic scalability</strong><span style=\"vertical-align: baseline;\">: During sustained traffic spikes, TPU Sync achieves an average of 30% to 70% increase in token output throughput for 235B, depending on traffic distribution.</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-pd performance\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-pd_performance.max-1000x1000.png\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Prefix caching result highlights: </span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Expands KV cache capacity beyond HBM</strong><span style=\"vertical-align: baseline;\">: When heavyweight MoE model weights consume most of device HBM, on-chip memory can hold only a few long-context prefixes. Offloading into pinned host DRAM expands effective cache capacity by an order of magnitude.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sustains high cache-hit rates under concurrency</strong><span style=\"vertical-align: baseline;\">: Pooling distributed host RAM keeps shared system prompts and multi-turn agent contexts warm across thousands of concurrent sessions instead of thrashing HBM.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Significantly reduces prefill recompute</strong><span style=\"vertical-align: baseline;\">: Directly bypasses heavy compute layers for repeated instruction blocks and system prompts, reducing average TTFT by up to 90% on 64K-context workloads while delivering over 50% higher throughput and a 30% reduction in P99 inter-token latency (ITL).</span></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"3-prefix performance\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/3-prefix_performance.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Please see the note<sup>1</sup></span><span style=\"vertical-align: baseline;\"> below on the testing configuration. </span></p>\n<h2><strong style=\"vertical-align: baseline;\">Ecosystem adoption and partnerships</strong></h2>\n<p><span style=\"vertical-align: baseline;\">TPU Sync serves as the open, composable memory substrate across our PyTorch-on-TPU and Kubernetes serving ecosystem, built in close collaboration with key open-source maintainers and infrastructure partners:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Inferact (vLLM-TorchTPU)</strong><span style=\"vertical-align: baseline;\">: Co-engineered with Inferact, maintainers of</span> <a href=\"https://github.com/vllm-project/vllm-torchtpu\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vLLM-TorchTPU</span></a><span style=\"vertical-align: baseline;\">, TPU Sync is integrated directly via vLLM's native KVConnector interface. It powers Direct-DMA host DRAM offloading and multi-host P/D disaggregation across frontier open-source models.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">RadixArk (SGLang-TorchTPU)</strong><span style=\"vertical-align: baseline;\">: In partnership with RadixArk, maintainers of</span> <a href=\"https://github.com/sgl-project/sglang-torchtpu\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">SGLang-TorchTPU</span></a><span style=\"vertical-align: baseline;\">, TPU Sync serves as both the high-speed P/D disaggregation transfer backend and the native I/O backend for SGLang’s hierarchical cache.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">llm-d 1.0 integration</strong><span style=\"vertical-align: baseline;\">: </span><a href=\"https://github.com/llm-d/llm-d\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d</span></a><span style=\"vertical-align: baseline;\"> 1.0 pairs with TPU Sync on GKE to deliver global prefix-cache-affinity routing, per-rank decode session pinning, and experimental two-stage capacity spill to Google Cloud Managed Lustre.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Validated by frontier AI labs and enterprises</strong><span style=\"vertical-align: baseline;\">: Frontier AI organizations are already adopting our PyTorch-on-TPU serving stack and evaluating TPU Sync multi-tier architectures for production deployments — including Meta, alongside major enterprises like Wayfair, and multi-silicon partners.</span></p>\n</li>\n</ul>\n<h2><strong style=\"vertical-align: baseline;\">Get started </strong></h2>\n<p><a href=\"https://github.com/google/tpu-sync\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Sync</span></a><span style=\"vertical-align: baseline;\"> is available today as open source with Python wheels for both PyTorch (</span><code style=\"vertical-align: baseline;\">tpu-sync-torch</code><span style=\"vertical-align: baseline;\">) and JAX (</span><code style=\"vertical-align: baseline;\">tpu-sync-jax</code><span style=\"vertical-align: baseline;\">), and is integrated with</span> <a href=\"https://github.com/vllm-project/vllm-torchtpu\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">vLLM-TorchTPU</span></a><span style=\"vertical-align: baseline;\">,</span><a href=\"https://github.com/sgl-project/sglang-torchtpu\" rel=\"noopener\" target=\"_blank\"><span style=\"vertical-align: baseline;\"> </span><span style=\"text-decoration: underline; vertical-align: baseline;\">SGLang-TorchTPU</span></a><span style=\"vertical-align: baseline;\">, and</span> <a href=\"https://github.com/llm-d/llm-d\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">llm-d</span></a><span style=\"vertical-align: baseline;\"> on GKE. Visit the</span> <a href=\"https://github.com/google/tpu-sync\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GitHub repository</span></a><span style=\"vertical-align: baseline;\"> to explore the architecture docs, C++ and Python APIs, and deployment guides.</span></p>\n<p><span style=\"vertical-align: baseline;\">We are committed to working with the open-source community to advance the model-state layer on TPU — supporting new frontier architectures, expanded storage tiering, and longer-horizon agentic and RL workloads. For more up-to-date performance results, please see our ongoing efforts on public benchmarks (</span><a href=\"https://inferencex.semianalysis.com/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">InferenceX</span></a><span style=\"vertical-align: baseline;\">).</span></p>\n<hr />\n<p><sup><em><span style=\"vertical-align: baseline;\">1. <span style=\"vertical-align: baseline;\">Performance results are based on internal testing conducted in July 2026 on TPU v7x (2x2x1 topology), configured with PCIe Gen5 (x16) per TPU chip and one or two 200 Gbps NICs enabled per host, running tpu-inference v0.24.0 (using JAX 0.10.2 and libtpu 0.0.42.1). Metrics presented represent average and median performance improvements observed under controlled laboratory conditions. Actual real-world performance, cache hit rates, and latency reductions will vary based on system configuration, network bandwidth, concurrent traffic, and specific user workload patterns.</span></span></em></sup></p></div>"
  "20866161dfd97176d38afd7cefd83925":
    "id": "20866161dfd97176d38afd7cefd83925"
    "title": "Now generally available: GKE dynamic slicing for higher resilience, and efficiency for TPUs"
    "link": "https://cloud.google.com/blog/products/containers-kubernetes/gke-dynamic-slicing-on-tpus/"
    "published": "2026-11-09 22:00:00"
    "fetched": "2026-11-10 05:25:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Running large-scale AI workloads on TPU and Google Kubernetes Engine (GKE) requires infrastructure that adapts as fast as your models change. Dynamic Slicing is generally available on GKE, which decouples logical TPU slice formation from physical nodepool provisioning.</span></p>\n<p><span style=\"vertical-align: baseline;\">Compared to creating a static nodepool for each TPU slice, dynamic slicing reduces AI workload startup times by up to </span><strong style=\"vertical-align: baseline;\">5x</strong><span style=\"vertical-align: baseline;\"> and workload recovery by </span><strong style=\"vertical-align: baseline;\">4.5x </strong><span style=\"vertical-align: baseline;\">— maximizing TPU goodput, efficiency, and workload resilience at scale. </span></p>\n<h3><strong style=\"vertical-align: baseline;\">Beyond one workload, one nodepool </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Previously, managing TPU capacity at GKE standard required separate, fixed TPU slice topology nodepools, increasing startup times and complexity while preventing multi-host nodepools from hosting multiple AI workloads. Changing workload needs meant manually deleting and recreating nodepools. Additionally, this tight coupling created large failure domains where a single hardware fault crashed an entire slice, slowing recovery while reprovisioning.</span></p>\n<p><span style=\"vertical-align: baseline;\">To overcome these challenges, we built GKE dynamic slicing, which decouples physical hardware provisioning from logical slice formation, dynamically stitching together TPU cubes using TPU optical circuit switching (OCS) technology to form various larger slice topologies (super-slicing), or partitioning TPU cubes into smaller slices for multiple workloads to run inside a nodepool (sub-slicing). By enabling workloads to assemble custom TPU slice topologies on demand without having to delete and recreate static nodepools, dynamic slicing reduces job startup latency, limits the blast radius of hardware failures, accelerates recovery of workloads, and improves fleet utilization and efficiency. </span></p>\n<p><span style=\"vertical-align: baseline;\">Dynamic slicing delivers several key improvements for platform teams:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Zero-downtime topology agility:</strong><span style=\"vertical-align: baseline;\"> Completely eliminates the rigid \"delete-and-create\" nodepool cycle, allowing to dynamically stitch together TPU cubes (16 VMs nodepools) to form large TPU slices, or carve out smaller-slices on the fly as an AI workload is submitted.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Up to 5x faster job startup:</strong><span style=\"vertical-align: baseline;\"> Slashes job startup times by up to five times by instantly assembling logical slice topologies from pre-provisioned TPU nodepools instead of waiting for a slow, new nodepool deployment.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Improved fleet utilization:</strong><span style=\"vertical-align: baseline;\"> Improves resource efficiency and eliminates idle capacity by enabling multi-tenant packing of smaller workloads within nodepools. Additionally, it lets you provision partially healthy nodepools. This way, you can utilize healthy hosts that would otherwise be unavailable.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Up to 4.5x faster recovery and fault tolerance:</strong><span style=\"vertical-align: baseline;\"> Accelerates recovery by isolating large slice failures to a TPU cube (a 16-VM 4x4x4 slice topology) and swapping unhealthy cubes in one to two minutes. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Enhanced visibility and control:</strong><span style=\"vertical-align: baseline;\"> Offers comprehensive insight into potential TPU partitions (slices) within each cube, covering real-time health and usage metrics to facilitate proactive, optimized workload scheduling.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Dynamic slicing architecture</strong></h3>\n<p><span style=\"vertical-align: baseline;\">GKE dynamic slicing is offered in two forms: super-slicing, to create larger scale TPU slices that exceed the size of a single TPU cube; and sub-slicing, which provisions smaller, independent slices from a single cube.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Dynamic super-slicing</span></h4>\n<p><span style=\"vertical-align: baseline;\">GKE dynamic super-slicing utilizes TPU optical circuit switching (OCS) technology to dynamically connect TPU cubes (consisting of 16 VMs configured in a 4x4x4 slice topology) at the time of workload scheduling. By altering the OCS network configuration dynamically, larger slice topologies are created and tailored to the workload slice needs outlined in the Kubernetes workload manifest, significantly enhancing operational efficiency.</span></p>\n<p><span style=\"vertical-align: baseline;\">Super-slicing fundamentally relies on a baseline conversion of all available TPU capacity into uniform nodepools composed of 16-VM (4x4x4) TPU cubes. When a TPU slice topology is specified in Kubernetes workload YAML file, the GKE scheduler (or your custom scheduler) identifies the request and instantiates slice creation. This process uses the TPU </span><a href=\"http://cloud.google.com/blog/topics/systems/the-evolution-of-googles-jupiter-data-center-network?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">optical circuit switch</span></a><span style=\"vertical-align: baseline;\"> to stitch multiple 4x4x4 cubes together, dynamically instantiating the targeted slice topology and scheduling the workload directly onto the newly established super-slice. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"1. SUperSliceVisualizer_compressed\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/1._SUperSliceVisualizer_compressed.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>How a 4x4x16 super slice (comprising 64 Ironwood VMs and 256 total chips) is formed using four Ironwood cubes (also provisioned as GKE nodepools). At runtime, the slice is created dynamically by stitching together the TPU network across all TPU chips in these four cubes.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Dynamic sub-slicing</span></h4>\n<p><span style=\"vertical-align: baseline;\">Dynamic sub-slicing partitions a single, pre-provisioned TPU cube (16 VM nodepool) into smaller, independent sub-slices on demand. You can manage a single pool of uniform TPU cubes and partition them on demand. With this approach, multiple distinct jobs with completely different slice topology requirements can run concurrently and fully isolated inside the same physical TPU cube, boosting overall resource utilization and allowing you to salvage and run workloads on healthy partitions, even if a portion of the cube is unhealthy.</span></p>\n<p><span style=\"vertical-align: baseline;\">When a workload is scheduled, sub-slicing dynamically parses its specific slice topology requirements from the incoming Kubernetes manifest. It then locates healthy partitions within the cubes, activates the high-speed Inter-Chip Interconnect (ICI) network to form sub-slices, and deploys the workload onto the newly created slice. Upon workload completion, the scheduler automatically deconstructs (\"deforms\") the slice and returns the partitions to the shared pool, making them immediately available for future workloads without having to recreate the GKE nodepool.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2. dynamic_sub_slicing_visualization\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/2._dynamic_sub_slicing_visualization.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>How GKE sub-slicing dynamically partitions a 16-host TPU cube into smaller, independent slices (e.g., 2x2x4 with 16 chips down to 2x2x2) for optimal utilization of TPU resources.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h4><span style=\"vertical-align: baseline;\">Customer use cases</span></h4>\n<p><span style=\"vertical-align: baseline;\">You can leverage dynamic slicing to form massive TPU slice topologies to meet large scale training, ranging from large 8,000-chip single slices to multi-slices of multiple thousands of chips, down to single-host four-chip configurations. This supports a wide variety of heterogeneous AI workloads within the same environment. Designed for the demands of largest-scale workloads, </span><strong style=\"vertical-align: baseline;\">dynamic slicing</strong><span style=\"vertical-align: baseline;\"> delivers resiliency and operational efficiency for AI workloads running across thousands of accelerators. </span><strong style=\"vertical-align: baseline;\">Sub-slicing</strong><span style=\"vertical-align: baseline;\"> offers the versatility to efficiently scale inference workloads ranging from small to large-scale deployments.  </span></p>\n<h4><span style=\"vertical-align: baseline;\">Dynamic slicing scheduler for GKE </span></h4>\n<p><span style=\"vertical-align: baseline;\">GKE provides deployable schedulers optimized for dynamic slicing, or you can use your own custom scheduler to manage workload placement. This flexibility allows for intelligent workload scheduling based on proactive health status monitoring. See more in our </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Getting started</strong></h3>\n<h4><span style=\"vertical-align: baseline;\">Pre-provision nodepools</span></h4>\n<p><span style=\"vertical-align: baseline;\">To get started, you must perform a one-time activity of pre-provisioning TPU capacity into nodepools of 16 VMs each (maps to a TPU cube or sub-block). This baseline conversion allows for dynamic stitching of these units into custom slice topologies on demand. </span></p>\n<p><span style=\"vertical-align: baseline;\">Dynamic slicing introduces a new type of nodepools called an incremental provisioning nodepool. An incremental provisioning nodepool is a fault-tolerant model that supersedes the traditional \"all-or-nothing\" approach for creating TPU slices. GKE provisions the nodepool using all available healthy hosts even if some hosts in a 4x4x4 (16 VM) slice are faulty. The system continuously reconciles state, automatically adding pending nodes once faulty hosts recover.</span></p>\n<p><span style=\"vertical-align: baseline;\">This setup is a prerequisite for dynamic sub-slicing, as it allows the high-speed ICI network mesh to be dynamically configured. By using incremental provisioning, you can create nodepools for your entire capacity at once, reducing operational toil and maximizing TPU utilization by enabling sub-slicing on healthy nodes.</span></p>\n<h4><span style=\"vertical-align: baseline;\">Workload scheduling on dynamic slicing</span><span style=\"text-decoration: underline; vertical-align: baseline;\"> </span></h4>\n<p><span style=\"vertical-align: baseline;\">After enabling the slice controller in the GKE cluster and configuring the GKE scheduler, you can indicate the need for dynamic slices for your workloads using simple workload annotations.</span></p>\n<p><span style=\"vertical-align: baseline;\">Upon detecting these annotations, the scheduler automatically triggers the GKE slice controller to create a Slice </span><a href=\"https://kubernetes.io/docs/concepts/extend-kubernetes/api-extension/custom-resources/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Custom Resource</span></a><span style=\"vertical-align: baseline;\"> (CR) to form the dynamic slice at runtime. Once the slice is formed, the workload is scheduled on the dynamic slice. Refer to </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/use-gke-dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\"> for examples.</span></p>\n<h3><strong style=\"vertical-align: baseline;\">Repair</strong></h3>\n<p><span style=\"vertical-align: baseline;\">When host or network failures disrupt workloads, the GKE scheduler maintains resilience and continuous operation through targeted recovery strategies:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Super-slicing (slices larger than 1 TPU cube): </strong><span style=\"vertical-align: baseline;\">Hardware failures are isolated to a smaller unit — the TPU \"cube\" — allowing the scheduler to quickly reform the slice by removing the unhealthy cube and choosing all healthy cubes.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Sub-slicing: </strong><span style=\"vertical-align: baseline;\">Slices on faulty infrastructure are dynamically reformed using available healthy partitions.</span></p>\n</li>\n</ul>\n<h3><strong style=\"vertical-align: baseline;\">Next steps </strong></h3>\n<p><span style=\"vertical-align: baseline;\">Dynamic slicing (super-slice and sub-slice) is available for  TPUs and is offered in all regions where TPUs are available. It is supported exclusively in </span><a href=\"https://docs.cloud.google.com/tpu/docs/all-capacity-overview\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU All Capacity</span></a><span style=\"vertical-align: baseline;\"> under reservation mode. For  working examples of dynamic slicing, refer to the </span><a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">documentation</span></a><span style=\"vertical-align: baseline;\">.</span></p></div>"
  "ca625d47d7debd7cda9012df07acbf25":
    "id": "ca625d47d7debd7cda9012df07acbf25"
    "title": "Our newest TPUs: 8tx and 8i Max, built for the agentic era"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/tpu-8tx-and-tpu-8i-max/"
    "published": "2026-11-09 22:00:00"
    "fetched": "2026-11-10 05:25:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><strong style=\"vertical-align: baseline;\">Editor’s note: </strong><span style=\"vertical-align: baseline;\">This blog was originally published on </span><a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/global-network/tpu-8i-max-and-8tx/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">News from Google</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<hr />\n<p><span style=\"vertical-align: baseline;\">We first designed TPUs more than a decade ago motivated by Google’s internal demands, including voice recognition and language translation. Eight generations of TPUs later, the use cases have exploded, covering: i) training and serving our own Gemini models, ii) agentic workloads, iii) delivering services to Google Cloud customers on our cloud infrastructure, and most recently, iv) allowing customers to deploy TPUs directly into their own data centers. TPUs are now a rapidly growing business with nearly 100 customers — including frontier labs, trading firms, retailers, universities, and more.</span></p>\n<p><span style=\"vertical-align: baseline;\">At Google Cloud Next in April, we </span><a href=\"https://blog.google/innovation-and-ai/infrastructure-and-cloud/google-cloud/eighth-generation-tpu-agentic-era/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">introduced</span></a><span style=\"vertical-align: baseline;\"> two new specialized TPUs in the same generation — 8t for large-scale training and 8i for real-time reasoning. </span><span style=\"vertical-align: baseline;\">TPU 8t and 8i offer up to 2.7 times better training performance and 80% better inference price performance, respectively, versus our previous generation of TPUs. </span></p>\n<p><span style=\"vertical-align: baseline;\">Today, we’re taking that a step further</span><span style=\"vertical-align: baseline;\">, expanding our eighth-generation TPU portfolio with two additional systems: TPU 8i Max</span><strong style=\"vertical-align: baseline;\"> </strong><span style=\"vertical-align: baseline;\">for massive context windows and the highest compute density per rack, and TPU 8tx </span><span style=\"vertical-align: baseline;\">for secure and confidential inference</span><span style=\"vertical-align: baseline;\">. This is the first time we have introduced four TPU systems in a single year. </span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"8th-Gen-range_samesize\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/8th-Gen-range_samesize.max-1000x1000.png\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Our expanded eighth-generation TPU portfolio: TPU 8t, TPU 8i, TPU 8tx, and TPU 8i Max.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">While we’ve always co-designed our TPUs in partnership with Google DeepMind, we’re now increasingly getting feedback from external organizations on their specific needs. With computing moving from human to agent scale, businesses are asking for accelerators that can reason across AI models’ massive context windows. In addition, some highly regulated customers are asking for specialized encryption capabilities for unique workloads.</span></p>\n<p><span style=\"vertical-align: baseline;\">The new TPU systems we are announcing today address this new reality. Coupled with </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">our recent PyTorch announcements</span></a><span style=\"vertical-align: baseline;\">, our aim is to make TPUs more easily accessible to every developer and Cloud customer. By combining modular custom silicon with an open and easy-to-use software stack, we can deliver new hardware and system configurations at the pace of the AI industry. </span></p>\n<h2><span style=\"vertical-align: baseline;\">Building the computer around the chip</span></h2>\n<p><span style=\"vertical-align: baseline;\">Today, we’re announcing two new TPU systems — and there’s </span><span style=\"vertical-align: baseline;\">an important difference between a new chip and a new system.</span><span style=\"vertical-align: baseline;\"> </span></p>\n<p><span style=\"vertical-align: baseline;\">Designing a new chip means laying out billions of microscopic transistors on a silicon wafer in a multi-year process bound by the laws of physics and a complex, long-duration manufacturing lifecycle. </span><span style=\"vertical-align: baseline;\">A system, on the other hand, is about how we bring together the compute, networking, and storage around the chip. This can include how they are packaged with the chips, to quickly meet emerging customer needs and research use cases. </span></p>\n<p><span style=\"vertical-align: baseline;\">When we built our very first TPU more than a decade ago, we knew AI software would evolve much faster than silicon manufacturing ever could. So we made a foundational bet on system balance and modularity, architecting our TPUs as building blocks as part of our </span><a href=\"https://cloud.google.com/ai-infrastructure\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AI Hypercomputer</span></a><span style=\"vertical-align: baseline;\">, so engineers could rapidly adjust packaging, high-speed memory, optical networking, and security around them. That approach allows us to deliver specialized supercomputers in a matter of months rather than years.</span></p></div>\n<div class=\"block-paragraph_advanced\"><h2><span style=\"vertical-align: baseline;\">Specializing for secure, high-context AI</span></h2>\n<p><span style=\"vertical-align: baseline;\">Each system in our eighth-generation TPU portfolio targets a distinct part of the AI lifecycle. </span><span style=\"vertical-align: baseline;\">TPU 8t and TPU 8i established the baseline for this generation of chips:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">TPU 8t was designed to be a training powerhouse for massive foundation models with maximum “goodput” — or the useful intelligence delivered per watt of energy used. </span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">TPU 8i is the reasoning engine, designed to break the memory wall, cutting inter-chip communication delays by up to half. </span></p>\n</li>\n</ul>\n<p><span style=\"vertical-align: baseline;\">Now, as enterprises bring autonomous agents into production, we have created two new configurations of these foundational systems to solve two urgent new challenges: hardware-level data security and million-token context scale.</span></p>\n<h3><span style=\"vertical-align: baseline;\">TPU 8tx</span></h3>\n<p><span style=\"vertical-align: baseline;\">TPU 8tx, our third eighth-generation system, is optimized for secure and confidential inference and is also great for small-scale training. It’s built for regulated enterprises and governments running frontier or proprietary models and autonomous agents alongside their most sensitive data. </span></p>\n<p><span style=\"vertical-align: baseline;\">Normally, data is encrypted when stored or sent over a network, but has to be unlocked in memory while a computer processes it. Built on the same silicon as TPU 8t and paired with 5th Generation AMD EPYC CPU hosts, TPU 8tx builds security directly into the hardware layer, keeping sensitive data and model weights protected and isolated even while in active use. And by adopting the same low-latency Boardfly network we created for real-time reasoning, TPU 8tx keeps multi-step agents moving, delivering up to 2x lower latency compared to TPU 8t with a near-zero performance penalty.</span></p>\n<p><span style=\"vertical-align: baseline;\">Pairing training-grade compute with a fast inference network also means organizations can simultaneously run and customize their models on a single system. TPU 8tx enables teams to fine-tune models using their private data, distill large models into smaller ones, and train their agents through reinforcement learning, all without needing to migrate sensitive data between separate clusters.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"Designed for sensitive enterprise workloads\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/Designed_for_sensitive_enterprise_workloads.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>Designed for sensitive enterprise workloads, TPU 8tx provides hardware-level confidential compute for private fine-tuning and secure agent execution.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">TPU 8i Max</span></h3>\n<p><span style=\"vertical-align: baseline;\">Our fourth system, TPU 8i Max, is built for a different problem: the memory wall.</span></p>\n<p><span style=\"vertical-align: baseline;\">When dozens of AI agents work together across an entire software codebase or hours of video at once, memory bandwidth quickly becomes the bottleneck. So we took two low-latency TPU 8i chips and combined them onto a single package. </span></p>\n<p><span style=\"vertical-align: baseline;\">TPU 8i Max scales compute and memory in lockstep, delivering double the compute, double the SRAM and double the HBM bandwidth of TPU 8i, so processors remain equipped with essential data and so that large workloads do not stall. Further, because TPU 8i Max fits twice the silicon within the existing rack footprint, </span><span style=\"vertical-align: baseline;\">data centers can deploy significantly more computing power per square foot and per watt.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"The dual-chip TPU 8i Max system\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/The_dual-chip_TPU_8i_Max_system.gif\" />\n        \n        </a>\n      \n        <figcaption class=\"article-image__caption \"><p>The dual-chip TPU 8i Max system, engineered for massive context windows and maximum compute density.</p></figcaption>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">While flexible across workloads, together the four systems in our eighth-generation TPUs give customers a purpose-built accelerator for every stage of the agentic lifecycle. TPU 8t for scale-up training, TPU 8i for low-latency reasoning, TPU 8tx for confidential computing, and TPU 8i Max for massive context windows and the highest compute density per rack.</span></p>\n<h2><span style=\"vertical-align: baseline;\">Opening up TPUs to every developer</span></h2>\n<p><span style=\"vertical-align: baseline;\">When we launched the first TPU more than a decade ago, there were only a handful of companies running workloads that needed the processing power of a TPU. The use cases were specialized, so engineers would use optimized frameworks and hand-tuned code. </span></p>\n<p><span style=\"vertical-align: baseline;\">Over the years, as AI has advanced, more and more companies began using accelerators. Now, AI adoption is at a point where TPUs are excellent for a wide range of companies and use cases, and as a result, we’ve been working systematically to remove barriers to adoption so that TPUs  are as easy-to-use as general-purpose hardware. </span></p>\n<p><span style=\"vertical-align: baseline;\">This investment comes together today across these key areas:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Opening up TPU development to every PyTorch developer; no code rewrites needed:</strong><span style=\"vertical-align: baseline;\"> Last month, we open-sourced </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/torchtpu-is-now-open-source-run-native-pytorch-on-tpus?e=48754805\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TorchTPU</span></a><span style=\"vertical-align: baseline;\">, so PyTorch code and Hugging Face models now run natively on TPUs, alongside out-of-the-box TPU backends for leading open-source inference engines like vLLM and SGLang. And to make hardware optimization effortless, our new open-source </span><a href=\"https://docs.cloud.google.com/tpu/docs/pytorch-on-tpu#tpu-agent-suite\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU agent suite</span></a><span style=\"vertical-align: baseline;\"> (now in preview) plugs directly into coding tools like Claude Code, Cursor, and Google Antigravity to automate TPU onboarding in minutes, diagnose bottlenecks, and autotune custom kernels using plain language. For production deployments, our new open-source </span><a href=\"https://opensource.googleblog.com/2026/11/supercharging-xla-inference-xla-serving-engine.html\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">XLA Serving Engine </span></a><span style=\"vertical-align: baseline;\">lets you train models in Python and serve them directly in a low-latency C++ runtime across TPUs, GPUs, and CPUs.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Industry-leading production performance on InferenceX and AgentX benchmarks:</strong><span style=\"vertical-align: baseline;\"> </span><span style=\"vertical-align: baseline;\">In production, what really matters is outcomes on real AI workloads rather than theoretical peak chip speeds. </span><span style=\"vertical-align: baseline;\">On industry-standard InferenceX and AgentX </span><a href=\"https://newsletter.semianalysis.com/p/tpu-inferencex-full-steam?utm_source=post-email-title&amp;publication_id=6349492&amp;post_id=213967688&amp;utm_campaign=email-post-title&amp;isFreemail=false&amp;r=2j6jwc&amp;triedRedirect=true\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">benchmarks</span></a><span style=\"vertical-align: baseline;\">, which test realistic agentic coding and long-context work, our native vLLM-TorchTPU software stack on TPUs achieved state-of-the-art price-performance marks. </span><a href=\"https://newsletter.semianalysis.com/p/tpu-strikes-the-king\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">New evaluations</span></a><span style=\"vertical-align: baseline;\"> demonstrate these advantages extend across a wide range of frontier open models and open-source serving stacks while maintaining high model accuracy. </span><span style=\"vertical-align: baseline;\">Upcoming software optimizations on this same hardware will drive those results even further.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong>Eliminating idle compute waste for autonomous agents:</strong> Because AI agents are stateful, they frequently pause for seconds or hours while waiting on a database lookup, an external software tool, or human feedback. To make our agents more resource-efficient during those pauses, our new<a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/agent-compute-engine-deep-dive?e=48754805\"> Agent Compute Engine</a> software automatically suspends and resumes idle sessions, cutting operational infrastructure costs.</p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Breaking through the memory wall with the model-state layer (</strong><strong style=\"vertical-align: baseline;\">TPU Sync</strong><strong style=\"vertical-align: baseline;\">):</strong><span style=\"vertical-align: baseline;\"> Building the computer around the chip also means unifying memory, storage, and networking in software. As agents reason across million-token contexts and continuous reinforcement learning (RL) loops, memory quickly becomes the bottleneck. We’re open-sourcing </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/introducing-tpu-sync-fast-kv-cache-and-weight-transfer-on-tpu\"><span style=\"text-decoration: underline; vertical-align: baseline;\">TPU Sync</span></a><span style=\"vertical-align: baseline;\">, the model-state layer for TPU clusters. TPU Sync turns chip HBM, host DRAM, shared storage, and the data center network into a single, co-designed memory hierarchy — automatically tiering massive KV caches off the chip in milliseconds, streaming context across disaggregated prefill and decode nodes, and synchronizing RL weights to cut KV transfer latency and Time to First Token (TTFT) by more than 90%.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Scaling distributed workloads across TPUs from a single controller:</strong><span style=\"vertical-align: baseline;\"> Now </span><a href=\"https://cloud.google.com/blog/topics/ai-infrastructure/cloud-pathways-a-distributed-ml-runtime-is-ga\"><span style=\"text-decoration: underline; vertical-align: baseline;\">generally available</span></a><span style=\"vertical-align: baseline;\"> on Google Kubernetes Engine (GKE),</span> <a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-intro\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pathways</span></a><span style=\"vertical-align: baseline;\"> brings the Google DeepMind runtime behind Gemini to every Google Cloud customer. Using a single-controller architecture and</span> <a href=\"https://github.com/AI-Hypercomputer/pathways-utils\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">pathwaysutils</span></a><span style=\"vertical-align: baseline;\">, you can orchestrate large-scale TPU systems across multiple slices as if they were one local machine for pre-training, reinforcement learning, and multihost inference. Cloud Pathways keeps long-running jobs moving through hardware disruptions with colocated Python sidecars, sub-minute slice hot-swapping, and elastic resharding.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Stitching custom TPU topologies on-demand with GKE dynamic slicing:</strong><span style=\"vertical-align: baseline;\"> Now generally available,</span> <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/dynamic-slicing\"><span style=\"text-decoration: underline; vertical-align: baseline;\">GKE dynamic slicing</span></a><span style=\"vertical-align: baseline;\"> decouples physical hardware provisioning from logical slice formation using optical circuit switching (OCS) technology. By dynamically assembling TPU cubes into larger topologies (super-slicing) or partitioning them into smaller, isolated workloads (sub-slicing) on-the-fly, this update completely eliminates rigid, manual nodepool recreation cycles. This topology agility slashes job startup times by up to 5x and accelerates fault recovery by up to 4.5x, maximizing overall fleet utilization and workload goodput across all TPUs.</span></p>\n</li>\n</ul>\n<h2><span style=\"vertical-align: baseline;\">Co-designing with a decade of experience</span></h2>\n<p><span style=\"vertical-align: baseline;\">Shipping four TPU systems and a unified, open software stack in a single year only happens when silicon architects, networking engineers, compiler teams, and Google DeepMind researchers build side-by-side. </span></p>\n<p><span style=\"vertical-align: baseline;\">Increasingly, we’re even tapping into AI to ideate and build the next generation of AI infrastructure. From using Google DeepMind’s </span><a href=\"https://deepmind.google/blog/how-alphachip-transformed-computer-chip-design/\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">AlphaChip</span></a><span style=\"vertical-align: baseline;\"> reinforcement learning system to using Gemini to deliver chip layouts in hours rather than weeks, we’re using TPU-powered AI services to rapidly accelerate next-generation TPU hardware development. This is true co-design and a unique Google differentiator. </span></p>\n<p><span style=\"vertical-align: baseline;\">Learn more about our new TPU systems by tuning into today’s </span><a href=\"https://youtube.com/live/pabDkNR7jIs\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">broadcast</span></a><span style=\"vertical-align: baseline;\"> at 9 a.m. PT.</span></p></div>"
  "fffa30814b5d2adb8a66576d5e92306b":
    "id": "fffa30814b5d2adb8a66576d5e92306b"
    "title": "Cloud Pathways, a distributed ML runtime for massive accelerator fleets, now GA"
    "link": "https://cloud.google.com/blog/topics/ai-infrastructure/cloud-pathways-a-distributed-ml-runtime-is-ga/"
    "published": "2026-11-09 22:00:00"
    "fetched": "2026-11-10 05:25:21"
    "summary": "<div class=\"block-paragraph_advanced\"><p><span style=\"vertical-align: baseline;\">Today, we are thrilled to announce the </span><strong style=\"vertical-align: baseline;\">general availability (GA)</strong><span style=\"vertical-align: baseline;\"> of </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-intro\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">Cloud Pathways</strong></a><span style=\"vertical-align: baseline;\"> (</span><strong style=\"vertical-align: baseline;\">Pathways on Cloud</strong><span style=\"vertical-align: baseline;\">) on Google Kubernetes Engine (GKE) as a core runtime pillar of the Google Cloud </span><strong style=\"vertical-align: baseline;\">AI Hypercomputer</strong><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">Originally engineered by Google DeepMind to train and serve Google's frontier models — including Gemini — Pathways is our distributed machine-learning runtime designed for massive, heterogeneous accelerator fleets. In fact, over the last 90 days alone, leading AI companies and global enterprises have processed </span><strong style=\"vertical-align: baseline;\">more than 130 million Cloud TPU chip-hours</strong><span style=\"vertical-align: baseline;\"> using Pathways on GKE, across a broad range of TPU generations.</span></p>\n<p><span style=\"vertical-align: baseline;\">With Cloud Pathways, every Google Cloud customer can use the same single-controller runtime, colocated Python sidecars, and elastic fault tolerance that power Google's largest AI workloads. We are also pleased to announce a </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/create-cluster-director-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Preview integration with Cluster Director</span></a><span style=\"vertical-align: baseline;\"> to extend Cloud Pathways to Slurm clusters, supporting unified multi-slice JAX execution, elastic training, and interactive notebooks.</span></p></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"image2\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/original_images/cloud_pathways_light_1.gif\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">What is Cloud Pathways?</span></h3>\n<p><span style=\"vertical-align: baseline;\">As AI workloads scale across thousands of accelerators, spanning multi-slice pre-training, disaggregated inference, and multi-program reinforcement learning (RL) loops, traditional multi-controller setups become harder to program and manage. In default multi-controller JAX, every TPU host runs its own separate Python interpreter with only a localized view of its connected devices and executes the same SPMD program in lockstep, making heterogeneous MPMD workflows and cross-slice resource management complex and brittle.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Cloud Pathways</strong><span style=\"vertical-align: baseline;\"> replaces multi-controller management with a unified </span><strong style=\"vertical-align: baseline;\">single-controller architecture</strong><span style=\"vertical-align: baseline;\"> built on the open-source </span><a href=\"https://github.com/openxla/xla/blob/main/xla/python/ifrt/README.md\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Interim Framework Runtime (IFRT)</span></a><span style=\"vertical-align: baseline;\">. By setting </span><code style=\"vertical-align: baseline;\">JAX_PLATFORMS=proxy</code><span style=\"vertical-align: baseline;\"> with </span><a href=\"https://github.com/AI-Hypercomputer/pathways-utils\" rel=\"noopener\" target=\"_blank\"><code style=\"text-decoration: underline; vertical-align: baseline;\">pathwaysutils</code></a><span style=\"vertical-align: baseline;\">, a single JAX client process views and orchestrates multiple large TPU slices, spanning thousands of TPU chips as if they were all connected locally.</span></p>\n<p><strong style=\"vertical-align: baseline;\">Learn more about Pathways in our latest deep-dive blog </strong><a href=\"https://developers.googleblog.com/what-is-pathways-single-controller-training-for-large-models/\" rel=\"noopener\" target=\"_blank\"><strong style=\"text-decoration: underline; vertical-align: baseline;\">here.</strong></a></p>\n<h3><span style=\"vertical-align: baseline;\">Core architectural innovations</span></h3>\n<p><span style=\"vertical-align: baseline;\">Cloud Pathways has the following features:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Single-controller orchestration: </strong><span style=\"vertical-align: baseline;\">In Cloud Pathways, </span><span style=\"vertical-align: baseline;\">a single controller manages graph evaluation, persistent Cloud Storage compilation caching, and asynchronous XLA HLO dispatch across TPU slices.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Colocated Python sidecars:</strong><span style=\"vertical-align: baseline;\"> Client-side </span><strong style=\"vertical-align: baseline;\">colocated Python sidecar containers</strong><span style=\"vertical-align: baseline;\"> (with shared-memory support) let you run compute-intensive Python logic such as distributed data loading and checkpointing directly on TPU hosts.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Resilient and elastic training:</strong><span style=\"vertical-align: baseline;\"> Cloud Pathways decouples job survival from individual slice interruptions with </span><strong style=\"vertical-align: baseline;\">elastic training</strong><span style=\"vertical-align: baseline;\"> (</span><code style=\"vertical-align: baseline;\">pathwaysutils</code><span style=\"vertical-align: baseline;\">) using host-memory snapshots to dynamically reshard training down to N-1 slices during hardware failures without crashing the client.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Interactive mode and Shared Pathways Service:</strong><span style=\"vertical-align: baseline;\"> Run, inspect, and debug JAX workloads interactively from a notebook or terminal using </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-interactive-mode\"><span style=\"text-decoration: underline; vertical-align: baseline;\">interactive mode</span></a><span style=\"vertical-align: baseline;\">, or share a long-running pool of Cloud TPU slices on demand across multiple users and jobs with the </span><a href=\"https://github.com/AI-Hypercomputer/pathways-utils/tree/main/pathwaysutils/experimental/shared_pathways_service\" rel=\"noopener\" target=\"_blank\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Shared Pathways Service.</span></a></p>\n</li>\n</ul></div>\n<div class=\"block-image_full_width\">\n\n\n\n\n\n\n  \n    <div class=\"article-module h-c-page\">\n      <div class=\"h-c-grid\">\n  \n\n    <figure class=\"article-image--large\n      \n      \n        h-c-grid__col\n        h-c-grid__col--6 h-c-grid__col--offset-3\n        \n        \n      \">\n\n      \n      \n        \n        <img alt=\"2-architecture\" src=\"https://storage.googleapis.com/gweb-cloudblog-publish/images/2-architecture_HOw9YCr.max-1000x1000.jpg\" />\n        \n        </a>\n      \n    </figure>\n\n  \n      </div>\n    </div>\n  \n\n\n\n\n</div>\n<div class=\"block-paragraph_advanced\"><h3><span style=\"vertical-align: baseline;\">Proven enterprise impact and customer momentum</span></h3>\n<p><span style=\"vertical-align: baseline;\">Frontier AI labs, quantitative research firms, and global consumer platforms have adopted Cloud Pathways to run mission-critical production workloads on GKE, including:</span></p>\n<ul>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Hyperscale multi-host inference:</strong><span style=\"vertical-align: baseline;\"> One of the world's largest consumer technology companies runs production batch and reinforcement learning (RL) inference on Cloud Pathways across tens of thousands of </span><strong style=\"vertical-align: baseline;\">TPU v5p</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Trillium (v6e)</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Ironwood (TPU7x)</strong><span style=\"vertical-align: baseline;\"> chips, consuming over </span><strong style=\"vertical-align: baseline;\">100 million chip-hours per quarter,</strong><span style=\"vertical-align: baseline;\"> and co-designed elasticity primitives with Google to expand into pre-training.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Elastic pre-training and multi-host RL for scientific foundation models:</strong><span style=\"vertical-align: baseline;\"> Google Cloud customer </span><strong style=\"vertical-align: baseline;\">ZenteiQ</strong><span style=\"vertical-align: baseline;\"> uses Cloud Pathways on GKE with Cluster Toolkit (</span><code style=\"vertical-align: baseline;\">gcluster</code><span style=\"vertical-align: baseline;\">), colocated Python sidecars, and host snapshotting to scale elastic pre-training (</span><code style=\"vertical-align: baseline;\">MaxText</code><span style=\"vertical-align: baseline;\">) and single-controller reinforcement learning (</span><code style=\"vertical-align: baseline;\">MaxText</code><span style=\"vertical-align: baseline;\"> + </span><code style=\"vertical-align: baseline;\">Tunix</code><span style=\"vertical-align: baseline;\">) across multi-slice Trillium (</span><code style=\"vertical-align: baseline;\">v6e</code><span style=\"vertical-align: baseline;\">) clusters for its scientific foundation models.</span></p>\n</li>\n</ul>\n<p style=\"padding-left: 40px;\"><span style=\"font-style: italic; vertical-align: baseline;\">\"Running multi-day pre-training and post-training jobs on high-cost accelerators requires reliable continuity through both unexpected hardware faults and planned maintenance windows. By running Cloud TPUs and MaxText with Cloud Pathways on the Google Cloud AI Hypercomputer stack, ZenteiQ relies on a proven controller that monitors our TPU topology and dynamically re-meshes and resizes the workload whenever a chip or slice goes offline. Combining Pathways with host snapshotting in production pushes recovery time down to a minimum when disruptions occur, keeping our available TPU capacity fully utilized with very little stall time. Our ML engineers no longer have to spend their hours watching job health or managing manual restarts, and can stay focused on their research workloads.\" </span><span style=\"vertical-align: baseline;\">- </span><strong style=\"vertical-align: baseline;\">Prof. Sashikumaar Ganesan, Founder, ZenteiQ</strong></p>\n<h3><span style=\"vertical-align: baseline;\">Getting started with Cloud Pathways</span></h3>\n<p><span style=\"vertical-align: baseline;\">Cloud Pathways is </span><strong style=\"vertical-align: baseline;\">generally available today</strong><span style=\"vertical-align: baseline;\"> in all Google Cloud regions supporting </span><strong style=\"vertical-align: baseline;\">Cloud TPU v5e</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">TPU v5p</strong><span style=\"vertical-align: baseline;\">, </span><strong style=\"vertical-align: baseline;\">Trillium (TPU v6e)</strong><span style=\"vertical-align: baseline;\">, and </span><strong style=\"vertical-align: baseline;\">Ironwood (TPU 7x)</strong><span style=\"vertical-align: baseline;\"> on GKE, with versioned container images (</span><code style=\"vertical-align: baseline;\">us-docker.pkg.dev/cloud-tpu-v2-images/cloud-pathways</code><span style=\"vertical-align: baseline;\">) supporting JAX </span><code style=\"vertical-align: baseline;\">0.10.1+</code><span style=\"vertical-align: baseline;\">. </span><span style=\"vertical-align: baseline;\">Cloud Pathways is also available in Preview on </span><a href=\"https://cloud.google.com/cluster-director/docs/tpu-machines\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Slurm TPU clusters in Cluster Director</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n<p><span style=\"vertical-align: baseline;\">To start building with Cloud Pathways:</span></p>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Read the overview:</strong><span style=\"vertical-align: baseline;\"> Explore the </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-intro\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Introduction to Pathways on Cloud</span></a><span style=\"vertical-align: baseline;\"> in the AI Hypercomputer documentation.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Deploy your cluster:</strong><span style=\"vertical-align: baseline;\"> </span></p>\n</li>\n<ol>\n<li style=\"vertical-align: baseline;\">\n<p><span style=\"vertical-align: baseline;\">GKE: Follow the step-by-step guide to </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/create-gke-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Create a GKE cluster with Pathways</span></a><span style=\"vertical-align: baseline;\"> using Cluster Toolkit (</span><code style=\"vertical-align: baseline;\">gcluster</code><span style=\"vertical-align: baseline;\">) or the </span><code style=\"vertical-align: baseline;\">gcloud</code><span style=\"vertical-align: baseline;\"> CLI.</span></p>\n</li>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Slurm: </strong><span style=\"vertical-align: baseline;\">Deploy Pathways via Cluster Director using the </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/create-cluster-director-cluster\"><span style=\"text-decoration: underline; vertical-align: baseline;\">step-by-step guide</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ol>\n<li style=\"vertical-align: baseline;\">\n<p><strong style=\"vertical-align: baseline;\">Run your workloads:</strong><span style=\"vertical-align: baseline;\"> Dive into our production guides for </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/batch-workload\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Batch workloads</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/pathways-interactive-mode\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Interactive notebook mode</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/resilient-training\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Resilient &amp; elastic training</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/multihost-inference\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Multihost inference</span></a><span style=\"vertical-align: baseline;\">, </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/porting-jax-workloads\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Porting JAX workloads</span></a><span style=\"vertical-align: baseline;\">, and </span><a href=\"https://docs.cloud.google.com/ai-hypercomputer/docs/workloads/pathways-on-cloud/troubleshooting-pathways\"><span style=\"text-decoration: underline; vertical-align: baseline;\">Troubleshooting</span></a><span style=\"vertical-align: baseline;\">.</span></p>\n</li>\n</ol></div>"
