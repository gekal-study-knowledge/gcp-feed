    "title": "GCP-2026-030"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-030"
    "published": "2026-05-11 09:00:00"
    "fetched": "2026-08-27 21:31:34"
    "summary": "<p><strong>Published: </strong>2026-05-11<br /> <strong>Updated: </strong>2026-06-24<br /> <strong>Reference:</strong> <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-43284\">CVE-2026-43284</a>, <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-43500\">CVE-2026-43500</a></p><p><strong>2026-06-24 Update: </strong>Added patch versions for GKE.</p><p><strong>2026-05-20 Update: </strong> Added CVE-2026-43500 and added CVE IDs to exploit paths.</p>\n<section>\n<h3 id=\"gcp-2026-030-gke\" tabindex=\"-1\">GKE</h3>\n<p><strong>Updated: </strong>2026-06-24</p>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>Container breakout vulnerabilities CVE-2026-43284 and CVE-2026-43500 have been found in the Linux kernel, known as DirtyFrag. They allow an unprivileged local attacker to escalate to root on the host.</p>\n<p>There are two exploit paths.</p>\n<p>rxrpc exploit path (CVE-2026-43500): Container-Optimized OS is not vulnerable because the vulnerable module is not compiled in. Ubuntu nodes are vulnerable.</p>\n<p>esp4 exploit path (CVE-2026-43284): Both Container-Optimized OS and Ubuntu are vulnerable, but the GKE default seccomp profile provides a mitigation that protects all Autopilot clusters and Standard clusters with <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/concepts/node-pools#autopilot-node-pools\">Autopilot-managed node pools</a>. The esp4 exploit path requires the user to have the ability to make the unshare syscall to obtain CAP_NET_ADMIN. Containers that use the <code dir=\"ltr\">RuntimeDefault</code> SeccompProfile can’t call unshare and are unaffected. Containers that grant CAP_NET_ADMIN explicitly are affected.</p>\n<p>Containers using GKE Sandbox are not impacted.</p>\n<h4 id=\"what-should-i-do_6\" tabindex=\"-1\">What should I do?</h4>\n<p><strong>2026-06-24 Update:</strong> The following versions of GKE are updated with code to fix this vulnerability on Container-Optimized OS. Upgrade your Container-Optimized OS node pools to the following versions or later:</p>\n<ul>\n<li>1.30.14-gke.2558000</li>\n<li>1.31.14-gke.1967000</li>\n<li>1.32.13-gke.1829000</li>\n<li>1.33.12-gke.1059000</li>\n<li>1.34.8-gke.1218000</li>\n<li>1.35.5-gke.1057000</li>\n<li>1.36.0-gke.2459000</li>\n</ul>\n<hr />\n<p>Upstream kernel patches have only recently been released. Those patches are being built into GKE releases and this bulletin will be updated when they are available. In the interim, partial mitigations are available below. We do not recommend relying on containers as a security boundary, container breakout vulnerabilities are very common. <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster#gke_sandbox\">Use GKE Sandbox instead</a>.</p>\n<p>If possible, migrate your workloads to run as non-root. If your container needs to be root, consider setting the <code dir=\"ltr\">pod.spec.securityContext.seccompProfile.type</code> to <code dir=\"ltr\">RuntimeDefault</code> for all workloads in your cluster. As an added security measure we also recommend setting the <code dir=\"ltr\">pod.spec.containers[*].securityContext.allowPrivilegeEscalation</code> to <code dir=\"ltr\">false</code>.</p>\n<div></div><pre dir=\"ltr\"><code dir=\"ltr\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: default-pod\nspec:\n  securityContext:\n    seccompProfile:\n      type: RuntimeDefault\n  containers:\n  - name: mycontainer\n    image: ubuntu\n    securityContext:\n      allowPrivilegeEscalation: false</code></pre>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-030-gdcvmware\" tabindex=\"-1\">GDC (VMware)</h3>\n<p><strong>Updated: </strong>2026-05-20</p>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>Container breakout vulnerabilities CVE-2026-43284 and CVE-2026-43500 have been found in the Linux kernel, known as DirtyFrag. They allow an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_7\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GDC software for VMware are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Pending</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-030-gkeaws\" tabindex=\"-1\">GKE on AWS</h3>\n<p><strong>Updated: </strong>2026-05-20</p>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>Container breakout vulnerabilities CVE-2026-43284 and CVE-2026-43500 have been found in the Linux kernel, known as DirtyFrag. They allow an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_8\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GKE on AWS are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Pending</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-030-gkeazure\" tabindex=\"-1\">GKE on Azure</h3>\n<p><strong>Updated: </strong>2026-05-20</p>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>Container breakout vulnerabilities CVE-2026-43284 and CVE-2026-43500 have been found in the Linux kernel, known as DirtyFrag. They allow an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_9\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GKE on Azure are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Pending</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-030-gdcbm\" tabindex=\"-1\">GDC (bare metal)</h3>\n<p><strong>Updated: </strong>2026-05-20</p>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>Container breakout vulnerabilities CVE-22026-43284 and CVE-2026-43500 have been found in the Linux kernel, known as DirtyFrag. They allow an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_10\" tabindex=\"-1\">What should I do?</h4>\n<p>There is no action required. GDC software for bare metal isn't affected as it does not bundle an operating system in its distribution.</p>\n</td>\n<td>None</td>\n</tr>\n</tbody>\n</table>\n</section>"
