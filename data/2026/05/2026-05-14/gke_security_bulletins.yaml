    "summary": "<p><strong>Published: </strong>2026-05-14<br /> <strong>Reference:</strong> <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-46300\">CVE-2026-46300</a></p>\n<section>\n<h3 id=\"gcp-2026-033-gke\" tabindex=\"-1\">GKE</h3>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A container breakout vulnerability CVE-2026-46300 has been found in the Linux kernel, known as Fragnesia. It allows an unprivileged local attacker to escalate to root on the host.</p>\n<p>GKE Standard clusters with Ubuntu nodes are impacted. GKE Standard clusters with Container-Optimized OS nodes are not impacted. GKE Autopilot is not impacted.</p>\n<p>Clusters using GKE Sandbox aren't impacted.</p>\n<h4 id=\"what-should-i-do_1\" tabindex=\"-1\">What should I do?</h4>\n<p>Upstream kernel patches have only recently been released. Those patches are being built into GKE releases and this bulletin will be updated when they are available. In the interim, partial mitigations are available below. Containers do not provide a robust security boundary, as container breakout vulnerabilities pose a significant risk. For secure workload isolation, we recommend using <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/how-to/hardening-your-cluster#gke_sandbox\">GKE Sandbox</a>.</p>\n<p>If possible, migrate your workloads to run as non-root. If your container needs to be root, consider setting the <code dir=\"ltr\">pod.spec.securityContext.seccompProfile.type</code> to <code dir=\"ltr\">RuntimeDefault</code> for all workloads in your cluster. As an added security measure, we also recommend setting the <code dir=\"ltr\">pod.spec.containers[*].securityContext.allowPrivilegeEscalation</code> to <code dir=\"ltr\">false</code>.</p>\n<div></div><pre dir=\"ltr\"><code dir=\"ltr\">apiVersion: v1\nkind: Pod\nmetadata:\n  name: default-pod\nspec:\n  securityContext:\n    seccompProfile:\n      type: RuntimeDefault\n  containers:\n  - name: mycontainer\n    image: ubuntu\n    securityContext:\n      allowPrivilegeEscalation: false</code></pre>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-033-gdcvmware\" tabindex=\"-1\">GDC (VMware)</h3>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A container breakout vulnerability CVE-2026-46300 has been found in the Linux kernel, known as Fragnesia. It allows an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_2\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GDC software for VMware are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-033-gkeaws\" tabindex=\"-1\">GKE on AWS</h3>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A container breakout vulnerability CVE-2026-46300 has been found in the Linux kernel, known as Fragnesia. It allows an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_3\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GKE on AWS are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-033-gkeazure\" tabindex=\"-1\">GKE on Azure</h3>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A container breakout vulnerability CVE-2026-46300 has been found in the Linux kernel, known as Fragnesia. It allows an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_4\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GKE on Azure are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>\n</section>\n<section>\n<h3 id=\"gcp-2026-033-gdcbm\" tabindex=\"-1\">GDC (bare metal)</h3>\n<table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>A container breakout vulnerability CVE-2026-46300 has been found in the Linux kernel, known as Fragnesia. It allows an unprivileged local attacker to escalate to root on the host.</p>\n<h4 id=\"what-should-i-do_5\" tabindex=\"-1\">What should I do?</h4>\n<p><aside class=\"note\"><strong>Note: </strong>Patch versions and a severity assessment for GDC software for bare metal are in progress. We'll update this bulletin with that information when it's available.</aside></p>\n</td>\n<td>Medium</td>\n</tr>\n</tbody>\n</table>\n</section>"
