"overview": |
  この日はリリースノートのみで、Agent Platform Workbench の修正がまとまって入りました。Gemini CLI の自動リロード拡張機能が原因で JupyterLab の UI がファイル変更を無言で巻き戻したりカーネルを中断したりする問題が修正され、last-active および auto-reload 拡張機能は Gemini CLI が構成されている場合のみ有効になるよう変更されています。あわせて jupyterlab-git を 0.53.0 に固定して Git 拡張機能の Pull / Push ボタンが無効化される問題を解消し、パッケージキャッシュの権限が原因で実行時に micromamba 環境を作成できない問題も修正されました。Workbench の内部エージェントがホスト OS にインストールされたカスタム / エンタープライズ CA 証明書を信頼するようになり、インスタンスプロキシ経由の接続で TLS 検証が失敗する問題も解消されています。
