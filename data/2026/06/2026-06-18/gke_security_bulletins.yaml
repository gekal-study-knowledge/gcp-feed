    "title": "GCP-2026-037"
    "link": "https://docs.cloud.google.com/kubernetes-engine/security-bulletins#gcp-2026-037"
    "published": "2026-06-18 09:00:00"
    "fetched": "2026-08-27 21:31:34"
    "summary": "<p><strong>Published: </strong>2026-06-18</p><p><strong>Updated: </strong>2026-06-20</p><p><strong>Reference: </strong> <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-50195\">CVE-2026-50195</a>, <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-53488\">CVE-2026-53488</a>, <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-53492\">CVE-2026-53492</a>, <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-53489\">CVE-2026-53489</a>, <a href=\"https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2026-47262\">CVE-2026-47262</a></p><p><strong>2026-06-20 Update: </strong>Added GKE patch versions containing the fixes for Container-Optimized OS node images for minor versions 1.35 and 1.36. Patches for Ubuntu node images are still pending and in progress.</p><p><strong>2026-06-19 Update: </strong>Added GKE patch versions containing the fixes for Container-Optimized OS node images for minor versions from 1.30 to 1.34. Patches for Ubuntu node images and for minor version 1.35 and 1.36 for Container-Optimized OS node images are in progress.</p><table>\n<thead>\n<tr>\n<th>Description</th>\n<th>Severity</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\n<p>The following vulnerabilities have been discovered in containerd (the GKE container runtime). These vulnerabilities allow attackers with permissions to create Pods to bypass Kubernetes security boundaries and perform host compromise, cache poisoning, and denial of service. While these vulnerabilities are critical in the context of containerd, the requirement to have cluster privileges to create Pods to exploit them means they are considered High <a href=\"https://docs.cloud.google.com/kubernetes-engine/docs/resources/security-patching#how_vulnerabilities_are_classified\">according to GKE vulnerability classification</a>.</p>\n<ul>\n<li><strong>CVE-2026-50195 (Critical)</strong>: containerd's CRI checkpoint import process fails to validate image references. An attacker with permissions to create Pods can use a crafted checkpoint image to poison the node's local image cache, causing other pods using an <code dir=\"ltr\">IfNotPresent</code> pull policy to execute malicious code.</li>\n<li><strong>CVE-2026-53488 (Critical)</strong>: CRI plugin propagates labels from an image config to a container without validation. This may result in executing an arbitrary command on the host.</li>\n<li><strong>CVE-2026-53492 (Critical)</strong>: CRI implementation improperly trusts Container Device Interface (CDI) annotations during container restoration. This allows an attacker to inject arbitrary CDI configurations (such as host mounts and device nodes) into restored containers, bypassing resource allocation and device plugin enforcement.</li>\n<li><strong>CVE-2026-53489 (High)</strong>: CRI plugin restores container.log without validating a symlinked path, allowing an attacker to read arbitrary host files via <code dir=\"ltr\">kubectl logs</code>.</li>\n<li><strong>CVE-2026-47262 (Moderate)</strong>: A vulnerability in containerd allows a maliciously crafted image to cause memory exhaustion (DoS) of the containerd process.</li>\n</ul>\n<p>These vulnerabilities affect all GKE configurations using Container-Optimized OS and Ubuntu node images, including GKE Standard and GKE Autopilot clusters.</p>\n<p><aside class=\"note\"><b>Note</b>:  Because containerd resolves labels and CDI mounts on the host before invoking the gVisor sandbox runtime, GKE Sandbox (gVisor) does not protect against host compromise from these vectors.</aside></p>\n<h4 id=\"what-should-i-do\" tabindex=\"-1\">What should I do?</h4>\n<p><strong>2026-06-20 Update:</strong> The following GKE patch versions contain the fixes for Container-Optimized OS node images for minor versions from 1.30 to 1.36. Upgrade your Container-Optimized OS node pools to the following versions or later:</p>\n<ul>\n<li>1.36.0-gke.3545000 or later</li>\n<li>1.35.6-gke.1039000 or later</li>\n<li>1.34.9-gke.1021000 or later</li>\n<li>1.33.12-gke.1267000 or later</li>\n<li>1.32.13-gke.1823000 or later</li>\n<li>1.31.14-gke.2150000 or later</li>\n<li>1.30.14-gke.2726000 or later</li>\n</ul>\n<p>Patches for Ubuntu node images are in progress.</p>\n<hr />\n<p>Until patch versions are available, use the following mitigation guidelines:</p>\n<ul>\n<li>Restrict Pod creation permissions (<code dir=\"ltr\">create pods</code> in Kubernetes RBAC) only to trusted users, as critical vectors require pod creation or restoration capabilities.</li>\n<li>Avoid using <code dir=\"ltr\">IfNotPresent</code> or <code dir=\"ltr\">Never</code> image pull policies for untrusted or critical workloads; use <code dir=\"ltr\">Always</code> to force verification against a trusted registry.</li>\n<li>Restrict or monitor use of checkpointing/restoration features in your clusters.</li>\n</ul>\n</td>\n<td>High</td>\n</tr>\n</tbody>\n</table>"
